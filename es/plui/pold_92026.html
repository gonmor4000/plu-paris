construction et de l’habitation\nLorsque les bâtiments neufs à usage principal d'habitation groupant au moins deux logements sont équipés d'un parc de\nstationnement, ce parc est alimenté par un circuit électrique spécialisé pour permettre la recharge des véhicules électriques ou\nhybrides rechargeables.\nL'équipement réalisé est relié à un tableau général basse tension en aval du dispositif de mise hors tension général de l'installation\nélectrique du bâtiment ou de celui du point de livraison spécifique de l'infrastructure de recharge des véhicules électriques ou\nhybrides rechargeables.\nLorsque la capacité de ce parc de stationnement est inférieure ou égale à 40 places, 50 % des places de stationnement destinées\naux véhicules automobiles et deux roues motorisés doivent être conçues de manière à pouvoir accueillir ultérieurement un point\nde recharge pour véhicule électrique ou hybride rechargeable, disposant d'un système de mesure permettant une facturation\nindividuelle des consommations. Dans ce but, des fourreaux, des chemins de câble ou des conduits sont installés à partir du\ntableau général basse tension de façon à pouvoir desservir au moins 50 % des places destinées aux véhicules automobiles et\ndeux roues motorisés, avec un minimum d'une place.\nLorsque la capacité de ce parc de stationnement est supérieure à 40 places, 75 % des places de stationnement destinées aux\nvéhicules automobiles et deux roues motorisés doivent être conçues de manière à pouvoir accueillir ultérieurement un point de\nrecharge pour véhicule électrique ou hybride rechargeable, disposant d'un système de mesure permettant une facturation\nindividuelle des consommations. Dans ce but, des fourreaux, des chemins de câble ou des conduits sont installés à partir du\ntableau général basse tension de façon à pouvoir desservir au moins 75 % des places destinées aux véhicules automobiles et\ndeux roues motorisés.\n6.4. Nombre de places à réaliser pour les vélos\nSauf mention contraire, ces normes sont des minimums à réaliser.\n Habitations\n Logement    0,75 m² par logement pour les logements\n  et    jusqu’à 2 pièces et 1,5 m² par logement dans les\n hébergement    autres cas\n    Avec une superficie minimale de 3m²\n Commerces et activités de service\n Commerces inférieurs à 500 m²    Non réglementé\n Commerces supérieurs à 500 m²    1 place pour 10 employés +\n    Un minimum de 5 places pour les clients\n Ensemble commercial au sens de l’article L 752-    Lorsque la capacité du parc de stationnement est\n 3 du code de commerce ou établissement de    inférieure ou égale à 40 places, l’espace dédié au\n spectacle cinématographique    stationnement des vélos est dimensionné pour\n    accueillir un nombre de places de vélos\n    correspondant à 10% de la capacité du parc de\n    stationnement avec un minimum de 2 places.\n    Lorsque la capacité du parc de stationnement est\n    supérieure à 40 places mais inférieure ou égale\n    à 400 places, l’espace dédié au stationnement\n    des vélos est dimensionné pour accueillir un\n    nombre de places de vélos corresondant à 5% de\n    37","    Dispositions communes\n    la capacité du parc de stationnement avec un\n    minimum de 10 places.\n    Lorsque la capacité du parc de stationnement est\n    supérieure à 400 places, l’espace dédié au\n    stationnement des vélos est dimensionné pour\n    accueillir un nombre de places de vélos\n    correspondant à 2% de la capacité du parc de\n    stationnement avec un minimum de 20 places et\n    avec une limitation de l’objectif réglementaire\n    fixée à 50 places.\n Autres activités des secteurs secondaire ou tertiaire\n Bureaux    1,5 m² pour 100 m² de SDP\n Autres activités    L’espace dédié au stationnement des vélos devra\n    être dimensionné pour accueilloir un nombre de\n    place de vélos calculé par rapport à 15% de\n    l’effectif total de salariés accueillis simultanément\n    dans les bâtiments, sur déclaration du maître\n    d’ouvrage.\n Equipements d’intérêt collectif et services publics\n L’espace dédié au stationnement des vélos devra être dimensionné pour accueillir un nombre de\n place de vélos correspondant à 15% de l’effectif d’agents ou usagers du service public accueillis\n simultanément dans le bâtiment, sur déclaration du maître d’ouvrage.\n    Dispositions particulières\nL’emplacement destiné au stationnement des cycles doit être un espace réservé et sécurisé, aménagé\nde plain-pied, aisément accessible depuis l’espace public et les points d’entrée du bâtiment, clos et\ncouvert pour les bâtiments à usage principal d’habitation, bureaux et industriel ou tertiaire, et à minima\ncouvert pour les bâtiments à usage d’équipement public et d’ensemble commercial, disposant d’un\néclairage suffisant, équipé d’un système d’attache, d’une surface minimum de 1,5 m² par place requise.\nIl peut également être aménagé :\n    -    au premier sous-sol,\n    -   .au rez-de chaussée surélevé pour les bâtiments situés dans le périmètre du PPRI (plan de\n    prévention des risques d’inondation,\n    - Au niveau dalle ou au niveau du sol pour les bâtiments accessibles depuis la voirie couverte\n    interne à La Défense,\n    à condition d’être facilement accessible dans de bonnes conditions de sécurité.\nLa surface totale de l’emplacement destiné au stationnement des cycles ne peut être inférieure à 3 m².\nEn cas de réalisation de système de rangement de vélos superposés sur deux niveaux, la surface\nexigée ci-dessus est divisée par 2.\nCes dispositions ne s’appliquent pas aux constructions et installations nécessaires au réseau de\ntransport public du Grand Paris.\nEQUIPEMENT ET RESEAUX\n    Article 7 – Desserte par les voies publiques ou privées\nTout terrain doit être accessible d'une voie carrossable, publique ou privée.\nLa largeur des voies d'accès ne peut en aucun cas être inférieure à 3,50 m.\nLorsque les voies se termineront en impasse, celles-ci devront être aménagées de telle sorte que les\nvéhicules puissent faire demi-tour.\nLe projet peut également être refusé ou n’être accepté que sous réserve de prescriptions spéciales si\nles accès présentent un risque pour la sécurité des usagers des voies publiques ou pour celle des\npersonnes utilisant ces accès. Cette sécurité doit être appréciée compte tenu, notamment, de la position\ndes accès, de leur configuration ainsi que de la nature et de l’intensité du trafic.\n    38","    Dispositions communes\nLes constructions comportant plus de 10 logements ou des activités occupant plus de 500 m² S.D.P.\ndevront être desservies par au moins une voie ayant une largeur minimum de 6 m.\n    Article 8 - Desserte par les réseaux\n8.1 – Eau potable\nToute construction nouvelle qui requiert une alimentation en eau doit se brancher sur le réseau public\nexistant.\n8.2 – Assainissement - Eaux usées\nLe branchement sur le réseau existant est obligatoire.\nLes eaux industrielles sont soumises au régime des instructions et circulaires relatives aux installations\nclassées pour la protection de l'environnement.\n8.3– Assainissement - Eaux pluviales\nLa recherche de solutions permettant l’absence de rejet d’eaux pluviales dans le réseau collecteur sera\nla règle générale pour les constructions neuves.\nDans le cas où l’infiltration, du fait de la nature du sol ou de la configuration de l’aménagement,\nnécessiterait des travaux disproportionnés, toute construction raccordée au réseau public\nd’assainissement devra faire l’objet d’une rétention à la parcelle des eaux de ruissellement, de façon à\nne pas dépasser un débit de fuite de plus 2 litres/seconde/hectare eaux de ruissellement des façades\ncomprises. De manière à limiter ces apports, tant au point de vue qualitatif que quantitatif, des\ntechniques alternatives aux réseaux devront être privilégiées (chaussées réservoirs, fossés drainants,\nbassins, réutilisation des eaux pour l’arrosage, toitures végétalisées inclinées ou en terrasses avec\nsystème de rétention d’eau...).\nÀ l'intérieur d'une même propriété, les eaux pluviales et les eaux usées doivent être recueillies\nséparément.\nLa récupération et l’utilisation des eaux pluviales, ainsi que les eaux de toutes autres origines, doivent\nrespecter les exigences de la législation et de la réglementation en la matière, notamment :\n    - L’arrêté du 21 août 2008, relatif à la récupération des eaux de pluie et à leur usage à l’intérieur\n    et à l’extérieur des bâtiments, celui du 17 décembre 2008 relatif au contrôle des installations\n    privatives de distribution d’eau potable, des ouvrages de prélèvements, puits et forages et des\n    ouvrages de récupération des eaux de pluie, et la circulaire du 9 novembre 2009 relative à la\n    mise en œuvre du contrôle des ouvrages de prélèvements, puits et forages, des ouvrages de\n    récupération des eaux de pluie ainsi que des installations privatives de distribution d’eau potable\n    en application de l’arrêté du 17 décembre 2008.\n8.4 – Réseaux divers\nLes réseaux divers de distribution (gaz, électricité, téléphone, éclairage public, réseaux câblés et autres\n...) doivent obligatoirement être réalisés en souterrain ou galerie technique.\n8.5 – Collecte des déchets\nToute construction doit prévoir un local de stockage des conteneurs réservés à la collecte sélective des\ndéchets sauf si un dispositif d’apport volontaire existe sur l’espace public et permet de desservir la\nconstruction.\n    Habitat collectif :\n- Déchets urbains (ordures ménagères) : il s’agira de locaux dimensionnés de façon à recevoir des\nconteneurs, à raison de 0,50 m² par tranche de 50 m² S.D.P. avec une surface minimum de 5 m² et une\nsurface maximum de 50 m².\n- Encombrants :\n- au-dessus de 25 logements, un local de 15 m² minimum doit être créé. Ce local sera augmenté de 1\nm² par tranche de 5 logements supplémentaires.\n- Pour les résidences à gestion centralisée (personnes âgées, étudiants, foyers de travailleurs,…) un\nlocal de 15 m2 minimum doit être créé.\n    39","    Dispositions communes\n    Autres constructions :\nLes constructions nouvelles doivent comporter des locaux de stockage des déchets suffisamment\ngrands, dimensionnés de façon à recevoir des conteneurs et permettre de manipuler sans difficulté tous\nles récipients nécessaires à la collecte sélective des déchets.\nCette disposition s’applique également en cas d’extension ou de surélévation de bâtiments existants,\nsauf si leurs caractéristiques l’interdisent.\nL’ensemble des dispositions de l’article 8.5 ne s’appliquent pas aux constructions et installations\nnécessaires au réseau de transport public du Grand Paris ne générant pas de déchets.\n    40","UA\n    3\n    Dispositions\n    applicables\n    aux zones\n    urbaines\n    41","UA\n    Zone UA\n    DESTINATION DES CONSTRUCTIONS, USAGES DES SOLS ET NATURES\n    D’ACTIVITE\n    Article 1 - Interdiction et limitation de certains usages et affectation\n    des sols, constructions et activités\n    1.1. Usages et affectations des sols, types d’activités, destinations et sous-destinations interdits\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Sont interdits :\n    ▪   L'implantation des installations classées soumises à autorisation, sauf celles prévues à\n    l’article 1.2\n    ▪   Les dépôts à l'air libre de ferrailles, de matériaux, de combustibles solides, ainsi que les\n    activités de démantèlement d’épaves et la transformation de matériaux de récupération.\n    ▪   Les affouillements et exhaussements des sols nécessitant une autorisation d’urbanisme et\n    qui ne sont pas nécessaires à des travaux de construction.\n    1.2. Types d’activités, destinations et sous-destinations autorisés sous conditions\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Sont admis sous conditions :\n    Les installations classées nouvelles correspondant à des besoins nécessaires à la vie du quartier sous\n    réserve que toutes les dispositions soient prises pour qu’elles n’engendrent pas de gêne pour le\n    voisinage ou que les nuisances et dangers soient prévenus à l’égard de l’environnement.\n    Les installations classées temporaires nécessaires à la réalisation des constructions et installations du\n    réseau de transport public du Grand Paris.\n    L'extension ou la modification des installations classées existantes à la condition expresse que ces\n    travaux entraînent une atténuation des nuisances ou dangers et que ces installations nouvelles par leur\n    volume et leur aspect extérieur, soient compatibles avec le milieu environnant.\n    Les bureaux d’une surface inférieure à 300 m2 S.D.P.\n    Toutefois, s’agissant des constructions existantes à la date d’approbation du PLU (ayant une existence\n    physique et légale), une augmentation des surfaces de bureaux est autorisée, dans la limite de 15 %\n    de la S.D.P existante, afin de permettre dans la limite de 3.000 m2 S.D.P :\n    a) Leur restructuration dans le cadre de l’aménagement de volumes existants et notamment les\n    changements de destination ;\n    b) Leur extension.\n    Dans les parties de la zone, soumises au risque technologique de transports de matières dangereuses\n    lié à la présence des canalisations de gaz à haute pression, dont le tracé figure dans le plan des\n    servitudes d’utilité publique annexé au P.L.U., toute occupation ou utilisation du sol doit respecter les\n    règles visant à garantir la sécurité publique.\n    Article 2 - Mixité fonctionnelle et sociale\n    Voir dispositions communes à toutes les zones\n    42","UA\n    CARACTERISTIQUES    URBAINES,    ARCHITECTURALES,\n    ENVIRONNEMENTALES ET PAYSAGERES\n    Article 3 - Volumétrie et implantation des constructions\n    3.1.    Implantation des constructions par rapport aux voies et emprises publiques\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Règles générales d’implantation\n    Lorsque l’implantation des constructions est indiquée au document graphique, elles doivent s’implanter\n    sur l’indication graphique.\n    Lorsqu’une marge de recul est inscrite, les constructions doivent s’implanter en limite ou en retrait des\n    marges de recul. Les constructions sont autorisées en sous-sol des marges de recul.\n    En l’absence d’indication graphique, les constructions doivent être édifiées à l’alignement des voies\n    publiques ou/ et en limite des voies privées et emprises publiques existantes, modifiées ou à créer.\n    Dispositions alternatives\n    Néanmoins une implantation différente est autorisée :\n    ▪   Avec 3 mètres de retrait si une continuité structurante à l'alignement, en limite de voie privée\n    ou/ et d’emprise publique est assurée (mur bahut surmonté d'une grille, …),\n    ▪   Pour se raccorder à une construction existante voisine en recul,\n    ▪   Pour préserver des arbres remarquables,\n    ▪   Afin de permettre une variété architecturale, des retraits ponctuels d’une profondeur ne\n    pouvant pas dépasser 1 mètre, sur un maximum de 25 % de la surface de la façade (hors\n    étage en attique), sont autorisés.\n    ▪   En outre, lorsqu’il est en attique, le dernier étage devra respecter un retrait minimum de 1,50\n    mètre par rapport à la façade des étages inférieurs.\n    En l'absence d'indications particulières figurant au plan de zonage, les propriétés situées à l'angle de 2\n    voies publiques supporteront un retrait constitué par un segment de droite de 5 mètres de longueur\n    minimum formant des angles égaux avec chacun des alignements des voies adjacentes.\n    Hors marge de recul et élargissement de voirie, les surélévations et les extensions des constructions\n    existantes à la date d’approbation du PLU ne respectant pas les dispositions précédentes de l’article 3\n    sont autorisées dans les limites indiquées ci-dessous :\n    43","UA\n    ▪    la partie de la surélévation non conforme aux dispositions de l’article 3 est autorisée, dans la\n    limite d’une surface égale au maximum à 15 % de la S.D.P. du bâtiment existant à la date\n    d’approbation du P.L.U. et dans le prolongement vertical des murs existants.\n    ▪    la partie de l’extension non conforme aux dispositions de l’article 3 est autorisée, dans la\n    limite d’une surface égale au maximum à 15 % de la S.D.P. du bâtiment existant à la date\n    d’approbation du P.L.U. et dans le prolongement des murs existants.\n    Le total des parties des surélévations et des extensions non conformes aux dispositions de l’article 3\n    ne pourra dépasser 15 % de la S.D.P. du bâtiment existant à la date d’approbation du P.L.U.\n    Villa des Vieilles Vignes\n    Lorsque l’implantation des constructions est indiquée au document graphique, elles doivent s’implanter\n    sur l’indication graphique.\n    En l’absence d’indication graphique les constructions doivent s’implanter à l’alignement et en limites\n    séparatives.\n    3.2.    Implantation des constructions par rapport aux limites séparatives\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Règles générales d’implantation\n    Lorsque l’implantation des constructions est indiquée au document graphique, elles doivent s’implanter\n    sur l’indication graphique.\n    En l’absence d’indication graphique :\n    3.2.1 - Dans une bande de 15 mètres comptée à partir de l’alignement ou de la limite de la voie privée\n    ou de la marge de recul figurant aux documents graphiques :\n    ▪    Les constructions doivent être édifiées en ordre continu d’une limite séparative latérale à\n    l’autre.\n    ▪    Les constructions s’écarteront des limites de fond de parcelle conformément aux règles\n    définies à l’article UA 3.2.2.3.\n    3.2.2 - Dans la bande comprise entre 15 et 30 mètres comptée à partir de l’alignement des voies\n    publiques ou/ et de la limite des voies privées ou de la marge de recul figurant aux documents\n    graphiques :\n    3.2.2.1 - Les constructions devront être implantées en recul des limites séparatives.\n    Elles devront s’écarter de ces limites conformément aux règles définies au paragraphe UA\n    3.2.2.3.\n    3.2.2.2 - Toutefois, les constructions en limite séparative sont autorisées :\n    ▪   soit si elles s’adossent à une construction en bon état et de dimensions égales ou\n    supérieures existant sur le terrain voisin et si elles s’insèrent dans les héberges des\n    bâtiments existants,\n    ▪   soit si elles ne sont pas affectées à l’habitation ou à l’activité et que leur hauteur totale\n    ne dépasse pas 3,50 mètres en limite séparative.\n    Dans ce cas, un retrait du dernier étage par rapport à cette limite est autorisé à condition que\n    la distance au point le plus proche de la limite séparative soit au moins égale à 3 mètres si la\n    façade ne comporte pas de baies principales et à 6 mètres si la façade comporte des baies\n    principales.\n    3.2.2.3 - Si les constructions ne sont pas implantées en limite séparative :\n    44","UA\n    ▪   D’une part, la distance horizontale à la limite séparative, mesurée à tout point de\n    l’élément de façade de la construction comportant des baies principales devra être\n    au moins égale à la hauteur de cet élément de façade mesurée à partir du sol naturel\n    du fond voisin en limite séparative au droit de cet élément avec un minimum de 6\n    mètres (L=H avec H≥ 6 mètres).\n    ▪   D’autre part, la distance comptée horizontalement à tout point de l’élément de façade\n    de la construction ne comportant pas de baies principales ou comportant des baies\n    secondaires aux limites séparatives devra être au moins égale à la moitié de la\n    hauteur de cet élément de façade mesurée à partir du sol naturel du fond voisin en\n    limite séparative, sans pouvoir être inférieure à 3 mètres (L=H/2 avec H≥ 3 mètres).\n    Les saillies fermées dont les façades latérales ne respectent pas le paragraphe précédent sont\n    autorisées à condition :\n    ▪   que leur profondeur n'excède pas 1 m,\n    ▪   que leur distance à la limite séparative soit au moins égale à 3 m.\n    3.2.3 - Au-delà de la bande de 30 mètres mesurée à partir de l’alignement des voies publiques ou/ et\n    de la limite des voies privées ou de la marge de recul figurant aux documents graphiques :\n    Les constructions devront être implantées en recul des limites séparatives. Elles devront s’écarter de\n    ces limites conformément aux règles définies au paragraphe UA 3.2.2.3.\n    45","UA\n    3.2.4 - Sont exclus de ces règles 3.2.1 à 3.2.3 les éléments d’architecture suivants :\n    ▪   les escaliers extérieurs accédant au rez-de-chaussée et les sas d’entrée,\n    ▪   les balcons, gardes corps et lignes de vie,\n    ▪   les corniches.\n    Dispositions alternatives :\n    Les surélévations et les extensions des constructions existantes à la date d’approbation du P.L.U. ne\n    respectant pas les règles générales d’implantation de l’article 3.2 sont autorisées dans les limites\n    indiquées ci-dessous :\n    ▪   la partie de la surélévation non conforme aux dispositions de l’article 3.2 est autorisée, dans\n    la limite d’une surface égale au maximum à 15 % de la S.D.P du bâtiment existant à la date\n    d’approbation du P.L.U et dans le prolongement vertical des murs existants.\n    la partie de l’extension non conforme aux dispositions de l’article 3.2 est autorisée, dans la\n    limite d’une surface égale au maximum à 15 % de la S.D.P. du bâtiment existant à la date\n    d’approbation du P.L.U.et dans le prolongement des murs existants.\n    Le total des parties des surélévations et des extensions non conformes aux règles générales\n    d’implantation de l’article 3.2 ne pourra dépasser 15 % de la S.D.P. du bâtiment existant à la date\n    d’approbation du P.L.U.\n    ▪   Les constructions doivent être édifiées en ordre continu d’une limite latérale à l’autre.\n    ▪   Les constructions s’écarteront des limites de fond de parcelle conformément aux règles\n    définies à l’article UA 3.2.2.3.\n    Au-delà de la bande de 15 mètres mesurée à partir de l’alignement des voies publiques ou/ et de la\n    limite des voies privées ou de la marge de recul figurant aux documents graphiques :\n    46","UA\n    ▪   Les constructions devront être implantées en recul des limites séparatives. Elles devront\n    s’écarter de ces limites conformément aux règles définies au paragraphe UA 3.2.2.3.\n    3.3.   Implantation des constructions par rapport aux autres constructions sur une même\n    propriété\n    Règles générales d’implantation\n    Est autorisée, sur une même propriété, la construction de plusieurs bâtiments, à condition que :\n    En tout point de chaque élément de façade, la distance mesurée à celle-ci et la séparant d'un élément\n    de façade d'un autre bâtiment, soit au moins égale à :\n    ▪   la hauteur de l'élément de façade la plus haute, avec un minimum de 6 mètres, si l'élément\n    de façade la plus basse comporte des baies principales.\n    ▪   la hauteur de l'élément de la façade la plus basse, avec un minimum de 6 mètres, si cette\n    dernière ne comporte pas de baies principales et que l'élément de la façade la plus haute en\n    comporte,\n    ▪   la moitié de la hauteur de l'élément de façade la plus haute, avec un minimum de 3 mètres,\n    si les deux éléments de façades ne comportent pas de baies principales.\n    Dispositions alternatives\n    Les surélévations et les extensions des constructions existantes à la date d’approbation du P.L.U. ne\n    respectant pas les règles générales d’implantation de l’article 3.3 sont autorisées dans les limites\n    indiquées ci-dessous :\n    ▪   la partie de la surélévation non conforme aux règles générales d’implantation de l’article 3.3\n    est autorisée, dans la limite d’une surface égale au maximum à 15 % de la S.D.P. du bâtiment\n    existant à la date d’approbation du P.L.U. et dans le prolongement vertical des murs existants.\n    ▪   la partie de l’extension non conforme aux règles générales d’implantation de l’article 3.3 est\n    autorisée, dans la limite d’une surface égale au maximum à 15 % de la S.D.P. du bâtiment\n    existant à la date d’approbation du P.L.U. et dans le prolongement des murs existants.\n    Le total des parties des surélévations et des extensions non conformes aux règles générales\n    d’implantation de l’article 3.3 ne pourra dépasser 15 % de la S.D.P. du bâtiment existant à la date\n    d’approbation du PLU.\n    3.4.    Emprise au sol\n    Pour la détermination de l’emprise au sol autorisée, il devra être déduit de la superficie de l’unité\n    foncière les surfaces consacrées à des opérations de voirie publique (emplacement réservé pour\n    opération de voirie) ou privée\n    Règle générale\n    L'emprise au sol des bâtiments ne pourra excéder 40 % de la superficie du terrain.\n    Un complément d’emprise au sol de 30 % de la superficie du terrain est autorisé au rez-de-chaussée\n    des bâtiments lorsque celui-ci comporte des locaux destinés aux commerces, à l’artisanat et à l’activité.\n    Dans ce cas, la projection au sol des niveaux situés au-dessus du rez-de-chaussée ne doit pas excéder\n    40 % de la superficie du terrain.\n    Dispositions alternatives\n    Pour les rénovations, extensions, reconstructions de bâtiments existants à la date d’approbation du\n    P.L.U. sur des terrains d'une surface inférieure à 300 m², l'emprise au sol peut être conservée ou\n    augmentée jusqu'à 120 m² sans pouvoir excéder 80 % de la superficie du terrain.\n    Il n’est pas fixé d’emprise au sol pour les équipements d’intérêt collectif et services publics, ainsi que\n    pour les extensions rendues nécessaires pour améliorer le confort lié à l'accessibilité et à l'hygiène des\n    immeubles d’habitation.\n    47","UA\n    3.5.    Hauteur des constructions\n    Règles générales\n    Dans le cas d'une inscription indiquée au document graphique, les constructions doivent s'y conformer.\n    En l’absence d’indications graphiques, la hauteur maximale des constructions ne pourra excéder 15\n    mètres.\n    Dispositions alternatives\n    Cette limite pourra, y compris pour les rénovations, extension ou reconstruction de bâtiments existants,\n    être dépassée :\n    - de 3 mètres au maximum pour les édicules techniques, à conditions qu’ils soient intégrés dans\n    un volume fermé et qu’ils soient implantés en retrait des façades d’une distance au moins égale\n    à leur hauteur.\n    - de 1,50 m au maximum pour les dispositifs nécessaires à l’utilisation des énergies\n    renouvelables tels que les capteurs d’énergie solaire, à condition que ceux-ci soient implantés\n    au moins à 3 mètres en arrière de la verticale de la façade sur rue.\n    Lorsque la construction supporte des toitures à une ou plusieurs pentes, sa hauteur est mesurée depuis\n    le sol naturel jusqu'au faîtage, ou jusqu'au sommet de l'acrotère, lorsque la construction comporte une\n    toiture terrasse sauf si l’acrotère est prolongé pour faire office de garde-corps, auquel cas, la sur-hauteur\n    induite par celui-ci n’est pas comptée.\n    En cas de terrain en pente, la hauteur est mesurée de la manière suivante (ce mode de calcul est\n    applicable dans les cas où la pente est supérieure à 2%) :\n    - Si le linéraire de façade est inférieur à 20 mètres, la hauteur est mesurée au milieu de la façade.\n    Si le linéraire de façade est supérieur à 20 mètres, il est divisé en sections dont aucune n’excédera 20\n    mètres, et la hauteur sera mesurée en fonction de la médiane de chaque section,\n    Un dépassement de la hauteur maximum, définie à la règle générale de l’article 3.5 peut être autorisé\n    pour des motifs d'ordre architectural et urbanistique tendant à une harmonisation des hauteurs et des\n    volumes avec ceux des bâtiments existants accolés au futur bâtiment, dans la limite d'un dépassement\n    maximal de 3 mètres et, pour les opérations de rénovation de bâtiments existants, dans le gabarit du\n    bâtiment existant rénové.\n    Pour les constructions à destination d’hébergement hôtelier et touristique, les projets de réhabilitation,\n    de rénovation ou d’extension devront être réalisés dans la limite de la hauteur du volume de la\n    construction existante à la date d’approbation du PLU.\n    Lorsqu’une limite du terrain jouxte la zone UE, la hauteur maximum de la construction ne devra pas\n    excéder 15 m dans une bande de 15 m comptée à partir de cette limite.\n    Il n’est pas fixé de règle pour les installations et les ouvrages rendant accessibles les espaces publics\n    et les équipements d’intérêt collectif et services publics.\n    Villa des Vieilles Vignes\n    La hauteur des constructions ne pourra excéder 9 mètres au faîtage et 6 mètres à l’égout du toit à\n    l’exception du bâtiment sis 48 avenue Marceau auquel s’appliquent les règles générales de l’article 3.5.\n    Article 4 – Qualité urbaine, architecturale, environnementale et\n    paysagère\n    4.1.    Caractéristiques des façades, des toitures et des clôtures\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Le parement d’aspect pierre naturelle ou brique sera privilégié sur les façades et pignons au minimum\n    sur 60 % de la façade.\n    4.2.    Obligations en matière de performances énergétiques et environnementales\n    Voir dispositions communes à toutes les zones\n    48","UA\n    Article 5 – Traitement environnemental et paysager des espaces non\n    bâtis et abords des constructions\n    5.1.    Traitement des espaces libres\n    Voir dispositions communes à toutes les zones\n    En dehors des unités foncières concernées par une servitude de localisation pour espaces verts, toute\n    opération de construction de plus de 5 000 m2 de S.D.P. doit réserver au moins 20 % de cette surface\n    à des espaces verts collectifs. Ces espaces verts sont comptabilisés dans le bilan des surfaces non\n    imperméabilisées règlementées à l’article 5.2 de la zone.\n    5.2.    Part minimale de surfaces non imperméabilisées\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Coefficient de Biotope = 20% d’Espaces Verts de pleine terre + 20% Espaces Verts complémentaires\n    Article 6 – Stationnement\n    Voir dispositions communes à toutes les zones\n    EQUIPEMENT ET RESEAUX\n    Article 7 – Desserte par les voies publiques ou privées\n    Voir dispositions communes à toutes les zones\n    Article 8 - Desserte par les réseaux\n    Voir dispositions communes à toutes les zones\n    49","UD\n    Zone UD\n    DESTINATION DES CONSTRUCTIONS, USAGES DES SOLS ET NATURES\n    D’ACTIVITE\n    Article 1 - Interdiction et limitation de certains usages et affectation\n    des sols, constructions et activités\n    1.1. Usages et affectations des sols, types d’activités, destinations et sous-destinations interdits\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Sont interdits :\n    L'implantation des installations classées soumises à autorisation, sauf celles prévues aux articles 1.2 et\n    celles qui sont nécessaires au fonctionnement exclusif du bâtiment à condition qu’elles soient intégrées\n    dans le volume de la construction.\n    ▪   Les dépôts à l'air libre de ferrailles, de matériaux, de combustibles solides, ainsi que les\n    entreprises de cassage de voitures et la transformation de matériaux de récupération.\n    ▪   Les affouillements et exhaussements des sols nécessitant une autorisation d’urbanisme et\n    qui ne sont pas nécessaires à des travaux de construction.\n    En zone UDd, toutes constructions ou installations nouvelles, à l’exception de celles à destination de\n    commerce et activités de service ou les équipements d’intérêt collectif et services publics, ainsi que les\n    autres activités des secteurs secondaires et tertiaire mais uniquement pour la sous-destination centre\n    de congrès.\n    A l’intérieur du périmètre de danger figurant au document graphique autour de la centrale Enertherm,\n    tous projets de construction ou d’aménagement destinés à recevoir du public sont interdits.\n    Dispositions supplémentaires applicables dans les zones à risques relevant de la maîtrise de\n    l’urbanisation et concernant l’établissement Enertherm :\n    ▪   A l’intérieur du périmètre d’interdiction stricte : toute nouvelle construction est interdite à\n    l’exception d’installations industrielles directement en lien avec l’activité à l’origine des\n    risques.\n    ▪   A l’intérieur du périmètre d’interdiction : toute nouvelle construction est interdite à\n    l’exception d’installations industrielles directement en lien avec l’activité à l’origine des\n    risques, d’aménagement et d’extensions d’installations existantes ou de nouvelles\n    installations classées soumises à autorisation compatibles avec cet environnement\n    (notamment au regard des effets dominos et de la gestion des situations d’urgence).\n    ▪   La construction d’infrastructures de transport peut être autorisée uniquement pour les\n    fonctions de desserte de la zone industrielle.\n    1.2. Types d’activités, destinations et sous-destinations autorisés sous conditions\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Les installations classées nouvelles correspondant à des besoins nécessaires à la vie du quartier sous\n    réserve que toutes les dispositions soient prises pour qu’elles n’engendrent pas de gêne pour le\n    voisinage ou que les nuisances et dangers soient prévenus à l’égard de l’environnement.\n    L'extension ou la modification des installations classées existantes à la condition expresse que ces\n    travaux entraînent une atténuation des nuisances ou dangers et que ces installations nouvelles par leur\n    volume et leur aspect extérieur, soient compatibles avec le milieu environnant.\n    Dans les parties de la zone, soumises au risque technologique de transports de matières dangereuses\n    lié à la présence des canalisations de gaz à haute pression, dont le tracé figure dans le plan des\n    50","UD\n    servitudes d’utilité publique annexé au P.L.U., toute occupation ou utilisation du sol doit respecter les\n    règles visant à garantir la sécurité publique\n    En zone UDb, l’implantation des constructions et l’aménagement des constructions existantes devront\n    être compatibles avec l’orientation d’aménagement visant la création d’une percée visuelle vers le parc\n    Diderot figurant au plan de l’OAP n°3.\n    En zone UDc :\n    - l’implantation des constructions et l’aménagement des constructions existantes devront être\n    compatibles avec l’orientation d’aménagement visant la création de la perspective vers l’avenue\n    Gambetta figurant au plan de l’OAP n°3.\n    En zones UDa, UDb et UDd :\n    - l’implantation des constructions et l’aménagement des constructions existantes devront être\n    compatibles avec l’orientation d’aménagement visant la création de la liaison et perspective\n    paysagère entre les emprises publiques dites places des Corolles, des Reflets et Iris, figurant\n    au plan de l’OAP n°3 ; à cet effet elles devront libérer une distance d’au moins 15 mètres\n    (distance comptée horizontalement à tout point entre façades opposées à édifier ou modifier)\n    au droit des emprises publiques dites places des Corolles, Reflets et Iris.\n    En zones UDa, UDb et UDc :\n    - l’implantation des constructions et l’aménagement des constructions existantes devront être\n    compatibles avec l’orientation d’aménagement relative aux liaisons piétonnes niveau sol et\n    niveau dalle figurant au plan de l’OAP n°3 ; à cet effet elles devront libérer une distance d’au\n    moins 15 mètres (distance comptée horizontalement à tout point entre façades opposées à\n    édifier ou modifier) au droit desdites liaisons piétonnes.\n    En zone UDb :\n    Dispositions supplémentaires applicables dans les zones à risques relevant de la maîtrise de\n    l’urbanisation et concernant l’établissement Enertherm :\n    ▪    A l’intérieur de la zone de restriction (cf. document graphique) : L’aménagement ou\n    l’extension de constructions existantes sont possibles. L’autorisation de nouvelles\n    constructions est possible sous réserve de ne pas augmenter la population exposée. Les\n    changements de destination doivent être réglementés dans le même cadre.\n    ▪    A l’intérieur du périmètre d’exposition à des bris de vitre par effet de surpression (cf.\n    document graphique) : Les constructions doivent être adaptées à l’effet de surpression. A\n    titre d’exemple, les mesures envisageables sont la limitation de la taille des ouvertures, des\n    surfaces vitrées et des verrières, la mise en place de vitrage feuilleté ou d’un film de protection\n    contre les bris de vitre.\n    Toutes nouvelles constructions, installations et extensions des constructions existantes nécessaires aux\n    activités de la centrale Enertherm sont autorisées, y compris celles relevant des Installations Classées\n    pour la Protection de l’Environnement.\n    Article 2 - Mixité fonctionnelle et sociale\n    Voir dispositions communes à toutes les zones\n    51","UD\n    CARACTERISTIQUES    URBAINES,    ARCHITECTURALES,\n    ENVIRONNEMENTALES ET PAYSAGERES\n    Article 3 - Volumétrie et implantation des constructions\n    3.1.    Implantation des constructions par rapport aux voies et emprises publiques\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    La partie de la Dalle du centre d’affaires de La Défense appartenant au domaine public est considérée\n    comme une voie ou une emprise publique au sens du présent article. En conséquence, les règles\n    d’implantations s’appliquant au niveau dalle sont celles figurant ci-dessous.\n    A l’exception du tronçon du boulevard Circulaire en ouvrage aérien compris entre le carrefour Ségoffin/\n    Regnault et l’avenue de la Division Leclerc dont la largeur actuelle pourra être maintenue, les\n    constructions situées de part et d’autre du boulevard Circulaire seront édifiées à l’alignement des voies\n    publiques ou des voies privées ou en limite des emprises publiques existantes, modifiées ou à créer,\n    ou bien en retrait, sous réserve qu’en tout point de chaque élément de la façade de la construction à\n    édifier, situé à moins de 20 mètres du sol, la distance comptée horizontalement à tout point de l’élément\n    de façade de la construction située sur le front urbain opposé du boulevard Circulaire soit égale ou\n    supérieure à 35 mètres.. En cas de réhabilitation de construction ne respectant pas cette distance, cette\n    construction ne pourra pas faire l’objet de surélévation dans le prolongement des murs existants. Cette\n    règle ne s’applique pas aux ouvrages d’art de franchissement, aux passerelles, rampes et escaliers de\n    desserte des constructions, ni aux auvents et avancées de façade présentant une inclinaison par rapport\n    à la verticale de 7 degrés maximum.\n    Ailleurs, les constructions devront être édifiées à l’alignement des voies publiques ou des voies privées\n    ou en limite des emprises publiques existantes, modifiées ou à créer ou des ELP (Espaces Libres\n    Protégés existants ou à créer), ou bien en retrait sous réserve de la compatibilité du projet avec\n    l’orientation d’aménagement relative aux liaisons piétonnes transversales sur dalle et au niveau du sol,\n    figurant au plan de l’OAP n°3. Cette règle s’applique également à l’aménagement des constructions\n    existantes. Au niveau du sol, en cas de retrait, celui-ci sera d’au moins 1 mètres, mesuré par rapport à\n    l’alignement des voies publiques ou des voies privées ou en limite des emprises publiques existantes,\n    modifiées ou à créer.\n    Les constructions situées en dessous du niveau dalle ou en sous-sol sont autorisées.\n    Saillies\n    Les saillies sur alignement et/ou emprise publique, et les parties de bâtiment édifiées en surplomb de\n    ces alignements sont admises.\n    Les avancées de façade présentant une inclinaison (biais de façade) par rapport à la verticale sont\n    autorisées dans la limite d’un angle de 7 degrés maximum par rapport à la verticale de la façade élevée\n    depuis sa base.\n    A l’exception des auvents et des biais de façade non soumis à des conditions de hauteur, les autres\n    saillies doivent être situées à une hauteur minimum de 10,00 m mesurée à partir du dernier niveau\n    accessible aux piétons de la dalle et à une hauteur minimum de 20,00 m dans tous les autres cas. La\n    hauteur de la saillie sera mesurée à partir de l’emprise publique surplombée.\n    Les auvents et les biais de façade ne sont pas tenus de respecter :\n    - La largeur de la percée visuelle vers le parc Diderot et celle de la perspective vers l’avenue\n    Gambetta prévues par l’article 1.2 du règlement applicable en zone UD,\n    - La largeur d’au moins 15 mètres (distance comptée horizontalement à tout point entre façades\n    opposées à édifier ou modifier) prévue par l’article 1.2 du règlement applicable en zone UD,\n    Rappel : Les saillies sur alignement doivent faire l’objet d’une permission de voirie par l’autorité\n    gestionnaire de la voie.\n    52","UD\n    53","UD\n    3.2.    Implantation des constructions par rapport aux limites séparatives\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Sous réserve des dispositions des articles 1.2 et 3.1 du règlement de la zone UD, les constructions sont\n    autorisées :\n    ▪   sur les limites séparatives* ;\n    ▪   en retrait de ces limites ; dans ce cas, elles devront s’implanter au minimum à 10 mètres de\n    la limite séparative*.\n    3.3.    Implantation des constructions par rapport aux autres constructions sur une même\n    propriété\n    Sans préjudice des dispositions de l’article 1.2 du règlement de la zone UD, relatifs aux perspectives\n    en direction du parc Diderot ou de l’avenue Gambetta, la construction de plusieurs bâtiments sur une\n    même propriété est autorisée, à condition qu’en tout point de chaque élément de façade, la distance\n    mesurée normalement à celle-ci et la séparant d'un élément de façade d'un autre bâtiment, soit au\n    moins égale à 10 mètres.\n    L’implantation des constructions et l’aménagement des constructions existantes devront être\n    compatibles avec l’orientation d’aménagement visant la création ou le maintien de liaisons douces\n    transversales figurant au plan de l’OAP n°3.\n    3.4.   Emprise au sol\n    Non réglementé.\n    3.5.    Hauteur des constructions\n    La hauteur maximale des constructions, y compris les superstructures en toiture, ne pourra excéder :\n    ▪ 345 mètres NGF en zone UDa\n    ▪ 215 mètres NGF en zone UDb\n    ▪ 100 mètres NGF en zone UDc\n    En zone UDa, la hauteur limite est portée à 365 mètres NGF pour les parties de la zone non soumises\n    aux servitudes aéronautiques de dégagement figurant parmi les servitudes d’utilité publique.\n    En zone UDd :\n    ▪ les constructions existantes pourront être reconstruites à leurs hauteurs existantes à la date\n    d’approbation du P.L.U. ;\n    ▪ les constructions et installations nouvelles à destination de commerce et activités de services,\n    ou d’équipements d’intérêt collectif et services publics seront autorisées à une hauteur\n    maximum de 6 m par rapport à la dalle. Toutefois, cette limite pourra être dépassée de 2,00 m\n    par des structures formant un signal architectural.\n    Dans toute la zone, les dispositions de cet article ne s’appliquent pas pour les constructions et\n    installations nécessaires au réseau de transport public du Grand Paris implantées en surface par des\n    règles de hauteur qui ne permettraient pas l’implantation du projet.\n    La hauteur maximum pourra être dépassée dans les limites fixées ci-dessous :\n    ▪   édicule technique, d’une hauteur de 3 mètres maximum, à condition qu’il soit intégré dans un\n    volume fermé et qu’il soit implanté en retrait des façades d’une distance au moins égale à sa\n    hauteur,\n    ▪   dispositifs techniques liés à la production d’énergie renouvelable dès lors qu’ils ne dépassent\n    pas une hauteur de 1,50 mètre, à condition qu’ils respectent les dispositions relatives aux\n    toitures de l’article 4.1 des dispositions communes à toutes les zones.\n    Il n’est pas fixé de règle pour les installations et les ouvrages rendant accessibles les espaces publics\n    et les équipements d’intérêt collectif et services publics.\n    54","UD\n    Article 4 – Qualité urbaine, architecturale, environnementale et\n    paysagère\n    4.1.    Caractéristiques des façades, des toitures et des clôtures\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Façades\n    Les portes d’accès aux locaux de service doivent faire l’objet d’un traitement particulier en harmonie\n    avec les façades.\n    Toutes les façades situées en limite de dalle doivent être traitées comme des façades principales, y\n    compris pour celles relatives aux locaux techniques ou aux parcs de stationnement.\n    Clôtures\n    Lorsqu’il est procédé à l’édification de clôtures celles-ci auront une hauteur maximum de 2,20 m sur les\n    voies publiques. Elles pourront comporter une partie pleine au maximum sur 1/3 de la hauteur.\n    4.2.    Obligations en matière de performances énergétiques et environnementales\n    Voir dispositions communes à toutes les zones\n    Article 5 – Traitement environnemental et paysager des espaces non\n    bâtis et abords des constructions\n    5.1.    Traitement des espaces libres\n    Voir dispositions communes à toutes les zones\n    5.2.    Part minimale de surfaces non imperméabilisées\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Coefficient de Biotope = 0 % ou plus d’Espaces Verts de pleine terre + 40% de la surface non bâtie en\n    Espaces Verts complémentaires.\n    Article 6 – Stationnement\n    Voir dispositions communes à toutes les zones\n    Lorsqu’est construite une Surface de Plancher dépassant 500m ² à destination de commerce, artisanat\n    ou industrie, il doit être réservé les emplacements nécessaires et adaptés pour assurer toutes les\n    opérations usuelles de chargement, déchargement et manutention.\n    EQUIPEMENT ET RESEAUX\n    Article 7 – Desserte par les voies publiques ou privées\n    Voir dispositions communes à toutes les zones\n    Article 8 - Desserte par les réseaux\n    Voir dispositions communes à toutes les zones\n    55","UE\n    Zone UE\n    DESTINATION DES CONSTRUCTIONS, USAGES DES SOLS ET NATURES\n    D’ACTIVITE\n    Article 1 - Interdiction et limitation de certains usages et affectation\n    des sols, constructions et activités\n    1.1. Usages et affectations des sols, types d’activités, destinations et sous-destinations interdits\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Sont interdits :\n    L'implantation et l'extension des installations classées soumises à autorisation.\n    Les bâtiments à destination de bureaux, à l’exception de ceux autorisés à l’article 1.2, ou d'activités et\n    leurs annexes.\n    Les dépôts à l'air libre de ferrailles, de matériaux, de combustibles solides, ainsi que les activités de\n    démantèlement d’épaves et la transformation de matériaux de récupération.\n    Les affouillements et exhaussements des sols nécessitant une autorisation d’urbanisme et qui ne sont\n    pas nécessaires à des travaux de construction.\n    1.2. Types d’activités, destinations et sous-destinations autorisés sous conditions\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Sont admis sous conditions les bureaux d’une surface inférieure à 75 m ² S.D.P.\n    Dans les parties de la zone, soumises au risque technologique de transports de matières dangereuses\n    lié à la présence des canalisations de gaz à haute pression, dont le tracé figure dans le plan des\n    servitudes d’utilité publique annexé au P.L.U., toute occupation ou utilisation du sol doit respecter les\n    règles visant à garantir la sécurité publique.\n    Article 2 - Mixité fonctionnelle et sociale\n    Voir dispositions communes à toutes les zones\n    56","UE\n    CARACTERISTIQUES    URBAINES,    ARCHITECTURALES,\n    ENVIRONNEMENTALES ET PAYSAGERES\n    Article 3 - Volumétrie et implantation des constructions\n    3.1.    Implantation des constructions par rapport aux voies et emprises publiques\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Règles générales d’implantation\n    Lorsque l’implantation des constructions est indiquée au document graphique, elles doivent s’implanter\n    sur l’indication graphique.\n    En l’absence de marge de recul figurant aux documents graphiques ou d’indication graphique, les\n    constructions devront être implantées à 3 mètres minimum des voies publiques ou privées et emprises\n    publiques existantes, modifiées ou à créer. Les constructions en sous-sol ou en saillie devront quant à\n    elles être implantées à 3 mètres minimum de l’axe des voies.\n    Toutefois, dans le cas où une construction voisine existante sur l’unité foncière ou mitoyenne de la\n    construction projetée est implantée à moins de 3 mètres de l’alignement ou/ et de la limite d’une voie\n    privée ou emprise publique, l’implantation est autorisée, en tout ou partie, avec le même retrait que celui\n    de la construction voisine pour permettre d’harmoniser les façades.\n    Si une marge de recul figure aux documents graphiques, les constructions au-dessus et en dessous du\n    sol devront être implantées au-delà de cette marge.\n    En l'absence d'indications particulières figurant aux documents graphiques, les propriétés situées à\n    l'angle de 2 voies supporteront un retrait constitué par un segment de droite de 5 mètres de longueur\n    minimum formant des angles égaux avec chacun des alignements des voies adjacentes.\n    Règles d’implantation spécifiées aux documents graphiques\n    Villa Ghis :\n    Lorsque l’implantation des constructions est indiquée au document graphique spécifique, elles doivent\n    s’implanter sur l’indication graphique.\n    En l’absence d’indication graphique, les constructions devront s’implanter conformément aux aux règles\n    générales d’implantation de l’article 3.1.\n    Villa Maurice André et Impasse Robert Marcel :\n    Lorsque l’implantation des constructions est indiquée au document graphique spécifique, elles doivent\n    s’implanter sur l’indication graphique.\n    En l’absence d’indication graphique, les constructions doivent s’implanter à l’alignement*.\n    Villa Fallet :\n    Lorsque l’implantation des constructions est indiquée au document graphique spécifique, elles doivent\n    s’implanter sur l’indication graphique.\n    En l’absence d’indication graphique, les constructions doivent s’implanter à l’alignement.\n    57","UE\n    Villa des Lilas :\n    Les constructions doivent s’implanter sur l’indication graphique du document spécifique.\n    Passage du 106 bis, Boulevard Saint-Denis\n    Lorsque l’implantation des constructions est indiquée au document graphique, elles doivent s’implanter\n    sur l’indication graphique.\n    En l’absence d’indication graphique les constructions doivent s’implanter à l’alignement\n    Dispositions alternatives\n    Hors marge de recul et élargissement de voirie, les surélévations et les extensions des constructions\n    existantes à la date d’approbation du PLU ne respectant pas les dispositions de l’article 3.5 sont\n    autorisées dans les limites indiquées ci-dessous :\n    ▪   la partie de surélévation non conforme aux règles générales d’implantation de l’article 3.1 est\n    autorisée, dans la limite d’une surface égale au maximum à 15 % de la S.D.P. du bâtiment\n    existant à la date d’approbation du P.L.U. et dans le prolongement vertical des murs existants.\n    ▪   la partie de l’extension non conforme aux règles générales d’implantation de l’article 3.1 est\n    autorisée, dans la limite d’une surface égale au maximum à 15 % de la S.D.P. du bâtiment\n    existant à la date d’approbation du P.L.U. et dans le prolongement des murs existants.\n    Le total des parties de surélévations et des extensions non conformes aux règles générales\n    d’implantation de l’article 3.1 ne pourra dépasser 15 % de la S.D.P. du bâtiment existant à la date\n    d’approbation du P.L.U.\n    3.2.    Implantation des constructions par rapport aux limites séparatives\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Règles générales d’implantation\n    Les constructions sont autorisées en limite séparative ou en retrait de ces limites dans les conditions\n    indiquées ci-dessous :\n    3.2.1. Conditions relatives à l'implantation des constructions en retrait de la limite séparative :\n    ▪   La distance comptée horizontalement de tout point d'un élément de façade comportant une\n    baie principale, à une limite séparative, doit être au moins égale à la hauteur de cet élément\n    de façade avec un minimum de 6 mètres (L=H avec L≥ 6mètres).\n    ▪   La distance comptée horizontalement de tout point d’un élément de façade ne comportant\n    pas de baies principales* à une limite séparative* doit être au moins égale à la moitié de la\n    hauteur de cet élément de façade avec un minimum de 2,50 mètres (L=H/2 avec L≥ 2,5\n    mètres).\n    ▪   Les saillies fermées dont les façades latérales ne respectent pas le paragraphe précédent\n    sont autorisées à condition :\n    o   que leur profondeur n'excède pas 1 mètre,\n    o   que leur distance à la limite séparative* soit au moins égale à 2,50 mètres.\n    3.2.2. Conditions relatives à l'implantation des constructions en limite séparative :\n    Lorsque le terrain présente une largeur sur voie publique ou privée ou emprise publique supérieure à\n    15 mètre, les constructions sont autorisées en limite séparative :\n    ▪   soit si elles s’adossent à une construction en bon état et de dimensions égales ou supérieures\n    existant sur le terrain voisin et si elles s’insèrent dans les héberges des bâtiments existants,\n    ▪   soit si elles ne sont pas affectées à l’habitation ou à l’activité et que leur hauteur totale ne\n    dépasse pas 3,50 mètres en limite séparative.\n    Lorsque le terrain présente une largeur sur voie publique ou privée ou emprise publique inférieure ou\n    égale à 10 mètres, les constructions sont autorisées :\n    58","UE\n    ▪   sur les deux limites séparatives latérales ;\n    ▪   et en limite séparative de fond de parcelle :\n    o   soit, si elles s’adossent à une construction en bon état et de dimensions égales ou\n    supérieures existant sur le terrain voisin et si elles s’insèrent dans les héberges des\n    bâtiments existants ;\n    o   soit, si elles ne sont pas affectées à l’habitation ou à l’activité et que leur hauteur totale\n    ne dépasse pas 3,50 mètres en limite séparative.\n    Lorsque le terrain présente une largeur sur voie publique ou privée ou emprise publique comprise entre\n    10 et 15 mètres les constructions sont autorisées :\n    ▪   sur une seule des limites séparatives* latérales,\n    ▪   et en limite séparative* de fond de parcelle :\n    o   soit si elles s’adossent à une construction en bon état et de dimensions égales ou\n    supérieures existant sur le terrain voisin et si elles s’insèrent dans les héberges des\n    bâtiments existants ;\n    o   soit si elles ne sont pas affectées à l’habitation ou à l’activité et que leur hauteur totale\n    ne dépasse pas 3,50 mètres en limite séparative.\n    Quand le bâtiment est implanté en limite séparative, un retrait du dernier étage par rapport à cette limite\n    est autorisé à condition que la distance au point le plus proche de la limite séparative soit au moins\n    égale à 2,50 mètres si la façade ne comporte pas de baies principales et à 6 mètres si la façade\n    comporte des baies principales.\n    Règles d’implantation spécifiées aux documents graphiques\n    Villa Ghis :\n    Les constructions doivent s’implanter sur une des limites séparatives latérales, et en retrait des autres\n    limites séparatives conformément aux dispositions de l’article 3.2.1\n    Villa Maurice André et Impasse Robert Marcel :\n    Les constructions doivent s’implanter sur une des limites séparatives latérales, et en retrait des autres\n    limites séparatives conformément aux dispositions de l’article 3.2.1.\n    Villa Fallet :\n    Lorsque l’implantation des constructions est indiquée au document graphique spécifique, elles doivent\n    s’implanter sur l’indication graphique.\n    En l’absence d’indication graphique les constructions doivent s’implanter en limites séparatives.\n    Villa des Lilas :\n    Lorsque l’implantation des constructions est indiquée au document spécifique, elles doivent s’implanter\n    sur l’indication graphique.\n    En l’absence d’indication graphique les constructions doivent s’implanter en limites séparatives.\n    Passage du 106 bis, Boulevard Saint-Denis\n    Lorsque l’implantation des constructions est indiquée au document graphique, elles doivent s’implanter\n    sur l’indication graphique.\n    En l’absence d’indication graphique les constructions doivent s’implanter en limites séparatives.\n    Dispositions alternatives\n    Les surélévations et les extensions des constructions existantes à la date d’approbation du PLU ne\n    respectant pas les règles générales d’implantation de l’article 3.2 sont autorisées dans les limites\n    indiquées ci-dessous.\n    59","UE\n    ▪    la partie de surélévation non conforme aux règles générales d’implantation de l’article 3.2 est\n    autorisée, dans la limite d’une surface égale au maximum à 15 % de la S.D.P. du bâtiment\n    existant à la date d’approbation du P.L.U.et dans le prolongement vertical des murs existants.\n    ▪    la partie de l’extension non conforme aux règles générales d’implantation de l’article 3.2 est\n    autorisée, dans la limite d’une surface égale au maximum à 15 % de la S.D.P. du bâtiment\n    existant à la date d’approbation du P.L.U.et dans le prolongement des murs existants.\n    Le total des parties de surélévations et des extensions non conformes aux règles générales\n    d’implantation de l’article 3.2 ne pourra dépasser 15 % de la S.D.P. du bâtiment existant à la date\n    d’approbation du P.L.U.\n    3.3.   Implantation des constructions par rapport aux autres constructions sur une même\n    propriété\n    Règles générales d’implantation\n    Est autorisée, sur une même propriété, la construction de plusieurs bâtiments, à condition que :\n    En tout point de chaque élément de façade, la distance mesurée à celle-ci et la séparant d'un élément\n    de façade d'un autre bâtiment, soit au moins égale à :\n    ▪    la hauteur de l'élément de façade la plus haute, avec un minimum de 6 mètres, si l'élément\n    de façade la plus basse comporte des baies principales*.\n    ▪    la hauteur de l'élément de la façade la plus basse, avec un minimum de 6 mètres, si cette\n    dernière ne comporte pas de baies principales et que l'élément de la façade la plus haute en\n    comporte,\n    ▪    la moitié de la hauteur de l'élément de façade la plus haute, avec un minimum de 3 mètres,\n    si les deux éléments de façades ne comportent pas de baies principales.\n    La plus courte distance entre deux bâtiments soit supérieure ou égale à 3 mètres.\n    Dispositions alternatives\n    Les surélévations et les extensions des constructions existantes à la date d’approbation du PLU ne\n    respectant pas les règles générales d’implantation de l’article 3.3. sont autorisées dans les limites\n    indiquées ci-dessous.\n    ▪    la partie de surélévation non conforme aux règles générales d’implantation de l’article 3.3.\n    est autorisée, dans la limite d’une surface égale au maximum à 15 % de la S.D.P. du bâtiment\n    existant à la date d’approbation du P.L.U.et dans le prolongement vertical des murs existants.\n    ▪    la partie de l’extension non conforme aux règles générales d’implantation de l’article 3.3. est\n    autorisée, dans la limite d’une surface égale au maximum à 15 % de la S.D.P. du bâtiment\n    existant à la date d’approbation du P.L.U.et dans le prolongement des murs existants.\n    Le total des parties de surélévations et des extensions non conformes aux règles générales\n    d’implantation de l’article 3.3. ne pourra dépasser 15 % de la S.D.P. du bâtiment existant à la date\n    d’approbation du P.L.U.\n    3.4.    Emprise au sol\n    Pour la détermination de l’emprise au sol autorisée, il devra être déduit de la superficie de l’unité\n    foncière les surfaces consacrées à des opérations de voirie publique (emplacement réservé pour\n    opération de voirie) ou privée.\n    Règles générales d’emprise\n    L’emprise au sol des bâtiments ne pourra excéder 30 % de la superficie du terrain,\n    Pour les terrains existants à la date d’approbation du P.L.U d’une surface comprise entre 200 et 250\n    m², l’emprise au sol maximale est fixée à 105 m². Pour les terrains existants à la date d’approbation\n    du P.L.U d’une surface inférieure à 200 m², l’emprise au sol ne pourra excéder 50 %.\n    Dispositions alternatives\n    Il n’est pas fixé d’emprise au sol pour les équipements d’intérêt collectif et services publics.\n    60","UE\n    L’extension des constructions existantes à la date d’approbation du PLU, dont l’emprise au sol excède\n    celles mentionnées par les dispositions de l’article 3.4 sont autorisées dans les limites suivantes :\n    l’extension au sol de la construction non conforme aux dispositions de l’article 3.4 est autorisée dans la\n    limite de 15% de la S.D.P du bâtiment existant à la date d’approbation du PLU.\n    3.5.    Hauteur des constructions\n    Règles générales de hauteur\n    La hauteur des constructions avec toiture en pente ne pourra excéder 9 mètres au faîtage.\n    La hauteur des constructions avec toiture terrasse ne pourra excéder 9 mètres au sommet de l’acrotère.\n    Pour les murs pignons supportant des toitures à une ou plusieurs pentes, la hauteur de la construction\n    est mesurée depuis le sol naturel jusqu'au faîtage ou jusqu’au sommet de l’acrotère, lorsque la\n    construction comporte une toiture terrasse sauf si l’acrotère est prolongé pour faire office de garde-\n    corps, auquel cas, la sur-hauteur induite par celui-ci n’est pas comptée.\n    Il n’est pas fixé de règle pour les installations et les ouvrages rendant accessibles les espaces publics\n    et les équipements d’intérêt collectif et services publics.\n    Règles de hauteur spécifiées aux documents graphiques\n    La hauteur des constructions ne pourra excéder 9 mètres au faîtage et 6 mètres à l'égout du toit.\n    Villa Ghis :\n    La hauteur des constructions ne pourra pas excéder 9 mètres au faîtage et 6 mètres à l’égout du toit.\n    Villa Maurice André et Impasse Robert Marcel :\n    La hauteur des constructions ne pourra excéder 9 mètres au faîtage et 6 mètres à l'égout du toit.\n    Villa Fallet :\n    La hauteur des constructions existantes à la date d’approbation du PLU doit être conservée.\n    Villa des Lilas :\n    La hauteur des constructions existantes à la date d’approbation du PLU doit être conservée.\n    Passage du 106 bis, Boulevard Saint-Denis\n    La hauteur des constructions existantes à la date d’approbation du PLU doit être conservée.\n    Article 4 – Qualité urbaine, architecturale, environnementale et\n    paysagère\n    4.1.    Caractéristiques des façades, des toitures et des clôtures\n    Voir dispositions communes à toutes les zones\n    4.2.    Obligations en matière de performances énergétiques et environnementales\n    Voir dispositions communes à toutes les zones\n    Article 5 – Traitement environnemental et paysager des espaces non\n    bâtis et abords des constructions\n    5.1.    Traitement des espaces libres\n    Voir dispositions communes à toutes les zones\n    5.2.    Part minimale de surfaces non imperméabilisées\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Coefficient de Biotope = 40% d’Espaces Verts de pleine terre + 0 % ou plus d’Espaces Verts\n    complémentaires.\n    Article 6 – Stationnement\n    Voir dispositions communes à toutes les zones\n    61","UE\n    EQUIPEMENT ET RESEAUX\n    Article 7 – Desserte par les voies publiques ou privées\n    Voir dispositions communes à toutes les zones\n    Article 8 - Desserte par les réseaux\n    Voir dispositions communes à toutes les zones\n    62","UP\n    Zone UP\n    DESTINATION DES CONSTRUCTIONS, USAGES DES SOLS ET NATURES\n    D’ACTIVITE\n    Article 1 - Interdiction et limitation de certains usages et affectation\n    des sols, constructions et activités\n    1.1. Usages et affectations des sols, types d’activités, destinations et sous-destinations interdits\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Sont interdits :\n    L'implantation des installations classées soumises à autorisation, sauf celles prévues à l’article 1.2.\n    Les dépôts à l'air libre de ferrailles, de matériaux, de combustibles solides, ainsi que les activités de\n    démantèlement d’épaves et la transformation de matériaux de récupération.\n    Les affouillements et exhaussements des sols nécessitant une autorisation d’urbanisme et qui ne sont\n    pas nécessaires à des travaux de construction.\n    A l’intérieur du périmètre de danger figurant au document graphique autour de la centrale Enertherm,\n    tous projets de construction ou d’aménagement destinés à recevoir du public sont interdits.\n    Dispositions supplémentaires applicables dans les zones à risques relevant de la maîtrise de\n    l’urbanisation et concernant l’établissement Enertherm :\n    ▪   A l’intérieur du périmètre d’interdiction stricte : toute nouvelle construction est interdite à\n    l’exception d’installations industrielles directement en lien avec l’activité à l’origine des\n    risques.\n    ▪   A l’intérieur du périmètre d’interdiction : toute nouvelle construction est interdite à\n    l’exception d’installations industrielles directement en lien avec l’activité à l’origine des\n    risques, d’aménagement et d’extensions d’installations existantes ou de nouvelles\n    installations classées soumises à autorisation compatibles avec cet environnement\n    (notamment au regard des effets dominos et de la gestion des situations d’urgence).\n    ▪   La construction d’infrastructures de transport peut être autorisée uniquement pour les\n    fonctions de desserte de la zone industrielle.\n    1.2. Types d’activités, destinations et sous-destinations autorisés sous conditions\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Sont admis sous conditions :\n    Les installations classées nouvelles correspondant à des besoins nécessaires à la vie du quartier sous\n    réserve que toutes les dispositions soient prises pour qu’elles n’engendrent pas de gêne pour le\n    voisinage ou que les nuisances et dangers soient prévenus à l’égard de l’environnement.\n    Les installations classées temporaires nécessaires à la réalisation des constructions et installations du\n    réseau de transport public du Grand Paris.\n    Le déplacement, l'extension ou la modification des installations classées existantes dans la zone UP à\n    la condition expresse que ces travaux entraînent une atténuation des nuisances ou dangers et que ces\n    installations par leur volume et leur aspect extérieur, soient compatibles avec le milieu environnant.\n    Dans les parties de la zone, soumises au risque technologique de transports de matières dangereuses\n    lié à la présence des canalisations de gaz à haute pression, dont le tracé figure dans le plan des\n    servitudes d’utilité publique annexé au P.L.U., toute occupation ou utilisation du sol doit respecter les\n    règles visant à garantir la sécurité publique.\n    A l’exception du secteur compris entre le boulevard de Verdun, l’avenue de l’Europe, la rue des Minimes\n    et la rue Latérale où il n’est pas fixé de limitation à la création de surfaces bureaux :\n    - les bureaux d’une surface inférieure à 300 m2 S.D.P.,\n    63","UP\n    -    les extensions de constructions existantes à usage de bureaux , dans la limite de 15% de\n    la S.D.P existante, afin de permettre dans la limite de 3.000 m 2 S.D.P leur extension ou\n    restructuration, dans le cadre de l’aménagement de volumes existants et notamment les\n    changements de destination.\n    Dispositions supplémentaires applicables dans les zones à risques relevant de la maîtrise de\n    l’urbanisation et concernant l’établissement Enertherm :\n    ▪    A l’intérieur de la zone de restriction (cf. document graphique) : L’aménagement ou\n    l’extension de constructions existantes sont possibles. L’autorisation de nouvelles\n    constructions est possible sous réserve de ne pas augmenter la population exposée. Les\n    changements de destination doivent être réglementés dans le même cadre.\n    ▪    A l’intérieur du périmètre d’exposition à des bris de vitre par effet de surpression (cf.\n    document graphique) : Les constructions doivent être adaptées à l’effet de surpression. A\n    titre d’exemple, les mesures envisageables sont la limitation de la taille des ouvertures, des\n    surfaces vitrées et des verrières, la mise en place de vitrage feuilleté ou d’un film de protection\n    contre les bris de vitre.\n    Toutes nouvelles constructions, installations et extensions des constructions existantes nécessaires aux\n    activités de la centrale Enertherm sont autorisées, y compris celles relevant des Installations Classées\n    pour la Protection de l’Environnement.\n    Article 2 - Mixité fonctionnelle et sociale\n    Voir dispositions communes à toutes les zones\n    CARACTERISTIQUES    URBAINES,    ARCHITECTURALES,\n    ENVIRONNEMENTALES ET PAYSAGERES\n    Article 3 - Volumétrie et implantation des constructions\n    3.1.    Implantation des constructions par rapport aux voies et emprises publiques\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Règles générales d’implantation\n    Lorsque l’implantation des constructions est indiquée au document graphique, elles doivent s’implanter\n    sur l’indication graphique.\n    En l’absence de marge de recul figurant aux documents graphiques ou d’indication graphique, les\n    constructions doivent être édifiées à l’alignement des voies publiques ou/ et en limite des voies privées\n    et emprises publiques existantes, modifiées ou à créer.\n    Dispositions alternatives\n    Néanmoins une implantation différente est autorisée :\n    En retrait de l’alignement, de la limite de voie privée ou/ et de l’emprise publique sous réserve d’une\n    différenciation claire du domaine public et de l’emprise privée (revêtement de sol différent, espace vert).\n    Les niveaux en attique devront respecter un retrait minimum de 1,50 mètre par rapport à la façade des\n    étages inférieurs.\n    Lorsqu’une implantation sur marge de recul obligatoire, figure au document graphique, les constructions\n    doivent être implantées en limite de la marge de recul figurant au plan de zonage.\n    Les constructions sont autorisées en sous-sol des marges de recul.\n    3.2.    Implantation des constructions par rapport aux limites séparatives\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    64","UP\n    Règles générales d’implantation\n    Les constructions s’implanteront en limite ou en recul des limites séparatives. Dans ce cas, la distance\n    comptée horizontalement à tout point de l’élément de façade de la construction aux limites séparatives\n    devra être au moins égale à la moitié de la hauteur de cet élément de façade mesurée à partir du sol\n    naturel du fond voisin en limite séparative, sans pouvoir être inférieure à 2,5 mètres.\n    Soit L=H/2 minimum 2,5 mètres\n    Dispositions alternatives\n    Dans le cas d’un pignon aveugle existant en limite parcellaire, les constructions devront obligatoirement\n    s’y raccorder.\n    3.3.    Implantation des constructions par rapport aux autres constructions sur une même\n    propriété\n    L’implantation se fera à une distance égale à la moitié de la hauteur de l'élément de façade le plus haut,\n    avec un minimum de 4 mètres.\n    3.4.    Emprise au sol\n    Pour la détermination de l’emprise au sol autorisée, il devra être déduit de la superficie de l’unité\n    foncière les surfaces consacrées à des opérations de voirie publique (emplacement réservé pour\n    opération de voirie) ou privée.\n    Règles générales d’emprise\n    L’emprise au sol des bâtiments ne pourra excéder 70 % de la superficie du terrain.\n    Un complément d’emprise au sol de 30 % de la superficie du terrain est autorisée au rez-de-chaussée\n    des bâtiments lorsque celui-ci comporte des locaux destinés aux équipements d’intérêt collectif et\n    service public, aux commerces, à l’artisanat et à l’activité.\n    Dans ce cas, la projection au sol des niveaux situés au-dessus du rez-de-chaussée ne doit pas excéder\n    70 % de la superficie du terrain.\n    Dispositions alternatives\n    Il n’est pas fixé d’emprise au sol pour les équipements d’intérêt collectif et services publics.\n    3.5.    Hauteur des constructions\n    La hauteur maximum est de 28 mètres, hors équipements techniques, pour les constructions à\n    destination de bureaux.\n    La hauteur maximum est de 24 mètres pour les autres constructions, hors :\n    ▪    édicule technique, d’une hauteur de 3 mètres maximum, à condition qu’il soit intégré dans un\n    volume fermé et qu’il soit implanté en retrait des façades d’une distance au moins égale à sa\n    hauteur,\n    ▪    dispositifs techniques liés à la production d’énergie renouvelable dès lors qu’ils ne dépassent\n    pas une hauteur de 1,50 mètre, à condition qu’ils respectent les dispositions relatives aux\n    toitures de l’article 4.1 des dispositions communes à toutes les zones.\n    La hauteur maximum est augmentée de 2 mètres pour toutes les destinations, si le bâtiment accueille\n    en rez-de-chaussée des surfaces de plancher à destination commerciale, artisanale, d’activité ou des\n    installations nécessaires aux services publics ou d’intérêt collectif.\n    Ces hauteurs s’entendent hors garde-corps et ligne de vie.\n    En cas de terrain en pente, la hauteur est mesurée de la manière suivante (ce mode de calcul est\n    applicable dans les cas où la pente est supérieure à 2%) :\n    - Si le linéraire de façade est inférieur à 20 mètres, la hauteur est mesurée au milieu de la façade.\n    Si le linéraire de façade est supérieur à 20 mètres, il est divisé en sections dont aucune n’excédera 20\n    mètres, et la hauteur sera mesurée en fonction de la médiane de chaque section,\n    A l’emplacement figurant au document graphique sous la légende « zone de hauteur spécifique », la\n    hauteur maximum est portée à 32 mètres.\n    Les dispositions de cet article ne s’appliquent pas pour les constructions et installations nécessaires au\n    réseau de transport public du Grand Paris implantées en surface par des règles de hauteur qui ne\n    permettraient pas l’implantation du projet.\n    65","UP\n    Il n’est pas fixé de règle pour les installations et les ouvrages rendant accessibles les espaces publics\n    et les équipements d’intérêt collectif et services publics.\n    Article 4 – Qualité urbaine, architecturale, environnementale et\n    paysagère\n    4.1.    Caractéristiques des façades, des toitures et des clôtures\n    Voir dispositions communes à toutes les zones\n    Principes généraux\n    Les volumes doivent être simples et lisibles et favoriser des jeux de volumétrie, avec des épannelages\n    de hauteur et des attiques sur un ou deux niveaux.\n    Les façades et les pignons\n    Le choix des revêtements muraux de façade devra être limité à 4 composants maximum, hormis le\n    verre. Hormis le matériau de l’enduit, les matériaux utilisés devront être appliqués sur l’ensemble des\n    volumes (cela n’est pas exclusif des dispositions générales concernant les matériaux).\n    Le traitement des socles et des soubassements devra être soigné, les matériaux utilisés devront être\n    pérennes, résistants aux chocs et anti-graffitis.\n    Le socle et l’attique étant des entités à part entière, un matériau distinct de la façade pourra être utilisé\n    sur ceux-ci.\n    Toitures\n    Les toitures à deux versants sont interdites, à l’exception des volumes en attique en toiture où celles-\n    ci sont autorisées.\n    4.2.    Obligations en matière de performances énergétiques et environnementales\n    Tout nouveau bâtiment doit atteindre un niveau de performance énergétique équivalent a minima au\n    label Effinergie+.\n    Article 5 – Traitement environnemental et paysager des espaces non\n    bâtis et abords des constructions\n    5.1.    Traitement des espaces libres\n    Voir dispositions communes à toutes les zones\n    5.2.    Part minimale de surfaces non imperméabilisées\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Coefficient de Biotope = 10 % d’Espaces Verts de pleine terre (sauf en cas d’emprise au sol de 100%)\n    + 30 % d’Espaces Verts complémentaires.\n    En cas d’emprise au sol de 100%, il sera demandé un coefficient de biotope de 40% d’espaces verts\n    complémentaires.\n    Article 6 – Stationnement\n    Voir dispositio
