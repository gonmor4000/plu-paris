ntations (arbres et arbustes) ............................................. 200\n    4","Dispositions générales\n    1\n   Dispositions\n    générales\n    5","    Dispositions générales\nDispositions générales\nORGANISATION DU REGLEMENT\nLe territoire de la commune de Courbevoie est divisé en zones urbaines :\n    ▪   UA : Zone à caractère de centre urbain\n    ▪   UD : Zone de La Défense, comprenant 4 secteurs, à savoir UDa, UDb, UDc, UDd\n    ▪   UE : Zone de type pavillonnaire\n    ▪   UP : Zone de projet et de requalification urbaine\n    ▪   UV : Zone verte et d’équipements\nA chacune de ces zones délimitées au plan de zonage, s’applique un règlement défini dans les\ndispositions communes à toutes les zones (chapitre 2) et dans les dispositions spécifiques à chacune\ndes zones (chapitre 3).\nLe règlement comprend également des annexes précisant la liste des emplacements réservés,\nservitudes de localisation, des éléments de paysage, sites et secteurs à protéger pour des motifs d’ordre\nécologique ainsi que des éléments de patrimoine à protéger ou à mettre en valeur.\nDISPOSITIONS GRAPHIQUES\nLa partie graphique du règlement comprend plusieurs éléments :\n    - Limites de zones et de secteurs\n    - Emplacements réservés\n    - Servitudes de localisation\n    - Linéaires de commerces à préserver\n    - Éléments de paysage, sites et secteurs à protéger pour des motifs d’ordre écologique :\n    o Espaces verts protégés (E.V.P.)\n    o Espaces libres protégés (E.L.P.) existants ou à créer\n    o Espaces Libres à Végétaliser (E.L.V)\n    o Arbres remarquables\n    - Eléments de patrimoine bâti à protéger ou à mettre en valeur.\n    - Secteurs situés à moins de cinq cents mètres d'une gare ou d'une station de transport collectif\n    en site propre\n    - Plans masse des villas\n    - Marges de recul\n    - Périmètre de risque de l’établissement Enertherm\n    6","    Dispositions générales\nDISPOSITIONS REGLEMENTAIRES AU SEIN DES PERIMETRES SOUMIS A\nORIENTATION D’AMENAGEMENT ET DE PROGRAMMATION\nLes constructions, installations et aménagements projetés au sein de ces périmètres doivent être\ncompatibles avec les Orientations d’Aménagement et de Programmation (OAP) applicables.\nLes dispositions du règlement sont également applicables au sein des périmètres soumis à OAP. Il doit\nêtre fait une application cumulative des OAP et du règlement.\nA Courbevoie, 4 périmètres d’OAP ont été définis :\n    - Le Village Delage et ses abords\n    - Le Cœur de Ville\n    - La Défense\n    - Les rives de Seine\n    7","    Dispositions générales\nDEFINITIONS ET PRECISIONS SUR L’APPLICATION DES REGLES\nAccès\nL’accès est une ouverture sur la voie, qui peut comporter un passage privé, non ouvert à la circulation\npublique, situé sur l’emprise de la propriété ou aménagé sur fond voisin reliant la construction à la voie.\nIl peut être éventuellement obtenu par application de l’article 682 du Code Civil.\nAcrotère\nElément de la façade consistant en des rebords pleins situés au-dessus du niveau de la toiture et\npouvant faire office de garde-corps.\nAffouillement et exhaussement du sol\nRemblaiement de terrain qui doit faire l’objet d’une autorisation si sa superficie est supérieure à 100 m²\net si sa hauteur excède 2 mètres, à moins qu’il ne soit nécessaire à l’exécution d’une autorisation\nd’urbanisme.\nAire de stationnement aérienne\nIl s’agit d’une aire de stationnement située à l’air libre et non couverte.\nAlignement\nL’alignement est la limite du domaine public ou privé ou d’emprise publique au droit des propriétés\nriveraines. L’alignement de la voie à prendre en compte est celui projeté s’il existe une opération de\nvoirie ou un plan d’alignement approuvé sur ladite voie.\nAnnexe\nUne annexe est une construction secondaire, de dimensions réduites et inférieures à la construction\nprincipale, qui apporte un complément aux fonctionnalités de la construction principale. Elle doit être\nimplantée selon un éloignement restreint entre les deux constructions afin de marquer un lien d’usage.\n    8","    Dispositions générales\nElle peut être accolée ou non à la construction principale avec qui elle entretient un lien fonctionnel,\nsans disposer d’accès direct depuis la construction principale. L’annexe a la même destination que la\nconstruction principale.\nArbre à grand, moyen, et petit développement\nArbre à grand développement :\nEspèce d’arbre dont la hauteur atteint au moins 15 mètres à l’âge adulte. (Lorsque le règlement impose\nla plantation d’arbres à grand développement, leur tronc doit avoir, à 1 mètre au-dessus du sol, une\ncirconférence de 30-35 centimètres.).\nExemple : platane…\nArbre à moyen développement :\nEspèce d’arbre dont la hauteur atteint entre 8 et 15 mètres à l’âge adulte. (Lorsque le règlement impose\nla plantation d’arbres à moyen développement, leur tronc doit avoir, à 1 mètre au-dessus du sol, une\ncirconférence de 30-35 centimètres). Exemple : bouleau, erable…\nArbre à petit développement\nEspèce d’arbre dont la hauteur est inférieure à 8 mètres à l’âge adulte.\nExemple : Arbre de judée, cerisier à fleurs…\nArbre de haute tige\nArbre dont le tronc mesure plus de 1 mètres 80 de hauteur.\n    9","    Dispositions générales\nAttique\nDerniers niveaux d’une construction, en retrait par rapport au nu de façade des niveaux inférieurs.\nAuvent\nElément architectural en avancée d’une façade, non soutenu par des poteaux, couvrant un espace non\nclos.\nAxe de la voie\nL’axe de la voie est déterminée par la ligne médiane passant entre les deux alignements de la voie\n(aménagements compris). Dans le cas d’une voie publique, ces limites latérales sont constituées par\nl’alignement. L’axe de la voie à prendre en compte est celui projeté, s’il existe une opération de voirie\n(emplacement réservé aux voies et ouvrages publics) ou un plan d’alignement approuvé sur ladite voie.\nBaie principale\nBaie constituant l’éclairement principal d’une pièce principale. On appelle pièces principales les pièces\nde logement destinées au séjour, au bureau, au sommeil, ainsi que les pièces de travail des immeubles\nde bureaux et des locaux d’activité.\nBaie secondaire\nBaie destinée à l’éclairement des pièces secondaires ou principales (sous réserve que la pièce\nprincipale posséde aussi une ou des baies principales). On appelle pièces secondaires, les pièces\nautres que les pièces principales notamment les salles d’eau, salles de bains, cabinet d’aisance,\nbuanderie, débarras, dégagement, lingerie….\nBâtiment\nUn bâtiment est une construction couverte et close.\nCoefficient de biotope\nLe règlement impose de conserver une part minimale de surfaces non imperméabilisées, dite\n« écoaménageageable », afin de contribuer au maintien de la biodiversité et d’optimiser la gestion des\neaux pluviales. Le coefficient de biotope s’applique sur une surface de référence : l’unité foncière du\nprojet. Il est la résultante du coefficient d’espaces verts imposé en pleine terre, auquel s’ajoute le\ncoefficient d’espaces verts complémentaires dont la nature peut varier sur le projet (espaces verts sur\ndalle, murs ou toiture végétalisée, …).\nCoefficient de Biotope = % minimum en Espaces Verts de Pleine terre + % en Espaces verts\ncomplémentaires\n    Exemple en zones UA et UE :\n    10","    Dispositions générales\nConstruction\nUne construction est un ouvrage fixe et pérenne, comportant ou non des fondations et générant un\nespace utilisable par l’Homme en sous-sol ou en surface.\nConstruction existante\nUne construction est considérée comme existante si elle est reconnue comme légalement construite et\nsi la majorité des fondations ou des éléments hors fondations déterminant la résistance et la rigidité de\nl'ouvrage remplissent leurs fonctions. Une ruine ne peut pas être considérée comme une construction\nexistante.\nConstruction principale\nBâtiment ayant la fonction principale dans un ensemble de constructions.\nDalle\nLa dalle est le sol artificiel surélevé permettant des circulations séparées sur plusieurs niveaux.\nElément de façade\nOn définit par élément de façade toute partie de façade soit en décrochement d'au moins 80 cm par\nrapport à une autre partie de façade, soit formant un angle avec une autre partie de façade.\nEmprise au sol\nL’emprise au sol correspond à la projection verticale du volume de la construction, tous débords et\nsurplombs inclus. Toutefois, les ornements tels que les éléments de modénature, les marquises et les\nauvents sont exclus, ainsi que les débords de toiture lorsqu’ils ne sont pas soutenus par des poteaux\nou des encorbellements.\nL’emprise au sol comprend également les terrasses non couvertes qui présentent un volume construit\nd’une hauteur supérieure à 0,60m par rapport au terrain naturel.\n    11","    Dispositions générales\nEspace libre\nEspace non occupé par une construction située au-dessus du sol existant. Pour les secteurs situés au\nniveau de la dalle de la Défense, la dalle est considérée comme étant le niveau de référence.\nEspaces verts de pleine terre\nUn espace non construit ne peut être qualifié de « pleine terre » que s’il répond aux conditions\ncumulatives suivantes :\n- Son revêtement est perméable ;\n- Il peut recevoir des plantations.\nLes aires de stationnement et leurs accès sont exclus des surfaces de pleine terre. Les aires de\nstationnement végétalisées ne sont pas comptabilisées dans les espaces de pleine terre. Les parties\nde terrain en pleine terre ne peuvent supporter de constructions en sous-sol à l’exception du passage\néventuel de réseaux (électricité, téléphone, internet, eau potable, eaux usées ou pluviales) ;\nEspaces verts complémentaires\nLes espaces verts complémentaires sont des espaces dont la nature peut varier, selon les possibilités\nde végétalisation existantes sur chaque terrain. Les espaces verts complémentaires permettent de\nrépondre à la végétalisation de la parcelle et/ou du bâtiment de multiples façons, offrant plus de\nsouplesse dans les projets.\nEn fonction de la nature des espaces, des exigences minimales sont fixées notamment en fonction de\nl’épaisseur du substrat pour assurer la rétention/infiltration de l’eau à la parcelle et pour garantir un bon\npotentiel de stratification végétale davantage favorable à la biodiversité (strate herbacée, arbustive ou\narborée).\nLes espaces verts complémentaires pouvant être pris en compte dans le calcul du coefficient de Biotope\nsont les suivants :\n    • Espaces verts de pleine terre\n    • Espaces verts sur dalle d’une épaisseur de terre végétale supérieure ou égale à 60 cm\n    • Toitures végétalisées d’une épaisseur de terre supérieure ou égale à 30 cm\n    • Murs végétalisés\nExtension\nL’extension consiste en un agrandissement de la construction existante présentant des dimensions\ninférieures à celle-ci. L’extension peut être horizontale ou verticale (par surélévation, excavation ou\nagrandissement), et doit présenter un lien physique et fonctionnel avec la construction existante.\nFaçade\nLes façades d’un bâtiment ou d’une construction correspondent à l’ensemble de ses parois extérieures\nhors toiture. Elles intègrent tous les éléments structurels, tels que les baies, les bardages, les\nouvertures, l’isolation extérieure et les éléments de modénature.\nFaîtage\nLigne de jonction supérieure de deux pans de toiture inclinés suivant des pentes opposées.\nFoisonnement\nPhénomène selon lequel tous les usagers d’un parc de stationnement public ou privé ne stationnent\npas leur véhicule simultanément.\n    12","    Dispositions générales\nGabarit\nLe gabarit désigne l’ensemble des plans verticaux, horizontaux ou obliques constituant la forme\nextérieure de la construction. Il résulte de la combinaison des règles de hauteur, de prospects et\nd’emprise au sol.\nHauteur\nLa hauteur totale d’une construction, d’une façade, d’un élément de façade, ou d’une installation\ncorrespond à la différence de niveau entre son point le plus haut et son point le plus bas situé à sa\nverticale. Elle s’apprécie par rapport au niveau du terrain existant avant travaux, à la date de dépôt de\nla demande. Le point le plus haut à prendre comme référence correspond au faîtage de la construction,\nou au sommet de l’acrotère (sauf si celui-ci est prolongé pour faire office de garde-corps, auquel cas, la\nsur-hauteur de l’acrotère n’est pas comptée), dans le cas de toitures-terrasses.\nEn cas de terrain en pente, la hauteur est mesurée de la manière suivante (ce mode de calcul est\napplicable dans les cas où la pente est supérieure à 2%) :\n    - Si le linéraire de façade est inférieur à 20 mètres, la hauteur est mesurée au milieu de la façade\n    (voir schéma ci-après).\n    - Si le linéraire de façade est supérieur à 20 mètres, il est divisé en sections dont aucune\n    n’excédera 20 mètres, et la hauteur sera mesurée en fonction de la médiane de chaque section,\nEn cas de surélévation de constructions existantes, la hauteur maximale est calculée selon les mêmes\ndispositions.\nCas des terrains en pente\nLimites séparatives\nLes limites séparatives correspondent aux limites entre le terrain d’assiette de la construction, constitué\nd’une ou plusieurs unités foncières, et le ou les terrains contigus. Elles peuvent être distinguées en deux\ntypes : les limites latérales et les limites de fond de terrain. En sont exclues les limites de l’unité foncière\npar rapport aux voies et emprises publiques.\nLimites séparatives latérales\nLes limites séparatives latérales sont les limites du terrain qui aboutissent directement à la voie, soit en\nligne droite, soit selon une ligne brisée (décrochements, coudes).\nLimites de fond de parcelle\nLa limite de fond de parcelle correspond à la limite autre que l’alignement et les limites séparatives\nlatérales. Un terrain d’angle n’a pas de limite de fond mais une ou des limites séparatives latérales.\nPour les terrains de forme quadrilatère, est dénommée fond de parcelle, la limite du terrain opposée à\ncelle par laquelle s’effectue l’accès principal à la construction. Dans les autres cas, le fond de parcelle\nest constitué par la limite opposée la plus éloignée de celle supportant cet accès principal, à l’exception\ndes terrains de forme triangulaire pour lesquels il n’y a pas de fond de parcelle.\n    13","    Dispositions générales\nLocal accessoire\nLe local accessoire fait soit partie intégrante d’une construction principale, soit il en constitue une\nannexe, soit une extension. Il est indissociable du fonctionnement de la construction principale.\nLogements locatifs sociaux\nLes logements locatifs sociaux retenus pour l'application du présent article sont :\n1° Les logements locatifs appartenant aux organismes d'habitation à loyer modéré, à l'exception, en\nmétropole, de ceux construits, ou acquis et améliorés à compter du 5 janvier 1977 et ne faisant pas\nl'objet d'une convention définie à l'article L. 351-2 ;\n2° Les autres logements conventionnés dans les conditions définies à l'article L. 351-2 et dont l'accès\nest soumis à des conditions de ressources ;\n[…]\n4° Les logements ou les lits des logements-foyers de personnes âgées, de personnes handicapées, de\njeunes travailleurs, de travailleurs migrants et des logements-foyers dénommés résidences sociales,\nconventionnés dans les conditions définies au 5° de l'article L. 351-2 ainsi que les places des centres\nd'hébergement et de réinsertion sociale et des centres d'accueil pour demandeurs d'asile mentionnés,\nrespectivement, aux articles L. 345-1 et L. 348-1 du code de l'action sociale et des familles. Les lits des\nlogements-foyers et les places des centres d'hébergement et de réinsertion sociale et des centres\nd'accueil pour demandeurs d'asile sont pris en compte dans des conditions fixées par décret. Dans les\nfoyers d'hébergement et les foyers de vie destinés aux personnes handicapées mentales, les chambres\noccupées par ces personnes sont comptabilisées comme autant de logements locatifs sociaux dès lors\nqu'elles disposent d'un élément de vie indépendante défini par décret ;\n5° Les terrains locatifs familiaux en état de service, dans des conditions fixées par décret, destinés à\nl'installation prolongée de résidences mobiles dont la réalisation est prévue au schéma départemental\nd'accueil des gens du voyage et qui sont aménagés et implantés dans les conditions prévues à l'article\nL. 444-1 du code de l'urbanisme ;\n6° Les logements du parc privé faisant l'objet d'un dispositif d'intermédiation locative qui sont loués à un\norganisme agréé en application de l'article L. 365-4 du présent code pour exercer des activités\nd'intermédiation locative et de gestion locative sociale en vue de leur sous-location, meublée ou non, à\ndes personnes mentionnées au II de l'article L. 301-1, sous réserve que le loyer pratiqué au mètre carré\npar l'association soit inférieur ou égal à un montant défini par arrêté du ministre chargé du logement.\nMatériaux biosourcés\nLes matériaux biosourcés sont les matériaux issus de la biomasse d’origine végétale ou animale dont\nl’utilisation permet de limiter l’empreinte écologique de la construction, comme par exemple :\n    - Isolants (laines de fibres végétales ou animales, de textile recyclé, ouate de cellulose,\n    chènevotte, anas, bottes de paille, etc.),\n    - Mortiers et bétons (béton de chanvre, de bois, de lin, etc.),\n    - Panneaux (particules ou fibres végétales, paille compressée, etc.),\n    - Matériaux composites plastiques (matrices, renforts, charges), par exemple.\nMur pignon\nMur perpendiculaire à la façade principale.\n    14","    Dispositions générales\nOpération d’aménagement d’ensemble\nUne opération d’aménagement d’ensemble peut concerner une demande de permis groupé sur\nplusieurs propriétés, un permis d’aménager par lotissement, une ZAC (zone d’aménagement concerté),\nune AFU (association foncière urbaine), du moment que cela concerne l’ensemble du secteur sur lequel\nle PLU impose l’aménagement d’ensemble.\nPartie de la surélévation non conforme / partie de l’extension non conforme\nPartie de la surélévation non conforme :\nPartie de l’extension non conforme :\nPlaces doubles ou dites commandées\nPlaces de stationnement placées l’une derrière l’autre.\nLes places « commandées » nécessitent le déplacement d’un autre véhicule pour être accessibles.\nPropriété / unité foncière\nLot de propriété d’un seul tenant composé d’une parcelle ou d’un ensemble de parcelles contiguës\nappartenant à un même propriétaire ou à la même indivision.\nN.B. : Deux propriétés appartenant à un même propriétaire situées de part et d'autre d'une voie publique\nconstituent deux propriétés.\nRez-de-chaussée actif\n    15","    Dispositions générales\nLes linéaires de rez-de-chaussée actifs repérés au sein du document graphique représentent les\npolarités commerciales participant au rayonnement de Courbevoie.\nSaillie\nOn appelle saillie toute partie ou élément de construction qui dépasse le plan de façade d’une\nconstruction.\nSaillie fermée\nLes saillies fermées sont des avants corps totalement clos pouvant comporter des baies, comme des\noriels ou Bow-windows.\nSurface de plancher\nLa surface de plancher de la construction est égale à la somme des surfaces de plancher de chaque\nniveau clos et couvert, calculée à partir du nu intérieur des façades après déduction :\n    ▪   Des surfaces correspondant à l'épaisseur des murs entourant les embrasures des portes et\n    fenêtres donnant sur l'extérieur ;\n    ▪   Des vides et des trémies afférentes aux escaliers et ascenseurs ;\n    ▪   Des surfaces de plancher d'une hauteur sous plafond inférieure ou égale à 1,80 mètre ;\n    ▪   Des surfaces de plancher aménagées en vue du stationnement des véhicules motorisés ou\n    non, y compris les rampes d'accès et les aires de manœuvres ;\n    ▪   Des surfaces de plancher des combles non aménageables pour l'habitation ou pour des\n    activités à caractère professionnel, artisanal, industriel ou commercial ;\n    ▪   Des surfaces de plancher des locaux techniques nécessaires au fonctionnement d'un groupe\n    de bâtiments ou d'un immeuble autre qu'une maison individuelle au sens de l'article L. 231-1\n    du code de la construction et de l'habitation, y compris les locaux de stockage des déchets ;\n    ▪   Des surfaces de plancher des caves ou des celliers, annexes à des logements, dès lors que\n    ces locaux sont desservis uniquement par une partie commune ;\n    ▪   D'une surface égale à 10 % des surfaces de plancher affectées à l'habitation telles qu'elles\n    résultent le cas échéant de l'application des alinéas précédents, dès lors que les logements\n    sont desservis par des parties communes intérieures.\nStation de transports collectifs\nGare SNCF, gare RER, station de tramway ou de métro (existantes et projetées).\nToiture végétalisée semi-intensive ou intensive\nUne toiture végétalisée correspond à une toiture recouverte de végétation. Elle peut être qualifiée\nd’intensive ou semi-intensive en fonction de l’épaisseur de terre et du type de plantations :\n    • Végétalisation semi-intensive :\n    o Epaisseur de terre de 12 à 30 cm,\n    o Plantations : sédums, graminées, vivaces ;\n    • Végétalisation intensive :\n    o Epaisseur de terre minimum : 30 cm,\n    o Plantations ; herbacées, arbustes, arbres.\nVoie publique ou privée et emprise publique\nEspaces de circulation publique ou privée, desservant plusieurs propriétés, comportant des\naménagements nécessaires à toute circulation en fonction du mode de déplacement envisagé\n(véhicules à moteur, piétons…) et les fossés, espaces verts et talus la bordant. Sont également\nassimilables à des voies au sens du présent règlement les voies à conserver, à créer et à modifier\n    16","    Dispositions générales\nidentifiées au document graphique ou résultant d’un emplacement réservé ou d’une servitude de\nlocalisation pour voirie.\nL’emprise publique correspond aux espaces extérieurs ouverts au public, relevant du domaine public\net qui ne répondent pas à la notion de voie, ni d’équipement public.\nLa dalle de La défense est une emprise publique.\n    17"," Dispositions communes\n    2\nDispositions\ncommunes à\n  toutes les\n    zones\n    18","    Dispositions communes\nDispositions communes à toutes\nles zones\nReconstruction après sinistre\nLa reconstruction à l’identique d’un bâtiment détruit par sinistre depuis moins de deux ans est autorisée\nnonobstant toute disposition d’urbanisme contraire, sauf si un plan de prévention des risques naturels\nprévisibles en dispose autrement, dès lors que ledit bâtiment a été régulièrement édifié.\nDESTINATION DES CONSTRUCTIONS, USAGES DES SOLS ET NATURES\nD’ACTIVITE\n    Article 1 : Interdiction et limitation de certains usages et affectations\n    des sols, constructions et activités\nDans toutes les zones, hormis la zone UE, les constructions et installations nécessaires au réseau de\ntransport public du Grand Paris sont autorisées.\n1.1. Destinations et sous-destinations\nLe décret n° 2015-1783 du 28 décembre 2015 a conduit à une redéfinition des destinations des\nconstructions avec la création de sous-destinations. Les articles 1.1 et 1.2 de chaque zone précisent\nles destinations et sous destinations autorisées ou soumises à conditions. Le tableau ci-dessous permet\nde les définir plus précisément.\n    Destinations    Sous-destinations    Définitions (arrêté du 10 novembre 2016)\n Exploitation    Constructions destinées à l'exercice d'une activité\n agricole    et    agricole ou pastorale.\n forestière    Exploitation agricole    Cette sous-destination recouvre notamment les\n    constructions destinées au logement du matériel, des\n    animaux et des récoltes\n    Constructions et les entrepôts notamment de\n    Exploitation\n    stockage du bois, des véhicules et des machines\n    forestière\n    permettant l'exploitation forestière\n Habitation    Constructions destinées au logement principal,\n    secondaire ou occasionnel des ménages à l'exclusion\n    Logement\n    des hébergements couverts par la sous-destination «\n    hébergement ».\n    Constructions destinées à l'hébergement dans des\n    résidences ou foyers avec service. Maisons de\n    Hébergement\n    retraite, les résidences universitaires, les foyers de\n    travailleurs et les résidences autonomie.\n Commerce    et    Constructions commerciales destinées à la\n activités    de    présentation et vente de bien directe à une clientèle\n service    Artisanat et    ainsi que les constructions artisanales destinées\n    commerce de détail    principalement à la vente de biens ou services\n    (boulangerie, pharmacie, boucherie, bijouterie,\n    poissonnerie, tabac,prêt-à-porter etc.).\n    19","    Dispositions communes\n   Destinations    Sous-destinations    Définitions (arrêté du 10 novembre 2016)\n    Constructions destinées à la restauration ouverte à la\n    Restauration    vente directe pour une clientèle commerciale\n    (restaurant, snack etc.).\n    Constructions destinées à la présentation et la vente\n    Commerce de gros    de biens pour une clientèle professionnelle (grossiste,\n    fournisseur etc.).\n    Constructions destinées à l'accueil d'une clientèle\n    pour la conclusion directe de contrat de vente de\n    Activité de service où\n    services ou de prestation de services et\n    s'effectue l'accueil\n    accessoirement la présentation de biens (agences\n    d'une clientèle\n    bancaires, agences immobilières, cabinet de\n    médecin, coiffeur, location de véhicules, etc.).\n    Constructions destinées à l'hébergement temporaire\n    Hébergement hôtelier\n    de courte ou moyenne durée proposant un service\n    et touristique\n    commercial (hôtel, auberge de jeunesse, gîte etc.).\n    Construction répondant à la définition d'établissement\n    de spectacles cinématographiques mentionnée à\n    Cinéma\n    l'article L. 212-1 du code du cinéma et de l'image\n    animée accueillant une clientèle commerciale.\nÉquipements    Constructions destinées à assurer une mission de\nd’intérêt collectif    service public. Ces constructions peuvent être\n    Locaux et bureaux\net services publics    fermées au public ou ne prévoir qu'un accueil limité\n    accueillant du public\n    du public. Cette sous-destination comprend\n    des administrations\n    notamment les constructions de l'État, des\n    publiques et\n    collectivités territoriales, de leurs groupements ainsi\n    assimilés\n    que les constructions des autres personnes morales\n    investies d'une mission de service public.\n    Constructions des équipements collectifs de nature\n    technique ou industrielle. Cette sous-destination\n    Locaux techniques et\n    comprend notamment les constructions techniques\n    industriels des\n    nécessaires au fonctionnement des services publics,\n    administrations\n    les constructions techniques conçues spécialement\n    publiques et\n    pour le fonctionnement de réseaux ou de services\n    assimilés\n    urbains, les constructions industrielles concourant à\n    la production d'énergie.\n    Équipements d'intérêts collectifs destinés à\n    Établissements    l'enseignement ainsi que les établissements destinés\n    d'enseignement, de    à la petite enfance, les équipements d'intérêts\n    santé et d'action    collectifs hospitaliers, les équipements collectifs\n    sociale    accueillant des services sociaux, d'assistance,\n    d'orientation et autres services similaires.\n    Constructions destinées aux activités créatives,\n    Salles d'art et de\n    artistiques et de spectacle, musées et autres activités\n    spectacles\n    culturelles d'intérêt collectif.\n    Équipements d'intérêts collectifs destinés à l'exercice\n    d'une activité sportive. Cette sous-destination\n    Équipements sportifs\n    comprend notamment les stades, les gymnases ainsi\n    que les piscines ouvertes au public.\n    20","    Dispositions communes\n   Destinations    Sous-destinations    Définitions (arrêté du 10 novembre 2016)\n    Équipements collectifs destinées à accueillir du public\n    afin de satisfaire un besoin collectif ne répondant à\n    aucune autre sous-destination définie au sein de la\n    Autres équipements\n    destination « Équipement d'intérêt collectif et services\n    recevant du public\n    publics    ».    Cette   sous-destination    recouvre\n    notamment les lieux de culte, les salles polyvalentes,\n    les aires d'accueil des gens du voyage.\nAutres    activités    Constructions destinées à l'activité extractive et\ndes    secteurs    manufacturière du secteur primaire, les constructions\nsecondaire    ou    destinées à l'activité industrielle du secteur\ntertiaire    secondaire ainsi que les constructions artisanales du\n    Industrie\n    secteur de la construction ou de l'industrie. Cette\n    sous-destination recouvre notamment les activités de\n    production, de construction ou de réparation\n    susceptibles de générer des nuisances.\n    Constructions destinées au stockage des biens ou à\n    Entrepôt\n    la logistique.\n    Constructions destinées aux activités de direction et\n    Bureau    de gestion des entreprises des secteurs primaires,\n    secondaires et tertiaires.\n    Centre de congrès et   Constructions destinées à l'événementiel polyvalent,\n    d'exposition    l'organisation de salons et forums à titre payant.\n    21","    Dispositions communes\n    Article 2 : Mixité fonctionnelle et sociale\n2.1. Linéaires de protection du commerce et de l’artisanat\nDans les rez-de-chaussée sur rue des constructions neuves situées en bordure des voies repérées au\ndocument graphique linéaires de rez-de-chaussée actifs, sont interdites toutes les sous-destinations\nhormis celles énoncées ci-après :\n    • Artisanat et commerce de détail ;\n    • Restauration ;\n    • Activités de service ou s’effectue l’accueil d’une clientèle ;\n    • Hébergement hôtelier et touristique ;\n    • Cinéma ;\n    • Salles d’art et de spectacles ;\n    • Locaux et bureaux accueillant du public des administrations publiques assimilées ;\n    • Etablissements d’enseignement, de santé et d’action sociale ;\n    • Autres équipements recevant du public ;\n    • Centre de congrès et d’exposition.\n    • Bureaux, pour ce qui est des fonctions d’accès aux immeubles de bureaux, à leurs sous-sols et\n    surfaces de support associées à ces fonctions : uniquement en zone UD.\nDe même, dans les constructions existantes situées en bordure des voies repérées au document\ngraphique comme linéaires de rez-de-chaussée actifs, les travaux autres que d’accessibilité, d’hygiène,\nd’isolation phonique ou thermique ou de sécurité, de nature à transformer la surface des activités\nautorisées à rez-de-chaussée sur rue en toutes autres destinations que les sous-destinations évoquées\nprécédemment sont interdits.\nCes dispositions ne s’appliquent pas aux parties de ces constructions correspondant aux accès aux\nétages et aux accès aux sous-sols.\nLa hauteur des rez-de-chaussée repérés au document graphique comme linéaires de rez-de-chaussée\nactifs devra présenter une hauteur de 3,50 minimum.\nCertaines sous-destinations sont interdites au sein de secteurs particuliers, représentés au sein du plan\ndes Périmètres de Sauvegarde du Commerce et de l’Artisanat :\n    ▪   Dans les secteurs verts délimités dans les prescriptions graphiques (préservation des\n    commerces et des services), les activités de restauration\n    ▪   Dans les secteurs rouges délimités dans les prescriptions graphiques (préservation du\n    commerce et de la restauration), les activités de services où s’effectue l’accueil d’une clientèle\n    ▪   Dans les secteurs bleus délimités dans les prescriptions graphiques (préservation renforcée\n    du commerce et de l’artisanat), les activités de services où s’effectue l’accueil d’une clientèle\n    et la restauration.\nEn bordure des voies repérées aux documents graphiques comme linéaires de rez-de-chaussée actifs,\nun complément d’emprise au sol de 30 % de la superficie du terrain est autorisé en rez-de-chaussée\npour les locaux destinés au commerce et à l’artisanat. Lorsque cette règle aboutit à une emprise au sol\nde 100%, alors l’imposition de pleine terre résultant de l’application du coefficient de biotope ne\ns’applique pas.\n    22","    Dispositions communes\nEn bordure des voies repérées aux documents graphiques comme linéaires de rez-de-chaussée actif,\nune sur-hauteur de 1 m est accordée pour les locaux destinés au commerce et à l’artisanat.\n2.2. Diversité de l’habitat et mixité sociale\nEn cas de réalisation d’un programme de logements comportant plus de 15 logements, 30 % au moins\ndes logements de ce programme doivent être affectés à des logements locatifs sociaux et 10 % à des\nlogements intermédiaires.\nDans le respect des autres règles du PLU, dans les zones UA, UD et dans le secteur de la zone UP\ncompris entre l’avenue Léonard de Vinci, la rue Berthelot, le boulevard de la Mission Marchand, la rue\ndes Fauvelles et la limite communale avec Nanterre, la réalisation de programmes de logements\ncomportant des logements locatifs sociaux au sens de l’article L. 302-5 du code de la construction et de\nl’habitation bénéficie d’une majoration du volume constructible tel qu’il frésulte des règles relatives au\ngabarit, à la hauteur, à l’emprise au sol. Cette majoration ne peut excéder 50% et, pour chaque\nopération, elle ne peut être supérieure au rapport entre le nombre de logements locatifs sociaux et le\nnombre total des logements de l’opération.\n    23","    Dispositions communes\nCARACTERISTIQUES    URBAINES,    ARCHITECTURALES,\nENVIRONNEMENTALES ET PAYSAGERES\n    Article 3 - Volumétrie et implantation des constructions\n3.1.    Implantation des constructions par rapport aux voies et emprises publiques\n    Ouvrages en saillie\nEn zones UA, UE, UP et UV, les saillies sur alignement ou limite de voie privée (balcons) par rapport\nau nu de la façade sont autorisées à condition qu’elles ne dépassent pas 0,80 mètres de profondeur et\nqu’elles soient situées au moins à 5,00 mètres au-dessus du sol.\nLes saillies sur marges de recul figurant aux documents graphiques sont autorisées à condition qu’elles\nne dépassent pas 2 mètres de large et qu’elles soient situées au moins à 5,00 mètres au-dessus du sol.\nRappel : les saillies sur l’alignement doivent faire l’objet d’une autorisation à solliciter auprès du\ngestionnaire de la voie.\nDans toutes les zones, hormis la zone UE, les constructions et installations nécessaires au réseau de\ntransport public du Grand Paris peuvent s’implanter à l’alignement ou respecter un retrait d’1 mètre au\nminimum, afin de ne pas contraindre l’implantation des éléments du projet en surface par des normes\nde retrait qui ne seraient pas compatibles avec les spécificités techniques de l’infrastructure de\ntransport.\n3.2.    Implantation des constructions par rapport aux limites séparatives\nDans toutes les zones, hormis la zone UE, les constructions et installations nécessaires au réseau de\ntransport public du Grand Paris peuvent s’implanter en limites séparatives ou respecter un retrait d’1\nmètre au minimum, afin de ne pas contraindre l’implantation des éléments du projet en surface par des\nnormes de retrait qui ne seraient pas compatibles avec les spécificités techniques de l’infrastructure de\ntransport.\n    24","    Dispositions communes\n    Article 4 – Qualité urbaine, architecturale, environnementale et\n    paysagère\n4.1.    Caractéristiques des façades, des toitures et des clôtures\n    Principes généraux\nTout projet peut être refusé ou n’être accordé que sous réserve de l’observation de prescriptions\nparticulières si les constructions ou utilisations du sol concerné, par leur architecture, leurs dimensions,\nleur gabarit ou l’aspect extérieur des bâtiments notamment en matière de matériaux ou de couleurs\nemployés, ou ouvrages à édifier ou modifier, sont de nature à porter atteinte au caractère ou à l’intérêt\ndes lieux avoisinants, aux sites, aux paysages, ainsi qu’à la conservation des perspectives.\nPar leur échelle, leur composition et leur volumétrie, les annexes et les extensions feront référence à la\ntypologie architecturale du bâti principal auquel ils s’adjoignent, tout en pouvant revêtir un caractère\ncontemporain. Le volume général de l’extension devra laisser clairement lire le volume d’origine du bâti\nprincipal existant, sans l’écraser.\nLes dispositifs techniques tels que panneaux solaires ou photovoltaïques, antennes, chauffe-eau\nsolaires, etc. devront présenter une parfaite insertion avec la construction.\nA titre d‘information, une charte architecturale ainsi qu’une charte des devantures commerciales, que la\nVille a souhaité élaborer en parallèle, viendront illustrer et compléter ces principes réglementaires.\n    Les matériaux\nLes matériaux employés doivent contribuer à l’expression architecturale des constructions à édifier.\nL’emploi de matériaux à durée de vie limitée, difficilement réparables ou remplaçables sera proscrit, au\nmême titre que les couleurs dénotant fortement avec la gamme utilisée au sein de l’environnement\nimmédiat des constructions.\nLa mise en oeuvre doit garantir dans le temps une bonne tenue. Aucun matériau fabriqué en vue d’être\nrecouvert d’un parement ou d’un enduit ne pourra être laissé apparent.\nA l’exception de la zone UD et des constructions à usage de bureau, le parement pierre naturelle ou\nbrique sera privilégié sur les façades et pignons au minimum sur 60% de la façade.\n    Les façades et les pignons\nLes façades visibles d’une voie ou d’un espace public comportant au moins quatre niveaux doivent se\ncomposer d’un soubassement, d’un corps d’étage et d’un couronnement (attique ou toiture).\nCes façades et pignons doivent avoir l’aspect de matériaux nobles tels que pierre ou similaire, brique\nde parement, verre, zinc prépatiné, métal, etc …. Un autre aspect peut s'y adjoindre éventuellement à\ncondition de ne concerner que des éléments mineurs de la façade ou pour permettre un traitement\nvégétalisé dans une composition harmonieuse.\nLes descentes d’eau pluviale doivent être intégrées dans la composition de la façade. Les rejets d’eau\npluviale des balcons, loggias et terrasses devront être canalisés de façon à éviter toute salissure des\nfaçades. Ces rejets seront collectés sur l’unité foncière de la construction, hors domaine public.\nLes câbles de toute nature (électricité, téléphone, télévision...) et les éléments techniques divers\n(descentes d’eau, caissons de volets roulants, climatiseurs...), lorsqu’ils sont installés sur les façades,\ndoivent être masqués ou intégrés à celles-ci de façon discrète et harmonieuse. Les antennes\nparaboliques sont proscrites en façades sur voies.\nLes façades et pignons non visibles d'une voie ou d'un espace public doivent être traités en harmonie\navec les façades indiquées ci-dessus.\nLa création de pignon aveugle doit être en règle générale évitée.\nLes portes d’accès aux parc de stationnements, les sas ouverts ainsi que les entrées piétonnes doivent\ncomporter une fermeture dans le plan de la façade, sauf impossibilité manifeste liée à des impératifs\ntechniques de sécurité. Leur traitement doit bénéficier d’un soin particulier de mise en valeur, que ce\nsoit au niveau des matériaux (aspect bois, métal laqué…) que de par son écriture architecturale. Elles\ndoivent avoir, sur une même façade, une similitude d’aspect.\nLes équipements d’intérêt collectif et services publics ne sont pas soumis à la règle de composition de\nfaçades définie au premier paragraphe.\n   Les devantures\nLes compositions des devantures doivent tenir compte de la composition architecturale de la façade.\nLa symétrie éventuelle d’une façade d’immeuble devra être retrouvée dans la composition de la\ndevanture.\n    25","    Dispositions communes\nLorsqu’une même devanture s’étend sur plusieurs façades distinctes, elle doit être décomposée en\nautant de séquences.\nLes devantures dépassant la hauteur du rez-de-chaussée sont proscrites, sauf lorsque cela correspond\nà une typologie caractéristique de la rue ou à la composition architecturale de l’édifice.\nLes rideaux de sécurité des vitrines doivent être placés du côté intérieur de celles-ci. Sont proscrits les\nrideaux opaques, sauf impératifs particuliers de sécurité.\nLes coffres et grilles de fermeture des façades commerciales ne doivent pas présenter de saillie en\nfaçade. Le choix du système de protection doit maintenir les transparences visuelles, sous réserve de\nnécessités liées à la sécurité.\n    Les toitures\nLe traitement des toitures doit être de qualité. Tout élément en toiture fera l’objet d’un traitement\narchitectural soigné et devra être traité en harmonie (rythme des baies de toiture, proportions) avec les\nfaçades sur lesquelles elles s’intègrent.\nLes couvertures apparentes présentant l'aspect de la tôle ondulée, du bac acier ou du papier goudronné\nsont interdites.\nLes surélévations des conduits de fumée des bâtiments voisins rendues nécessaires par une\nconstruction nouvelle doivent faire l’objet d’un traitement architectural approprié. Les cheminées doivent\nêtre traitées avec les matériaux et couleurs en harmonie avec ceux de la construction.\nLes toitures terrasses non accessibles doivent faire l’objet d’une végétalisation en dehors des surfaces\ndédiées aux édicules techniques et autres équipements de performance environnementale (capteurs\nsolaires, panneaux voltaïques, agriculture urbaine, récupération des eaux pluviales…). Une épaisseur\nde substrat de 30 cm est recommandée afin de permettre une végétalisation multistrates (herbacée et\narbustive). Dans la zone UP, cette épaisseur minimale est imposée.\nLes panneaux solaires ou photovoltaïques doivent être intégrés dans la composition architecturale\nd’ensemble de la construction. Ils sont proscrits sur les bâtiments protégés ou ceux formant une\nséquence de volumétrie existante à protéger.\nLes antennes d’émission ou de réception de signaux radioélectriques (radios, radiotéléphones,\ntélévisions, paraboles, etc….) doivent être implantées en partie supérieure des bâtiments et en retrait\ndes façades. Elles ne doivent pas être visibles depuis l’espace public.\n    Les clôtures (hors zone UD)\nLorsqu’il est procédé à l’édification de clôtures, celles-ci :\n    26","    Dispositions communes\n    ▪    sur les voies publiques, auront une hauteur totale comprise entre 2 m et 2,20 m. Elles\n    pourront comporter une partie pleine au maximum sur 1/3 de la hauteur. Une hauteur\n    différente pourra être acceptée ou exigée, pour assurer une meilleure continuité avec les\n    clôtures voisines qui seraient de hauteur normale pour le quartier.\n    ▪    en limite séparative, elles auront une hauteur maximum :\n    o    de 1,90 mètre par rapport au terrain le plus haut si la différence de hauteur entre les\n    deux terrains est supérieure ou égale à 0,60 mètre.\n    o    de 2,50 mètres par rapport au terrain le plus bas si la différence de hauteur entre les\n    deux terrains est inférieure à 0,60 mètre.\nCes dispositions ne sont pas applicables aux constructions et installations nécessaires au réseau de\ntransport public du Grand Paris.\n   La restauration et l’extension des bâtiments existants\n   ▪    L’architecture et la volumétrie des constructions anciennes ou présentant un intérêt architectural\n    doivent être respectées lors de ravalement ou de réhabilitation.\n   ▪    La création de nouveau percements doit s’intégrer dans la composition des façades (reprise\n    des proportions, du rythme et des éléments de modénature).\n   ▪    La réfection de toiture doit respecter le style de la construction existante.\n   ▪    Les ravalements seront réalisés dans le respect de l’architecture, avec l’objectif de conserver,\n    restaurer, mettre en valeur ou restituer les dispositions originelles et les modénatures des\n    façades.\n   ▪    Les ravalements doivent être exécutés en respectant les matériaux d’origine des façades (les\n    revêtements en ciment gris ainsi que la peinture de la pierre de taille et des briques y sont\n    interdits). Ils doivent être exécutés sur toute la façade y compris les délaissés de pignons, de\n    manière à respecter l’homogénéité de la composition de la façade.\n   ▪    Les murs en pierre de taille ou brique prévues pour être apparents doivent être préservés et\n    valorisés :\n    ▪    Pierre de taille :\n    -    La pierre de taille, qu’elle soit utilisée en parement ou réservée à certains éléments de\n    façades (encadrements des baies, chaînages, bandeaux, corniches…), ne doit pas être\n    couverte d’enduit ou de peinture. Cependant, si elle est très dégradée ou de très\n    médiocre facture, un enduit compatible avec la pierre est admis.\n    -    Lorsque la pierre de taille est actuellement enduite, cet enduit peut être conservé et\n    restauré. S’il s’agit d’un enduit de plâtre présentant une modénature de qualité, il doit être\n    conservé et restauré. Dans le cas où la remise en état d’un enduit très dégradé ne\n    pourrait se faire qu’à la faveur d’une réfection complète, cet enduit doit être supprimé afin\n    de faire réapparaître la pierre.\n    -    Lorsque la pierre de taille est actuellement peinte, cette peinture doit être supprimée afin\n    de faire réapparaître la pierre. Le procédé de nettoyage retenu ne doit en aucune manière\n    endommager la pierre.\n    -    Les pierres endommagées ne peuvent être remplacées que par des pierres de même\n    nature ou au moins de même aspect.\n    -    Les joints, de teinte claire, doivent être réalisés au nu de la pierre, sauf si un autre type\n    de joint se justifie historiquement.\n    27","    Dispositions communes\n    ▪    Brique\n    -   La brique, qu’elle soit utilisée en parement ou réservée à certains éléments de façades\n    (encadrements des baies, chaînages…), ne doit pas être couverte d’enduit ou de\n    peinture. Cependant, si elle est très dégradée ou de très médiocre facture, un enduit\n    compatible avec la brique est admis.\n    -   Lorsque la brique est actuellement enduite, cet enduit peut être conservé et restauré. S’il\n    s’agit d’un enduit de plâtre présentant une modénature de qualité, il doit être conservé et\n    restauré. Dans le cas où la remise en état d’un enduit très dégradé ne pourrait se faire\n    qu’à la faveur d’une réfection complète, cet enduit doit être supprimé afin de faire\n    réapparaître la brique.\n    -   Lorsque la brique est actuellement peinte (ne comprend pas les badigeons et laits de\n    chaux colorés, qui doivent être ravivés), cette peinture doit être supprimée afin de faire\n    réapparaître la brique. Le procédé de nettoyage retenu ne doit en aucune manière\n    endommager la brique.\n    -   Les briques endommagées ne peuvent être remplacées que par des briques de même\n    aspect.\n    -   Les joints, de teinte claire, doivent être réalisés au nu de la brique, sauf si un autre type\n    de joint se justifie historiquement.\n4.2. Bâtiments remarquables\nIdentifiés au plan de zonage, au titre de l’article L 151-19 du code de l’urbanisme, les bâtiments\nremarquables sont répertoriés en tant qu’ « éléments de paysage […] quartiers, îlots, immeubles bâtis\nou non bâtis, espaces publics, monuments, sites et secteurs à protéger, à conserver, à mettre en valeur\nou à requalifier pour des motifs d'ordre culturel, historique ou architectural ».\nL’annexe II du présent règlement « Liste des éléments de paysage à protéger » dresse la liste des\nadresses des immeubles ou îlots concernés, leur correspondance par rapport au document graphique\nainsi que la catégorie de protection qui s’y applique :\n    ▪ bâtiment protégé: seuls les travaux d’entretien, de restauration ou visant à améliorer les\n    conditions d’accessibilité, d’habitabilité ou de sécurité sont autorisés, à condition qu’ils\n    respectent la stricte volumétrie de la construction existante. La démolition ne peut être autorisée\n    que dans des cas exceptionnels liés à de graves impératifs de sécurité ou si elle concerne des\n    adjonction ou annexe sans qualité et postérieures à l’état d’origine, ou à un état ultérieur\n    constitutif de leur intérêt patrimonial. Des interventions pourront être autorisées si elles ont pour\n    objet de restituer un volume, un dispositif, ou un décor ancien disparu. Ces restitutions ou\n    extensions devront être étayées par une documentation fiable (documents d’archives\n    notamment). Les projets d’extension pourront toutefois être autorisés, s’ils ne dénaturent pas\n    le bâtiment initial, et au cas par cas, selon la configuration des lieux. Ils devront alors privilégier\n    les solutions non visibles de l’espace public et devront présenter une bonne intégration par\n    rapport au bâti existant afin de ne pas nuire à sa valeur patrimoniale.\n    28","    Dispositions communes\n    ▪   élément particulier protégé : en cas de travaux réalisés sur l’immeuble concerné, tout élément\n    particulier protégé doit être protégé, restauré, mis en valeur ou reconstitué pour être intégré au\n    mieux au nouvel ensemble bâti.\n    ▪   volumétrie existante à conserver : la volumétrie de l’immeuble ou de l’ensemble d’immeubles\n    existants doit être conservée dans ses caractéristiques générales, afin que soit pérennisée,\n    selon le cas, une organisation remarquable du bâti sur un terrain, une séquence homogène en\n    bordure de voie ou une singularité intéressante dans le paysage urbain. Des interventions\n    pourront être autorisées si elles ont pour objet de restituer un volume, un dispositif, ou un décor\n    ancien disparu ; ces restitutions devront être étayées par une documentation fiable (documents\n    d’archives notamment) et s’avérer souhaitables pour la mise en valeur de la construction. Les\n    extensions sont autorisées dans la mesure où elles s’inscrivent pleinement dans le style\n    d’origine du bâtiment. Les projets d’extension pourront toutefois être autorisés, s’ils ne\n    dénaturent pas le bâtiment initial et au cas par cas, selon la configuration des lieux. Ils devront\n    alors privilégier les solutions non visibles de l’espace public et prendre toutes les mesures pour\n    garantir leur bonne intégration par rapport au bâti existant et ne pas nuire à sa valeur\n    patrimoniale.\n4.3. Villas, impasses et passages\nIdentifiés au plan de zonage et faisant l’objet de documents graphiques spécifiques (4.3.2 à 4.3.7), les\nvillas, impasses et passages sont répertoriés en tant qu’ « éléments de paysage […] quartiers, îlots,\nimmeubles bâtis ou non bâtis, espaces publics, monuments, sites et secteurs à protéger, à conserver,\nà mettre en valeur ou à requalifier pour des motifs d'ordre culturel, historique ou architectural ». L’annexe\nII du présent règlement « Liste des éléments de paysage à protéger » dresse la liste des adresses des\nîlots concernés.\nEn plus des règles figurant dans les dispositions applicables aux zones urbaines et dans les pièces\ngraphiques, ces îlots sont concernés par des règles spécifiques.\n4.4.    Obligations en matière de performances énergétiques et environnementales\n    Performance énergétique\nLes travaux de réhabilitation des constructions existantes doivent permettre une amélioration\nsignificative des performances énergétiques des bâtiments.\nPour les constructions neuves, il est recommandé la réalisation d’un maximum de logements\ndoublement exposés et présentant une majorité de pièces de vie exposées au sud.\nA l’intérieur des marges de recul et de retrait imposés par rapport aux voies et limites séparatives,\nl’installation de dispositifs d’isolation thermique extérieure est autorisée à la condition qu’ils n’excèdent\npas 30 cm d’épaisseur par rapport au nu de la façade des constructions. Sur les façades édifiée à\nl’alignement, les dispositifs d’isolation peuvent présenter une saillie de 10 cm maximum. Pour les\nconstructions existantes, ces dépassements sont exclus du calcul de l’emprise au sol.\nLa mise en œuvre d’une isolation par surélévation des toitures des constructions existantes est\nautorisée dans la limite d’un dépassement de 30 cm de la hauteur maximale autorisée dans la zone\nconcernée.\nLa surépaisseur ou la surélévation doit être adaptée au mode constructif et aux caractéristiques\ntechniques et architecturales de la façade ou de la toiture et ne doit pas porter atteinte à la qualité\narchitecturale du bâtiment et à son insertion dans le cadre bâti environnant.\nLes dispositifs nécessaires à l'utilisation des énergies renouvelables, tels que les capteurs d’énergie\nsolaire peuvent s’implanter au-delà de la hauteur maximale fixée, à condition :\n    - de ne pas dépasser 1 m de plus que la hauteur autorisée dans toutes les zones et 3 m dans la\n    zone UD et UP,\n    - et d’être implantés à 3,00 m minimum en arrière de la verticale de la façade sur rue,\n    - et sous réserve d’une intégration particulièrement soignée.\nRéseau de chaleur\n    - Pour toute nouvelle construction desservie par un réseau de chaleur de source renouvelable\n    ou de récupération, le raccordement est encouragé.\n    - Dans le cas contraire, il est recommandé de prévoir le raccordement ultérieur des nouvelles\n    constructions à un réseau de chaleur en réservant une partie de l’assiette des projets suffisante\n    pour la création des édifices techniques associés (sous-stations).\n    29","    Dispositions communes\n    Performance environnementale globale\nPour les constructions neuves, les surfaces de toitures terrasses doivent être fonctionnalisées en\nmettant en place, au choix, les solutions suivantes :\n    - Exploitation d’énergies renouvelables (panneaux solaires ou photovoltaïque, petit éolien\n    domestique…) ;\n    - Agriculture urbaine (jardin potager, ruche…) ;\n    - Végétalisation dans un objectif écologique et/ou d’agrément ;\n    - Récupération et/ou rétention des eaux pluviales.\nPour les constructions neuves, l’installation d’appareils hydro-économes permettant de limiter la\npression ou le débit des points d’eau est recommandée.\nL’utilisation de matériaux biosourcés, locaux et issus de filières durables est privilégiée.\nLes constructions neuves tiennent compte, dans la composition urbaine, des nuisances sonores\nimportantes de part et d’autre des infrastructures de transport et privilégient des fronts urbains, dans le\nrespect des règles de prospect, permettant de dégager des coeurs d’îlots apaisés.\n    Article 5 – Traitement environnemental et paysager des espaces non\n    bâtis et abords des constructions\n5.1.    Traitement des espaces libres\nDans toutes les zones, hormis la zone UE, l’emprise au sol des constructions pourra être de 100 % pour\nles constructions et installations nécessaires au réseau de transport public du Grand Paris, afin de tenir\ncompte des contraintes techniques d’insertion des éléments du projet en surface en leur permettant\nd’occuper toute la surface de l’unité foncière sur laquelle ils seront implantés.\nL’article L. 151-23-al.1 du Code de l’urbanisme permet, dans le cadre du PLU : « d’identifier et de\nlocaliser les éléments de paysage et délimiter les sites et secteurs à protéger pour des motifs d'ordre\nécologique, notamment pour la préservation, le maintien ou la remise en état des continuités\nécologiques et définir, le cas échéant, les prescriptions de nature à assurer leur préservation. Lorsqu'il\ns'agit d'espaces boisés, ces prescriptions sont celles prévues aux articles L. 113-2 et L. 421-4. Il peut\nlocaliser, dans les zones urbaines, les terrains cultivés et les espaces non bâtis nécessaires au maintien\ndes continuités écologiques à protéger et inconstructibles quels que soient les équipements qui, le cas\néchéant, les desservent.”.\nDans le présent PLU, il s’agit des éléments suivants :\n   - Espaces verts protégés (EVP)\n   - Espaces libres protégés existants ou à créer (ELP)\n   - Espaces Libres à Végétaliser (E.L.V)\n   - Arbres remarquables\n    Espaces verts protégés (EVP)\nIls sont répertoriés à l’annexe II du présent règlement intitulée «Liste des éléments de paysage à\nprotéger» ainsi que sur le document graphique n°4.2. Cette annexe dresse la liste des espaces verts\nconcernés et leur correspondance par rapport au document graphique :\nEst admise la modification de l’E.V.P. aux conditions suivantes :\n    1. elle restitue sur un espace contiguë la superficie protégée indiquée sur la fiche de l’annexe n°7,\n    (épaisseur de terre végétale de plus de 80 cm).\n    2. elle ne diminue pas la surface d’E.V.P. en pleine terre,\n    3. elle maintient ou améliore l’unité générale de l’E.V.P. ,\n    4. elle maintient ou améliore la qualité de l’E.V.P. et met en valeur ses plantations, qu’elles soient\n    conservées ou remplacées.\nPour l’application des conditions 1 et 2 :\n    - certains éléments minéraux ou à dominante minérale peuvent être considérés comme partie\n    intégrante de l’E.V.P. s’ils participent, par leur nature, leur caractère ou leur traitement, à\n    l’aménagement paysager de l’espace (allée piétonne, voies d’accès aux services de secours,\n    éléments décoratifs, emmarchements, etc.). De même, le revêtement de surfaces d’E.V.P. est\n    admis s’il est nécessité par la fonction des espaces concernés et s’il ne porte pas atteinte au\n    développement des plantations existantes.\n    30","    Dispositions communes\n    -    même si elles sont végétalisées, les dalles de couverture de constructions nouvelles en sous-\n    sol, les aires de stationnement de surface, les trémies d’accès à des locaux en sous-sol et les\n    cours anglaises ne sont pas comptées dans la superficie de l’E.V.P.\nIl peut être imposé d’ouvrir ou de maintenir ouvert à la vue des usagers du domaine public un E.V.P.\nbordant la voie par une clôture de qualité adaptée à cet usage.\nLa disparition ou l’altération - accidentelle ou intentionnelle - des arbres situés dans un E.V.P. ne peut\nen aucun cas déqualifier l’espace et l’exonérer de la prescription qui s’y applique.\nLes arbres existants et les plantations nouvelles doivent bénéficier des conditions nécessaires à leur\ndéveloppement normal (choix des essences, distances aux constructions, espacement des sujets entre\neux, profondeur et qualité de la terre).\nLe choix des essences pour les plantations nouvelles s’appuiera sur l’annexe II relative aux\n« dispositions applicables aux plantations (arbres et arbustes) » du présent réglement .\nN.B : pour information, Le parc de Bécon est un site classé au titre de la protection des sites et\nmonuments naturels (cf. annexe 7.a.1)\nLes conditions 1, 2, 3 et 4 ne s’appliquent pas aux ouvrages à créer (tels que les bouches d’aération,\nles puits de ventilations, les puits de secours, etc.) nécessaires au réseau de transport public du Grand\nParis, ainsi qu’aux emprises chantier et aux installations classées pour la protection de l’environnement\ntemporaires nécessaires à leur réalisation.\n    Espaces libres protégés existants ou à créer (ELP)\nMajoritairement végétalisés, ils sont répertoriés à l’annexe II du présent règlement intitulée «Liste des\néléments de paysage à protéger», ainsi que sur le document graphique n°4.2 Cette annexe dresse la\nliste des espaces libres, existants ou à créer, concernés et leur correspondance par rapport au\ndocument graphique.\nEst admise la modification de l’E.L.P. aux conditions suivantes :\n1 - elle restitue sur un espace contiguë la superficie protégée indiquée sur la fiche de l’annexe n°7.\n2 - elle maintient ou améliore la qualité et l’unité générale de l’E.L.P.\nLe choix des essences pour les plantations nouvelles s’appuiera sur l’annexe II relative aux\n« dispositions applicables aux plantations (arbres et arbustes) du présent réglement ».\n    Espaces Libres à Végétaliser (E.L.V)\nLe document graphique spécifique n°4.2 délimite, en bordure de voie ou à l’intérieur des terrains, des\nEspaces Libres à Végétaliser, en application de L. 151-23-al.1 du Code de l’urbanisme, pour améliorer\nla qualité du paysage urbain.\nLa modification de l’état d’un terrain grevé d’une prescription d’E.L.V est soumise aux conditions\nsuivantes :\n- Aucune construction ou installation n’est admise dans l’emprise de l’E.L.V, ni en élévation ni en sous-\nsol. Toutefois, la réalisation d’escaliers ou d’autres ouvrages d’accès aux bâtiments peut y être admise\npour des motifs d’accessibilité, d’hygiène ou de sécurité. Le surplomb de l’E.L.V par des ouvrages en\nsaillie (balcons, marquises, etc.) est admis.\n- L’espace délimité au document graphique spécifique n°4.2 doit être mis en valeur par des éléments\nvégétaux appropriés à sa géométrie, sa situation et son environnement (arbres, arbustes, écrans\nvégétaux, parterres, etc.). Les arbres et arbustes doivent bénéficier des conditions nécessaires à leur\ndéveloppement normal (choix des essences, distance aux constructions, espacement des sujets entre\neux, profondeur et qualité de la terre). Les arbres doivent être conservés s’ils sont en bon état\nphytosanitaire.\nLe choix des essences pour les plantations nouvelles s’appuiera sur l’annexe II relative aux\n« dispositions applicables aux plantations (arbres et arbustes) du présent réglement ».\n    Arbres remarquables\nIls sont répertoriés à l’annexe II du présent règlement intitulée «Liste des éléments de paysage à\nprotéger », ainsi que sur le document graphique n°4.2.\nCette annexe dresse la liste des arbres remarquables concernés, leurs caractéristiques ainsi que leur\nlocalisation.\nIl convient de protéger ces arbres par les mesures ci-dessous :\n1 - Abattage :\nLeur abattage ne peut être autorisé que dans des cas exceptionnels liés à de graves impératifs de\nsécurité.\n2 - Instauration d’un périmètre de protection autour de l’arbre :\n    31","    Dispositions communes\n    -   Pour les arbres matures :\n    Le périmètre de protection correspond à l’emprise du cercle dont la circonférence est celle de\n    l’envergure de l’arbre et dont le centre du tronc de l’arbre est pris au niveau du sol. La zone de\n    protection est donc définie par un cercle qui correspond à l’aplomb des branches extérieures\n    de la ramure.\n    -   Pour les arbres n’ayant pas atteint leur plein développement :\n    Le périmètre de protection est défini selon un cercle de rayon supérieur de 30 % au rayon du\n    cercle formé par la ramure.\n3 - Périmètre de protection en cas de construction de parkings souterrains ou de sous-sols à proximité\nde l’arbre :\nTout creusement de sous-sol de parking souterrain est interdit dans un rayon de 20 m autour de l’arbre,\nque celui-ci soit situé ou non sur le terrain objet de l’autorisation d’urbansisme.\n4 - Périmètre de protection en cas de division de terrain :\nDans un rayon de 20 m autour du tronc de l’arbre, toute division volontaire, en propriété ou en jouissance\nd’une propriété foncière, par ventes ou locations simultanées ou successives est susceptible d’être\nsoumise à déclaration préalable, en cas de délibération du Conseil Municipal, en application de l’article\nL. 115-3 du Code de l’Urbanisme.\nRecommandations :\n- Il serait souhaitable qu’un document spécifique réalisé par un géomètre expert au 1/500ème ou au\n1/200ème situe les limites séparatives et les troncs des arbres, et représente les projections au sol des\nramures ainsi que les zones de servitude.\n- Action de taille ou d’élagage :\nIl est recommandé qu’aucune action de taille ou d’élagage, même réduite à quelques branches, ne soit\nentreprise sur la ramure, pour quelque motif que ce soit, sans recueillir préalablement l’avis de la\nCommune.\nDans le cas où l’intervention d’un praticien s’imposerait pour des prestations de taille ou de soins\nparticuliers après accord de la Ville et rédaction des prescriptions par un arboriste conseil, le maître\nd’oeuvre devrait alors recourir exclusivement à un entrepreneur spécialiste de la taille raisonnée.\n- Mesures de protection des arbres situés dans l’emprise d’un chantier :\nLors de travaux à proximité d’un arbre, il serait conseillé de mettre en place, dès le démarrage du\nchantier et pour toute sa durée, une palissade jointive autour du sujet, d’au minimum deux mètres de\nhauteur, à l’aplomb des branches extérieures, délimitant la zone de protection.\nRappel : En application des dispositions figurant à l’alinéa h) de l’article R 421-23 du Code de\nl’Urbanisme, tous travaux ayant pour effet de modifier ou supprimer l’un de ces éléments doivent faire\nl’objet d’une déclaration préalable.\n5.2.    Part minimale de surfaces non imperméabilisées\n    Coefficient de biotope\nArticle L.151-22 du Code de l’Urbanisme :\n« Le règlement peut imposer une part minimale de surfaces non imperméabilisées ou éco-\naménageables, éventuellement pondérées en fonction de leur nature, afin de contribuer au maintien de\nla biodiversité et de la nature en ville. »\nLe coefficient de biotope décrit la proportion des surfaces favorables à la biodiversité (surfaces éco-\naménageables) par rapport à la surface totale de l’unité foncière. Il permet de s’assurer globalement\nde la qualité d’un projet, en réponse à plusieurs enjeux : amélioration du microclimat, infiltration des\neaux pluviales et alimentation de la nappe phréatique, création et valorisation d’espace vital pour la\nfaune et la flore.\n    Coeff. De Biotope\n    = surfaces éco aménageables / surface de la parcelle\n    = % d’Espaces Verts de Pleine Terre + % d’Espaces Verts complémentaires\nIl s’agit de prévoir une part minimale de surfaces non imperméabilisées ou éco-aménageables, de\ndifférentes natures, afin de contribuer au maintien de la biodiversité et de la nature en ville.\nEn fonction de la nature des espaces, des exigences minimales sont fixées notamment en fonction de\nl’épaisseur du substrat pour assurer la rétention/infiltration de l’eau à la parcelle et pour garantir un bon\npotentiel de stratification végétale davantage favorable à la biodiversité (strate herbacée, arbustive ou\narborée).\n    32","    Dispositions communes\nLes espaces verts complémentaires pouvant être pris en compte dans le calcul du coefficient de Biotope\nsont les suivants :\n    • Espaces verts de pleine terre ;\n    • Espaces verts sur dalle d’une épaisseur de terre végétale supérieure ou égale à 60cm ;\n    • Toitures végétalisées d’une épaisseur de terre supérieure ou égale à 30 cm ;\n    • Murs végétalisés.\nConcernant les cas particulier des secteurs existants fortement minéralisés, ne respectant pas les règles\ninitialement, il s’agira de ne pas aggraver la non-conformité.\n    Traitement et plantation des espaces libres\nLe choix des essences pour les plantations nouvelles s’appuiera sur l’annexe II relative aux\n« dispositions applicables aux plantations (arbres et arbustes) du présent réglement ».\n- Le traitement des espaces libres* doit favoriser leur perméabilité aux précipitations et l’infiltration sur\nplace des eaux de ruissellement, excepté sur les surfaces qui nécessitent pour des raisons\nfonctionnelles ou de stabilité du sous-sol un revêtement minéral.\n- L’affouillement et l’exhaussement du sol ne sont admis que s’ils contribuent à l’amélioration de\nl’environnement et de l’aspect paysager.\n- Les espaces libres* doivent recevoir des plantations de qualité, mises en œuvre conformément aux\nmodalités énoncées ci-après, excepté sur les surfaces qui nécessitent pour des raisons fonctionnelles\nun revêtement minéral.\nLes espaces libres devront être plantés à minimum d’un arbre à grand développement* par tranche de\n200m² de superficie d’espaces verts de pleine terre.\nLes arbres doivent être plantés dans des conditions leur permettant de se développer normalement :\n- arbres à grand développement* : les sujets choisis parmi des espèces atteignant au moins 15 m à\nl’âge adulte, nécessitent une surface minimale d’espace libre de 100 m² dont 20 m² de pleine terre\nrépartis régulièrement autour du tronc. A titre indicatif sont conseillées les distances moyennes\nsuivantes : 6 à 8 m en tous sens entre les arbres, 8 à 10 m entre les arbres et les façades des\nconstructions.\nSi le contexte spatial ne permet pas la plantation d’un arbre de grand développement dans des\nconditions lui permettant de se développer normalement, il pourra être remplacé par un arbre à moyen*\nou à petit développement*.\n- arbres à moyen développement* : les sujets choisis parmi des espèces atteignant de 8 à 15 m à l’âge\nadulte, nécessitent une superficie minimale d’espace libre de 50 m², dont 15 m² de pleine terre répartis\nrégulièrement autour du tronc. A titre indicatif sont conseillées les distances moyennes suivantes : 4 à\n5 m en tous sens entre les arbres, 5 à 7 m entre les arbres et les façades des constructions.\n- arbres à petit développement* : les sujets choisis parmi des espèces atteignant une hauteur maximale\nde 8 m à l’âge adulte, nécessitent une surface minimale d’espace libre de 20 m² dont 10 m² de pleine\nterre répartis régulièrement autour du tronc.\n    Végétalisation des marges de recul figurant au plan\nLes marges de recul, après déduction des emprises aménagées pour l’accès aux bâtiments, devront\nêtre traitées pour 100 % au moins de leur superficie en espace vert planté d’arbres avec un minimum\nd’un arbre à grand développement par tranche de 100m² de superficie d’espaces verts\n    Espaces paysagers au niveau dalle\nTout projet d’implantation au niveau dalle* entraîne l’obligation de traiter des espaces paysagers comme\nsuit :\n- Les dalles créées par les constructions nouvelles doivent être végétalisées pour au moins 50 % de\nleur superficie. Il sera planté sur cette superficie un minimum d’un arbre à petit développement par\ntranche de 200 m² de la surface à végétaliser. L’épaisseur de terre végétale doit atteindre au minimum\n1 m pour les arbres à petit développement, 0,50 m pour la végétation arbustive et les aires\nengazonnées, non compris la couche drainante.\n- Les espaces libres à aménager sur les dalles existantes seront traités de manière à assurer une\ncontinuité et une cohérence des espaces non bâtis répartis sur l’ensemble de la dalle. Ils devront\nbénéficier d’un traitement de qualité pouvant associer aux plantations des surfaces engazonnées et des\nrevêtements de sols soignés dans leur aspect et le choix des matériaux (circulations de desserte, aires\nd’évolution, cheminements piétons).\n- Tant sur les dalles créées qu’existantes, la superficie des surfaces engazonnées ne pourra pas\nreprésenter plus d’un tiers de la totalité de la surface à végétaliser.\n    33","    Dispositions communes\n    Autre\nIl n’est pas fixé de règle pour les équipements d’intérêt collectif et services publics.\n    Article 6 – Stationnement\n6.1. Modalités d’application des normes de stationnement\nLes surfaces mentionnées ci-après correspondent à des surfaces de plancher.\nPour le calcul du nombre de places de stationnement réglementairement exigé, le nombre total de\nplaces exigible est arrondi à l’unité inférieure si la première décimale n’excède pas 5 et à l’unité\nsupérieure si la première décimale est égale ou excède 5.\nLorsqu’une opération comporte plusieurs destinations, le nombre d’emplacements de stationnement\ndoit correspondre à la somme des résultats issus du mode de calcul approprié à chacune des\ndestinations et appliqué à leur surface de plancher respective.\nDès lors que le nombre de places de stationnement demandé est exprimé en fonction de la surface de\nplancher, toute tranche commencée donne lieu à l’application de la norme.\nLorsque les surfaces de stationnement sont données en pourcentage de la S.D.P., le nombre de places\nde stationnement est donné par la division de ces surfaces par 28 m².\n    Dérogations aux obligations de stationnement\nLorsque le règlement impose la réalisation d'aires de stationnement pour les véhicules motorisés,\ncelles-ci peuvent être réalisées sur l’unité foncière ou dans son environnement immédiat.\nLorsque le bénéficiaire du permis ou de la décision de non-opposition à une déclaration préalable ne\npeut pas satisfaire aux obligations résultant des règles de l’article 6, il peut être tenu quitte de ces\nobligations en justifiant, pour les places qu'il ne peut réaliser lui-même, soit de l'obtention d'une\nconcession à long terme dans un parc public de stationnement existant ou en cours de réalisation et\nsitué à proximité de l'opération, soit de l'acquisition ou de la concession de places dans un parc privé\nde stationnement répondant aux mêmes conditions.\nLorsqu'une aire de stationnement a été prise en compte dans le cadre d'une concession à long terme\nou d'un parc privé de stationnement, au titre des obligations prévues ci-dessus, elle ne peut plus être\nprise en compte, en tout ou en partie, à l'occasion d'une nouvelle autorisation.\nL’obligation de réaliser des aires de stationnement n’est pas applicable aux travaux de transformation\nou d’amélioration de bâtiments affectés à des logements locatifs financés avec un prêt aidé de l’Etat, y\ncompris dans le cas où ces travaux s’accompagnent de la création de surface de plancher, dans la\nlimite d’un plafond de 50 % de la surface de plancher existant avant le commencement des travaux.\n    Travaux pour une construction existante n’impliquant ni changement de destination ni création de\n    surface de plancher\nLa réalisation de nouveaux emplacements de stationnement n’est pas exigée. Toutefois, en cas de\ndivision de logements, doivent être crées les places afférentes au nombre supplémentaire de logements\nen application des normes chiffrées définies ci-dessous.\n    Travaux portant sur une construction existante sans création de surface de plancher mais\n    impliquant un changement de destination\nLe nombre de places de stationnement exigé correspondra aux places supplémentaires générées par\nle changement de destination en application des normes chiffrées définies ci-dessous, en tenant compte\ndu nombre de places existantes.\n    Travaux portant sur une construction existante avec changement de destination et/ou création de\n    surface de plancher\nLe nombre de places de stationnement exigé correspondra aux places supplémentaires générées par\nle changement de destination et/ou la création de surface de plancher en application des normes\nchiffrées définies ci-dessous.\nCes dispositions ne sont pas applicables aux extensions et surélévations de locaux d’habitation\ninférieures ou égales à 25 m2 de S.D.P ou en cas d’extension d’un seul logement.\n    Dans le cadre d’une opération d’aménagement d’ensemble\nLes places de stationnement peuvent être réalisées de manière groupée à l’intérieur du périmètre et\nselon les phases de l’opération.\n    34","    Dispositions communes\n    Mutualisation du stationnement\nLes normes précitées peuvent être réduites si les places de stationnement correspondent à des\noccupations mutualisées. La réduction sera déterminée sur la base du gain de place obtenu grâce au\nfoisonnement des usages : dans le cadre d’une opération comportant des destinations et activités\ndifférentes utilisant des places de stationnement de manière non simultanée, il sera tenu compte du\nfoisonnement, c’est-à-dire de la complémentarité d’usage pour établir le nombre global de places exigé.\nCe gain doit être adapté et suffisant au regard des besoins, de l’occupation alternée des places par les\nusagers fréquentant les différents programmes desservis, d’une gestion mutualisée et banalisée de ces\nplaces.\nLe nombre de places à réaliser doit néanmoins être au moins égal à celui correspondant à la catégorie\ndes locaux générant le plus de places de stationnement suivant les normes définies ci-dessous.\n6.2. Caractéristiques des aires de stationnement\nLors de toute opération, il devra être réalisé des aires de stationnement dont les caractéristiques sont\ndéfinies ci-après :\n Dimension des places pour le stationnement des voitures :\n Longueur    5,00 m\n Largeur    2,30 m, la largeur étant portée à 2,50 m si la place\n    jouxte un obstacle (mur, poteau,…)\n Dégagement    5,50 m\n Dimension des places pour le stationnement des deux-roues motorisés :\n Longueur    2,30 m\n Largeur    1,20 m\n Dégagement    2,80 m\n Rampes d’accès\n Sens unique    3,50 m\n Double sens desservant jusqu’à 30 voitures    3,50 m\n Double sens desservant plus de 30 voitures    6,00 m\nCes rampes ne doivent pas entraîner de modification de l’altimétrie du trottoir.\nLeur pente dans les 5 premiers mètres à partir de l'alignement ne doit pas excéder 5 %, sauf dans le\ncas d'impossibilité technique.\nLeur rayon de courbure intérieur ne doit pas être inférieur à 5,00 m,.\n6.3. Nombre de places à réaliser pour les véhicules motorisés\nSauf mention contraire, ces normes sont des minimum/maximum à réaliser et s’entendent deux-roues\nmotorisées inclus.\n Habitations\n Logements sociaux    1 place par logement\n Autres logements    1 place par logement\n Logements sociaux à moins de 500 m d’une 0,5 place/logement minimum\n station de transports collectifs\n Autres logements à moins de 500 m d’une station 0,8 place/logement minimum\n de transports collectifs\n Hébergement y compris hébergement social    1 place / 10 chambres ou logements\n Commerces et activités de service (hors zone UV)\n Commerces inférieurs à 300 m²    Non réglementé\n Commerces entre 300 m² et 2 000 m²    60% de la S.D.P avec minimum 1 place\n    + aire de livraison à partir de 300 m² SDP\n Commerces de plus de 2 000 m²    80% de la S.D.P\n    + places de livraison (100 m² minimum)\n Artisanat    En zone UA : 30 % de la SDP, ce quota ne\n    s’appliquant pas aux surfaces inférieures à 300\n    m²\n    En zone UP : 1 place pour 200 m² de SDP\n    35","    Dispositions communes\n    Pour les surfaces commerciales et artisanales\n    dont la S.D.P. n’excède pas et du fonctionnement des établissements, de leur situation géographique\net de leurs utilisateurs.\nL’accès aux parkings pour les constructions à destination de bureaux sera conçu de façon indépendante\ndu bâtiment afin de faciliter leur utilisation par des usagers externes à celui-ci en vue de leur\nmutualisation.\nSpécifiquement en zone UV :\nLa délivrance du permis de construire sera subordonnée à la réalisation d’installations propres à assurer\nle stationnement hors des voies publiques, des véhicules correspondant aux besoins de l’immeuble à\nconstruire.\nTous les stationnements des futures constructions devront être intégrés dans le volume des\nconstructions. Ces dispositions ne s’appliquent pas aux constructions et installations du réseau de\ntransport public du Grand Paris.\n    36","    Dispositions communes\n    Dispositions particulières\nLes quotas de stationnement ci-dessus sont divisés par 2 pour tous les projets de construction autres\nque ceux destinés à l’habitation ou aux bureaux, dont le terrain d’assiette est en tout ou partie situé\ndans un rayon de 500 mètres autour des sorties des stations de transports collectifs.\nLes places doubles ne sont autorisées que pour les parcs de stationnement liés à un immeuble\nd'habitation et à condition que le nombre de places de stationnement directement accessibles, c’est-à-\ndire non commandé, soit au moins égal au nombre de logements.\n    Dispositions qualitatives\nL’ensemble des places exigibles devront être réalisées soit en sous-sol, soit être intégrées dans le\nvolume de la construction, à l’exception des constructions de moins de 2 logements, pour lesquelles un\nmaximum de 2 places en surface est autorisé.\nLes entrées de parking des bâtiments devront être réalisées au niveau de la voirie, afin d’être les plus\ndiscrètes possibles. La création de rampes visibles depuis les espaces publics extérieurs est exclue\nsauf impossibilité technique.\n    Véhicules hybrides ou électriques\nRappel du Code de la
