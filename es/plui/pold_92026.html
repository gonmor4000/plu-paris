ns communes à toutes les zones\n    Pour les équipements d’intérêt collectif et services publics, la superficie à réserver au stationnement\n    doit tenir compte de la nature et du fonctionnement des établissements, de leur situation géographique\n    et de leurs utilisateurs.\n    L’accès aux parkings pour les constructions à destination de bureaux sera conçu de façon indépendante\n    du bâtiment afin de faciliter leur utilisation par des usagers externes à celui-ci, en vue de leur\n    mutualisation.\n    66","UP\n    EQUIPEMENT ET RESEAUX\n    Article 7 – Desserte par les voies publiques ou privées\n    Voir dispositions communes à toutes les zones\n    Article 8 - Desserte par les réseaux\n    Voir dispositions communes à toutes les zones\n    67","UV\n    Zone UV\n    DESTINATION DES CONSTRUCTIONS, USAGES DES SOLS ET NATURES\n    D’ACTIVITE\n    Article 1 - Interdiction et limitation de certains usages et affectation\n    des sols, constructions et activités\n    1.1. Usages et affectations des sols, types d’activités, destinations et sous-destinations interdits\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Sont interdites :\n    Les installations classées pour la protection de l’environnement soumises à la directive européenne\n    96/82/CE du 9 décembre 1996 ou présentant un danger grave ou des risques d’insalubrité pour le\n    voisinage, à l’exception de celles autorisées à l’article 1.2.\n    Les occupations ou installations non visées à l’article 1.2.\n    A l’intérieur du périmètre de danger figurant au document graphique autour de la centrale Enertherm,\n    tous projets de construction ou d’aménagement destinés à recevoir du public sont interdits.\n    Dispositions supplémentaires applicables dans les zones à risques relevant de la maîtrise de\n    l’urbanisation et concernant l’établissement Enertherm :\n    ▪   A l’intérieur du périmètre d’interdiction stricte : toute nouvelle construction est interdite à\n    l’exception d’installations industrielles directement en lien avec l’activité à l’origine des\n    risques.\n    ▪   A l’intérieur du périmètre d’interdiction : toute nouvelle construction est interdite à\n    l’exception d’installations industrielles directement en lien avec l’activité à l’origine des\n    risques, d’aménagement et d’extensions d’installations existantes ou de nouvelles\n    installations classées soumises à autorisation compatibles avec cet environnement\n    (notamment au regard des effets dominos et de la gestion des situations d’urgence).\n    ▪   La construction d’infrastructures de transport peut être autorisée uniquement pour les\n    fonctions de desserte de la zone industrielle.\n    1.2. Types d’activités, destinations et sous-destinations autorisés sous conditions\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Règles générales applicables à toute la zone hormis les berges de Seine :\n    Les constructions et installations, ainsi que les travaux divers de quelque nature que ce soit, à\n    l’exception des travaux d’accessibilité, d’hygiène, d’isolation phonique ou thermique ou de sécurité, sont\n    admis lorsqu’il s’agit de :\n    68","UV\n    ▪    Équipements d’intérêt collectif et services publics ;\n    ▪    reconstructions, extensions, rénovations et modernisations de constructions, installations et\n    ouvrages existants à la date d'approbation du PLU et notamment les interventions visant à\n    améliorer leur accès, desserte, sécurité ou fonctionnalité ;\n    ▪    constructions, installations et ouvrages permettant l’exercice d’activités conformes au\n    caractère de la zone ou en relation avec la nature et le caractère des espaces ou des\n    équipements qu’ils supportent ;\n    ▪    locaux et installations techniques nécessaires au fonctionnement, à la sécurité ou à l’entretien\n    des espaces, constructions, installations et ouvrages situés dans la zone ;\n    ▪    constructions à usage d’habitation destinées aux personnes dont la présence permanente\n    est nécessaire pour assurer la surveillance et le gardiennage des espaces, constructions,\n    installations et ouvrages situés dans la zone.\n    ▪    Commerces et activités de service\n    ▪    Les installations classées pour la protection de l’environnement nécessaires à la réalisation\n    de la ligne 15 ouest du Grand Paris Express.\n    Dispositions supplémentaires applicables dans les zones à risques relevant de la maîtrise de\n    l’urbanisation et concernant l’établissement Enertherm :\n    ▪    A l’intérieur de la zone de restriction (cf. document graphique) : L’aménagement ou\n    l’extension de constructions existantes sont possibles. L’autorisation de nouvelles\n    constructions est possible sous réserve de ne pas augmenter la population exposée. Les\n    changements de destination doivent être réglementés dans le même cadre.\n    ▪    A l’intérieur du périmètre d’exposition à des bris de vitre par effet de surpression (cf.\n    document graphique) : Les constructions doivent être adaptées à l’effet de surpression. A\n    titre d’exemple, les mesures envisageables sont la limitation de la taille des ouvertures, des\n    surfaces vitrées et des verrières, la mise en place de vitrage feuilleté ou d’un film de protection\n    contre les bris de vitre.\n    Toutes nouvelles constructions, installations et extensions des constructions existantes nécessaires aux\n    activités de la centrale Enertherm sont autorisées, y compris celles relevant des Installations Classées\n    pour la Protection de l’Environnement.\n    Dispositions applicables sur les berges de Seine :\n    Sur les berges de Seine sont seuls admis, au titre des occupations et utilisations du sol énoncées dans\n    es règles générales applicables à toute la zone hormis les berges de Seine :\n    ▪    Les commerces d’une surface inférieure à 70.m² S.D.P\n    ▪    les constructions et installations nécessaires aux transports des personnes par bateaux\n    (embarquement, débarquement, escale) et aux haltes nautiques de navigation de plaisance,\n    ▪    les plates-formes de transit des marchandises acheminées ou évacuées par voie d’eau à\n    condition que leur fonctionnement soit exceptionnel, ainsi que les installations strictement\n    nécessaires à leur usage, à condition de ménager l’accessibilité aux promeneurs hors\n    périodes de fonctionnement ; une continuité de promenade doit être assurée pendant leur\n    fonctionnement par un itinéraire de contournement.\n    Sur les berges, les constructions ou installations doivent ménager un passage offrant un cheminement\n    confortable pour les promeneurs (à pied, à bicyclette…).\n    Nota : Les berges de Seine sont délimitées dans la bande de terrain comprise entre les limites de la\n    Seine, correspondant à la hauteur des eaux coulant à pleins bords avant de déborder, et le mur anti-\n    crue.\n    Dans les parties de la zone, soumises au risque technologique de transports de matières dangereuses\n    lié à la présence des canalisations de gaz à haute pression, dont le tracé figure dans le plan des\n    servitudes d’utilité publique annexé au P.L.U., toute occupation ou utilisation du sol doit respecter les\n    règles visant à garantir la sécurité publique.\n    69","UV\n    Article 2 - Mixité fonctionnelle et sociale\n    Non réglementé\n    CARACTERISTIQUES    URBAINES,    ARCHITECTURALES,\n    ENVIRONNEMENTALES ET PAYSAGERES\n    Article 3 - Volumétrie et implantation des constructions\n    3.1.    Implantation des constructions par rapport aux voies et emprises publiques\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Sauf marge de recul figurant aux documents graphiques, les constructions pourront s’implanter, soit à\n    l’alignement* ou limites des voies et emprises publiques existants ainsi que des voies privées, modifiés\n    ou à créer, soit en retrait. En cas de retrait, les constructions devront s’implanter en respectant un retrait\n    minimum de 5 mètres.\n    3.2.    Implantation des constructions par rapport aux limites séparatives\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Les constructions doivent s’implanter en retrait d’au moins 3 mètres des limites séparatives*.\n    Toutefois, les constructions en limites séparatives sont autorisées :\n    ▪    soit si elles s’adossent à une construction en bon état et de dimensions égales ou supérieures\n    existant sur le terrain voisin et si elles s’insèrent dans les héberges des bâtiments existants,\n    ▪    soit si elles ne sont pas affectées à l’habitation ou à l’activité et que leur hauteur totale ne\n    dépasse pas 3,50 mètres en limite séparative.\n    3.3.    Implantation des constructions par rapport aux autres constructions sur une même\n    propriété\n    L’implantation de toute construction, installation et ouvrage doit permettre son insertion harmonieuse\n    dans le paysage environnant.\n    Sur le domaine public fluvial, l’implantation des constructions, installations et ouvrages doit en outre\n    permettre à tout véhicule de sécurité d’accéder aux berges accostables.\n    3.4.    Emprise au sol\n    Pour la détermination de l’emprise au sol autorisée, il devra être déduit de la superficie de l’unité foncière\n    les surfaces consacrées à des opérations de voirie publique (emplacement réservé pour opération de\n    voirie) ou privée.\n    Règle générale d’emprise\n    L’emprise au sol des bâtiments ne pourra excéder 70% de la superficie du terrain\n    3.5.    Hauteur des constructions\n    La hauteur des constructions, installations et ouvrages doit respecter le paysage urbain local en\n    permettant leur insertion harmonieuse dans le site et le bâti existant.\n    Les dispositions de cet article ne s’appliquent pas pour les constructions et installations nécessaires au\n    réseau de transport public du Grand Paris.\n    Article 4 – Qualité urbaine, architecturale, environnementale et\n    paysagère\n    4.1.    Caractéristiques des façades, des toitures et des clôtures\n    Voir dispositions communes à toutes les zones\n    70","UV\n    4.2.    Obligations en matière de performances énergétiques et environnementales\n    Voir dispositions communes à toutes les zones\n    Article 5 – Traitement environnemental et paysager des espaces non\n    bâtis et abords des constructions\n    5.1.    Traitement des espaces libres\n    Voir dispositions communes à toutes les zones\n    5.2.    Part minimale de surfaces non imperméabilisées\n    Les constructions doivent respecter les conditions prévues au sein « des dispositions communes à\n    toutes les zones », complétées par les dispositions suivantes :\n    Coefficient de Biotope = 30 % d’Espaces Verts de pleine terre + 30 % Espaces Verts complémentaires.\n    Il n’est pas fixé de règle pour les constructions et installations nécessaires au réseau de transport public\n    du Grand Paris\n    Article 6 – Stationnement\n    La délivrance du permis de construire sera subordonnée à la réalisation d’installations propres à assurer\n    le stationnement hors des voies publiques, des véhicules correspondant aux besoins de l’immeuble à\n    construire.\n    Tous les stationnements des futures constructions devront être intégrés dans le volume des\n    constructions. Ces dispositions ne s’appliquent pas aux constructions et installations nécessaires au\n    réseau de transport public du Grand Paris.\n    Nombre de places à réaliser pour les vélos : Voir dispositions communes à toutes les zones\n    EQUIPEMENT ET RESEAUX\n    Article 7 – Desserte par les voies publiques ou privées\n    Voir dispositions communes à toutes les zones\n    Article 8 - Desserte par les réseaux\n    Voir dispositions communes à toutes les zones\n    71","Annexe\n    Annexes\n    ANNEXE I : LISTE DES EMPLACEMENTS RÉSERVÉS ET SERVITUDES DE LOCALISATION\n    1. Emplacements réservés aux voies et ouvrages publics\n    2. Emplacements réservés aux installations d'intérêt général à créer ou à modifier\n    (équipements)\n    3. Emplacements réservés aux espaces verts à créer ou à modifier ou aux espaces nécessaires\n    aux continuités écologiques\n    4. Emplacements réservés pour mixité sociale\n    5. Servitudes de localisation\n    ANNEXE II LISTE DES ÉLÉMENTS DE PAYSAGE À PROTÉGER\n    6. Eléments de paysage à protéger, à conserver, à mettre en valeur ou à requalifier pour des\n    motifs d'ordre culturel, historique ou architectural\n    7. Eléments de paysage, sites et secteurs à protéger pour des motifs d’ordre écologique\n    8. Dispositions applicables aux plantations (arbres et arbustes)\n    72","Annexe\n    Annexes\n    I. LISTE DES EMPLACEMENTS RESERVES ET SERVITUDES DE\n    LOCALISATION\n    1. Emplacements réservés aux voies et ouvrages publics\n    Bénéficiaire : Département des Hauts-de-Seine\n    N° plan Désignation    Superficie\n    1    Elargissement du Boulevard de la Mission Marchand :    1982 m2\n    • à 40 m entre la rue des Fauvelles et la rue Emile Deschanel\n    • à 32 m entre la rue Gaultier et la rue Emile Deschanel\n    • de largeur variable entre la rue Eugène Caron et la rue de Rouen\n    2    Elargissement du Boulevard de Verdun:    7270 m2\n    • à 32 m entre l’avenue de l’Europe et les rues Lambrechts/Armand\n    Silvestre\n    à 26 m entre la rue Armand Silvestre et le boulevard Saint-Denis\n    de largeur variable entre le boulevard Saint-Denis et le quai du\n    Président Paul Doumer.\n    3    Quai du Président Paul Doumer : Elargissement de largeur vari ence au plan : 23\n    Description :\n    Pavillon datant de la fin du XIXème et du\n    début du XXème siècle. De la rue, il nous\n    apparaît dans son intégrité y compris sa\n    clôture et plus particulièrement les piles de\n    l’entrée. Un ensemble qui ne manque pas de\n    charme et d’authenticité.\n    Source : Architecte des Bâtiments de France.\n    129","Annexe\n    Elément particulier à protéger et volumétrie existante à conserver\n    Localisation : 4-6 rue Ambroise Thomas (section AT n°94)\n    Quartier : Bécon\n    Référence au plan : 1\n    Description :\n    Construction 1er quart du 20e siècle\n    Matériaux : meulière, moellon sans chaine en pierre\n    de taille ; tuile plate.\n    Structure : sous-sol, rez-de-chaussée surélevé, 2\n    étages carrés ; élévation ordonnancée ; toit à longs\n    pans, pignon découvert.\n    Décor : céramique, représentation : fleur.\n    Elément particulier protégé : façade.\n    (source : Département des Hauts-de-Seine – inventaire\n    général des monuments et des richesses artistiques de la\n    France)\n    Avis de l’Architecte des Bâtiments de France, chef du service\n    départemental de l’architecture et du patrimoine : Façade\n    richement traitée avec meulière à gros joints, chaînes d’angle\n    en maçonnerie et décors en céramique.\n    Localisation : 198 boulevard Saint-Denis (section BG n°14)\n    Quartier : Bécon\n    Référence au plan : 2\n    Description :\n    Construction supposée fin 19e siècle\n    Maison\n    Briques peintes blanc, occuli.\n    Elément particulier protégé : façade.\n    (source : Architecte des Bâtiments de France)\n    Avis de l’Architecte des Bâtiments de France, chef du service\n    départemental de l’architecture et du patrimoine : Belle-\n    façade classique avec chaînes d’angle et baies régulières\n    avec arcs surbaissés.\n    130","Annexe\n    Bâtiments protégés et volumétrie existante à conserver\n    Localisation : 3 à 7 rue Sainte-Geneviève\n    Quartier : Bécon\n érable    rue de la Montagne\n    marronnier commun    rue de la Montagne    16\n    micocoulier de Provence    rue Carle Hébert    17\n    faux orme du Japon    rue Carle Hébert    18\n    platane d'Orient    rue de Colombes    19\n    platane d'Orient    rue de Colombes    20\n    arbre de Judée    rue Parmentier    21\n    noisetier de Byzance    square des Brunettes    22\n    platane commun à feuille    23\n    d'érable    rue Ségoffin\n    176","Annexe\n    Arbre remarquable n° 1 : HETRE POURPRE – PARC DE BECON\n    Localisation :\n    parc de Bécon\n    Quartier : Bécon\n    Référence au plan : 1\n    généralités :\n    c’est un arbre majestueux qui peut atteindre 50 m\n    de haut et vivre un millénaire. Il est assez répandu\n    en Europe et une des essences les plus importante\n    de la forêt française (10 %). Il est souvent associé\n    au chêne rouvre qu’il arrive à dominer ce qui en\n    fait le seigneur des futaies et signe un stade\n    évolutif supérieur dans la forêt tempérée.\n    Usages : il produit des fruits appelés faînes. Il est\n    apprécié dans l’industrie du bois. On l’emploie\n    pour des meubles, du parquet, des traverses de\n    chemin de fer… c’est un très bon combustible.\n    Fiche descriptive :\n    Hêtre pourpre\n    Fagus sylvatica f purpurea (Ait) Schneider\n    type d’intérêt : pour son port.\n    circonférence du tronc ou circonférences\n    cumulées : 3,1 m\n    circonférence du tronc ou circonférences\n    cumulées : 1,2 m /1,1 m/0,8 m\n    hauteur : 11 m\n    envergure : 11 m\n    perméabilité du sol : sol planté\n    situation : isolé\n    commentaire : cépée de 3 troncs au port original.\n    Se divise en deux à 0,6 m puis le tronc se redivise\n    en deux.\n    (cadastre vert – conseil général 92)\n    Arbre remarquable n° 2 : CHENE VERT – PARC DE BECON\n    Localisation :\n    parc de Bécon,\n    177","Annexe\n    dans la partie nord du parc, près des\n    escaliers montant à l’aire de jeux\n    Quartier : Bécon\n    Référence au plan : 2\n    généralités :\n    le chêne vert ou Yeuse est l’arbre caractéristique\n    de la flore méditerranéenne. C’est un arbre à\n    croissance lente qui peut vivre un millénaire.\n    Fiche descriptive :\n    Chêne vert\n    Quercus ilex L.\n    type d’intérêt : pour ses dimensions.\n    circonférence du tronc : 2,75 m\n    circonférences cumulées : 1,7 m /1,05 m\n    hauteur : 10 m\n    état sanitaire : vigoureux\n    perméabilité du sol : pelouse\n    situation : alignement ou bosquet\n    caractéristiques    complémentaires :    arbre\n    d’avenir\n    commentaire : magnifique sujet qui se divise en\n    deux à 1,4 m du sol. Circonférence des deux\n    charpentières : 1,7 m et 1,05 m. Port équilibré.\n    (cadastre vert – conseil général 92)\n    Arbre remarquable n° 3 : PLAQUEMINIER DE CHINE – PARC DE BECON\n    Localisation :\n    parc de Bécon\n    dans la partie basse du parc, à gauche de\n    la pièce d’eau\n    Quartier : Bécon\n    Référence au plan : 3\n    178","Annexe\n    généralités :\n    originaire de Chine, le plaqueminier fut\n    introduit en Europe en 1796 par le botaniste\n    anglais W. Roxburgh. On le rencontre plus\n    fréquemment dans le midi de la France. Au\n    Japon il peut atteindre 14 m de haut et la\n    moitié en Europe.\n    Les fruits sont mûrs en octobre-novembre ;\n    ils sont bons au goût lorsqu’ils sont très\n    mûrs.\n    Fiche descriptive :\n    Plaqueminier de Chine, kaki\n    Diospyros kaki L.f.\n    type d’intérêt : pour sa rareté.\n    circonférence du tronc : 1 m\n    hauteur : 7 m\n    envergure : 7 m\n    perméabilité du sol : pelouse\n    situation : isolé\n    caractéristiques complémentaires : arbre\n    d’avenir\n    commentaire :    se    divise en    deux\n    charpentières à 1,55 m. Houppier bien étalé\n    disposant de beaucoup d’espace. Bonne\n    fructification.\n    (cadastre vert – conseil général 92)\n    179","Annexe\n    Arbre remarquable n° 4 : SAVONNIER – PARC DE BECON\n    Localisation :\n    parc de Bécon\n    à proximité de l’escalier central.\n    Quartier : Bécon\n    Référence au plan : 4\n    généralités :\n    introduit Angleterre en 1764 par le comte\n    Georges de Coventry, il parvint en France en\n    1789 dans le parc des Vilmorin. Il est originaire\n    d’Inde et d’Asie orientale, mais aussi d’Amérique\n    tropicale. C’est un petit arbre de 10 m de haut\n    dont la pulpe des fruits est utilisée comme savon\n    naturel. Les fruits donnent de petites capsules\n    brun foncé qui en Asie orientale servent à faire\n    des chapelets.\n    Fiche descriptive :\n    Savonnier\n    Koelreuteria prticulata Laxm.\n    type d’intérêt : pour sa rareté\n    circonférence du tronc : 1 m\n    hauteur : 8 m\n    envergure : 12 m\n    perméabilité du sol : sol planté\n    situation : isolé\n    Commentaire : arbre témoin d’un groupe de\n    trois sujets de la même espèce. Ensemble\n    magnifique, très belle floraison estivale.\n    (cadastre vert – conseil général 92)\n    Arbre remarquable n° 5 : SAVONNIER – PARC DE BECON\n    Localisation :\n    parc de Bécon\n    180","Annexe\n    dans la partie sud du parc, proche du\n    boulevard Saint-Denis\n    Quartier : Bécon\n    Référence au plan : 5\n    généralités :\n    introduit Angleterre en 1764 par le comte\n    Georges de Coventry, il parvint en France en\n    1789 dans le parc des Vilmorin. Il est originaire\n    d’Inde et d’Asie orientale, mais aussi d’Amérique\n    tropicale. C’est un petit arbre de 10 m de haut\n    dont la pulpe des fruits est utilisée comme savon\n    naturel. Les fruits donnent de petites capsules\n    brun foncé qui en Asie orientale servent à faire\n    des chapelets.\n    Fiche descriptive :\n    Savonnier\n    Koelreuteria paniculata Laxm.\n    type d’intérêt : pour sa rareté.\n    circonférence du tronc : 1 m\n    hauteur : 7 m\n    envergure : 10 m\n    perméabilité du sol : sol planté\n    situation : alignement ou bosquet\n    commentaire : intégré dans un massif boisé\n    (cadastre vert – conseil général 92)\n    181","Annexe\n    Arbre remarquable n° 6 : CHARME HOUBLON – PARC DE BECON\n    Localisation :\n    parc de Bécon\n    dans la partie sud du parc, côté Seine\n    Quartier : Bécon\n    Référence au plan : 6\n    généralités :\n    cet arbre se développe dans le bassin oriental\n    de la Méditerranée, jusqu’en Asie mineure où\n    il peut atteindre 15 à 20 m de haut.\n    On le rencontre en Provence où il fut introduit\n    d’Italie vers 1700. Ses fructifications sont\n    caractéristiques, ce sont des cônes ovoïdes de\n    3 à 5 cm de long, pendants et aux écailles\n    lâches faisant penser à ceux du houblon. A\n    l’automne son feuillage se transforme en une\n    parure jaune d’or très décorative.\n    Fiche descriptive :\n    Charme houblon.\n    Ostrya carpinifolia Scop.\n    type d’intérêt : pour sa rareté.\n    circonférence du tronc : 1,77 m\n    hauteur : 9 m\n    envergure : 8 m\n    perméabilité du sol : sol planté\n    situation : isolé\n    caractéristiques complémentaires :    arbres\n    d’avenir\n    commentaire : cépée de 4 troncs.\n    (cadastre vert – conseil général 92)\n    182","Annexe\n    Arbre remarquable n° 7 : MURIER BLANC – PARC DE BECON\n    Localisation :\n    parc de Bécon\n    dans la partie sud du parc\n    Quartier : Bécon\n    Référence au plan : 7\n    généralités :\n    Le mûrier blanc fut introduit en Europe au\n    Xème siècle et en France sous Charles VIII. Ses\n    feuilles servaient d’aliment pour l’élevage des\n    vers à soie.\n    C’est un arbre à croissance lente qui peut vivre\n    plusieurs siècles et atteindre 10 à 15 m de\n    haut.\n    Fiche descriptive :\n    Mûrier blanc\n    Morus alba L.\n    type d’intérêt : pour sa rareté\n    circonférence du tronc : 2,5 m\n    hauteur : 13 m\n    envergure : 17 m\n    perméabilité du sol : pelouse\n    situation : isolé\n    commentaire : très beau houppier, bien étalé.\n    Gros bourrelet à 1,5 m.\n    (cadastre vert – conseil général 92)\n    183","Annexe\n    Arbre remarquable n°8 : PTEROCARYER A FEUILLES DE FRENE – PARC DE BECON\n    Localisation :\n    parc de Bécon\n    dans la partie sud du parc\n    Quartier : Bécon\n    Référence au plan : 8\n    généralités :\n    Il est aussi appelé P. caucasica car il est\n    originaire du Caucase, de l’Arménie et du\n    nord de l’Iran. C’est un botaniste français,\n    André Michaux, qui de retour de Perse en\n    1782 fit planter cette espèce dans les\n    jardins du Trianon à Versailles.\n    Ses grandes feuilles composées (60 cm de\n    long) sont formées de deux douzaines de\n    folioles, elles sont très caractéristiques et\n    ont une odeur de noyer. A l’automne il\n    donne de petites noix qui sont entourées\n    d’une aile membraneuse circulaire assez\n    originale.\n    Fiche descriptive :\n    Ptérocaryer à feuilles de frêne\n    Ptérocarya fraxinifolia (lam.) Spach\n    type d’intérêt : pour sa rareté.\n    circonférence du tronc : 1,9 m\n    hauteur : 14 m\n    envergure : 12 m\n    état sanitaire : moyen\n    perméabilité du sol : pelouse\n    situation : isolé\n    commentaire : belle ampleur.\n    (cadastre vert – conseil général 92)\n    Arbre remarquable n°9 : SEQUOIA TOUJOURS VERT – PARC DE BECON\n    Localisation :\n    parc de Bécon\n    184","Annexe\n    au bord d’un chemin\n    Quartier : Bécon\n    Référence au plan : 9\n    généralités :\n    Cet arbre vit plusieurs millénaires et peut\n    dépasser le séquoia géant. Le plus grand arbre\n    vivant au monde serait un séquoia\n    sempervirens de 112 m de haut.\n    C’est Théodore Hartweg qui rapporta des\n    graines en Grande-Bretagne en 1846.\n    Cet arbre croit en moyenne de 15 à 20 m en 20\n    ans.\n    Fiche descriptive :\n    Séquoia toujours vert.\n    type d’intérêt : pour sa rareté.\n    circonférence du tronc : 2 m\n    hauteur : 21 m\n    envergure : 12 m\n    état sanitaire : moyen\n    perméabilité du sol : pelouse\n    situation : isolé\n    caractéristiques complémentaires : arbre\n    d’avenir.\n    commentaire : arbre élégant à trois cimes.\n    (cadastre vert – conseil général 92)\n    185","Annexe\n    Arbre remarquable n°10 : NOISETIER DE BYZANCE – PARC DE BECON\n    Localisation :\n    parc de Bécon\n    en limite de la terrasse supérieure du\n    parc\n    Quartier : Bécon\n    Référence au plan : 10\n    Fiche descriptive :\n    Noisetier de Byzance\n    Corylus colurna L.\n    type d’intérêt : pour sa rareté\n    circonférence du tronc : 1,5 m\n    hauteur : 13 m\n    envergure : 8 m\n    perméabilité du sol : terre piétinée\n    situation : isolé\n    commentaire : arbre faisant partie d’un\n    alignement de plusieurs sujets\n    (cadastre vert – conseil général 92)\n    186","Annexe\n    Arbre remarquable n°11 : NOISETIER DE BYZANCE – PARC DE BECON\n    Localisation :\n    parc de Bécon\n    situé à côté de l’entrée principale du\n    parc.\n    Quartier : Bécon\n    Référence au plan : 11\n    Fiche Descriptive :\n    Noisetier de Byzance\n    Corylus colurna l.\n    type d’intérêt : pour sa rareté.\n    circonférence du tronc : 1,3 m\n    hauteur : 11 m\n    envergure : 10 m\n    perméabilité du sol : sol planté\n    situation : isolé\n    commentaire : arbre représentatif de deux\n    individus d’un même groupe situés de part et\n    d’autre de l’entrée principale. Fût droit, bien\n    équilibré. Espèce peu commune en ville.\n    (cadastre vert – conseil général 92)\n    187","Annexe\n    Arbre remarquable n°12 : MICOCOULIER DE PROVENCE – PARC DE BECON\n    Localisation :\n    Parc de Bécon\n    proche de la zone des plantes\n    méditerranéennes, en bordure de chemin\n    Quartier : Bécon\n    Référence au plan : 12\n    Généralités :\n    arbre de 25 à 30 m de haut pouvant vivre\n    un demi millénaire que l’on rencontre dans\n    le midi de la France.\n    Produit des drupes globuleuses qui sont\n    mûres à l’automne et comestibles.\n    Fiche descriptive :\n    Micocoulier de Provence\n    Celtis australis L. Ulmacées\n    type d’intérêt : pour ses dimensions.\n    circonférence du tronc : 1,65 m\n    hauteur : 10 m\n    envergure : 9 m\n    perméabilité du sol : sol planté\n    situation : isolé\n    commentaire : belle embase à contreforts et\n    racines apparentes.\n    (cadastre vert – conseil général 92)\n    188","Annexe\n    Arbre remarquable n°13 : PLATANE COMMUN A FEUILLE D’ERABLE- PARC DES COURONNES-\n    Localisation :\n    parc des Couronnes\n    Quartier : Bécon\n    Référence au plan : 13\n    Généralités :\n    Le platane d’Occident (platanus\n    occidentalis), grand arbre de 50 m\n    originaire des Etats-Unis, a donné un\n    hybride avec le platane d’Orient\n    (platanus orientalis) pour former le\n    platane commun qui est actuellement le\n    plus répandu en Europe et qui donne lieu\n    à de nombreuses variétés.\n    Cet hybride a la particularité de très bien\n    supporter la pollution atmosphérique et\n    les    mutilations    des    élagages\n    intempestifs comme le manque de soins.\n    Son écorce très décorative comme ses\n    fruits persistants renforcent son\n    esthétique même en hiver. C’est un arbre\n    citadin.\n    Fiche descriptive:\n    Platane commun à feuille d’érable.\n    Platanus x. acerifolia (Ait) Wild,\n    type d’intérêt : pour ses dimensions.\n    circonférence du tronc ou circonférences\n    cumulées :\n    4m\n    hauteur : 17 m\n    envergure : 23 m\n    perméabilité du sol : pelouse\n    état sanitaire : moyen\n    situation : alignement ou bosquet\n    commentaire : sujet impressionnant par ses\n    dimensions et la puissance de son tronc.\n    Tronc avec embrase très noueuse, typique\n    des vieux platanes. Houppier équilibré.\n    (cadastre vert – conseil général 92)\n    189","Annexe\n    Arbre remarquable n°14 : MARRONNIER COMMUN – SQUARE JEAN MERMOZ\n    Localisation :\n    Square Jean Mermoz, avenue du 11\n    Novembre.\n    à proximité d’un coin de jeux\n    Quartier : Bécon\n    Référence au plan : 14\n    Généralités :\n    Originaire du nord de la Grèce, le\n    marronnier d’Inde s’est acheminé\n    jusqu’à nous en passant par\n    Constantinople    en    1756    par\n    l’intermédiaire de Charles de l’Ecluse.\n    Il peut atteindre 20 m de haut avec un\n    tronc de 3 m. Il convient aussi bien pour\n    les parcs que comme arbre\n    d’alignement.\n    C’est un arbre très décoratif qui a une\n    floraison exubérante au printemps. Sa\n    croissance est rapide (50 à 60 cm par\n    an). On extrait de ses fruits et de son\n    écorce de l’aesculine utilisée pour ses\n    propriétés veinotoniques.\n    Fiche descriptive:\n    Marronnier commun\n    Aesculus hippocastanum L.\n    type d’intérêt : pour ses dimensions\n    circonférence du tronc : 3,2 m\n    hauteur : 20 m\n    envergure : 20 m\n    perméabilité du sol : pelouse\n    état sanitaire : vigoureux\n    situation : alignement ou bosquet\n    commentaire : sujet au tronc puissant, fût\n    droit.\n    (cadastre vert – conseil général 92)\n    190","Annexe\n    Arbre remarquable n°15 : PLATANE COMMUN A FEUILLE D’ ERABLE – RUE DE LA MONTAGNE –\n    PROPRIETE PRIVEE\n    Localisation :\n    Rue de la Montagne\n    (dans une propriété privée)\n    Quartier : Hôtel de Ville\n    Référence au plan : 15\n    Généralités :\n    Le    platane    d’Occident    (platanus\n    occidentalis), grand arbre de 50 m originaire\n    des Etats-Unis, a donné un hybride avec le\n    platane d’Orient (platanus orientalis) pour\n    former le platane commun qui est\n    actuellement le plus répandu en Europe et\n    qui donne lieu à de nombreuses variétés.\n    Cet hybride a la particularité de très bien\n    supporter la pollution atmosphérique et les\n    mutilations des élagages intempestifs\n    comme le manque de soins. Son écorce très\n    décorative comme ses fruits persistants\n    renforcent son esthétique même en hiver.\n    C’est un arbre citadin.\n    Fiche descriptive:\n    P a donné un\n    hybride avec le platane d’Orient\n    (platanus orientalis) pour former le\n    platane commun qui est actuellement le\n    plus répandu en Europe et qui donne lieu\n    à de nombreuses variétés.\n    Cet hybride a la particularité de très bien\n    supporter la pollution atmosphérique et\n    les    mutilations    des    élagages\n    intempestifs comme le manque de soins.\n    Son écorce très décorative comme ses\n    fruits persistants renforcent son\n    esthétique même en hiver. C’est un arbre\n    citadin.\n    Fiche descriptive :\n    Platane commun à feuille d’érable\n    Platanus x. acerifolia (Ait) Wild\n    type d’intérêt : pour ses dimensions.\n    circonférence du tronc : 2.6 m\n    hauteur : 24 m\n    envergure : 21 m\n    perméabilité du sol : sol planté\n    situation : isolé\n    commentaire : beau sujet ayant échappé aux\n    élagages, poussant en isolé sur un lot planté\n    de lierre, belle prestance et fort impact dans\n    le quartier A préserver absolument.\n    (cadastre vert – conseil général 92)\n    199","Annexes\n    8. Dispositions applicables aux plantations (arbres et arbustes)\n    Un ensemble d’éléments est à prendre en compte pour le choix des végétaux à planter :\n    -   Le climat\n    -   La nature du sol : calcaire ou acide\n    -   L’épaisseur des terres végétales\n    -   L’humidité du sol : sec ou humide\n    -   La dimension des végétaux adultes\n    La géologie et la pédologie ont une forte influence sur la qualité et la pérennité des plantations. Il est\n    important de connaître la nature du sol car certains végétaux ne supportent pas le calcaire. Ces espèces\n    croissent mal dans des sols ou le pH est supérieur à la neutralité. Les espèces concernées sont entre\n    autres les chênes, les châtaigniers, les rhododendrons…\n    L’épaisseur des terres dites végétales est également à prendre en compte. Il faudra plutôt prévoir des\n    végétaux à enracinement traçant (les racines croissent à l’horizontale) dans les secteurs où l’épaisseur\n    est faible et réserver les arbres à enracinement pivotant (les racines croissent à la verticale) dans les\n    zones où l’épaisseur est plus grande.\n    Les végétaux à enracinement superficiel dit traçant ont toutefois l’inconvénient de causer des désordres\n    sur les voiries, l’asphalte des chemins piétons ou les aires de stationnement. Par conséquent dans ces\n    contextes, il convient d’éviter de planter des arbres tels que certains prunus, les peupliers, les cèdres,\n    les hêtres, les saules et les sophoras.\n    Enfin, il est indispensable d’adapter la dimension adulte des végétaux à la superficie de la parcelle et\n    des bâtiments pour éviter les tailles trop fréquentes sources de maladies et de dépérissements.\n    Les arbres\n    La présente liste a pour vocation de fournir des exemples d’essences correspondant aux grandeurs\n    définies dans l’article 5 des dispositions générales du règlement du PLU, afin de pouvoir mieux estimer\n    les possibilités de plantations d’arbres dans les espaces libres du projet du permis. Cette liste n’est\n    pas exhaustive.\n    Le choix de l’essence se fera en fonction de l’adaptation au milieu : climat, sol, volume disponible pour\n    le feuillage et les racines et tiendra compte du port (forme générale de l’arbre), des caractéristiques de\n    l’écorce (matière, couleur…), de la forme des feuilles et des variations saisonnières : couleur des\n    feuilles, fleurs, fruits…\n    La direction des Espaces Verts et de l’Environnement de la commune de Courbevoie recommande le\n    choix d’essences indigènes, et faiblement allergènes, et peut être contactée pour de plus amples\n    recommandations. De même, elle préconise de prévoir dans les plantations d’arbres plusieurs sujets\n    en cépées (arbres à plusieurs troncs). Cette disposition a au fil des années façonné le paysage urbain\n    de Courbevoie.\n    Cette liste d’arbres en fonction de sa taille adulte est fournie à titre indicatif.-\n    -    Les arbres à grand développement, plus de 15 mètres à l’âge adulte\n    La catégorie des arbres à grand développement comprend les arbres utilisés pour les alignements. Ils\n    s’implantent dans des espaces permettant un développement peu contraint. Dans cette catégorie, les\n    arbres à développement supérieur à 20 mètres (identifiés par un * dans le tableau) correspondent aux\n    grands arbres des forêts comme les chênes, les hêtres... Ces arbres ne peuvent être plantés que sur\n    un très grand espace de pleine terre.\n    Nom latin    Nom vernaculaire    Essence    Caractère\n    indigène    allergène\n    Acer platanoides    Erable plane    X    Faible\n    Acer pseudoplatanus    Erable sycomore    X    Faible\n    Aesculus x carnea    Marronnier à fleurs roses    Faible\n    Alnus cordata    Aulne à feuilles en cœur    Moyen\n    Alnus glutinosa    Aulne glutineux    X    Moyen\n    Carpinus betulus    Charme commun    X    Moyen\n    Celtis australis    Micocoulier de Provence    Faible\n    Fagus sylvatica *    Hêtre commun    X    Faible\n    Fraxinus angustifolia    Frêne à feuilles étroites    Faible\n    Fraxinus excelsior *    Frêne commun    X    Moyen\n    200","Annexes\n    Liquidambar styraciflua    Copalme d’Amérique    X    Faible\n    Populus tremula *    Peuplier tremble    X    Faible\n    Prunus avium    Merisier    X    Faible\n    Quercus robur *    Chêne pédonculé    X    Fort\n    Ulmus ‘Lobel’ *    Orme de Hollande    X    Faible\n    Sophora japonica    Sophora du Japon    Faible\n    Tilia cordata    Tilleul à petites feuilles    X    Faible\n    CONIFERES\n    Nom latin    Nom vernaculaire    Essence    Caractère\n    indigène   allergène\n    Cedrus atlantica ’Pyramidalis’    Cèdre fastigié    Très faible\n    Cedrus atlantica ‘Glauca’ *    Cèdre bleu    Très faible\n    Larix decidua *    Mélèze d’Europe    Très faible\n    Metasequoia glyptostroboides    Métaséquoia de Chine    Très faible\n    Pinus halepensis    Pin d’Alep    Très faible\n    Pinus pinea    Pin parasol    Très faible\n    Pinus sylvestris *    Pin sylvestre    Très faible\n    -    Les arbres à moyens développement atteignant 8 à 15 mètres à l’âge adulte\n    La catégorie des arbres à moyen développement correspond aux arbres utilisés dans les espaces\n    relativement contraints, à proximité des bâtiments ou pour l’ombrage des aires de stationnement. Dans\n    ce dernier cas, il faudra veiller à prévoir un obstacle physique pour protéger les troncs des coups\n    occasionnés par les véhicules.\n    Nom latin    Nom vernaculaire    Essence    Caractère\n    indigène    allergène\n    Acer campestre    Erable champêtre    X    Faible\n    Alnus incana    Aulne blanc    Moyen\n    Betula verrucosa    Bouleau verruqueux    X    Fort\n    Catalpa bignonioides    Catalpa commun    Faible\n    Gleditsia triacanthos ‘Sunburst’   Févier d’Amérique    Faible\n    Magnolia grandiflora    Magnolia à grandes fleurs    Faible\n    Malus ‘Evereste’    Pommier d’ornement    Faible\n    Malus sylvestris    Pommier sauvage    X    Faible\n    Prunus padus    Cerisier à grappes    X    Faible\n    Quercus ilex    Chêne vert    Fort\n    Salix alba    Saule blanc    X    Faible\n    CONIFERES\n    Nom latin    Nom vernaculaire    Essence    Caractère\n    indigène    allergène\n    Ginkgo biloba ‘Fastigiata’    Arbre aux quarante écus fastigié    Faible\n    Pinus cembra    Pin cembro    Très\n    faible\n    Taxus baccata    If commun    X    Très\n    faible\n    -    Arbres à petit développement, atteignant 8 mètres à l’état adulte\n    La catégorie des arbres à petit développement comprend notamment les petits arbres fruitiers (cerisiers,\n    poiriers…), les petits érables ainsi que les petits conifères d’ornement. Ils sont à implanter dans les\n    espaces les plus contraints.\n    Nom latin    Nom vernaculaire    Essence Caractère\n    indigène allergène\n    Acer ginnala    Erable du fleuve Amour    Faible\n    Albizzia julibrissin    Arbre à soie    Faible\n    201","Annexes\n    Amelanchier ovalis    Amélanchier sauvage    X    Faible\n    Broussonetia papyrifera    Mûrier à papier    Fort\n    Cercis siliquastrum    Arbre de Judée    Faible\n    Corylus avellana    Noisetier sauvage    X    Fort\n    Fraxinus ornus    Frênes à fleurs    Moyen\n    Magnolia ‘Galaxy’    Magnolia ‘Galaxy’    Faible\n    Magnolia stellata    Magnolia étoilé    Faible\n    Mespilus germanica    Néflier commun    Faible\n    Parrotia persica    Arbre de fer    Faible\n    Prunus mahaleb    Cerisier de Sainte-Lucie    X    Faible\n    Prunus serrulata ‘Kanzan’    Cerisier à fleurs Kanzan    Faible\n    Prunus spinosa    Prunellier    X    Faible\n    Prunus subhirtella ‘Autumnalis    Cerisier du 10e mois    Faible\n    Rosea‘\n    Pyrus calleryana ‘Chanticleer’    Poirier d’ornement    Faible\n    Sorbus aucuparia    Sorbier des oiseleurs    X    Faible\n    CONIFERES\n    Nom latin    Nom vernaculaire    Essence    Caractère\n    indigène    allergène\n    Pinus nigra ‘Bregeon’    Pin noir ‘Bregeon’    Très faible\n    Pinus mugo ‘Mughus’    Pin de montagne    Très faible\n    Les haies végétales\n    Il existe différentes fonctions de la haie :\n    -    Une fonction de structuration : la haie marque la limite de propriété, elle vient végétaliser une\n    clôture ou, si elle est dense, fait elle-même office de clôture.\n    -    Une fonction ornementale : les feuillages, les fleurs, les fruits et les écorces des arbustes offrent\n    un panel de couleurs et de senteurs qui vient rythmer le paysage au fil des saisons.\n    -    Une fonction d’isolement visuel : la haie est souvent plantée dans l’objectif de s’isoler\n    rapidement mais il est oublié souvent de préserver quelques ouvertures visuelles.\n    -    Une fonction climatique : elle protège les espaces stratégiques du jardin et de la maison contre\n    le vent, le froid ou le soleil.\n    -    Une fonction écologique : une haie locale offre une diversité végétale qui procure abri et\n    nourriture aux insectes, rongeurs et oiseaux du jardin.\n    Deux formes de haies sont préconisées :\n    La haie taillée. Un espace doit être aménagé entre la haie et le barreaudage.\n    La haie libre. Elle doit être plantée en retrait d’un mètre au moins par rapport au barreaudage afin de\n    laisser les végétaux développer leur port naturel. Elle pourra passer légèrement au travers du\n    barreaudage dans la mesure où elle ne gêne pas le passant de la rue. Sinon une taille est obligatoire\n    et à la charge du propriétaire. La hauteur peut varier en fonction des essences choisies.\n    Les distances peuvent varier en fonction de la densité souhaitée. Généralement, les végétaux sont\n    plantés en moyenne tous les 60 cm à 80 cm.\n    En général les haies persistantes formées de conifères (Thuya occidentalis, Chamaecyparis\n    lawsoniana) sont déconseillées. Lorsqu’elles sont employées de façon systématique, elles banalisent\n    et uniformisent le paysage. Elles constituent un « mur » vert dénaturant l’aspect paysager de la haie.\n    Elles sont souvent utilisées dans un souci de s’isoler rapidement de son voisin mais elles deviennent\n    vite ingérables. De pousse rapide, ces végétaux nécessitent une taille très importante, à la longue ils\n    présentent davantage de troncs et de branches que de feuilles. Ils sont également particulièrement\n    gélifs: sensibles au froid et au vent.\n    Les haies locales et d’essences diversifiées, offrent des formes, des couleurs et des senteurs variées\n    qui participent à l’agrément du jardin, valorisent l’identité paysagère de la commune et favorisent la\n    202","Annexes\n    diversité écologique. De plus, le fait de varier les types de végétaux dans la constitution d’une haie\n    permet de limiter les allergies. En effet, elles sont souvent dues à l’utilisation de végétaux à caractère\n    allergène de manière mono spécifique et regroupée.\n    Inévitable pour garder une haie taillée dans les proportions souhaitées, la taille commence dès la\n    plantation. Elle renforce et densifie la haie. Pour obtenir une belle haie, des périodes de taille sont\n    préconisées, en fonction du type de haie. Elles peuvent avoir lieu une ou deux fois dans l’année\n    généralement entre avril / mai et septembre / octobre.\n    Pour rappel, bien que pouvant apparaître très pratique, le dallage en lieu et place des espaces\n    engazonnés est à proscrire. Il est fortement préconisé de maintenir les espaces engazonnés afin de\n    favoriser l’infiltration d’eau de pluie et ainsi d’éviter le ruissèlement des eaux menant à de possibles\n    inondations.\n    Nom latin    Nom vernaculaire    Essence    Caractère\n    indigène    allergène\n    Callicarpa bodinieri    Callicarpa    Faible\n    Carpinus betulus    Charme commun    X    Moyen\n    Cornus mas    Cornouiller mâle    X    Faible\n    Cornus sanguinea    Cornouiller sanguin    X    Faible\n    Corylus avellana    Noisetier sauvage    X    Fort\n    Crataegus laevigata    Aubépine à deux styles    X    Faible\n    Evonymus europaeus    Fusain d’Europe    X    Faible\n    Forsythia X intermedia    Forsythia    Faible\n    Frangula alnus    Bourdaine    X    Faible\n    Ligustrum vulgare    Troène    X    Moyen\n    Osmanthus x burkwoodi    Osmanthe    Faible\n    Philadelphus coronarius    Seringat    Faible\n    Physocarpus opulifolius    Physocarpe à feuilles d’obier    Faible\n    Prunus triloba    Amandier de Chine    Faible\n    Ribes alpinum    Groseillier des Alpes    Faible\n    Ribes sanguinea    Groseillier sanguin    Faible\n    Sambucus nigra    Sureau noir    X    Faible\n    Syringa vulgaris    Lilas commun    Faible\n    Viburnum opulus ‘Xanthocarpum’    Viorne obier    X    Faible\n    Viburnum plicatum ‘Lanarth’    Viorne de Chine à port étalé    Faible\n    203"],"themes":[["def","Definiciones / léxico"],["dest","Usos y destinos"],["mix","Mixidad social / funcional"],["voies","Implantación respecto a la calle"],["lim","Implantación respecto a linderos"],["meme","Varios edificios en la misma parcela"],["emp","Ocupación del suelo (emprise au sol)"],["haut","Altura"],["asp","Aspecto exterior, fachadas, cubiertas, cercas"],["verde","Espacios libres, pleine terre, vegetación"],["ener","Energía y medio ambiente (bioclimático)"],["stat","Aparcamiento (coches y bicis)"],["res","Accesos, redes, agua, residuos"],["patr","Patrimonio protegido"],["risq","Riesgos y molestias"],["gen","Disposiciones generales y aplicación"],["er","Emplazamientos reservados y servidumbres"]]};

// ---------- views
function crumb(s){const a=[];let p=par[s.i];while(p!==null){a.unshift(`<a href="#s/${p}">${esc(S[p].t)}</a>`);p=par[p]}return a.join(' › ')}
function chips(s){return s.th.map(t=>`<a class="chip" href="#temas/${t}">${esc(TH[t])}</a>`).join(' ')}
function pagesHtml(a,b,hl){
  const out=[];const max=Math.min(b,a+11);
  for(let p=a;p<=max;p++){
    let t=esc(DATA.pages[p-1]||'');
    if(hl&&p===a){const h=esc(hl).slice(0,40); const i=t.indexOf(h.slice(0,25)); if(i>=0){const e=t.indexOf('\n',i); t=t.slice(0,i)+'<span class="hh">'+t.slice(i,e<0?undefined:e)+'</span>'+(e<0?'':t.slice(e))}}
    out.push(`<div class="pg"><div class="ph"><span>Página ${p} del PDF</span><a target="_blank" rel="noopener" href="${pdfLink(p)}">abrir en el PDF ↗</a></div><pre>${t}</pre></div>`);
  }
  if(b>max) out.push(`<div class="box">Esta sección sigue hasta la página ${b}. <button data-more="${max+1},${b}">Mostrar 12 páginas más</button></div>`);
  return out.join('');
}
function bindMore(hl){document.querySelectorAll('[data-more]').forEach(btn=>btn.onclick=()=>{const [a,b]=btn.dataset.more.split(',').map(Number); const div=document.createElement('div'); div.innerHTML=pagesHtml(a,b); btn.parentNode.replaceWith(div); bindMore()})}
function viewSec(i){
  const s=S[i]; if(!s){viewHome();return}
  cur=i; renderTree(); const n=$('#tree .cur'); if(n) n.scrollIntoView({block:'nearest'});
  const k=kids[i];
  const end=Math.max(s.p,(k.length?S[k[0]].p:s.n));
  const fav=favs[i]?'on':'';
  $('#main').innerHTML=`<div class="crumb">${crumb(s)}</div>
  <h1 class="st">${esc(s.t)} <button class="star ${fav}" id="fav" title="Favorito">★</button></h1>
  <div class="meta">${s.z?`<span class="chip">Zona ${esc(s.z)}</span>`:''} ${chips(s)} <span>págs. ${s.p}–${Math.max(s.q,s.p)}${s.a?' (posición aproximada)':''}</span></div>
  <div class="btns no-print" style="margin-bottom:14px">${pdfBtn(s.p)} ${i>0?`<a class="b" href="#s/${i-1}">← Anterior</a>`:''} ${i<S.length-1?`<a class="b" href="#s/${i+1}">Siguiente →</a>`:''}</div>
  ${k.length?`<div class="box sub-list"><h3>Contenido de esta sección</h3>${k.map(j=>`<a href="#s/${j}">${esc(S[j].t)} <span class="pg" style="color:var(--muted);font-size:12px">p. ${S[j].p}</span></a>`).join('')}</div>`:''}
  <div class="box notes no-print"><h3>Mis notas</h3><textarea id="note" placeholder="Notas sobre esta sección (se guardan en este navegador)">${esc(notes[i]||'')}</textarea></div>
  <h3 style="font-size:14px;color:var(--muted);margin:18px 0 8px">TEXTO OFICIAL (extraído del PDF; tablas y figuras: ver el PDF)</h3>
  ${pagesHtml(s.p,end,s.t)}`;
  bindMore();
  $('#fav').onclick=()=>{if(favs[i]) delete favs[i]; else favs[i]=1; store.set('favs',favs); $('#fav').classList.toggle('on')};
  $('#note').oninput=e=>{notes[i]=e.target.value; if(!notes[i]) delete notes[i]; store.set('notes',notes)};
  window.scrollTo(0,0);
}
function secsFor(th){
  return S.filter(s=>s.th.includes(th));
}
function viewProy(id){
  const P=PROY.find(p=>p.id===id);
  const tabs=`<div class="pj-tabs">${PROY.map(p=>`<a href="#proy/${p.id}" class="${p.id===id?'on':''}"><b>${esc(p.nom)}</b><span>${esc(p.sub)}</span></a>`).join('')}</div>`;
  if(!P){$('#main').innerHTML=`<h1 class="st">¿Qué proyecto tienes?</h1><p>Elige el tipo de obra. Te digo qué artículos de este ${DATA.k.startsWith('pold')?'PLU':'PLUi'} consultar, por orden, y puedes marcarlos a medida que los revisas.</p>${tabs}`;return}
  const ck=checks[id]||{};
  let total=0,done=0;
  const zsel=DATA.zones.length?`<div class="zsel"><span style="font-size:13px;color:var(--muted)">Tu zona:</span><span class="chip ${zone===''?'on':''}" data-z="">sin elegir</span>${DATA.zones.map(z=>`<span class="chip ${zone===z?'on':''}" data-z="${esc(z)}">${esc(z)}</span>`).join('')}</div>`:'';
  const groups=P.grupos.map(([th,txt])=>{
    let list=secsFor(th).filter(s=>!s.z||!zone||s.z===zone);
    // prefer most specific: drop parents whose children also listed
    const ids=new Set(list.map(s=>s.i));
    list=list.filter(s=>!kids[s.i].some(j=>ids.has(j)));
    const common=list.filter(s=>!s.z), zl=list.filter(s=>s.z);
    const item=s=>{total++; const ok=ck[s.i]; if(ok) done++; return `<div class="pj-a ${ok?'ok':''}"><input type="checkbox" data-ck="${s.i}" ${ok?'checked':''}><a href="#s/${s.i}">${esc(s.t)}${s.z?`<span class="zn">${esc(s.z)}</span>`:''}<span class="tt">p. ${s.p} · ${esc(crumb(s).replace(/<[^>]+>/g,''))}</span></a></div>`};
    let body='';
    if(common.length) body+=`<div style="font-size:12px;color:var(--muted);margin-top:6px">Comunes a todas las zonas</div>`+common.slice(0,12).map(item).join('')+(common.length>12?`<div class="empty">… y ${common.length-12} más en <a href="#temas/${th}">Por tema</a></div>`:'');
    if(zl.length) body+=`<div style="font-size:12px;color:var(--muted);margin-top:6px">${zone?'Zona '+esc(zone):'Por zona (elige tu zona arriba para filtrar)'}</div>`+zl.slice(0,zone?30:10).map(item).join('')+(!zone&&zl.length>10?`<div class="empty">… y ${zl.length-10} más: elige tu zona.</div>`:'');
    if(!body) body=`<div class="empty">No he encontrado un artículo con este tema en el índice. Usa el buscador (arriba) con palabras clave.</div>`;
    return `<div class="box pj-g"><h3>${esc(TH[th])}</h3><div class="reg">${esc(txt)}</div>${body}</div>`;
  }).join('');
  $('#main').innerHTML=`${tabs}<h1 class="st">${esc(P.nom)}</h1>
  <div class="pj-cols"><div class="box"><h3>Trámite</h3><ul>${P.tramite.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="box"><h3>Antes de leer el reglamento</h3><ul>${P.antes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
  ${zsel}
  <div class="pj-bar"><div class="pj-prog"><i style="width:${total?Math.round(done*100/total):0}%"></i></div><span style="font-size:13px">${done} de ${total} revisados</span><button id="pjReset">Desmarcar todo</button><button onclick="print()">Imprimir</button></div>
  <div class="warn">La lista se genera por tema a partir del índice del reglamento. Confirma siempre en el texto y en el plano de zonificación; algunos artículos tratan varios temas a la vez.</div>
  ${groups}`;
  $('#main').querySelectorAll('[data-z]').forEach(e=>e.onclick=()=>{zone=e.dataset.z; store.set('zone',zone); renderFilters(); renderTree(); viewProy(id)});
  $('#main').querySelectorAll('[data-ck]').forEach(e=>e.onchange=()=>{const c=checks[id]=checks[id]||{}; if(e.checked) c[e.dataset.ck]=1; else delete c[e.dataset.ck]; store.set('checks',checks); viewProy(id)});
  $('#pjReset').onclick=()=>{checks[id]={}; store.set('checks',checks); viewProy(id)};
}
function viewTemas(th){
  const list=DATA.themes.map(([k,l])=>`<a class="chip ${k===th?'on':''}" href="#temas/${k}">${esc(l)} (${secsFor(k).length})</a>`).join(' ');
  let body='';
  if(th){
    const ss=secsFor(th).filter(s=>!zone||!s.z||s.z===zone);
    body=`<h2 style="font-size:18px">${esc(TH[th])}${zone?' · zona '+esc(zone):''}</h2>`+(ss.map(s=>`<div class="r" onclick="location.hash='#s/${s.i}'"><span class="cd">p. ${s.p}</span>${esc(s.t)} ${s.z?`<span class="chip">${esc(s.z)}</span>`:''}<div class="sn">${esc(crumb(s).replace(/<[^>]+>/g,''))}</div></div>`).join('')||'<div class="empty">Ninguna sección del índice. Prueba el buscador.</div>');
  }
  $('#main').innerHTML=`<h1 class="st">Por tema</h1><p>Secciones del reglamento agrupadas por tema (según su título).${DATA.zones.length?' Si eliges tu zona en el panel izquierdo, se ocultan las de otras zonas.':''}</p><div class="th-l" style="margin-bottom:14px">${list}</div><div class="results">${body}</div>`;
}
function secOfPage(p){let best=null;S.forEach(s=>{if(s.p<=p&&(!best||s.p>=best.p))best=s});return best}
function viewSearch(q){
  const nq=norm(q).trim(); if(nq.length<2){viewHome();return}
  const terms=nq.split(/\s+/);
  const res=[];
  const tit=S.filter(s=>terms.every(t=>norm(s.t).includes(t)));
  for(let i=0;i<DATA.pages.length&&res.length<300;i++){
    const np=NP[i]; if(terms.every(t=>np.includes(t))){
      const j=np.indexOf(terms[0]); const raw=DATA.pages[i]; const a=Math.max(0,j-90);
      res.push({p:i+1,sn:raw.slice(a,a+260).replace(/\s+/g,' ')});
    }
  }
  const hl=t=>{let h=esc(t);terms.forEach(x=>{if(x.length<2)return;const re=new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');h=h.replace(re,m=>`<mark>${m}</mark>`)});return h};
  $('#main').innerHTML=`<h1 class="st">Resultados para «${esc(q)}»</h1>
  ${tit.length?`<div class="box"><h3>En títulos de secciones (${tit.length})</h3>${tit.slice(0,40).map(s=>`<div class="r" onclick="location.hash='#s/${s.i}'"><span class="cd">p. ${s.p}</span>${esc(s.t)}</div>`).join('')}</div>`:''}
  <div class="results"><h3 style="font-size:14px;color:var(--muted)">EN EL TEXTO: ${res.length}${res.length>=300?'+':''} páginas</h3>${res.map(r=>{const s=secOfPage(r.p);return `<div class="r" data-p="${r.p}" data-s="${s?s.i:''}"><span class="cd">p. ${r.p}</span>${s?esc(s.t):''}<div class="sn">… ${hl(r.sn)} …</div></div>`}).join('')}</div>`;
  $('#main').querySelectorAll('.results .r[data-p]').forEach(e=>e.onclick=()=>{location.hash='#p/'+e.dataset.p});
}
function viewPage(p){
  p=Math.max(1,Math.min(DATA.npages,p)); const s=secOfPage(p);
  $('#main').innerHTML=`<div class="crumb">${s?crumb(s)+(crumb(s)?' › ':'')+`<a href="#s/${s.i}">${esc(s.t)}</a>`:''}</div><h1 class="st">Página ${p}</h1>
  <div class="btns no-print" style="margin-bottom:14px">${pdfBtn(p)} ${p>1?`<a class="b" href="#p/${p-1}">← p. ${p-1}</a>`:''} ${p<DATA.npages?`<a class="b" href="#p/${p+1}">p. ${p+1} →</a>`:''}</div>${pagesHtml(p,p)}`;
  const q=$('#q').value; if(q){const terms=norm(q).split(/\s+/).filter(x=>x.length>1); const pre=$('#main pre'); let h=pre.innerHTML; terms.forEach(x=>{const re=new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'); h=h.replace(re,m=>`<mark>${m}</mark>`)}); pre.innerHTML=h}
  window.scrollTo(0,0);
}
function viewNotas(){
  const f=Object.keys(favs).map(Number).filter(i=>S[i]); const n=Object.keys(notes).map(Number).filter(i=>S[i]);
  $('#main').innerHTML=`<h1 class="st">Mis notas y favoritos</h1><p class="empty">Se guardan solo en este navegador.</p>
  <div class="box"><h3>Favoritos (${f.length})</h3>${f.map(i=>`<div class="r" onclick="location.hash='#s/${i}'"><span class="cd">p. ${S[i].p}</span>${esc(S[i].t)}</div>`).join('')||'<div class="empty">Marca secciones con ★.</div>'}</div>
  <div class="box"><h3>Notas (${n.length})</h3>${n.map(i=>`<div class="r" onclick="location.hash='#s/${i}'"><span class="cd">p. ${S[i].p}</span>${esc(S[i].t)}<div class="sn">${esc(notes[i])}</div></div>`).join('')||'<div class="empty">Escribe notas en cualquier sección.</div>'}</div>`;
}
function viewHome(){
  const top=S.filter(s=>s.l===0);
  $('#main').innerHTML=`<h1 class="st">${esc(DATA.nom)}</h1>
  <div class="box"><div class="kv"><b>Documento</b><span>Reglamento escrito del ${DATA.k.startsWith('pold')?'PLU':'PLUi'} (${DATA.npages} páginas)</span><b>Estado</b><span>${esc(DATA.estado)}</span><b>Municipios</b><span>${esc(DATA.communes)}</span><b>Fuente</b><span><a href="${DATA.pdf.url}" target="_blank" rel="noopener">Géoportail de l'urbanisme (PDF oficial)</a></span></div></div>
  <div class="box"><h3>Cómo usarlo</h3><ul style="margin:0;padding-left:18px">
   <li><b>Por proyecto</b>: elige el tipo de obra y tu zona; te lista los artículos a revisar, por orden, con casillas.</li>
   <li><b>Explorar</b>: índice completo a la izquierda; cada sección muestra el texto oficial y el botón para abrir el PDF en esa página.</li>
   <li><b>Buscador</b>: busca en las ${DATA.npages} páginas (palabras en francés: <i>hauteur, clôture, pleine terre…</i>).</li>
   <li><b>Tu zona</b>: mírala en el <a href="https://www.geoportail-urbanisme.gouv.fr/map/" target="_blank" rel="noopener">mapa del Géoportail de l'urbanisme</a> (clic en la parcela) o en los planos de zonificación de la carpeta <i>Reglement</i>.</li></ul></div>
  <div class="pj-tabs">${PROY.map(p=>`<a href="#proy/${p.id}"><b>${esc(p.nom)}</b><span>${esc(p.sub)}</span></a>`).join('')}</div>
  <div class="box sub-list"><h3>Partes del reglamento</h3>${top.map(s=>`<a href="#s/${s.i}">${esc(s.t)} <span style="color:var(--muted);font-size:12px">p. ${s.p}</span></a>`).join('')}</div>
  <div class="box no-print"><h3>Abrir el PDF</h3><p style="font-size:13.5px;margin:0 0 8px">Los botones «Abrir en el PDF» usan: <b>${pdfMode==='local'?'tu copia en el PC (carpeta Reglement junto a este archivo)':'el PDF oficial en internet'}</b>.</p><button id="pdfToggle">Usar ${pdfMode==='local'?'el PDF en internet':'mi copia local'}</button></div>
  ${HOME_URL?`<p><a href="${HOME_URL}">← Volver al mapa de territorios</a></p>`:''}`;
  $('#pdfToggle').onclick=()=>{pdfMode=pdfMode==='local'?'online':'local'; store.set('pdfmode',pdfMode); viewHome(); toast('PDF: '+(pdfMode==='local'?'copia local':'internet'))};
}
const NP=DATA.pages.map(norm);
let qt;
$('#q').addEventListener('input',e=>{clearTimeout(qt); qt=setTimeout(()=>{const v=e.target.value.trim(); if(v.length>=2) location.hash='#q/'+encodeURIComponent(v); else if(!v) location.hash='#home'},350)});
function route(){
  const h=decodeURIComponent(location.hash.slice(1)||'home');
  const [v,a]=[h.split('/')[0],h.split('/').slice(1).join('/')];
  document.querySelectorAll('#tabs a').forEach(x=>x.classList.toggle('on',x.dataset.t===(v==='q'||v==='p'?'':v)));
  if(v==='s') viewSec(+a||0);
  else if(v==='proy') viewProy(a);
  else if(v==='temas') viewTemas(a);
  else if(v==='q'){ if($('#q').value!==a) $('#q').value=a; viewSearch(a)}
  else if(v==='p') viewPage(+a);
  else if(v==='notas') viewNotas();
  else viewHome();
}
window.addEventListener('hashchange',route);
renderFilters(); renderTree(); route();
</script>
</body>
</html>
