glement du P.O.S. ou du P.L.U.\nUNITE COMMERCIALE (OU UNITE D’ACTIVITE) :\nIl s’agit d’un lieu physique permettant à un client potentiel d’accéder à une offre de produits ou\nde services liés à une enseigne commerciale. Sa superficie se compte en surfaces ouvertes\nau public. Les « réserves » constituent les surfaces non ouvertes au public (stockage, atelier,\ncuisine, bureaux, etc…).\n    Plan Local d’Urbanisme – Modification n°5 – Règlement –Annexe A 134","VOIE OU VOIRIE PUBLIQUE OU PRIVEE :\nEnsemble des espaces utilisés pour la circulation des personnes, c'est-à-dire chaussées et\ntrottoirs.\nZONE D’AMENAGEMENT CONCERTE (Z.A.C.) :\nZone à l’intérieur de laquelle une collectivité publique ou un établissement public y ayant\nvocation décide d’intervenir pour réaliser ou faire réaliser l’aménagement et l’équipement des\nterrains, notamment de ceux que cette collectivité ou cet établissement a acquis ou acquerra\nen vue de les céder ou de les concéder ultérieurement à des utilisateurs publics ou privés\n(article L.311-1 du code de l’urbanisme).\nElle a pour objet l’aménagement et l’équipement de terrains bâtis ou non bâtis, notamment en\nvue de la réalisation :\n    • de constructions à usage d’habitation, de commerce, d’industrie, de services,\n    • d’installations et d’équipements collectifs, publics ou privés.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement –Annexe A 135","    Ville de Puteaux\nANNEXE B\nEXTRAITS DU CODE DE L’URBANISME ET DU CODE CIVIL\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Annexe B 136","    Ville de Puteaux\nCODE DE L’URBANISME :\nArticle R111-2\n(Décret nº 76-276 du 29 mars 1976 Journal Officiel du 30 mars 1976 en vigueur le 1er avril 1976)\n(Décret nº 98-913 du 12 octobre 1998 art. 2 Journal Officiel du 13 octobre 1998)\nLe permis de construire peut être refusé ou n'être accordé que sous réserve de l'observation de\nprescriptions spéciales si les constructions, par leur situation ou leurs dimensions, sont de nature à\nporter atteinte à la salubrité ou à la sécurité publique. Il en est de même si les constructions\nprojetées, par leur implantation à proximité d'autres installations, leurs caractéristiques ou leur\nsituation, sont de nature à porter atteinte à la salubrité ou à la sécurité publique.\nArticle R111-3-1\n(inséré par Décret nº 77-755 du 7 juillet 1977 Journal Officiel du 10 juillet 1977 en vigueur le 1er janvier 1978)\nLe permis de construire peut être refusé ou n'être accordé que sous réserve de prescriptions\nspéciales si les constructions sont susceptibles, en raison de leur localisation, d'être exposées à des\nnuisances graves, dues notamment au bruit.\nArticle R111-3-2\n(inséré par Décret nº 77-755 du 7 juillet 1977 Journal Officiel du 10 juillet 1977 en vigueur le 1er janvier 1978)\nLe permis de construire peut être refusé ou n'être accordé que sous réserve de l'observation de\nprescriptions spéciales si les constructions sont de nature, par leur localisation, à compromettre la\nconservation ou la mise en valeur d'un site ou de vestiges archéologiques.\nArticle R111-4\n(Décret nº 76-276 du 29 mars 1976 Journal Officiel du 30 mars 1976 date d'entrée en vigueur 1 AVRIL 1976)\n(Décret nº 77-755 du 7 juillet 1977 Journal Officiel du 10 juillet 1977 date d'entrée en vigueur 1 janvier 1978)\n(Décret nº 99-266 du 1 avril 1999 art. 1 Journal Officiel du 9 avril 1999)\nLe permis de construire peut être refusé sur des terrains qui ne seraient pas desservis par des voies\npubliques ou privées dans des conditions répondant à l'importance ou à la destination de l'immeuble\nou de l'ensemble d'immeubles envisagé, et notamment si les caractéristiques de ces voies rendent\ndifficile la circulation ou l'utilisation des engins de lutte contre l'incendie.\nIl peut également être refusé si les accès présentent un risque pour la sécurité des usagers des\nvoies publiques ou pour celle des personnes utilisant ces accès. Cette sécurité doit être appréciée\ncompte tenu, notamment, de la position des accès, de leur configuration ainsi que de nature et de\nl'intensité du trafic.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Annexe B 137","    Ville de Puteaux\nLa délivrance du permis de construire peut être subordonnée :\n  a) A la réalisation d'installations propres à assurer le stationnement hors des voies\n    publiques des véhicules correspondant aux besoins de l'immeuble à construire ;\n  b) A la réalisation de voies privées ou de tous autres aménagements particuliers\n    nécessaires au respect des conditions de sécurité mentionnées au deuxième\n    alinéa ci-dessus.\nIl ne peut être exigé la réalisation de plus d'une aire de stationnement par logement lors de la\nconstruction de logements locatifs financés avec un prêt aidé par l'Etat.\nL'obligation de réaliser des aires de stationnement n'est pas applicable aux travaux de\ntransformation ou d'amélioration de bâtiments affectés à des logements locatifs financés avec un\nprêt aidé par l'Etat, y compris dans le cas où ces travaux s'accompagnent de la création de surface\nhors oeuvre nette, dans la limite d'un plafond de 50 % de la surface hors oeuvre nette existant avant\nle commencement des travaux.\nLe nombre des accès sur les voies publiques peut être limité dans l'intérêt de la sécurité. En\nparticulier, lorsque le terrain est desservi par plusieurs voies, les constructions peuvent n'être\nautorisées que sous réserve que l'accès soit établi sur la voie où la gêne pour la circulation sera la\nmoindre.\nArticle R111-14-2\n(inséré par Décret nº 77-1141 du 12 octobre 1977 Journal Officiel du 13 octobre 1977 date d'entrée en vigueur 1 janvier\n1978)\nLe permis de construire est délivré dans le respect des préoccupations d'environnement définies à\nl'article 1er de la loi n. 76-629 du 10 juillet 1976 relative à la protection de la nature. Il peut n'être\naccordé que sous réserve de l'observation de prescriptions spéciales, si les constructions, par leur\nsituation, leur destination ou leurs dimensions, sont de nature à avoir des conséquences\ndommageables pour l'environnement.\nArticle R111-15\n(Décret nº 76-276 du 29 mars 1976 Journal Officiel du 30 mars 1976 date d'entrée en vigueur 1 AVRIL 1976)\n(Décret nº 77-755 du 7 juillet 1977 Journal Officiel du 10 juillet 1977 date d'entrée en vigueur 1 JANVIER 1978)\n(Décret nº 83-812 du 9 septembre 1983 art. 10 Journal Officiel du 11 septembre 1983 date d'entrée en vigueur 1\nOCTOBRE 1983)\n(Décret nº 86-984 du 19 août 1986 art. 7 I Journal Officiel du 27 aout 1986)\n(Décret nº 98-913 du 12 octobre 1998 art. 5 Journal Officiel du 13 octobre 1998)\nLe permis de construire peut être refusé ou n'être accordé que sous réserve de l'observation de\nprescriptions spéciales lorsque, par leur importance, leur situation, et leur affectation, des\nconstructions contrarieraient l'action d'aménagement du territoire et d'urbanisme telle qu'elle résulte\ndes dispositions des schémas directeurs intéressant les agglomérations nouvelles approuvés avant\nle 1er octobre 1983 ou, postérieurement à cette date, dans les conditions prévues au b du deuxième\nalinéa de l'article R. 122-22.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Annexe B 138","    Ville de Puteaux\nArticle R111-21\n(Décret nº 76-276 du 29 mars 1976 Journal Officiel du 30 mars 1976 date d'entrée en vigueur 1 avril 1976)\n(Décret nº 77-755 du 7 juillet 1977 Journal Officiel du 10 juillet 1977 date d'entrée en vigueur 1 janvier 1978)\nLe permis de construire peut être refusé ou n'être accordé que sous réserve de l'observation de\nprescriptions spéciales si les constructions, par leur situation, leur architecture, leurs dimensions ou\nl'aspect extérieur des bâtiments ou ouvrages à édifier ou à modifier, sont de nature à porter atteinte\nau caractère ou à l'intérêt des lieux avoisinants, aux sites, aux paysages naturels ou urbains ainsi\nqu'à la conservation des perspectives monumentales.\nArticle R123-4\n(Décret nº 77-736 du 7 juillet 1977 Journal Officiel du 8 juillet 1977)\n(Décret nº 83-813 du 9 septembre 1983 art. 2 Journal Officiel du 11 septembre 1983 date d'entrée en vigueur 1 OCTOBRE\n1983)\n(Décret nº 83-813 du 9 septembre 1983 art. 2 Journal Officiel du 11 septembre 1983 date d'entrée en vigueur 1 octobre\n1983)\n(Décret nº 88-199 du 29 février 1988 art. 1 Journal Officiel du 2 mars 1988)\n(Décret nº 2001-260 du 27 mars 2001 art. 1 Journal Officiel du 28 mars 2001)\nLe règlement délimite les zones urbaines, les zones à urbaniser, les zones agricoles et les zones\nnaturelles et forestières. Il fixe les règles applicables à l'intérieur de chacune de ces zones dans les\nconditions prévues à l'article R. 123-9.\nArticle R123-5\n(Décret nº 77-736 du 7 juillet 1977 Journal Officiel du 8 juillet 1977)\n(Décret nº 81-534 du 12 mai 1981 art. 20 Journal Officiel du 15 mai 1981 date d'entrée en vigueur art. 38 modifié 1 juillet\n1982)\n(Décret nº 82-584 du 29 juin 1982 art. 1 Journal Officiel du 7 juillet 1982)\n(Décret nº 83-813 du 9 septembre 1983 art. 2 Journal Officiel du 11 septembre 1983 date d'entrée en vigueur 1 OCTOBRE\n1983)\n(Décret nº 92-966 du 10 septembre 1992 art. 2 Journal Officiel du 11 septembre 1992)\n(Loi nº 98-913 du 12 octobre 1998 art. 26 Journal Officiel du 13 octobre 1998)\n(Décret nº 2001-260 du 27 mars 2001 art. 1 Journal Officiel du 28 mars 2001)\nLes zones urbaines sont dites \"zones U\". Peuvent être classés en zone urbaine, les secteurs déjà\nurbanisés et les secteurs où les équipements publics existants ou en cours de réalisation ont une\ncapacité suffisante pour desservir les constructions à implanter.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Annexe B 139","    Ville de Puteaux\nArticle R123-6\n(Décret nº 83-813 du 9 septembre 1983 art. 2 Journal Officiel du 11 septembre 1983 date d'entrée en vigueur 1 OCTOBRE\n1983)\n(Décret nº 86-52 du 10 janvier 1986 art. 3 1º, 2º, Journal Officiel du 14janvier 1986)\n(Loi nº 98-913 du 12 octobre 1998 art. 27 I, II, III Journal Officiel du 13 octobre 1998)\n(Décret nº 2001-260 du 27 mars 2001 art. 1 Journal Officiel du 28 mars 2001)\n(Décret nº 2004-531 du 9 juin 2004 art. 2 V Journal Officiel du 13 juin 2004)\nLes zones à urbaniser sont dites \"zones AU\". Peuvent être classés en zone à urbaniser les secteurs\nà caractère naturel de la commune destinés à être ouverts à l'urbanisation.\nLorsque les voies publiques et les réseaux d'eau, d'électricité et, le cas échéant, d'assainissement\nexistant à la périphérie immédiate d'une zone AU ont une capacité suffisante pour desservir les\nconstructions à implanter dans l'ensemble de cette zone, les orientations d'aménagement et le\nrèglement définissent les conditions d'aménagement et d'équipement de la zone.\nLes constructions y sont autorisées soit lors de la réalisation d'une opération d'aménagement\nd'ensemble, soit au fur et à mesure de la réalisation des équipements internes à la zone prévus par\nles orientations d'aménagement et le règlement.\nLorsque les voies publiques et les réseaux d'eau, d'électricité et, le cas échéant, d'assainissement\nexistant à la périphérie immédiate d'une zone AU n'ont pas une capacité suffisante pour desservir\nles constructions à implanter dans l'ensemble de cette zone, son ouverture à l'urbanisation peut être\nsubordonnée à une modification ou à une révision du plan local d'urbanisme.\nArticle R123-7\n(Décret nº 77-736 du 7 juillet 1977 Journal Officiel du 8 juillet 1977)\n(Décret nº 83-813 du 9 septembre 1983 art. 2 Journal Officiel du 11 septembre 1983 date d'entrée en vigueur 1 OCTOBRE\n1983)\n(Décret nº 83-813 du 9 septembre 1983 art. 2 Journal Officiel du 11 septembre 1983 date d'entrée en vigueur 1 octobre\n1983)\n(Décret nº 88-199 du 29 février 1988 art. 1 Journal Officiel du 2 mars 1988)\n(Décret nº 98-913 du 12 octobre 1998 art. 40 Journal Officiel du 13 octobre 1998)\n(Décret nº 2001-260 du 27 mars 2001 art. 1 Journal Officiel du 28 mars 2001)\n(Décret nº 2004-531 du 9 juin 2004 art. 2 VI Journal Officiel du 13 juin 2004)\nLes zones agricoles sont dites \"zones A\". Peuvent être classés en zone agricole les secteurs de la\ncommune, équipés ou non, à protéger en raison du potentiel agronomique, biologique ou\néconomique des terres agricoles.\nLes constructions et installations nécessaires aux services publics ou d'intérêt collectif et à\nl'exploitation agricole sont seules autorisées en zone A. Est également autorisé, en application du\n2º de l'article R. 123-12, le changement de destination des bâtiments agricoles identifiés dans les\ndocuments graphiques du règlement.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Annexe B 140","    Ville de Puteaux\nArticle R123-8\n(Décret nº 77-736 du 7 juillet 1977 Journal Officiel du 8 juillet 1977)\n(Décret nº 81-225 du 10 mars 1981 art. 11 Journal Officiel du 11 mars 1981)\n(Décret nº 83-813 du 9 septembre 1983 art. 2 Journal Officiel du 11 septembre 1983 date d'entrée en vigueur 1 OCTOBRE\n1983)\n(Décret nº 86-52 du 10 janvier 1986 art. 3 3º Journal Officiel du 14 janvier 1986)\n(Décret nº 96-717 du 9 août 1996 art. 3 I Journal Officiel du 14 août 1996)\n(Loi nº 98-913 du 12 octobre 1998 art. 28 I, II Journal Officiel du 13 octobre 1998)\n(Décret nº 2001-260 du 27 mars 2001 art. 1 Journal Officiel du 28 mars 2001)\nLes zones naturelles et forestières sont dites \"zones N\". Peuvent être classés en zone naturelle et\nforestière les secteurs de la commune, équipés ou non, à protéger en raison soit de la qualité des\nsites, des milieux naturels, des paysages et de leur intérêt, notamment du point de vue esthétique,\nhistorique ou écologique, soit de l'existence d'une exploitation forestière, soit de leur caractère\nd'espaces naturels.\nEn zone N peuvent être délimités des périmètres à l'intérieur desquels s'effectuent les transferts des\npossibilités de construire prévus à l'article L. 123-4. Les terrains présentant un intérêt pour le\ndéveloppement des exploitations agricoles et forestières sont exclus de la partie de ces périmètres\nqui    bénéficie    des    transferts    de    coefficient    d'occupation    des    sols.\nEn dehors des périmètres définis à l'alinéa précédent, des constructions peuvent être autorisées\ndans des secteurs de taille et de capacité d'accueil limitées, à la condition qu'elles ne portent atteinte\nni à la préservation des sols agricoles et forestiers ni à la sauvegarde des sites, milieux naturels et\npaysages.\nArticle R123-9\n(Décret nº 76-432 du 14 mai 1976 Journal Officiel du 19 mai 1976)\n(Décret nº 83-813 du 9 septembre 1983 art. 2 Journal Officiel du 11 septembre 1983 date d'entrée en vigueur 1 OCTOBRE\n1983)\n(Décret nº 96-717 du 9 août 1996 art. 3 II Journal Officiel du 14 août 1996)\n(Loi nº 98-913 du 12 octobre 1998 art. 29 Journal Officiel du 13 octobre 1998)\n(Décret nº 2001-260 du 27 mars 2001 art. 1 Journal Officiel du 28 mars 2001)\n(Décret nº 2004-531 du 9 juin 2004 art. 2 VII Journal Officiel du 13 juin 2004)\nLe règlement peut comprendre tout ou partie des règles suivantes :\n  1º Les occupations et utilisations du sol interdites ;\n  2º Les occupations et utilisations du sol soumises à des conditions particulières ;\n  3º Les conditions de desserte des terrains par les voies publiques ou privées et d'accès\n    aux voies ouvertes au public ;\n  4º Les conditions de desserte des terrains par les réseaux publics d'eau, d'électricité et\n    d'assainissement, ainsi que, dans les zones relevant de l'assainissement non collectif\n    délimitées en application de l'article L. 2224-10 du code général des collectivités\n    territoriales, les conditions de réalisation d'un assainissement individuel ;\n  5º La superficie minimale des terrains constructibles, lorsque cette règle est justifiée par\n    des contraintes techniques relatives à la réalisation d'un dispositif d'assainissement non\n    collectif ou lorsque cette règle est justifiée pour préserver l'urbanisation traditionnelle ou\n    l'intérêt paysager de la zone considérée ;\n  6º L'implantation des constructions par rapport aux voies et emprises publiques ;\n  7º L'implantation des constructions par rapport aux limites séparatives ;\n  8º L'implantation des constructions les unes par rapport aux autres sur une même\n    propriété ;\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Annexe B 141","    Ville de Puteaux\n   9º L'emprise au sol des constructions ;\n  10º La hauteur maximale des constructions ;\n  11º L'aspect extérieur des constructions et l'aménagement de leurs abords ainsi que,\n    éventuellement, les prescriptions de nature à assurer la protection des éléments de\n    paysage, des quartiers, îlots, immeubles, espaces publics, monuments, sites et\n    secteurs à protéger mentionnés au i de l'article R. 123-11 ;\n  12º Les obligations imposées aux constructeurs en matière de réalisation d'aires de\n    stationnement ;\n  13º Les obligations imposées aux constructeurs en matière de réalisation d'espaces libres,\n    d'aires de jeux et de loisirs, et de plantations ;\n  14º Le coefficient d'occupation du sol défini par l'article R. 123-10 et, le cas échéant, dans\n    les zones d'aménagement concerté, la surface de plancher développée hors œuvre\n    nette dont la construction est autorisée dans chaque îlot.\nLorsque le plan de déplacements urbains a délimité, en application de l'article 28-1-2 de la loi nº 82-\n1153 du 30 décembre 1982 modifiée, des périmètres à l'intérieur desquels les conditions de\ndesserte par les transports publics réguliers permettent de réduire ou de supprimer les obligations\nimposées en matière de réalisation d'aires de stationnement, notamment lors de la construction\nd'immeubles de bureaux, le plan local d'urbanisme respecte ces limitations et, le cas échéant, fixe\nun nombre maximum d'aires de stationnement à réaliser lors de la construction de bâtiments à un\nusage    autre    que    d'habitation.\nDans les secteurs mentionnés au troisième alinéa de l'article R. 123-8, le règlement prévoit les\nconditions de hauteur, d'implantation et de densité des constructions permettant d'assurer l'insertion\nde ces constructions dans l'environnement et compatibles avec le maintien du caractère naturel de\nla zone.\nLes règles édictées dans le présent article peuvent être différentes, dans une même zone, selon\nque les constructions sont destinées à l'habitation, à l'hébergement hôtelier, aux bureaux, au\ncommerce, à l'artisanat, à l'industrie, à l'exploitation agricole ou forestière ou à la fonction d'entrepôt.\nEn outre, des règles particulières peuvent être applicables aux constructions et installations\nnécessaires    aux    services    publics    ou    d'intérêt    collectif.\nLes règles mentionnées aux 6º et 7º relatives à l'implantation des constructions par rapport aux voies\net emprises publiques et par rapport aux limites séparatives, qui ne sont pas fixées dans le\nrèglement, doivent figurer dans les documents graphiques.\nArticle R123-10\n(Décret nº 77-736 du 7 juillet 1977 Journal Officiel du 8 juillet 1977)\n(Décret nº 83-813 du 9 septembre 1983 art. 2 Journal Officiel du 11 septembre 1983 date d'entrée en vigueur 1 OCTOBRE\n1983)\n(Décret nº 96-717 du 9 août 1996 art. 3 III Journal Officiel du 14 août 1996)\n(Loi nº 98-913 du 12 octobre 1998 art. 30, art. 40 Journal Officiel du 13 octobre 1998)\n(Décret nº 2001-260 du 27 mars 2001 art. 1 Journal Officiel du 28 mars 2001)\n(Décret nº 2004-531 du 9 juin 2004 art. 2 VIII Journal Officiel du 13 juin 2004)\nLe coefficient d'occupation du sol qui détermine la densité de construction admise est le rapport\nexprimant le nombre de mètres carrés de plancher hors oeuvre nette ou le nombre de mètres cubes\nsusceptibles    d'être    construits    par    mètre    carré    de    sol.\nPour le calcul du coefficient d'occupation du sol, la superficie du ou des terrains faisant l'objet de la\ndemande d'autorisation de construire ou de lotir comprend, le cas échéant, les terrains classés\ncomme espaces boisés en application de l'article L. 130-1 et les terrains cédés gratuitement dans\nles conditions fixées par les articles R. 332-15 et R. 332-16.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Annexe B 142","    Ville de Puteaux\nLa surface hors œuvre nette ou, le cas échéant, le volume des bâtiments existants conservés sur le\nou les terrains faisant l'objet de la demande est déduit des possibilités de construction.\nLes emplacements réservés mentionnés au 8º de l'article L. 123-1 sont déduits de la superficie prise\nen compte pour le calcul des possibilités de construction. Toutefois, le propriétaire d'un terrain dont\nune partie est comprise dans un de ces emplacements et qui accepte de céder gratuitement cette\npartie à la collectivité bénéficiaire de la réserve peut être autorisé à reporter sur la partie restante de\nson terrain un droit de construire correspondant à tout ou partie du coefficient d'occupation du sol\naffectant la superficie du terrain qu'il cède gratuitement à la collectivité.\nLe règlement peut fixer un coefficient d'occupation des sols dans les zones U et AU.\nDans ces zones ou parties de zone, il peut fixer des coefficients différents suivant les catégories de\ndestination des constructions définies à l'avant-dernier alinéa de l'article R. 123-9. Il peut également\nprévoir, dans les conditions prévues à l'article L. 123-1-1, la limitation des droits à construire en cas\nde    division    d'un    terrain    bâti.\nLorsque dans la zone N a été délimité un périmètre pour effectuer les transferts des possibilités de\nconstruction prévus à l'article L. 123-4, le règlement fixe deux coefficients d'occupation des sols, l'un\napplicable à l'ensemble des terrains inclus dans le périmètre délimité pour le calcul des transferts et\nl'autre définissant la densité maximale des constructions du secteur dans lequel celles-ci peuvent\nêtre implantées.\nCODE CIVIL :\nArticle 675\nL'un des voisins ne peut, sans le consentement de l'autre, pratiquer dans le mur mitoyen aucune\nfenêtre ou ouverture, en quelque manière que ce soit, même à verre dormant.\nArticle 676\nLe propriétaire d'un mur non mitoyen, joignant immédiatement l'héritage d'autrui, peut pratiquer dans\nce mur des jours ou fenêtres à fer maillé et verre dormant.\nCes fenêtres doivent être garnies d'un treillis de fer, dont les mailles auront un décimètre (environ\ntrois pouces huit lignes) d'ouverture au plus, et d'un châssis à verre dormant.\nArticle 677\nCes fenêtres ou jours ne peuvent être établis qu'à vingt-six décimètres (huit pieds) au-dessus du\nplancher ou sol de la chambre qu'on veut éclairer, si c'est à rez-de-chaussée, et à dix-neuf\ndécimètres (six pieds) au-dessus du plancher pour les étages supérieurs.\nArticle 678\n(Loi nº 67-1253 du 30 décembre 1967 art. 35 Journal Officiel du 3 janvier 1968 rectificatif JORF 12 janvier)\nOn ne peut avoir des vues droites ou fenêtres d'aspect, ni balcons ou autres semblables saillies sur\nl'héritage clos ou non clos de son voisin, s'il n'y a dix-neuf décimètres de distance entre le mur où\non les pratique et ledit héritage, à moins que le fonds ou la partie du fonds sur lequel s'exerce la\nvue, ne soit déjà grevé, au profit du fonds qui en bénéficie, d'une servitude de passage faisant\nobstacle à l'édification de constructions.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Annexe B 143","    Ville de Puteaux\nArticle 679\n(Loi nº 67-1253 du 30 décembre 1967 art. 35 Journal Officiel du 3 janvier 1968 rectificatif JORF 12 janvier 1968)\nOn ne peut, sous la même réserve, avoir des vues par côté ou obliques sur le même héritage, s'il\nn'y a six décimètres de distance.\nArticle 680\nLa distance dont il est parlé dans les deux articles précédents, se compte depuis le parement\nextérieur du mur où l'ouverture se fait, et, s'il y a balcons ou autres semblables saillies, depuis leur\nligne extérieure jusqu'à la ligne de séparation des deux propriétés.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Annexe B 144","    Ville de Puteaux\nANNEXE C\nNOMENCLATURE DES TYPES D’ACTIVITES\n(I.N.S.E.E. - Décret n° 92.11.29 du 2 octobre 1992)\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Annexe C 145","    Ville de Puteaux\n1- Définition de la notion d’activités : Industrielles ou autres\nLes locaux affectés selon les rubriques énoncées ci-dessous :\n    •   Matières premières :    - 01 à 05\n    •   Industries :    - 10 à 45\n    •   Commerces de gros :    - 50 à 51\n    •   Services :    - 60\n    - 61 à 62\n    - 63 (sauf 63.3 et 63.4)\n    - 74.3\n    - 90\n    - 93.OA\n2-    Définition de la notion de la notion de bureaux\na) Dans le cas d’activités industrielles, artisanales ou autres relevant des rubriques ci-\n   dessus, sont considérés comme des locaux à usage de bureaux :\n    • les locaux affectés à la réception du public pour la partie de la surface de plancher\n    qui excède 200 m2 H.O.N.,\n    • les locaux utilisés par des services administratifs pour la partie de la S.H.O.N. qui\n    excède 20 % de celle de l’établissement.\nb) Les locaux dans lesquels est exercée une profession répertoriée parmi les rubriques\n   suivantes :\n    • Services : - 64\n    - 65.1A - 65.1F - 65.2C - 65.2E - 65.2F\n    - 66.0C - 66.0F\n    - 67.1\n    - 70 (sauf 70.3A)\n    - 72 (sauf 72.5)\n    - 73\n    - 74.2C - 74.4 - 74.5 - 74.8 (sauf 74.8A)\n    - 80 (sauf 80.4)\n    - 85.3\n    - 92\n3-    Définition de la notion de commerces\na) Dans le cas d’activités industrielles, artisanales, de bureaux ou autres relevant des\n   rubriques ci-dessus, sont considérés comme des locaux à usage de commerce :\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Annexe C 146","    Ville de Puteaux\n    • les locaux affectés à la réception du public pour la partie de la surface hors oeuvre\n    de plancher n’excédant pas 200 m2 H.O.N.,\n    • les locaux réservés à la vente pour la partie n’excédant pas 200 m2.\nb) Les locaux dans lesquels est exercée une profession répertoriée par les rubriques\n   suivantes :\n    • Commerces de détail : 52\n    • Services : - 50 (sauf 50.3)\n    - 52 (sauf 52.6H)\n    - 55 (sauf 55.3B)\n    - 63.3\n    - 65.1C - 65.1D - 65.1E - 65.2A\n    - 66.0A - 66.0E - 66.0G\n    - 67.2\n    - 70.3A\n    - 71\n    - 72.5\n    - 74.7\n    - 74.8A\n    - 80.4A\n    - 85.1K\n    - 93.0B - 93.0D - 93.0E - 93.0G - 93.0H - 93.0L - 93.0N\n    - 95\n4-    Définition de la notion de services à vocation tertiaire\nLes locaux dans lesquels est exercée une profession répertoriée par les rubriques\nsuivantes :\n    • Services : - 74.1 - 74.2A - 74.2B - 74.6\n    - 80.4C - 80.4D\n    - 85.1 (sauf 85.1K) - 85.2\n    - 93.0K\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Annexe C 147","    Ville de Puteaux\nLISTE DES ACTIVITÉS ET EMBOÎTEMENT CITI-NACE-NAF\nGuide de lecture\nOn trouvera ci-après la liste des intitulés de la nomenclature d'activités française (NAF), tous niveaux\nconfondus : sections codifiées avec une lettre, sous-sections codifiées avec deux lettres, divisions codifiées\navec deux chiffres, groupes codifiés avec trois chiffres, classes françaises codifiées avec trois chiffres et une\nlettre ;\ncette liste intercale également les intitulés des classes européennes de la NACE rév. 1 quand elles donnent\nlieuà plusieurs classes dans la NAF.\nLe passage NACE-NAF est donc identifiable sur les libellés aussi bien que sur les deux colonnes de codes,\nseul le détail au niveau des classes pouvant différer entre la nomenclature européenne et la nomenclature\nfrançaise. On indique également la correspondance avec les codes de la CITI rév. 3, qui apparaissent dans\nla premièrecolonne : les sections et divisions sont identiques par leur contenu dans les trois nomenclatures ;\nles intitulés des groupes et classes de la CITI ne sont pas repris ici : leur contenu correspond souvent au\nregroupement de groupes ou classes NACE (et donc NAF). Pour la lisibilité tectural et définir le cas échéant, le prescriptions de nature à assurer leur préservation, leur\nconservation, pour leur restauration.\nCes éléments bâtis sont identifiés sur le plan de zonage, pièce n° 5 du dossier de PLU, par une\nlettrine spécifique, comprenant un numéro d’ordre, repris dans les tableaux ci-après.\nLe règlement écrit du PLU auquel est adjoint cette annexe, prévoit notamment aux articles 2 et 11,\nles disposions particulières applicables à ces éléments bâtis protégés. Ces dispositions visent non\npas à interdire toute évolution des constructions, mais à encadrer les travaux réalisés afin que ces\nderniers préservent et mettent en valeur les caractéristiques qui ont prévalu à fonder leur\nidentification. C’est dans cette perspective que le recèlement renvoie à cette annexe qui préciser,\nci-dessous, pour chaque construction identifiée les caractéristiques à préserver et à mettre en\nvaleur.\nPar ailleurs, ces constructions, identifiées sur le fondement de l’article L. 151-19 du code précité\nsont soumises à un régime particulier, au titre de l’article R 421-17 et R 421-28 du même code.\n   -   Au titre de l’article R 421-17 C Urb : les travaux exécutés sur des constructions existantes,\n    identifiées au titre du L. 151-19, à l'exception des travaux d'entretien ou de réparations\n    ordinaires, et les changements de destination des constructions existantes, et ayant pour\n    effet de modifier ou de supprimer un élément que le plan local d'urbanisme ou un document\n    d'urbanisme en tenant lieu a identifié, doivent être précédés d'une déclaration préalable\n    lorsqu'ils ne sont pas soumis à permis de construire en application des articles R. 421-14 à\n    R. 421-16.\n   -   Au titre de l’article R 421-28 C Urb : les travaux à réaliser sur les constructions identifiées\n    au titre L. 151-19 C Urb et ayant pour objet de démolir ou de rendre inutilisable tout ou partie\n    d'une construction, doivent être précédés d'un permis de démolir.\n function pdfLink(p){
  if(pdfMode==='online') return DATA.pdf.url+'#page='+p;
  if(DATA.pdf.parts&&DATA.pdf.parts.length){
    const part=DATA.pdf.parts.find(r=>p>=r[0]&&p<=r[1]);
    if(part) return encodeURI(part[2])+'#page='+(p-part[0]+1);
  }
  return encodeURI(DATA.pdf.local)+'#page='+p;
}

}
// ---------- views
function crumb(s){const a=[];let p=par[s.i];while(p!==null){a.unshift(`<a href="#s/${p}">${esc(S[p].t)}</a>`);p=par[p]}return a.join(' › ')}
function chips(s){return s.th.map(t=>`<a class="chip" href="#temas/${t}">${esc(TH[t])}</a>`).join(' ')}
function pagesHtml(a,b,hl){
  const out=[];const max=Math.min(b,a+11);
  for(let p=a;p<=max;p++){
    let t=esc(DATA.pages[p-1]||'');
    if(hl&&p===a){const h=esc(hl).slice(0,40); const i=t.indexOf(h.slice(0,25)); if(i>=0){const e=t.indexOf('\n',i); t=t.slice(0,i)+'<span class="hh">'+t.slice(i,e<0?undefined:e)+'</span>'+(e<0?'':t.slice(e))}}
    out.push(`<div class="pg"><div class="ph"><span>Página ${p} del PDF</span><a target="_blank" rel="noopener" href="${pdfLink(p)}">abrir en el PDF ↗</a></div><pre>${t}</pre></div>`);
  }
  if(b>max) out.push(`<div class="box">Esta sección sigue hasta la página ${b}. <button data-more="${max+1},${b}">Mostrar 12 páginas más</button></div>`);
  return out.join('');
}
function bindMore(hl){document.querySelectorAll('[data-more]').forEach(btn=>btn.onclick=()=>{const [a,b]=btn.dataset.more.split(',').map(Number); const div=document.createElement('div'); div.innerHTML=pagesHtml(a,b); btn.parentNode.replaceWith(div); bindMore()})}
function viewSec(i){
  const s=S[i]; if(!s){viewHome();return}
  cur=i; renderTree(); const n=$('#tree .cur'); if(n) n.scrollIntoView({block:'nearest'});
  const k=kids[i];
  const end=Math.max(s.p,(k.length?S[k[0]].p:s.n));
  const fav=favs[i]?'on':'';
  $('#main').innerHTML=`<div class="crumb">${crumb(s)}</div>
  <h1 class="st">${esc(s.t)} <button class="star ${fav}" id="fav" title="Favorito">★</button></h1>
  <div class="meta">${s.z?`<span class="chip">Zona ${esc(s.z)}</span>`:''} ${chips(s)} <span>págs. ${s.p}–${Math.max(s.q,s.p)}${s.a?' (posición aproximada)':''}</span></div>
  <div class="btns no-print" style="margin-bottom:14px">${pdfBtn(s.p)} ${i>0?`<a class="b" href="#s/${i-1}">← Anterior</a>`:''} ${i<S.length-1?`<a class="b" href="#s/${i+1}">Siguiente →</a>`:''}</div>
  ${k.length?`<div class="box sub-list"><h3>Contenido de esta sección</h3>${k.map(j=>`<a href="#s/${j}">${esc(S[j].t)} <span class="pg" style="color:var(--muted);font-size:12px">p. ${S[j].p}</span></a>`).join('')}</div>`:''}
  <div class="box notes no-print"><h3>Mis notas</h3><textarea id="note" placeholder="Notas sobre esta sección (se guardan en este navegador)">${esc(notes[i]||'')}</textarea></div>
  <h3 style="font-size:14px;color:var(--muted);margin:18px 0 8px">TEXTO OFICIAL (extraído del PDF; tablas y figuras: ver el PDF)</h3>
  ${pagesHtml(s.p,end,s.t)}`;
  bindMore();
  $('#fav').onclick=()=>{if(favs[i]) delete favs[i]; else favs[i]=1; store.set('favs',favs); $('#fav').classList.toggle('on')};
  $('#note').oninput=e=>{notes[i]=e.target.value; if(!notes[i]) delete notes[i]; store.set('notes',notes)};
  window.scrollTo(0,0);
}
function secsFor(th){
  return S.filter(s=>s.th.includes(th));
}
function viewProy(id){
  const P=PROY.find(p=>p.id===id);
  const tabs=`<div class="pj-tabs">${PROY.map(p=>`<a href="#proy/${p.id}" class="${p.id===id?'on':''}"><b>${esc(p.nom)}</b><span>${esc(p.sub)}</span></a>`).join('')}</div>`;
  if(!P){$('#main').innerHTML=`<h1 class="st">¿Qué proyecto tienes?</h1><p>Elige el tipo de obra. Te digo qué artículos de este ${DATA.k.startsWith('pold')?'PLU':'PLUi'} consultar, por orden, y puedes marcarlos a medida que los revisas.</p>${tabs}`;return}
  const ck=checks[id]||{};
  let total=0,done=0;
  const zsel=DATA.zones.length?`<div class="zsel"><span style="font-size:13px;color:var(--muted)">Tu zona:</span><span class="chip ${zone===''?'on':''}" data-z="">sin elegir</span>${DATA.zones.map(z=>`<span class="chip ${zone===z?'on':''}" data-z="${esc(z)}">${esc(z)}</span>`).join('')}</div>`:'';
  const groups=P.grupos.map(([th,txt])=>{
    let list=secsFor(th).filter(s=>!s.z||!zone||s.z===zone);
    // prefer most specific: drop parents whose children also listed
    const ids=new Set(list.map(s=>s.i));
    list=list.filter(s=>!kids[s.i].some(j=>ids.has(j)));
    const common=list.filter(s=>!s.z), zl=list.filter(s=>s.z);
    const item=s=>{total++; const ok=ck[s.i]; if(ok) done++; return `<div class="pj-a ${ok?'ok':''}"><input type="checkbox" data-ck="${s.i}" ${ok?'checked':''}><a href="#s/${s.i}">${esc(s.t)}${s.z?`<span class="zn">${esc(s.z)}</span>`:''}<span class="tt">p. ${s.p} · ${esc(crumb(s).replace(/<[^>]+>/g,''))}</span></a></div>`};
    let body='';
    if(common.length) body+=`<div style="font-size:12px;color:var(--muted);margin-top:6px">Comunes a todas las zonas</div>`+common.slice(0,12).map(item).join('')+(common.length>12?`<div class="empty">… y ${common.length-12} más en <a href="#temas/${th}">Por tema</a></div>`:'');
    if(zl.length) body+=`<div style="font-size:12px;color:var(--muted);margin-top:6px">${zone?'Zona '+esc(zone):'Por zona (elige tu zona arriba para filtrar)'}</div>`+zl.slice(0,zone?30:10).map(item).join('')+(!zone&&zl.length>10?`<div class="empty">… y ${zl.length-10} más: elige tu zona.</div>`:'');
    if(!body) body=`<div class="empty">No he encontrado un artículo con este tema en el índice. Usa el buscador (arriba) con palabras clave.</div>`;
    return `<div class="box pj-g"><h3>${esc(TH[th])}</h3><div class="reg">${esc(txt)}</div>${body}</div>`;
  }).join('');
  $('#main').innerHTML=`${tabs}<h1 class="st">${esc(P.nom)}</h1>
  <div class="pj-cols"><div class="box"><h3>Trámite</h3><ul>${P.tramite.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="box"><h3>Antes de leer el reglamento</h3><ul>${P.antes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
  ${zsel}
  <div class="pj-bar"><div class="pj-prog"><i style="width:${total?Math.round(done*100/total):0}%"></i></div><span style="font-size:13px">${done} de ${total} revisados</span><button id="pjReset">Desmarcar todo</button><button onclick="print()">Imprimir</button></div>
  <div class="warn">La lista se genera por tema a partir del índice del reglamento. Confirma siempre en el texto y en el plano de zonificación; algunos artículos tratan varios temas a la vez.</div>
  ${groups}`;
  $('#main').querySelectorAll('[data-z]').forEach(e=>e.onclick=()=>{zone=e.dataset.z; store.set('zone',zone); renderFilters(); renderTree(); viewProy(id)});
  $('#main').querySelectorAll('[data-ck]').forEach(e=>e.onchange=()=>{const c=checks[id]=checks[id]||{}; if(e.checked) c[e.dataset.ck]=1; else delete c[e.dataset.ck]; store.set('checks',checks); viewProy(id)});
  $('#pjReset').onclick=()=>{checks[id]={}; store.set('checks',checks); viewProy(id)};
}
function viewTemas(th){
  const list=DATA.themes.map(([k,l])=>`<a class="chip ${k===th?'on':''}" href="#temas/${k}">${esc(l)} (${secsFor(k).length})</a>`).join(' ');
  let body='';
  if(th){
    const ss=secsFor(th).filter(s=>!zone||!s.z||s.z===zone);
    body=`<h2 style="font-size:18px">${esc(TH[th])}${zone?' · zona '+esc(zone):''}</h2>`+(ss.map(s=>`<div class="r" onclick="location.hash='#s/${s.i}'"><span class="cd">p. ${s.p}</span>${esc(s.t)} ${s.z?`<span class="chip">${esc(s.z)}</span>`:''}<div class="sn">${esc(crumb(s).replace(/<[^>]+>/g,''))}</div></div>`).join('')||'<div class="empty">Ninguna sección del índice. Prueba el buscador.</div>');
  }
  $('#main').innerHTML=`<h1 class="st">Por tema</h1><p>Secciones del reglamento agrupadas por tema (según su título).${DATA.zones.length?' Si eliges tu zona en el panel izquierdo, se ocultan las de otras zonas.':''}</p><div class="th-l" style="margin-bottom:14px">${list}</div><div class="results">${body}</div>`;
}
function secOfPage(p){let best=null;S.forEach(s=>{if(s.p<=p&&(!best||s.p>=best.p))best=s});return best}
function viewSearch(q){
  const nq=norm(q).trim(); if(nq.length<2){viewHome();return}
  const terms=nq.split(/\s+/);
  const res=[];
  const tit=S.filter(s=>terms.every(t=>norm(s.t).includes(t)));
  for(let i=0;i<DATA.pages.length&&res.length<300;i++){
    const np=NP[i]; if(terms.every(t=>np.includes(t))){
      const j=np.indexOf(terms[0]); const raw=DATA.pages[i]; const a=Math.max(0,j-90);
      res.push({p:i+1,sn:raw.slice(a,a+260).replace(/\s+/g,' ')});
    }
  }
  const hl=t=>{let h=esc(t);terms.forEach(x=>{if(x.length<2)return;const re=new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');h=h.replace(re,m=>`<mark>${m}</mark>`)});return h};
  $('#main').innerHTML=`<h1 class="st">Resultados para «${esc(q)}»</h1>
  ${tit.length?`<div class="box"><h3>En títulos de secciones (${tit.length})</h3>${tit.slice(0,40).map(s=>`<div class="r" onclick="location.hash='#s/${s.i}'"><span class="cd">p. ${s.p}</span>${esc(s.t)}</div>`).join('')}</div>`:''}
  <div class="results"><h3 style="font-size:14px;color:var(--muted)">EN EL TEXTO: ${res.length}${res.length>=300?'+':''} páginas</h3>${res.map(r=>{const s=secOfPage(r.p);return `<div class="r" data-p="${r.p}" data-s="${s?s.i:''}"><span class="cd">p. ${r.p}</span>${s?esc(s.t):''}<div class="sn">… ${hl(r.sn)} …</div></div>`}).join('')}</div>`;
  $('#main').querySelectorAll('.results .r[data-p]').forEach(e=>e.onclick=()=>{location.hash='#p/'+e.dataset.p});
}
function viewPage(p){
  p=Math.max(1,Math.min(DATA.npages,p)); const s=secOfPage(p);
  $('#main').innerHTML=`<div class="crumb">${s?crumb(s)+(crumb(s)?' › ':'')+`<a href="#s/${s.i}">${esc(s.t)}</a>`:''}</div><h1 class="st">Página ${p}</h1>
  <div class="btns no-print" style="margin-bottom:14px">${pdfBtn(p)} ${p>1?`<a class="b" href="#p/${p-1}">← p. ${p-1}</a>`:''} ${p<DATA.npages?`<a class="b" href="#p/${p+1}">p. ${p+1} →</a>`:''}</div>${pagesHtml(p,p)}`;
  const q=$('#q').value; if(q){const terms=norm(q).split(/\s+/).filter(x=>x.length>1); const pre=$('#main pre'); let h=pre.innerHTML; terms.forEach(x=>{const re=new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'); h=h.replace(re,m=>`<mark>${m}</mark>`)}); pre.innerHTML=h}
  window.scrollTo(0,0);
}
function viewNotas(){
  const f=Object.keys(favs).map(Number).filter(i=>S[i]); const n=Object.keys(notes).map(Number).filter(i=>S[i]);
  $('#main').innerHTML=`<h1 class="st">Mis notas y favoritos</h1><p class="empty">Se guardan solo en este navegador.</p>
  <div class="box"><h3>Favoritos (${f.length})</h3>${f.map(i=>`<div class="r" onclick="location.hash='#s/${i}'"><span class="cd">p. ${S[i].p}</span>${esc(S[i].t)}</div>`).join('')||'<div class="empty">Marca secciones con ★.</div>'}</div>
  <div class="box"><h3>Notas (${n.length})</h3>${n.map(i=>`<div class="r" onclick="location.hash='#s/${i}'"><span class="cd">p. ${S[i].p}</span>${esc(S[i].t)}<div class="sn">${esc(notes[i])}</div></div>`).join('')||'<div class="empty">Escribe notas en cualquier sección.</div>'}</div>`;
}
function viewHome(){
  const top=S.filter(s=>s.l===0);
  $('#main').innerHTML=`<h1 class="st">${esc(DATA.nom)}</h1>
  <div class="box"><div class="kv"><b>Documento</b><span>Reglamento escrito del ${DATA.k.startsWith('pold')?'PLU':'PLUi'} (${DATA.npages} páginas)</span><b>Estado</b><span>${esc(DATA.estado)}</span><b>Municipios</b><span>${esc(DATA.communes)}</span><b>Fuente</b><span><a href="${DATA.pdf.url}" target="_blank" rel="noopener">Géoportail de l'urbanisme (PDF oficial)</a></span></div></div>
  <div class="box"><h3>Cómo usarlo</h3><ul style="margin:0;padding-left:18px">
   <li><b>Por proyecto</b>: elige el tipo de obra y tu zona; te lista los artículos a revisar, por orden, con casillas.</li>
   <li><b>Explorar</b>: índice completo a la izquierda; cada sección muestra el texto oficial y el botón para abrir el PDF en esa página.</li>
   <li><b>Buscador</b>: busca en las ${DATA.npages} páginas (palabras en francés: <i>hauteur, clôture, pleine terre…</i>).</li>
   <li><b>Tu zona</b>: mírala en el <a href="https://www.geoportail-urbanisme.gouv.fr/map/" target="_blank" rel="noopener">mapa del Géoportail de l'urbanisme</a> (clic en la parcela) o en los planos de zonificación de la carpeta <i>Reglement</i>.</li></ul></div>
  <div class="pj-tabs">${PROY.map(p=>`<a href="#proy/${p.id}"><b>${esc(p.nom)}</b><span>${esc(p.sub)}</span></a>`).join('')}</div>
  <div class="box sub-list"><h3>Partes del reglamento</h3>${top.map(s=>`<a href="#s/${s.i}">${esc(s.t)} <span style="color:var(--muted);font-size:12px">p. ${s.p}</span></a>`).join('')}</div>
  <div class="box no-print"><h3>Abrir el PDF</h3><p style="font-size:13.5px;margin:0 0 8px">Los botones «Abrir en el PDF» usan: <b>${pdfMode==='local'?'tu copia en el PC (carpeta Reglement junto a este archivo)':'el PDF oficial en internet'}</b>.</p><button id="pdfToggle">Usar ${pdfMode==='local'?'el PDF en internet':'mi copia local'}</button></div>
  ${HOME_URL?`<p><a href="${HOME_URL}">← Volver al mapa de territorios</a></p>`:''}`;
  $('#pdfToggle').onclick=()=>{pdfMode=pdfMode==='local'?'online':'local'; store.set('pdfmode',pdfMode); viewHome(); toast('PDF: '+(pdfMode==='local'?'copia local':'internet'))};
}
const NP=DATA.pages.map(norm);
let qt;
$('#q').addEventListener('input',e=>{clearTimeout(qt); qt=setTimeout(()=>{const v=e.target.value.trim(); if(v.length>=2) location.hash='#q/'+encodeURIComponent(v); else if(!v) location.hash='#home'},350)});
function route(){
  const h=decodeURIComponent(location.hash.slice(1)||'home');
  const [v,a]=[h.split('/')[0],h.split('/').slice(1).join('/')];
  document.querySelectorAll('#tabs a').forEach(x=>x.classList.toggle('on',x.dataset.t===(v==='q'||v==='p'?'':v)));
  if(v==='s') viewSec(+a||0);
  else if(v==='proy') viewProy(a);
  else if(v==='temas') viewTemas(a);
  else if(v==='q'){ if($('#q').value!==a) $('#q').value=a; viewSearch(a)}
  else if(v==='p') viewPage(+a);
  else if(v==='notas') viewNotas();
  else viewHome();
}
window.addEventListener('hashchange',route);
renderFilters(); renderTree(); route();
</script>
</body>
</html>
