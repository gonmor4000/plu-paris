entation en vigueur et\n    particulièrement en ce qui concerne le traitement préalable de ces liquides.\n    • Les eaux issues des parcs de stationnements doivent subir un traitement de\n    débourbage et de déshuilage avant rejet dans le réseau collectif.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UB   64","    Ville de Puteaux\n4.2.1   EAUX PLUVIALES\n    • Les aménagements réalisés sur un terrain ne doivent pas faire obstacle au libre\n    écoulement des eaux pluviales (articles 640 et 641 du Code Civil). Lorsqu’il existe\n    un réseau collectif apte à recueillir les eaux pluviales, les aménagements sur le\n    terrain doivent garantir leur évacuation dans ledit réseau.\n    • Les aménagements réalisés sur tout terrain doivent intégrer les contraintes en\n    matière de rétention des eaux pluviales telles qu’elles garantissent un débit de fuite\n    conforme au règlement communal d’assainissement et au règlement\n    départemental des Hauts-de-Seine. Aussi, sont mis en œuvre toutes techniques et\n    aménagements (bassins de stockage, restitution et/ou système d’infiltration..)\n    appropriés à la nature des travaux projetés, sauf en cas d’impossibilité liée la taille\n    et à la configuration du terrain.\n4.3    ELECTRICITE – GAZ – TELECOMMUNICATIONS – RESEAUX CABLES\n    Les branchements privatifs de toute nature doivent être réalisés en souterrain jusqu’en\n    limite du domaine public et ne doivent pas rester apparents sur la construction.\n    L’aménageur ou le lotisseur doit réaliser l’infrastructure nécessaire à la distribution de\n    ces différents réseaux depuis le point de raccordement général jusqu’à la limite de\n    parcelle.\n4.4    DECHETS – ORDURES MENAGERES\n4.4.1   Toute nouvelle construction doit être pourvue d’un local correctement accessible et\n    dimensionné pour recevoir les divers conteneurs liés à la collecte sélective des ordures\n    ménagères et déchets industriels banals (DIB).\nARTICLE UB5 : CARACTERISTIQUES DES TERRAINS\n    Sans objet.\nARTICLE UB6 : IMPLANTATION DES CONSTRUCTIONS    PAR\nRAPPORT AUX VOIES ET EMPRISES PUBLIQUES\n6.1    La partie de la Dalle* du centre d’affaires de La Défense appartenant au domaine public\n    est considérée comme une voie ou une emprise publique au sens du présent article.\n    En conséquence, les règles d’implantations s’appliquant au niveau dalle* sont celles\n    figurant ci-dessous.\n6.2    Les constructions sur Dalle*peuvent être implantées soit à l’alignement, soit en retrait\n    par rapport aux voies et emprises publiques d’au moins 1 mètre.\n6.3    Les constructions sous Dalle* peuvent être implantées soit à l’alignement, soit en retrait\n    par rapport aux voies et emprises publiques.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UB   65","    Ville de Puteaux\nARTICLE UB7 : IMPLANTATION DES    CONSTRUCTIONS    PAR\nRAPPORT AUX LIMITES SEPARATIVES\nNOTA Cas général : la limite séparative est la limite entre deux unités foncières contigües\n    ayant des propriétaires différents.\n    Dans la zone UB, la définition de la limite séparative est différente selon que :\n    -  la construction est édifiée sur un terrain ayant fait l’objet d’une division foncière,\n    -  la construction est édifiée suite à une division en volumes.\n    Dans le premier cas, celui d’une division foncière, la définition énoncée dans le cas\n    général ci-avant s’applique.\n    Dans le second cas, celui d’une division en volumes, la limite séparative est constituée\n    par la limite extérieure du volume de la construction ou, le cas échéant, du volume\n    comprenant les abords de la construction.\n7.1    Les constructions peuvent être implantées soit en limite, soit en retrait des limites\n    séparatives d’au moins 2 mètres.\n7.2    Les constructions et installations nécessaires au réseau de transport public du Grand\n    Paris peuvent être implantées en limites séparatives ou respecter un retrait de 1m au\n    maximum.\nARTICLE UB8 : IMPLANTATION DES CONSTRUCTIONS LES UNES\nPAR RAPPORT AUX AUTRES SUR UNE MEME PROPRIETE\n8.1    Sur dalle*, à moins que les bâtiments ne soient contigus, la construction de plusieurs\n    bâtiments sur une même propriété est autorisée, à condition que la plus courte distance\n    mesurée normalement entre deux bâtiments soit supérieure ou égale à 8 mètres.\n8.2    Sous dalle*, il n’est pas fixé de règle.\nARTICLE UB9 : EMPRISE AU SOL\nLes infrastructures ne sont pas comptabilisées dans le calcul de l’emprise.\nARTICLE UB10 : HAUTEUR MAXIMALE DES CONSTRUCTIONS\n10.1   DEFINITION ET MODE DE CALCUL DE LA HAUTEUR\n10.1.1 La hauteur des constructions est définie :\n    • Soit comme une hauteur maximale (faîtage ou acrotère).\n    • Soit en référence à une cote exprimée par rapport au Nivellement Général de la\n    France (NGF).\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UB   66","    Ville de Puteaux\n10.2   REGLES GENERALES\n10.2.1 La hauteur maximale des constructions et installations est limitée à 10 mètres, mesurée\n    à partir du niveau moyen fini de la Dalle* impactée par le projet ou en l’absence de\n    Dalle*, à partir du niveau moyen de la voirie de desserte jusqu’au point de référence le\n    plus élevé du bâtiment (faîtage ou acrotère), les ouvrages techniques, cheminées et\n    autres superstructures de faible emprise étant exclus (antennes, mats, etc.).\n10.2.2 Dans le cas d’un terrain en pente le niveau de référence est la moyenne du point le\n    plus haut et du point le plus bas du terrain ou de la Dalle*impactée par le projet.\n10.3   REGLES PARTICULIERES\n    Ne sont pas soumis à l’article UB10.2, les constructions ou installations nécessaires\n    au service public ou d’intérêt collectif, ni les installations relevant d’œuvres d’art, ainsi\n    que dans les secteurs délimités graphiquement au Plan de Zonage pour lesquels une\n    limitation est fixée en cote NGF.\nARTICLE UB11 : ASPECT EXTERIEUR DES CONSTRUCTIONS\n    •   Les constructions, par leur situation, leur architecture, leurs dimensions, l’aspect\n    extérieur des bâtiments ou ouvrages à édifier ou à modifier, ne doivent pas porter\n    atteinte au caractère ni à l’intérêt des lieux avoisinants, aux sites, aux paysages\n    naturels, urbains ainsi qu’à la conservation des perspectives monumentales (article\n    R 111-21 du Code de l’Urbanisme).\n    •   La bonne intégration des constructions à leur environnement sera recherchée par\n    :\n    - leurs dimensions et la composition de leurs volumes ;\n    - l’aspect et la mise en œuvre des matériaux ;\n    - le rythme et la proportion des ouvertures ;\n    - l’harmonisation des couleurs.\n    •   Le volume, la modénature et les rythmes de percement des constructions nouvelles\n    doivent s’harmoniser avec ceux du bâti existant, en s’inscrivant dans la composition\n    générale de l’îlot, de la rue ou du site.\n11.1   FACADES\n11.1.1 Pour les façades, l’aspect tôle ondulée est interdit.\n11.1.2 Les matériaux tels que carreaux de plâtre, briques creuses, parpaings... destinés à être\n    recouverts, ne peuvent être laissés apparents.\n11.2   TOITURES\n11.2.1 Un soin particulier est demandé pour toutes les toitures considérées comme une\n    cinquième façade quelle que soit leur attitude. Sont donc notamment interdits les\n    aspects tôle ondulée, onduline, fibrociment, papier goudronné, béton peint, shingle,\n    « … ».\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UB   67","    Ville de Puteaux\n11.2.2 Il pourra être admis une terrasse en tout ou partie de la toiture d’une construction neuve\n    ou lors d’une extension, surélévation, réhabilitation d’un bâtiment existant ; si la\n    terrasse est inaccessible, elle doit être entièrement végétalisée.\n    Les tropéziennes (voir définition en annexes) sont interdites.\n11.2.3 Pour les constructions neuves, les descentes d’eau pluviales devront être intégrées au\n    volume de la construction et non apparentes sur la façade principale. Les chenaux\n    seront intégrés dans une corniche ou tout autre élément de modénature ou de\n    construction les rendant invisibles depuis la rue. Tout rejet direct des eaux de pluie\n    depuis les balcons ou les terrasses est interdit, un dispositif de récupération de ces\n    eaux dans les descentes verticales devra être prévu.\n11.3   INSTALLATIONS TECHNIQUES\n11.3.1 Equipements de transmission radioélectrique : ces équipements sont interdits en\n    façade. Ils sont autorisés sur toiture :\n    • en cas de toiture à pente, en retrait des façades,\n    • en cas de toiture-terrasse, à condition d’être regroupés en un ensemble homogène\n    et en retrait des façades d’au moins 2 mètres.\n    Les installations nouvelles doivent constituer un ensemble homogène avec les\n    équipements préexistants.\n11.3.2 Autres installations techniques :\n    • Sur toiture à pente, les installations techniques doivent s’inscrire obligatoirement\n    dans les combles, à l’exception des conduits de cheminée de fumée ou d’aération\n    relevant de l’arrêté du 22 octobre 1969.\n    • Sur toiture-terrasse, seules sont autorisées les installations techniques imposées\n    par la réglementation et/ou nécessaires à la commodité des usagers à condition\n    que :\n    - leur hauteur ne dépasse pas le niveau fini de la terrasse de plus de 3,50 mètres,\n    - elles soient implantées en retrait des façades d’au moins 2 mètres,\n    - elles soient regroupées en un volume homogène, traitées selon les prescriptions\n    de l’alinéa 3 du présent article.\n11.3.3 Dans le cadre des obligations d’aménagement des conduits de ventilation prescrites\n    au Code de la Construction et de l’Habitation et au Règlement Sanitaire Départemental\n    (article 63-1), ces conduits sont traités de la même couleur que le pignon qui les\n    supporte de façon à minimiser leur impact visuel.\nARTICLE UB12 : STATIONNEMENT\nSans objet\nARTICLE UB13 : ESPACES LIBRES ET PLANTATIONS\n13.1   REGLES GENERALES\n13.1.1 Les plantations existantes doivent être maintenues en bon état de conservation.\n    Cependant l’abattage d’arbres est autorisé s’il est indispensable à l’implantation des\n    constructions ou à l’établissement d’un accès.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UB   68","    Ville de Puteaux\n13.1.2 Tout arbre abattu doit être remplacé par un arbre à développement équivalent.\n    Cependant, les projets de constructions ne doivent pas porter atteinte aux arbres\n    remarquables identifiés au plan de zonage.\n13.1.3 Lors de tout projet de construction, les plantations d’arbres sur le domaine public\n    doivent être préservées.\nARTICLE UB14 : COEFFICIENT D’OCCUPATION DU SOL (COS)\n    Sans objet.\nARTICLE  UB15 : PERFORMANCES    ENERGETIQUES    ET\nENVIRONNEMENTALES\nLa consommation énergétique des constructions nouvelles d’immeubles collectifs de\nlogements, de bureaux et les CINASPIC*, doit être inférieure de 10% à l’objectif fixé dans la\nRT 2012 (soit une performance augmentée de 10% par rapport à la RT2012).\nCet article ne s’applique pas pour les réhabilitations des volumes sous Dalle*.\nARTICLE UB16 :  INFRASTRUCTURES    ET    RESEAUX    DE\nCOMMUNICATIONS ELECTRONIQUES\nUne construction ou une installation nouvelle, doit pouvoir être raccordée au réseau public ou\nprivé de communications électroniques. Les fourreaux de raccordement doivent être enfouis.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UB    69","CHAPITRE 5 : ZONE UL\nCARACTERE ET VOCATION DE LA ZONE\nCette zone regroupe des espaces dont la densité bâtie est en général faible et dont la fonction\nécologique, la qualité paysagère ou la vocation récréative, sportive ou culturelle doivent être\npréservées et mise en valeur pour assurer la qualité de vie et les besoins de détente.\nElle inclut :\n    • Les parcs, jardins, espaces verts publics et cimetières : le parc Offenbach, le parc\n    du Moulin, le jardin des Vignes, l’ancien cimetière Voltaire, ainsi que les espaces\n    attenants constitués pas les talus de la voie ferrée.\n    • Les grands espaces consacrés à la détente, aux loisirs, aux sports, les plans d’eau,\n    les berges basses et les quais ou encore les équipements liés au fleuve, à savoir\n    l’Ile de Puteaux dans son ensemble.\nLa zone UL comprend également :\n    • Un secteur ULf, correspondant à la pointe amont de l’île du Puteaux affecté aux\n    équipements et activités liés aux besoins du Service de La Navigation de la Seine.\n    • Un secteur ULa, correspondant à des espaces de loisirs ouverts et végétalisés.\nARTICLE UL1 :    OCCUPATIONS    ET    UTILISATIONS    DU    SOL\nINTERDITES\n1.1    Les constructions destinées à l’hébergement hôtelier.\n1.2    Les constructions destinées aux bureaux.\n1.3    Les constructions destinées à l’industrie, à l’exception de celles nécessaires à l’activité\n    ferroviaire.\n1.4    Les constructions destinées à l’exploitation agricole ou forestière.\n1.5    Les constructions destinées à la fonction d’entrepôt.\n1.6    Les affouillements, exhaussements des sols, exploitations des carrières, qui ne sont\n    pas nécessaires à des travaux de construction ou nécessaires au fonctionnement du\n    service public.\n1.7    Les dépôts de ferrailles, de matériel ou de matériaux de quelque nature que ce soit,\n    ainsi que les entreprises de cassage de voitures, la transformation de matériaux de\n    récupération et constructions provisoires ou mobiles, sauf si celles-ci sont liées au\n    fonctionnement d’un chantier en cours ou aux services publics ou d’intérêt collectif. Les\n    dépôts de quelque nature que ce soit (ferrailles, véhicules désaffectés, déchets,\n    ordures, combustibles solides ou liquides, etc.).\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UL   70","ARTICLE UL2 : OCCUPATIONS ET UTILISATIONS    DU    SOL\nSOUMISES A DES CONDITIONS PARTICULIERES\nLes constructions et installations, ainsi que les travaux divers de quelque nature que ce soit,\nà l’exception des travaux d’accessibilité, d’hygiène, d’isolation phonique ou thermique ou de\nsécurité, sont soumis aux conditions et restrictions suivantes :\n2.1    Les constructions et installations nécessaires aux services publics ou d’intérêt collectif.\n2.2    Les reconstructions, extensions et rénovations de constructions, installations et\n    ouvrages existants, et notamment les interventions, à condition que les bâtiments\n    permettent l’exercice d’activités conformes au caractère de la zone ou en relation avec\n    la nature et le caractère des espaces ou des équipements qu’ils supportent.\n2.3    Les constructions, installations et ouvrages permettant l’exercice d’activités conformes\n    au caractère de la zone ou en relation avec la nature et le caractère des espaces ou\n    des ou des équipements qu’ils supportent\n2.4    Dans le secteur ULf, les constructions nouvelles, reconstructions, extensions et\n    rénovations de constructions, installations et ouvrages existants, et notamment les\n    interventions, à condition que les bâtiments soient nécessaires aux équipements et\n    activités liés aux besoins du Service de La Navigation de la Seine.\n2.5    Les constructions à usage d’habitation destinées aux personnes dont la présence\n    permanente est nécessaire pour assurer la surveillance et le gardiennage des espaces,\n    constructions, installations et ouvrages situés dans la zone.\n2.6    Les installations temporaires permettant l’exercice d’activités compatibles avec le\n    caractère de la zone sont admises à condition qu’elles ne portent pas atteinte aux\n    plantations existantes.\n2.7    Les changements de destinations sont admis à condition que la destination projetée\n    soit compatible avec le caractère de la zone.\n2.8    Sur les berges et les voies d’eau du domaine public fluvial sont en particulier admis, au\n    titre des occupations et utilisations du sol énoncées ci-dessous :\n    • Les constructions et installations nécessaires aux transports des personnes par\n    bateaux (embarquement, débarquement, escale) et aux haltes nautiques de\n    navigation de plaisance.\n    • Les bateaux-    logements dans le respect des réglementations spécifiques qui\n    les régissent.\n    • Sur les berges de la Seine, les constructions ou installations doivent ménager un\n    passage offrant un cheminement confortable pour les promeneurs (à pied, à\n    bicyclette…).\n    • Les aménagements et installations nécessaires à l’exercice des missions des\n    Voies Navigables de France.\n2.9    Les constructions destinées aux commerces et à l’artisanat sont autorisées à condition\n    qu’elles soient compatibles avec les autres destinations de la zone. Chaque unité\n    d’activité ne pourra dépasser 300 m², hors réserves et 500 m² en totalité.\n2.10   Les parc de stationnements nécessaires aux activités sportives, commerciales et\n    culturelles, à condition qu’ils s’intègrent de manière à ne pas porter atteinte au site et\n    aux paysages existants.\n2.11   En zone UL, hors secteurs ULa et ULf, les articles 3 à 16 ne s’appliquent pas aux\n    CINASPIC.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UL   71","ARTICLE UL3 : ACCES ET VOIRIES\n3.1    ACCES\n3.1.1 Les constructions doivent avoir un accès à une voie publique ou privée carrossable.\n    Cet accès doit être aménagé :\n    • Soit directement en façade sur rue (dans la limite de un accès par tranche de 30\n    mètres de façade).\n    • Soit par l’intermédiaire d’un passage privé (appendice d’accès).\n    • Soit par une servitude de passage suffisante, instituée par un acte authentique ou\n    par voie judiciaire, en application de l’article 682 du Code Civil.\n3.1.2   Cette voie doit avoir au minimum une largeur d’emprise de 3,50 mètres (3 mètres dans\n    le cas d’un accès droit d’une longueur inférieure à 50 mètres). Cette règle ne s’applique\n    pas aux constructions existantes si les travaux conduisent à une augmentation\n    inférieure à 50% de la SDP existante à la date d’approbation du PLU.\n3.1.3   Les accès doivent présenter des caractéristiques permettant de satisfaire aux\n    exigences de la sécurité, de la défense contre l’incendie et de la protection civile\n    conformément aux règlements en vigueur.\n3.1.4   Les accès ne doivent présenter aucun risque pour la sécurité des usagers des voies\n    publiques ou pour celle des personnes utilisant cet accès, eu égard à la nature et à\n    l’importance du trafic, ainsi qu’à la position et à la configuration de ces accès.\n3.1.5   Lorsqu’un terrain est desservi par plusieurs voies, toute construction ou extension peut-\n    être autorisée sous réserve que l’accès soit établi sur la voie où la gêne pour la\n    circulation est la moindre.\n3.1.6   Les accès sont réalisés pour permettre une parfaite visibilité de la voie avant la sortie\n    des véhicules et aménagés pour assurer la sécurité et la commodité des personnes à\n    mobilité réduite.\n3.2    VOIRIE\n3.2.1   Les constructions et installations doivent être desservies par des voies publiques ou\n    privées dont les caractéristiques correspondent à leur destination. Ces voies doivent\n    permettre de satisfaire aux exigences de la sécurité, de la défense contre l’incendie et\n    de la protection civile.\n3.2.2   Les voies nouvelles en impasse doivent comporter un aménagement permettant aux\n    véhicules de faire demi-tour.\n3.2.3 La création ou l’aménagement des voiries publiques ou privées ouvertes au public doit\n    respecter les prescriptions relatives à leur accessibilité aux personnes handicapées.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UL   72","ARTICLE UL4 : DESSERTE PAR LES RESEAUX\nTous les réseaux et raccordements devront être enterrés.\nLa récupération et l’utilisation des eaux pluviales, ainsi que les eaux de toutes autres origines,\ndoivent respecter les exigences de la législation et de la réglementation en la matière,\nnotamment :\n    • La récupération des eaux de pluies et leur usage à l’intérieur et à l’extérieur des\n    bâtiments (arrêté du 21 aout 2008)\n    • Le contrôle des installations privatives de distribution d’eau potable, de récupération\n    des eaux de pluie ainsi que des ouvrages de prélèvement, puits et forages (arrêté du\n    17 décembre 2008 et circulaire du 9 novembre 2009)\n    • L’article 3.4 du contrat de délégation de service public de production et de distribution\n    d’eau potable\n    • Les articles 18 et 21 du règlement du service du Syndicat des eaux d’Ile-de-France.\n    • Le règlement départemental d’assainissement des Hauts de Seine en vigueur.\n4.1    ALIMENTATION EN EAU POTABLE\n4.1.1   Toute construction ou installation nouvelle qui, par sa destination nécessite l’utilisation\n    d’eau potable, doit être alimentée par branchement à un réseau collectif de distribution\n    sous pression présentant des caractéristiques suffisantes.\n4.1.2   Le pétitionnaire doit prendre toutes les précautions pour que les installations d’eau\n    potable ne soient immergées à l’occasion d’une mise en charge d’un égout, ni que\n    puisse se produire une quelconque introduction d’eaux polluées dans ces réseaux.\n4.2    ASSAINISSEMENT\n4.2.1   Toute construction ou installation nouvelle à l’intérieur d’une même propriété, doit être\n    conçue de manière à recueillir les eaux pluviales et les eaux usées séparément. Tous\n    les raccordements aux réseaux publics seront exécutés conformément à la\n    réglementation en vigueur, en respectant les caractéristiques de ce réseau et avec\n    l’accord des autorités compétentes.\n4.2.2   Le pétitionnaire doit prendre en compte les possibilités de mises en charge des réseaux\n    publics jusqu’à la cote altimétrique de la voie publique de façon à éviter le reflux d’eaux\n    d’égout dans les caves, sous-sols et constructions situées en contrebas de la voirie\n    publique. L’orifice d’évacuation des réseaux internes doit être équipé d’un clapet anti-\n    retour. Les regards situés à des niveaux inférieurs à cette cote, et qui n’auront pu être\n    évités, doivent être rendus étanches. Un ouvrage appelé « boîte de branchement » ou\n    « regard de façade » devra être placé sous le domaine public de préférence pour la\n    nécessité de contrôle et d’entretien du branchement (article 5 du Règlement communal\n    d’assainissement).\n4.2.3   EAUX USEES\n    • L’évacuation des eaux ménagères, et des effluents non traités, dans les fossés,\n    cours d’eau ou égouts pluviaux est interdite.\n    • Le branchement au réseau d’assainissement des canalisations d’évacuation des\n    liquides industriels résiduaires doit être soumis à la réglementation en vigueur et\n    particulièrement en ce qui concerne le traitement préalable de ces liquides.\n    • Les eaux issues des parcs de stationnements doivent subir un traitement de\n    débourbage et de déshuilage avant rejet dans le réseau collectif.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UL   73","4.2.4   EAUX PLUVIALES\n    • Les aménagements réalisés sur un terrain ne doivent pas faire obstacle au libre\n    écoulement des eaux pluviales (articles 640 et 641 du Code Civil). Lorsqu’il existe\n    un réseau collectif apte à recueillir les eaux pluviales, les aménagements sur le\n    terrain doivent garantir leur évacuation dans ledit réseau.\n    • Les aménagements réalisés sur tout terrain doivent intégrer les contraintes en\n    matière de rétention des eaux pluviales telles qu’elles garantissent un débit de fuite\n    conforme au règlement communal d’assainissement et au règlement\n    départemental des Hauts-de-Seine. Aussi, sont mis en œuvre toutes techniques et\n    aménagements (bassins de stockage, restitution et/ou système d’infiltration..)\n    appropriés à la nature des travaux projetés, sauf en cas d’impossibilité liée la taille\n    et à la configuration du terrain.\n4.3    ELECTRICITE – GAZ – TELECOMMUNICATIONS – RESEAUX CABLES\n    Les branchements privatifs de toute nature doivent être réalisés en souterrain jusqu’en\n    limite du domaine public et ne doivent pas rester apparents sur la construction.\n    L’aménageur ou le lotisseur doit réaliser l’infrastructure nécessaire à la distribution de\n    ces différents réseaux depuis le point de raccordement général jusqu’à la limite de\n    parcelle.\n4.4    DECHETS – ORDURES MENAGERES\n4.4.1   Toute nouvelle construction doit être pourvue d’un local correctement accessible et\n    dimensionné pour recevoir les divers conteneurs liés à la collecte sélective des ordures\n    ménagères et déchets industriels banals (DIB).\nARTICLE UL5 : CARACTERISTIQUES DES TERRAINS\n    Sans objet.\nARTICLE UL6 : IMPLANTATION DES CONSTRUCTIONS    PAR\nRAPPORT AUX VOIES ET EMPRISES PUBLIQUES\n6.1    Les constructions peuvent s’implanter en limites ou en retrait des voies et emprises\n    publiques d’au moins 1 mètre.\n6.2    Il pourra être admis que des façades non rectilignes (par exemple en arrondi)\n    s’inscrivent de manière ponctuelle entre l’alignement et le retrait autorisé.\nARTICLE UL7 : IMPLANTATION DES    CONSTRUCTIONS    PAR\nRAPPORT AUX LIMITES SEPARATIVES\nToutes les constructions doivent s’implanter en retrait des limites séparatives d’au moins 1\nmètre, à l’exception des CINASPIC.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UL   74","ARTICLE UL8 : IMPLANTATION DES CONSTRUCTIONS LES UNES\nPAR RAPPORT AUX AUTRES SUR UNE MEME PROPRIETE\n8.1. REGLES GENERALES\n8.1.1. Les bâtiments non contigus situés sur une même parcelle doivent être implantés à une\n    distance « L » comptée horizontalement en tout point de la façade et définie comme\n    suit :\n    - égale à 12 mètres minimum si au moins une des deux façades comporte une\n    ou des ouverture(s).\n    - égale à 10 mètres minimum si aucune façade ne comporte d’ouverture.\n8.2. REGLES PARTICULIERES\nL’article 8.1.1. ne s’applique pas aux constructions annexes inférieures à 10 m² et dont la\nhauteur totale de la construction est inférieure à 3 mètres. La distance est alors au minimum\nde 0,5 mètre.\nARTICLE UL9 : EMPRISE AU SOL\n9.1. REGLES GENERALES\nL’emprise au sol des constructions ne peut excéder 50% de la superficie du terrain, déduction\nfaite des surfaces destinées aux circulations piétonnes et à des opérations de voiries.\nLes terrains de sport même engazonnés, les bâtiments annexes (appentis, cabanons, locaux\ntechniques ou d’ordures ménagères) comptent dans l’emprise au sol.\n9.2. REGLES PARTICULIERES\nDans le cas d’un bâtiment existant ne respectant pas l’article 9.1., la surélévation est autorisée\nà condition du respect des autres articles du présent règlement.\nARTICLE UL10 : HAUTEUR MAXIMALE DES CONSTRUCTIONS\n10.1   DEFINITION ET MODE DE CALCUL DE LA HAUTEUR\n10.1.1 La hauteur des constructions est définie :\n    • soit comme une hauteur totale (faîtage ou acrotère).\n    • soit par une référence à l’égout du toit.\n    • soit en nombre de niveaux.\n    • soit en référence à une cote exprimée par rapport au Nivellement Général de la\n    France (NGF).\n10.1.2 La hauteur de la construction est mesurée à partir du niveau fini du trottoir jusqu’au\n    point de référence le plus élevé du bâtiment (égout, faîtage), les ouvrages techniques,\n    cheminées et autres superstructures de faible emprise étant exclus (antennes, mats,\n    etc.).\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UL   75","10.1.3 Dans le cas d’un terrain en pente le niveau de référence est la moyenne du point le\n    plus haut et du point le plus bas du terrain.\n10.2   REGLES GENERALES\n    La hauteur maximale des constructions ne peut excéder 10 mètres au faîtage ou à\n    l’acrotère.\n10.3   REGLES PARTICULIERES\nNe sont pas soumis à ces règles de hauteur l’aménagement et l’extension mesurée dans le\ncadre d’une réhabilitation d’un bâtiment existant, d’une hauteur supérieure à celle autorisée.\nDans ce cas, la hauteur des extensions est limitée à celle du bâtiment existant, tout en\nrespectant les dispositions des autres articles du présent règlement.\nARTICLE UL11 : ASPECT EXTERIEUR\n    •   Les constructions, par leur situation, leur architecture, leurs dimensions, l’aspect\n    extérieur des bâtiments ou ouvrages à édifier ou à modifier, ne doivent pas porter\n    atteinte au caractère ni à l’intérêt des lieux avoisinants, aux sites, aux paysages\n    naturels, urbains ainsi qu’à la conservation des perspectives monumentales (article\n    R.111-21 du Code de l’Urbanisme).\n    •   Le volume, la modénature et les rythmes de percement des constructions nouvelles\n    doivent s’harmoniser avec ceux du bâti existant, en s’inscrivant dans la composition\n    générale de l’îlot, de la rue ou du site.\n    •   La bonne intégration des constructions à leur environnement sera recherchée par\n    :\n    - leurs dimensions et la composition de leurs volumes.\n    - l’aspect et la mise en œuvre des matériaux.\n    - le rythme et la proportion des ouvertures.\n    - l’harmonisation des couleurs.\n11.1   FACADES\n11.1.1 Sont notamment interdits :\n    • L’emploi à nu de matériaux destinés à être recouverts d’un revêtement ou d’un\n    enduit (briques creuses, carreaux de plâtre, parpaings, etc.).\n    • Toute installation réalisée avec des moyens précaires ou dits « de fortune ».\n11.1.2 La texture des enduits et peintures, de même que leurs teintes doivent être adaptées\n    aux matériaux composant la façade et s’accorder harmonieusement à l’aspect des\n    constructions avoisinantes.\n11.1.3 Les placages ou peintures d’imitation, la destruction ou le camouflage de sculpture ou\n    d’ornementation ancienne de même que le décapage de l’enduit pour rendre les\n    pierres apparentes sont interdits.\n11.2   TOITURES\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UL   76","11.2.1 Les combles et toitures doivent présenter une simplicité de volume et une unité de\n    conception. Les toitures des constructions sont composées :\n    • soit de deux pentes symétriques comprises par rapport au plan horizontal.\n    • soit de toiture terrasse.\n    Ces dispositions peuvent ne pas être imposées en cas d’adjonction à une construction\n    existante ou s’il s’agit de projets dont l’intégration dans l’environnement naturel ou\n    architectural existant aura été particulièrement étudiée.\n11.2.2 Il pourra être admis une terrasse en tout ou partie de la toiture d’une construction neuve\n    ou lors d’une extension, surélévation, réhabilitation d’un bâtiment existant à condition\n    que la terrasse soit inaccessible et qu’elle soit entièrement végétalisée.\n    Les tropéziennes (voir définition en annexes) sont interdites.\n11.2.3 L’éclairement éventuel des combles est assuré par des ouvertures en lucarnes, soit\n    par des châssis de toit dans le plan des versants, soit par des fenêtres en pignons, si\n    les règles de prospect le permettent.\n11.2.4 Pour les constructions neuves, les descentes d’eau pluviales doivent être intégrées au\n    volume de la construction et non apparentes sur la façade principale. Les chenaux sont\n    intégrés dans une corniche ou tout autre élément de modénature ou de construction\n    les rendant invisibles depuis la rue. Tout rejet direct des eaux de pluie depuis les\n    balcons ou les terrasses est interdit, un dispositif de récupération de ces eaux dans les\n    descentes verticales doit être prévu.\n11.2.5 Les panneaux solaires sont autorisés en toitures à condition qu’ils soient non\n    réfléchissants, implantés en retrait des façades d’au moins 1 mètre et d’une hauteur\n    totale de 3 mètres, le tout sans aller au-delà de la hauteur autorisée.\n11.3   CLOTURES\n11.3.1 Les clôtures doivent être conçues de façon à participer harmonieusement à la définition\n    du paysage. Sur rue, elles doivent s’inscrire en cohérence avec les éléments similaires\n    du même alignement ou de la rue, soit par analogie de composition, de matériaux ou\n    de hauteur.\n11.3.2 La hauteur totale des clôtures est limitée à 3 mètres. En cas de terrain en pente, la\n    hauteur moyenne ne peut être supérieure à 3,50 mètres.\n11.3.3 En limite séparative latérale et de fond de parcelle, les clôtures sont soit identiques aux\n    clôtures donnant sur la voie soit constituées d’une clôture ajourée.\n11.4   ANTENNES\n    Les antennes d’émission ou de réception doivent être implantées de manière à réduire\n    l’impact visuel et esthétique. Pour les antennes relais se référer à l’article 6.2 des\n    dispositions générales.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UL   77","11.5   REGLES PARTICULIERES\n11.5.1 Il pourra être examiné la possibilité d’utiliser des matériaux de couverture autres que\n    ceux cités au paragraphe 11.2, si les constructions, par leur situation, leur architecture,\n    leurs dimensions ou leur aspect extérieur ne sont pas de nature à porter atteinte au\n    caractère ou à l’intérêt des lieux avoisinants, aux sites ou aux paysages naturels et\n    urbains, notamment dans l’un des cas suivants :\n    • Rénovation de couverture de bâtiments existants dont la toiture présente une faible\n    pente.\n    • Couverture de bâtiment neuf dont les faibles dimensions ne peuvent admettre une\n    toiture de pente suffisante pour recevoir une couverture dans les matériaux définis\n    au paragraphe 11.2.\n    • Les constructions et installations nécessaires aux services publics ou d’intérêt\n    collectif.\n11.5.2 En cas de réhabilitation d’extension ou de surélévation d’une construction existante,\n    les dispositions du paragraphe 11.2.5 sont applicables dans les limites des possibilités\n    constructives et techniques sans nuire au parti architectural et à l’économie du projet\n    ni à l’aspect général du bâtiment.\n11.5.3 Pour toute construction, des dispositions permettant la dissimulation (haie vive, etc.)\n    ou l’intégration dans le volume de la construction des conteneurs d’ordures ménagères\n    et de collecte sélective doivent être prévues.\n11.5.4 Les postes de transformation électrique et les postes de détente gaz doivent être\n    intégrés architecturalement au site, si possible dans le volume de la construction, en\n    prenant en compte en particulier, les matériaux et les couleurs des constructions\n    avoisinantes.\n11.5.5 Les édicules, installations techniques, équipements de transmission radioélectrique ou\n    de réception télévisuelle sont interdits en façade principale des constructions. Ils sont\n    dissimulés dans le volume de la construction ou dans les combles dans le cas de toiture\n    à pentes. Ils peuvent être autorisés en toiture terrasse s’ils constituent un ensemble\n    homogène en retrait des façades d’au moins 2 mètres et ne dépassent pas le niveau\n    fini de la terrasse de plus de 3,50 mètres. Ils ne devront pas être visibles depuis le\n    domaine public.\n    Cette règle n’est pas applicable :\n    • Aux conduits de cheminées, de fumée ou d’aération relevant de l’arrêté du 22\n    octobre 1969.\n    • Aux conduits de ventilation prescrits au Code de la Construction et de l’Habitation\n    et à l’article 63-1 du règlement Sanitaire Départemental.\n    Toutefois, ces équipements sont traités en harmonie avec les façades de la\n    construction.\n11.5.6 Les installations ou équipements nouveaux, identiques à ceux décrits au paragraphe\n    précédents peuvent être autorisés si elles constituent un ensemble homogène avec les\n    équipements préexistants et si elles contribuent à pallier aux inconvénients qu’elles\n    présentent habituellement pour le voisinage, en terme de nuisances et pour le paysage\n    urbain en terme esthétique (sécurité publique, brouillage des transmissions, etc.).\n11.5.7 Les annexes seront conçues soit isolément, soit dans le prolongement de la\n    construction, soient adossées à la clôture avec lesquelles elles doivent s’harmoniser\n    par leur volume et leurs couleurs (murs, toitures, couvertures et percements).\n11.5.8 Les citernes à gaz liquéfié, à mazout ou autre pompe à chaleur sont implantées de telle\n    manière qu’elles ne soient pas visibles de la ou des voies publiques ou privées.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UL   78","11.6   DISPOSITIONS PARTICULIERES APPLICABLES AU DOMAINE PUBLIC FLUVIAL\n    Sur les installations et complexes flottants destinés à rester à quai sont interdits tous\n    signaux ou superstructures dont l’usage ne serait pas directement lié à leur activité\n    normale ou qui porteraient atteinte au caractère du site par leur nature, leurs\n    dimensions, volume ou aspect.\nARTICLE UL12 : STATIONNEMENT\n12.1   REGLES GENERALES\n12.1.1 Le stationnement des véhicules correspondant aux besoins des constructions,\n    extensions et installations autorisées dans la zone, est assuré en dehors des voies\n    publiques sur des emplacements aménagés à cet effet.\n12.1.2 Tableau de répartition par type de construction et installation :\n    NORME\n   DESTINATION ET    NATURE    DE    LA    NORME PLAFOND\n    PLANCHER\n   CONSTRUCTION    (maximum)\n    (minimum)\n    Habitation (SDP > 1000 m²) :\n    • logement >25 m²    1 place/logement\n    • logement financés par un prêt aidé    0,5 place/logement    Pas de norme\n    de l’Etat > 25m² et situé à moins de    plafond\n    500m d’une gare de transport en\n    commun\n    • logement ≤25 m²    Aucune place\n    1 place pour 4    Pas de norme\n    Résidences * :\n    logements    plafond\n   Commerces :\n    Pas de norme\n   Par tranche de 100 m² au-delà de 150 m²    1\n    plafond\n   de SDP par unité commerciale\n   Artisanat :\n    Pas de norme\n   Par tranche de 100 m² au-delà de 150 m²    1\n    plafond\n   de SDP par unité d’activité\n    •   Le nombre de places à réaliser résultant des normes ci-dessus est, en cas de\n    décimale supérieure ou égale à 5, arrondi à l’unité supérieure.\n    •   Il est exigé une place pour chacune des tranches qu’elle soit entière ou partielle.\n    •   Lorsque les places sont données pourcentage de la SDP, leur nombre résulte de\n    la division de la surface par 28 m².\nNota : Les normes définies dans cet article, notamment celles relatives au stationnement des\n    vélos, doivent, par ailleurs, respecter les dispositions en vigueur inscrites, à la\n    délivrance du permis de construire, dans le code de la construction et de l’habitation et\n    les arrêtés d’application.\n12.2   REGLES PARTICULIERES\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UL   79","12.2.1 Il n’est pas exigé de places supplémentaires pour les modifications de commerces\n    existants sous réserve que leur surface ne soit pas augmentée de plus de 20% à la\n    date l’approbation du PLU.\n12.2.2 Pour les constructions et installations nécessaires aux services publics ou d’intérêt\n    collectif, il n’est pas fixé de règles.\nARTICLE UL13 : ESPACES LIBRES ET PLANTATIONS\n13.1   REGLES GENERALES\n13.1.1 Les plantations existantes doivent être maintenues en bon état de conservation.\n    Cependant l’abattage d’arbres est autorisé s’il est indispensable à l’implantation des\n    constructions ou à l’établissement d’un accès.\n13.1.2 Tout arbre abattu doit être remplacé sur le terrain par un arbre à développement\n    équivalent. Cependant, les projets de constructions ne doivent pas porter atteinte aux\n    arbres remarquables identifiés au plan de zonage.\n13.1.3 En UL, ULa et ULf, tout projet de construction neuve entraîne l’obligation de traiter\n    50% au moins de la superficie du terrain en espace vert, déduction faite des\n    alignements de voirie s’il en existe, avec au minimum la plantation d’un arbre par\n    tranche de 200 m² de terrain.\n13.1.4 Lors de tout projet de construction, les plantations d’arbres sur le domaine public\n    doivent être préservées.\n13.2   REGLES PARTICULIERES\n13.2.1 Lors de la création de jardins sur dalle au rez-de-chaussée, une hauteur minimum de\n    0,50 mètres pour l’engazonnement et de 0,70 mètres pour la plantation d’arbustes doit\n    être prévue.\nARTICLE UL14 : COEFFICIENT D’OCCUPATION DU SOL (COS)\n    Sans objet.\nARTICLE  UL15 : PERFORMANCES    ENERGETIQUES    ET\nENVIRONNEMENTALES\nLa consommation énergétique des constructions nouvelles d’immeubles collectifs de\nlogements, de bureaux et les CINASPIC*, doit être inférieure de 10% à l’objectif fixé dans la\nRT 2012 (soit une performance augmentée de 10% par rapport à la RT2012).\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UL    80","ARTICLE UL16 :  INFRASTRUCTURES    ET    RESEAUX    DE\nCOMMUNICATIONS ELECTRONIQUES\nUne construction ou une installation nouvelle, doit pouvoir être raccordée au réseau public ou\nprivé de communications électroniques. Les fourreaux de raccordement doivent être enfouis.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UL   81","CHAPITRE 6 : ZONE UPM1\nCARACTERE ET VOCATION DE LA ZONE\nIl s’agit d’une zone se trouvant au Nord de l’axe central de la Défense (CNIT, Triangle de la\nFolie) et colline Nord. Cette zone correspondant à l’emprise du Projet de tour(s), située(s)\nentre les Collines de l’Arche, le Triangle de l’Arche et le CNIT.\nARTICLE 1 : OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\n1.1    Les constructions à usage d’industrie et d’entrepôt.\n1.2    Les dépôts de ferrailles, de matériaux, de combustibles solides ou liquides sous\n    réserve de l’application de l’article 2.\nARTICLE 2 : OCCUPATIONS ET UTILISATIONS DU SOL SOUMISES\nA DES CONDITIONS PARTICULIERES\n2.1    Les constructions et installations nécessaires à l’animation de la zone telles que celles\n    destinées aux bureaux, aux commerces, aux services et à l’artisanat.\n2.2    Les dépôts de combustibles solides ou liquides et l’implantation ou l’extension des\n    installations classées pour la protection de l’environnement soumises à déclaration ou\n    autorisation, nécessaires à la vie et à la commodité des utilisateurs de la zone, à\n    condition que toutes les dispositions soient mises en œuvre afin de les rendre\n    compatibles avec les milieux environnants et les réseaux d’infrastructure et\n    d’assainissement et qu’il n’en résulte pas d’aggravation des dangers et des nuisances.\nARTICLE 3 : ACCES ET VOIRIES\nToute construction doit être desservie par une voie publique ou privée répondant à\nl’importance ou à la destination de l’immeuble, ainsi qu’aux exigences de la sécurité, de la\nprotection civile et de la lutte contre l’incendie.\nLorsque les voies se terminent en impasse, celles-ci devront être aménagées de telle sorte\nque les véhicules puissent faire demi-tour.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM1   82","ARTICLE 4 : DESSERTE PAR LES RESEAUX\nTous les réseaux et raccordements devront être enterrés.\nLa récupération et l’utilisation des eaux pluviales, ainsi que les eaux de toutes autres origines,\ndoivent respecter les exigences de la législation et de la réglementation en la matière,\nnotamment :\n    • La récupération des eaux de pluies et leur usage à l’intérieur et à l’extérieur des\n    bâtiments (arrêté du 21 aout 2008)\n    • Le contrôle des installations privatives de distribution d’eau potable, de récupération\n    des eaux de pluie ainsi que des ouvrages de prélèvement, puits et forages (arrêté du\n    17 décembre 2008 et circulaire du 9 novembre 2009)\n    • L’article 3.4 du contrat de délégation de service public de production et de distribution\n    d’eau potable\n    • Les articles 18 et 21 du règlement du service du Syndicat des eaux d’Ile-de-France.\n    • Le règlement départemental d’assainissement des Hauts de Seine en vigueur.\n4.1    ALIMENTATION EN EAU POTABLE\n4.1.1   Toute construction ou installation nouvelle qui, par sa destination nécessite l’utilisation\n    d’eau potable, doit être alimentée par branchement à un réseau collectif de distribution\n    sous pression présentant des caractéristiques suffisantes.\n4.1.2   Le pétitionnaire doit prendre toutes les précautions pour que les installations d’eau\n    potable ne soient immergées à l’occasion d’une mise en charge d’un égout, ni que\n    puisse se produire une quelconque introduction d’eaux polluées dans ces réseaux.\n4.2    ASSAINISSEMENT\n4.2.1   Toute construction ou installation nouvelle à l’intérieur d’une même propriété, doit être\n    conçue de manière à recueillir les eaux pluviales et les eaux usées séparément. Tous\n    les raccordements aux réseaux publics seront exécutés conformément à la\n    réglementation en vigueur, en respectant les caractéristiques de ce réseau et avec\n    l’accord des autorités compétentes.\n4.2.2   Le pétitionnaire doit prendre en compte les possibilités de mises en charge des réseaux\n    publics jusqu’à la cote altimétrique de la voie publique de façon à éviter le reflux d’eaux\n    d’égout dans les caves, sous-sols et constructions situées en contrebas de la voirie\n    publique. L’orifice d’évacuation des réseaux internes doit être équipé d’un clapet anti-\n    retour. Les regards situés à des niveaux inférieurs à cette cote, et qui n’auront pu être\n    évités, doivent être rendus étanches. Un ouvrage appelé « boîte de branchement » ou\n    « regard de façade » devra être placé sous le domaine public de préférence pour la\n    nécessité de contrôle et d’entretien du branchement (article 5 du Règlement communal\n    d’assainissement).\n4.2.3   EAUX USEES\n    • L’évacuation des eaux ménagères, et des effluents non traités, dans les fossés,\n    cours d’eau ou égouts pluviaux est interdite.\n    • Le branchement au réseau d’assainissement des canalisations d’évacuation des\n    liquides industriels résiduaires doit être soumis à la réglementation en vigueur et\n    particulièrement en ce qui concerne le traitement préalable de ces liquides.\n    • Les eaux issues des parcs de stationnements doivent subir un traitement de\n    débourbage et de déshuilage avant rejet dans le réseau collectif.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM1   83","4.2.4   EAUX PLUVIALES\n    • Les aménagements réalisés sur un terrain ne doivent pas faire obstacle au libre\n    écoulement des eaux pluviales (articles 640 et 641 du Code Civil). Lorsqu’il existe\n    un réseau collectif apte à recueillir les eaux pluviales, les aménagements sur le\n    terrain doivent garantir leur évacuation dans ledit réseau.\n    • Les aménagements réalisés sur tout terrain doivent intégrer les contraintes en\n    matière de rétention des eaux pluviales telles qu’elles garantissent un débit de fuite\n    conforme au règlement communal d’assainissement et au règlement\n    départemental des Hauts-de-Seine. Aussi, sont mis en œuvre toutes techniques et\n    aménagements (bassins de stockage, restitution et/ou système d’infiltration..)\n    appropriés à la nature des travaux projetés, sauf en cas d’impossibilité liée la taille\n    et à la configuration du terrain.\n4.3    ELECTRICITE – GAZ – TELECOMMUNICATIONS – RESEAUX CABLES\n    Les branchements privatifs de toute nature doivent être réalisés en souterrain jusqu’en\n    limite du domaine public et ne doivent pas rester apparents sur la construction.\n    L’aménageur ou le lotisseur doit réaliser l’infrastructure nécessaire à la distribution de\n    ces différents réseaux depuis le point de raccordement général jusqu’à la limite de\n    parcelle.\n4.4    DECHETS – ORDURES MENAGERES\n4.4.1   Toute nouvelle construction doit être pourvue d’un local correctement accessible et\n    dimensionné pour recevoir les divers conteneurs liés à la collecte sélective des ordures\n    ménagères et déchets industriels banals (DIB).\nARTICLE 5 : CARACTERISTIQUES DES TERRAINS\n    Sans objet.\nARTICLE 6 : IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT\nAUX VOIES ET EMPRISES PUBLIQUES\n    Se référer au document graphique du règlement de zone.\n    Les constructions peuvent être édifiées en surplomb des voies et des emprises\n    publiques.\nARTICLE 7 : IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT\nAUX LIMITES SEPARATIVES\n    Se référer au document graphique du règlement de zone.\n    Les constructions peuvent être édifiées en surplomb de volumes privés.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM1   84","ARTICLE 8 : IMPLANTATION DES CONSTRUCTIONS LES UNES PAR\nRAPPORT AUX AUTRES SUR UNE MEME PROPRIETE\n    Se référer au document graphique du règlement de zone.\nARTICLE 9 : EMPRISE AU SOL\n    Les constructions peuvent occuper 100% de la zone\nARTICLE 10 : HAUTEUR MAXIMALE DES CONSTRUCTIONS\n10.1   DEFINITION ET MODE DE CALCUL DE LA HAUTEUR\n10.1.1 La hauteur des constructions est définie en référence à une cote exprimée par rapport\n    au Nivellement Général de la France (NGF).\n10.2   REGLES GENERALES\n    La hauteur des constructions ne doit pas dépasser 349 m NGF.\nARTICLE 11 : ASPECT EXTERIEUR\n11-1   Toutes les façades doivent être traitées avec le même soin qualitatif (matériaux,\n    revêtements, composition), de manière à participer à l’animation des espaces\n    publiques ou privés et s’intégrer harmonieusement dans son environnement. Un soin\n    particulier est demandé pour toutes les toitures considérées comme une cinquième\n    façade quelle que soit leur altitude.\n11.2   Edicules en terrasses :\n    Les édicules et accessoires à caractère technique (caisson de climatisation,\n    extracteurs, édicules d’ascenseurs, garde-corps, antennes, etc…) sont intégrés au\n    volume général de la construction ou doivent participer à l’image architecturale du\n    bâtiment afin d’en limiter l’impact visuel depuis le voisinage immédiat ainsi que depuis\n    le domaine public. Le traitement doit se faire en harmonie avec la construction\n    (couleurs, matériaux,…).\nARTICLE 12 : STATIONNEMENT\n12.1   REGLES GENERALES\n12.1.1 Le stationnement des véhicules correspondant aux besoins des constructions,\n    extensions et installations autorisées dans la zone, est assuré en dehors des voies\n    publiques sur des emplacements aménagés à cet effet.\n12.1.2 La surface de stationnement est au minimum de 2% de la SDP.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM1   85","    •   Le nombre de places à réaliser résultant des normes ci-dessus est, en cas de\n    décimale supérieure ou égale à 5, arrondi à l’unité supérieure.\n    •   Lorsque les places sont données pourcentage de la SDP, leur nombre résulte de\n    la division de la surface par 28 m².\n12.1.3 La totalité des surfaces de stationnement doivent être réalisées en sous-sol ou sous\n    Dalle.\n12.1.4 En cas d’impossibilité technique de réaliser des places de stationnement, cf art. L.151-\n    33 du code de l’urbanisme.\nNota : Les normes définies dans cet article, notamment celles relatives au stationnement des\n    vélos, doivent, par ailleurs, respecter les dispositions en vigueur inscrites, à la\n    délivrance du permis de construire, dans le code de la construction et de l’habitation et\n    les arrêtés d’application.\n12.2    REGLES PARTICULIERES\n12.2.1 Pour les constructions et installations nécessaires aux services publics ou d’intérêt\n    collectif, il n’est pas fixé de règles.\nARTICLE 13 : ESPACES LIBRES ET PLANTATIONS\nIl n’est pas fixé de règle.\nARTICLE 14 : COEFFICIENT D’OCCUPATION DU SOL (COS)\n    Sans objet.\nARTICLE   15 : PERFORMANCES    ENERGETIQUES    ET\nENVIRONNEMENTALES\nLa consommation énergétique des constructions nouvelles d’immeubles collectifs de\nlogements, de bureaux et les CINASPIC*, doit être inférieure de 10% à l’objectif fixé dans la\nRT 2012 (soit une performance augmentée de 10% par rapport à la RT2012).\nARTICLE  16 :  INFRASTRUCTURES    ET    RESEAUX    DE\nCOMMUNICATIONS ELECTRONIQUES\nUne construction ou une installation nouvelle, doit pouvoir être raccordée au réseau public ou\nprivé de communications électroniques. Les fourreaux de raccordement doivent être enfouis.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM1    86","    Ville de Puteaux\nCHAPITRE 7 : ZONE UPM2\nCARACTERE ET VOCATION DE LA ZONE\nIl s’agit d’une zone située entre la Tour Ariane, la résidence des Platanes, la Tour Total\nMichelet, l’immeuble Plaza Défense, la résidence Galliéni et l’immeuble Ile-de-France. Elle\ncorrespond à l’emprise du projet d’aménagement du site Galliéni comprenant un immeuble de\ngrande hauteur à vocation tertiaire et un espace paysagé devant la résidence des Platanes.\nARTICLE 1 : OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\n1.1    Les constructions à usage d’industrie et d’entrepôt.\n1.2    Les dépôts de ferrailles, de matériaux, de combustibles solides ou liquides sous\n    réserve de l’application de l’article 2.\nARTICLE 2 : OCCUPATIONS ET UTILISATIONS DU SOL SOUMISES\nA DES CONDITIONS PARTICULIERES\n2.1    Les constructions et installations nécessaires à l’animation de la zone telles que celles\n    destinées aux bureaux, aux commerces, aux services et à l’artisanat.\n2.2    Les dépôts de combustibles solides ou liquides et l’implantation ou l’extension des\n    installations classées pour la protection de l’environnement soumises à déclaration ou\n    autorisation, nécessaires à la vie et à la commodité des utilisateurs de la zone, à\n    condition que toutes les dispositions soient mises en œuvre afin de les rendre\n    compatibles avec les milieux environnants et les réseaux d’infrastructure et\n    d’assainissement et qu’il n’en résulte pas d’aggravation des dangers et des nuisances.\nARTICLE 3 : ACCES ET VOIRIES\nToute construction doit être desservie par une voie publique ou privée répondant à\nl’importance ou à la destination de l’immeuble, ainsi qu’aux exigences de la sécurité, de la\nprotection civile et de la lutte contre l’incendie.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM2   87","    Ville de Puteaux\nARTICLE 4 : DESSERTE PAR LES RESEAUX\nTous les réseaux et raccordements devront être enterrés.\nLa récupération et l’utilisation des eaux pluviales, ainsi que les eaux de toutes autres origines,\ndoivent respecter les exigences de la législation et de la réglementation en la matière,\nnotamment :\n    • La récupération des eaux de pluies et leur usage à l’intérieur et à l’extérieur des\n    bâtiments (arrêté du 21 aout 2008)\n    • Le contrôle des installations privatives de distribution d’eau potable, de récupération\n    des eaux de pluie ainsi que des ouvrages de prélèvement, puits et forages (arrêté du\n    17 décembre 2008 et circulaire du 9 novembre 2009)\n    • L’article 3.4 du contrat de délégation de service public de production et de distribution\n    d’eau potable\n    • Les articles 18 et 21 du règlement du service du Syndicat des eaux d’Ile-de-France.\n    • Le règlement départemental d’assainissement des Hauts de Seine en vigueur.\n4.1    ALIMENTATION EN EAU POTABLE\n4.1.1   Toute construction ou installation nouvelle qui, par sa destination nécessite l’utilisation\n    d’eau potable, doit être alimentée par branchement à un réseau collectif de distribution\n    sous pression présentant des caractéristiques suffisantes.\n4.1.2   Le pétitionnaire doit prendre toutes les précautions pour que les installations d’eau\n    potable ne soient immergées à l’occasion d’une mise en charge d’un égout, ni que\n    puisse se produire une quelconque introduction d’eaux polluées dans ces réseaux.\n4.2    ASSAINISSEMENT\n4.2.1   Toute construction ou installation nouvelle à l’intérieur d’une même propriété, doit être\n    conçue de manière à recueillir les eaux pluviales et les eaux usées séparément. Tous\n    les raccordements aux réseaux publics seront exécutés conformément à la\n    réglementation en vigueur, en respectant les caractéristiques de ce réseau et avec\n    l’accord des autorités compétentes.\n4.2.2   Le pétitionnaire doit prendre en compte les possibilités de mises en charge des réseaux\n    publics jusqu’à la cote altimétrique de la voie publique de façon à éviter le reflux d’eaux\n    d’égout dans les caves, sous-sols et constructions situées en contrebas de la voirie\n    publique. L’orifice d’évacuation des réseaux internes doit être équipé d’un clapet anti-\n    retour. Les regards situés à des niveaux inférieurs à cette cote, et qui n’auront pu être\n    évités, doivent être rendus étanches. Un ouvrage appelé « boîte de branchement » ou\n    « regard de façade » devra être placé sous le domaine public de préférence pour la\n    nécessité de contrôle et d’entretien du branchement (article 5 du Règlement communal\n    d’assainissement).\n4.2.3   EAUX USEES\n    • L’évacuation des eaux ménagères, et des effluents non traités, dans les fossés,\n    cours d’eau ou égouts pluviaux est interdite.\n    • Le branchement au réseau d’assainissement des canalisations d’évacuation des\n    liquides industriels résiduaires doit être soumis à la réglementation en vigueur et\n    particulièrement en ce qui concerne le traitement préalable de ces liquides.\n    • Les eaux issues des parcs de stationnements doivent subir un traitement de\n    débourbage et de déshuilage avant rejet dans le réseau collectif.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM2   88","    Ville de Puteaux\n4.2.4   EAUX PLUVIALES\n    • Les aménagements réalisés sur un terrain ne doivent pas faire obstacle au libre\n    écoulement des eaux pluviales (articles 640 et 641 du Code Civil). Lorsqu’il existe\n    un réseau collectif apte à recueillir les eaux pluviales, les aménagements sur le\n    terrain doivent garantir leur évacuation dans ledit réseau.\n    • Les aménagements réalisés sur tout terrain doivent intégrer les contraintes en\n    matière de rétention des eaux pluviales telles qu’elles garantissent un débit de fuite\n    conforme au règlement communal d’assainissement et au règlement\n    départemental des Hauts-de-Seine. Aussi, sont mis en œuvre toutes techniques et\n    aménagements (bassins de stockage, restitution et/ou système d’infiltration..)\n    appropriés à la nature des travaux projetés, sauf en cas d’impossibilité liée la taille\n    et à la configuration du terrain.\n4.3    ELECTRICITE – GAZ – TELECOMMUNICATIONS – RESEAUX CABLES\n    Les branchements privatifs de toute nature doivent être réalisés en souterrain jusqu’en\n    limite du domaine public et ne doivent pas rester apparents sur la construction.\n    L’aménageur ou le lotisseur doit réaliser l’infrastructure nécessaire à la distribution de\n    ces différents réseaux depuis le point de raccordement général jusqu’à la limite de\n    parcelle.\n4.4    DECHETS – ORDURES MENAGERES\n4.4.1   Toute nouvelle construction doit être pourvue d’un local correctement accessible et\n    dimensionné pour recevoir les divers conteneurs liés à la collecte sélective des ordures\n    ménagères et déchets industriels banals (DIB).\nARTICLE 5 : CARACTERISTIQUES DES TERRAINS\n    Sans objet.\nARTICLE 6 : IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT\nAUX VOIES ET EMPRISES PUBLIQUES\n    Se référer au document graphique du règlement.\n    Les constructions pourront s’implanter en surplomb de la rue Delarivière Lefoullon.\nARTICLE 7 : IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT\nAUX LIMITES SEPARATIVES\n    Se référer au document graphique du règlement de zone.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM2   89","    Ville de Puteaux\nARTICLE 8 : IMPLANTATION DES CONSTRUCTIONS LES UNES PAR\nRAPPORT AUX AUTRES SUR UNE MEME PROPRIETE\n    Sans objet\nARTICLE 9 : EMPRISE AU SOL\n    Se référer au document graphique du règlement de zone.\nARTICLE 10 : HAUTEUR MAXIMALE DES CONSTRUCTIONS\n10.1   DEFINITION ET MODE DE CALCUL DE LA HAUTEUR\n10.1.1 La hauteur des constructions est définie en référence à une cote exprimée par rapport\n    au Nivellement Général de la France (NGF).\n10.2   REGLES GENERALES\n    Les constructions hors tout doivent obligatoirement respecter les gabarits indiqués sur\n    le plan de zonage et sur le document graphique du règlement de zone, soit 240 N.G.F.\n    au Nord et 48 NGF au Sud et à l’Est.\nARTICLE 11 : ASPECT EXTERIEUR\n11-1   Toutes les façades doivent être traitées avec le même soin qualitatif (matériaux,\n    revêtements, composition), de manière à participer à l’animation des espaces\n    publiques ou privés et s’intégrer harmonieusement dans son environnement. Un soin\n    particulier est demandé pour toutes les toitures considérées comme une cinquième\n    façade quelle que soit leur altitude.\n11.2   Edicules en terrasses :\n    Les édicules et accessoires à caractère technique (caisson de climatisation,\n    extracteurs, édicules d’ascenseurs, garde-corps, antennes, etc…) sont intégrés au\n    volume général de la construction ou doivent participer à l’image architecturale du\n    bâtiment afin d’en limiter l’impact visuel depuis le voisinage immédiat ainsi que depuis\n    le domaine public. Le traitement doit se faire en harmonie avec la construction\n    (couleurs, matériaux,…).\n11.4   Les débords, avancées ou auvents ne pourront être réalisés, sur des façades élevées\n    en limite d’emprise constructible, que le long des limites localisées au document\n    graphique par une ligne de couleur, sans dépasser trois mètres par rapport au nu de\n    la façade.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM2   90","    Ville de Puteaux\nARTICLE 12 : STATIONNEMENT\n12.1   REGLES GENERALES\n12.1.1 Le stationnement des véhicules correspondant aux besoins des constructions,\n    extensions et installations autorisées dans la zone, est assuré en dehors des voies\n    publiques sur des emplacements aménagés à cet effet.\n12.1.2 Tableau de répartition par type de construction et installation :\n    NORME\n   DESTINATION ET    NATURE    DE    LA    NORME PLAFOND\n    PLANCHER\n   CONSTRUCTION    (maximum)\n    (minimum)\n   Bureaux :\n    •   à plus de 500m d’une gare de    1 place pour 70m²\n    transport en commun    de SDP\n    8% de la SDP\n    •   à 500m ou moins d’une gare de    1 place pour 90m²\n    transport en commun    de SDP\n   Commerces :\n    Pas de norme\n   Par tranche de 100 m² au-delà de 150 m² de    1\n    plafond\n   SDP par unité commerciale\n   Artisanat :\n    Pas de norme\n   Par tranche de 100 m² au-delà de 150 m² de    1\n    plafond\n   SDP par unité d’activité\n    •   Le nombre de places à réaliser résultant des normes ci-dessus est, en cas de\n    décimale supérieure ou égale à 5, arrondi à l’unité supérieure.\n    •   Il est exigé une place pour chacune des tranches qu’elle soit entière ou partielle.\n    •   Lorsque les places sont données pourcentage de la SDP, leur nombre résulte de\n    la division de la surface par 28 m².\n12.1.3 La totalité des surfaces de stationnement doivent être réalisées en sous-sol ou sous\n    Dalle.\n12.1.4 En cas d’impossibilité technique de réaliser des places de stationnement, cf art. L.151-\n    33 du code de l’urbanisme.\nNota : Les normes définies dans cet article, notamment celles relatives au stationnement des\n    vélos, doivent, par ailleurs, respecter les dispositions en vigueur inscrites, à la\n    délivrance du permis de construire, dans le code de la construction et de l’habitation et\n    les arrêtés d’application.\n12.2   REGLES PARTICULIERES\n12.2.1 Pour les constructions et installations nécessaires aux services publics ou d’intérêt\n    collectif, il n’est pas fixé de règles.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM2   91","    Ville de Puteaux\nARTICLE 13 : ESPACES LIBRES ET PLANTATIONS\nTout projet de construction entraîne l’obligation de laisser libre 20 % au moins de la superficie\nde la zone réservé exclusivement à des aménagements libres et plantés.\nSe référer au document graphique du règlement de zone.\nTout arbre abattu doit être remplacé sur le terrain par un arbre à développement équivalent.\nARTICLE 14 : COEFFICIENT D’OCCUPATION DU SOL (COS)\n    Sans objet.\nARTICLE   15 : PERFORMANCES    ENERGETIQUES    ET\nENVIRONNEMENTALES\nLa consommation énergétique des constructions nouvelles d’immeubles collectifs de\nlogements, de bureaux et les CINASPIC*, doit être inférieure de 10% à l’objectif fixé dans la\nRT 2012 (soit une performance augmentée de 10% par rapport à la RT2012).\nARTICLE  16 :  INFRASTRUCTURES    ET    RESEAUX    DE\nCOMMUNICATIONS ELECTRONIQUES\nUne construction ou une installation nouvelle, doit pouvoir être raccordée au réseau public ou\nprivé de communications électroniques. Les fourreaux de raccordement doivent être enfouis.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM2    92","CHAPITRE 8 : ZONE UPM3\nCARACTERE ET VOCATION DE LA ZONE\nIl s’agit d’une zone de reconversion urbaine issue d’anciens sites industriels du Front de Seine\nle long de la Rue Voltaire. Cette zone de projet se destine à l’habitation et aux équipements et\ncommerces nécessaires au cadre de vie des futurs habitants.\nARTICLE 1 : OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\n1.1    Les constructions à usage d’industrie et d’entrepôt.\n1.2    Les dépôts de ferrailles, de matériaux, de combustibles solides ou liquides sous\n    réserve de l’application de l’article 2.\n1.3    Les constructions destinées à l’exploitation agricole ou forestière.\nARTICLE 2 : OCCUPATIONS ET UTILISATIONS DU SOL SOUMISES\nA DES CONDITIONS PARTICULIERES\n2.1    Les constructions et installations nécessaires à l’animation de la zone telles que celles\n    destinées aux bureaux, aux commerces, à l’artisanat ainsi que les constructions et\n    installations nécessaires au service public ou d’intérêt collectif.\n2.2    Pour les installations classées quels que soient les régimes auxquels elles sont\n    soumises, leur implantation est admise sous les conditions suivantes :\n    • qu’elles correspondent à des besoins nécessaires à la vie et à la commodité des\n    habitants,\n    • que les nuisances (émanations nocives ou malodorantes, fumées, bruits, poussières,\n    altération des eaux, etc..) et dangers (risques d’incendie, explosion, etc.) puissent\n    être prévenus et évités de façon satisfaisante eu égard à l’environnement de la zone\n    sans dommages graves ou irréparables aux personnes et aux biens,\n    • et que leurs exigences de fonctionnement soient compatibles avec les infrastructures\n    existantes, notamment les voiries et l’assainissement.\n    • ou qu’il s’agisse de parc de stationnements (compris entre 250 et 1 000 véhicules),\n    en infrastructure.\nARTICLE 3 : ACCES ET VOIRIES\nToute construction doit être desservie par une voie publique ou privée répondant à\nl’importance ou à la destination de l’immeuble, ainsi qu’aux exigences de la sécurité, de la\nprotection civile et de la lutte contre l’incendie.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM3   93","ARTICLE 4 : DESSERTE PAR LES RESEAUX\nTous les réseaux et raccordements devront être enterrés.\nLa récupération et l’utilisation des eaux pluviales, ainsi que les eaux de toutes autres origines,\ndoivent respecter les exigences de la législation et de la réglementation en la matière,\nnotamment :\n    • La récupération des eaux de pluies et leur usage à l’intérieur et à l’extérieur des\n    bâtiments (arrêté du 21 aout 2008)\n    • Le contrôle des installations privatives de distribution d’eau potable, de récupération\n    des eaux de pluie ainsi que des ouvrages de prélèvement, puits et forages (arrêté du\n    17 décembre 2008 et circulaire du 9 novembre 2009)\n    • L’article 3.4 du contrat de délégation de service public de production et de distribution\n    d’eau potable\n    • Les articles 18 et 21 du règlement du service du Syndicat des eaux d’Ile-de-France.\n    • Le règlement départemental d’assainissement des Hauts de Seine en vigueur.\n4.1    ALIMENTATION EN  doit être soumis à la réglementation en vigueur et\n    particulièrement en ce qui concerne le traitement préalable de ces liquides.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM3   94","4.2.4   EAUX PLUVIALES\n    • Les aménagements réalisés sur un terrain ne doivent pas faire obstacle au libre\n    écoulement des eaux pluviales (articles 640 et 641 du Code Civil). Lorsqu’il existe\n    un réseau collectif apte à recueillir les eaux pluviales, les aménagements sur le\n    terrain doivent garantir leur évacuation dans ledit réseau.\n    • Les aménagements réalisés sur tout terrain doivent intégrer les contraintes en\n    matière de rétention des eaux pluviales telles qu’elles garantissent un débit de fuite\n    conforme au règlement communal d’assainissement et au règlement\n    départemental des Hauts-de-Seine. Aussi, sont mis en œuvre toutes techniques et\n    aménagements (bassins de stockage, restitution et/ou système d’infiltration..)\n    appropriés à la nature des travaux projetés, sauf en cas d’impossibilité liée la taille\n    et à la configuration du terrain.\n4.3    ELECTRICITE – GAZ – TELECOMMUNICATIONS – RESEAUX CABLES\n    Les branchements privatifs de toute nature doivent être réalisés en souterrain jusqu’en\n    limite du domaine public et ne doivent pas rester apparents sur la construction.\n    L’aménageur ou le lotisseur doit réaliser l’infrastructure nécessaire à la distribution de\n    ces différents réseaux depuis le point de raccordement général jusqu’à la limite de\n    parcelle.\n4.4    DECHETS – ORDURES MENAGERES\n4.4.1   Toute nouvelle construction doit être pourvue d’un local correctement accessible et\n    dimensionné pour recevoir les divers conteneurs liés à la collecte sélective des ordures\n    ménagères et déchets industriels banals (DIB).\nARTICLE 5 : CARACTERISTIQUES DES TERRAINS\n    Sans objet.\nARTICLE 6 : IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT\nAUX VOIES ET EMPRISES PUBLIQUES\n    Toutes les constructions peuvent s’implanter à l’alignement des voies et emprises\n    publiques ou en retrait d’au moins 1 mètre.\n    Il pourra être admis que des façades non rectilignes (par exemple en arrondi)\n    s’inscrivent de manière ponctuelle entre l’alignement et le retrait autorisé.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM3   95","ARTICLE 7 : IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT\nAUX LIMITES SEPARATIVES\nToutes les constructions peuvent s’implanter en limite séparative ou en retrait d’au moins 6\nmètres, sauf retraits imposés figurants au document graphique de la zone, annexé au présent\nrèglement.\nNOTA : Les jours de souffrance existants situés sur les limites séparatives doivent être pris en\ncompte dans tout projet de construction de manière à ne pas les occulter.\nARTICLE 8 : IMPLANTATION DES CONSTRUCTIONS LES UNES PAR\nRAPPORT AUX AUTRES SUR UNE MEME PROPRIETE\n    La distance minimale entre 2 bâtiments non contigus ne peut être inférieure à 6 mètres.\nARTICLE 9 : EMPRISE AU SOL\n    Se référer au document graphique du règlement de la zone\nARTICLE 10 : HAUTEUR MAXIMALE DES CONSTRUCTIONS\n10.1   DEFINITION ET MODE DE CALCUL DE LA HAUTEUR\n10.1.1 La hauteur des constructions est définie :\n    • soit comme une hauteur totale (faîtage ou acrotère).\n    • soit par une référence à l’égout du toit.\n    • soit en nombre de niveaux.\n    • soit en référence à une cote exprimée par rapport au Nivellement Général de la\n    France (NGF).\n10.2   REGLES GENERALES\n10.2.1 Dans le cas d’un terrain en pente le niveau de référence est la moyenne du point le\n    plus haut et du point le plus bas du terrain.\n10.2.2 La hauteur maximale des constructions est indiquée au document graphique de la\n    zone, annexé au présent règlement. Elle est indiquée en nombre de niveaux ainsi que\n    hors tout (faîtage ou acrotère) par secteur.\n10.2.2 La hauteur maximale autorisée peut être dépassée pour les constructions situées\n    notamment à l’angle de deux voies de circulation ou emprises publiques, et ce,\n    ponctuellement pour motif architectural (notamment pour la réalisation d’une rotonde),\n    dans la limite d’un niveau supplémentaire.\nARTICLE 11 : ASPECT EXTERIEUR\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM3   96","    •   Les constructions, par leur situation, leur architecture, leurs dimensions, l’aspect\n    extérieur des bâtiments ou ouvrages à édifier ou à modifier, ne doivent pas porter\n    atteinte au caractère ni à l’intérêt des lieux avoisinants, aux sites, aux paysages\n    naturels, urbains ainsi qu’à la conservation des perspectives monumentales (article\n    R.111-21 du Code de l’Urbanisme).\n    •   Un parti architectural privilégiant une composition verticale de la façade doit être\n    observé pour toute nouvelle construction, et ce afin de conserver une morphologie\n    du tissu urbain qui identifie clairement des séquences courtes, composées et\n    articulées, excluant l’uniformité, y compris sur les projets regroupant plusieurs\n    unités foncières.\n    •   Les Chartes de couleur et des devantures des enseignes et des pré-enseignes\n    doivent être prises en compte (cf. annexes du PLU).\n11.2   FACADES\n11.1.1 Les façades doivent être composées de matériaux nobles (aspect pierre, verre, métal,\n    brique, etc.). les dispositifs de murs végétalisées sont autorisés.\n11.1.2 La texture des enduits et peintures, de même que leurs teintes doivent être adaptées\n    aux matériaux composant la façade et s’accorder harmonieusement à l’aspect des\n    constructions avoisinantes.\n11.1.3 Sont interdits :\n    • L’emploi à nu de matériaux destinés à être recouverts d’un revêtement, d’un\n    parement ou d’un enduit (briques creuses, carreaux de plâtre, parpaings, etc.).\n    • Toute installation réalisée avec des moyens précaires ou dits « de fortune ».\n11.1.4 Les portes d’accès aux parcs de stationnements, les sas ouverts ainsi que les entrées\n    piétonnes doivent comporter une fermeture dans le plan de la façade, sauf impossibilité\n    manifeste liée à des impératifs de sécurité. Leur traitement doit bénéficier d’un soin\n    particulier de mise en valeur, que ce soit au niveau des matériaux (aspect bois, métal\n    laqué..) que de par son écriture architecturale. Elles doivent avoir, sur une même\n    façade, une similitude d’aspect.\n11.1.5 Les pignons sont traités avec le même soin et en harmonie avec les façades\n    principales.\n11.1.6 Les postes de transformation électrique et les postes de détente gaz doivent être\n    intégrés dans le volume de la construction (sauf cas d’impossibilité technique), en\n    prenant en compte en particulier les matériaux et les couleurs des constructions\n    avoisinantes.\n11.2   DEVANTURES\n11.2.1 En cas de devanture se développant à rez-de-chaussée sous une corniche ou un\n    bandeau filant, ceux-ci doivent être reconstitués s’ils ont été supprimés ou\n    endommagés.\n11.2.2 La réalisation de devanture se développant sur deux ou plusieurs niveaux ne peut être\n    autorisée que lorsque l’architecture du bâtiment le permet ou a été conçue dans ce\n    sens (entresol…).\n11.2.3 Les devantures peuvent être implantées, soit en saillie par rapport au plan de la façade\n    pour les devantures dites « en applique », soit en retrait limité (10 à 20 cm dans les 2\n    cas) pour les devantures dites « en feuillure ».\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM3   97","11.2.4 Les coffres et grilles de fermeture doivent être implantés intérieurement, en retrait des\n    vitrines (sauf impossibilité technique ou architecturale manifeste), le choix du système\n    de protection, en arrière de la vitrine, doit maintenir les transparences visuelles, sous\n    réserve des nécessités liées à la sécurité.\n11.2.5 Les bandeaux supérieurs des devantures, destinés à recevoir l’enseigne, doivent être\n    de hauteur limitée (0,80 mètre maximum) de façon à limiter les effets d’horizontalité qui\n    nuisent à la bonne lecture des proportions des bâtiments. Ces bandeaux sont limités à\n    la longueur de la façade commerciale.\n11.3 TOITURES\n11.3.1 Les combles et toitures doivent présenter une simplicité de volume et une unité de\n    conception. Les toitures des constructions sont composées :\n    • Soit d’une ou plusieurs pentes ou éléments à versants symétriques.\n    • Soit de toitures terrasses en tout ou parties végétalisées.\n    • Soit d’une seule pente pour motif architectural ou pour les annexes.\n    • Soit de rotondes ou éléments arrondis.\n11.3.2 Ces dispositions peuvent ne pas être imposées en cas d’adjonction à une construction\n    existante.\n11.3.3 Les matériaux autorisés en toiture sont de type :\n    • Aspect Tuiles traditionnelles, mécaniques.\n    • Aspect Ardoises\n    • Aspect Zinc.\n11.3.4 Les panneaux solaires sont autorisés à condition que ceux-ci soient non-réfléchissants,\n    implantés dans la pente de la toiture, le tout sans aller au-delà de la hauteur autorisée.\n    Sur les toitures terrasses, les panneaux doivent s’implanter en retrait des façades d’au\n    moins 1 mètre, sans pouvoir dépasser 3 mètres de hauteur totale.\n11.3.5 L’éclairement éventuel des combles est assuré par des ouvertures en lucarnes, soit\n    par des châssis de toit dans le plan des versants, soit par des fenêtres en pignons, si\n    les règles de prospect le permettent.\n11.3.6 Il pourra être admis une terrasse en toiture d’une construction à condition d’être\n    accessible de plain-pied depuis le logement et en constituer un espace d’agrément.\n    Les tropéziennes (voir définition en annexes) sont interdites.\n11.3.7 Les descentes d’eau pluviales sont intégrées au volume de la construction et non\n    apparentes sur la façade principale. Les chenaux sont intégrés dans une corniche ou\n    tout autre élément de modénature ou de construction les rendant invisibles depuis la\n    rue. Tout rejet direct des eaux de pluie depuis les balcons ou les terrasses est interdit,\n    un dispositif de récupération de ces eaux dans les descentes verticales doit être prévu.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM3   98","11.3.8 Les édicules et accessoires à caractère technique (caisson de climatisation,\n    extracteurs, édicules d’ascenseurs, etc…),\n    Pour les toitures à pentes :\n    Ils sont intégrés au volume général de la construction\n    Pour les toitures terrasses :\n    • Ils sont regroupés de manière homogène\n    • Ils sont implantés en retrait de 2 mètre minimum par rapport aux façades.\n    • Leur hauteur ne dépasse pas le niveau fini de la terrasse de plus de 2 mètres\n    afin d’en limiter l’impact visuel.\n    • Leur traitement doit se faire en harmonie avec la construction (couleurs,\n    matériaux…).\n11.3.9 Les antennes d’émission ou de réception doivent être implantées de manière à réduire\n    l’impact visuel et esthétique. Pour les antennes relais se référer à l’article 6.2 des\n    dispositions générales.\n11.4   CLOTURES\n11.4.1 CLOTURES SUR VOIES\n    • Elles doivent s’implanter à l’alignement.\n    • Leur hauteur maximale est de 3 mètres, en cas de terrain en pentes, la hauteur\n    totale moyenne ne peut excéder 3,50 mètres. Toutefois, l’entretien et la\n    restauration des murs anciens en maçonnerie d’une hauteur supérieure sont\n    admis. Des hauteurs supérieures peuvent également être admises en cas\n    d’impératifs liés à la sécurité.\n    • Elles sont constituées soit :\n    - d’un mur bahut en maçonnerie apparente ou enduite, surmonté d’une grille\n    métallique à barreaudages verticaux, composée d’éléments ouvragés et/ou\n    ponctuels.\n    - d’un mur plein lorsqu’il constitue le prolongement de la construction ou permet la\n    continuité d’un front bâti, réalisé en matériaux destinés à rester apparents (pierre\n    de taille, moellon, briques pleines jointoyées, etc.) ou recouverts d’un enduit\n    identique à celui de la c
