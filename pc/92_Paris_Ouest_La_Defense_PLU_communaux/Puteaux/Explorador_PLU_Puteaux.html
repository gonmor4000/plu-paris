onstruction principale.\n11.4.2 CLOTURES EN LIMITES SEPARATIVES\n    • Leur hauteur maximale est de 3 mètres, toutefois, l’entretien et la restauration des\n    murs anciens en maçonnerie d’une hauteur supérieure sont admis.\n    • Les clôtures sont constituées soit :\n    - d’un mur bahut en maçonnerie apparente ou enduite, surmonté d’une grille\n    métallique à barreaudages verticaux, composée d’éléments ouvragés et/ou\n    ponctuels.\n    - d’un mur plein réalisé en matériaux destinés à rester apparents (pierre de taille,\n    moellon, briques pleines jointoyées, etc.) ou recouverts d’un enduit identique à celui\n    de la construction principale.\n    - d’une structure ajourée.\n11.5   REGLES PARTICULIERES\n11.5.1 Les conduits (de cheminées, de fumée, d’aération, de ventilation et d’extraction)\n    relèvent du code de la construction et de l’habitation, de l’arrêté du 22 octobre 1969 et\n    du règlement sanitaire départemental.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM3   99","    Ces équipements sont traités en harmonie avec les façades de la construction.\n11.5.2 Pour annexes contigües à la construction principale, les matériaux et couleurs\n    employés doivent êtres similaires à celle-ci. Pour les autres annexes, le bois peut être\n    autorisé.\n11.5.3 Les citernes ou autre pompe à chaleur sont implantées de telle manière qu’elles ne\n    soient pas visibles depuis la voie.\n11.5.4 Il n’est pas fixé de règles pour les constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif. Pour les antennes relais se référer à l’article 6.2\n    des dispositions générales.\nARTICLE 12 : STATIONNEMENT\n12.1 REGLES GENERALES\n12.1.1 Le stationnement des véhicules correspondant aux besoins des constructions,\n    extensions et installations autorisées dans la zone, est assuré en dehors des voies\n    publiques sur des emplacements aménagés à cet effet.\n    Pour les constructions et installations nouvelles destinées au commerce et à l’artisanat,\n    des aires de stationnement, de manœuvre, de chargement et de déchargement des\n    véhicules lourds de livraison doivent être prévues hors emprises publiques.\n12.1.2 Pour toutes les constructions de plus de 2 logements ou de bureaux, les\n    stationnements sont réalisés en sous-sol. Pour les autres, les stationnements peuvent-\n    être réalisés dans le volume de la construction. Les stationnements peuvent aussi être\n    réalisés selon les dispositions de l’article 12.2.1 du présent article.\n12.1.3 Aucune place de stationnement ne peut être supprimée à moins de respecter les règles\n    de l’article 12.1.\n12.1.4 Pour les constructions d’habitation dont les surfaces de planchers totales sont\n    inférieures ou égales à 1000 m² SDP, il n’est pas imposé de règles en matière de\n    stationnement des véhicules et 2 roues motorisées.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM3 100","12.1.5 Tableau de répartition par type de construction et installation :\n    NORME\n   DESTINATION ET    NATURE    DE    LA    NORME PLAFOND\n    PLANCHER\n   CONSTRUCTION    (maximum)\n    (minimum)\n    Habitation (SDP > 1000 m²) :\n    • logement >25 m²    1 place/logement\n    • logement financés par un prêt aidé    0,5 place/logement\n    Pas de norme\n    de l’Etat > 25m² et situé à moins de    plafond\n    500m d’une gare de transport en\n    commun\n    • logement ≤25 m²    Aucune place\n    1 place pour 4    Pas de norme\n    Résidences * :\n    logements    plafond\n    1 place/10    Pas de norme\n    Hébergement hôtelier :\n    chambres    plafond\n   Bureaux :\n    Automobiles : 1 place\n    pour 70m² de SDP\n    •   à plus de 500m d’une gare de\n    2 roues** : pas de\n    transport en commun\n    8% de la SDP    norme plafond\n    Dont 1% pour les 2\n    roues**    Automobiles : 1 place\n    •   à 500m ou moins d’une gare de    pour 90m² de SDP\n    transport en commun    2 roues** : pas de\n    norme plafond\n   Commerces :\n    Pas de norme\n   Par tranche de 100 m² au-delà de 150 m²    1\n    plafond\n   de SDP par unité commerciale\n    Artisanat :\n    Pas de norme\n    Par tranche de 100 m² au-delà de 150 m²    1\n    plafond\n    de SDP par unité d’activité\n**2 roues : motos et vélos\n    •   Le nombre de places à réaliser résultant des normes ci-dessus est, en cas de décimale supérieure\n    ou égale à 5, arrondi à l’unité supérieure.\n    •   Il est exigé une place pour chacune des tranches qu’elle soit entière ou partielle.\n    •   Lorsque les places sont données pourcentage de la SDP, leur nombre résulte de la division de la\n    surface par 28 m².\nNOTA : ALIMENTATION POUR VEHICULES RECHARGEABLES\nL'équipement de dispositifs de raccordement techniques nécessaires à l’alimentation de prises de\nrecharges pour les véhicules électriques ou hybrides permettant un comptage individuel est\nobligatoire pour certaines nouvelles constructions dotées de places de stationnement énoncées à\nl’article L.111-5-2 du code de la construction et de l’habitation\n12.1.6 Pour tous les programmes de constructions, il est exigé un minimum de 2% (5% pour\n    les programmes de logements) de place de stationnement pour les personnes à\n    mobilité réduites (PMR). Ces places doivent avoir les dimensions minimales suivantes :\n    •   Largeur : 3,30 m\n    •   Longueur : 5,00 m\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM3 101","    Celles-ci pourront être associées 2 à 2 avec une largeur de dégagement latérale\n    commune d’au minimum 0,80 m.\n12.1.7 Pour toutes les constructions neuves d’habitation, le stationnement des motocyclettes\n    doit représenter au minimum 1 % de la SDP et se situer en sous-sol, soit sur des\n    emplacements spécifiques, soit en combinaison des stationnements automobiles.\n12.1.8 Pour toutes les constructions neuves d’habitation, des locaux fermés et spécifiques,\n    pour entreposer les vélos et les poussettes doivent s’implanter dans le volume de la\n    construction en rez-de-chaussée ou en sous-sol. Ces locaux doivent représenter au\n    total une surface de 2% minimum de la SDP de la construction.\nNota : Les normes définies dans cet article, notamment celles relatives au stationnement des\n    vélos, doivent, par ailleurs, respecter les dispositions en vigueur inscrites, à la\n    délivrance du permis de construire, dans le code de la construction et de l’habitation et\n    les arrêtés d’application.\n12.2   REGLES PARTICULIERES\n12.2.1. En cas d’impossibilité architecturale ou technique d’aménager sur le terrain de\n    l’opération le nombre d’emplacements nécessaires au stationnement, le bénéficiaire\n    peut être autorisé à solliciter l’application de l’article L.151-33 du Code de l’Urbanisme\n    si ces stationnements sont réalisés dans le volume d’une construction ou en sous-sol.\n12.2.2 Il n’est pas fixé de règles pour les constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif.\nARTICLE 13 : ESPACES LIBRES ET PLANTATIONS\n13.1   REGLES GENERALES\n13.1.1 Les plantations existantes doivent être maintenues en bon état de conservation.\n    Cependant l’abattage d’arbres est autorisé s’il est indispensable à l’implantation des\n    constructions ou à l’établissement d’un accès.\n13.1.2 Tout arbre abattu doit être remplacé sur le terrain par un arbre à développement\n    équivalent. Cependant, les projets de constructions ne doivent pas porter atteinte aux\n    arbres remarquables identifiés au plan de zonage.\n13.1.3 Tout projet de construction neuve entraîne l’obligation de traiter 25% au moins de la\n    superficie du terrain en espace vert, avec au minimum la plantation d’un arbre par\n    tranche de 200 m² de terrain.\n13.1.4 Lors de tout projet de construction, les plantations d’arbres sur le domaine public\n    doivent être préservées.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM3 102","13.2   REGLES PARTICULIERES\n13.2.1 Lors de la création de jardins sur dalle au rez-de-chaussée ou en terrasse, une hauteur\n    minimum de 0,50 mètres pour l’engazonnement et de 1 mètre pour la plantation\n    d’arbres doit être prévue.\n13.2.2 Dans le cas où une emprise au sol jusqu’à 100% est autorisée, il n’y a pas d’obligation\n    de création d’espaces verts.\n13.2.3 Les dispositions du présent article ne sont pas applicables pour les constructions ou\n    installations nécessaires aux services publics ou d’intérêt collectif.\nARTICLE 14 : COEFFICIENT D’OCCUPATION DU SOL (COS)\n    Sans objet.\nARTICLE   15 : PERFORMANCES    ENERGETIQUES    ET\nENVIRONNEMENTALES\nLa consommation énergétique des constructions nouvelles d’immeubles collectifs de\nlogements, de bureaux et les CINASPIC*, doit être inférieure de 10% à l’objectif fixé dans la\nRT 2012 (soit une performance augmentée de 10% par rapport à la RT2012).\nARTICLE  16 :  INFRASTRUCTURES    ET    RESEAUX    DE\nCOMMUNICATIONS ELECTRONIQUES\nUne construction ou une installation nouvelle, doit pouvoir être raccordée au réseau public ou\nprivé de communications électroniques. Les fourreaux de raccordement doivent être enfouis.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM3 103","    Ville de Puteaux\nCHAPITRE 9 : ZONE UPM4\nCARACTERE ET VOCATION DE LA ZONE\nIl s’agit d’une zone d’aménagement représentant l’ensemble du projet d’éco quartier des\nBergères, regroupant les périmètres de la ZAC des Bergères et de la ZAC Charcot. Elle se\nsitue en limite de Nanterre au Nord-Ouest de la Commune. Cette zone est à destination\nprincipale d’habitation. Elle comprend également tous les équipements, services et\ncommerces nécessaires au futur quartier.\nARTICLE 1 : OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\n1.1   Les constructions destinées à l’industrie.\n1.2   Les constructions destinées à l’exploitation agricole ou forestière.\n1.3   Les constructions destinées à la fonction d’entrepôt.\n1.4   Les terrains de camping et de caravanage, ainsi que ceux affectés à l’implantation\n    d’habitations légères de loisirs dans le cadre des articles L.443-1 à L.443-4 du Code\n    de l’Urbanisme, ainsi que le stationnement des caravanes isolées au sens des articles\n    R.111-37-4 à R.111-42 du Code de l’Urbanisme.\n1.5   Les affouillements, exhaussements des sols, exploitations des carrières, qui ne sont\n    pas nécessaires à des travaux de construction ou nécessaires au fonctionnement du\n    service public.\n1.6   Les dépôts de ferrailles, de matériel ou de matériaux de quelque nature que ce soit,\n    ainsi que les entreprises de cassage de voitures, la transformation de matériaux de\n    récupération et constructions provisoires ou mobiles, sauf si celles-ci sont liées au\n    fonctionnement d’un chantier en cours ou d’une construction et installation nécessaire\n    aux services publics ou d’intérêt collectif.\nARTICLE 2 : OCCUPATIONS ET UTILISATIONS DU SOL SOUMISES\nA DES CONDITIONS PARTICULIERES\n2.1   Les ouvrages techniques en infrastructure sont autorisés (poste transformateur, poste\n    de détente gaz, etc.) nonobstant les dispositions des articles 3 à 15, et à condition qu’ils\n    ne compromettent pas l’environnement des unités foncières voisines.\n2.2   Pour toutes les installations classées existantes, leur aménagement est autorisé à la\n    condition expresse que les travaux entraînent une atténuation des nuisances ou\n    dangers liés au classement et que toutes dispositions utiles soient mises en œuvre\n    pour l’intégration dans le milieu environnant.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM4 104","    Ville de Puteaux\n2.3    Pour les installations classées quels que soient les régimes auxquels elles sont\n    soumises, leurs aménagements ou leurs extensions sont admis aux conditions\n    suivantes :\n    - Soit :\n    • qu’elles correspondent à des besoins nécessaires à la vie et à la commodité des\n    habitants,\n    • que les nuisances (émanations nocives ou malodorantes, fumées, bruits, poussières,\n    altération des eaux, etc..) et dangers (risques d’incendie, explosion, etc.) puissent\n    être prévenus et évités de façon satisfaisante eu égard à l’environnement de la zone\n    sans dommage grave ou irréparable aux personnes et aux biens,\n    • et que leurs exigences de fonctionnement soient compatibles avec les infrastructures\n    existantes, notamment les voiries et l’assainissement.\nARTICLE 3 : ACCES ET VOIRIES\nToute construction doit être desservie par une voie publique ou privée répondant à\nl’importance ou à la destination de l’immeuble, ainsi qu’aux exigences de la sécurité, de la\nprotection civile et de la lutte contre l’incendie.\nLe nouveau maillage des voies de la zone est indiqué graphiquement au Plan de zonage, ainsi\nqu’au document graphique du règlement de zone.\nARTICLE 4 : DESSERTE PAR LES RESEAUX\nTous les réseaux et raccordements devront être enterrés.\nLa récupération et l’utilisation des eaux pluviales, ainsi que les eaux de toutes autres origines,\ndoivent respecter les exigences de la législation et de la réglementation en la matière,\nnotamment :\n    • La récupération des eaux de pluies et leur usage à l’intérieur et à l’extérieur des\n    bâtiments (arrêté du 21 aout 2008)\n    • Le contrôle des installations privatives de distribution d’eau potable, de récupération\n    des eaux de pluie ainsi que des ouvrages de prélèvement, puits et forages (arrêté du\n    17 décembre 2008 et circulaire du 9 novembre 2009)\n    • L’article 3.4 du contrat de délégation de service public de production et de distribution\n    d’eau potable\n    • Les articles 18 et 21 du règlement du service du Syndicat des eaux d’Ile-de-France.\n    • Le règlement départemental d’assainissement des Hauts de Seine en vigueur.\n4.1    ALIMENTATION EN EAU POTABLE\n4.1.1   Toute construction ou installation nouvelle qui, par sa destination nécessite l’utilisation\n    d’eau potable, doit être alimentée par branchement à un réseau collectif de distribution\n    sous pression présentant des caractéristiques suffisantes.\n4.1.2   Le pétitionnaire doit prendre toutes les précautions pour que les installations d’eau\n    potable ne soient immergées à l’occasion d’une mise en charge d’un égout, ni que\n    puisse se produire une quelconque introduction d’eaux polluées dans ces réseaux.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM4 105","    Ville de Puteaux\n4.2    ASSAINISSEMENT\n4.2.1   Toute construction ou installation nouvelle à l’intérieur d’une même propriété, doit être\n    conçue de manière à recueillir les eaux pluviales et les eaux usées séparément. Tous\n    les raccordements aux réseaux publics seront exécutés conformément à la\n    réglementation en vigueur, en respectant les caractéristiques de ce réseau et avec\n    l’accord des autorités compétentes.\n4.2.2   Le pétitionnaire doit prendre en compte les possibilités de mises en charge des réseaux\n    publics jusqu’à la cote altimétrique de la voie publique de façon à éviter le reflux d’eaux\n    d’égout dans les caves, sous-sols et constructions situées en contrebas de la voirie\n    publique. L’orifice d’évacuation des réseaux internes doit être équipé d’un clapet anti-\n    retour. Les regards situés à des niveaux inférieurs à cette cote, et qui n’auront pu être\n    évités, doivent être rendus étanches. Un ouvrage appelé « boîte de branchement » ou\n    « regard de façade » devra être placé sous le domaine public de préférence pour la\n    nécessité de contrôle et d’entretien du branchement (article 5 du Règlement communal\n    d’assainissement).\n4.2.3   EAUX USEES\n    • L’évacuation des eaux ménagères, et des effluents non traités, dans les fossés,\n    cours d’eau ou égouts pluviaux est interdite.\n    • Le branchement au réseau d’assainissement des canalisations d’évacuation des\n    liquides industriels résiduaires doit être soumis à la réglementation en vigueur et\n    particulièrement en ce qui concerne le traitement préalable de ces liquides.\n4.2.4 EAUX PLUVIALES\n    • Les aménagements réalisés sur un terrain ne doivent pas faire obstacle au libre\n    écoulement des eaux pluviales (articles 640 et 641 du Code Civil). Lorsqu’il existe\n    un réseau collectif apte à recueillir les eaux pluviales, les aménagements sur le\n    terrain doivent garantir leur évacuation dans ledit réseau.\n    • Les aménagements réalisés sur tout terrain doivent intégrer les contraintes en\n    matière de rétention des eaux pluviales telles qu’elles garantissent un débit de fuite\n    conforme au règlement communal d’assainissement et au règlement\n    départemental des Hauts-de-Seine. Aussi, sont mis en œuvre toutes techniques et\n    aménagements (bassins de stockage, restitution et/ou système d’infiltration..)\n    appropriés à la nature des travaux projetés, sauf en cas d’impossibilité liée la taille\n    et à la configuration du terrain.\n4.3    ELECTRICITE – GAZ – TELECOMMUNICATIONS – RESEAUX CABLES\n    Les branchements privatifs de toute nature doivent être réalisés en souterrain jusqu’en\n    limite du domaine public et ne doivent pas rester apparents sur la construction.\n    L’aménageur ou le lotisseur doit réaliser l’infrastructure nécessaire à la distribution de\n    ces différents réseaux depuis le point de raccordement général jusqu’à la limite de\n    parcelle.\n4.4    DECHETS – ORDURES MENAGERES\n4.4.1 Toute nouvelle construction doit être pourvue d’un local correctement accessible et\n    dimensionné pour recevoir les divers conteneurs liés à la collecte sélective des ordures\n    ménagères et déchets industriels banals (DIB).Toutefois, si le secteur est équipé d’un\n    dispositif enterré de collecte des ordures ménagères sous forme de bornes d’apport\n    volontaire localisé ou d’un dispositif enterré de collecte pneumatique des ordures\n    ménagères, il n’est pas nécessaire de prévoir un local de stockage des ordures\n    ménagères pour les constructions à usage d’habitation.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM4 106","    Ville de Puteaux\nARTICLE 5 : CARACTERISTIQUES DES TERRAINS\n    Sans objet.\nARTICLE 6 : IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT\nAUX VOIES ET EMPRISES PUBLIQUES\n6.1    Les constructions peuvent s’implanter à l’alignement des voies ou emprises publiques\n    ou en retrait d’au moins 1 mètre.\n6.2.   Il pourra être admis que des façades non rectilignes (par exemple en arrondi)\n    s’inscrivent de manière ponctuelle entre l’alignement et le retrait autorisé.\n6.3    Les constructions peuvent s’implanter en surplomb des voies et emprises publiques\n    non bâties (avec un minimum de 3 m au-dessus du sol fini).\nARTICLE 7 : IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT\nAUX LIMITES SEPARATIVES\nLes façades peuvent s’implanter en limite séparative ou en retrait d’au moins 3 mètres.\nARTICLE 8 : IMPLANTATION DES CONSTRUCTIONS LES UNES PAR\nRAPPORT AUX AUTRES SUR UNE MEME PROPRIETE\n    Sans objet\nARTICLE 9 : EMPRISE AU SOL\n    Se référer au document graphique du règlement de la zone.\nARTICLE 10 : HAUTEUR MAXIMALE DES CONSTRUCTIONS\n10.1   DEFINITION ET MODE DE CALCUL DE LA HAUTEUR\n10.1.1 La hauteur des constructions est définie :\n    • soit comme une hauteur totale (faîtage ou acrotère) par rapport au trottoir fini.\n    • soit par une référence à l’égout du toit.\n    • soit en nombre de niveaux.\n    • soit en référence à une cote exprimée par rapport au Nivellement Général de la\n    France (NGF).\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM4 107","    Ville de Puteaux\n10.2   REGLES GENERALES\n10.2.1 Dans le cas d’un terrain en pente le niveau de référence est la moyenne du point le\n    plus haut et du point le plus bas du terrain.\n10.2.3 La hauteur maximale des constructions est définie au document graphique du\n    règlement de zone :\n    -   En secteur A : R+5+Combles maximum et 93 m NGF à l’égout du toit\n    -   En secteur B : R+7+2Combles maximum et 26 mètres à l’égout du toit.\n    -   En secteur C : 150 m NGF maximum au faîtage\n    -   En secteur D : R+1+Combles maximum et 10 mètres au faîtage.\n10.3   REGLES PARTICULIERES\n10.3.1 Cet article n’est pas applicable aux constructions ou installations nécessaires au\n    service public ou d’intérêt collectif.\n10.3.2 La hauteur maximale autorisée peut être dépassée pour les constructions situées\n    notamment à l’angle de deux voies de circulation ou emprises publiques, et ce,\n    ponctuellement pour motif architectural (notamment pour la réalisation d’une rotonde),\n    dans la limite d’un niveau supplémentaire.\nARTICLE 11 : ASPECT EXTERIEUR\nLe parti architectural ainsi que la composition urbaine sont définis au Cahier des prescriptions\narchitecturales joint à chaque Cahier des charges de cession de terrain ou de lots dans le\ncadre de la ZAC des Bergères et de la ZAC Charcot.\n11.1   FACADES\n11.1.1 Les façades doivent être composées de matériaux nobles (pierre ou aspect pierre,\n    verre, métal, brique, etc.). les dispositifs de murs végétalisées sont autorisés.\n11.1.2 Sont interdits :\n    • L’emploi à nu de matériaux destinés à être recouverts d’un revêtement, d’un\n    parement ou d’un enduit (briques creuses, carreaux de plâtre, parpaings, etc.).\n    • Toute installation réalisée avec des moyens précaires ou dits « de fortune ».\n11.1.3 Les portes d’accès aux parcs de stationnements, les sas ouverts ainsi que les entrées\n    piétonnes doivent comporter une fermeture dans le plan de la façade, sauf impossibilité\n    manifeste liée à des impératifs de sécurité. Leur traitement doit bénéficier d’un soin\n    particulier de mise en valeur, que ce soit au niveau des matériaux (aspect bois, métal\n    laqué..) que de par son écriture architecturale. Elles doivent avoir, sur une même\n    façade, une similitude d’aspect.\n11.1.4 Les pignons sont traités avec le même soin et en harmonie avec les façades\n    principales.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM4 108","    Ville de Puteaux\n11.2   TOITURES\n11.2.1 Les combles et toitures doivent présenter une simplicité de volume et une unité de\n    conception. Les toitures des constructions sont composées :\n    • Soit d’une ou plusieurs pentes ou éléments à versants symétriques.\n    • Soit de toitures terrasses en tout ou parties végétalisées.\n    • Soit d’une seule pente pour motif architectural ou pour les annexes.\n    • Soit de rotondes ou éléments arrondis.\n11.3   REGLES PARTICULIERES\n11.3.1 Les conduits (de cheminées, de fumée, d’aération, de ventilation et d’extraction)\n    relèvent du code de la construction et de l’habitation, de l’arrêté du 22 octobre 1969 et\n    du règlement sanitaire départemental.\n    Ces équipements sont traités en harmonie avec les façades de la construction.\n11.3.2 Il n’est pas fixé de règles pour les constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif. Pour les antennes relais se référer à l’article 6.2\n    des dispositions générales.\nARTICLE 12 : STATIONNEMENT\n12.1   REGLES GENERALES\n12.1.1 Le stationnement des véhicules correspondant aux besoins des constructions,\n    extensions et installations autorisées dans la zone, est assuré en dehors des voies\n    publiques sur des emplacements aménagés à cet effet.\n12.1.2 Pour toute construction, les stationnements sont réalisés en sous-sol ou selon les\n    dispositions de l’article 12.2.1 du présent article.\n12.1.3 Pour les constructions d’habitation dont les surfaces de planchers totales sont\n    inférieures ou égales à 1000 m² SDP, il n’est pas imposé de règles en matière de\n    stationnement des véhicules et 2 roues motorisées.\n12.1.4 Tableau de répartition par type de construction et installation :\n    NORME\n   DESTINATION ET    NATURE    DE    LA    NORME PLAFOND\n    PLANCHER\n   CONSTRUCTION    (maximum)\n    (minimum)\n    Habitation (SDP > 1000 m²) :\n    • logement >25 m²    1 place/logement\n    • logement financés par un prêt aidé    0,5 place/logement    Pas de norme\n    de l’Etat > 25m² et situé à moins de    plafond\n    500m d’une gare de transport en\n    commun\n    • logement ≤25 m²    Aucune place\n    1 place pour 4    Pas de norme\n    Résidences *\n    logements    plafond\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM4 109","    Ville de Puteaux\n    1 place/10    Pas de norme\n    Hébergement hôtelier :\n    chambres    plafond\n   Bureaux :\n    Automobiles : 1 place\n    pour 70m² de SDP\n    •   à plus de 500m d’une gare de\n    2 roues** : pas de\n    transport en commun    8% de la SDP\n    norme plafond\n    Dont 1% pour les 2\n    roues**\n    Automobiles : 1 place\n    •   à 500m ou moins d’une gare de    pour 90m² de SDP\n    transport en commun    2 roues** : pas de\n    norme plafond\n   Commerces :\n    Pas de norme\n   Par tranche de 100 m² au-delà de 150 m²    1\n    plafond\n   de SDP par unité commerciale\n    Artisanat :\n    Pas de norme\n    Par tranche de 100 m² au-delà de 150 m²    1\n    plafond\n    de SDP par unité d’activité\n**2 roues : motos et vélos\n    •   Le nombre de places à réaliser résultant des normes ci-dessus est, en cas de\n    décimale supérieure ou égale à 5, arrondi à l’unité supérieure.\n    •   Il est exigé une place pour chacune des tranches qu’elle soit entière ou partielle.\n    •   Lorsque les places sont données pourcentage de la SDP, leur nombre résulte de\n    la division de la surface par 28 m².\n12.1.6 Pour tous les programmes de constructions, il est exigé un minimum de 2% (5% pour\n    les programmes de logements) de place de stationnement pour les personnes à\n    mobilité réduites (PMR). Ces places doivent avoir les dimensions minimales suivantes :\n    •   Largeur : 3,30 m\n    •   Longueur : 5,00 m\n    Celles-ci pourront être associées 2 à 2 avec une largeur de dégagement latérale\n    commune d’au minimum 0,80 m.\n12.1.7 Pour toutes les constructions neuves d’habitation, le stationnement des motocyclettes\n    doit représenter au minimum 1 % de la SDP et se situer en sous-sol, soit sur des\n    emplacements spécifiques, soit en combinaison des stationnements automobiles.\n12.1.8 Pour toutes les constructions neuves d’habitation, des locaux fermés et spécifiques,\n    pour entreposer les vélos et les poussettes doivent s’implanter dans le volume de la\n    construction en rez-de-chaussée ou en sous-sol. Ces locaux doivent représenter au\n    total une surface de 2% minimum de la SDP de la construction.\nNota : Les normes définies dans cet article, notamment celles relatives au stationnement des\n    vélos, doivent, par ailleurs, respecter les dispositions en vigueur inscrites, à la\n    délivrance du permis de construire, dans le code de la construction et de l’habitation et\n    les arrêtés d’application.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM4 110","    Ville de Puteaux\n12.2   REGLES PARTICULIERES\n12.2.1 En cas d’impossibilité architecturale ou technique d’aménager sur le terrain de\n    l’opération le nombre d’emplacements nécessaires au stationnement, le bénéficiaire\n    peut être autorisé à solliciter l’application de l’article L.151-33 du Code de l’Urbanisme\n    si ces stationnements sont réalisés en sous-sol.\n12.2.2 Il n’est pas fixé de règles pour les constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif.\nARTICLE 13 : ESPACES LIBRES ET PLANTATIONS\n13.1   REGLES GENERALES\n13.1.1 Les plantations existantes doivent être maintenues en bon état de conservation.\n    Cependant l’abattage d’arbres est autorisé s’il est indispensable à l’implantation des\n    constructions ou à l’établissement d’un accès.\n13.1.2 Tout arbre abattu doit être remplacé sur le terrain par un arbre à développement\n    équivalent. Cependant, les projets de constructions ne doivent pas porter atteinte aux\n    arbres remarquables identifiés au plan de zonage.\n13.1.3 Lors de tout projet de construction, les plantations d’arbres sur le domaine public\n    doivent être préservées.\n13.2   REGLES PARTICULIERES\n13.2.2 Les dispositions du présent article ne sont pas applicables pour les constructions ou\n    installations nécessaires aux services publics ou d’intérêt collectif.\nARTICLE 14 : COEFFICIENT D’OCCUPATION DU SOL (COS)\nSans objet\nARTICLE   15 : PERFORMANCES    ENERGETIQUES    ET\nENVIRONNEMENTALES\nSe référer aux dispositions de la grille du développement durable annexée dans le cahier des\ncharges de cession de la ZAC.\nARTICLE  16 :  INFRASTRUCTURES    ET    RESEAUX    DE\nCOMMUNICATIONS ELECTRONIQUES\nUne construction ou une installation nouvelle, doit pouvoir être raccordée au réseau public ou\nprivé de communications électroniques. Les fourreaux de raccordement doivent être enfouis.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UPM4 111","CHAPITRE 12 : ZONE UZ3\nCARACTERE ET VOCATION DE LA ZONE\nIl s’agit d’une zone délimité par le périmètre la ZAC Cœur de Ville à vocation d’habitation, de\ncommerces et d’équipements. Le règlement ci-dessous correspond aux grandes dispositions\nde l’ancien règlement spécifique de la zone.\nARTICLE 1 : OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\n1.1    Les constructions destinées à l’industrie.\n1.2    Les constructions destinées à l’exploitation agricole ou forestière.\n1.3    Les constructions destinées à la fonction d’entrepôt.\n1.4    Les terrains de camping et de caravanage, ainsi que ceux affectés à l’implantation\n    d’habitations légères de loisirs dans le cadre des articles L.443-1 à L.443-4 du Code\n    de l’Urbanisme, ainsi que le stationnement des caravanes isolées au sens des articles\n    R.111-37-4 à R.111-42 du Code de l’Urbanisme.\n1.5    Les affouillements, exhaussements des sols, exploitations des carrières, qui ne sont\n    pas nécessaires à des travaux de construction ou nécessaires au fonctionnement du\n    service public.\n1.6    Les dépôts de ferrailles, de matériel ou de matériaux de quelque nature que ce soit,\n    ainsi que les entreprises de cassage de voitures, la transformation de matériaux de\n    récupération et constructions provisoires ou mobiles, sauf si celles-ci sont liées au\n    fonctionnement d’un chantier en cours ou d’une construction et installation nécessaire\n    aux services publics ou d’intérêt collectif.\nARTICLE 2 : OCCUPATIONS ET UTILISATIONS DU SOL SOUMISES\nA DES CONDITIONS PARTICULIERES\n2.1    Les locaux à destination de commerce ou d’artisanat sont autorisés en sous-sol, rez-\n    de-chaussée et premier étage des constructions.\n    Etant précisé que la vocation des locaux destinés à l’artisanat doit être compatible avec\n    la vie de quartier. La surface de vente des locaux commerciaux ne doit pas excéder 300\n    m² de SDP par unité commerciale, hors réserves.\n2.2    Les ouvrages techniques en infrastructure sont autorisés (poste transformateur, poste\n    de détente gaz, etc.) nonobstant les dispositions des articles 3 à 15, et à condition qu’ils\n    ne compromettent pas l’environnement des unités foncières voisines.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UZ3 112","2.3    Pour toutes les installations classées quels que soient les régimes auxquels elles sont\n    soumises, leur aménagement est autorisé aux conditions suivantes :\n    • qu’elles correspondent à des besoins nécessaires à la vie et à la commodité des\n    habitants,\n    • que les nuisances (émanations nocives ou malodorantes, fumées, bruits, poussières,\n    altération des eaux, etc..) et dangers (risques d’incendie, explosion, etc.) puissent\n    être prévenus et évités de façon satisfaisante eu égard à l’environnement de la zone\n    sans dommage grave ou irréparable aux personnes et aux biens,\n    • et que leurs exigences de fonctionnement soient compatibles avec les infrastructures\n    existantes, notamment les voiries et l’assainissement.\n2.4    Le remplacement des constructions existantes destinées aux bureaux à SDP\n    identique.\nARTICLE 3 : ACCES ET VOIRIES\n3.1    ACCES\n3.1.1 Pour être constructible, un terrain doit avoir un accès à une voie ouverte à la circulation\n    générale. Cet accès doit être aménagé :\n    • Soit directement en façade sur rue (dans la limite d’un accès par tranche de 30\n    mètres de façade).\n    • Soit par l’intermédiaire d’un passage privé (appendice d’accès).\n    • Soit par une servitude de passage suffisante, instituée par un acte authentique ou\n    par voie judiciaire, en application de l’article 682 du Code Civil.\n3.1.2   Les accès ne doivent présenter aucun risque pour la sécurité des usagers des voies\n    publiques ou pour celle des personnes utilisant cet accès, eu égard à la nature et à\n    l’importance du trafic, ainsi qu’à la position et à la configuration de ces accès.\n3.1.3   Lorsqu’un terrain est desservi par plusieurs voies, toute construction ou extension peut-\n    être autorisée sous réserve que l’accès soit établi sur la voie où la gêne pour la\n    circulation est la moindre.\n3.2    VOIRIE\n3.2.1   Les constructions et installations doivent être desservies par des voies ouvertes à la\n    circulation générale dont les caractéristiques correspondent à leur destination, a savoir,\n    une largeur minimum de 3,50m et 3 mètres dans le cas d’un accès droit d’une longueur\n    inférieure à 50 mètres. Ces voies doivent permettre de satisfaire aux exigences de la\n    sécurité, de la défense contre l’incendie et de la protection civile.\n4.2.8   Les voies nouvelles en impasse doivent comporter un aménagement permettant aux\n    véhicules de faire demi-tour.\n3.2.3   La création ou l’aménagement des voies doit respecter les prescriptions relatives à leur\n    accessibilité aux personnes handicapées.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UZ3 113","ARTICLE 4 : DESSERTE PAR LES RESEAUX\nTous les réseaux et raccordements devront être enterrés.\nLa récupération et l’utilisation des eaux pluviales, ainsi que les eaux de toutes autres origines,\ndoivent respecter les exigences de la législation et de la réglementation en la matière,\nnotamment :\n    • La récupération des eaux de pluies et leur usage à l’intérieur et à l’extérieur des\n    bâtiments (arrêté du 21 aout 2008)\n    • Le contrôle des installations privatives de distribution d’eau potable, de récupération\n    des eaux de pluie ainsi que des ouvrages de prélèvement, puits et forages (arrêté du\n    17 décembre 2008 et circulaire du 9 novembre 2009)\n    • L’article 3.4 du contrat de délégation de service public de production et de distribution\n    d’eau potable\n    • Les articles 18 et 21 du règlement du service du Syndicat des eaux d’Ile-de-France.\n    • Le règlement départemental d’assainissement des Hauts de Seine en vigueur.\n4.1    ALIMENTATION EN EAU POTABLE\n4.1.1   Toute construction ou installation nouvelle qui, par sa destination nécessite l’utilisation\n    d’eau potable, doit être alimentée par branchement à un réseau collectif de distribution\n    sous pression présentant des caractéristiques suffisantes.\n4.1.2   Le pétitionnaire doit prendre toutes les précautions pour que les installations d’eau\n    potable ne soient immergées à l’occasion d’une mise en charge d’un égout, ni que\n    puisse se produire une quelconque introduction d’eaux polluées dans ces réseaux.\n4.2    ASSAINISSEMENT\n4.2.1   Toute construction ou installation nouvelle à l’intérieur d’une même propriété, doit être\n    conçue de manière à recueillir les eaux pluviales et les eaux usées séparément. Tous\n    les raccordements aux réseaux publics seront exécutés conformément à la\n    réglementation en vigueur, en respectant les caractéristiques de ce réseau et avec\n    l’accord des autorités compétentes.\n4.2.2   Le pétitionnaire doit prendre en compte les possibilités de mises en charge des réseaux\n    publics jusqu’à la cote altimétrique de la voie publique de façon à éviter le reflux d’eaux\n    d’égout dans les caves, sous-sols et constructions situées en contrebas de la voirie\n    publique. L’orifice d’évacuation des réseaux internes doit être équipé d’un clapet anti-\n    retour. Les regards situés à des niveaux inférieurs à cette cote, et qui n’auront pu être\n    évités, doivent être rendus étanches. Un ouvrage appelé « boîte de branchement » ou\n    « regard de façade » devra être placé sous le domaine public de préférence pour la\n    nécessité de contrôle et d’entretien du branchement (article 5 du Règlement communal\n    d’assainissement).\n4.2.3 EAUX USEES\n    • L’évacuation des eaux ménagères, et des effluents non traités, dans les fossés,\n    cours d’eau ou égouts pluviaux est interdite.\n    • Le branchement au réseau d’assainissement des canalisations d’évacuation des\n    liquides industriels résiduaires doit être soumis à la réglementation en vigueur et\n    particulièrement en ce qui concerne le traitement préalable de ces liquides.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UZ3 114","4.2.4 EAUX PLUVIALES\n    • Les aménagements réalisés sur un terrain ne doivent pas faire obstacle au libre\n    écoulement des eaux pluviales (articles 640 et 641 du Code Civil). Lorsqu’il existe\n    un réseau collectif apte à recueillir les eaux pluviales, les aménagements sur le\n    terrain doivent garantir leur évacuation dans ledit réseau.\n    • Les aménagements réalisés sur tout terrain doivent intégrer les contraintes en\n    matière de rétention des eaux pluviales telles qu’elles garantissent un débit de fuite\n    conforme au règlement communal d’assainissement et au règlement\n    départemental des Hauts-de-Seine. Aussi, sont mis en œuvre toutes techniques et\n    aménagements (bassins de stockage, restitution et/ou système d’infiltration..)\n    appropriés à la nature des travaux projetés, sauf en cas d’impossibilité liée la taille\n    et à la configuration du terrain.\n4.3    ELECTRICITE – GAZ – TELECOMMUNICATIONS – RESEAUX CABLES\n    Les branchements privatifs de toute nature doivent être réalisés en souterrain jusqu’en\n    limite du domaine public et ne doivent pas rester apparents sur la construction.\n    L’aménageur ou le lotisseur doit réaliser l’infrastructure nécessaire à la distribution de\n    ces différents réseaux depuis le point de raccordement général jusqu’à la limite de\n    parcelle.\n4.4    DECHETS – ORDURES MENAGERES\n4.4.1   Toute nouvelle construction doit être pourvue d’un local correctement accessible et\n    dimensionné pour recevoir les divers conteneurs liés à la collecte sélective des ordures\n    ménagères et déchets industriels banals (DIB).\nARTICLE 5 : CARACTERISTIQUES DES TERRAINS\n    Sans objet.\nARTICLE 6 : IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT\nAUX VOIES ET EMPRISES PUBLIQUES\n6-1    PAR RAPPORT AUX VOIES PUBLIQUES OU PRIVEES\n6.1.1 Les constructions et installations doivent s’implanter soit :\n    • A l’alignement actuel des voies ouvertes à la circulation publique.\n    • A la marge de reculement obligatoire qui s’y substitue lorsque celle-ci est portée\n    sur les documents graphiques.\n    • En retrait de celles-ci avec un minimum de 3 mètres.\n6.1.2   Lorsque la longueur de la façade sur voie publique ou privée est supérieure à 25 m,\n    des retraits sur alignement peuvent être autorisés afin de permettre une amélioration\n    de lecture de l’ensemble urbain. La continuité de l’alignement est assurée par une\n    clôture.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UZ3 115","6.1.3   Dans le cas de terrains situés à l’angle de deux voies, publiques ou privées, ouvertes\n    à la circulation publique, les constructions supportent un alignement nouveau constitué\n    :\n    • soit par un pan coupé, d’une longueur de 3 m minimum, rejoignant les deux\n    alignements adjacents par deux angles égaux.\n    • soit par un arc de cercle tangent ou en retrait des alignements existants ou figurant\n    au plan.\n6.1.4   Pour les constructions et installations nécessaire au service public ou d’intérêt collectif,\n    leur implantation peut être réalisée à l’alignement ou en retrait par rapport à\n    l’alignement actuel ou projeté et par rapport aux emprises publiques d’au moins 1\n    mètre.\n6-2    PAR RAPPORT AUX EMPRISES PUBLIQUES\n    Sans objet\nARTICLE 7 : IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT\nAUX LIMITES SEPARATIVES\n7.1 REGLES GENERALES\n7.1.1 Toute construction peut s’implanter sur les limites ou en retrait de celles-ci.\n7.1.2   En cas d’implantation en retrait, la distance comptée horizontalement (L) de tout point\n    de la façade au point de la limite parcellaire qui en est le plus rapproché doit être au\n    moins égale à la moitié de la hauteur (H) de la façade par rapport au niveau du sol fini\n    après travaux, sans pouvoir être inférieure à 3 mètres. (L=H/2 avec L ≥ 3 mètres).\n7.1.3   Les balcons, lucarnes et autre élément de construction en toiture, ne sont pas pris en\n    compte pour le calcul des prospects.\n7.1.4   Pour les constructions et installations nécessaires au service public ou d’intérêt\n    collectif, le retrait est au minimum d’1 mètre.\nARTICLE 8 : IMPLANTATION DES CONSTRUCTIONS LES UNES PAR\nRAPPORT AUX AUTRES SUR UNE MEME PROPRIETE\n8.1    REGLES GENERALES\n8.1.1   A moins qu’elles ne soient contiguës, l’implantation de plusieurs constructions sur une\n    même propriété est autorisée à condition que :\n    • en tout point de chaque façade (y compris les saillies* supérieures à 1,50 m de\n    profondeur), la distance mesurée normalement à celle-ci et la séparant d’une\n    façade d’un autre bâtiment, soit au moins égale à la moitié de la hauteur de la\n    façade la plus haute avec un minimum de 8 mètres.\n8.1.2   Les balcons, lucarnes et autre élément de construction en toiture, ne sont pas pris en\n    compte pour le calcul des prospects.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UZ3 116","8.2    REGLES PARTICULIERES\n8.2.1   Il n’est pas fixé de règles pour les constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif.\n8.2.2   L’article 8.1.1 ne s’applique pas aux constructions annexes inférieures à 10 m² et dont\n    la hauteur totale de la construction est inférieure à 3 mètres.\nARTICLE 9 : EMPRISE AU SOL\n9.1    L’emprise au sol des bâtiments, déduction faite des surfaces destinées à des\n    opérations de voirie, ne peut excéder 60 % de la superficie du terrain.\n    En secteur A, délimité au document graphique, l’emprise au sol est au maximum de\n    100 %.\n9.2    Pour les équipements d’intérêt général, l’emprise au sol autorisée est de 100 %.\n9.3    En cas de réhabilitation, l’emprise au sol des locaux annexes à la construction\n    principale n’est pas prise en compte, de même que pour la création d’ascenseurs\n    extérieurs.\nARTICLE 10 : HAUTEUR MAXIMALE DES CONSTRUCTIONS\n10.1    DEFINITION ET MODE DE CALCUL DE LA HAUTEUR\n10.1.1 La hauteur des constructions est définie :\n    • soit comme une hauteur totale (faîtage ou acrotère).\n    • soit par une référence à l’égout du toit.\n    • soit en nombre de niveaux.\n    • soit en référence à une cote exprimée par rapport au Nivellement Général de la\n    France (NGF).\n10.1.2 La hauteur de la construction est mesurée à partir du niveau moyen fini du trottoir\n    jusqu’au point de référence le plus élevé du bâtiment (faîtage), les ouvrages\n    techniques, cheminées et autres superstructures de faible emprise étant exclus.\n10.1.3 Dans le cas d’un terrain en pente le niveau de référence est la moyenne du point le\n    plus haut et du point le plus bas du terrain.\n10.2    REGLES GENERALES\n10.2.1 Pour le calcul des hauteurs maximales, se référer au document graphique du\n    règlement de zone, annexé au présent règlement. Les hauteurs indiquées au plan sont\n    les hauteurs totales maximales conduisant à un nombre de niveaux maximal autorisé\n    exprimé en R+X+C.\n10.2.2 La hauteur maximale des constructions peut être dépassée ponctuellement, pour la\n    réalisation de rotondes ou d’éléments architecturaux dans les constructions situées\n    notamment à l’angle de deux voies ou emprises publiques, dans la limite d’un niveau\n    supplémentaire.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UZ3 117","ARTICLE 11 : ASPECT EXTERIEUR\n    •   Les constructions, par leur situation, leur architecture, leurs dimensions, l’aspect\n    extérieur des bâtiments ou ouvrages à édifier ou à modifier, ne doivent pas porter\n    atteinte au caractère ni à l’intérêt des lieux avoisinants, aux sites, aux paysages\n    naturels, urbains ainsi qu’à la conservation des perspectives monumentales (article\n    R.111-21 du Code de l’Urbanisme).\n    •   Un parti architectural privilégiant une composition verticale de la façade doit être\n    observé pour toute nouvelle construction, et ce afin de conserver une morphologie\n    du tissu urbain qui identifie clairement des séquences courtes, composées et\n    articulées, excluant l’uniformité, y compris sur les projets regroupant plusieurs\n    unités foncières.\n11.1   FACADES\n11.1.1 Les façades doivent être composées de matériaux nobles (aspect pierre, verre, métal,\n    brique, etc.). les dispositifs de murs végétalisées sont autorisés.\n11.1.2 La texture des enduits et peintures, de même que leurs teintes doivent être adaptées\n    aux matériaux composant la façade et s’accorder harmonieusement à l’aspect des\n    constructions avoisinantes.\n11.1.3 Sont interdits :\n    • L’emploi à nu de matériaux destinés à être recouverts d’un revêtement, d’un\n    parement ou d’un enduit (briques creuses, carreaux de plâtre, parpaings, etc.).\n    • Toute installation réalisée avec des moyens précaires ou dits « de fortune ».\n11.1.4 La mise en valeur des façades doit être recherchée à travers la restitution de matériaux\n    d’origine, de reliefs (bow-windows, modénatures…), d’accessoires ou de décors\n    anciens disparus.\n11.1.5 Les portes d’accès aux parcs de stationnements, les sas ouverts ainsi que les entrées\n    piétonnes doivent comporter une fermeture dans le plan de la façade, sauf impossibilité\n    manifeste liée à des impératifs de sécurité. Leur traitement doit bénéficier d’un soin\n    particulier de mise en valeur, que ce soit au niveau des matériaux (aspect bois, métal\n    laqué..) que de par son écriture architecturale. Elles doivent avoir, sur une même\n    façade, une similitude d’aspect.\n11.1.6 Les pignons sont traités avec le même soin et en harmonie avec les façades\n    principales.\n11.1.7 Les postes de transformation électrique et les postes de détente gaz doivent être\n    intégrés dans le volume de la construction (sauf cas d’impossibilité technique), en\n    prenant en compte en particulier les matériaux et les couleurs des constructions\n    avoisinantes.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UZ3 118","11.2    DEVANTURES\n11.2.1 En cas de devanture se développant à rez-de-chaussée sous une corniche ou un\n    bandeau filant, ceux-ci doivent être reconstitués s’ils ont été supprimés ou\n    endommagés.\n11.2.2 La réalisation de devanture se développant sur deux ou plusieurs niveaux ne peut être\n    autorisée que lorsque l’architecture du bâtiment le permet ou a été conçue dans ce\n    sens (entresol…).\n11.2.3 Les devantures peuvent être implantées, soit en saillie par rapport au plan de la façade\n    pour les devantures dites « en applique », soit en retrait limité (10 à 20 cm dans les 2\n    cas) pour les devantures dites « en feuillure ».\n11.2.4 Les coffres et grilles de fermeture doivent être implantés intérieurement, en retrait des\n    vitrines (sauf impossibilité technique ou architecturale manifeste), le choix du système\n    de protection, en arrière de la vitrine, doit maintenir les transparences visuelles, sous\n    réserve des nécessités liées à la sécurité.\n11.2.5 Les bandeaux supérieurs des devantures, destinés à recevoir l’enseigne, doivent être\n    de hauteur limitée (0,80 mètre maximum) de façon à limiter les effets d’horizontalité qui\n    nuisent à la bonne lecture des proportions des bâtiments. Ces bandeaux sont limités à\n    la longueur de la façade commerciale.\n11.3.   TOITURES\n11.3.1 Les combles et toitures doivent présenter une simplicité de volume et une unité de\nconception. Les toitures des constructions sont composées :\n    • Soit d’une ou plusieurs pentes ou éléments à versants symétriques.\n    • Soit de toitures terrasses en tout ou parties végétalisées.\n    • Soit d’une seule pente pour motif architectural ou pour les annexes.\n    • Soit de rotondes ou éléments arrondis.\n11.3.2 Ces dispositions peuvent ne pas être imposées en cas d’adjonction à une construction\n    existante.\n11.3.3 Les matériaux autorisés en toiture sont de type :\n    • Aspect Tuiles traditionnelles, mécaniques.\n    • Aspect Ardoises\n    • Aspect Zinc.\n11.3.4 Les panneaux solaires sont autorisés à condition que ceux-ci soient non-réfléchissants,\n    implantés dans la pente de la toiture, le tout sans aller au-delà de la hauteur autorisée.\n    Sur les toitures terrasses, les panneaux doivent s’implanter en retrait des façades d’au\n    moins 1 mètre, sans pouvoir dépasser 3 mètres de hauteur totale.\n11.3.5 L’éclairement éventuel des combles est assuré par des ouvertures en lucarnes, soit\n    par des châssis de toit dans le plan des versants, soit par des fenêtres en pignons, si\n    les règles de prospect le permettent.\n11.3.6 Il pourra être admis une terrasse en tout ou partie de la toiture d’une construction neuve\n    dans les conditions suivantes :\n    • Si la terrasse est accessible, elle doit être de plain-pied accessible depuis le\n    logement et en constituer un espace d’agrément.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UZ3 119","    •  Si la terrasse est inaccessible, elle doit être végétalisée en répondant aux critères\n    de Haute Qualité Environnementale (HQE).\n    • Dans tous les cas, la création de terrasse ne doit pas dénaturer l’aspect général de\n    la toiture.\n    Les tropéziennes (voir définition en annexes) sont interdites.\n11.3.7 Les descentes d’eau pluviales sont intégrées au volume de la construction et non\n    apparentes sur la façade principale. Les chenaux sont intégrés dans une corniche ou\n    tout autre élément de modénature ou de construction les rendant invisibles depuis la\n    rue. Tout rejet direct des eaux de pluie depuis les balcons ou les terrasses est interdit,\n    un dispositif de récupération de ces eaux dans les descentes verticales doit être prévu.\n11.3.8 Les édicules et accessoires à caractère technique (caisson de climatisation,\n    extracteurs, édicules d’ascenseurs, etc…),\n    Pour les toitures à pentes :\n    Ils sont intégrés au volume général de la construction\n    Pour les toitures terrasses :\n    • Ils sont regroupés de manière homogène\n    • Ils sont implantés en retrait de 2 mètre minimum par rapport aux façades.\n    • Leur hauteur ne dépasse pas le niveau fini de la terrasse de plus de 2 mètres\n    afin d’en limiter l’impact visuel.\n    • Leur traitement doit se faire en harmonie avec la construction (couleurs,\n    matériaux…).\n11.3.9 Les antennes d’émission ou de réception doivent être implantées de manière à réduire\n    l’impact visuel et esthétique.\n11.4   CLOTURES\n11.4.1 CLOTURES SUR VOIES\n    • Elles doivent s’implanter à l’alignement.\n    • Leur hauteur maximale est de 3 mètres, en cas de terrain en pentes, la hauteur\n    totale moyenne ne peut excéder 3,50 mètres. Toutefois, l’entretien et la\n    restauration des murs anciens en maçonnerie d’une hauteur supérieure sont\n    admis. Des hauteurs supérieures peuvent également être admises en cas\n    d’impératifs liés à la sécurité.\n    • Elles sont constituées soit :\n    - d’un mur bahut en maçonnerie apparente ou enduite, surmonté d’une grille\n    métallique à barreaudages verticaux, composée d’éléments ouvragés et/ou\n    ponctuels.\n    - d’un mur plein lorsqu’il constitue le prolongement de la construction ou permet la\n    continuité d’un front bâti, réalisé en matériaux destinés à rester apparents (pierre\n    de taille, moellon, briques pleines jointoyées, etc.) ou recouverts d’un enduit\n    identique à celui de la construction principale.\n11.4.2 CLOTURES EN LIMITES SEPARATIVES\n    • Leur hauteur maximale est de 3 mètres, toutefois, l’entretien et la restauration des\n    murs anciens en maçonnerie d’une hauteur supérieure sont admis.\n    • Les clôtures sont constituées soit :\n    - d’un mur bahut en maçonnerie apparente ou enduite, surmonté d’une grille\n    métallique à barreaudages verticaux, composée d’éléments ouvragés et/ou\n    ponctuels.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UZ3 120","    - d’un mur plein réalisé en matériaux destinés à rester apparents (pierre de taille,\n    moellon, briques pleines jointoyées, etc.) ou recouverts d’un enduit identique à celui\n    de la construction principale.\n    - d’une structure ajourée.\n11.5   REGLES PARTICULIERES\n11.5.1 Les conduits (de cheminées, de fumée, d’aération, de ventilation et d’extraction)\n    relèvent du code de la construction et de l’habitation, de l’arrêté du 22 octobre 1969 et\n    du règlement sanitaire départemental.\n    Ces équipements sont traités en harmonie avec les façades de la construction.\n11.5.2 Pour annexes contigües à la construction principale, les matériaux et couleurs\n    employés doivent êtres similaires à celle-ci. Pour les autres annexes, le bois peut être\n    autorisé.\n11.5.3 Les citernes ou autre pompe à chaleur sont implantées de telle manière qu’elles ne\n    soient pas visibles depuis la voie.\n11.5.4 Il n’est pas fixé de règles pour les constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif. Pour les antennes relais se référer à l’article 6.2\n    des dispositions générales.\nARTICLE 12 : STATIONNEMENT\n12.1   REGLES GENERALES\n12.1.1 Le stationnement des véhicules correspondant aux besoins des constructions,\n    extensions et installations autorisées dans la zone, est assuré en dehors des voies\n    publiques sur des emplacements aménagés à cet effet.\n    Pour les constructions et installations nouvelles destinées au commerce et à l’artisanat,\n    des aires de stationnement, de manœuvre, de chargement et de déchargement des\n    véhicules lourds de livraison doivent être prévues hors emprises publiques.\n12.1.2 Pour toute construction, les stationnements sont réalisés en sous-sol ou selon les\n    dispositions de l’article 12.2.1 du présent article.\n12.1.3 Aucune place de stationnement ne peut être supprimée à moins de respecter les règles\n    de l’article 12.1.\n12.1.4 Pour les constructions d’habitation dont les surfaces de planchers totales sont\n    inférieures ou égales à 1000 m² SDP, il n’est pas imposé de règles en matière de\n    stationnement des véhicules et 2 roues motorisées.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UZ3 121","12.1.5 Tableau de répartition par type de construction et installation :\n    NORME\n   DESTINATION ET    NATURE    DE    LA    NORME PLAFOND\n    PLANCHER\n   CONSTRUCTION    (maximum)\n    (minimum)\n    Habitation (SDP > 1000 m²) :\n    • logement > 25 m² :\n    secteurs B et C    1 place/logement\n    secteur A    0,75 place/logement    Pas de norme\n    • logement financés par un prêt aidé    plafond\n    de l’Etat > 25m² et situé à moins de    0,5 place/logement\n    500m d’une gare de transport en\n    commun\n    • logement ≤25 m²    Aucune place\n    1 place pour 4    Pas de norme\n   Résidences * :\n    logements    plafond\n    1 place/10    Pas de norme\n   Hébergement hôtelier :\n    chambres    plafond\n   Bureaux :\n    •   à plus de 500m d’une gare de    1 place pour 70m²\n    8% de la SDP\n    transport en commun    de SDP\n    •   à 500m ou moins d’une gare de    1 place pour 90m²\n    transport en commun    de SDP\n   Commerces :\n    Pas de norme\n   Par tranche de 100 m² de SDP au-delà de    1\n    plafond\n   150 m² de SDP par unité commerciale\n   Artisanat :\n    Pas de norme\n   Par tranche de 100 m² de SDP au-delà de    1\n    plafond\n   150 m² de SDP par unité d’activité\n    •   Le nombre de places à réaliser résultant des normes ci-dessus est, en cas de\n    décimale supérieure ou égale à 5, arrondi à l’unité supérieure.\n    •   Il est exigé une place pour chacune des tranches qu’elle soit entière ou partielle.\n    •   Lorsque les places sont données pourcentage de la SDP, leur nombre résulte de\n    la division de la surface par 28 m².\nNOTA : ALIMENTATION POUR VEHICULES RECHARGEABLES\nL'équipement de dispositifs de raccordement techniques nécessaires à l’alimentation de prises de\nrecharges pour les véhicules électriques ou hybrides permettant un comptage individuel est\nobligatoire pour certaines nouvelles constructions dotées de places de stationnement énoncées à\nl’article L.111-5-2 du code de la construction et de l’habitation\n12.1.6 Pour toutes les constructions neuves d’habitation, le stationnement des motocyclettes\n    doit représenter au minimum 1 % de la SDP et se situer en sous-sol, soit sur des\n    emplacements spécifiques, soit en combinaison des stationnements automobiles.\n12.1.7 Pour toutes les constructions neuves d’habitation, des locaux fermés et spécifiques,\n    pour entreposer les vélos et les poussettes doivent s’implanter dans le volume de la\n    construction en rez-de-chaussée ou en sous-sol. Ces locaux doivent représenter au\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UZ3 122","    total une surface de 0,5% minimum de la SDP de la construction en secteur A et 1%\n    en secteurs B et C.\nNota : Les normes définies dans cet article, notamment celles relatives au stationnement des\n    vélos, doivent, par ailleurs, respecter les dispositions en vigueur inscrites, à la\n    délivrance du permis de construire, dans le code de la construction et de l’habitation et\n    les arrêtés d’application.\n12.2   REGLES PARTICULIERES\n12.2.1 12.2.1 En cas d’impossibilité architecturale ou technique d’aménager sur le terrain de\n    l’opération le nombre d’emplacements nécessaires au stationnement, le bénéficiaire\n    peut être autorisé à solliciter l’application de l’article L.151-33 du Code de l’Urbanisme\n    si ces stationnements sont réalisés en sous-sol.\n12.2.2 Il n’est pas fixé de règles pour les constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif.\nARTICLE 13 : ESPACES LIBRES ET PLANTATIONS\n13.1   REGLES GENERALES\n13.1.1 Les plantations existantes doivent être maintenues en bon état de conservation.\n    Cependant l’abattage d’arbres est autorisé s’il est indispensable à l’implantation des\n    constructions ou à l’établissement d’un accès.\n13.1.2 Tout arbre abattu doit être remplacé sur le terrain par un arbre à développement\n    équivalent. Cependant, les projets de constructions ne doivent pas porter atteinte aux\n    arbres remarquables identifiés au plan de zonage.\n13.1.3 Tout projet de construction neuve entraîne l’obligation de traiter au moins 25% du\n    terrain en espaces verts..\n13.1.4 Lors de tout projet de construction, les plantations d’arbres sur le domaine public\n    doivent être préservées.\n13.2   REGLES PARTICULIERES\n13.2.1 Lors de la création de jardins sur dalle au rez-de-chaussée ou en terrasse, une hauteur\n    minimum de 0,50 mètres pour l’engazonnement et de 0,70 mètre pour la plantation\n    d’arbres doit être prévue.\n13.1.1 Dans le cas où une emprise au sol jusqu’à 100% est autorisée, il n’y a pas d’obligation\n    de création d’espaces verts.\n13.1.2 Les dispositions du présent article ne sont pas applicables pour les constructions ou\n    installations nécessaires aux services publics ou d’intérêt collectif.\n13.1.3 En secteur A, les dispositions de l’article 13.1 ne sont pas applicables.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UZ3 123","ARTICLE 14 : COEFFICIENT D’OCCUPATION DU SOL (COS)\nLa constructibilité est donnée en m² de SDP par destination et par secteur, soit :\nEn secteur A :\n- logement : 10 000 m² SDP au maximum ;\n- commerce, artisanat : 1000 m² SDP au maximum\n- installation ou équipement d’intérêt collectif : 600 m² SDP au maximum\nEn secteur B :\nIl n’est pas fixé de SDP maximum autorisée.\nEn secteur C :\n-logement : 10 000 m² SDP au maximum.\nARTICLE   15 : PERFORMANCES    ENERGETIQUES    ET\nENVIRONNEMENTALES\nLa consommation énergétique des constructions nouvelles d’immeubles collectifs de\nlogements, de bureaux et les CINASPIC*, doit être inférieure de 10% à l’objectif fixé dans la\nRT 2012 (soit une performance augmentée de 10% par rapport à la RT2012).\nARTICLE  16 :  INFRASTRUCTURES    ET    RESEAUX    DE\nCOMMUNICATIONS ELECTRONIQUES\nUne construction ou une installation nouvelle, doit pouvoir être raccordée au réseau public ou\nprivé de communications électroniques. Les fourreaux de raccordement doivent être enfouis.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UZ3 124","ANNEXE A\nDEFINITIONS\n    Plan Local d’Urbanisme – Modification n°5 – Règlement –Annexe A 125","ALIGNEMENT :\nC’est la limite commune d’un fond privé avec le domaine public.\nANNEXES :\nCe sont des locaux secondaires constituant des dépendances à une construction principale.\nElles comprennent notamment :\n    • Les caves ;\n    • Les remises ;\n    • Les locaux à vélos, poussettes ;\n    • Les locaux pour ordures ménagères ;\n    • Les garages.\nARBRE :\nPar opposition à arbuste, sont considérés comme arbre dans le règlement du PLU, les arbres\nqui à l’âge adulte mesurent au moins 4 mètres de hauteur.\nBAIES :\nElles constituent des ouvertures assurant l’éclairement des pièces et offrant des vues depuis\nla façade de la construction.\nBALCON :\nPlateforme accessible située à un niveau de plancher au-dessus du niveau du sol formant\nsaillie en surplomb de celui-ci, délimité par une balustrade ou un garde-corps et permettant à\nune personne de se tenir debout à l’extérieur du bâtiment. L’emprise au sol est la projection\nverticale du volume de la construction, tous débords et surplombs inclus (les balcons de plus\nde 1,5m en saillies sont inclus dans le calcul de l’emprise au sol). Toutefois, les ornements\ntels que les éléments de modénature et les marquises sont exclus, ainsi que les débords de\ntoiture lorsqu'ils ne sont pas soutenus par des poteaux ou des encorbellements.\nBATIMENT :\nTout ouvrage durable construit au-dessus du niveau du sol, à l’intérieur duquel l’homme est\nappelé à se mouvoir et qui offre une protection au moins partielle contre les agressions des\néléments naturels extérieurs.\nBOW-WINDOW :\nBaie ou ensemble de baies superposées en saillies.\nBRISIS :\nPartie inférieure d’un versant de comble à la Mansard, au-dessous de la ligne de bris jusqu’à\nl’égout du toit.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement –Annexe A 126","COEFFICIENT D’OCCUPATION DU SOL :\nLe coefficient d'occupation du sol qui détermine la densité de construction admise est le\nrapport exprimant le nombre de mètres carrés de plancher hors œuvre nette ou le nombre de\nmètres cubes susceptibles d'être construits par mètre carré de sol.\nCONSTRUCTIONS ET INSTALLATIONS NECESSAIRES AUX SERVICES PUBLICS OU\nD’INTERET COLLECTIF (CINASPIC):\nElles recouvrent les destinations correspondant aux catégories suivantes :\n    - les locaux affectés aux services municipaux, départementaux, régionaux ou nationaux\n    qui accueillent le public ;\n    - les crèches et haltes garderies ;\n    - les établissements d’enseignement maternel, primaires et secondaire ;\n    - les établissements universitaires, y compris les locaux affectés à la recherche, et\n    d’enseignement supérieur ;\n    - les établissements pénitentiaires ;\n    - les établissements de santé : hôpitaux (y compris les locaux affectés à la recherche),\n    cliniques, centres de rééducation, résidences médicalisées… ;\n    - les établissements d’action sociale ;\n    - les résidences sociales ;\n    - les établissements culturels et les salles de spectacle aménagées de façon\n    permanentes pour y donner des concerts, spectacles de variété ou des représentations\n    d’art dramatique, lyrique ou chorégraphique ;\n    - les équipements socio-culturels ;\n    - les établissements sportifs à caractère non-commercial ;\n    - les lieux de culte ;\n    - les parcs d’exposition ;\n    - les constructions et installations techniques nécessaires au fonctionnement des\n    réseaux (transports, postes, fluides, énergie, télécommunications,…) et aux services\n    urbains (voirie, assainissement, traitement des déchets, centres cuiseurs,…) ;\n    - les locaux destinés à héberger des entreprises dans le cadre d’une politique de soutien\n    à l’emploi (hôtels d’activité, pépinières d’activité) ;\n    - les « points relais » d’intérêt collectif pour la distribution des marchandises ;\n    - les antennes relais de téléphonie mobile (se référer à l’article 6.2 des dispositions\n    générales).\nDALLE :\nLa dalle est le sol artificiel surélevé permettant des circulations séparées sur un ou plusieurs\nniveaux.\nLa partie de la Dalle* du centre d’affaires de La Défense appartenant au domaine public est\nconsidérée comme une voie ou une emprise publique.\nDOMAINE PUBLIC :\nEnsemble des biens sur lesquels les personnes publiques ont un droit de propriété et qui sont\naffectés soit à l’usage du public, soit au service public pourvu qu’en ce cas ils fassent l’objet\nd’un aménagement indispensable à l’exécution des missions de ce service public.\nCes biens sont classés de la façon suivante :\n   • domaine public mobilier et domaine public immobilier, selon la nature des biens\n    Plan Local d’Urbanisme – Modification n°5 – Règlement –Annexe A 127","   •   domaine public de l’Etat, des communes… selon la personne publique propriétaire des\n    biens\n   •   domaine public maritime, aérien… selon la situation géographique ou physique des\n    biens\n   •   domaine public naturel et domaine public artificiel.\nDROIT DE PREEMPTION URBAIN (DPU) :\nDroit qui permet à la collectivité dotée d’un POS ou d’un PLU d’acquérir par priorité une\npropriété foncière mise en vente par son propriétaire.\nEGOUT DU TOIT :\nLigne horizontale située au-dessus du dernier niveau constituant la façade, destinée à\nrecueillir les eaux pluviales en partie haute de la construction au bas du brisis ou du rampant\nde toiture.\nEMPLACEMENTS RESERVES :\nIls constituent des emprises où doivent être réalisés des voies publiques, des ouvrages\npubliques, des projets d’intérêt généraux ou des espaces verts, et éviter que les terrains\nconcernés ne soient utilisés de façon incompatible avec la destination future (article L.151-41\ndu code de l’Urbanisme). Cette réglementation constitue donc une garantie de disponibilité\nd’un bien. Leur délimitation doit être précise et leur liste ainsi que leurs localisations figurent\ndans le dossier du POS ou du PLU.\nEMPRISE AU SOL :\nL’emprise au sol est la projection verticale du volume de la construction en infrastructure et en\nsuperstructure, tous débords et surplombs inclus. Toutefois, les balcons en saillies de moins\n1,5mètres, les éléments de modénature et les marquises sont exclus, ainsi que les débords\nde toiture lorsqu'ils ne sont pas soutenus par des poteaux ou des encorbellements.\nLes terrasses de moins de 60cm de hauteur ne sont pas comptabilisées dans le calcul de\nl’emprise au sol.\nLes isolations des façades par l’extérieur ne sont pas comptabilisées dans le calcul de\nl’emprise au sol.\nNote : Dans les zones UB et UE, les infrastructures ne sont pas comptabilisées dans le calcul\nde l’emprise au sol.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement –Annexe A 128","EMPRISE PUBLIQUE :\nCette notion recouvre tous les espaces publics qui ne peuvent-être qualifiés de voies\npubliques, mais qui donnent accès directement aux terrains riverains. Les dispositions de\nl’article 6 des règlements de zones déterminent l’ordonnancement des constructions par\nrapport aux lieux publics ouvert à la circulation.\nENSEMBLE IMMOBILIER :\nGroupe de bâtiments unis entre eux par des installations ou ouvrages collectifs assurant leur\ncohésion, tels qu’aires de jeux, de stationnement, de sport, allées….\nOn distingue :\n   • les ensembles immobiliers classiques composés d’immeubles distincts ayant chacun\n    leurs fondations particulières\n   • les ensembles immobiliers complexes composés d’une masse de bâtiments groupés\n    ou même apparemment distincts mais construits sur une seule dalle porteuse et\n    disposant généralement d’un sous-sol commun.\nEPANNELAGE :\nForme simplifiée des masses bâties constitutives d’un tissu urbain.\nESPACE BOISE CLASSE (EBC) :\nEn application des articles L.113-1 et 2 du Code de l’Urbanisme, le POS ou le PLU peut classer\ncomme espaces boisés, les bois, forêts, parc à conserver, à protéger ou à créer, qu’ils soient\nsoumis ou non au régime forestier, enclos ou non. Ce classement peut s’appliquer également\nà des arbres isolés, des haies, des plantations d’alignement. Ce classement interdit tout\nchangement d’affectation, et tout mode d’occupation du sol de nature à compromettre la\nconservation, la protection ou la création des boisements.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement –Annexe A 129","ESPACE LIBRE :\nIl constitue l’espace d’un terrain non occupé par le bâti.\nESPACES VERTS :\nEspaces extérieurs de pleine terre permettant le libre écoulement des eaux. La surface de ces\nespaces doit recevoir des plantations, herbacées, arbustives ou arborées. Sont exclus des\nespaces verts les espaces de circulation, de stationnement et de manoeuvre, les bandes de\nroulement mêmes s’ils sont traités avec du végétal de type dalles engazonables, evergreen,…\nEXTENSION :\nAgrandissement d’un bâtiment existant, d’une surface ou d’un volume inférieur à celui-ci.\nFAÇADE – NU DE FAÇADE :\nUne façade est une paroi verticale d’un bâtiment ou d’une construction, comportant des baies\nprincipales ou secondaires (compris les parements extérieurs, et éléments de composition tels\nsaillies, balcons, modénatures, etc.).\nLe nu de la façade se définit par le plan vertical de façade le plus rapproché de la limite\nséparative ou de l’alignement compté à partir du revêtement extérieur fini, hormis éléments de\ncomposition.\nFAÇADE PRINCIPALE :\nC’est la face avant entière d’un bâtiment ou d’une construction, qui peut être vu d’une seule\nfois depuis le domaine public ou « façade sur rue ». Elle comporte notamment des baies\nprincipales et/ou secondaires.\nFRICHE INDUSTRIELLE :\nTerrain sur lequel subsiste une installation industrielle à l’abandon.\nFRICHE URBAINE :\nTerrain laissé à l’abandon ou utilisé à titre transitoire, en milieu urbain, dans l’attente d’une\nnouvelle occupation.\nILOT DE PROPRIETE :\nPortion de territoire d’un seul tenant appartenant à un seul propriétaire et possédant une\ncertaine individualité en raison de l’aménagement donné à la propriété. Un ensemble\nimmobilier d’un seul tenant se définit comme des unités foncières contiguës appartenant à un\nseul vendeur.\nUn îlot de propriété a le même sens que le mot parcelle cadastrale.\nL’unité foncière comprend donc des îlots de propriétés ayant la particularité d’être contiguës.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement –Annexe A 130","JOURS DE SOUFFRANCE :\nOuvertures en façades ou pignon apportant de la lumière naturelle dans une pièce sans que\nde l’intérieur il soit possible de voir à l’extérieur (articles 675 à 677 du Code Civil).\nLes pavés de verre scellés et non ouvrants et non transparents ne constitue pas des jours de\nsouffrance.\nLOI DE 1977 RELATIVE AU RECOURS A UN ARCHITECTE :\nSelon la loi n° 77-02 du 03 janvier 1977 sur l’architecture, les demandes de permis de\nconstruire ou autorisations administratives tenant lieu ne peuvent être instruites que si la\npersonne qui désire entreprendre des travaux a fait appel à un architecte pour établir le projet\narchitectural faisant l’objet de la demande de permis (Article L.421-2 du Code de l’Urbanisme).\nSe substitue ainsi au contrôle de « l’aspect extérieur » des constructions un véritable contrôle\nde l’esthétique et de la technique architecturale. Lorsque l’intervention de l’architecte est\nobligatoire, toute demande de permis de construire non revêtue de sa signature entraîne son\nrejet.\nLe projet architectural définit, par des plans et des documents écrits, l’implantation des\nbâtiments, leur composition, leur organisation, et l’expression de leur volume, ainsi que le\nchoix des matériaux et des couleurs. Il précise par des documents graphiques ou\nphotographiques l’insertion dans l’environnement, et l’impact visuel des bâtiments, ainsi que\nle traitement de leurs accès et de leurs abords.\nL’article 4 de la loi de 1977 précise qu’il existe des dispenses à ce recours obligatoire,\nnotamment pour les constructions de faible importance (moins de 170 m² de surface hors\nœuvre nette pour une habitation, la surface à construire se calculant indépendamment des\nconstructions déjà existantes sur le terrain), les aménagements intérieurs de bâtiments\nexistants, les vitrines et les espaces intérieurs des constructions commerciales, et les travaux\nsoumis à la déclaration de travaux.\nLOGGIAS :\nEspace ouvert formant un balcon encastré dans une façade. Ils sont inscrits dans le volume\nde la construction et sont compris dans l’emprise au sol.\nLUCARNE :\nFenêtre en saillie sur le versant d'une toiture, donnant du jour à un espace sous le comble,\nelle comporte deux jouées recouvertes par une petite charpente.\nMARGE DE RECULEMENT :\nRetrait imposé aux constructions à édifier en bordure d’une voie publique.\nSa largeur est fixée à partir de l’axe de la voie ou de l’alignement actuel ou futur, si un\nélargissement ou un emplacement réservé figure au document graphique.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement –Annexe A 131","PIECES PRINCIPALES ET SECONDAIRES (OU DE SERVICE) :\nLes pièces principales sont destinées au séjour ou au sommeil. Dans le cas de bureaux, la\npièce principale est celle où l’activité humaine est exercée (article R 111-1 du Code de la\nConstruction et de l’Habitation).\nLes pièces secondaires sont :\n   • Cuisine ;\n   • Salle de bain ;\n   • Wc ;\n   • Buanderies ;\n   • Débarras ;\n   • Dégagements ….\nPIGNON :\nFaçade latérale d’un bâtiment ou d’une construction, ne comportant pas de baie principale.\nPROSPECT :\nRègles déterminant la distance minimale d’implantation d’une construction par rapport aux\nalignements, emprises publiques, mitoyens et limites séparatives (liées à la hauteur du\nbâtiment).\nRAMPANT :\nPartie de toiture ou d’un ensemble disposée en pente.\nREHABILITATION :\nRemise aux normes d’habitabilité actuelles d’un bâtiment ancien.\n  • réhabilitation légère : installation d’un équipement sanitaire sans travaux sur les parties\n    communes de l’immeuble, ni installation du chauffage central.\n  • réhabilitation moyenne : en plus de l’équipement sanitaire, travaux plus complets sur\n    les parties privatives de l’immeuble, c’est-à-dire l’intérieur du logement (chauffage\n    central ou électrique). Des travaux légers sont entrepris sur les parties communes\n    (peinture des cages d’escalier et ravalement de la façade, sans reprise de toiture).\n  • réhabilitation lourde : travaux précédemment cités accompagnés d’une redistribution\n    des pièces dans le logement ou redistribution des logements par étages. Intervention\n    plus complète sur les parties communes qui comprennent la réfection des toitures. Les\n    travaux toucheront le gros œuvre sans porter atteinte à l’équilibre existant de\n    l’immeuble, avec des reprises de maçonnerie et de charpente, de planchers\n    quelquefois.\n  • réhabilitation exceptionnelle : intervention sur le gros œuvre pouvant aller jusqu’à\n    reprendre la structure porteuse de l’immeuble, lorsque sa solidité est atteinte en\n    profondeur.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement –Annexe A 132","RENOVATION :\nDestruction et reconstruction d’immeubles à la même place.\n   • rénovation-amélioration : destinée à doter un bâtiment des normes actuelles de confort\n   • renovation-construction : implique la reprise totale ou importante des structures\n    intérieures de l’immeuble, avec parfois une addition de construction.\nRESIDENCES :\nLes résidences sont :\n   - d’une part des immeubles collectifs, locatifs accueillant des étudiants, des personnes\n    âgées, des travailleurs. Elles sont composées de chambres individuelles ou de petits\n    appartements et de services,\n   - et d’autre part des résidences de tourismes, constituée d'un ensemble homogène de\n    chambres ou d'appartements meublés, disposés en unités collectives ou\n    pavillonnaires, offert en location pour une occupation à la journée, à la semaine ou au\n    mois à une clientèle touristique qui n'y élit pas domicile. Elle est dotée d'un minimum\n    d'équipements et de services communs.\nRESTAURATION :\nRemise en état d’un bâtiment (ou d’un ouvrage) dans son état originel du fait de son intérêt\narchitectural ou historique marqué.\nSAILLIE :\nAvancée d’un élément de la construction par rapport au nu de la façade et située au dessus\ndu niveau du sol en surplomb de celui-ci (par exemple : oriels, balcons, etc..), à l’exclusion de\ntoute modénature (corniche, avancée de toiture, etc.).\nSERVICE PUBLIC :\nUn service public est une activité exercée directement par l'autorité publique.\nPour les règles applicables, voir définition CINASPIC.\nSURFACE DE PLANCHER (SDP) :\nSelon l’ordonnance n°2011-1539 du 16 novembre 2011 relative à la définition des surfaces de\nplancher prises en compte dans le droit de l’urbanisme modifiant l’article L.111-14 et R112-2\ndu code de l’urbanisme :\nLa surface de plancher de la construction s’entend par la somme des surfaces de plancher de\nchaque niveau clos et couvert, calculé à partir du nu intérieur des façades du bâtiment, après\nles déductions prévues à l’article R112-2.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement –Annexe A 133","SURFACE D’INFRASTRUCTURE ET DE SUPERSTRUCTURE :\nPour toutes les surfaces définies dans ce chapitre, il est possible de décomposer la surface\ntotale en partie située au dessus du niveau du sol (superstructure) et partie située en dessous\ndu niveau du sol (infrastructure).\nSURFACE UTILE :\nElle est égale à la surface habitable du logement, augmentée de la moitié de la surface des\nannexes, hormis les garages (cf. définition des annexes).\nTAXE D’AMENAGEMENT :\nElle comprend une partie communale, une partie régionale et une partie départementale\n(articles L331-1 à 5 du Code de l’Urbanisme).\nTERRASSE :\nPlateforme accessible non close reposant sur infrastructure ou superstructure.\nTERRASSE TROPEZIENNE :\nTerrasse aménagée dans le rampant du toit, permettant par un élément de façade en retrait\nde l’aplomb de la façade principale, l’aménagement d’un niveau dans le volume de toiture.\nTERRASSON :\nPartie peu inclinée d’un comble à la Mansard, c’est le plan supérieur entre la ligne de faîtage\net la ligne de bris du toit.\nTOITURE TERRASSE :\nCouverture totale du dernier niveau de tout ou partie d’un bâtiment, traitée en plateforme non\naccessible et découverte.\nUNITE FONCIERE :\nElle est constituée de l’ensemble des parcelles cadastrales contiguës qui appartiennent au\nmême propriétaire ou à la même indivision. L’unité foncière est la seule notion retenue pour\nl’application du rè
