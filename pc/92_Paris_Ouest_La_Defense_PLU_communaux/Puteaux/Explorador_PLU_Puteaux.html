<!doctype html>

<title>Explorador PLU de Puteaux</title>
<style>

:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1d1f22; --muted:#666b73; --line:#e3e1db; --accent:#1f5f8b; --accent-ink:#ffffff;
  --hl:#fff1a8; --chip:#eef1f4; --sum:#eef6ee; --sum-line:#b9d9bb; --code:#1f5f8b; --warn:#fff6e5;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15171a; --panel:#1d2024; --ink:#e7e7e4; --muted:#9aa0a8; --line:#30343a; --accent:#6fb3e0; --accent-ink:#0d1114;
  --hl:#5b4f12; --chip:#262a30; --sum:#1c2a1e; --sum-line:#35573a; --code:#8cc6ee; --warn:#2c2516;
}}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1d2024; --ink:#e7e7e4; --muted:#9aa0a8; --line:#30343a; --accent:#6fb3e0; --accent-ink:#0d1114;
  --hl:#5b4f12; --chip:#262a30; --sum:#1c2a1e; --sum-line:#35573a; --code:#8cc6ee; --warn:#2c2516;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px}
nav.tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto}
nav.tabs a{padding:8px 12px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
nav.tabs a.on{color:var(--ink);border-color:var(--accent);font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:5px 10px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wrap{display:flex;min-height:calc(100vh - 100px)}
aside{width:330px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow:auto;height:calc(100vh - 100px);position:sticky;top:100px}
main{flex:1;min-width:0;padding:18px 28px 80px;max-width:980px}
.filters{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line);cursor:pointer;user-select:none}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tree{padding:6px 0 30px}
.tree .n{display:flex;gap:6px;align-items:baseline;padding:3px 12px;cursor:pointer;font-size:13.5px;line-height:1.35}
.tree .n:hover{background:var(--chip)}
.tree .n.cur{background:var(--chip);box-shadow:inset 3px 0 0 var(--accent)}
.tree .n .cd{color:var(--code);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
.tree .n .pg{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.tree .l0{font-weight:700;margin-top:8px;text-transform:uppercase;font-size:12px;letter-spacing:.03em}
.tree .l1{font-weight:600}
.tree .l2{padding-left:24px}
.tree .l3{padding-left:40px;color:var(--ink)}
.tree .tg{cursor:pointer;color:var(--muted);width:12px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;transform:translateY(-1px)}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.crumb a{text-decoration:none}
h1.st{font-size:22px;margin:0 0 4px;line-height:1.3}
h1.st .cd{color:var(--code)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 14px;font-size:13px;color:var(--muted)}
.sum{background:var(--sum);border:1px solid var(--sum-line);border-radius:10px;padding:10px 14px;margin:0 0 16px}
.sum b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:2px}
.txt p{margin:0 0 10px}
.txt h4{margin:18px 0 8px;font-size:15px}
.txt ul{margin:0 0 10px;padding-left:22px}
.txt li{margin:0 0 5px}
.txt ul.sub{margin:5px 0 5px;list-style:circle}
.txt li.nb{list-style:none}
pre.tbl{font:12px/1.35 ui-monospace,Consolas,monospace;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre}
.ref{font-style:italic;color:var(--muted)}
a.xr{text-decoration:none;border-bottom:1px dotted var(--accent);white-space:nowrap}
a.fg{font-size:12px;background:var(--chip);border-radius:5px;padding:0 5px;text-decoration:none;font-style:normal}
.df{border-bottom:1px dashed var(--muted);cursor:help}
sup{font-size:9px;color:var(--muted)}
mark{background:var(--hl);color:inherit;border-radius:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.box h3{margin:0 0 8px;font-size:15px}
.sub-list a{display:block;padding:4px 0;text-decoration:none}
.sub-list .cd{color:var(--code);margin-right:6px}
.eq a{margin-right:8px}
.notes textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px;font:inherit}
.results .r{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.results .r:hover{background:var(--chip)}
.results .r .cd{color:var(--code);font-weight:600;margin-right:6px}
.results .r .sn{color:var(--muted);font-size:13.5px;margin-top:3px}
.pop{position:absolute;z-index:50;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px 14px;font-size:13.5px;max-height:320px;overflow:auto}
.pop h5{margin:0 0 6px;font-size:14px}
table.cf{width:100%;border-collapse:collapse;font-size:14px}
table.cf td,table.cf th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.cf th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
table.cf td.v{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ob .reg{font-size:12.5px;color:var(--muted);margin:-4px 0 8px}
.ob a{display:block;text-decoration:none;padding:3px 0}
.ob a .cd{color:var(--code);font-weight:600;margin-right:6px;font-size:13px}
.ob a span.w{color:var(--ink)}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.figs .fc{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.figs .fc img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover;object-position:top;background:#fff}
.figs .fc div{padding:8px 10px;font-size:13px}
.figview img{width:100%;max-width:760px;display:block;margin:0 auto 12px;border:1px solid var(--line);border-radius:6px;background:#fff}
.gl .gi{padding:12px 0;border-bottom:1px solid var(--line)}
.gl .gi h3{margin:0 0 4px;font-size:16px}
.gl .refs{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.az{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.warn{background:var(--warn);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.star{font-size:18px;line-height:1;border:none;background:none;padding:0 4px;color:var(--muted)}
.star.on{color:#e0a400}
.menu{display:none}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
@media (max-width:820px){
  aside{position:fixed;left:0;top:0;height:100vh;z-index:40;transform:translateX(-100%);transition:transform .2s;width:86vw;max-width:360px;box-shadow:0 0 30px rgba(0,0,0,.25)}
  aside.open{transform:none}
  .menu{display:inline-block}
  main{padding:14px 16px 80px}
  .brand small{display:none}
}

.pj-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 18px}
.pj-tabs a{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pj-tabs a b{display:block;font-size:15.5px;margin-bottom:2px}
.pj-tabs a span{font-size:12.5px;color:var(--muted)}
.pj-tabs a.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.pj-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pj-cols ul{margin:0;padding-left:18px}.pj-cols li{margin:3px 0;font-size:14px}
.pj-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.pj-prog{flex:1;min-width:160px;height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.pj-prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.pj-bar button{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.pj-g h3{margin:0 0 6px;font-size:15px}
.pj-a{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.pj-a:first-of-type{border-top:0}
.pj-a input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}
.pj-a a{text-decoration:none;color:var(--ink)}
.pj-a .cd{color:var(--code);font-weight:600;margin-right:6px;font-size:13px}
.pj-a .tt{color:var(--muted);font-size:12.5px;display:block}
.pj-a.ok a{opacity:.55}
@media (max-width:760px){.pj-cols{grid-template-columns:1fr}}
@media print{.pj-tabs,.pj-bar button{display:none!important}.pj-a input{accent-color:#000}}
@media print{header,aside,.notes,.no-print{display:none!important} main{max-width:none;padding:0}}

.pg{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:0 0 14px;overflow:hidden}
.pg .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;background:var(--chip);font-size:12.5px;color:var(--muted)}
.pg pre{margin:0;padding:12px 14px;font:13px/1.5 ui-monospace,"Cascadia Mono",Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.pg pre .hh{background:var(--hl);font-weight:700}
.zsel{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.th-l{display:flex;flex-wrap:wrap;gap:6px}
.th-l .chip{font-size:12.5px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px}
.kv b{color:var(--muted);font-weight:600}
.pj-a .zn{font-size:11px;background:var(--chip);border-radius:5px;padding:0 5px;margin-left:6px;color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;font-style:italic}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btns a.b{display:inline-block;border:1px solid var(--line);border-radius:7px;padding:5px 10px;text-decoration:none;font-size:13.5px;background:var(--panel)}
.btns a.b.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
</style>

n":82,"s":"toc","a":0,"z":"UL","th":[]},{"t":"CHAPITRE 6 : ZONE UPM1","l":1,"p":82,"q":87,"n":87,"s":"toc","a":0,"z":"UPM1","th":[]},{"t":"CHAPITRE 7 : ZONE UPM2","l":1,"p":87,"q":93,"n":93,"s":"toc","a":0,"z":"UPM2","th":[]},{"t":"CHAPITRE 8 : ZONE UPM3","l":1,"p":93,"q":104,"n":104,"s":"toc","a":0,"z":"UPM3","th":[]},{"t":"CHAPITRE 9 : ZONE UPM4","l":1,"p":104,"q":112,"n":112,"s":"toc","a":0,"z":"UPM4","th":[]},{"t":"CHAPITRE 12 : ZONE UZ3","l":1,"p":112,"q":412,"n":126,"s":"toc","a":0,"z":"UZ3","th":[]},{"t":"ANNEXES","l":2,"p":126,"q":126,"n":126,"s":"toc","a":0,"z":"UZ3","th":[]},{"t":"A – DEFINITIONS","l":2,"p":126,"q":126,"n":126,"s":"toc","a":1,"z":"UZ3","th":["def"]},{"t":"B – EXTRAITS DU CODE DE L’URBANISME ET DU CODE CIVIL…136 C – NOMENCLATURE DES ACTIVITES","l":2,"p":126,"q":126,"n":126,"s":"toc","a":1,"z":"UZ3","th":["gen"]},{"t":"D – DOCUMENTS GRAPHIQUES DU REGLEMENT","l":2,"p":126,"q":126,"n":126,"s":"toc","a":1,"z":"UZ3","th":[]},{"t":"E – LISTE DES EMPLACEMENTS RESERVES","l":2,"p":126,"q":126,"n":126,"s":"toc","a":1,"z":"UZ3","th":["er"]},{"t":"F – ELEMENTS REPERTORIES AU TITRE DES ARTICLES L.151-19 ET 23 DU CODE DE L’URBANISME","l":2,"p":126,"q":126,"n":126,"s":"toc","a":1,"z":"UZ3","th":["patr"]},{"t":"G – LISTE DES ESSENCES A FAIBLE POTENTIEL ALLERGISANT.204 H – IDENTIFICATION DU PATRIMOINE BATI","l":2,"p":126,"q":412,"n":126,"s":"toc","a":1,"z":"UZ3","th":["patr"]},{"t":"Plan Local d’Urbanisme – Modification n°5 - Règlement","l":3,"p":126,"q":412,"n":412,"s":"toc","a":0,"z":"UZ3","th":[]}],"zones":["UA","UB","UD","UE","UL","UPM1","UPM2","UPM3","UPM4","UZ3"],"pages":["Modification n°5 du PLU\n   4. REGLEMENT","    Ville de Puteaux\nSOMMAIRE\nTITRE 1 : DISPOSITIONS GENERALES………………………………….3\nTITRE 2 : DISPOSITIONS APPLICABLES AUX ZONES URBAINES…12\nCHAPITRE 1 : ZONE UA……………………………………………………13\nCHAPITRE 2 : ZONE UD……………………………………………………36\nCHAPITRE 3 : ZONE UE……………………………………………………52\nCHAPITRE 4 : ZONE UB……………………………………………………63\nCHAPITRE 5 : ZONE UL……………………………………………………70\nCHAPITRE 6 : ZONE UPM1………………………………………………..82\nCHAPITRE 7 : ZONE UPM2………………………………………………..87\nCHAPITRE 8 : ZONE UPM3……………………………………………..…93\nCHAPITRE 9 : ZONE UPM4………………………………………………104\nCHAPITRE 12 : ZONE UZ3……………………….………………………112\nANNEXES :\nA – DEFINITIONS…………………………………………………………..125\nB – EXTRAITS DU CODE DE L’URBANISME ET DU CODE CIVIL…136\nC – NOMENCLATURE DES ACTIVITES………………………………..145\nD – DOCUMENTS GRAPHIQUES DU REGLEMENT…...……...……..168\nE – LISTE DES EMPLACEMENTS RESERVES………………………. 174\nF – ELEMENTS REPERTORIES AU TITRE DES ARTICLES L.151-19\n    ET 23 DU CODE DE L’URBANISME……………..……….…….... 198\nG – LISTE DES ESSENCES A FAIBLE POTENTIEL ALLERGISANT.204\nH – IDENTIFICATION DU PATRIMOINE BATI…………………………206\n    Plan Local d’Urbanisme – Modification n°5 - Règlement   2","TITRE 1 : DISPOSITIONS GENERALES\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Dispositions générales   3","Ce règlement est établi conformément aux dispositions du Code de l’Urbanisme.\nARTICLE 1 : CHAMPS D’APPLICATION\nLe présent règlement s’applique à la totalité du territoire de la commune de Puteaux, incluant\nles zones situées au sein du périmètre d’opération d’intérêt national (POIN) du quartier\nd’affaires de la Défense (décret n° 2010-744 du 2 juillet 2010) et des Zones d’Aménagement\nConcerté (ZAC).\nARTICLE 2 : PORTEE RESPECTIVE DU REGLEMENT A L’EGARD\nD’AUTRES LEGISLATIONS RELATIVES A L’OCCUPATION DES\nSOLS\n2.1    DISPOSITIONS DIVERSES - RAPPELS\n2.1.1   Les demandes de défrichements sont irrecevables dans les espaces boisés classés.\n    Au titre des articles L.113-1 et L113-2 du Code de l’Urbanisme, dans les espaces\n    boisés classés, figurant comme tels aux documents graphiques, les coupes et\n    abattages d’arbres sont soumis à autorisation.\n2.1.2 Les défrichements sont soumis à autorisation, au titre du Code Forestier, dans les\n    espaces boisés non classés de plus de 0,5 hectares.\n2.1.3 L’édification des clôtures est soumise à déclaration préalable par la délibération du 6\n    octobre 2007.\n2.1.4 Sont soumis à autorisation, sous réserve des dispositions des articles L.422-1 à L.422-\n    5 du Code de l’Urbanisme, les travaux exécutés sur les constructions existantes,\n    lorsqu’ils ont pour effet d’en changer la destination, de modifier leur aspect extérieur\n    ou leur volume (extension, surélévation) ou de créer des niveaux supplémentaires\n    (surface de plancher nouvelle à l’intérieur du volume existant), en application de l’article\n    L.421-1 du Code de l’Urbanisme.\n2.1.5 Les démolitions sont soumises à permis de démolir, par la délibération du 6 octobre\n    2007.\n2.1.6 Tous travaux ayant pour effet de détruire un élément de paysage et de patrimoine\n    identifié par le Plan Local d’Urbanisme en application des articles L.151-19 et 23 et non\n    soumis à un régime d’autorisation doivent faire l’objet d’une autorisation préalable.\n2.1.7 La reconstruction à l'identique d'un bâtiment détruit ou démoli depuis moins de dix ans\n    est autorisée (article L.111-15 du Code de l’Urbanisme), dans le respect des\n    alignements et marges de reculement inscrits au Plan Local d’Urbanisme.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Dispositions générales   4","2.2    DISPOSITIONS PARTICULIERES\n2.2.1 Le règlement du PLU définit les règles d’occupation du sol.\n    Toutefois, s’appliquent en plus et indépendamment du présent règlement les articles\n    du Code de l’Urbanisme permettant de refuser le permis de construire ou de ne\n    l’accorder que sous réserve de l’observation de prescriptions spéciales :\n    Si la construction :\n    - est de nature à porter atteinte à la salubrité ou à la sécurité publique (art. R.111-\n    2).\n    - compromet la conversion ou la mise en valeur d’un site ou de vestiges\n    archéologiques (art. R.111-4).\n    - est de nature à avoir des conséquences dommageables pour l’environnement,\n    dans les préoccupations de la loi n°76-628 du 10 juillet 1976 (art. R.111-15).\n    - est de nature à porter atteinte au caractère ou à l’intérêt des lieux avoisinants, au\n    site, aux paysages naturels et urbains, ainsi qu’à la conservation des perspectives\n    monumentales (art. R.111-21).\n2.2.2 Par ailleurs, les dispositions du présent règlement s’appliquent sans préjudice des\n    prescriptions prises au titre des législations spécifiques suivantes :\n    • Les servitudes d’utilité publique instituant une limitation administrative au droit de\n    propriété, mentionnées en annexe du dossier de PLU.\n2.2.3 Les dispositions du Code de l’Urbanisme et autres législations spécifiques concernant\n    notamment :\n    • Le Droit de Préemption Urbain (DPU art. L.211-1).\n    • Le Droit de Préemption Urbain élargi (art. L.211-4).\n    • Le droit de Préemption sur les fonds artisanaux, les fonds et baux commerciaux\n    (art. L.214-1 et s.).\n    • Les Zones d’Aménagement Différé (ZAD art. L.212-1).\n    • Les lotissements (art. L.442-1 s).\n    • Les périmètres de Déclaration d’Utilité Publique (DUP compris les ZAC).\n    • Les projets d’intérêt général.\n2.2.4 Aux termes de l’article L.424-1 du Code de l’Urbanisme, il peut être décidé de surseoir\n    à statuer sur toute demande d’autorisation concernant les travaux, constructions ou\n    installation dans les cas suivants :\n    • A partir de la date d’ouverture préalable ou de la déclaration d’utilité publique d’une\n    opération (art. L.424-1).\n    • Lorsqu’un projet de travaux publics a été pris en considération par l’autorité\n    compétente (art. L.424-1).\n    • Lorsqu’une opération d’aménagement a été prise en compte par le Conseil\n    Municipal (art. L.424-1).\n    • A compter de la délibération prescrivant l’élaboration d’un PLU (art. L.153-11).\n    • A compter de la publication de l’acte créant une ZAC.\n2.2.5 (Loi du 27 septembre 1941, Article 14). Lorsque, par suite des travaux ou d’un fait\n    quelconque, des monuments, des ruines, substructions, mosaïques, éléments de\n    canalisation antique, vestiges d’habitation ou sépultures anciennes, des inscriptions ou\n    généralement des objets pouvant intéresser la préhistoire, l’histoire, l’art, l’archéologie\n    ou la numismatique sont mis à jour, l’inventeur de ces vestiges ou objets et le\n    propriétaire de l’immeuble où ils ont été découverts sont tenus d’en faire la déclaration\n    immédiate au Maire de la Commune, qui doit la transmettre sans délai au Préfet.\n    Les vestiges découverts ne doivent en aucun cas être aliénés ou détruits avant examen\n    par un spécialiste mandaté par le Conservateur Régional (Direction Régionale des\n    Affaires Culturelles Service Régional de l’Archéologie).\n    Tout contrevenant sera passible des peines prévues à l’article 322.2 du Code Pénal).\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Dispositions générales   5","2.2.6 Conformément à l’article L.151-33 du Code de l’Urbanisme, lorsque le bénéficiaire du\n    permis ou de la décision de non-opposition à une déclaration préalable ne peut pas\n    satisfaire aux obligations résultant du troisième alinéa du présent article, il peut être\n    tenu quitte de ces obligations en justifiant, pour les places qu'il ne peut réaliser lui-\n    même, soit de l'obtention d'une concession à long terme dans un parc public de\n    stationnement existant ou en cours de réalisation et situé à proximité de l'opération,\n    soit de l'acquisition ou de la concession de places dans un parc privé de stationnement\n    répondant aux mêmes conditions.\n2.2.7 Les bénéficiaires de permis de construire seront soumis aux taxes et participations\n    prévues par le Code de l’Urbanisme et participent ainsi au financement des\n    équipements publics.\n2.2.8 Dans les secteurs soumis à des nuisances sonores, le long des voies indiquées au\n    plan de classement acoustique des infrastructures terrestres , annexe 6D, la\n    construction, l’extension et la transformation des locaux à usage notamment\n    d’habitation, des établissements scolaires, sanitaires et hospitaliers devront répondre\n    aux normes concernant l’isolement acoustique des bâtiments contre le bruit de l’espace\n    extérieur. Les mesures doivent être prises conformément aux dispositions de la loi N°\n    92-1444 du 31 décembre 1992, et à l’arrêté préfectoral N° 2000/159 du 5 juin 2000\n    portant classement des infrastructures de transports terrestres.\n2.2.9 Dans l’hypothèse de la construction de niveaux inférieurs au terrain naturel (cave,\n    parkings, etc.), et/ou dans celle de procéder à des excavations, l’attention du\n    pétitionnaire est attirée sur le fait que ces travaux sont de nature à modifier les\n    écoulements superficiels et souterrains et d’entraîner, pour les futurs occupants, un\n    risque de nuisances lié aux phénomènes hydrologiques. Il doit vérifier aussi que des\n    dispositions sont prisent en fonction des sous pressions dues à la montée de la nappe\n    phréatique.\n2.2.10 Dans les secteurs soumis au Plan de Prévention des Risques d’Inondation liés au\n    débordement de la Seine dans les Hauts de Seine, approuvé par arrêté préfectoral du\n    11 juillet 2022, les constructions sont soumises à des mesures d’interdiction, des\n    prescriptions et des recommandations destinées à renforcer la sécurité des personnes,\n    à limiter les dommages aux biens et activités existants, à éviter un accroissement des\n    dommages dans le futur et à assurer le libre écoulement des eaux et la conservation\n    des champs d’inondation. Ce Plan vaut servitude d’utilité publique dont les règles\n    s’imposent et s’appliquent concurremment à celles du présent document. A ce titre, le\n    PPRI est annexé au PLU conformément à l’article R.126-1 du Code de l’Urbanisme.\n    En cas de rédaction différente du règlement du PPRI et de celui du P.L.U., il sera fait\n    application de la règle la plus restrictive.\n2.2.11 Dans le périmètre de risques lié à d’anciennes carrières ayant valeur de Plan de\n    Prévention du Risque (de Mouvement de Terrain), approuvé par arrêté préfectoral du\n    7 août 1985, tout projet d’occupation ou d’utilisation du sol doit faire l’objet d’un avis de\n    l’Inspection Générales des Carrières.\n2.2.12 Dans les zones urbaines, des secteurs sont délimitées au Plan de zonage, dans\n    lesquels les programmes de logements neufs, à usage d’habitation, doivent comporter\n    une proportion de logements d'une taille minimale fixé à 65% de T3 et +, en nombre\n    de logements, conformément à l’article L.151-14 du code de l’urbanisme. Le\n    pourcentage de ce nombre de logements sera arrondi à l’unité supérieure.\n    En cas de réhabilitation, démolition-reconstruction ou de rénovation de constructions\n    existantes, ne respectant pas cette règle, le nombre de logements de taille inférieur à\n    T3 ne doit pas augmenter et le nombre de logements de T3 et + ne doit pas diminuer.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Dispositions générales   6","    Cette possibilité s’applique lorsque les travaux ont pour but d’améliorer le confort et la\n    mise aux normes des logements.\n    Les règles ne s’appliquent pas aux résidences étudiantes, aux résidences pour les\n    personnes âgées et aux foyers de travailleur, aux résidences de tourisme.\nARTICLE 3 : DIVISION DU TERRITOIRE EN ZONES\n    Le territoire couvert par le présent PLU est divisé en zones urbaines (U). A chacune\n    de ces zones, s’appliquent des règles exprimées au Titre 2, dont les délimitations sont\n    reportées au document graphique principal constituant la pièce dénommée « Plan de\n    zonage » du dossier.\n    Les zones prévues par le PLU sont les suivantes :\n    • UA : Zone urbaine générale à vocation principale d’habitat, comportant des\n    secteurs UAa, UAb, UAc et UAd.\n    • UD : Zone d’habitat peu dense.\n    • UE : Zone de la Défense, comportant deux secteurs UEa et UEb.\n    • UB : Zone de l’Axe historique Paris-La Défense, comportant deux secteurs UBa et\n    UBb.\n    • UPM : Zones de Plan Masse (4 zones).\n    • UZ : Zones de projets (1 zone)\n    • UL : Zone à vocation principales d’activités éducatives, culturelles, sportives et de\n    loisirs, comportant deux secteurs ULa et ULf.\n    Ce document graphique fait en outre apparaître s’il en existe :\n    • Les espaces boisés à conserver ou à créer, classés en application des articles\n    L.113-1 et 2 du Code de l’Urbanisme.\n    • Les emplacements réservés pour la réalisation d’équipements et d’ouvrages\n    publics pour lesquels s’appliquent les dispositions de l’article L.433-1 s du Code de\n    l’Urbanisme.\n    • Le périmètre d’Opération d’Intérêt National du quartier d’affaires de la Défense\n    (Décret n°2010-744 du 2 juillet 2010).\n    • Les périmètres de protection de 500 m des édifices classés ou inscrit à l’inventaire\n    général des Monuments Historiques (MH).\n    A chacune des zones urbaines, s’appliquent les dispositions figurant au titre 2 du\n    présent règlement. Le caractère et la vocation de chacune de ces zones sont définis\n    en tête du chapitre qui lui correspond. Chaque chapitre comporte un corps de règles\n    en seize articles numérotés de 1 à 16. L’application de l’article 5 et du COS (article 14)\n    ont été abrogés par la loi ALUR. Toutefois, pour les ZAC, l’article 14 mentionne la\n    surface de plancher autorisée.\n    •   ARTICLE 1 : Occupations et utilisations du sol interdites.\n    •   ARTICLE 2 : Occupations et utilisations du sol soumises à des conditions\n    particulières.\n    •   ARTICLE 3 : Accès et voirie.\n    •   ARTICLE 4 : Desserte par les réseaux.\n    •   ARTICLE 5 : Caractéristiques des terrains.\n    •   ARTICLE 6 : Implantation des constructions par rapport aux voies et emprises\n    publiques.\n    •   ARTICLE 7 : Implantation des constructions par rapport aux limites séparatives.\n    •   ARTICLE 8 : Implantation des constructions les unes par rapport aux autres sur\n    une même propriété.\n    •   ARTICLE 9 : Emprise au sol.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Dispositions générales   7","    •   ARTICLE 10 : Hauteur maximale des constructions.\n    •   ARTICLE 11 : Aspect extérieur.\n    •   ARTICLE 12 : Stationnement.\n    •   ARTICLE 13 : Espaces libres et plantations.\n    •   ARTICLE 14 : Coefficient d’Occupation du Sol (COS).\n    •   ARTICLE 15 : Performances énergétiques et environnementales.\n    •   ARTICLE 16 : Infrastructures et réseaux de communications électroniques.\n    Hors zones UPM et UZ, le numéro de l’article est toujours précédé du sigle de la zone\n    où il s’applique.\nARTICLE 4 : ADAPTATIONS MINEURES ET DEROGATIONS\n4.1   Les dispositions des articles 3 à 13 des règlements de chacune des zones peuvent\n    faire l’objet d’adaptations mineures, « rendues nécessaires par la nature du sol, la\n    configuration de la parcelle ou le caractère des constructions avoisinantes » (article\n    L.152-3 du Code de l’Urbanisme).\n4.2   Les dispositions des articles 3 à 13 des règlements de chacune des zones peuvent\n    faire l’objet des dérogations prévues aux articles L.152-4 et L.152-6 du Code de\n    l’Urbanisme.\n4.3   Lorsqu’un immeuble bâti existant n’est pas conforme aux règles édictées par le\n    règlement applicable dans la zone, le permis de construire ne peut être accordé que\n    pour des travaux qui ont pour objet d’améliorer la conformité de cet immeuble avec\n    lesdites règles ou qui sont sans effet à leur égard.\n4.4   Les dispositions des articles 6 peuvent faire l’objet des dérogations prévues à l’article\n    L.152-5 du Code de l’urbanisme sous condition d’améliorer l’isolation thermique des\n    constructions.\nARTICLE 5 : CONSERVATION DU PATRIMOINE ARCHITECTURAL ET\nCULTUREL\n5.1   Les projets de constructions et d’utilisations des sols situés dans le périmètre de\n    protection d’un monument classé ou inscrit à l’inventaire historique font l’objet d’une\n    consultation auprès de l’Architecte des Bâtiments de France.\n5.2   Les autres projets de construction ne devront en outre pas porter atteinte :\n    • aux éléments architecturaux et culturels les plus remarquables du site de l’église\n    Notre Dame de la Pitié (ancienne) classé Monument Historique par arrêté du 2 avril\n    1975.\n    • aux éléments architecturaux et culturels les plus remarquables du site de La\n    Défense : La Grande Arche, le CNIT, la Tour Initiale.\n    • aux sites classés (Nord de l’Ile de Puteaux et Moulin de Chantecoq) conformément\n    aux dispositions des articles R.425-17 et suivants du code de l’Urbanisme.\n    • aux espaces boisés classés (EBC) conformément aux art. L.113-1 et 2 du code de\n    l’urbanisme et délimités au plan de zonage.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Dispositions générales   8","    •   aux éléments de paysages, espaces publics, sites et secteurs à protéger, à mettre\n    en valeur ou à requalifier pour des motifs d'ordre culturel, historique ou écologique\n    définis conformément aux art. L.151-19 et 23 du code de l’urbanisme. Cette\n    protection concerne les arbres remarquables et les éléments de patrimoine bâti\n    remarquables identifiés sur le plan de zonage général au moyen de points verts.\nARTICLE 6 : CONTRAINTES PARTICULIERES\n6.1   Les constructions et installations doivent prendre en compte la Charte Communale\n    pour le Développement Durable dans la construction privée, jointe en annexe. Cette\n    Charte comprend différents grands objectifs :\n    •   Maîtriser les impacts du projet sur l’environnement extérieur :\n    - favoriser une intégration harmonieuse du projet dans son environnement urbain.\n    - respecter le tissu urbain et l’identité des bâtiments existants.\n    - encourager l’utilisation des modes de déplacements alternatifs à la voiture\n    individuelle.\n    - réaliser des chantiers propres.\n    - développer une gestion « propre » des déchets ménagers et déchets d’activités.\n    •   Réduire les charges et les coûts de fonctionnement des bâtiments :\n    - limiter les consommations d’énergie et les émissions associées.\n    - maîtriser la consommation d’électricité.\n    - réduire la consommation d’eau potable.\n    - encourager des pratiques durables d’entretien et de maintenance.\n    •   Garantir un environnement intérieur sain et confortable :\n    - favoriser un environnement intérieur sain et confortable.\n    - limiter les nuisances sonores intérieures et extérieures aux bâtiments.\n    - garantir aux usagers du bâtiment un environnement intérieur leur offrant les\n    meilleures conditions sanitaires.\n    •   Inscrire le projet dans une démarche de solidarité sociale et citoyenne :\n    - favoriser l’accessibilité aux personnes à mobilité réduire.\n6.2   La localisation des antennes relais doit faire l’objet d’une concertation entre les\n    opérateurs et la commune. Les opérateurs doivent mettre à disposition du maire un\n    dossier d’information 1 mois avant le dépôt de la demande d’autorisation d’urbanisme\n    pour les nouvelles installations et 1 mois avant le début des travaux pour les\n    modifications substantielles nécessitant une nouvelle demande d’accord ou d’avis de\n    l’Agence Nationale des Fréquences (ANFR).\n6.3   Les constructions et installations doivent prendre en compte la Charte Devantures et\n    Enseignes de la Ville de Puteaux, jointe en annexe du PLU.\n6.4   Les constructions et installations doivent prendre en compte les Chartes Couleur de la\n    Ville de Puteaux, jointes en annexe du PLU.\n6.5   Les enseignes publicitaires faisant saillies sur alignement ne sont pas concernées par\n    l’article 6.1-2, toute demande d’autorisation est soumise aux dispositions du règlement\n    Local de Publicité intercommunal (RLPi) approuvé le 21 février 2021 (RLPi) joint en\n    annexe au PLU.\n6.6   Les constructions et installations doivent prendre en compte la « Charte qualité des\n    constructions neuves » jointe en annexe du PLU.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Dispositions générales   9","ARTICLE   7:    DISPOSITIONS APPLICABLES AUX VOIES\nCOMPORTANT    UNE PROTECTION DU COMMERCE ET DE\nL’ARTISANAT\nLe nouvel article L.151-16 du code de l’urbanisme dispose que le PLU peut identifier et\ndélimiter les quartiers, ilots, voies dans lesquels doit être préservée ou développée la diversité\ncommerciale, notamment à travers les commerces de détail et de proximité, et définir, le cas\néchéant, les prescriptions de nature à assurer cet objectif.\n7.1    Dans les constructions existantes situées en bordure des voies repérées au plan de\n    Zonage avec la mention « axes de commerces et d’artisanat à préserver », les travaux\n    de nature à transformer la surface de commerce, d’artisanat ou celles nécessaires aux\n    services publics ou d’intérêt collectif, à rez-de-chaussée sur rue, en toutes autres\n    destinations que les activités commerciales, artisanales ou constructions et\n    installations nécessaires aux services publics ou d’intérêt collectif sont interdits.\n    Cependant les travaux liés à l’accessibilité, l’hygiène, l’isolation phonique thermique ou\n    de sécurité ne sont pas interdits.\n7.2    Dans les rez-de-chaussée sur rue des constructions neuves situées en bordure des\n    voies repérées au plan de Zonage avec la mention « axes de commerces et d’artisanat\n    à préserver » sont interdites toutes autres destinations que les activités commerciales\n    et artisanales ou constructions et installations nécessaires aux services publics ou\n    d’intérêt collectif.\n7.3    Ces dispositions ne s’appliquent pas aux parties de ces constructions correspondant\n    aux accès aux étages et aux accès aux sous-sols.\nARTICLE 8 : DISPOSITIONS RELATIVES AUX ESPACES VERTS\nPROTEGES (EVP)\nIdentifiés au titre des articles L.151-19 et 23 du Code de l’Urbanisme, ils sont répertoriés à\nl’annexe F du présent règlement intitulée « Eléments répertoriés au titre des articles L.151-19\net 23 du Code de l’Urbanisme » ainsi que sur le Plan de Zonage.\nEst admise la modification de l’E.V.P. aux conditions suivantes :\n    •    elle restitue sur un espace équivalent la superficie protégée indiquée sur la fiche\n    de l’annexe F,\n    •    elle ne diminue pas la surface d’E.V.P. en pleine terre,\n    •    elle maintient ou améliore l’unité générale de l’E.V.P. ,\n    •    elle maintient ou améliore la qualité de l’E.V.P. et met en valeur ses plantations,\n    qu’elles soient conservées ou remplacées.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Dispositions générales   10","ARTICLE 9:   DISPOSITIONS    RELATIVES    AUX    ARBRES\nREMARQUABLES\nIdentifiés au titre des articles L.151-19 et 23 du Code de l’Urbanisme, ils sont répertoriés à\nl’annexe F du présent règlement intitulée « Eléments répertoriés au titre des articles L.151-19\net 23 du Code de l’Urbanisme » ainsi que sur le Plan de Zonage. Cette annexe dresse la liste\ndes arbres remarquables concernés, leurs caractéristiques ainsi que leur localisation. Il\nconvient de protéger ces arbres par les mesures ci-dessous :\n9.1    Leur abattage ne peut être autorisé que dans des cas exceptionnels liés à de graves\n    impératifs de sécurité ou phytosanitaires.\nPrescriptions :\n   • Il serait souhaitable qu’un document spécifique réalisé par un géomètre expert au\n    1/500ème ou au 1/200ème situe les limites séparatives et les troncs des arbres, et\n    représente les projections au sol des ramures ainsi que les zones de servitude.\n   • Action de taille ou d’élagage : Il est recommandé qu’aucune action de taille ou\n    d’élagage, même réduite à quelques branches, ne soit entreprise sur la ramure, pour\n    quelque motif que ce soit, sans recueillir préalablement l’avis de la Commune. Dans le\n    cas où l’intervention d’un praticien s’imposerait pour des prestations de taille ou de\n    soins particuliers après accord de la Ville et rédaction des prescriptions par un arboriste\n    conseil, le maître d’œuvre devrait alors recourir exclusivement à un entrepreneur\n    spécialiste de la taille raisonnée.\n   • Mesures de protection des arbres situés dans l’emprise d’un chantier : Lors de travaux\n    à proximité d’un arbre, il serait conseillé de mettre en place, dès le démarrage du\n    chantier et pour toute sa durée, une palissade jointive autour du sujet, d’au minimum\n    deux mètres de hauteur, à l’aplomb des branches extérieures, délimitant la zone de\n    protection.\nRappel : En application des dispositions figurant à l’alinéa h) de l’article R.421-23 du Code de\nl’Urbanisme, tous travaux ayant pour effet de modifier ou supprimer l’un de ces éléments\ndoivent faire l’objet d’une déclaration préalable.\nARTICLE 10 : DISPOSITIONS AUX ABORDS DES CANALISATIONS\nDE GAZ\nLa Ville de Puteaux est traversée par une canalisation de gaz à haute pression dont le tracé\nfigure sur le plan des Servitudes d’Utilité Publique joint en annexe du PLU. Dans les parties\ndu territoire soumises au risque technologique de transports de matières dangereuses lié à la\nprésence de cette canalisation, toute occupation ou utilisation du sol doit respecter les règles\nvisant à garantir la sécurité publique, conformément à l’arrêté du 4 août 2014.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Dispositions générales   11","TITRE 2 : DISPOSITIONS APPLICABLES AUX ZONES\n    URBAINES\n    Plan Local d’Urbanisme – Modification n°2 - Règlement   12","CHAPITRE 1 : ZONE UA\nCARACTERE ET VOCATION DE LA ZONE\nLa zone UA est une zone urbaine générale qui couvre la majeure partie du territoire communal.\nElle s’étend du plateau formant un balcon sur Paris jusqu’au front de Seine. Elle est\nessentiellement destinée à l’habitation, aux constructions et installations nécessaires au\nservice public ou d’intérêt collectif, au commerce, à l’artisanat qui en sont le complément\nindispensable mais également pour partie, composée d’immeubles de bureaux existants (UAb\net UAc). Elle comprend également le quartier du vieux Puteaux (UAa) et la partie résidentielle\nde l’ancienne ZAC Pressensé étendue (UAd).\nEn centre-ville, cette zone présente une forte densité de constructions, souvent édifiées en\nordre continu, à l’alignement des voies.\nLa zone UA comprend :\n    •   Un secteur UAa correspondant au village ancien aux abords du Théâtre des Hauts-\n    de-Seine et de la vieille église Notre-Dame-de-la-Pitié tel que délimité au Plan de\n    zonage.\n    •   Un secteur UAb correspondant à une partie du Front de Seine, à une partie des\n    Rosiers bordant la RD913, ainsi qu’au secteur d’activités de Pressensé, tels que\n    délimités au Plan de zonage, avec un sous-secteur UAb2.\n    •   Un secteur UAc correspondant à Boieldieu, à Bellini, ainsi qu’au secteur Gallieni\n    en bordure du boulevard circulaire tels que délimités au Plan de zonage.\n    •   Un secteur UAd correspondant à la partie résidentielle de l’ancienne ZAC\n    Pressensé étendue au site de bureaux contigu de l’autre côté de la rue Ampère.\n    •   Des secteurs soumis aux nuisances de bruit des infrastructures de transport\n    terrestre (routes et lignes ferroviaires), dont la liste figure en annexe du PLU.\n    •   Des secteurs inclus au Plan de Prévention des Risques d’Inondation (PPRI), en\n    annexe du PLU.\nARTICLE UA1 :    OCCUPATIONS    ET    UTILISATIONS    DU    SOL\nINTERDITES\n1.1    Les constructions destinées à l’industrie.\n1.2    Les constructions destinées à l’exploitation agricole ou forestière.\n1.3    Les constructions destinées à la fonction d’entrepôt, à l’exception du secteur UAc.\n1.4    Les terrains de camping et de caravanage, ainsi que ceux affectés à l’implantation\n    d’habitations légères de loisirs dans le cadre des articles L.443-1 à L.443-4 du Code\n    de l’Urbanisme, ainsi que le stationnement des caravanes isolées au sens des articles\n    R.111-37-4 à R.111-42 du Code de l’Urbanisme.\n1.5    Les affouillements, exhaussements des sols, exploitations des carrières, qui ne sont\n    pas nécessaires à des travaux de construction ou nécessaires au fonctionnement du\n    service public.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA   13","1.6    Les dépôts de ferrailles, de matériel ou de matériaux de quelque nature que ce soit,\n    ainsi que les entreprises de cassage de voitures, la transformation de matériaux de\n    récupération et constructions provisoires ou mobiles, sauf si celles-ci sont liées au\n    fonctionnement d’un chantier en cours ou d’une construction et installation nécessaire\n    aux services publics ou d’intérêt collectif.\nARTICLE UA2 : OCCUPATIONS ET UTILISATIONS    DU    SOL\nSOUMISES A CONDITIONS PARTICULIERES\n2.1    INSTALLATIONS CLASSEES POUR LA PROTECTION DE L’ENVIRONNEMENT\n2.1.1   Pour toutes les installations classées, quels que soient les régimes auxquels elles sont\n    soumises, leur implantation, aménagement ou extension est autorisé aux conditions\n    suivantes :\n    - qu’elles correspondent à des besoins nécessaires à la vie et à la commodité des\n    habitants,\n    - que les nuisances (émanations nocives ou malodorantes, fumées, bruits,\n    poussières, altération des eaux, etc..) et dangers (risques d’incendie, explosion,\n    etc.) puissent être prévenus et évités de façon satisfaisante eu égard à\n    l’environnement de la zone sans dommage grave ou irréparable aux personnes et\n    aux biens,\n    - et que leurs exigences de fonctionnement soient compatibles avec les\n    infrastructures existantes, notamment les voiries et l’assainissement.\n2.2    COMMERCE ET ARTISANAT\n2.2.1 Pour toutes les nouvelles constructions :\n    Qu’elles s’implantent en sous-sol, rez-de-chaussée et/ou premier niveau des\n    constructions.\n2.2.2   Pour les constructions destinées au commerce, leur surface ne peut excéder 300 m²\n    SDP par unité commerciale, hors réserves et autres locaux nécessaires à leur\n    fonctionnement. La superficie totale d’un commerce ne pourra être supérieure à 500\n    m² SDP. Cet article ne s’applique pas aux commerces situés :\n    - rue Jean Jaurès (entre le boulevard Richard Wallace et la rue Godefroy)\n    - rue Pierre Curie\n    - rue Paul Lafargue.\n2.2.3   Pour les constructions destinées à l’artisanat :\n    La surface totale des constructions n’excède pas 300 m² SDP par unité d’activité, hors\n    réserves et 500 m² SDP en totalité.\n2.3    BUREAUX\n2.3.1   Hors secteurs UAb et UAc, les nouvelles constructions à destination de bureaux ne\n    sont autorisées qu’en remplacement de constructions existantes et à SDP équivalente.\n    Toute extension est interdite.\n2.3.2   En secteur UAb, la construction de bureaux est autorisée uniquement en\n    remplacement de constructions existantes à destination de bureaux, d’industrie ou\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA   14","    d’entrepôt avec possibilité de créer une SDP supérieure à la SDP du bâtiment existant.\n    Le changement de destination des constructions à usage d’industrie ou d’entrepôts en\n    bureaux est autorisé.\n    NOTA : Le pétitionnaire devra dans le cadre de l’instruction fournir le récépissé de\n    dépôt de sa demande d’agrément.\n2.3.3    En secteur UAc, la construction de bureaux est autorisée.\n2.4    DISPOSITIONS PARTICULIERES\n2.4.1    Dans les parties de la zone, soumises au risque technologique de transports de\n    matière dangereuse lié à la présence des canalisations de gaz à haute pression, dont\n    le tracé figure dans le plan des servitudes d’utilité publique annexé au PLU, toute\n    occupation ou utilisation du sol doit respecter les règles visant à garantir sa sécurité\n    publique. Les projets compris dans le périmètre de danger pourront être autorisés\n    après avis et sous réserve de l’observation des prescriptions spéciales ou mesures\n    conservatoires qui seraient émises par le service intéressé et le service gestionnaire\n    de ces ouvrages.\n    Les ouvrages de transports devront se conformer aux dispositions en vigueur\n    notamment par des mesures de protection suffisantes\n2.5    HABITATION\n2.5.1    Se référer à l’article 2.2.11 des dispositions générales.\n2.6    PROTECTION DU PATRIMOIN BATI\n    Les éléments de paysage bâtis faisant l’objet d’une protection au titre de l’article L.\n    151-19 du code de l’urbanisme, tels qu’identifiés au plan de zonage (pièce n°5 du\n    dossier de PLU) et listés à l’annexe H du présent règlement font l’objet de dispositions\n    particulières aux articles 6, 7, 8 10, et 11 du règlement de la zone UA tels que définis\n    ci-après.\nARTICLE UA3 : ACCES ET VOIRIES\n3.1    ACCES\n3.1.1 Toute construction doit avoir un accès à une voie ouverte à la circulation générale. Cet\n    accès doit être aménagé :\n    • Soit directement en façade depuis le domaine public (dans la limite d’un accès par\n    tranche de 30 mètres de façade).\n    • Soit par l’intermédiaire d’un passage privé (appendice d’accès).\n    • Soit par une servitude de passage suffisante, instituée par un acte authentique ou\n    par voie judiciaire, en application de l’article 682 du Code Civil.\n3.1.2   Les accès ne doivent présenter aucun risque pour la sécurité des usagers des voies\n    publiques ou pour celle des personnes utilisant cet accès, eu égard à la nature et à\n    l’importance du trafic, ainsi qu’à la position et à la configuration de ces accès.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA   15","3.1.3    Lorsqu’un terrain est desservi par plusieurs voies, toute construction ou extension peut-\n    être autorisée sous réserve que l’accès soit établi sur la voie où la gêne pour la\n    circulation est la moindre.\n3.1.4    Cet article n’est pas applicable au secteur UAc.\n3.2    VOIRIE\n3.2.1    Les constructions et installations doivent être desservies par des voies ouvertes à la\n    circulation générale dont les caractéristiques correspondent à leur destination, à savoir,\n    une largeur minimum de 3,50m et 3 mètres dans le cas d’un accès droit d’une longueur\n    inférieure à 50 mètres. Ces voies doivent permettre de satisfaire aux exigences de la\n    sécurité, de la défense contre l’incendie et de la protection civile.\n3.2.2    Les voies nouvelles en impasse doivent comporter un aménagement permettant aux\n    véhicules de faire demi-tour.\n3.2.3    La création ou l’aménagement des voies doit respecter les prescriptions relatives à leur\n    accessibilité aux personnes handicapées.\nARTICLE UA4 : DESSERTE PAR LES RESEAUX\nTous les réseaux et raccordements devront être enterrés.\nLa récupération et l’utilisation des eaux pluviales, ainsi que les eaux de toutes autres origines,\ndoivent respecter les exigences de la législation et de la réglementation en la matière,\nnotamment :\n    • La récupération des eaux de pluies et leur usage à l’intérieur et à l’extérieur des\n    bâtiments (arrêté du 21 aout 2008)\n    • Le contrôle des installations privatives de distribution d’eau potable, de récupération\n    des eaux de pluie ainsi que des ouvrages de prélèvement, puits et forages (arrêté du\n    17 décembre 2008 et circulaire du 9 novembre 2009)\n    • L’article 3.4 du contrat de délégation de service public de production et de distribution\n    d’eau potable\n    • Les articles 18 et 21 du règlement du service du Syndicat des eaux d’Ile-de-France,\n    • Le règlement départemental d’assainissement des Hauts de Seine en vigueur.\n4.1    ALIMENTATION EN EAU POTABLE\n4.1.1    Toute construction ou installation nouvelle qui, par sa destination nécessite l’utilisation\n    d’eau potable, doit être alimentée par branchement à un réseau collectif de distribution\n    sous pression présentant des caractéristiques suffisantes.\n4.1.2    Le pétitionnaire doit prendre toutes les précautions pour que les installations d’eau\n    potable ne soient immergées à l’occasion d’une mise en charge d’un égout, ni que\n    puisse se produire une quelconque introduction d’eaux polluées dans ces réseaux.\n4.2    ASSAINISSEMENT\n4.2.1    Toute construction ou installation nouvelle à l’intérieur d’une même propriété, doit être\n    conçue de manière à recueillir les eaux pluviales et les eaux usées séparément. Tous\n    les raccordements aux réseaux publics seront exécutés conformément à la\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA   16","    réglementation en vigueur, en respectant les caractéristiques de ce réseau et avec\n    l’accord des autorités compétentes.\n4.2.2   Le pétitionnaire doit prendre en compte les possibilités de mises en charge des réseaux\n    publics jusqu’à la cote altimétrique de la voie publique de façon à éviter le reflux d’eaux\n    d’égout dans les caves, sous-sols et constructions situées en contrebas de la voirie\n    publique. L’orifice d’évacuation des réseaux internes doit être équipé d’un clapet anti-\n    retour. Les regards situés à des niveaux inférieurs à cette cote, et qui n’auront pu être\n    évités, doivent être rendus étanches. Un ouvrage appelé « boîte de branchement » ou\n    « regard de façade » devra être placé sous le domaine public de préférence pour la\n    nécessité de contrôle et d’entretien du branchement (article 5 du Règlement communal\n    d’assainissement).\n4.2.3   EAUX USEES\n    • L’évacuation des eaux ménagères, et des effluents non traités, dans les fossés,\n    cours d’eau ou égouts pluviaux est interdite.\n    • Le branchement au réseau d’assainissement des canalisations d’évacuation des\n    liquides industriels résiduaires doit être soumis à la réglementation en vigueur et\n    particulièrement en ce qui concerne le traitement préalable de ces liquides.\n4.2.4   EAUX PLUVIALES\n    • Les aménagements réalisés sur un terrain ne doivent pas faire obstacle au libre\n    écoulement des eaux pluviales (articles 640 et 641 du Code Civil). Lorsqu’il existe\n    un réseau collectif apte à recueillir les eaux pluviales, les aménagements sur le\n    terrain doivent garantir leur évacuation dans ledit réseau.\n    • Les aménagements réalisés sur tout terrain doivent intégrer les contraintes en\n    matière de rétention des eaux pluviales telles qu’elles garantissent un débit de fuite\n    conforme au règlement communal d’assainissement et au règlement\n    départemental des Hauts-de-Seine. Aussi, sont mis en œuvre toutes techniques et\n    aménagements (bassins de stockage, restitution et/ou système d’infiltration..)\n    appropriés à la nature des travaux projetés, sauf en cas d’impossibilité liée la taille\n    et à la configuration du terrain.\n4.3    ELECTRICITE – GAZ – TELECOMMUNICATIONS – RESEAUX CABLES\n    Les branchements privatifs de toute nature doivent être réalisés en souterrain jusqu’en\n    limite du domaine public et ne doivent pas rester apparents sur la construction.\n    L’aménageur ou le lotisseur doit réaliser l’infrastructure nécessaire à la distribution de\n    ces différents réseaux depuis le point de raccordement général jusqu’à la limite de\n    parcelle.\n4.4    DECHETS – ORDURES MENAGERES\n    Toute nouvelle construction doit être pourvue d’un local correctement accessible et\n    dimensionné pour recevoir les divers conteneurs liés à la collecte sélective des ordures\n    ménagères et déchets industriels banals (DIB).\nARTICLE UA5 : CARACTERISTIQUES DES TERRAINS\n    Sans objet.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA   17","ARTICLE UA6 : IMPLANTATION DES CONSTRUCTIONS    PAR\nRAPPORT AUX VOIES ET EMPRISES PUBLIQUES\n6.1    REGLES GENERALES\n6.1.1   Les constructions et installations doivent s’implanter en tout ou partie soit :\n    • A l’alignement actuel des voies, ou projeté si un emplacement réservé ou une\n    marge de reculement figure au plan de zonage.\n    • En retrait d’au minimum 1 mètre par rapport à cet alignement.\n    • L’implantation en retrait de 3 mètres avec jardin entre la clôture et la façade sera\n    privilégiée, dès que possible.\nIl pourra être admis que des façades non rectilignes (par exemple en arrondi) s’inscrivent de\nmanière ponctuelle entre l’alignement et le retrait autorisé.\n6.2    REGLES PARTICULIERES\n6.2.1   Dans le cas de terrains situés à l’angle de deux voies, situées sur le même plan\n    horizontal, l’alignement se caractérise :\n    •   Soit par un pan coupé, d’une longueur de 3 mètres minimum, rejoignant les 2\n    alignements adjacents par 2 angles égaux.\n    •   Soit par un arc de cercle tangent ou en retrait des alignements existants.\n    Les constructions doivent par conséquent s’implanter sur celui-ci conformément à l’art.\n    6.1.1.\n6.2.2   Les règles définies aux articles 6.1.1 et 6.2.1 ne sont pas applicables dans les cas\n    suivants :\n    • Si une au moins une des constructions voisine, en bon état, et située en retrait de\n    l’alignement, la construction peut rejoindre en tout ou partie son alignement.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA   18","    •    Aux extensions et surélévations d’une construction existante ne respectant pas\n    l’article 6.1. Dans ce cas l’implantation est autorisée dans le prolongement des\n    murs existants.\n6.3  PAR RAPPORT    AUX    EMPRISES    PUBLIQUES*    ET    AUX    EMPRISES\nFERROVIAIRES\n6.3.1   Les constructions ou installations peuvent s’implanter en tout ou partie soit :\n    • En limite actuelle des emprises publiques ou projeté si un emplacement réservé\n    ou une marge de reculement figure au Plan de zonage.\n    • En retrait d’au minimum 3 mètres par rapport à cette limite.\n6.3.2 Les saillies sur voies et emprises publiques sont autorisées à partir du 2ème niveau et\n    sur une profondeur de 0,8m maximum\n6.3.3   Les constructions et installations nécessaires au réseau de transport public du Grand\n    Paris, ou nécessaires à l’activité ferroviaire peuvent être implantées à l’alignement ou\n    respecter un retrait de 1m au minimum.\n6.3.4 Les constructions peuvent s’implanter par rapport aux emprises ferroviaires en tout ou\n    partie soit :\n    • En limite actuelle des emprises publiques ou projeté si un emplacement réservé\n    ou une marge de reculement figure au Plan de zonage.\n    • En retrait d’au minimum 3 mètres par rapport à cette limite.\nSous deux réserves :\n    • Respecter les servitudes applicables aux abords des emprises ferroviaires,\n    • Ne pas créer d’ouverture à moins de 6 mètres de l’emprise ferroviaire.\n6.4    ELEMENTS BATIS A PROTEGER\n    Tous travaux réalisés sur des éléments bâtis localisés au plan de zonage (pièce n°5\n    du dossier de PLU) faisant l’objet d’une protection au titre de l’article L. 151-19 du\n    code de l’urbanisme peuvent bénéficier d’une implantation dérogatoire nécessaire à\n    la préservation des caractéristiques à préserver et à mettre en valeur qui ont prévalu\n    à leur identification telles qu’elles figurent dans l’annexe H du présent règlement.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA   19","ARTICLE UA7 : IMPLANTATION DES    CONSTRUCTIONS    PAR\nRAPPORT AUX LIMITES SEPARATIVES\n7.1    REGLES GENERALES\n7.1.1 Dans une bande de 10 mètres à compter de l’alignement :\n    • Toute nouvelle construction doit s’implanter sur les limites séparatives latérales.\n    • Des retraits sont acceptés à compter du 2ème niveau d’au moins 2 mètres par\n    rapport à la limite séparative latérale, en cas de façade sans ouverture, et d’au\n    moins 8 mètres en cas de façade avec ouverture(s). Dans le cas de terrasse en\n    toiture située à moins de 4 mètres de la limite séparative, un écran pare vues de\n    1,9 mètres de hauteur sera implanté en limite séparative, avec un retour de 0,6\n    mètres sur façade arrière.\n7.1.2   Dans une bande comprise entre 10 et 20 mètres à compter de l’alignement :\n    • Les constructions peuvent s’implanter en limites séparatives ou en retrait de celles-\n    ci.\n    • En cas d’implantation en retrait, la distance comptée horizontalement (L) de tout\n    point de la façade au point de la limite parcellaire qui en est le plus rapproché doit\n    être au moins égale à la moitié de la hauteur (H) de la façade par rapport au niveau\n    du sol fini après travaux, sans pouvoir être inférieure à 8 mètres. (L=H/2 avec L ≥\n    8 mètres art. R.111-18 du Code de l’Urbanisme).\n7.1.3   Au-delà d’une bande de 20 mètres par rapport à l’alignement :\n    Les constructions doivent s’implanter en retrait de la limite séparative d’une distance\n    d’au moins égale à la moitié de la hauteur de la construction, mesurée à l’égout du toit,\n    avec un minimum de 10 mètres.\n    L’édification en limite séparative n’est autorisée que dans le prolongement d’une\n    construction mitoyenne existante.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA   20","7.1.4 Les pignons, implantés sur les limites séparatives ne doivent pas comporter de baies,\n    sauf :\n    • Les baies bénéficiant de servitudes de vues instituées par acte authentique ou par\n    voie judiciaire, en application des articles 675 à 677 du Code Civil sur les propriétés\n    voisines.\nNOTA : Les jours de souffrance existants situés sur les limites séparatives doivent être pris en\ncompte dans tout projet de construction de manière à ne pas les occulter.\n7.1.5   Les balcons, lucarnes et autre élément de construction en toiture, ne sont pas pris en\n    compte pour le calcul des prospects (qui sont calculés par rapport au nu de la façade,\n    sous réserve de ne pas excéder un débord de plus de 2 mètres).\n7.2    REGLES PARTICULIERES\n7.2.1 Lors d’une surélévation sur un bâtiment situé en retrait des limites séparatives ne\n    respectant pas les règles du présent article, celle-ci est autorisée dans le prolongement\n    de tout ou partie des murs existants. La création d’ouvertures est autorisée à condition\n    que la distance de la surélévation la séparant de la limite séparative la plus rapprochée\n    soit au minimum de 4mètres.\n7.2.2   Lors de la création d’une cour commune instituée par acte authentique ou par voie\n    judiciaire en application des articles 675 à 677 du Code Civil entre deux propriétés\n    distinctes. Dans tous les cas, la distance minimum entre les deux constructions doit\n    être supérieure à 3 mètres.\n7.2.3   En cas d’emprise au sol autorisée jusqu’à 100% en raison de l’application de l’article\n    9.2.1, l’implantation des constructions peut être réalisée sur toutes ou parties des\n    limites séparatives, ou en retrait de celles-ci conformément aux articles UA 7.1.1 à\n    7.1.4.\n7.2.4   Pour les constructions et installations nécessaires aux services publics ou d’intérêt\n    collectif, leur implantation peut être réalisée sur les limites ou en retrait d’au moins 1\n    mètre.\n7.2.5   Pour les constructions neuves à usage de bureaux :\n    En secteur UAb, le retrait de tout ou partie de la façade aux limites séparatives\n    doit être au moins égale à 8 mètres. En secteur UAc, la distance de tout ou\n    partie de la façade aux limites séparatives doit être au moins égale à la moitié\n    de la hauteur de la construction avec un minimum de 8 mètres. Dans ces deux\n    cas, les articles UA 7.1.1. à 7.1.3. inclus ne s’appliquent pas.\n7.3    ELEMENTS BATIS A PROTEGER\n    Tous travaux réalisés sur des éléments bâtis localisés au plan de zonage (pièce n°5\n    du dossier de PLU) faisant l’objet d’une protection au titre de l’article L. 151-19 du\n    code de l’urbanisme peuvent bénéficier d’une implantation dérogatoire nécessaire à\n    la préservation des caractéristiques à préserver et à mettre en valeur qui ont prévalu\n    à leur identification telles qu’elles figurent dans l’annexe H du présent règlement.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA   21","ARTICLE UA8 : IMPLANTATION DES CONSTRUCTIONS LES UNES\nPAR RAPPORT AUX AUTRES SUR UNE MEME PROPRIETE\n8.1    REGLES GENERALES\n8.1.1 Les bâtiments non contigus situés sur la même unité foncière, doivent être implantés à\n    une distance « L » comptée horizontalement en tout point de la construction et définie\n    comme suit :\n    • Egale à la hauteur à l’égout de la façade la plus haute par rapport au sol après\n    travaux avec un minimum de 20 mètres.\n8.1.2   La distance mesurée perpendiculairement entre les baies de bâtiments contigus\n    formant un U ne peut être inférieure à 12 mètres.\n8.1.3   Les balcons, lucarnes et autre élément de construction en toiture, ne sont pas pris en\n    compte pour le calcul des prospects.\n8.2    REGLES PARTICULIERES\n8.2.1   Il n’est pas fixé de règles pour les constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif.\n8.2.2   L’article 8.1.1 ne s’applique pas aux constructions annexes inférieures à 10 m² et dont\n    la hauteur totale de la construction est inférieure à 3 mètres.\n8.3    ELEMENTS BATIS A PROTEGER\n    Tous travaux réalisés sur des éléments bâtis localisés au plan de zonage (pièce n°5\n    du dossier de PLU) faisant l’objet d’une protection au titre de l’article L. 151-19 du\n    code de l’urbanisme peuvent bénéficier d’une implantation dérogatoire nécessaire à\n    la préservation des caractéristiques à préserver et à mettre en valeur qui ont prévalu\n    à leur identification telles qu’elles figurent dans l’annexe H du présent règlement.\nARTICLE UA9 : EMPRISE AU SOL\n9.1    REGLES GENERALES\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA   22","L’emprise au sol des constructions ne peut excéder 60 % de la superficie du terrain.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA   23","9.2    REGLES PARTICULIERES\n9.2.1   L’emprise au sol peut être portée jusqu’à 80 % dans les cas suivants :\n    • En cas de réhabilitation ou d’extension pour amélioration de l’accessibilité, de\n    l’hygiène, de la sécurité ou en vue de réaliser un local à vélo.\n    jusqu’à 100 % dans les cas suivants :\n    • Pour les constructions ou installations nécessaire aux services publics ou d’intérêt\n    collectif.\n9.2.2   En secteurs UAb et UAc, pour les constructions de bureaux, l’emprise au sol peut être\n    portée à 70% (hors dispositions de l’article 9.2.1).\nARTICLE UA10 : HAUTEUR MAXIMALE DES CONSTRUCTIONS\n10.1    DEFINITION ET MODE DE CALCUL DE LA HAUTEUR\n10.1.1 La hauteur des constructions est définie à partir du niveau du trottoir fini :\n    • Soit comme une hauteur maximale (faîtage ou acrotère).\n    • Soit par une référence à l’égout du toit.\n    • Soit en nombre de niveaux.\n    • Soit en référence à une cote exprimée par rapport au Nivellement Général de la\n    France (NGF).\n10.1.2 Hors secteurs UAb et UAc la hauteur de la construction est mesurée à partir du niveau\n    moyen fini du trottoir jusqu’au point de référence le plus élevé du bâtiment (faîtage),\n    les ouvrages techniques, cheminées et autres superstructures de faible emprise étant\n    exclus.\n10.1.3 Dans le cas d’un terrain en pente, le niveau de référence est la moyenne du point le\n    plus haut et du point le plus bas du terrain au niveau des limites de ce terrain (limites\n    par rapport aux voies et aux limites séparatives). Toutes constructions situées sous ce\n    niveau de référence sont considérées comme le sous-sol.\n10.1.4 En secteurs UAb (hors UAb2) et UAc, la hauteur maximum des constructions est\n    exprimée en cotes NGF figurant au Plan de zonage. Cette hauteur peut être dépassée\n    ponctuellement pour la réalisation d’un motif architectural (coiffe, signal, etc.) dans la\n    limite de 2 mètres supplémentaires.\n10.1.5 En secteur UAd et UAb2, la hauteur maximum des constructions est fixée à\n    R+4+combles.\nNOTA : Les combles mentionnés à l’article 10 ne doivent être composés que d’un seul niveau\nde plancher éclairé.\n10.2    REGLES GENERALES\n10.2.1 La hauteur maximale des nouvelles constructions situées hors secteurs UAa, UAb, et\n    UAc ne peut excéder 7 niveaux (R+5+Combles) soit 21 mètres au faîtage. Cette\n    hauteur peut être dépassée ponctuellement, dans la limite d’un niveau supplémentaire\n    soit, 25 mètres au faîtage, et ce, pour motif architectural (rotonde, etc..).\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA   24","10.3   REGLES PARTICULIERES\n10.3.1 En bordure des voies dont la largeur est inférieure ou égale à 10 mètres, la hauteur\n    totale (H) au faîtage des nouvelles constructions à destination d’habitation ou d’hôtel\n    est limitée au double de la distance ajoutée d’un mètre les séparant de l’alignement\n    opposé existant ou futur si un emplacement réservé ou une marge de reculement figure\n    au plan (H = 2L+1). Dans tous les cas la hauteur ne peut dépasser 21 mètres au faîtage\n    (R+5+Combles).\n    Cet article n’est pas applicable passage Jean Nennig, où la hauteur maximale est de\n    15 m à l’égout et 18 m au faîtage.\n10.3.2 Lorsque la construction est édifiée à l’angle de deux voies de largeurs différentes, la\n    partie du bâtiment bordant la voie la plus étroite peut avoir la même hauteur que celle\n    longeant la voie la plus large sur une longueur n’excédant pas 10 mètres par rapport à\n    l’alignement de cette dernière ou lorsqu’elles sont portées sur le document graphique,\n    par rapport aux marges obligatoires de reculement qui s’y substituent.\n10.3.3 En secteur UAa, la hauteur maximale des nouvelles constructions ne peut excéder 15\n    mètres à l’égout du toit et 18 mètres au faîtage, dans la limite de 6 niveaux\n    (R+4+Combles). Dans l’ilôt délimité par les rues Benoit Malon, Bourgeoise, Voltaire et\n    rue du Four, cette hauteur est limitée à 9 mètres à l’égout du toit et 12 mètres au faîtage\n    (R+2+C).\n10.3.4 Les constructions nouvelles édifiées hors secteurs UAa, UAb et UAc, situées au-delà\n    d’une bande de 20 mètres à compter de l’alignement existant ou projeté :\n    • Pour les terrains d’une largeur inférieure ou égale à 15 mètres, les constructions\n    ne peuvent excéder 6 mètres à l’égout du toit et 9 mètres au faîtage.\n    • Pour les terrains d’une largeur supérieur à 15 mètres, la hauteur des\n    constructions de pourra excéder le double de la distance la séparant de la limite\n    séparative la plus rapprochée.\n    • En cas d’édification dans le prolongement d’une construction mitoyenne\n    existante, la hauteur maximale ne pourra dépasser la hauteur de cette\n    construction.\n10.3.5 Pour les constructions édifiées en limites de zones, UD et UL, la hauteur à la limite des\n    nouvelles constructions ne devra pas dépasser :\n    • d’un niveau maximum la hauteur de la construction mitoyenne existante sur une\n    profondeur d’au moins 6 mètres.\n    • d’un niveau maximum la hauteur maximale autorisée dans ces zones sur une\n    distance d’au moins 6 mètres si aucune construction mitoyenne n’est édifiée.\n    Cet article n’est pas applicable aux secteurs UAa, UAb et UAc.\n10.3.6 Pour les constructions existantes ne respectant les articles 10.1 à 10.3.5, leur\n    extension est autorisée dans la limite de la hauteur maximale existante.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA   25","10.3.7 Pour les constructions et installations nécessaires au service public ou d’intérêt\n    collectif, les articles 10.3.1 à 10.3.5 ne sont pas applicables.\n10.4   ELEMENTS BATIS A PROTEGER\n    Tous travaux réalisés sur des éléments bâtis localisés au plan de zonage (pièce n°5\n    du dossier de PLU) faisant l’objet d’une protection au titre de l’article L. 151-19 du\n    code de l’urbanisme peuvent bénéficier d’une altimétrie dérogatoire nécessaire à la\n    préservation des caractéristiques à préserver et à mettre en valeur qui ont prévalu à\n    leur identification telles qu’elles figurent dans l’annexe H du présent règlement.\nARTICLE UA11 : ASPECT EXTERIEUR DES CONSTRUCTIONS,\nAMENAGEMENT DE LEURS ABORDS\n    •    Les constructions, par leur situation, leur architecture, leurs dimensions, l’aspect\n    extérieur des bâtiments ou ouvrages à édifier ou à modifier, ne doivent pas porter\n    atteinte au caractère ni à l’intérêt des lieux avoisinants, aux sites, aux paysages\n    naturels, urbains ainsi qu’à la conservation des perspectives monumentales (article\n    R.111-21 du Code de l’Urbanisme).\n    •    Un parti architectural privilégiant une composition verticale de la façade doit être\n    observé pour toute nouvelle construction, et ce afin de conserver une morphologie\n    du tissu urbain qui identifie clairement des séquences courtes, composées et\n    articulées, excluant l’uniformité, y compris sur les projets regroupant plusieurs\n    unités foncières (hors secteurs UAb et UAc).\n    •    Tout projet de construction devra s’inscrire dans un gabarit et/ou une hauteur en\n    cohérence avec son environnement et les constructions mitoyennes ou voisines\n    existantes. Les schémas ci-dessous montrent les gabarits à respecter. Cet article\n    n’est pas applicable aux secteurs UAb et UAc.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA   26","11.1   FACADES\n11.1.1 Les façades doivent être composées de matériaux nobles (aspect pierre, verre, métal,\n    brique, etc.). les dispositifs de murs végétalisées sont autorisés.\n11.1.2 La texture des enduits et peintures, de même que leurs teintes doivent être adaptées\n    aux matériaux composant la façade et s’accorder harmonieusement à l’aspect des\n    constructions avoisinantes.\n11.1.3 Sont interdits :\n    • L’emploi à nu de matériaux destinés à être recouverts d’un revêtement, d’un\n    parement ou d’un enduit (briques creuses, carreaux de plâtre, parpaings, etc.).\n    • Toute installation réalisée avec des moyens précaires ou dits « de fortune ».\n11.1.4 Tous travaux doit chercher à respecter l’aspect d’origine ou améliorer la volumétrie de\n    la partie supérieure des constructions. L’adjonction de volumes bâtis (lucarnes,\n    prolongements de façades, vérandas…) ne peut être autorisée que dans la mesure où\n    ils s’intègrent de façon harmonieuse dans la composition d’ensemble.\n11.1.5 La mise en valeur des façades doit être recherchée à travers la restitution de matériaux\n    d’origine, de reliefs (bow-windows, modénatures…), d’accessoires ou de décors\n    anciens disparus.\n11.1.6 Les portes d’accès aux parcs de stationnements, les sas ouverts ainsi que les entrées\n    piétonnes doivent comporter une fermeture dans le plan de la façade, sauf impossibilité\n    manifeste liée à des impératifs techniques de sécurité. Leur traitement doit bénéficier\n    d’un soin particulier de mise en valeur, que ce soit au niveau des matériaux (aspect\n    bois, métal laqué..) que de par son écriture architecturale. Elles doivent avoir, sur une\n    même façade, une similitude d’aspect.\n11.1.7 Les pignons sont traités avec le même soin et en harmonie avec les façades\n    principales.\n11.1.8 Les postes de transformation électrique et les postes de détente gaz doivent être\n    intégrés dans le volume de la construction (sauf cas d’impossibilité technique), en\n    prenant en compte en particulier les matériaux et les couleurs des constructions\n    avoisinantes.\n11.2   DEVANTURES\n11.2.1 En cas de devanture se développant à rez-de-chaussée sous une corniche ou un\n    bandeau filant, ceux-ci doivent être reconstitués s’ils ont été supprimés ou\n    endommagés.\n11.2.2 La réalisation de devanture se développant sur deux ou plusieurs niveaux ne peut être\n    autorisée que lorsque l’architecture du bâtiment le permet ou a été conçue dans ce\n    sens (entresol…).\n11.2.3 Les devantures peuvent être implantées, soit en saillie par rapport au plan de la façade\n    pour les devantures dites « en applique », soit en retrait limité (10 à 20 cm dans les 2\n    cas) pour les devantures dites « en feuillure ».\n11.2.4 Les coffres et grilles de fermeture doivent être implantés intérieurement, en retrait des\n    vitrines (sauf impossibilité technique ou architecturale manifeste), le choix du système\n    de protection, en arrière de la vitrine, doit maintenir les transparences visuelles, sous\n    réserve des nécessités liées à la sécurité.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA   27","11.2.5 Les bandeaux supérieurs des devantures, destinés à recevoir l’enseigne, doivent être\n    de hauteur limitée (0,80 mètre maximum) de façon à limiter les effets d’horizontalité qui\n    nuisent à la bonne lecture des proportions des bâtiments. Ces bandeaux sont limités à\n    la longueur de la façade commerciale.\n11.3 TOITURES\n11.3.1 Les combles et toitures doivent présenter une simplicité de volume et une unité de\n    conception. Les toitures des constructions sont composées :\n    • Soit d’une ou plusieurs pentes ou éléments à versants symétriques.\n    • Soit de toitures terrasses en tout ou parties végétalisées.\n    • Soit d’une seule pente pour motif architectural ou pour les annexes.\n    • Soit de rotondes ou éléments arrondis.\n11.3.2 Ces dispositions peuvent ne pas être imposées en cas d’adjonction à une construction\n    existante.\n11.3.3 Les matériaux autorisés en toiture sont notamment de type :\n    • Aspect Tuiles traditionnelles, mécaniques.\n    • Aspect Ardoises\n    • Aspect Zinc.\n11.3.4 Les panneaux solaires sont autorisés à condition que ceux-ci soient non-réfléchissants,\n    implantés dans la pente de la toiture, le tout sans aller au-delà de la hauteur autorisée.\n    Sur les toitures terrasses, les panneaux doivent s’implanter en retrait des façades d’au\n    moins 1 mètre, sans pouvoir dépasser 3 mètres de hauteur totale.\n11.3.5 L’éclairement éventuel des combles est assuré par des ouvertures en lucarnes, soit\n    par des châssis de toit dans le plan des versants, soit par des fenêtres en pignons, si\n    les règles de prospect le permettent.\n11.3.6 Il pourra être admis une terrasse accessible en toiture d’une construction à condition\n    qu’elle constitue un espace d’agrément.\n    Les tropéziennes (voir définition en annexes) sont interdites.\n11.3.7 Les descentes d’eau pluviales sont intégrées au volume de la construction et non\n    apparentes sur la façade principale. Les chenaux sont intégrés dans une corniche ou\n    tout autre élément de modénature ou de construction les rendant invisibles depuis la\n    rue. Tout rejet direct des eaux de pluie depuis les balcons ou les terrasses est interdit,\n    un dispositif de récupération de ces eaux dans les descentes verticales doit être prévu.\n11.3.8 Les édicules et accessoires à caractère technique (caisson de climatisation,\n    extracteurs, édicules d’ascenseurs, etc…) :\n    Pour les toitures à pentes :\n    Ils sont intégrés au volume général de la construction\n    Pour les toitures terrasses :\n    • Ils sont regroupés de manière homogène\n    • Ils sont implantés en retrait de 2 mètre minimum par rapport aux façades.\n    • Leur hauteur ne dépasse pas le niveau fini de la terrasse de plus de 2 mètres\n    afin d’en limiter l’impact visuel.\n    • Leur traitement doit se faire en harmonie avec la construction (couleurs,\n    matériaux…).\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA   28","11.3.9 Les antennes d’émission ou de réception doivent être implantées de manière à réduire\n    l’impact visuel et esthétique. Elles ne comptent pas dans le calcul de la hauteur totale\n    définit à l’article UA10, sauf dispositions contraires stipulées aux servitudes d’utilité\n    publique (annexes 6b).\n    Pour les antennes relais se référer à l’article 6.2 des dispositions générales.\n11.4    CLOTURES ET MURS\n11.4.1 CLOTURES SUR VOIES\n    • Elles doivent s’implanter à l’alignement.\n    • Leur hauteur maximale est de 3 mètres, en cas de terrain en pentes, la hauteur\n    totale moyenne ne peut excéder 3,50 mètres. Toutefois, l’entretien et la\n    restauration des murs anciens en maçonnerie d’une hauteur supérieure sont\n    admis. Des hauteurs supérieures peuvent également être admises en cas\n    d’impératifs liés à la sécurité.\n    • Elles sont constituées soit :\n    - d’un mur bahut en maçonnerie ou enduite, surmonté d’une grille métallique à\n    barreaudages verticaux, composée d’éléments ouvragés et/ou ponctuels.\n    - d’un mur plein lorsqu’il constitue le prolongement de la construction ou permet la\n    continuité d’un front bâti, réalisé en matériaux destinés à rester apparents (pierre\n    de taille, moellon, briques pleines jointoyées, etc.) ou recouverts d’un enduit\n    identique à celui de la construction principale.\n11.4.2 CLOTURES EN LIMITES SEPARATIVES\n    • Leur hauteur maximale est de 3 mètres, toutefois, l’entretien et la restauration des\n    murs anciens en maçonnerie d’une hauteur supérieure sont admis.\n    • Les clôtures sont constituées soit :\n    - d’un mur bahut en maçonnerie ou enduite, surmonté d’une grille métallique à\n    barreaudages verticaux, composée d’éléments ouvragés et/ou ponctuels.\n    - d’un mur plein réalisé en matériaux destinés à rester apparents (pierre de taille,\n    moellon, briques pleines jointoyées, etc.) ou recouverts d’un enduit identique à celui\n    de la construction principale.\n    - d’une structure ajourée de type grillagée.\n11.4.3 MURS HORS CLOTURES\n    • Leur hauteur ne peut excéder 5 mètres par rapport au sol naturel.\n11.5    REGLES PARTICULIERES\n11.5.1 Les conduits (de cheminées, de fumée, d’aération, de ventilation et d’extraction)\n    relèvent du code de la construction et de l’habitation, de l’arrêté du 22 octobre 1969 et\n    du règlement sanitaire départemental.\n    Ces équipements sont traités en harmonie avec les façades de la construction et\n    doivent être intégrés au maximum dans le noyau des nouvelles constructions.\n11.5.2 Pour annexes contigües à la construction principale,
