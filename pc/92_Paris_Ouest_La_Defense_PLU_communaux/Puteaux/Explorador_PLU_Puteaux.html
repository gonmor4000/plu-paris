les matériaux et couleurs\n    employés doivent êtres similaires à celle-ci. Pour les autres annexes, le bois peut être\n    autorisé.\n11.5.3 Les citernes ou autre pompe à chaleur sont implantées de telle manière qu’elles ne\n    soient pas visibles depuis la voie.\n11.5.4    Il n’est pas fixé de règles pour les constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif. Pour les antennes relais se référer à l’article 6.2\n    des dispositions générales.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA   29","11.6   ELEMENTS BATIS A PROTEGER\n    Tous travaux réalisés sur des éléments bâtis localisés au plan de zonage (pièce n°5\n    du dossier de PLU) faisant l’objet d’une protection au titre de l’article L. 151-19 du\n    code de l’urbanisme doivent être conçu dans le respect des caractéristiques à\n    préserver et à mettre en valeur qui ont prévalu à leur identification telles qu’elles\n    figurent dans l’annexe H du présent règlement.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA   30","ARTICLE UA12 : STATIONNEMENT\n12.1   REGLES GENERALES\n12.1.1 Le stationnement des véhicules correspondant aux besoins des constructions,\n    extensions et installations autorisées dans la zone, est assuré en dehors des voies\n    publiques sur des emplacements aménagés à cet effet.\n    Pour les constructions et installations nouvelles destinées au commerce et à l’artisanat,\n    des aires de stationnement, de manœuvre, de chargement et de déchargement des\n    véhicules lourds de livraison doivent être prévues hors emprises publiques.\n12.1.2 Pour les constructions à usage d’habitation de type maisons de ville ou immeubles\n    collectifs de moins de 5 logements, les stationnements peuvent être réalisés dans le\n    volume de la construction ou dans des annexes au rez-de-chaussée ou en sous-sol.\n    Pour toutes les autres constructions, les stationnements sont réalisés en sous-sol. Les\n    stationnements peuvent aussi être réalisés selon les dispositions de l’article 12.2.1 du\n    présent article.\n12.1.3 Aucune place de stationnement ne peut être supprimée à moins de respecter les règles\n    de l’article 12.1.\n12.1.4 Pour les constructions d’habitation dont les surfaces de planchers totales sont\n    inférieures ou égales à 1000 m² SDP, il n’est pas imposé de règles en matière de\n    stationnement des véhicules et 2 roues motorisées.\n12.1.5 Tableau de répartition par type de construction et installation :\n   Les normes de stationnement ne s’appliquent qu’aux seules constructions neuves.\n    NORME\n   DESTINATION ET    NATURE    DE    LA    NORME PLAFOND\n    PLANCHER\n   CONSTRUCTION    (maximum)\n    (minimum)\n   Habitation (SDP > 1000 m²) :\n    • logement >25 m²    1 place/logement\n    •   logement financés par un prêt aidé\n    de l’Etat > 25m²    Aucune place\n    Pas de norme\n    •   logement situé à moins de 500    plafond\n    mètres d’une gare ou d’une station    0,5 place/logement\n    de transport en commun\n    •   logement ≤25 m²    Aucune place\n    1 place pour 4    Pas de norme\n    Résidences * :\n    logements    plafond\n    1 place/10    Pas de norme\n    Hébergement hôtelier :\n    chambres    plafond\n    Bureaux :\n    •   à plus de 500m d’une gare ou d’une    Automobiles : 1 place\n    8% de la SDP\n    station de transport en commun    pour 70m² de SDP\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA   31","    Dont 1% pour les 2    2 roues** : Pas de\n    roues**    norme plafond\n    Automobiles : 1 place\n    •   à 500m ou moins d’une gare ou\n    pour 90m² de SDP\n    d’une station de transport en\n    2 roues** : pas de\n    commun\n    norme plafond\n   Commerces :\n    Pas de norme\n   Par tranche de 100 m² au-delà de 150 m²    1\n    plafond\n   de SDP par unité commerciale\n    Artisanat :\n    Pas de norme\n    Par tranche de 100 m² au-delà de 150 m²    1\n    plafond\n    de SDP par unité d’activité\n**2 roues : motos et vélos\n    •   Le nombre de places à réaliser résultant des normes ci-dessus est, en cas de\n    décimale supérieure ou égale à 5, arrondi à l’unité supérieure.\n    •   Il est exigé une place pour chacune des tranches qu’elle soit entière ou partielle.\n    •   Lorsque les places sont données pourcentage de la SDP, leur nombre résulte de\n    la division de la surface par 28 m².\nNOTA ALIMENTATION POUR VEHICULES RECHARGEABLES\nL'équipement de dispositifs de raccordement techniques nécessaires à l’alimentation de prises de\nrecharges pour les véhicules électriques ou hybrides permettant un comptage individuel est\nobligatoire pour certaines nouvelles constructions dotées de places de stationnement énoncées à\nl’article L.111-5-2 du code de la construction et de l’habitation\n12.1.6 Pour tous les programmes de constructions, il est exigé un minimum de 2% (5% pour\n    les programmes de logements) de place de stationnement pour les personnes à\n    mobilité réduites (PMR). Ces places doivent avoir les dimensions minimales suivantes :\n    •   Largeur : 3,30 m\n    •   Longueur : 5,00 m\n    Celles-ci pourront être associées 2 à 2 avec une largeur de dégagement latérale\n    commune d’au minimum 0,80 m.\n12.1.7 Pour toutes les constructions neuves d’habitation, le stationnement des motocyclettes\n    doit représenter au minimum 1 % de la SDP et se situer en sous-sol, soit sur des\n    emplacements spécifiques, soit en combinaison des stationnements automobiles.\n12.1.8 Pour toutes les constructions neuves d’habitation, des locaux fermés et spécifiques,\n    pour entreposer les vélos et les poussettes doivent s’implanter dans le volume de la\n    construction en rez-de-chaussée ou en sous-sol. Ces locaux doivent représenter au\n    total une surface de 2% minimum de la SDP de la construction.\n12.1.9 Les places de stationnement commandées ne sont pas prises en compte dans le calcul\n    du nombre de places de stationnement à créer. Leur prise en compte dans le mode\n    calcul est autorisée à la seule condition d’être communes à un seul et même logement.\nNota : Les normes définies dans cet article, notamment celles relatives au stationnement des\n    vélos, doivent, par ailleurs, respecter les dispositions en vigueur inscrites, à la\n    délivrance du permis de construire, dans le code de la construction et de l’habitation et\n    les arrêtés d’application.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA   32","12.2   REGLES PARTICULIERES\n12.2.1 En cas d’impossibilité architecturale ou technique d’aménager sur le terrain de\n    l’opération le nombre d’emplacements nécessaires au stationnement, le bénéficiaire\n    peut être autorisé à solliciter l’application de l’article L.151-33 du Code de l’Urbanisme\n    si ces stationnements sont réalisés dans le volume d’une construction, dans des\n    annexes au rez-de-chaussée ou en sous-sol.\n12.2.2 Il n’est pas fixé de règles pour les constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif.\nARTICLE UA13 : ESPACES LIBRES ET PLANTATIONS\n13.1   REGLES GENERALES\n13.1.1 Les plantations existantes doivent être maintenues en bon état de conservation.\n    Cependant l’abattage d’arbres est autorisé s’il est indispensable à l’implantation des\n    constructions ou à l’établissement d’un accès.\n13.1.2 Tout arbre abattu doit être remplacé sur le terrain par un arbre à développement\n    équivalent. Cependant, les projets de constructions ne doivent pas porter atteinte aux\n    arbres remarquables identifiés au plan de zonage.\n13.1.3 Tout projet de construction neuve entraîne l’obligation de traiter 30% au moins de la\n    superficie du terrain en espace vert en pleine terre, avec au minimum la plantation d’un\n    arbre par tranche de 200 m² de terrain.\n13.1.4 Lors de tout projet de construction, les plantations d’arbres sur le domaine public\n    doivent être préservées.\n13.2   REGLES PARTICULIERES\n13.2.1 Lors de la création de jardins sur dalle au rez-de-chaussée ou en terrasse, une hauteur\n    minimum de 0,50 mètres pour l’engazonnement et de 1 mètre pour la plantation\n    d’arbres doit être prévue.\n13.2.2 En cas d’emprise au sol supérieure ou égale à 80%, en application de l’article 9.2.1, il\n    n’y a pas d’obligation de création d’espaces verts, ni de plantation d’arbre.\n13.2.3 Les dispositions du présent article ne sont pas applicables pour les constructions ou\n    installations nécessaires aux services publics ou d’intérêt collectif.\n13.2.4 Si l’emprise au sol des constructions dépasse 60%, tout projet de construction entraîne\n    l’obligation de traiter 15% au moins de la superficie du terrain en espace vert, avec au\n    minimum la plantation d’un arbre par tranche de 200 m² de terrain.\n13.2.5 En secteur UAc, en cas de construction sur dalle, il n’est pas fixé d’exigence en matière\n    de plantation d’arbres mais 20% de la surface sur dalle doit être végétalisée.\nARTICLE UA14 : COEFFICIENT D’OCCUPATION DU SOL (COS)\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA   33","Sans objet.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA   34","ARTICLE  UA15 : PERFORMANCES    ENERGETIQUES    ET\nENVIRONNEMENTALES\nLa consommation énergétique des constructions nouvelles d’immeubles collectifs de\nlogements, de bureaux et les CINASPIC*, doit être inférieure de 10% à l’objectif fixé dans la\nRT 2012 (soit une performance augmentée de 10% par rapport à la RT2012).\nARTICLE UA16 :  INFRASTRUCTURES    ET    RESEAUX    DE\nCOMMUNICATIONS ELECTRONIQUES\nUne construction ou une installation nouvelle, doit pouvoir être raccordée au réseau public ou\nprivé de communications électroniques. Les fourreaux de raccordement doivent être enfouis.\n    Plan Local d’Urbanisme – Modification n°5 - Règlement – Zone UA    35","    Ville de Puteaux\nCHAPITRE 2 : ZONE UD\nCARACTERE ET VOCATION DE LA ZONE\nCette zone, de type pavillonnaire, est constituée principalement d’habitations individuelles. Le\ntissu parcellaire est de faible densité.\nARTICLE UD1 :    OCCUPATIONS    ET    UTILISATIONS    DU    SOL\nINTERDITES\n1.1    Les constructions destinées à l’hébergement hôtelier.\n1.2    Les constructions destinées aux bureaux.\n1.3    Les constructions destinées à l’industrie.\n1.4    Les constructions destinées à l’exploitation agricole ou forestière.\n1.5    Les constructions destinées à la fonction d’entrepôt.\n1.6    Les terrains de camping et de caravanage, ainsi que ceux affectés à l’implantation\n    d’habitations légères de loisirs dans le cadre des articles R 444-1 à R 444-2 du Code\n    de l’Urbanisme, ainsi que le stationnement des caravanes isolées au sens des articles\n    R.443-4 et R.443-5 du Code de l’Urbanisme.\n1.7    Les affouillements, exhaussements des sols, exploitations des carrières, qui ne sont\n    pas nécessaires à des travaux de construction ou nécessaires au fonctionnement du\n    service public.\n1.8    Les dépôts de ferrailles, de matériel ou de matériaux de quelque nature que ce soit,\n    ainsi que les entreprises de cassage de voitures, la transformation de matériaux de\n    récupération et constructions provisoires ou mobiles, sauf si celles-ci sont liées au\n    fonctionnement d’un chantier en cours ou d’un équipement d’intérêt général. Les\n    dépôts de quelque nature que ce soit (ferrailles, véhicules désaffectés, déchets,\n    ordures, combustibles solides ou liquides, etc.).\nARTICLE UD2 : OCCUPATIONS ET UTILISATIONS    DU    SOL\nSOUMISES A CONDITIONS PARTICULIERES\n2.1    L’extension et la transformation des constructions et installations existantes destinées\n    à l’hébergement hôtelier, au commerce, aux bureaux, à l’artisanat comportant ou non\n    des installations classées sont autorisées à condition :\n    • Qu’ils satisfassent à la réglementation en vigueur les concernant et à condition\n    qu’après travaux, il ne subsiste plus pour le voisinage de risques importants pour\n    la sécurité (incendie, explosion, etc.) ou de nuisances inacceptables (émanations\n    nocives, malodorantes, fumées, bruits, poussières, altération des eaux) de nature\n    à rendre indésirables de tels établissements dans la zone.\n    • Que leur volume et leur aspect extérieur sont compatibles avec le milieu\n    environnant.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UD   36","    Ville de Puteaux\n    •    Qu’ils puissent être desservis normalement par les infrastructures et équipements\n    existants.\n    •    Et que l’extension des locaux existants ne dépasse pas 20% de la SDP existante\n    à l’approbation du PLU.\n2.2    Le changement de destination des bâtiments existants sous réserve que la nouvelle\n    destination respecte les prescriptions de l’article UD1.\n2.3    La surélévation, la réhabilitation et l’extension des bâtiments existants à usage\n    d’habitation collective, à condition :\n    • Que les travaux ne soient pas de nature à nuire au caractère de l’ensemble de la\n    rue.\n    • Que les constructions mitoyennes soient en bon état de conservation.\n2.4    INSTALLATIONS CLASSEES POUR LA PROTECTION DE L’ENVIRONNEMENT\n2.4.1   Pour toutes les installations classées quels que soient les régimes auxquels elles sont\n    soumises, leur implantation, aménagement ou extension est autorisé aux conditions\n    suivantes :\n    - qu’elles correspondent à des besoins nécessaires à la vie et à la commodité des\n    habitants,\n    - que les nuisances (émanations nocives ou malodorantes, fumées, bruits,\n    poussières, altération des eaux, etc..) et dangers (risques d’incendie, explosion,\n    etc.) puissent être prévenus et évités de façon satisfaisante eu égard à\n    l’environnement de la zone sans dommages graves ou irréparables aux personnes\n    et aux biens,\n    - et que leurs exigences de fonctionnement soient compatibles avec les\n    infrastructures existantes, notamment les voiries et l’assainissement.\n2.4.2 Les ouvrages techniques d’infrastructure (poste transformateur, poste de détente gaz,\n    etc.) sont autorisés nonobstant les dispositions des articles UD3 à UD14, et à condition\n    qu’ils ne compromettent pas l’environnement des unités foncières voisines.\n2.5    PROTECTION DU PATRIMOIN BATI\n    Les éléments de paysage bâtis faisant l’objet d’une protection au titre de l’article L.\n    151-19 du code de l’urbanisme, tels qu’identifiés au plan de zonage (pièce n°5 du\n    dossier de PLU) et listés à l’annexe H du présent règlement font l’objet de dispositions\n    particulières aux articles 6, 7, 8 10, et 11 du règlement de la zone UD tels que définis\n    ci-après.\nARTICLE UD3 : ACCES ET VOIRIES\n3.1    ACCES\n3.1.1 Toute construction doit avoir un accès à une voie publique ou privée carrossable. Cet\n    accès doit être aménagé :\n    • Soit directement en façade sur rue (dans la limite de un accès par tranche de 30\n    mètres de façade).\n    • Soit par l’intermédiaire d’un passage privé (appendice d’accès).\n    • Soit par une servitude de passage suffisante, instituée par un acte authentique ou\n    par voie judiciaire, en application de l’article 682 du Code Civil.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UD   37","    Ville de Puteaux\n3.1.2   Cette voie doit avoir au minimum une largeur d’emprise de 3,50 mètres (3 mètres dans\n    le cas d’un accès droit d’une longueur inférieure à 50 mètres). Cette règle ne s’applique\n    pas aux constructions existantes si les travaux conduisent à une augmentation\n    inférieure à 50% de la SDP existante à la date d’approbation du PLU.\n3.1.3   Les accès doivent présenter des caractéristiques permettant de satisfaire aux\n    exigences de la sécurité, de la défense contre l’incendie et de la protection civile\n    conformément aux règlements en vigueur.\n3.1.4   Les accès ne doivent présenter aucun risque pour la sécurité des usagers des voies\n    publiques ou pour celle des personnes utilisant cet accès, eu égard à la nature et à\n    l’importance du trafic, ainsi qu’à la position et à la configuration de ces accès.\n3.1.5   Lorsqu’un terrain est desservi par plusieurs voies, toute construction ou extension peut-\n    être autorisée sous réserve que l’accès soit établi sur la voie où la gêne pour la\n    circulation est la moindre.\n3.1.6   Les accès :\n    • Ne doivent pas engendrer de modification de l’espace public existant (plantations,\n    candélabre et panneaux de signalisation), sauf en cas d’impossibilité technique\n    • Ne doivent pas être situés en face de sorties de parkings existants.\n3.2    VOIRIE\n3.2.1   Les constructions et installations doivent être desservies par des voies publiques ou\n    privées dont les caractéristiques correspondent à leur destination. Ces voies doivent\n    permettre de satisfaire aux exigences de la sécurité, de la défense contre l’incendie et\n    de la protection civile.\n3.2.2   Les voies nouvelles en impasse doivent comporter un aménagement permettant aux\n    véhicules de faire demi-tour.\n3.2.3   La création ou l’aménagement des voiries publiques ou privées ouvertes au public doit\n    respecter les prescriptions relatives à leur accessibilité aux personnes handicapées.\nARTICLE UD4 : DESSERTE PAR LES RESEAUX\nTous les réseaux et raccordements devront être enterrés.\nLa récupération et l’utilisation des eaux pluviales, ainsi que les eaux de toutes autres origines,\ndoivent respecter les exigences de la législation et de la réglementation en la matière,\nnotamment :\n    • La récupération des eaux de pluies et leur usage à l’intérieur et à l’extérieur des\n    bâtiments (arrêté du 21 aout 2008)\n    • Le contrôle des installations privatives de distribution d’eau potable, de récupération\n    des eaux de pluie ainsi que des ouvrages de prélèvement, puits et forages (arrêté du\n    17 décembre 2008 et circulaire du 9 novembre 2009)\n    • L’article 3.4 du contrat de délégation de service public de production et de distribution\n    d’eau potable\n    • Les articles 18 et 21 du règlement du service du Syndicat des eaux d’Ile-de-France.\n    • Le règlement départemental d’assainissement des Hauts de Seine en vigueur.\n4.1    ALIMENTATION EN EAU POTABLE\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UD   38","    Ville de Puteaux\n4.1.1   Toute construction ou installation nouvelle qui, par sa destination nécessite l’utilisation\n    d’eau potable, doit être alimentée par branchement à un réseau collectif de distribution\n    sous pression présentant des caractéristiques suffisantes.\n4.1.2   Le pétitionnaire doit prendre toutes les précautions pour que les installations d’eau\n    potable ne soient immergées à l’occasion d’une mise en charge d’un égout, ni que\n    puisse se produire une quelconque introduction d’eaux polluées dans ces réseaux.\n4.2    ASSAINISSEMENT\n4.2.1   Toute construction ou installation nouvelle à l’intérieur d’une même propriété, doit être\n    conçue de manière à recueillir les eaux pluviales et les eaux usées séparément. Tous\n    les raccordements aux réseaux publics seront exécutés conformément à la\n    réglementation en vigueur, en respectant les caractéristiques de ce réseau et avec\n    l’accord des autorités compétentes.\n4.2.2   Le pétitionnaire doit prendre en compte les possibilités de mises en charge des réseaux\n    publics jusqu’à la cote altimétrique de la voie publique de façon à éviter le reflux d’eaux\n    d’égout dans les caves, sous-sols et constructions situées en contrebas de la voirie\n    publique. L’orifice d’évacuation des réseaux internes doit être équipé d’un clapet anti-\n    retour. Les regards situés à des niveaux inférieurs à cette cote, et qui n’auront pu être\n    évités, doivent être rendus étanches. Un ouvrage appelé « boîte de branchement » ou\n    « regard de façade » devra être placé sous le domaine public de préférence pour la\n    nécessité de contrôle et d’entretien du branchement (article 5 du Règlement communal\n    d’assainissement).\n4.2.3   EAUX USEES\n    • L’évacuation des eaux ménagères, et des effluents non traités, dans les fossés,\n    cours d’eau ou égouts pluviaux est interdite.\n    • Le branchement au réseau d’assainissement des canalisations d’évacuation des\n    liquides industriels résiduaires doit être soumis à la réglementation en vigueur et\n    particulièrement en ce qui concerne le traitement préalable de ces liquides.\n4.2.4   EAUX PLUVIALES\n    • Les aménagements réalisés sur un terrain ne doivent pas faire obstacle au libre\n    écoulement des eaux pluviales (articles 640 et 641 du Code Civil). Lorsqu’il existe\n    un réseau collectif apte à recueillir les eaux pluviales, les aménagements sur le\n    terrain doivent garantir leur évacuation dans ledit réseau.\n    • Les aménagements réalisés sur tout terrain doivent intégrer les contraintes en\n    matière de rétention des eaux pluviales telles qu’elles garantissent un débit de\n    conforme au règlement communal d’assainissement et au règlement\n    départemental des Hauts-de-Seine. Aussi, sont mis en œuvre toutes techniques et\n    aménagements (bassins de stockage, restitution et/ou système d’infiltration..)\n    appropriés à la nature des travaux projetés, sauf en cas d’impossibilité liée la taille\n    et à la configuration du terrain.\n4.3    ELECTRICITE – GAZ – TELECOMMUNICATIONS – RESEAUX CABLES\n    Les branchements privatifs de toute nature doivent être réalisés en souterrain jusqu’en\n    limite du domaine public et ne doivent pas rester apparents sur la construction.\n    L’aménageur ou le lotisseur doit réaliser l’infrastructure nécessaire à la distribution de\n    ces différents réseaux depuis le point de raccordement général jusqu’à la limite de\n    parcelle.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UD   39","    Ville de Puteaux\nARTICLE UD5 : CARACTERISTIQUES DES TERRAINS\n    Sans objet.\nARTICLE UD6 : IMPLANTATION DES CONSTRUCTIONS    PAR\nRAPPORT AUX VOIES ET EMPRISES PUBLIQUES\nPar rapport aux voies, il sera privilégié l’implantation en retrait des nouvelles constructions\nd’au minimum 1 mètre afin de créer des jardins sur rue. De manière générale, les nouvelles\nconstructions devront respecter les alignements et les gabarits des constructions mitoyennes\nexistantes.\n6.1    REGLES GENERALES\n6.1.1 Les constructions et installations doivent s’implanter en tout ou partie soit :\n    • A l’alignement actuel des voies, ou projeté si un emplacement réservé ou une\n    marge de reculement figure au plan de zonage.\n    • En retrait d’au minimum 1 mètre par rapport à cet alignement.\n    • Dans l’alignement d’au moins une construction mitoyenne implantée en retrait.\nIl pourra être admis que des façades non rectilignes (par exemple en arrondi) s’inscrivent de\nmanière ponctuelle entre l’alignement et le retrait autorisé.\n6.2    REGLES PARTICULIERES\n6.2.1 Pour les constructions existantes ne respectant pas les conditions de l’article 6.1.1 :\n    • La surélévation est autorisée dans le prolongement des murs existants.\n6.2.2   Les construction ou installations nécessaires au service public ou d’intérêt collectif\n    peuvent s’implanter à l’alignement ou en retrait d’au minimum 1 mètre quelles que\n    soient les implantations des constructions mitoyennes.\n6.3    ELEMENTS BATIS A PROTEGER\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UD   40","    Ville de Puteaux\n    Tous travaux réalisés sur des éléments bâtis localisés au plan de zonage (pièce n°5\n    du dossier de PLU) faisant l’objet d’une protection au titre de l’article L. 151-19 du\n    code de l’urbanisme peuvent bénéficier d’une implantation dérogatoire nécessaire à\n    la préservation des caractéristiques à préserver et à mettre en valeur qui ont prévalu\n    à leur identification telles qu’elles figurent dans l’annexe H du présent règlement.\nARTICLE UD7 : IMPLANTATION DES    CONSTRUCTIONS    PAR\nRAPPORT AUX LIMITES SEPARATIVES\n7.1    REGLES GENERALES\n7.1.1   Dans une bande de 20 mètres à compter de l’alignement actuel ou projeté, les\n    constructions peuvent s’implanter sur les limites séparatives ou en retrait. Si elles s’en\n    écartent, elles doivent respecter les dispositions de l’article 7.1.2.. En cas\n    d’implantation sur limites séparatives, des retraits sont acceptés à compter du 2ème\n    niveau d’au moins 2 mètres par rapport à la limite séparative latérale en cas de façade\n    sans ouverture et d’au moins 4 mètres en cas de façade avec ouverture(s).\n7.1.2   Au-delà de la bande de 20 mètres définie à l’article 7.1.1, les constructions sont\n    interdites sur les limites séparatives. Elles doivent s’implanter en retrait des limites\n    d’une distance minimale égale à :\n    • la hauteur de façade de la construction déterminée à l’égout du toit, avec un\n    minimum de 6 mètres si la largeur du terrain au droit de la construction est\n    inférieur ou égale à 15 mètres.\n    • La moitié de la hauteur de façade de la construction déterminée à l’égout du toit\n    avec un minimum de 6 mètres si la largeur du terrain au droit de la construction\n    est supérieure à 15 mètres.\n7.1.3   Les pignons, implantés sur les limites séparatives ne doivent pas comporter de baies,\n    sauf :\n    • Les baies bénéficiant de servitudes de vues instituées par acte authentique ou par\n    voie judiciaire, en application de l’article du Code Civil sur les propriétés voisines.\nNOTA : Les jours de souffrance existants situés sur les limites séparatives doivent être pris en\ncompte dans tout projet de construction de manière à ne pas les occulter.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UD   41","    Ville de Puteaux\n7.1.4   Les balcons, lucarnes et autre élément de construction en toiture, ne sont pas pris en\n    compte pour le calcul des prospects.\n7.2    REGLES PARTICULIERES\n7.2.1   La surélévation d’une construction existante ne respectant pas cet article est autorisée\n    à condition qu’elle se fasse dans le prolongement des murs existants, et sans création\n    d’ouverture.\n7.2.2   Les constructions peuvent être implantées à une distance moindre que celles définies\n    à l’article 7.1.2 avec un minimum de 3 mètres, lorsque les deux propriétaires voisins,\n    par un acte authentique, s’obligent réciproquement à créer une servitude de cour\n    commune. En l’absence d’un accord amiable, il pourra être l’application des\n    dispositions de l’article L. 451-1 du Code de l’Urbanisme.\n7.2.3   En cas d’emprise au sol jusqu’à 100% en raison de l’application de l’article 9.2.1,\n    l’implantation des constructions peut être réalisée sur toutes ou parties des limites\n    séparatives.\n7.2.4   Les constructions ou installations nécessaires au service public ou d’intérêt collectif\n    peuvent s’implanter soit sur les limites séparatives, soit en retrait d’au moins 1 mètre.\n7.3    ELEMENTS BATIS A PROTEGER\n    Tous travaux réalisés sur des éléments bâtis localisés au plan de zonage (pièce n°5\n    du dossier de PLU) faisant l’objet d’une protection au titre de l’article L. 151-19 du\n    code de l’urbanisme peuvent bénéficier d’une implantation dérogatoire nécessaire à\n    la préservation des caractéristiques à préserver et à mettre en valeur qui ont prévalu\n    à leur identification telles qu’elles figurent dans l’annexe H du présent règlement.\nARTICLE UD8 : IMPLANTATION DES CONSTRUCTIONS LES UNES\nPAR RAPPORT AUX AUTRES SUR UNE MEME PROPRIETE\n8.1    REGLES GENERALES\n8.1.1   Les bâtiments non contigus situés sur une même parcelle doivent être implantés à une\n    distance « L » comptée horizontalement en tout point de la façade et définie comme\n    suit :\n    • Égale à la hauteur à l’égout de la façade la plus haute par rapport au sol après\n    travaux avec un minimum de 20 mètres.\n8.1.2   Les balcons, lucarnes et autre élément de construction en toiture, ne sont pas pris en\n    compte pour le calcul des prospects.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UD   42","    Ville de Puteaux\n8.2    REGLES PARTICULIERES\n8.2.2   Il n’est pas fixé de règles pour les constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif.\n8.2.2   L’article 8.1.1 ne s’applique pas aux constructions annexes inférieures à 10 m² et dont\n    la hauteur totale de la construction est inférieure à 3 mètres. La distance est alors au\n    minimum de 0,5 mètre.\n8.3    ELEMENTS BATIS A PROTEGER\n    Tous travaux réalisés sur des éléments bâtis localisés au plan de zonage (pièce n°5\n    du dossier de PLU) faisant l’objet d’une protection au titre de l’article L. 151-19 du\n    code de l’urbanisme peuvent bénéficier d’une implantation dérogatoire nécessaire à\n    la préservation des caractéristiques à préserver et à mettre en valeur qui ont prévalu\n    à leur identification telles qu’elles figurent dans l’annexe H du présent règlement.\nARTICLE UD9 : EMPRISE AU SOL\n9.1    REGLES GENERALES\n    L’emprise au sol des constructions ne peut excéder 50% de la superficie du terrain,\n    compris les bâtiments annexes (appentis, cabanons, locaux techniques ou d’ordures\n    ménagères) et déduction faite des surfaces destinées aux circulations piétonnes et à\n    des opérations de voirie.\n9.2    REGLES PARTICULIERES\n9.2.1   L’emprise au sol peut être portée à 100 % pour les constructions ou installations\n    nécessaires aux services publics ou d’intérêt collectif.\n9.2.2   Dans le cas d’un bâtiment existant ne respectant pas l’article 9.1, la surélévation est\n    autorisée à condition du respect des autres articles du présent règlement.\nARTICLE UD10 : HAUTEUR MAXIMALE DES CONSTRUCTIONS\n10.1    DEFINITION ET MODE DE CALCUL DE LA HAUTEUR\n10.1.1 La hauteur des constructions est définie :\n    • Soit comme une hauteur maximale (faîtage ou acrotère).\n    • Soit par une référence à l’égout du toit.\n    • Soit en nombre de niveaux.\n    • Soit en référence à une cote exprimée par rapport au Nivellement Général de la\n    France (NGF).\n10.1.2 La hauteur de la construction est mesurée à partir du niveau fini du trottoir jusqu’au\n    point de référence le plus élevé du bâtiment (faîtage), les ouvrages techniques,\n    cheminées et autres superstructures de faible emprise étant exclus.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UD   43","    Ville de Puteaux\n10.1.3 Dans le cas d’un terrain en pente, le niveau de référence est la moyenne du point le\n    plus haut et du point le plus bas du terrain.\nNOTA : Les combles mentionnés à l’article 10 ne doivent être composés que d’un seul niveau\nde plancher éclairé.\n10.2   REGLES GENERALES\n10.2.1 Dans une bande de 20 mètres à compter de l’alignement, la hauteur totale des\n    constructions ne peut excéder 4 niveaux (R+2+Combles) soit 9 mètres à l’égout du toit\n    et 12 mètres au faîtage. Cette hauteur peut être portée à 5 niveaux (R+3+C), sans\n    pouvoir dépasser 15 mètres au faîtage sous réserve de respecter l’architecture du bâti\n    existant et une insertion harmonieuse vis-à-vis des constructions existantes.\n10.2.2 Au-delà d’une bande de 20 mètres à compter de l’alignement, la hauteur totale des\n    nouvelles constructions ne peut excéder 7 mètres au faîtage (3 m à l’égout).\n10.3   REGLES PARTICULIERES\n    La hauteur maximale est portée à 12 m à l’égout du toit et à 15 mètres au faîtage pour\n    les constructions ou installations nécessaires au service public ou d’intérêt collectif.\n10.4   ELEMENTS BATIS A PROTEGER\n    Tous travaux réalisés sur des éléments bâtis localisés au plan de zonage (pièce n°5\n    du dossier de PLU) faisant l’objet d’une protection au titre de l’article L. 151-19 du\n    code de l’urbanisme peuvent bénéficier d’une altimétrie dérogatoire nécessaire à la\n    préservation des caractéristiques à préserver et à mettre en valeur qui ont prévalu à\n    leur identification telles qu’elles figurent dans l’annexe H du présent règlement.\nARTICLE UD11 : ASPECT EXTERIEUR DES CONSTRUCTIONS\n    •    Les constructions, par leur situation, leur architecture, leurs dimensions, l’aspect\n    extérieur des bâtiments ou ouvrages à édifier ou à modifier, ne doivent pas porter\n    atteinte au caractère ni à l’intérêt des lieux avoisinants, aux sites, aux paysages\n    naturels, urbains ainsi qu’à la conservation des perspectives monumentales (article\n    R.111-21 du Code de l’Urbanisme).\n    •    Un parti architectural privilégiant une composition verticale classique de la façade\n    devra être observé pour toute nouvelle construction, et ce afin de conserver une\n    morphologie du tissu urbain qui identifie clairement des séquences courtes,\n    composées et articulées, excluant l’uniformité, y compris sur les projets regroupant\n    plusieurs unités foncières.\n    •    Tout projet de construction devra s’inscrire dans un gabarit et/ou une hauteur en\n    cohérence avec son environnement et les constructions mitoyennes ou voisines\n    existantes. Les schémas ci-dessous montrent les gabarits à respecter.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UD   44","    Ville de Puteaux\n11.1   FACADES\n11.1.1 Les murs ont un aspect pierre de taille naturelle. En cas de dispositif de mur végétal,\n    la pierre de taille naturelle n’est pas exigée.\n11.1.2 Dans le cadre d’un ravalement La texture des enduits et peintures, de même que leurs\n    teintes doivent être adaptées aux matériaux composant la façade et s’accorder\n    harmonieusement à l’aspect des constructions avoisinantes.\n11.1.3 Sont interdits :\n    • L’emploi à nu de matériaux destinés à être recouverts d’un revêtement ou d’un\n    enduit (briques creuses, carreaux de plâtre, parpaings, etc.).\n    • Toute installation réalisée avec des moyens précaires ou dits « de fortune ».\n11.1.4 Tous travaux doivent chercher à respecter l’aspect d’origine ou améliorer la volumétrie\n    de la partie supérieure des constructions. L’adjonction de volumes bâtis (lucarnes,\n    prolongements de façades, vérandas…) ne peut être autorisée que dans la mesure où\n    ils s’intègrent de façon harmonieuse dans la composition d’ensemble.\n11.1.5 La hauteur et l’aspect du soubassement doivent être traités, sur un ou plusieurs\n    niveaux, en accord avec celui des constructions voisines et selon l’échelle de la\n    construction.\n11.1.6 La mise en valeur des façades doit être recherchée à travers la restitution de matériaux\n    d’origine, de reliefs (bow-windows, oriels, modénatures…), d’accessoires ou de décors\n    anciens disparus.\n11.1.7 Les portes d’accès aux parcs de stationnements, les sas ouverts ainsi que les entrées\n    piétonnes doivent comporter une fermeture dans le plan de la façade, sauf impossibilité\n    manifeste liée à des impératifs techniques de sécurité. Leur traitement doit bénéficier\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UD   45","    Ville de Puteaux\n    d’un soin particulier de mise en valeur, que ce soit au niveau des matériaux (aspect\n    bois, métal laqué..) que de par son écriture architecturale. Elles doivent avoir, sur une\n    même façade, une similitude d’aspect. Les ouvrants doivent être à un ou deux vantaux,\n    sauf impossibilité technique et/ou architecturale.\n11.1.8 Les pignons sont traités avec le même soin que les façades principales.\n11.1.9 Les postes de transformation électrique et les postes de détente gaz doivent être\n    intégrés dans le volume de la construction (sauf cas d’impossibilité technique), en\n    prenant en compte en particulier les matériaux et les couleurs des constructions\n    avoisinantes.\n11.2   TOITURES\n11.2.1 Les combles et toitures doivent présenter une simplicité de volume et une unité de\n    conception. Les toitures des constructions sont composées :\n    • Soit d’une ou plusieurs pentes ou éléments à versants symétriques.\n    • Soit d’une seule pente pour motif architectural ou pour les annexes.\n    • Soit de rotondes ou éléments arrondis.\n11.2.2 Ces dispositions peuvent ne pas être imposées en cas d’adjonction à une construction\n    existante.\n11.2.3 Les matériaux autorisés en toiture sont notamment de type :\n    • Aspects Tuiles.\n    • Aspects Ardoises\n    • Aspects Zinc.\n11.2.4 Les panneaux solaires sont autorisés en toiture à condition d’être non réfléchissants,\n    implantés dans la pente de celle-ci, le tout sans aller au-delà de la hauteur autorisée.\n    Sur les toitures terrasses, les panneaux doivent-êtres implantés en retrait des façades\n    d’au moins 1 mètre, sans pouvoir dépasser 3 mètres de hauteur totale.\n11.2.5 L’éclairement éventuel des combles est assuré par des ouvertures en lucarnes, soit\n    par des châssis de toit dans le plan des versants, soit par des fenêtres en pignons, si\n    les règles de prospect le permettent.\n11.2.6 Il pourra être admis une terrasse en tout ou partie de la toiture d’une construction neuve\n    dans les conditions suivantes :\n    • Si la terrasse est accessible, elle doit être de plain-pied accessible depuis le\n    logement et en constituer un espace d’agrément.\n    • Si la terrasse est inaccessible, elle doit être entièrement végétalisée en répondant\n    aux critères de Haute Qualité Environnementale (HQE).\n    • Dans tous les cas, la création de terrasse ne doit pas dénaturer l’aspect général de\n    la construction.\n    Les tropéziennes (voir définition en annexes) sont interdites.\n11.2.7 Les descentes d’eau pluviales sont intégrées au volume de la construction et non\n    apparentes en façade sur rue. Les chenaux sont intégrés dans une corniche ou tout\n    autre élément de modénature ou de construction les rendant invisibles depuis la rue.\n    Tout rejet direct des eaux de pluie depuis les balcons ou les terrasses est interdit, un\n    dispositif de récupération de ces eaux dans les descentes verticales doit être prévu.\n11.2.8 Les édicules et accessoires à caractère technique (caisson de climatisation,\n    extracteurs, édicules d’ascenseurs, garde-corps, antennes…), sont intégrés au volume\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UD   46","    Ville de Puteaux\n    général de la construction afin d’en limiter l’impact visuel depuis le voisinage immédiat\n    ainsi que depuis le domaine public. Le traitement doit se faire en harmonie avec la\n    construction (couleurs, matériaux…).\n11.3   ANTENNES\n11.3.10    Les antennes d’émission ou de réception (radios, télévisions, radios-\n    téléphones) doivent être implantées de manière à réduire l’impact visuel et esthétique.\n    Elles ne comptent pas dans le calcul de la hauteur totale définit à l’article UD10, sauf\n    dispositions contraires stipulées aux servitudes d’utilité publique (annexes 6b).\n    Pour les antennes relais se référer à l’article 6.2 des dispositions générales.\n11.4   CLOTURES\n11.4.1 CLOTURES SUR VOIES\n    • Elles doivent s’inscrire en cohérence avec les éléments similaires du même\n    alignement ou de la rue, soit par analogie de composition, de matériaux ou de\n    hauteur.\n    • La hauteur maximale de la clôture sera de 3 mètres, toutefois, l’entretien et la\n    restauration des murs anciens en maçonnerie d’une hauteur supérieure sont\n    admis. En cas de terrain en pentes, la hauteur moyenne de pourra excéder 3,50\n    m.\n    • Elles sont constituées soit :\n    - d’un mur bahut en maçonnerie ou enduite surmonté d’une grille métallique à\n    barreaudages verticaux, composée d’éléments ouvragés et/ou ponctuels.\n    - d’un mur plein lorsqu’il constitue le prolongement de la construction ou permet la\n    continuité d’un front bâti, réalisé en matériaux destinés à rester apparents (pierre\n    de taille, moellon, briques pleines jointoyées, etc.) ou recouverts d’un enduit\n    identique à celui de la construction principale.\n11.4.2 CLOTURES EN LIMITES SEPARATIVES\n    • La hauteur maximale de la clôture sera de 3 mètres, toutefois, l’entretien et la\n    restauration des murs anciens en maçonnerie d’une hauteur supérieure sont\n    admis. En cas de terrains en pentes, la hauteur moyenne ne pourra excéder 3,50\n    m.\n    • Les clôtures sont constituées soit :\n    - d’un mur bahut en maçonnerie ou enduite surmonté d’une grille métallique à\n    barreaudages verticaux, composée d’éléments ouvragés et/ou ponctuels.\n    - d’un mur plein réalisé en matériaux destinés à rester apparents (pierre de taille,\n    moellon, briques pleines jointoyées, etc.) ou recouverts d’un enduit identique à celui\n    de la construction principale.\n    - d’une clôture ajourée toute hauteur.\n11.5   REGLES PARTICULIERES\n11.5.1 Les conduits (de cheminées, de fumée, d’aération, de ventilation et d’extraction)\n    relèvent du code de la construction et de l’habitation, de l’arrêté du 22 octobre 1969 et\n    du règlement sanitaire départemental.\n    Ces équipements sont traités en harmonie avec les façades de la construction.\n11.5.2 Pour annexes contigües à la construction principale, les matériaux et couleurs\n    employés doivent êtres similaires à celle-ci. Pour les autres annexes, le bois est\n    autorisé.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UD   47","    Ville de Puteaux\n11.5.3 Les citernes ou autre pompe à chaleur sont implantées de telle manière qu’elles ne\n    soient pas visibles depuis la voie.\n11.5.4 Il n’est pas fixé de règles pour les constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif. Pour les antennes relais se référer à l’article 6.2\n    des dispositions générales.\n11.6   ELEMENSTS BATIS A PROTEGER\n    Tous travaux réalisés sur des éléments bâtis localisés au plan de zonage (pièce n°5\n    du dossier de PLU) faisant l’objet d’une protection au titre de l’article L. 151-19 du\n    code de l’urbanisme doivent être conçu dans le respect des caractéristiques à\n    préserver et à mettre en valeur qui ont prévalu à leur identification telles qu’elles\n    figurent dans l’annexe H du présent règlement.\nARTICLE UD12 : STATIONNEMENT\n12.1   REGLES GENERALES\n12.1.1 Le stationnement des véhicules correspondant aux besoins des constructions,\n    extensions et installations autorisées dans la zone, est assuré en dehors des voies\n    publiques sur des emplacements aménagés à cet effet.\n12.1.2 Tous les stationnements doivent être réalisés dans le volume, dans le prolongement\n    de la construction, en sous-sol ou selon les dispositions de l’article 12.2.1 du présent\n    article.\n12.1.3 Aucune place de stationnement ne peut être supprimée à moins de respecter les\n    dispositions de l’article 12.1.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UD   48","    Ville de Puteaux\n12.1.4 Tableau de répartition par type de construction et installation :\n    NORME\n   DESTINATION ET NATURE DE LA    NORME PLAFOND\n    PLANCHER\n   CONSTRUCTION    (maximum)\n    (minimum)\n    Habitation (SDP > 1000 m²) :\n    • logement >25 m²    1 place/logement\n    • logement financés par un prêt aidé    0,5 place/logement\n    Pas de norme\n    de l’Etat > 25m² et situé à moins de    plafond\n    500m d’une gare de transport en\n    commun\n    • logement ≤25 m²    Aucune place\n    1 place pour 4    Pas de norme\n    Résidences * :\n    logements    plafond\n   Commerces :\n    Pas de norme\n   Par tranche de 100 m² au-delà de 150 m²    1\n    plafond\n   de SDP par unité commerciale\n   Artisanat :\n    Pas de norme\n   Par tranche de 100 m² au-delà de 150 m²    1\n    plafond\n   de SDP par unité d’activité\n    •   Le nombre de places à réaliser résultant des normes ci-dessus est, en cas de\n    décimale supérieure ou égale à 5, arrondi à l’unité supérieure.\n    •   Il est exigé une place pour chacune des tranches qu’elle soit entière ou partielle.\n    •   Lorsque les places sont données pourcentage de la SDP, leur nombre résulte de\n    la division de la surface par 28 m².\nNOTA ALIMENTATION POUR VEHICULES RECHARGEABLES\nL'équipement de dispositifs de raccordement techniques nécessaires à l’alimentation de prises de\nrecharges pour les véhicules électriques ou hybrides permettant un comptage individuel est\nobligatoire pour certaines nouvelles constructions dotées de places de stationnement énoncées à\nl’article L.111-5-2 du code de la construction et de l’habitation\n12.1.5 Pour tous les programmes de constructions de plus de 5 logements, il doit être\n    aménagé 1 place de stationnement à l’intention des personnes handicapées par\n    tranche de 20 places avec un minimum de 1 place par programme.\n12.1.6 Pour toutes les constructions neuves, le stationnement des motocyclettes doit\n    représenter au minimum 1 % de la SDP et se situer en sous-sol, soit sur des\n    emplacements spécifiques, soit en combinaison des stationnements automobiles.\n12.1.7 Pour toutes les constructions neuves de plus de 5 logements, des locaux fermés et\n    spécifiques, pour entreposer les vélos et les poussettes doivent s’implanter dans le\n    volume de la construction en rez-de-chaussée ou en sous-sol. Ces locaux doivent\n    représenter au total une surface de 2% minimum de la SDP de la construction.\nNota : Les normes définies dans cet article, notamment celles relatives au stationnement des\n    vélos, doivent, par ailleurs, respecter les dispositions en vigueur inscrites, à la\n    délivrance du permis de construire, dans le code de la construction et de l’habitation et\n    les arrêtés d’application.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UD   49","    Ville de Puteaux\n12.2   REGLES PARTICULIERES\n12.2.1 En cas d’impossibilité architecturale ou technique d’aménager sur le terrain de\n    l’opération le nombre d’emplacements nécessaires au stationnement, le bénéficiaire\n    peut être autorisé à solliciter l’application de l’article L.151-33 du Code de l’Urbanisme\n    si ces stationnements sont réalisés dans le volume, dans le prolongement de la\n    construction ou en sous-sol.\n12.2.2 Pour les constructions et installations nécessaires aux services publics ou d’intérêt\n    collectif, il n’est pas fixé de règles en matière de stationnement.\nARTICLE UD13 : ESPACES LIBRES ET PLANTATIONS\n13.1   REGLES GENERALES\n13.1.1 Les plantations existantes doivent être maintenues en bon état de conservation.\n    Cependant l’abattage d’arbres est autorisé s’il est indispensable à l’implantation des\n    constructions ou à l’établissement d’un accès.\n13.1.2 Tout arbre abattu doit être remplacé sur le terrain par un arbre à développement\n    équivalent. Cependant, les projets de constructions ne doivent pas porter atteinte aux\n    arbres remarquables identifiés au plan de zonage.\n13.1.3 Tout projet de construction neuve entraîne l’obligation de traiter 30% au moins de la\n    superficie du terrain en espace vert en pleine terre, déduction faite des alignements de\n    voirie s’il en existe, avec au minimum la plantation d’un arbre par tranche de 200 m²\n    de terrain.\n13.1.4 Lors de tout projet de construction, les plantations d’arbres sur le domaine public\n    doivent être préservées.\n13.2   REGLES PARTICULIERES\n13.2.1 Lors de la création de jardins sur dalle au rez-de-chaussée, une hauteur minimum de\n    0,50 mètres pour l’engazonnement et de 0,70 mètres pour la plantation d’arbustes doit\n    être prévue.\n13.2.2 En cas d’emprise au sol supérieure à 70%, en application de l’article 9.2.1, il n’y a pas\n    d’obligation de création d’espaces verts, ni de plantation d’arbre.\n13.2.3 Les dispositions du présent article ne sont pas applicables pour les constructions ou\n    installations nécessaires aux services publics ou d’intérêt collectif.\nARTICLE UD14 : COEFFICIENT D’OCCUPATION DU SOL (COS)\n    Sans objet.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UD   50","    Ville de Puteaux\nARTICLE  UD15 : PERFORMANCES    ENERGETIQUES    ET\nENVIRONNEMENTALES\nLa consommation énergétique des constructions nouvelles d’immeubles collectifs de\nlogements, de bureaux et les CINASPIC*, doit être inférieure de 10% à l’objectif fixé dans la\nRT 2012 (soit une performance augmentée de 10% par rapport à la RT2012).\nARTICLE UD16 :  INFRASTRUCTURES    ET    RESEAUX    DE\nCOMMUNICATIONS ELECTRONIQUES\nUne construction ou une installation nouvelle, doit pouvoir être raccordée au réseau public ou\nprivé de communications électroniques. Les fourreaux de raccordement doivent être enfouis.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UD    51","CHAPITRE 3 : ZONE UE\nCARACTERE ET VOCATION DE LA ZONE\nCette zone couvre une grande partie du quartier de La Défense, à vocation principale de\nbureaux comprenant des tours de grandes hauteurs sur dalle ainsi que des immeubles\nd’habitation, des commerces et des équipements.\nCette zone intègre deux secteurs comprenant des règles spécifiques à l’article 10 : UEa et\nUEb.\nARTICLE UE1 :    OCCUPATIONS    ET    UTILISATIONS    DU    SOL\nINTERDITES\n1.1    Les constructions destinées à l’industrie.\n1.2    Les constructions destinées à l’exploitation agricole ou forestière.\n1.3    Les constructions destinées à la fonction d’entrepôt, exception faite de celles réalisées\n    en infrastructure ou sous Dalle*.\n1.4    Les terrains de camping et de caravanage, ainsi que ceux affectés à l’implantation\n    d’habitations légères de loisirs dans le cadre des articles L.443-1 à L.443-4 du Code\n    de l’Urbanisme, ainsi que le stationnement des caravanes isolées au sens des articles\n    R.111-37 à R.111-42 du Code de l’Urbanisme.\n1.5    Les affouillements, exhaussements des sols, exploitations des carrières, qui ne sont\n    pas nécessaires à des travaux de construction ou nécessaires au fonctionnement du\n    service public.\n1.6    Les dépôts de ferrailles, de matériel ou de matériaux de quelque nature que ce soit,\n    ainsi que les entreprises de cassage de voitures, la transformation de matériaux de\n    récupération et constructions provisoires ou mobiles, sauf si celles-ci sont liées au\n    fonctionnement d’un chantier en cours ou d’une construction et installation nécessaire\n    aux services publics ou d’intérêt collectif.\nARTICLE UE2 : OCCUPATIONS ET UTILISATIONS    DU    SOL\nSOUMISES A DES CONDITIONS PARTICULIERES\n2.1    Pour toutes les installations classées quels que soient les régimes auxquels elles sont\n    soumises, leur implantation, aménagement ou extension est autorisé aux conditions\n    suivantes :\n    • Soit :\n    - qu’elles correspondent à des besoins nécessaires à la vie et à la commodité des\n    habitants,\n    - que les nuisances (émanations nocives ou malodorantes, fumées, bruits,\n    poussières, altération des eaux, etc..) et dangers (risques d’incendie, explosion,\n    etc.) puissent être prévenus et évités de façon satisfaisante eu égard à\n    l’environnement de la zone sans dommages graves ou irréparables aux personnes\n    et aux biens,\n    - et que leurs exigences de fonctionnement soient compatibles avec les\n    infrastructures existantes, notamment les voiries et l’assainissement.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UE   52","ARTICLE UE3 : ACCES ET VOIRIES\n3.1    ACCES\n3.1.1 Toute construction doit avoir un accès à une voie publique ou privée carrossable. Cet\n    accès doit être aménagé :\n    • Soit directement en façade sur rue\n    • Soit par l’intermédiaire d’un passage privé (appendice d’accès).\n    • Soit par une servitude de passage suffisante, instituée par un acte authentique ou\n    par voie judiciaire, en application de l’article 682 du Code Civil.\n    • Soit depuis une emprise publique (Dalle*)\n3.1.2   Cette voie doit avoir au minimum une largeur d’emprise de 3,50 mètres (3 mètres dans\n    le cas d’un accès droit d’une longueur inférieure à 50 mètres).\n3.1.3   Les accès doivent présenter des caractéristiques permettant de satisfaire aux\n    exigences de la sécurité, de la défense contre l’incendie et de la protection civile\n    conformément aux règlements en vigueur.\n3.1.4   Les accès ne doivent présenter aucun risque pour la sécurité des usagers des voies\n    publiques ou pour celle des personnes utilisant cet accès, eu égard à la nature et à\n    l’importance du trafic, ainsi qu’à la position et à la configuration de ces accès.\n3.1.5   Lorsqu’un terrain est desservi par plusieurs voies, toute construction ou extension peut-\n    être autorisée sous réserve que l’accès soit établi sur la voie où la gêne pour la\n    circulation est la moindre.\n3.1.6   Les accès sont réalisés pour permettre une parfaite visibilité de la voie avant la sortie\n    des véhicules et aménagés pour assurer la sécurité et la commodité des personnes à\n    mobilité réduite.\n3.2    VOIRIE\n3.2.1   Les constructions et installations doivent être desservies par des voies publiques ou\n    privées dont les caractéristiques correspondent à leur destination. Ces voies doivent\n    permettre de satisfaire aux exigences de la sécurité, de la défense contre l’incendie et\n    de la protection civile.\n4.2.5   Les voies nouvelles en impasse doivent comporter un aménagement permettant aux\n    véhicules de faire demi-tour.\n3.2.3 La création ou l’aménagement des voiries publiques ou privées ouvertes au public doit\n    respecter les prescriptions relatives à leur accessibilité aux personnes handicapées.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UE   53","ARTICLE UE4 : DESSERTE PAR LES RESEAUX\nTous les réseaux et raccordements devront être enterrés.\nLa récupération et l’utilisation des eaux pluviales, ainsi que les eaux de toutes autres origines,\ndoivent respecter les exigences de la législation et de la réglementation en la matière,\nnotamment :\n    • La récupération des eaux de pluies et leur usage à l’intérieur et à l’extérieur des\n    bâtiments (arrêté du 21 aout 2008)\n    • Le contrôle des installations privatives de distribution d’eau potable, de récupération\n    des eaux de pluie ainsi que des ouvrages de prélèvement, puits et forages (arrêté du\n    17 décembre 2008 et circulaire du 9 novembre 2009)\n    • L’article 3.4 du contrat de délégation de service public de production et de distribution\n    d’eau potable\n    • Les articles 18 et 21 du règlement du service du Syndicat des eaux d’Ile-de-France.\n    • Le règlement départemental d’assainissement des Hauts de Seine en vigueur.\n4.1    ALIMENTATION EN EAU POTABLE\n4.1.1   Toute construction ou installation nouvelle qui, par sa destination nécessite l’utilisation\n    d’eau potable, doit être alimentée par branchement à un réseau collectif de distribution\n    sous pression présentant des caractéristiques suffisantes.\n4.1.2   Le pétitionnaire doit prendre toutes les précautions pour que les installations d’eau\n    potable ne soient immergées à l’occasion d’une mise en charge d’un égout, ni que\n    puisse se produire une quelconque introduction d’eaux polluées dans ces réseaux.\n4.2    ASSAINISSEMENT\n4.2.1   Toute construction ou installation nouvelle à l’intérieur d’une même propriété, doit être\n    conçue de manière à recueillir les eaux pluviales et les eaux usées séparément. Tous\n    les raccordements aux réseaux publics seront exécutés conformément à la\n    réglementation en vigueur, en respectant les caractéristiques de ce réseau et avec\n    l’accord des autorités compétentes.\n4.2.2   Le pétitionnaire doit prendre en compte les possibilités de mises en charge des réseaux\n    publics jusqu’à la cote altimétrique de la voie publique de façon à éviter le reflux d’eaux\n    d’égout dans les caves, sous-sols et constructions situées en contrebas de la voirie\n    publique. L’orifice d’évacuation des réseaux internes doit être équipé d’un clapet anti-\n    retour. Les regards situés à des niveaux inférieurs à cette cote, et qui n’auront pu être\n    évités, doivent être rendus étanches. Un ouvrage appelé « boîte de branchement » ou\n    « regard de façade » devra être placé sous le domaine public de préférence pour la\n    nécessité de contrôle et d’entretien du branchement (article 5 du Règlement communal\n    d’assainissement).\n4.2.6   EAUX USEES\n    • L’évacuation des eaux ménagères, et des effluents non traités, dans les fossés,\n    cours d’eau ou égouts pluviaux est interdite.\n    • Le branchement au réseau d’assainissement des canalisations d’évacuation des\n    liquides industriels résiduaires doit être soumis à la réglementation en vigueur et\n    particulièrement en ce qui concerne le traitement préalable de ces liquides.\n4.2.7   EAUX PLUVIALES\n    • Les aménagements réalisés sur un terrain ne doivent pas faire obstacle au libre\n    écoulement des eaux pluviales (articles 640 et 641 du Code Civil). Lorsqu’il existe\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UE   54","    un réseau collectif apte à recueillir les eaux pluviales, les aménagements sur le\n    terrain doivent garantir leur évacuation dans ledit réseau.\n    •   Les aménagements réalisés sur tout terrain doivent intégrer les contraintes en\n    matière de rétention des eaux pluviales telles qu’elles garantissent un débit de fuite\n    conforme au règlement communal d’assainissement et au règlement\n    départemental des Hauts-de-Seine. Aussi, sont mis en œuvre toutes techniques et\n    aménagements (bassins de stockage, restitution et/ou système d’infiltration..)\n    appropriés à la nature des travaux projetés, sauf en cas d’impossibilité liée la taille\n    et à la configuration du terrain.\n4.3    ELECTRICITE – GAZ – TELECOMMUNICATIONS – RESEAUX CABLES\n    Les branchements privatifs de toute nature doivent être réalisés en souterrain jusqu’en\n    limite du domaine public et ne doivent pas rester apparents sur la construction.\n    L’aménageur ou le lotisseur doit réaliser l’infrastructure nécessaire à la distribution de\n    ces différents réseaux depuis le point de raccordement général jusqu’à la limite de\n    parcelle.\n4.4    DECHETS – ORDURES MENAGERES\n4.4.1   Toute nouvelle construction doit être pourvue d’un local correctement accessible et\n    dimensionné pour recevoir les divers conteneurs liés à la collecte sélective des ordures\n    ménagères et déchets industriels banals (DIB).\nARTICLE UE5 : CARACTERISTIQUES DES TERRAINS\n    Sans objet\nARTICLE UE6 : IMPLANTATION DES CONSTRUCTIONS    PAR\nRAPPORT AUX VOIES ET EMPRISES PUBLIQUES\n6.1    La partie de la Dalle* du centre d’affaires de La Défense appartenant au domaine public\n    est considérée comme une voie ou une emprise publique au sens du présent article.\n    En conséquence, les règles d’implantations s’appliquant au niveau dalle* sont celles\n    figurant ci-dessous.\n6.2    Les constructions pourront s’implanter, soit en limite de voie, ou en limite d’emprise\n    publique, existante, modifiée ou à créer, soit en retrait celles-ci. En cas de retrait, celui-\n    ci sera d’au moins 4 mètres par rapport l’alignement actuel ou projeté ou de l’emprise\n    publique.\n6.3    Des retraits ponctuels sur la façade, inférieurs à 4 mètres sont autorisés à condition de\n    ne représenter qu’un maximum de 20 % du linéaire total.\n6.4    Les constructions situées en dessous du niveau Dalle* ou en sous-sol sont autorisées\n    en limite des voies et emprises publiques ou en retrait d’au moins 1 mètre.\n6.5    En cas d’implantation édifiée en surplomb des voies et emprises publiques, celle-ci doit\n    être située au moins à 5 mètres au-dessus des voies ou emprises surplombées, sans\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UE   55","    pouvoir excéder 5 mètres de profondeur de saillie sur le boulevard des Bouvets, le\n    boulevard Kupka et le Pont Picasso.\n6.6    Les constructions et installations nécessaires au réseau de transport public du Grand\n    Paris, ou nécessaires à l’activité ferroviaire peuvent être implantées à l’alignement ou\n    respecter un retrait de 1m au minimum.\nARTICLE UE7 : IMPLANTATION DES    CONSTRUCTIONS    PAR\nRAPPORT AUX LIMITES SEPARATIVES\nNOTA Cas général : la limite séparative est la limite entre deux unités foncières contigües\n    ayant des propriétaires différents.\n    Dans la zone UE, la définition de la limite séparative est différente selon que :\n    -   la construction est édifiée sur un terrain ayant fait l’objet d’une division foncière,\n    -   la construction est édifiée suite à une division en volumes.\n    Dans le premier cas, celui d’une division foncière, la définition énoncée dans le cas\n    général ci-avant s’applique.\n    Dans le second cas, celui d’une division en volumes, la limite séparative est constituée\n    par la limite extérieure du volume de la construction ou, le cas échéant, du volume\n    comprenant les abords de la construction. »\n7.1    Toute construction peut s’implanter en limite ou en retrait des limites séparatives.\n7.2    En cas de retrait, celui-ci ne peut être inférieur à 8 mètres, pour les constructions\n    situées sur Dalle* et 1 mètre en cas de constructions situées sous la Dalle*.\n7.3    Pour les constructions ou installations nécessaires au service public ou d’intérêt\n    collectif implantées en retrait des limites, celui-ci ne peut être inférieur à 1 mètre.\nARTICLE UE8 : IMPLANTATION DES CONSTRUCTIONS LES UNES\nPAR RAPPORT AUX AUTRES SUR UNE MEME PROPRIETE\nLa construction de plusieurs bâtiments sur une même unité foncière ou sur Dalle* est\nautorisée, à condition qu’en tout point de chaque élément de façade, la distance mesurée\nnormalement la séparant d'un élément de façade d'un autre bâtiment, soit au moins égale à 8\nmètres.\nARTICLE UE9 : EMPRISE AU SOL\nLes infrastructures ne sont pas comptabilisées dans le calcul de l’emprise.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UE   56","ARTICLE UE10 : HAUTEUR MAXIMALE DES CONSTRUCTIONS\n10.1   DEFINITION ET MODE DE CALCUL DE LA HAUTEUR\nLa hauteur des constructions est définie en référence à une cote exprimée par rapport au\nNivellement Général de la France (NGF).\n10.2   REGLES GENERALES\nLes hauteurs maximales des constructions, exprimée en cotes NGF, sont indiquées au plan\nde zonage et sont délimitées par secteurs. Les ouvrages techniques, cheminées et autres\nsuperstructures de faible emprise étant exclus (antennes, mats, etc.).\n10.3   REGLES PARTICULIERES\nEn secteur UEa, délimité au plan de zonage, la hauteur maximale des nouvelles constructions\nexprimée en NGF peut être dépassée d’une hauteur supplémentaire de 20 mètres au\nmaximum, pour permettre la réalisation d’un élément architectural, à condition de ne pas créer\nde surface de plancher supplémentaire.\nEn secteur UEb délimité au plan de zonage, la hauteur maximale mentionnée au plan de\nzonage des constructions exprimée en NGF peut être dépassée d’une hauteur supplémentaire\nde 5 mètres pour constructions comprenant des commerces au rez-de-chaussée et /ou au 1er\nétage d’une surface minimum de 300m² (à rez-de-chaussée) ou de 750m² (total rez-de-\nchaussée et 1er étage).\nARTICLE UE11 : ASPECT EXTERIEUR\n    •   Les constructions, par leur situation, leur architecture, leurs dimensions, l’aspect\n    extérieur des bâtiments ou ouvrages à édifier ou à modifier, ne doivent pas porter\n    atteinte au caractère ni à l’intérêt des lieux avoisinants, aux sites, aux paysages\n    naturels, urbains ainsi qu’à la conservation des perspectives monumentales (article\n    R.111-21 du Code de l’Urbanisme).\n11.1   FACADES\n11.1.1 Les façades et les pignons doivent être composés de matériaux nobles (aspect pierre,\n    verre, métal, etc.). Les dispositifs de murs végétalisées sont autorisés.\n11.1.2 Sont interdits :\n    • L’emploi à nu de matériaux destinés à être recouverts d’un revêtement, d’un\n    parement ou d’un enduit (briques creuses, carreaux de plâtre, parpaings, etc.).\n    • Toute installation réalisée avec des moyens précaires ou dits « de fortune ».\n    • Les matériaux susceptibles d’occasionner un réfléchissement ou une gêne\n    anormale pour le voisinage.\n11.1.3 Les portes d’accès aux parcs de stationnements, les sas ouverts ainsi que les entrées\n    piétonnes doivent comporter une fermeture dans le plan de la façade, sauf impossibilité\n    manifeste liée à des impératifs techniques de sécurité. Leur traitement doit bénéficier\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UE   57","    d’un soin particulier de mise en valeur, que ce soit au niveau des matériaux (aspect\n    bois, métal laqué..) que de par son écriture architecturale.\n11.1.4 Les postes de transformation électrique et les postes de détente gaz doivent être\n    intégrés dans le volume de la construction (sauf cas d’impossibilité technique), en\n    prenant en compte en particulier les matériaux et les couleurs des constructions\n    avoisinantes.\n11.2   TOITURES\n11.2.1 Un soin particulier est demandé pour toutes les toitures considérées comme une\n    cinquième façade quelle que soit leur attitude. Sont donc notamment interdits les\n    aspects tôle ondulée, onduline, fibrociment, papier goudronné, béton peint, shingle et\n    de tous autres matériaux synthétiques.\n11.2.2 Les panneaux solaires ainsi que les éléments de production d’énergie renouvelable\n    sont autorisés à condition que ceux-ci soient non-réfléchissants, intégrés à la\n    composition architecturale du bâtiment, le tout sans aller au-delà de la hauteur\n    autorisée (pour les panneaux solaires).\n11.2.3 Les tropéziennes (voir définition en annexes) sont interdites.\n11.2.4 Les édicules et accessoires à caractère technique (caisson de climatisation,\n    extracteurs, édicules d’ascenseurs, etc…),\n    Pour les toitures à pentes :\n    Ils sont intégrés au volume général de la construction\n    Pour les toitures terrasses :\n    • Ils sont regroupés de manière homogène\n    • Ils sont implantés en retrait de 2 mètres minimum par rapport aux façades.\n    • Leur hauteur ne dépasse pas le niveau fini de la terrasse de plus de 2,50 mètres\n    afin d’en limiter l’impact visuel.\n    • Leur traitement doit se faire en harmonie avec la construction (couleurs,\n    matériaux…) ou être partiellement ou totalement végétalisée.\n11.2.5 Les antennes d’émission ou de réception doivent être implantées obligatoirement en\n    toiture et en retrait des façades d’au moins 2 mètres.\n11.3   REGLES PARTICULIERES\n11.3.1 Les conduits (de cheminées, de fumée, d’aération, de ventilation et d’extraction)\n    relèvent du code de la construction et de l’habitation, de l’arrêté du 22 octobre 1969 et\n    du règlement sanitaire départemental.\n    Ces équipements sont traités en harmonie avec les façades de la construction et\n    doivent être au maximum intégrés noyaux des nouvelles constructions.\n11.3.2 Il n’est pas fixé de règles pour les constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif. Pour les antennes relais se référer à l’article 6.2\n    des dispositions générales.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UE   58","ARTICLE UE12 : STATIONNEMENT\n12.1   REGLES GENERALES\n12.1.1 Le stationnement des véhicules correspondant aux besoins des constructions,\n    extensions et installations autorisées dans la zone, est assuré en dehors des voies\n    publiques sur des emplacements aménagés à cet effet.\n    Pour les constructions et installations nouvelles destinées au commerce et à l’artisanat,\n    des aires de stationnement, de manœuvre, de chargement et de déchargement des\n    véhicules lourds de livraison doivent être prévues hors emprises publiques.\n12.1.2 Pour toute construction, les stationnements sont réalisés dans le volume de la\n    construction, en sous-sol ou sous dalle, ou selon les dispositions de l’article 12.2.1 du\n    présent article.\n12.1.3 Aucune place de stationnement ne peut être supprimée à moins de respecter les règles\n    de l’article 12.1.\n12.1.4 Pour les constructions d’habitation dont les surfaces de planchers totales sont\n    inférieures ou égales à 1000 m² SDP, il n’est pas imposé de règles en matière de\n    stationnement des véhicules et 2 roues motorisées.\n12.1.5 Tableau de répartition par type de construction et installation :\n    NORME\n   DESTINATION ET    NATURE    DE    LA    NORME PLAFOND\n    PLANCHER\n   CONSTRUCTION    (maximum)\n    (minimum)\n    Habitation (SDP > 1000 m²) :\n    • logement >25 m²    1 place/logement\n    • logement financés par un prêt aidé    0,5 place/logement\n    Pas de norme\n    de l’Etat > 25m² et situé à moins de    plafond\n    500m d’une gare de transport en\n    commun\n    • logement ≤25 m²    Aucune place\n    1 place pour 4    Pas de norme\n    Résidences * :\n    logements    plafond\n    1 place/10    Pas de norme\n    Hébergement hôtelier :\n    chambres    plafond\n   Bureaux :\n    Automobiles : 1 place\n    pour 70m² de SDP\n    •   à plus de 500m d’une gare de\n    2 roues** : pas de\n    transport en commun    8% de la SDP\n    norme plafond\n    Dont 5% pour les 2\n    roues**\n    Automobiles : 1 place\n    •   à 500m ou moins d’une gare de    pour 90m² de SDP\n    transport en commun    2 roues** : pas de\n    norme plafond\n   Commerces > 2 000 m² :\n    Pas de norme\n   Par tranche de 100 m² de SDP par unité    1\n    plafond\n   commerciale\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UE   59","    Artisanat > 2 000 m² :\n    Pas de norme\n    Par tranche de 100 m² de SDP par unité    1\n    plafond\n    d’activité\n**2 roues : motos et vélos\n    •   Le nombre de places à réaliser résultant des normes ci-dessus est, en cas de\n    décimale supérieure ou égale à 5, arrondi à l’unité supérieure.\n    •   Il est exigé une place pour chacune des tranches qu’elle soit entière ou partielle.\n    •   Lorsque les places sont données pourcentage de la SDP, leur nombre résulte de\n    la division de la surface par 28 m².\nNOTA : ALIMENTATION POUR VEHICULES RECHARGEABLES\nL'équipement de dispositifs de raccordement techniques nécessaires à l’alimentation de prises de\nrecharges pour les véhicules électriques ou hybrides permettant un comptage individuel est\nobligatoire pour certaines nouvelles constructions dotées de places de stationnement énoncées à\nl’article L.111-5-2 du code de la construction et de l’habitation\n12.1.6 Pour tous les programmes de constructions, il est exigé un minimum de 2% (5% pour\n    les programmes de logements) de place de stationnement pour les personnes à\n    mobilité réduites (PMR). Ces places doivent avoir les dimensions minimales suivantes :\n    •   Largeur : 3,30 m\n    •   Longueur : 5,00 m\n    Celles-ci pourront être associées 2 à 2 avec une largeur de dégagement latérale\n    commune d’au minimum 0,80 m.\n12.1.7 Pour toutes les constructions neuves d’habitation, le stationnement des motocyclettes\n    doit représenter au minimum 1 % de la SDP et se situer en sous-sol, soit sur des\n    emplacements spécifiques, soit en combinaison des stationnements automobiles.\n12.1.8 Pour toutes les constructions neuves d’habitation, des locaux fermés et spécifiques,\n    pour entreposer les vélos et les poussettes doivent s’implanter dans le volume de la\n    construction en rez-de-chaussée ou en sous-sol. Ces locaux doivent représenter au\n    total une surface de 1% minimum de la SDP de la construction.\nNota : Les normes définies dans cet article, notamment celles relatives au stationnement des\n    vélos, doivent, par ailleurs, respecter les dispositions en vigueur inscrites, à la\n    délivrance du permis de construire, dans le code de la construction et de l’habitation et\n    les arrêtés d’application.\n12.2   REGLES PARTICULIERES\n12.2.1 En cas d’impossibilité architecturale ou technique d’aménager sur le terrain de\n    l’opération le nombre d’emplacements nécessaires au stationnement, le bénéficiaire\n    peut être autorisé à solliciter l’application de l’article L.151-33 du Code de l’Urbanisme\n    si ces stationnements sont réalisés dans le volume d’une construction, en sous-sol ou\n    en sous dalle.\n12.2.2 Il n’est pas fixé de règles pour les constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif.\nARTICLE UE13 : ESPACES LIBRES ET PLANTATIONS\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UE   60","13.1   REGLES GENERALES\n13.1.1 Les plantations existantes doivent être maintenues en bon état de conservation.\n    Cependant l’abattage d’arbres est autorisé s’il est indispensable à l’implantation des\n    constructions ou à l’établissement d’un accès.\n13.1.2. Tout arbre abattu doit être remplacé sur le terrain par un arbre à développement\n    équivalent. Cependant, les projets de constructions ne doivent pas porter atteinte aux\n    arbres remarquables identifiés au plan de zonage.\n13.1.3 Lors de tout projet de construction, les plantations d’arbres sur le domaine public\n    doivent être préservées.\n13.1.5 Tout projet d’implantation au niveau Dalle* entraîne l’obligation de traiter des espaces\n    paysagers comme suit :\n    •    Les dalles créées par les constructions nouvelles doivent être végétalisées pour\n    au moins 20 % de leur superficie, déduction faite des voies dédiées aux véhicules\n    de sécurité, d’incendie et de secours.\n    •    Les espaces libres* à aménager sur les dalles* existantes seront traités de\n    manière à assurer une continuité et une cohérence des espaces non bâtis\n    répartis sur l’ensemble de la dalle*. Ils devront bénéficier d’un traitement de\n    qualité pouvant associer aux plantations des surfaces « couvre-sol » et des\n    revêtements de sols soignés dans leur aspect et le choix des matériaux\n    (circulations de desserte, aires d’évolution, cheminements piétons).\n13.2   REGLES PARTICULIERES\nLes dispositions du présent article ne sont pas applicables pour les constructions ou\ninstallations nécessaires aux services publics ou d’intérêt collectif.\nARTICLE UE14 : COEFFICIENT D’OCCUPATION DU SOL (COS)\nSans objet.\nARTICLE  UE15 : PERFORMANCES    ENERGETIQUES    ET\nENVIRONNEMENTALES\nLa consommation énergétique des constructions nouvelles d’immeubles collectifs de\nlogements, de bureaux et les CINASPIC*, doit être inférieure de 10% à l’objectif fixé dans la\nRT 2012 (soit une performance augmentée de 10% par rapport à la RT2012).\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UE    61","ARTICLE UE16 :  INFRASTRUCTURES    ET    RESEAUX    DE\nCOMMUNICATIONS ELECTRONIQUES\nUne construction ou une installation nouvelle, doit pouvoir être raccordée au réseau public ou\nprivé de communications électroniques. Les fourreaux de raccordement doivent être enfouis.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UE   62","    Ville de Puteaux\nCHAPITRE 4 : ZONE UB\nCARACTERE ET VOCATION DE LA ZONE\nIl s’agit d’une zone représentant l’axe historique de Paris-La Défense.\nCette zone comporte 2 secteurs particuliers :\n   • Un secteur UBa correspondant au parvis de La Défense, entre le Centre Commercial\n    des Quatre Temps et le CNIT.\n   • Un secteur UBb correspondant à la Grande Arche et ses abords immédiats\nARTICLE UB1 :    OCCUPATIONS    ET    UTILISATIONS    DU    SOL\nINTERDITES\n1.1    Toutes les constructions non visées à l’article UB2.\nARTICLE UB2 : OCCUPATIONS ET UTILISATIONS    DU    SOL\nSOUMISES A DES CONDITIONS PARTICULIERES\n2.1    Les installations classées quels que soient les régimes auxquels elles sont soumises,\n    à condition qu’elles n’entraînent pour le voisinage, aucune incommodité et, en cas\n    d’accident ou de fonctionnement défectueux, aucune insalubrité, ni sinistre susceptible\n    de causer des dommages graves ou irréparables aux personnes et aux biens. En outre,\n    leurs exigences de fonctionnement lors de leur ouverture ou à terme, doivent être\n    compatibles avec les infrastructures existantes, notamment les voiries et\n    l’assainissement.\n2.2    L’aménagement ou la transformation des installations classées existantes à la\n    condition expresse que ces travaux entraînent une atténuation des nuisances dont ces\n    installations sont la cause.\n2.3    Sur dalle*, les constructions à destination de commerces, d’artisanat et de services,\n    dont la superficie unitaire est inférieure ou égale à 300 m² de SDP, hors réserves. Pour\n    les CINASPIC leur surface n’est pas limitée. En secteurs UBa et UBb, cette superficie\n    unitaire peut être portée à 1 000 m² SDP, hors réserve.\n2.4    Sous dalle* ou en infrastructure, les constructions à destination de commerces,\n    d’artisanat, de services et de CINASPIC.\n2.5    La démolition / reconstruction et l’extension des constructions existantes à destination\n    de bureaux est autorisée.\n2.6    Les constructions et implantations nécessaires au réseau de transport public du Grand\n    Paris et nécessaires à l’activité ferroviaire et en particulier au RER E.\n2.7    En secteur UBb, délimité graphiquement au plan de zonage, sont autorisées les\n    changements de destinations des bâtiments existants en Hôtels, constructions et\n    installations nécessaires aux services publics ou d’intérêt collectif ou commerces.\n    Plan Local d’Urbanisme – Modification n°5 – Règlement – Zone UB   63","    Ville de Puteaux\nARTICLE UB3 : ACCES ET VOIRIES\n3.1    Les accès doivent présenter des caractéristiques permettant de satisfaire aux\n    exigences de la sécurité, de la défense contre l’incendie et de la protection civile\n    conformément aux règlements en vigueur.\nARTICLE UB4 : DESSERTE PAR LES RESEAUX\nTous les réseaux et raccordements devront être enterrés.\nLa récupération et l’utilisation des eaux pluviales, ainsi que les eaux de toutes autres origines,\ndoivent respecter les exigences de la législation et de la réglementation en la matière,\nnotamment :\n    • La récupération des eaux de pluies et leur usage à l’intérieur et à l’extérieur des\n    bâtiments (arrêté du 21 aout 2008)\n    • Le contrôle des installations privatives de distribution d’eau potable, de récupération\n    des eaux de pluie ainsi que des ouvrages de prélèvement, puits et forages (arrêté du\n    17 décembre 2008 et circulaire du 9 novembre 2009)\n    • L’article 3.4 du contrat de délégation de service public de production et de distribution\n    d’eau potable\n    • Les articles 18 et 21 du règlement du service du Syndicat des eaux d’Ile-de-France.\n    • Le règlement départemental d’assainissement des Hauts de Seine en vigueur.\n4.1    ALIMENTATION EN EAU POTABLE\n4.1.1   Toute construction ou installation nouvelle qui, par sa destination nécessite l’utilisation\n    d’eau potable, doit être alimentée par branchement à un réseau collectif de distribution\n    sous pression présentant des caractéristiques suffisantes.\n4.1.2   Le pétitionnaire doit prendre toutes les précautions pour que les installations d’eau\n    potable ne soient immergées à l’occasion d’une mise en charge d’un égout, ni que\n    puisse se produire une quelconque introduction d’eaux polluées dans ces réseaux.\n4.2    ASSAINISSEMENT\n4.2.1   Toute construction ou installation nouvelle à l’intérieur d’une même propriété, doit être\n    conçue de manière à recueillir les eaux pluviales et les eaux usées séparément. Tous\n    les raccordements aux réseaux publics seront exécutés conformément à la\n    réglementation en vigueur, en respectant les caractéristiques de ce réseau et avec\n    l’accord des autorités compétentes.\n4.2.2   EAUX USEES\n    • L’évacuation des eaux ménagères, et des effluents non traités, dans les fossés,\n    cours d’eau ou égouts pluviaux est interdite.\n    • Le branchement au réseau d’assainissement des canalisations d’évacuation des\n    liquides industriels résiduaires doit être soumis à la réglem
