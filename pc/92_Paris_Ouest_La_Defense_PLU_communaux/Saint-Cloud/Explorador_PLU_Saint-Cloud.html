<!doctype html>
<html lang="es">
<head>

<title>Explorador PLU de Saint-Cloud</title>
<style>

:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1d1f22; --muted:#666b73; --line:#e3e1db; --accent:#1f5f8b; --accent-ink:#ffffff;
  --hl:#fff1a8; --chip:#eef1f4; --sum:#eef6ee; --sum-line:#b9d9bb; --code:#1f5f8b; --warn:#fff6e5;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15171a; --panel:#1d2024; --ink:#e7e7e4; --muted:#9aa0a8; --line:#30343a; --accent:#6fb3e0; --accent-ink:#0d1114;
  --hl:#5b4f12; --chip:#262a30; --sum:#1c2a1e; --sum-line:#35573a; --code:#8cc6ee; --warn:#2c2516;
}}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1d2024; --ink:#e7e7e4; --muted:#9aa0a8; --line:#30343a; --accent:#6fb3e0; --accent-ink:#0d1114;
  --hl:#5b4f12; --chip:#262a30; --sum:#1c2a1e; --sum-line:#35573a; --code:#8cc6ee; --warn:#2c2516;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px}
nav.tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto}
nav.tabs a{padding:8px 12px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
nav.tabs a.on{color:var(--ink);border-color:var(--accent);font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:5px 10px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wrap{display:flex;min-height:calc(100vh - 100px)}
aside{width:330px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow:auto;height:calc(100vh - 100px);position:sticky;top:100px}
main{flex:1;min-width:0;padding:18px 28px 80px;max-width:980px}
.filters{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line);cursor:pointer;user-select:none}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tree{padding:6px 0 30px}
.tree .n{display:flex;gap:6px;align-items:baseline;padding:3px 12px;cursor:pointer;font-size:13.5px;line-height:1.35}
.tree .n:hover{background:var(--chip)}
.tree .n.cur{background:var(--chip);box-shadow:inset 3px 0 0 var(--accent)}
.tree .n .cd{color:var(--code);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
.tree .n .pg{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.tree .l0{font-weight:700;margin-top:8px;text-transform:uppercase;font-size:12px;letter-spacing:.03em}
.tree .l1{font-weight:600}
.tree .l2{padding-left:24px}
.tree .l3{padding-left:40px;color:var(--ink)}
.tree .tg{cursor:pointer;color:var(--muted);width:12px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;transform:translateY(-1px)}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.crumb a{text-decoration:none}
h1.st{font-size:22px;margin:0 0 4px;line-height:1.3}
h1.st .cd{color:var(--code)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 14px;font-size:13px;color:var(--muted)}
.sum{background:var(--sum);border:1px solid var(--sum-line);border-radius:10px;padding:10px 14px;margin:0 0 16px}
.sum b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:2px}
.txt p{margin:0 0 10px}
.txt h4{margin:18px 0 8px;font-size:15px}
.txt ul{margin:0 0 10px;padding-left:22px}
.txt li{margin:0 0 5px}
.txt ul.sub{margin:5px 0 5px;list-style:circle}
.txt li.nb{list-style:none}
pre.tbl{font:12px/1.35 ui-monospace,Consolas,monospace;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre}
.ref{font-style:italic;color:var(--muted)}
a.xr{text-decoration:none;border-bottom:1px dotted var(--accent);white-space:nowrap}
a.fg{font-size:12px;background:var(--chip);border-radius:5px;padding:0 5px;text-decoration:none;font-style:normal}
.df{border-bottom:1px dashed var(--muted);cursor:help}
sup{font-size:9px;color:var(--muted)}
mark{background:var(--hl);color:inherit;border-radius:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.box h3{margin:0 0 8px;font-size:15px}
.sub-list a{display:block;padding:4px 0;text-decoration:none}
.sub-list .cd{color:var(--code);margin-right:6px}
.eq a{margin-right:8px}
.notes textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px;font:inherit}
.results .r{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.results .r:hover{background:var(--chip)}
.results .r .cd{color:var(--code);font-weight:600;margin-right:6px}
.results .r .sn{color:var(--muted);font-size:13.5px;margin-top:3px}
.pop{position:absolute;z-index:50;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px 14px;font-size:13.5px;max-height:320px;overflow:auto}
.pop h5{margin:0 0 6px;font-size:14px}
table.cf{width:100%;border-collapse:collapse;font-size:14px}
table.cf td,table.cf th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.cf th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
table.cf td.v{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ob .reg{font-size:12.5px;color:var(--muted);margin:-4px 0 8px}
.ob a{display:block;text-decoration:none;padding:3px 0}
.ob a .cd{color:var(--code);font-weight:600;margin-right:6px;font-size:13px}
.ob a span.w{color:var(--ink)}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.figs .fc{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.figs .fc img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover;object-position:top;background:#fff}
.figs .fc div{padding:8px 10px;font-size:13px}
.figview img{width:100%;max-width:760px;display:block;margin:0 auto 12px;border:1px solid var(--line);border-radius:6px;background:#fff}
.gl .gi{padding:12px 0;border-bottom:1px solid var(--line)}
.gl .gi h3{margin:0 0 4px;font-size:16px}
.gl .refs{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.az{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.warn{background:var(--warn);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.star{font-size:18px;line-height:1;border:none;background:none;padding:0 4px;color:var(--muted)}
.star.on{color:#e0a400}
.menu{display:none}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
@media (max-width:820px){
  aside{position:fixed;left:0;top:0;height:100vh;z-index:40;transform:translateX(-100%);transition:transform .2s;width:86vw;max-width:360px;box-shadow:0 0 30px rgba(0,0,0,.25)}
  aside.open{transform:none}
  .menu{display:inline-block}
  main{padding:14px 16px 80px}
  .brand small{display:none}
}

.pj-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 18px}
.pj-tabs a{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pj-tabs a b{display:block;font-size:15.5px;margin-bottom:2px}
.pj-tabs a span{font-size:12.5px;color:var(--muted)}
.pj-tabs a.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.pj-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pj-cols ul{margin:0;padding-left:18px}.pj-cols li{margin:3px 0;font-size:14px}
.pj-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.pj-prog{flex:1;min-width:160px;height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.pj-prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.pj-bar button{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.pj-g h3{margin:0 0 6px;font-size:15px}
.pj-a{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.pj-a:first-of-type{border-top:0}
.pj-a input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}
.pj-a a{text-decoration:none;color:var(--ink)}
.pj-a .cd{color:var(--code);font-weight:600;margin-right:6px;font-size:13px}
.pj-a .tt{color:var(--muted);font-size:12.5px;display:block}
.pj-a.ok a{opacity:.55}
@media (max-width:760px){.pj-cols{grid-template-columns:1fr}}
@media print{.pj-tabs,.pj-bar button{display:none!important}.pj-a input{accent-color:#000}}
@media print{header,aside,.notes,.no-print{display:none!important} main{max-width:none;padding:0}}

.pg{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:0 0 14px;overflow:hidden}
.pg .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;background:var(--chip);font-size:12.5px;color:var(--muted)}
.pg pre{margin:0;padding:12px 14px;font:13px/1.5 ui-monospace,"Cascadia Mono",Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.pg pre .hh{background:var(--hl);font-weight:700}
.zsel{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.th-l{display:flex;flex-wrap:wrap;gap:6px}
.th-l .chip{font-size:12.5px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px}
.kv b{color:var(--muted);font-weight:600}
.pj-a .zn{font-size:11px;background:var(--chip);border-radius:5px;padding:0 5px;margin-left:6px;color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;font-style:italic}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btns a.b{display:inline-block;border:1px solid var(--line);border-radius:7px;padding:5px 10px;text-decoration:none;font-size:13.5px;background:var(--panel)}
.btns a.b.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
</style>

:["er"]},{"t":"Annexe 5 : Zone de plan masse","l":1,"p":120,"q":121,"n":121,"s":"toc","a":0,"z":null,"th":[]},{"t":"Annexe 6 : Informations relatives aux canalisations de transport de matières dangereuses","l":1,"p":121,"q":124,"n":124,"s":"toc","a":0,"z":null,"th":[]},{"t":"Annexe 7 : Les éléments du patrimoine remarquables à protéger","l":1,"p":124,"q":149,"n":149,"s":"toc","a":0,"z":null,"th":["patr"]},{"t":"Annexe 8 : Liste des espaces verts protégés","l":1,"p":149,"q":150,"n":150,"s":"toc","a":0,"z":null,"th":["verde","patr"]},{"t":"Annexe 9 : Liste des arbres remarquables","l":1,"p":150,"q":152,"n":150,"s":"toc","a":0,"z":null,"th":["verde","patr"]},{"t":"Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville","l":2,"p":150,"q":152,"n":152,"s":"toc","a":0,"z":null,"th":[]}],"zones":["N","UA","UC","UD","UE","UF","UL","UM","UPM"],"pages":["PLAN LOCAL D’URBANISME\n    5 - Règlement\n Modification n° 1 approuvée par délibération du\n    Conseil municipal du 17 décembre 2015\n Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   1","Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   2","    SOMMAIRE\nDISPOSITIONS GÉNÉRALES ...................................................................................................................................... 5\nDISPOSITIONS APPLICABLES AUX ZONES URBAINES ............................................................................................. 13\n  ZONE UA ............................................................................................................................................................ 15\n  ZONE UC ............................................................................................................................................................ 29\n  ZONE UD............................................................................................................................................................ 41\n  ZONE UE ............................................................................................................................................................ 55\n  ZONE UF ............................................................................................................................................................ 65\n  ZONE UL ............................................................................................................................................................ 75\n  ZONE UM........................................................................................................................................................... 83\n  ZONE UPM......................................................................................................................................................... 91\nDISPOSITIONS APPLICABLES À LA ZONE NATURELLE ............................................................................................ 99\n  ZONE N ............................................................................................................................................................ 101\nANNEXES ............................................................................................................................................................. 105\n  Annexe 1 : Définitions ..................................................................................................................................... 107\n  Annexe 2 : Prospects à réserver pour l’implantation des bâtiments .............................................................. 115\n  Annexe 3 : Le cône de vue n° 1 ....................................................................................................................... 117\n  Annexe 4 : Tableau des emplacements réservés au titre de l’article L. 123-1-5 V du Code de l’urbanisme .. 118\n  Annexe 5 : Zone de plan masse ....................................................................................................................... 120\n  Annexe 6 : Informations relatives aux canalisations de transport de matières dangereuses ........................ 121\n  Annexe 7 : Les éléments du patrimoine remarquables à protéger ................................................................. 124\n  Annexe 8 : Liste des espaces verts protégés ................................................................................................... 149\n  Annexe 9 : Liste des arbres remarquables ...................................................................................................... 150\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    3","Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   4","    DISPOSITIONS GÉNÉRALES\n    TITRE I\nDISPOSITIONS GÉNÉRALES","    DISPOSITIONS GÉNÉRALES\nModification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   6","    DISPOSITIONS GÉNÉRALES\nART. 1 : CHAMP D'APPLICATION TERRITORIAL\nLe présent règlement, dont les dispositions s'imposent à toute personne de droit public ou privé,\ns'applique à l'ensemble du territoire de la commune de Saint-Cloud.\nART. 2 : PORTÉE RESPECTIVE DU RÈGLEMENT ET DES AUTRES RÉGLEMENTATIONS\nRELATIVES À L'OCCUPATION DU SOL\nSont et demeurent applicables au territoire couvert par le PLU :\n1) Les articles du Code de l'urbanisme relatifs à la salubrité, à la sécurité publique, à la conservation\net à la mise en valeur du site avec des vestiges archéologiques, au respect des préoccupations\nenvironnementales et à l’aspect des constructions.\n2) Les servitudes d'utilité publique qui instituent une limitation administrative au droit de propriété.\nLa liste des servitudes d'utilité publique est définie dans les annexes du PLU.\n3) Les articles du Code de l'urbanisme ou d'autres législations concernant :\n- les emplacements réservés (L. 123-1-5 V) : ils figurent en annexe du présent règlement et sont\ndélimités par le plan de zonage. La collectivité et les organismes publics bénéficiaires des\nemplacements réservés sont également précisés en annexe du document graphique ;\n- les périmètres à l'intérieur desquels est appliqué le droit de préemption urbain.\n4) Afin de préserver et développer la diversité commerciale conformément aux dispositions de\nl’article L. 123-1-5 II 5° du Code de l’urbanisme, le document graphique définit les linéaires de rue où\nle changement de destination en logement des constructions existantes à la date d’application du\nrèglement issu de la présente modification, situés en rez-de-chaussée initialement à usage\ncommercial, est interdit.\n5) Un lexique de définition de certains termes employés est annexé au présent règlement.\n6) Rappel de la réglementation relative à l’occupation du domaine public fluvial : L’autorité\ngestionnaire du domaine public fluvial devra être consultée pour l’autorisation de toute occupation\nde son domaine, qu’il s’agisse de rejets et/ou prises d’eau, de travaux réalisés sur celui-ci ou\nd’occupations privatives. La consultation de l’autorité compétente sera effectuée par la collectivité.\nART. 3 : DIVISION DU TERRITOIRE EN ZONES\nLe territoire couvert par le présent PLU est divisé en zones urbaines (U) et naturelle (N).\n1) Les zones urbaines comprennent:\n    - la zone UA - la zone UF\n    - la zone UC - la zone UL\n    - la zone UD - la zone UPM\n    - la zone UE - la zone UM\nA chacune de ces zones s'appliquent les dispositions du titre II du présent règlement.\n2) La zone naturelle N :\nPour laquelle s'appliquent les dispositions du Titre II.\nLa délimitation des zones est fixée par le document cartographique.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    7","    DISPOSITIONS GÉNÉRALES\nART. 4 : ADAPTATIONS MINEURES\nLes règles et servitudes définies par un plan local d'urbanisme ne peuvent faire l'objet d'aucune\ndérogation, à l'exception des adaptations mineures rendues nécessaires par la nature du sol, la\nconfiguration des parcelles ou le caractère des constructions avoisinantes conformément au Code de\nl’urbanisme.\nART. 5 : RECONSTRUCTION\nAu titre de l’article L. 111-3 du Code de l’urbanisme, la reconstruction à l’identique d’un bâtiment\ndétruit depuis moins de 10 ans est autorisée nonobstant toute disposition d’urbanisme contraire, dès\nlors qu’il a été régulièrement édifié.\nART. 6 : ÉLEMENTS DE PATRIMOINE BÂTI ET DE PATRIMOINE NATUREL À PROTÉGER\nLe P.L.U. protège, en application de l’article L. 123-1-5 III 2° du Code de l’urbanisme, les ensembles\n(bâtiment, parc, jardin et/ ou clôture) et bâtiments qui possèdent une qualité architecturale\nremarquable, ou constituent un témoignage de la formation de l’histoire de la Ville ou d’un quartier,\nou assurent par leur volumétrie un repère particulier dans le paysage urbain, ou appartiennent à une\nséquence architecturale remarquable par son homogénéité.\nLes listes de ces ensembles et bâtiments remarquables figurent en annexe au présent règlement et\nils sont désignés au document graphique.\nLa démolition de ces bâtiments remarquables du patrimoine urbain ou architectural est interdite,\nsauf en cas de contraintes techniques et/ou géotechniques. Leur restructuration, leur restauration,\nleur modification ou leur reconstruction en cas de démolition liée à des contraintes techniques ou\ngéotechniques, doit conserver les dispositions architecturales existantes à la date d’approbation du\nprésent règlement ou restituer les dispositions architecturales existantes à leur origine.\nLes arbres isolés ou alignés à protéger, repérés sur le plan 5.3 et 5.4 des éléments de patrimoine\nremarquable, sont protégés au titre de l’article L. 123-1-5 III 2° du Code de l’urbanisme. Leur coupe\nou leur abattage est interdit sauf pour des raisons phytosanitaires.\nSur les terrains mentionnés au document graphique comme faisant l’objet de la protection des\nespaces verts, toute construction, reconstruction ou installation devra contribuer à mettre en valeur\nles espaces verts protégés (EVP) dont la surface d’espace vert existant ne doit en aucun cas être\ndiminuée.\nART. 7 : APPLICATION DE L’ARTICLE R. 123-10-1 DU CODE DE L’URBANISME\nEn application de l’article R. 123-10-1 du Code de l’urbanisme, en cas de lotissement ou de permis\nvalant division, les règles de retrait doivent être appliquées par rapport aux futures limites de lots\nissus de la division. Cette disposition s’applique aux articles 6, 7, 9 et 13 du présent règlement.\nART. 8 : ISOLATION THERMIQUE PAR L’EXTÉRIEUR\nNonobstant les dispositions fixées par les articles 6, 7, 8, 9 et 13 du présent règlement, est autorisée\nla réalisation d’une isolation thermique par l’extérieur, sur une construction à la date d’application\ndu présent règlement, de 20 centimètres maximum d’épaisseur.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    8","    DISPOSITIONS GÉNÉRALES\nART. 9 : ACCESSIBILITÉ DES CONSTRUCTIONS\nSont autorisés dans la marge de retrait fixée aux articles 6, 7 et 8 du règlement issu de la présente\nmodification, les éléments constructifs liés et nécessaires à l’accès aux bâtiments : perrons, escaliers,\nmarquises, rampes et tout dispositif permettant ou favorisant l’accessibilité des constructions aux\npersonnes à mobilité réduite.\nART.10 : EXTENSION DE CONSTRUCTIONS IMPLANTÉES DANS LES MARGES DE RETRAIT\nFIXÉES AUX ARTICLES 6, 7 OU 8 HORMIS PRESCRIPTIONS DIFFÉRENTES DE LA DISPOSITION\nGÉNÉRALE, PRÉCISÉES DANS LES DITS ARTICLES DES ZONES URBAINES\nLes dispositions suivantes sont applicables lorsqu’il existe déjà une construction, à la date\nd’application du règlement issu de la présente modification, en tout ou partie implantée dans la\nmarge de retrait imposée au présent article. Dans ce cas, est autorisée l’extension dans le\nprolongement horizontal ou vertical du volume existant, dans le respect des différents articles\n(emprise au sol, hauteur, retrait par rapport aux autres limites (alignement, fond de parcelle)…), si\ncela permet d’assurer une meilleure intégration architecturale du projet d’ensemble.\n    Schéma : types d’extensions et de surélévations autorisés dans le prolongement de l’existant\nART. 11 : LES CLIMATISEURS ET LES POMPES À CHALEUR\nLes climatiseurs et/ou les pompes à chaleur doivent être implantés en retrait des limites séparatives.\nLa distance minimale entre l’installation et la limite séparative en tout point doit être au moins égale\nà 6 mètres.\nART. 12 : PROTECTION DU PATRIMOINE ARCHÉOLOGIQUE\nSur l’ensemble du territoire communal s’applique la réglementation relative aux découvertes\nfortuites susceptibles de présenter un caractère archéologique. Il faut donc déclarer la découverte,\nen mairie et au service régional de l’archéologie.\nART. 13 : SERVITUDE DE PROJET AU TITRE DE L’ARTICLE L. 123-2a DU CODE DE\nL’URBANISME\nÀ l’intérieur du périmètre de la servitude de projet définie sur le document graphique, et ce pendant\nune durée de cinq ans maximum jusqu’à la levée de la servitude, toute construction neuve ou toute\nextension des constructions ajoutant plus de 5 % de surface par rapport à la surface existante, est\ninterdite.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    9","    DISPOSITIONS GÉNÉRALES\nART. 14 : NORMES À RESPECTER POUR LA CRÉATION DE PLACES DE STATIONNEMENT EN\nAPPLICATION DE L’ARTICLE 12 DU RÈGLEMENT\nPour les constructions qui comprennent plus de deux logements, les règles applicables sont les\nsuivantes :\n    - Stationnement perpendiculaire\n    Dimension des places :\n    Longueur :    5 m 50\n    Largeur :    2 m 50\n    Dégagement : 5 m 50\n    - Stationnement en épis\n    Dimension des places :\n    Longueur :    5 m 50\n    Largeur :    2 m 50\n    Dégagement :    3 m 50\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   10","    DISPOSITIONS GÉNÉRALES\n    - Stationnement longitudinal\n    Dimension des places :\n    Longueur :    5 m 50\n    Largeur :    2 m 50\n    Dégagement :    3m\n    Les places de stationnement à double commande sont interdites (place dont l’accès est\n    conditionné par une autre place de stationnement).\n    - Largeur des accès :\n    Sens unique :    3m\n    Double sens :    4m\nPour les constructions qui comprennent un ou deux logements, les règles applicables sont les\nsuivantes :\n    Dimension des places :    Largeur des accès :\n    Longueur :    5 m 50    Sens unique :    3m\n    Largeur :    2 m 50    Double sens :    4m\nART. 15 : RÉALISATION DES PLACES DE STATIONNEMENT\nLorsque le constructeur ou l’aménageur ne peut pas satisfaire aux obligations qui lui sont imposées, il\npeut être tenu quitte de ses obligations en justifiant, pour les places qu’il ne peut réaliser :\n- soit de l’obtention d’une concession à long terme dans un parc de stationnement existant ou en\ncours de réalisation situé à proximité de l’opération dans un rayon de 300 mètres ;\n- soit de l’acquisition de places dans un parc privé de stationnement répondant aux mêmes\nconditions.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    11","    DISPOSITIONS GÉNÉRALES\nModification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   12","    TITRE II\n  DISPOSITIONS APPLICABLES AUX ZONES URBAINES\n    ZONES UA, UC, UD, UE, UF, UL, UM, UPM\nN.B. : La définition de certains des termes utilisés et des schémas explicatifs\nsont mis en annexe.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   13","Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   14","    UA\n    ZONE UA\nC’est une zone, à caractère de centre-ville, généralement dense, où les bâtiments, sont en ordre\ncontinu ou semi-continu.\nLa zone UAc est affectée principalement au commerce, elle est destinée à permettre la mise en\nœuvre d’un projet d’intérêt général portant sur la confortation du commerce de proximité.\n    I - NATURE DE L'OCCUPATION ET DE L'UTILISATION DU SOL\nArt. UA 1. OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\n1.1    Les constructions à usage d’activités à caractère industriel.\n1.2    Les dépôts de ferrailles, matériaux, combustibles solides ou liquides, les entreprises de\ncassage de voitures à l'air libre et les fourrières.\n1.3    Le camping.\n1.4    Les affouillements, exhaussements des sols et les exploitations de carrières non liés à des\ntravaux de construction.\nArt. UA 2. OCCUPATIONS ET UTILISATIONS DU SOL ADMISES SOUS CONDITIONS\n2.1    L'implantation, l'agrandissement ou la modification de l'existant des installations classées\ncompatibles avec le caractère de la zone\n2.2    Sur les terrains comportant d’anciennes carrières et ceux soumis au risque de glissement de\nterrains, les constructions peuvent faire l'objet de recommandations particulières. Les dispositions\ndu PPRMT, en annexe du PLU, doivent être respectées.\n2.3    Dans les secteurs soumis aux risques d’inondation, les constructions, ouvrages et travaux\nsont soumis aux dispositions du PPRI, en annexe du PLU.\n2.4    Le long des linéaires d’axes commerciaux mentionnés au document graphique, au titre de\nl’article L. 123-1-5 II 5° du Code de l’urbanisme, est interdite la transformation en logements, de\nlocaux existants, à la date d’application du présent règlement, situés en rez-de-chaussée et destinés\nà l’accueil d’activités commerciales.\n2.5    En limite du domaine ferroviaire, l’implantation des constructions doit respecter les règles\ndes servitudes ferroviaires, en annexe du PLU.\n2.6    Les travaux de maintenance, de modification des ouvrages électriques à haute et très haute\ntension sont autorisés pour des exigences fonctionnelles et/ou techniques.\n2.7    En zone UAc, les locaux situés en rez-de-chaussée des constructions doivent être\nexclusivement destinés aux activités commerciales.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    15","    UA\n    Il - CONDITIONS DE L'OCCUPATION DU SOL\nArt. UA 3. ACCÈS\n3.1    Conditions liées à la desserte du terrain par une voie d’accès existante ou par une voie\n    d’accès créée\nPour être constructible, un terrain doit avoir accès à une voie publique ou privée respectant les\nconditions suivantes :\n    •   Pour toute opération conduisant à la desserte de 1 ou 2 logements y compris les logements\n    existants à la date d’application du présent règlement, l'emprise de la voie de desserte doit\n    avoir une largeur minimum de 3 mètres sur toute sa longueur.\n    •   Pour toute opération conduisant à la desserte de 3 logements et plus y compris les\n    logements existants à la date d’application du présent règlement, et pour tous les autres\n    types de constructions autorisés dans cette zone, l'emprise de la voie de desserte doit avoir\n    une largeur minimum de 4 mètres sur toute sa longueur, avec une chaussée aménagée pour\n    permettre le croisement des véhicules. Les voies et chemin d’accès se terminant en impasse\n    (chemins privés réalisés sur des parcelles privées) desservant plus de deux logements y\n    compris des logements existants doivent être aménagés de façon à permettre aux véhicules\n    de faire demi-tour.\nToutefois, sur les terrains déjà bâtis insuffisamment desservis, un agrandissement de faible\nimportance d’une construction existante à la date d’application du présent règlement peut être\nautorisé à condition d’être située à moins de 150 mètres d’une bouche d’incendie.\nLes voies de desserte doivent être conçues et aménagées de manière à garantir la sécurité des\npiétons et des cycles.\n3.2    Conditions liées aux caractéristiques des accès à la parcelle existants ou créés\nLes accès doivent être conçus et aménagés en tenant compte de la topographie et de la morphologie\ndes lieux, de la nature des voies sur lesquelles elles débouchent (intensité du trafic, visibilité,\nvitesse...), de la nature et de l’affectation des constructions existantes et des constructions projetées\nainsi que du trafic engendré par la nouvelle construction. Ils doivent permettre l’entrée et la sortie\ndes véhicules sans manœuvre sur la voie de desserte.\n3.3    Conditions à respecter pour l’aménagement des chemins d’accès aux garages ou aux places\n    de stationnement situés sur le terrain d’emprise de la construction\nUn chemin carrossable doit permettre d’accéder aux garages ou aux places de stationnement\nréalisées sur la parcelle. Il doit être de taille et de dimension suffisante compte tenu du nombre de\nplaces de stationnement desservies, avec un minimum de 3 mètres.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    16","    UA\nArt. UA 4. DESSERTE PAR LES RÉSEAUX\n4.1    Eau :\nToute construction nouvelle doit être raccordée au réseau public d'eau.\n4.2    Assainissement :\nToute construction nouvelle doit être raccordée au réseau public d’assainissement, dans la mesure\noù ce raccordement est techniquement et financièrement viable. Dans le cas contraire, une\ndérogation pour la mise en place d’un assainissement autonome pourrait être accordée.\nToute nouvelle construction ou extension devra respecter les prescriptions des règlements\nd’assainissement en vigueur, notamment en matière de gestion des eaux pluviales.\n(chapitre 4 du règlement d’assainissement de la ville de Saint-Cloud).\nTout raccordement doit être conforme au règlement du service de l’assainissement de la ville de\nSaint-Cloud approuvé par le Conseil communautaire de la Communauté d’agglomération\nCœur-de-Seine du 14 octobre 2014. Ce règlement précise qu’en cas de raccordement au réseau\ndépartemental d’assainissement, la gestion des eaux pluviales à la parcelle, sans raccordement au\nréseau public doit être la première solution recherchée.\nToutefois, lorsque la gestion totale de ces eaux à la parcelle n’est pas possible, le propriétaire peut\nsolliciter l’autorisation de raccorder ses eaux de ruissellement au réseau pluvial ou unitaire à la\ncondition que ses installations soient conformes aux prescriptions techniques définies dans le\nchapitre 4 du règlement d’assainissement de la ville de Saint-Cloud. Dans ce cas, seul l’excès de\nruissellement peut être canalisé après qu’aient été mises en œuvre toutes les solutions susceptibles\nde favoriser la gestion à la parcelle, telles que l’infiltration, la réutilisation des eaux claires, le\nstockage, ainsi que les rejets au milieu naturel.\nL’excédent d’eaux de ruissellement n’ayant pu être géré à la parcelle est soumis à des limitations de\ndébit de rejet afin de limiter à l’aval les risques d’inondation ou de déversement d’eaux polluées au\nmilieu naturel. Le débit de fuite pour une pluie de retour décennal ne doit pas excéder :\n    -   2L/s/ha dans le cas d’un rejet dans le réseau unitaire ;\n    -   10L/s/ha dans le cas d’un rejet dans un réseau d’eaux pluviales, sauf dispositions locales\n    particulières (notamment en raison d’insuffisance hydraulique locale, ou exutoire aval\n    constitué d’un réseau unitaire).\nDans tous les cas, l’acceptation du raccordement des eaux pluviales de toute nouvelle construction\nsera subordonnée à la capacité d’évacuation du réseau existant. Le constructeur ou l’aménageur doit\njustifier, par la production à l’exploitant de notes de calcul appropriées, le dimensionnement\nsuffisant des installations de rétention qu’il installe en amont du raccordement.\nTout rejet d’eaux usées autres que domestiques dans les réseaux publics d’assainissement doit être\npréalablement autorisé soit par arrêté d’autorisation de déversement signé par le maître d’ouvrage\ndu réseau concerné, complété éventuellement par une convention spéciale de déversement, soit par\nune convention de rejet d’eaux usées non domestiques assimilables à des eaux usées domestiques.\nElles ne pourront être rejetées à l’égout que dans les conditions définies au chapitre 3 du règlement\nd’assainissement de la ville de Saint-Cloud.\nLes rejets d’eaux claires permanentes telles qu’eaux de pompage de nappe, eaux d’exhaure, eaux de\npompe à chaleur ou similaires sont interdits dans les réseaux d’assainissement unitaires ou d’eaux\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   17","    UA\nusées. Dans le cas d’activités produisant provisoirement des eaux d’exhaure, en l’absence de solution\nalternative et sous réserve d’une capacité suffisante du réseau, une autorisation dérogatoire peut\nêtre accordée, en référence au règlement du service de l’assainissement de la ville de Saint-Cloud\n(art. 22.2). Une convention temporaire de rejet pour ces eaux doit alors être cosignée par le\ndemandeur et les collectivités concernées.\n4.3    Électricité et téléphone :\nLes réseaux électriques et téléphoniques doivent être enterrés sur le terrain. Les armoires\nélectriques doivent être implantées à l’intérieur du terrain de la construction.\nLes coffrets de toute nature devront être incorporés à la clôture de la propriété. Ils ne peuvent en\naucun cas déborder sur le domaine public.\n4.4    Tri sélectif :\nToute construction nouvelle doit prévoir des locaux poubelles correctement dimensionnés pour\naccueillir l’ensemble des bacs de la collecte sélective, conformément au Plan Régional d’élimination\ndes déchets ménagers et assimilés (PREDMA) approuvé le 26 novembre 2009.\nArt. UA 5. CARACTÉRISTIQUES DES TERRAINS\nSans objet\nArt. UA 6. IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX VOIES ET EMPRISES\nPUBLIQUES\n6.1    Les constructions de premier rang doivent être implantées en limite d’emprise des voies\npubliques actuelles ou futures, des limites figurées au plan (marge de recul, zone non aedificandi) ou\ndes emprises publiques.\nToutefois, un retrait pourra être accordé dans les cas suivants :\n       Pour les voies dont la largeur est inférieure ou égale à 10 mètres :\n    - à partir de l’étage R+1, les niveaux supérieurs doivent être réalisés avec un retrait de\n    2 mètres minimum conformément à l’article UA 10.2.b\n       Pour les voies dont la largeur est supérieure à 10 mètres :\n    - Retrait des étages supérieurs pour respecter les règles H=L définies à l’article UA 10.1\n       Raccordement à un bâtiment existant situé ou non sur la même unité foncière, dans le\n    prolongement de la façade voisine existante ;\n       Préservation de plantation (s) ou d’élément (s) anciens ou caractéristiques du paysage ;\n    Le retrait doit être strictement limité à l’impératif de préservation.\n       Traitement en creux permettant une amélioration architecturale des façades ;\n       Respect du recul imposé par les servitudes ferroviaires.\n6.2    Les terrains situés à l'angle de deux voies ouvertes à la circulation automobile publique\ndoivent supporter un pan coupé d'une longueur minimum de 3 mètres à angles égaux.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    18","    UA\n6.3    Lorsque les voies ont une emprise égale ou supérieure à 8 mètres, les saillies sur alignement\npourront être autorisées à une hauteur supérieure à 5,5 mètres comptée à partir du trottoir et avec\nune profondeur inférieure à 0,80 mètre. La pose de matériaux d’isolation extérieure des façades à\nl’alignement est autorisée avec une épaisseur maximale de 20 centimètres. Sur les routes\ndépartementales, le règlement de voirie du département des Hauts-de-Seine doit être respecté.\n6.4   Dans les marges de reculement, l’aménagement d’aires de jeux, de sports et de loisirs ne\ncomportant aucun bâtiment ainsi que les rampes d’accès sont autorisés.\n6.5    Construction existante à la date d’application du présent règlement : l’extension de\nbâtiments non implantés à l’alignement peut être autorisée dans le prolongement de leurs façades.\nArt. UA 7. IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX LIMITES SÉPARATIVES\n7.1    Constructions nouvelles\n7.1.1 Constructions dans la bande de 25 mètres\nDans une bande de 25 mètres comptés à partir de la limite d’emprise de la voie ou du reculement\nimposé par le plan, les constructions peuvent s'implanter soit sur les limites séparatives\n(murs aveugles ou ne comportant que des jours de souffrance), soit en retrait (cf. paragraphe 7.1.3).\n7.1.2 Constructions au-delà de la bande de 25 mètres\nAu-delà de la bande de 25 mètres ci-dessus définie, les constructions sur limites séparatives sont\ninterdites sauf :\n- si elles s’adossent à une construction en bon état et de dimensions égales ou supérieures existant\nsur le terrain voisin et qu’elles s’insèrent dans les héberges existantes ;\n- ou si leur hauteur maximum ne dépasse pas 3,20 mètres.\nPour les autres cas les constructions doivent être implantées conformément au 7.1.3\n7.1.3 Implantation en retrait\nA) Dispositions relatives à l’implantation d’éléments de façade comportant une ou plusieurs baies\nd’une surface supérieure à 0,25 m² à l’exclusion des baies de type zénithal :\nLa distance D, comptée horizontalement, de l’élément de façade qui comporte des baies à la limite\nséparative lui faisant face, doit être supérieure ou égale à la hauteur de cet élément de façade par\nrapport au terrain naturel avant travaux, diminuée de 3 mètres, sans pouvoir être inférieure à\n6 mètres :\n    DH-36m\nB) Dispositions relatives à l’implantation d’éléments de façade dépourvus de baies d’une surface\nsupérieure à 0,25 m². Lorsque les baies sont accolées, la surface totale des baies est prise en compte\npour le calcul de leur surface.\nLa distance de chaque élément de façade aveugle ou ne comportant que des jours de souffrance ou\ndes baies d’une surface inférieure à 0,25 m², comptée horizontalement jusqu’à la limite séparative lui\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    19","    UA\nfaisant face doit être au moins égale à la moitié de la hauteur de cet élément de façade par rapport\nau terrain naturel avant travaux sans pouvoir être inférieure à 3 mètres :\n    DH3m\n    2\n7.2    Constructions existantes\nLes agrandissements de faible importance ayant pour but l’amélioration du bâtiment (ascenseurs,\nsanitaire, mise en normes de confort, locaux déchets ménagers, vélos, etc...) pourront être autorisés\nsans respecter les règles précitées. Elles devront s’implanter soit en limite séparative soit avec un\nrecul d’au moins 2 m.\nArt. UA 8. IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT AUX AUTRES SUR\nUNE MÊME PROPRIÉTÉ\nLa distance entre tout point de deux constructions non contigües situées sur une même propriété\ndoit être au moins égale à :\n8.1    Dispositions relatives à l’implantation d’éléments de façade comportant une ou plusieurs\nbaies d’une surface supérieure à 0,25 m² à l’exclusion des baies de type zénithal :\nLa distance D, comptée horizontalement, de l’élément de façade comportant une ou plusieurs baies\nd’une surface supérieure à 0,25 m² jusqu’au bâtiment lui faisant face, doit être supérieure ou égale à\nla hauteur de cet élément de façade par rapport au terrain naturel avant travaux, diminuée de\n3 mètres, sans pouvoir être inférieure à 6 mètres :\n    DH-36m\n8.2    Dispositions relatives à l’implantation d’éléments de façade dépourvus de baies d’une\nsurface supérieure à 0,25 m² :\nLa distance de chaque élément de façade aveugle ou ne comportant que des jours de souffrance ou\ndes baies d’une surface inférieure à 0,25 m², comptée horizontalement jusqu’au bâtiment lui faisant\nface doit être au moins égale à la moitié de la hauteur de cet élément de façade par rapport au\nterrain naturel avant travaux sans pouvoir être inférieure à 3 mètres :\n    DH3m\n    2\nLorsque les baies sont accolées, la surface totale des baies est prise en compte pour le calcul.\n8.4    Il n’est pas fixé de règle pour la distance entre la construction principale et une annexe d’une\nsurface à moins de 20 m².\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    20","    UA\nArt. UA 9. EMPRISE AU SOL\nPour les constructions l'emprise au sol des bâtiments ne doit pas excéder 65 % de la surface du\nterrain.\nLes agrandissements de faible importance ayant pour but l’amélioration du bâtiment (ascenseurs,\nsanitaires, mise aux normes de confort, locaux déchets ménagers, vélos, etc...) pourront être\nautorisés sans qu’il soit fait appel à la règle précitée.\nEn secteur UAc, il n’est pas fixé de règle.\nArt. UA 10. HAUTEUR MAXIMUM DES CONSTRUCTIONS.\n10.1    Les constructions devront pouvoir s’inscrire dans le volume déterminé par les plans suivants:\na) les plans verticaux déterminés par les limites parcellaires du terrain ;\nb) le plan incliné à 45° passant par le point situé au droit de la limite opposée existante ou future, de\nl’emprise de la voie publique ou privée ouverte à la circulation automobile et adjacente au terrain :\n    HL\nc) les plans parallèles au terrain naturel avant travaux à une hauteur de 17 mètres au point le plus\nhaut, le nombre de niveaux étant limité à 5 ;\n10.2    Dispositions particulières\na) Pour les voies dont la largeur est supérieure à 10 mètres : les règles applicables sont celles définies\nau UA 10.1.\nb) Pour les voies dont la largeur est inférieure ou égale à 10 mètres : les règles applicables sont celles\ndéfinies au UA 10.1. De plus, conformément au schéma ci-dessous, à partir du R+1 2, les niveaux\nsupérieurs devront être réalisés avec un retrait de 2 mètres minimum traité en balcon ou terrasse à\nchaque niveau.\n    2m min\n    2m min\n    17 m\n    2m min   R+2\n    R+1\n    R\nc) Le plan incliné à 45° sur l’horizontale généré par la ligne parallèle aux limites séparatives du terrain\ncontigu à une zone UD, placée à une hauteur de 6 mètres au point le plus haut par rapport au terrain\nnaturel avant travaux ;\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    21","    UA\nd) En zone UAc, la hauteur des constructions comptée à partir du niveau de la dalle ou du terrain\nnaturel est de 6 mètres maximum.\ne) À l’angle des îlots limités par des voies d’inégales largeurs, la hauteur des constructions est\ndéterminée en fonction de la voie la plus large, sur une longueur de 15 mètres à partir de l’angle du\nterrain.\n    8m\n    R+1\n    R+4\n    15m\n    R+4\n    17 m\nf) La pose d’éléments tels que antennes, climatiseurs cheminées ou tourelles d’extraction est\nautorisée au-delà de cette hauteur sous réserve de ne pas excéder la hauteur des installations déjà\nexistantes.\nArt. UA 11. ASPECT EXTÉRIEUR\n« Le permis de construire ou déclaration préalable de travaux peut être refusé(e) ou n’être\naccordé(e) que sous réserve de l’observation de prescriptions spéciales si les constructions, par leur\nsituation, leur architecture, leurs dimensions ou l’aspect extérieur des bâtiments ou ouvrages à\nédifier ou à modifier, sont de nature à porter atteinte au caractère ou à l’intérêt des lieux\navoisinants, aux sites, aux paysages naturels ou urbains, ainsi qu’à la conservation des perspectives\nmonumentales.»\n11.1   Constructions neuves\nAucun « style » spécifique n’est imposé. Devront être évitées les architectures simplistes,\nminimalistes ou trop géométriques. La composition et la volumétrie devront être particulièrement\nsoignées.\nToutefois sont vivement déconseillés les pastiches de styles ou modes de construction\nanachroniques (colonnes, pilastres, frontons, etc.) ou régionalistes.\nEn règle générale, les projets pourront être le reflet de tendances contemporaines, tout en\ns’inspirant de l’histoire et de la géographie de Saint-Cloud et du contexte environnant.\nLes façades devront être travaillées et devront être le reflet des fonctions du bâtiment\n(soubassement, étages, attique, etc.). Des rythmes horizontaux et verticaux devront marquer les\ndifférentes hiérarchies et fonctions.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    22","    UA\nToutes les façades devront être traitées avec le même soin et une qualité de composition\néquivalente, qu’il s’agisse de façades principales ou secondaires (y compris les pignons aveugles), ou\ndes bâtiments annexes.\nLes façades commerciales\nLes façades de locaux commerciaux doivent être conçues en harmonie avec les caractéristiques\narchitecturales de la construction dans laquelle elles sont situées.\nLa hauteur des rez-de-chaussée commerciaux doit être au minimum de 3 mètres.\nLes créations ou modifications de façades doivent respecter les prescriptions suivantes :\n- Les percements destinés à recevoir des vitrines doivent s’adapter à l’architecture de la construction\nconcernée ;\n- Lorsqu’un même commerce est établi sur plusieurs constructions contiguës, les percements de\nvitrines doivent en respecter les limites séparatives ;\n- L’utilisation de manière uniforme de teintes vives est proscrite ;\n- Lorsqu’une façade commerciale existante présente un intérêt patrimonial ou architectural\n(modénatures, panneaux en bois travaillés, appareillage en pierres, etc.), celle-ci doit être, sauf une\nimpossibilité technique avérée, préservée ou mise en valeur ;\n- Lorsque le rez-de-chaussée (des constructions nouvelles ou lors d’une modification) doit comporter\nl’emplacement d’un bandeau destiné à recevoir une enseigne, il doit être séparé de façon visible du\npremier étage, en s’inspirant des systèmes traditionnels (corniches, retraits, etc.).\n- Il doit également être proportionné à la taille des locaux, du bâtiment et de la rue. Le bandeau doit\négalement se limiter au linéaire des vitrines commerciales ;\n- Lors de l’installation de rideaux métalliques, les caissons doivent être intégrés dans le gros œuvre et\nne pas présenter de saillie en façade. Ces rideaux sont de préférence ajourés.\nLes extractions nécessaires aux commerces devront respecter la réglementation en vigueur (Code de\nla construction).\nLes matériaux et détails d’exécution devront assurer la pérennité des bâtiments.\nStructure :\nSont autorisés les matériaux type pierre, brique, meulière, béton, métal, bois, verre, etc… ;\nSont interdits les matériaux légers type « onduline » ou les matériaux de remplissage non enduits ;\nMenuiseries, occultations, clôtures\nSont autorisés l’acier, l’aluminium, le bois ;\n11.2    Extensions - surélévations\nLes extensions ou surélévations doivent respecter la volumétrie, les matériaux, les rythmes et les\nmodénatures de l’existant, avec la même qualité de détails, d’autant plus s’il s’agit d’un bâtiment ou\nensemble remarquable identifié au titre de l’article L. 123-1-5 III 2° du Code de l’urbanisme\nDans le cas du choix d’une facture contemporaine pour l’extension ou la surélévation, les volumes\ndoivent s’inscrire harmonieusement avec le bâti existant ; les volumes géométriques simplistes sont\nproscrits.\nDans le cas d’une extension ou surélévation représentant plus de 30 % du volume existant, une\nrecomposition générale pourra être envisagée, mais avec la même qualité que l’existant.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    23","    UA\n11.3    Clôtures\nLes clôtures sur voies devront être constituées d’un mur-bahut maçonné, d’une hauteur maximale de\n0,80 mètre par rapport au terrain naturel avant travaux, dans lequel devront être insérés les coffrets\ntechniques (ERDF, GRDF,…). Ce mur-bahut devra être surmonté d’une partie à claire-voie\n(pourcentage de vides de 80 % minimum par rapport aux pleins).\nLes clôtures sur voie devront être doublées de haies végétales.\nLa hauteur maximum des clôtures est limitée à 2,10 mètres, sauf contexte spécifique (mur de\nsoutènement ou mur existant remarquable). Cette règle s’applique également dans les cas de\nmodification et de réfection.\nDes exceptions à ces règles peuvent être autorisées en cas de constructions ou installations\nnécessaires aux services publics ou d’intérêt collectif, lorsque des raisons techniques ou de sécurité\nl’imposent.\nMatériaux :\nSelon le contexte du paysage de la rue, peuvent être utilisés les matériaux de type pierre, brique,\nmétal, bois ou blocs de béton enduits.\nSont interdits :\nLes matériaux de remplissages utilisés à nu, non enduits ;\nLes canisses en plastique ;\nLes grillages simples avec matériaux opacifiants rapportés.\nCouleurs :\nPierre et brique sont utilisés bruts, non peints.\nMétal ou bois, une seule couleur de préférence, deux au maximum.\nVégétation : des haies peuvent tenir lieu de clôture.\nLes haies devront être constituées d’espèces mélangées\nLes essences devront être choisies en fonction de l’orientation et de la composition du sol.\nLa haie taillée :\nSa hauteur varie entre 1,2 mètre et 1,8 mètre de hauteur, les plants sont distants de 30 à 40\ncentimètres.\nArt. UA 12. STATIONNEMENT.\n12.1 Pour toute construction nouvelle, il est exigé des aires de stationnement suivant les normes\nminimales suivantes :\nHabitat\nConstruction neuve    : 1 place par logement plus 1 place supplémentaire pour tous les\n    logements d’une superficie supérieure à 100 m² de surface de\n    plancher, plus 1 place par tranche de trois logements.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    24","    UA\nCommerce, artisanat    : surface de plancher inférieure à 200 m² : pas de règle\n    surface de plancher cumulée sur une même opération\n    supérieure à 200 m² : 1 place pour 100 m²\n    surface de plancher cumulée sur une même opération\n    supérieure à 300 m² : 1 place de livraison\nBureaux    : 1 place pour 100 m² de surface de plancher\nHôtel    : 1 place pour 4 chambres\nIndustrie et dépôts    : 1 place pour 200 m² de surface de plancher\nÉquipements publics et d’intérêt collectif : le nombre de places sera déterminé en fonction de la\nsituation et de la nature de l’établissement, des possibilités de desserte en transports en commun et\ndes places offertes dans les parcs publics de stationnement.\nÉquipement d’intérêt collectif à caractère résidentiel (Résidence étudiante, de personnes âgées,\nfoyer de jeunes travailleurs…) : 1 place pour 10 chambres\nDans le secteur UAc, le nombre de places de stationnement sera déterminé en accord avec la Ville.\n12.2 Dans le cadre de l’extension d’habitat existant, il sera demandé au pétitionnaire de se mettre\naux normes du stationnement réglementé par l’article 12.1.\n12.3 L'accès au sous-sol doit présenter un palier de pente inférieure à 5 % d'une longueur\nminimale de 5,00 mètres au débouché sur l'alignement chaque fois que c’est possible.\n12.4 Pour les logements locatifs financés avec un prêt aidé par l’État, ainsi que lors de la\nconstruction des établissements assurant l’hébergement des personnes âgées mentionnés au\n6° du I de l’article L. 312.1 du Code de l’action sociale et des familles et des résidences universitaires\nmentionnées à l’article L. 631-12 du Code de la construction et de l’habitation, il ne peut être exigé la\nréalisation de plus d’une aire de stationnement par logement.\n12.5 Pour les constructions comportant plus de deux logements, une proportion de 50 % au moins\ndes surfaces totales de stationnement définies ci-dessus doit être réalisée dans le volume même des\nconstructions.\n12.6    Stationnement des deux roues et des poussettes :\nPour les constructions comportant trois logements et plus, un local à cycles par cage d’escalier doit\nêtre aménagé au rez-de-chaussée, à proximité de l’entrée principale, en évitant tout franchissement\nd’escaliers ou de portes. Il donnera dans la mesure du possible directement sur la voie publique. Tout\nlocal réservé à cet usage doit avoir une surface d’au moins 3 m² et être clos et couvert. Sa superficie\nest calculée en fonction des normes suivantes :\n- Pour les logements : une superficie d’au minimum 0,75 m² pour les T1 et T2 et d’au minimum\n    1,5 m² pour tous les autres logements ;\n- Bureaux : 1,5 m² pour 100 m² de surface de plancher ;\n- Commerces de plus de 500 m² de surface de plancher : 1 place pour 10 employés avec en plus, le\n    stationnement visiteurs\n- Artisanat, industrie, hébergement hôtelier, de plus de 500 m² de de surface de plancher :\n    1 place pour 10 employés avec en plus, le stationnement visiteurs ;\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    25","    UA\n-   Équipements scolaires : primaires, collèges, lycées et universités = 1 place pour 8 à 12 élèves ;\n-   Pour les constructions et installations nécessaires aux services publics ou d’intérêt collectif :\n    1 place pour 20 places de capacité de réception.\nPour les constructions comportant trois logements et plus, un local à poussettes devra également\nêtre créé, séparé du local à vélos, au niveau du rez-de-chaussée à proximité de l’entrée et avec une\nsurface minimale de 3 m².\n12.7 Le calcul du nombre de place sera arrondi à l’unité inférieure si la première décimale est\ninférieure ou égale à 5.\n12.8 Les bâtiments neufs à usage principal d’habitation, qui comportent un parc de\nstationnement, doivent être pré-équipés afin de faciliter la mise en place ultérieure d’infrastructures\nde recharge pour les véhicules légers. Soit :\n- alimentation en électricité du parc de stationnement, avec présence d’un tableau général basse\ntension en aval du disjoncteur de l’immeuble. L’alimentation électrique ainsi que le tableau sont\ndimensionnés de façon à permettre la recharge normale de véhicules pour un minimum de 10 % des\nplaces, avec au minimum une place ;\n- installation de gaines, fourreaux, chemins de câbles à partir du tableau général basse tension,\npermettant une facturation individuelle des consommations.\n12.9 Les bâtiments de bureaux, qui comportent un parc de stationnement, doivent être équipés\nde points de charge, permettant la recharge des véhicules légers.\nL’obligation consiste en un équipement, par le propriétaire du parc, de points de charge pour la\nrecharge normale des véhicules légers, avec une alimentation en électricité d’une partie des places,\navec un minimum d’une place, à partir d’un tableau général basse tension en aval du disjoncteur de\nl’immeuble.\nArt. UA 13. ESPACES LIBRES ET PLANTATIONS\n13.1 Au moins 20 % de la surface du terrain doit être traitée en espaces verts de pleine terre avec\nau minimum 1 arbre pour 100 m² d’espaces verts.\nPour les projets de construction liés à des équipements d’intérêt collectif qui par leur nature\nrequièrent des espaces libres non plantés (exemple : cours d’écoles, jardins d’enfants, parkings\npublics), le minimum d’espaces verts est ramené à 10 %.\nLes espaces verts sur dalle ou en terrasse et les toitures végétalisées sont comptabilisés pour 50 % de\nleur surface dans le calcul des espaces verts, et ne peuvent pas dépasser 20 % de la surface totale\nrequise.\nLes toitures végétalisées et les espaces verts sur dalle ou en terrasse doivent être accessibles pour\npermettre leur entretien et avoir une épaisseur de terre végétale d’un minimum de 0,60 mètre.\nLes espaces verts protégés et ceux faisant partie d’un ensemble remarquable identifiés au titre de\nl’article L. 123-1-5 III 2° du Code de l’urbanisme doivent être conservés sauf une impossibilité\ntechnique avérée ou sauf si leur suppression est rendue nécessaire pour la sécurité des personnes et\ndes biens. Dans le cas où un arbre serait abattu, il devra être remplacé par un arbre de même espèce\nou d’une espèce susceptible de redonner une valeur paysagère équivalente.\n13.2 Dans la zone UAc, seule la prescription suivante est applicable : la superficie des toitures en\nterrasse non occupée par des locaux techniques doit être traitée en espaces verts.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   26","    UA\n13.3 Les unités foncières comprises dans l’îlot situé entre l’emprise du tramway, le boulevard\nSénard, ainsi que l’avenue de Longchamp et la rue du Docteur Nicoli et créées après l’approbation du\nprésent règlement, issues de division, de regroupement ou de fusion de parcelles, doivent conserver\nune surface de pleine terre correspondant à 2,7 m² d’espaces verts de pleine terre pour 1 m²\nd’emprise au sol effectivement consommée en l’application de l’article 9.\nLes espaces verts sur dalle ou en terrasse et les toitures végétalisées ne sont pas comptabilisés dans\nle calcul des espaces verts de pleine terre.\n    III - POSSIBILITÉ MAXIMALE D'OCCUPATION DU SOL\nArt. UA 14. COEFFICIENT D'OCCUPATION DU SOL.\nSans objet.\nArt. UA 15. PERFORMANCES ÉNERGÉTIQUES ET ENVIRONNEMENTALES\nPour les espaces réservés aux stationnements, il est préconisé d’aménager des stationnements\nvégétalisés, afin de réduire les espaces imperméabilisés.\nL’orientation et la conception des constructions, visant à limiter la consommation d’énergie, sont\nconseillées, ainsi que l’utilisation de matériaux durables.\nL’installation de dispositifs de production d’énergie renouvelable pour l’approvisionnement\nénergétique des constructions (chaudière à bois, eau chaude sanitaire solaire, pompes à chaleur,\npanneaux photovoltaïques, géothermie…) est recommandée.\nArt. UA 16. RÉSEAU NUMÉRIQUE\nPour les constructions à usage d’habitation de trois logements et plus, ainsi que pour les\nconstructions à usage de bureaux et d’hébergement hôtelier, devront être prévus les réseaux\ninternes à la construction permettant le raccordement à un réseau collectif de haut débit.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    27","    UA\nModification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   28","    UC\n    ZONE UC\n Zone à dominante d’habitat collectif avec un bâti relativement haut et construit en ordre\n    discontinu\n    I - NATURE DE L'OCCUPATION ET DE L'UTILISATION DU SOL\nArt. UC 1. OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\n1.1    Les constructions à usage d’activités à caractère industriel.\n1.2    Les dépôts de ferrailles, matériaux, combustibles solides ou liquides, les entreprises de\ncassage de voitures à l'air libre et les fourrières.\n1.3    Le camping.\n1.4    Les affouillements, exhaussements des sols et les exploitations de carrières non liés à des\ntravaux de construction.\nArt. UC 2. OCCUPATIONS ET UTILISATIONS DU SOL ADMISES SOUS CONDITIONS\n2.1    L'implantation, l'agrandissement ou la modification de l'existant des installations classées\ncompatibles avec le caractère de la zone\n2.2    Sur les terrains comportant d’anciennes carrières et ceux soumis au risque de glissement de\nterrains, les constructions peuvent faire l'objet de recommandations particulières. Les dispositions\ndu PPRMT, en annexe du PLU, doivent être respectées.\n2.3    Dans les secteurs soumis aux risques d’inondation, les constructions, ouvrages et travaux\nsont soumis aux dispositions du PPRI, en annexe du PLU.\n2.4    Le long des linéaires d’axes commerciaux mentionnés au document graphique, au titre de\nl’article L. 123-1-5 II 5° du Code de l’urbanisme, est interdite la transformation en logements, de\nlocaux existants, à la date d’application du présent règlement, situés en rez-de-chaussée et destinés\nà l’accueil d’activités commerciales.\n2.5    En limite du domaine ferroviaire, l’implantation des constructions doit respecter les règles\ndes servitudes ferroviaires, en annexe du PLU.\n2.6    Dans les parties de la zone soumises au risque technologique de transports de matière\ndangereuse lié à la présence des canalisations de gaz à haute pression, dont le tracé figure dans le\nplan des servitudes d’utilité publique annexé au PLU, toute occupation ou utilisation du sol doit\nrespecter les règles visant à garantir sa sécurité publique. Les projets concernés par ce risque,\npourront être autorisés après avis et sous réserve de l’observation des prescriptions spéciales ou\nmesures conservatoires qui seraient émises par le service intéressé et le service gestionnaire de ces\nouvrages. Les ouvrages de transports devront se conformer aux dispositions en vigueur notamment\npar des mesures de protection suffisantes. Ces dispositions figurent dans une fiche d’information en\nannexe du règlement.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    29","    UC\n2.6    Les travaux de maintenance, de modification des ouvrages électriques à haute et très haute\ntension sont autorisés pour des exigences fonctionnelles et/ou techniques.\n2.7    Protection sanitaire de l’aqueduc de l’Avre : les dispositions prévues en annexe doivent être\nrespectées\n    Il - CONDITIONS DE L'OCCUPATION DU SOL\nArt. UC 3. ACCÈS\n3.1    Conditions liées à la desserte du terrain par une voie d’accès existante ou par une voie\nd’accès créée\nPour être constructible, un terrain doit avoir accès à une voie publique ou privée respectant les\nconditions suivantes :\n    •   Pour toute opération conduisant à la desserte de 1 ou 2 logements y compris les logements\n    existants à la date d’application du présent règlement, l'emprise de la voie de desserte doit\n    avoir une largeur minimum de 3 mètres sur toute sa longueur.\n    •   Pour toute opération conduisant à la desserte de 3 logements et plus y compris les\n    logements existants à la date d’application du présent règlement, et pour tous les autres\n    types de constructions autorisés dans cette zone, l'emprise de la voie de desserte doit avoir\n    une largeur minimum de 4 mètres sur toute sa longueur, avec une chaussée aménagée pour\n    permettre le croisement des véhicules. Les voies et chemin d’accès se terminant en impasse\n    (chemins privés réalisés sur des parcelles privées) desservant plus de deux logements y\n    compris des logements existants doivent être aménagés de façon à permettre aux véhicules\n    de faire demi-tour.\nToutefois, sur les terrains déjà bâtis insuffisamment desservis, un agrandissement de faible\nimportance d’une construction existante à la date d’application du présent règlement peut être\nautorisé à condition d’être située à moins de 150 mètres d’une bouche d’incendie.\nLes voies de desserte doivent être conçues et aménagées de manière à garantir la sécurité des\npiétons et des cycles.\n3.2    Conditions liées aux caractéristiques des accès à la parcelle existants ou créés\nLes accès doivent être conçus et aménagés en tenant compte de la topographie et de la morphologie\ndes lieux, de la nature des voies sur lesquelles elles débouchent (intensité du trafic, visibilité,\nvitesse...), de la nature et de l’affectation des constructions existantes et des constructions projetées\nainsi que du trafic engendré par la nouvelle construction. Ils doivent permettre l’entrée et la sortie\ndes véhicules sans manœuvre sur la voie de desserte.\n3.3    Conditions à respecter pour l’aménagement des chemins d’accès aux garages ou aux places\nde stationnement situés sur le terrain d’emprise de la construction\nUn chemin carrossable doit permettre d’accéder aux garages ou aux places de stationnement\nréalisées sur la parcelle. Il doit être de taille et de dimension suffisante compte tenu du nombre de\nplaces de stationnement desservies, avec un minimum de 3 mètres.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    30","    UC\nArt. UC 4. DESSERTE PAR LES RÉSEAUX\n4.1    Eau :\nToute construction nouvelle doit être raccordée au réseau public d'eau.\n4.2    Assainissement :\nToute construction nouvelle doit être raccordée au réseau public d’assainissement, dans la mesure\noù ce raccordement est techniquement et financièrement viable. Dans le cas contraire, une\ndérogation pour la mise en place d’un assainissement autonome pourrait être accordée.\nToute nouvelle construction ou extension devra respecter les prescriptions des règlements\nd’assainissement en vigueur, notamment en matière de gestion des eaux pluviales.\n(chapitre 4 du règlement d’assainissement de la ville de Saint-Cloud).\nTout raccordement doit être conforme au règlement du service de l’assainissement de la ville de\nSaint-Cloud approuvé par le Conseil communautaire de la Communauté d’agglomération\nCœur-de-Seine du 14 octobre 2014. Ce règlement précise qu’en cas de raccordement au réseau\ndépartemental d’assainissement, la gestion des eaux pluviales à la parcelle, sans raccordement au\nréseau public doit être la première solution recherchée.\nToutefois, lorsque la gestion totale de ces eaux à la parcelle n’est pas possible, le propriétaire peut\nsolliciter l’autorisation de raccorder ses eaux de ruissellement au réseau pluvial ou unitaire à la\ncondition que ses installations soient conformes aux prescriptions techniques définies dans le\nchapitre 4 du règlement d’assainissement de la ville de Saint-Cloud. Dans ce cas, seul l’excès de\nruissellement peut être canalisé après qu’aient été mises en œuvre toutes les solutions susceptibles\nde favoriser la gestion à la parcelle, telles que l’infiltration, la réutilisation des eaux claires, le\nstockage, ainsi que les rejets au milieu naturel.\nL’excédent d’eaux de ruissellement n’ayant pu être géré à la parcelle est soumis à des limitations de\ndébit de rejet afin de limiter à l’aval les risques d’inondation ou de déversement d’eaux polluées au\nmilieu naturel. Le débit de fuite pour une pluie de retour décennal ne doit pas excéder :\n    -   2L/s/ha dans le cas d’un rejet dans le réseau unitaire ;\n    -   10L/s/ha dans le cas d’un rejet dans un réseau d’eaux pluviales, sauf dispositions locales\n    particulières (notamment en raison d’insuffisance hydraulique locale, ou exutoire aval\n    constitué d’un réseau unitaire).\nDans tous les cas, l’acceptation du raccordement des eaux pluviales de toute nouvelle construction\nsera subordonnée à la capacité d’évacuation du réseau existant. Le constructeur ou l’aménageur doit\njustifier, par la production à l’exploitant de notes de calcul appropriées, le dimensionnement\nsuffisant des installations de rétention qu’il installe en amont du raccordement.\nTout rejet d’eaux usées autres que domestiques dans les réseaux publics d’assainissement doit être\npréalablement autorisé soit par arrêté d’autorisation de déversement signé par le maître d’ouvrage\ndu réseau concerné, complété éventuellement par une convention spéciale de déversement, soit par\nune convention de rejet d’eaux usées non domestiques assimilables à des eaux usées domestiques.\nElles ne pourront être rejetées à l’égout que dans les conditions définies au chapitre 3 du règlement\nd’assainissement de la ville de Saint-Cloud.\nLes rejets d’eaux claires permanentes telles qu’eaux de pompage de nappe, eaux d’exhaure, eaux de\npompe à chaleur ou similaires sont interdits dans les réseaux d’assainissement unitaires ou d’eaux\nusées. Dans le cas d’activités produisant provisoirement des eaux d’exhaure, en l’absence de solution\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   31","    UC\nalternative et sous réserve d’une capacité suffisante du réseau, une autorisation dérogatoire peut\nêtre accordée, en référence au règlement du service de l’assainissement de la ville de Saint-Cloud\n(art. 22.2). Une convention temporaire de rejet pour ces eaux doit alors être cosignée par le\ndemandeur et les collectivités concernées.\n4.3    Électricité et téléphone :\nLes réseaux électriques et téléphoniques doivent être enterrés sur le terrain. Les armoires\nélectriques doivent être implantées à l’intérieur du terrain de la construction.\nLes coffrets de toute nature devront être incorporés à la clôture de la propriété. Ils ne peuvent en\naucun cas déborder sur le domaine public.\n4.4    Tri sélectif :\nToute construction nouvelle doit prévoir des locaux poubelles correctement dimensionnés pour\naccueillir l’ensemble des bacs de la collecte sélective, conformément au Plan Régional d’élimination\ndes déchets ménagers et assimilés (PREDMA) approuvé le 26 novembre 2009.\nArt. UC 5. CARACTÉRISTIQUES DES TERRAINS\nSans objet.\nArt. UC 6. IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX VOIES ET EMPRISES\nPUBLIQUES\n6.1   Si aucun reculement ne figure au plan, les constructions doivent être implantées à 6 mètres\nminimum de la limite d’emprise des voies et emprises publiques.\n6.2    Si un reculement ou une zone non aedificandi figurent au plan, les constructions doivent être\nimplantées à 6 mètres minimum de la limite d’emprise projetée de la voie et emprise publique, ou de\nla zone non aedificandi.\n6.3    À l’intérieur de la marge de reculement les saillies d’un maximum de 2 mètres de large sur\nreculement pourront être autorisées à une hauteur supérieure à 5,5 mètres comptée à partir du sol.\nLa pose de matériaux d’isolation extérieure des façades est également autorisée dans la marge de\nreculement avec une épaisseur maximale de 20 centimètres.\n6.4    Les terrains situés à l'angle de deux voies ouvertes à la circulation automobile publique\ndoivent supporter un pan coupé d'une longueur minimale de 7 mètres à angles égaux.\n6.5   Dans les marges de reculement, l’aménagement d’aires de jeux, de sports et de loisirs ne\ncomportant aucun bâtiment ainsi que les rampes d’accès est autorisé.\n6.6   Les locaux de stockage de déchets seront obligatoirement implantés à l’alignement avec des\naménagements architecturaux et paysagés, ainsi qu’avec un accès direct sur la voie.\n6.7    Construction existante à la date d’application du présent règlement, l’extension et la\nsurélévation de bâtiments existants ne respectant pas la marge de reculement peut être autorisée\ndans le prolongement de la leurs façades existante.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    32","    UC\nArt. UC 7. IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX LIMITES SÉPARATIVES\n7.1    Constructions nouvelles\n7.1.1 Dans une bande de 25 mètres comptée à partir de la limite d’emprise de la voie, existante ou\nfuture, de la marge de reculement ou de la zone non aedificandi imposée (cf art. UC 6).\nPour les terrains dont la largeur est inférieure ou égale à 15 mètres : les constructions sont\nautorisées soit sur les limites séparatives, si cette façade sur la limite ne comporte pas de baies\nautres que des jours de souffrance et ne dépasse pas 9 mètres de hauteur, soit en retrait\nconformément à l’article 7.1.3.\nPour les terrains dont la largeur est comprise entre 15 et 30 mètres, les constructions en\nmitoyenneté ne sont autorisées que sur une seule des limites séparatives et à condition que cette\nfaçade ne comporte pas de baie autre que des jours de souffrance et ne dépasse pas 9 mètres de\nhauteur. Les constructions en retrait des limites séparatives sont autorisées, à condition de respecter\nles dispositions de l’article 7.1.3.\nPour les terrains dont la largeur est supérieure à 30 mètres, les constructions ne sont autorisées\nqu’en retrait des limites séparatives conformément à l’article 7.1.3.\nNonobstant les règles précédentes, les constructions sur les limites sont autorisées si elles s’adossent\nà une construction en bon état, de dimensions égales ou supérieures existant sur le terrain voisin et\nqu’elles s’insèrent dans les héberges existantes.\n7.1.2 Constructions au-delà de la bande de 25 mètres\nAu-delà de la bande de 25 mètres ci-dessus définie, les constructions doivent respecter les règles\ndéfinies au 7.1.3. Elles ne peuvent être implantées en limite séparative que dans les cas suivants :\n-    si elles s’adossent à une construction en bon état et de dimensions égales ou supérieures\n    existant sur le terrain voisin et qu’elles s’insèrent dans les héberges existantes ;\n-    si leur hauteur maximum ne dépasse pas 2,60 mètres et qu’elles ne soient pas affectées à\n    l’habitation ni à une activité industrielle, artisanale ou de bureau.\n7.1.3 Implantations en retrait\nA) Dispositions relatives à l’implantation d’éléments de façade comportant une ou plusieurs baies\nd’une surface supérieure à 0,25 m², à l’exclusion des baies de type zénithal.\nLa distance D, comptée horizontalement, à partir de l’élément de façade jusqu’à la limite séparative\nlui faisant face doit être supérieure ou égale à la hauteur de cet élément de façade par rapport au\nterrain naturel avant travaux, sans pouvoir être inférieure à 8 mètres :\n    DH8m\nB) Dispositions relatives à l’implantation d’éléments de façade dépourvus de baies d’une surface\nsupérieure à 0,25 m². Lorsque les baies sont accolées, la surface totale des baies est prise en compte\npour le calcul de leur surface.\nLa distance de chaque élément des façades aveugles ou ne comportant que des jours de souffrance\nou des baies d’une surface inférieure à 0,25 m², comptée horizontalement jusqu’à la limite\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    33","    UC\nséparative lui faisant face doit être au moins égale à la moitié de la hauteur de cet élément de façade\npar rapport au terrain naturel avant travaux sans pouvoir être inférieure à 4 mètres :\n    DH4m\n    2\n7.2    Agrandissement de l'existant.\nLes agrandissements de faible importance ayant pour but l’amélioration du bâtiment (ascenseurs,\nsanitaires, mises aux normes de confort, locaux déchets ménagers, vélos, etc ...) pourront être\nautorisés sans respecter les règles précitées.\nArt. UC 8. IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT AUX AUTRES SUR\nUNE MÊME PROPRIÉTÉ\nLa distance entre tout point de deux constructions non contigües situées sur une même propriété\ndoit être au moins égale à :\n8.1    Dispositions relatives à l’implantation d’éléments de façade comportant une ou plusieurs\nbaies d’une surface supérieure à 0,25 m² à l’exclusion des baies de type zénithal.\nLa distance D, comptée horizontalement, de l’élément de façade jusqu’au bâtiment lui faisant face,\ndoit être supérieure ou égale à la hauteur de cet élément de façade par rapport au terrain naturel\navant travaux, sans pouvoir être inférieure à 8 mètres :\n    DH8m\n8.2    Dispositions relatives à l’implantation d’éléments de façade dépourvus de baies d’une\nsurface supérieure à 0,25 m².\nLa distance de chaque élément de façade aveugle ou ne comportant que des jours de souffrance ou\ndes baies d’une surface inférieure à 0,25 m², comptée horizontalement jusqu’au bâtiment lui faisant\nface doit être au moins égale à la moitié de la hauteur de cet élément de façade par rapport au\nterrain naturel avant travaux sans pouvoir être inférieure à 4 mètres :\n    DH4m\n    2\nLorsque les baies sont accolées, la surface totale des baies est prise en compte pour le calcul de leur\nsurface.\n8.3    L’extension ou la surélévation de constructions existantes, à la date d’application du présent\nrèglement, au droit des façades existantes est exonérée des règles ci-dessus.\n8.4    Il n’est pas fixé de règle pour la distance entre la construction principale et une annexe d’une\nsurface de moins de 20 m².\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    34","    UC\nArt. UC 9. EMPRISE AU SOL.\nL'emprise au sol des bâtiments ne doit pas excéder 40 % de la surface du terrain.\nLes agrandissements de faible importance ayant pour but l’amélioration du bâtiment (ascenseurs,\nsanitaires, mise aux normes de confort, locaux déchets ménagers, vélos, etc...) pourront être\nautorisés sans qu’il soit fait appel à la règle précitée.\nArt. UC 10. HAUTEUR MAXIMUM DES CONSTRUCTIONS.\n10.1    Les constructions devront pouvoir s’inscrire dans le volume capable déterminé par :\na) Les plans verticaux déterminés par les limites parcellaires du terrain ;\nb) Le plan incliné à 45° passant au droit
