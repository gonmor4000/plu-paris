 unitaire à la\ncondition que ses installations soient conformes aux prescriptions techniques définies dans le\nchapitre 4 du règlement d’assainissement de la ville de Saint-Cloud. Dans ce cas, seul l’excès de\nruissellement peut être canalisé après qu’aient été mises en œuvre toutes les solutions susceptibles\nde favoriser la gestion à la parcelle, telles que l’infiltration, la réutilisation des eaux claires, le\nstockage, ainsi que les rejets au milieu naturel.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    66","    UF\nL’excédent d’eaux de ruissellement n’ayant pu être géré à la parcelle est soumis à des limitations de\ndébit de rejet afin de limiter à l’aval les risques d’inondation ou de déversement d’eaux polluées au\nmilieu naturel. Le débit de fuite pour une pluie de retour décennal ne doit pas excéder :\n-    2L/s/ha dans le cas d’un rejet dans le réseau unitaire ;\n-  10L/s/ha dans le cas d’un rejet dans un réseau d’eaux pluviales, sauf dispositions locales\n   particulières (notamment en raison d’insuffisance hydraulique locale, ou exutoire aval constitué\n   d’un réseau unitaire).\nDans tous les cas, l’acceptation du raccordement des eaux pluviales de toute nouvelle construction\nsera subordonnée à la capacité d’évacuation du réseau existant. Le constructeur ou l’aménageur doit\njustifier, par la production à l’exploitant de notes de calcul appropriées, le dimensionnement\nsuffisant des installations de rétention qu’il installe en amont du raccordement.\nTout rejet d’eaux usées autres que domestiques dans les réseaux publics d’assainissement doit être\npréalablement autorisé soit par arrêté d’autorisation de déversement signé par le maître d’ouvrage\ndu réseau concerné, complété éventuellement par une convention spéciale de déversement, soit par\nune convention de rejet d’eaux usées non domestiques assimilables à des eaux usées domestiques.\nElles ne pourront être rejetées à l’égout que dans les conditions définies au chapitre 3 du règlement\nd’assainissement de la ville de Saint-Cloud.\nLes rejets d’eaux claires permanentes telles qu’eaux de pompage de nappe, eaux d’exhaure, eaux de\npompe à chaleur ou similaires sont interdits dans les réseaux d’assainissement unitaires ou d’eaux\nusées. Dans le cas d’activités produisant provisoirement des eaux d’exhaure, en l’absence de solution\nalternative et sous réserve d’une capacité suffisante du réseau, une autorisation dérogatoire peut\nêtre accordée, en référence au règlement du service de l’assainissement de la ville de Saint-Cloud\n(art. 22.2). Une convention temporaire de rejet pour ces eaux doit alors être cosignée par le\ndemandeur et les collectivités concernées.\n4.3    Électricité et téléphone :\nLes réseaux électriques et téléphoniques doivent être enterrés sur le terrain. Les armoires\nélectriques doivent être implantées à l’intérieur du terrain de la construction.\nLes coffrets de toute nature devront être incorporés à la clôture de la propriété. Ils ne peuvent en\naucun cas déborder sur le domaine public.\n4.4    Tri sélectif :\nToute construction nouvelle doit prévoir des locaux poubelles correctement dimensionnés pour\naccueillir l’ensemble des bacs de la collecte sélective, conformément au Plan Régional d’élimination\ndes déchets ménagers et assimilés (PREDMA) approuvé le 26 novembre 2009.\nArt. UF 5. CARACTÉRISTIQUES DES TERRAINS\nSans objet.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   67","    UF\nArt. UF 6. IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX VOIES OU EMPRISES\nPUBLIQUES\n6.1    Les constructions peuvent être implantées en limite d’emprise des voies ou emprises\npubliques actuelles ou des limites figurées au plan (alignement futur, marge de recul, zone non\naedificandi), soit en retrait d’au moins 2,5 mètres de ces limites.\n6.2    Les terrains situés à l'angle de deux voies ouvertes à la circulation automobile publique\ndoivent supporter un pan coupé d'une longueur minimale de 7 mètres à angles égaux.\n6.3    Lorsque les voies ont une emprise égale ou supérieure à 8 mètres, les saillies sur alignement\npourront être autorisées à une hauteur supérieure à 5,5 mètres comptée à partir du trottoir et avec\nune profondeur inférieure à 0,80 mètre. La pose de matériaux d’isolation extérieure des façades à\nl’alignement est autorisée avec une épaisseur maximale de 20 centimètres. Sur les routes\ndépartementales, le règlement de voirie du département des Hauts-de-Seine doit être respecté.\nArt. UF 7. IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX LIMITES SÉPARATIVES\n7.1    Constructions nouvelles\n7.1.1 Les constructions peuvent s'implanter soit sur les limites séparatives (murs aveugles ou ne\ncomportant que des jours de souffrance), soit en retrait conformément à l’article 7.1.2.\n7.1.2 Implantations en retrait\nA) Dispositions relatives à l’implantation d’éléments de façade comportant une ou plusieurs baies\n   d’une surface supérieure à 0,25 m² à l’exclusion des baies de type zénithal\nLa distance D, comptée horizontalement, de l’élément de façade à la limite séparative lui faisant face,\ndoit être supérieure ou égale à la hauteur de cet élément de façade par rapport au terrain naturel\navant travaux, sans pouvoir être inférieure à 6 mètres :\n    DH6m\nB) Dispositions relatives à l’implantation d’éléments de façade dépourvus de baies d’une surface\nsupérieure à 0,25 m². Lorsque les baies sont accolées, la surface totale des baies est prise en compte\npour le calcul de leur surface.\nLa distance de chaque élément de façade aveugle ou ne comportant que des jours de souffrance ou\nbaies d’une surface inférieure à 0,25 m², comptée horizontalement jusqu’à la limite séparative lui\nfaisant face doit être au moins égale à la moitié de la hauteur de cet élément de façade par rapport\nau terrain naturel avant travaux sans pouvoir être inférieure à 3 mètres :\n    DH3m\n    2\n7.2    Constructions existantes\nLes agrandissements de faible importance ayant pour but l’amélioration du bâtiment (ascenseurs,\nsanitaires, mise aux normes de confort, locaux déchets ménagers, vélos, etc ...) peuvent être\nautorisés sans respecter les règles précitées.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    68","    UF\nArt. UF 8. IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT AUX AUTRES SUR\nUNE MÊME PROPRIÉTÉ\n8.1    Dispositions relatives à l’implantation d’éléments de façade comportant une ou plusieurs\nbaies d’une surface supérieure à 0,25 m² à l’exclusion des baies de type zénithal\nLa distance D, comptée horizontalement, à partir de l’élément de façade jusqu’au bâtiment lui\nfaisant face doit être supérieure ou égale à la hauteur de cet élément de façade par rapport au\nterrain naturel avant travaux, sans pouvoir être inférieure à 6 mètres :\n    DH6m\n8.2    Dispositions relatives à l’implantation d’éléments de façade dépourvus de baies d’une\nsurface supérieure à 0,25 m².\nLa distance de chaque élément de façade aveugle ou ne comportant que des jours de souffrance ou\nbaies d’une surface inférieure à 0,25 m², comptée horizontalement jusqu’au bâtiment lui faisant face\ndoit être au moins égale à la moitié de la hauteur de cet élément de façade par rapport au terrain\nnaturel avant travaux sans pouvoir être inférieure à 4 mètres :\n    DH4m\n    2\nLorsque les baies sont accolées, la surface totale des baies est prise en compte pour le calcul de leur\nsurface.\n8.3 L’extension ou la surélévation de constructions existantes est exonérée des règles ci-dessus.\n8.4 Il n’est pas fixé de règle pour la distance entre la construction principale et une annexe d’une\nsurface à moins de 20 m².\n8.5 Le présent article n’est pas applicable aux bâtiments et installations nécessaires au\nfonctionnement du service public ferroviaire.\nArt. UF 9. EMPRISE AU SOL.\nIl n’est pas fixé de règle.\nArt. UF 10. HAUTEUR MAXIMUM DES CONSTRUCTIONS\n10.1 Les constructions devront pouvoir s’inscrire dans le volume capable déterminé par les plans\nsuivants :\na) Les plans verticaux déterminés par les limites parcellaires du terrain.\nb) Le plan incliné à 45° passant par, le point situé à 3 mètres de hauteur au droit de la limite opposée\nexistante ou future, de l’emprise de la voie publique ou privée ouverte à la circulation automobile et\nadjacente au terrain :\n    HL+3 ;\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    69","    UF\nc) Le plan parallèle au terrain naturel à une hauteur de 19 mètres au point le plus haut.\n10.2    Dispositions particulières :\na) Le plan incliné à 45° sur l’horizontale généré par la ligne parallèle aux limites séparatives du terrain\ncontiguës à une zone UD, placée à une hauteur de 96 mètres par rapport au terrain naturel avant\ntravaux.\nb) Les zones non altius tollendi figurées au plan.\nc) La pose d’éléments tels que antennes, climatiseurs, cheminées ou tourelles d’extraction est\nautorisée au-delà de cette hauteur sous réserve de ne pas excéder la hauteur des installations déjà\nexistantes.\nArt. UF 11. ASPECT EXTÉRIEUR\n« Le permis de construire ou déclaration préalable de travaux peut être refusé(e) ou n’être\naccordé(e) que sous réserve de l’observation de prescriptions spéciales si les constructions, par leur\nsituation, leur architecture, leurs dimensions ou l’aspect extérieur des bâtiments ou ouvrages à\nédifier ou à modifier, sont de nature à porter atteinte au caractère ou à l’intérêt des lieux\navoisinants, aux sites, aux paysages naturels ou urbains, ainsi qu’à la conservation des perspectives\nmonumentales.»\n11.1    Constructions neuves\nAucun « style » spécifique n’est imposé. Devront être évitées les architectures simplistes,\nminimalistes ou trop géométriques. La composition et la volumétrie devront être particulièrement\nsoignées.\nToutefois sont vivement déconseillés les pastiches de styles ou modes de construction\nanachroniques (colonnes, pilastres, frontons, etc.) ou régionalistes.\nEn règle générale, les projets pourront être le reflet de tendances contemporaines, tout en\ns’inspirant de l’histoire et de la géographie de Saint-Cloud et du contexte environnant.\nLes façades devront être travaillées et devront être le reflet des fonctions du bâtiment\n(soubassement, étages, attique, etc.). Des rythmes horizontaux et verticaux devront marquer les\ndifférentes hiérarchies et fonctions.\nToutes les façades devront être traitées avec le même soin et une qualité de composition\néquivalente, qu’il s’agisse de façades principales ou secondaires (y compris les pignons aveugles), ou\ndes bâtiments annexes.\nLes façades commerciales\nLes façades de locaux commerciaux doivent être conçues en harmonie avec les caractéristiques\narchitecturales de la construction dans laquelle elles sont situées.\nLa hauteur des rez-de-chaussée commerciaux doit être au minimum de 3 mètres.\nLes créations ou modifications de façades doivent respecter les prescriptions suivantes :\n- Les percements destinés à recevoir des vitrines doivent s’adapter à l’architecture de la\n    construction concernée ;\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    70","    UF\n-   Lorsqu’un même commerce est établi sur plusieurs constructions contiguës, les percements de\n    vitrines doivent en respecter les limites séparatives ;\n- L’utilisation de manière uniforme de teintes vives est proscrite ;\n- Lorsqu’une façade commerciale existante présente un intérêt patrimonial ou architectural\n    (modénatures, panneaux en bois travaillés, appareillage en pierres, etc.), celle-ci doit être, sauf\n    une impossibilité technique avérée, préservée ou mise en valeur ;\n- Lorsque le rez-de-chaussée (des constructions nouvelles ou lors d’une modification) doit\n    comporter l’emplacement d’un bandeau destiné à recevoir une enseigne, il doit être séparé de\n    façon visible du premier étage, en s’inspirant des systèmes traditionnels\n    (corniches, retraits, etc.) ;\n- Il doit également être proportionné à la taille des locaux, du bâtiment et de la rue. Le bandeau\n    doit également se limiter au linéaire des vitrines commerciales ;\n- Lors de l’installation de rideaux métalliques, les caissons doivent être intégrés dans le gros œuvre\n    et ne pas présenter de saillie en façade. Ces rideaux sont de préférence ajourés.\nLes extractions nécessaires aux commerces devront respecter la réglementation en vigueur\n(Code de la construction).\nLes matériaux et détails d’exécution devront assurer la pérennité des bâtiments.\nStructure :\nSont autorisés les matériaux type pierre, brique, meulière, béton, métal, bois, verre, etc… ;\nSont interdits les matériaux légers type « onduline » ou les matériaux de remplissage non enduits.\nMenuiseries, occultations, clôtures\nSont autorisés l’acier, l’aluminium, le bois ;\nMatériaux :\nSelon le contexte du paysage de la rue, peuvent être utilisés les matériaux de type pierre, brique,\nmétal, bois ou blocs de béton enduits.\nCouleurs :\nPierre et brique sont utilisés bruts, non peints.\nMétal ou bois, une seule couleur de préférence, deux au maximum.\n11.2    Extensions - surélévations\nLes extensions ou surélévations doivent respecter la volumétrie, les matériaux, les rythmes et les\nmodénatures de l’existant, avec la même qualité de détails, d’autant plus s’il s’agit d’un bâtiment ou\nensemble remarquable identifié au titre de l’article L. 123-1-5 III 2° du Code de l’urbanisme.\nDans le cas du choix d’une facture contemporaine pour l’extension ou la surélévation, les volumes\ndoivent s’inscrire harmonieusement avec le bâti existant. Les volumes géométriques simplistes sont\nproscrits.\nDans le cas d’une extension ou surélévation représentant plus de 30 % du volume existant, une\nrecomposition générale pourra être envisagée, mais avec la même qualité que l’existant.\n11.3    Clôtures\nLes clôtures sur voies devront être constituées d’un mur-bahut maçonné, d’une hauteur maximale de\n0,80 mètre par rapport au terrain naturel avant travaux, dans lequel devront être insérés les coffrets\ntechniques (ERDF, GRDF,…). Ce mur-bahut devra être surmonté d’une partie à claire-voie\n(pourcentage de vides de 80 %, minimum par rapport aux pleins).\nLes clôtures sur voie devront être doublées de haies végétales.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    71","    UF\nLa hauteur maximum des clôtures est limitée à 2,10 mètres, sauf contexte spécifique (mur de\nsoutènement ou mur existant remarquable). Cette règle s’applique également dans les cas de\nmodification et de réfection.\nDes exceptions à ces règles peuvent être autorisées en cas de constructions ou installations\nnécessaires aux services publics ou d’intérêt collectif, lorsque des raisons techniques ou de sécurité\nl’imposent.\nMatériaux :\nSelon le contexte du paysage de la rue, peuvent être utilisés les matériaux de type pierre, brique,\nmétal, bois ou blocs de béton enduits.\nSont interdits :\nLes matériaux de remplissages utilisés à nu, non enduits ;\nLes canisses en plastique ;\nLes grillages simples avec matériaux opacifiants rapportés.\nCouleurs :\nPierre et brique sont utilisés bruts, non peints.\nMétal ou bois, une seule couleur de préférence, deux au maximum.\nVégétation : des haies peuvent tenir lieu de clôture.\nLes haies devront être constituées d’espèces mélangées\nLes essences devront être choisies en fonction de l’orientation et de la composition du sol.\nLa haie taillée :\nSa hauteur varie entre 1,2 mètre et 1,8 mètre de hauteur. Les plants sont distants de 30 à\n40 centimètres.\nArt. UF 12. STATIONNEMENT\n12.1 Pour toute construction nouvelle, il est exigé des aires de stationnement suivant les normes\nminimales suivantes :\nHabitat\nConstruction neuve    : 1 place par logement plus 1 place supplémentaire pour tous les\n    logements d’une superficie supérieure à 100 m² de surface de\n    plancher, plus 1 place par tranche de trois logements.\nCommerce, artisanat    : surface de plancher inférieure à 200 m² : pas de règle\n    surface de plancher cumulée sur une même opération\n    supérieure à 200 m² : 1 place pour 100 m²\n    surface de plancher cumulée sur une même opération\n    supérieure à 300 m² : 1 place de livraison\nBureaux    : 1 place pour 100 m² de surface de plancher\nHôtel    : 1 place pour 4 chambres\nIndustrie et dépôts    : 1 place pour 200 m² de surface de plancher\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    72","    UF\nÉquipements publics et d’intérêt collectif : le nombre de places sera déterminé en fonction de la\nsituation et de la nature de l’établissement, des possibilités de desserte en transports en commun et\ndes places offertes dans les parcs publics de stationnement.\nÉquipement d’intérêt collectif caractère résidentiel (résidence étudiante, de personnes âgées, foyer\nde jeunes travailleurs…) : 1 place pour 10 chambres\n12.2 Dans le cadre d’extensions, il sera demandé au pétitionnaire de se mettre aux normes du\nstationnement réglementé par l’article 12.1.\n12.3 L'accès au sous-sol doit présenter un palier de pente inférieure à 5 % d'une longueur\nminimale de 5 mètres au débouché sur l'alignement chaque fois que c’est possible.\n12.4 Pour les constructions comportant plus de deux logements, une proportion de 50 % au moins\ndes surfaces totales de stationnement définies ci-dessus doit être réalisée dans le volume même des\nconstructions.\n12.5    Stationnement des deux roues :\nPour les constructions comportant trois logements et plus, un local à cycles par cage d’escalier doit\nêtre aménagé au rez-de-chaussée, à proximité de l’entrée principale, en évitant tout franchissement\nd’escaliers ou de portes. Il donnera dans la mesure du possible directement sur la voie publique. Tout\nlocal réservé à cet usage doit avoir une surface d’au moins 3 m² et être clos et couvert. Sa superficie\nest calculée en fonction des normes suivantes :\n    - Pour les logements : une superficie d’au minimum 0,75 m² pour les T1 et T2 et d’au minimum\n    1,5 m² pour tous les autres logements ;\n    - Bureaux : 1,5 m² pour 100 m² de surface de plancher ;\n    - Commerces : 1 place pour 10 employés avec en plus, le stationnement visiteurs\n    - Artisanat, industrie, hébergement hôtelier, de plus de 500 m² de de surface de plancher :\n    1 place pour 10 employés avec en plus, le stationnement visiteurs ;\n    - Équipements scolaires : primaires, collèges, lycées et universités = 1 place pour 8 à 12\n    élèves ;\n    - Pour les constructions et installations nécessaires aux services publics ou d’intérêt collectif :\n    1 place pour 20 places de capacité de réception.\nPour les constructions comportant trois logements et plus, un local à poussettes devra également\nêtre créé, séparé du local à vélos, au niveau du rez-de-chaussée et avec une surface minimale de\n3 m².\n12.6 Le calcul du nombre de place sera arrondi à l’unité inférieure si la première décimale est\ninférieure ou égale à 5.\n12.7 Les bâtiments neufs à usage principal d’habitation, qui comportent un parc de\nstationnement, doivent être pré-équipés afin de faciliter la mise en place ultérieure d’infrastructures\nde recharge pour les véhicules légers. Soit :\n    - alimentation en électricité du parc de stationnement, avec présence d’un tableau général\n    basse tension en aval du disjoncteur de l’immeuble. L’alimentation électrique ainsi que le\n    tableau sont dimensionnés de façon à permettre la recharge normale de véhicules pour un\n    minimum de 10 % des places, avec au minimum une place ;\n    - installation de gaines, fourreaux, chemins de câbles à partir du tableau général basse tension,\n    permettant une facturation individuelle des consommations.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    73","    UF\n12.8 Les bâtiments de bureaux, qui comportent un parc de stationnement, doivent être équipés\nde points de charge, permettant la recharge des véhicules légers.\nL’obligation consiste en un équipement, par le propriétaire du parc, de points de charge pour la\nrecharge normale des véhicules légers, avec une alimentation en électricité d’une partie des places,\navec un minimum d’une place, à partir d’un tableau général basse tension en aval du disjoncteur de\nl’immeuble.\nArt. UF 13. ESPACES LIBRES ET PLANTATIONS\nLes espaces libres de construction ou de circulations doivent être aménagés en espaces verts de\npleine terre comportant au minimum un arbre par 100 m² de superficie d’espaces verts.\nLes espaces verts sur dalle ou en terrasse et les toitures végétalisées sont comptabilisés pour 50 % de\nleur surface dans le calcul des espaces verts, et ne peuvent pas dépasser 20 % de la surface totale\nrequise.\nLes toitures végétalisées et les espaces verts sur dalle ou en terrasse doivent être accessibles pour\npermettre leur entretien et avoir une épaisseur de terre végétale d’un minimum de 0,60 mètre.\n    III- POSSIBILITÉ MAXIMALE D'OCCUPATION DU SOL.\nArt. UF 14. COEFFICIENT D’OCCUPATION DU SOL\nSans objet.\nArt. UF 15. PERFORMANCES ÉNERGÉTIQUES ET ENVIRONNEMENTALES\nPour les espaces réservés aux stationnements, il est préconisé d’aménager des stationnements\nvégétalisés, afin de réduire les espaces imperméabilisés.\nL’orientation et la conception des constructions, visant à limiter la consommation d’énergie, sont\nconseillées, ainsi que l’utilisation de matériaux durables.\nL’installation de dispositifs de production d’énergie renouvelable pour l’approvisionnement\nénergétique des constructions (chaudière à bois, eau chaude sanitaire solaire, pompes à chaleur,\npanneaux photovoltaïques, géothermie…) est recommandée.\nArt. UF 16. RÉSEAU NUMÉRIQUE\nPour les constructions à usage de bureaux et d’hébergement hôtelier devront être prévus les réseaux\ninternes à la construction permettant le raccordement à un réseau collectif de haut débit.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    74","    UL\n    ZONE UL\nIl s’agit d’une zone à vocation de loisirs et de sport, et où les constructions sont strictement\nlimitées à celles nécessaires à la vocation de la zone. La zone UL comprend les secteurs ULa, ULb et\nULc. Le secteur ULb est destiné à faciliter le développement d’un projet d’intérêt général portant\nsur la confortation d’équipements publics.\n    I - NATURE DE L'OCCUPATION ET DE L'UTILISATION DU SOL\nArt. UL 1. OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\n1.1    Toutes constructions autres que celles autorisées à l’article 2\n1.2    Les dépôts de ferrailles, matériaux, combustibles solides ou liquides, les entreprises de\ncassage de voitures à l'air libre et les fourrières.\n1.3    Le camping, le caravanage.\n1.4    Les affouillements, exhaussements des sols et les exploitations de carrières non liés à des\ntravaux de construction.\nArt. UL 2. OCCUPATIONS ET UTILISATIONS DU SOL ADMISES SOUS CONDITIONS\n2.1    Sont autorisées les constructions à usage de loisirs, de sport de plein air et leurs structures\néventuelles d’accompagnement.\n2.2    À l’intérieur du domaine national de Saint-Cloud, du jardin des Tourneroches et de\nl'hippodrome, sont autorisés les travaux nécessaires à l’entretien, le changement de destination, la\nréhabilitation, ou la reconstruction dans le même volume et la même emprise des installations\nexistantes, à l’exclusion de tout autre projet.\n2.3    Les infrastructures d’intérêt général (réservoirs d’eau potable) sont également admises à la\ncondition d’être en sous-sol et suffisamment recouvertes de terre pour permettre un aménagement\npaysager correspondant à la vocation de la zone, à l’exception des ouvrages techniques nécessaires\nau fonctionnement de celles-ci.\n2.4    Les installations et les dépôts nécessaires au fonctionnement du service public ferroviaire\nréalisés par ou pour l’exploitant.\n2.5    L'agrandissement ou la modification de l'existant des installations classées compatibles avec\nle caractère de la zone.\n2.6    Sur les terrains comportant d’anciennes carrières et ceux soumis au risque de glissement de\nterrain, les constructions peuvent faire l'objet de recommandations particulières. Les dispositions du\nPPRMT, en annexe du PLU, doivent être respectées.\n2.7    Dans les secteurs soumis aux risques d’inondation, les constructions, ouvrages et travaux\nsont soumis aux dispositions du PPRI, en annexe du PLU. Dans le respect de ces dispositions sont\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    75","    UL\négalement autorisées les installations en liaison avec le fleuve ainsi que celles qui sont nécessaires à\nl’animation ou à la mise en valeur des berges notamment pour les loisirs ou le transport des\npassagers.\n2.8    Dans le secteur ULc, les occupations du sol sont autorisées sous réserve d’être nécessaire au\nfonctionnement du cimetière.\n2.9    En limite du domaine ferroviaire, l’implantation des constructions doit respecter les règles\ndes servitudes ferroviaires, en annexe du PLU.\n2.10 Dans les parties de la zone soumises au risque technologique de transports de matière\ndangereuse lié à la présence des canalisations de gaz à haute pression, dont le tracé figure dans le\nplan des servitudes d’utilité publique annexé au PLU, toute occupation ou utilisation du sol doit\nrespecter les règles visant à garantir sa sécurité publique. Les projets concernés par ce risque,\npourront être autorisés après avis et sous réserve de l’observation des prescriptions spéciales ou\nmesures conservatoires qui seraient émises par le service intéressé et le service gestionnaire de ces\nouvrages. Les ouvrages de transports devront se conformer aux dispositions en vigueur notamment\npar des mesures de protection suffisantes. Ces dispositions figurent dans une fiche d’information en\nannexe du règlement.\n2.11 Les travaux de maintenance, de modification des ouvrages électriques à haute et très haute\ntension sont autorisés pour des exigences fonctionnelles et/ou techniques.\n    Il - CONDITIONS DE L'OCCUPATION DU SOL\nArt. UL 3. ACCÈS\nDesserte du terrain\nPour être constructible, un terrain doit avoir accès à une voie publique ou privé, ou désenclavé par\nune servitude de passage authentifiée de largeur satisfaisante.\nLes voies doivent avoir des caractéristiques adaptées à l'approche des véhicules de lutte contre\nl'incendie.\nLes voies se terminant en impasse doivent être aménagées de façon à permettre aux véhicules de\nfaire demi-tour.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    76","    UL\nArt. UL 4. DESSERTE PAR LES RÉSEAUX\n4.1    Eau :\nToute construction nouvelle doit être raccordée au réseau public d'eau.\n4.2    Assainissement :\nToute construction nouvelle doit être raccordée au réseau public d’assainissement, dans la mesure\noù ce raccordement est techniquement et financièrement viable. Dans le cas contraire, une\ndérogation pour la mise en place d’un assainissement autonome pourrait être accordée.\nToute nouvelle construction ou extension devra respecter les prescriptions des règlements\nd’assainissement en vigueur, notamment en matière de gestion des eaux pluviales.\n(chapitre 4 du règlement d’assainissement de la ville de Saint-Cloud).\nTout raccordement doit être conforme au règlement du service de l’assainissement de la ville de\nSaint-Cloud approuvé par le Conseil communautaire de la Communauté d’agglomération\nCœur-de-Seine du 14 octobre 2014. Ce règlement précise qu’en cas de raccordement au réseau\ndépartemental d’assainissement, la gestion des eaux pluviales à la parcelle, sans raccordement au\nréseau public doit être la première solution recherchée.\nToutefois, lorsque la gestion totale de ces eaux à la parcelle n’est pas possible, le propriétaire peut\nsolliciter l’autorisation de raccorder ses eaux de ruissellement au réseau pluvial ou unitaire à la\ncondition que ses installations soient conformes aux prescriptions techniques définies dans le\nchapitre 4 du règlement d’assainissement de la ville de Saint-Cloud. Dans ce cas, seul l’excès de\nruissellement peut être canalisé après qu’aient été mises en œuvre toutes les solutions susceptibles\nde favoriser la gestion à la parcelle, telles que l’infiltration, la réutilisation des eaux claires, le\nstockage, ainsi que les rejets au milieu naturel.\nL’excédent d’eaux de ruissellement n’ayant pu être géré à la parcelle est soumis à des limitations de\ndébit de rejet afin de limiter à l’aval les risques d’inondation ou de déversement d’eaux polluées au\nmilieu naturel. Le débit de fuite pour une pluie de retour décennal ne doit pas excéder :\n    -   2L/s/ha dans le cas d’un rejet dans le réseau unitaire ;\n    -   10L/s/ha dans le cas d’un rejet dans un réseau d’eaux pluviales, sauf dispositions locales\n    particulières (notamment en raison d’insuffisance hydraulique locale, ou exutoire aval\n    constitué d’un réseau unitaire).\nDans tous les cas, l’acceptation du raccordement des eaux pluviales de toute nouvelle construction\nsera subordonnée à la capacité d’évacuation du réseau existant. Le constructeur ou l’aménageur doit\njustifier, par la production à l’exploitant de notes de calcul appropriées, le dimensionnement\nsuffisant des installations de rétention qu’il installe en amont du raccordement.\nTout rejet d’eaux usées autres que domestiques dans les réseaux publics d’assainissement doit être\npréalablement autorisé soit par arrêté d’autorisation de déversement signé par le maître d’ouvrage\ndu réseau concerné, complété éventuellement par une convention spéciale de déversement, soit par\nune convention de rejet d’eaux usées non domestiques assimilables à des eaux usées domestiques.\nElles ne pourront être rejetées à l’égout que dans les conditions définies au chapitre 3 du règlement\nd’assainissement de la ville de Saint-Cloud.\nLes rejets d’eaux claires permanentes telles qu’eaux de pompage de nappe, eaux d’exhaure, eaux de\npompe à chaleur ou similaires sont interdits dans les réseaux d’assainissement unitaires ou d’eaux\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   77","    UL\nusées. Dans le cas d’activités produisant provisoirement des eaux d’exhaure, en l’absence de solution\nalternative et sous réserve d’une capacité suffisante du réseau, une autorisation dérogatoire peut\nêtre accordée, en référence au règlement du service de l’assainissement de la ville de Saint-Cloud\n(art. 22.2). Une convention temporaire de rejet pour ces eaux doit alors être cosignée par le\ndemandeur et les collectivités concernées.\n4.3    Électricité et téléphone :\nLes réseaux électriques et téléphoniques doivent être enterrés sur le terrain. Les armoires\nélectriques doivent être implantées à l’intérieur du terrain de la construction.\nLes coffrets de toute nature devront être incorporés à la clôture de la propriété. Ils ne peuvent en\naucun cas déborder sur le domaine public.\n4.4    Tri sélectif :\nToute construction nouvelle doit prévoir des locaux poubelles correctement dimensionnés pour\naccueillir l’ensemble des bacs de la collecte sélective, conformément au Plan Régional d’élimination\ndes déchets ménagers et assimilés (PREDMA) approuvé le 26 novembre 2009.\nArt. UL 5. CARACTÉRISTIQUES DES TERRAINS\nSans objet.\nArt UL 6. IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX VOIES ET EMPRISES\nPUBLIQUES\n6.1    Les constructions seront implantées à 3 mètres minimum de l'alignement existant ou futur\nou à l’alignement.\n6.2    La surélévation et l’extension d’un bâtiment existant peuvent être autorisées :\n-    suivant les règles des constructions nouvelles ;\n-    si ces règles ne peuvent pas être respectées, la surélévation d’un niveau et l’extension d’un\n    bâtiment édifié légalement achevé à la date d’entrée en vigueur du PLU peuvent être autorisées\n    dans le prolongement des murs existants, à condition que les façades créées ne respectant pas\n    les prospects imposés ne comportent pas de baies.\nArt UL 7. IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX LIMITES SÉPARATIVES\n7.1    Les constructions sont autorisées :\na)    jusqu'aux limites séparatives latérales,\nb)    en retrait de ces limites.\nEn cas de retrait, elle doit s'écarter d'une distance égale :\n-    à la hauteur de la façade par rapport au terrain naturel avant travaux avec un minimum de\n    6 mètres si celle-ci comporte des baies ; dans ce cas, la distance à respecter est mesurée\n    normalement à la façade au droit de la baie ;\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville 78","    UL\n-    à la moitié de la hauteur de la façade par rapport au terrain naturel avant travaux avec\n    un minimum de 2,50 mètres dans le cas contraire.\n7.2    La surélévation et l’extension d’un bâtiment existant peuvent être autorisées :\n-    suivant les règles des constructions nouvelles ;\n-    si ces règles ne peuvent pas être respectées, la surélévation d’un niveau et l’extension\n    d’un bâtiment édifié légalement achevé à la date d’entrée en vigueur du PLU peuvent être\n    autorisées dans le prolongement des murs existants, à condition que les façades créées ne\n    respectant pas les prospects imposés ne comportent pas de baies.\n7.3    Lorsque la limite séparative correspond à une limite avec une voie de statut privé, les règles\nde l’article 6 s’appliquent.\nArt UL 8. IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT AUX AUTRES SUR\nUNE MÊME PROPRIÉTÉ\nIl n’est pas fixé de règle.\nArt UL 9. EMPRISE AU SOL\nHors secteur ULa, l'emprise au sol des bâtiments ne peut excéder 10 % de la surface du terrain.\nDans le secteur ULa, l’emprise au sol ne peut excéder 20 %.\nDans les secteurs ULa et ULb, il n’est pas fixé de règle pour les constructions et installations\nnécessaires aux services publics ou d’intérêt collectif.\nArt UL 10. HAUTEUR DES CONSTRUCTIONS\nLa hauteur au point le plus haut, des constructions comprises dans le faisceau du cône de vue n°1\nfigurant au document graphique est précisée dans les annexes du présent règlement.\nLa hauteur au point le plus haut des constructions ne peut excéder 6 mètres.\nDans les secteurs ULa et ULb, il n’est pas fixé de règle pour les constructions et installations\nnécessaires aux services publics ou d’intérêt collectif.\nArt. UL 11. ASPECT EXTÉRIEUR\nLes terrains non bâtis, les constructions de toute nature doivent être aménagés et entretenus de\nfaçon à ne porter atteinte ni à l'hygiène, ni à la bonne tenue de l'agglomération, ni à l'harmonie des\npaysages et de l'architecture régionale, locale ou de la zone.\nLes couvertures d'aspect tôle ondulée ou papier goudronné sont interdites.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    79","    UL\nLes clôtures sur voies ne doivent pas comporter des parties pleines à une hauteur supérieure à\n0,80 mètre par rapport au terrain naturel. Toutefois, des clôtures ajourées (grillage, filets…) peuvent\nêtre autorisées autour des terrains de sports sans limitation de hauteur.\nLa hauteur des clôtures sera limitée à 2,10 mètres.\nDes exceptions à ces règles peuvent être autorisées en cas de constructions ou installations\nnécessaires aux services publics ou d’intérêt collectif, lorsque des raisons techniques ou de sécurité\nl’imposent.\nArt. UL 12. STATIONNEMENT\nPour toute construction nouvelle ou création de surface il est exigé des aires de stationnement\nsuivant les normes minimales suivantes :\nLe nombre de places sera déterminé en fonction de la situation et de la nature de l’établissement,\ndes possibilités de desserte en transports en commun et des places offertes dans les parcs publics de\nstationnement.\nArt. UL 13. ESPACES LIBRES ET PLANTATIONS\nLes espaces libres de construction doivent être traités en espaces naturels à l’exception des accès et\naires de stationnement.\nDans les cônes n° 1, n° 2 et n° 3, les plantations devront être taillées de manière à dégager la vue. Les\nessences d’arbre seront choisies de manière à limiter leur hauteur.\nPoint de vue : À l’intérieur des points de vue figurant au document graphique, les arbres de haute\ntige susceptibles de gêner la vue sont interdits.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    80","    UL\n    III- POSSIBILITÉ MAXIMALE D'OCCUPATION DU SOL\nArt. UL 14 -POSSIBILITÉS MAXIMALES D'OCCUPATION DU SOL\nSans objet.\nArt. UL 15. PERFORMANCES ÉNERGÉTIQUES ET ENVIRONNEMENTALES\nPour les espaces réservés aux stationnements, il est préconisé d’aménager des stationnements\nvégétalisés, afin de réduire les espaces imperméabilisés.\nL’orientation et la conception des constructions, visant à limiter la consommation d’énergie, sont\nconseillées, ainsi que l’utilisation de matériaux durables.\nL’installation de dispositifs de production d’énergie renouvelable pour l’approvisionnement\nénergétique des constructions (chaudière à bois, eau chaude sanitaire solaire, pompes à chaleur,\npanneaux photovoltaïques, géothermie…) est recommandée.\nArt. UL 16. RÉSEAU NUMÉRIQUE\nDevront être prévus les réseaux internes à la construction permettant le raccordement à un réseau\ncollectif de haut débit.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   81","    UL\nModification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   82","    UM\n    ZONE UM\nC’est une zone d’activités spécialisée, réservée au service public ferroviaire dans le secteur\nurbain. Elle comprend notamment l’ensemble des infrastructures ferroviaires, les\nemplacements réservés aux ouvrages techniques, aux bâtiments d’exploitation et de\nservice.\n    I - NATURE DE L'OCCUPATION ET DE L'UTILISATION DU SOL\nArt. UM 1. OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\n1.1    Les constructions autres que les installations et les dépôts nécessaires au fonctionnement du\nservice public ferroviaire réalisés par ou pour l’exploitant et non expressément mentionnés à l’article\nUM 2.\n1.2    Les dépôts de ferrailles, matériaux, combustibles solides ou liquides et les entreprises de\ncassage de voitures à l’air libre autres que ceux nécessaires au fonctionnement du service public.\n1.3    Le camping, le caravanage.\n1.4    Les affouillements, exhaussements des sols et les exploitations de carrières non liés à des\ntravaux de construction ou d’aménagement du réseau ferré.\nArt. UM 2. OCCUPATIONS ET UTILISATIONS DU SOL ADMISES SOUS CONDITIONS\n2.1    L'implantation, l'agrandissement ou la modification de l'existant des installations classées\ncompatibles avec le caractère de la zone\n2.2    L’habitat nécessaire au gardiennage et au fonctionnement de la zone.\n2.3    Sur les terrains comportant d’anciennes carrières et ceux soumis au risque de glissement de\nterrain, les constructions peuvent faire l'objet de recommandations particulières. Les dispositions du\nPPRMT, en annexe du PLU, doivent être respectées.\n2.4    Dans les secteurs soumis aux risques d’inondation, les constructions, ouvrages et travaux\nsont soumis aux dispositions du PPRI, en annexe du PLU.\n2.5    En limite du domaine ferroviaire, l’implantation des constructions doit respecter les règles\ndes servitudes ferroviaires, en annexe du PLU.\n2.6    Dans les parties de la zone soumises au risque technologique de transports de matière\ndangereuse lié à la présence des canalisations de gaz à haute pression, dont le tracé figure dans le\nplan des servitudes d’utilité publique annexé au PLU, toute occupation ou utilisation du sol doit\nrespecter les règles visant à garantir sa sécurité publique. Les projets concernés par ce risque,\npourront être autorisés après avis et sous réserve de l’observation des prescriptions spéciales ou\nmesures conservatoires qui seraient émises par le service intéressé et le service gestionnaire de ces\nouvrages. Les ouvrages de transports devront se conformer aux dispositions en vigueur notamment\npar des mesures de protection suffisantes. Ces dispositions figurent dans une fiche d’information en\nannexe du règlement.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    83","    UM\n    Il - CONDITIONS DE L'OCCUPATION DU SOL\nArt. UM 3. ACCÈS\nPour être constructible, un terrain doit avoir accès à une voie publique ou privée, ou désenclavé par\nune servitude de passage authentifiée, d’une largeur adaptée à l'approche des véhicules de lutte\ncontre l'incendie.\nLes voies de desserte doivent être conçues et aménagées en tenant compte de la topographie et de\nla morphologie des lieux, de la nature des voies sur lesquelles elles débouchent (intensité du trafic,\nvisibilité, vitesse...), de la nature et de l’affectation des constructions existantes et des constructions\nprojetées, du trafic engendré par la nouvelle construction. Elles doivent permettre l’entrée et la\nsortie des véhicules sans manœuvre sur la voie de desserte. Les voies de desserte doivent être\nconçues et aménagées de manière à garantir la sécurité des piétons et des cycles.\nLes voies se terminant en impasse doivent être aménagées de façon à permettre aux véhicules de\nfaire demi-tour. Toutefois, sur les terrains déjà bâtis insuffisamment desservis, un agrandissement de\nfaible importance d’une construction existante peut être autorisé à condition d’être située à moins\nde 150 m d’une bouche d’incendie.\nArt. UM 4. DESSERTE PAR LES RÉSEAUX\n4.1    Eau :\nToute construction nouvelle doit être raccordée au réseau public d'eau.\n4.2    Assainissement :\nToute construction nouvelle doit être raccordée au réseau public d’assainissement, dans la mesure\noù ce raccordement est techniquement et financièrement viable. Dans le cas contraire, une\ndérogation pour la mise en place d’un assainissement autonome pourrait être accordée.\nToute nouvelle construction ou extension devra respecter les prescriptions des règlements\nd’assainissement en vigueur, notamment en matière de gestion des eaux pluviales.\n(chapitre 4 du règlement d’assainissement de la ville de Saint-Cloud).\nTout raccordement doit être conforme au règlement du service de l’assainissement de la ville de\nSaint-Cloud approuvé par le Conseil communautaire de la Communauté d’agglomération\nCœur-de-Seine du 14 octobre 2014. Ce règlement précise qu’en cas de raccordement au réseau\ndépartemental d’assainissement, la gestion des eaux pluviales à la parcelle, sans raccordement au\nréseau public doit être la première solution recherchée.\nToutefois, lorsque la gestion totale de ces eaux à la parcelle n’est pas possible, le propriétaire peut\nsolliciter l’autorisation de raccorder ses eaux de ruissellement au réseau pluvial ou unitaire à la\ncondition que ses installations soient conformes aux prescriptions techniques définies dans le\nchapitre 4 du règlement d’assainissement de la ville de Saint-Cloud. Dans ce cas, seul l’excès de\nruissellement peut être canalisé après qu’aient été mises en œuvre toutes les solutions susceptibles\nde favoriser la gestion à la parcelle, telles que l’infiltration, la réutilisation des eaux claires, le\nstockage, ainsi que les rejets au milieu naturel.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    84","    UM\nL’excédent d’eaux de ruissellement n’ayant pu être géré à la parcelle est soumis à des limitations de\ndébit de rejet afin de limiter à l’aval les risques d’inondation ou de déversement d’eaux polluées au\nmilieu naturel. Le débit de fuite pour une pluie de retour décennal ne doit pas excéder :\n    -   2L/s/ha dans le cas d’un rejet dans le réseau unitaire ;\n    -   10L/s/ha dans le cas d’un rejet dans un réseau d’eaux pluviales, sauf dispositions locales\n    particulières (notamment en raison d’insuffisance hydraulique locale, ou exutoire aval\n    constitué d’un réseau unitaire).\nDans tous les cas, l’acceptation du raccordement des eaux pluviales de toute nouvelle construction\nsera subordonnée à la capacité d’évacuation du réseau existant. Le constructeur ou l’aménageur doit\njustifier, par la production à l’exploitant de notes de calcul appropriées, le dimensionnement\nsuffisant des installations de rétention qu’il installe en amont du raccordement.\nTout rejet d’eaux usées autres que domestiques dans les réseaux publics d’assainissement doit être\npréalablement autorisé soit par arrêté d’autorisation de déversement signé par le maître d’ouvrage\ndu réseau concerné, complété éventuellement par une convention spéciale de déversement, soit par\nune convention de rejet d’eaux usées non domestiques assimilables à des eaux usées domestiques.\nElles ne pourront être rejetées à l’égout que dans les conditions définies au chapitre 3 du règlement\nd’assainissement de la ville de Saint-Cloud.\nLes rejets d’eaux claires permanentes telles qu’eaux de pompage de nappe, eaux d’exhaure, eaux de\npompe à chaleur ou similaires sont interdits dans les réseaux d’assainissement unitaires ou d’eaux\nusées. Dans le cas d’activités produisant provisoirement des eaux d’exhaure, en l’absence de solution\nalternative et sous réserve d’une capacité suffisante du réseau, une autorisation dérogatoire peut\nêtre accordée, en référence au règlement du service de l’assainissement de la ville de Saint-Cloud\n(art. 22.2). Une convention temporaire de rejet pour ces eaux doit alors être cosignée par le\ndemandeur et les collectivités concernées.\n4.3    Électricité et téléphone :\nLes réseaux électriques et téléphoniques doivent être enterrés sur le terrain. Les armoires\nélectriques doivent être implantées à l’intérieur du terrain de la construction.\nLes coffrets de toute nature devront être incorporés à la clôture de la propriété. Ils ne peuvent en\naucun cas déborder sur le domaine public.\n4.4    Tri sélectif :\nToute construction nouvelle doit prévoir des locaux poubelles correctement dimensionnés pour\naccueillir l’ensemble des bacs de la collecte sélective, conformément au Plan Régional d’élimination\ndes déchets ménagers et assimilés (PREDMA) approuvé le 26 novembre 2009.\nArt. UM 5. CARACTÉRISTIQUES DES TERRAINS\nSans objet.\nArt. UM 6. IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX VOIES ET EMPRISES\nPUBLIQUES\nLes constructions sont implantées en limite de l’emprise des voies ou emprises publiques, soit en\nretrait. Dans ce cas, elles sont implantées à 3 mètres minimum de la limite.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   85","    UM\nLes pylônes, dispositifs de signalisation et autres éléments ponctuels de grands élancements\npourront être implantés sans respecter les règles ci-dessus.\nArt. UM 7. IMPLANTATIONS DES CONSTRUCTIONS PAR RAPPORT AUX LIMITES\nSÉPARATIVES\n7.1   Les constructions peuvent s’implanter soit sur les limites séparatives (murs aveugles ne\ncomportant que des jours de souffrances), soit en retrait.\n7.2    Implantations en retrait\n    A) Dispositions relatives à l’implantation d’éléments de façade comportant une ou\n    plusieurs baies d’une surface supérieure à 0,25 m² à l’exclusion des baies de type\n    zénithal :\n    La distance D, comptée horizontalement, de l’élément de façade à la limite\n    séparative lui faisant face, doit être supérieure ou égale à la hauteur de cet élément\n    de façade par rapport au terrain naturel avant travaux, sans pouvoir être inférieure à\n    6 mètres :\n    DH6m\n    B) Dispositions relatives à l’implantation d’éléments de façade dépourvus de baies\n    d’une surface supérieure à 0,25 m². Lorsque les baies sont accolées, la surface totale\n    des baies est prise en compte pour le calcul de leur surface.\n    La distance de chaque élément de façade aveugle ou ne comportant que des jours de\n    souffrance ou baies d’une surface inférieure à 0,25 m², comptée horizontalement\n    jusqu’à la limite séparative lui faisant face doit être au moins égale à la moitié de la\n    hauteur de cet élément de façade par rapport au sol naturel d’avant-projet sans\n    pouvoir être inférieure à 3 mètres :\n    DH3m\n    2\n7.3    Les pylônes, dispositifs de signalisation et autres éléments ponctuels de grands élancements\npourront être implantés sans respecter les règles ci-dessus.\nArt. UM 8. IMPLANTATIONS DES CONSTRUCTIONS LES UNES PAR RAPPORT AUX AUTRES\nSUR UNE MÊME PROPRIÉTÉ\nSi elles ne sont pas contigües, les constructions doivent être distantes de 4 mètres minimum.\nLes pylônes, dispositifs de signalisation et autres éléments ponctuels de grands élancements\npourront être implantés sans respecter les règles ci-dessus.\nArt. UM 9. EMPRISE AU SOL\nSans objet.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    86","    UM\nArt. UM 10. HAUTEUR MAXIMUM DES CONSTRUCTIONS\nLa hauteur au point le plus haut, des constructions comprises dans le faisceau du cône de vue n° 1\nfigurant au document graphique est précisée dans les annexes du présent règlement.\nLa hauteur au point le plus haut ne pourra pas excéder 19 mètres y compris les antennes et autres\ninstallations techniques nécessaires à l’exploitation ferroviaire.\nArt. UM 11. ASPECT EXTÉRIEUR\n« Le permis de construire ou déclaration préalable de travaux peut être refusé(e) ou n’être\naccordé(e) que sous réserve de l’observation de prescriptions spéciales si les constructions, par leur\nsituation, leur architecture, leurs dimensions ou l’aspect extérieur des bâtiments ou ouvrages à\nédifier ou à modifier, sont de nature à porter atteinte au caractère ou à l’intérêt des lieux\navoisinants, aux sites, aux paysages naturels ou urbains, ainsi qu’à la conservation des perspectives\nmonumentales.»\n11.1    Constructions neuves\nAucun « style » spécifique n’est imposé. Devront être évitées les architectures simplistes,\nminimalistes ou trop géométriques. La composition et la volumétrie devront être particulièrement\nsoignées.\nToutefois sont vivement déconseillés les pastiches de styles ou modes de construction\nanachroniques (colonnes, pilastres, frontons, etc.) ou régionalistes.\nEn règle générale, les projets pourront être le reflet de tendances contemporaines, tout en\ns’inspirant de l’histoire et de la géographie de Saint-Cloud et du contexte environnant.\nLes façades devront être travaillées et devront être le reflet des fonctions du bâtiment\n(soubassement, étages, attique, etc.). Des rythmes horizontaux et verticaux devront marquer les\ndifférentes hiérarchies et fonctions.\nToutes les façades devront être traitées avec le même soin et une qualité de composition\néquivalente, qu’il s’agisse de façades principales ou secondaires (y compris les pignons aveugles), ou\ndes bâtiments annexes.\nLes matériaux et détails d’exécution devront assurer la pérennité des bâtiments.\nStructure :\nSont autorisés : les matériaux type pierre, brique, meulière, béton, métal, bois, verre, etc… ;\nSont interdits : les matériaux légers type « onduline » ou les matériaux de remplissage non enduits ;\nMenuiseries, occultations, clôtures\nSont autorisés l’acier, l’aluminium, le bois ;\n11.2    Extensions-surélévations\nLes extensions ou surélévations doivent respecter la volumétrie, les matériaux, les rythmes et les\nmodénatures de l’existant, avec la même qualité de détails, d’autant plus s’il s’agit d’un bâtiment ou\nensemble remarquable identifié au titre de l’article L. 123-1-5 III 2° du Code de l’urbanisme\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    87","    UM\nDans le cas du choix d’une facture contemporaine pour l’extension ou la surélévation, les volumes\ndoivent s’inscrire harmonieusement avec le bâti existant ; les volumes géométriques simplistes sont\nproscrits.\nDans le cas d’une extension ou surélévation représentant plus de 30 % du volume existant, une\nrecomposition générale pourra être envisagée, mais avec la même qualité que l’existant.\n11.3    Clôtures\nLes clôtures sur voies devront être constituées d’un mur-bahut maçonné, d’une hauteur maximale de\n0,80 mètres par rapport au terrain naturel avant travaux, dans lequel devront être insérés les coffrets\ntechniques (ERDF, GRDF,…). Ce mur-bahut devra être surmonté d’une partie à claire-voie\n(pourcentage de vides de 80 %, minimum par rapport aux pleins).\nLes clôtures sur voie devront être doublées de haies végétales.\nLa hauteur maximum des clôtures est limitée à 2,10 mètres, sauf contexte spécifique\n(mur de soutènement ou mur existant remarquable). Cette règle s’applique également dans les cas\nde modification et de réfection.\nDes exceptions à ces règles peuvent être autorisées en cas de constructions ou installations\nnécessaires aux services publics ou d’intérêt collectif, lorsque des raisons techniques ou de sécurité\nl’imposent.\nMatériaux :\nSelon le contexte du paysage de la rue, peuvent être utilisés les matériaux de type pierre, brique,\nmétal, bois ou blocs de béton enduits ;\nSont interdits :\nLes matériaux de remplissages utilisés à nu, non enduits ;\nLes canisses en plastique ;\nLes grillages simples avec matériaux opacifiants rapportés.\nCouleurs :\nPierre et brique sont utilisés bruts, non peints.\nMétal ou bois, une seule couleur de préférence, deux au maximum.\nVégétation : des haies peuvent tenir lieu de clôture.\nLes haies devront être constituées d’espèces mélangées.\nLes essences devront être choisies en fonction de l’orientation et de la composition du sol.\nLa haie taillée :\nSa hauteur varie entre 1,2 mètre et 1,8 mètre de hauteur. Les plants sont distants de 30 à 40\ncentimètres.\nArt. UM 12. STATIONNEMENT\n12.1 Le stationnement des véhicules correspondant aux besoins des installations doit être réalisé\nen dehors des voies publiques.\n12.2 Pour les marchandises, les aires d’évolution nécessaires au chargement et au déchargement\nseront aménagées à l’intérieur du domaine public ferroviaire.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    88","    UM\nArt. UM 13. ESPACES LIBRES ET PLANTATIONS\nLes toitures végétalisées et les espaces verts sur dalle ou en terrasse doivent être accessibles pour\npermettre leur entretien et avoir une épaisseur de terre végétale d’un minimum de 0,60 mètre.\nToutefois, ces dispositions devront être compatibles avec les impératifs techniques de l’exploitation\net l’organisation des chantiers ferroviaires.\n    III- POSSIBILITÉ MAXIMALE D'OCCUPATION DU SOL\nArt. UM 14. COEFFICIENT D’OCCUPATION DU SOL\nSans objet\nArt. UM 15. PERFORMANCES ENERGÉTIQUES ET ENVIRONNEMENTALES\nPour les espaces réservés aux stationnements, il est préconisé d’aménager des stationnements\nvégétalisés, afin de réduire les espaces imperméabilisés.\nL’orientation et la conception des constructions, visant à limiter la consommation d’énergie, sont\nconseillées, ainsi que l’utilisation de matériaux durables.\nL’installation de dispositifs de production d’énergie renouvelable pour l’approvisionnement\nénergétique des constructions (chaudière à bois, eau chaude sanitaire solaire, pompes à chaleur,\npanneaux photovoltaïques, géothermie…) est recommandée.\nArt. UM 16. RÉSEAU NUMÉRIQUE\nDevront être prévus les réseaux internes à la construction permettant le raccordement à un réseau\ncollectif de haut débit.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    89","    UM\nModification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   90","    UPM\n    ZONE UPM\nC’est une zone recouvrant une unité hospitalière où le respect des dispositions du plan\nmasse figurant en annexe 6 du présent règlement est exigé.\n    I - NATURE DE L’OCCUPATION ET DE L’UTILISATION DU SOL\nArt. UPM 1. OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\nToutes constructions, sauf celles prévues à l’article UPM 2.\nArt. UPM 2. OCCUPATIONS ET UTILISATIONS DU SOL ADMISES SOUS CONDITIONS\nLes constructions nécessaires à l’aménagement et à l’extension des équipements sanitaires.\n    II - CONDITIONS DE L’OCCUPATION DU SOL\nArt UPM 3. ACCÈS\nPour être constructible, un terrain doit avoir accès à une voie publique ou privée d’une largeur\nadaptée à l'approche des véhicules de lutte contre l'incendie.\nToutefois, sur les terrains déjà bâtis insuffisamment desservis, un agrandissement de faible\nimportance d’une construction existante à la date d’application du présent règlement peut être\nautorisé à condition d’être située à moins de 150 mètres d’une bouche d’incendie.\nLa voie ou le chemin d’accès doivent être conçu et aménagé en tenant compte de la topographie et\nde la morphologie des lieux, de la nature des voies sur lesquelles elle débouche\n(intensité du trafic, visibilité, vitesse...), de la nature et de l’affectation des constructions existantes\net des constructions projetées, du trafic engendré par la nouvelle construction. Ils doivent permettre\nl’entrée et la sortie des véhicules sans manœuvre sur la voie de desserte. Les voies et chemins\nd’accès doivent être conçus et aménagés de manière à garantir la sécurité des piétons et des cycles.\nDe plus, la largeur minimale du chemin d’accès sur toute sa longueur doit être de 3 mètres.\nUn chemin d’accès carrossable doit permettre d’accéder aux garages ou aux places de stationnement\nréalisées sur la parcelle. Il doit être de taille et de dimension suffisante compte tenu du nombre de\nplaces de stationnement desservies, avec un minimum de 3 mètres.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    91","    UPM\nArt UPM 4. DESSERTE PAR LES RÉSEAUX\n4.1    Eau :\nToute construction nouvelle doit être raccordée au réseau public d'eau.\n4.2    Assainissement :\nToute construction nouvelle doit être raccordée au réseau public d’assainissement, dans la mesure\noù ce raccordement est techniquement et financièrement viable. Dans le cas contraire, une\ndérogation pour la mise en place d’un assainissement autonome pourrait être accordée.\nToute nouvelle construction ou extension devra respecter les prescriptions des règlements\nd’assainissement en vigueur, notamment en matière de gestion des eaux pluviales.\n(chapitre 4 du règlement d’assainissement de la ville de Saint-Cloud).\nTout raccordement doit être conforme au règlement du service de l’assainissement de la ville de\nSaint-Cloud approuvé par le Conseil communautaire de la Communauté d’agglomération\nCœur-de-Seine du 14 octobre 2014. Ce règlement précise qu’en cas de raccordement au réseau\ndépartemental d’assainissement, la gestion des eaux pluviales à la parcelle, sans raccordement au\nréseau public doit être la première solution recherchée.\nToutefois, lorsque la gestion totale de ces eaux à la parcelle n’est pas possible, le propriétaire peut\nsolliciter l’autorisation de raccorder ses eaux de ruissellement au réseau pluvial ou unitaire à la\ncondition que ses installations soient conformes aux prescriptions techniques définies dans le\nchapitre 4 du règlement d’assainissement de la ville de Saint-Cloud. Dans ce cas, seul l’excès de\nruissellement peut être canalisé après qu’aient été mises en œuvre toutes les solutions susceptibles\nde favoriser la gestion à la parcelle, telles que l’infiltration, la réutilisation des eaux claires, le\nstockage, ainsi que les rejets au milieu naturel.\nL’excédent d’eaux de ruissellement n’ayant pu être géré à la parcelle est soumis à des limitations de\ndébit de rejet afin de limiter à l’aval les risques d’inondation ou de déversement d’eaux polluées au\nmilieu naturel. Le débit de fuite pour une pluie de retour décennal ne doit pas excéder :\n    -   2L/s/ha dans le cas d’un rejet dans le réseau unitaire ;\n    -   10L/s/ha dans le cas d’un rejet dans un réseau d’eaux pluviales, sauf dispositions locales\n    particulières (notamment en raison d’insuffisance hydraulique locale, ou exutoire aval\n    constitué d’un réseau unitaire).\nDans tous les cas, l’acceptation du raccordement des eaux pluviales de toute nouvelle construction\nsera subordonnée à la capacité d’évacuation du réseau existant. Le constructeur ou l’aménageur doit\njustifier, par la production à l’exploitant de notes de calcul appropriées, le dimensionnement\nsuffisant des installations de rétention qu’il installe en amont du raccordement.\nTout rejet d’eaux usées autres que domestiques dans les réseaux publics d’assainissement doit être\npréalablement autorisé soit par arrêté d’autorisation de déversement signé par le maître d’ouvrage\ndu réseau concerné, complété éventuellement par une convention spéciale de déversement, soit par\nune convention de rejet d’eaux usées non domestiques assimilables à des eaux usées domestiques.\nElles ne pourront être rejetées à l’égout que dans les conditions définies au chapitre 3 du règlement\nd’assainissement de la ville de Saint-Cloud.\nLes rejets d’eaux claires permanentes telles qu’eaux de pompage de nappe, eaux d’exhaure, eaux de\npompe à chaleur ou similaires sont interdits dans les réseaux d’assainissement unitaires ou d’eaux\nusées. Dans le cas d’activités produisant provisoirement des eaux d’exhaure, en l’absence de solution\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    92","    UPM\nalternative et sous réserve d’une capacité suffisante du réseau, une autorisation dérogatoire peut\nêtre accordée, en référence au règlement du service de l’assainissement de la ville de Saint-Cloud\n(art. 22.2). Une convention temporaire de rejet pour ces eaux doit alors être cosignée par le\ndemandeur et les collectivités concernées.\n4.3    Électricité et téléphone :\nLes réseaux électriques et téléphoniques doivent être enterrés sur le terrain. Les armoires\nélectriques doivent être implantées à l’intérieur du terrain de la construction.\nLes coffrets de toute nature devront être incorporés à la clôture de la propriété. Ils ne peuvent en\naucun cas déborder sur le domaine public.\n4.4    Tri sélectif :\nToute construction nouvelle doit prévoir des locaux poubelles correctement dimensionnés pour\naccueillir l’ensemble des bacs de la collecte sélective, conformément au Plan Régional d’élimination\ndes déchets ménagers et assimilés (PREDMA) approuvé le 26 novembre 2009.\nArt. UPM 5. CARACTÉRISTIQUES DES TERRAINS\nSans objet.\nArt. UPM 6. IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX VOIES OU EMPRISES\nPUBLIQUES\nLes implantations des constructions par rapport aux voies doivent être implantées à l’intérieur des\npérimètres de constructibilité définis au plan masse.\nLa réalisation d’une passerelle de circulation, reliant les deux bâtiments, sur deux niveaux au-dessus\nde la rue Charles Lauer est autorisée. Sa largeur sera limitée à 4 mètres.\nLes saillies et balcon sont autorisés sur les façades donnant rue Dailly et rue Charles Lauer, à\ncondition qu’elles ne dépassent pas 2,00 mètres et qu’elles soient situées à 3,50 mètres au moins du\nsol.\nToutefois, en ce qui concerne la rue Dailly (RD 907), les saillies sur le domaine public ne doivent pas\ndépasser 0,80 mètres. Elles doivent être situées à une hauteur de 4,30 mètres minimum ; lorsque le\ntrottoir devant la façade a une largeur d’au moins 1,30 mètres la hauteur de 4,30 mètres peut être\nréduite jusqu’au minimum de 3,50 mètres.\nLes saillies sont autorisées sur la place Silly et rue de l’Arcade à condition qu’elles ne dépassent pas\n80 centimètres. Elles doivent être situées à une hauteur de 4,30 mètres minimum ; lorsque le trottoir\ndevant la façade a une largeur d’au moins 1,30 mètres la hauteur de 4,30 mètres peut être réduite\njusqu’au minimum de 3,50 mètres.\nEn périmètre de toiture-terrasse, les dispositifs de sécurité sont autorisés.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    93","    UPM\nArt. UPM 7. IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX LIMITES\nSÉPARATIVES\nLes constructions doivent être implantées à l’intérieur des périmètres de constructibilité définis au\nplan masse. Lorsque la limite séparative correspond à une limite avec une voie de statut privé, les\nrègles de l’article 6 s’appliquent.\nArt. UPM 8. IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT AUX AUTRES\nSUR UNE MÊME PROPRIÉTÉ\nLes constructions doivent être implantées à l’intérieur des périmètres de constructibilité définis au\nplan masse.\nArt. UPM 9. EMPRISE AU SOL\nLes constructions doivent s’implanter dans le périmètre d’emprise défini au plan masse.\nArt. UPM 10. HAUTEUR MAXIMUM\nLa hauteur maximum des constructions est indiquée en cote N.G.F sur le plan masse.\nCelle-ci ne s’applique pas aux dispositifs de sécurité mentionnés à l’article UPM 6 ainsi qu’aux\naménagements liés à la création d’espaces verts exigés à l’article UPM 13.\nDes dépassements de 2 mètres maximum en hauteur sont autorisés pour des locaux techniques sur\nau plus 5 % de la projection de la surface de toiture du dernier niveau sous réserve d’être implantés\nen retrait des murs de façade d’au moins 3 mètres.\nArt. UPM 11. ASPECT EXTÉRIEUR - CLÔTURES\n« Le permis de construire ou déclaration préalable de travaux peut être refusé(e) ou n’être\naccordé(e) que sous réserve de l’observation de prescriptions spéciales si les constructions, par leur\nsituation, leur architecture, leurs dimensions ou l’aspect extérieur des bâtiments ou ouvrages à\nédifier ou à modifier, sont de nature à porter atteinte au caractère ou à l’intérêt des lieux\navoisinants, aux sites, aux paysages naturels ou urbains, ainsi qu’à la conservation des perspectives\nmonumentales.»\n11.1   Constructions neuves\nAucun « style » spécifique n’est imposé. Devront être évitées les architectures simplistes,\nminimalistes ou trop géométriques. La composition et la volumétrie devront être particulièrement\nsoignées.\nToutefois sont vivement déconseillés les pastiches de styles ou modes de construction\nanachroniques (colonnes, pilastres, frontons, etc.) ou régionalistes.\nEn règle générale, les projets pourront être le reflet de tendances contemporaines, tout en\ns’inspirant de l’histoire et de la géographie de Saint-Cloud et du contexte environnant.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    94","    UPM\nLes façades devront être travaillées et devront être le reflet des fonctions du bâtiment\n(soubassement, étages, attique, etc.). Des rythmes horizontaux et verticaux devront marquer les\ndifférentes hiérarchies et fonctions.\nToutes les façades devront être traitées avec le même soin et une qualité de composition\néquivalente, qu’il s’agisse de façades principales ou secondaires (y compris les pignons aveugles), ou\ndes bâtiments annexes.\nLes matériaux et détails d’exécution devront assurer la pérennité des bâtiments.\nStructure :\nSont autorisés les matériaux type pierre, brique, meulière, béton, métal, bois, verre, etc… ;\nSont interdits les matériaux légers type « onduline » ou les matériaux de remplissage non enduits.\nMenuiseries, occultations, clôtures\nSont autorisés l’acier, l’aluminium, le bois ;\n11.2    Extensions - surélévations\nLes extensions ou surélévations doivent respecter la volumétrie, les matériaux, les rythmes et les\nmodénatures de l’existant, avec la même qualité de détails, d’autant plus s’il s’agit d’un bâtiment ou\nensemble remarquable identifié au titre de l’article L. 123-1-5 III 2° du Code de l’urbanisme\nDans le cas du choix d’une facture contemporaine pour l’extension ou la surélévation, les volumes\ndoivent s’inscrire harmonieusement avec le bâti existant. Les volumes géométriques simplistes sont\nproscrits.\nDans le cas d’une extension ou surélévation représentant plus de 30 % du volume existant, une\nrecomposition générale pourra être envisagée, mais avec la même qualité que l’existant.\n11.3    Clôtures\nLes clôtures sur voies devront être constituées d’un mur-bahut maçonné, d’une hauteur maximale de\n0,80 mètres par rapport au terrain naturel avant travaux, dans lequel devront être insérés les coffrets\ntechniques (ERDF, GRDF,…). Ce mur-bahut devra être surmonté d’une partie à claire-voie\n(pourcentage de vides de 80 %, minimum par rapport aux pleins).\nLes clôtures sur voie pourront être doublées de haies végétales.\nLa hauteur maximum des clôtures en limite séparative ou mur existant remarquable est limitée à\n2,10 mètres, sauf contexte spécifique (mur de soutènement ou mur existant remarquable). Cette\nrègle s’applique également dans les cas de modification et de réfection de clôtures existantes.\nDes exceptions à ces règles peuvent être autorisées en cas de constructions ou installations\nnécessaires aux services publics ou d’intérêt collectif, lorsque des raisons techniques ou de sécurité\nl’imposent.\nMatériaux :\nSelon le contexte du paysage de la rue, peuvent être utilisés les matériaux de type pierre, brique,\nmétal, bois ou blocs de béton enduits.\nSont interdits :\nLes matériaux de remplissages utilisés à nu, non enduits ;\nLes canisses en plastique ;\nLes grillages simples avec matériaux opacifiants rapportés.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    95","    UPM\nCouleurs :\nPierre et brique sont utilisés bruts, non peints.\nMétal ou bois, une seule couleur de préférence, deux au maximum.\nVégétation : des haies peuvent tenir lieu de clôture.\nLes haies devront être constituées d’espèces mélangées\nLes essences devront être choisies en fonction de l’orientation et de la composition du sol.\nLa haie taillée :\nSa hauteur varie entre 1,2 mètre et 1,8 mètre de hauteur. Les plants sont distants de 30 à 40\ncentimètres.\nArt. UPM 12. STATIONNEMENT\nPour toute construction nouvelle ou création de surface, il est exigé des aires de stationnement\nsuivant les normes minimales suivantes :\nLe nombre de places sera déterminé en fonction de la situation et de la nature de l’établissement,\ndes possibilités de desserte en transports en commun et des places offertes dans les parcs publics de\nstationnement.\nArt UPM 13. ESPACES LIBRES ET PLANTATIONS\nLes surfaces libres de toute construction, ainsi que les délaissés de stationnement, doivent être\nplantés et aménagés en espace vert de pleine terre avec présence d’arbres partout où cela est\npossible.\nLes façades seront végétalisées au moyen de jardinières et Les terrasses seront aménagées pour\npermettre la plantation et l’entretien de végétaux.\nLes toitures végétalisées et les espaces verts sur dalle ou en terrasse doivent être accessibles pour\npermettre leur entretien et avoir une épaisseur de terre végétale d’un minimum de 0,60 mètre.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    96","    UPM\n    III - POSSIBILITÉ MAXIMALE D’OCCUPATION DU SOL\nArt. UPM 14. COEFFICIENT D’OCCUPATION DU SOL\nSans objet.\nArt. UPM 15. PERFORMANCES ÉNERGÉTIQUES ET ENVIRONNEMENTALES\nPour les espaces réservés aux stationnements, il est préconisé d’aménager des stationnements\nvégétalisés, afin de réduire les espaces imperméabilisés.\nL’orientation et la conception des constructions, visant à limiter la consommation d’énergie, sont\nconseillées, ainsi que l’utilisation de matériaux durables.\nL’installation de dispositifs de production d’énergie renouvelable pour l’approvisionnement\nénergétique des constructions (chaudière à bois, eau chaude sanitaire solaire, pompes à chaleur,\npanneaux photovoltaïques, géothermie…) est recommandée.\nArt. UPM 16. RÉSEAU NUMÉRIQUE\nDevront être prévus les réseaux internes à la construction permettant le raccordement à un réseau\ncollectif de haut débit.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    97","    UPM\nModification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    98","    TITRE II\nDISPOSITIONS APPLICABLES À LA ZONE NATURELLE\n    ZONE N\n  Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   99","Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   100","    N\n    ZONE N\n    C’est une zone d’intérêt paysager à protéger ou à maintenir.\n    I - NATURE DE L'OCCUPATION ET DE L'UTILISATION DU SOL.\nArt. N 1. OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\nToute construction est interdite, à l’exception des équipements et aménagement liés à la vocation\nnaturelle et de loisir de la zone.\nArt. N 2. OCCUPATION ET UTILISATIONS DU SOL ADMISES SOUS CONDITIONS\nLes équipements et aménagements liés à la vocation naturelle de la zone (accrobranche).\nDans les parties de la zone soumises au risque technologique de transports de matière dangereuse\nlié à la présence des canalisations de gaz à haute pression, dont le tracé figure dans le plan des\nservitudes d’utilité publique annexé au PLU, toute occupation ou utilisation du sol doit respecter les\nrègles visant à garantir sa sécurité publique. Les projets concernés par ce risque, pourront être\nautorisés après avis et sous réserve de l’observation des prescriptions spéciales ou mesures\nconservatoires qui seraient émises par le service intéressé et le service gestionnaire de ces ouvrages.\nLes ouvrages de transports devront se conformer aux dispositions en vigueur notamment par des\nmesures de protection suffisantes. Ces dispositions figurent dans une fiche d’information en annexe\ndu règlement.\n    II - CONDITIONS DE L'OCCUPATION DU SOL.\nArt. N 3. ACCÈS\nIl n'est pas fixé de règle.\nArt. N 4. DESSERTE PAR LES RÉSEAUX\nIl n'est pas fixé de règle.\nArt. N 5. CARACTÉRISTIQUES DES TERRAINS\nSans objet.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    101","    N\nArt. N 6. IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX VOIES OU EMPRISES\nPUBLIQUES\nTout nouvel équipement doit être implanté, au minimum à 4 mètres de la limite d’emprise actuelle\nou projetée des voies ou emprises publiques.\nArt. N 7. IMPLANTATIONS DES CONSTRUCTIONS PAR RAPPORT AUX LIMITES SÉPARATIVES\nLes équipements peuvent être implantés sur les limites séparatives ou avec un retrait minimum de 3\nmètres par rapport aux dites limites.\nArt. N 8. IMPLANTATIONS DES CONSTRUCTIONS LES UNES PAR RAPPORT AUX AUTRES SUR\nUNE MÊME PROPRIÉTÉ\nIl n’est pas fixé de règle.\nArt. N 9. EMPRISE AU SOL\nL'emprise au sol des équipements ne peut excéder 1 % de la surface du terrain.\nArt. N 10. HAUTEUR MAXIMUM DES CONSTRUCTIONS\nLa hauteur au point le plus haut des équipements ne peut excéder 6 mètres.\nArt. N 11. ASPECT EXTÉRIEUR\n« Le permis de construire ou déclaration préalable de travaux peut être refusé(e) ou n’être\naccordé(e)° que sous réserve de l’observation de prescriptions spéciales si les constructions, par leur\nsituation, leur architecture, leurs dimensions ou l’aspect extérieur des bâtiments ou ouvrages à\nédifier ou à modifier, sont de nature à porter atteinte au caractère ou à l’intérêt des lieux\navoisinants, aux sites, aux paysages naturels ou urbains, ainsi qu’à la conservation des perspectives\nmonumentales.»\nLes matériaux et détails d’exécution devront assurer la pérennité des bâtiments.\nStructure :\nSont autorisés les matériaux type pierre, brique, meulière, béton, métal, bois, verre, etc… ;\nSont interdits les matériaux légers type « onduline » ou les matériaux de remplissage non enduits.\nMenuiseries, occultations, clôtures\nSont autorisés l’acier, l’aluminium, le bois ;\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    102","    N\nExtensions - surélévations\nLes extensions ou surélévations doivent respecter la volumétrie, les matériaux, les rythmes et les\nmodénatures de l’existant, avec la même qualité de détails, d’autant plus s’il s’agit d’un bâtiment ou\nensemble remarquable identifié au titre de l’article L. 123-1-5 III 2° du Code de l’urbanisme\nDans le cas du choix d’une facture contemporaine pour l’extension ou la surélévation, les volumes\ndoivent s’inscrire harmonieusement avec le bâti existant. Les volumes géométriques simplistes sont\nproscrits.\nDans le cas d’une extension ou surélévation représentant plus de 30 % du volume existant, une\nrecomposition générale pourra être envisagée, mais avec la même qualité que l’existant.\nMatériaux :\nSelon le contexte du paysage de la rue, peuvent être utilisés les matériaux de type pierre, brique,\nmétal, bois ou blocs de béton enduits.\nSont interdits :\nLes matériaux de remplissages utilisés à nu, non enduits ;\nLes canisses en plastique ;\nLes grillages simples avec matériaux opacifiants rapportés.\nCouleurs :\nPierre et brique sont utilisés bruts, non peints. Métal ou bois, une seule couleur de préférence, deux\nau maximum.\nVégétation : des haies peuvent tenir lieu de clôture.\nLes haies devront être constituées d’espèces mélangées\nLes essences devront être choisies en fonction de l’orientation et de la composition du sol.\nLa haie taillée :\nSa hauteur varie entre 1,2 mètre et 1,8 mètre de hauteur, les plants sont distants de 30 à 40\ncentimètres.\nArt. N 12. STATIONNEMENT\nIl n’est pas fixé de règle.\nArt. N 13. ESPACES LIBRES ET PLANTATIONS\nLes espaces libres de construction doivent être traités en espaces verts de pleine de terre.\nPour les cônes n° 4, les plantations devront être taillées de manière à dégager la vue. Les essences\nd’arbres seront choisies afin de limiter leur hauteur.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   103","    N\n    III- POSSIBILITÉS MAXIMALES D'OCCUPATION DU SOL\nArt. N 14. COEFFICIENT D'OCCUPATION DU SOL\nSans objet.\nArt. N 15. PERFORMANCES ÉNERGÉTIQUES ET ENVIRONNEMENTALES\nPour les espaces réservés aux stationnements, il est préconisé d’aménager des stationnements\nvégétalisés, afin de réduire les espaces imperméabilisés.\nL’orientation et la conception des constructions, visant à limiter la consommation d’énergie, sont\nrecommandées, ainsi que l’utilisation de matériaux durables.\nL’installation de dispositifs de production d’énergie renouvelable pour l’approvisionnement\nénergétique des constructions (chaudière à bois, eau chaude sanitaire solaire, pompes à chaleur,\npanneaux photovoltaïques, géothermie…) est recommandée.\nArt. N 16. RÉSEAU NUMÉRIQUE\nDevront être prévus les réseaux internes à la construction permettant le raccordement à un réseau\ncollectif de haut débit.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   104","    ANNEXES\n    ANNEXES\nAnnexe 1 : ............................................................................................................ Définitions\nAnnexe 2 : ......................................... Prospect à respecter pour l’implantation des bâtiments\nAnnexe 3 : ................................................................. Cône de vue du Parc des Tourneroches\nAnnexe 4 : ........................................................................... Liste des emplacements réservés\nAnnexe 5 : ............................................................................. Zone de plan masse « Hôpital »\nAnnexe 6 : .................................... Fiche d’information relative aux canalisations de transport\nAnnexe 7 : ...................... Les éléments du patrimoine remarquable à protéger (liste et fiches)\nAnnexe 8 : ............................................................................ Liste des espaces verts protégés\nAnnexe 9 : ............................................................................... Liste des arbres remarquables\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    105","    ANNEXES\nModification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   106","    ANNEXE 1\n
