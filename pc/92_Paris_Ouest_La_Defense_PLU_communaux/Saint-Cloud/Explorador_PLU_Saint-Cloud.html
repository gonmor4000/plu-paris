de la limite opposée existante ou future, de l’emprise de la\nvoie publique ou privée ouverte à la circulation automobile et adjacente au terrain :\n    HL\nc) Les plans parallèles au terrain naturel à une hauteur de 17 mètres au point le plus haut, le nombre\nde niveaux étant limité à 5.\n10.2    Dispositions particulières\na) Le plan incliné à 45° sur l’horizontale généré par la ligne parallèle aux limites séparatives du terrain\ncontigüe à une zone UD, placée à une hauteur de 6 mètres au point le plus haut par rapport au\nterrain naturel avant travaux ;\nb) Les zones non altius tollendi figurées au plan ont un nombre de niveaux qui est limité à R+3 ;\nc) À l’angle des îlots limités par des voies d’inégales largeurs, la hauteur des constructions édifiées en\nbordure de la voie la moins large pourra être identique à celle autorisée en bordure de la voie la plus\nlarge, sur une longueur de 20 mètres à partir du point d’intersection avec le pan coupé.\nd) La hauteur au point le plus haut des constructions comprises dans le faisceau du cône de vue n° 1\nfigurant au document graphique est précisée dans les annexes du présent règlement.\ne) La pose d’éléments tels que des antennes, des climatiseurs, des tourelles d’extraction ou des\ncheminées est autorisée au-delà de cette hauteur sous réserve de ne pas excéder la hauteur des\ninstallations déjà existantes ;\nArt. UC 11. ASPECT EXTÉRIEUR\n« Le permis de construire ou déclaration préalable de travaux peut être refusé(e) ou n’être\naccordé(e) que sous réserve de l’observation de prescriptions spéciales si les constructions, par leur\nsituation, leur architecture, leurs dimensions ou l’aspect extérieur des bâtiments ou ouvrages à\nédifier ou à modifier, sont de nature à porter atteinte au caractère ou à l’intérêt des lieux\navoisinants, aux sites, aux paysages naturels ou urbains, ainsi qu’à la conservation des perspectives\nmonumentales.»\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    35","    UC\n11.1    Constructions neuves\nAucun « style » spécifique n’est imposé. Devront être évitées les architectures simplistes,\nminimalistes ou trop géométriques. La composition et la volumétrie devront être particulièrement\nsoignées.\nToutefois sont vivement déconseillés les pastiches de styles ou modes de construction\nanachroniques (colonnes, pilastres, frontons, etc.) ou régionalistes.\nEn règle générale, les projets pourront être le reflet de tendances contemporaines, tout en\ns’inspirant de l’histoire et de la géographie de Saint-Cloud et du contexte environnant.\nLes façades devront être travaillées et devront être le reflet des fonctions du bâtiment\n(soubassement, étages, attique, etc.). Des rythmes horizontaux et verticaux devront marquer les\ndifférentes hiérarchies et fonctions.\nToutes les façades devront être traitées avec le même soin et une qualité de composition\néquivalente, qu’il s’agisse de façades principales ou secondaires (y compris les pignons aveugles), ou\ndes bâtiments annexes.\nLes façades commerciales\nLes façades de locaux commerciaux doivent être conçues en harmonie avec les caractéristiques\narchitecturales de la construction dans laquelle elles sont situées.\nLa hauteur des rez-de-chaussée commerciaux doit être au minimum de 3 mètres.\nLes créations ou modifications de façades doivent respecter les prescriptions suivantes :\n- Les percements destinés à recevoir des vitrines doivent s’adapter à l’architecture de la construction\nconcernée ;\n- Lorsqu’un même commerce est établi sur plusieurs constructions contiguës, les percements de\nvitrines doivent en respecter les limites séparatives ;\n- L’utilisation de manière uniforme de teintes vives est proscrite ;\n- Lorsqu’une façade commerciale existante présente un intérêt patrimonial ou architectural\n(modénatures, panneaux en bois travaillés, appareillage en pierres, etc.), celle-ci doit être, sauf\nimpossibilité technique avérée, préservée ou mise en valeur ;\n- Lorsque le rez-de-chaussée (des constructions nouvelles ou lors d’une modification) doit comporter\nl’emplacement d’un bandeau destiné à recevoir une enseigne, il doit être séparé de façon visible du\npremier étage, en s’inspirant des systèmes traditionnels (corniches, retraits, etc.).\n- Il doit être proportionné à la taille des locaux, du bâtiment et de la rue. Le bandeau doit se limiter\nau linéaire des vitrines commerciales ;\n- Lors de l’installation de rideaux métalliques, les caissons doivent être intégrés dans le gros œuvre et\nne pas présenter de saillie en façade. Ces rideaux sont de préférence ajourés.\nLes extractions nécessaires aux commerces devront respecter la réglementation en vigueur (Code de\nla construction).\nLes matériaux et détails d’exécution devront assurer la pérennité des bâtiments.\nStructure :\nSont autorisés les matériaux type pierre, brique, meulière, béton, métal, bois, verre, etc… ;\nSont interdits les matériaux légers type « onduline » ou les matériaux de remplissage non enduits ;\nMenuiseries, occultations, clôtures\nSont autorisés l’acier, l’aluminium, le bois ;\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    36","    UC\n11.2    Extensions - surélévations\nLes extensions ou surélévations doivent respecter la volumétrie, les matériaux, les rythmes et les\nmodénatures de l’existant, avec la même qualité de détails, d’autant plus s’il s’agit d’un bâtiment ou\nensemble remarquable identifié au titre de l’article L. 123-1-5 III 2° du Code de l’urbanisme.\nDans le cas du choix d’une facture contemporaine pour l’extension ou la surélévation, les volumes\ndoivent s’inscrire harmonieusement avec le bâti existant ; les volumes géométriques simplistes sont\nproscrits.\nDans le cas d’une extension ou surélévation représentant plus de 30% du volume existant, une\nrecomposition générale pourra être envisagée, mais avec la même qualité que l’existant.\n11.3    Clôtures\nLes clôtures sur voies devront être constituées d’un mur-bahut maçonné, d’une hauteur maximale de\n0,80 mètre par rapport au terrain naturel avant travaux, dans lequel devront être insérés les coffrets\ntechniques (ERDF, GRDF,…). Ce mur-bahut devra être surmonté d’une partie à claire-voie\n(pourcentage de vides de 80 % minimum par rapport aux pleins).\nLes clôtures sur voie devront être doublées de haies végétales.\nLa hauteur maximum des clôtures en limite séparative ou mur existant remarquable est limitée à\n2,10 mètres, sauf contexte spécifique (mur de soutènement ou mur existant remarquable). Cette\nrègle s’applique également dans les cas de modification et de réfection de clôtures existantes.\nDes exceptions à ces règles peuvent être autorisées en cas de constructions ou installations\nnécessaires aux services publics ou d’intérêt collectif, lorsque des raisons techniques ou de sécurité\nl’imposent.\nMatériaux :\nSelon le contexte du paysage de la rue, peuvent être utilisés les matériaux de type pierre, brique,\nmétal, bois ou blocs de béton enduits ;\nSont interdits :\nLes matériaux de remplissages utilisés à nu, non enduits ;\nLes canisses en plastique ;\nLes grillages simples avec matériaux opacifiants rapportés ;\nCouleurs :\nPierre et brique sont utilisés bruts, non peints.\nMétal ou bois, une seule couleur de préférence, deux au maximum.\nVégétation : des haies peuvent tenir lieu de clôture.\nLes haies devront être constituées d’espèces mélangées\nLes essences devront être choisies en fonction de l’orientation et de la composition du sol.\nLa haie taillée :\nSa hauteur varie entre 1,2 mètre et 1,8 mètre de hauteur, les plants sont distants de 30 à\n40 centimètres.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    37","    UC\nArt. UC 12. STATIONNEMENT\n12.1 Pour toute construction nouvelle, il est exigé des aires de stationnement suivant les normes\nminimales suivantes :\nHabitat\nConstruction neuve    : 1 place par logement plus 1 place supplémentaire pour tous les\n    logements d’une superficie supérieure à 100 m² de surface de\n    plancher, plus 1 place par tranche de trois logements.\nCommerce, artisanat    : surface de plancher inférieure à 200 m² : pas de règle\n    surface de plancher cumulée sur une même opération\n    supérieure à 200 m² : 1 place pour 100 m²\n    surface de plancher cumulée sur une même opération\n    supérieure à 300 m² : 1 place de livraison\nBureaux    : 1 place pour 100 m² de surface de plancher\nHôtel    : 1 place pour 4 chambres\nIndustrie et dépôts    : 1 place pour 200 m² de surface de plancher\nÉquipements publics et d’intérêt collectif : le nombre de places sera déterminé en fonction de la\nsituation et de la nature de l’établissement, des possibilités de desserte en transports en commun et\ndes places offertes dans les parcs publics de stationnement.\nÉquipement d’intérêt collectif à caractère résidentiel (résidence étudiante, de personnes âgées, foyer\nde jeunes travailleurs…) : 1 place pour 10 chambres\n12.2 Dans le cadre de l’extension d’habitat existant, il sera demandé au pétitionnaire de se mettre\naux normes du stationnement réglementé par l’article 12.1.\n12.3 L'accès au sous-sol doit présenter un palier de pente inférieure à 5 % d'une longueur\nminimale de 5,00 mètres au débouché sur l'alignement chaque fois que c’est possible.\n12.4 Pour les logements locatifs financés avec un prêt aidé par l’État, ainsi que lors de la\nconstruction des établissements assurant l’hébergement des personnes âgées mentionnés au 6° du I\nde l’article L. 312.1 du Code de l’action sociale et des familles et des résidences universitaires\nmentionnées à l’article L. 631-12 du Code de la construction et de l’habitation, il ne peut être exigé la\nréalisation de plus d’une aire de stationnement par logement.\n12.5 Pour les constructions comportant plus de deux logements, une proportion de 50 % au moins\ndes surfaces totales de stationnement définies ci-dessus doit être réalisée dans le volume même des\nconstructions.\n12.6    Stationnement des deux roues et des poussettes :\nPour les constructions comportant trois logements et plus, un local à cycles par cage d’escalier doit\nêtre aménagé au rez-de-chaussée, à proximité de l’entrée principale, en évitant tout franchissement\nd’escaliers ou de portes. Il donnera dans la mesure du possible directement sur la voie publique. Tout\nlocal réservé à cet usage doit avoir une surface d’au moins 3m² et être clos et couvert. Sa superficie\nest calculée en fonction des normes suivantes :\n    - Pour les logements : une superficie d’au minimum 0,75 m² pour les T1 et T2 et d’au minimum\n    1,5 m² pour tous les autres logements ;\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    38","    UC\n    -   Bureaux : 1,5 m² pour 100 m² de surface de plancher ;\n    -   Commerces : 1 place pour 10 employés avec en plus, le stationnement visiteurs ;\n    -   Artisanat, industrie, hébergement hôtelier, de plus de 500 m² de de surface de plancher :\n    1 place pour 10 employés avec en plus, le stationnement visiteurs ;\n    -   Équipements scolaires : primaires, collèges, lycées et universités = 1 place pour 8 à 12\n    élèves ;\n    -   Pour les constructions et installations nécessaires aux services publics ou d’intérêt collectif :\n    1 place pour 20 places de capacité de réception.\nPour les constructions comportant trois logements et plus, un local à poussettes devra également\nêtre créé, séparé du local à vélos, au niveau du rez-de-chaussée et avec une surface minimale\nde 3 m².\n12.7 Le calcul du nombre de place sera arrondi à l’unité inférieure si la première décimale est\ninférieure ou égale à 5.\n12.8 Les bâtiments neufs à usage principal d’habitation, qui comportent un parc de\nstationnement, doivent être pré-équipés afin de faciliter la mise en place ultérieure d’infrastructures\nde recharge pour les véhicules légers. Soit :\n    - alimentation en électricité du parc de stationnement, avec présence d’un tableau général\n    basse tension en aval du disjoncteur de l’immeuble. L’alimentation électrique ainsi que le\n    tableau sont dimensionnés de façon à permettre la recharge normale de véhicules pour un\n    minimum de 10 % des places, avec au minimum une place ;\n    - installation de gaines, fourreaux, chemins de câbles à partir du tableau général basse tension,\n    permettant une facturation individuelle des consommations.\n12.9 Les bâtiments de bureaux, qui comportent un parc de stationnement, doivent être équipés\nde points de charge, permettant la recharge des véhicules légers.\nL’obligation consiste en un équipement, par le propriétaire du parc, de points de charge pour la\nrecharge normale des véhicules légers, avec une alimentation en électricité d’une partie des places,\navec un minimum d’une place, à partir d’un tableau général basse tension en aval du disjoncteur de\nl’immeuble.\nArt. UC 13. ESPACES LIBRES ET PLANTATIONS\nAu moins 50 % de la surface du terrain doivent être traités en espaces verts de pleine terre avec au\nminimum 1 arbre pour 100 m² d’espaces verts.\nLes espaces verts sur dalle ou en terrasse et les toitures végétalisées sont comptabilisés pour 50 % de\nleur surface dans le calcul des espaces verts, et ne peuvent pas dépasser 20 % de la surface totale\nrequise.\nLes toitures végétalisées et les espaces verts sur dalle ou en terrasse doivent être accessibles pour\npermettre leur entretien et avoir une épaisseur de terre végétale d’un minimum de 0,60 mètre.\nLes espaces verts protégés et ceux faisant partie d’un ensemble remarquable identifiés au titre de\nl’article L. 123-1-5 III 2° du Code de l’urbanisme doivent être conservés sauf une impossibilité\ntechnique avérée ou sauf si leur suppression est rendue nécessaire pour la sécurité des personnes et\ndes biens. Dans le cas où un arbre serait abattu, il devra être remplacé par un arbre de même espèce\nou d’une espèce susceptible de redonner une valeur paysagère équivalente.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    39","    UC\n    III - POSSIBILITÉ MAXIMALE D'OCCUPATION DU SOL\nArt. UC 14. COEFFICIENT D 'OCCUPATION DU SOL\nSans objet.\nArt. UC 15. PERFORMANCES ÉNERGÉTIQUES ET ENVIRONNEMENTALES\nPour les espaces réservés aux stationnements, il est préconisé d’aménager des stationnements\nvégétalisés, afin de réduire les espaces imperméabilisés.\nL’orientation et la conception des constructions, visant à limiter la consommation d’énergie, sont\nconseillées, ainsi que l’utilisation de matériaux durables.\nL’installation de dispositifs de production d’énergie renouvelable pour l’approvisionnement\nénergétique des constructions (chaudière à bois, eau chaude sanitaire solaire, pompes à chaleur,\npanneaux photovoltaïques, géothermie…) est recommandée.\nArt. UC 16. RÉSEAU NUMÉRIQUE\nPour les constructions à usage d’habitation de trois logements et plus ainsi que pour les\nconstructions à usage de bureaux et d’hébergement hôtelier, devront être prévus les réseaux\ninternes à la construction permettant le raccordement à un réseau collectif de haut débit.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   40","    UD\n    ZONE UD\nC’est une zone à usage dominant d'habitat pavillonnaire, dans un cadre verdoyant.\n    I - NATURE DE L'OCCUPATION ET DE L'UTILISATION DU SOL\nArt. UD 1. OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\n1.1    Les constructions à usage d’activités à caractère industriel.\n1.2    Les dépôts de ferrailles, matériaux, combustibles solides ou liquides, les entreprises de\ncassage de voitures à l'air libre et les fourrières.\n1.3    Le camping.\n1.4    Les affouillements, exhaussements des sols et les exploitations de carrières non liés à des\ntravaux de construction.\nArt. UD 2. OCCUPATIONS ET UTILISATIONS DU SOL ADMISES SOUS CONDITIONS\n2.1    L'implantation, l'agrandissement ou la modification de l'existant des installations classées\ncompatibles avec le caractère de la zone\n2.2    Sur les terrains comportant d’anciennes carrières et ceux soumis au risque de glissement de\nterrain, les constructions peuvent faire l'objet de recommandations particulières. Les dispositions du\nPPRMT, en annexe du PLU, doivent être respectées.\n2.3    Dans les secteurs soumis aux risques d’inondation, les constructions, ouvrages et travaux\nsont soumis aux dispositions du PPRI, en annexe du PLU.\n2.4    Le long des linéaires d’axes commerciaux mentionnés au document graphique, au titre de\nl’article L. 123-1-5 II 5° du Code de l’urbanisme, est interdite la transformation en logements, de\nlocaux existants, à la date d’application du présent règlement, situés en rez-de-chaussée et destinés\nà l’accueil d’activités commerciales.\n2.5    En limite du domaine ferroviaire, l’implantation des constructions doit respecter les règles\ndes servitudes ferroviaires, en annexe du PLU.\n2.6    Dans les parties de la zone soumises au risque technologique de transports de matière\ndangereuse lié à la présence des canalisations de gaz à haute pression, dont le tracé figure dans le\nplan des servitudes d’utilité publique annexé au PLU, toute occupation ou utilisation du sol doit\nrespecter les règles visant à garantir sa sécurité publique. Les projets concernés par ce risque,\npourront être autorisés après avis et sous réserve de l’observation des prescriptions spéciales ou\nmesures conservatoires qui seraient émises par le service intéressé et le service gestionnaire de ces\nouvrages. Les ouvrages de transports devront se conformer aux dispositions en vigueur notamment\npar des mesures de protection suffisantes. Ces dispositions figurent dans une fiche d’information en\nannexe du règlement.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    41","    UD\n2.7    Les travaux de maintenance, de modification des ouvrages électriques à haute et très haute\ntension sont autorisés pour des exigences fonctionnelles et/ou techniques.\n2.8    Protection sanitaire de l’aqueduc de l’Avre : les dispositions prévues en annexe doivent être\nrespectées\n    II- CONDITIONS DE L'OCCUPATION DU SOL\nArt. UD 3. ACCÈS\n3.1    Conditions liées à la desserte du terrain par une voie d’accès existante ou par une voie\nd’accès créée\nPour être constructible, un terrain doit avoir accès à une voie publique ou privée respectant les\nconditions suivantes :\n•   Pour toute opération conduisant à la desserte de 1 ou 2 logements y compris les logements\n    existants à la date d’application du présent règlement, l'emprise de la voie de desserte doit avoir\n    une largeur minimum de 3 mètres sur toute sa longueur.\n•   Pour toute opération conduisant à la desserte de 3 logements et plus y compris les logements\n    existants à la date d’application du présent règlement, et pour tous les autres types de\n    constructions autorisés dans cette zone, l'emprise de la voie de desserte doit avoir une largeur\n    minimum de 4 mètres sur toute sa longueur, avec une chaussée aménagée pour permettre le\n    croisement des véhicules. Les voies et chemin d’accès se terminant en impasse (chemins privés\n    réalisés sur des parcelles privées) desservant plus de deux logements y compris des logements\n    existants doivent être aménagés de façon à permettre aux véhicules de faire demi-tour.\nToutefois, sur les terrains déjà bâtis insuffisamment desservis, un agrandissement de faible\nimportance d’une construction existante à la date d’application du présent règlement peut être\nautorisé à condition d’être située à moins de 150 mètres d’une bouche d’incendie.\nLes voies de desserte doivent être conçues et aménagées de manière à garantir la sécurité des\npiétons et des cycles.\n3.2    Conditions liées aux caractéristiques des accès à la parcelle existants ou créés\nLes accès doivent être conçus et aménagés en tenant compte de la topographie et de la morphologie\ndes lieux, de la nature des voies sur lesquelles elles débouchent (intensité du trafic, visibilité,\nvitesse...), de la nature et de l’affectation des constructions existantes et des constructions projetées\nainsi que du trafic engendré par la nouvelle construction. Ils doivent permettre l’entrée et la sortie\ndes véhicules sans manœuvre sur la voie de desserte.\n3.3    Conditions à respecter pour l’aménagement des chemins d’accès aux garages ou aux places\nde stationnement situés sur le terrain d’emprise de la construction\nUn chemin carrossable doit permettre d’accéder aux garages ou aux places de stationnement\nréalisées sur la parcelle. Il doit être de taille et de dimension suffisante compte tenu du nombre de\nplaces de stationnement desservies, avec un minimum de 3 mètres.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    42","    UD\nArt. UD 4. DESSERTE PAR LES RÉSEAUX\n4.1    Eau :\nToute construction nouvelle doit être raccordée au réseau public d'eau.\n4.2    Assainissement :\nToute construction nouvelle doit être raccordée au réseau public d’assainissement, dans la mesure\noù ce raccordement est techniquement et financièrement viable. Dans le cas contraire, une\ndérogation pour la mise en place d’un assainissement autonome pourrait être accordée.\nToute nouvelle construction ou extension devra respecter les prescriptions des règlements\nd’assainissement en vigueur, notamment en matière de gestion des eaux pluviales.\n(chapitre 4 du règlement d’assainissement de la ville de Saint-Cloud).\nTout raccordement doit être conforme au règlement du service de l’assainissement de la ville de\nSaint-Cloud approuvé par le Conseil communautaire de la Communauté d’agglomération\nCœur-de-Seine du 14 octobre 2014. Ce règlement précise qu’en cas de raccordement au réseau\ndépartemental d’assainissement, la gestion des eaux pluviales à la parcelle, sans raccordement au\nréseau public doit être la première solution recherchée.\nToutefois, lorsque la gestion totale de ces eaux à la parcelle n’est pas possible, le propriétaire peut\nsolliciter l’autorisation de raccorder ses eaux de ruissellement au réseau pluvial ou unitaire à la\ncondition que ses installations soient conformes aux prescriptions techniques définies dans le\nchapitre 4 du règlement d’assainissement de la ville de Saint-Cloud. Dans ce cas, seul l’excès de\nruissellement peut être canalisé après qu’aient été mises en œuvre toutes les solutions susceptibles\nde favoriser la gestion à la parcelle, telles que l’infiltration, la réutilisation des eaux claires, le\nstockage, ainsi que les rejets au milieu naturel.\nL’excédent d’eaux de ruissellement n’ayant pu être géré à la parcelle est soumis à des limitations de\ndébit de rejet afin de limiter à l’aval les risques d’inondation ou de déversement d’eaux polluées au\nmilieu naturel. Le débit de fuite pour une pluie de retour décennal ne doit pas excéder :\n    -   2L/s/ha dans le cas d’un rejet dans le réseau unitaire ;\n    -  10L/s/ha dans le cas d’un rejet dans un réseau d’eaux pluviales, sauf dispositions locales\n    particulières (notamment en raison d’insuffisance hydraulique locale, ou exutoire aval\n    constitué d’un réseau unitaire).\nDans tous les cas, l’acceptation du raccordement des eaux pluviales de toute nouvelle construction\nsera subordonnée à la capacité d’évacuation du réseau existant. Le constructeur ou l’aménageur doit\njustifier, par la production à l’exploitant de notes de calcul appropriées, le dimensionnement\nsuffisant des installations de rétention qu’il installe en amont du raccordement.\nTout rejet d’eaux usées autres que domestiques dans les réseaux publics d’assainissement doit être\npréalablement autorisé soit par arrêté d’autorisation de déversement signé par le maître d’ouvrage\ndu réseau concerné, complété éventuellement par une convention spéciale de déversement, soit par\nune convention de rejet d’eaux usées non domestiques assimilables à des eaux usées domestiques.\nElles ne pourront être rejetées à l’égout que dans les conditions définies au chapitre 3 du règlement\nd’assainissement de la ville de Saint-Cloud.\nLes rejets d’eaux claires permanentes telles qu’eaux de pompage de nappe, eaux d’exhaure, eaux de\npompe à chaleur ou similaires sont interdits dans les réseaux d’assainissement unitaires ou d’eaux\nusées. Dans le cas d’activités produisant provisoirement des eaux d’exhaure, en l’absence de solution\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   43","    UD\nalternative et sous réserve d’une capacité suffisante du réseau, une autorisation dérogatoire peut\nêtre accordée, en référence au règlement du service de l’assainissement de la ville de Saint-Cloud\n(art. 22.2). Une convention temporaire de rejet pour ces eaux doit alors être cosignée par le\ndemandeur et les collectivités concernées.\n4.3    Électricité et téléphone :\nLes réseaux électriques et téléphoniques doivent être enterrés sur le terrain. Les armoires\nélectriques doivent être implantées à l’intérieur du terrain de la construction.\nLes coffrets de toute nature devront être incorporés à la clôture de la propriété. Ils ne peuvent en\naucun cas déborder sur le domaine public.\n4.4    Tri sélectif :\nToute construction nouvelle doit prévoir des locaux poubelles correctement dimensionnés pour\naccueillir l’ensemble des bacs de la collecte sélective, conformément au Plan Régional d’élimination\ndes déchets ménagers et assimilés (PREDMA) approuvé le 26 novembre 2009.\nArt. UD 5. CARACTÉRISTIQUES DES TERRAINS\nSans objet.\nArt. UD 6. IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX VOIES ET EMPRISES\nPUBLIQUES\n6.1    Toute construction nouvelle doit être implantée à 4 mètres au minimum de la limite\nd’emprise des voies et emprises publiques actuelles ou projetées, des reculements ou des zones non\naedificandi figurés au plan.\n6.2    Les terrains situés à l'angle de deux voies ouvertes à la circulation automobile publique\ndoivent supporter un pan coupé d'une longueur minimale de 4 mètres à angles égaux.\n6.3    À l’intérieur de la marge de reculement, la pose de matériaux d’isolation extérieure des\nfaçades est autorisée avec une épaisseur maximale de 20 centimètres.\n6.4    Dans les marges de reculement, les rampes d’accès et les locaux de stockage de déchets\ndonnant directement sur la voie publique, traités par des aménagements architecturaux ou paysagés\nsont autorisés.\n6.5    Construction existante, à la date d’application du présent règlement : l’extension ou la\nsurélévation de bâtiments existants ne respectant pas la marge de reculement peut être autorisée\ndans le prolongement de la leurs façades existante, sous réserve du respect des autres règles.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   44","    UD\nArt. UD 7. IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX LIMITES SÉPARATIVES\n7.1    Constructions nouvelles\n7.1.1 Dans une bande de 25 mètres comptée à partir de la limite d’emprise de la voie, existante ou\nfuture, de la marge de reculement ou de la zone non aedificandi imposés (cf art. UD 6).\n-    Pour les terrains dont la largeur est inférieure ou égale à 15 mètres, les constructions sont\nautorisées sur les limites séparatives, si cette façade sur la limite ne comporte pas de baies autres\nque des jours de souffrance et ne dépasse pas 6 mètres de hauteur par rapport au terrain naturel\navant travaux. Le pan incliné de la toiture devra être compris entre 30° et 45°. Les constructions en\nretrait des limites séparatives doivent être implantées conformément à l’article 7.1.3.\n-    Toutefois, pour les terrains visés au 7.1.1., la surélévation et l’extension d’une construction\nne respectant pas les règles précitées sont autorisées à condition qu’elles se fassent dans le\nprolongement des murs existants et qu’elles ne comportent que des jours de souffrance et ne\ndépassent pas 6 mètres de hauteur par rapport au terrain naturel avant travaux.\n-    Pour les terrains dont la largeur est comprise entre 15 et 30 mètres, les constructions en\nmitoyenneté ne sont autorisées que sur une seule des limites séparatives et à condition que cette\nfaçade ne comporte pas de baie autre que des jours de souffrance et ne dépasse pas 6 mètres de\nhauteur par rapport au terrain naturel avant travaux. Le pan incliné de la toiture devra être compris\nentre 30° et 45°. Les constructions en retrait des limites séparatives doivent être implantées\nconformément à l’article 7.1.3.\n-    Pour les terrains dont la largeur est supérieure à 30 mètres, les constructions ne sont\nautorisées qu’en retrait des limites séparatives conformément à l’article 7.1.3.\n-    Nonobstant les règles précédentes, les constructions sur les limites sont autorisées si elles\ns’adossent à une construction en bon état, de dimensions égales ou supérieures existant sur le\nterrain voisin et qu’elles s’insèrent dans les héberges existantes.\n7.1.2   Constructions au-delà de la bande de 25 mètres\nAu-delà de la bande de 25 mètres ci-dessus définie, les constructions sur limites séparatives sont\ninterdites sauf :\nSi elles s’adossent à une construction en bon état et de dimensions égales ou supérieures existant\nsur le terrain voisin et qu’elles s’insèrent dans les héberges existantes, ou si leur hauteur au point le\nplus haut ne dépasse pas 2,60 mètres et qu’elles ne soient pas affectées à l’habitation ni à une\nactivité industrielle, artisanale ou de bureau.\nPour les autres cas, les constructions doivent être implantées conformément au 7.1.3.\n7.1.3   Marge de retrait à respecter en cas d’implantation en retrait\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    45","    UD\nPar rapport aux limites latérales :\nA) Dispositions relatives à l’implantation des éléments de façade comportant une ou plusieurs baies\nd’une surface supérieure à 0,25 m² à l’exclusion des baies de type zénithal.\nLa distance D, comptée horizontalement, à partir de l’élément de façade jusqu’à la limite séparative\nlui faisant face doit être supérieure ou égale à 1,5 fois la hauteur de cet élément de façade par\nrapport au terrain naturel avant travaux, sans pouvoir être inférieure à 8 mètres :\n    D  1,5 H  8 m\nB) Dispositions relatives à l’implantation des éléments de façade dépourvus de baies d’une surface\nsupérieure à 0,25 m². Lorsque les baies sont accolées, la surface totale des baies est prise en compte\npour le calcul de leur surface.\nLa distance de chaque élément de façades aveugles ou ne comportant que des jours de souffrance\nou des baies d’une surface inférieure à 0,25 m², comptée horizontalement jusqu’à la limite\nséparative lui faisant face doit être au moins égale à la moitié de la hauteur de cet élément de façade\npar rapport au terrain naturel avant travaux sans pouvoir être inférieure à 3 mètres :\n    D    H    3m\n    2    2\nPar rapport à la limite de fond de parcelle :\nA) Dispositions relatives à l’implantation des éléments de façade comportant une ou plusieurs baies\nd’une surface supérieure à 0,25 m² à l’exclusion des baies de type zénithal.\nLa distance D, comptée horizontalement, à partir de l’élément de façade jusqu’à la limite séparative\nlui faisant face doit être supérieure ou égale à 10 mètres.\nB) Dispositions relatives à l’implantation des éléments de façade dépourvus de baies d’une surface\nsupérieure à 0,25 m². Lorsque les baies sont accolées, la surface totale des baies est prise en compte\npour le calcul de leur surface.\nLa distance de chaque élément de façade aveugle ou ne comportant que des jours de souffrance,\ncomptée horizontalement jusqu’à la limite séparative lui faisant face doit être supérieure ou égale à\n6 mètres.\n7.2    Agrandissement de l'existant\nLes agrandissements de faible importance ayant pour but l’amélioration du bâtiment (ascenseurs,\nsanitaires, mise aux normes de confort, locaux déchets ménagers, vélos, etc ...) peuvent être\nautorisés dans le prolongement des murs existants.\nArt. UD 8. IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT AUX AUTRES SUR\nUNE MÊME PROPRIÉTÉ\n8.1    Dispositions relatives à l’implantation des éléments de façade comportant une ou plusieurs\nbaies d’une surface supérieure à 0,25 m².\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    46","    UD\nLa distance D, comptée horizontalement, à partir de l’élément de façade jusqu’au bâtiment lui\nfaisant face doit être supérieure ou égale à 1,5 fois la hauteur de cet élément de façade par rapport\nau terrain naturel avant travaux, sans pouvoir être inférieure à 8 mètres :\n    D  1,5 H  8 m\n8.2    Dispositions relatives à l’implantation des éléments de façade dépourvus de baies d’une\nsurface supérieure à 0,25 m².\nLa distance de chaque élément de façade aveugle ou ne comportant que des jours de souffrance,\ncomptée horizontalement jusqu’au bâtiment lui faisant face doit être au moins égale à la moitié de la\nhauteur de cet élément de façade par rapport au terrain naturel avant travaux sans pouvoir être\ninférieure à 4 mètres :\n    DH4m\n    2\nLorsque les baies sont accolées, la surface totale des baies est prise en compte pour le calcul de leur\nsurface.\n8.3    L’extension ou la surélévation de constructions existantes est exonérée des règles ci-dessus.\n8.4    Il n’est pas fixé de règle pour la distance entre la construction principale et une annexe d’une\nsurface de plancher de moins de 20 m².\nArt. UD 9. EMPRISE AU SOL\nL'emprise au sol des bâtiments est dégressive selon la surface de la parcelle :\n - Pour les premiers 300 m² de terrain, l’emprise au sol est fixée à un maximum de 40 % ;\n - Pour la tranche comprise entre 300 m² et 600 m² de terrain, l’emprise au sol est fixée à un\nmaximum de 20 % ;\n- Au-delà de 600 m² de terrain l’emprise au sol maximum est fixée à 10 %.\nSi l’emprise au sol issue de l’application de l’article 9 dépasse 200 m², elle doit obligatoirement être\ndivisée en plusieurs unités autonomes dont aucune ne dépassera 200 m² d’emprise au sol. Toutefois,\ndans le cas de création de plusieurs logements réalisés en continuité sous la forme de maisons\ngroupées (maisons de ville), cette règle ne s’applique pas.\nLes agrandissements de faible importance ayant pour but l’amélioration du bâtiment (ascenseurs,\nsanitaires, mise aux normes de confort, locaux déchets ménagers, vélos, etc...) pourront être\nautorisés sans qu’il soit fait appel à la règle précitée.\nArt. UD 10. HAUTEUR MAXIMUM DES CONSTRUCTIONS\na) La hauteur des façades ne doit pas excéder 6 mètres à l’égout du toit en cas de toiture à pente.\nDans tous les cas, la hauteur au point le plus haut ne doit pas excéder 9 mètres soit R+1+C ou R+1 et\nun étage en attique avec un maximum de 3 niveaux. Dans le cas d’un étage en attique, le retrait\nminimum au droit de deux façades doit être de 2 mètres.\nb) La hauteur au point le plus haut, des constructions comprises dans le faisceau du cône de vue n° 1\nfigurant au document graphique est précisée dans les annexes du présent règlement.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    47","    UD\nArt. UD 11. ASPECT EXTÉRIEUR\n« Le permis de construire ou déclaration préalable de travaux peut être refusé(e) ou n’être\naccordé(e) que sous réserve de l’observation de prescriptions spéciales si les constructions, par leur\nsituation, leur architecture, leurs dimensions ou l’aspect extérieur des bâtiments ou ouvrages à\nédifier ou à modifier, sont de nature à porter atteinte au caractère ou à l’intérêt des lieux\navoisinants, aux sites, aux paysages naturels ou urbains, ainsi qu’à la conservation des perspectives\nmonumentales.»\n11.1    Constructions neuves\nAucun « style » spécifique n’est imposé. Devront être évitées les architectures simplistes,\nminimalistes ou trop géométriques. La composition et la volumétrie devront être particulièrement\nsoignées.\nToutefois sont vivement déconseillés les pastiches de styles ou modes de construction\nanachroniques (colonnes, pilastres, frontons, etc.) ou régionalistes.\nEn règle générale, les projets pourront être le reflet de tendances contemporaines, tout en\ns’inspirant de l’histoire et de la géographie de Saint-Cloud et du contexte environnant.\nLes façades devront être travaillées et devront être le reflet des fonctions du bâtiment\n(soubassement, étages, attique, etc.). Des rythmes horizontaux et verticaux devront marquer les\ndifférentes hiérarchies et fonctions.\nToutes les façades devront être traitées avec le même soin et une qualité de composition\néquivalente, qu’il s’agisse de façades principales ou secondaires (y compris les pignons aveugles), ou\ndes bâtiments annexes.\nLes façades commerciales\nLes façades de locaux commerciaux doivent être conçues en harmonie avec les caractéristiques\narchitecturales de la construction dans laquelle elles sont situées.\nLa hauteur des rez-de-chaussée commerciaux doit être au minimum de 3 mètres.\nLes créations ou modifications de façades doivent respecter les prescriptions suivantes :\n- Les percements destinés à recevoir des vitrines doivent s’adapter à l’architecture de la construction\nconcernée ;\n- Lorsqu’un même commerce est établi sur plusieurs constructions contiguës, les percements de\nvitrines doivent en respecter les limites séparatives ;\n- L’utilisation de manière uniforme de teintes vives est proscrite ;\n- Lorsqu’une façade commerciale existante présente un intérêt patrimonial ou architectural\n(modénatures, panneaux en bois travaillés, appareillage en pierres, etc.), celle-ci doit être, sauf une\nimpossibilité technique avérée, préservée ou mise en valeur ;\n- Lorsque le rez-de-chaussée (des constructions nouvelles ou lors d’une modification) doit comporter\nl’emplacement d’un bandeau destiné à recevoir une enseigne, il doit être séparé de façon visible du\npremier étage, en s’inspirant des systèmes traditionnels (corniches, retraits, etc.).\n- Il doit également être proportionné à la taille des locaux, du bâtiment et de la rue.\nLe bandeau doit également se limiter au linéaire des vitrines commerciales ;\n- Lors de l’installation de rideaux métalliques, les caissons doivent être intégrés dans le gros œuvre et\nne pas présenter de saillie en façade. Ces rideaux sont de préférence ajourés.\nLes extractions nécessaires aux commerces devront respecter la réglementation en vigueur (Code de\nla construction).\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    48","    UD\nLes matériaux et détails d’exécution devront assurer la pérennité des bâtiments.\nEn cas de toiture à pentes, le degré de pente devra être compris entre 30° et 45°\n    30°M in.\nL’implantation des ouvertures de toit doit respecter le rythme des ouvertures en façade. La largeur\ncumulée des lucarnes ne doit pas excéder 1/3 de la largeur de cette façade.\nEn cas de toiture terrasse : le dernier niveau devra être réalisé en attique avec une profondeur\nminimale de 2 mètres au droit de deux façades.\nStructure :\nSont autorisés les matériaux type pierre, brique, meulière, béton, métal, bois, verre, etc… ;\nSont interdits les matériaux légers type « onduline » ou les matériaux de remplissage non enduits.\nMenuiseries, occultations, clôtures\nSont autorisés l’acier, l’aluminium, le bois ;\n11.2    Extensions - surélévations\nLes extensions ou surélévations doivent respecter la volumétrie, les matériaux, les rythmes et les\nmodénatures de l’existant, avec la même qualité de détails, d’autant plus s’il s’agit d’un bâtiment ou\nensemble remarquable identifié au titre de l’article L. 123-1-5 III 2° du Code de l’urbanisme\nDans le cas du choix d’une facture contemporaine pour l’extension ou la surélévation, les volumes\ndoivent s’inscrire harmonieusement avec le bâti existant. Les volumes géométriques simplistes sont\nproscrits.\nDans le cas d’une extension ou surélévation représentant plus de 30 % du volume existant, une\nrecomposition générale pourra être envisagée, mais avec la même qualité que l’existant.\n11.3    Clôtures\nLes clôtures sur voies devront être constituées d’un mur-bahut maçonné, d’une hauteur maximale de\n0,80 mètre par rapport au terrain naturel avant travaux, dans lequel devront être insérés les coffrets\ntechniques (ERDF, GRDF,…). Ce mur-bahut devra être surmonté d’une partie à claire-voie\n(pourcentage de vides de 80 %, minimum par rapport aux pleins).\nLes clôtures sur voie devront être doublées de haies végétales.\nLa hauteur maximum des clôtures en limite séparative est limitée à 2,10 mètres, sauf contexte\nspécifique (mur de soutènement ou mur existant remarquable). Cette règle s’applique également\ndans les cas de modification et de réfection.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    49","    UD\nDes exceptions à ces règles peuvent être autorisées en cas de constructions ou installations\nnécessaires aux services publics ou d’intérêt collectif, lorsque des raisons techniques ou de sécurité\nl’imposent.\nMatériaux :\nSelon le contexte du paysage de la rue, peuvent être utilisés les matériaux de type pierre, brique,\nmétal, bois ou blocs de béton enduits.\nSont interdits :\nLes matériaux de remplissages utilisés à nu, non enduits ;\nLes canisses en plastique ;\nLes grillages simples avec matériaux opacifiants rapportés ;\nCouleurs :\nPierre et brique sont utilisés bruts, non peints.\nMétal ou bois, une seule couleur de préférence, deux au maximum.\nVégétation : des haies peuvent tenir lieu de clôture.\nLes haies devront être constituées d’espèces mélangées\nLes essences devront être choisies en fonction de l’orientation et de la composition du sol.\nLa haie taillée :\nSa hauteur varie entre 1,2 mètre et 1,8 mètre de hauteur, les plants sont distants de 30 à\n40 centimètres.\nArt. UD I2. STATIONNEMENT\n12.1 Pour toute construction nouvelle, il est exigé des aires de stationnement suivant les normes\nminimales suivantes :\nHabitat\nConstruction neuve    : 1 place par logement plus 1 place supplémentaire pour tous les\n    logements d’une superficie supérieure à 100 m² de surface de\n    plancher, plus 1 place par tranche de trois logements.\nCommerce, artisanat    : surface de plancher inférieure à 200 m² : pas de règle\n    surface de plancher supérieure à 200 m² : 1 place pour 100 m²\n    surface de plancher supérieure à 300 m² : 1 place de livraison\nBureaux    : 1 place pour 100 m² de surface de plancher\nHôtel    : 1 place pour 4 chambres\nIndustrie et dépôts    : 1 place pour 200 m² de surface de plancher\nÉquipements publics et d’intérêt collectif : le nombre de places sera déterminé en fonction de la\nsituation et de la nature de l’établissement, des possibilités de desserte en transports en commun et\ndes places offertes dans les parcs publics de stationnement.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    50","    UD\nÉquipement d’intérêt collectif caractère résidentiel (résidence étudiante, de personnes âgées, foyer\nde jeunes travailleurs…) : 1 place pour 10 chambres\n12.2 Dans le cadre de l’extension d’habitat existant, il sera demandé au pétitionnaire de se mettre\naux normes du stationnement réglementé par l’article 12.1.\n12.3 L'accès au sous-sol doit présenter un palier de pente inférieure à 5 % d'une longueur\nminimale de 5,00 mètres au débouché sur l'alignement chaque fois que c’est possible.\n12.4 Pour les logements locatifs financés avec un prêt aidé par l’État, ainsi que lors de la\nconstruction des établissements assurant l’hébergement des personnes âgées mentionnés au\n6° du I de l’article L. 312.1 du Code de l’action sociale et des familles et des résidences universitaires\nmentionnées à l’article L. 631-12 du Code de la construction et de l’habitation, il ne peut être exigé la\nréalisation de plus d’une aire de stationnement par logement.\n12.5 Pour les constructions comportant plus de deux logements, une proportion de 50 % au moins\ndes places de stationnement définies ci-dessus doit être réalisée dans le volume même des\nconstructions.\n12.6    Stationnement des deux roues et des poussettes :\nPour les constructions comportant trois logements et plus, un local à cycles par cage d’escalier doit\nêtre aménagé au rez-de-chaussée, à proximité de l’entrée principale, en évitant tout franchissement\nd’escaliers ou de portes. Il donnera dans la mesure du possible directement sur la voie publique. Tout\nlocal réservé à cet usage doit avoir une surface d’au moins 3m² et être clos et couvert. Sa superficie\nest calculée en fonction des normes suivantes :\n- Pour les logements : une superficie d’au minimum 0,75 m² pour les T1 et T2 et d’au minimum\n   1,5 m² pour tous les autres logements ;\n- Bureaux : 1,5 m² pour 100 m² de surface de plancher;\n- Commerces : 1 place pour 10 employés avec en plus, le stationnement visiteurs\n- Artisanat, industrie, hébergement hôtelier, de plus de 500 m² de de surface de plancher : 1 place\n   pour 10 employés avec en plus, le stationnement visiteurs ;\n- Équipements scolaires : primaires, collèges, lycées et universités = 1 place pour 8 à 12 élèves ;\n- Pour les constructions et installations nécessaires aux services publics ou d’intérêt collectif :\n   1 place pour 20 places de capacité de réception.\nPour les constructions comportant trois logements et plus, un local à poussettes devra également\nêtre créé, séparé du local à vélos, au niveau du rez-de-chaussée, à proximité de l’entrée principale de\nchaque cage d’escalier et avec une surface minimale de 3 m².\n12.7 Le calcul du nombre de place sera arrondi à l’unité inférieure si la première décimale est\ninférieure ou égale à 5.\n12.8 Les bâtiments neufs à usage principal d’habitation, qui comportent un parc de\nstationnement, doivent être pré-équipés afin de faciliter la mise en place ultérieure d’infrastructures\nde recharge pour les véhicules légers. Soit :\n-    alimentation en électricité du parc de stationnement, avec présence d’un tableau général basse\n    tension en aval du disjoncteur de l’immeuble. L’alimentation électrique ainsi que le tableau sont\n    dimensionnés de façon à permettre la recharge normale de véhicules pour un minimum de 10 %\n    des places, avec au minimum une place ;\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    51","    UD\n-   installation de gaines, fourreaux, chemins de câbles à partir du tableau général basse tension,\n    permettant une facturation individuelle des consommations.\n12.9 Les bâtiments de bureaux, qui comportent un parc de stationnement, doivent être équipés\nde points de charge, permettant la recharge des véhicules légers.\nL’obligation consiste en un équipement, par le propriétaire du parc, de points de charge pour la\nrecharge normale des véhicules légers, avec une alimentation en électricité d’une partie des places,\navec un minimum d’une place, à partir d’un tableau général basse tension en aval du disjoncteur de\nl’immeuble.\nArt. UD 13. ESPACES LIBRES ET PLANTATIONS\nPour les parcelles existantes à la date d’approbation du présent règlement :\nAu minimum 50 % de la surface du terrain doit être traitée en espaces verts de pleine terre avec un\narbre pour 100 m² d'espaces verts.\nPour les unités foncières créées ultérieurement à l’approbation du présent règlement, issues de\ndivision, de regroupement ou de fusion de parcelles :\nDoit être conservée sur l’unité foncière, une surface de pleine terre correspondant à 2,7 m²\nd’espaces verts de pleine terre pour 1 m² d’emprise au sol effectivement consommée en l’application\nde l’article 9.\nLes espaces verts sur dalle ou en terrasse et les toitures végétalisées ne sont pas comptabilisés dans\nle calcul des espaces verts de pleine terre.\nLes toitures végétalisées et les espaces verts sur dalle ou en terrasse doivent être accessibles pour\npermettre leur entretien et avoir une épaisseur de terre végétale d’un minimum de 0,60 mètre.\nLes espaces verts protégés et ceux faisant partie d’un ensemble remarquable identifiés au titre de\nl’article L. 123-1-5 III 2° du Code de l’urbanisme doivent être conservés sauf une impossibilité\ntechnique avérée ou sauf si leur suppression est rendue nécessaire pour la sécurité des personnes et\ndes biens. Dans le cas où un arbre serait abattu, il devra être remplacé par un arbre de même espèce\nou d’une espèce susceptible de redonner une valeur paysagère équivalente.\nPour les projets de construction liés à des équipements d’intérêt général qui par leur nature\nrequièrent des espaces libres non plantés (exemple : cours d’écoles, jardins d’enfants, parkings\npublics), le minimum d’espaces verts est ramené à 20 %.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    52","    UD\n    III- POSSIBILITÉ MAXIMALE DE L'OCCUPATION DU SOL\nArt. UD 14. COEFFICIENT D'OCCUPATION DU SOL\nSans objet.\nArt. UD 15. PERFORMANCES ÉNERGÉTIQUES ET ENVIRONNEMENTALES\nPour les espaces réservés aux stationnements, il est préconisé d’aménager des stationnements\nvégétalisés, afin de réduire les espaces imperméabilisés.\nL’orientation et la conception des constructions, visant à limiter la consommation d’énergie, sont\nconseillées, ainsi que l’utilisation de matériaux durables.\nL’installation de dispositifs de production d’énergie renouvelable pour l’approvisionnement\nénergétique des constructions (chaudière à bois, eau chaude sanitaire solaire, pompes à chaleur,\npanneaux photovoltaïques, géothermie…) est recommandée.\nArt. UD 16. RÉSEAU NUMÉRIQUE\nPour les constructions à usage d’habitation de 3 logements et plus ainsi que pour les constructions à\nusage de bureaux et d’hébergement hôtelier, devront être prévus les réseaux internes a la\nconstruction permettant le raccordement à un réseau collectif de haut débit.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    53","    UD\nModification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   54","    UE\n    ZONE UE\nIl s’agit d’une zone accueillant des équipements publics et d’intérêt collectif, scolaire, sportif et de\nsanté.\n    I - NATURE DE L'OCCUPATION ET DE L'UTILISATION DU SOL\nArt. UE 1. OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\n1.1    Les constructions à usage d’activités à caractère industriel.\n1.2    Les dépôts de ferrailles, matériaux, combustibles solides ou liquides, les entreprises de\ncassage de voitures à l'air libre et les fourrières.\n1.3    Les affouillements, exhaussements des sols et les exploitations de carrières non liés à des\ntravaux de construction.\nArt. UE 2. OCCUPATIONS ET UTILISATIONS DU SOL ADMISES SOUS CONDITIONS\n2.1    Les constructions et aménagements nécessaires aux équipements publics et d’intérêt\ncollectif sous condition d’être destinés à des activités scolaires, d’enseignement supérieur, sportives,\nculturelles et de santé et les bureaux et logements liés à ces activités ou de dépôt du service public.\n2.2    L'agrandissement ou la modification des installations classées compatibles avec le caractère\nde la zone.\n2.3    Sur les terrains comportant d’anciennes carrières et ceux soumis au risque de glissement de\nterrain, les constructions peuvent faire l'objet de recommandations particulières. Les dispositions du\nPPRMT, en annexe du PLU, doivent être respectées\n2.4    Dans les secteurs soumis aux risques d’inondation, les constructions, ouvrages et travaux\nsont soumis aux dispositions du PPRI, en annexe du PLU.\n2.5    En limite du domaine ferroviaire, l’implantation des constructions doit respecter les règles\ndes servitudes ferroviaires, en annexe du PLU.\n2.6    Dans les parties de la zone soumises au risque technologique de transports de matière\ndangereuse lié à la présence des canalisations de gaz à haute pression, dont le tracé figure dans le\nplan des servitudes d’utilité publique annexé au PLU, toute occupation ou utilisation du sol doit\nrespecter les règles visant à garantir sa sécurité publique. Les projets concernés par ce risque,\npourront être autorisés après avis et sous réserve de l’observation des prescriptions spéciales ou\nmesures conservatoires qui seraient émises par le service intéressé et le service gestionnaire de ces\nouvrages. Les ouvrages de transports devront se conformer aux dispositions en vigueur notamment\npar des mesures de protection suffisantes. Ces dispositions figurent dans une fiche d’information en\nannexe du règlement.\n2.7    Les travaux de maintenance, de modification des ouvrages électriques à haute et très haute\ntension sont autorisés pour des exigences fonctionnelles et/ou techniques.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    55","    UE\n    Il - CONDITIONS DE L'OCCUPATION DU SOL\nArt. UE 3. ACCÈS\nPour être constructible, un terrain doit avoir accès à une voie publique ou privée, ou désenclavé par\nune servitude de passage authentifiée de largeur satisfaisante.\nLes voies doivent avoir des caractéristiques adaptées à l'approche des véhicules de lutte contre\nl'incendie.\nLes voies se terminant en impasse doivent être aménagées de façon à permettre aux véhicules de\nfaire demi-tour.\nToutefois, sur les terrains déjà bâtis insuffisamment desservis, une extension de faible dimension\nd’une construction existante peut être autorisée à condition d’être située à moins de 150 mètres\nd’une bouche d’incendie.\nArt. UE 4. DESSERTE PAR LES RÉSEAUX\n4.1    Eau :\nToute construction nouvelle doit être raccordée au réseau public d'eau.\n4.2    Assainissement :\nToute construction nouvelle doit être raccordée au réseau public d’assainissement, dans la mesure\noù ce raccordement est techniquement et financièrement viable. Dans le cas contraire, une\ndérogation pour la mise en place d’un assainissement autonome pourrait être accordée.\nToute nouvelle construction ou extension devra respecter les prescriptions des règlements\nd’assainissement en vigueur, notamment en matière de gestion des eaux pluviales.\n(chapitre 4 du règlement d’assainissement de la ville de Saint-Cloud).\nTout raccordement doit être conforme au règlement du service de l’assainissement de la ville de\nSaint-Cloud approuvé par le Conseil communautaire de la Communauté d’agglomération\nCœur-de-Seine du 14 octobre 2014. Ce règlement précise qu’en cas de raccordement au réseau\ndépartemental d’assainissement, la gestion des eaux pluviales à la parcelle, sans raccordement au\nréseau public doit être la première solution recherchée.\nToutefois, lorsque la gestion totale de ces eaux à la parcelle n’est pas possible, le propriétaire peut\nsolliciter l’autorisation de raccorder ses eaux de ruissellement au réseau pluvial ou unitaire à la\ncondition que ses installations soient conformes aux prescriptions techniques définies dans le\nchapitre 4 du règlement d’assainissement de la ville de Saint-Cloud. Dans ce cas, seul l’excès de\nruissellement peut être canalisé après qu’aient été mises en œuvre toutes les solutions susceptibles\nde favoriser la gestion à la parcelle, telles que l’infiltration, la réutilisation des eaux claires, le\nstockage, ainsi que les rejets au milieu naturel.\nL’excédent d’eaux de ruissellement n’ayant pu être géré à la parcelle est soumis à des limitations de\ndébit de rejet afin de limiter à l’aval les risques d’inondation ou de déversement d’eaux polluées au\nmilieu naturel. Le débit de fuite pour une pluie de retour décennal ne doit pas excéder :\n-    2L/s/ha dans le cas d’un rejet dans le réseau unitaire ;\n-    10L/s/ha dans le cas d’un rejet dans un réseau d’eaux pluviales, sauf dispositions locales\n    particulières (notamment en raison d’insuffisance hydraulique locale, ou exutoire aval constitué\n    d’un réseau unitaire).\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   56","    UE\nDans tous les cas, l’acceptation du raccordement des eaux pluviales de toute nouvelle construction\nsera subordonnée à la capacité d’évacuation du réseau existant. Le constructeur ou l’aménageur doit\njustifier, par la production à l’exploitant de notes de calcul appropriés, le dimensionnement suffisant\ndes installations de rétention qu’il installe en amont du raccordement.\nTout rejet d’eaux usées autres que domestiques dans les réseaux publics d’assainissement doit être\npréalablement autorisé soit par arrêté d’autorisation de déversement signé par le maître d’ouvrage\ndu réseau concerné, complété éventuellement par une convention spéciale de déversement, soit par\nune convention de rejet d’eaux usées non domestiques assimilables à des eaux usées domestiques.\nElles ne pourront être rejetées à l’égout que dans les conditions définies au chapitre 3 du règlement\nd’assainissement de la ville de Saint-Cloud.\nLes rejets d’eaux claires permanentes telles qu’eaux de pompage de nappe, eaux d’exhaure, eaux de\npompe à chaleur ou similaires sont interdits dans les réseaux d’assainissement unitaires ou d’eaux\nusées. Dans le cas d’activités produisant provisoirement des eaux d’exhaure, en l’absence de solution\nalternative et sous réserve d’une capacité suffisante du réseau, une autorisation dérogatoire peut\nêtre accordée, en référence au règlement du service de l’assainissement de la ville de Saint-Cloud\n(art. 22.2). Une convention temporaire de rejet pour ces eaux doit alors être cosignée par le\ndemandeur et les collectivités concernées.\n4.3    Électricité et téléphone :\nLes réseaux électriques et téléphoniques doivent être enterrés sur le terrain. Les armoires\nélectriques doivent être implantées à l’intérieur du terrain de la construction.\nLes coffrets de toute nature devront être incorporés à la clôture de la propriété. Ils ne peuvent en\naucun cas déborder sur le domaine public.\n4.4    Tri sélectif :\nToute construction nouvelle doit prévoir des locaux poubelles correctement dimensionnés pour\naccueillir l’ensemble des bacs de la collecte sélective, conformément au Plan Régional d’élimination\ndes déchets ménagers et assimilés (PREDMA) approuvé le 26 novembre 2009.\nArt. UE 5. CARACTÉRISTIQUES DES TERRAINS\nSans objet.\nArt. UE 6. IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX VOIES ET EMPRISES\nPUBLIQUES\n6.1    Si aucun reculement ne figure au plan, les constructions doivent être implantées à\nl’alignement ou en recul de 6 mètres minimum de la limite d’emprise des voies et emprises\npubliques.\n6.2    Si un reculement ou une zone non aedificandi figurent au plan, les constructions doivent être\nimplantées à 6 mètres minimum de la limite d’emprise projetée de la voie ou emprise, ou de la zone\nnon aedificandi.\n6.3   A l’intérieur de la marge de reculement les saillies sur reculement pourront être autorisées à\nune hauteur supérieure à 5,5 mètres comptée à partir du sol. La pose de matériaux d’isolation\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    57","    UE\nextérieure des façades est également autorisée dans la marge de reculement avec une épaisseur\nmaximale de 20 centimètres.\n6.4    Les terrains situés à l'angle de deux voies ouvertes à la circulation automobile publique\ndoivent supporter un pan coupé d'une longueur minimale de 7 mètres à angles égaux.\n6.5    Dans les marges de reculement, l’aménagement d’aires de jeux, de sports et de loisirs ne\ncomportant aucun bâtiment ainsi que les rampes d’accès et les locaux de stockage de déchets traités\npar des aménagements architecturaux ou paysagés sont autorisés.\n6.6    Construction existante à la date d’application du règlement issu de la présente modification :\nl’extension de bâtiments existants ne respectant pas la marge de reculement peut être autorisée\ndans le prolongement de la leurs façades existante.\nArt. UE 7. IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX LIMITES SÉPARATIVES\n7.1    Constructions nouvelles\n7.1.1 Dans une bande de 25 mètres comptée à partir de la limite d’emprise de la voie, existante ou\nfuture, de la marge de reculement ou de la zone non aedificandi imposée (cf art. UC 6), les\nconstructions ne sont autorisées qu’en retrait des limites séparatives conformément à l’article 7.1.3.\n7.1.2 Constructions au-delà de la bande de 25 mètres\nAu-delà de la bande de 25 mètres ci-dessus définie, les constructions doivent respecter les règles\ndéfinies au 7.1.3. Elles ne peuvent être implantées en limite séparative que dans les cas suivants :\n- si elles s’adossent à une construction en bon état et de dimensions égales ou supérieures existant\nsur le terrain voisin et qu’elles s’insèrent dans les héberges existantes ;\n- ou si leur hauteur maximum ne dépasse pas 2,60 mètres et qu’elles ne soient pas affectées à\nl’habitation ni à une activité industrielle, artisanale ou de bureau.\n7.1.3 Implantations en retrait\nA) Dispositions relatives à l’implantation d’éléments de façade comportant une ou plusieurs baies\nd’une surface supérieure à 0,25 m², à l’exclusion des baies de type zénithal.\nLa distance D, comptée horizontalement, à partir de l’élément de façade jusqu’à la limite séparative\nlui faisant face doit être supérieure ou égale à la hauteur de cet élément de façade par rapport au\nterrain naturel avant travaux, sans pouvoir être inférieure à 8 mètres :\n    DH8m\nB) Dispositions relatives à l’implantation d’éléments de façade dépourvus de baies d’une surface\nsupérieure à 0,25 m². Lorsque les baies sont accolées, la surface totale des baies est prise en compte\npour le calcul de leur surface.\nLa distance de chaque élément des façades aveugles ou ne comportant que des jours de souffrance\nou des baies d’une surface inférieure à 0,25 m², comptée horizontalement jusqu’à la limite\nséparative lui faisant face doit être au moins égale à la moitié de la hauteur de cet élément de façade\npar rapport au terrain naturel avant travaux sans pouvoir être inférieure à 4 mètres :\n    DH4m\n    2\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    58","    UE\n7.2    Agrandissement de l'existant.\nLes agrandissements de faible importance ayant pour but l’amélioration du bâtiment (ascenseurs,\nsanitaires, mises aux normes de confort, locaux déchets ménagers, vélos, etc ...) pourront être\nautorisés sans respecter les règles précitées.\nArt. UE 8. IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT AUX AUTRES SUR\nUNE MÊME PROPRIÉTÉ\nIl n’est pas fixé de règle.\nArt. UE 9. EMPRISE AU SOL\nPour les constructions nouvelles, l'emprise au sol des bâtiments ne peut excéder 40 % de la surface\ndu terrain.\nLes agrandissements de faible importance ayant pour but l’amélioration du bâtiment (ascenseurs,\nsanitaires, mise aux normes de confort, locaux déchets ménagers, vélos, etc...) pourront être\nautorisés sans qu’il soit fait appel à la règle précitée.\nArt. UE 10. HAUTEUR MAXIMUM DES CONSTRUCTIONS\n10.1    Les constructions devront pouvoir s’inscrire dans le volume déterminé par les plans suivants :\na) Les plans verticaux déterminés par les limites parcellaires du terrain ;\nb) Le plan incliné à 45° passant par, le point situé à 6 mètres de hauteur au droit de la limite opposée\nexistante ou future, de l’emprise de la voie publique ou privée ouverte à la circulation automobile et\nadjacente au terrain :\n    HL+6\nc) Les plans parallèles au terrain naturel à une hauteur de 18 mètres au point le plus haut, le nombre\nde niveaux étant limité à 6 ;\n10.2    Dispositions particulières\na) Le plan incliné à 45° sur l’horizontale généré par la ligne parallèle aux limites séparatives du terrain\ncontigüe à une zone UD, placée à une hauteur de 9 mètres par rapport au terrain naturel avant\ntravaux ;\nb) À l’angle des îlots limités par des voies d’inégales largeurs, la hauteur des constructions édifiées en\nbordure de la voie la moins large pourra être identique à celle autorisée en bordure de la voie la plus\nlarge, sur une longueur de 20 mètres à partir du point d’intersection avec le pan coupé.\nc) La pose d’éléments tels que antennes, climatiseurs, cheminées ou tourelles d’extraction est\nautorisée au-delà de cette hauteur sous réserve de ne pas excéder la hauteur des installations déjà\nexistantes.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    59","    UE\nArt. UE 11. ASPECT EXTÉRIEUR\n« Le permis de construire ou déclaration préalable de travaux peut être refusé(e) ou n’être\naccordé(e) que sous réserve de l’observation de prescriptions spéciales si les constructions, par leur\nsituation, leur architecture, leurs dimensions ou l’aspect extérieur des bâtiments ou ouvrages à\nédifier ou à modifier, sont de nature à porter atteinte au caractère ou à l’intérêt des lieux\navoisinants, aux sites, aux paysages naturels ou urbains, ainsi qu’à la conservation des perspectives\nmonumentales.»\n11.1    Constructions neuves\nAucun « style » spécifique n’est imposé. Devront être évitées les architectures simplistes,\nminimalistes ou trop géométriques. La composition et la volumétrie devront être particulièrement\nsoignées.\nToutefois sont vivement déconseillés les pastiches de styles ou modes de construction\nanachroniques (colonnes, pilastres, frontons, etc.) ou régionalistes.\nEn règle générale, les projets pourront être le reflet de tendances contemporaines, tout en\ns’inspirant de l’histoire et de la géographie de Saint-Cloud et du contexte environnant.\nLes façades devront être travaillées et devront être le reflet des fonctions du bâtiment\n(soubassement, étages, attique, etc.). Des rythmes horizontaux et verticaux devront marquer les\ndifférentes hiérarchies et fonctions.\nToutes les façades devront être traitées avec le même soin et une qualité de composition\néquivalente, qu’il s’agisse de façades principales ou secondaires (y compris les pignons aveugles), ou\ndes bâtiments annexes.\nLes matériaux et détails d’exécution devront assurer la pérennité des bâtiments.\nStructure :\nSont autorisés les matériaux type pierre, brique, meulière, béton, métal, bois, verre, etc… ;\nSont interdits les matériaux légers type « onduline » ou les matériaux de remplissage non enduits.\nMenuiseries, occultations, clôtures\nSont autorisés l’acier, l’aluminium, le bois ;\n11.2    Extensions - surélévations\nLes extensions ou surélévations doivent respecter la volumétrie, les matériaux, les rythmes et les\nmodénatures de l’existant, avec la même qualité de détails, d’autant plus s’il s’agit d’un bâtiment ou\nensemble remarquable identifié au titre de l’article L. 123-1-5 III 2° du Code de l’urbanisme\nDans le cas du choix d’une facture contemporaine pour l’extension ou la surélévation, les volumes\ndoivent s’inscrire harmonieusement avec le bâti existant. Les volumes géométriques simplistes sont\nproscrits.\nDans le cas d’une extension ou surélévation représentant plus de 30 % du volume existant, une\nrecomposition générale pourra être envisagée, mais avec la même qualité que l’existant.\n11.3    Clôtures\nLes clôtures sur voies devront être constituées d’un mur-bahut maçonné, d’une hauteur maximale de\n0,80 mètre par rapport au terrain naturel avant travaux, dans lequel devront être insérés les coffrets\ntechniques (ERDF, GRDF,…). Ce mur-bahut devra être surmonté d’une partie à claire-voie\n(pourcentage de vides de 80 %, minimum par rapport aux pleins).\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    60","    UE\nLes clôtures sur voie devront être doublées de haies végétales.\nLa hauteur maximum des clôtures est limitée à 2,10 mètres, sauf contexte spécifique (mur de\nsoutènement ou mur existant remarquable). Cette règle s’applique également dans les cas de\nmodification ou de réfection.\nDes exceptions à ces règles peuvent être autorisées en cas de constructions ou installations\nnécessaires aux services publics ou d’intérêt collectif, lorsque des raisons techniques ou de sécurité\nl’imposent.\nMatériaux :\nSelon le contexte du paysage de la rue, peuvent être utilisés les matériaux de type pierre, brique,\nmétal, bois ou blocs de béton enduits.\nSont interdits :\nLes matériaux de remplissages utilisés à nu, non enduits ;\nLes canisses en plastique ;\nLes grillages simples avec matériaux opacifiants rapportés.\nCouleurs :\nPierre et brique sont utilisés bruts, non peints.\nMétal ou bois, une seule couleur de préférence, deux au maximum.\nVégétation : des haies peuvent tenir lieu de clôture.\nLes haies devront être constituées d’espèces mélangées.\nLes essences devront être choisies en fonction de l’orientation et de la composition du sol.\nLa haie taillée :\nSa hauteur varie entre 1,2 mètre et 1,8 mètre de hauteur. Les plants sont distants de 30 à\n40 centimètres.\nArt. UE 12. STATIONNEMENT\n12.1 Pour toute construction nouvelle, il est exigé des aires de stationnement suivant les normes\nminimales suivantes :\nHabitat\nConstruction neuve    : 1 place par logement plus 1 place supplémentaire pour tous les\n    logements d’une superficie supérieure à 100 m² de surface de\n    plancher, plus 1 place par tranche de trois logements.\nÉquipements publics et d’intérêt collectif : le nombre de places sera déterminé en fonction de la\nsituation et de la nature de l’établissement, des possibilités de desserte en transports en commun et\ndes places offertes dans les parcs publics de stationnement.\nÉquipement d’intérêt collectif caractère résidentiel (résidence étudiante, de personnes âgées, foyer\nde jeunes travailleurs…) : 1 place pour 10 chambres\n12.2 Dans le cadre de l’extension d’habitat existant, il sera demandé au pétitionnaire de se mettre\naux normes du stationnement réglementé par l’article 12.1.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    61","    UE\n12.3 L'accès au sous-sol doit présenter un palier de pente inférieure à 5 % d'une longueur\nminimale de 5 mètres au débouché sur l'alignement chaque fois que c’est possible.\n12.4 Pour les constructions comportant plus de deux logements, une proportion de 50 % au moins\ndes surfaces totales de stationnement définies ci-dessus doit être réalisée dans le volume même des\nconstructions.\n12.5    Stationnement des deux roues et des poussettes :\nPour les constructions comportant trois logements et plus, un local à cycles par cage d’escalier doit\nêtre aménagé au rez-de-chaussée, à proximité de l’entrée principale, en évitant tout franchissement\nd’escaliers ou de portes. Il donnera dans la mesure du possible directement sur la voie publique. Tout\nlocal réservé à cet usage doit avoir une surface d’au moins 3 m² et être clos et couvert. Sa superficie\nest calculée en fonction des normes suivantes :\n    - Pour les logements : une superficie d’au minimum 0,75 m² pour les T1 et T2 et d’au minimum\n    1,5 m² pour tous les autres logements ;\n    - Équipements scolaires : primaires, collèges, lycées et universités = 1 place pour 8 à\n    12 élèves ;\n    - Pour les constructions et installations nécessaires aux services publics ou d’intérêt collectif :\n    1 place pour 20 places de capacité de réception.\nPour les constructions comportant trois logements et plus, un local à poussettes devra également\nêtre créé, séparé du local à vélos, au niveau du rez-de-chaussée et avec une surface minimale de\n3 m².\n12.6 Le calcul du nombre de place sera arrondi à l’unité inférieure si la première décimale est\ninférieure ou égale à 5.\n12.7 Les bâtiments neufs à usage principal d’habitation, qui comportent un parc de\nstationnement, doivent être pré-équipés afin de faciliter la mise en place ultérieure d’infrastructures\nde recharge pour les véhicules légers. Soit :\n    - alimentation en électricité du parc de stationnement, avec présence d’un tableau général\n    basse tension en aval du disjoncteur de l’immeuble. L’alimentation électrique ainsi que le\n    tableau sont dimensionnés de façon à permettre la recharge normale de véhicules pour un\n    minimum de 10 % des places, avec au minimum une place ;\n    - installation de gaines, fourreaux, chemins de câbles à partir du tableau général basse tension,\n    permettant une facturation individuelle des consommations.\nArt. UE 13. ESPACES LIBRES ET PLANTATIONS\nAu moins 20 % de la surface du terrain doivent être traités en espaces verts de pleine de terre avec\nau minimum 1 arbre pour 100 m² d'espaces verts.\nLes espaces verts sur dalle ou en terrasse et les toitures végétalisées sont comptabilisés pour 50 % de\nleur surface dans le calcul des espaces verts, ne pouvant pas dépasser 20 % de la surface totale\nrequise.\nLes toitures végétalisées et les espaces verts sur dalle ou en terrasse doivent être accessibles pour\npermettre leur entretien et avoir une épaisseur de terre végétale d’un minimum de 0,60 mètre.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    62","    UE\nLes espaces verts protégés et ceux faisant partie d’un ensemble remarquable identifiés au titre de\nl’article L. 123-1-5 III 2° du Code de l’urbanisme doivent être conservés sauf une impossibilité\ntechnique avérée ou sauf si leur suppression est rendue nécessaire pour la sécurité des personnes et\ndes biens. Dans le cas où un arbre serait abattu, il devra être remplacé par un arbre de même espèce\nou d’une espèce susceptible de redonner une valeur paysagère équivalente.\n    III - POSSIBILITÉ MAXIMALE D'OCCUPATION DU SOL\nArt. UE 14. COEFFICIENT D 'OCCUPATION DU SOL.\nSans objet.\nArt. UE 15. PERFORMANCES ÉNERGÉTIQUES ET ENVIRONNEMENTALES\nPour les espaces réservés aux stationnements, il est préconisé d’aménager des stationnements\nvégétalisés, afin de réduire les espaces imperméabilisés.\nL’orientation et la conception des constructions, visant à limiter la consommation d’énergie, sont\nconseillées, ainsi que l’utilisation de matériaux durables.\nL’installation de dispositifs de production d’énergie renouvelable pour l’approvisionnement\nénergétique des constructions (chaudière à bois, eau chaude sanitaire solaire, pompes à chaleur,\npanneaux photovoltaïques, géothermie…) est recommandée.\nArt. UE 16. RÉSEAU NUMÉRIQUE\nPour les constructions à usage d’habitation de 3 logements et plus, ainsi que pour les constructions à\nusage de bureaux et d’hébergement hôtelier, devront être prévus les réseaux internes à la\nconstruction permettant le raccordement à un réseau collectif de haut débit.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    63","    UE\nModification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville   64","    UF\n    ZONE UF\nC’est une zone à vocation plurifonctionnelle accueillant principalement des activités à caractère\nindustriel compatibles avec l’environnement urbain mais aussi des activités à caractère tertiaire\nartisanal, commercial ou de service ainsi que des équipements publics.\n    I - NATURE DE L'OCCUPATION ET DE L'UTILISATION DU SOL\nArt. UF 1. OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\n1.1    Les dépôts de ferrailles, matériaux, combustibles solides ou liquides, les entreprises de\ncassage de voitures à l'air libre et les fourrières.\n1.2    Le camping.\n1.3    Les affouillements, exhaussements des sols et les exploitations de carrières non liés à des\ntravaux de construction\n1.4    Les logements à l’exception de ceux qui remplissent les conditions fixées à l’article 2.5.\nArt. UF 2. OCCUPATIONS ET UTILISATIONS DU SOL ADMISES SOUS CONDITIONS\n2.1    L'implantation, l'agrandissement ou la modification de l'existant des installations classées\ncompatibles avec le caractère de la zone\n2.2    Sur les terrains comportant d’anciennes carrières et ceux soumis au risque de glissement de\nterrain, les constructions peuvent faire l'objet de recommandations particulières. Les dispositions du\nPPRMT, en annexe du PLU, doivent être respectées.\n2.3    Dans les secteurs soumis aux risques d’inondation, les constructions, ouvrages et travaux\nsont soumis aux dispositions du PPRI, en annexe du PLU.\n2.4    En limite du domaine ferroviaire, l’implantation des constructions doit respecter les règles\ndes servitudes ferroviaires, en annexe du PLU.\n2.5    Les logements à condition qu’ils soient liés et nécessaires à l’entretien ou au gardiennage de\nconstructions à usage d’activité économique : logements de fonction, logement de gardien…\n2.6    Dans les parties de la zone soumises au risque technologique de transports de matière\ndangereuse lié à la présence des canalisations de gaz à haute pression, dont le tracé figure dans le\nplan des servitudes d’utilité publique annexé au PLU, toute occupation ou utilisation du sol doit\nrespecter les règles visant à garantir sa sécurité publique. Les projets concernés par ce risque,\npourront être autorisés après avis et sous réserve de l’observation des prescriptions spéciales ou\nmesures conservatoires qui seraient émises par le service intéressé et le service gestionnaire de ces\nouvrages. Les ouvrages de transports devront se conformer aux dispositions en vigueur notamment\npar des mesures de protection suffisantes. Ces dispositions figurent dans une fiche d’information en\nannexe du règlement.\n    Modification n° 1 du PLU de Saint-Cloud – Règlement– Dossier approbation – Espace Ville    65","    UF\n2.7    Les travaux de maintenance, de modification des ouvrages électriques à haute et très haute\ntension sont autorisés pour des exigences fonctionnelles et/ou techniques.\n2.8   Est interdit le changement de destination des bureaux pour les affecter à usage de\nlogements.\n2.9    Le long des linéaires d’axes commerciaux mentionnés au document graphique au titre de\nl’article L. 123-1-5 II 5° du Code de l’urbanisme, est interdite la transformation en logements, de\nlocaux existants, à la date d’application du présent règlement, situés en rez-de-chaussée et destinés\nà l’accueil d’activités commerciales.\n    Il - CONDITIONS DE L'OCCUPATION DU SOL\nArt. UF 3. ACCÈS\nPour être constructible, un terrain doit avoir accès à une voie publique ou privée, ou désenclavé\npar une servitude de passage authentifiée de largeur satisfaisante.\nLes voies doivent avoir des caractéristiques adaptées à l'approche des véhicules de lutte contre\nl'incendie.\nLes voies se terminant en impasse doivent être aménagées de façon à permettre aux véhicules de\nfaire demi-tour.\nLa largeur minimale d’un chemin d’accès sur toute sa longueur doit être de 6 mètres.\nArt. UF 4. DESSERTE PAR LES RÉSEAUX\n4.1    Eau :\nToute construction nouvelle doit être raccordée au réseau public d'eau.\n4.2    Assainissement :\nToute construction nouvelle doit être raccordée au réseau public d’assainissement, dans la mesure\noù ce raccordement est techniquement et financièrement viable. Dans le cas contraire, une\ndérogation pour la mise en place d’un assainissement autonome pourrait être accordée.\nToute nouvelle construction ou extension devra respecter les prescriptions des règlements\nd’assainissement en vigueur, notamment en matière de gestion des eaux pluviales.\n(chapitre 4 du règlement d’assainissement de la ville de Saint-Cloud).\nTout raccordement doit être conforme au règlement du service de l’assainissement de la ville de\nSaint-Cloud approuvé par le Conseil communautaire de la Communauté d’agglomération\nCœur-de-Seine du 14 octobre 2014. Ce règlement précise qu’en cas de raccordement au réseau\ndépartemental d’assainissement, la gestion des eaux pluviales à la parcelle, sans raccordement au\nréseau public doit être la première solution recherchée.\nToutefois, lorsque la gestion totale de ces eaux à la parcelle n’est pas possible, le propriétaire peut\nsolliciter l’autorisation de raccorder ses eaux de ruissellement au réseau pluvial ou
