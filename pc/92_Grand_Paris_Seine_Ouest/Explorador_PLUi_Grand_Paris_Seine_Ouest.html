x sur\n    des constructions existantes.\n    En cas de démolition partielle puis de construction et/ou d’extension, la règle de stationnement s’applique à\n    la surface de plancher supplémentaire générée par rapport à la construction initiale.\n    Toutefois, aucune place de stationnement supplémentaire n’est exigée pour :\n    ▪    Les extensions horizontales sans création de logement pour les constructions à sous-destination de\n    logement. Dans le cas contraire, la règle pour les constructions nouvelles s’applique mais\n    uniquement sur les extensions,\n    ▪    Les extensions horizontales qui créent moins de 50 m² de surface de plancher pour les destinations\n    de construction autre que le logement, dans la limite d’une seule extension d’une même construction,\n    à compter de la date d’approbation du PLUi. Dans le cas contraire, la règle pour les constructions\n    nouvelles s’applique mais uniquement sur la surface de plancher supplémentaire générée par les\n    extensions,\n    ▪    Les divisions de logements existants à la date d’approbation du PLUi,\n    ▪    Les extensions verticales, les rénovations, les restaurations , les réhabilitations, les reconstructions\n    à l’identique\n    ▪    Les changements de destination.\n    Dans le cas de travaux sur des constructions existantes, le nombre de places existantes de stationnement\n    qui répond à une exigence équivalente à celle des constructions à édifier doit être maintenu, dans le respect\n    de la règle de stationnement.\n    8.1.6.    Mode de calcul des places de stationnement\n256   Pour le calcul du nombre de places exigé, il convient d’arrondir le total au nombre entier supérieur dès que\n    la décimale est supérieure ou égale à 5, et au nombre entier inférieur dès que la décimale est inférieure à 5.\n    Pour les constructions à sous-destination de bureaux, d’hôtels et de locaux et bureaux accueillant du public\n    des administrations publiques et assimilés, le nombre de places de stationnement maximum constitue un\n    plafond à ne pas dépasser.\n    Dans le cas où la construction comporte plusieurs destinations ou sous-destinations, elle doit satisfaire aux\n    règles fixées pour chacune de ces destinations ou sous-destinations. Il est toutefois possible de procéder à\n    un foisonnement de certaines places mutualisées entre différentes destinations ou sous-destinations au sein\n    d’une même opération, selon les modalités définies dans le chapitre dédié.\n    Lorsque la règle définie des tranches de surface, les places générées par chacune des tranches entamées\n    se cumulent.\n    Concernant les sous-destinations pour lesquelles le calcul de l’offre de stationnement ne fait pas l’objet d’une\n    règle chiffrée, le nombre de places à créer doit correspondre aux besoins estimés en prenant en compte le\n    niveau de desserte en transports collectifs du terrain, le nombre de stationnement vélo créé sur le terrain, le\n    type de public accueilli, le nombre de personnes fréquentant les constructions de manière permanente\n    (personnes hébergées, personnes travaillant dans les locaux…) et occasionnelle (visiteurs, livreurs, clients,\n    etc.), ainsi que les espaces de stationnement nécessaires aux véhicules de service.\n    La règle la plus contraignante doit être systématiquement retenue.\n    8.1.7.    Mutualisation et foisonnement du stationnement\n    Dans le cadre d’opérations d’aménagement d’ensemble ou de programmes mixtes comportant plusieurs\n    constructions et/ou plusieurs destinations ou sous-destinations, la réalisation des places de stationnement\n    peut être mutualisée au sein d’une ou plusieurs aires de stationnement communes.\n    Dans le cadre de ces opérations, le nombre d’emplacements à réaliser peut faire l’objet d’un foisonnement\n    en cas de programmes mixtes comportant :\n    ▪    logements et bureaux\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    8. Stationnement\n    ▪    logements et commerce et activité de service,\n    ▪    logements et équipement d’intérêt collectif et services publics,\n    ▪    bureaux et les sous-destinations salles d’art et de spectacle, équipements sportifs, lieux de culte et\n    autres équipements recevant du public.\nCe foisonnement des places ne doit pas dépasser 30% de la somme du nombre de places exigées par\ndestinations. Le nombre de places de stationnement à réaliser est au moins égal à celui résultant de\nl’application de la norme la plus exigeante parmi les différentes destinations/sous-destinations des\nconstructions.\nLa réduction du minimum exigé permise par la mutualisation et le foisonnement du stationnement n’est pas\ncumulative avec la réduction du minimum exigé permise par l’autopartage ni avec la règle alternative pour\nfavoriser la qualité des immeubles d’habitation de plus de 2 logements.\nPour une opération comportant des bureaux, la mutualisation des places entre les différentes destinations\nou sous-destinations est possible, mais elle n’entraîne aucune conséquence sur les obligations en termes\nd’emplacements de stationnement à réaliser. En effet, la norme plancher pour les opérations de bureaux\nn’est pas réglementée. Le pétitionnaire peut donc, s’il le souhaite, ne proposer aucune place pour les\nbureaux. La seule obligation concerne donc le nombre de places minimum pour les autres destinations ou\nsous-destinations. L’intégration de la mutualisation ne conduit pas à une modification de cette obligation.\n8.1.8.    Autopartage\nLa règle d’autopartage dépend du nombre minimum de places à créer, avant les éventuelles réductions\npermises par le présent chapitre.\nPour toutes les opérations, la norme minimale exigée pour les places de stationnement automobile peut être\nréduite de 15% maximum en contrepartie de la réservation d’un espace aménagé en vue de la mise à\ndisposition de véhicules propres en autopartage.\nLa réduction du minimum exigé permise par l’autopartage n’est pas cumulative avec la réduction du minimum\n    257\nexigé permise par la mutualisation et le foisonnement du stationnement ni avec la règle alternative pour\nfavoriser la qualité des immeubles d’habitation de plus de 2 logements.\nLes places de stationnement réservées à ces véhicules entrent dans le calcul du nombre maximal de places\nautorisé.\nLes espaces de stationnement dédiés à l’autopartage doivent être réalisés sur le terrain d’assiette de la\nconstruction ou dans son environnement immédiat. Ils seront localisés à proximité du point d’accès depuis\nl’espace public, permettant l’utilisation par des personnes extérieures à l’opération (le cas échéant).\nChaque place dédiée à l’autopartage sera équipée d’une borne de recharge des véhicules électriques ou\nhybrides rechargeables.\n8.1.9.    Règles pour la création d’aires de stationnement pour deux-roues\n    motorisés\nLes nouvelles constructions qui font l’objet de l’obligation de créer un espace de stationnement automobile\nprévoient aussi des places de stationnement pour les deux-roues motorisés.\nCette disposition s’applique pour les nouvelles constructions selon les modalités suivantes :\n    ▪    Logement à partir de 5 logements : 0,5% de la sdp, avec au minimum une aire de 4 m²\n    ▪    Commerce et activités de service à partir de 400 m² de SDP : 0,1 % de la sdp, avec au minimum\n    une aire de 4 m²\n    ▪    Équipements d’intérêt collectif et services publics à partir de 400 m² de SDP : selon les besoins\n    estimés.\n    ▪    Autres activités des secteurs primaire, secondaire ou tertiaire (hors bureaux) : 0,1% de la sdp, avec\n    au minimum une aire de 4 m²\n    ▪    Cuisine dédiée à la vente en ligne : 10% de la sdp, avec au minimum une aire de 4 m².\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    8. Stationnement\n    ▪   Autres destinations et sous-destinations : selon les besoins estimés.\n    8.1.10.    Règles pour la création d’aires de livraison\n    Les nouvelles constructions prévoient sur leur terrain des aires de livraison conformes aux prescriptions\n    définies ci-après. Si elles ne sont pas réalisables de plain-pied, les aires de livraison peuvent être aménagées\n    dans des parcs de stationnement en sous-sol.\n    Dans les sous-secteurs U1-H-1 et U1-F-2, les aires de livraison peuvent être aménagées sur l’espace\n    public, sous réserve de l’accord du gestionnaire de voirie.\n    Les aires de livraison, ainsi que leurs accès, doivent présenter des caractéristiques adaptées aux besoins.\n    Les pétitionnaires justifieront la taille de l’aire nécessaire au vu de l’activité.\n    Des places d’arrêt-minute sont créées sur le terrain de l’opération, selon les besoins estimés, si les places\n    existantes sur l’espace public au droit de l’opération ne répondent pas à ces besoins. Le cas échéant, ces\n    places peuvent être mutualisées avec les aires de livraison.\n    Les normes de création d’aires de livraison pour les constructions nouvelles, pour chaque destination et\n    sous-destination, sont présentées dans le tableau ci-dessous.\n    Les destinations et sous-destinations non visées dans le tableau ne font l’objet d’aucune obligation pour les\n    aires de livraison.\n258\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    8. Stationnement\n   Sous-destination    Normes\nArtisanat et commerce\nde détail\n    Lorsqu’il est construit sur un terrain une surface de plancher relevant d’une ou\n    plusieurs de ces sous-destinations et dépassant 400 m², et les différents décrets afférents.\n    8.2.3.    Règles pour la création d’aires de stationnement pour les vélos\n    Constructions à édifier\n    La règle de stationnement est différenciée selon la sous-destination des constructions. Elle s’applique aux\n    nouvelles constructions à édifier.\n    Lorsque plusieurs règles s’appliquent sur une même construction, elles sont cumulatives.\n260   Lorsqu’une construction à destination d’équipement d’intérêt collectif et services publics n’accueille aucun\n    salarié à demeure (locaux techniques par exemple), le besoin de stationnement est considéré comme nul.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    8. Stationnement\n    Tous les secteurs (S1, S2, S3 et S4)\n    Sous-destination\n    Minimum exigé (norme plancher)\n    T1-T2 : 1 place par logement\nLogement (à partir de 2    T3-T4-T5 et plus 2 places par logement\nlogements)\n    L’espace ne peut avoir une superficie inférieure 5 m² au total\nHébergement    1 place par unité\n    Jusqu'à 400 m² : 1 place pour 10 employés, des places pour les visiteurs et, si\n    réalisation d'un parc de stationnement pour les voitures, une surface au moins\n    équivalente à 10 % de la capacité de ce parc\nArtisanat et commerce de\n    Au-delà de 400 m² : 1 place par tranche de 100 m² sans être inférieur à 1\ndétail\n    place pour 10 employés, des places pour les visiteurs et, si réalisation d'un\n    parc de stationnement pour les voitures, une surface au moins équivalente à\n    10 % de la capacité de ce parc\n    Jusqu'à 400 m² : non réglementé\nRestauration\n    Au-delà de 400 m² : 1 place par tranche de 100 m²\nCommerce de gros    Selon les besoins estimés\nActivités de services où\n    Jusqu'à 400 m² : non réglementé\ns’effectue l’accueil d’une\n    Au-delà de 400 m2 : 1 place par tranche de onstructions existantes\n    Les normes de stationnement pour les constructions nouvelles s’appliquent aussi dans le cas de travaux sur\n    des constructions existantes.\n    En cas de démolition partielle puis de construction et/ou d’extension, la règle de stationnement s’applique à\n    la surface de plancher supplémentaire générée par rapport à la construction initiale.\n    Toutefois, aucune place de stationnement supplémentaire n’est exigée pour:\n    ▪   Les extensions horizontales sans création de logement pour les constructions à sous-destination de\n    logement. Dans le cas contraire, la règle pour les constructions nouvelles s’applique mais\n    uniquement pour la surface de plancher générée par les extensions,\n    ▪   Les extensions horizontales qui créent moins de 50 m² de surface de plancher pour les destinations\n    de construction autre que le logement, dans la limite d’une seule extension d’une même construction,\n    à compter de la date d’approbation du PLUi. Dans le cas contraire, la règle pour les constructions\n    nouvelles s’applique mais uniquement pour la surface de plancher générée par les extensions,\n    ▪   Les divisions de logements existants à la date d’approbation du PLUi,\n    ▪   Les extensions verticales, les rénovations, les restaurations, les réhabilitations, les reconstructions\n    à l’identique,\n    ▪   Les changements de destination.\n    Dans le cas de travaux sur des constructions existantes, le nombre de places existantes de stationnement\n    qui répond à une exigence équivalente à celle des constructions à édifier doit être maintenu, dans le respect\n    de la règle de stationnement.\n262\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    9. Équipements et\n    réseaux\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\nModification simplifiée n°1 du 25 juin 2025","    9 Equipements et réseaux\n    9.1. Gestion des eaux\n    9.1.1.    Gestion des eaux pluviales\n    Définition des eaux pluviales\n    Les eaux pluviales sont celles qui proviennent des précipitations atmosphériques. Les eaux de ruissellement\n    sont les eaux pluviales qui s’écoulent à la surface des sols ou des bâtiments.\n    Sont assimilées à ces eaux pluviales celles provenant des eaux de lavage des voies publiques et privées,\n    parkings de surface et des cours d’immeuble et d’arrosage des jardins.\n    Dans certains cas, les eaux pluviales et assimilées, en fonction de leur charge polluante, peuvent être\n    considérées comme des eaux usées non domestiques.\n    Limitation des rejets pluviaux dans le réseau : règle générale\n    Dans le secteur 1 délimité sur la carte réglementaire 4.6 « Plan des périmètres de gestion des eaux pluviales\n    », quel que soit l’état d’imperméabilisation, les eaux de ruissellement générées par toute nouvelle\n    construction, tout nouvel aménagement ou toute extension générant une emprise au sol de 20 m² ou plus\n    doivent être gérées sur le terrain d’assiette du projet, par infiltration, évapotranspiration et/ou réutilisation des\n    eaux pluviales (selon la règlementation en vigueur), a minima jusqu’à la pluie de retour 10 ans (lame d’eau\n    de 44 mm en 4h, soit 44 L/m²), sans raccordement direct ou indirect au réseau public territorial.\n    Cet objectif est atteint par la mise en place, prioritairement, de techniques de gestion des eaux pluviales à\n    ciel ouvert, favorisant l’infiltration en surface, l'évapotranspiration, la réutilisation (selon la règlementation\n    en vigueur), l'épuration (bassins végétalisés, jardins de pluie, espaces verts en creux, récupération d’eau de\n    pluie sur les bâtiments, toitures végétalisées, etc.) et assurant des fonctions multiples (sport, parking, espace\n    vert, promenade, …) afin de garantir la pérennité de leur efficacité et favoriser la biodiversité et le\n    rafraichissement de la ville. Le mode de gestion à la source des eaux pluviales doit être étudié dès la\n    conception, comme une composante à part entière du projet. Le cheminement gravitaire et à ciel ouvert des\n264   eaux pluviales doit être privilégié. Les bassins de rétention enterrés et les pompes de relevages\n    associées sont déconseillés pour la gestion des eaux pluviales afin de mettre en œuvre des solutions\n    présentant un intérêt pour la biodiversité, le paysage ou la gestion des épisodes caniculaires.\n    Limitation des rejets pluviaux dans le réseau : règle particulière pour les secteurs concernés par\n    des aléas liés au mouvement de terrain et à la présence d’anciennes carrières\n    Dans les zones concernées par des risques liés à la présence d’anciennes carrières, repérées en secteur 2\n    sur la carte réglementaire 4.6 « Plan des périmètres de gestion des eaux pluviales », quelle que soit l’état\n    d’imperméabilisation, les eaux de ruissellement générées par toute nouvelle construction, tout nouvel\n    aménagement ou toute extension générant une emprise au sol de 20 m² ou plus doivent être gérées sur\n    l’emprise du terrain d’assiette du projet :\n    ▪    Par évapotranspiration (toitures végétalisées, noues ou espaces végétalisés à fond étanche…),\n    jusqu’à une pluie correspondant à une lame d’eau de 10 mm en 24h, soit 10 L/m2.\n    ▪    Par régulation du débit résiduel des eaux pluviales générées par la pluie décennale. Seul\n    l’excédent de ruissellement pourra être raccordé après régulation. Le débit de fuite, généré à la\n    parcelle, ne doit pas excéder, pour une pluie de retour décennal :\n    o   2 L/s/ha dans le cas d’un rejet dans un réseau unitaire,\n    o   10 L/s/ha dans le cas d’un rejet dans un réseau d’eaux pluviales, sauf dispositions locales\n    particulières (notamment en raison d’insuffisance hydraulique locale, ou exutoire aval\n    constitué d’un réseau unitaire).\n    Le cheminement gravitaire des eaux pluviales doit être privilégié. Les pompes de relevage sont fortement\n    déconseillées pour assurer la vidange d’un ouvrage de rétention des eaux pluviales.\n    Dérogation exceptionnelle pour le raccordement des eaux pluviales\n    Il peut être dérogé aux règles énoncées ci-avant, sur la base d’une étude spécifique et après avis favorable\n    des autorités compétentes en matière d’assainissement et de gestion des eaux pluviales urbaines, si des\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    9 Equipements et réseaux\ndifficultés ou impossibilités techniques détaillées le justifient (par exemple relatives à la perméabilité des\nsols, aux risques liés aux couches géologiques sous-jacentes, aux règles de protection des espaces urbains\nau titre de l’histoire, de l’architecture, de l’urbanisme, du paysage et de l’archéologie).\nDans ce cas, toutes les solutions susceptibles de limiter les volumes collectés devront être mises en œuvre.\nDe plus, en secteur 1, il sera demandé de conserver un objectif de gestion a minima d’une pluie\ncorrespondante à une lame d’eau de 10 mm en 24h, sans rejet au réseau et en privilégiant une gestion à\nciel ouvert.\nL’excédent de ruissellement pourra alors être raccordé et il devra être régulé. Sur l’ensemble du territoire de\nGrand Paris Seine Ouest, le débit de fuite, généré à la parcelle, ne doit pas excéder, pour une pluie de\npériode de retour décennale :\n    ▪    2 L/s/ha dans le cas d’un rejet dans un réseau unitaire,\n    ▪    10 L/s/ha dans le cas d’un rejet dans un réseau d’eaux pluviales, sauf dispositions locales\n    particulières (notamment en raison d’insuffisance hydraulique locale, ou exutoire aval constitué d’un\n    réseau unitaire).\nLe cheminement gravitaire des eaux pluviales doit être privilégié. Les pompes de relevage sont fortement\ndéconseillées pour assurer la vidange d’un ouvrage de rétention des eaux pluviales\n9.1.2.    Assainissement des eaux usées\nToute construction ou installation nouvelle engendrant des eaux usées doit être raccordée par des\ncanalisations souterraines au réseau collectif d’assainissement d’eaux usées en respectant les\ncaractéristiques de ce réseau et les règlements d’assainissement de Grand Paris Seine Ouest (selon le\nraccordement : GPSO, Conseil départemental des Hauts de Seine ou Hydreaulys) et conformément à la\nréglementation en vigueur. Cette disposition ne concerne pas les constructions et les installations sur le\nDomaine Public Fluvial.\n    Eaux usées domestiques\n    265\nLes eaux usées domestiques comprennent les eaux usées ménagères (lessives, cuisines, salles de bain et\nles eaux vannes (urine et matière fécale).\nLes rejets des constructions à destination et usage de commerce et activité de service, d’équipements\nd’intérêt collectif et services publics, ainsi que des autres activités des secteurs primaire, secondaire ou\ntertiaire peuvent être considérés comme domestiques lorsque leurs caractéristiques sont similaires à celles\ndes eaux usées domestiques.\nLa séparation des eaux usées et des eaux pluviales doit impérativement être effectuée à l’intérieur du terrain.\nLorsque le réseau public d’assainissement est de type séparatif, les eaux usées domestiques et les eaux\npluviales, collectées séparément, sont évacuées par deux branchements distincts.\nL’écoulement doit se faire librement, sans zone de stagnation, obstacle ou contre-pente.\n    Eaux usées non domestiques\nSont classés dans les eaux usées non domestiques tous les rejets liés à une utilisation de l’eau autre que\ndomestique, correspondant aux catégories suivantes :\n    ▪    Les installations classées pour la protection de l’environnement,\n    ▪    Les activités industrielles non soumises à déclaration ou autorisation pour la protection de\n    l’environnement,\n    ▪    Certaines activités artisanales, notamment les garages et stations-services,\n    ▪    Les eaux usées non domestiques assimilables à des eaux usées domestiques (sont classées dans\n    les eaux usées assimilables domestiques, tous les rejets liés à des activités impliquant des\n    utilisations de l’eau assimilables aux utilisations à des fins domestiques, en application de l’article\n    L.1331-7-1 du Code de la Santé Publique, à savoir principalement les activités tertiaires, de\n    restauration et de laveries-pressings)\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    9 Equipements et réseaux\n    ▪    Les activités générant des rejets d’eaux claires telles que les eaux de pompage de nappe, eaux\n    d’exhaure, eaux de pompe à chaleur ou similaires. Leur rejet est cependant interdit dans les réseaux\n    d’assainissement d’eaux usées et unitaires.\n    Le raccordement des établissements déversant des eaux usées non domestiques au réseau public\n    d’assainissement collectif n’est pas obligatoire. Toutefois, ceux-ci peuvent être autorisés à déverser leurs\n    eaux usées au réseau public, dans la mesure où ces déversements sont compatibles avec les conditions\n    d’admissibilité des eaux usées non domestiques précisément définies dans les règlements d’assainissement\n    collectifs (territorial ou départemental ou raccordé sur le réseau d'Hydréaulys). Les établissements\n    consommateurs d’eau à des fins autres que domestiques doivent être pourvus d’au moins 2 branchements\n    distincts :\n    ▪    Un branchement eaux usées domestiques,\n    ▪    Un branchement eaux usées non domestiques. Les caractéristiques de ces branchements sont\n    spécifiées dans les règlements d’assainissements collectifs.\n    Afin de respecter les critères d’admissibilité des effluents dans le réseau public d’assainissement, certaines\n    eaux usées non domestiques peuvent être amenées à subir une neutralisation ou un pré-traitement avant\n    leur rejet dans les égouts publics. Les dispositions particulières relatives au pré-traitement figurent dans les\n    règlements d’assainissements collectifs.\n    9.1.3.    Eau potable\n    Toute construction requérant une alimentation en eau potable doit être raccordée au réseau de distribution\n    d’eau potable.\n    9.2. Desserte par les voies publiques ou privées\n266   Remarque : l’OAP Mobilité et espaces publics s’applique également.\n    9.2.1.    Voie de desserte\n    Pour être constructible ou aménageable, un terrain doit être accessible par une voie publique ou privée, soit\n    directement, soit, le cas échéant, par l’intermédiaire d’une servitude de passage sur terrain(s) contigu(s).\n    Le projet peut être refusé sur des terrains qui ne seraient pas desservis par des voies publiques ou privées\n    dans des conditions répondant à son importance ou à la destination des constructions ou des aménagements\n    envisagés, et notamment si les caractéristiques de ces voies rendent difficile la circulation ou l'utilisation des\n    engins de lutte contre l'incendie.\n    En cas de construction de moins de trois logements, les sentes piétonnes et les escaliers sont considérés\n    comme des dessertes suffisantes.\n    Les nouvelles voies en impasse desservant au moins deux unités foncières et d’au moins 50 mètres ou la\n    prolongation d’une voie en impasse existante portant la longueur de la voie à plus de 50 mètres doivent être\n    aménagées de telle sorte que les véhicules de défense incendie puissent opérer un demi-tour.\n    Le permis ou la décision prise sur la déclaration préalable peut imposer la réalisation de voies privées ou de\n    tous autres aménagements particuliers nécessaires au respect des conditions de sécurité mentionnées ci-\n    dessus.\n    La non-conformité des terrains bâtis existants vis-à-vis des dispositions ci-dessus ne fait pas obstacle aux\n    travaux de rénovation, de restauration, de réhabilitation, d’extension horizontale et verticale d’une ou\n    plusieurs constructions existant sur le terrain.\n    9.2.2.    Accès\n    Le projet peut n'être autorisé que sous réserve que l’accès soit établi sur la voie où la gêne pour la circulation\n    sera la moindre.\n    Il peut également être refusé ou n'être accepté que sous réserve de prescriptions spéciales si les accès\n    présentent un risque pour la sécurité des usagers des voies publiques ou pourAccusé\n    cellededes    personnes\n    réception en préfecture utilisant\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    9 Equipements et réseaux\nces accès. Cette sécurité doit être appréciée compte tenu, notamment, de la position des accès, de leur\nconfiguration ainsi que de la nature et de l'intensité du trafic.\nPour chaque unité foncière, les possibilités d’accès à la voie publique sont limitées à un accès pour véhicules\nmotorisés pour 30 mètres de façade.\nAucun nouvel accès aux véhicules motorisés n’est autorisé s’il débouche en zone N, à l’exception des\nsecteurs Np, Ns et des STECAL.\nLa non-conformité des terrains bâtis existants vis-à-vis des dispositions ci-dessus ne fait pas obstacle aux\ntravaux de rénovation, de restauration, de réhabilitation, d’extension horizontale et verticale d’une ou\nplusieurs constructions existantes sur le terrain.\n9.3. Desserte par les réseaux\n9.3.1.    Réseaux de chaleur ou de froid\nSous réserve de l’accord du gestionnaire du réseau, le raccordement aux réseaux classés de chaleur ou de\nfroid est obligatoire dans le périmètre de développement prioritaire ou, à défaut, dans les périmètres de\nconcession définis et annexés au dossier de PLUi, pour les constructions et installations suivantes :\n    ▪    nouvelle construction excédant 150 m² de SDP,\n    ▪    extension excédant 150 m² ou 30% de la SDP existante.\nCette disposition s’applique en cas d’installations industrielles ou d'installations de chauffage de locaux, de\nclimatisation ou de production d'eau chaude excédant un niveau de puissance de 30 kilowatts.\n9.3.2.    Réseaux d’énergie et de communications électroniques\nPour toute construction nouvelle, les réseaux de distribution d'énergie et de télécommunication doivent être\nconçus en souterrain sur le terrain jusqu’au point de raccordement avec le réseau public situé en limite de    267\npropriété.\nDoivent être prévues dans les façades, dans les clôtures ou dans un regard sur le terrain, les réservations\npour les coffrets d’alimentation en électricité et en gaz ainsi que pour les réseaux de télécommunication.\nA l’exception des extensions de construction ne créant pas de logements ou de superficie de bureaux\nsupplémentaire, toute nouvelle construction doit être desservie par les réseaux de communication\nélectronique à très haut débit ou disposer des fourreaux d’attente de connexion.\n9.3.3.    Locaux déchets\nPour toute construction nouvelle, un espace destiné à la présentation des déchets en attente de collecte doit\nêtre aménagé sur le terrain d’assiette de la construction. Toutefois, en fonction du mode de collecte\n(exemple : collecte en points d’apport volontaire) ou si la configuration ne le permet pas et avec l’accord\npréalable du gestionnaire des déchets, cet aménagement ne sera pas exigé. Ces locaux présenteront une\nintégration paysagère satisfaisant aux règles relatives à l’aspect extérieur des constructions.\nCet aménagement doit être réalisé afin d’assurer sa parfaite insertion dans l’environnement immédiat et sa\ncohérence avec le projet. Cet espace doit être directement accessible depuis le domaine public.\nPour toutes les constructions desservies par une voie en impasse, un espace destiné à la présentation des\ndéchets en attente de collecte doit être aménagé en limite de l’emprise publique et être conçu afin de\ns’insérer parfaitement dans son environnement.\nLes espaces destinés à la présentation des déchets en attente de collecte doivent assurer une capacité de\nstockage adaptée aux constructions, et doivent répondre aux conditions prescrites par le règlement du\nservice public de collecte des déchets ménagers et assimilés de GPSO.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    9 Equipements et réseaux\n    9.4. Emplacements réservés (voies,    ouvrages    publics,\n    installations d’intérêt général)\n    En application de l’article L 151-41 du Code de l’urbanisme, le PLUi délimite des emplacements réservés en\n    vue de la réalisation de voies et ouvrages publics et d’installations d'intérêt général.\n    Les emplacements réservés sont identifiés et délimités sur le document graphique n°4.2 Plan des\n    prescriptions et périmètres particuliers. La liste des emplacements réservés est jointe en annexe du\n    règlement et figure sur les documents graphiques. Elle précise les collectivités, services et organismes\n    publics bénéficiaires.\n    9.5. Servitudes de localisation\n    En application de l’article L 151-41 du Code de l’urbanisme, le PLUi institue des servitudes consistant à\n    indiquer la localisation prévue et les caractéristiques des voies et ouvrages publics, ainsi que les installations\n    d'intérêt général à créer ou à modifier, en délimitant les terrains qui peuvent être concernés par ces\n    équipements.\n    Ces servitudes sont délimitées sur le document graphique n°4.2 Plan des prescriptions et périmètres\n    particuliers.\n    9.6. Voies, sentes ou chemins à préserver\n    En application de l’article L 151-38, le PLUi identifie des voies, sentes ou chemins à conserver.\n    L’intégrité des voies, sentes et chemins identifiés sur le document graphique n°4.2 Plan des prescriptions\n268   et périmètres particuliers, doit être maintenue, restaurée ou améliorée (largeur, qualité du sol et des\n    revêtements, plantations).\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    10. Cahiers\n    réglementaires\n    détaillés\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\nModification simplifiée n°1 du 25 juin 2025","    10. Cahiers règlementaires détaillés\n    10.1. Cahier des patrimoines\n    Cf. Cahiers détaillés par commune.\n    4.3.a - Boulogne-Billancourt\n    4.3.b - Chaville\n    4.3.c - Issy-les-Moulineaux\n    4.3.d - Marnes-la-Coquette\n    4.3.e - Meudon\n    4.3.f - Sèvres\n    4.3.g - Vanves\n    4.3.h – Ville-d’Avray\n270\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    10. Cahiers règlementaires détaillés\n10.2. Cahier des emplacements réservés\n10.2.1.    Programmes de logements\nCf. Cahier détaillé. Pièce 4.2.a\n10.2.2.    Espaces verts et continuités écologiques\nCf. Cahier détaillé. Pièce 4.2.a\n10.2.3.    Voies, ouvrages publics, installations d’intérêts général\nCf. Cahier détaillé. Pièce 4.2.a\n10.3. Cahier des servitudes de localisation\nCf. Cahier détaillé. Pièce 4.2.a\n    271\n10.4. Cahier des espaces écologiques et/ou paysagers protégés\nCf. Cahier détaillé. Pièce 4.2.b\n    Accusé de réception en préfecture\n    092-200057974-2025   const ck=checks[id]||{};
  let total=0,done=0;
  const zsel=DATA.zones.length?`<div class="zsel"><span style="font-size:13px;color:var(--muted)">Tu zona:</span><span class="chip ${zone===''?'on':''}" data-z="">sin elegir</span>${DATA.zones.map(z=>`<span class="chip ${zone===z?'on':''}" data-z="${esc(z)}">${esc(z)}</span>`).join('')}</div>`:'';
  const groups=P.grupos.map(([th,txt])=>{
    let list=secsFor(th).filter(s=>!s.z||!zone||s.z===zone);
    // prefer most specific: drop parents whose children also listed
    const ids=new Set(list.map(s=>s.i));
    list=list.filter(s=>!kids[s.i].some(j=>ids.has(j)));
    const common=list.filter(s=>!s.z), zl=list.filter(s=>s.z);
    const item=s=>{total++; const ok=ck[s.i]; if(ok) done++; return `<div class="pj-a ${ok?'ok':''}"><input type="checkbox" data-ck="${s.i}" ${ok?'checked':''}><a href="#s/${s.i}">${esc(s.t)}${s.z?`<span class="zn">${esc(s.z)}</span>`:''}<span class="tt">p. ${s.p} · ${esc(crumb(s).replace(/<[^>]+>/g,''))}</span></a></div>`};
    let body='';
    if(common.length) body+=`<div style="font-size:12px;color:var(--muted);margin-top:6px">Comunes a todas las zonas</div>`+common.slice(0,12).map(item).join('')+(common.length>12?`<div class="empty">… y ${common.length-12} más en <a href="#temas/${th}">Por tema</a></div>`:'');
    if(zl.length) body+=`<div style="font-size:12px;color:var(--muted);margin-top:6px">${zone?'Zona '+esc(zone):'Por zona (elige tu zona arriba para filtrar)'}</div>`+zl.slice(0,zone?30:10).map(item).join('')+(!zone&&zl.length>10?`<div class="empty">… y ${zl.length-10} más: elige tu zona.</div>`:'');
    if(!body) body=`<div class="empty">No he encontrado un artículo con este tema en el índice. Usa el buscador (arriba) con palabras clave.</div>`;
    return `<div class="box pj-g"><h3>${esc(TH[th])}</h3><div class="reg">${esc(txt)}</div>${body}</div>`;
  }).join('');
  $('#main').innerHTML=`${tabs}<h1 class="st">${esc(P.nom)}</h1>
  <div class="pj-cols"><div class="box"><h3>Trámite</h3><ul>${P.tramite.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="box"><h3>Antes de leer el reglamento</h3><ul>${P.antes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
  ${zsel}
  <div class="pj-bar"><div class="pj-prog"><i style="width:${total?Math.round(done*100/total):0}%"></i></div><span style="font-size:13px">${done} de ${total} revisados</span><button id="pjReset">Desmarcar todo</button><button onclick="print()">Imprimir</button></div>
  <div class="warn">La lista se genera por tema a partir del índice del reglamento. Confirma siempre en el texto y en el plano de zonificación; algunos artículos tratan varios temas a la vez.</div>
  ${groups}`;
  $('#main').querySelectorAll('[data-z]').forEach(e=>e.onclick=()=>{zone=e.dataset.z; store.set('zone',zone); renderFilters(); renderTree(); viewProy(id)});
  $('#main').querySelectorAll('[data-ck]').forEach(e=>e.onchange=()=>{const c=checks[id]=checks[id]||{}; if(e.checked) c[e.dataset.ck]=1; else delete c[e.dataset.ck]; store.set('checks',checks); viewProy(id)});
  $('#pjReset').onclick=()=>{checks[id]={}; store.set('checks',checks); viewProy(id)};
}
function viewTemas(th){
  const list=DATA.themes.map(([k,l])=>`<a class="chip ${k===th?'on':''}" href="#temas/${k}">${esc(l)} (${secsFor(k).length})</a>`).join(' ');
  let body='';
  if(th){
    const ss=secsFor(th).filter(s=>!zone||!s.z||s.z===zone);
    body=`<h2 style="font-size:18px">${esc(TH[th])}${zone?' · zona '+esc(zone):''}</h2>`+(ss.map(s=>`<div class="r" onclick="location.hash='#s/${s.i}'"><span class="cd">p. ${s.p}</span>${esc(s.t)} ${s.z?`<span class="chip">${esc(s.z)}</span>`:''}<div class="sn">${esc(crumb(s).replace(/<[^>]+>/g,''))}</div></div>`).join('')||'<div class="empty">Ninguna sección del índice. Prueba el buscador.</div>');
  }
  $('#main').innerHTML=`<h1 class="st">Por tema</h1><p>Secciones del reglamento agrupadas por tema (según su título).${DATA.zones.length?' Si eliges tu zona en el panel izquierdo, se ocultan las de otras zonas.':''}</p><div class="th-l" style="margin-bottom:14px">${list}</div><div class="results">${body}</div>`;
}
function secOfPage(p){let best=null;S.forEach(s=>{if(s.p<=p&&(!best||s.p>=best.p))best=s});return best}
function viewSearch(q){
  const nq=norm(q).trim(); if(nq.length<2){viewHome();return}
  const terms=nq.split(/\s+/);
  const res=[];
  const tit=S.filter(s=>terms.every(t=>norm(s.t).includes(t)));
  for(let i=0;i<DATA.pages.length&&res.length<300;i++){
    const np=NP[i]; if(terms.every(t=>np.includes(t))){
      const j=np.indexOf(terms[0]); const raw=DATA.pages[i]; const a=Math.max(0,j-90);
      res.push({p:i+1,sn:raw.slice(a,a+260).replace(/\s+/g,' ')});
    }
  }
  const hl=t=>{let h=esc(t);terms.forEach(x=>{if(x.length<2)return;const re=new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');h=h.replace(re,m=>`<mark>${m}</mark>`)});return h};
  $('#main').innerHTML=`<h1 class="st">Resultados para «${esc(q)}»</h1>
  ${tit.length?`<div class="box"><h3>En títulos de secciones (${tit.length})</h3>${tit.slice(0,40).map(s=>`<div class="r" onclick="location.hash='#s/${s.i}'"><span class="cd">p. ${s.p}</span>${esc(s.t)}</div>`).join('')}</div>`:''}
  <div class="results"><h3 style="font-size:14px;color:var(--muted)">EN EL TEXTO: ${res.length}${res.length>=300?'+':''} páginas</h3>${res.map(r=>{const s=secOfPage(r.p);return `<div class="r" data-p="${r.p}" data-s="${s?s.i:''}"><span class="cd">p. ${r.p}</span>${s?esc(s.t):''}<div class="sn">… ${hl(r.sn)} …</div></div>`}).join('')}</div>`;
  $('#main').querySelectorAll('.results .r[data-p]').forEach(e=>e.onclick=()=>{location.hash='#p/'+e.dataset.p});
}
function viewPage(p){
  p=Math.max(1,Math.min(DATA.npages,p)); const s=secOfPage(p);
  $('#main').innerHTML=`<div class="crumb">${s?crumb(s)+(crumb(s)?' › ':'')+`<a href="#s/${s.i}">${esc(s.t)}</a>`:''}</div><h1 class="st">Página ${p}</h1>
  <div class="btns no-print" style="margin-bottom:14px">${pdfBtn(p)} ${p>1?`<a class="b" href="#p/${p-1}">← p. ${p-1}</a>`:''} ${p<DATA.npages?`<a class="b" href="#p/${p+1}">p. ${p+1} →</a>`:''}</div>${pagesHtml(p,p)}`;
  const q=$('#q').value; if(q){const terms=norm(q).split(/\s+/).filter(x=>x.length>1); const pre=$('#main pre'); let h=pre.innerHTML; terms.forEach(x=>{const re=new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'); h=h.replace(re,m=>`<mark>${m}</mark>`)}); pre.innerHTML=h}
  window.scrollTo(0,0);
}
function viewNotas(){
  const f=Object.keys(favs).map(Number).filter(i=>S[i]); const n=Object.keys(notes).map(Number).filter(i=>S[i]);
  $('#main').innerHTML=`<h1 class="st">Mis notas y favoritos</h1><p class="empty">Se guardan solo en este navegador.</p>
  <div class="box"><h3>Favoritos (${f.length})</h3>${f.map(i=>`<div class="r" onclick="location.hash='#s/${i}'"><span class="cd">p. ${S[i].p}</span>${esc(S[i].t)}</div>`).join('')||'<div class="empty">Marca secciones con ★.</div>'}</div>
  <div class="box"><h3>Notas (${n.length})</h3>${n.map(i=>`<div class="r" onclick="location.hash='#s/${i}'"><span class="cd">p. ${S[i].p}</span>${esc(S[i].t)}<div class="sn">${esc(notes[i])}</div></div>`).join('')||'<div class="empty">Escribe notas en cualquier sección.</div>'}</div>`;
}
function viewHome(){
  const top=S.filter(s=>s.l===0);
  $('#main').innerHTML=`<h1 class="st">${esc(DATA.nom)}</h1>
  <div class="box"><div class="kv"><b>Documento</b><span>Reglamento escrito del ${DATA.k.startsWith('pold')?'PLU':'PLUi'} (${DATA.npages} páginas)</span><b>Estado</b><span>${esc(DATA.estado)}</span><b>Municipios</b><span>${esc(DATA.communes)}</span><b>Fuente</b><span><a href="${DATA.pdf.url}" target="_blank" rel="noopener">Géoportail de l'urbanisme (PDF oficial)</a></span></div></div>
  <div class="box"><h3>Cómo usarlo</h3><ul style="margin:0;padding-left:18px">
   <li><b>Por proyecto</b>: elige el tipo de obra y tu zona; te lista los artículos a revisar, por orden, con casillas.</li>
   <li><b>Explorar</b>: índice completo a la izquierda; cada sección muestra el texto oficial y el botón para abrir el PDF en esa página.</li>
   <li><b>Buscador</b>: busca en las ${DATA.npages} páginas (palabras en francés: <i>hauteur, clôture, pleine terre…</i>).</li>
   <li><b>Tu zona</b>: mírala en el <a href="https://www.geoportail-urbanisme.gouv.fr/map/" target="_blank" rel="noopener">mapa del Géoportail de l'urbanisme</a> (clic en la parcela) o en los planos de zonificación de la carpeta <i>Reglement</i>.</li></ul></div>
  <div class="pj-tabs">${PROY.map(p=>`<a href="#proy/${p.id}"><b>${esc(p.nom)}</b><span>${esc(p.sub)}</span></a>`).join('')}</div>
  <div class="box sub-list"><h3>Partes del reglamento</h3>${top.map(s=>`<a href="#s/${s.i}">${esc(s.t)} <span style="color:var(--muted);font-size:12px">p. ${s.p}</span></a>`).join('')}</div>
  <div class="box no-print"><h3>Abrir el PDF</h3><p style="font-size:13.5px;margin:0 0 8px">Los botones «Abrir en el PDF» usan: <b>${pdfMode==='local'?'tu copia en el PC (carpeta Reglement junto a este archivo)':'el PDF oficial en internet'}</b>.</p><button id="pdfToggle">Usar ${pdfMode==='local'?'el PDF en internet':'mi copia local'}</button></div>
  ${HOME_URL?`<p><a href="${HOME_URL}">← Volver al mapa de territorios</a></p>`:''}`;
  $('#pdfToggle').onclick=()=>{pdfMode=pdfMode==='local'?'online':'local'; store.set('pdfmode',pdfMode); viewHome(); toast('PDF: '+(pdfMode==='local'?'copia local':'internet'))};
}
const NP=DATA.pages.map(norm);
let qt;
$('#q').addEventListener('input',e=>{clearTimeout(qt); qt=setTimeout(()=>{const v=e.target.value.trim(); if(v.length>=2) location.hash='#q/'+encodeURIComponent(v); else if(!v) location.hash='#home'},350)});
function route(){
  const h=decodeURIComponent(location.hash.slice(1)||'home');
  const [v,a]=[h.split('/')[0],h.split('/').slice(1).join('/')];
  document.querySelectorAll('#tabs a').forEach(x=>x.classList.toggle('on',x.dataset.t===(v==='q'||v==='p'?'':v)));
  if(v==='s') viewSec(+a||0);
  else if(v==='proy') viewProy(a);
  else if(v==='temas') viewTemas(a);
  else if(v==='q'){ if($('#q').value!==a) $('#q').value=a; viewSearch(a)}
  else if(v==='p') viewPage(+a);
  else if(v==='notas') viewNotas();
  else viewHome();
}
window.addEventListener('hashchange',route);
renderFilters(); renderTree(); route();
</script>
</body>
</html>
