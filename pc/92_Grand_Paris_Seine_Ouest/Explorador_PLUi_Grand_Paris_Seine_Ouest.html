<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorador Grand Paris Seine Ouest (GPSO)</title>
<style>

:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1d1f22; --muted:#666b73; --line:#e3e1db; --accent:#1f5f8b; --accent-ink:#ffffff;
  --hl:#fff1a8; --chip:#eef1f4; --sum:#eef6ee; --sum-line:#b9d9bb; --code:#1f5f8b; --warn:#fff6e5;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15171a; --panel:#1d2024; --ink:#e7e7e4; --muted:#9aa0a8; --line:#30343a; --accent:#6fb3e0; --accent-ink:#0d1114;
  --hl:#5b4f12; --chip:#262a30; --sum:#1c2a1e; --sum-line:#35573a; --code:#8cc6ee; --warn:#2c2516;
}}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1d2024; --ink:#e7e7e4; --muted:#9aa0a8; --line:#30343a; --accent:#6fb3e0; --accent-ink:#0d1114;
  --hl:#5b4f12; --chip:#262a30; --sum:#1c2a1e; --sum-line:#35573a; --code:#8cc6ee; --warn:#2c2516;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px}
nav.tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto}
nav.tabs a{padding:8px 12px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
nav.tabs a.on{color:var(--ink);border-color:var(--accent);font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:5px 10px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wrap{display:flex;min-height:calc(100vh - 100px)}
aside{width:330px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow:auto;height:calc(100vh - 100px);position:sticky;top:100px}
main{flex:1;min-width:0;padding:18px 28px 80px;max-width:980px}
.filters{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line);cursor:pointer;user-select:none}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tree{padding:6px 0 30px}
.tree .n{display:flex;gap:6px;align-items:baseline;padding:3px 12px;cursor:pointer;font-size:13.5px;line-height:1.35}
.tree .n:hover{background:var(--chip)}
.tree .n.cur{background:var(--chip);box-shadow:inset 3px 0 0 var(--accent)}
.tree .n .cd{color:var(--code);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
.tree .n .pg{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.tree .l0{font-weight:700;margin-top:8px;text-transform:uppercase;font-size:12px;letter-spacing:.03em}
.tree .l1{font-weight:600}
.tree .l2{padding-left:24px}
.tree .l3{padding-left:40px;color:var(--ink)}
.tree .tg{cursor:pointer;color:var(--muted);width:12px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;transform:translateY(-1px)}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.crumb a{text-decoration:none}
h1.st{font-size:22px;margin:0 0 4px;line-height:1.3}
h1.st .cd{color:var(--code)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 14px;font-size:13px;color:var(--muted)}
.sum{background:var(--sum);border:1px solid var(--sum-line);border-radius:10px;padding:10px 14px;margin:0 0 16px}
.sum b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:2px}
.txt p{margin:0 0 10px}
.txt h4{margin:18px 0 8px;font-size:15px}
.txt ul{margin:0 0 10px;padding-left:22px}
.txt li{margin:0 0 5px}
.txt ul.sub{margin:5px 0 5px;list-style:circle}
.txt li.nb{list-style:none}
pre.tbl{font:12px/1.35 ui-monospace,Consolas,monospace;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre}
.ref{font-style:italic;color:var(--muted)}
a.xr{text-decoration:none;border-bottom:1px dotted var(--accent);white-space:nowrap}
a.fg{font-size:12px;background:var(--chip);border-radius:5px;padding:0 5px;text-decoration:none;font-style:normal}
.df{border-bottom:1px dashed var(--muted);cursor:help}
sup{font-size:9px;color:var(--muted)}
mark{background:var(--hl);color:inherit;border-radius:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.box h3{margin:0 0 8px;font-size:15px}
.sub-list a{display:block;padding:4px 0;text-decoration:none}
.sub-list .cd{color:var(--code);margin-right:6px}
.eq a{margin-right:8px}
.notes textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px;font:inherit}
.results .r{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.results .r:hover{background:var(--chip)}
.results .r .cd{color:var(--code);font-weight:600;margin-right:6px}
.results .r .sn{color:var(--muted);font-size:13.5px;margin-top:3px}
.pop{position:absolute;z-index:50;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px 14px;font-size:13.5px;max-height:320px;overflow:auto}
.pop h5{margin:0 0 6px;font-size:14px}
table.cf{width:100%;border-collapse:collapse;font-size:14px}
table.cf td,table.cf th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.cf th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
table.cf td.v{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ob .reg{font-size:12.5px;color:var(--muted);margin:-4px 0 8px}
.ob a{display:block;text-decoration:none;padding:3px 0}
.ob a .cd{color:var(--code);font-weight:600;margin-right:6px;font-size:13px}
.ob a span.w{color:var(--ink)}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.figs .fc{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.figs .fc img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover;object-position:top;background:#fff}
.figs .fc div{padding:8px 10px;font-size:13px}
.figview img{width:100%;max-width:760px;display:block;margin:0 auto 12px;border:1px solid var(--line);border-radius:6px;background:#fff}
.gl .gi{padding:12px 0;border-bottom:1px solid var(--line)}
.gl .gi h3{margin:0 0 4px;font-size:16px}
.gl .refs{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.az{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.warn{background:var(--warn);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.star{font-size:18px;line-height:1;border:none;background:none;padding:0 4px;color:var(--muted)}
.star.on{color:#e0a400}
.menu{display:none}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
@media (max-width:820px){
  aside{position:fixed;left:0;top:0;height:100vh;z-index:40;transform:translateX(-100%);transition:transform .2s;width:86vw;max-width:360px;box-shadow:0 0 30px rgba(0,0,0,.25)}
  aside.open{transform:none}
  .menu{display:inline-block}
  main{padding:14px 16px 80px}
  .brand small{display:none}
}

.pj-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 18px}
.pj-tabs a{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pj-tabs a b{display:block;font-size:15.5px;margin-bottom:2px}
.pj-tabs a span{font-size:12.5px;color:var(--muted)}
.pj-tabs a.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.pj-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pj-cols ul{margin:0;padding-left:18px}.pj-cols li{margin:3px 0;font-size:14px}
.pj-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.pj-prog{flex:1;min-width:160px;height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.pj-prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.pj-bar button{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.pj-g h3{margin:0 0 6px;font-size:15px}
.pj-a{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.pj-a:first-of-type{border-top:0}
.pj-a input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}
.pj-a a{text-decoration:none;color:var(--ink)}
.pj-a .cd{color:var(--code);font-weight:600;margin-right:6px;font-size:13px}
.pj-a .tt{color:var(--muted);font-size:12.5px;display:block}
.pj-a.ok a{opacity:.55}
@media (max-width:760px){.pj-cols{grid-template-columns:1fr}}
@media print{.pj-tabs,.pj-bar button{display:none!important}.pj-a input{accent-color:#000}}
@media print{header,aside,.notes,.no-print{display:none!important} main{max-width:none;padding:0}}

.pg{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:0 0 14px;overflow:hidden}
.pg .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;background:var(--chip);font-size:12.5px;color:var(--muted)}
.pg pre{margin:0;padding:12px 14px;font:13px/1.5 ui-monospace,"Cascadia Mono",Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.pg pre .hh{background:var(--hl);font-weight:700}
.zsel{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.th-l{display:flex;flex-wrap:wrap;gap:6px}
.th-l .chip{font-size:12.5px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px}
.kv b{color:var(--muted);font-weight:600}
.pj-a .zn{font-size:11px;background:var(--chip);border-radius:5px;padding:0 5px;margin-left:6px;color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;font-style:italic}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btns a.b{display:inline-block;border:1px solid var(--line);border-radius:7px;padding:5px 10px;text-decoration:none;font-size:13.5px;background:var(--panel)}
.btns a.b.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
</style>

l’établissement public territorial Grand Paris\nSeine Ouest. Il couvre les communes de Boulogne-Billancourt, Chaville, Issy-les-Moulineaux, Marnes-la-\nCoquette, Meudon, Sèvres, Vanves et Ville-d’Avray.\nLes règles instituées par le présent règlement littéral et ses documents graphiques sont opposables dans un\nrapport de conformité à toute personne publique ou privée pour l’exécution de tous travaux, constructions,\naménagements, plantations, affouillements ou exhaussements des sols, et ouverture d'installations classées\nappartenant aux catégories déterminées dans le plan.\n1.2. Contenu du règlement\nLes règles et servitudes d’urbanisme définies par le plan local d’urbanisme intercommunal s’appliquent sur\nla totalité du territoire, en fonction d’un zonage réglementaire comprenant cinq plans éventuellement détaillés\npar commune :\n    ▪    4.1. Plan général,\n    ▪    4.2. Plan des prescriptions et périmètres particuliers,\n    ▪    4.3. Plan des protections patrimoniales, écologiques et paysagères,\n    ▪    4.4. Plan de pleine-terre et coefficient de biotope surfacique,\n    ▪    4.5. Plan des secteurs d’application des règles de stationnement,\n    ▪    4.6. Plan des périmètres de gestion des eaux pluviales.\n1.2.1.    Plan général\nLe plan général établit un découpage en plusieurs zones urbaines et une zone naturelle et forestière. Ces    7\nzones sont précisées par des secteurs et sous-secteurs, le cas échéant.\n    6 grandes catégories de zones urbaines\n    ▪    Zone U1 : correspond aux différentes zones de centralités, qui se caractérisent notamment par une\n    intensité importante et une grande mixité des fonctions. Elle est composée de 8 secteurs.\n    ▪    Zone U2 : regroupe des tissus urbains mixtes dans leur forme et dans leurs destinations. Sur ces\n    deux sujets, elle joue un rôle de transition entre la zone U1 et la zone U3. Elle est composée de 4\n    secteurs.\n    ▪    Zone U3 : correspond à une zone à dominante d’habitat pavillonnaire, souvent individuel. Sa\n    vocation est à dominante résidentielle, sans exclure une certaine forme de mixité fonctionnelle. Elle\n    est composée de 3 secteurs.\n    ▪    Zone U4 : est une zone à dominante résidentielle qui comprend également des secteurs de mixité\n    fonctionnelle. Elle intègre des quartiers de résidences d’habitat collectif et des ensembles tertiaires.\n    Elle est composée de 4 secteurs.\n    ▪    Zone U5 : à vocation à accueillir de multiples activités économiques, dont celles qui sont le plus\n    difficilement compatibles avec les tissus urbains résidentiels ou mixtes. Elle est composée de 4\n    secteurs.\n    ▪    Zone U6 : dédiée à certains équipements d’intérêt collectif et services publics. Elle est composée\n    de 4 secteurs.\n    Une zone naturelle et forestière comprenant 2 secteurs\nLa zone naturelle correspond aux espaces naturels ouverts ou forestiers. Elle comprend 2 secteurs, l’un\ndédié à la Seine et ses berges (Ns) et l’autre aux grands parcs du territoire (Np), ainsi que 8 secteurs de\ntaille et de capacité d’accueil limitées (STECAL).\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\n    Autres dispositions\n    Le plan général comprend également les périmètres ou prescriptions suivantes :\n    ▪    Les secteurs comportant des orientations d’aménagement et de programmation,\n    ▪    La localisation des constructions susceptibles de changer de destination en zone naturelle,\n    ▪    La délimitation des secteurs de taille et de capacité d’accueil limitées (STECAL) en zone naturelle,\n    ▪    L’indication des secteurs soumis aux dispositions de plan masse,\n    ▪    La localisation des linéaires de préservation et de développement de la diversité commerciale de\n    type 1 et de type 2.\n    1.2.2.    Plan des prescriptions et périmètres particuliers\n    Le plan des prescriptions et périmètres particuliers comprend :\n    ▪    La délimitation des périmètres d’attente de projet d’aménagement global (PAPAG)\n    ▪    Les règles graphiques de morphologie et d’implantation :\n    o   Alignement obligatoire\n    o   Marge de recul\n    o   Règle spécifique de hauteur\n    o   Zone à hauteur contrainte\n    o   Filets de hauteur\n    ▪    Les périmètres et servitudes relatives à la mixité sociale :\n    o   Secteur de taille minimale de logement – STML\n    o   Secteurs de mixité sociale – SMS\n8    o   Emplacements réservés pour programmes de logements\n    ▪    La délimitation des emplacements réservés pour les voies, ouvrages publics, et installations d’intérêt\n    général,\n    ▪    La localisation des servitudes de localisation des voies ou ouvrages publics.\n    1.2.3.    Plan des protections patrimoniales, écologiques et paysagères\n    Le plan des protections patrimoniales, écologiques et paysagères comprend :\n    Les protections liées à la nature et à la biodiversité\n    ▪    Les différentes catégories d’espaces écologiques et/ou paysagers protégés :\n    o   Les espaces végétalisés\n    o   Les mares et les plans d’eau\n    o   Les jardins et espaces cultivés\n    o   Parcs et jardins de pleine-terre du Plan de Valorisation de l’Architecture et du Patrimoine\n    (PVAP) du site patrimonial remarquable de Marnes-la-Coquette\n    o   Les continuités paysagères et passages\n    o   Les alignements d’arbres\n    ▪    D’autres périmètres et servitudes d’urbanisme :\n    o   Les espaces boisés classés\n    o   Les lisières forestières\n    o   Les emplacements réservés aux espaces verts et continuités écologiques\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\n    Les protections liées au patrimoine bâti et paysager\n    ▪    Le patrimoine bâti remarquable\n    ▪    Le patrimoine bâti d’intérêt\n    ▪    Les ensembles bâtis à caractère patrimonial\n    ▪    Les ensembles urbains d’intérêt\n    ▪    Les éléments d’intérêt\n    ▪    Les arbres remarquables\n    ▪    Les arbres repères\n    Des éléments d’information sur le réseau hydrographique (tracé indicatif à titre d’information)\n    ▪    Les cours d’eau apparents et enterrés\n    ▪    Les rus\n1.2.4.    Plan de pleine-terre et coefficient de biotope surfacique\nLe plan réglementaire de pleine-terre et de coefficient de biotope surfacique établit les dispositions\napplicables pour chaque terrain en référence à l’ilot réglementaire dans lequel il se situe.\n1.2.5.    Plan des secteurs d’application des règles de stationnement\nLe plan des secteurs d’application des règles de stationnement établit le découpage du territoire en 4\nsecteurs réglementaires pour l’application des règles de stationnement.\n1.2.6.    Plan des périmètres de gestion des eaux pluviales    9\nLe plan des périmètres de gestion des eaux pluviales établit une répartition du territoire en 2 secteurs\nréglementaires pour l’application des règles de gestion des eaux pluviales.\n1.2.7.    Composition du règlement littéral\nLe règlement littéral est composé de 10 chapitres dont 8 chapitres thématiques :\n    ▪    1. Dispositions générales\n    ▪    2. Affectation des sols, destination des constructions et natures d'activités\n    ▪    3. Morphologie et implantation des constructions\n    ▪    4. Nature et biodiversité\n    ▪    5. Qualité urbaine, architecturale, énergétique et environnementale des constructions\n    ▪    6. Patrimoine bâti et paysager\n    ▪    7. Mixité fonctionnelle et sociale\n    ▪    8. Stationnement\n    ▪    9. Equipements et réseaux\n    ▪    10. Cahiers réglementaires détaillés\nArticulation des règles des chapitres n°3 et 5 avec les dispositions des plans de masse du chapitre 10\nLes règles édictées graphiquement et littéralement dans le cahier détaillé des secteurs de plan de masse\ns’appliquent nonobstant toute règle contraire de la zone, du secteur ou du sous-secteur réglementaire auquel\nest rattaché le périmètre faisant l’objet du plan de masse.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\n    1.3. Articulation du règlement avec d’autres dispositions\n    1.3.1.    Adaptations mineures et dérogations\n    Les règles et servitudes définies par le plan local d’urbanisme intercommunal peuvent faire l'objet\n    d'adaptations mineures et de dérogations telles que prévues par le Code de l’urbanisme.\n    1.3.2.    Archéologie préventive\n    Au titre des articles L.425-11 et R.425-31 du Code de l’urbanisme, lorsque le projet entre dans le champ\n    d'application de l'article R.523-4 du code du patrimoine, le dossier joint à la demande de permis comprend\n    les pièces exigées à l'article R.523-9 de ce code. La décision ne peut intervenir avant que le préfet de région\n    ait statué, dans les conditions prévues à l'article R.523-18 de ce code sur les prescriptions d’archéologie\n    préventive. Dans le cas où le préfet de région a imposé des prescriptions, les travaux de construction ou\n    d'aménagement ne peuvent pas être entrepris avant l'exécution de ces prescriptions.\n    1.3.3.    Reconstruction après démolition\n    La reconstruction à l'identique d'un bâtiment détruit depuis moins de 10 ans est autorisée en zone U3,\n    nonobstant toute disposition d'urbanisme contraire, sauf si un plan de prévention des risques en dispose\n    autrement, et dès lors qu'il avait été régulièrement édifié.\n    Dans les autres zones, seule la reconstruction à l'identique d'un bâtiment détruit par sinistre depuis moins\n    de 10 ans est autorisée, nonobstant toute disposition d'urbanisme contraire, sauf si un plan de prévention\n    des risques en dispose autrement, et dès lors qu'il avait été régulièrement édifié. Dans tous les autres cas,\n    notamment les démolitions, toute reconstruction doit respecter les règles du PLUi.\n    1.3.4.    Application du règlement aux lotissements et en cas de division en\n10\n    propriété ou en jouissance\n    Dans le cas d'un lotissement ou dans celui de la construction, sur une unité foncière ou sur plusieurs unités\n    foncières contiguës, de plusieurs bâtiments dont le terrain d'assiette doit faire l'objet d'une division en\n    propriété ou en jouissance :\n    ▪    En toutes zones, exceptée la zone U3, l'ensemble du projet est apprécié à l’échelle du terrain avant\n    division, au regard de la totalité des règles édictées par le PLUi ;\n    ▪    En zone U3, les règles du PLUi sont appliquées à chaque lot ou chaque unité issu de la division et\n    destiné à être bâti.\n    Les règles d'urbanisme contenues dans les documents du lotissement, notamment le règlement, le cahier\n    des charges s'il a été approuvé ou les clauses de nature réglementaire du cahier des charges s'il n'a pas été\n    approuvé, deviennent caduques au terme de dix années à compter de la délivrance de l'autorisation de lotir.\n    Ces dispositions ne remettent pas en cause les droits et obligations régissant les rapports entre colotis définis\n    dans le cahier des charges du lotissement, ni le mode de gestion des parties communes.\n    1.3.5.    Illustrations du règlement\n    Les illustrations du présent règlement ont une fonction pédagogique et explicative. En cas de doute sur\n    l’interprétation d’une disposition, le texte prévaut sur l’illustration.\n    1.3.6.    Complémentarité du règlement et des orientations d’aménagement et de\n    programmation\n    Les orientations d'aménagement et de programmation (OAP) sont regroupées dans le Tome 3 du PLUi et\n    sont réparties de la façon suivante :\n    ▪    3 OAP thématiques concernent l'ensemble du territoire :\n    o   Continuités écologiques,\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\n    o   Mobilité et espace public,\n    o   Energies : produire et consommer une énergie renouvelable et diversifiée.\n    ▪    Des OAP sectorielles dont le périmètre est précisé sur le plan de zonage général.\nLes orientations écrites et graphiques instituées par les OAP sont opposables dans un rapport de\ncompatibilité à toute personne publique ou privée pour l’exécution de tous travaux, constructions,\naménagements, plantations, affouillements ou exhaussements des sols, et ouverture d'installations classées\nappartenant aux catégories déterminées dans le plan.\nLes orientations d'aménagement et de programmation sont complémentaires des dispositions du règlement.\nTout projet sera à la fois compatible avec les OAP et conforme au règlement.\n1.3.7.    Portée d’autres législations relatives à l’occupation des sols\nLes articles R.111-2, R.111-4, et R.111-20 à R.111-27 du règlement national d’urbanisme du code de\nl’urbanisme restent applicables.\nAux règles du PLUi s’ajoutent les prescriptions prises au titre de législations spécifiques concernant les\nservitudes d’utilité publique affectant l’occupation ou l’utilisation du sol. Ces servitudes sont présentées dans\nle rapport de présentation et détaillées dans la notice et les plans du Tome 5 « Annexes » du PLUi.\n1.3.8.    Installations classées protection de l’environnement (ICPE)\nToute exploitation industrielle susceptible de créer des risques ou de provoquer des pollutions ou nuisances,\nnotamment pour la sécurité et la santé des riverains, est une installation classée. Les activités relevant de\nla législation des installations classées sont énumérées dans une nomenclature qui les soumet à un régime\nd’autorisation, d’enregistrement ou de déclaration en fonction de l’importance des risques ou des\ninconvénients qui peuvent être engendrés.\n    ▪    Déclaration : pour les activités les moins polluantes et les moins dangereuses. Une simple\n    déclaration en préfecture est nécessaire.    11\n    ▪    Enregistrement : pour les secteurs dont les mesures techniques pour prévenir les inconvénients\n    sont bien connues (stations-service, entrepôts...), un régime d’autorisation simplifiée, ou régime dit\n    d’enregistrement, a été créé en 2009.\n    ▪    Autorisation : pour les installations présentant les risques ou pollutions les plus importants.\n    L’exploitant doit faire une demande d’autorisation avant toute mise en service, démontrant\n    l’acceptabilité du risque. Le préfet peut autoriser ou refuser le fonctionnement.\nLa législation des installations classées confère à l’Etat (Inspection des Installations Classées) des pouvoirs\nd’autorisation ou de refus d’autorisation de fonctionnement d’une installation, de réglementation (imposer le\nrespect de certaines dispositions techniques, autoriser ou refuser le fonctionnement d’une installation), de\ncontrôle et de sanction.\n1.3.9.    Risques naturels et technologiques (information)\nLes pétitionnaires sont informés de la présence d’aléas et de risques naturels et technologiques sur le\nterritoire.\nPour mémoire, les risques et aléas connus suivants concernent en partie ou en totalité le territoire :\n    ▪    Inondation,\n    ▪    Mouvement de terrain,\n    ▪    Anciennes carrières souterraines,\n    ▪    Aléa retrait-gonflement des argiles,\n    ▪    Feux de forêt,\n    ▪    Installations classées protection de l’environnement (ICPE),\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\n    ▪   Sites et sols pollués,\n    ▪   Transport de matières dangereuses.\n    L’état initial de l’environnement décrit les aléas et risques au sein du rapport de présentation du dossier de\n    PLUi.\n    Le Tome 5 « Annexes » du PLUi retranscrit les risques faisant l’objet de servitudes d’utilité publique et\n    comprend certaines informations sur les aléas.\n12\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\n1.4. Lexique réglementaire\nLes termes du lexique apparaissent en italique au sein du règlement. Ces termes s’entendent « au sens du\nprésent règlement ».\nACCÈS\nL’accès constitue un des éléments de la desserte du terrain formant jonction avec la voie qui le dessert :\nlinéaire de façade du terrain (portail par exemple) ou de la construction (porche par exemple) ou espace\ndédié (emprise sur terrain(s) contigu(s) grevée par une servitude de passage par exemple).\nL’accès doit permettre aux véhicules et/ou aux piétons de pénétrer sur le terrain et d’en sortir en toute\nsécurité.\nLa largeur de l’accès se mesure hors tout, à la jonction avec la voie.\nLorsque l’accès est prolongé par une portion de terrain (bande d’accès ou servitude de passage) permettant\nl’accès en profondeur, la largeur de l’accès doit être observée sur la totalité de la bande d’accès.\nACCROCHE ARCHITECTURALE\nL’accroche architecturale correspond à la manière dont une extension horizontale ou verticale d’une\nconstruction existante s’articule à elle, en tenant compte, notamment de ses proportions, son gabarit, son    13\nimplantation, son expression architecturale, ses matériaux, etc.\nACROTÈRE\nSitué en prolongement d’un mur de façade, un acrotère est un élément architectonique plein ou à claire-voie,\nconstituant un rebord en limite d’une toiture à faible pente ou périphérique d’une toiture-terrasse. Les\nfonctions d’un acrotère sont multiples, à la fois esthétiques (modénature, support de gardes corps, etc.) et\ntechniques (traitement des relevés d’étanchéité d’une toiture-terrasse, etc.).\nAFFOUILLEMENT DE SOL / EXHAUSSEMENT\nL’affouillement est un creusement volontaire du sol conduisant à abaisser le niveau du terrain existant, a\ncontrario de l’exhaussement qui est une surélévation volontaire du sol/du terrain existant par l'apport\ncomplémentaire de matière (remblaiement).\nAGRICULTURE URBAINE\nL’agriculture urbaine correspond à la production de légumes, de fruits et autres végétaux ainsi qu’à la mise\nen place de « petits élevages » (dans des installations de type poulaillers, clapiers ou ruches) en ville. Elle\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\n    peut être pratiquée sur des toits, dans des cours, des potagers partagés et même dans des espaces publics\n    ou en sous-sols (champignons, pisciculture, agriculture hors sol…).\n    ALIGNEMENT\n    Au sens du présent règlement, l’alignement correspond à la limite entre l’emprise publique ou la voie,\n    existante ou future, et les terrains riverains ; ou à la ligne s’y substituant pouvant résulter, par exemple, d’un\n    emplacement réservé ou d’une servitude de localisation.\n    ANNEXE\n    Voir Construction annexe.\n    ARBRE\n    Un arbre correspond à une essence arbustive plantée destinée à être d’une hauteur minimale d’environ 3\n    mètres à l’âge adulte.\n    Il peut être “à haute tige ou grand développement” ou à “moyen développement” ou à « petit\n    développement » en fonction de sa hauteur à l’âge adulte :\n    Arbre à haute tige/ grand développement : hauteur de 15 mètres minimum à l’âge adulte,\n    Arbre à moyen développement : hauteur comprise entre 8 et 15 mètres à l’âge adulte,\n14    Arbre à « petit développement » : hauteur comprise entre 3 et 8 mètres à l’âge adulte.\n    ATTIQUE\n    L’attique correspond au(x) dernier(s) niveau(x) d’une construction et constitue son couronnement. Sauf\n    mention contraire dans le règlement de zone, l’attique est édifié en retrait par rapport aux niveaux inférieurs\n    de la ou des façade(s) sur rue ou emprise publique et de la ou des façade(s) arrière ou par rapport aux deux\n    façades principales dans le cas de bâtiments ne disposant pas de façade sur rue.\n    AUTOPARTAGE\n    L’autopartage est la mise en commun d’un ou plusieurs véhicules pour les besoins des usagers de ce\n    service. Le partage concerne le véhicule en lui-même, contrairement au covoiturage, où c’est le trajet en\n    véhicule qui est partagé. Chaque abonné peut utiliser un véhicule pour le trajet de son choix et pour une\n    durée limitée. Le service d’autopartage peut être organisé par une société commerciale, une agence\n    publique, une coopérative, une association ou même un groupe de personnes. L’autopartage est justifié par\n    l’existence d’un contrat en vigueur de gestion avec une personne publique ou privée, y compris dans le cadre\n    des copropriétés. Il existe différents types d’autopartage.\n    BAIE\n    Une baie est une ouverture fermée ou non d'une façade ou d’un couronnement (arcade, fenêtre, porte,\n    loggia, etc.) permettant le passage, la vue, l’éclairage, la ventilation ou l’accès.\n    Les baies suivantes ne sont pas prises en compte pour le calcul des reculs, retraits et pour les distances\n    entre deux constructions sur un même terrain :\n    Une ouverture dans une toiture en pente n’offrant pas de vue droite (plan d’une toiture dont\n    l’inclinaison est inférieure à 45°),\n    Une ouverture située au moins à 1,90 mètre au-dessus du plancher de la pièce éclairée, hauteur\n    minimale portée à 2,60 mètres pour les rez-de-chaussée    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\n    Une ouverture à châssis fixe et à vitrage translucide\n    Une porte pleine ou translucide\n    Les ouvertures fixes en pavés ou briques de verre\n    Un porche\n    Une ouverture en sous-sol à condition que la hauteur de l’ouverture au point le plus haut soit\n    inférieure à 0,80 mètre par rapport au terrain après travaux.\nBALCON\nUn balcon est une plate-forme accessible située à un niveau de plancher au-dessus du niveau du sol, formant\nune saillie en surplomb de celui-ci, accessible depuis l’intérieur de la construction, délimitée par une\nbalustrade ou un garde-corps et permettant à au moins une personne de se tenir debout à l’extérieur de la\nconstruction. Un balcon ne constitue pas une baie.\nBANDE / BANDE E :\nUne bande Est une bande de terrain dont la profondeur est comptée perpendiculairement en tout point à\npartir de l’alignement. A Boulogne-Billancourt, Issy-les-Moulineaux et Vanves, dans le cas d’une marge de\nrecul indiquée sur le plan des prescriptions et périmètres particuliers (plans n°4.2), la profondeur de la bande\nEst comptée perpendiculairement en tout point à compter de la marge de recul.\nLa profondeur de la bande Est définie par le règlement écrit de chaque zone.\nLorsqu’un terrain est concerné par plusieurs bandes, les règles morphologiques les moins contraignantes\nsont appliquées dans la zone de chevauchement des deux bandes.\n    15\nCÉSURE\nSauf mention contraire dans les règles morphologiques, une césure correspond à une interruption du bâti\nsur toute sa hauteur (hors sous-sol) et sur toute sa profondeur.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\n    CLAIRE-VOIE (dispositif à)\n    Un dispositif à claire-voie est une partie de clôture ou d’un garde-corps/acrotère laissant passer le jour et\n    présentant alternativement des espaces vides et des espaces pleins.\n    CLÔTURE\n    Une clôture est constituée par tout type d’ouvrage (tel que mur, muret, grillage, portail, portillon) ou de\n    plantation de végétaux clôturant un terrain et servant à délimiter deux propriétés entre elles ou à délimiter\n    une propriété et une emprise publique ou une voie.\n    COEFFICIENT DE BIOTOPE SURFACIQUE\n    Le coefficient de biotope surfacique définit la part minimale d’espaces favorables à la biodiversité, au cycle\n    de l’eau et à la régulation du microclimat, exigée par rapport à la surface totale d’un terrain.\n    Ces espaces « favorables à la nature » peuvent prendre différentes formes dont les surfaces dites éco-\n    aménagées sont pondérées en fonction de leur nature, de leur contribution à la présence de nature en ville,\n    au ralentissement et la rétention des écoulements d’eau de pluie, à l’isolation thermique des constructions\n    et à la réduction des îlots de chaleur en milieu urbain.\n    Le coefficient de biotope surfacique est exprimé sous la forme d’un coefficient minimal à respecter pouvant\n    être traité en pleine terre et/ou avec les différents types d’espaces ou systèmes hors-sol (comme les toitures\n    et façades végétalisées, les espaces végétalisés sur dalle, les surfaces semi-perméables…) pris en compte\n    dans le calcul du coefficient. Le porteur de projet est libre de choisir les différents types de surfaces\n    favorables à la nature pour atteindre l’objectif réglementaire fixé.\n    COMBLES\n    Les combles constituent le volume intérieur d’une construction délimité par les pans de la toiture et le\n    plancher haut du dernier niveau droit de la construction.\n16\n    CONSTRUCTION\n    Une construction est un ouvrage fixe et pérenne, comportant ou non des fondations et générant un espace\n    utilisable par l’homme en sous-sol et/ou en surface.\n    La notion de construction recouvre notamment les constructions en surplomb et les constructions telles que\n    notamment les pergolas, les hangars, les abris de stationnement, les piscines, les terrasses, les sous-sols\n    non compris dans un bâtiment.\n    Ne sont pas considérés comme des constructions : les murs et les clôtures, ainsi que les locaux abritant les\n    installations techniques de petites dimensions (chaufferie, éoliennes, poste de transformation, canalisations,\n    pompes à chaleur, climatiseurs …).\n    Cette définition ne remet pas en cause le régime d’installation des constructions précaires et démontables,\n    et notamment celui relatif aux habitations légères de loisirs, et aux résidences mobiles de loisirs.\n    CONSTRUCTION ANNEXE\n    Une construction annexe est une construction secondaire, de dimensions réduites et inférieures à la\n    construction principale (précisées dans les règlements de zones), qui apporte un complément aux\n    fonctionnalités de la construction principale. Elle peut être accolée ou non à la construction principale avec\n    qui elle entretient un lien fonctionnel, sans disposer d’accès direct depuis la construction principale.\n    Lorsqu’elle n’est pas accolée, elle doit être implantée selon un éloignement restreint entre les deux\n    constructions afin de marquer un lien d’usage. Une annexe ne peut pas générer la création d’un logement.\n    CONSTRUCTIONS CONTIGÜES.\n    Des constructions sont contiguës lorsqu’une façade ou un pignon est directement en contact l’un avec l’autre\n    sur au moins un niveau. A titre d’exemples, des constructions seulement reliées par un élément architectural\n    tel qu’un portique, un porche, un auvent, une passerelle ou un escalier ne constituent pas des constructions\n    contiguës.    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\nCONSTRUCTION EXISTANTE\nUne construction existante est une construction régulièrement édifiée, au sens de l’article L.421-9 du Code\nde l’urbanisme, à la date d’approbation du PLUi. Une ruine ne peut pas être considérée comme une\nconstruction existante.\nUne construction, édifiée soit avant la loi du 15 juin 1943 relative au permis de construire, soit conformément\nà l’autorisation requise et obtenue à cet effet, est considérée comme légalement construite (CE. 15 mars\n2006, ministre de l’Équipement, req. N°266.238).\nUne construction existante s’entend hors édicules techniques et d’agrément.\nCOUR ANGLAISE\nPetite cour étroite décaissée en pied de façade au droit d’une fenêtre en sous-sol, en contrebas de la voie\npublique ou du niveau du sol extérieur, pour favoriser l’éclairement du sous-sol.\nCOURONNEMENT (d’une construction)\nLe couronnement d’une construction est sa partie supérieure qui la termine. Il comprend les attiques ou les\ncombles et les toitures.\nDÉBORD DE TOITURE\nLe débord d’une toiture correspond à la partie de la toiture en saillie par rapport au plan de la façade.\nDÉMOLITION\nLa démolition s’entend comme une opération de suppression ou déconstruction qui engendre :\n    • Soit la suppression totale d’une construction ou d’un ouvrage    17\n    • Soit des travaux qui ont pour effet de rendre inutilisable tout ou partie d'une construction,\n    • Soit des travaux qui entraînent une disparition partielle de la construction en portant atteinte au gros\n    œuvre.\nDESSERTE STRUCTURANTE\nSont considérées comme des points de desserte structurante les gares desservies par des lignes de\ntransports collectifs lourds : RER, trains de banlieue, métro, tramway et T Zen. Ils sont repérés sur le plan\nréglementaire 4.5. « Plan des secteurs d’application des règles de stationnement » et affectés d’un périmètre\nde 500 mètres de rayon.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\n    DESTINATIONS ET SOUS DESTINATIONS (arrêté 10 novembre 2016 modifié par arrêté\n    du 22 mars 2023)\n    SOUS\n    DESTINATIONS    Recouvrent …\n    DESTINATIONS\n    Constructions destinées à l’exercice d’une activité agricole ou\n    pastorale ; et notamment les constructions destinées au stockage\n    du matériel, des récoltes et à l'élevage des animaux ainsi que\n    Exploitation    celles nécessaires à la transformation, au conditionnement et à la\n    Exploitation    agricole    commercialisation des produits agricoles, lorsque ces activités\n    agricole et    constituent le prolongement de l'acte de production, dans les\n    forestière    conditions définies au II de l'article L. 151-11 du code de\n    l’urbanisme.\n    Exploitation    Constructions et entrepôts notamment de stockage du bois, des\n    forestière    véhicules et des machines permettant l’exploitation forestière.\n    Constructions destinées au logement principal, secondaire ou\n    occasionnel des ménages à l’exclusion des hébergements\n    couverts par la sous-destination « hébergement » ; et notamment\n    les maisons individuelles et les immeubles collectifs. Les\n    Logement    constructions édifiées ou transformées en vue de proposer un bail\n    en coliving de longue durée (bail supérieur à 3 mois) sont\n    assimilées à la sous-destination logement dès lors qu’elles ne\n    s’adressent pas à des publics spécifiques.\n    Habitation\n    Constructions destinées à l’hébergement dans des résidences ou\n    foyers avec service ; et notamment les maisons de retraite, les\n    résidences universitaires, les foyers de travailleurs et les\n    Hébergement
