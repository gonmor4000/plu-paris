Les espaces cultivés à protéger sont identifiés sur le document graphique n°4.3 Plan des protections\npatrimoniales, écologiques et paysagères et dans le Cahier des espaces écologiques et paysagers\nprotégés.\nL’édification de constructions et d’installations ainsi que la réalisation d’aménagements ou de travaux\nconcourant à l’imperméabilisation des sols y sont interdits, à l’exception :\n    ▪    Des bâtiments annexes dont l’emprise au sol est inférieure ou égale à 10 m² et la hauteur inférieure\n    ou égale à 3,20 mètres,\n    ▪    De l’installation de serres sur sol perméable,\n    223\n    ▪    De la réalisation des accès aux constructions,\n    ▪    De la réalisation d’aires de stationnement vélo non closes, avec revêtement perméable ou semi-\n    perméable,\n    ▪    Des travaux de plantations et d’aménagement concourant au maintien ou au renforcement des\n    qualités du site y compris dans le cadre d’un projet de réaménagement global,\n    ▪    Des aires de stockage des déchets végétaux et des unités de compostage.\nLes mouvements de terre seront limités aux besoins strictement nécessaires aux aménagements,\nplantations, installations et constructions autorisées.\nLes travaux autorisés ne devront pas concourir, par leur cumul, à une dénaturation des sites protégés ni à\nune réduction importante des espaces cultivables.\nCes dispositions ne s’opposent pas à la réhabilitation ou à la restauration des constructions existantes et\ndes espaces en sous-sol éventuellement présents ainsi qu’à l’aménagement de leurs accès et aux travaux\nrelatifs aux édicules techniques nécessaires à leur fonctionnement.\n4.3.4.    Parcs et jardins de pleine-terre du plan de valorisation de l'architecture et\n    du patrimoine de Marnes-la-Coquette\nLes parcs ou jardins de pleine terre, repérés sur le document graphique n°4.3 Plan des protections\npatrimoniales, écologiques et paysagères, sont conservés. L’unité des compositions paysagères\nexistantes est préservée ainsi que leur patrimoine arboré.\nCes espaces doivent demeurer en pleine terre. Aucune construction et installation n’est autorisée à\nl’exception de serres horticoles, gloriettes, structures légères, remises à bois ou abris de jardin.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    4. Nature et biodiversité\n    Une attention particulière est portée à la préservation de la qualité paysagère d’ensemble et les éléments\n    anciens de composition sont préservés. Les serres horticoles, gloriettes, structures légères, remises à bois\n    ou abris de jardin s’intègrent à leur environnement et ne dénaturent pas la qualité de l’ensemble paysager.\n    Leur volumétrie s’intègre discrètement dans la composition paysagère existante. Les teintes et les matériaux\n    mis en œuvre sont en accord avec la qualité des lieux et en cohérence avec l’environnement proche.\n    Concernant les abords des rues Yves Cariou et Georges et Xavier Schlumberger, les espaces référencés\n    en parcs ou jardins de pleine terre au document graphique, permettent la conservation d’une frange arborée\n    riche et continue le long de ces axes routiers. Les plantations arborées existantes sont entretenues et\n    préservées, leur enrichissement ou replantation est recherché et la replantation des arbres sénescents est\n    anticipée.\n    4.3.5.    Continuités paysagères et passages\n    Les continuités paysagères et passages sont identifiés sur le document graphique n°4.3 Plan des\n    protections patrimoniales, écologiques et paysagères.\n    Des passages, d’une largeur d’environ 10 mètres en zone U1-A-3, de 19 mètres en zone U4-D-2 et de 6\n    mètres minimum dans les autres zones, permettant de relier deux voies ou emprises publiques sont\n    aménagés ou créés. Les espaces publics reliés sont précisés sur les documents graphiques.\n    Si leur position au sein du terrain peut varier, la continuité visuelle de ces passages doit être préservée à\n    travers les différentes unités foncières.\n    Aucune construction n’est autorisée sur ces voies privées piétonnes. Dans la bande E ces passages peuvent\n    être aménagés sous porche d’une hauteur minimale de 5 mètres. Leur traitement doit rendre possible le\n    passage à travers l’îlot.\n    4.3.6.    Alignements d’arbres\n224   Les alignements d’arbres sont identifiés sur le document graphique n°4.3 Plan des protections\n    patrimoniales, écologiques et paysagères.\n    L’abattage d’un ou plusieurs arbres est interdit sauf dans les cas où il est rendu nécessaire pour des motifs\n    justifiés de sécurité publique, pour des raisons phytosanitaires, pour des motifs d’intérêt général ou lorsque\n    l’esthétique de la composition ne peut plus être assurée et que le maintien de la biodiversité peut être\n    obtenue par d’autres mesures.\n    L’abattage d’un arbre doit être compensé au sein ou dans le prolongement de l’alignement par la plantation\n    d’un arbre d’essence identique (abattage pour des motifs de sécurité publique ou d’intérêt général) ou\n    d’essences locales (abattage pour des motifs phytosanitaires). La réalisation d’une fosse unique doit être\n    privilégiée lors de la réalisation d’un alignement d’arbres ainsi que dans le cas d’une plantation de\n    compensation, sauf impossibilité technique démontrée.\n    En cas d’abattage sur un terrain rendu nécessaire pour la réalisation d’un projet déclaré d’intérêt général, la\n    plantation de compensation pourra s’effectuer sur le terrain d’assiette du projet concerné, si la plantation au\n    sein ou dans le prolongement de l’alignement n’est pas possible.\n    Les individus atteints de vieillissement ou de maladie qui nuisent à la qualité d'ensemble peuvent être\n    remplacés par une autre essence, adaptée aux contraintes du site.\n    L’arbre replanté doit avoir un port similaire à celui abattu. Le port correspond à la forme naturelle de l’arbre.\n    A la plantation, ils devront présenter une circonférence minimum (mesurée à 1m du sol) de 18 à 20 cm. Les\n    fosses de plantation devront présenter un volume suffisant pour garantir le bon développement de l’arbre (8\n    m3 minimum) ou avoir les dimensions minimales de terre de 2 mètres X 2 mètres X 2 mètres (L x l x\n    profondeur).\n    De nouveaux alignements peuvent être créés, en complément ou en substitution d'alignements d'arbres\n    existants, pour participer à la composition de l'espace public ou accompagner une perspective.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    4. Nature et biodiversité\n4.4. Traitement environnemental et paysager des espaces non\n    bâtis et des abords des constructions\n4.4.1.    Espaces libres\n    Règles générales\nLes espaces libres doivent être aménagés selon une composition paysagère soignée, adaptée à l’échelle du\nterrain et aux lieux environnants. Cette composition privilégiera la contiguïté avec les espaces libres des\nterrains voisins et doit participer à l’amélioration du cadre de vie et, le cas échéant, à la gestion de l’eau\npluviale.\nSelon leur nature ou leur vocation (espaces de circulation, jardins, terrasses…), leur traitement doit être\napproprié à leur fonction en tenant compte :\n    ▪    De l’organisation du bâti sur le terrain afin qu’ils soient conçus comme un accompagnement des\n    constructions ;\n    ▪    De la composition des espaces libres voisins, afin de participer à une mise en valeur globale ;\n    ▪    De la topographie, de la nature du sol et de la configuration du terrain afin que leur conception soit\n    adaptée à la nature du terrain, notamment pour répondre à des problématiques de ruissellement et\n    d’aménagement paysagé de qualité.\nLa végétalisation des espaces verts doit être conçue, tant au regard de leur composition que des espèces\net de la densité des plantations, en proportion avec la dimension de l’espace aménagé, en harmonie avec\nla construction en prenant en compte leur développement dans le temps et leur pérennité.\n    Règles complémentaires pour les secteurs de plan masse\n    Secteurs    Règles applicables\n    225\n    Les espaces libres privés sur dalle situés à l'intérieur des îlots de constructions\n    en superstructure devront comporter un minimum de 60 % d'espaces verts.\n   U1-A-3 (ZAC    À moins d'utiliser des techniques de sols artificiels, ces espaces verts devront\n   Centre-ville)    comporter (non comprise l'épaisseur des couches drainantes et de protection)\n    une épaisseur de terre végétale au minimum égale à 0,30 m pour le gazon, 0,60\n    m pour les arbustes, 1,00 à 1,80 m pour les arbres à grand développement.\n    L'aménagement des espaces libres doit être conforme aux dispositions de la\n    planche graphique.\n    Au moins 80% des espaces libres doivent être aménagés dans le respect du\n    terrain naturel existant, soit sans effectuer de déblais supérieurs à 0,5 m, ni de\n   U3-C-1    remblais supérieurs à 0,5 m. Pour les espaces libres inférieurs à 50m², aucun\n    décaissé ne sera autorisé.\n    Les projets de construction ou de réhabilitation doivent permettre une\n    conservation maximale des plantations et des jardins existants.\n    Au moins 15% de la surface du terrain doivent être aménagés en surface éco-\n   U3-C-5    aménagées, en plus des 15% d’espaces de pleine terre.\n    Pour les secteurs rue Marcelin Berthelot, rue Raphaël et rue Murillo, côté impair\n    villa Juliette de Wills : au moins 40% des espaces libres doivent être traités en\n    espaces verts.\n   U3-C-12\n    Pour les avenue Victor Hugo et villa Lucien, villa Dupont, villa d’Arcueil et côté\n    pair villa Juliette de Wills : au moins 50% des espaces libres doivent être traités\n    en espaces verts.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    4. Nature et biodiversité\n    Pour les secteurs villa Jeanne et villa Quincy : au moins 80% des espaces libres\n    doivent être traités en espaces verts, à l’exception des parcelles cadastrales\n    n°57 et 58 de la villa Quincy où il n’est pas fixé de règle.\n    Les surfaces traitées en espace vert doivent être conformes à celles définies au\n    plan.\n    Secteurs de plan\n    masse de    Le taux d’espace vert est réduit de moitié, ainsi que le nombre d’arbres à planter\n    Meudon    pour les constructions, aménagements et installations nécessaires aux\n    équipements d’intérêt collectif et services publics.\n    4.4.2.    Plantations\n    Règles générales\n    Les plantations de haute tige existantes sur le terrain doivent être maintenues en bon état de conservation.\n    L’abattage d’arbre(s) n’est autorisé que s’il est indispensable :\n    ▪    Pour des raisons phytosanitaires ou de sécurité,\n    ▪    À la réalisation de travaux poursuivant un objectif d’intérêt général,\n    ▪    À l’implantation des constructions,\n    ▪    À l’établissement d’un accès, si aucune autre solution n’est envisageable.\n    En toute zone, tout arbre abattu doit être remplacé par un arbre de même qualité paysagère suivant les\n    normes définies pour les nouvelles plantations.\n    A la plantation, les arbres devront présenter une circonférence minimum (mesurée à 1 mètre du sol) de 18\n226   à 20 cm ou une hauteur minimale de 2,40 mètres depuis le collet.\n    Le plan de plantation privilégiera la pleine-terre et permettra un développement optimal des houppiers en\n    respectant une distance adaptée entre les arbres et vis-à-vis des constructions.\n    Les éventuelles fosses de plantation devront présenter un volume suffisant pour garantir le bon\n    développement de l’arbre (8 m3 minimum) ou avoir les dimensions minimales de 2 mètres X 2 mètres X 2\n    mètres (L x l x profondeur). Les fosses continues seront privilégiées. Pour les locaux techniques et industriels\n    des administrations publiques et assimilées, le volume et la dimension des fosses de plantation peuvent être\n    inférieurs.\n    Les essences choisies seront adaptées au climat, de préférence locales en évitant les espèces exotiques à\n    caractère invasif et celles à fort potentiel allergène. Dans les secteurs inondables ou humides les essences\n    choisies seront adaptées au milieu et présenteront, le cas échéant, une bonne tolérance à l’immersion\n    prolongée.\n    Outre la strate arborée, la plantation d’arbustes, de buissons et d’herbacées est requise pour un couvert\n    végétal multistrate.\n    Pour chaque terrain situé en zone urbaine, il est exigé la présence d’arbre(s) à moyen ou grand\n    développement dans les proportions indiquées dans le tableau ci-après. Cette présence des arbres peut être\n    assurée par conservation d’arbres déjà présents sur le terrain ou par plantation de nouveaux sujets. Les\n    zones affectées de servitudes non sylvandi ou par toute autre servitude ou contrainte particulière interdisant\n    la plantation d’arbres sont exclues de l’assiette de calcul des espaces libres.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    4. Nature et biodiversité\n   Zones/secteurs    Règles applicables\n   Zones U1 / U2 /\n   U3 / U4\n    à l’exception    ▪   1 arbre pour 100 m² d’espace libre*\n    des sous-\n    secteurs ci-\n    dessous\n   U1-A-2    ▪   1 arbre pour 75 m² d’espace libre*\n   U1-G-1 / U3-C-1    ▪   Non réglementé\n   U4-D-4    ▪   1 arbre pour 50 m² d’espace libre*\n    ▪   1 arbre pour 200 m² d’espace libre*\n   Zones U5 / U6    ▪   Non réglementé pour les constructions à destination d’équipements\n    sportifs\n*Seules les tranches complètes sont prises en compte.\n    227\nDans le cas de travaux de restauration, de réhabilitation, de rénovation sans extension horizontale ou\nverticale, de constructions existantes, sur des terrains et constructions non-conformes à ces dispositions, les\nprojets ne devront pas conduire à aggraver un éventuel déficit.\nEn sous-secteur U3-C-2, dans le cas d’abattage d’un pin de Corse laricio, la replantation d’un sujet de\nmême essence est exigée.\n4.5. Lisières forestières\nDans les lisières identifiées sur le document graphique n°4.3 Plan des protections patrimoniales,\nécologiques et paysagères, l’édification de toute construction et installation et la réalisation\nd’aménagements sont interdites, à l’exception :\n    ▪    Des travaux de rénovation, de réhabilitation et de restauration des constructions existantes\n    ▪    Des travaux d’extension verticale sur une construction existante.\n    ▪    Des travaux de construction dans la limite de l’emprise au sol initiale maximale d’une ruine ou d’une\n    construction existante après sa démolition ou sa destruction après sinistre,\n    ▪    Des clôtures poreuses réalisées en structure à large maille (15 cmX15 cm), sans muret,\n    ▪    Des travaux de plantations et des aménagements concourant à la désimperméabilisation des sols\n    ou à leur renaturation.\n    ▪    Des constructions, travaux et aménagements prévus par un STECAL.\nRemarque : Les orientations de l’OAP Continuités écologiques s’appliquent également.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    4. Nature et biodiversité\n    4.6. Emplacements réservés aux espaces verts et continuités\n    écologiques\n    En application de l’article L 151-41 du Code de l’urbanisme, le PLUi délimite des emplacements réservés en\n    vue de la réalisation d’espaces verts et d’espaces nécessaires aux continuités écologiques.\n    Les emplacements réservés sont identifiés et délimités sur le document graphique n°4.3 Plan des\n    protections patrimoniales, écologiques et paysagères. La liste des emplacements réservés est jointe en\n    annexe du règlement et figure sur les documents graphiques. Elle précise les collectivités, services et\n    organismes publics bénéficiaires.\n    4.7. Espaces boisés classés\n    Les espaces boisés classés délimités sur le document graphique n°4.3 Plan des protections\n    patrimoniales, écologiques et paysagères sont soumis aux dispositions des articles L 113-1 et suivants\n    du Code de l’urbanisme. Le classement interdit tout changement d'affectation ou tout mode d'occupation du\n    sol de nature à compromettre la conservation, la protection ou la création des boisements et entraîne, sauf\n    exception, le rejet de plein droit de la demande d'autorisation de défrichement prévue au chapitre Ier du titre\n    IV du livre III du code forestier.\n228\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","5. Qualité urbaine, architecturale, énergétique et environnementale des constructions\n    5. Qualité urbaine,\n    architecturale,\n    énergétique et\n    environnementale\n    des constructions\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    5. Qualité urbaine, architecturale, énergétique et environnementale des constructions\n    5.1. Aspect extérieur\n    Sauf mention contraire inscrite au règlement écrit et graphique et dans le cahier des plans de masse, les\n    règles suivantes s’appliquent à l’ensemble des zones urbaines et naturelles couvertes par le PLUi, à\n    l’exception du périmètre du Site Patrimonial Remarquable de Marnes-la-Coquette pour lequel les\n    dispositions du Plan de Valorisation de l’Architecture et du Patrimoine s’appliquent.\n    5.1.1.    Mise en valeur de l’espace urbain\n    ▪    Le projet peut être refusé ou n'être accepté que sous réserve de l'observation de prescriptions\n    spéciales si les constructions, par leur situation, leur architecture, leurs dimensions ou l'aspect\n    extérieur des bâtiments ou ouvrages à édifier ou à modifier, sont de nature à porter atteinte au\n    caractère ou à l'intérêt des lieux avoisinants, aux sites, aux paysages naturels ou urbains ainsi qu'à\n    la conservation des perspectives monumentales.\n    ▪    L’implantation des constructions et des installations ne doit pas induire d’effet de masque, occultant\n    la vue sur la Seine de façon continue depuis l’espace public ouvert tel que places, placettes,\n    terrasses offrant une vue sur la Seine.\n    ▪    Le nombre de portes de garage sur rue doit être limité et s’apprécie en fonction du linéaire de façade\n    et du programme en cohérence avec l’OAP mobilité et espace public.\n    ▪    Les postes de transformation électriques, les postes de détente de gaz, les grilles de ventilation et\n    de prise d’air, doivent s’intégrer à la construction principale ou à la clôture et être traités en harmonie\n    avec la construction, notamment en prenant en compte les matériaux et les couleurs de ces\n    constructions. Les constructions à destination de locaux techniques et industriels des administrations\n    publiques et assimilés et les installations qui leur sont nécessaires qui bénéficient des règles\n    particulières mettront en œuvre une bonne intégration paysagère, architecturale et urbaine avec le\n    bâti existant environnant. Leur intégration paysagère et architecturale devra être mise en œuvre au\n230    regard du contexte urbain et paysager environnant en tenant compte du relief, des formes urbaines\n    présentes ainsi que des perspectives visuelles lointaines au sein desquelles ils s’inscrivent. Leur\n    impact sur l’ensoleillement des constructions voisines devra être limité.\n    ▪    Les aires de stockage et de dépôts, les citernes de gaz liquéfié ou à mazout, les containers à déchets\n    et de collecte sélective, et toutes autres installations techniques non adjacentes à la construction\n    principale, ainsi que les infrastructures de type pylônes, mâts ou antennes, doivent être réalisées\n    dans le respect de l’environnement, de la qualité esthétique des lieux et garantir une bonne insertion\n    paysagère que ce soit depuis le domaine public ou privé.\n    ▪    Le traitement des constructions annexes, garages, extensions, doit être en harmonie avec la\n    construction principale, tant par le choix des matériaux que par la qualité de finition et l’accroche\n    architecturale pour les extensions horizontales et verticales. En particulier, les ouvrages de\n    ventilation des parcs de stationnement doivent faire l'objet d'un traitement architectural soigné.\n    5.1.2.    Aspect des façades commerciales\n    ▪    D’une manière générale, l’implantation ou la restauration d’une unité commerciale doit respecter la\n    composition d’ensemble de la construction :\n    ▪    En cas de regroupement de deux ou plusieurs locaux commerciaux de bâtiments différents, la mise\n    en œuvre des devantures ne doit pas altérer les lignes verticales marquant la limite séparative ou la\n    trame parcellaire.\n    ▪    La devanture d’un local commercial ne doit pas altérer les lignes horizontales marquant la séparation\n    des étages.\n    ▪    Lors de l’installation de rideaux métalliques, les caissons doivent être intégrés dans le gros œuvre\n    et ne pas présenter de saillie en façade. En cas de modification de façade ou d’enseigne, les\n    situations existantes ne respectant pas cette règle devront faire l’objet d’une régularisation.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    5. Qualité urbaine, architecturale, énergétique et environnementale des constructions\n5.1.3.    Aspect des matériaux\n   ▪    Les matériaux employés doivent contribuer à l'expression architecturale des constructions à édifier.\n    Ils doivent être choisis en vue de garantir leur robustesse et leur pérennité.\n   ▪    L’emploi à nu des matériaux destinés à être recouverts est interdit, sauf s’ils s’intègrent dans une\n    composition architecturale d’ensemble.\n   ▪    Lors du ravalement des façades des constructions existantes, les modénatures devront être\n    maintenues ou reproduites à l’identique. Les matériaux utilisés seront en harmonie avec le caractère\n    de la construction existante. Les revêtements ayant l’aspect du ciment brut ainsi que la peinture de\n    la pierre de taille et des meulières sont interdits.\n   ▪    La tonalité des enduits, des fenêtres, des volets et des clôtures sera choisie en référence, lorsqu’elle\n    existe, à la charte des couleurs de la commune.\n   ▪    Pour les constructions à édifier, les couvertures de toiture ondulées ou d’aspect ondulé, et d’aspect\n    papier goudronné sont interdites.\n   ▪    A l’exception des constructions à sous-destination de locaux techniques et industriels des\n    administrations publiques et assimilés, en toiture, les matériaux ne devront pas avoir d’effet brillant\n    ou éblouissant. Les panneaux solaires ne sont pas considérés comme brillants ou éblouissants.\n5.1.4.    Pignons et façades\n   ▪    L’ensemble des façades et les pignons doivent être traités avec le même soin que les façades\n    principales.\n   ▪    Les décrochés de façade resteront l’exception.\n   ▪    Les façades sur rues doivent être percées de baies.\n   ▪    Les dispositifs de type climatiseurs et unités de pompe à chaleur doivent être non visibles depuis les    231\n    voies. Ces dispositifs prendront place sur les façades arrières ou latérales et devront être encastrés\n    ou masqués par un dispositif en harmonie avec l’architecture de la construction. Ces dispositions ne\n    s’appliquent pas aux constructions à sous-destination de locaux techniques et industriels des\n    administrations publiques et assimilés, dès lors qu’une intégration architecturale et/ou paysagère est\n    mise en œuvre.\n   ▪    Les descentes d'eaux pluviales devront être intégrées à la composition architecturale des façades.\n    Des dispositifs techniques et architecturaux (corniches, modénatures...) doivent permettre de\n    canaliser le ruissellement des eaux pluviales. Les rejets d'eaux pluviales de balcons, loggias ou\n    terrasses devront être canalisés de façon à éviter toutes salissures des façades. Les équipements\n    de rejet d’eau à l’air libre sont interdits sur les façades à l’alignement.\n   ▪    Les sous-faces des ouvrages en saillie ou en renfoncement (débords, passages sous porches,\n    balcons...) auront une finition soignée, en harmonie avec le reste de la façade.\n   ▪    Les coffres de stores ou de volets roulants saillants par rapport au nu de la façade ou visibles depuis\n    l’extérieur sont interdits.\n   ▪    Les gardes corps des balcons et terrasses à usage d’habitation disposeront d’une opacité partielle\n    ou totale suffisante permettant d’éviter la pose ultérieure de dispositifs individuels occultant.\n   ▪    Les travaux d’isolation thermique par l’extérieur devront proposer un dispositif qui confère une qualité\n    architecturale à la construction et qui assure son intégration paysagère.\nSecteur U3-C à Marnes-la-Coquette, en complément des dispositions précédentes :\n   ▪    Les différents murs d’une construction doivent présenter un aspect harmonieux et agréable par\n    rapport au paysage naturel ou urbain dans lequel ils s’insèrent.\n   ▪    L’emploi sans enduit de matériaux tels que carreaux de plâtre, ainsi que les imitations de matériaux\n    sont interdits.\n   ▪    Les façades doivent être constituées :\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    5. Qualité urbaine, architecturale, énergétique et environnementale des constructions\n    o   Soit de matériaux bruts (à condition que ce ne soit pas des matériaux destinés à être\n    recouverts),\n    o   Soit d’enduits lisses ou à grains fins,\n    o   Soit de matériaux revêtus d’un enduit taloché.\n    ▪    Les enduits seront de ton clair, légèrement coloré.\n    5.1.5.    Toitures\n    ▪    Le traitement des toitures doit être de qualité, y compris pour les constructions et installations de\n    petite hauteur. Un souci d'harmonie avec les constructions environnantes doit guider le choix du\n    profil de couronnement. Tout édicule en toiture doit faire l'objet d'un traitement architectural soigné\n    permettant sa bonne intégration paysagère.\n    ▪    Les réseaux techniques en toiture terrasse doivent être masqués par l’intermédiaire d’un traitement\n    architectural en harmonie avec le caractère de la construction.\n    ▪    Les toitures à combles brisés ou cintrés sont uniquement admises pour des bâtiments de 3 niveaux\n    au minimum. Elles doivent respecter une pente de 80° maximum pour le brisis et de 15° minimum\n    pour le terrasson. Les brisis en saillie sont interdits.\n    ▪    Les garde-corps de sécurité doivent être les plus discrets possible, par relèvement de l’acrotère ou\n    avec un dispositif transparent ou en partie ajouré. Ils sont implantés en retrait des façades si le\n    garde-corps n’est pas constitué par le relèvement de l’acrotère.\n    ▪    Les dispositifs de production d’énergie renouvelable et installations techniques doivent s’intégrer à\n    la composition architecturale et à la composition paysagère du projet. Un retrait d’au minimum 0,50\n    mètre par rapport aux extrémités des toitures est exigé. L’installation de dispositifs de production\n    d’énergie solaire doit rechercher une implantation groupée en dessous de la ligne médiane des\n    toitures en pente.\n232    ▪    Les antennes, paraboliques ou autres, doivent être installées en toiture, en retrait de minimum 2\n    mètres des façades.\n    Zone U3 à Chaville :\n    ▪    À l’exception du sous-secteur U3-C-3, dans le cas de toitures composées d’un ou plusieurs\n    éléments en pente, un angle compris entre 30 degrés et 60 degrés, compté par rapport à\n    l’horizontale, est obligatoire.\n    ▪    Dans le sous-secteur U3-C-3, les constructions doivent comporter obligatoirement une toiture\n    composée d’un ou plusieurs éléments à pente dont le degré de pente sera compris entre 17 degrés\n    et 35 degrés compté par rapport à l’horizontale. Les toitures terrasses sont interdites, sauf pour les\n    constructions présentant uniquement un niveau de rez-de-chaussée.\n    Sous-secteurs U3-C-6, U3-C-8 et U3-C-9 à Marnes-la-Coquette :\n    ▪    Les constructions doivent comporter obligatoirement une toiture composée d’un ou plusieurs\n    éléments à pente dont le degré de pente sera compris entre 30 degrés et 45 degrés pour la tuile, et\n    45 degrés à 60 degrés pour l’ardoise. Dans le cas où une construction principale existante\n    présenterait une toiture qui ne respecterait pas cette règle, les toitures des extensions à cette\n    construction pourront présenter un profil similaire à cette dernière.\n    ▪    Les combles et toitures doivent présenter une simplicité de volume et une unité de conception.\n    ▪    L’aspect des toitures doit être en harmonie avec celui des constructions environnantes, elles doivent\n    avoir l’aspect de l’ardoise ou de la tuile de tonalité brune sans côte apparente. L’aspect zinc est\n    autorisé pour des éléments ponctuels de couverture.\n    ▪    Les constructions annexes isolées de faible dimension, notamment les garages, ainsi que les\n    extensions modérées (représentant un agrandissement de la construction principale dans la limite\n    de 20% de la Surface de plancher existante à la date d’application du présent règlement) des\n    constructions existantes ne sont pas soumis aux dispositions de l’alinéa précédent. Elles sont\n    autorisées à comporter une toiture terrasse ou à faible pente accompagnée d’un acrotère.\n    ▪    Les souches de cheminée doivent être situées près du faîtage.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    5. Qualité urbaine, architecturale, énergétique et environnementale des constructions\nSous-secteur U3-C-7 à Marnes-la-Coquette :\n    ▪    Les toitures des constructions doivent avoir un aspect autre que celui du bardeau d’asphalte, de la\n    tôle ondulée ou du papier goudronné.\n    ▪    Les ouvertures en toiture doivent prendre la forme de lucarnes dont le volume doit respecter les\n    proportions de la toiture, ou de châssis situés dans le plan du toit.\n    ▪    Les souches de cheminée doivent rester proches du faîtage.\n5.1.6.    Clôtures\nA l’exception des zones naturelles :\n    ▪    Les clôtures doivent se rattacher de manière explicite à l’architecture du bâtiment dont elles\n    délimitent la parcelle et s’insérer harmonieusement dans la séquence urbaine qu’elles intègrent.\n    ▪    La conception des clôtures doit prendre en compte la nécessité d'assurer une continuité écologique\n    avec les espaces libres voisins et avec l’espace public. Sauf impossibilité technique, elles doivent\n    permettre ponctuellement le passage de la petite faune, en présentant a minima une ouverture\n    ponctuelle en bas de clôture de format 15 cm x 15 cm, par tranche entamée de 20 m de linéaire de\n    clôture.\n    ▪    À l’exception des poteaux dont la hauteur est limitée à 2,5 mètres, la hauteur totale moyenne des\n    clôtures, portails et portillons est limitée à 2 mètres comptés à partir du niveau de référence. La\n    hauteur des grilles de porches n’est pas règlementée. Dans le secteur U5-B, la hauteur des clôtures\n    peut être portée à 3,20 mètres au maximum.\n    233\n    ▪    Les clôtures implantées en limite d’emprise publique ou de voie doivent être composées soit :\n    o   d’un ensemble homogène constitué d’un mur bahut d’une hauteur maximale de 1,10\n    mètre, surmonté d’un élément ajouré sur au moins 50% de sa surface ;\n    o   d’éléments ajourés sur au moins 50% de sa surface, doublés ou non de haies vives ;\n    o   d’une haie vive.\n    ▪    Les coffrets type coffret de comptage, boîtes à lettres, doivent être soigneusement intégrés à ces\n    clôtures.\n    ▪    La hauteur et la composition des clôtures pour les équipements d’intérêt collectif et services publics\n    ainsi que pour les parcs et jardins publics n’est pas règlementée.\n    ▪    L’entretien et la restauration des murs existants en maçonnerie d’une hauteur supérieure à 2 mètres\n    sont autorisés.\n    ▪    Dans le cas de constructions implantées en recul de l’alignement, l’espace compris entre la\n    construction et l’alignement doit être traité de façon à participer à la composition et à l’animation du\n    paysage urbain et aux fonctionnalités du bâtiment, en cohérence avec les orientations de l’OAP\n    mobilité et espace public.\n    ▪    En cas de modification portant sur moins de la moitié d’une clôture existante, la partie modifiée peut\n    conserver les caractéristiques de la partie non modifiée.\n    ▪    S’agissant des clôtures pour des activités soumises à des règles de sécurité particulières, la nature\n    la hauteur, l’aspect et les modalités de réalisation des clôtures peuvent être adaptés.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    5. Qualité urbaine, architecturale, énergétique et environnementale des constructions\n    Sous-secteur U3-C-4 à Chaville :\n    ▪   En front de rue comme en limites séparatives, la hauteur totale des clôtures est limitée à 2,30 mètres.\n    ▪   En front de rue, les clôtures seront constituées d’un mur bahut d’une hauteur comprise entre 0,50\n    mètre et 0,80 mètre et rehaussé d’une grille ou d’un treillage en bois ou en fer. Ces murs bahuts\n    devront cependant être semi-perméables pour permettre le passage de la petite faune.\n    ▪   En limite séparative, elles seront constituées soit par un mur, soit par un palis. Ces murs bahuts\n    devront cependant être semi-perméables pour permettre le passage de la petite faune.\n    Sous-secteurs U3-C-6, U3-C-8 et U3-C-9 à Marnes-la-Coquette :\n    ▪   La hauteur totale des clôtures est limitée à 2,50 mètres.\n    ▪   Les clôtures implantées en limite d’emprise publique ou de voie doivent être constituées d’un mur\n    bahut d’une hauteur comprise entre 0,30 mètre et 0,80 mètre, et d’un élément ajouré sur environs\n    80% de sa surface.\n    ▪   Les clôtures implantées en limite séparative doivent respecter les continuités paysagères des jardins\n    par la plantation de haies vives doublées d’une grille.\n    ▪   En bordure de l’étang du Fer à Cheval, afin de respecter la continuité paysagère, les clôtures devront\n    être constituées de grilles et être limitées à une hauteur totale égale à 1,20 mètre. Cette clôture doit\n    être doublée d’une haie vive limitée à une hauteur de 1,20 mètre.\n    ▪   Les clôtures présentant l’aspect de matériaux précaires ou imitant des matériaux naturels sont\n    interdites.\n    ▪   Les clôtures en bordure des boulevards de Jardy et de la République peuvent être aménagées et\n    restaurées en prenant en compte les nuisances de bruit et la sécurité tout en respectant le caractère\n    et l’harmonie de leur environnement.\n    Sous-secteur U3-C-7 à Marnes-la-Coquette :\n234\n    ▪   Les clôtures doivent être conçues de manière à s’harmoniser avec l’environnement architectural et\n    paysager.\n    ▪   Les clôtures sur les avenues et les clôtures intérieures devront être établies à l’aide d’un mur bahut\n    ayant au plus un mètre de hauteur surmonté d’une grille ou d’un treillage. Elles pourront également\n    être faites d’un palis ou d’un grillage ayant au moins un mètre vingt-cinq de hauteur, doublé, pour\n    les clôtures sur les avenues, d’une haie vive en charmille plantée à l’extérieur des propriétés.\n    ▪   Les clôtures ceinturant le Parc privé, sur voies publiques comme sur les bois, ne doivent pas\n    dépasser une hauteur de deux mètres cinquante mesurée de l’extérieur. Toutefois, les murs\n    existants antérieurement au 31 décembre 1990 et non conformes à cette disposition pourront être\n    restaurés ou reconstruits en l’état.\n    Sous-secteur U3-C-13\n    ▪   La hauteur totale des clôtures est limitée à 2 mètres.\n    ▪   Les clôtures implantées en limite d’emprise publique ou de voie devront être composées d’un mur\n    bahut d’une hauteur maximale égale à 1 mètre et d’une grille.\n    ▪   Les clôtures implantées sur la rue de Sèvres et le chemin de la Côte d’Argent devront être\n    composées d’un mur bahut d’une hauteur maximale de 1,30 mètre et d’un élément ajouré sur\n    environs 80% de sa surface.\n    Sous-secteur U3-C-14\n    ▪   La hauteur totale des clôtures est limitée à 1,40 mètre.\n    ▪   Les clôtures devront être composées d’éléments ajourés de type grillage métallique à croisillons.\n    Sous-secteur U3-C-15\n    ▪   Les terrains doivent être clos à la limite des voies publiques ou privées. Les clôtures doivent être\n    constituées soit d'une grille, soit d'un mur-bahut et d'une grille, la hauteur du mur-bahut ne pouvant\n    excéder 0,60 mètre.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    5. Qualité urbaine, architecturale, énergétique et environnementale des constructions\nSous-secteur U4-D-3\n    ▪    Les clôtures devront être végétalisées.\nZones naturelles, à l’exception des secteurs Np\nLes clôtures permettent en tout temps la libre circulation des animaux sauvages, conformément aux\ndispositions du code de l’environnement.\n5.1.7.    Soubassements\n    ▪    À Boulogne-Billancourt, les façades du rez-de-chaussée situées sur les voies mentionnées ci-après\n    devront être principalement traitées en vitrine :\n    o   Boulevard Jean-Jaurès,\n    o   Avenue Édouard Vaillant,\n    o   Avenue du Général Leclerc,\n    o   Route de la Reine,\n    o   Avenue André Morizet entre Marcel Sembat et rue de Billancourt,\n    o   Boulevard de la République entre Marcel Sembat et rue Thiers,\n    o   Place Jules Guesde,\n    o   Place Bir Hakeim.\n    235\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    5. Qualité urbaine, architecturale, énergétique et environnementale des constructions\n    5.2. Performance énergétique et environnementale\n    5.2.1.    Hauteur complémentaire pour certaines constructions\n    Nonobstant les règles de hauteur du chapitre 3, les constructions existantes au sein des zones urbaines,\n    hors zone U3, sont autorisées à mobiliser une hauteur complémentaire à leur hauteur existante dans le\n    respect des règles, conditions et limites suivantes :\n    Hauteur complémentaire :\n    ▪    2 niveaux ou 6 mètres pour les constructions existantes atteignant au moins 4 niveaux (R+3) ou 12\n    mètres sur la majorité de leur volume.\n    Conditions :\n    ▪    La surface de plancher supplémentaire générée par la hauteur complémentaire est affectée à la\n    destination habitation,\n    ▪    La totalité de la partie existante de la construction fait l’objet d’un projet de rénovation énergétique\n    lui permettant de franchir au minimum une classe au titre du diagnostic de performance énergétique,\n    et d’atteindre au minimum le niveau C.\n    ▪    Une bonne intégration paysagère, architecturale et urbaine avec le bâti existant environnant est\n    exigée. L’intégration paysagère et architecturale devra être mise en œuvre au regard du contexte\n    urbain et paysager environnant en tenant compte du relief, des formes urbaines présentes ainsi que\n    des perspectives visuelles lointaines au sein desquelles les projets s’inscrivent. L’impact sur\n    l’ensoleillement des constructions voisines devra être limité.\n    Limites :\n    Cette hauteur complémentaire n’est pas mobilisable :\n    ▪    Dans les zones à règle de hauteur spécifique et dans les zones à hauteur contrainte indiquées sur\n236    le document graphique n°4.2 Plan des prescriptions et périmètres particuliers,\n    ▪    En zone U3,\n    ▪    Hors bande E à Boulogne-Billancourt,\n    ▪    Au sein du périmètre du site patrimonial remarquable à Marnes-la-Coquette\n    A Chaville, la mobilisation de la hauteur complémentaire ne doit pas conduire à dépasser R+7.\n    A Sèvres, la mobilisation de la hauteur complémentaire ne doit pas conduire à dépasser une hauteur de\n    R+7 portée à R+8 en secteur U1-F-2.\n    5.2.2.    Emprise au sol complémentaire pour certaines constructions\n    Dans les secteurs des zones urbaines concernés par une zone à hauteur contrainte, le taux réglementaire\n    d’emprise au sol maximale des constructions est augmenté de 10 points, nonobstant le taux de pleine terre\n    réglementaire, dans le respect des conditions et limites suivantes :\n    Conditions :\n    ▪    Une partie des constructions existantes implantées sur le terrain atteignent 4 niveaux (R+3),\n    ▪    La surface de plancher supplémentaire générée par l’emprise au sol complémentaire est affectée à\n    la destination habitation,\n    ▪    La totalité des constructions existantes implantées sur le terrain fait l’objet d’un projet de rénovation\n    énergétique lui permettant de franchir au minimum une classe au titre du diagnostic de performance\n    énergétique, et d’atteindre au minimum le niveau C.\n    Limites :\n    ▪    Le taux de pleine terre réglementaire ne peut être diminué de plus de 5 points.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    5. Qualité urbaine, architecturale, énergétique et environnementale des constructions\n5.3. Fonctionnalisation des toitures\nLes toitures-terrasses des nouvelles constructions et des rénovations, d’une emprise au sol supérieure ou\négale à 300 m² sont fonctionnalisées sur au moins 50% de leur superficie. La proportion s’apprécie à l’échelle\nde la construction y compris pour les constructions présentant plusieurs toitures distinctes.\nCette fonctionnalisation répond à une ou plusieurs fonctions ou usages parmi les suivants :\n    ▪   Végétalisation,\n    ▪   Agriculture urbaine,\n    ▪   Dispositif(s) en faveur des énergies renouvelables,\n    ▪   Espaces communs ou privatifs de confort ou d’agrément : terrasses, aires de jeux, etc.\nLes accès aux toitures sont adaptés à leur(s) usage(s).\nLes constructions à sous destination des locaux techniques et industriels des administrations publiques et\nassimilées, ainsi que celles dont le type d’activité implique une gestion spécifique des toitures (process\nindustriel particulier par exemple), et celles dont les structures porteuses sont incompatibles avec de telles\nfonctions, sont dispensées de cette règle.\n    237\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","6. Patrimoine bâti et\n    paysager\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n Modification simplifiée n°1 du 25 juin 2025","    6. Patrimoine bâti et paysager\nSont concernés par les dispositions ci-dessous, les éléments de patrimoine protégés identifiés sur le\ndocument graphique n°4.3 Plan des protections patrimoniales, écologiques et paysagères.\nL’ensemble des constructions, sites, éléments particuliers, éléments végétaux protégés identifiés, est\nqualifié, au sens du présent règlement, de « patrimoine protégé ».\nLe patrimoine protégé est également soumis aux règles définies dans les autres chapitres du règlement. Les\nrègles du présent chapitre s’appliquent en cas de contradictions.\nLa liste du patrimoine protégé identifie les caractéristiques qui ont justifié sa protection.\nLa liste du patrimoine protégé ainsi que les fiches prescriptives sont consultables dans le Cahier des\npatrimoines.\n6.1. Définitions des catégories de patrimoine protégé\nLe patrimoine protégé bâti est constitué des catégories suivantes :\n    ▪   Patrimoine bâti remarquable : Édifices représentatifs d’un type architectural et/ou présentant un\n    caractère historique. Ils se distinguent du tissu urbain environnant par la qualité et/ou l’originalité de\n    leurs décors, de leurs dessins et par la qualité de mise en œuvre et/ou le choix des matériaux qui\n    les composent. Ces bâtiments sont particulièrement bien conservés et présentent peu d’altérations\n    ou bien des altérations réversibles.\n    ▪   Patrimoine bâti d’intérêt : Édifices représentatifs d’un type architectural et/ou d’une époque de\n    l’urbanisation du territoire bénéficiant d’une qualité de composition et de mise en œuvre. Les\n    altérations sur ces immeubles peuvent être plus importantes par rapport au bâti remarquable et/ou\n    irréversibles.\n    ▪   Ensembles bâtis à caractère patrimonial : Regroupement d’au moins trois édifices présentant une\n    qualité patrimoniale. Le gabarit, l’implantation du bâti par rapport à la voie, mais aussi et surtout\n    l’écriture architecturale (composition des façades, matériaux, mise en œuvre, modénatures, etc.)\n    forme une unité et une cohérence entre plus immeubles mitoyens ou très proche géographiquement.    239\n    ▪   Ensembles urbains d’intérêt : Ensembles de constructions dont la cohérence paysagère et urbaine\n    doit être préservée. Les implantations du bâti par rapport à la rue, les gabarits, l’articulation des\n    espaces libres et plantés et des limites avec les emprises publiques fondent l’intérêt des ensembles\n    urbains d’intérêt.\n    ▪   Éléments d’intérêt : Éléments de patrimoine divers tels que portails, clôtures, murs, etc...\nEn cas de dispositions contradictoires entre les « Dispositions générales » et les règles de « Morphologie\net implantation des constructions » d’une part, et les règles du « Patrimoine bâti et paysager » d’autre\npart, ce sont ces dernières qui s’appliquent.\nLe patrimoine paysager protégé est constitué des catégories suivantes :\n    ▪   Arbre remarquable : sujet protégé en raison de son impact paysager et au moins de l’un des critères\n    suivants : dimension, âge, rareté, port, valeur historique.\n    ▪   Arbre repère : sujet protégé en raison de son impact paysager.\n6.2. Dispositions relatives au patrimoine bâti et urbain\nLes présentes dispositions sont applicables à l’ensemble du patrimoine protégé bâti identifié, à savoir le\npatrimoine bâti remarquable, le patrimoine bâti d’intérêt, les ensembles bâtis à caractère patrimonial, les\nensembles urbains d’intérêt et les éléments d’intérêt, sur le document graphique n°4.3 Plan des\nprotections patrimoniales, écologiques et paysagères, en plus des éventuelles règles spécifiques à\ncertains patrimoines protégés.\nDes fiches de prescriptions et recommandations individuelles pour les patrimoines bâtis remarquables et les\nensembles bâtis à caractère patrimonial complètent le présent règlement.\nLa liste des patrimoines bâtis d’intérêt, des ensembles urbains d’intérêt et des éléments d’intérêt identifie les\ncaractéristiques qui ont justifié leur protection.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    6. Patrimoine bâti et paysager\n    6.2.1.    Démolitions et suppressions\n    Dispositions communes\n    La démolition totale du patrimoine protégé est interdite sauf dans des cas exceptionnels liés à des cas de\n    risques graves pour la sécurité des personnes, des biens ou de l'environnement.\n    La suppression d’éléments patrimoniaux identifiés dans les listes et les fiches individuelles détaillées\n    (modénatures, ferronneries, persiennes, …) est interdite.\n    Dispositions applicables au patrimoine bâti remarquable et au patrimoine bâti d’intérêt\n    Sous réserve des dispositions mentionnées dans les fiches individuelles, la démolition partielle du\n    patrimoine protégé identifié comme patrimoine bâti remarquable ou patrimoine bâti d’intérêt est admise\n    dès lors qu’elle participe à sa mise en valeur (démolition d’extensions ou suppression d’éléments\n    dénaturant le patrimoine, …) et/ou qu’elle ne porte pas atteinte aux caractéristiques ayant conduit à son\n    identification.\n    Dispositions applicables aux ensembles bâtis à caractère patrimonial et aux ensembles urbains\n    d’intérêt\n    Sous réserves des dispositions mentionnées dans les fiches individuelles, la démolition d’un ou plusieurs\n    bâtiments composant un ensemble urbain d’intérêt est admise si elle n’affecte pas négativement les qualités\n    patrimoniales de l’ensemble,\n    En cas de reconstruction, rénovation ou construction neuve, celle-ci devra viser à maintenir ou recréer le\n    caractère de l'ensemble en se conformant aux implantations, aux volumétries et aux hauteurs dominantes\n    des bâtiments constitutifs de l'ensemble.\n    La démolition des éléments situés dans le périmètre de l’ensemble mais ne concourant pas à la qualité de\n    l’ensemble ayant justifié sa protection, est autorisée.\n240   6.2.2.    Extension horizontale, verticale et redressement de combles\n    Dispositions applicables au patrimoine bâti remarquable et au patrimoine bâti d’intérêt\n    Sous réserve des dispositions mentionnées dans les fiches individuelles, les travaux d’extension horizontale,\n    verticale, et/ou de redressement de combles sont admis dès lors :\n    ▪    Qu’ils sont en harmonie avec les caractéristiques du patrimoine protégé (principe d’implantation,\n    volumétrie, composition structurelle, rythme et ornementation de façade) ;\n    ▪    Qu’ils respectent un principe de hiérarchie et de proportion de la construction existante à agrandir ;\n    ▪    Qu’ils sont en harmonie avec la composition de la façade de la construction existante.\n    ▪    Qu’une attention particulière est portée aux jonctions entre le bâti existant et son extension.\n    Les travaux d’extensions verticales sont interdits, dès lors qu’ils conduisent à la démolition de tout ou partie\n    d’une toiture identifiée comme un élément d’intérêt ou un élément à protéger.\n    Dispositions applicables aux ensembles bâtis à caractère patrimonial et aux ensembles urbains\n    d’intérêt\n    Sous réserve des dispositions mentionnées dans les fiches individuelles, les travaux d’extension horizontale\n    ou verticale et/ou de redressement de comble sont admis. Ces travaux devront viser à maintenir ou recréer\n    le caractère et la cohérence de l'ensemble en se conformant aux implantations, aux volumétries et aux\n    hauteurs dominantes des bâtiments constitutifs de l'ensemble.\n    6.2.3.    Travaux sur l’existant\n    Dispositions communes\n    Note : l’état existant du patrimoine bâti concerné et compris comme son état à la date d’approbation du PLUi.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    6. Patrimoine bâti et paysager\nNonobstant le présent article, les fiches individuelles peuvent interdire ou soumettre à certaines conditions\nla réalisation de travaux sur un bâtiment remarquable ou un bâtiment composant un ensemble bâti à\ncaractère patrimonial.\nTous les travaux réalisés sur le patrimoine protégé doivent être conçus de manière à :\n    ▪    s’harmoniser avec les caractéristiques architecturales de la construction, notamment, la volumétrie,\n    la composition architecturale, le rythme et l’ordonnancement des façades, les matériaux, les détails\n    de décorations et de modénatures ;\n    ▪    mettre en œuvre des matériaux et des techniques permettant de conserver ou de restituer l’aspect\n    d’origine de la construction ;\n    ▪    traiter les installations techniques de manière à ne pas altérer la qualité patrimoniale et à les intégrer\n    au contexte architectural, urbain et paysager ;\n    ▪    composer avec la pente et la forme des couvertures existantes. Le matériau originel de couverture\n    doit être conservé ou restauré ;\n    ▪    limiter le nombre de châssis de toiture à un seul niveau d’éclairage en veillant à les intégrer dans\n    l’ordonnancement des façades ;\nPour les toitures composées de lucarnes existantes, l’ajout d’une ou plusieurs lucarnes est autorisé sauf\nmention contraire dans les fiches individuelles détaillées et sous réserve d’insertion cohérente avec la\ncomposition de la façade et de la pente et de la forme de la toiture existante.\nLa restitution d’un aspect antérieur connu, documenté et conforme à l’architecture d’origine est autorisée.\nLes travaux réalisés sur le terrain d’un patrimoine protégé doivent être conçus de manière à :\n    ▪    ne pas compromettre les caractéristiques architecturales de la construction ;\n    ▪    ne pas compromettre les caractéristiques paysagères du terrain (couverture arborée, vues, clôtures,\n    etc.)\n    241\n6.2.4.    Dispositifs et ouvrages techniques\n    Dispositions communes\nLes coffres extérieurs de volets roulants sont interdits sur l’ensemble des toitures et des façades.\nL’installation de dispositifs ou d’ouvrages techniques, autres que les dispositifs solaires, visant à la\nperformance énergétique et environnementale est admise, sauf mention contraire dans les fiches\nindividuelles détaillées, dès lors qu’une bonne intégration à la composition architecturale et à l’environnement\npaysager est assurée, que la mise en valeur de la construction protégée n’est pas remise en cause et que\nles caractéristiques architecturales qui fondent son intérêt patrimonial sont préservées ou restaurées.\nLes travaux d’isolation thermique par l’extérieur sont interdits dès lors qu’ils ne sont pas adaptés aux\ncaractéristiques architecturales et/ou structurelles de la construction.\nL’installation de dispositifs solaires (capteurs solaires thermiques par panneaux, capteurs solaires\nphotovoltaïques, tuiles ou ardoises solaires…) est admise, sauf mention contraire dans les fiches\nindividuelles détaillées, dès lors que les dispositifs solaires sont installés en partie basse de la toiture, sans\nen dépasser la ligne médiane et qu’une bonne intégration à la composition architecturale est assurée.\n6.2.5.    Annexes et autres constructions\n    Dispositions communes\nLa construction d’annexes ou l’ajout d’éléments non contigus à un patrimoine protégé, est admise, sauf\nmention contraire dans les fiches individuelles détaillées, dès lors que les annexes ou les éléments ajoutés :\n    ▪    évitent toute dénaturation des caractéristiques du patrimoine protégé ayant conduit à son\n    identification ;\n    ▪    préservent l’harmonie de la composition du terrain lorsque celle-ci participe à la valorisation du bâti\n    patrimonial.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    6. Patrimoine bâti et paysager\n    6.3. Dispositions relatives au patrimoine paysager\n    6.3.1.    Arbres remarquables\n    Les arbres remarquables identifiés sont repérés sur le document graphique n°4.3 Plan des protections\n    patrimoniales, écologiques et paysagères.\n    Les critères ayant conduit à leur identification sont consultables dans le Cahier des patrimoines.\n    L’abattage d’un arbre remarquable est interdit sauf dans les cas où il est rendu nécessaire par des impératifs\n    de sécurité publique ou pour des raisons phytosanitaires ou en cas de nécessité liée à une autre\n    réglementation.\n    L’abattage d’un arbre remarquable doit être compensé par la plantation, sur le même terrain, d’un ou\n    plusieurs arbres d’essences identiques ou d’essences locales, ou adaptées au changement climatique, selon\n    les modalités suivantes, liées à la circonférence (ou diamètre) du tronc du sujet abattu, mesurée à 1m du\n    sol :\n    ▪    Circonférence entre 61 et 120 cm (diamètre 21 à 40 cm) : 1 arbre nouveau pour 1 arbre supprimé\n    ▪    Circonférence entre 121 et 180 cm (diamètre 41 à 60 cm) : 2 arbres nouveaux pour 1 arbre supprimé\n    ▪    Au-delà d'une circonférence de 181 cm (diamètre supérieur à 60 cm) : 3 arbres nouveaux pour 1\n    arbre supprimé\n    A la plantation, ils devront présenter une circonférence minimum (mesurée à 1m du sol) de 18 à 20 cm. Les\n    fosses de plantation devront présenter un volume suffisant pour garantir le bon développement de l’arbre (8\n    m3 minimum) ou avoir les dimensions minimales de terre de 2 mètres X 2 mètres X 2 mètres (L x l x\n    profondeur).\n242   Sur le terrain, les constructions à édifier et les extensions de constructions existantes doivent s’implanter en\n    dehors du périmètre de protection des arbres remarquables, dont le rayon est défini dans chaque fiche\n    détaillée. Il est interdit de réduire la perméabilité du sol dans le périmètre de protection.\n    Dans le périmètre de protection, les exhaussements ou affouillements de sol et la traversée de réseaux\n    divers pourront être interdits en cas de mise en danger du bon développement de l’arbre.\n    6.3.2.    Arbres repères\n    L’abattage d’un arbre repère est interdit sauf dans les cas où il est rendu nécessaire pour des motifs justifiés\n    de sécurité publique, pour des raisons phytosanitaires, en cas de nécessité liée à une autre réglementation,\n    ou pour des motifs d’intérêt général.\n    L’abattage d’un arbre repère doit être compensé par la plantation d’un arbre d’essence identique ou\n    d’essences locales ou adaptées au changement climatique.\n    L’arbre replanté doit avoir un port similaire à celui abattu.\n    A la plantation, il devra présenter une circonférence minimum (mesurée à 1m du sol) de 18 à 20 cm. La\n    fosse de plantation devra présenter un volume suffisant pour garantir le bon développement de l’arbre (8 m3\n    minimum) ou avoir les dimensions minimales de terre de 2 mètres X 2 mètres X 2 mètres (L x l x profondeur).\n    Sur le terrain, les constructions à édifier devront s’implanter en dehors du périmètre de protection des arbres\n    repères, défini par un rayon de 6 mètres, mesuré à partir du collet de l’arbre (base du tronc, au niveau du\n    sol). Il est interdit de réduire la perméabilité du sol dans le périmètre de protection.\n    Dans le périmètre de protection, les exhaussements ou affouillements de sol et la traversée de réseaux\n    divers pourront être interdits en cas de mise en danger du bon développement de l’arbre.\n    6.4. Règle alternative\n    Sur les terrains contigus au terrain sur lequel se trouve un patrimoine protégé, les règles morphologiques\n    définies au chapitre 3 – « Morphologie et implantation des constructions » pourront être adaptées si elles\n    conduisent à favoriser la mise en valeur du patrimoine protégé.    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    6. Patrimoine bâti et paysager\n6.5. Aqueducs du réseau hydraulique du domaine de Saint-\n    Cloud\nLe document graphique n°4.3 Plan des protections patrimoniales, écologiques et paysagères, identifie\nles aqueducs souterrains relatifs au service des fontaines du domaine de Saint-Cloud, au titre du patrimoine\nhistorique et culturel du territoire.\nLa démolition de tout ou partie des aqueducs est interdite.\nLes éléments de servitudes attachés aux aqueducs figurent en annexes informatives du dossier de PLUi.\n    243\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    7. Mixité\n    fonctionnelle et\n    sociale\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\nModification simplifiée n°1 du 25 juin 2025","    7. Mixité fonctionnelle et sociale\n7.1. Mixité fonctionnelle\n7.1.1.    Mixité fonctionnelle des zones de centralités\nDans la zone U1, les nouvelles constructions et les reconstructions à destination de logements devront\nconsacrer au moins 5% de leur surface de plancher à une autre destination que celle d'habitation, pour les\nopérations de plus de 80 logements ou 5 000 m² de SDP.\n Pour les sites n°1 et n°2 de l’OAP sectorielle du centre-ville de Ville-d’Avray, cette règle de mixité\nfonctionnelle s’applique globalement à l’échelle des deux sites.\n7.1.2.    Linéaires de préservation et de développement de la diversité\n    commerciale (type 1) – Rez-de-chaussée actifs\nLes linéaires de préservation et de développement de la diversité commerciale (type 1) sont identifiés sur le\ndocument graphique n°4.1 Plan général.\n    Constructions existantes\nSur les linéaires identifiés, le changement de destination des locaux à destination de commerces et activités\nde services, situés en rez-de-chaussée des constructions existantes, est interdit. Seuls sont admis les\nchangements de sous-destinations au sein de la destination commerces et activités de services ainsi que\nvers la destination d’équipements d’intérêt collectif et services publics.\nDans le cas d’une démolition d’une construction accueillant un ou des locaux à destination de commerces\net activités de services, un ou des locaux, de surface de plancher au minimum équivalente, à destination de\ncommerces et activités de services et/ou d’équipements d’intérêt collectif et services publics devront être    245\ncréés dans la nouvelle construction. Cette obligation peut être réduite en cas d’impossibilité liée à\nl’amélioration du taux de pleine-terre du terrain.\nPour définir l’équivalence, seule est comptée la surface de plancher commerciale de vente ouverte au public.\nSont exclus, notamment, les surfaces de stockage, les locaux du personnel, les bureaux, les locaux\ntechniques et de service. Sont également décomptées les surfaces commerciales incluses dans un\nemplacement réservé.\n    Nouvelles constructions\nPour les constructions à édifier au droit des linéaire identifiés, la surface de plancher des locaux implantés\nen rez-de-chaussée et donnant sur des emprises publiques ou voies devra être à destination de commerces\net activités de services et/ou d’équipements d’intérêt collectif et services publics, exception faite des parties\ncommunes et des accès nécessaires au fonctionnement de la construction.\n7.1.3.    Linéaires de préservation et de développement de la diversité\n    commerciale (type 2) – focus commerces de proximité et restauration\nLes linéaires de préservation et de développement de la diversité commerciale (type 2) sont identifiés sur le\ndocument graphique n°4.1 Plan général.\n    Constructions existantes\nSur les linéaires identifiés, le changement de sous-destination des locaux à destination d’artisanat et\ncommerce de détail et de restauration, situés en rez-de-chaussée des constructions existantes, est interdit.\nSeuls sont admis les changements entre les sous-destinations précitées ainsi que vers la destination\nd’équipements d’intérêt collectif et services publics.\nDans le cas d’une démolition d’une construction accueillant un ou des locaux à destination de commerces\net activités de services, un ou des locaux, de surface de plancher au minimum équivalente, à destination\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    7. Mixité fonctionnelle et sociale\n    d’artisanat et commerce de détail, de restauration et/ou d’équipements d’intérêt collectif et services publics\n    devront être créés dans la nouvelle construction. Cette obligation peut être réduite en cas d’impossibilité liée\n    à l’amélioration du taux de pleine-terre du terrain.\n    Pour définir l’équivalence, seule est comptée la surface de plancher commerciale de vente ouverte au public.\n    Sont exclus, notamment, les surfaces de stockage, les locaux du personnel, les bureaux, les locaux\n    techniques et de service. Sont également décomptées les surfaces commerciales incluses dans un\n    emplacement réservé.\n    Nouvelles constructions\n    Pour les constructions à édifier au droit des linéaires identifiés, la surface de plancher des locaux implantés\n    en rez-de-chaussée et donnant sur des emprises publiques ou des voies devra être à destination d’artisanat\n    et commerce de détail et/ou de restauration et/ou d’équipements d’intérêt collectif et services publics,\n    exception faite des parties communes et des accès nécessaires au fonctionnement de la construction.\n    7.2. Mixité sociale\n    7.2.1.    Secteurs de mixité sociale (SMS)\n    Champ d’application\n    En application de l’article L 151-15 du Code de l’urbanisme, le PLUi définit des secteurs de mixité sociale\n    dans lesquels, en cas de réalisation d'un programme de logements, un pourcentage de ce programme est\n    affecté à des catégories de logements qu’il définit dans le respect des objectifs de mixité sociale.\n    Sont considérés comme logements sociaux au titre du PLUi, l’ensemble des catégories de logements\n    décomptés au titre de la loi SRU tel qu’établi à l’article L.302-5 du Code de la construction et de l’habitation\n    y compris les logements assimilés faisant l'objet d'un bail réel solidaire. Lorsqu’il est fait application du\n246   conventionnement prévu à l’article L.831-1 du même Code, la durée de celui-ci doit être de 20 ans\n    minimum pour pouvoir considérer les logements conventionnés comme des logements sociaux au titre du\n    PLUi.\n    Lorsqu’un terrain est à la fois concerné par un emplacement réservé au titre de la mixité sociale et situé dans\n    un secteur de mixité sociale, seules les dispositions liées à l’emplacement réservé s’appliquent.\n    Pour les sites n°1 et n°2 de l’OAP sectorielle du centre-ville de Ville-d’Avray, les dispositions des secteurs\n    de mixité sociale s’appliquent globalement à l’échelle des deux sites.\n    Les dispositions des secteurs de mixité sociale s’appliquent à toute opération de réalisation de logements\n    (construction(s) neuve(s), reconstruction et travaux d’extension), à l’exception des opérations de\n    changements de destination d’une construction existante et des extensions résultant de l’application des\n    règles de hauteur ou d’emprise au sol complémentaires au titre du chapitre 5.2.\n    Dans le cas d’une extension, la règle ne s’applique qu'aux surfaces de plancher destinées au logement\n    créées à l’occasion de la réalisation du projet.\n    Dans le calcul, l’arrondi s’effectue au nombre entier supérieur.\n    Les règles de mixité sociale sont applicables dans les secteurs de mixité sociale délimités sur le document\n    graphique n°4.2 Plan des prescriptions et périmètres particuliers.\n    Seuils et pourcentages applicables\n    Les règles suivantes s’appliquent au sein des secteurs mentionnés :\n    ▪    SMS-1 : Pour les nouvelles constructions ou opérations de reconstruction à destination de logement\n    de plus de 1 200 m² de surface de plancher ou d’au moins 15 logements, il est exigé un minimum\n    de 30% de logements sociaux (en surface de plancher).\n    ▪    SMS-2 : Il est exigé :\n    o   un minimum de 25% de logements sociaux (en surface de plancher) pour les nouvelles\n    constructions ou opérations de reconstruction à destination de logement de plus de\n    400 m² de surface de plancher ou d’au moins 10 logements,\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    7. Mixité fonctionnelle et sociale\n    o    Toutefois, dans la partie du secteur située à Chaville, il est exigé un minimum de 30%\n    logements locatifs sociaux de type PLAI et/ou PLUS (en surface de plancher) pour les\n    nouvelles constructions ou opérations de reconstruction à destination de logement de\n    plus de 1 200 m² de surface de plancher ou d’au moins 15 logements. Cette disposition\n    ne s’applique pas aux opérations dont 100% des logements font l'objet d'un bail réel\n    solidaire.\n    ▪    SMS-3 : Il est exigé :\n    o    Un minimum de 30% de logements sociaux (en surface de plancher) pour les nouvelles\n    constructions ou opérations de reconstruction à destination de logement de plus de 400\n    m² de surface de plancher ou d’au moins 6 logements.\n    o    Un minimum de 35% de logements sociaux (en surface de plancher) pour les nouvelles\n    constructions ou opérations de reconstruction à destination de logement de plus de 2 000\n    m² de surface de plancher ou d’au moins 30 logements.\n    ▪    SMS-4 : Pour les nouvelles constructions ou opérations de reconstruction à destination de logement\n    de plus de 800 m² de surface de plancher ou d’au moins 12 logements, il est exigé un minimum de :\n    o    30% de logements sociaux de type PLAI et/ou PLUS (en surface de plancher) à Boulogne-\n    Billancourt,\n    o    25% de logements sociaux (en surface de plancher) à Meudon,\n    o    25% de logements sociaux (en nombre de logements) à Sèvres.\n    ▪    SMS-5 : Pour les nouvelles constructions ou opérations de reconstruction à destination de logement\n    de plus de 1 200 m² de surface de plancher ou d’au moins 15 logements, il est exigé un minimum\n    de 30% de logements sociaux (en nombre de logements) et un minimum de 25% de logements\n    sociaux (en surface de plancher).\n7.2.2.    Emplacements réservés pour des programmes de logements    247\nEn application de l’article L 151-41 du Code de l’urbanisme, le PLUi délimite des emplacements réservés en\nvue de la réalisation, dans le respect des objectifs de mixité sociale, de programmes de logements qu'il\ndéfinit.\nSont considérés comme logements sociaux au titre du PLUi, l’ensemble des catégories de logements\ndécomptés au titre de la loi SRU tel qu’établi à l’article L.302-5 du Code de la construction et de l’habitation\ny compris les logements assimilés faisant l'objet d'un bail réel solidaire. Lorsqu’il est fait application du\nconventionnement prévu à l’article L.831-1 du même Code, la durée de celui-ci doit être de 20 ans minimum\npour pouvoir considérer les logements conventionnés comme des logements sociaux au titre du PLUi.\nDans le calcul, l’arrondi s’effectue au nombre entier inférieur lorsque la décimale est inférieure à 0,5, et à\nl’entier supérieur lorsque la décimale est égale ou supérieure à 0,5.\nLes emplacements réservés sont identifiés et délimités sur le document graphique n°4.2 Plan des\nprescriptions et périmètres particuliers. La proportion minimale de logements sociaux à réaliser est\nprécisée dans le cahier des emplacements réservés.\n7.2.3.    Secteurs de taille minimale de logements (STML)\n    Champ d’application\nEn application de l’article L 151-14 du Code de l’urbanisme, le PLUi définit des secteurs dans lesquels les\nprogrammes de logements comportent une proportion de logements d'une taille minimale qu'il fixe.\nSont exclus de ces dispositions les programmes ou parties de programme correspondant aux catégories de\nlogements décomptés au titre de la loi SRU tel qu’établi à l’article L.302-5 du Code de la construction et de\nl’habitation y compris les logements assimilés faisant l'objet d'un bail réel solidaire.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    7. Mixité fonctionnelle et sociale\n    Sont également exclus de ces dispositions les programmes ou parties de programme correspondant à la\n    transformation d’immeuble à destination de bureaux en une construction à destination de logements ainsi\n    que ceux correspondant à une division de logement.\n    Dans le cas d’une extension, la règle ne s’applique qu'aux surfaces de plancher destinées au logement\n    créées à l’occasion de la réalisation du projet.\n    Pour les sites n°1 et n°2 de l’OAP sectorielle du centre-ville de Ville-d’Avray, la règle de taille minimale des\n    logements s’applique globalement à l’échelle des deux sites.\n    Dans le calcul, l’arrondi s’effectue au nombre entier inférieur lorsque la décimale est inférieure à 5, et à\n    l’entier supérieur lorsque la décimale est égale ou supérieure à 5.\n    Les règles de taille de logements sont applicables dans les secteurs de taille minimale de logements\n    délimités sur le document graphique n°4.2 Plan des prescriptions et périmètres particuliers.\n    Seuils et proportions applicables\n    ▪   STML : Pour les constructions à édifier ou opérations de reconstruction à destination de logement,\n    comprenant au moins 6 logements, il est exigé un minimum de 65% de logements de type 3 et plus.\n248\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    8. Stationnement\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\nModification simplifiée n°1 du 25 juin 2025","    8. Stationnement\n    8.1. Stationnement des véhicules motorisés\n    8.1.1.    Modalités de réalisation des places de stationnement\n    Les emplacements de stationnement doivent être réalisés dans la construction, prioritairement en sous-sol.\n    Cependant, les places suivantes peuvent être aménagées sur les espaces libres à condition d’être\n    perméables ou semi-perméables et de représenter au maximum 20% des espaces libres du terrain :\n    ▪    places de livraison, dans la limite de 2 places ;\n    ▪    places de stationnement pour les personnes à mobilité réduite ;\n    ▪    places de stationnement de deux-roues motorisés ;\n    ▪    places de stationnement automobile, dans la limite de 5 places ;\n    Les places de stationnement automobile des constructions à sous-destination d’établissements\n    d’enseignement, de santé et d’action sociale et à sous-destination de centre de congrès et d’exposition\n    peuvent être aménagées sur les espaces libres, dès lors que le nombre de places total sur les espaces libres\n    n’est pas augmenté.\n    Lorsque le bénéficiaire du permis ou de la décision de non-opposition à une déclaration préalable ne peut\n    pas réaliser les aires de stationnement sur le terrain d’assiette ou dans son environnement immédiat, il peut\n    être tenu quitte de ces obligations en justifiant, pour les places qu'il ne peut réaliser lui-même, soit de\n    l'obtention d'une concession à long terme (15 ans minimum) dans un parc public de stationnement existant\n    ou en cours de réalisation et situé à proximité de l'opération, soit de l'acquisition ou de la concession de\n    places dans un parc privé de stationnement répondant aux mêmes conditions. Dans le présent règlement,\n    la proximité est définie en fonction du rayon à partir du terrain. Les espaces de stationnement doivent être\n    facilement accessibles à pied et situés dans un rayon maximal de 500 mètres à compter de l’entrée principale\n    de la construction.\n250   L'offre de stationnement nécessaire au bon fonctionnement d'une opération, pour les véhicules motorisés, y\n    compris les véhicules de livraisons et les poids lourds, doit être conçue et dimensionnée de manière à ne\n    pas générer de dysfonctionnement sur les voies et espaces ouverts à tout type de circulation publique.\n    Les places de stationnement doivent être facilement accessibles depuis l’espace public.\n    8.1.2.    Règle alternative pour favoriser la qualité des immeubles d’habitation de\n    plus de 2 logements\n    Le pétitionnaire peut être tenu quitte d'une partie de ses obligations en matière de création d'aires de\n    stationnement pour véhicules motorisés, s'il consacre une partie de l'équivalent de la surface exigée pour ce\n    stationnement à la réalisation de caves ou boxes de stockage et/ou d'espaces communs partagés non\n    stationnés et affectés aux besoins des résidents (buanderie ou laverie partagée, atelier partagé, chambre\n    d'amis partagée, etc.) et/ou de lieux de production d’énergies renouvelables et/ou de récupération (EnR&R)\n    en sous-sol (géothermie par exemple). Cette disposition s’applique également aux travaux réalisés sur des\n    constructions existantes. L’équivalent de la surface affectée à un autre usage ne peut dépasser 25% des\n    surfaces de stationnement à créer. Pour l’application de cette règle, l’équivalent-surface d’une place de\n    stationnement s’élève à 25 m² (dégagement compris).\n    La réduction du minimum exigé permise par cette règle alternative n’est pas cumulative avec la réduction du\n    minimum exigé permise par l’autopartage ni avec la règle de mutualisation et de foisonnement du\n    stationnement.\n    8.1.3.    Dimension des places de stationnement\n    Le dimensionnement des places de stationnement et de leurs accès répond aux normes suivantes :\n    ▪    NF P91-100 pour les parkings accessibles au public,\n    ▪    NF P91-120 pour les parcs de stationnements privés,\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    8. Stationnement\n    ▪    Toute norme légale qui leur serait ajoutée ou substituée.\n8.1.4.    Secteurs pour application des règles de stationnement\nLe tableau ci-dessous présente les 4 secteurs relatifs aux règles de stationnement :\n    Entité urbaine    Périmètre    Secteur\n    Cœur de métropole\n    (limitrophe de Paris)    La totalité du territoire\n    S1\n    Boulo
