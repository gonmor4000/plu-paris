ture et le plan vertical de la façade.\n    EMPLACEMENT RÉSERVÉ\n    Les emplacements réservés sont délimités sur le plan de zonage. Il s’agit d’emplacements sur lesquels sont\n    interdits toutes constructions ou aménagements autres que ceux prévus par le PLUi (équipement public,\n    logements sociaux, ouvrage public ou installation d'intérêt général, espace vert public, voirie publique…) ou\n    tout du moins, toute construction ou aménagement qui ne serait pas compatible avec la réalisation à venir\n    du projet pour lequel cet emplacement est réservé.\n    Les propriétaires des terrains concernés peuvent exercer le droit de délaissement auprès de la collectivité\n    bénéficiaire de l’emplacement.\n    Les précisions concernant les bénéficiaires ou les objets des emplacements réservés figurent dans le cahier\n    des emplacements réservés du chapitre 10 du règlement.\n    EMPRISE AU SOL\n    L’emprise au sol correspond à la projection verticale au-dessus du terrain après travaux du volume des\n    constructions, y compris les annexes présentes sur le terrain, tous débords et surplombs inclus.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\nCela intègre toute construction ou partie de construction ainsi que les installations techniques qui font partie\nintégrante des constructions et participent de leur volume général, tels que les escaliers et ascenseurs\nextérieurs.\nToutefois, sont exclus :\n    Dès lors qu’ils ont une profondeur inférieure ou égale à 1,20 mètre et qu’ils sont non-reliés au\n    sol : les modénatures, les encorbellements, les oriels,\n    Dès lors qu’ils sont non-reliés au sol, les balcons dans la limite de 1,20 mètre de profondeur,\n    Les débords de toiture lorsqu’ils ne sont pas soutenus par des poteaux,\n    Les ouvrages, éléments bâtis et parties de constructions dont la hauteur est inférieure ou égale\n    à 0,60 mètre par rapport au terrain après travaux (terrasses, escaliers, emmarchements,\n    bassins, terrains de tennis, rampes d’accès de parkings et garages, etc…),\n    Les passerelles ouvertes piétonnes d’une largeur inférieure ou égale à 1,40 mètre,\nDans le cas de voies privées appartenant au(x) propriétaire(s) riverain(s), la partie de la surface de la voie\nincluse dans le terrain n’entre pas dans l’assiette de calcul de l’emprise au sol.\nLes autres éléments en saillie non expressément exclus sont pris en compte dans le calcul de l’emprise.\nLes ouvrages entièrement enterrés (exemple des parkings) ainsi que les voiries ne constituent pas d’emprise\nau sol.\nLes piscines couvertes ou non sont constitutives d’emprise au sol.\n    21\nPour la détermination du champ d’application des déclarations et autorisations d’urbanisme, cette définition\nne se substitue pas à celle de l’article R420-1 du code de l’urbanisme.\nEMPRISE PUBLIQUE\nL’emprise publique correspond aux espaces extérieurs ouverts au public, quel que soit leur statut (public ou\nprivé), qui ne répondent pas à la notion de voie ni d'équipement public ou d’intérêt collectif. Les voies ferrées,\nles cours d’eau canalisés ou non (à l’exception de la Seine), les forêts et les parcs et jardins ne sont pas\nconcernés par cette définition. Toutefois, ils peuvent, le cas échéant, faire l‘objet de prescriptions\nparticulières au titre des limites séparatives.\nENCORBELLEMENT\nL’encorbellement qualifie un volume ou une partie de construction en saillie par rapport au(x) niveau(x)\ninférieur(s) et sans lien avec le sol.\nESPACE(S) LIBRE(S)\nLes espaces libres sont les parties restantes du terrain une fois déduites les surfaces comprises dans\nl’emprise au sol.\nLes quais et les pontons d’amarrage ne sont pas considérés comme des espaces libres.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\n    ESPACES DE PLEINE TERRE\n    Les espaces de pleine terre sont des espaces libres destinés à être végétalisés (plantations herbacées,\n    arbustives ou arborées) et ne comportant aucune construction en surface comme en sous-sol, permettant la\n    libre et entière infiltration des eaux pluviales jusqu’à la nappe phréatique.\n    La présence de pleine terre contribue à de multiples fonctions environnementales dont la gestion des eaux\n    pluviales, le maintien et le développement de la biodiversité, la lutte contre les phénomènes d’ilot de chaleur\n    urbain.\n    Ne sont pas de nature à déqualifier un espace de pleine terre :\n    •   Les ouvrages d’infrastructure profonds participant à l’équipement urbain (ouvrages ferroviaires,\n    réseaux, canalisations...),\n    •   Les carrières souterraines,\n    •   Les passerelles ouvertes piétonnes d’une largeur inférieure ou égale à 1,40 mètres,\n    •   Les ouvrages destinés à la gestion des eaux pluviales ou à leur évaporation tels que les bassins\n    paysagés, les plans d’eau ou encore les bassins enterrés,\n    •   Dès lors qu’ils ont une profondeur inférieure ou égale à 1,20 mètre, qu’ils ne sont pas soutenus par\n    des poteaux et qu’ils sont situés à une hauteur supérieure ou égale à 3 mètres par rapport au sol\n    après travaux : les modénatures, les encorbellements, les oriels,\n    •   Dès lors qu’ils ne sont pas soutenus par des poteaux et qu’ils sont situés à une hauteur supérieure\n    ou égale à 3 mètres par rapport au sol après travaux, les balcons dans la limite de 1,20 mètre de\n    profondeur,\n    •   Les débords de toiture lorsqu’ils ne sont pas soutenus par des poteaux.\n    Les surfaces de terre végétale notamment recouvertes d’une terrasse en bois ou de graviers et les aires de\n    stationnement ne sont pas comptées dans les superficies d’espaces de pleine terre.\n    Dans le cas de voies privées appartenant au(x) propriétaire(s) riverain(s), la partie de la surface de la voie\n    incluse dans le terrain n’entre pas dans l’assiette de calcul des espaces de pleine terre.\n22\n    ESPACES VÉGÉTALISÉS\n    Les espaces végétalisés sont des espaces aménagés sur terre végétale ou substrat, accueillant des\n    plantations herbacées, arbustives ou arborées.\n    ESPACES VÉGÉTALISÉS SUR DALLE\n    Les espaces végétalisés sur dalle correspondent à des surfaces situées en rez-de-chaussée, notamment\n    au-dessus d’ouvrages et/ou de constructions qui comptent une épaisseur limitée de terre végétale.\n    ESPÈCES EXOTIQUES ENVAHISSANTES\n    Les espaces exotiques envahissantes correspondent à des espèces végétales dont la capacité de\n    colonisation des milieux et le caractère non-indigène les amènent à perturber les milieux et la diversité\n    biologique. Ces espèces végétales sont identifiées par arrêtés ministériels des 14/02/2018 et 10/03/2020 et\n    tous ceux qui leur seraient substitués ou ajoutés.\n    EXTENSION\n    L’extension consiste en un agrandissement de la construction existante développant une surface de plancher\n    inférieure à celle-ci. Elle peut être horizontale ou verticale (par surélévation, excavation ou agrandissement\n    horizontal), et doit présenter un lien physique et fonctionnel avec la construction existante.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\nFAÇADE\nLes façades d’une construction correspondent à l’ensemble de ses parois extérieures verticales.\nUn décroché de plus de 1 mètre constitue une nouvelle façade, servant de référence aux règles\nd’implantation des constructions.\nLorsqu’il est mentionné « façade avec baie » ou « façade sans baie » dans les règles d’implantation des\nconstructions par rapport aux limites séparatives ou entre deux constructions sur un même terrain, ces\nnotions comprennent le couronnement (toiture ou attique) pour apprécier la présence de baie.\nFAÎTAGE\nLe faîtage correspond à la ligne de jonction supérieure d’un ou de plusieurs pans de toiture, inclinés suivant\ndes pentes opposées, et /ou correspondant à la ligne de rencontre haute du ou des pans.\nFILET DE HAUTEUR\nLes filets de hauteur sont des indications graphiques linéaires qui fixent le gabarit enveloppe maximal des\nconstructions à édifier (hauteur de façade, hauteur du couronnement, hauteur totale, nombre de niveaux).\nIls sont indiqués sur les plans des prescriptions et périmètres particuliers (plans 4.3).\nFOISONNEMENT DU STATIONNEMENT\nLe foisonnement du stationnement constitue un complément possible à la mutualisation. Lorsque l’ensemble\ndes usagers (résidents, employés, visiteurs, clients, spectateurs, etc.) d’un parc de stationnement ne sont\npas présents simultanément (sur une journée, une semaine ou autre), les places laissées libres à un moment\ndonné par les uns peuvent être occupées par les autres. Pour chaque catégorie d’usagers, une part de\nfoisonnement peut être calculée afin de définir les réels besoins et dimensionner le parc de stationnement.\nLors d’une mutualisation avec foisonnement, le nombre de places de stationnement est inférieur à la somme    23\ndes besoins de chaque opération ou construction.\nGABARIT / GABARIT-ENVELOPPE\nLe gabarit est constitué de l’ensemble des plans verticaux, horizontaux ou obliques constituant l’enveloppe\nextérieure dans laquelle doit s’inscrire la construction à édifier. Il résulte de la combinaison des règles de\nhauteur, de prospects et d’emprise au sol.\nLes constructions à édifier doivent s'inscrire à l'intérieur d'un gabarit-enveloppe défini par :\n    Une hauteur de façade Hf (lorsqu’elle est précisée)\n    Un couronnement Hc (lorsqu’il est précisé)\n    Une hauteur totale Ht\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\n    HAUTEUR\n    La hauteur maximale des constructions est exprimée en mètres. Elle peut également être exprimée en\n    nombre de niveaux. Dans ce cas, la règle métrique et la règle en nombre de niveaux doivent être respectées.\n    Mesures des hauteurs :\n24\n    La hauteur totale Ht des constructions est la différence d’altitude mesurée verticalement entre le niveau de\n    référence et le point le plus haut de la construction, mesurée au faîtage de la construction dans le cas de\n    toitures en pente, ou au sommet de l’acrotère du dernier niveau, dans le cas de toitures-terrasses.\n    Cette mesure s’effectue en tout point de la construction situé au-dessus du niveau de référence.\n    La hauteur de façade Hf des constructions est la différence d’altitude mesurée verticalement entre le niveau\n    de référence et le point le plus haut de la façade hors couronnement\n    Pour l’application des règles de prospects, dans le cas de hauteurs variables sur un même plan de façade,\n    la hauteur la plus importante est prise en compte.\n    Cette mesure s’effectue en tout point de la façade hors couronnement situé au-dessus du niveau de\n    référence. Le point le plus haut de la façade se mesure :\n    à l’égout du toit dans le cas des toitures en pente, et mono pente,\n    Cas des toitures à pente\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\n    au pied de l’acrotère dans le cas de toitures terrasses sans attique,\n    Cas des toitures terrasses sans attique\n    au pied de l’acrotère avant attique, dans le cas des toitures terrasses avec attique. En cas de\n    double attique la Hf doit s’arrêter au premier décrochement.\n    25\n    Cas des toitures terrasses avec attique\nToutefois, dans la zone U3 à Chaville, Meudon, Sèvres et Ville-d’Avray, la mesure de la hauteur totale Ht\net de la hauteur de façade Hf s’effectue au point le plus bas du terrain après travaux situé au droit de la\nconstruction projetée. Les emmarchements, escaliers et perrons, les parties de façades permettant les accès\nau sous-sol et celles des cours anglaises, situées au droit de la construction projetée ne sont pas pris en\ncompte.\n    Cas des accès au sous-sol    Cas d’uneAccusé\n    courdeanglaise\n    réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\n    La hauteur de couronnement Hc est mesurée verticalement au point le plus haut de la construction à partir\n    du point le plus haut de la hauteur de façade autorisée. La pente de couronnement est définie :\n    Soit par un rapport entre la distance de recul par rapport à la façade et la hauteur du\n    couronnement (exemple 1 pour 2),\n    Soit par un une oblique déterminée par un angle,\n    Soit par un recul minimal.\n26\n    Sont exclus du calcul de la hauteur totale et de la hauteur de façade au sens du présent lexique :\n    Les antennes, les installations techniques telles que les souches de cheminées, les chapeaux\n    de ventilation, les paratonnerres, …\n    Les garde-corps de sécurité transparents ou en partie ajourés implantés en toiture-terrasse dès\n    lors qu’ils n’excèdent pas une hauteur de 1,20 mètre,\n    Uniquement pour les constructions concernées par un filet de hauteur indiqué aux plans des\n    prescriptions et périmètres particuliers (plans 4.3) :\n    o   Les garde-corps implantés en toiture-terrasse dès lors qu’ils n’excèdent pas une hauteur\n    de 1,20 mètre,\n    o   Les pares-vues implantés en toiture-terrasse dès lors qu’ils n’excèdent pas une hauteur de\n    1,90 mètre.\n    Lorsque les nouvelles constructions sont situées à l’intérieur de la limite de la zone inondable définie par le\n    PPRI et que le niveau de référence est inférieur à la cote casier, un dépassement de la hauteur totale (Ht)\n    et de la hauteur de façade (Hf) est autorisé correspondant au différentiel entre le niveau de référence et la\n    cote casier imposée.\n    HÉBERGE\n    Une héberge correspond à la ligne qui constitue à la ligne séparatrice ou la limite d’un mur séparatif commun\n    à deux constructions accolées ou adossées, de hauteurs inégales.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\nL’héberge désigne par extension la surface ainsi délimitée sur la partie de mur qui dépasse la construction\nla plus basse.\nLa notion d’héberge existante s’entend pour les constructions pérennes.\nHORS-TOUT\nLe terme hors-tout indiqué à la suite d’une côte altimétrique signifie qu’aucun acrotère, édicule technique ou\ntoutes autres émergences ne sera admis au-dessus de cette cote.\nIMPASSE\nUne impasse est un type de voie ne possédant qu’un seul point d’entrée et qui nécessite d’opérer un demi-\ntour ou marche arrière pour pouvoir en sortir et ceci quel que soit le nombre ou la configuration des propriétés\ndesservies.\nINSTALLATIONS CLASSEES POUR LA PROTECTION DE L’ENVIRONNEMENT (ICPE)\nLes ICPE sont des installations qui par leur nature présentent, à un certain degré, un risque d’incommodité,\nd’insalubrité ou de danger. Ces installations figurent dans la nomenclature établie par décrets en Conseil\n    27\nd’Etat en application de la loi du 19 Juillet 1976 et sont régies par le Code de l’environnement.\nLIMITE SÉPARATIVE\nLes limites séparatives correspondent aux limites entre le terrain d'assiette de la construction et le ou les\nterrains contigus.\nElles peuvent être distinguées en deux types : les limites latérales et les limites de fond de terrain.\n    Les limites séparatives latérales sont les limites du terrain qui aboutissent directement à la\n    voie, soit en ligne droite, soit selon une ligne brisée (décrochements, coudes, brisures).\n    Les limites séparatives de fond de terrain sont les autres limites.\nTout décrochement, coude ou brisure d’une longueur supérieure à 4 mètres déqualifie une limite séparative\nlatérale en limite séparative de fond de terrain et inversement.\nCertains terrains sont sans limite séparative de fond de parcelle : cas notamment des terrains d’angle ou\ndes terrains « traversant » (c’est-à-dire donnant sur deux voies). Dans ce cas, les limites séparatives sont\ntoutes latérales.\nLorsque le terrain d’assiette du projet est constitué de plusieurs parcelles, le fond de parcelle se définit à\nl’échelle du terrain d’assiette du projet.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\n28\n    LOCAL ACCESSOIRE\n    Le local accessoire fait soit partie intégrante d’une construction principale, soit il en constitue une annexe,\n    soit une extension. Il est indissociable du fonctionnement de la construction principale.\n    Les locaux accessoires peuvent recouvrir des constructions de nature très variée et être affectés à des\n    usages divers : garage d’une habitation ou d’un bureau, atelier de réparation, entrepôt d’un commerce,\n    remise, logement(s) pour le personnel, logement(s) de fonction, loge de gardien d’un bâtiment industriel,\n    local de stockage pour un commerce, laverie d’une résidence étudiante, les locaux tertiaires liés à l’activités\n    hospitalière, le(s) logement(s) lié(s) à l'activité hospitalière et nécessaire(s) à la continuité du service\n    hospitalier …\n    De plus, conformément à l’article R151-29 du code de l’urbanisme, les locaux accessoires sont réputés avoir\n    la même destination et sous-destination que le bâtiment principal auquel ils se rattachent.\n    LOGEMENT SOCIAL\n    Les logements sociaux au titre du PLUi correspondent à l’ensemble des catégories de logements décomptés\n    au titre de la loi SRU tel qu’établi à l’article L.302-5 du Code de la construction et de l’habitation y compris\n    les logements assimilés faisant l'objet d'un bail réel solidaire.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\nLorsqu’il est fait application du conventionnement prévu à l’article L. 831-1 du même Code, la durée de celui-\nci sera de 20 ans minimum.\nLOGGIA\nUne loggia est un espace extérieur couvert, en retrait par rapport à la façade principale. Elle comprend au\nminimum une face fermée et communique généralement avec le logement attenant. L’ouverture en façade\nconstitue une baie.\nLOGISTIQUE URBAINE\nLa logistique urbaine concerne les locaux affectés à des activités de service logistique liées à la livraison\nfinale et à la réexpédition des marchandises, pouvant inclure du stockage de courte durée et le retrait par le\ndestinataire, à l’exclusion de tout service commercial incluant la préparation des commandes destinées à un\nclient final. Les équipements de logistique urbaine peuvent accueillir des surfaces d’entreposage et de\nreconditionnement lorsque celles-ci sont pratiquées temporairement ou de façon marginale.\nCes locaux dédiés à la logistique urbaine peuvent comporter des espaces de remisage et de recharge des\nvéhicules utilisés pour les livraisons. Les points permanents de retrait par la clientèle d’achats au détail\ncommandés par voie télématique ne relèvent pas des équipements de logistique urbaine.\nLes locaux de logistique urbaine relèvent de la sous-destination entrepôt.\nLOTISSEMENT\nUn lotissement correspond à une division en propriété ou en jouissance d’une unité foncière ou de plusieurs\nunités foncières contiguës ayant pour objet d’en détacher un ou plusieurs lots destinés à être bâtis.\nVoir les dispositions générales du règlement du PLUi pour les modalités d’applications.\nLUCARNE    29\nUne lucarne est une ouverture saillante de forme variée ménagée dans un pan de toiture pour donner du\njour et de l'air aux combles. La lucarne est constituée d’une ouverture verticale.\nMARGE DE RECUL\nSauf mention contraire, aucune nouvelle construction ne peut être implantée dans les marges de recul\nidentifiées sur le document graphique n°4.2 Plan des prescriptions et périmètres particuliers.\nVoir Recul.\nMARGE DE RETRAIT\nVoir Retrait.\nMATÉRIAUX BIOSOURCÉS / GÉOSOURCÉS / ÉCOMATÉRIAUX\nLes matériaux biosourcés sont des matériaux fabriqués à l’aide de matières premières naturelles d’origine\nvégétale ou animale. Ils constituent des matériaux de construction qui répondent aux critères techniques\nhabituellement exigés pour ce type de matériaux (performances techniques et fonctionnelles, qualité\narchitecturale, durabilité, etc.), mais aussi à des critères environnementaux ou socio-environnementaux, tout\nau long de son cycle de vie (c'est-à-dire de sa production à son élimination ou recyclage).\nIls trouvent de multiples applications dans le domaine du bâtiment et de la construction comme par exemples\nles isolants (laines de fibres végétales ou animales, de liège, ouate de cellulose, etc.), les mortiers et bétons\n(béton de bois, de lin, etc.) et les panneaux (particules ou fibres végétales, paille compressée, etc.).\nLes matériaux géosourcés sont les matériaux issus de ressources d'origine minérale, tels que la terre crue\nou la pierre sèche.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\n    MODENATURE\n    Les modénatures correspondent à l’ensemble des moulures et des éléments de décor qui ornent une façade\n    notamment les encadrements, corniches, bandeaux…\n    MUR BAHUT\n    Un mur bahut est un mur surmonté d’un ouvrage, généralement une grille ou une barrière à claire-voie.\n    MUR PIGNON / PIGNON\n    Le pignon ou mur pignon est une façade ne comportant aucune baie.\n    MUR DE SOUTENEMENT\n    Un mur de soutènement est un ouvrage de maçonnerie destiné à soutenir, contenir, s’opposer aux poussées\n    du terrain existant.\n    MUR VEGETALISÉ\n    Un mur végétalisé est un mur recouvert d’un système de culture permettant la végétalisation verticale de\n    façades avec accroche au sol.\n30\n    MUTUALISATION DU STATIONNEMENT :\n    La mutualisation du stationnement consiste en la réalisation d’un seul parc de stationnement, commun à\n    plusieurs opérations immobilières et/ou à plusieurs destinations de constructions. Les places répondant aux\n    besoins de plusieurs opérations immobilières et/ou d’usages différents (logements, bureaux, commerces,\n    etc.) sont ainsi regroupées, mutualisées, dans un seul parc de stationnement (parking non cloisonné avec\n    accès commun) avec une gestion unique.\n    Lors d’une mutualisation sans foisonnement (voir définition de foisonnement), le nombre de places\n    correspond à la somme des besoins de chaque opération ou construction.\n    La mutualisation peut s’accompagner d’un foisonnement du stationnement.\n    NIVEAU\n    Un niveau est le volume compris entre le dessus du plancher bas et le dessus du plancher haut qui lui est\n    immédiatement supérieur : rez-de-chaussée, étages courants, attiques, combles aménageables.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\nLes mezzanines ne sont pas considérées comme un niveau si elles répondent aux trois conditions\ncumulatives suivantes :\n    Être dans une pièce en rez-de-chaussée d’une hauteur libre de 4,70 mètres minimum,\n    Avoir une superficie inférieure ou égale à la moitié de la superficie de ladite pièce,\n    Être implantée à une distance supérieure ou égale à 1,50 mètre de toute baie vitrée.\nLes niveaux considérés comme sous-sols ne sont pas comptabilisés dans le calcul du nombre de niveaux\npour les hauteurs.\nLes sous-sols sont les niveaux inférieurs des constructions situés en dessous du niveau du terrain après\ntravaux. Est également considéré comme sous-sol le niveau inférieur d’une construction dont au plus 1,50 m\nde la hauteur émerge au-dessus du niveau du terrain après travaux.\n    31\nSi pour des raisons d’accessibilité, un hall d’entrée crée un demi-niveau, celui-ci ne sera pas comptabilisé\ncomme un niveau.\nNIVEAU DE RÉFÉRENCE\nLe niveau de référence est constitué par le niveau du terrain existant avant tous travaux d’exhaussement ou\nd’excavation exécutés en vue de la réalisation du projet faisant l’objet de la demande d’autorisation.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\n    Toutefois, à Boulogne-Billancourt, le niveau de référence est constitué par la moyenne des altitudes\n    orthométriques (NGF) mesurées sur la voie publique ou privée au droit de la parcelle.\n    Le niveau de référence ne s’applique pas en zone U3 à Chaville, Meudon, Sèvres et Ville-d’Avray (pour les\n    modalités de calcul de la hauteur, voir définition de Hauteur).\n    ORIEL\n    Un oriel est un volume largement vitré en encorbellement formant une saillie sur le mur de façade.\n    PLEINE-TERRE\n    Voir Espaces de pleine-terre\n    RECONSTRUCTION\n    La reconstruction est une opération de construction qui intervient après la démolition d’une construction ou\n    d’un ensemble de constructions ou après leur destruction par sinistre.\n    RECUL\n    Le recul est la distance, mesurée horizontalement et perpendiculairement en tout point de la façade de la\n    construction, séparant celle-ci du point le plus proche de l’alignement existant ou projeté (emplacement\n    réservé par exemple). Le recul peut également se calculer depuis l’alignement opposé ou l’axe des voies\n    lorsque cela est précisé dans la règle d’implantation. La marge de recul constitue l’intervalle entre\n    l’alignement et la construction ou la partie de construction.\n32\n    RÈGLE GÉNÉRALE\n    Règle qui s’applique à toutes situations.\n    RÈGLE PARTICULIÈRE\n    Règle qui s’applique pour une situation particulière en complément ou en substitution de la règle générale.\n    RÈGLE ALTERNATIVE\n    Règle qui constitue une alternative à la règle générale ou à la règle particulière créant de ce fait une seconde\n    façon d’être conforme au règlement.\n    RÉHABILITATION\n    Une réhabilitation est une opération visant à réutiliser une construction existante, avec ou sans changement\n    de destination ou de sous-destination, dans le respect de sa volumétrie, de ses structures et de ses éléments\n    porteurs.\n    RÉNOVATION\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\nUne rénovation est une opération de remise à neuf comportant possiblement un ensemble de travaux de\ndémolition, de construction et d’aménagement, n’entraînant pas une modification de l’emprise au sol des\nconstructions, ni ne portant une atteinte significative à leur structure interne ou externe. Une rénovation peut\naboutir à la démolition partielle de la construction d’origine sans constituer une reconstruction.\nRESTAURATION\nLa restauration correspond à des actions sur une construction ou une ruine qui permettent de recomposer\nsa structure, de lui redonner sa forme ou son éclat. Il peut s’agir de travaux de remise à l’état initial ou du\nplus ancien connu.\nRETRAIT\nLe retrait est la distance, mesurée horizontalement et perpendiculairement en tout point de la façade de la\nconstruction, séparant celle-ci de la limite séparative. Suivant le contexte et la règle, le retrait peut aussi\ndésigner la distance entre deux éléments, par exemple : règle de distance minimale d’un dispositif de\nproduction ENR par rapport au nu de la façade.\n    33\nRUINE\nUne ruine correspond à toute construction ayant perdu son caractère utilisable, notamment par l’absence de\ntoiture et de fermeture (baies, fenêtres, portes…). Un bâtiment est devenu une ruine lorsqu’il n’offre plus les\ngaranties de solidité nécessaires au maintien de la sécurité publique ou lorsqu’il y a danger pour la sécurité\ndes occupants ou des voisins.\nSAILLIE\nUne saillie est un corps d’ouvrage ou élément architectural d’une construction pouvant constituer un volume\nclos et couvert et en avant du nu de la façade (balcon, escalier extérieur, débord de toiture, oriels, appui de\nfenêtre...). Cela comprend également les saillies ornementales (bandeaux, corniches, encadrements,\npilastres, nervures, corniches, auvents, marquises...).\nSENTE\nPetite voie non carrossable, publique ou privée, ouverte ou non à la circulation publique, aménagée ou non.\nSERVITUDE DE COUR COMMUNE\nUne servitude de cour commune (servitude de droit privé établie par convention) a pour objet d’assurer une\ncertaine distance entre les constructions et de garantir un certain prospect (distance minimale) entre les bâtis\nde deux propriétés voisines.\nEn rendant inconstructible une partie de la propriété voisine, la servitude de cour commune permet de\ncalculer le retrait de la construction projetée par rapport à un point situé sur la propriété voisine et non au\nregard des limites séparatives du terrain d’assiette (articles L.471-1 du code de l’urbanisme).\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\n    SOUBASSEMENT\n    Partie basse de la construction.\n    SOUS-DESTINATIONS\n    Voir Destinations.\n    SURFACE DE PLANCHER (SDP)\n    La surface de plancher correspond à la définition en vigueur dans le code de l’urbanisme (article R111-22\n    du Code de l’Urbanisme).\n    SURFACE ECO-AMÉNAGÉE\n    Une surface éco-aménagée est considérée comme favorable à la biodiversité et à la nature en ville, au\n    respect du cycle de l’eau et à la régulation du microclimat. Ces surfaces et leur pondération respective sont\n    prises en compte dans le calcul du Coefficient de biotope surfacique (CBS).\n    SURFACE DE VENTE\n    La surface de vente d’un magasin de commerce de détail comprend la superficie des espaces couverts et\n    non couverts, affectés :\n    À la circulation de la clientèle pour effectuer ses achats ;\n    À l’exposition des marchandises proposées à la vente ;\n    Au paiement des marchandises ;\n    À la circulation du personnel pour présenter les marchandises à la vente.\n34\n    En sont notamment exclus :\n    Les mails des centres commerciaux desservant plusieurs commerces sous réserve que n’y soit\n    exposée aucune marchandise destinée à la vente ;\n    Les ateliers d’entretien, de réparation, de fabrication ou de préparation des marchandises\n    proposées à la vente, si leur accès est interdit au public ;\n    Les réserves.\n    TERRAIN\n    Un terrain est un ilot de propriété d'un seul tenant composé d'une parcelle ou d’un ensemble de parcelles\n    appartenant à un même propriétaire ou à la même indivision.\n    TERRAIN D’ANGLE\n    Un terrain d’angle est situé au croisement de plusieurs voies et/ou emprises publiques.\n    Un terrain traversant sans être au croisement des plusieurs emprises publiques et/ou voies n'est pas\n    considéré comme un terrain d'angle.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\nTERRAIN D’ASSIETTE\nLe terrain d’assiette du projet est constitué par une ou des parcelles appartenant à un ou plusieurs\npropriétaires, formant un ensemble d’un seul tenant, délimité par des voies ou les autres propriétés contigües\n(publiques ou privées).\nTERRAIN EXISTANT\nLe terrain existant correspond au terrain à la date de dépôt de la demande avant tout travaux\nd’exhaussement ou d’affouillement exécutés en vue de la réalisation du projet faisant l’objet de la demande.\n(PAN DE) TOITURE\nUn pan de toiture est une surface plane formée par un versant de toiture.\nTOITURE VEGETALISÉE\nUne toiture végétalisée est plate ou à faible pente recouverte d’un substrat végétalisé.\nTRAVAUX SUR L’EXISTANT\nLes travaux sur l’existant consistent à réaliser des travaux sur les parties anciennes de la construction ou de\nl'ouvrage existant avant l'ouverture du chantier. Ils peuvent être de diverses natures, notamment :\n    Rénovation\n    Réhabilitation\n    Restauration\n    Extension\n    35\nUNITÉ FONCIÈRE\nVoir Terrain\nVOIE\nUne voie s’entend comme l’espace ouvert à la circulation publique. Elle peut être de statut public ou privé.\nElle peut comprendre selon les cas la partie de la chaussée ouverte à la circulation des véhicules motorisés,\nles emprises cyclables, l’emprise réservée au passage des piétons et les fossés et talus la bordant. Elle peut\navoir diverses fonctions (voies piétonnes, cyclistes, routes, chemins, mails …). Le cahier réglementaire 7.\n  Cahier des références aux voiries précise le statut de certaines voies au regard des règles d’implantation.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    1. Dispositions générales\n    2. Affectation des\n36\n    sols, destination des\n    constructions et\n    natures d'activités\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    2. Affectations des sols, destinations des constructions et natures des activités – Zones Urbaines\n2.1. Zones urbaines\nLes constructions existantes dont la destination n’est pas autorisée peuvent faire l’objet de travaux de\nréhabilitation, à l’exclusion de toute création de surface de plancher.\nLes usages et affectations des sols existants non autorisés, ainsi que les activités existantes non-autorisées\npeuvent faire l’objet de travaux de réhabilitation, et mise aux normes.\nLes constructions existantes dont la destination est soumise à condition(s) et/ou limitation(s) peuvent faire\nl’objet de travaux de réhabilitation, ou d’extension dans le respect des conditions et limitations définies dans\nles tableaux ci-après.\nLes usages et affectations des sols existants soumis à condition(s) et/ou limitation(s) peuvent faire l’objet de\ntravaux de réhabilitation et mise aux normes, et de nouveaux aménagements dans le respect des conditions\net limitations définies dans les tableaux ci-après.\nLes activités existantes soumises à condition(s) et/ou limitation(s) peuvent faire l’objet de travaux de\nréhabilitation et mise aux normes, et de nouvelles installations dans le respect des conditions et limitations\ndéfinies dans les tableaux ci-après.\nLes nouvelles constructions, les extensions, les changements de destination des constructions existantes,\nles nouveaux usages et affectations des sols, ainsi que les nouvelles activités et installations sont autorisés,\ninterdits ou soumis à conditions et à limitations en référence aux tableaux ci-après.\nDispositions spécifiques à Meudon et à Vanves\nEn plus des arrêtés préfectoraux valant plans de prévention des risques naturels et plans de\nprévention des risques mouvements de terrain s’appliquant à ces deux communes, des périmètres\nd’aléas relatifs aux anciennes carrières sont identifiés sur des cartes annexées au PLUi (annexe\n5.2.22 – Porter à connaissance anciennes carrières pour les communes de Meudon et de Vanves).\n    37\nAu sein de ces périmètres, les interdictions, conditions et limitations suivantes s’appliquent.\nToute occupation ou utilisation du sol, en particulier tout projet de construction, doit faire l'objet de\ndispositions constructives visant à garantir sa stabilité vis à vis des mouvements de terrain. Les projets\npourront être autorisés après avis et sous réserve de l’observation des prescriptions spéciales qui seraient\némises par l’Inspection Générale des Carrières.\nDans toutes les zones d’aléas identifiées, les puisards ou les puits d’infiltration dans sont interdits.\nSous réserve que le pétitionnaire mette en œuvre les mesures nécessaires pour s’assurer de la stabilité du\nsol (comblement ou traitement des anciennes carrières, adaptation des fondations…), à partir de la\nréalisation d’études géotechniques, sont autorisés :\n    ▪   En zones d’aléa très fort :\n    o    A Meudon, les constructions nouvelles sont interdites, à l’exception de reconstruction à\n    l’identique sous réserve de l’accord et du respect des prescriptions de l’IGC.\n    o    A Vanves, les seules constructions nouvelles et extensions dont la destination figure parmi\n    les destinations autorisées dans la zone ou le secteur, dès lors qu’elles sont situées à\n    l’intérieur d’une zone d’aménagement concerté (ZAC) ou d’un quartier prioritaire de la\n    politique de la ville (QPV).\n    ▪   Dans les zones d’aléa fort à faible : les constructions nouvelles et extensions dont la destination\n    figure parmi les destinations autorisées dans la zone ou le secteur.\n    ▪   Dans toutes les zones d’aléa :\n    o    Les travaux nécessaires au fonctionnement des services publics et les travaux\n    d’aménagement permettant de réduire l’exposition au risque,\n    o    La reconstruction à l’identique est autorisée, sous réserve d’un avis favorable, le cas échéant\n    assorti de prescriptions, de l'inspection Générale des Carrières.\n    ▪   Il est rappelé que :\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    2. Affectation des sols, destinations des constructions et natures d’activités – Zones urbaines\n    o   Le projet pourra être refusé ou n'être accepté que sous réserve de l'observation de\n    prescriptions spéciales, s'il est de nature à porter atteinte à la sécurité publique ;\n    o   Le pétitionnaire doit se reporter aux recommandations qui sont associées au porter à\n    connaissance : « recommandations en matière d’urbanisme et fiche relative aux modalités\n    de mise en œuvre des études et travaux » présentes au sein du tome 5 « Annexes » du\n    dossier de PLUi.\n38\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    2. Affectations des sols, destinatio de nouveaux aménagements dans le respect des conditions\net limitations définies dans les tableaux ci-après.\nLes activités existantes soumises à condition(s) et/ou limitation(s) peuvent faire l’objet de travaux de\nréhabilitation et mise aux normes, et de nouvelles installations dans le respect des conditions et limitations\ndéfinies dans les tableaux ci-après.\nLes nouvelles constructions, les extensions, les changements de destination des constructions existantes,\nles nouveaux usages et affectations des sols, ainsi que les nouvelles activités et installations sont autorisés,\ninterdits ou soumis à conditions et à limitations en référence aux tableaux ci-après.\nDispositions spécifiques à Meudon et à Vanves\nEn plus des arrêtés préfectoraux valant plans de prévention des risques naturels et plans de\nprévention des risques mouvements de terrain s’appliquant à ces deux communes, des périmètres\nd’aléas relatifs aux anciennes carrières sont identifiés sur des cartes annexées au PLUi (annexe    45\n5.2.22 – Porter à connaissance anciennes carrières pour les communes de Meudon et de Vanves).\nAu sein de ces périmètres, les interdictions, conditions et limitations suivantes s’appliquent.\nToute occupation ou utilisation du sol, en particulier tout projet de construction, doit faire l'objet de\ndispositions constructives visant à garantir sa stabilité vis à vis des mouvements de terrain. Les projets\npourront être autorisés après avis et sous réserve de l’observation des prescriptions spéciales qui seraient\némises par l’Inspection Générale des Carrières.\nDans toutes les zones d’aléas identifiées, les puisards ou les puits d’infiltration dans sont interdits.\nSous réserve que le pétitionnaire mette en œuvre les mesures nécessaires pour s’assurer de la stabilité du\nsol (comblement ou traitement des anciennes carrières, adaptation des fondations…), à partir de la\nréalisation d’études géotechniques, sont autorisés :\n    ▪    En zones d’aléa très fort :\n    o   A Meudon, les constructions nouvelles sont interdites, à l’exception de reconstruction à\n    l’identique sous réserve de l’accord et du respect des prescriptions de l’IGC.\n    o   A Vanves, les seules constructions nouvelles et extensions dont la destination figure parmi\n    les destinations autorisées dans la zone ou le secteur, dès lors qu’elles sont situées à\n    l’intérieur d’une zone d’aménagement concerté (ZAC) ou d’un quartier prioritaire de la\n    politique de la ville (QPV).\n    ▪    Dans les zones d’aléa fort à faible : les constructions nouvelles et extensions dont la destination\n    figure parmi les destinations autorisées dans la zone ou le secteur.\n    ▪    Dans toutes les zones d’aléa :\n    o   Les travaux nécessaires au fonctionnement des services publics et les travaux\n    d’aménagement permettant de réduire l’exposition au risque,\n    o   La reconstruction à l’identique est autorisée, sous réserve d’un avis favorable, le cas échéant\n    assorti de prescriptions, de l'inspection Générale des Carrières.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    2. Affectation des sols, destinations des constructions et natures d’activités – Zone Naturelle\n    ▪   Il est rappelé que :\n    o   Le projet pourra être refusé ou n'être accepté que sous réserve de l'observation de\n    prescriptions spéciales, s'il est de nature à porter atteinte à la sécurité publique ;\n    o   Le pétitionnaire doit se reporter aux recommandations qui sont associées au porter à\n    connaissance : « recommandations en matière d’urbanisme et fiche relative aux modalités\n    de mise en œuvre des études et travaux » présentes au sein du tome 5 « Annexes » du\n    dossier de PLUi.\n46\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 0 2.2.4.    Limitations et conditions\n(1) Limité aux seules extensions et annexes des constructions existantes à destination d’habitation :\n    ▪    Le total cumulé de la surface de plancher des extensions des habitations et des annexes à construire\n    est limitée à 30% de la surface de plancher de la construction d’habitation principale, sans excéder\n    60 m² de surface de plancher.\n    ▪    L’implantation des extensions et annexes doit s’inscrire dans un périmètre de 15 mètres maximum\n    depuis la construction principale existante à destination d’habitation.\n   Condition : ne pas compromettre l’activité agricole ou forestière et la qualité paysagère du site.\n(2) Limité aux seules constructions et installations nécessaires aux équipements d’intérêt collectif et services\npublics existants à la date d’approbation du PLUi.\n   Conditions :\n    ▪    Ne pas porter atteinte à la sauvegarde des espaces naturels et des paysages,\n    ▪    Ne pas être incompatible avec l'exercice d'une activité agricole ou forestière du terrain.\n(3) Limité au seul changement de destination d’une construction existante et identifié au document\ngraphique.\n   Condition : ne pas compromettre l’activité agricole ou forestière et la qualité paysagère du site.\n(4) Conditions :\n    ▪    Ne pas porter atteinte à la sauvegarde des espaces naturels et des paysages,\n    ▪    Ne pas être incompatible avec l'exercice d'une activité agricole, pastorale ou forestière sur le terrain\n    du projet.    49\n Limité à 49 emplacements pour les aires de stationnement ouvertes au public.\n(5) Conditions : conserver les qualités d’infiltration des sols et limiter l’abattage d’arbres.\n(6) Conditions :\n    ▪    Ne présenter aucun risque d’atteinte à la sauvegarde des espaces naturels,\n    ▪    D’une compatibilité avec le voisinage immédiat et rapproché,\n    ▪    Prévoir une intégration paysagère.\n(7) Condition : être liée aux énergies renouvelables ou de récupération (EnRR) ou aux locaux techniques et\nindustriels des administrations publiques et assimilés ou aux installations qui leur sont nécessaires.\n(8) Condition : être nécessaires et indispensables aux constructions, installations et aménagements\nautorisés.\nDans tous les cas, les constructions ou aménagements doivent se conformer aux prescriptions et exigences\nliées aux servitudes d’utilité publique les impactant.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    2. Affectation des sols, destinations des constructions et natures d’activités – Zone Naturelle\n    2.3. Autres périmètres et secteurs particuliers\n    2.3.1.    Périmètres d’attente de projet d’aménagement global (PAPAG)\n    Des périmètres d’attente de projet d’aménagement global au titre de l’article L. 151-41, 5°, du code de\n    l’urbanisme sont délimités sur le plan n°4.2 Plan des prescriptions et périmètres particuliers.\n    Au sein de ces périmètres :\n    ▪    Les travaux ayant pour objet l'adaptation, le changement de destination, la réfection ou l'extension\n    limitée des constructions existantes sont autorisés,\n    ▪    PAPAG n°1 : les constructions et installations supérieures à 200 m² d’emprise au sol et 400 m² de\n    surface de plancher sont interdites,\n    ▪    PAPAG n°2 : les constructions et installations supérieures à 50 m² d’emprise au sol et 100 m² de\n    surface de plancher sont interdites.\n    ▪    PAPAG n°3 : les constructions et installations supérieures à 50 m² d’emprise au sol et 100 m² de\n    surface de plancher sont interdites.\n    Les périmètres d’attente de projet d’aménagement global cessent de produire leurs effets à compter de 5\n    années consécutives suivant la date d’approbation du plan local d’urbanisme intercommunal.\n    2.3.2.    Secteurs de taille et de capacité d’accueil limitées\n    Des secteurs de taille et de capacité d’accueil limitées (STECAL) sont délimités au sein de la zone naturelle\n    et figurent au document graphique n°4.1 Plan général :\n    ▪    STECAL n°1 : sont exclusivement autorisés les constructions, installations et aménagements à\n50    destination d’équipements sportifs.\n    ▪    STECAL n°2 : sont exclusivement autorisés les constructions, installations et aménagements à\n    destination d’exploitation agricole, des locaux techniques et industriels des administrations publiques\n    et assimilés, d’équipements sportifs et d’activité de service avec accueil d’une clientèle.\n    ▪    STECAL n°3 : sont exclusivement autorisés les constructions, installations et aménagements à\n    destination d’équipements sportifs et d’activité de service avec accueil d’une clientèle.\n    ▪    STECAL n°4 : sont exclusivement autorisés les constructions, installations et aménagements à\n    destination d’équipements d’intérêt collectif et services publics et de restauration.\n    ▪    STECAL n°5 : sont exclusivement autorisés les constructions, installations et aménagements à\n    destination d’équipements d’intérêt collectif et services publics.\n    ▪    STECAL n°6 : sont exclusivement autorisés les constructions, installations et aménagements à\n    destination d’équipements d’intérêt collectif et services publics.\n    ▪    STECAL n°7 : sont exclusivement autorisés les constructions, installations et aménagements à\n    destination d’équipements d’intérêt collectif et services publics et de restauration.\n    ▪    STECAL n°8 : sont exclusivement autorisés les constructions, installations et aménagements à\n    destination d’équipements d’intérêt collectif et services publics.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","3. Morphologie et implantation des constructions – Zone U1\n    3. Morphologie et    51\n    implantation des\n    constructions\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Zone U1\n    Centralités\n    La zone U1 correspond aux différentes zones de centralités, qui se caractérisent notamment par une\n    intensité importante et une grande mixité des fonctions. Elle est composée de huit secteurs :\n    ▪   U1-A correspondant aux secteurs de centralité de Boulogne-Billancourt. Il se compose de trois\n    sous-secteurs :\n    o   U1-A-1 correspondant à la centralité historique de Boulogne-Billancourt autour\n    notamment du Boulevard Jean-Jaurès. Ce sous-secteur intègre deux sous-sous-secteurs\n    spécifiques :\n    ▪   U1-A-1a correspondant à l’ilot V au nord de la ZAC Seguin Rives-de-Seine,\n    ▪   U1-A-1b correspondant à l’ilot M à l’est de la ZAC Seguin Rives-de-Seine.\n    o   U1-A-2 correspondant à la centralité située sur la partie nord du Trapèze.\n    o   U1-A-3 correspondant à la ZAC Centre-Ville.\n    ▪   U1-B correspondant aux secteurs d’animation et d’intensification par rapport à l’existant, autour des\n    gares de Chaville.\n    ▪   U1-C correspondant aux secteurs de centralité d’Issy-les-Moulineaux. Il se compose de deux sous-\n    secteurs :\n    o   U1-C-1, centre urbain animé se déployant le long de l’axe historique Paris-Meudon et\n    comprenant le centre historique, du secteur Corentin Celton à Mairie d’Issy ainsi que la partie\n    ouest de la ZAC Leon Blum et jusqu’à Meudon. Il intègre également une partie des secteurs\n    ayant fait l’objet d’opérations de renouvellement urbain d’envergure.\n52    o   U1-C-2 correspond à la partie centrale de la ZAC Léon Blum et à une partie des secteurs\n    ayant fait l’objet d’opérations de renouvellement urbain d’envergure.\n    ▪   U1-D correspondant aux secteurs de centralité de Marnes-la-Coquette. Il comprend le cœur du\n    village, autour de la Mairie et de l’église, le long de la rue de la porte Blanche et de l’allée de\n    Villeneuve l’Etang ainsi que le secteur au carrefour des rues de Versailles, Yves Cariou et Georges\n    et Xavier Schlumberger.\n    ▪   U1-E correspondant aux principaux secteurs de centralité de Meudon. Il comprend particulièrement\n    les secteurs animés de la rue de la République, de Bellevue et de la gare Val Fleury, ainsi que le\n    secteur de Meudon-sur-Seine.\n    ▪   U1-F correspondant au secteur de centralité intercommunale située le long de la RD 910 à Sèvres\n    et Chaville. Il intègre le centre-ville de Sèvres dans la diversité de ses tissus urbains et des fonctions\n    urbaines avec une densité importante, ainsi que la partie ouest de l’avenue Roger Salengro à\n    Chaville en direction de Viroflay. Il comprend deux sous-secteurs spécifiques :\n    o   U1-F-1 correspondant au secteur mixte près des berges de Seine à Sèvres et au centre-\n    ville de Chaville qui accueille une pluralité de fonctions et une animation nécessaire à\n    l'attractivité du centre-ville.\n    o   U1-F-2 correspondant à une partie du projet concernant le centre-ville de Sèvres.\n    ▪   U1-G correspondant aux secteurs de centralité de Vanves. Il se compose de deux sous-secteurs :\n    o   U1-G-1, centre historique de Vanves autour de la Place de la République et l’église Saint-\n    Rémy,\n    o   U1-G-2, autres espaces de centralité correspondant aux abords des axes structurants (axe\n    nord-sud et axe est-ouest) et aux abords de la gare Vanves-Malakoff.\n    ▪   U1-H correspondant aux secteurs de centralité de Ville-d’Avray. Il se compose de deux sous-\n    secteurs :\n    o   U1-H-1, centre-ville principalement structuré autour de la rue de Saint-Cloud, une petite\n    partie de la rue de Sèvres, de la rue Grange Fontenelle et de Accusé\n    la rueded mètre de profondeur,\n    o   Les oriels de moins de 0,40 mètre de profondeur et à partir d’une hauteur de 5,50 mètres,\n    o   Les balcons dans la limite de 1,20 mètre de profondeur,    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Implantation par rapport aux emprises publiques et aux voies\n    o   Les perrons, terrasses et emmarchements,\n    o   Les ouvrages d’amélioration ou de mise aux normes d’une construction pour la sécurité ou\n    l’accessibilité pour les personnes à mobilité réduite, en cas de travaux sur des\n    constructions existantes,\n    o   Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou\n    environnementale des constructions, notamment ceux nécessaires à l’isolation thermique\n    par l’extérieur et les dispositifs de protection contre le rayonnement solaire, en cas de\n    travaux sur des constructions existantes, dans la limite de 0,40 mètre d’épaisseur,\n    o   Les rampes de garage desservant le sous-sol ou le rez-de-chaussée de la construction ;\n    o   Les escaliers, les rampes d’accès et les passerelles non couvertes.\n    c.   En cas de présence d’un alignement d’arbres repéré au plan 4.3 Protections, la préservation des\n    arbres prévaut sur les dispositifs non pris en compte pour l’application des règles d’implantation.\n    d. Sauf mention contraire au sein du présent règlement, les projets de construction intégrant un\n    programme à destination d’équipement d’intérêt collectif et services publics au sein d’une même\n    construction peuvent bénéficier des règles spécifiques définies pour les constructions à destination\n    d’équipement d’intérêt collectif et services publics, dès lors que :\n    o   La destination équipement d’intérêt collectif et services publics concerne 100% de la\n    surface de plancher du rez-de-chaussée, exception faite des parties communes et des\n    accès nécessaires au fonctionnement de la construction,\n    o   Ou que la destination équipement d’intérêt collectif et services publics concerne au moins\n    50% de la surface de plancher de la construction,\n3.1.2.    Règle générale :\nSauf disposition particulière dans la règle graphique, notamment les marges de recul ou obligation    55\nd’alignement indiqués sur le plan 4.2 des prescriptions et périmètres particuliers, les constructions doivent\ns’implanter en respectant les règles suivantes par rapport aux emprises publiques et aux voies :\n   Secteur    Règles applicables\n    ▪   L’implantation des constructions à destination d’équipements d’intérêt collectif et\n    services publics, n’est pas réglementée.\n    ▪   Implantation vis-à-vis des sentes piétonnes : à l’exception du sous-secteur U1-F-2,\n    les constructions doivent être implantées avec un recul supérieur ou égal 3 mètres.\n  Zone U1\n    ▪   L’implantation de locaux destinés au stockage des ordures ménagères nécessaire\n    au tri n’est pas règlementée.\n  Secteurs\n    ▪   Pour les constructions qui s’implantent à l’alignement, des reculs de parties de\n    façade, en longueur ou en hauteur, sont autorisés, depuis l’alignement.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Implantation par rapport aux emprises publiques et aux voies\n U1-B    ▪   En cas d’implantation à l’alignement de deux voies ouvertes à la circulation\n U1-C    automobile, un nouvel alignement peut être défini par un pan coupé pour favoriser\n    l’insertion urbaine et la sécurité. Ce pan coupé doit être d’une longueur comprise\n U1-D    entre 3 mètres et 7 mètres, à déterminer en fonction des circonstances locales. Le\n    nouvel alignement peut également être matérialisé par un arc de cercle de dimension\n U1-E\n    équivalente.\n U1-F\n U1-G\n U1-H\n    ▪   Le nouvel alignement peut également être matérialisé par un arc de cercle de\n    dimension équivalente. Cette disposition n’est pas applicable dans le sous-secteur\n    U1-H-2.\n    ▪   La réalisation de porches d’au moins 5 mètres de hauteur est autorisée, lorsqu’ils\n    permettent une continuité visuelle vers le cœur d’ilot ou à travers le terrain.\n    ▪   Les constructions doivent être implantées à l’alignement.\n    ▪   En cas d’Espace écologique et/ou paysager protégé situé en bordure de voie, un\n    alignement nouveau à prendre en compte pour l’application des règles d’implantation\n    par rapport aux emprises publiques et voies, débutera après l’Espace écologique\n    et/ou paysager protégé.    56\n    ▪   Dans le cas d’un terrain situé à l’angle de trois voies, un recul supérieur ou égal à 1\n    mètre peut être accepté depuis l’une de ces voies, dès lors qu’il ne crée pas de\n    pignon.\nSecteur\n U1-B\n    ▪   Dans le cas où les constructions voisines, existantes sur le terrain, ou contigües de\n    la construction projetée, ne respectent pas les règles générales d’implantation, la\n    nouvelle construction peut s'adosser à la construction.\n    ▪   L’implantation des constructions par rapport aux emprises publiques est définie au\n    chapitre 10.7 du règlement (cahier des références aux voiries) ou par une marge de\nSecteur    recul matérialisée sur le document graphique n°4.2 Plan des prescriptions et\n    périmètres particuliers. Néanmoins, en l’absence d’indication au chapitre 10.7 du\n U1-C    règlement ou sur le document graphique n°4.2 Plan des prescriptions et\n    périmètres particuliers, aucune construction n’est autorisée à moins de 5 m de l’axe\n    de l’emprise publique ou de la voie, existante ou future si un élargissement est prévu.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Implantation par rapport aux emprises publiques et aux voies\n    ▪   Au moins 50% des surfaces de marges de recul, en dehors des accès piétons et\n    véhicules, doivent être traitées en espace végétalisé.\n    ▪   Toutefois dans un objectif d’harmonisation des façades, dans le cas où les\n    constructions voisines existantes sur le terrain, ou contigües de la construction\n    projetée ne respectent pas les règles générales d’implantation, des implantations en\n    tout ou partie, à l’identique de celles des constructions voisines, peuvent être\n    autorisées.\n    ▪   Par ailleurs, pour permettre d'améliorer la qualité architecturale, les reculs partiels de\n    la façade en longueur et/ou en hauteur par rapport au plan vertical de l’alignement,\n    peuvent être autorisés.\n    ▪   Les façades peuvent intégrer un décrochement ponctuel pour l’entreposage des\n    déchets en attente de collecte.\n    ▪   Les constructions peuvent s’implanter à l’alignement ou en recul.\n    ▪   Le recul par rapport à l'alignement opposé, doit être supérieur ou égal à la hauteur\n    totale de la construction soit L ≥ Ht.\nSecteur\n U1-D\n    57\n    ▪   Les constructions peuvent s’implanter à l’alignement ou en recul.\n    ▪   En cas de recul, celui-ci doit être supérieur ou égal à la moitié de la hauteur totale de\n    la construction soit L ≥ Ht/2, sans être inférieur à 2,5 mètres.\nSecteur\n    Implantation des constructions par rapport aux sentes piétonnes :\n U1-E\n    ▪   Les constructions annexes sont autorisées en limite de sente piétonne à condition\n    de s'adosser à un mur de clôture existant à l’alignement de ladite sente sans\n    dépasser 2 mètres et la hauteur de ce mur.\n    ▪   En cas d’Espace écologique et/ou paysager protégé situé en bordure de voie, un\n    alignement nouveau à prendre en compte pour l’application des règles d’implantation\n    par rapport aux emprises publiques et voies, débutera après l’Espace écologique\n    et/ou paysager protégé.\n    ▪   Les constructions peuvent s’implanter à l’alignement ou en recul.\nSecteur\n    ▪   En cas de recul, celui-ci ne peut être inférieur à 4 mètres.\n U1-F\n    ▪   Lorsque la voie ou l’emprise publique au droit du terrain correspond à une limite avec\n    la zone U3, les constructions doivent être implantées en recul de 4 mètres minimum.\n    ▪   En cas de recul, celui-ci ne doit pas créer de mur pignon.\n    ▪   Dans le sous-secteur U1-F-2, l’implantation des constructions n’est pas\n    réglementée.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Implantation par rapport aux emprises publiques et aux voies\n    ▪   Les constructions doivent être implantées à l’alignement. Cette obligation s’impose\n    au moins sur une hauteur de 12 m dans le secteur U1-G-1 et 15 mètres dans le\n    secteur U1-G-2.\n    ▪   L’alignement est réputé acquis dès lors qu’au moins 50% du linéaire de la\n    construction en vis-à-vis des emprises publiques et voies, est implanté à\nSecteur    l’alignement. Pour les constructions ou parties de construction implantées en recul,\n U1-G    le recul est libre. Cette disposition ne s’applique pas dans le cas d’un alignement\n    identifié sur le document graphique n°4.2 Plan des prescriptions et périmètres\n    particuliers.\n    ▪   Lorsqu’un mur de soutènement d’une hauteur supérieure ou égale à 2 mètres est\n    présent au droit du terrain, les constructions peuvent être implantées en tout ou partie\n    soit à l’alignement, soit avec un recul supérieur ou égal à 1 mètre.\n    ▪   Les constructions peuvent s’implanter à l’alignement ou en recul.\n    ▪   En cas de recul, celui-ci doit être supérieur ou égal à 4 mètres.\n    ▪   Les constructions doivent être implantées à l'alignement le long des voies suivantes :\n    rue de Saint-Cloud, rue de Sèvres et le long des linéaires commerciaux repérés sur\n    le document graphique n°4.1 Plan général.\n    ▪   En cas de recul des constructions, la continuité bâtie de l’alignement doit être assurée\n    par l’implantation d’un mur bahut d’une hauteur maximum de 1 mètre,\n    éventuellement surmonté d’un système à claire-voie.\n    ▪   Les nouvelles constructions doivent être implantées en recul supérieur ou égal à 10\n    mètres le long de l’emprise du mail Alphonse Lemerre.\n    ▪   Pour le site n°1 identifié par l’OAP centre-ville, l’alignement pourra être partiel en\n    cas de prolongement de l’espace public de façon à augmenter le linéaire de vitrines    58\n    commerçantes et de services. Toutefois, les constructions en rez-de-chaussée\nSecteur    devront assurer un alignement sur au moins 20% du linéaire de l’interface du terrain\n    avec l’emprise publique. Aucun recul minimum, ni implantation d’un mur bahut pour\n U1-H\n    assurer la continuité du bâti n’est exigé.\n    Schéma indicatif\n    Implantation par rapport aux emprises publiques et aux voies :\n    ▪   Les nouvelles constructions doivent être implantées selon le document graphique\n Sous-    n°4.2 Plan des prescriptions et périmètres particuliers, soit à l'alignement, soit\nsecteur    en recul, s'il existe une marge de recul. Aucun ouvrage souterrain en débordement\nU1-A-1    par rapport à cette implantation obligatoire n'est autorisé, à l’exception des réseaux.\n    ▪   Dans le sous-sous-secteur U1-A-1a : des reculs ponctuels par rapport à\n    l’alignement sont autorisés. En cas de recul, celui-ci peut varier mais ne peut pas\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Implantation par rapport aux emprises publiques et aux voies\n    excéder une profondeur de 6 mètres à compter de l’alignement au nu de la\n    construction voisine contiguë.\n    ▪   Dans le sous-sous-secteur U1-A-1b : les constructions peuvent être implantées à\n    l’alignement ou en recul le long de la rue Heinrich. En cas de recul, celui-ci peut varier\n    mais ne peut excéder une profondeur de 5 mètres à compter de l’alignement et devra\n    s’étendre sur une longueur supérieure ou égale à 20 mètres.\n    ▪   La proportion des oriels mentionnés ci-dessus est limitée à 20 % de la surface de la\n    façade comptée depuis le plancher bas du premier étage jusqu'à la hauteur de\n    façade définie à l'article relatif aux hauteurs maximales de constructions, la façade\n    étant considérée sur tout son linéaire, les oriels autorisés pouvant être répartis tout\n    au long de celui-ci. En cas de terrain d’angle, cette proportion s’applique sur le cumul\n    des longueurs de façades concernées.\n    Réalisations de porches\n    ▪   Les porches sont autorisés. Ils doivent préserver une continuité visuelle depuis\n    l'alignement à travers le terrain et être clos par une grille implantée à l'alignement,\n    soit toute hauteur soit d'une hauteur minimale de 3 mètres.\n    Implantation des constructions le long des emprises publiques et voies :\n    ▪   Les nouvelles constructions peuvent s’implanter soit à l’alignement, soit le long d’une\n    marge de recul ou d’une zone non aedificandi s’il en existe une, soit en recul de ces\n    limites.\n    ▪   Toutefois, le long des voies publiques une implantation des façades à l’alignement\n    selon le document graphique n°4.1 Plan général peut être imposée sur une part\n    significative du linéaire de façade, cette disposition ayant pour objectif de maintenir\n    une continuité avec le tissu existant et de donner forme aux espaces publics.\n    Règles complémentaires :    59\n    ▪   Lorsque le linéaire d’une façade donnant sur les voies publiques est supérieur à 50\n    mètres, une ou plusieurs baies au rez-de-chaussée sur toute la profondeur de la\n    construction, d'au moins 5 mètres de large et d’au plus 6 mètres de large, et de 5\n    mètres de haut minimum doivent être créées dans les nouvelles constructions.\n    ▪   Pour la valorisation du paysage urbain, le long des voies privées et des emprises\n Sous-    publiques, un recul des constructions d’au moins 3 mètres est admis.\nsecteur\nU1-A-2\n    ▪   Lorsqu’il s’agit de préserver l'unité du paysage urbain, et lorsqu'il existe une\n    construction existante contiguë dont l'implantation est en recul par rapport à\n    l'implantation exigée dans les règles générales, les nouvelles constructions doivent\n    se raccorder en s'implantant au nu de la construction existante sur le terrain contigu,\n    sur une longueur de façade comprise entre 3 m et 6 m.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Implantation par rapport aux emprises publiques et aux voies\n    ▪    Sans préjudice des règles de hauteur relatives, le nu des façades des constructions\n    peut être implanté en tout ou partie à l'alignement actuel ou projeté tel qu'il est repéré\n    au cahier des plans de masse.\n    ▪    Au cas où figure au dit secteur de plan-masse une marge de recul en bordure des\n    voies, la limite de cette marge est substituée à l'alignement.\n    ▪    L'implantation du nu des façades sur l'alignement ou sur la marge de recul est\n    obligatoire lorsque figure au plan-masse une délimitation de front bâti imposé.\n    ▪    Les encorbellements au-dessus de la marge de recul sont autorisés dans les\n    conditions définies à l’article relatif aux Saillies et traitements en creux par rapport à\n    la limite d'implantation, ci-dessous.\n    Saillies et traitements en creux par rapport à la limite d'implantation\n   Sous-    ▪    Les saillies de l'alignement sont interdites sur le boulevard Jean-Jaurès.\n  secteur\n    ▪    Les balcons, oriels et saillies de toitures ne dépassant pas 0,80 mètre ne peuvent\n  U1-A-3    être établis que sur les voies publiques d'une largeur supérieure à 8 mètres hormis\n    sur le boulevard Jean-Jaurès où ils sont interdits. Ils doivent être placés à 4,30 mètres\n    au moins au-dessus du sol, à moins qu'il n'existe devant la façade un trottoir de 1,50\n    mètre de largeur au moins, auquel cas la hauteur de 4,30 mètres peut être réduite\n    jusqu'au minimum de 3,30 mètres.\n    ▪    Dans la zone de traitement architectural repérée au cahier des plans de masse, les\n    constructions sur arcades sont autorisées en emprise sur les voies adjacentes\n    privées ou publiques sous réserve, pour ces dernières, de déclassement du volume\n    nécessaire. De même, l'édification de constructions sur porches enjambant des voies\n    publiques ou privées est autorisée dans les zones repérées au document graphique.\n    ▪    Les constructions en sous-sol sont autorisées sans condition particulière y compris\n    dans les marges de recul par rapport aux alignements existants ou projetés, de    60\n    même que les ouvrages en superstructure destinés à leur accès et à leur\n    fonctionnement.\n3.1.3.    Règles particulières :\n Secteur    Règle de césure\n    A l’exception des sous-sous-secteurs U1-A-1a et U1-A-1b :\n  Sous-    ▪    Pour la valorisation du paysage urbain et lorsque soit le terrain comporte un Espace\n secteurs    écologique et/ou paysager protégé, soit la façade de la nouvelle construction\n    présente une longueur supérieure ou égale à 30 mètres, au moins une césure sur\n  U1-A-1    toute la hauteur et toute la profondeur de la construction, d'au moins 4 mètres de\n  U1-A-2    large, doit être créée, cette césure pouvant recevoir des passerelles et des balcons.\n    Dans le sous-secteur U1-A-2, la longueur maximale de la façade est portée à 50\n    mètres.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Implantation par rapport aux emprises publiques et aux voies\n3.1.4.    Règles alternatives :\n Secteur    Cas des travaux sur constructions existantes ne respectant pas les règles\n    d’implantation\n    ▪    Dans le cas de constructions existantes, ne respectant pas les règles générales\n    d’implantation par rapport aux emprises publiques et aux voies, sont autorisés pour\n    les parties de construction ne respectant pas les règles d’implantation :\n    o   Les travaux qui améliorent l’implantation vis-à-vis des règles générales et\n    ceux sans effet sur le gabarit de la construction existante.\n    o   A l’exception du secteur U1-A, les extensions verticales et horizontales\n    avec un recul égal ou supérieur à celui des constructions existantes, sauf\n    pour les parties de constructions situées dans un emplacement réservé,\n Zone U1\n    o   Les annexes existantes ne sont pas concernées par les dispositions relatives\n    aux possibilités d’extension verticale ou horizontale.\n    ▪    En dehors des parties de constructions ne respectant pas les règles d’implantation,\n    les règles générales s’appliquent.\n    61\n Secteur    Articulation avec l’environnement existant\n    À l’exception du sous-secteur U1-A-3 :\n    ▪    Lorsqu’il s’agit de préserver l'unité du paysage urbain, et lorsqu'il existe une\n    construction voisine existante et pérenne implantée en limite séparative dont\n    l'implantation est en recul par rapport à l'implantation exigée dans les règles\n    communes, les nouvelles constructions peuvent se raccorder en s'implantant au nu\n    de la construction existante sur le terrain contigu, sur une longueur de façade\n    comprise entre 3 mètres et 6 mètres.\n Zone U1\n    ▪    Afin de préserver des plantations existantes, qu'elles soient sur le domaine privé ou\n    sur le domaine public, un recul des nouvelles constructions peut être autorisé.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Implantation par rapport aux emprises publiques et aux voies\nSecteur    Autres cas de figure\n    ▪   Des implantations alternatives peuvent être autorisées :\n    o   Dans le cadre de la mise en œuvre de l’OAP thématique continuités\n Zone\n    écologiques, particulièrement pour préserver des plantations existantes ou\n  U1\n    assurer les continuités écologiques avec les espaces voisins ;\n    o   Pour la réouverture de rus enterrés.\n    62\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Implantation par rapport aux limites séparatives\n3.2. Implantation par rapport aux limites séparatives\n3.2.1.    Champ d’application :\n   a. Sont admis dans le retrait :\n    o   Les éléments de modénature, les marquises et les auvents dans la limite de 0,80 mètre de\n    profondeur,\n    o   Les débords de toiture dans la limite de 0,60 mètre de profo it supérieur ou égal à 6 mètres si les\n    façades comportent des baies,\n    Ces règles ne s’appliquent pas pour les ensembles immobiliers uniques dont une\n    partie est constituée de constructions à destination de locaux techniques et\n    industriels des administrations publiques et assimilés ou des installations qui leur\n    sont nécessaires qui doivent s’implanter avec un retrait supérieur ou égal à 3\n    mètres.\n    ▪   Les constructions peuvent être implantées sur les limites séparatives ou en retrait\n    de ces dernières.\n    Règles de retrait :\n    ▪   En cas de retrait :\nSecteur    o   Façades avec baie :\n U1-D    -   le retrait, mesuré en tout point d'une façade comportant une\n    baie, doit être supérieur ou égal aux ¾ de la hauteur de façade,\n    soit L ≥ ¾ Hf, sans être inférieur à 6 mètres,\n    -   le retrait, mesuré au milieu de la façade doit être supérieur ou\n    égal à la hauteur de façade, soit L ≥ Hf, sans être inférieur à 8\n    mètres,\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Implantation par rapport aux limites séparatives\n    o    Façades sans baie : le retrait doit être supérieur ou égal à la moitié de la\n    hauteur de façade, soit L ≥ Hf/2, sans être inférieur à 3 mètres.\n    Dans une bande de 25 mètres :\n    ▪   Les constructions peuvent être implantées sur les limites séparatives latérales ou\n    en retrait.\n    ▪   Lorsque l’implantation en retrait est imposée notamment par une servitude d’utilité\n    publique, d’urbanisme ou de droit privé, la limite de ce retrait fait office de limite\n66    séparative latérale.\n    Au-delà d’une bande de 25 mètres :\n    ▪   Les constructions doivent être implantées en retrait des limites séparatives.\n    ▪   Les constructions s ute de la Reine, avenue du\n    Général Leclerc, avenue Édouard Vaillant, avenue André Morizet.\n    o    Cette bande E est portée à 16 mètres pour les constructions à destination\n    d’équipement d’intérêt collectif et services publics, dans le sous-sous-\n    secteur U1-A-1b\n    o    Cette bande E est portée à 18 mètres, pour les constructions à destination\n    d’autres activités des secteurs primaire, secondaire ou tertiaire en secteur\n    U1-A-2\n    Dans la bande E :\n    ▪   Les constructions doivent être implantées sur les limites séparatives latérales.\n    ▪   Pour toute partie de façade située en retrait par rapport à une limite séparative, ce\n    retrait doit être supérieur ou égal à la moitié de la hauteur de façade, soit L ≥ Hf/2,\n    sans être inférieur à 6 mètres pour les façades comportant des baies et de 3,5\n    mètres sinon. L étant la distance horizontale mesurée perpendiculairement de tout\n    point de cette partie façade à une limite séparative.\n    ▪   Nonobstant les règles générales, les balcons doivent être en retrait d’un minimum\n    de 2 mètres des limites séparatives joignant l’alignement.\n    ▪   Afin d’assurer le traitement architectural du couronnement, les volumes dépassant\n    du gabarit enveloppe doivent observer un retrait des limites d’une longueur\n    supérieure ou égale à 2 mètres, sauf en cas d’adossement à un mur pignon voisin\n    plus élevé.\n    ▪   Les règles générales de retrait ne s’appliquent pas pour les murs aveugles, et pour\n70    les baies situées à au moins 6 mètres de la limite séparative, dans le cas des règles\n    particulières et dans les cas suivants :\n    o    Pour la mise en valeur d’un espace écologique et/ou un espace paysager\n    protégé ;\n    Sous-\n    secteur    o    Lorsque les étages situés au-dessus de la hauteur de façade doivent\n    s’implanter en retrait des limites d’au moins 5 mètres afin de préserver\n    U1-A-1    l'unité du paysage urbain ;\n    o    Lorsque les constructio
