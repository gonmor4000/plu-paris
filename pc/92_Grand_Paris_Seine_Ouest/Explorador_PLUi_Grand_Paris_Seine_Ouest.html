rement à destination d’équipements d’intérêt collectif et de services publics,\n    la hauteur de façade est égale à la hauteur totale indiquée dans les règles générales.\n    ▪    La hauteur des constructions annexes ne doit pas dépasser 3,20 mètres.\n    ▪    La hauteur des constructions annexes implantées en limite de sente piétonne ne doit\n    pas dépasser 2 mètres de hauteur et la hauteur du mur sur lequel elles s’adossent.\n    ▪    La hauteur des locaux techniques situés en toiture terrasse ne doit pas dépasser 1,80\n    mètre, comptée à partir du plancher haut du dernier niveau.    93\n    ▪    Le long des emprises publiques et des voies d’une largeur inférieure ou égale à 5\n    mètres, la hauteur totale maximale de la construction doit être inférieure ou égale à la\n    distance mesurée perpendiculairement de la façade sur rue au point le plus proche de\n    l’alignement opposé, soit H ≤ L, sans pouvoir excéder :\n    Secteur    o    15 mètres dans le sous-secteur U1-G-1,\n    U1-G    o    18 mètres dans le sous-secteur U1-G-2.\n    ▪    À l’angle des îlots limités par des voies d’inégales largeurs, la hauteur totale maximale\n    autorisée sur la voie la plus large peut être retournée dans la voie la plus étroite sur\n    une distance au plus égale à 15 mètres, mesurée à partir de l’alignement actuel ou\n    projeté de la voie la plus large.\n    ▪    Sous réserve que leur hauteur soit inférieure ou égale à 3,50 mètres, les habillages\n    architecturaux ainsi que les constructions sur terrasses ne sont pas pris en compte\n    Sous-\n    pour le calcul de la hauteur de la construction à condition qu'ils abritent ou dissimulent\n    secteur\n    les machineries d'ascenseurs, les sorties d'escaliers, les ventilations collectives de\n    U1-A-3\n    traitement d'air ou d'eau, les gaines de ventilation, les souches de cheminées, les\n    lanterneaux.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Hauteur\n    3.5.4.    Règles alternatives :\n    Secteur    Cas des travaux sur les constructions existantes ne respectant pas la règle\n    ▪    A l’exception du secteur U1-A, pour les constructions existantes dont la hauteur est\n    supérieure à la hauteur totale ou à la hauteur de façade autorisée, les travaux de\n    réhabilitation et d’extension sont autorisés dans la limite de la hauteur totale de la\n    Zone    construction existante. La référence à la hauteur existante étant celle mesurée hors\n    U1    édicules techniques et d’agrément.\n    ▪    Les extensions verticales nécessaires à l’isolation thermique, dans la limite de 0,40\n    mètre d’épaisseur, ne sont pas comptabilisées dans le calcul de la hauteur.\n    Secteur    Articulation avec l’environnement existant\n    À l’exception de Boulogne-Billancourt, Chaville et Ville-d’Avray :\n    ▪    Lorsque la hauteur totale et/ou de façade d’une construction voisine existante et\n    pérenne implantée en limite séparative est supérieure au gabarit-enveloppe indiqué\n    par les règles générales, le gabarit-enveloppe de la construction projetée peut être\n    égal à la hauteur totale et/ou de façade de la construction voisine existante et pérenne\n    implantée en limite séparative, sans dépasser de plus de 3 mètres la hauteur totale\n    autorisée (soit 1 niveau supplémentaire possible).\n    Zone\n    U1\n94\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Hauteur\n    Pour les constructions implantées dans une bande E :\n    ▪   Lorsque la hauteur d’une construction existante implantée sur un fond voisin diffère de\n    la hauteur totale maximale autorisée pour les nouvelles constructions, ces dernières\n    sont autorisées à s’inscrire dans la limite du mur pignon sur lequel elles s'adossent,\n    sur une longueur d'au moins 3 mètres. La hauteur des nouvelles constructions est\n    limitée à la hauteur totale maximale indiquée par le filet, plus ou moins deux niveaux,\n    soit 6 mètres.\n    ▪   Lorsque la hauteur totale des deux constructions contigües est supérieure à la hauteur\n    totale indiquée pour les nouvelles constructions, et que la distance entre ces deux\n    constructions est inférieure à 20 mètres, les nouvelles constructions sont autorisées à\n    venir combler la dent creuse en adoptant le gabarit-enveloppe le plus proche du plus\n Sous-    petit des deux constructions. La hauteur des nouvelles constructions est limitée à la\nsecteur    hauteur totale indiquée par le filet plus ou moins deux niveaux, soit 6 mètres.\n    95\nU1-A-1\n    ▪   Pour l’extension verticale d'une construction existante comportant un plancher bas du\n    rez-de-chaussée situé au-dessus du niveau de référence, il est autorisé une hauteur\n    de façade augmentée de la différence entre le niveau de référence et le niveau du\n    plancher bas du rez-de-chaussée. Cette modification de la hauteur de façade modifie\n    d'autant la hauteur totale, uniquement si cela permet d'assurer la continuité avec le\n    tissu urbain. Pour les filets roses, cette modification de la hauteur de façade modifie\n    d’autant la hauteur totale dans tous les cas.\n    Pour les constructions implantées au-delà de la bande E :\n    ▪   Pour les constructions ou parties de construction implantées en limite séparative, la\n    hauteur totale maximale est limitée à R+1, soit 7,50 mètres au-dessus du niveau de\n    référence.\n    ▪   Lorsqu'il existe sur le terrain contigu une construction d'une hauteur minimale de 5\n    mètres, implantée en limite, les nouvelles constructions en limite séparative sont\n    autorisées à s'élever à la hauteur du mur pignon sur lequel elles s'adossent, dans la\n    limite des hauteurs plafonds définies par les règles générales. En cas de terrain\n    traversant, est appliquée la plus petite des hauteurs de façade.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Hauteur\n    Pour les constructions implantées au-delà de la bande E :\n    Sous-\n    Secteur    ▪    Lorsqu'il existe sur le terrain contigu une construction d'une hauteur minimale de 5\n    mètres, implantée en limite, les nouvelles constructions en limite séparative sont\n    U1-A-2    autorisées à s'élever à la hauteur du mur pignon sur lequel elles s'adossent, dans la\n    limite des hauteurs plafonds définies par les règles générales. En cas de terrain\n    traversant, est appliquée la plus petite des hauteurs de façade.\n    Secteur\n    Dépassements du gabarit-enveloppe sous réserve des dispositions du chapitre 6.\n    Patrimoine bâti et paysager\n    À l’exception des secteurs et sous-secteurs U1-B et U1-F-1 à Chaville, les\n    dépassements du gabarit-enveloppe sont autorisés dans les conditions suivantes :\n    ▪    Pour les constructions existantes, hors patrimoine protégé repéré au document\n    graphique n° 4.3 Plan des protections patrimoniales, écologiques et\n    paysagères :\n    o    Les dispositifs relatifs aux cabines d’ascenseurs en dehors de toitures\n    fonctionnalisées, aux chaufferies et à la climatisation, dans la limite de 1,20\n    mètre ;\n    o    Les dispositifs de production d’énergie renouvelable :\n    -   Dès lors qu’ils ont une hauteur totale inférieure ou égale à 0,70 mètre pour\n    les bâtiments d’une hauteur totale inférieure ou égale à 13,50 mètres (ou\n    R+3+A) ;\n    -   Dès lors qu’ils ont une hauteur totale inférieure ou égale à 1,80 mètre pour\n    les bâtiments d’une hauteur totale supérieure à 13,50 mètres (ou R+4) ;\n    o    Les dispositifs d’isolation par l’extérieur dès lors que leur épaisseur ou largeur\n96    maximale par rapport à la toiture existante est inférieure ou égale à 0,40 mètre.\n    o    Les dispositifs de protection solaire dans la limite de 0,60 mètre.\n    ▪    Pour les toitures végétalisées occupant plus de 75% de la surface de toiture, dès lors\n    que l’épaisseur de substrat est supérieure ou égale à 0,30 mètre, dans la limite de\n    l’épaisseur de substrat.\n    Zone U1\n    ▪    Pour les édicules liés à la fonctionnalisation des toitures (chapitre 5 du règlement),\n    d'une surface unitaire inférieure ou égale à 20 m² d’emprise et d'une hauteur\n    inférieure ou égale à 2,50 mètres portée à 3,50 mètres pour les édicules\n    d’ascenseurs. Ils doivent en outre :\n    o   être implantés en retrait de chacune des façades. Le retrait minimal étant\n    égal à la hauteur de l’édicule.\n    o   présenter une emprise totale inférieure ou égale à 10% de l’emprise de la\n    terrasse.\n    En cas de construction « en escalier » cela ne s’applique qu’à la toiture la plus haute.\n    ▪    Pour les constructions nécessaires à l’agriculture urbaine, sous réserve qu’elles aient\n    une emprise inférieure ou égale à 40% de la surface de la terrasse et une hauteur\n    totale inférieure ou égale à 3 mètres, et pour les installations nécessaires à\n    l’agriculture urbaine, sous réserve qu’elles aient une hauteur totale inférieur ou égale\n    à 2 mètres. Cette règle ne s’applique pas :\n    o    Aux bâtiments bénéficiant d’un autre dépassement de gabarit ;\n    o    Aux bâtiments présentant une hauteur totale inférieure à 13,50 mètres ;\n    o    Aux patrimoines protégés définis par le présent règlement.\n    ▪    Pour les acrotères dans la limite de la hauteur totale.\n    ▪    Pour les lucarnes, dans la limite de la hauteur totale et de 40% du linéaire de façade.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Hauteur\n    Pour les secteurs et sous-secteurs U1-B et U1-F-1, les dépassements du gabarit-\n    enveloppe précités sont autorisés pour les seules constructions existantes à la date\n    d’approbation du PLUi.\n    Pour toutes les constructions, les dépassements du gabarit-enveloppe :\n    ▪   Ne sont pas autorisés pour les machineries d'ascenseur lorsque l'ascenseur ne\n    dessert pas une toiture fonctionnalisée, pour les machineries de réfrigération ou de\n    climatisation, qui doivent être intégrés dans le volume de couronnement.\n    Pour les constructions implantées dans une bande E, les dépassements du gabarit-\n    enveloppe :\n    o   Sont autorisés pour les opérations comprenant 100% de logements sociaux\n Sous-    dans la limite de la hauteur totale de la construction contiguë existante.\nsecteurs\n    o   Sont autorisés, uniquement en secteur U1-A-1, sur les axes autorisant 80%\nU1-A-1    de bureaux, soit un niveau supplémentaire dans la limite de la hauteur de\n    façade et de la hauteur totale définies par les règles générales, dans les deux\nU1-A-2    cas suivants :\n    -    La reconversion ou la démolition-reconstruction d’immeubles de\n    bureaux à destination de logements ;\n    -    OU La réalisation d’une opération de logements comprenant au\n    minimum 40% de logements sociaux.\n    o   Sont autorisés pour les balcons, les oriels et les loggias en continuité avec\n    les saillies de façade, dans la limite de la hauteur totale maximale et dans la\n    limite de 30% du linéaire de façade.\nSecteur    ▪   Pour les opérations comprenant 100% de logements sociaux, un dépassement du\n    gabarit-enveloppe est autorisé dans la limite de la hauteur de la construction contiguë    97\nU1-A-3    existante calculée à son faîtage.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U2\n    Implantation par rapport aux emprises publiques et aux voies\n    Zone U2\n    Secteurs mixtes de transition\n    La zone U2 regroupe des tissus urbains mixtes dans leur forme et dans leurs destinations. Sur ces deux\n    sujets, elle joue un rôle de transition entre la zone U1 et la zone U3. Elle est composée de quatre secteurs :\n    ▪   U2-A correspondant au secteur mixte de faible hauteur ;\n    ▪   U2-B correspondant aux secteurs mixtes de hauteur intermédiaire ;\n    ▪   U2-C correspondant aux secteurs mixtes de Boulogne-Billancourt qui assurent une transition\n    morphologique entre le centre et les rives et permettent des raccordements satisfaisants avec les\n    zones pavillonnaires. Il comprend deux sous-secteurs :\n    o   U2-C-1 correspondant au projet de résidentialisation d’un foyer de travailleurs au 47 rue du\n    Dôme,\n    o   U2-C-2 correspondant à la cité artisanale Couchot et ses abords afin de préserver et\n    favoriser le développement de l’activité artisanale.\n    ▪   U2-D correspondant à certains secteurs mixtes spécifiques de Meudon dans les quartiers de\n    Meudon centre, Bellevue et Val Fleury. Il comprend le sous-secteur U2-D-1 correspondant au\n    secteur de projet Rodin.\n98\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U2\n    Implantation par rapport aux emprises publiques et aux voies\n3.1. Implantation par rapport aux emprises publiques et aux\n    voies\n3.1.1.    Champ d’application :\n    a. Sous réserve du règlement de voirie et de l’accord du gestionnaire de voirie pour les saillies sur\n    espace public, ne sont pas pris en compte pour l’application des règles d’implantation à l’alignement :\nLes dispositifs visant à améliorer ou optimiser la performance énergétique et/ou environnementale des\nconstructions, notamment ceux nécessaires à l’isolation thermique par l’extérieur, en cas de travaux sur des\nconstructions existantes, dans la limite de 0,40 mètre d’épaisseur,\n    ▪    Les traitements en creux en rez-de-chaussée au droit des accès sur une profondeur de 1 mètre,\n    ▪    Les renfoncements de loggias ou autres, à partir d'une hauteur de 3,50 mètres et du R+1,\n    ▪    Les saillies des façades des commerces sur trottoir sont autorisées en rez-de-chaussée et dans une\n    limite de 0,20 mètre d’épaisseur.\n    ▪    Sur les emprises publiques et voies de largeur inférieure à 12 mètres :\n    o   Les marquises et les stores-bannes, dans une limite de 0,80 mètre,\n    o   Les éléments de modénature, dans une limite de 0,4 mètre, à partir d'une hauteur de 3,5\n    mètres et R+1,\n    o   Les balcons et oriels, dans une limite de 0,60 mètre, à partir d'une hauteur de 5,50 mètres\n    et du R+2. La proportion des oriels devant être inférieure ou égale à 20% de la surface de\n    la façade,\n    o   En cas de travaux sur des constructions existantes, les dispositifs de protection solaire\n    dans la limite de 0,40 mètre et à partir d’une hauteur de 5,50 mètres.\n    ▪    Sur les emprises publiques et voies de largeur supérieure ou égale à 12 mètres et inférieure    99\n    à 20 mètres :\n    o   Les marquises et les stores-bannes, dans une limite de 1,20 mètre,\n    o   Les éléments de modénature, dans une limite de 0,6 mètre, à partir d'une hauteur de 3,50\n    mètres et du R+1,\n    o   Les balcons et oriels, dans une limite de 0,80 mètre, à partir d'une hauteur de 5,50 mètres\n    et du R+2. La proportion des oriels devant être inférieure ou égale à 20% de la surface de\n    la façade,\n    o   En cas de travaux sur des constructions existantes, les dispositifs de protection solaire\n    dans la limite de 0,80 mètre et à partir d’une hauteur de 5,50 mètres.\n    ▪    Sur les emprises publiques et voies de largeur supérieure ou égale à 20 mètres :\n    o   Les marquises et les stores-bannes, dans une limite de 1,80 mètre,\n    o   Les éléments de modénature, dans une limite de 0,8 mètre, à partir d'une hauteur de 3,50\n    m et du R+1,\n    o   Les balcons et oriels, dans une limite de 1,20 mètre, à partir d'une hauteur de 5,50 m et du\n    R+2. La proportion des oriels devant être inférieure ou égale à 20% de la surface de la\n    façade,\n    o   En cas de travaux sur des constructions existantes, les dispositifs de protection solaire\n    dans la limite de 1,20 mètre et à partir d’une hauteur de 5,50 mètres.\n    b. En cas de recul, ne sont pas pris en compte pour le calcul du recul :\n    o   Les éléments de modénature, les marquises et les auvents de moins de 0,80 mètre de\n    profondeur,\n    o   Les débords de toiture de moins de 0,60 mètre de profondeur,\n    o   Les oriels de moins de 0,40 mètre de profondeur et à partir d’une hauteur de 5,50 mètres,\n    o   Les balcons dans la limite de 1,20 mètre de profondeur,    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U2\n    Implantation par rapport aux emprises publiques et aux voies\n    o   Les perrons, terrasses et emmarchements,\n    o   Les ouvrages d’amélioration ou de mise aux normes d’une construction pour la sécurité ou\n    l’accessibilité pour les personnes à mobilité réduite, en cas de travaux sur des\n    constructions existantes,\n    o   Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou\n    environnementale des constructions, notamment ceux nécessaires à l’isolation thermique\n    par l’extérieur et les dispositifs de protection contre le rayonnement solaire, en cas de\n    travaux sur des constructions existantes, dans la limite de 0,40 mètre d’épaisseur,\n    o   Les rampes de garage desservant le sous-sol ou le rez-de-chaussée de la construction,\n    o   Les escaliers, les rampes d’accès et les passerelles non couvertes.\n    c.   En cas de présence d’un alignement d’arbres repéré au plan 4.3 Protections, la préservation des\n    arbres prévaut sur les dispositifs non pris en compte pour l’application des règles d’implantation.\n    d. Sauf mention contraire au sein du présent règlement, les projets de construction intégrant un\n    programme à destination d’équipement d’intérêt collectif et services publics au sein d’une même\n    construction peuvent bénéficier des règles spécifiques définies pour les constructions à destination\n    d’équipement d’intérêt collectif et services publics, dès lors que :\n    o   La destination équipement d’intérêt collectif et services publics concerne 100% de la\n    surface de plancher du rez-de-chaussée, exception faite des parties communes et des\n    accès nécessaires au fonctionnement de la construction,\n    o   Ou que la destination équipement d’intérêt collectif et services publics concerne au moins\n    50% de la surface de plancher de la construction.\n    3.1.2.    Règles générales :\n100   Sauf disposition particulière dans la règle graphique, notamment les marges de recul ou obligation\n    d’alignement indiqués sur le plan 4.2 des prescriptions et périmètres particuliers, les constructions doivent\n    s’implanter en respectant les règles suivantes par rapport aux emprises publiques et aux voies :\n    Secteur    Règles générales : Implantation par rapport aux emprises publiques et aux voies\n    ▪   L’implantation des constructions à destination d’équipements d’intérêt collectif et\n    services publics n’est pas réglementée.\n    ▪   Implantation vis-à-vis des sentes piétonnes : les constructions doivent être implantées\n    avec un recul supérieur ou égal 3 mètres.\n    Zone U2\n    ▪   L’implantation de locaux destinés au stockage des ordures ménagères nécessaire au\n    tri n’est pas règlementée.\n    Secteurs\n    ▪   Les constructions peuvent s’implanter en tout ou partie à l’alignement ou en recul.\n    U2-A\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U2\n    Implantation par rapport aux emprises publiques et aux voies\n U2-B    ▪   En cas de recul, celui-ci doit être supérieur ou égal à 4 mètres par rapport l’alignement.\n    La valeur minimale du recul est fixée à 2 mètres à Vanves.\n    ▪   Pour les constructions qui s’implantent à l’alignement, des reculs de parties de façade,\n    en longueur ou en hauteur, sont autorisés, à conditions qu’ils soient inférieurs à 3\n    mètres de profondeur depuis l’alignement et qu’ils permettent une amélioration\n    architecturale ou de répondre à une contrainte technique.\n    ▪   La réalisation de porches d’au moins 5 mètres de hauteur est autorisée, lorsqu’ils\n    permettent une continuité visuelle vers le cœur d’ilot ou à travers le terrain.\n    ▪   En cas d’implantation à l’alignement de deux voies ouvertes à la circulation\n    automobile, un nouvel alignement peut être défini par un pan coupé pour favoriser\n    l’insertion urbaine et la sécurité. Ce pan coupé doit être d’une longueur comprise entre\n    3 mètres et 7 mètres, à déterminer en fonction des circonstances locales. Le nouvel\n    alignement peut également être matérialisé par un arc de cercle de dimension\n    équivalente.\n    ▪   A l’exception des constructions à destination d’équipement d’intérêt collectifs et\n    101\n    services publics, lorsque la façade à édifier présente une longueur supérieure ou\n    égale à 25 mètres le long des emprises publiques et voies, au moins une césure sur\n    toute la hauteur et toute la profondeur, d'au moins 4 mètres de large, doit être réalisée.\n    Cette césure peut recevoir des ouvertures et des balcons. En cas de création de\n    balcons, les règles d’implantation des constructions sur un même terrain s’appliquent.\n    A Vanves, la césure peut être est réduite à une hauteur minimale de 5,50 mètres sur\n    toute profondeur. Le périmètre de l’OAP du Clos Montholon n’est pas concerné par la\n    règle de césure.\n    À Sèvres, en complément des dispositions précédentes :\n    ▪   Au moins 50% des surfaces de marges de recul, en dehors des accès piétons et\n    véhicules, doivent être traités en espace végétalisé.\n    À Issy-les-Moulineaux, en complément des dispositions précédentes :\n    ▪   L’implantation des constructions par rapport aux emprises publiques est définie dans\n    le Cahier de références aux voiries ou par une marge de recul matérialisées sur le\n    document graphique n°4.2 Plan des prescriptions et périmètres particuliers. En\n    l’absence d’indication, les règles générales s’appliquent.\n    À Vanves, en complément des dispositions précédentes :\n    ▪   Pour les terrains situés le long de la rue du Clos Montholon : les constructions doivent\n    s’implanter en recul.\n    ▪   Les nouvelles constructions doivent être implantées selon le document graphique\nSecteur    n°4.2 Plan des prescriptions et périmètres particuliers, soit à l'alignement, soit, s'il\n    existe une marge de recul, le long de cette dernière. Le recul pour alignement de fait\n U2-C    est admis. Aucun ouvrage souterrain en débordement par rapport à cette implantation\n    obligatoire n'est autorisé, à l’exception des réseaux.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U2\n    Implantation par rapport aux emprises publiques et aux voies\n    ▪   Les constructions doivent s’implanter avec un recul supérieur ou égal à la moitié de\n    la hauteur de façade de la construction soit L≥Hf/2, sans être inférieur à 4 mètres.\n    Secteur\n    ▪   Les constructions peuvent s’implanter à une distance moindre à condition de\n    s’adosser et ne pas dépasser les héberges d’une construction existante en bon état\n    U2-D    sur les terrains voisins.\n    Sous-secteur U2-D-1 :\n    ▪   Les constructions peuvent s’implanter à l’alignement ou en recul libre.\n    3.1.3.    Règles particulières :\n    Cas des constructions annexes\n    Uniquement à Vanves :\n    Secteur\n    U2-B\n    ▪    Le long de l’Avenue du Général de Gaulle, l’implantation de constructions annexes\n    n’est pas réglementée.\n    Secteur    ▪    Les constructions annexes sont autorisées en limite de sente piétonne à condition de\n    U2-D    s'adosser à un mur de clôture existant à l’alignement de ladite sente.\n    Articulation avec l’environnement existant\n102    ▪    Pour la valorisation du paysage urbain, au moins une césure d’une largeur supérieure\n    ou égale à 4 mètres doit être créée sur toute la hauteur et toute la profondeur de la\n    construction dans les cas suivants :\n    Secteur    o   Lorsque la construction présente sur l’emprise publique ou la voie, une\n    U2-C    longueur de façade supérieure ou égale à 30 mètres ;\n    o   Lorsque le terrain comporte un espace paysager ou écologique protégé.\n    ▪    Cette césure peut recevoir des passerelles et des balcons.\n    3.1.4.    Règles alternatives :\n    Cas des travaux sur les constructions existantes ne respectant pas les règles\n    Secteur\n    générales\n    ▪    Dans le cas de constructions existantes ne respectant pas les règles générales\n    d’implantation par rapport aux emprises publiques et aux voies, sont autorisés pour les\n    parties de constructions ne respectant pas les règles d’implantation :\n    Zone\n    U2    o    Les travaux qui améliorent l’implantation vis-à-vis des règles générales et ceux\n    sans effet sur le gabarit de la construction existante.\n    o    A l’exception du secteur U2-C, les extensions horizontales et verticales\n    respectant un recul égal ou supérieur à celui des constructions existantes, sauf\n    pour les parties de constructions situées dans un emplacement réservé ;\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U2\n    Implantation par rapport aux emprises publiques et aux voies\n    o   Les annexes existantes ne sont pas concernées par les dispositions relatives\n    aux possibilités d’extension verticale ou horizontale.\n    ▪   En dehors des parties de constructions ne respectant pas les règles d’implantation, les\n    règles générales s’appliquent.\nSecteur    Articulation avec l’environnement existant\n    ▪   Lorsqu’il s’agit de préserver l'unité du paysage urbain, et en cas de construction\n    existante implantée en limite séparative dont l'implantation ne respecte pas les règles\n    générales d’implantation, les nouvelles constructions peuvent se raccorder en\n    s'implantant au nu de la construction existante sur une longueur de façade comprise\n    entre 3 mètres et 6 mètres.\n Zone\n  U2\n    103\n    ▪   Lorsqu’un mur de soutènement d’une hauteur supérieure ou égale à 2 mètres est\n    présent au droit du terrain, les constructions peuvent être implantées en tout ou partie\n    soit à l’alignement, soit en recul libre.\nSecteur    Autres cas de figure\n    ▪   Dans le cadre de la mise en œuvre de l’OAP thématique continuités écologiques, des\n Zone    implantations alternatives peuvent être autorisées, et ce particulièrement lorsqu’il s’agit\n  U2    d’assurer la préservation des plantations existantes ou les continuités écologiques\n    avec les espaces voisins.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U2\n    Implantation par rapport aux limites séparatives\n    3.2. Implantation par rapport aux limites séparatives\n    3.2.1.    Champ d’application :\n    a. Sont admis dans le retrait :\n    o    Les éléments de modénature, les marquises et les auvents dans la limite de 0,80 mètre de\n    profondeur,\n    o    Les débords de toiture dans la limite de 0,60 mètre de profondeur,\n    o    Les oriels dans la limite de 0,40 mètre de profondeur,\n    o    Les perrons, escaliers et emmarchements,\n    o    Les terrasses et passerelles non couvertes, de moins de 0,60 mètre de hauteur par\n    rapport au terrain avant travaux,\n    o    Les balcons dans la limite d’1,20 mètre de profondeur,\n    o    Les ouvrages d’amélioration ou de mise aux normes d’une construction pour la sécurité ou\n    l’accessibilité pour les personnes à mobilité réduite, en cas de travaux sur des\n    constructions existantes,\n    o    Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou\n    environnementale des constructions, notamment ceux nécessaires à l’isolation thermique\n    par l’extérieur et les dispositifs de protection contre le rayonnement solaire, en cas de\n    travaux sur des constructions existantes, dans la limite de 0,40 mètre d’épaisseur,\n    o    Les pare-vues et les garde-corps, sous réserve de ne pas dépasser 1,90 mètre de\n    hauteur.\n    b. En cas de servitude de cour commune, l’article relatif à l’implantation des constructions sur un même\n    terrain s’applique, sauf à Meudon où en cas de servitude de cour commune, la distance entre deux\n    constructions situées de part et d’autre d’une cour commune doit être supérieure ou égale à 5\n104    mètres.\n    3.2.2.    Règles générales :\n    Sauf disposition particulière dans la règle écrite ou graphique, les constructions doivent s’implanter en\n    respectant les règles suivantes par rapport aux limites séparatives :\n    Secteur    Règles générales : Implantation par rapport aux limites séparatives\n    Règles applicables aux constructions à destination d’équipements d’intérêt collectif et\n    services publics :\n    ▪   Il n’est pas défini de bande pour l’implantation des constructions à destination\n    d’équipements d’intérêt collectif et services publics.\n    Secteurs\n    ▪   Les constructions peuvent être implantées en limite ou en retrait des limites\n    U2-A    séparatives,\n    U2-B    ▪   En cas de retrait, celui-ci doit être supérieur ou égal à la moitié de la hauteur de\n    U2-D    façade, soit L ≥ Hf/2, sans être inférieur à 1,90 mètre.\n    ▪   Les constructions à destination de locaux techniques et industriels des\n    administrations publiques et assimilés ou les installations qui leur sont nécessaires\n    sont autorisées en sous-sol et peuvent être implantées à l’alignement ou en retrait,\n    sans distance minimum.\n    Secteurs    ▪   Aucune nouvelle construction ne peut être implantée dans les marges de recul\n    identifiées sur le document graphique n°4.2 Plan des prescriptions et périmètres\n    U2-A\n    particuliers, à l’exception des marges de recul situées en bordure des emprises\n    U2-B    ferroviaires, où est autorisée l’implantation d’annexes.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U2\n    Implantation par rapport aux limites séparatives\nDans une bande de 20 mètres :\n    ▪   Les constructions peuvent être implantées sur les limites séparatives latérales ou en\n    retrait.\nAu-delà d’une bande de 20 mètres :\n    ▪   Les constructions doivent être implantées en retrait des limites séparatives latérales.\n    ▪   A Marnes-la-Coquette : Les constructions peuvent être implantées sur les limites\n    séparatives latérales ou en retrait.\nImplantation par rapport aux limites de fond de terrain :\n    ▪   Dans tous les cas, les constructions doivent être implantées en retrait des limites\n    séparatives de fond de terrain\nRègles de retrait en secteur U2-A :\n    ▪   Façades avec baie : le retrait doit être supérieur ou égal à la hauteur de façade, soit\n    L ≥ Hf, sans être inférieur à 8 mètres,\n    ▪   Façades sans baie : le retrait doit être supérieur ou égal à la moitié de la hauteur de\n    façade, soit L ≥ Hf/2, sans être inférieur à 4 mètres\n    105\nRègles de retrait en secteur U2-B :\n    ▪   Façades avec baie : le retrait doit être supérieur ou égal à la hauteur de façade, soit\n    L ≥ Hf, sans être inférieur à 6 mètres,\n    ▪   Façades sans baie : le retrait, doit être supérieur ou égal à la moitié de la hauteur\n    de façade, soit L ≥ Hf/2, sans être inférieur à 3 mètres.\nÀ Vanves (secteurs U2-A et U2-B) :\n    ▪   Le retrait vis-à-vis des façades avec baie doit être supérieur ou égal à la moitié de la\n    hauteur de façade, soit L ≥ Hf/2, sans être inférieur à 6 mètres.\n    ▪   Le retrait vis-à-vis des façades sans baie doit être supérieur ou égal à la moitié de la\n    hauteur de façade, soit L ≥ Hf/2, sans être inférieur à 4 mètres.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U2\n    Implantation par rapport aux limites séparatives\n    ▪   En cas de construction implantée sur limite séparative, les parties de construction\n    situées au-dessus de 12 mètres de hauteur doivent être implantées en retrait de 3\n    mètres minimum des limites séparatives.\n    ▪   En dérogation à la définition lexicale, s’agissant des règles de prospect, la hauteur\n    de façade à considérer est égale à la hauteur totale.\n    ▪   Lorsqu’une bande E est mentionnée, sa profondeur est de 15 mètres\n    ▪   Pour les constructions à destination de bureaux ou activité, la profondeur de la bande\n    E est portée à 18 mètres le long des voies suivantes : route de la Reine, avenue du\n    Général Leclerc, avenue Édouard Vaillant, avenue André Morizet, boulevard de la\n    République, avenue F. Buisson, avenue Félix d'Hérelle, avenue Le Jour se Lève.\n    Dans la bande E :\n    ▪   Les constructions doivent être implantées sur les limites séparatives latérales.\n    ▪   Les dispositifs autorisés à dépasser le gabarit enveloppe, listés dans les règles\n    relatives à la hauteur des constructions, doivent respecter un retrait de 2 mètres\n    minimum. En cas d’adossement à un mur pignon voisin, ce retrait n’est pas exigé.\n    ▪   Pour toute partie de façade située en retrait par rapport à une limite séparative, ce\n    retrait doit être supérieur ou égal à la moitié de la hauteur de façade, soit L ≥ Hf/2,\n    sans être inférieur à 6 mètres pour les façades comportant des baies et de 3,5 mètres\n    sinon. L étant la distance horizontale mesurée perpendiculairement de tout point de\n    cette partie façade à une limite séparative.\n    ▪   Nonobstant les règles générales, les balcons doivent être en retrait d’un minimum de\n    2 mètres des limites séparatives joignant l’alignement.\n    ▪   Afin d’assurer le traitement architectural du couronnement, les volumes dépassant\n    du gabarit enveloppe doivent observer un retrait des limites d’une longueur\n    supérieure ou égale à 2 mètres, sauf en cas d’adossement à un mur pignon voisin\n106\n    plus élevé.\n    ▪   Les règles générales de retrait ne s’appliquent pas pour les murs aveugles, et pour\n    Secteur    les baies situées à au moins 6 mètres de la limite séparative, dans le cas des règles\n    U2-C    particulières et dans les cas suivants :\n    o   Lorsque des césures toute hauteur sont exigées pour une longueur de\n    façade supérieure à 30 mètres ou pour la mise en valeur d’un espace\n    écologique et/ou un espace paysager protégé,\n    o   Lorsque les étages situés au-dessus de la hauteur de façade doivent\n    s’implanter en retrait des limites d’au moins 5 mètres afin de préserver l'unité\n    du paysage urbain,\n    o   Lorsque les constructions à édifier s’implantent en recul de l’alignement afin\n    de préserver des plantations existantes sur le domaine public ou privé.\n    Au-delà de la bande E :\n    ▪   Les constructions sont autorisées à être implantées sur les limites séparatives.\n    o Sous réserve qu’aucune construction ne s’implante sur un linéaire\n    supérieur ou égal à 40 % du linéaire de chacune des limites séparatives\n    latérales, la bande E étant décomptée\n    o Ce ratio de 40% peut être dépassé en cas d’adossement à des\n    constructions voisines existantes et pérennes implantées en limite\n    séparative, occupant elles-mêmes un linéaire supérieur ou égal à 40%, en\n    limite séparative et ayant une hauteur minimale de 5 mètres.\n    o Dans le sous-secteur U2-C-1, cette longueur est limitée à 26% de la\n    longueur de l’ensemble des limites séparatives du terrain, la bande E étant\n    décomptée. L’implantation de constructions en limite de fond de parcelle\n    n’est pas autorisée,\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U2\n    Implantation par rapport aux limites séparatives\n    ▪   Dans les autres cas de figure, les constructions doivent être implantées en retrait.\n    Règles de retrait :\n    o   Pour les parcelles d’une surface inférieure à 2 000 m² : le retrait des\n    constructions doit être supérieur ou égal à la moitié de la hauteur de façade,\n    soit L ≥ Hf/2, sans être inférieur à 6 mètres pour les façades comportant des\n    baies et de 3,50 mètres pour les façades sans baie,\n    o   Pour les parcelles d’une surface supérieure à 2 000 m² : le retrait des\n    constructions doit être supérieur ou égal à la moitié de la hauteur de façade,\n    soit L ≥ Hf/2, sans être inférieur à 8 mètres pour les façades comportant des\n    baies et de 5 mètres pour les façades sans baie,\n    o   Pour les constructions et installations nécessaires aux services publics ou\n    d’intérêt collectif et pour les constructions comprenant 100% de logements\n    sociaux dans le sous-secteur U2-C-1 : le retrait est de 3,50 mètres\n    minimum.\n    Règles complémentaires\n    ▪   Lorsque la longueur sur rue du terrain, mesurée parallèlement à l'alignement, est\n    inférieure à 25 mètres, toute construction de plus d’un niveau, doit être dissociée\n    dans son implantation des constructions implantées en limite sur voie, et doit\n    respecter vis-à-vis de ces dernières, les règles d’implantation sur un même terrain.\n    Des liaisons en rez-de-chaussée sont autorisées entre des constructions dissociées.\n    Les dispositions du présent article ne s'appliquent pas :\n    o Aux constructions situées en sous-sol,\n    o Pour les constructions ou parties de construction implantées en limite\n    séparative,\n    o Pour les constructions comprenant 100% de logements sociaux dans le    107\n    sous-secteur U2-C-1.\n    ▪   Lorsque la longueur sur rue du terrain, mesurée parallèlement à l'alignement, est\n    supérieure ou égale à 25 mètres, toute construction comprenant au moins un étage,\n    doit être dissociée dans son implantation des constructions implantées en limite\n    séparative, et doit respecter vis-à-vis de ces constructions, les règles d’implantation\n    sur un même terrain. Des liaisons en rez-de-chaussée sont autorisées entre des\n    constructions dissociées. Les dispositions du présent article ne s'appliquent pas :\n    o Aux constructions situées en sous-sol,\n    o Pour les constructions ou parties de construction implantées en limite\n    séparative,\n    o Pour les constructions comprenant 100% de logements sociaux dans le\n    sous-secteur U2-C-1.\n    Dans une bande de 20 mètres :\n    ▪   Les constructions peuvent être implantées sur les limites séparatives latérales ou en\n    retrait.\n    ▪   Si la façade de la construction, en vis-à-vis des emprises publiques et voies, dispose\n    d’une longueur supérieure à 20 mètres, la construction ne peut être implantée que\nSecteur\n    sur une seule limite séparative latérale.\n U2-D\n    Au-delà d’une bande de 20 mètres :\n    ▪   Les constructions doivent être implantées en retrait des limites séparatives latérales.\n    Implantation par rapport aux limites de fond de terrain :\n    ▪    Les constructions doivent être implantées en retrait des limites de fond de terrain.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U2\n    Implantation par rapport aux limites séparatives\n    Règles de retrait :\n    ▪    Façades avec baie : le retrait doit être supérieur ou égal à la hauteur de façade, soit\n    L ≥ Hf sans être inférieur à 8 mètres,\n    ▪    Façades sans baie : le retrait doit être supérieur ou égal à la moitié de la hauteur de\n    façade, soit L ≥ Hf/2, sans être inférieur à 3 mètres,\n    Dans le sous-secteur U2-D-1 :\n    ▪    Les constructions doivent respecter un retrait, supérieur ou égal à la moitié de la\n    hauteur façade, moins trois mètres, soit L≥ (Hf/2)-3 m, sans être inférieur à 5 mètres\n    pour les façades comportant des baies et de 3 mètres pour les façades ne disposant\n    pas de baies.\n    3.2.3.    Règles particulières :\n    Secteur    Articulation avec l’environnement existant\n    ▪    Au-delà d’une bande de 20 mètres, les constructions sont autorisées à s’implanter sur\n    les limites séparatives latérales ou de fond, si elles remplissent une ou plusieurs des\n    conditions suivantes :\n    o    lorsque la construction s'adosse à une construction voisine existante et pérenne\n    U2-A    implantée en limite séparative, et dans la limite de son héberge ;\n    U2-B    o    lorsqu’elles sont édifiées sur un terrain existant avec une largeur de terrain sur\n    voie de desserte inférieure ou égale à 3 mètres de largeur (terrain dit « en\n    U2-D    drapeau »), et qu’elles ont une hauteur totale de 3,50 mètres ;\n    o    lorsque la construction s'adosse à un mur de soutènement, sans en dépasser la\n108    hauteur ;\n    o    lorsque la construction est une annexe d’une emprise au sol inférieure ou égale\n    à 20 m².\n    ▪    Afin de préserver l'unité du paysage urbain, c’est à dire la cohérence du paysage de\n    l'îlot, ou pour ne pas porter atteinte à la salubrité d'une construction existante contiguë,\n    les règles communes de retrait ne s’appliquent pas pour les murs aveugles, et pour les\n    baies situées à au moins 6 mètres de la limite séparative, dans les cas suivants :\n    o    Les nouvelles constructions doivent se raccorder au nu des façades de\n    l'immeuble contigu sur une longueur comprise entre 3 et 6 mètres des limites\n    séparatives, lorsque les façades de ce dernier sont en retrait par rapport aux\n    constructions à édifier,\n    Secteur\n    U2-C\n    o    Les constructions à édifier doivent s’implanter en retrait d’au moins 4 mètres par\n    rapport aux limites séparatives si l'immeuble contigu existant n'occupe pas la\n    totalité de la bande E en limite séparative.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U2\n    Implantation par rapport aux limites séparatives\n    ▪    Afin de ne pas porter atteinte à la salubrité d’une construction voisine, il est demandé\n    la création de contre-courettes au moins égales à la courette existante sur le fond\n    voisin nonobstant les règles d’implantation par rapport aux limites séparatives et les\n    règles d’implantation sur un même terrain. Les façades constitutives de ces courettes\n    ne peuvent comporter de baies.\n3.2.4.    Règles alternatives :\n    Cas des travaux sur les constructions existantes ne respectant pas les règles\n Secteur\n    d’implantation\n    ▪    Dans le cas d’une construction existante ne respectant pas les règles générales\n    d’implantation par rapport aux limites séparatives, sont autorisés pour les parties de\n    construction ne respectant pas les règles d’implantation :\n    109\n    o    Les travaux d’amélioration de l’implantation vis-à-vis des règles générales\n    et ceux sans effet sur le gabarit de la construction.\n    o    A l’exception du secteur U2-C, les extensions horizontales et verticales\n    avec un retrait égal ou supérieur à celui des constructions existantes, à\n    condition que la nouvelle façade ou partie de façade ne comporte pas de\n    baie\n Zone U2\n    o    Les annexes existantes ne sont pas concernées par les dispositions relatives\n    aux possibilités d’extension verticale ou horizontale.\n    ▪    En dehors des parties de constructions ne respectant pas les règles d’implantation,\n    les règles générales s’appliquent.\n Secteur    Cas des petites extensions sur les constructions existantes\n Secteur    ▪    A l’exception du secteur U2-C-1 : Nonobstant les règles générales d’implantation,\n    sont autorisés les travaux d’extension sur les constructions existantes générant une\n  U2-C    emprise au sol inférieure à 20 m², dans la mesure où l’extension ne réduit pas de plus\n    d’1/3 les espaces libres existants sur le terrain et si l’extension permet de rester\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U2\n    Implantation par rapport aux limites séparatives\n    conforme au coefficient de pleine terre exigé. Dans le cas où l’extension est une\n    véranda, celle-ci devra se situer à l’arrière de la construction existante.\n    ▪   En secteur U2-C-1 : Nonobstant les règles générales, sont autorisés les travaux\n    d’extension sur les constructions existantes générant une emprise au sol inférieure à\n    20 m² dans la mesure où l’extension vise une meilleure fonctionnalité de la construction\n    existante.\n    Secteur    Autres cas de figure\n    ▪   Des implantations alternatives sont autorisées, dans le cadre de la mise en œuvre de\n    Zone U2    l’OAP thématique continuités écologiques, particulièrement pour préserver des\n    plantations existantes ou assurer les continuités écologiques avec les espaces voisins.\n110\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U2\n    Implantation sur un même terrain\n3.3. Implantation sur un même terrain\n3.3.1.    Champ d’application :\n    a. La distance minimale entre deux constructions non contiguës implantées sur un même terrain est\n    mesurée perpendiculairement et horizontalement en tout point de chaque façade.\n    a. Ne sont pas pris en compte pour l’application des règles d’implantation :\n    o   Les éléments de modénature et les motifs architectoniques dans la limite de 0,40 mètre de\n    profondeur,\n    o   Les marquises et les auvents dans la limite de 0,80 mètre de profondeur,\n    o   Les débords de toiture dans la limite de 0,60 mètre de profondeur,\n    o   Les oriels dans la limite de 0,40 mètre de profondeur,\n    o   Les perrons et emmarchements,\n    o   Les terrasses de moins de 0,60 mètre de hauteur par rapport au terrain avant travaux,\n    o   Les éléments architecturaux d’accès ou de liaison tel que portiques, porches, passerelles,\n    escaliers, liaisons couvertes et autres éléments de liaisons,\n    o   Les balcons dans la limite de 1,20 mètre de profondeur,\n    o   Les ouvrages d’amélioration ou de mise aux normes d’une construction pour la sécurité ou\n    l’accessibilité pour les personnes à mobilité réduite, en cas de travaux sur des\n    constructions existantes,\n    o   Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou\n    environnementale des constructions, notamment ceux nécessaires à l’isolation thermique\n    par l’extérieur et les dispositifs de protection contre le rayonnement solaire, en cas de\n    travaux sur des constructions existantes, dans la limite de 0,40 mètre d’épaisseur,\n    o   Les pare-soleils extérieurs et les doubles parois vitrées de moins de 0,80 mètre de\n    profondeur,    111\n    o   Les pare-vues et les garde-corps, sous réserve de ne pas dépasser 1,90 mètre de\n    hauteur.\n3.3.2.    Règles générales :\nLe présent article n’est pas applicable aux constructions à destination de locaux techniques et industriels\ndes administrations publiques et assimilés ni aux installations qui leur sont nécessaires.\nSauf disposition particulière dans la règle écrite ou graphique, les constructions, lorsqu’elles sont non\ncontiguës et implantées sur un même terrain, doivent respecter entre elles les distances minimales\nsuivantes :\n Secteur    Règles générales : implantation sur un même terrain\n Secteurs\n   U2-A    ▪   L’implantation des constructions à destination d’équipements d’intérêt collectif et\n   U2-B    services publics n’est pas réglementée.\n   U2-D\n Secteurs\n    ▪   Dès lors qu’au moins une des parties de façades en vis-à-vis comporte des baies, la\n   U2-A    distance doit être supérieure ou égale à la hauteur de la façade la plus haute, soit L\n    ≥ Hf, sans être inférieure à 8 mètres.\n   U2-D\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U2\n    Implantation sur un même terrain\n    ▪   Si aucune des façades en vis-à-vis ne comporte de baies, la distance doit être\n    supérieure ou égale à la moitié de la hauteur de la façade en vis-à-vis la plus haute,\n    soit L ≥ Hf/2, sans être inférieure à 4 mètres.\n    ▪   Dès lors qu’au moins une des parties de façades en vis-à-vis comporte des baies, la\n    distance doit être supérieure ou égale à la hauteur de la façade la plus haute,\n    Secteur    diminuée de 3 mètres soit L ≥ Hf-3m, sans être inférieure à 8 mètres.\n    U2-B    ▪   Si aucune des façades en vis-à-vis ne comporte de baie, la distance doit être\n112    supérieure ou égale à la moitié de la hauteur de la façade la plus haute, diminuée de\n    3 mètres, soit L ≥ (Hf/2)-3m, sans être inférieure à 4 mètres.\n    ▪   Pour les constructions à destination d’habitation :\n    o   Dès lors qu’au moins une des parties de façades en vis-à-vis comporte des\n    baies, la distance doit être supérieure ou égale à la hauteur de la façade\n    située en vis-à-vis moins 3 mètres, soit L ≥ Hf-3m, sans être inférieure à 5\n    mètres.\n    Secteur\n    o   Si l’une des parties de façades en vis-à-vis ne comporte pas de baie, la\n    U2-C\n    distance doit être supérieure ou égale à la moitié de leur hauteur, soit L ≥\n    Hf/2, sans être inférieure à 3,50 mètres.\n    ▪   Pour les constructions à toute autre destination :\n    o   La distance doit être supérieure ou égale à la moitié de la hauteur de la façade\n    située en vis-à-vis soit L ≥ Hf/2, sans être inférieure à 5 mètres ou 3,50 mètres\n    si aucune des façades en vis-à-vis ne comporte de baie.\n    3.3.3.    Règles particulières :\n    Secteur    Articulation avec l’environnement existant\n    ▪    Afin de valoriser la qualité du paysage urbain environnant en cœur d’îlot et lorsque les\n    nouvelles constructions présentent un linéaire supérieur à 20 mètres au-delà de la\n    Secteur    bande E, il est exigé au moins une césure d’au moins 5 mètres de large sur toute leur\n    U2-C    profondeur. Ces césures sont soit sur toute leur hauteur, soit à partir de R+1 et sont\n    autorisées à recevoir des balcons et passerelles. Cette disposition ne s’applique pas\n    aux constructions et installations nécessaires aux services publics ou d’intérêt collectif.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U2\n    Implantation sur un même terrain\n    ▪    Les dispositions relatives aux implantations des constructions sur un même terrain, ne\n    s'appliquent pas aux volumes de couronnement et aux césures exigées.\n3.3.4.    Règles alternatives :\n Secteur    Cas des travaux sur les constructions existantes ne respectant pas les règles\n    d’implantation\n    ▪    Dans le cas de constructions existantes, ne respectant pas les règles d’implantation\n    sur un même terrain, sont autorisés pour les parties de construction ne respectant\n    pas les règles d’implantation :\n    o   Les travaux d’amélioration de l’implantation vis-à-vis des règles générales,\n    o   Les travaux sans effet sur le gabarit de la construction.\n Zone U2\n    o   A l’exception du secteur U2-C, les extensions horizontales et verticales\n    respectant une distance égale ou supérieure à la distance entre constructions\n    existantes, à condition que la nouvelle façade ou partie de façade ne comporte\n    pas de baie.\n    ▪    En dehors des parties de constructions ne respectant pas les règles d’implantation,\n    les règles générales s’appliquent.\n    Cas des constructions annexes\n À Sèvres :    113\n La distance minimale entre une construction d’habitation comprenant au plus 2 logements et une annexe,\n est de 2,5 mètres.\n Secteur    Cas des petites extensions sur les constructions existantes\n    ▪    Nonobstant les règles générales, sont autorisés les travaux d’extension sur les\n Secteur    constructions existantes générant une emprise au sol inférieure à 20 m² ou les\n    vérandas situées à l’arrière de la construction, dans la mesure où l’extension ne réduit\n  U2-C    pas de plus d’1/3 les espaces libres existants sur le terrain. Si l’extension est une\n    véranda, celle-ci devra se situer à l’arrière de la construction existante.\n Secteur    Autres cas de figure\n    ▪    Des implantations alternatives sont autorisées, dans le cadre de la mise en œuvre de\n Zone U2    l’OAP continuités écologiques, particulièrement pour préserver des plantations\n    existantes ou assurer les continuités écologiques avec les espaces voisins.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U2\n    Emprise au sol\n    3.4. Emprise au sol\n    3.4.1.    Champ d’application :\n    Ne sont pas pris en compte pour l’application des règles d’emprise au sol :\n    a. Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou environnementale\n    des constructions, notamment ceux nécessaires à l’isolation thermique par l’extérieur et les\n    dispositifs de protection contre le rayonnement solaire, en cas de travaux sur des constructions\n    existantes, dans la limite de 0,40 mètre d’épaisseur,\n    b. Les ouvrages d’amélioration ou de mise aux normes d’une construction pour la sécurité ou\n    l’accessibilité pour les personnes à mobilité réduite, en cas de travaux sur des constructions\n    existantes.\n    Sauf mention contraire au sein du présent règlement, les projets de construction intégrant un programme à\n    destination d’équipement d’intérêt collectif et services publics au sein d’une même construction peuvent\n    bénéficier des règles spécifiques définies pour les constructions à destination d’équipement d’intérêt collectif\n    et services publics, dès lors que :\n    o   La destination équipement d’intérêt collectif et services publics concerne 100% de la\n    surface de plancher du rez-de-chaussée, exception faite des parties communes et des\n    accès nécessaires au fonctionnement de la construction,\n    o   Ou que la destination équipement d’intérêt collectif et services publics concerne au moins\n    50% de la surface de plancher de la construction.\n    3.4.2.    Règles générales :\n    Les projets doivent être conformes au coefficient de pleine-terre exigé, nonobstant toute règle d’emprise au\n    sol énoncée ci-après.\n114\n    Sauf disposition particulière dans la règle écrite ou graphique l’emprise au sol maximale des constructions\n    est fixée selon les modalités suivantes :\n    Secteur    Règles générales : emprise au sol\n    Secteurs\n    U2-A    ▪   L’emprise au sol des constructions à destination d’équipements d’intérêt collectif et\n    U2-B    services publics n’est pas réglementée.\n    U2-D\n    ▪   Dans une bande de 20 mètres : 60% de la partie du terrain située dans cette bande.\n    ▪   Hors bande de 20 mètres : 10% de la partie du terrain située hors de la bande.\n    Secteur\n    U2-A\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U2\n    Emprise au sol\n    À Marnes-la-Coquette et Ville-d’Avray :\n    ▪   La notion de bande ne s’applique pas. L’emprise au sol des constructions ne pourra\n    pas excéder 60 % de la superficie de la surface totale du terrain.\n    À Issy les Moulineaux :\n    ▪   Dans une bande de 20 mètres : L’emprise au sol n’est pas règlementée dans la partie\n    du terrain située dans la bande.\n    ▪   Hors bande de 20 mètres : 10% de la partie du terrain située hors de la bande.\n    ▪   L’emprise au sol des constructions ne pourra pas excéder 50 % de la superficie de la\n    surface totale du terrain.\nSecteur\n    ▪   60% de la surface du terrain\n U2-B\n    ▪   50% de la surface du terrain\n    ▪   Pour les terrains d’angle d’une surface inférieure ou égale à 2 000 m², l’emprise\n    maximale des constructions, y compris des bâtiments annexes est fixée à 55% de la\n    surface totale du terrain.\n    ▪   Lorsqu’une bande E est mentionnée, sa profondeur est de 15 mètres\n    ▪   Pour les constructions à destination de bureaux ou activité, la profondeur de la bande\n    E est portée à 18 mètres le long des voies suivantes : route de la Reine, avenue du\n    Général Leclerc, avenue Édouard V
