ission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U5\n    Zone U5\n    Zones d’activités économiques\n    La zone U5 a vocation à accueillir de multiples activités économiques, dont celles qui sont le plus difficilement\n    compatibles avec les tissus urbains résidentiels ou mixtes. Elle est composée de quatre secteurs :\n    ▪   U5-A, correspondant aux zones d’activités à vocation artisanales ou mixtes. Il est composé de deux\n    sous-secteurs situés à Sèvres :\n    o    U5-A-1 pour la zone d’activités des Postillons dans le quartier des Bruyères,\n    o    U5-A-2 pour le site du Centre Technique des Industries Mécaniques (CETIM),\n    ▪   U5-B correspondant au secteur du parc des expositions de la Porte de Versailles à Issy-les-\n    Moulineaux et Vanves.\n    ▪   U5-C correspondant aux secteurs d’activités occupant de grandes emprises à Meudon, ZAE de\n    Meudon-la-Forêt, et à Marnes-la-Coquette, site d’activité Bio-Rad.\n    ▪   U5-D correspondant aux secteurs portuaires en bord de Seine.\n186\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U5\n    Implantation par rapport aux emprises publiques et aux voies\n3.1. Implantation par rapport aux emprises publiques et aux\n    voies\n3.1.1.    Champ d’application :\n    a. Sous réserve du règlement de voirie et de l’accord du gestionnaire de voirie pour les saillies sur\n    espace public, ne sont pas pris en compte pour l’application des règles d’implantation à l’alignement :\nLes dispositifs visant à améliorer ou optimiser la performance énergétique et/ou environnementale des\nconstructions, notamment ceux nécessaires à l’isolation thermique par l’extérieur, en cas de travaux sur des\nconstructions existantes, dans la limite de 0,40 mètre d’épaisseur,\n    ▪    Les traitements en creux en rez-de-chaussée au droit des accès sur une profondeur de 1 mètre,\n    ▪    Les renfoncements de loggias ou autres, à partir d'une hauteur de 3,50 mètres et du R+1,\n    ▪    Les saillies des façades des commerces sur trottoir sont autorisées en rez-de-chaussée et dans une\n    limite de 0,20 mètre d’épaisseur.\n    ▪    Sur les emprises publiques et voies de largeur inférieure à 12 mètres :\n    o   Les marquises et les stores-bannes, dans une limite de 0,80 mètre,\n    o   Les éléments de modénature, dans une limite de 0,40 mètre, à partir d'une hauteur de\n    3,50 mètres et R+1,\n    o   Les balcons et oriels, dans une limite de 0,60 m, à partir d'une hauteur de 5,50 mètres et\n    du R+2. La proportion des oriels devant être inférieure ou égale à 20% de la surface de la\n    façade,\n    o   En cas de travaux sur des constructions existantes, les dispositifs de protection solaire\n    dans la limite de 0,40 mètre et à partir d’une hauteur de 5,50 mètres.\n    ▪    Sur les emprises publiques et voies de largeur supérieure ou égale à 12 mètres et inférieure    187\n    à 20 mètres :\n    o   Les marquises et les stores-bannes, dans une limite de 1,20 mètre,\n    o   Les éléments de modénature, dans une limite de 0,60 mètre, à partir d'une hauteur de\n    3,50 mètres et du R+1,\n    o   Les balcons et oriels, dans une limite de 0,80 mètre, à partir d'une hauteur de 5,50 mètres\n    et du R+2. La proportion des oriels devant être inférieure ou égale à 20% de la surface de\n    la façade,\n    o   En cas de travaux sur des constructions existantes, les dispositifs de protection solaire\n    dans la limite de 0,80 mètre et à partir d’une hauteur de 5,50 mètres.\n    ▪    Sur les emprises publiques et voies de largeur supérieure ou égale à 20 mètres :\n    o   Les marquises et les stores-bannes, dans une limite de 1,80 mètre,\n    o   Les éléments de modénature, dans une limite de 0,80 mètre, à partir d'une hauteur de\n    3,50 mètres et du R+1,\n    o   Les balcons et oriels, dans une limite de 1,20 mètre, à partir d'une hauteur de 5,50 mètres\n    et du R+2. La proportion des oriels devant être inférieure ou égale à 20% de la surface de\n    la façade,\n    o   En cas de travaux sur des constructions existantes, les dispositifs de protection solaire\n    dans la limite de 1,20 mètre et à partir d’une hauteur de 5,50 mètres.\n    b. En cas de recul, ne sont pas pris en compte pour le calcul du recul :\n    o   Les éléments de modénature, les marquises et les auvents de moins de 0,80 mètre de\n    profondeur,\n    o   Les débords de toiture de moins de 0,60 mètre de profondeur,\n    o   Les oriels de moins de 0,40 mètre de profondeur et à partir d’une hauteur de 5,50 mètres,\n    o   Les balcons dans la limite de 1,20 mètre de profondeur,    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U5\n    Implantation par rapport aux emprises publiques et aux voies\n    o   Les perrons, terrasses et emmarchements,\n    o   Les ouvrages d’amélioration ou de mise aux normes d’une construction pour la sécurité ou\n    l’accessibilité pour les personnes à mobilité réduite, en cas de travaux sur des\n    constructions existantes,\n    o   Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou\n    environnementale des constructions, notamment ceux nécessaires à l’isolation thermique\n    par l’extérieur et les dispositifs de protection contre le rayonnement solaire, en cas de\n    travaux sur des constructions existantes, dans la limite de 0,40 mètre d’épaisseur,\n    o   Les rampes de garage desservant le sous-sol ou le rez-de-chaussée de la construction,\n    o   Les escaliers, les rampes d’accès et les passerelles non couvertes.\n    c.   En cas de présence d’un alignement d’arbres repéré au plan 4.3 Protections, la préservation des\n    arbres prévaut sur les dispositifs non pris en compte pour l’application des règles d’implantation.\n    d. Sauf mention contraire au sein du présent règlement, les projets de construction intégrant un\n    programme à destination d’équipement d’intérêt collectif et services publics au sein d’une même\n    construction peuvent bénéficier des règles spécifiques définies pour les constructions à destination\n    d’équipement d’intérêt collectif et services publics, dès lors que :\n    o   La destination équipement d’intérêt collectif et services publics concerne 100% de la\n    surface de plancher du rez-de-chaussée, exception faite des parties communes et des\n    accès nécessaires au fonctionnement de la construction,\n    o   Ou que la destination équipement d’intérêt collectif et services publics concerne au moins\n    50% de la surface de plancher de la construction,\n    3.1.2.    Règles générales :\n188   Sauf disposition particulière dans la règle graphique, notamment les marges de recul ou obligation\n    d’alignement indiqués sur le plan 4.2 des prescriptions et périmètres particuliers, les constructions doivent\n    s’implanter en respectant les règles suivantes par rapport aux emprises publiques et aux voies :\n    Secteur    Règles applicables\n    ▪   L’implantation des constructions à destination d’équipements d’intérêt collectif et\n    services publics n’est pas réglementée.\n    ▪   Implantation vis-à-vis des sentes piétonnes : les constructions doivent être implantées\n    avec un recul supérieur ou égal 3 mètres.\n    Zone\n    U5\n    ▪   L’implantation de locaux destinés au stockage des ordures ménagères nécessaire au\n    tri n’est pas règlementée.\n    ▪   En cas d’implantation à l’alignement de deux voies ouvertes à la circulation automobile,\n    un nouvel alignement peut être défini par un pan coupé pour favoriser l’insertion\n    urbaine et la sécurité. Ce pan coupé doit être d’une longueur comprise entre 3 mètres\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U5\n    Implantation par rapport aux emprises publiques et aux voies\n    et 7 mètres, à déterminer en fonction des circonstances locales. Le nouvel alignement\n    peut également être matérialisé par un arc de cercle de dimension équivalente.\n Secteur    ▪    Les constructions doivent s’implanter en respectant un recul supérieur ou égal à 4\n  U5-A    mètres par rapport à l’alignement des emprises publiques et des voies.\n    ▪    Les constructions doivent s’implanter en respectant un recul supérieur ou égal à 2,5\n    mètres par rapport à l’alignement des emprises publiques et des voies.\n Secteur    ▪    Dans le périmètre de hauteur spécifique identifié dans le document graphique n°4.2\n  U5-B    Plan des prescriptions et périmètres particuliers, les constructions sont autorisées\n    à s’implanter en tout ou partie en recul ou à l’alignement lorsque leur implantation\n    permet de créer une continuité urbaine favorisant l’ouverture du parc des expositions\n    sur la ville.\n    ▪   Les constructions doivent s’implanter en respectant un recul supérieur ou égal à :\n    o    30 mètres à Marnes-la-Coquette ;\n    o    La moitié de la hauteur totale de la construction, sans pouvoir être inférieur à 12\n    mètres à Meudon.\n Secteur\n    ▪    Les saillies sont autorisées, uniquement pour les constructions implantées en recul et\n  U5-C    dans la limite de 2 mètres de profondeur, nonobstant les dispositions du champ\n    d’application.\n    ▪    Emplacement réservé n°25 : les constructions doivent s’implanter en respectant un\n    recul par rapport à l’alignement projeté par l’ER n°25, au moins égal à la moitié de la\n    hauteur de la construction, diminuée de 3 mètres.\n    189\n Secteur    ▪    Les constructions peuvent s’implanter à l’alignement ou en recul des emprises\n  U5-D    publiques et des voies.\n3.1.3.    Règles alternatives\n Secteur    Cas des constructions existantes ne respectant pas la règle d’implantation\n    ▪    Dans le cas de constructions existantes ne respectant pas les règles générales\n    d’implantation par rapport aux emprises publiques et aux voies, sont autorisés pour les\n    parties de constructions ne respectant pas les règles d’implantation :\n    o    Les travaux qui améliorent l’implantation vis-à-vis des règles générales et ceux\n    sans effet sur le gabarit de la construction existante,\n    o    Les extensions horizontales et verticales avec un recul égal ou supérieur à celui\n    des constructions existantes, sauf pour les parties de constructions situées dans\n  Zone\n    un emplacement réservé,\n   U5\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U5\n    Implantation par rapport aux emprises publiques et aux voies\n    o    Les annexes existantes ne sont pas concernées par les dispositions relatives aux\n    possibilités d’extension verticale ou horizontale.\n    Secteur    Autres cas de figure\n    ▪   Dans le cadre de la mise en œuvre de l’OAP thématique continuités écologiques, des\n    Zone    implantations alternatives sont autorisées, et ce particulièrement lorsqu’il s’agit\n    U5    d’assurer la préservation des plantations existantes ou les continuités écologiques\n    avec les espaces voisins.\n190\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U5\n    Implantation par rapport aux limites séparatives\n3.2. Implantation par rapport aux limites séparatives\n3.2.1.    Champ d’application :\n   a. Sont admis dans le retrait :\n    o    Les éléments de modénature, les marquises et les auvents dans la limite de 0,80 mètre de\n    profondeur,\n    o    Les débords de toiture dans la limite de 0,60 mètre de profondeur,\n    o    Les oriels dans la limite de 0,40 mètre de profondeur,\n    o    Les perrons, escaliers et emmarchements,\n    o    Les terrasses et passerelles non couvertes, de moins de 0,60 mètre de hauteur par\n    rapport au terrain avant travaux,\n    o    Les balcons dans la limite d’1,20 mètre de profondeur,\n    o    Les ouvrages d’amélioration ou de mise aux normes d’une construction pour la sécurité ou\n    l’accessibilité pour les personnes à mobilité réduite, en cas de travaux sur des\n    constructions existantes,\n    o    Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou\n    environnementale des constructions, notamment ceux nécessaires à l’isolation thermique\n    par l’extérieur et les dispositifs de protection contre le rayonnement solaire, en cas de\n    travaux sur des constructions existantes, dans la limite de 0,40 mètre d’épaisseur,\n    o    Les pare-vues et les garde-corps, sous réserve de ne pas dépasser 1,90 mètre de\n    hauteur.\n   b. En cas de servitude de cour commune, l’article relatif à l’implantation des constructions sur un même\n    terrain s’applique, sauf à Meudon où en cas de servitude de cour commune, la distance entre deux\n    constructions situées de part et d’autre d’une cour commune doit être supérieure ou égale à 3\n    mètres.    191\n3.2.2.    Règles générales :\nSauf disposition particulière dans la règle écrite ou graphique, les constructions doivent s’implanter en\nrespectant les règles suivantes par rapport aux limites séparatives :\n  Secteur    Règles applicables\n    Constructions à destination d’équipements d’intérêt collectif et services publics :\n    ▪   Il n’est pas défini de bande pour l’implantation des constructions à destination\n    d’équipements d’intérêt collectif et services publics.\n Zone U5    ▪   Les constructions peuvent être implantées en limite ou en retrait des limites\n    séparatives.\n    ▪   En cas de retrait, celui-ci doit être supérieur ou égal à la moitié de la hauteur de\n    façade, soit L ≥ Hf/2, sans être inférieur à 1,90 mètre.\n    ▪   Les constructions peuvent s’implanter sur les limites séparatives ou en retrait de ces\n    dernières.\n  Secteur\n    ▪   En cas de retrait :\n   U5-A\n    o   Façades avec baie : la distance de tout point de la façade par rapport à la\n    limite séparative doit être supérieure ou égale à la hauteur de ce point,\n    soit L ≥ Hf, sans pouvoir être inférieure à 8 mètres.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U5\n    Implantation par rapport aux limites séparatives\n    o    Façade sans baie : la distance de tout point de la façade par rapport à la\n    limite séparative doit être supérieure ou égale à la moitié de la hauteur de ce\n    point, soit L ≥ Hf/2, sans pouvoir être inférieure à 3 mètres.\n    Secteurs\n    U5-B\n    ▪   Les constructions doivent s’implanter en respectant un retrait supérieur ou égal à 8\n    mètres par rapport aux limites séparatives.\n    U5-C\n192\n    Secteur\n    ▪   Les constructions peuvent s’implanter sur limites séparatives ou en retrait.\n    U5-D\n    3.2.3.    Règles alternatives :\n    Secteur    Cas des travaux sur constructions existantes\n    ▪   Dans le cas d’une construction existante, sont autorisés pour les parties de\n    construction ne respectant pas les règles d’implantation par rapport aux limites\n    séparatives :\n    o    Les travaux d’amélioration de l’implantation vis-à-vis des règles générales et\n    ceux sans effet sur le gabarit de la construction.\n    o    Les extensions horizontales et verticales avec un retrait égal ou supérieur à\n    celui des constructions existantes, à condition que la nouvelle façade ou partie\n    de façade ne comporte pas de baie,\n    Zone U5\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U5\n    Implantation par rapport aux limites séparatives\n    o   Les travaux qui améliorent l’implantation vis-à-vis des règles générales et ceux\n    sans effet sur le gabarit de la construction existante.\n    ▪   En dehors des parties de constructions ne respectant pas les règles d’implantation\n    par rapport aux limites séparatives, les règles générales s’appliquent.\n    Autres cas de figure\n    ▪   Dans le cadre de la mise en œuvre de l’OAP thématique continuités écologiques,\n    des implantations alternatives sont autorisées, et ce particulièrement lorsqu’il s’agit\nZone U5\n    d’assurer la préservation des plantations existantes ou les continuités écologiques\n    avec les espaces voisins.\n    193\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U5\n    Implantation sur un même terrain\n    3.3. Implantation sur un même terrain\n    3.3.1.    Champ d’application :\n    a. La distance minimale entre deux constructions non contiguës implantées sur un même terrain est\n    mesurée perpendiculairement et horizontalement en tout point de chaque façade.\n    b. Ne sont pas pris en compte pour l’application des règles d’implantation :\n    o   Les éléments de modénature et les motifs architectoniques dans la limite de 0,40 mètre de\n    profondeur,\n    o   Les marquises et les auvents dans la limite de 0,80 mètre de profondeur,\n    o   Les débords de toiture dans la limite de 0,60 mètre de profondeur,\n    o   Les oriels dans la limite de 0,40 mètre de profondeur,\n    o   Les perrons et emmarchements,\n    o   Les terrasses de moins de 0,60 mètre de hauteur par rapport au terrain avant travaux,\n    o   Les éléments architecturaux d’accès ou de liaison tel que portiques, porches, passerelles,\n    escaliers, liaisons couvertes et autres éléments de liaisons,\n    o   Les balcons dans la limite de 1,20 mètre de profondeur,\n    o   Les ouvrages d’amélioration ou de mise aux normes d’une construction pour la sécurité ou\n    l’accessibilité pour les personnes à mobilité réduite, en cas de travaux sur des\n    constructions existantes,\n    o   Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou\n    environnementale des constructions, notamment ceux nécessaires à l’isolation thermique\n    par l’extérieur et les dispositifs de protection contre le rayonnement solaire, en cas de\n    travaux sur des constructions existantes, dans la limite de 0,40 mètre d’épaisseur,\n    o   Les pare-soleils extérieurs et les doubles parois vitrées de moins de 0,80 mètre de\n194    profondeur,\n    o   Les pare-vues et les garde-corps, sous réserve de ne pas dépasser 1,90 mètre de\n    hauteur.\n    3.3.2.    Règles générales :\n    Sauf disposition particulière dans la règle écrite ou graphique, les constructions, lorsqu’elles sont non\n    contiguës et implantées sur un même terrain, doivent respecter entre elles les distances minimales\n    suivantes :\n    Secteur    Règles applicables\n    Zone U5\n    ▪   L’implantation des constructions à destination d’équipements d’intérêt collectif et\n    services publics n’est pas réglementée.\n    Secteur\n    ▪   La distance séparant les constructions doit être supérieure ou égale à :\n    o   La hauteur totale la plus haute, sans pouvoir être inférieure à 8 mètres si au\n    moins l’une des façades comporte une baie.\n    U5-A\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U5\n    Implantation sur un même terrain\n    o    La moitié de la hauteur totale la plus haute, sans pouvoir être inférieure à\n    4 mètres si aucune façade ne comporte de baie.\n Secteur    ▪   La distance séparant les constructions doit être supérieure ou égale à la moitié de la\n   U5-B    hauteur totale la plus haute.\n    ▪   La distance séparant les constructions doit être supérieure ou égale à la moitié de la    195\n Secteur    hauteur totale la plus haute, sans pouvoir être inférieure à :\n   U5-C    o    8 mètres si au moins l’une des façades comporte une baie.\n    o    4 mètres si aucune façade ne comporte de baie.\n Secteur    ▪   L’implantation des constructions les unes par rapport aux autres doit assurer un\n   U5-D    écoulement des eaux satisfaisant lors des périodes de crue.\n3.3.3.    Règles alternatives :\n Secteur    Cas des travaux sur construction existante mal implantée\n    ▪   Dans le cas de constructions existantes, sont autorisés pour les parties de\n    construction ne respectant pas les règles d’implantation sur un même terrain :\n    o    Les extensions horizontales et verticales respectant une distance égale ou\n    supérieure à la distance entre constructions existantes, à condition que la\n Zone U5    nouvelle façade ou partie de façade ne comporte pas de baie,\n    o    Les travaux d’amélioration de l’implantation vis-à-vis des règles générales et\n    ceux sans effet sur le gabarit de la construction.\n    ▪   En dehors des parties de constructions ne respectant pas les règles d’implantation\n    sur un même terrain, les règles générales s’appliquent.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U5\n    Emprise au sol\n    3.4. Emprise au sol\n    3.4.1.    Champ d’application :\n    Ne sont pas pris en compte pour l’application des règles d’emprise au sol :\n    ▪    Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou environnementale\n    des constructions, notamment ceux nécessaires à l’isolation thermique par l’extérieur et les\n    dispositifs de protection contre le rayonnement solaire, en cas de travaux sur des constructions\n    existantes, dans la limite de 0,40 mètre d’épaisseur,\n    ▪    Les ouvrages d’amélioration ou de mise aux normes d’une construction pour la sécurité ou\n    l’accessibilité pour les personnes à mobilité réduite, en cas de travaux sur des constructions\n    existantes.\n    Sauf mention contraire au sein du présent règlement, les projets de construction intégrant un programme à\n    destination d’équipement d’intérêt collectif et services publics au sein d’une même construction peuvent\n    bénéficier des règles spécifiques définies pour les constructions à destination d’équipement d’intérêt collectif\n    et services publics, dès lors que :\n    o   La destination équipement d’intérêt collectif et services publics concerne 100% de la\n    surface de plancher du rez-de-chaussée, exception faite des parties communes et des\n    accès nécessaires au fonctionnement de la construction,\n    o   Ou que la destination équipement d’intérêt collectif et services publics concerne au moins\n    50% de la surface de plancher de la construction.\n    3.4.2.    Règles générales :\n    Les projets doivent être conformes au coefficient de pleine-terre exigé, nonobstant toute règle d’emprise au\n    sol énoncée ci-après.\n196   Sauf disposition particulière dans la règle écrite ou graphique l’emprise au sol maximale des constructions\n    est fixée selon les modalités suivantes :\n    Secteur    Règles applicables\n    Zone U5\n    ▪    L’emprise au sol des constructions à destination d’équipements d’intérêt collectif et\n    services publics n’est pas réglementée.\n    U5-A\n    ▪    80% de la surface du terrain.\n    U5-B\n    ▪    Meudon : 40% de la surface du terrain.\n    U5-C\n    ▪    Marnes-la-Coquette : 50% de la surface du terrain.\n    U5-D    ▪    50% de la surface du terrain.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U5\n    Hauteur\n3.5. Hauteur\n3.5.1.    Règles générales\nSauf disposition particulière dans la règle écrite ou graphique, les constructions doivent s’inscrire, le cas\néchéant dans le gabarit-enveloppe défini par les règles cumulatives énoncées, et a minima respecter les\nrègles de hauteur énoncées.\n  Secteur    Règles applicables\n    ▪   Pour les constructions à destination d’équipements d’intérêt collectif et services\n    publics, la règle de hauteur ne s’applique pas dès lors qu’il s’agit de répondre à des\n    contraintes techniques ou règlementaires strictement liées à l’usage du bâtiment.\n  Zone U5    ▪   Pour les constructions dont le rez-de-chaussée est à destination de commerces et\n    activités de service, la hauteur de rez-de-chaussée de plancher à plancher doit au\n    minimum atteindre 3,50 mètres sauf pour les locaux communs, techniques, espaces\n    de stockage et de stationnement vélo.\n   Sous-    ▪   La hauteur totale des constructions est limitée à 18 mètres.\n  secteur    ▪   Pour les terrains implantés le long de la rue de la Garenne, la hauteur totale des\n  U5-A-1    constructions implantées dans une bande de 25 mètres est limitée à 15 mètres.\n   Sous-\n  secteur    ▪   La hauteur totale des constructions est limitée à 12 mètres.\n  U5-A-2\n    ▪   La hauteur totale des constructions est limitée à 15 mètres.    197\n  Secteur\n    ▪   Dans le périmètre de hauteur spécifique identifié au document graphique n°4.2 Plan\n   U5-B    des prescriptions et périmètres particuliers, la hauteur totale des constructions\n    est limitée à 35 mètres.\n  Secteur\n    ▪   La hauteur totale des constructions est limitée à :\n    o    10 mètres à Marnes-la-Coquette.\n   U5-C\n    o    35 mètres à Meudon.\n    ▪   La hauteur totale des constructions est limitée à 6 mètres, portée à 9 mètres sur 10%\n  Secteur    maximum de l’emprise au sol autorisée.\n   U5-D    ▪   La hauteur totale des installations portuaires est fixée à 18 m, portée à 24 m sur 20\n    % de la superficie de l’entité portuaire.\n3.5.2.    Règles particulières :\n  Secteur    Cas non soumis aux règles générales\n Zone U5\n    ▪   La hauteur totale des locaux techniques situés en toiture terrasse ne doit pas\n    dépasser 1,80 mètre. Cette hauteur est portée à 3,50 mètres dans le secteur U5-C.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U5\n    Hauteur\n    3.5.3.    Règles alternatives :\n    Dépassements du gabarit-enveloppe sous réserve des dispositions du chapitre 6.\n    Secteur\n    Patrimoine bâti et paysager\n    Pour les constructions existantes, hors patrimoine protégé repéré au document\n    graphique n° 4.3 Plan des protections patrimoniales, écologiques et paysagères :\n    ▪   Sont exclus de la règle de hauteur les éléments suivants :\n    o   Les dispositifs relatifs aux cabines d’ascenseurs en dehors de toitures\n    fonctionnalisées, aux chaufferies et à la climatisation, dans la limite de 1,20\n    mètre.\n    o   Les dispositifs de production d’énergie renouvelable :\n    -    Dès lors qu’ils ont une hauteur totale inférieure ou égale à 0,70\n    mètres pour les bâtiments d’une hauteur totale inférieure ou égale à\n    13,50 mètres (ou R+3+A)\n    -    Dès lors qu’ils ont une hauteur totale inférieure ou égale à 1,80 mètre\n    pour les bâtiments d’une hauteur totale supérieure à 13,50 mètres\n    (ou R+4)\n    o   Les dispositifs d’isolation par l’extérieur dès lors que leur épaisseur ou\n    largeur maximale par rapport à la toiture existante est inférieure ou égale à\n    0,40 mètre.\n    o   Les dispositifs de protection solaire dans la limite de 0,60 mètre.\n    Pour toutes les constructions, les dépassements du gabarit-enveloppe sont\n    autorisés :\n    o   Pour les toitures végétalisées occupant plus de 75% de la surface de\n198    toiture, dès lors que l’épaisseur de substrat est supérieure ou égale à 0,30\n    mètre et dans la limite de l’épaisseur de substrat ;\n    Zone U5    o   Pour les édicules liés à la fonctionnalisation des toitures (chapitre 5 du\n    règlement), d'une surface unitaire inférieure ou égale à 20 m² d’emprise et\n    d'une hauteur inférieure ou égale à 2,50 mètres portée à 3,50 mètres pour\n    les édicules d’ascenseurs. Ils doivent en outre :\n    ▪    être implantés en retrait de chacune des façades. Le retrait minimal\n    étant égal à la hauteur de l’édicule.\n    ▪    présenter une emprise totale inférieure ou égale à 10% de l’emprise\n    de la terrasse.\n    o   En cas de construction « en escalier » cela ne s’applique qu’à la toiture la\n    plus haute.\n    o   Pour les constructions nécessaires à l’agriculture urbaine, sous réserve\n    qu’elles aient une emprise inférieure ou égale à 40% de la surface de la\n    terrasse et une hauteur totale de 3 mètres, et pour les installations\n    nécessaires à l’agriculture urbaine, sous réserve qu’elles aient une hauteur\n    totale de 2 mètres. Cette règle ne s’applique pas :\n    ▪    Aux bâtiments bénéficiant d’un autre dépassement de gabarit ;\n    ▪    Aux bâtiments présentant une hauteur totale inférieure à 13,50\n    mètres ;\n    ▪    Aux patrimoines protégés définis par le présent règlement.\n    o   Pour les acrotères dans la limite de la hauteur totale.\n    o   Pour les lucarnes, dans la limite de la hauteur totale et de 40% du linéaire de\n    façade.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U5\n    Hauteur\n    ▪   A l’exception du sous-secteur U5-A-1, en cas de construction s’implantant entre\n    deux constructions plus hautes que la hauteur totale autorisée, la hauteur totale de\n    la nouvelle construction peut s’aligner sur la hauteur moyenne des deux\n    constructions voisines.\n3.5.4.    Règles qualitatives :\n    Secteur U5-D\n    ▪    Des émergences techniques ponctuelles sont admises si elles sont liées au transport et au\n    déchargement de matériaux ou lorsqu’il s’agit de mettre en place un dispositif destiné à assurer\n    la sécurité des personnes sur une construction existante.\n    199\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U6\n    Zone U6\n    Équipements spécifiques\n    La zone U6 est dédiée à certains équipements d’intérêt collectif et services publics. Elle a pour objectif\n    d’assurer la pérennité de la vocation d’équipement de sites d’importance. Elle est composée de quatre\n    secteurs :\n    ▪   U6-A correspondant aux principaux secteurs de grands équipements.\n    ▪   U6-B correspondant aux principaux parcs urbains.\n    ▪   U6-C dédié aux sites d’équipements sportifs au sein de la forêt de Meudon.\n    ▪   U6-D correspondant à des sites d’équipement à Boulogne-Billancourt,\n    o   U6-D-1, dédié au site de l’hôpital Ambroise-Paré APHP,\n    o   U6-D-2, dédié au site de l’Abreuvoir,\n    o   U6-D-3, dédié au site de la Seine Musicale,\n    o   U6-D-4, dédié à divers équipements sportifs.\n200\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U6\n    Implantation par rapport aux emprises publiques et aux voies\n3.1. Implantation par rapport aux emprises publiques et aux\n    voies\n3.1.1.    Champ d’application :\n    a. Sous réserve du règlement de voirie et de l’accord du gestionnaire de voirie pour les saillies sur\n    espace public, ne sont pas pris en compte pour l’application des règles d’implantation à l’alignement :\nLes dispositifs visant à améliorer ou optimiser la performance énergétique et/ou environnementale des\nconstructions, notamment ceux nécessaires à l’isolation thermique par l’extérieur, en cas de travaux sur des\nconstructions existantes, dans la limite de 0,40 mètre d’épaisseur,\n    ▪    Les traitements en creux en rez-de-chaussée au droit des accès sur une profondeur de 1 mètre,\n    ▪    Les renfoncements de loggias ou autres, à partir d'une hauteur de 3,50 mètres et du R+1,\n    ▪    Les saillies des façades des commerces sur trottoir sont autorisées en rez-de-chaussée et dans une\n    limite de 0,20 mètre d’épaisseur.\n    ▪    Sur les emprises publiques et voies de largeur inférieure à 12 mètres :\n    o   Les marquises et les stores-bannes, dans une limite de 0,80 mètre,\n    o   Les éléments de modénature, dans une limite de 0,40 mètre, à partir d'une hauteur de\n    3,50 mètres et R+1,\n    o   Les balcons et oriels, dans une limite de 0,60 mètre, à partir d'une hauteur de 5,50 mètres\n    et du R+2. La proportion des oriels devant être inférieure ou égale à 20% de la surface de\n    la façade,\n    o   En cas de travaux sur des constructions existantes, les dispositifs de protection solaire\n    dans la limite de 0,40 mètre et à partir d’une hauteur de 5,50 mètres.\n    ▪    Sur les emprises publiques et voies de largeur supérieure ou égale à 12 mètres et inférieure    201\n    à 20 mètres :\n    o   Les marquises et les stores-bannes, dans une limite de 1,20 mètre,\n    o   Les éléments de modénature, dans une limite de 0,60 mètre, à partir d'une hauteur de\n    3,50 mètres et du R+1,\n    o   Les balcons et oriels, dans une limite de 0,80 mètre, à partir d'une hauteur de 5,50 mètres\n    et du R+2. La proportion des oriels devant être inférieure ou égale à 20% de la surface de\n    la façade,\n    o   En cas de travaux sur des constructions existantes, les dispositifs de protection solaire\n    dans la limite de 0,80 mètre et à partir d’une hauteur de 5,50 mètres.\n    ▪    Sur les emprises publiques et voies de largeur supérieure ou égale à 20 mètres :\n    o   Les marquises et les stores-bannes, dans une limite de 1,80 mètre,\n    o   Les éléments de modénature, dans une limite de 0,80 mètre, à partir d'une hauteur de\n    3,50 mètres et du R+1,\n    o   Les balcons et oriels, dans une limite de 1,20 mètre, à partir d'une hauteur de 5,50 mètres\n    et du R+2. La proportion des oriels devant être inférieure ou égale à 20% de la surface de\n    la façade,\n    o   En cas de travaux sur des constructions existantes, les dispositifs de protection solaire\n    dans la limite de 1,20 mètre et à partir d’une hauteur de 5,50 mètres.\n    b. En cas de recul, ne sont pas pris en compte pour le calcul du recul :\n    o   Les éléments de modénature, les marquises et les auvents de moins de 0,80 mètre de\n    profondeur,\n    o   Les débords de toiture de moins de 0,60 mètre de profondeur,\n    o   Les oriels de moins de 0,40 mètre de profondeur et à partir d’une hauteur de 5,50 mètres,\n    o   Les balcons dans la limite de 1,20 mètre de profondeur,    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U6\n    Implantation par rapport aux emprises publiques et aux voies\n    o    Les perrons, terrasses et emmarchements,\n    o    Les ouvrages d’amélioration ou de mise aux normes d’une construction pour la sécurité ou\n    l’accessibilité pour les personnes à mobilité réduite, en cas de travaux sur des\n    constructions existantes,\n    o    Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou\n    environnementale des constructions, notamment ceux nécessaires à l’isolation thermique\n    par l’extérieur et les dispositifs de protection contre le rayonnement solaire, en cas de\n    travaux sur des constructions existantes, dans la limite de 0,40 mètre d’épaisseur,\n    o    Les rampes de garage desservant le sous-sol ou le rez-de-chaussée de la construction,\n    o    Les escaliers, les rampes d’accès et les passerelles non couvertes.\n    c.   En cas de présence d’un alignement d’arbres repéré au plan 4.3 Protections, la préservation des\n    arbres prévaut sur les dispositifs non pris en compte pour l’application des règles d’implantation.\n    3.1.2.    Règles générales\n    Sauf disposition particulière dans la règle graphique, notamment les marges de recul ou obligation\n    d’alignement indiqués sur le plan 4.2 des prescriptions et périmètres particuliers, les constructions doivent\n    s’implanter en respectant les règles suivantes par rapport aux emprises publiques et voies :\n    Secteur    Règles applicables\n    ▪    Les constructions peuvent s’implanter à l’alignement ou en recul.\n    ▪    Les locaux et installations techniques peuvent être localisés dans la marge de recul dès\n    lors qu'ils sont enterrés.\n202    Zone U6    ▪    En cas d’implantation à l’alignement de deux voies ouvertes à la circulation automobile,\n    un nouvel alignement peut être défini par un pan coupé pour favoriser l’insertion urbaine\n    et la sécurité. Ce pan coupé doit être d’une longueur comprise entre 3 mètres et 7 mètres,\n    à déterminer en fonction des circonstances locales. Le nouvel alignement peut également\n    être matérialisé par un arc de cercle de dimension équivalente.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U6\n    Implantation par rapport aux limites séparatives\n3.2. Implantation par rapport aux limites séparatives\n3.2.1.    Champ d’application :\n   Sont admis dans le retrait :\n    o   Les éléments de modénature, les marquises et les auvents dans la limite de 0,80 mètre de\n    profondeur,\n    o   Les débords de toiture dans la limite de 0,60 mètre de profondeur,\n    o   Les oriels dans la limite de 0,40 mètre de profondeur,\n    o   Les perrons, escaliers et emmarchements,\n    o   Les terrasses et passerelles non couvertes, de moins de 0,60 mètre de hauteur par\n    rapport au terrain avant travaux,\n    o   Les balcons dans la limite d’1,20 mètre de profondeur,\n    o   Les ouvrages d’amélioration ou de mise aux normes d’une construction pour la sécurité ou\n    l’accessibilité pour les personnes à mobilité réduite, en cas de travaux sur des\n    constructions existantes,\n    o   Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou\n    environnementale des constructions, notamment ceux nécessaires à l’isolation thermique\n    par l’extérieur et les dispositifs de protection contre le rayonnement solaire, en cas de\n    travaux sur des constructions existantes, dans la limite de 0,40 mètre d’épaisseur,\n    o   Les pare-vues et les garde-corps, sous réserve de ne pas dépasser 1,90 mètre de\n    hauteur.\n3.2.2.    Règles générales :\nSauf disposition particulière dans la règle écrite ou graphique, les constructions doivent s’implanter en    203\nrespectant les règles suivantes par rapport aux limites séparatives :\n   Secteur    Règles applicables\n   Zone U6    L’implantation de locaux destinés au stockage des ordures ménagères nécessaire au\n    tri n’est pas règlementée.\n    ▪    Les constructions peuvent s’implanter sur les limites séparatives ou en retrait.\n   Secteur\n    Règle en cas de retrait :\n    U6-A\n    ▪    Les constructions doivent être implantées avec un retrait supérieur ou égal à la\n    moitié de la hauteur de façade, soit L ≥ Hf/2, sans être inférieur à 1,90 mètre.\n   Secteurs\n    U6-B    ▪    Les constructions peuvent s’implanter sur les limites séparatives ou en respectant\n    un retrait minimal de 3 mètres\n    U6-C\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U6\n    Implantation par rapport aux limites séparatives\n    ▪    Les constructions doivent s’implanter obligatoirement en retrait :\n    o    Façades avec baie : la distance de tout point de la façade par rapport à la\n    limite séparative doit être au moins égale à la hauteur de ce point diminuée\n    de 3 mètres (L ≥ Ht-3m), sans être inférieure à 5 mètres.\n    Sous-\n    secteurs\n    U6-D-1\n    U6-D-2\n    o    Façade sans baie : la distance de tout point de la façade par rapport à la\n    U6-D-4    limite séparative doit être au moins égale à la moitié de la hauteur de ce\n    point, diminuée de 3 mètres (L ≥ Ht/2 – 3m), sans être inférieure à 5 mètres.\n    Sous-\n204    secteurs    ▪    Les constructions peuvent s’implanter sur les limites séparatives ou en respectant\n    un retrait minimal de 8 mètres\n    U6-D-3\n    3.2.3.    Règles alternatives\n    Secteur    Cas des travaux sur constructions existantes\n    ▪   Dans le cas d’une construction existante, sont autorisés pour les parties de\n    construction ne respectant pas les règles d’implantation par rapport aux limites\n    séparatives :\n    o    Les travaux d’amélioration de l’implantation vis-à-vis des règles générales et\n    ceux sans effet sur le gabarit de la construction,\n    o    Les extensions horizontales et verticales avec un retrait égal ou supérieur à\n    celui des constructions existantes, à condition que la nouvelle façade ou partie\n    de façade ne comporte pas de baie,\n    Zone U6\n    o    Les travaux qui améliorent l’implantation vis-à-vis des règles générales et ceux\n    sans effet sur le gabarit de la construction existante.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U6\n    Implantation par rapport aux limites séparatives\n    ▪   En dehors des parties de constructions ne respectant pas les règles d’implantation\n    par rapport aux limites séparatives, les règles générales s’appliquent.\n Secteur    Autre cas\n Zone U6    ▪   Une implantation différente de celle édictée par les règles générales peut être\n    autorisée pour permettre une insertion paysagère de qualité.\n3.2.4.    Règles qualitatives\n Secteur    Règles qualitatives\n    ▪   Dans le cas d’un terrain ayant un linéaire sur emprise publiques ou voies de plus de\n Zone U6    50m, l’implantation des constructions doit permettre de ménager des vues depuis\n    l’espace public vers le fond de terrain ou cœur d’ilot.\n    205\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U6\n    Implantation sur un même terrain\n    3.3. Implantation sur un même terrain\n    3.3.1.    Champ d’application\n    a. La distance minimale entre deux constructions non contiguës implantées sur un même terrain est\n    mesurée perpendiculairement et horizontalement en tout point de chaque façade.\n    b. Ne sont pas pris en compte pour l’application des règles d’implantation :\n    o   Les éléments de modénature et les motifs architectoniques dans la limite de 0,40 mètre de\n    profondeur,\n    o   Les marquises et les auvents dans la limite de 0,80 mètre de profondeur,\n    o   Les débords de toiture dans la limite de 0,60 mètre de profondeur,\n    o   Les oriels dans la limite de 0,40 mètre de profondeur,\n    o   Les perrons et emmarchements,\n    o   Les terrasses de moins de 0,60 mètre de hauteur par rapport au terrain avant travaux,\n    o   Les éléments architecturaux d’accès ou de liaison tel que portiques, porches, passerelles,\n    escaliers, liaisons couvertes et autres éléments de liaisons,\n    o   Les balcons dans la limite de 1,20 mètre de profondeur,\n    o   Les ouvrages d’amélioration ou de mise aux normes d’une construction pour la sécurité ou\n    l’accessibilité pour les personnes à mobilité réduite, en cas de travaux sur des\n    constructions existantes,\n    o   Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou\n    environnementale des constructions, notamment ceux nécessaires à l’isolation thermique\n    par l’extérieur et les dispositifs de protection contre le rayonnement solaire, en cas de\n    travaux sur des constructions existantes, dans la limite de 0,40 mètre d’épaisseur,\n    o   Les pare-soleils extérieurs et les doubles parois vitrées de moins de 0,80 mètre de\n206    profondeur,\n    o   Les pare-vues et les garde-corps, sous réserve de ne pas dépasser 1,90 mètre de\n    hauteur.\n    3.3.2.    Règles générales\n    Sauf disposition particulière dans la règle écrite ou graphique, les constructions, lorsqu’elles sont non\n    contiguës et implantées sur un même terrain, doivent respecter entre elles les distances minimales\n    suivantes :\n    Secteur    Règles applicables\n    Secteurs\n    U6-A\n    U6-B\n    U6-C    ▪   Non règlementé.\n    Sous-secteur\n    U6-D-1\n    U6-D-3\n    U6-D-2\n    ▪   En dérogation à la définition lexicale, la notion de façade comprend les façades\n    U6-D-4    des attiques.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U6\n    Implantation sur un même terrain\n    ▪   Façade avec baie : La distance séparant les façades doit être au moins égale à\n    la hauteur de la façade la plus haute diminuée de 3 mètres (L≥ Hf-3), sans être\n    inférieure à 5 mètres.\n    ▪   Façade sans baie : La distance séparant les façades doit être au moins égale à\n    la moitié de la hauteur de la façade la plus haute (L ≥ Hf/2), sans être inférieure\n    à 3,5 mètres.\n207    207\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U6\n    Emprise au sol\n    3.4. Emprise au sol\n    3.4.1.    Champ d’application :\n    Ne sont pas pris en compte pour l’application des règles d’emprise au sol :\n    ▪    Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou environnementale\n    des constructions, notamment ceux nécessaires à l’isolation thermique par l’extérieur et les\n    dispositifs de protection contre le rayonnement solaire, en cas de travaux sur des constructions\n    existantes, dans la limite de 0,40 mètre d’épaisseur,\n    ▪    Les ouvrages d’amélioration ou de mise aux normes d’une construction pour la sécurité ou\n    l’accessibilité pour les personnes à mobilité réduite, en cas de travaux sur des constructions\n    existantes.\n    3.4.2.    Règles générales :\n    Les projets doivent être conformes au coefficient de pleine-terre exigé, nonobstant toute règle d’emprise au\n    sol énoncée ci-après.\n    Sauf disposition particulière dans la règle écrite ou graphique l’emprise au sol maximale des constructions\n    est fixée selon les modalités suivantes :\n    Secteur    Règles applicables\n    U6-A    ▪   Non règlementé\n    U6-B    ▪   10% de la surface du terrain.\n208\n    U6-C    ▪   15% de la surface du terrain\n    U6-D-1    ▪   55% de la surface du terrain.\n    U6-D-2    ▪   65% de la surface du terrain.\n    U6-D-3    ▪   Non règlementé\n    U6-D-4    ▪   45% de la surface du terrain.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U6\n    Hauteur\n3.5. Hauteur\n3.5.1.    Règles générales :\nSauf disposition particulière dans la règle écrite ou graphique, les constructions doivent s’inscrire, le cas\néchéant dans le gabarit-enveloppe défini par les règles cumulatives énoncées, et a minima respecter les\nrègles de hauteur maximales énoncées.\n    Secteur    Règles applicables\n    ▪   Pour les constructions dont le rez-de-chaussée est à destination de commerces et\n    activités de service, la hauteur de rez-de-chaussée de plancher à plancher doit au\n    minimum atteindre 3,50 mètres sauf pour les locaux communs, techniques,\n    espaces de stockage et de stationnement vélo.\n    U6-A    ▪   A Boulogne-Billancourt, Meudon et Sèvres : une hauteur totale de 12 mètres.\n    U6-B    ▪   A Marnes-la-Coquette : une hauteur totale de 12 mètres pour le secteur du Haras\n    U6-C    de Jardy et de 10 mètres pour le secteur du stade de La Marche.\n    ▪   A Issy-les-Moulineaux, Vanves et Ville-d’Avray : une hauteur totale de 15\n    mètres\n    ▪   A Meudon : une hauteur totale de 18 mètres au sein du périmètre de hauteur\n    spécifique.\n    Sous-secteur    ▪   La hauteur totale des constructions doit être inférieure ou égale à la cote 74 mètres\n    U6-D-3    NGF.\n    209\nSous-secteur U6-D-1\n▪    La couleur du filet inscrit sur le document graphique n°4.2 Plan des prescriptions et périmètres\n    particuliers, définit le gabarit-enveloppe comme suit :\n    Couleur du    Hauteur de\n    Hauteur du couronnement    Hauteur totale\n    filet    façade\n    ROSE    R+2 soit 12 m    12 m\n    un niveau présentant une pente de 4 pour 1 et une\n    JAUNE    R+2 soit 12 m    15,5 m\n    hauteur de 3,5 m\n    un niveau présentant une pente de 4 pour 1 et une\n    BLEU    R+4 soit 18 m    21,5 m\n    hauteur de 3,5 m\n    R+5 soit 22,5    un niveau présentant un retrait par rapport à la façade\n    VIOLET    26 m\n    m    de 1,5 m et une hauteur de 3,5 m\n▪    En l’absence de filet de hauteur, la hauteur totale des constructions est limitée à 5 mètres. Toutefois, la\n    hauteur permise par le filet jaune est autorisée au-delà de l’implantation dudit filet, lorsqu’il s’agit d’une\n    partie de construction en porte-à-faux répondant aux caractéristiques suivantes :\n    o   Conserver une hauteur libre de minimum 4 mètres,\n    o   Être réalisée sur au maximum 50% du linéaire de filet,\n    o   Être située en dehors de toute marge de recul,\n    o   Ne pas être concernée par un autre filet de hauteur.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U6\n    Hauteur\n    Sous-secteur U6-D-2\n    ▪    La couleur du filet inscrit sur le document graphique n°4.2 Plan des prescriptions et périmètres\n    particuliers, définit le gabarit-enveloppe comme suit :\n    Couleur du    Hauteur de\n    Hauteur du couronnement    Hauteur totale\n    filet    façade\n    un niveau présentant une pente de 4 pour 1 et une\n    JAUNE    R+2 soit 9 m    13,5 m\n    hauteur de 4,5 m\n    Sous-secteur U6-D-4\n    ▪    La couleur du filet inscrit sur le document graphique n°4.2 Plan des prescriptions et périmètres\n    particuliers, définit le gabarit-enveloppe comme suit :\n    Couleur du    Hauteur de\n    Hauteur du couronnement    Hauteur totale\n    filet    façade\n    un niveau présentant une pente de 4 pour 1 et une\n    JAUNE    R+2 soit 9 m    13,5 m\n    hauteur de 4,5 m\n    R+5 soit 20,5    un niveau présentant un retrait par rapport à la façade\n    VIOLET    25 m\n    m    de 1,5 m et une hauteur de 4,5 m\n    3.5.2.    Règles particulières\n    Secteur    Dépassement du gabarit-enveloppe sous réserve des dispositions du chapitre 6. Patrimoine\n    bâti et paysager\n210\n    ▪    Pour les constructions existantes, hors patrimoine protégé repéré au document\n    graphique n° 4.3 Plan des protections patrimoniales, écologiques et paysagères,\n    sont excl al à la hauteur de l’édicule.\n    ▪   présenter une emprise totale inférieure ou égale à 10% de l’emprise\n    de la terrasse.\n    En cas de construction « en escalier » cela ne s’applique qu’à la toiture la plus haute.\n    o   Pour les constructions nécessaires à l’agriculture urbaine, sous réserve\n    qu’elles aient une emprise inférieure ou égale à 40% de la surface de la\n    terrasse et une hauteur totale inférieure ou égale à 3 mètres, et pour les\n    installations nécessaires à l’agriculture urbaine, sous réserve qu’elles aient une\n    hauteur totale inférieure ou égale à 2 mètres.\n    Cette règle ne s’applique pas :\n    ▪   Aux bâtiments bénéficiant d’un autre dépassement de gabarit ;\n    ▪   Aux bâtiments présentant une hauteur totale inférieure à 13,50\n    mètres ;\n    ▪   Aux patrimoines protégés définis par le présent règlement.\n    o   Pour les acrotères dans la limite de la hauteur totale.\n    o   Pour les lucarnes, dans la limite de la hauteur totale et de 40% du linéaire de\n    façade.\n    Les dépassements du gabarit enveloppe :\n    ▪   Ne sont pas autorisés pour les machineries d'ascenseur lorsque l'ascenseur ne\n    dessert pas une toiture fonctionnalisée, pour les machineries de réfrigération ou de\n    climatisation, qui doivent être intégrés dans le volume de couronnement.\n    211\n    ▪   Sont autorisés pour les antennes, les souches de cheminée ainsi que pour les édicules\n    d'agrément liés à la jouissance d'une toiture fonctionnalisée ; ces édicules, d'une\n    surface unitaire inférieure ou égale à 20 m² d’emprise et d'une hauteur inférieure ou\n    égale à 3,50 m, doivent présenter une emprise totale inférieure ou égale à 10 % de\n    l’emprise de la terrasse.\n    ▪   Sont autorisés, dans la limite de la hauteur totale, notamment pour :\n    o   Les acrotères\n Sous-    o   En continuité avec les saillies de façade, et dans la limite de 30% du linéaire\nsecteurs    de façade les balcons, les oriels, les loggias et les lu uraux et les garde-corps, sous\n    réserve de ne pas dépasser une hauteur maximum de 1,20 m, dès lors qu’ils renforcent\n    l’esthétique générale et la cohérence architecturale du bâtiment.\n    ▪   Sont autorisés lorsqu’il s’agit de mettre en place un dispositif destiné à assurer la\n    sécurité des personnes sur un bâtiment existant à la date d’approbation du présent\n    PLUi.\n    ▪   Sont autorisés dans le sous-secteur U6-D-1 pour les constructions concernées par un\n    filet jaune : pour les écrans acoustiques, pare-vues et enclos techniques, dès lors qu’ils\n    contribuent à renforcer l’esthétique générale et la cohérence architecturale du\n    bâtiment, qu’ils n’excèdent pas une hauteur de 3 mètres, qu’ils soient implantés à au\n    moins 6 mètres en retrait par rapport aux façades. Ils doivent présenter une surface\n    unitaire inférieure ou égale à 40 m² d’emprise et représenter une emprise totale\n    inférieure ou égale à 10 % de l’emprise de la terrasse.\n212\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone N\n    Zone N\n    Zone naturelle\nLa zone naturelle correspond aux espaces naturels ouverts ou forestiers. Elle comprend deux secteurs :\n   ▪   Secteur Np correspondant aux grands parcs du territoire,\n   ▪   Secteur Ns correspondant à la Seine et ses berges.\n   Huit secteurs de taille et de capacité d’accueil limitées (STECAL) sont délimités :\n   ▪   STECAL n°1 situé à Vanves qui concerne les équipements sportifs du lycée Michelet,\n   ▪   STECAL n°2 situé à Chaville qui concerne le centre équestre et ses abords,\n   ▪   STECAL n°3 situé à Chaville qui concerne le site de l’accrobranche,\n   ▪   STECAL n°4 : situé à Vanves qui concerne le Pavillon de la Tourelle,\n   ▪   STECAL n°5 : situé à Meudon qui concerne les équipements liés à l’Observatoire et à la recherche,\n   ▪   STECAL n°6 : situé à Meudon qui concerne les équipements liés à l’Observatoire et à la recherche,\n   ▪   STECAL n°7 : situé à Meudon qui concerne les équipements liés à l’Observatoire et à la recherche,\n   ▪   STECAL n°8 : situé à Marnes-la-Coquette qui concerne un équipement de type centre aéré\n    existant dans le Parc départemental du Haras de Jardy.\n    213\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone N\n    3.1. Implantation\n    Non réglementée, à l’exception des STECAL pour lesquels les constructions doivent être implantées :\n    ▪   A l’alignement ou en recul des emprises publiques et des voies,\n    ▪   En retrait des limites séparatives.\n    La distance de recul ou de retrait correspond à la moitié de la hauteur totale de la construction soit L ≥ Ht/2.\n    Aucune nouvelle construction ne peut être implantée dans les marges de recul identifiées sur le document\n    graphique n°4.2 Plan des prescriptions et périmètres particuliers.\n    3.2. Emprise au sol\n    L’emprise au sol maximale des constructions est fixée selon les modalités suivantes :\n    ▪   2% de la surface du terrain,\n    ▪   5% de la surface du terrain, en secteur Np,\n    ▪   Le total cumulé de l’emprise au sol des extensions des constructions existantes à destination\n    d’habitation et des nouvelles annexes est limité à 30% de l’emprise au sol de la construction\n    d’habitation principale, sans être supérieur à 60 m²,\n    ▪   STECAL n°1 : 30% du périmètre du STECAL\n    ▪   STECAL n°2 : 1 000 m² d’emprise au sol en complément des constructions et installations existantes\n    ▪   STECAL n°3 : 25 m² d’emprise au sol en complément des constructions et installations existantes\n214    ▪   STECAL n°4 : 180 m² d’emprise au sol en complément des constructions et installations existantes\n    ▪   STECAL n°5 : 10% du périmètre du STECAL en complément des constructions et installations\n    existantes.\n    ▪   STECAL n°6 : 10% du périmètre du STECAL en complément des constructions et installations\n    existantes.\n    ▪   STECAL n°7 : 10% du périmètre du STECAL en complément des constructions et installations\n    existantes.\n    ▪   STECAL n°8 : 100 m² d’emprise au sol en extension des constructions existantes.\n    ▪   Non réglementée dans toute la zone et ses secteurs, y compris dans les STECAL :\n    o   Pour les constructions et installations nécessaires aux transports collectifs, à la gestion des\n    risques et aux réseaux d’assainissement,\n    o   Pour les ouvrages de franchissement et leurs accessoires,\n    o   Pour les travaux de restauration, de rénovation et de réhabilitation,\n    o   Pour les ouvrages d’amélioration ou de mise aux normes d’une construction pour la sécurité ou\n    l’accessibilité pour les personnes à mobilité réduite, en cas de travaux sur des constructions\n    existantes.\n    3.3. Hauteur\n    La hauteur totale maximales des constructions est fixée à :\n    ▪   10 mètres\n    ▪   R+2\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone N\nLa hauteur totale maximale des extensions des constructions existantes est limitée à la hauteur de la\nconstruction d’habitation principale existante.\nLa hauteur totale maximale des constructions annexes est limitée à 3,20 mètres.\nLa hauteur totale maximale au sein des STECAL est limitée à :\n   ▪   STECAL n°1 : 14 mètres,\n   ▪   STECAL n°2 : 9 mètres,\n   ▪   STECAL n°3 : 4 mètres,\n   ▪   STECAL n°4 : 10 mètres,\n   ▪   STECAL n°5 : 10 mètres, portée à 20 mètres pour les ouvrages liés à la recherche.\n   ▪   STECAL n°6 : 10 mètres, portée à 20 mètres pour les ouvrages liés à la recherche.\n   ▪   STECAL n°7 : 10 mètres, portée à 20 mètres pour les ouvrages liés à la recherche.\n   ▪   STECAL n°8 : 6 mètres.\nLa hauteur n’est pas réglementée :\n   ▪   Pour les constructions et installations nécessaires aux transports collectifs, à la gestion des risques\n    et aux réseaux d’assainissement,\n   ▪   Pour les ouvrages de franchissement et leurs accessoires\n   ▪   Pour les travaux de restauration, de rénovation et de réhabilitation.\n    215\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    4. Nature et biodiversité\n    4. Nature et\n    biodiversité\n    216\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\nModification simplifiée n°1 du 25 juin 2025","    4. Nature et biodiversité\n4.1. Taux de pleine-terre\n4.1.1.    Champ d’application\nLes dispositions du présent chapitre ne s’appliquent pas pour :\n    •    Les travaux d’isolation par l’extérieur des façades réalisés sur une construction existante à la date\n    d’approbation du PLUi, dans la limite d’une épaisseur ou d’une largeur maximale égale à 0,40 mètre\n    depuis la façade existante et/ou la toiture existante.\n    •    Les travaux, aménagements et constructions nécessaires à l'accessibilité des personnes en\n    situation de handicap, réalisés sur une construction existante.\n    •    Les projets de rénovation, réhabilitation, extension verticale et changements de destination, qui\n    n’entrainent aucune modification de l’emprise au sol.\n    •    Les constructions à destination d’équipements d’intérêt collectif et services publics pour\n    lesquelles un coefficient de biotope surfacique est exigé (chapitre suivant). Les projets de\n    construction intégrant un programme à destination d’équipement d’intérêt collectif et services publics\n    au sein d’une même construction peuvent bénéficier des règles spécifiques définies pour les\n    constructions à destination d’équipement d’intérêt collectif et services publics, dès lors que :\n    o   La destination équipement d’intérêt collectif et services publics concerne 100% de la\n    surface de plancher du rez-de-chaussée, exception faite des parties communes et des\n    accès nécessaires au fonctionnement de la construction,\n    o   Ou que la destination équipement d’intérêt collectif et services publics concerne au moins\n    50% de la surface de plancher de la construction.\n    •    Les constructions situées dans le sous-secteur U1-F-2 et au sein des périmètres de hauteur\n    spécifique délimités sur le document graphique n°4.2 Plan des prescriptions et périmètres\n    particuliers à Issy-les-Moulineaux et du secteur U4-D-3 à Boulogne-Billancourt, pour lesquelles un\n    coefficient de biotope surfacique est exigé (chapitre suivant).    217\n    •    Les terrains concernés par une pollution des sols dont le traitement implique de maintenir une\n    imperméabilisation du sol. Dans ce cas un coefficient de biotope surfacique est exigé (chapitre\n    suivant).\n    •    Les terrains répondant aux conditions cumulatives suivantes :\n    o   Le taux de pleine-terre du terrain avant travaux ou avant démolition est inférieur à 10%, ce\n    taux devant à minima être maintenu après travaux.\n    o   Le terrain est contraint par une configuration particulière due à un cumul de contraintes\n    (exiguïté, terrain d’angle, terrain fortement impacté par un aménagement de voirie projeté,\n    etc.) qui justifie une impossibilité technique de réaliser le taux de pleine-terre réglementaire\n    exigé.\n    Dans ces cas un coefficient de biotope surfacique est exigé (chapitre suivant).\n    •    Le secteur U5-D.\n    •    Le secteur U5-B. Toutefois, le taux de pleine terre existant est à minima maintenu.\n    •    Les secteurs de plan masse délimités sur le document graphique n° 4.1 Plan général. Toutefois :\n    o   Dans le secteur de plan masse U1-C-1 « Eboué », au moins 50 % des espaces libres doivent\n    être de pleine terre.\n    o   Dans le secteur de plan masse U2-C « Terrain Cat/Adoma », au moins 50 % des espaces\n    libres identifiés sur la planche graphique doivent être de pleine terre.\n    o   Dans le secteur de plan masse U3- A « Abbé Grégoire - Auguste Gervais », au moins 50 %\n    des espaces libres doivent être de pleine terre.\n    o   Dans les secteurs de plan masse U3-C-1, au moins 75 % des espaces libres identifiés sur\n    les planches graphiques doivent être de pleine terre.\n    o   Dans le secteur de plan masse U3-C-5, au moins 15% du terrain doivent être de pleine terre.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    4. Nature et biodiversité\n    o   Dans les secteurs U3-C-12, au moins 50% des espaces verts doivent être de pleine terre, à\n    l’exception des parcelles cadastrales N°57 et 58 de la villa Quincy où il n’est pas fixé de\n    règle.\n    o   Dans les secteurs de plan masse de Meudon, sauf indication graphique contraire ou\n    impossibilité technique, au moins 50 % des espaces verts définis graphiquement doivent\n    être de pleine-terre. Cette disposition ne s’applique pas dans les secteurs U1-MEU-7, U1-\n    MEU-8 et U1-MEU-9.\n    4.1.2.    Règles générales\n    •    Le taux minimal de pleine-terre à respecter est indiqué sur le document graphique n°4.4 Plan de\n    pleine-terre et coefficient de biotope surfacique. Il est applicable au terrain.\n    •    Les unités surfaciques de pleine-terre sont comptabilisées lorsqu’elles atteignent au moins 5 m² d’un\n    seul tenant.\n218\n    Extrait du document graphique réglementaire\n    4.1.3.    Règles particulières\n    •    Le taux de pleine-terre est exigé, nonobstant toute règle d’emprise au sol. Toutefois en zone U3,\n    pour les constructions bénéficiant du forfait de 90 m² d’emprise au sol, il n’est pas exigé plus de 50%\n    de pleine-terre.\n    •    L’implantation d’annexes et les extensions à édifier des constructions existantes s’accompagnant\n    d’une désimperméabilisation conduisant à la réalisation d’une surface de pleine terre cumulée au\n    moins équivalente sont autorisées.\n    •    Lorsque la somme du taux de pleine-terre à respecter et du taux d’emprise au sol à respecter\n    est supérieure ou égale à 95%, 30 m² de pleine-terre peuvent être déduits de la surface de pleine-\n    terre à réaliser, et affectés aux autres espaces libres. Cette règle ne se cumule pas avec celle de\n    l’implantation d’annexes et extensions avec désimperméabilisation.\n    4.1.4.    Règles alternatives\n    •    Terrains d’une superficie ≥150 m² pour lesquels le taux de pleine terre à respecter est inférieur à\n    30% :\n    o   Si taux de pleine terre du terrain avant travaux est supérieur ou égal au taux règlementaire\n    exigé mais inférieur à 30% : le taux de pleine-terre du terrain avant travaux peut être diminué\n    de maximum 5 points, s’il est compensé par un CBS d’au minimum 0,05 en complément du\n    CBS règlementaire exigé\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    4. Nature et biodiversité\n    o   Si taux de pleine terre du terrain avant travaux est supérieur ou égal à 30% : le taux de\n    pleine-terre du terrain après travaux ne peut être inférieur à 30%.\n•   Dans tous les cas, pour les terrains d’une superficie <150 m² :\n    o   Il n’est pas fixé d’exigence en zone U1,\n    o   Dans les autres zones, le taux réglementaire, diminué de 5 points, doit être respecté.\n    219\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    4. Nature et biodiversité\n    4.2. Coefficient de biotope surfacique\n    4.2.1.    Champ d’application\n    Les dispositions du présent chapitre ne s’appliquent pas pour :\n    •    Les travaux d’isolation par l’extérieur des façades réalisés sur une construction existante à la date\n    d’approbation du PLUi, dans la limite d’une épaisseur maximale égale à 0,40 mètre depuis la façade\n    existante et/ou la toiture existante.\n    •    Les travaux, aménagements et constructions nécessaires à l'accessibilité des personnes en\n    situation de handicap, réalisés sur une construction existante.\n    •    Les projets de rénovation, réhabilitation, extension verticale et changements de destination, qui\n    n’entrainent aucune modification de l’emprise au sol.\n    •    Les constructions à destination de locaux techniques et industriels des administrations publiques et\n    assimilés et les installations qui leur sont nécessaires.\n    Les projets de construction intégrant un programme à destination d’équipement d’intérêt collectif et services\n    publics au sein d’une même construction peuvent bénéficier des règles spécifiques définies pour les\n    constructions à destination d’équipement d’intérêt collectif et services publics, dès lors que :\n    •    La destination équipement d’intérêt collectif et services publics concerne 100% de la surface de\n    plancher du rez-de-chaussée, exception faite des parties communes et des accès nécessaires au\n    fonctionnement de la construction,\n    •    Ou que la destination équipement d’intérêt collectif et services publics concerne au moins 50% de\n    la surface de plancher de la construction.\n    4.2.2.    Règle générale\n220\n    Le coefficient de biotope surfacique minimal à respecter est indiqué graphiquement sur le document\n    graphique n°4.4 Plan de pleine-terre et coefficient de biotope surfacique. Il est applicable au terrain, en\n    plus du taux de pleine-terre minimal exigé.\n    En substitution aux règles graphiques, un coefficient de biotope surfacique de 0,1 est exigé pour :\n    ▪    Les équipements d’intérêt collectif et services publics, hormis pour les constructions à destination\n    de locaux techniques et industriels des administrations publiques et assimilés et les installations qui\n    leur sont nécessaires pour lesquelles il n’est pas exigé de coefficient de biotope surfacique.\n    ▪    Les constructions situées dans le sous-secteur U1-F-2 et au sein des périmètres de hauteur\n    spécifique délimités sur le document graphique n°4.2 Plan des prescriptions et périmètres\n    particuliers à Issy-les-Moulineaux et du secteur U4-D-3 à Boulogne-Billancourt.\n    En substitution aux règles graphiques, un coefficient de biotope surfacique de 0,2 est exigé pour :\n    •    Les terrains concernés par une pollution des sols dont le traitement implique de maintenir une\n    imperméabilisation du sol.\n    •    Les terrains répondant aux conditions cumulatives suivantes :\n    o   Le taux de pleine-terre du terrain avant travaux ou avant démolition est inférieur à 10%.\n    o   Le terrain est contraint par une configuration particulière due à un cumul de contraintes\n    (exiguïté, terrain d’angle, terrain fortement impacté par un aménagement de voirie projeté,\n    etc.) qui justifie une impossibilité technique de réaliser le taux de pleine-terre.\n    En substitution aux règles graphiques, il n’est pas exigé de coefficient de biotope surfacique minimal :\n    •    Dans les secteurs U5-B et U5-D,\n    •    Dans les secteurs de plan masse délimités au document graphique n°4.1 Plan général, pour lesquels\n    des règles spécifiques sont définies, le cas échéant, à la partie 4 « Traitement environnemental et\n    paysager des espaces non bâtis et des abords des constructions » du présent chapitre.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    4. Nature et biodiversité\nLes surfaces prises en compte dans le calcul du coefficient de biotope surfacique sont affectées des\ncoefficients de pondération indiqués dans le tableau ci-dessous.\n    Type de surface non-imperméabilisée ou éco-aménageable    Coefficient de pondération\nPleine-terre    1\n    Coef = Profondeur substrat\nSurface végétalisée sur dalle avec substrat ≥ 0,30 m    (en mètre) / 2\n    sans excéder 0,9\nSurface végétalisée sur toiture avec substrat ≥ 1,00 m de\n    0,9\nprofondeur\n    Coef = Profondeur substrat\nSurface végétalisée sur toiture avec substrat ≥ 0,30 m < 1,00 m de\n    (en mètre)\nprofondeur\n    sans excéder 0,8\nSurface semi-perméable sur pleine-terre (dalles-gazon, pavé joint\n    0,35\ngazon, gravier, béton drainant, etc…) min 35% de porosité\nMurs végétalisés avec accroche au sol sur profondeur ≥ 0,5 m et\nmurs poreux ≥ 0,5 m d’épaisseur - parois verticales comptées    0,30\njusqu'à 10 m de hauteur\nAutres / Surface imperméable ou assimilée (cf. définition)    0\n    221\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    4. Nature et biodiversité\n    4.3. Espaces écologiques et/ou paysagers protégés\n    Le Code de l’urbanisme soumet tous travaux, aménagements, constructions, coupes et abattages d’arbres\n    au sein de ces espaces à l’obtention d’une autorisation d’urbanisme.\n    Les travaux réalisés à proximité des espaces protégés ne doivent pas conduire à une dégradation de la\n    qualité paysagère et environnementale de ces espaces.\n    4.3.1.    Espaces végétalisés\n    Les espaces végétalisés à protéger sont identifiés sur le document graphique n°4.3 Plan des protections\n    patrimoniales, écologiques et paysagères et dans le Cahier des espaces écologiques et paysagers\n    protégés.\n    Au sein de ces espaces, l’abattage d’arbre(s) est interdit, sauf s’il est nécessaire :\n    o Pour des raisons phytosanitaires ou de sécurité,\n    o À la réalisation de travaux poursuivant un objectif d’intérêt général,\n    o À l’établissement d’un accès, si aucune autre solution n’est envisageable.\n    Au sein de ces espaces, l’édification de constructions et d’installations ainsi que la réalisation\n    d’aménagements ou de travaux concourant à l’imperméabilisation des sols y sont interdits, à l’exception :\n    ▪    Des constructions annexes dont l’emprise au sol est inférieure ou égale à 10 m² et la hauteur\n    inférieure ou égale à 3,20 mètres, limitées à une seule construction annexe par terrain existant à la\n    date d’approbation du PLUi,\n    ▪    De l’installation de serres sur sol perméable,\n    ▪    De la réalisation des accès aux constructions lors qu’ils sont réalisés en revêtement perméable ou\n    semi-perméable,\n222\n    ▪    De la réalisation d’aires de stationnement vélo non closes, avec revêtement perméable ou semi-\n    perméable,\n    ▪    Des travaux de plantations et d’aménagement concourant au maintien ou au renforcement des\n    qualités paysagères ou écologiques du site y compris dans le cadre d’un projet de recomposition\n    paysagère globale.\n    Les mouvements de terre seront limités aux besoins strictement nécessaires aux aménagements,\n    plantations, installations et constructions autorisées.\n    Les travaux autorisés ne devront pas concourir, par leur cumul, à une dénaturation des sites protégés.\n    Tout arbre abattu doit être remplacé par au moins un arbre de même qualité paysagère suivant les normes\n    définies pour les nouvelles plantations.\n    Ces dispositions ne s’opposent pas à la réhabilitation ou à la restauration des constructions existantes et\n    des espaces en sous-sol éventuellement présents ainsi qu’à l’aménagement de leurs accès et aux travaux\n    relatifs aux édicules techniques nécessaires à leur fonctionnement.\n    4.3.2.    Mares et plans d’eau (étangs, bassins, etc.)\n    Les mares et plans d’eau à protéger sont identifiés sur le document graphique n°4.3 Plan des protections\n    patrimoniales, écologiques et paysagères.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    4. Nature et biodiversité\nTous travaux de construction, de comblement, d’assèchement, d’imperméabilisation, d’exhaussement et\nd’affouillement de sol y sont interdits, à l’exception des travaux et constructions nécessaires :\n    ▪    Au fonctionnement hydraulique,\n    ▪    Au franchissement (passerelles, etc),\n    ▪    À la mise en sécurité,\n    ▪    À l’animation ou à la valorisation des sites.\nLes travaux devront, le cas échéant, respecter la réglementation afférente aux zones humides et être\ncompatibles avec les orientations d’aménagement et de programmation « continuités écologiques ».\nPour les mares, ces dispositions sont élargies à un périmètre de 10 mètres depuis le haut des berges, sauf\nmention graphique différente ou de justification particulière relative à la configuration des lieux.\nCes dispositions ne s’opposent pas à la réhabilitation ou à la restauration des constructions existantes et\ndes espaces en sous-sol éventuellement présents ainsi qu’à l’aménagement de leurs accès et aux travaux\nrelatifs aux édicules techniques nécessaires à leur fonctionnement.\n4.3.3.    Jardins et espaces cultivés\n
