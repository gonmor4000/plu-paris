nt existant\n    A l’exception de Sèvres :\n Secteurs\n    ▪   Lorsque la hauteur totale et/ou de façade d’une construction voisine existante et\n   U3-A    pérenne implantée en limite séparative est supérieure au gabarit-enveloppe indiqué\n    par les règles générales, un dépassement du gabarit-enveloppe de la construction\n   U3-B\n    projetée est autorisé à condition de s’inscrire dans l’héberge de la construction\n    voisine implantée en limite et de ne pas dépasser de plus de 3 mètres la hauteur    155\n    totale autorisée (soit un niveau supplémentaire possible).\n Secteur    Dépassements du gabarit-enveloppe sous réserve des dispositions du chapitre 6.\n    Patrimoine bâti et paysager\n    Pour toutes les constructions, les dépassements du gabarit-enveloppe sont autorisés, sous\n    réserve du respect de la hauteur mentionnée dans les zones à hauteur contrainte délimitées\n    sur le document graphique n°4.2 Plan des prescriptions et périmètres particuliers :\n Secteurs    ▪   Pour les toitures végétalisées occupant plus de 75% de la surface de toiture, dès lors\n    que l’épaisseur de substrat est supérieure ou égale à 0,30 mètre et dans la limite de\n   U3-A    hauteur du substrat ;\n   U3-B\n    ▪   Pour les acrotères dans la limite de la hauteur totale.\n    ▪   Pour les lucarnes, dans la limite de la hauteur totale et de 40% du linéaire de façade.\n    ▪   Pour les antennes et les souches de cheminée.\n    Les dépassements du gabarit-enveloppe sont autorisés :\n    ▪   Pour les antennes, les souches de cheminée ainsi que pour les édicules d'agrément\n  Sous-    liés à la jouissance d'une terrasse paysagée ; ces édicules, d'une surface unitaire\n secteurs    inférieure ou égale à 20 m² d’emprise et d'une hauteur inférieure ou égale à 2,50\n  U3-C-1    mètres, doivent présenter une emprise totale inférieure ou égale à 10 % de l’emprise\n    de la terrasse,\n  U3-C-2\n    ▪   Pour les acrotères, dans la limite de la hauteur totale,\n    ▪   Pour les lucarnes, dans la limite de la hauteur totale et de 40% du linéaire de façade.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U3\n    Hauteur\n    ▪   Pour les opérations comprenant 100% de logements sociaux, dans la limite de la\n    hauteur de la construction contiguë existante calculée à son faîtage.\n156\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U4\n    Zone U4\n    Grands quartiers résidentiels et mixtes\nLa zone U4 est une zone à dominante résidentielle qui comprend également des secteurs de mixité\nfonctionnelle. Elle intègre des quartiers de résidences d’habitat collectif et des ensembles tertiaires. Elle est\ncomposée de quatre secteurs :\n    ▪   U4-A correspondant aux secteurs de hauteur limitée.\n    ▪   U4-B correspondant aux secteurs de hauteur intermédiaire.\n    ▪   U4-C correspondant aux secteurs de hauteur plus importante. Il comprend le sous-secteur U4-C-1\n    dédié au quartier résidentiel de Meudon-la-Forêt à Meudon qui intègre un sous-sous-secteur U4-C-\n    1a lié au secteur de la pointe de Trivaux.\n    ▪   U4-D correspond au secteur spécifique de Boulogne-Billancourt. Il comprend cinq sous-secteurs :\n    o    U4-D-1 correspondant au quartier situé entre le parc Edmond de Rothschild et le parc Albert\n    Khan,\n    o    U4-D-2 correspondant aux rives situées au sud de l'avenue du Maréchal de Lattre de\n    Tassigny,\n    o    U4-D-3 correspondant à l’île Seguin,\n    o    U4-D-4 correspondant aux ilots de front de berge du quartier du Trapèze,\n    o    U4-D-5 correspondant aux Tours du Pont de Sèvres.\n    157\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U4\n    Implantation par rapport aux emprises publiques et aux voies\n    3.1. Implantation par rapport aux emprises publiques et aux\n    voies\n    3.1.1.    Champ d’application (hors U4-D-3) :\n    a. Sous réserve du règlement de voirie et de l’accord du gestionnaire de voirie pour les saillies sur\n    espace public, ne sont pas pris en compte pour l’application des règles d’implantation à l’alignement :\n    Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou environnementale des\n    constructions, notamment ceux nécessaires à l’isolation thermique par l’extérieur, en cas de travaux sur des\n    constructions existantes, dans la limite de 0,40 mètre d’épaisseur,\n    ▪    Les traitements en creux en rez-de-chaussée au droit des accès sur une profondeur de 1 mètre,\n    ▪    Les renfoncements de loggias ou autres, à partir d'une hauteur de 3,5 mètres et du R+1,\n    ▪    Les saillies des façades des commerces sur trottoir sont autorisées en rez-de-chaussée et dans une\n    limite de 0,20 mètre d’épaisseur.\n    ▪    Sur les emprises publiques et voies de largeur inférieure à 12 mètres :\n    o   Les marquises et les stores-bannes, dans une limite de 0,80 mètre,\n    o   Les éléments de modénature, dans une limite de 0,4 mètre, à partir d'une hauteur de 3,50\n    mètres et R+1 ;\n    o   Les balcons et oriels, dans une limite de 0,60 mètre, à partir d'une hauteur de 5,50 mètres\n    et du R+2. La proportion des oriels devant être inférieure ou égale à 20% de la surface de\n    la façade,\n    o   En cas de travaux sur des constructions existantes, les dispositifs de protection solaire\n    dans la limite de 0,40 mètre et à partir d’une hauteur de 5,50 mètres.\n158    ▪    Sur les emprises publiques et voies de largeur supérieure ou égale à 12 mètres et inférieure\n    à 20 mètres :\n    o   Les marquises et les stores-bannes, dans une limite de 1,20 mètre,\n    o   Les éléments de modénature, dans une limite de 0,6 mètre, à partir d'une hauteur de 3,50\n    mètres et du R+1,\n    o   Les balcons et oriels, dans une limite de 0,80 mètre, à partir d'une hauteur de 5,50 mètres\n    et du R+2. La proportion des oriels devant être inférieure ou égale à 20% de la surface de\n    la façade,\n    o   En cas de travaux sur des constructions existantes, les dispositifs de protection solaire\n    dans la limite de 0,80 mètre et à partir d’une hauteur de 5,50 mètres.\n    ▪    Sur les emprises publiques et voies de largeur supérieure ou égale à 20 mètres :\n    o   Les marquises et les stores-bannes, dans une limite de 1,80 mètre,\n    o   Les éléments de modénature, dans une limite de 0,80 mètre, à partir d'une hauteur de\n    3,50 mètres et du R+1,\n    o   Les balcons et oriels, dans une limite de 1,20 mètre, à partir d'une hauteur de 5,50 mètres\n    et du R+2. La proportion des oriels devant être inférieure ou égale à 20% de la surface de\n    la façade,\n    o   En cas de travaux sur des constructions existantes, les dispositifs de protection solaire\n    dans la limite de 1,20 mètre et à partir d’une hauteur de 5,50 mètres.\n    b. En cas de recul, ne sont pas pris en compte pour le calcul du recul :\n    o   Les éléments de modénature, les marquises et les auvents de moins de 0,80 mètre de\n    profondeur,\n    o   Les débords de toiture de moins de 0,60 mètre de profondeur,\n    o   Les oriels de moins de 0,40 mètre de profondeur et à partir d’une hauteur de 5,50 mètres,\n    o   Les balcons dans la limite de 1,20 mètre de profondeur,    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U4\n    Implantation par rapport aux emprises publiques et aux voies\n    o   Les perrons, terrasses et emmarchements,\n    o   Les ouvrages d’amélioration ou de mise aux normes d’une construction pour la sécurité ou\n    l’accessibilité pour les personnes à mobilité réduite, en cas de travaux sur des\n    constructions existantes,\n    o   Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou\n    environnementale des constructions, notamment ceux nécessaires à l’isolation thermique\n    par l’extérieur et les dispositifs de protection contre le rayonnement solaire, en cas de\n    travaux sur des constructions existantes, dans la limite de 0,40 mètre d’épaisseur,\n    o   Les rampes de garage desservant le sous-sol ou le rez-de-chaussée de la construction,\n    o   Les escaliers, les rampes d’accès et les passerelles non couvertes.\n    c.   En cas de présence d’un alignement d’arbres repéré au plan 4.3 Protections, la préservation des\n    arbres prévaut sur les dispositifs non pris en compte pour l’application des règles d’implantation.\n    d. Sauf mention contraire au sein du présent règlement, les projets de construction intégrant un\n    programme à destination d’équipement d’intérêt collectif et services publics au sein d’une même\n    construction peuvent bénéficier des règles spécifiques définies pour les constructions à destination\n    d’équipement d’intérêt collectif et services publics, dès lors que :\n    o   La destination équipement d’intérêt collectif et services publics concerne 100% de la\n    surface de plancher du rez-de-chaussée, exception faite des parties communes et des\n    accès nécessaires au fonctionnement de la construction,\n    o   Ou que la destination équipement d’intérêt collectif et services publics concerne au moins\n    50% de la surface de plancher de la construction.\n3.1.2.    Règles générales :\nSauf disposition particulière dans la règle graphique, notamment les marges de recul ou obligation    159\nd’alignement indiqués sur le plan 4.2 des prescriptions et périmètres particuliers, les constructions doivent\ns’implanter en respectant les règles suivantes par rapport aux emprises publiques et aux voies :\n  Secteur    Règles applicables\n    ▪    L’implantation des constructions à destination d’équipements d’intérêt collectif et\n    services publics n’est pas réglementée.\n    ▪    Lorsque qu’un alignement est imposé, celui-ci est réputé acquis dès lors qu’au moins\n    50% du linéaire de la construction en vis-à-vis des emprises publiques et des voies,\n    est implanté à l’alignement. Le reste du linéaire de la construction est implanté\n    librement.\n    ▪    Implantation vis-à-vis des sentes piétonnes : les constructions doivent être implantées\n    avec un recul supérieur ou égal 3 mètres.\n  Zone U4\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U4\n    Implantation par rapport aux emprises publiques et aux voies\n    ▪   L’implantation de locaux destinés au stockage des ordures ménagères nécessaire au\n    tri n’est pas règlementée.\n    ▪   En cas d’implantation à l’alignement de deux voies ouvertes à la circulation automobile,\n    un nouvel alignement peut être défini par un pan coupé pour favoriser l’insertion\n    urbaine et la sécurité. Ce pan coupé doit être d’une longueur comprise entre 3 mètres\n    et 7 mètres, à déterminer en fonction des circonstances locales. Le nouvel alignement\n    peut également être matérialisé par un arc de cercle de dimension équivalente.\n    ▪   A l’exception des constructions à destination d’équipement d’intérêt collectifs et\n    services publics et du secteur U4-D, lorsque la façade à édifier présente une longueur\n    supérieure ou égale à 25 mètres, portée à 40 mètres en secteur U4-C, le long des\n    emprises publiques et voies, au moins une césure sur toute la hauteur et toute la\n    profondeur, d'au moins 4 mètres de large, doit être réalisée. Cette césure peut recevoir\n    des ouvertures et des balcons. En cas de création de balcons, les règles d’implantation\n    des constructions sur un même terrain s’appliquent. A Vanves, la césure peut être est\n    réduite à une hauteur minimale de 5,50 mètres sur toute profondeur.\n    ▪   Les constructions doivent être implantées en recul d’au moins 3 mètres de la limite des\n    sentes ou des escaliers situés sur des emprises publiques.\n    ▪   Les constructions doivent être implantées en recul de l’alignement.\n    ▪   Ce recul doit être supérieur ou égal à la hauteur totale de la construction, soit L≥Ht,\n    sans être inférieur à 6 mètres.\n160\n    Secteur\n    U4-A\n    ▪   A Sèvres, au minimum 50% des surfaces de marges de recul, en dehors des accès\n    piétons et véhicules, doivent être traités en espace végétalisé.\n    ▪   Les constructions peuvent s’implanter en tout ou partie à l’alignement ou en recul.\n    ▪   En secteur U4-B, si la voie ou l’emprise publique au droit du terrain correspond à une\n    Secteurs    limite avec la zone U3, les constructions doivent être implantées obligatoirement en\n    recul.\n    U4-B\n    ▪   A Issy-les-Moulineaux, l’implantation des constructions par rapport aux emprises\n    U4-C    publiques et aux voies est définie dans le Cahier des références aux voiries ou par une\n    marge de recul matérialisée sur le document graphique n°4.2 Plan des\n    prescriptions et périmètres particuliers. En l’absence d’indication, les règles\n    générales s’appliquent.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U4\n    Implantation par rapport aux emprises publiques et aux voies\n    ▪   En cas de recul, celui-ci doit être supérieur ou égal à 4 mètres. Ce recul minimal est\n    réduit à 2 mètres à Vanves.\n    ▪   Pour les constructions qui s’implantent à l’alignement, :\n    o   des reculs de parties de façade, en longueur ou en hauteur, sont autorisés, à\n    condition qu’ils soient inférieurs ou égaux à 3 mètres de profondeur depuis\n    l’alignement.\n    o   la réalisation de porches d’au moins 5 mètres de hauteur est autorisée,\n    lorsqu’ils permettent une continuité visuelle vers le cœur d’ilot ou à travers le\n    terrain.\n    ▪   A Sèvres, le recul est imposé et au minimum 50% des surfaces de marges de recul,\n    en dehors des accès piétons et véhicules, doivent être traités en espace végétalisé.\n    ▪   Les constructions doivent être implantées en recul.\n    161\n    ▪   Ce recul doit être supérieur ou égal à la hauteur totale de la construction, soit L≥Ht,\n    sans être inférieur à 6 mètres.\n Sous-\nsecteur\nU4-C-1\n    Dans le sous-sous-secteur U4-C-1a :\n    ▪   L’implantation des constructions par rapport aux emprises publiques et aux voies est\n    définie au Cahier de plans-masses.\n    ▪   En dehors du périmètre de plan-masse, le recul doit être supérieur ou égal à la moitié\n    de la hauteur totale de la construction moins trois mètres, soit L≥(Ht/2)-3 m.\n Sous-\nsecteurs    ▪   Les constructions peuvent s’implanter à l’alignement ou en recul.\nU4-D-1    Réalisation de porches\nU4-D-2\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U4\n    Implantation par rapport aux emprises publiques et aux voies\n    U4-D-4    ▪    Les porches sont autorisés. Ils doivent préserver une continuité visuelle depuis\n    l'alignement à travers le terrain et être clos par une grille implantée à l'alignement, soit\n    toute hauteur soit d'une hauteur minimale de 3 mètres.\n    ▪    Les constructions peuvent être implantées à l’alignement ou en recul. Le recul doit être\n    supérieur ou égal à 1 mètre.\n    ▪    Les constructions en surplomb de l’emprise publique et des voies sont autorisées :\n    Sous-\n    secteur    o   À partir d’une hauteur de 5,50 mètres pour les passerelles, galeries, corps de\n    construction,\n    U4-D-3\n    o   À partir d’une hauteur de 8 mètres pour les verrières.\n    ▪    Les traitements en creux et les saillies (balcons, terrasses, auvents, modénatures…)\n    à partir d’une hauteur de 5,50 mètres sont autorisés.\n    Sous-\n    secteur    ▪    Les constructions peuvent s’implanter à l’alignement ou en recul.\n    U4-D-5\n    3.1.3.    Règles particulières :\n    Secteur    Articulation avec l’environnement existant\n    Sous-    ▪    Pour la valorisation du paysage urbain et lorsque soit le terrain comporte un espace\n    secteurs    écologique et/ou paysager protégé, soit la façade à édifier présente une longueur\n162    supérieure à 50 m, au moins une coupure sur toute la hauteur et toute la profondeur,\n    U4-D-1\n    d'au moins 4 m de large, dans les nouvelles constructions doit être créée, cette\n    U4-D-2    coupure pouvant recevoir des passerelles et des balcons.\n    3.1.4.    Règles alternatives :\n    Secteur    Cas des travaux sur constructions existantes ne respectant pas les règles\n    d’implantation\n    ▪    Dans le cas de constructions existantes ne respectant pas les règles générales\n    d’implantation par rapport aux emprises publiques et aux voies, sont autorisés pour\n    les parties de construction ne respectant pas les règles générales d’implantation :\n    o   Les travaux qui améliorent l’implantation vis-à-vis des règles générales et ceux\n    sans effet sur le gabarit de la construction existante,\n    o   A l’exception du secteur U4-D, les extensions horizontales et verticales avec\n    un recul égal ou supérieur à celui des constructions existantes, sauf pour les\n    parties de constructions situées dans un emplacement réservé,\n    Zone U4\n    o   Les annexes existantes ne sont pas concernées par les dispositions relatives\n    aux possibilités d’extension verticale ou horizontale.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U4\n    Implantation par rapport aux emprises publiques et aux voies\n    ▪   En dehors des parties de constructions ne respectant pas les règles générales\n    d’implantation, les règles générales s’appliquent.\nSecteur    Articulation avec l’environnement existant\n    ▪   Dans le cas de constructions existantes sur le terrain voisin, contiguës ou non de la\n    construction projetée, ne respectent pas les règles générales, des implantations en\nZone U4\n    tout ou partie à l’identique de celle des constructions voisines sont autorisées, si la\n    cohérence urbaine est démontrée.\nSecteur    Autres cas de figure\n    ▪   Dans le cadre de la mise en œuvre de l’OAP thématique continuités écologiques,\n    des implantations alternatives sont autorisées, et ce particulièrement lorsqu’il s’agit\nZone U4\n    d’assurer la préservation des plantations existantes ou les continuités écologiques\n    avec les espaces voisins.\n    ▪   Le long du quai Georges Gorse, il peut être exigé, lorsqu’il s’agit de valoriser le\n    paysage urbain, qu’une partie de la surface des rez-de-chaussée soit libre.\n    ▪   Le long des voies privées et des emprises publiques, afin de valoriser le paysage\n    urbain, il peut être exigé un recul des constructions ou parties de construction d’au\n    moins 3 mètres dans la limite de 50% du linéaire de la façade. Le long du parc, ce\n Sous-    recul est porté à 6 mètres.\nsecteur\n    ▪   Dans le périmètre compris entre la rue du Vieux Pont de Sèvres, le cours de l’Ile\nU4-D-4    163\n    Seguin et le passage du Vieux Pont de Sèvres prolongé, il peut être exigé, pour les\n    constructions à destination de commerce et activités de service ou à sous-destination\n    de bureaux et d’industrie, qu’au minimum 15 % des façades des constructions de\n    chaque îlot soit édifiées en recul de l’alignement à une distance moyenne minimale\n    de 6 mètres par rapport à celui-ci excepté les atriums qui sont autorisées à\n    s’implanter à l’alignement.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U4\n    Implantation par rapport aux limites séparatives\n    3.2. Implantation par rapport aux limites séparatives\n    3.2.1.    Champ d’application :\n    a. Sont admis dans le retrait :\n    o    Les éléments de modénature, les marquises et les auvents dans la limite de 0,80 mètre de\n    profondeur,\n    o    Les débords de toiture dans la limite de 0,60 mètre de profondeur,\n    o    Les oriels dans la limite de 0,40 mètre de profondeur,\n    o    Les perrons, escaliers et emmarchements,\n    o    Les terrasses et passerelles non couvertes, de moins de 0,60 mètre de hauteur par\n    rapport au terrain avant travaux,\n    o    Les balcons dans la limite d’1,20 mètre de profondeur,\n    o    Les ouvrages d’amélioration ou de mise aux normes d’une construction pour la sécurité ou\n    l’accessibilité pour les personnes à mobilité réduite, en cas de travaux sur des\n    constructions existantes,\n    o    Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou\n    environnementale des constructions, notamment ceux nécessaires à l’isolation thermique\n    par l’extérieur et les dispositifs de protection contre le rayonnement solaire, en cas de\n    travaux sur des constructions existantes, dans la limite de 0,40 mètre d’épaisseur,\n    o    Les pare-vues et les garde-corps, sous réserve de ne pas dépasser 1,90 mètre de\n    hauteur.\n    b. En cas de servitude de cour commune, l’article relatif à l’implantation des constructions sur un même\n    terrain s’applique, sauf à Meudon où en cas de servitude de cour commune, la distance entre deux\n    constructions situées de part et d’autre d’une cour commune doit être supérieure ou égale à 5\n164    mètres.\n    3.2.2.    Règles générales :\n    Sauf disposition particulière dans la règle écrite ou graphique, les constructions doivent s’implanter en\n    respectant les règles suivantes par rapport aux limites séparatives :\n    Secteur    Règles applicables\n    Constructions à destination d’équipements d’intérêt collectif et services publics :\n    ▪   Il n’est pas défini de bande pour l’implantation des constructions à destination\n    d’équipements d’intérêt collectif et services publics.\n    Zone U4\n    ▪   Les constructions peuvent être implantées en limite ou en retrait des limites\n    séparatives.\n    ▪   En cas de retrait, les constructions doivent être implantées avec un retrait supérieur\n    ou égal à la moitié de la hauteur de façade, soit L ≥ Hf/2, sans être inférieur à 1,90\n    mètre.\n    ▪   Les constructions doivent s’implanter en retrait des limites séparatives.\n    Secteur    Règles de retrait :\n    U4-A    ▪   Façades avec baie : le retrait doit être supérieur ou égal à la hauteur de façade, soit\n    L ≥ Hf, sans être inférieur à 8 mètres.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U4\n    Implantation par rapport aux limites séparatives\n    ▪   Façades sans baie : le retrait doit être supérieur ou égal à la moitié de la hauteur de\n    façade, soit L ≥ Hf/2, sans être inférieur à 4 mètres.\n    ▪   Toutefois, les constructions sont autorisées à s’implanter sur les limites séparatives,\n    si elles remplissent une ou plusieurs des conditions suivantes :\n    o   Lorsque la construction s'adosse à une construction voisine existante et\n    pérenne implantée en limite séparative, et dans la limite de son héberge,\n    o   Lorsque la construction s'adosse à un mur de soutènement, sans en dépasser\n    la hauteur,\n    o   Lorsque la construction est une annexe.\n    165\n    Dans une bande de 20 mètres, portée à 30 mètres à Vanves :\n    ▪   Les constructions peuvent s’implanter en tout ou partie en limite ou en retrait des\n    limites séparatives.\n    Au-delà de la bande :\n    ▪   Les constructions doivent s’implanter en retrait des limites séparatives.\n    ▪   Toutefois, les constructions sont autorisées à s’implanter sur les limites séparatives,\n    si elles remplissent une ou plusieurs des conditions suivantes :\n    o   Lorsque la construction s'adosse à une construction voisine existante et\nSecteur    pérenne implantée en limite séparative, et dans la limite de son héberge,\n U4-B    o   Lorsque la construction s'adosse à un mur de soutènement, sans en dépasser\n    la hauteur,\n    o   Lorsque la construction est une annexe.\n    Dans tous les cas :\n    ▪   Si la limite séparative correspond à une limite avec la zone U3, les constructions\n    doivent être implantées obligatoirement en retrait.\n    Règles de retrait :\n    ▪   Façades avec baie : le retrait doit être supérieur ou égal à la hauteur de façade, soit\n    L ≥ Hf, sans être inférieur à 6 mètres.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U4\n    Implantation par rapport aux limites séparatives\n    ▪   Façades sans baie : le retrait doit être supérieur ou égal à la moitié de la hauteur de\n    façade, soit L ≥ Hf/2, sans être inférieur à 4 mètres.\n    ▪   Les constructions doivent s’implanter en retrait de 8 mètres minimum des limites\n    séparatives.\n    ▪   Toutefois, les constructions sont autorisées à s’implanter sur les limites séparatives,\n    Secteur    si elles remplissent une ou plusieurs des conditions suivantes :\n166    o   Lorsque la construction s'adosse à une construction voisine existante et\n    U4-C\n    pérenne implantée en limite séparative, et dans la limite de son héberge,\n    o   Lorsque la construction s'adosse à un mur de soutènement, sans en dépasser\n    la hauteur,\n    o   Lorsque la construction est une annexe.\n    Dans une bande de 20 mètres :\n    ▪   Les constructions peuvent s’implanter sur les limites séparatives ou en retrait.\n    Au-delà de la bande :\n    ▪   Les constructions doivent s’implanter en retrait des limites séparatives.\n    Règles de retrait :\n    ▪   Façades avec baie : le retrait doit être supérieur ou égal à la hauteur de façade, soit\n    L ≥ Hf, sans être inférieur à 8 mètres.\n    Sous-\n    secteur\n    U4-C-1\n    ▪   Façades sans baie : le retrait doit être supérieur ou égal à la moitié de la hauteur de\n    façade, soit L ≥ Hf/2, sans être inférieur à 3 mètres.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U4\n    Implantation par rapport aux limites séparatives\n    Dans le sous-secteur U4-C-1a :\n    ▪   L’implantation des constructions par rapport aux emprises publiques et aux voies est\n    définie au Cahier de plans-masses.\n    ▪   Pour les constructions à destination d’équipement d’intérêt collectif et services public\n    la bande de 20 mètres ne s’applique pas. Les constructions peuvent s’implanter en\n    limite ou en retrait des limites séparatives.\n    ▪   En cas de retrait :\n    o   Façades avec baie : le retrait doit être supérieur ou égal à la moitié de la\n    hauteur totale moins 3 mètres, soit L ≥ (Ht/2)-3m, sans être inférieur à 5\n    mètres.\n    167\n    o   Façades sans baie : le retrait doit être supérieur ou égal à la moitié de la\n    hauteur totale moins 3 mètres, soit L ≥ (Ht/2)-3m, sans être inférieur à 3\n    mètres.\n    ▪   En dérogation à la définition lexicale, la notion de façade comprend les façades des\n    attiques.\n    ▪   Les constructions doivent s’implanter en retrait des limites séparatives.\n Sous-\nsecteurs    ▪   Les constructions à destination de locaux techniques et industriels des\n    administrations publiques et assimilés et les installations qui leur sont nécessaires\nU4-D-1    sont autorisées à s’implanter en limites séparatives ou en retrait, sans distance\nU4-D-2    minimum.\n    ▪   En secteur U4-D-2, pour les locaux techniques et industriels des administrations\n    publiques et assimilés, un retrait inférieur à 5 mètres peut être autorisé, sous réserve\n    d’une bonne compatibilité avec le voisinage immédiat.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U4\n    Implantation par rapport aux limites séparatives\n    ▪   Sur les terrains de moins de 300 m² ou de moins de 20 mètres de largeur mesurée\n    parallèlement à l'alignement, la construction en limite séparative est autorisée, dans\n    la mesure où elle ne porte pas atteinte à la salubrité d'une construction voisine ou au\n    paysage urbain.\n    Règles de retrait :\n    ▪   Façades avec baie : le retrait doit être supérieur ou égal à la hauteur de façade\n    moins 3 mètres, soit L ≥ Hf-3m, sans être inférieur à 5 mètres.\n    ▪   Façades sans baie : le retrait doit être supérieur ou égal à la moitié de la hauteur de\n    façade moins 3 mètres, soit L ≥ (Hf/2)-3m, sans être inférieur à 5 mètres.\n168\n    Sous-\n    secteur    ▪   Les constructions peuvent s’implanter sur les limites séparatives ou en retrait de ces\n    dernières. Le retrait doit être supérieur ou égal à 8 mètres.\n    U4-D-3\n    ▪   En dérogation à la définition lexicale, la notion de façade comprend les façades des\n    attiques.\n    ▪   Les constructions peuvent s’implanter sur les limites séparatives ou en retrait.\n    ▪   Les constructions à destination de locaux techniques et industriels des\n    Sous-    administrations publiques et assimilés et les installations qui leur sont nécessaires\n    secteurs    sont autorisées à s’implanter en limites séparatives ou en retrait, sans distance\n    minimum.\n    U4-D-4\n    ▪   Nonobstant les règles générales, les balcons doivent être en retrait d’un minimum de\n    U4-D-5    2 mètres des limites séparatives joignant l’alignement.\n    Règles de retrait :\n    ▪   Façades avec baie des constructions à destination de l’habitation : le retrait doit\n    être supérieur ou égal à la hauteur de façade moins 5,20 mètres, soit L ≥ Hf-5,20m,\n    sans être inférieur à 6 mètres.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U4\n    Implantation par rapport aux limites séparatives\n    ▪    Façades avec baie à destination autre que de l’habitation : le retrait doit être\n    supérieur ou égal à la hauteur de façade moins 5,20 mètres, divisée par 1,5 soit L ≥\n    (Hf-5,20m)/1,5, sans être inférieur à 6 mètres.\n    ▪    Façades sans baie : le retrait doit être supérieur ou égal à la moitié de la hauteur de\n    façade, soit L ≥ Hf/2, sans être inférieur à 6 mètres.\n    Les règles de retrait ne s’appliquent pas pour les constructions implantées à l’alignement le\n    long du quai Georges-Gorse sur une épaisseur maximale de 15 m comptée à partir de cet\n    alignement.\nles alternatives :\n3.2.3.    Règles alternatives :\n    Articulation avec l’environnement existant\n    ▪    Lorsqu'il existe sur le terrain contigu une construction existante pérenne d'une\n    hauteur minimale de 6 m, implantée elle-même en limite séparative, les nouvelles\n    constructions sont autorisées à s'élever en limite séparative dans la limite du mur\n    pignon sur lequel elles s'adossent.\n    ▪    Afin de ne pas porter atteinte à la salubrité d’une construction voisine, il est\n    demandé la création de contre-courettes au moins égales à la courette existante\n    sur le fond voisin nonobstant les règles générales d’implantation. Les façades\n   Sous-    constitutives de ces courettes ne peuvent comporter de baies\n  secteurs\n   U4-D-1\n    169\n   U4-D-2\n    Cas des travaux sur constructions existantes ne respectant pas les règles d’implantation\n    Dans le cas de constructions existantes ne respectant pas les règles générales d’implantation\n    par rapport aux limites séparatives, sont autorisés pour les parties de construction ne\n    respectant pas les règles d’implantation :\n    ▪    Les travaux d’amélioration de l’implantation vis-à-vis des règles générales et ceux\n Zone U4    sans effet sur le gabarit de la construction existante.\n    ▪    A l’exception du secteur U4-D, les extensions horizontales et verticales avec un\n    retrait égal ou supérieur à celui des constructions existantes, à condition que la\n    nouvelle façade ou partie de façade ne comporte pas de baie,\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U4\n    Implantation par rapport aux limites séparatives\n    ▪   Les annexes existantes ne sont pas concernées par les dispositions relatives aux\n    possibilités d’extension verticale ou horizontale.\n    ▪   En dehors des parties de constructions ne respectant pas les règles d’implantation,\n    les règles générales s’appliquent.\n    Secteur    Cas des petites extensions sur les constructions existantes\n    Sous-    ▪   Nonobstant les règles générales, sont autorisés les travaux d’extension sur les\n    secteurs    constructions existantes générant une emprise au sol inférieure à 20 m² dans la\n    mesure où l’extension ne réduit pas de plus d’1/3 les espaces libres existants sur le\n    U4-D-1\n    terrain. Si l’extension est une véranda, celle-ci devra se situer à l’arrière de la\n    U4-D-2    construction existante.\n    Sous-\n    secteurs   ▪   Nonobstant les règles générales, sont autorisés les travaux d’extension sur les\n    constructions existantes générant une emprise au sol inférieure à 20 m² dans la\n    U4-D-4\n    mesure où l’extension vise une meilleure fonctionnalité de la construction existante\n    U4-D-5\n170\n    Secteur    Autres cas de figure\n    ▪   Dans le cadre de la mise en œuvre de l’OAP thématique continuités écologiques,\n    des implantations alternatives sont autorisées, et ce particulièrement lorsqu’il s’agit\n    Zone U4\n    d’assurer la préservation des plantations existantes ou les continuités écologiques\n    avec les espaces voisins.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-
