\nRègle particulière de retrait :\n    ▪   Pour les constructions et installations nécessaires aux services publics ou d’intérêt\n    collectif, ces distances sont réduites à 6 mètres minimum pour les façades\n    comportant des baies, et à 3,50 mètres pour les façades sans baie.\nRègles complémentaires :\n    ▪   Lorsque la longueur sur rue du terrain, mesurée parallèlement à l'alignement, est\n    inférieure à 25 mètres, toute construction comprenant au moins un niveau sur rez-\n    de-chaussée, doit être dissociée dans son implantation des constructions\n    implantées à l’alignement de la voie, et doit respecter vis-à-vis de ces dernières, les\n    règles définissant l'implantation des constructions sur un même terrain.\n    71\n    ▪   Lorsque la longueur sur rue du terrain, mesurée parallèlement à l'alignement, est\n    supérieure ou égale à 25 mètres, toute construction comprenant au moins un\n    niveau sur rez-de-chaussée, doit être dissociée dans son implantation des\n    constructions implantées en limite séparative, et doit respecter vis-à-vis de ces\n    dernières, les règles définissant l'implantation des constructions sur un même\n    terrain.\n    ▪   Des liaisons en rez-de-chaussée sont autorisées entre des constructions\n    dissociées.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Implantation par rapport aux limites séparatives\n    ▪   Les dispositions du présent article ne s'appliquent pas lorsque les nouvelles\n    constructions sont autorisées à s’élever à la hauteur du mur pignon sur lequel elles\n    s’adossent.\n    Dans la Bande E\n    ▪   Les constructions peuvent être implantées sur les limites séparatives ou en retrait.\n    Règle de retrait :\n    ▪   En cas de retrait, la distance entre tout mporte pas de baie.\n    ▪   Dans les autres cas de figure, les constructions doivent être implantées en retrait\n    des limites séparatives. La distance entre tout point de façade et la limite séparative\n    doit être supérieure ou égale la hauteur de façade diminuée de 5,20 mètres et\n    divisée par deux, soit L≥(Hf-5,20)/2 sans être inférieure à 6 mètres pour les façades\n    comportant des baies et 3,5 mètres pour les façades sans baie.\n    Champ d’application :\n    ▪   Est regardée comme façade d’une construction, la ligne d'avancée des divers\n    Sous-    encorbellements (balcons, oriels, auvents...).\n    secteur\n    U1-A-3\n    ▪   Sont considérées comme des limites séparatives :\n    o    Les limites du périmètre de Z.A.C. autres que les emprises publiques de\n    voirie ouvertes à la circulation publique automobile ;\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Implantation par rapport aux limites séparatives\n    Toute limite de propriété autre que les voies et sise à l'intérieur du secteur\n    o\n    avec des terrains ne constituant pas une unité foncière avec le terrain\n    d'assiette du permis de construire.\n    Implantation par rapport aux limites séparatives\n    ▪    En cas de retrait, celui-ci doit être au moins égal à 3,50 mètres :\n    o    Toutefois cette distance peut être réduite jusqu’à permettre une implantation\n    sur cette limite si les propriétaires voisins s'obligent réciproquement à créer\n    une servitude de cour commune, propre à assurer le respect de la marge\n    d'isolement entre constructions, prévue à l'article relatif aux implantations de\n    constructions sur un même terrain,\n    o    Il n’est pas exigé de retrait minimal, dans le cas d’une nouvelle construction\n    pa n    o   Les éléments architecturaux d’accès ou de liaison tel que portiques, porches, passerelles,\n    escaliers, liaisons couvertes et autres éléments de liaisons,\n    o   Les balcons dans la limite de 1,20 mètre de profondeur,\n    o   Les ouvrages d’amélioration ou de mise aux normes d’une construction pour la sécurité ou\n    l’accessibilité pour les personnes à mobilité réduite, en cas de travaux sur des\n    constructions existantes,\n    o   Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou\n    environnementale des constructions, notamment ceux nécessaires à l’isolation thermique\n    par l’extérieur et les dispositifs de protection contre le rayonnement solaire, en cas de\n    travaux sur des constructions existantes, dans la limite de 0,40 mètre d’épaisseur,\n    o   les pare-soleils extérieurs et les doubles parois vitrées de moins de 0,80 mètre de\n    profondeur,\n76\n    o   Les pare-vues et les garde-corps, sous réserve de ne pas dépasser 1,90 mètre de\n    hauteur.\n    3.3.2.    Règles générales :\n    Sauf disposition particulière dans la règle écrite ou graphique, les constructions, lorsqu’elles sont non\n    contiguës et implantées sur un même terrain, doivent respecter entre elles les distances minimales\n    suivantes :\n    Secteur    Règles applicables\n    Secteurs\n    U1-B\n    U1-C\n    U1-D    ▪   L’implantation des constructions à destination d’équipements d’intérêt collectif et\n    U1-E    services publics n’est pas réglementée.\n    U1-F\n    U1-G\n    U1-H\n    Secteur\n    U1-B\n    ▪   La distance entre deux façades en vis-à-vis ne peut être inférieure à 6 mètres.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Implantation sur un même terrain\n    ▪   Dès  inférieure à 4 mètres.\n    ▪   Pour le site n°1 identifié par l’OAP centre-ville, il n’est pas fixé de règle pour le\n    rez-de-chaussée des constructions, lorsque ce rez-de-chaussée n’est pas à\n    destination principale d’habitation.\n    Sous-\n    Secteur    ▪   Pour les constructions à destination d’habitation :\n    U1-A-1    o   Dès lors qu’au moins une des parties de façades en vis-à-vis comporte des\n    baies, la distance doit être supérieure ou égale à la hauteur de la façade\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Implantation sur un même terrain\n    située en vis-à-vis moins 3 mètres, soit L ≥ Hf-3 m, sans être inférieure à\n    5 mètres.\n    o   Si l’une des parties de façades en vis-à-vis ne comporte pas de baie, la\n    distance doit être supérieure ou égale à la moitié de la hauteur de la façade\n    située en vis-à-vis, soit L ≥ Hf/2, sans être inférieure à 3,50 mètres.\n    ▪   Pour les constructions à toute autre destination :\n    o   La distance doit être supérieure ou égale à la moitié de la hauteur de la\n    façade située en vis-à-vis soit L ≥ Hf/2, sans être inférieure à 5 mètres ou\n    3,50 mètres si aucune des façades en vis-à-vis de comporte de baie.\n    ▪   Ces règles de distance ne s’appliquent pas aux constructions concernées par la\n    règle particulière de césure toute hauteur en cas de façade de longueur supérieure\n    à 30 mètres ou d’espace écologique et/ou paysager protégé.\n    Règle complémentaire\n    ▪   Afin de valoriser la qualité du paysage urbain environnant en cœur d’îlot et lorsque\n    les nouvelles constructions présentent un linéaire supérieur à 20 mètres au-delà de\n    la bande E, il est exigé au moins une césure d’au moins 5 mètres de large sur toute\n    leur profondeur. Ces césures sont soit sur toute leur hauteur, soit à partir de R+1 et\n    peuvent recevoir des balcons et passerelles. Cette disposition ne s’applique pas\n    aux constructions et installations nécessaires aux services publics ou d’intérêt\n    collectif.\n    ▪   Cette disposition ne s’applique pas aux constructions concernées par la règle\n    particulière de césure toute hauteur en cas de façade de longueur supérieure à 30\n    mètres ou d’espace écologique et/ou paysager protégé\n    Implantation sur un même terrain\n    ▪   Dès lors qu’au moins une des parties de façades en vis-à-vis comporte des baies,    79\n    la distance doit être supérieure ou égale à la hauteur de la façade située en vis-à\n    vis-moins 5,20 mètres, soit L ≥ Hf-5,20 m, sans être inférieure à 5 mètres.\n    ▪   Si l’une des parties de façades en vis-à-vis ne comporte pas de baie, la distance\n    doit être supérieure ou égale à la moitié de la hauteur de la façade située en vis-à-\n    vis, soit L ≥ Hf/2, sans être inférieure à 3,50 mètres.\n Sous-    ▪   Ces règles de distance ne s’appliquent pas aux constructions concernées par la\nsecteur    règle particulière de césure toute hauteur en cas de façade de longueur supérieure\n    à 50 mètres ou d’espace écologique et/ou paysager protégé\nU1-A-2\n    Règle complémentaire\n    ▪   Afin de valoriser la qualité du paysage urbain environnant en cœur d’îlot et lorsque\n    les nouvelles constructions présentent un linéaire supérieur à 30 mètres au-delà de\n    la bande E, il est exigé au moins une césure d’au moins 3,5 mètres de large sur\n    toute leur profondeur, soit sur toute leur hauteur, soit à partir de R+2.\n    ▪   Cette disposition ne s’applique pas aux constructions par la règle particulière de\n    césure toute hauteur en cas de façade de longueur supérieure à 50 mètres ou\n    d’espace écologique et/ou paysager protégé.\n    Champ d'application\n    ▪   L'implantation des constructions est calculée au nu de la façade, abstraction faite\n Sous-    des différentes saillies et encorbellements (balcons, oriels, auvents...).\nsecteur    ▪   La profondeur de ces différents encorbellements ne doit excéder 1,20 mètres à\nU1-A-3    compter du front bâti imposé ou de la limite d'implantation.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Implantation sur un même terrain\n    Implantation sur un même terrain\n    ▪   Outre les constructions édifiées sur des terrains formant un îlot de propriété\n    appartenant à un même propriétaire ou à une même indivision, sont regardés\n    comme ne constituant qu'un seul et même îlot de propriété l’ensemble des terrains\n    contigus :\n    o   Dont l'aménageur est propriétaire ou sur lesquels il dispose d'un titre\n    l'habilitant à construire,\n    o   Ou même déjà cédés, loués ou concédés à un tiers par l'aménageur à la date\n    de délivrance du permis de construire si ces cessions, locations ou\n    concessions ont fait l'objet d'un cahier des charges approuvé.\n    ▪   Aucune baie de construction ne doit être masquée par une partie d’une autre\n    construction, qui serait vue sous un angle de plus de 60° pris à la perpendiculaire\n    de cette baie au-dessus du plan horizontal à l'appui de cette même baie.\n80    ▪   Toutefois, une baie peut être masquée par une partie de construction qui serait vue\n    sous un angle supérieur à 60° lorsque les propriétaires des constructions\n    concernées ont conclu un accord en ce sens, ou, lorsqu'il s'agit d'un même\n    propriétaire, en cas de demande expresse de sa part. La distance séparant alors la\n    baie de la partie de construction la masquant sous un angle supérieur à 60° ne peut\n    être inférieure à 1,90 mètres.\n    ▪   Une distance minimale de 8 mètres est imposée face à une baie de logement, si\n    l’autre façade ne comporte pas de baie.\n    ▪   Une distance minimale de 10 mètres est imposée entre deux façades en vis-à-vis\n    comportant toutes les deux une ou plusieurs baies de logement.\n    Règles particulières relatives aux nouvelles constructions de part et d’autre des espaces\n    piétonniers structurants dénommés « rue Tony Garnier et Grand Place »\n    ▪   Pour les espaces piétonniers structurants dénommés \"rue Tony Garnier et Grand\n    Place\" ayant fait l'objet d'un traitement architectural spécifique, les règles\n    d'implantation communes ne sont pas applicables aux façades situées de part et\n    d'autre de ces espaces piétonniers.\n    ▪   Les limites d'implantation des constructions en superstructure sont indiquées au\n    cahier des plans de masse. Cette limite est calculée au nu des façades, à\n    l'exclusion des divers encorbellements. La profondeur de ces encorbellements ne\n    doit pas excéder 0,80 mètre à compter de la limite d'implantation.\n    ▪   Les constructions en sous-sol sont autorisées sans condition particulière sous les\n    voies et places à usage piétonnier.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Implantation sur un même terrain\n    ▪    Les édifices liés à l'exploitation et au fonctionnement des constructions en\n    infrastructure et ceux destinés à l'animation des espaces piétonniers ne sont pas\n    soumis aux dispositions du premier alinéa à condition :\n    o    qu'ils n'excèdent pas une hauteur de 3,50 mètres hors tout,\n    o    que, s'ils ne jouxtent pas une construction située de part et d’autre des\n    espaces piétonniers structurants dénommés « rue Tony Garnier et Grand\n    Place, la distance en tous points avec la construction la plus proche soit au\n    moins égale à leur hauteur.\n    ▪    Des poteaux ou colonnes destinés notamment à l'animation architecturale des\n    façades peuvent être implantés en avancée du nu de la façade sur l'emprise de\n    l'espace piétonnier à condition qu'ils s'inscrivent dans la profondeur\n    d'encorbellement de 0,80 mètres\n3.3.3.    Règles alternatives :\n    Cas des travaux sur constructions existantes ne respectant pas les règles\n Secteur\n    d’implantation\n    ▪    Dans le cas de constructions existantes, ne respectant pas les règles générales\n    d’implantation sur un même terrain, sont autorisés pour les parties de construction ne\n    respectant pas les règles d’implantation :\n    o    Les travaux d’amélioration de l’implantation vis-à-vis des règles générales et\n Zone U1    ceux sans effet sur le gabarit de la construction.\n    o    A l’exception du secteur U1-A, les extensions horizontales et verticales    81\n    respectant une distance égale ou supérieure à la distance entre constructions\n    existantes, à condition que la nouvelle façade ou partie de façade ne comporte\n    pas de baie.\n    ▪    En dehors des parties de constructions ne respectant pas les règles d’implantation, les\n    règles générales s’appliquent.\n Secteur    Cas des petites extensions sur les constructions existantes\n  Sous-    ▪    Nonobstant les règles générales, sont autorisés les travaux d’extension sur les\n secteurs    constructions existantes générant une emprise au sol inférieure à 20 m², dans la\n    mesure où l’extension ne réduit pas de plus d’1/3 les espaces libres existants sur le\n  U1-A-1\n    terrain. Si l’extension est une véranda, celle-ci devra se situer à l’arrière de la\n  U1-A-2    construction existante.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Emprise au sol\n    3.4. Emprise au sol\n    3.4.1.    Champ d’application :\n    Ne sont pas pris en compte pour l’application des règles d’emprise au sol :\n    ▪    Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou environnementale\n    des constructions, notamment ceux nécessaires à l’isolation thermique par l’extérieur et les\n    dispositifs de protection contre le rayonnement solaire, en cas de travaux sur des constructions\n    existantes, dans la limite de 0,40 mètre d’épaisseur,\n    ▪    Les ouvrages d’amélioration ou de mise aux normes d’une construction pour la sécurité ou\n    l’accessibilité pour les personnes à mobilité réduite, en cas de travaux sur des constructions\n    existantes.\n    Sauf mention contraire au sein du présent règlement, les projets de construction intégrant un programme à\n    destination d’équipement d’intérêt collectif et services publics au sein d’une même construction peuvent\n    bénéficier des règles spécifiques définies pour les constructions à destination d’équipement d’intérêt collectif\n    et services publics, dès lors que :\n    o   La destination équipement d’intérêt collectif et services publics concerne 100% de la\n    surface de plancher du rez-de-chaussée, exception faite des parties communes et des\n    accès nécessaires au fonctionnement de la construction,\n    o   Ou que la destination équipement d’intérêt collectif et services publics concerne au moins\n    50% de la surface de plancher de la construction.\n    3.4.2.    Règles générales :\n    Les projets doivent être conformes au taux de pleine-terre exigé, nonobstant toute règle d’emprise au sol\n    énoncée ci-après.\n82   Sauf disposition particulière dans la règle écrite ou graphique l’emprise au sol maximale des constructions\n    est fixée selon les modalités suivantes :\n    Secteur    Règles applicables\n    Zone U1\n    ▪   L’emprise au sol des constructions à destination d’équipements d’intérêt collectif et\n    services publics, n’est pas réglementée, à l’exception de Boulogne-Billancourt.\n    Secteur\n    ▪   Pour les terrains de moins de 25 mètres de profondeur : non réglementée.\n    U1-B    ▪   Pour les autres terrains : L’emprise au sol des constructions ne pourra pas excéder\n    70 % de la surface de la surface totale du terrain.\n    Secteur\n    ▪   50% de la surface du terrain.\n    U1-C    ▪   Non règlementée dans les périmètres de hauteurs spécifiques, excepté pour celui\n    situé autour de l’église Saint-Etienne.\n    ▪   40% de la surface du terrain.\n    Secteur    ▪   Pour les terrains existants dont la surface est inférieure à 250 m², l’emprise au sol\n    U1-D    des constructions est limitée à 100 m².\n    ▪   L’emprise au sol des annexes ne peut excéder 20 m².\n    Secteur\n    ▪   60% de la surface du terrain.\n    U1-E\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Emprise au sol\nSecteur    ▪   75% de la surface du terrain.\n U1-F    ▪   Non réglementée en sous-secteur U1-F-2\n    Sous-secteur U1-G-1 :\n    ▪   Non règlementée.\n    Sous-secteur U1-G-2 :\nSecteur    ▪   70% de la surface du terrain.\n U1-G    ▪   Pour les terrains existants dont la surface est inférieure à 150m², l’emprise au sol\n    n’est pas règlementée.\n    ▪   Au sein du périmètre de hauteur spécifique délimité sur le document graphique\n    n°4.2 Plan des prescriptions et périmètres particuliers, l’emprise au sol\n    autorisée est portée à 75% de la surface du terrain.\n    ▪   Dans une bande de 20 mètres : non règlementée,\n    ▪   Au-delà d’une bande de 20 mètres : 50% la partie du terrain située en dehors de la\n    bande.\nSecteur\n    ▪   Pour le site n°1 identifié par l’OAP centre-ville, l’emprise au sol n’est pas\n U1-H    règlementée.\n    ▪   Pour le site n°2 identifié par l’OAP centre-ville, en substitution des règles\n    précédentes, il n’est pas appliqué de bande. L’emprise au sol maximale est fixée à\n    55% de la surface du terrain.\n    83\n    ▪   Lorsqu’une bande E est mentionnée, sa profondeur est de 15 mètres. Cette bande\n    E est portée à 18 mètres uniquement pour les bureaux sur les axes suivants à\n    Boulogne-Billancourt : route de la Reine, avenue du Général Leclerc, avenue\n    Édouard Vaillant, avenue André Morizet, et les voies publiques du secteur U1-A-2.\n    ▪   L’emprise au sol est limitée à la somme de la surface du terrain couverte par la\n    bande E, plus 40 % de la surface du terrain non couverte par la bande E.\n    Sous-secteur U1-A-1 :\n Sous-\nsecteurs    o   Pour les constructions à destination d’équipements d’intérêt collectif et\n    services publics, l’emprise au sol des constructions est limitée à la somme\nU1-A-1\n    de la surface du terrain couverte par la bande E, plus50% de la surface du\nU1-A-2    terrain située non couverte par la bande E.\n    Sous-sous-secteur U1-A-1a : l’emprise au sol n’est pas règlementée.\n    Sous-secteur U1-A-2 :\n    ▪   Pour les constructions à destination d’équipements d’intérêt collectif et services\n    publics, l’emprise au sol des constructions est limitée à la somme de la surface du\n    terrain couverte par la bande E, plus60% de la surface du terrain non couverte par\n    la bande E.\n Sous-    ▪   L’emprise au sol des constructions résulte de l’application du plan du secteur\nsecteur    Centre-ville de Boulogne-Billancourt inscrit cahier des plans de masse et des\nU1-A-3    autres règles du règlement écrit.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Emprise au sol\n    3.4.3.    Règles alternatives :\n    Secteur    Autres cas de figure\n    ▪   Afin de permettre la mise en œuvre de l’OAP Continuités écologiques, l’emprise au\n    Zone U1    sol des nouvelles constructions pourra s’affranchir de la bande si elle existe, dans la\n    limite de l’emprise au sol autorisée, calculée vis-à-vis de la bande.\n    Secteur    Cas des petites extensions sur les constructions existantes\n    Sous-    ▪   Nonobstant les règles générales, sont autorisés les travaux d’extension sur les\n    secteurs    constructions existantes générant une emprise au sol inférieure à 20 m², dans la\n    mesure où l’extension ne réduit pas de plus d’1/3 les espaces libres existants sur le\n    U1-A-1\n    terrain. Si l’extension est une véranda, celle-ci devra se situer à l’arrière de la\n    U1-A-2    construction existante.\n84\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U1\n    Hauteur\n3.5. Hauteur\n3.5.1.    Règles générales :\nSauf disposition particulière dans la règle écrite ou graphique, les constructions doivent s’inscrire, le cas\néchéant dans le gabarit-enveloppe défini par les règles cumulatives énoncées, et a minima respecter les\nrègles de hauteur maximales énoncées.\n Secteur    Règles applicables\n    ▪   Pour les constructions dont le rez-de-chaussée est à destination de commerces et\n    activités de service, la hauteur de rez-de-chaussée de plancher à plancher doit au\n    minimum atteindre 3,50 mètres sauf pour les locaux communs, techniques, espaces\n    de stockage et de stationnement vélo.\n    ▪   A l’exception du secteur U1-A, pour les terrains et parties de terrain limitrophes d’une\n    zone U3,
