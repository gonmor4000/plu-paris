t paysager\n    Les dépassements du gabarit-enveloppe sont autorisés :\n    ▪    Pour les constructions existantes, hors patrimoine protégé repéré au document\n    graphique n° 4.3 Plan des protections patrimoniales, écologiques et\n    paysagères :\n Zone U2\n    o    Les dispositifs relatifs aux cabines d’ascenseurs en dehors de toitures\n    fonctionnalisées, aux chaufferies et à la climatisation, à l’exception du\n    secteur U2-C, dans la limite de 1,20 mètre.\n    o    Les dispositifs de production d’énergie renouvelable :\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U2\n    Hauteur\n    -   Dès lors qu’ils ont une hauteur totale inférieure ou égale à 0,70 mètre pour\n    les bâtiments d’une hauteur totale inférieure ou égale à 13,50 mètres (ou\n    R+3+A)\n    -    Dès lors qu’ils ont une hauteur totale inférieure ou égale à 1,80 mètre pour\n    les bâtiments d’une hauteur totale supérieure à 13,50 mètres (ou R+4)\n    o Les dispositifs d’isolation par l’extérieur dès lors que leur épaisseur ou\n    largeur maximale par rapport à la toiture existante est inférieure ou égale à\n    0,40 mètre.\n    o Les dispositifs de protection solaire dans la limite de 0,60 mètre.\n    o Les garde-corps de sécurité transparents ou en partie ajourés implantés en\n    toiture-terrasse dès lors qu’ils n’excèdent pas une hauteur de 1,20 mètre et\n    qu’ils sont implantés en retrait par rapport à la façade.\n    ▪   Pour les toitures végétalisées occupant plus de 75% de la surface de toiture, dès lors\n    que l’épaisseur de substrat est supérieure ou égale à 0,30 mètre, dans la limite de la\n    hauteur de substrat.\n    ▪   Pour les édicules liés à la fonctionnalisation des toitures (chapitre 5 du règlement),\n    d'une surface unitaire inférieure ou égale à 20 m² d’emprise et d'une hauteur inférieure\n    ou égale à 2,50 mètres portée à 3,50 mètres pour les édicules d’ascenseurs. Ils doivent\n    en outre :\n    o    être implantés en retrait de chacune des façades. Le retrait minimal étant égal\n    à la hauteur de l’édicule.\n    o    présenter une emprise totale inférieure ou égale à 10% de l’emprise de la\n    terrasse.\n    ▪   Pour les constructions nécessaires à l’agriculture urbaine, sous réserve qu’elles aient\n122    une emprise inférieure ou égale à 40% de la surface de la terrasse et une hauteur\n    totale inférieure ou égale à 3,00 mètres, et pour les installations nécessaires à\n    l’agriculture urbaine, sous réserve qu’elles aient une hauteur totale inférieur ou égale\n    à 2 mètres.\n    Cette règle ne s’applique pas :\n    o    Aux bâtiments bénéficiant d’un autre dépassement de gabarit ;\n    o    Aux bâtiments présentant une hauteur totale inférieure à 13,50 mètres ;\n    o    Aux patrimoines protégés définis par le présent règlement.\n    ▪   Pour les acrotères dans la limite de la hauteur totale.\n    ▪   Pour les lucarnes, dans la limite de la hauteur totale autorisée et de 40% du linéaire\n    de façade.\n    Pour les constructions implantées dans une bande E, les dépassements du gabarit-\n    enveloppe sont autorisés :\n    ▪   Pour les balcons, les oriels et les loggias en continuité avec les saillies de façade, dans\n    la limite de la hauteur totale autorisée et dans la limite de 30% du linéaire de façade.\n    ▪   Pour les opérations comprenant 100% de logements sociaux dans la limite de la\n    Secteur    hauteur totale de la construction contiguë existante.\n    U2-C    ▪   Sur les axes autorisant 80% de bureaux, soit un niveau supplémentaire dans la limite\n    de la hauteur de façade et de la hauteur totale définies par les règles générales, dans\n    les deux cas suivants :\n    o    La reconversion ou la démolition-reconstruction d’immeubles de bureaux à\n    destination de logements,\n    o    OU la réalisation d’une opération de logements comprenant au minimum 40%\n    de logements sociaux.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U2\n    Hauteur\n    Ces dépassements ne sont pas autorisés pour les machineries d'ascenseur lorsque\n    l'ascenseur ne dessert pas une toiture fonctionnalisée, pour les machineries de réfrigération\n    ou de climatisation, qui doivent être intégrés dans le volume de couronnement.\nSecteur    Articulation avec l’environnement existant\n    ▪   Lorsque la hauteur totale et/ou de façade d’une construction voisine existante et\n    pérenne implantée en limite séparative est supérieure au gabarit-enveloppe indiqué\n    par les règles générales, le gabarit-enveloppe de la construction projetée peut être\n    égal à la hauteur totale et/ou de façade de la construction voisine existante et pérenne\n    implantée en limite séparative, sans dépasser de plus de 3 mètres la hauteur totale\n    autorisée (soit un niveau supplémentaire possible).\nSecteurs\n  U2-A\n U2-B\n U2-D\n    Pour les constructions implantées dans une bande E :\n    ▪   Lorsque la hauteur d’une construction existante implantée sur un fond voisin diffère\n    de la hauteur totale maximale autorisée pour les nouvelles constructions, ces    123\n    dernières sont autorisées à s’inscrire dans la limite du mur pignon sur lequel elles\n    s'adossent, sur une longueur d'au moins 3 mètres. La hauteur des nouvelles\n    constructions est limitée à la hauteur totale maximale indiquée par le filet, plus ou\n    moins deux niveaux, soit 6 mètres.\nSecteur\n U2-C\n    ▪   Lorsque la hauteur totale de constructions existantes, implantées en limites\n    séparatives de part et d’autre du terrain, est supérieure à la hauteur totale indiquée\n    pour les nouvelles constructions, et que la distance entre ces deux immeubles est\n    inférieure à 20 mètres, les nouvelles constructions sont autorisées à venir combler la\n    dent creuse en adoptant le gabarit-enveloppe le plus proche du plus petit des deux\n    immeubles. La hauteur des nouvelles constructions est limitée à la hauteur totale\n    indiquée par le filet plus ou moins deux niveaux, soit 6 mètres.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U2\n    Hauteur\n    ▪   Pour l’extension verticale d'une construction existante comportant un plancher bas du\n    rez-de-chaussée situé au-dessus du niveau de référence, il est autorisé une hauteur\n    de façade augmentée de la différence entre le niveau de référence et le niveau du\n    plancher bas du rez-de-chaussée. Cette modification de la hauteur de façade modifie\n    d'autant la hauteur totale, uniquement si cela permet d'assurer la continuité avec le\n    tissu urbain. Pour les filets roses, cette modification de la hauteur de façade modifie\n    d’autant la hauteur totale dans tous les cas.\n    Pour les constructions implantées au-delà de la bande E :\n    ▪   Lorsqu'il existe sur le terrain contigu une construction d’une hauteur minimale de 5\n    mètres, implanté elle-même en limite, les nouvelles constructions en limite séparative\n    sont autorisées à s'élever à la hauteur du mur pignon sur lequel elles s'adossent, dans\n    la limite des hauteurs plafonds définies par les règles générales. En cas de terrain\n    traversant, est appliquée la plus petite des hauteurs de façade autorisées.\n124\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U3\n    Zone U3\n    Dominante habitat pavillonnaire\nLa zone U3 correspond à une zone à dominante d’habitat pavillonnaire, souvent individuel. Sa vocation est\nà dominante résidentielle, sans exclure une certaine forme de mixité fonctionnelle. Elle est composée de 3\nsecteurs :\n    ▪   U3-A correspondant aux principaux secteurs à dominante pavillonnaire ;\n    ▪   U3-B correspondant aux principaux secteurs pavillonnaires dits aérés ;\n    ▪   U3-C correspondant aux secteurs pavillonnaires spécifiques. Il se compose de 15 sous-secteurs :\n    o   U3-C-1 correspondant aux quartiers pavillonnaires spécifiques de Boulogne-Billancourt\n    soumis à plan-masse,\n    o   U3-C-2 correspondant au quartier du « Fonds des Princes » à Boulogne-Billancourt,\n    o   U3-C-3 correspondant au quartier Le Mesnil à Chaville,\n    o   U3-C-4 correspondant au quartier du Parc Fourchon à Chaville,\n    o   U3-C-5 correspondant au secteur Foucher-Rebard dans le quartier des Ursines à Chaville\n    soumis à plan-masse,\n    o   U3-C-6 correspondant secteur des grandes propriétés du cœur de bourg de Marnes-la-\n    Coquette,\n    o   U3-C-7 correspondant au quartier du Parc de Marnes à Marnes-la-Coquette,\n    o   U3-C-8 correspondant au quartier du Domaine de la Marche à Marnes-la-Coquette,\n    o   U3-C-9 correspondant au quartier du Parc des Terrasses à Marnes-la-Coquette,\n    o   U3-C-10, correspondant au quartier du Potager du Dauphin et aux abords de l’avenue du\n    Château à Meudon,\n    125\n    o   U3-C-11, correspondant au site de projet de la rue Pasteur à Sèvres,\n    o   U3-C-12, correspondant aux ensembles pavillonnaires à caractère patrimonial à Vanves, soumis\n    à plan-masse,\n    o   U3-C-13 correspondant au quartier de la Côte d’Argent à Ville-d’Avray,\n    o   U3-C-14 correspondant au domaine de la Ronce à Ville-d’Avray,\n    o   U3-C-15 correspondant au quartier Val Fleury à Ville-d’Avray.\nRappel des dispositions générales :\nDans le cas d'un lotissement ou dans celui de la construction, sur une unité foncière ou sur plusieurs unités\nfoncières contiguës, de plusieurs bâtiments dont le terrain d'assiette doit faire l'objet d'une division en\npropriété ou en jouissance, en zone U3 les règles du PLUi sont appliquées à chaque lot ou chaque unité\nissu de la division et destiné à être bâti.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U3\n    Implantation par rapport aux emprises publiques et aux voies\n    3.1. Implantation par rapport aux emprises publiques et aux\n    voies\n    3.1.1.    Champ d’application :\n    a. Sous réserve du règlement de voirie et de l’accord du gestionnaire de voirie pour les saillies sur\n    espace public, ne sont pas pris en compte pour l’application des règles d’implantation à l’alignement :\n    Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou environnementale des\n    constructions, notamment ceux nécessaires à l’isolation thermique par l’extérieur, en cas de travaux sur des\n    constructions existantes, dans la limite de 0,40 mètre d’épaisseur,\n    ▪    Les traitements en creux en rez-de-chaussée au droit des accès sur une profondeur de 1 mètre,\n    ▪    Les renfoncements de loggias ou autres, à partir d'une hauteur de 3,50 mètres et du R+1,\n    ▪    Les saillies des façades des commerces sur trottoir sont autorisées en rez-de-chaussée et dans une\n    limite de 0,20 mètre d’épaisseur,\n    ▪    Sur les emprises publiques et voies de largeur inférieure à 12 mètres :\n    o   Les marquises et les stores-bannes, dans une limite de 0,80 mètre,\n    o   Les éléments de modénature, dans une limite de 0,40 mètre, à partir d'une hauteur de\n    3,50 mètres et R+1,\n    o   Les balcons et oriels, dans une limite de 0,60 m, à partir d'une hauteur de 5,50 mètres et\n    du R+2. La proportion des oriels devant être inférieure ou égale à 20% de la surface de la\n    façade ;\n    o   En cas de travaux sur des constructions existantes, les dispositifs de protection solaire\n    dans la limite de 0,40 mètre et à partir d’une hauteur de 5,50 mètres.\n126    ▪    Sur les emprises publiques et voies de largeur supérieure ou égale à 12 mètres et inférieure\n    à 20 mètres :\n    o   Les marquises et les stores-bannes, dans une limite de 1,20 mètre,\n    o   Les éléments de modénature, dans une limite de 0,60 mètre, à partir d'une hauteur de\n    3,50 mètres et du R+1 ;\n    o   Les balcons et oriels, dans une limite de 0,80 mètre, à partir d'une hauteur de 5,50 mètres\n    et du R+2. La proportion des oriels devant être inférieure ou égale à 20% de la surface de\n    la façade ;\n    o   En cas de travaux sur des constructions existantes, les dispositifs de protection solaire\n    dans la limite de 0,80 mètre et à partir d’une hauteur de 5,50 mètres.\n    ▪    Sur les emprises publiques et voies de largeur supérieure ou égale à 20 mètres :\n    o   Les marquises et les stores-bannes, dans une limite de 1,80 mètre,\n    o   Les éléments de modénature, dans une limite de 0,80 mètre, à partir d'une hauteur de\n    3,50 mètres et du R+1,\n    o   Les balcons et oriels, dans une limite de 1,20 mètre, à partir d'une hauteur de 5,50 mètre\n    et du R+2. La proportion des oriels devant être inférieure ou égale à 20% de la surface de\n    la façade ;\n    o   En cas de travaux sur des constructions existantes, les dispositifs de protection solaire\n    dans la limite de 1,20 mètre et à partir d’une hauteur de 5,50 mètres.\n    b. En cas de recul, ne sont pas pris en compte pour le calcul du recul :\n    o   Les éléments de modénature, les marquises et les auvents de moins de 0,80 mètre de\n    profondeur,\n    o   Les débords de toiture de moins de 0,60 mètre de profondeur,\n    o   Les oriels de moins de 0,40 mètre de profondeur et à partir d’une hauteur de 5,50 mètres,\n    o   Les balcons dans la limite de 1,20 mètre de profondeur,    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U3\n    Implantation par rapport aux emprises publiques et aux voies\n    o   Les perrons et emmarchements,\n    o   Les terrasses de moins de 0,60 mètre de hauteur par rapport au terrain avant travaux\n    o   Les ouvrages d’amélioration ou de mise aux normes d’une construction pour la sécurité ou\n    l’accessibilité pour les personnes à mobilité réduite, en cas de travaux sur des\n    constructions existantes,\n    o   Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou\n    environnementale des constructions, notamment ceux nécessaires à l’isolation thermique\n    par l’extérieur et les dispositifs de protection contre le rayonnement solaire, en cas de\n    travaux sur des constructions existantes, dans la limite de 0,40 mètre d’épaisseur,\n    o   Les rampes de garage desservant le sous-sol ou le rez-de-chaussée de la construction,\n    o   Les escaliers, les rampes d’accès et les passerelles non couvertes.\n    c.   En cas de présence d’un alignement d’arbres repéré au plan 4.3 Protections, la préservation des\n    arbres prévaut sur les dispositifs non pris en compte pour l’application des règles d’implantation.\n    d. Sauf mention contraire au sein du présent règlement, les projets de construction intégrant un\n    programme à destination d’équipement d’intérêt collectif et services publics au sein d’une même\n    construction peuvent bénéficier des règles spécifiques définies pour les constructions à destination\n    d’équipement d’intérêt collectif et services publics, dès lors que :\n    o   La destination équipement d’intérêt collectif et services publics concerne 100% de la\n    surface de plancher du rez-de-chaussée, exception faite des parties communes et des\n    accès nécessaires au fonctionnement de la construction,\n    o   Ou que la destination équipement d’intérêt collectif et services publics concerne au moins\n    50% de la surface de plancher de la construction,\n3.1.2.    Règles générales :\n    127\nSauf disposition particulière dans la règle graphique, notamment les marges de recul ou obligation\nd’alignement indiqués sur le plan 4.2 des prescriptions et périmètres particuliers, les constructions doivent\ns’implanter en respectant les règles suivantes par rapport aux emprises publiques et aux voies :\n Secteur    Règles générales : Implantation par rapport aux emprises publiques et aux voies\n    ▪   L’implantation des constructions à destination d’équipements d’intérêt collectif et\n    services publics n’est pas réglementée, à l’exception des secteurs de plan masse.\n    ▪   Implantation vis-à-vis des sentes piétonnes : les constructions doivent être implantées\n    avec un recul supérieur ou égal 3 mètres.\n Zone U3\n    ▪   L’implantation de locaux destinés au stockage des ordures ménagères nécessaire au\n    tri n’est pas règlementée.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U3\n    Implantation par rapport aux emprises publiques et aux voies\n    ▪   Les constructions doivent s’implanter en recul.\n    ▪   Ce recul doit être supérieur ou égal à :\n    o    4 mètres dans les secteurs U3-A, ce recul minimal est ramené à 2 mètres à\n    Vanves uniquement.\n    o    5 mètres dans le secteur U3-B.\n    Secteurs\n    ▪   A Issy-les-Moulineaux, l’implantation des constructions par rapport aux emprises\n    U3-A    publiques et aux voies est définie dans le Cahier des références aux voiries ou par\n    une marge de recul matérialisée sur le document graphique n°4.2 Plan des\n    U3-B    prescriptions et périmètres particuliers. En l’absence d’indication, les règles\n    générales s’appliquent.\n    Règles complémentaires\n    A Sèvres :\n128\n    ▪   50% des surfaces de marges de recul, doivent être traités en espace végétalisé, les\n    surfaces des accès piétons et véhicules n’étant pas déduites du calcul.\n    À Issy-les-Moulineaux :\n    ▪   50% des surfaces de marges de recul, en dehors des accès piétons et véhicules,\n    doivent être traités en espace végétalisé.\n    ▪   Pour permettre d'améliorer la qualité architecturale, sont autorisés des reculs partiels\n    de la façade en longueur et/ou en hauteur par rapport au plan vertical de l’alignement.\n    ▪   Les décrochements ponctuels de façade, pour l’entreposage des déchets en attente\n    de collecte hors saillies sont autorisés.\n    Sous-secteur U3-C-1 :\n    ▪   L’implantation des constructions est fixée par le Cahier de plans masses. En cas de\n    marge de recul, aucune construction en infrastructure n’est autorisée, à l’exception\n    des réseaux.\n    Réalisation de porche :\n    ▪   Les porches sont autorisés. Ils doivent préserver une continuité visuelle depuis\n    l'alignement à travers le terrain et être clos par une grille implantée à l'alignement, soit\n    U3-C    toute hauteur soit d'une hauteur minimale de 3 mètres.\n    Sous-secteur U3-C-2 :\n    ▪   Les nouvelles constructions peuvent être implantées à l'alignement, ou le long d'une\n    marge de recul, s'il en existe une, ou encore en recul de ces limites.\n    ▪   En cas de marge de recul, aucune construction en infrastructure n’est autorisée, à\n    l’exception des réseaux.\n    Réalisation de porches\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U3\n    Implantation par rapport aux emprises publiques et aux voies\n   ▪   Les porches sont autorisés. Ils doivent préserver une continuité visuelle depuis\n    l'alignement à travers le terrain et être clos par une grille implantée à l'alignement, soit\n    toute hauteur soit d'une hauteur minimale de 3 mètres.\nSous-secteur U3-C-3 :\n   ▪   Les constructions doivent s'implanter selon un recul supérieur ou égal à 3 mètres par\n    rapport à la rue du Père Komitas et à la rue Sainte Marie.\n   ▪   Au-delà d’un linéaire de 10 mètres de façade sur rue, la façade de la construction doit\n    se décrocher selon un recul de 2 mètres.\nSous-secteur U3-C-4 :\n   ▪   Les constructions doivent s’implanter selon un recul supérieur ou égal à 5 mètres.\nSous-secteur U3-C-5 :\n   ▪   L’implantation des constructions est fixée par le cahier de plans masses.\nSous-secteur U3-C-6 et U3-C-7 :\n   ▪   Les constructions doivent s’implanter selon un recul par rapport à l’alignement    129\n    opposé. Ce recul doit être supérieur ou égal à la hauteur totale de la construction, soit\n    L ≥ Ht.\nSous-secteur U3-C-8 et U3-C-9 :\n   ▪   Les constructions doivent s’implanter en recul par rapport à l'alignement opposé.\n   ▪   Ce recul doit être supérieur ou égal à la hauteur totale de la construction soit L ≥ Ht\n    avec un recul minimum relatif à la largeur de la voie : :\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U3\n    Implantation par rapport aux emprises publiques et aux voies\n    o   Recul supérieur ou égal à 8 mètres par rapport à l’axe de la voie lorsque la\n    largeur de celle-ci est inférieure à 8 mètres ;\n    o   Recul supérieur ou égal à 4 mètres par rapport à l’alignement lorsque la\n    largeur de voie est supérieure ou égale à 8 mètres ;\n    o   Recul supérieur ou égal à 4 mètres par rapport à l’alignement le long du\n    boulevard de la République.\n130   Sous-secteur U3-C-10 :\n    ▪   Les constructions doivent être implantées en recul de l’alignement.\n    ▪   Le recul par rapport à l'alignement doit être supérieur ou égal à 4 mètres.\n    ▪   À l’angle de deux voies ouvertes à la circulation automobile, un nouvel alignement est\n    défini par un pan coupé. Ce pan coupé doit être d’une longueur de 5 mètres.\n    Sous-secteur U3-C-11 :\n    ▪   Les constructions peuvent être implantées à l’alignement ou en recul.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U3\n    Implantation par rapport aux emprises publiques et aux voies\n    ▪   En cas de recul, celui-ci doit être supérieur ou égal à 1 mètre par rapport à\n    l’alignement.\n    Sous-secteur U3-C-12 :\n    ▪   Les constructions, y compris les annexes, sauf dispositions particulières pour les\n    constructions à usage de stationnement prévues dans le cahier réglementaire de\n    plans masse, doivent être implantées sur le filet d’implantation ou en recul de celui-ci.\n    Ce filet d’implantation est repéré pour chacun des 8 périmètres dans le Cahier de\n    plans masse.\n    Sous-Secteur U3-C-13 :\n    ▪   Les constructions doivent s’implanter selon un recul supérieur ou égal à 3 mètres.\n    ▪   Les constructions doivent s’implanter en respectant un recul supérieur ou égal 4\n    mètres par rapport à l’axe d’une ur les constructions existantes implantées dans une marge de recul\n    U3-C-4\n    identifiée sur le plan n°4.2 des prescriptions et périmètres particuliers, les\n    extensions horizontales dans la marge de recul sont interdites.\n    o   Les annexes existantes ne sont pas concernées par les dispositions relatives\n    aux possibilités d’extension verticale ou horizontale.\n    ▪   En dehors des parties de constructions ne respectant pas les règles d’implantation, les\n    règles générales s’appliquent.\n132\n    Secteur    Articulation avec l’environnement existant\n    Secteurs\n    U3-A    À Chaville, Meudon et Vanves :\n    U3-B    ▪   Dans le cas où les constructions voisines, existantes sur le terrain, ou contigües de\n    la nouvelle construction, sont implantées avec un recul moindre que le recul exigé\n    Sous-\n    par les règles générales, des implantations peuvent être autorisées, en tout ou partie,\n    secteurs\n    à l’identique de celle des constructions voisines, si la cohérence urbaine est\n    U3-C-3    démontrée. Cette disposition ne s’applique pas aux annexes.\n    U3-C-10\n    À Vanves :\n    Secteur    ▪   Lorsqu’un mur de soutènement d’une hauteur supérieure ou égale à 2 mètres est\n    U3-A    présent au droit du terrain, les constructions sont autorisées à s’implanter en tout ou\n    partie soit à l’alignement, soit avec un recul supérieur ou égal à 1 mètre.\n    Secteur    Autres cas de figure\n    ▪   Dans le cadre de la mise en œuvre de l’OAP thématique continuités écologiques,\n    des implantations alternatives sont autorisées, et ce particulièrement lorsqu’il s’agit\n    Zone U3\n    d’assurer la préservation des plantations existantes ou les continuités écologiques\n    avec les espaces voisins.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U3\n    Implantation par rapport aux limites séparatives\n3.2. Implantation par rapport aux limites séparatives\n3.2.1.    Champ d’application :\n   a. Sont admis dans le retrait :\n    o   Les éléments de modénature, les marquises et les auvents dans la limite de 0,80 mètre de\n    profondeur,\n    o   Les débords de toiture dans la limite de 0,60 mètre de profondeur,\n    o   Les oriels dans la limite de 0,40 mètre de profondeur,\n    o   Les perrons, escaliers et emmarchements,\n    o   Les terrasses et passerelles non couvertes, de moins de 0,60 mètre de hauteur par\n    rapport au terrain avant travaux,\n    o   Les balcons dans la limite d’1,20 mètre de profondeur,\n    o   Les ouvrages d’amélioration ou de mise aux normes d’une construction pour la sécurité ou\n    l’accessibilité pour les personnes à mobilité réduite, en cas de travaux sur des\n    constructions existantes,\n    o   Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou\n    environnementale des constructions, notamment ceux nécessaires à l’isolation thermique\n    par l’extérieur et les dispositifs de protection contre le rayonnement solaire, en cas de\n    travaux sur des constructions existantes, dans la limite de 0,40 mètre d’épaisseur,\n    o   Les pare-vues et les garde-corps, sous réserve de ne pas dépasser 1,90 mètre de\n    hauteur.\n   b. En cas de servitude de cour commune, l’article relatif à l’implantation des constructions sur un même\n    terrain s’applique, sauf à Meudon où en cas de servitude de cour commune, la distance entre deux\n    constructions situées de part et d’autre d’une cour commune doit être supérieure ou égale à 5\n    mètres.    133\n3.2.2.    Règles générales :\nSauf disposition particulière dans la règle écrite ou graphique, les constructions doivent s’implanter en\nrespectant les règles suivantes par rapport aux limites séparatives :\n Secteur    Règles applicables\n    Constructions à destination d’équipements d’intérêt collectif et services publics\n Tous les    ▪   Il n’est pas défini de bande pour l’implantation des constructions à destination\n Secteurs    d’équipements d’intérêt collectif et services publics.\n   sauf    ▪   Les constructions peuvent être implantées en limite ou en retrait des limites\n  U3-C-1    séparatives.\n    et\n  U3-C-2    ▪   En cas de retrait, celui-ci doit être supérieur ou égal à la moitié de la hauteur de\n    façade, soit L ≥ Hf/2, sans être inférieur à 1,90 mètre.\n    Dans une bande de 20 mètres\n    ▪   Les constructions doivent être implantées :\n Secteurs    o    sur les limites séparatives latérales ou en retrait, lorsque le linéaire de terrain le\n    long des emprises publiques et voies est inférieur ou égal à 12 mètres\n   U3-A\n    o    sur une seule limite séparative latérale maximum ou en retrait, lorsque le\n   U3-B    linéaire de terrain le long des emprises publiques et voies est supérieur à 12\n    mètres et inférieur ou égal à 20 mètres\n    o    en retrait des limites séparatives latérales lorsque le linéaire de terrain le long\n    des emprises publiques et voies est supérieur à 20 mètres\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U3\n    Implantation par rapport aux limites séparatives\n    o en retrait des limites de fond, dans tous les cas.\n    Au-delà d’une bande de 20 mètres\n    ▪   Les constructions doivent être implantées en retrait des limites séparatives\n    En cas de retrait\n    ▪   Façades avec baie : le retrait doit être supérieur ou égal à la hauteur de façade, soit\n    L ≥ Hf, sans être inférieur à 8 mètres.\n    ▪   Façades sans baie : le retrait doit être supérieur ou égal à la moitié de la hauteur de\n    façade, soit L ≥ Hf/2, sans her pour les étages supérieurs.\n    Règles complémentaires :\n    ▪   Les terrasses accessibles sont autorisées dans le respect des vues sur voisins et des\n    règles de limites séparatives suivante :\n    o    Les terrasses qui se trouvent à 2,5 mètres de la limite séparative ne doivent\n    pas excéder la hauteur de 5 mètres, pare-vue inclus, soit un plancher de\n    terrasse à une hauteur totale de 3,1 mètres. En cas de différence de pente\n    avec le terrain limitrophe, la hauteur autorisée est comptée par rapport au\n    niveau naturel du terrain voisin.\n    o    Les terrasses qui se trouvent à plus de 2,5 mètres de la limite séparative ne\n    doivent pas excéder une hauteur de 5,90 mètres, pare-vue inclus, soit un\n    plancher de terrasse à une hauteur totale de 4 mètres. En cas de différence de\n    pente avec le terrain limitrophe, la hauteur autorisée est comptée par rapport\n    au niveau naturel du terrain voisin.\n    Secteur U3-C-4 :\n136\n    ▪   Les constructions doivent être implantées en retrait des limites séparatives. Ce retrait\n    doit être supérieur ou égal à la moitié de la hauteur de façade, soit L ≥ Hf/2, sans être\n    inférieur à :\n    o    6 mètres lorsque la façade en vis-à-vis de la limite séparative, comporte des\n    baies,\n    o    3 mètres lorsque la façade en vis-à-vis de la limite séparative, ne comporte pas\n    de baie ou ne comporte que des fenêtres à soufflet en verre translucide situées\n    à 2,60 m au-dessus du plancher du rez-de-chaussée et 1,90 m au-dessus du\n    plancher pour les étages supérieurs. Les pavés de verre sont autorisés sans\n    exigence d’implantation.\n    Sous-secteur U3-C-5 :\n    ▪   L’implantation des constructions est fixée par le Cahier de plans masses.\n    Sous-secteurs U3-C-6, U3-C-8 et U3-C-9 :\n    Dans une bande de 25 mètres :\n    ▪   Les constructions doivent être implantées :\n    o  sur les limites séparatives latérales ou en retrait, lorsque le linéaire de terrain le\n    long de ur ou égal aux ¾ de la hauteur de cette façade soit L ≥ ¾Hf,\n    sans être inférieur à 6 mètres.\nRègle complémentaire\n    ▪   Lorsque la parcelle est bordée par une voie privée non ouverte à la circulation, les\n    marges de retrait fixées aux alinéas précédents sont augmentées de la distance\n    mesurée entre la limite entre le terrain privatif et la voie privée et la limite parcellaire\n    qui peut être située au milieu de la voie privée.\nSous-secteur U3-C-7 :\n    ▪   Les constructions doivent être implantées en retrait des limites séparatives.\n    ▪   De plus aucune construction ne devra être édifiée à une distance inférieure à :\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U3\n    Implantation par rapport aux limites séparatives\n    o    8 m de la façade sur les avenues principales, (sont considérées comme\n    avenues principales : celle de Marnes, de la grille d’entrée jusqu’au rond-\n    point ; celle de Brézin ; celle de Ville d’Avray),\n    o    5 m sur les autres avenues,\n    o    5 m des limites de chaque propriété.\n    Règle de retrait\n    ▪   Façades avec baie : le retrait doit être supérieur ou égal à la hauteur de façade soit\n    L ≥ Hf, sans être inférieur à 8 mètres,\n    ▪   Façades sans baie : le retrait doit être supérieur ou égal à la moitié de la hauteur de\n    ce point, soit L ≥ Hf/2, sans être inférieur à 5 mètres,\n    ▪   Si la façade n’est pas parallèle à la limite séparative, les deux règles suivantes\n    s’appliquent :\n    o    le retrait, mesuré au milieu de la façade par rapport à la limite séparative, doit\n    être supérieur ou égal à la hauteur de cette façade soit L ≥ Hf, sans être\n    inférieur à 8 mètres,\n138\n    o    le retrait, mesuré en tout point de la façade par rapport lantation par rapport aux limites séparatives\n    o    Les annexes existantes ne sont pas concernées par les dispositions relatives\n    aux possibilités d’extension verticale ou horizontale.\n    ▪   En dehors des parties de constructions ne respectant pas les règles d’implantation, les\n    règles générales s’appliquent.\n    ▪   La création ou l’agrandissement de baies est autorisé lorsque les baies sont situées\n    à une distance :\n    o   Supérieure ou égale à 6 mètres de la limite séparative,\n    Sous-\n    o   Comprise entre 6 mètres et 3 mètres de la limite séparative, uniquement pour\n    secteur\n    les baies de type châssis fixe à verre translucide ou fenêtres à soufflet en\n    U3-C-4\n    verre translucide situés à 2,60 mètres au-dessus du plancher du rez-de-\n    chaussée et 1,90 mètre au-dessus du plancher pour les étages supérieurs,\n    o   Inférieure à 3 mètres de la limite séparative, seuls les pavés de verre sont\n    autorisés.\n    Secteur    Cas des petites extensions sur les constructions existantes\n142\n    Sous-secteur U3-C-1 et U3-C-2 :\n    ▪   L'implantation d'extensions de faible importance visant à un meilleur fonctionnement des\n    constructions, d'édicules et de vérandas, est autorisée, nonobstant les règles générales,\n    Secteur    à conditions :\n    U3-C    ▪   D’être situés en dehors des marges de recul mentionnées sur le document\n    graphique n°4.2 Plan des prescriptions et périmètres particuliers,\n    ▪   Et que leur emprise au sol soit au plus égale à 20 % de la surface des espaces libres\n    sans pouvoir excéder toutefois 12 m².\n    Secteur    Articulation avec l’existant\n    À Chaville, Marnes-la-Coquette, Ville-d’Avray\n    Secteurs\n    ▪   Les constructions peuvent s’implanter en limites séparatives lorsque la nouvelle\n    U3-A    construction s'adosse à une construction voisine existante et pérenne implantée en\n    U3-B    limite séparative, dans la limite de son gabarit. Cette règle s’applique également  À Marnes-la-Coquette :\nSecteur\n    Dans la bande Et au-delà d’une bande de 20 mètres, les constructions sont autorisées à\n U3-A    s’implanter en limite séparative de fond si :\n    ▪   Elles ne sont affectées ni à l’habitation, ni à une activité industrielle, artisanale ou de\n    bureau et que leur hauteur au faîtage ne dépasse pas 3,20 mètres,\n    143\n    ▪   Si elles sont réalisées sur un terrain existant d’une surface inférieure à 250 m².\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U3\n    Implantation sur un même terrain\n    3.3. Implantation sur un même terrain\n    3.3.1.    Champ d’application :\n    a. La distance minimale entre deux constructions non contiguës implantées sur un même terrain est\n    mesurée perpendiculairement et horizontalement en tout point de chaque façade.\n    b. Ne sont pas pris en compte pour l’application des règles d’implantation :\n    o   Les éléments de modénature et les motifs architectoniques dans la limite de 0,40 mètre de\n    profondeur,\n    o   Les marquises et les auvents dans la limite de 0,80 mètre de profondeur,\n    o   Les débords de toiture dans la limite de 0,60 mètre de profondeur,\n    o   Les oriels dans la limite de 0,40 mètre de profondeur,\n    o   Les perrons et emmarchements,\n    o   Les terrasses de moins de 0,60 mètre de hauteur par rapport au terrain avant travaux,\n    o   Les éléments architecturaux d’accès ou de liaison tel que portiques, porches, passerelles,\n    escaliers, liaisons couvertes et autres éléments de liaisons,\n    o   Les balcons dans la limite de 1,20 mètre de profondeur,\n    o   Les ouvrages d’amélioration ou de mise aux normes d’une construction pour la sécurité ou\n    l’accessibilité pour les personnes à mobilité réduite, en cas de travaux sur des\n    constructions existantes,\n    o   Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou\n    environnementale des constructions, notamment ceux nécessaires à l’isolation thermique\n    par l’extérieur et les dispositifs de protection contre le rayonnement solaire, en cas de\n    travaux sur des constructions existantes, dans la limite de 0,40 mètre d’épaisseur,\n    o   Les pare-soleils extérieurs et les doubles parois vitrées de moins de 0,80 mètre de\n144    profondeur,\n    o   Les pare-vues et les garde-corps, sous réserve de ne pas dépasser 1,90 mètre de\n    hauteur.\n    3.3.2.    Règles générales :\n    Le présent article n’est pas applicable aux constructions à destination de locaux techniques et industriels\n    des administrations publiques et assimilés ni aux installations qui leur sont nécessaires.\n    Sauf disposition particulière dans la règle écrite ou graphique, les constructions, lorsqu’elles sont non\n    contiguës et implantées sur un même terrain, doivent respecter entre elles les distances minimales\n    suivantes :\n    Secteur    Règles applicables\n    Zone    ▪   L’implantation des constructions à destination d’équipements d’intérêt collectif et\n    U3    services publics n’est pas réglementée, sauf dans les secteurs de plan masse.\n    Secteur    ▪   Dès lors qu’au moins une des parties de façades en vis-à-vis comporte au moins une\n    baie, la distance doit être supérieure ou égale à la hauteur de la façade la plus haute,\n    U3-A    soit L ≥ Hf, sans être inférieure à 8 mètres.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U3\n    Implantation sur un même terrain\n    ▪   Si aucune des façades en vis-à-vis ne comporte de baies, la distance doit être\n    supérieure ou égale à la moitié de la hauteur de la façade la plus haute, soit L ≥ Hf/2,\n    sans être inférieure à 4 mètres.\n    ▪   Dès lors qu’au moins une des parties de façades en vis-à-vis comporte au moins une\n    baie, la distance doit être supérieure ou égale à 16 mètres.\n    145\nSecteur\n U3-B    ▪   Si aucune des façades en vis-à-vis ne comporte de baies, la distance doit être\n    supérieure ou égale à 8 mètres.\n    Sous-secteur U3-C-1 :\n    ▪   L’implantation des constructions est fixée par le Cahier de plans masses.\nSecteur    ▪   En cas de marge de retrait, aucune construction en infrastructure n’est autorisée, à\n    l’exception des réseaux.\n U3-C\n    ▪   Les motifs architectoniques de moins de 0,40 mètre de profondeur ne sont pas pris en\n    compte pour l'application de ces règles.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U3\n    Implantation sur un même terrain\n    Sous-secteur U3-C-2 :\n    ▪   Aucune construction en infrastructure n’est autorisée dans la marge de retrait, à\n    l’exception des réseaux.\n    ▪   Dès lors qu’au moins une des parties de façades en vis-à-vis comporte des baies, la\n    distance doit être supérieure ou égale à la hauteur de la façade située en vis-à-vis\n    moins 3 mètres, soit L ≥ Hf-3 m, sans être inférieure à 5 mètres.\n    ▪   Si l’une des parties de façades en vis-à-vis ne comporte pas de baie, la distance doit\n    être supérieure ou égale à la moitié de la hauteur de la façade située en vis-à-vis, soit\n    L ≥ Hf/2, sans être inférieure à 5 mètres\n    ▪   Les motifs architectoniques de moins de 0,40 mètre de profondeur ne sont pas pris en\n    compte pour l'application de ces règles. Les pare-vues et les garde-corps ne sont pas\n    pris en compte pour l’application de ces règles sous réserve de ne pas dépasser 1,90\n    mètre de hauteur.\n    Sous-secteurs U3-C-3 et U3-C-4 :\n    ▪   Une distance supérieure ou égale à 6 mètres est exigée entre les façades de deux\n    constructions.\n    ▪   Les nouvelles constructions doivent être implantées de façon à ce que les baies ne\n    soient masquées par aucune partie d’une construction qui, à l’appui de ces baies,\n    serait vue sous un angle de plus de 45° au-dessus du plan horizontal.\n    Sous-secteur U3-C-5 :\n    ▪   L’implantation des constructions est fixée par le Cahier de plans masses.\n    Sous-secteurs U3-C-6 et U3-C-7 :\n    ▪   Dès lors que l’une des façades en vis-à-vis comporte des baies, la distance doit être\n146    supérieure ou égale à 8 mètres.\n    ▪   Si aucune des façades en vis-à-vis ne comporte de baies, la distance doit être\n    supérieure ou égale à 4 mètres.\n    Sous-secteurs U3-C-8, U3-C-9 et U3-C-10 :\n    ▪   Dès lors que la façade la plus basse comporte des baies, la distance doit être\n    supérieure ou égale à la hauteur de la façade la plus haute, soit L ≥ Hf, sans être\n    inférieure à 8 mètres.\n    ▪   Dès lors que la façade la plus haute comporte des baies et que la façade la plus basse\n    ne comporte pas de baie, la distance doit être supérieure ou égale à la hauteur de la\n    façade la plus basse soit L ≥ Hf, sans être inférieure à 8 mètres.\n    ▪   Si aucune des façades en vis-à-vis ne comporte de baies, la distance doit être\n    supérieure ou égale à la moitié de la hauteur de la façade la plus haute ou supérieure\n    ou égale à la façade la plus basse, soit L ≥ Hf/2 ou L ≥ Hf sans être inférieure à 4\n    mètres.\n    Sous-secteur U3-C-10 :\n    ▪   Dès lors qu’une des façades en vis-à-vis comporte des baies, la distance doit être\n    supérieure ou égale à la hauteur de la façade, soit L ≥ Hf, sans être inférieure à 16\n    mètres.\n    ▪   Dès lors qu’une des façades en vis-à-vis ne comporte pas de baie, la distance doit être\n    supérieure ou égale à moitié de la hauteur de la façade en vis-à-vis la plus haute soit\n    L ≥ Hf/2, sans être inférieure à 8 mètres.\n    ▪   Le retrait entre une annexe et une construction doit être supérieur ou égal à la moitié\n    de la hauteur de la façade la plus haute soit L ≥ Hf/2, sans être inférieur à 3 mètres\n    ▪   La distance minimale entre une construction d’habitation comprenant, au plus, deux\n    logements et une annexe, est de 2,5 mètres.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U3\n    Implantation sur un même terrain\n    Sous-secteur U3-C-11 :\n    ▪    Une distance supérieure ou égale à 10 mètres est exigée entre les façades de deux\n    constructions.\n    Sous-secteur U3-C-12 :\n    ▪    L’implantation des constructions est fixée par le Cahier de plans masses.\n    Sous-secteurs U3-C-13 / U3-C-14 / U3-C-15 :\n    ▪    Dès lors qu’au moins une des parties de façades en vis-à-vis comporte des baies, la\n    distance doit être supérieure ou égale à la hauteur de la façade la plus haute, soit L ≥\n    Hf sans être inférieur à 8 mètres.\n    ▪    Si aucune des façades en vis-à-vis ne comporte de baie, la distance doit être\n    supérieure ou égale à la moitié de la hauteur de la façade la plus haute, soit L ≥ Hf/2,\n    sans être inférieure à 3 mètres.\n3.3.3.    Règles alternatives :\n Secteur    Cas des travaux sur les constructions existantes ne respectant pas les règles\n    d’implantation\n    ▪    Dans le cas de constructions existantes, ne respectant pas les règles d’implantation sur\n    un même terrain, sont autorisés pour les parties de construction ne respectant pas les\n    règles d’implantation :\n Secteurs    o   Les travaux d’amélioration de l’implantation vis-à-vis des règles générales et\n   U3-A    ceux sans effet sur le gabarit de la construction.\n    o   A l’exception des sous-secteurs U3-C1 et U3-C-2, les extensions    147\n   U3-B    horizontales et verticales respectant une distance égale ou supérieure à la\n   U3-C    distance entre constructions existantes, à condition que la nouvelle façade ou\n    partie de façade ne comporte pas de baie.\n    ▪    En dehors des parties de constructions ne respectant pas les règles d’implantation, les\n    règles générales s’appliquent.\n Secteur    Cas des petites extensions sur les constructions existantes\n    Sous-secteurs U3-C-1 et U3-C-2 :\n    ▪    L'implantation d'extensions de faible importance visant à un meilleur fonctionnement\n    des constructions, d'édicules et de vérandas, est autorisée, nonobstant les règles\n Secteur    générales, à conditions :\n   U3-C    ▪    D’être situés en dehors des marges de recul mentionnées dans le document\n    graphique n°4.2 Plan des prescriptions et périmètres particuliers,\n    ▪    Et que leur emprise au sol soit au plus égale à 20 % de la surface des espaces libres\n    sans pouvoir excéder toutefois 12 m².\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U3\n    Emprise au sol\n    3.4. Emprise au sol\n    3.4.1.    Champ d’application :\n    Ne sont pas pris en compte pour l’application des règles d’emprise au sol :\n    a. Les dispositifs visant à améliorer ou optimiser la performance énergétique et/ou environnementale\n    des constructions, notamment ceux nécessaires à l’isolation thermique par l’extérieur et les\n    dispositifs de protection contre le rayonnement solaire, en cas de travaux sur des constructions\n    existantes, dans la limite de 0,40 mètre d’épaisseur,\n    b. Les ouvrages d’amélioration ou de mise aux normes d’une construction pour la sécurité ou\n    l’accessibilité pour les personnes à mobilité réduite, en cas de travaux sur des constructions\n    existantes.\n    Sauf mention contraire au sein du présent règlement, les projets de construction intégrant un programme à\n    destination d’équipement d’intérêt collectif et services publics au sein d’une même construction peuvent\n    bénéficier des règles spécifiques définies pour les constructions à destination d’équipement d’intérêt collectif\n    et services publics, dès lors que :\n    o    La destination équipement d’intérêt collectif et services publics concerne 100% de la\n    surface de plancher du rez-de-chaussée, exception faite des parties communes et des\n    accès nécessaires au fonctionnement de la construction,\n    o    Ou que la destination équipement d’intérêt collectif et services publics concerne au moins\n    50% de la surface de plancher de la construction.\n    3.4.2.    Règles générales :\n    Les projets doivent être conformes au coefficient de pleine-terre exigé, nonobstant toute règle d’emprise au\n    sol énoncée ci-après.\n148   Sauf disposition particulière dans la règle écrite ou graphique l’emprise au sol maximale des constructions\n    est fixée selon les modalités suivantes :\n    Secteur    Règles applicables\n    Zone U3\n    hors    ▪   L’emprise au sol des constructions à destination d’équipements d’intérêt collectif et\n    secteur    services publics n’est pas réglementée.\n    U3-C\n    L’emprise au sol maximale des constructions est définie\n    par les tranches cumulatives et règles suivantes :\n    ▪   Tranche de surface de terrain inférieure à 300\n    m² : 40% de la surface cette tranche ;\n    ▪   Tranche de surface de terrain comprise entre\n    300 m² et 500 m² : 25% de la surface de cette\n    tranche ;\n    Secteur    ▪   Tranche de surface de terrain supérieure à 500\n    m² : 10% de la surface de cette tranche ;\n    U3-A\n    ▪   L’emprise au sol de chaque construction doit être inférieure ou égale à 200 m².\n    Pour les terrains d’une superficie inférieure ou égale à 225 m² à la date d’approbation du\n    PLUi, une emprise au sol de 90 m² est autorisée, sous réserve que 50% au moins du terrain\n    après travaux soient de pleine-terre.\n    À Issy-les-Moulineaux :\n    Dans une bande de 20 mètres :\n    ▪   50% de la surface totale du terrain\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U3\n    Emprise au sol\n    ▪   pour les terrains d’une surface supérieure ou égale à 300 m², l’emprise maximale des\n    constructions est fixée à 40% de la surface totale du terrain.\n    Hors bande de 20 mètres :\n    ▪   10% de la surface totale du terrain.\n    Dans tous les cas :\n    ▪   L’emprise au sol de chaque construction doit être inférieure ou égale à 200 m².\n    ▪   20% de la surface du terrain.\nSecteur    ▪   L’emprise au sol de chaque construction doit être inférieure ou égale à 200 m².\n U3-B    ▪   Pour les terrains d’une superficie inférieure ou égale à 450 m² à la date d’approbation\n    du PLUi, une emprise au sol de 90 m² est autorisée, sous réserve que 50% au moins\n    du terrain après travaux soient de pleine-terre.\n    Sous-secteur U3-C-1 :\n    ▪   L'emprise au sol des constructions est fixée par le Cahier de plans masses.\n    Sous-secteur U3-C-2 :\n    ▪   25% de la surface du terrain.\n    ▪   40% de la surface du terrain pour les constructions à destination d’équipements\n    d’intérêt collectif et services publics.\n    Sous-secteur U3-C-3 :\n    ▪   Dans une bande de 20 mètres : non règlementée,\n    149\n    ▪   Hors bande de 20 mètres : 20% de la partie du terrain située hors de la bande.\n    ▪   L’emprise au sol de chaque construction doit être inférieure ou égale à 200 m².\n    Sous-secteur U3-C-4 :\n    ▪   30% de la surface du terrain.\nSecteur    ▪   L’emprise au sol de chaque construction doit être inférieure ou égale à 200 m².\n U3-C    Sous-secteur U3-C-5 :\n    ▪   L'emprise au sol des nouvelles constructions est fixée par le Cahier de plans\n    masses.\n    Sous-secteur U3-C-6 :\n    ▪   18 % de la surface du terrain.\n    L’emprise au sol d’une annexe est limitée à 20 m².\n    Sous-secteur U3-C-7 :\n    ▪   15% de la surface du terrain.\n    Sous-secteur U3-C-8 :\n    ▪   30% de la surface du terrain.\n    ▪   L’emprise au sol de chaque construction doit être inférieure ou égale à 200 m².\n    Sous-secteur U3-C-9 :\n    ▪   40% de la surface du terrain.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U3\n    Emprise au sol\n    ▪   Toutefois, pour les terrains d’une superficie inférieure à 300 m² : l’emprise au sol\n    totale des constructions peut atteindre 120 m² sans pouvoir dépasser 60% de la\n    surface du terrain.\n    ▪   L’emprise au sol de chaque construction doit être inférieure ou égale à 200 m².\n    Sous-secteur U3-C-10 :\n    L’emprise au sol maximale des constructions est définie par les tranches cumulatives et\n    règles suivantes :\n    ▪   Tranche de surface de terrain inférieure à 300 m² : 35% de la surface cette tranche ;\n    ▪   Tranche de surface de terrain comprise entre 300 m² et 500 m² : 25% de la surface\n    de cette tranche ;\n    ▪   Tranche de surface de terrain supérieure à 500 m² : 10% de la surface de cette\n    tranche\n    Sous-secteur U3-C-11 :\n    ▪   Non règlementée.\n    Sous-secteur U3-C-12 :\n    ▪   Non règlementée.\n    Sous-secteur U3-C-13 :\n    ▪   45% de la surface du terrain.\n    Sous-secteur U3-C-14 :\n    ▪   10% de la surface du terrain. Une majoration de 3% est prévue pour les constructions\n    annexes de type garage, lorsque ces constructions sont implantées en limite de\n150    clôture du Chemin Desvallières ou enterrées sous la butte de la Ronce.\n    Sous-secteur U3-C-15 :\n    ▪   30% de la surface du terrain.\n    3.4.3.    Règles alternatives :\n    Secteur    Cas des petites extensions sur constructions existantes\n    ▪   Nonobstant les règles générales d’emprise au sol, sont autorisés les édicules,\n    Sous-    vérandas ou extensions de faible importance visant à une meilleure fonctionnalité\n    secteurs    des constructions existantes, à condition :\n    U3-C-1    o   D’être situés en dehors des marges de recul mentionnées sur le document\n    graphique n°4.2 Plan des prescriptions et périmètres particuliers,\n    U3-C-2\n    o   Et que leur emprise au sol soit au plus égale à 20 % de la surface des\n    espaces libres sans pouvoir excéder toutefois 12 m².\n    Secteur    Autres cas de figure\n    ▪   Dans l’objectif de permettre une implantation harmonieuse des extensions sur les\n    constructions existantes, l’emprise au sol des surfaces en extension peut s’affranchir\n    Secteur    de la bande, dans la limite de l’emprise au sol autorisée sur le terrain.\n    U3-A    ▪   Afin de permettre la mise en œuvre de l’OAP Continuités écologiques, l’emprise au\n    sol des nouvelles constructions pourra s’affranchir de la bande, dans la limite de\n    l’emprise au sol autorisée sur le terrain.\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","3. Morphologie et implantation des constructions – Zone U3\n    Emprise au sol\n    151\n    Accusé de réception en préfecture\n    092-200057974-20250625-C2025-06-05-5-DE\n    Date de télétransmission : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U3\n    Hauteur\n    3.5. Hauteur\n    3.5.1.    Règles générales :\n    Sauf disposition particulière dans la règle écrite ou graphique, les constructions doivent s’inscrire, le cas\n    échéant dans le gabarit-enveloppe défini par les règles cumulatives énoncées, et a minima respecter les\n    règles de hauteur maximales énoncées.\n    Secteur    Règles applicables\n    À Meudon :\n    ▪   Dans la zone de hauteur contrainte délimitée sur le document graphique n°4.2 Plan\n    Zone U3    des prescriptions et périmètres particuliers, la hauteur totale des constructions ne\n    doit pas dépasser 13 mètres, y compris les édicules et installations techniques en\n    toiture et hormis les acrotères. Si la règle du secteur prévoit une hauteur inférieure, la\n    règle de hauteur inférieure prévaut.\n    Sauf mention différente dans le chapitre 5 concernant les pentes de toiture :\n    ▪   Dans le cas d’une toiture à pente :\n    o    Une hauteur de façade égale à 7 mètres. La hauteur de façade est portée à 8\n    mètres à Chaville\n    o    Un couronnement présentant une pente maximale de 45°,\n    o    Une hauteur totale de 10 mètres, soit R+1+C.\n    ▪   Dans le cas d’une toiture terrasse :\n152    o    Une hauteur de façade égale à 6 mètres,\n    o    Un couronnement présentant une pente de 1 pour 2,\n    o    Une hauteur totale de 10 mètres, soit R+1+A.\n    Secteurs\n    U3-A    ▪   A Sèvres, en complément des règles précitées : pour les toitures à la Mansart, la\n    construction à partir de points d’accroches fixés à 6 mètres maximum doit s’inscrire dans\n    U3-B    un gabarit ne dépassant pas un volume délimité par une oblique de pente de 60° sur une\n    hauteur maximum de 2,5 mètres par rapport à l’égout du toit et au-delà par une oblique de\n    pente maximum de 30° sur une hauteur maximum de 1 mètre.\n    Accusé de réception e n : 08/07/2025\n    Date de réception préfecture : 08/07/2025\n    Modification simplifiée n°1 du 25 juin 2025","    3. Morphologie et implantation des constructions – Zone U3\n    Hauteur\n    Sous-secteur U3-C-11 :\n    ▪   Une hauteur de façade égale à 9 mètres,\n    ▪   Un niveau de couronnement présentant une pente de 45°,\n    ▪   Une hauteur totale de 12 mètres ou 12,50 mètres en cas de toiture mansart.\n    ▪   Pour les toitures à la Mansart, la construction à partir de points d’accroches fixés à 6\n    mètres maximum doit s’inscrire dans un gabarit ne dépassant pas un volume délimité\n    par une oblique de pente de 60° sur une hauteur maximum de 2,5 mètres par rapport\n    à l’égout du toit et au-delà par une oblique de pente maximum de 30° sur une hauteur\n    maximum de 1 mètre.\n    Sous-secteur U3-C-12 :\n    ▪   Le gabarit-enveloppe est fixé par le cahier de plans-masses.\n    Sous-secteurs U3-C-13, U3-C-14 et U3-C-15 :\n    ▪   Une hauteur de façade égale à 9 mètres,\n    ▪   Un couronnement présentant une pente de 1 pour 2,\n    ▪   Une hauteur totale de 12 mètres.\n    3.5.2.    Règles particulières :\n    Secteur    Cas non soumis aux règles générales\n    ▪    Pour les constructions existantes hors patrimoine protégé, sont exclus de la définition\n154    du gabarit-enveloppe les éléments suivants :\n    o   Les dispositifs relatifs aux cabines d’ascenseurs, aux chaufferies et à la\n    climatisation, dans la limite de 1,20 mètre,\n    o Les dispositifs de production d’énergie renouvelable :\n    -    Dès lors qu’ils ont une hauteur totale inférieure ou égale à 0,70 mètre pour\n    les bâtiments d’une hauteur totale inférieure ou égale à 13,50 mètres (ou\n    R+3+A)\n    -    Dès lors qu’ils ont une hauteur totale inférieure ou égale à 1,00 mètre pour\n    les bâtiments d’une hauteur totale supérieure à 13,50 mètres (ou R+4)\n    o Les dispositifs d’isolation par l’extérieur, dès lors que leur épaisseur ou\n    largeur maximale par rapport à la to
