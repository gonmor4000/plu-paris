ait de l’alignement des voies et emprises publiques ou privées ainsi que des\n    cours communes différent de celui imposé pourra être admis ou imposé afin d’améliorer\n    l’intégration du projet dans son environnement immédiat ou lorsqu'une échappée\n    visuelle sur un espace libre le justifie ;\n   6) Si le projet architectural le justifie et participe à l’animation paysagère, des retraits et\n    avancées ponctuelles pourront être autorisés ;\n   7) Exceptionnellement, les annexes, hors locaux techniques, pourront s’implanter en\n    limites de voies, leur hauteur maximum ne dépasse pas 3,2 mètres au faîtage et une\n    emprise au sol maximale de 25m². Cette disposition n’est applicable qu’une seule fois.\nARTICLE UG.7 : IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX LIMITES\nSEPARATIVES\nLes façades avec vues doivent s’implanter en retrait des limites séparatives, à une distance\nsupérieure ou égale à 6 mètres.\nLes façades sans vue peuvent s’implanter :\n   o sur une ou plusieurs limites séparatives à condition que pour chacune de ces limites,\n    elles s’adossent à une construction existante sur le terrain voisin et qu’elles n’en\n    dépassent ni les dimensions ni les limites ;\nPLU de Vaucresson    Règlement","    102\n   o en retrait de celles-ci. En cas d’implantation en retrait d’une ou plusieurs limites\n    séparatives, la marge de recul doit être supérieure ou égale à 4 mètres.\nDispositions particulières de toute la zone UG :\n   1) Sous réserve de leur compatibilité avec l'environnement tant au regard de leur aspect\n    que de leur fonction, les constructions et installations nouvelles nécessaires aux\n    services publics ou d'intérêt collectif s’implantent soit :\n    -   Sur une ou plusieurs limites séparatives,\n    -   en retrait des limites séparatives en respectant une marge de recul de 2 mètres\n    minimum en cas de façades sans vue et 4m minimum en présence de façades avec\n    vues.\n   2) L'implantation des constructions par rapport à une cour commune se fera en appliquant\n    les mêmes règles que pour les limites séparatives décrites ci-dessus.\n   3) Les piscines de plein air s’implantent en retrait à une distance au moins égale à 4\n    mètres des limites séparatives.\n   4) Le bord extérieur des balcons, dont la profondeur est inférieure ou égale à 0,80 mètre,\n    doit être à une distance supérieure ou égale à 3,50 mètres de la limite séparative.\n    Les balcons dont la profondeur est supérieure à 0,80 mètre sont considérés comme\n    des vues.\n   5) Les éléments architecturaux suivants sont exclus des règles de retrait :\n    - les stores mobiles, les volets, les conduits de fumée,\n    - les corniches, les modénatures de façades, les débords de toiture,\n    - les dispositifs de performance énergétiques.\n   6) En cas de division de terrain, les limites séparatives créées doivent être implantées de façon\n    à préserver l’ordonnancement architectural du bâti existant ainsi que l’équilibre de la\n    composition entre le bâti et l’espace végétalisé du terrain.\n   7) Une construction peut venir, sur une ou plusieurs limites séparatives, s’adosser à une\n    construction existante à condition qu’elle n’en dépasse ni les dimensions ni les limites,\n   8) Nonobstant les dispositions du présent article, l'implantation d'une construction en\n    limite séparative peut être refusée si elle a pour effet de porter gravement atteinte à\n    l'aspect du paysage urbain, et notamment à l'insertion de la construction dans le bâti\n    environnant ;\n   9) Exceptionnellement, les annexes, hors locaux techniques, pourront s’implanter en\n    limites séparatives, si tant est que leur hauteur maximum ne dépasse pas 3,2 mètres\n    au faîtage et une emprise au sol maximale de 25m².\nARTICLE UG.8 : IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT\nAUX AUTRES SUR UNE MÊME PROPRIÉTÉ\nAucune distance minimum n’est imposée entre la construction à usage d’habitation et son\nannexe, si l’emprise au sol de l’annexe ne dépasse pas les 35 m² d’emprise au sol.\nLa distance entre les constructions à usage d’habitation ainsi que la distance entre les\nconstructions à usage d’habitation et les annexes de plus de 35 m² d’emprise au sol, doit être\n:\n   o supérieure ou égale à 12 mètres en cas de façade avec vues,\n   o supérieure ou égale à 8 mètres en cas de façade sans vue.\nPLU de Vaucresson    Règlement","    103\nDispositions particulières de toute la zone UG :\nSous réserve de leur compatibilité avec l'environnement tant au regard de leur aspect que de\nleur fonction et des exigences liées aux règles de sécurité, ces dispositions ne s’appliquent\npas aux constructions et installations nécessaires aux services publics ou d'intérêt collectif.\nARTICLE UG.9 : EMPRISE AU SOL DES CONSTRUCTIONS\nSur l’ensemble du terrain, l’emprise au ne doit pas excéder 25% de la superficie du terrain.\nDispositions particulières de toute la zone UG :\n   1) Sous réserve de leur compatibilité avec l'environnement tant au regard de leur aspect\n    que de leur fonction, ces dispositions ne s’appliquent pas aux constructions et\n    installations nécessaires aux services publics ou d'intérêt collectif.\n   2) Exceptionnellement, lors d’une rénovation d’un bâti existant, les dispositifs nécessaires\n    à l’utilisation des énergies renouvelables et à l’isolation par l’extérieur peuvent être\n    soustraits au calcul d’emprise au sol total de la construction.\n   3) L’emprise au sol peut être augmentée de 5 m² maximum, à condition que cette\n    construction supplémentaire soit d’une hauteur inférieure ou égale à 3,20 mètres au-\n    dessus du terrain naturel. Cette disposition n’est applicable qu’une seule fois.\nARTICLE UG.10 : HAUTEUR MAXIMUM DES CONSTRUCTIONS\nLa hauteur des constructions est mesurée à partir du terrain naturel jusqu'au point le plus\nélevé de la construction (faîtage ou acrotère) ou sur mention spécifique jusqu’à l’égout du\ntoit.\nLa hauteur des constructions ne doit pas dépasser :\n   o 7 mètres à l’égout du toit et à l’acrotère\n   o 9 mètres au faitage.\nDispositions particulières de toute la zone UG :\n   1) Sous réserve de leur compatibilité avec l'environnement tant au regard de leur aspect\n    que de leur fonction, des hauteurs différentes de celles fixées aux paragraphes ci-\n    dessus peuvent être autorisées ou imposées, lorsqu'il s'agit des constructions et\n    installations nécessaires aux services publics ou d'intérêt collectif.\nPLU de Vaucresson    Règlement","    104\n   2) Les éléments de modénature et les garde-corps à claire-voie peuvent dépasser la\n    hauteur maximale des façades dans une limite de 1,00 mètre ;\n   3) Les éléments de constructions sur terrasses ne sont pas comptés dans la hauteur\n    maximale autorisée, à condition que ceux-ci ne dépassent pas une hauteur maximum\n    de 1,00 m, qu’ils soient implantés en retrait des façades d’une distance d’au moins 3,00\n    m et qu’ils abritent uniquement la machinerie des ascenseurs, la sortie des escaliers,\n    la chaufferie et le conditionnement d’air, les gaines de ventilation, les souches de\n    cheminées ;\n   4) Dans le cas des annexes, la hauteur maximale est limitée à 3,20 mètres au faitage ;\n   5) En cas de terrain en pente, les hauteurs maximums autorisées devront être respectées\n    en tout point de l’emprise au sol de la construction vis-à-vis du terrain naturel. Des\n    dépassements ponctuels pourront être autorisés si ceux-ci ont pour effet de permettre\n    un lissage des hauteurs de la construction ;\n   6) Exceptionnellement, il est possible de déroger à cet article à condition de répondre aux\n    critères cumulatifs suivants :\n    - La hauteur maximale de la construction concernée, mesurée par rapport au\n    terrain naturel, doit être inférieure ou égale à 10 mètres au faitage ou à l’acrotère\n    - L’emprise au sol de la partie de la construction concernée doit être inférieure ou\n    égale à 10 m²\n    - La distance par rapport aux limites séparatives et à la voie, en tout point de cette\n    partie de construction, doit être supérieure ou égale à 10 mètres\n    - Cette disposition n’est applicable qu’une seule fois.\nARTICLE UG.11 : ASPECT EXTERIEUR DES CONSTRUCTIONS ET AMENAGEMENT DE\nLEURS ABORDS\nLes constructions ne doivent pas porter atteinte au caractère ou à l’intérêt des lieux\navoisinants, des sites et des paysages naturels ou urbains.\nLe projet peut être refusé ou n'être accepté que sous réserve de l'observation de prescriptions\nspéciales si les constructions à édifier ou à modifier, par leur situation, leur architecture, leurs\ndimensions ou leur aspect extérieur, sont de nature à porter atteinte au caractère ou à l'intérêt\ndes lieux avoisinants, aux sites, aux paysages naturels ou urbains ainsi qu'à la conservation\ndes perspectives monumentales.\nEn complément des règles édictées ci-dessous, et en amont de tout projet d’aménagement\net/ou de construction, il est fortement recommandé de se reporter et de prendre en compte les\ndispositions du cahier de recommandations environnementales, urbaines, paysagères et\narchitecturales situé en annexe du présent règlement.\nMATERIAUX ET COULEURS :\nLa façade de la construction devra être en harmonie avec les façades avoisinantes.\nL'utilisation de matériaux nus laissés apparents alors qu’ils sont destinés à être recouverts\n(type parpaings, carreaux de plâtre, plaques de ciment non enduits ou tôles) est interdite. La\ncouleur des menuiseries doit être en harmonie avec la couleur des parements.\nFAÇADES :\nTous les murs des constructions doivent présenter une unité d'aspect par façade et une\ncouleur en harmonie avec les constructions existantes dans le voisinage.\nLes pierres de taille, les meulières ou la brique pleine ne peuvent être recouvertes de\nrevêtements, d’enduit ou de peinture, sauf si les contraintes techniques le justifient.\nPLU de Vaucresson    Règlement","    105\nLa couleur et les matériaux des portes de parking doivent leur assurer une bonne insertion\npaysagère.\nTOITURES :\nLes toitures des constructions doivent présenter une simplicité de volume et une unité de\nconception. Les toitures devront être composées soit :\n   o d'un ou plusieurs éléments à pentes, sauf pour les vérandas et les annexes isolées\n    d’une superficie maximale de 20 m² d’emprise au sol.\n   o de toitures terrasses sous réserve d’être végétalisées et non accessibles.\n   o Exceptionnellement, les toits terrasses accessibles sont autorisés :\n    o dans la limite de 4 mètres au-dessus du niveau naturel du sol,\n    o à condition de respecter les distances de vue par rapport aux limites\n    séparatives augmentées de 2 mètres.\nLes couvertures dont l’aspect est comparable à de la tôle ondulée, du fibrociment ou du papier\ngoudronné (shingle) sont interdites.\nLes matériaux de couverture des extensions doivent être en harmonie avec ceux présents\nsur la construction existante. Toutefois, pour les extensions présentant une faible pente, une\ncouverture d’aspect différent ou métallique est admise. Les verrières sont admises pour les\nvérandas.\nLes capteurs solaires ou les panneaux photovoltaïques ainsi que tout autre dispositif de\nproduction d’énergie renouvelable sont autorisés à condition de s’intégrer à la pente du toit et\nà la composition architecturale de la construction (positionnement cohérent avec le traitement\ndes façades, notamment des ouvertures, et préférentiellement en bandeau) ainsi qu’au site.\nCLOTURES :\nLes clôtures doivent être conçues de manière à s'harmoniser par les matériaux avec la ou les\nconstructions existantes sur la propriété, les clôtures existantes de caractère, et le voisinage\nimmédiat dans le respect des préconisations du cahier architectural de Vaucresson. Ces\nclôtures devront être ajourées afin de participer à l’animation paysagère des voies.\nAfin de préserver son patrimoine local et l’harmonisation des clôtures, un dépassement des\nrègles de hauteur maximum imposé ci-après pourra être autorisé.\nLa hauteur totale des clôtures, sur rue comme en limites séparatives, ne doit pas excéder 2\nmètres sauf pour les piliers et les portails qui peuvent atteindre 2,50 mètres ou s'il s'agit de\ns'harmoniser avec l'environnement immédiat.\nEn bordure de l'espace de desserte les clôtures doivent être constituées :\n   o soit par un soubassement maçonné de 0,80 mètre de hauteur maximum, surmonté\n    d’éléments disposés verticalement.,\n   o soit d’une haie végétale d’essences locales diversifiée doublée ou non d’un grillage\n    éventuellement posé sur un soubassement n’excédant pas 0,80 mètre de hauteur.\n   o soit d’un mur en maçonnerie traditionnelle conservé ou restauré. Dans ces murs\n    existants pourront être autorisés un percement n’excédant pas 3 mètres de large pour\n    l’accès automobile et un percement inférieur ou égal à 1,20 mètre de large pour l’accès\n    piéton.\nLes clôtures constituées par un mur plein, non décoratif et ne simulant pas la façade d’un\nbâtiment sont interdites.\nPLU de Vaucresson    Règlement","    106\nEn limite séparative, les clôtures maçonnées (murs, murets, mur-bahuts...) sont interdites.\nAfin de préserver la perméabilité paysagère, elles doivent être constituées :\n   -   soit d’un grillage ou d’une grille,\n   -   soit d’une haie vive.\n   -   Sauf nécessité technique ou liée à l'usage et à la sécurité du site, ces dispositions\n    s'appliquent également aux constructions et installations nécessaires aux services\n    publics ou d'intérêt collectif.\n   -   Des dispositions différentes pourront également être admises pour les clôtures situées\n    entre une propriété privée et un espace public en cas de nécessités liées à l’usage et\n    à la sécurité du site.\nLes clôtures délimitant deux propriétés ne peuvent dépasser une hauteur de 2,20 mètres au-\ndessus du terrain naturel.\nLes clôtures en limites séparatives de propriété et à l'alignement de l’espace de desserte, en\nparpaings, en béton ou plaque de béton préfabriquée non recouverts, ou en matériau ayant\nl’aspect de la tôle, sont interdites.\nDes passages seront créés en pieds de clôture, notamment sur les limites séparatives, afin de\nfaciliter le passage de la petite faune locale.\nLes coffrets et les boites aux lettres doivent être encastrés dans les clôtures. Leur implantation\nen saillie sur l’alignement est interdite.\nDispositions particulières de toute la zone UG :\n   1) Sous réserve de leur compatibilité avec l'environnement tant au regard de leur aspect\n    que de leur fonction, les dispositions mentionnées ci-avant ne s'appliquent pas aux\n    constructions et installations nécessaires aux services publics ou d'intérêt collectif ;\n   2) Les antennes doivent avoir une emprise uniquement sur la parcelle et seront, de\n    préférence, non visibles depuis l’espace public ;\n   3) Les appareillages techniques (climatiseurs, pompes à chaleur...) doivent être intégrés\n    à la construction ;\n   4) Concernant les bâtis remarquables protégés au titre de l’article L.123-1-5 III 2° (Nouv.\n    art. L151-19) du code de l’urbanisme, les travaux de réhabilitation doivent concourir à\n    mettre en valeur ou conforter le caractère originel des bâtiments. Certaines adjonctions\n    partielles peuvent être admises lorsqu’elles participent à la mise en valeur de l’édifice.\nARTICLE UG.12 : OBLIGATIONS IMPOSEES AUX CONSTRUCTEURS EN MATIERE DE\nREALISATION D'AIRES DE STATIONNEMENT\n12.1. - Principes\nLe stationnement des véhicules correspondant aux besoins des constructions et leur\ninstallation doivent être assurés en dehors des voies publiques. Les places de stationnement\nsont réalisées sur le terrain d’assiette de l’opération ou dans son environnement immédiat.\nIl doit être réalisé, à l'occasion de toute construction ou installation nouvelle, des aires de\nstationnement selon les prescriptions édictées au paragraphe 2 ci-après du présent article.\nL’extension d’une construction existante doit respecter les normes de stationnement :\n   1) lorsque l’augmentation de la surface de plancher dépasse 20% de celle de la\n    construction initiale\n   2) en cas de changement d’affectation.\nPLU de Vaucresson    Règlement","    107\nLes constructions neuves à usage principal d’habitation regroupant au moins deux logements,\nà usage principal tertiaire, ou à usage principal de bureaux sont équipés d'un parc de\nstationnement. Une alimentation électrique destinée à la recharge des véhicules, et des places\nde stationnement réservées aux vélos, doivent être prévues (articles R.111-14-2 et suivants\ndu Code de la construction et de l’habitation).\n12.2. - Nombre d'emplacements\n    o 12.2.1. Pour les véhicules motorisés\nConstructions à destination d'habitation pour le logement aidé :\nSelon les dispositions de l’article L.123-1-13 (Nouv. art. L151-35) du Code de l’Urbanisme une\nseule place de stationnement est exigible lors de la construction de logements locatifs financés\navec un prêt aidé de l’Etat.\nDans un rayon de 500 mètres autour de la gare, les obligations en matière de stationnement\nsont réduites à 0,5 place par logement locatifs financés avec un prêt aidé de l’Etat.\nLes logements financés par des prêts locatifs aidés d'intégration (PLAI) sont exonérés de\nréaliser des places de stationnement.\nConstructions à destination d'habitation pour le logement libre :\nIl doit être créé une place de stationnement par tranche de 100 m² de surface de plancher\nentamée, avec un minimum d’une place par logement.\nDans un rayon de 500 mètres autour de la gare, les obligations en matière de stationnement\nsont réduites à 1 place par logement.\nConstructions destinées à l'artisanat :\nIl doit être prévu autant de places de stationnement que de véhicules liés à l’activité\nartisanale.\nConstructions destinées aux bureaux :\nIl est créé une place de stationnement pour 55 m² de surface de plancher.\nCette disposition ne s’applique pas au changement d’affectation.\n    o 12.2.2. Pour les cycles\nConstruction à destination d’habitat collectif :\nIl doit être réservé un emplacement d’une superficie minimale de 1,50 m² par logement pour\nle stationnement des cycles et des poussettes.\nConstructions à destination de bureaux :\nIl doit être réservé pour les cycles un emplacement d’une superficie minimale de 1,5 m² pour\n100m² de surface de plancher pour le stationnement des cycles.\nPLU de Vaucresson    Règlement","    108\nARTICLE UG.13 : OBLIGATIONS IMPOSÉES AUX CONSTRUCTEURS EN MATIÈRE DE\nRÉALISATION D'ESPACES LIBRES, D'AIRES DE JEUX ET DE LOISIRS, ET DE\nPLANTATIONS\nSe référer à la partie 1 du règlement concernant les dispositions générales de l’article 13.\nEn complément des dispositions du présent article, il est fortement recommandé de prendre\nconnaissance et d'appliquer les dispositions inscrites dans le Contrat de l'Arbre, document issu\ndu Guide de gestion contractuelle de l'Arbre des Hauts-de-Seine (annexe 3).\nTout arbre abattu doit être remplacé par un arbre de même envergure. Toutefois, il pourra être\nadmis un choix différent pour tenir compte des éventuelles contraintes de l'environnement\ndans lequel il s'implante (port, envergure, hauteur). Le choix de l'essence doit se faire dans la\nliste des espèces végétales recommandées située en annexe 5 du présent règlement.\nToute construction à édifier au-dessus du sol et/ou en sous-sol doit assurer la préservation\ndurable des spécimens de qualité, identifiés comme élément de paysage et mettre en valeur\nles arbres remarquables repérés au document graphique.\nDans le périmètre des arbres, il est interdit de réduire la perméabilité du sol.\nPleine terre :\nDoit être traité en pleine terre 65% de l’unité foncière.\nDans l’ensemble de la zone et sous réserve de leur compatibilité avec l'environnement tant au\nregard de leur aspect que de leur fonction, le pourcentage applicable pour les constructions et\ninstallations nécessaires aux services publics ou d'intérêt collectif est de 20% minimum (à\nl’échelle de l’unité foncière).\nPlantation :\nUn arbre de moyen développement (hauteur 15/25m – largeur 8/10m) doit être planté, s’il\nn’existe pas déjà, par tranche de 150 m² d’espaces de pleine-terre, en évitant la proximité des\nlimites séparatives.\nDe plus un arbre à grand développement (hauteur 20/30m – largeur 10/20m) doit être planté,\ns’il n’existe déjà, par tranche de 500 m² de pleine-terre, en évitant la proximité des limites\nséparatives.\nLes haies sont implantées en retrait de 1 mètre de la clôture sur voie, afin de ne pas gêner le\npassage des piétons. Elles sont de préférence paysagères, libres, et composées d’au moins\ntrois espèces mélangeant feuillage caduc et persistant.\nEspaces verts :\nLes espaces verts doivent bénéficier d’une conception diversifiée et équilibrée, utilisant les 3\nstrates végétales (herbacée, arbustive et arborée). Les plantations existantes significatives\ndoivent être maintenues. Le choix des essences doit être adapté au lieu, à l’environnement\nproche, aux données écologiques du milieu en privilégiant les espèces indigènes (liste jointe\nen annexe), car mieux adaptées à la géographie et au climat, et doit prohiber les espèces\ninvasives (liste jointe en annexe).\nPLU de Vaucresson    Règlement","    109\nLes espaces libres situés à l’intérieur des marges de retrait des constructions par rapport à\nl’alignement doivent être majoritairement végétalisés et contribuer à l’harmonie paysagère de\nla voie.\nAires de stationnement\nA partir de 4 places de stationnement en surface, il est exigé la réalisation d’un ou de plusieurs\nécrans paysagers, sous la forme d’une haie de végétaux d’une hauteur supérieure ou égale à\n1,50 mètre, destinés à masquer les véhicules, notamment à partir de la voie et des parcelles\nvoisines.\nL’utilisation de matériaux perméables doit être favorisée pour le sol des aires de stationnement.\nARTICLE UG.14 : COEFFICIENT D'OCCUPATION DU SOL\nConformément à l’article L 123-1-11 du code de l’urbanisme, dans les secteurs bâtis des zones\nurbaines issus d’une opération d’aménagement d’ensemble d’un domaine boisé, antérieure\nau XXème siècle, et ayant conservé leur caractère remarquable de parc, le plan local\nd’urbanisme peut comporter des dispositions réglementant la surface de plancher des\nconstructions en fonction de la taille des terrains si la préservation de la qualité des boisements\net espaces verts le justifie.\nLa surface de plancher maximum est limitée à 25% de la superficie de l’unité foncière.\nARTICLE UG.15 : PERFORMANCES ÉNERGÉTIQUES ET ENVIRONNEMENTALES\nIl est recommandé que les constructions prennent en compte tout ou partie des objectifs du\ndéveloppement durable et de la préservation de l’environnement suivants tout en s’inscrivant\nen harmonie avec le paysage urbain existant par :\n   o l’utilisation de matériaux renouvelables, récupérables, recyclables ;\n   o l’intégration de dispositifs de récupération de l’eau de pluie ;\n   o l’installation de dispositifs de production d’énergie renouvelable pour\n    l’approvisionnement énergétique des constructions (chaudière bois, eau chaude\n    sanitaire solaire, pompes à chaleur, photovoltaïque, géothermie…) ;\n   o l’orientation des constructions pour favoriser la récupération des apports solaires et\n    valoriser la lumière naturelle afin de limiter les dépenses énergétiques ;\nLes équipements liés aux énergies renouvelables (capteurs solaires, panneaux\nphotovoltaïques, …) doivent être intégrés et adaptés à la composition architecturale des\nconstructions et à leur environnement patrimonial et paysager.\nARTICLE UG.16    :   INFRASTRUCTURES    ET   RÉSEAUX    DE    COMMUNICATION\nNUMÉRIQUE\nPour toute construction ou installation nouvelle qui implique une utilisation de moyens de\ncommunication son raccordement au réseau de communication numérique doit être prévu.\nDans le cas où la Commune viendrait à disposer de nouveaux réseaux de distribution, le\nraccordement à ces réseaux sera imposé aux constructions neuves. .\nPLU de Vaucresson    Règlement","    110\n  DISPOSITIONS APPLICABLES A LA ZONE UL\n  DISPOSITIONS APPLICABLES A LA ZONE UL\nExtrait du rapport de présentation :\n« La zone UL correspond aux espaces à vocation de sport, culture, loisirs et éducation\ncorrespondant au Haras Lupin, au Haras de Jardy, aux terrains Yves du Manoir et au Golf de\nSaint-Cloud. Cette zone comprend un secteur ULa correspondant aux constructions et\ninstallations sur ces espaces et aux secteurs où des possibilités de construire y sont\nouvertes. ».\nLes dispositions applicables à la zone UL et détaillées dans les articles 1 à 16 sont\ncomplémentaires de la Partie 1 - Dispositions générales. Il est nécessaire de prendre\nconnaissance de l'ensemble des dispositions en amont des projets.\nARTICLE UL. 1 : OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\nSont interdits dans l’ensemble de la zone toutes les occupations et utilisations du sol ne\nsatisfaisant pas aux prescriptions de l’article UL.2.\nToute construction nouvelle est interdite dans les \"lisières à protéger\" indiquées aux documents\ngraphiques du règlement.\nTout abattage d’arbre doit faire l’objet d’une autorisation.\nARTICLE UL. 2 : OCCUPATIONS ET UTILISATIONS DU SOL SOUMISES A DES\nCONDITIONS PARTICULIÈRES\nDans toute la zone :\nLes constructions, ouvrages ou travaux sont autorisés à condition d’être liés aux différents\nréseaux, à la voirie ou à la distribution d’énergie (ex : transformateurs).\nLes affouillements et exhaussements du sol sont autorisés à condition d’être liés :\n    o   à une occupation du sol autorisée dans la zone,\n    o   ou à des aménagements paysagers,\n    o   ou à des aménagements hydrauliques,\n    o   ou à des travaux d’infrastructures routières, de transports collectifs, de circulation\n    douce ou d’aménagement d’espace public,\n    o   ou qu’elle contribue à la mise en valeur du paysage, d’un site ou d’un vestige\n    archéologique. L’abattage d’un arbre remarquable identifié dans le document\n    graphique du règlement et préservé au titre de l’article L.123 1-5 III 2° (Nouv. art. L151-\n    23) du code de l’urbanisme\n    o   et à condition, pour les opérations de construction, de ne pas dépasser 0,50m de\n    hauteur.\nLes équipements de constructions, installations, ouvrages techniques et aménagements\nnécessaires au fonctionnement des services publics ou d’intérêt collectif.\nPLU de Vaucresson    Règlement","    111\nDans le Secteur ULa :\nLes constructions, aménagements et installations liées à la vocation de sport, détente, culture,\nloisirs ou éducation ou qui constituent les structures d’accueil indispensables à l’exploitation\net à la maintenance de la vocation de la zone sont autorisés :\n   o L’habitation, à condition qu’elle soit destinée aux personnes dont la présence est\n    indispensable pour assurer le fonctionnement ou le gardiennage des activités\n    autorisées dans la zone.\n   o L’artisanat, le commerce, la restauration, les entrepôts dans la limite de 25% de\n    l’emprise au sol de la construction, ou les bureaux à condition qu’ils soient liés à\n    l’exploitation de la vocation de la zone\n   o La création, l’extension et la modification des installations classées pour la protection\n    de l'environnement soumises à déclaration, à condition que les nécessités de leur\n    fonctionnement lors de leur ouverture, comme à terme, soient compatibles avec les\n    infrastructures existantes.\nARTICLE UL. 3 : CONDITIONS DE DESSERTE DES TERRAINS PAR LES VOIES\nPUBLIQUES OU PRIVÉES ET D'ACCÈS AUX VOIES OUVERTES AU PUBLIC\nPour être constructible, un terrain doit avoir un accès à une voie publique ou privée ouverte à\nla circulation automobile et en état de viabilité. Afin que les caractéristiques des accès\npermettent de satisfaire aux exigences de la sécurité, de la défense contre l'incendie et de la\nprotection civile, ceux-ci devront avoir une largeur supérieure ou égale à 3,5 mètres\nCette sécurité des accès doit être appréciée compte tenu notamment de la position des accès,\nde leur configuration ainsi que de la nature et de l’intensité du trafic.\nLes accès doivent être situés en des points les plus éloignés possibles des carrefours\nexistants, des virages et autres endroits où la visibilité est mauvaise. Lorsque le terrain est\nriverain de plusieurs voies, l’accès sur celles de ces voies qui présente le plus de risques pour\nla circulation peut être interdit.\nLes voies se terminant en impasse doivent être aménagées afin de permettre aux véhicules\nde sécurité de faire demi-tour.\nLe nombre d’entrée charretières depuis une voie publique sur un terrain est limité à un par\ntranche entamée de 30 mètres à l’alignement. Exceptionnellement une unique entrée\ncharretière pourra être autorisée, au-delà des limitations fixées ci-avant, dans le cas des\ngarages donnant sur voie.\nARTICLE UL. 4 : CONDITIONS DE DESSERTE DES TERRAINS PAR LES RÉSEAUX\nPUBLICS D'EAU, D'ÉLECTRICITÉ ET D'ASSAINISSEMENT\nLa compétence assainissement est exercée par l’établissement public territorial Paris Ouest\nLa Défense.\nAlimentation en eau potable\nToute construction ou installation nouvelle qui, par sa destination, implique une utilisation d'eau\npotable, doit obligatoirement être alimentée par branchement à un réseau collectif de\ndistribution.\nPLU de Vaucresson    Règlement","    112\nAssainissement des eaux usées et pluviales\nPour consulter l’ensemble des dispositions relatives à l’assainissement, se référer aux\ndispositions générales du présent règlement, « Article 10 : PRECISIONS DE DEFINITIONS\nDE CERTAINS ARTICLES ».\nRéseaux divers\nLe raccordement des constructions aux réseaux concessionnaires (télécommunication,\nélectricité basse tension) doit être en souterrain jusqu'à la limite du domaine public en un point\nà déterminer en accord avec le service gestionnaire.\nDans les opérations d'ensemble telles que lotissement ou ensemble de constructions\ngroupées, la desserte des réseaux intérieurs doit être enterrée.\nDéchets\nDes locaux techniques de superficie suffisante doivent être prévus ou aménagés pour\naccueillir les conteneurs nécessaires à la collecte sélective des déchets ménagers. Ces locaux\ndoivent être facilement accessibles par les résidents.\nARTICLE UL. 5 : SUPERFICIE MINIMALE DES TERRAINS CONSTRUCTIBLES\nSans objet.\nARTICLE UL. 6 : IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX VOIES\nPUBLIQUES ET PRIVEES\nLes constructions nouvelles, hors clôtures et annexes s’implantent en retrait de l’alignement\ndes voies publiques en respectant une marge de recul de 10 mètres minimum.\nDispositions particulières de toute la zone UL :\n   1) Des implantations en retrait autres que celles définies ci-dessus peuvent être admises\n    ou imposées pour la réalisation des équipements techniques liés aux différents réseaux\n    dès lors qu'ils sont intégrés au site environnant.\n   2) Les saillies sur voie ne peuvent être situées à moins de 5 mètres au-dessus du niveau\n    de la voie, ni présenter une saillie sur alignement de plus de 0,80 mètre. Les éléments\n    de modénature en saillie sont acceptés sous réserve d’une justification architecturale\n    qualitative ;\n   3) En cas de division de terrain, les voies créées doivent être implantées de façon à\n    préserver l’ordonnancement architectural du bâti existant ainsi que l’équilibre de la\n    composition entre le bâti et l’espace végétalisé du terrain ;\n   4) Une implantation autre que celles autorisées peut être accordée si cela permet une\n    implantation de la construction en continuité d’une construction existante ;\n   5) Un retrait de l’alignement des voies et emprises publiques ou privées ainsi que des\n    cours communes différent de celui imposé pourra être admis ou imposé afin d’améliorer\n    l’intégration du projet dans son environnement immédiat ou lorsqu'une échappée\n    visuelle sur un espace libre le justifie ;\n   6) Si le projet architectural le justifie et participe à l’animation paysagère, des retraits et\n    avancées ponctuelles pourront être autorisés ;\n   7) Exceptionnellement, les annexes, hors locaux techniques, pourront s’implanter en\n    limites de voies, leur hauteur maximum ne dépasse pas 3,2 mètres au faîtage et une\n    emprise au sol maximale de 25m². Cette disposition n’est applicable qu’une seule fois.\nPLU de Vaucresson    Règlement","    113\n   8) Sous réserve de leur compatibilité avec l'environnement tant au regard de leur aspect\n    que de leur fonction, les constructions et installations nécessaires aux services publics\n    ou d’intérêt collectif s’implantent soit :\n    •    à l’alignement des voies publiques ou privées,\n    •    en retrait de l’alignement sur voies publiques ou privées en\n    respectant une marge de recul de 1 mètre minimum.\nARTICLE UL. 7 : IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX LIMITES\nSEPARATIVES\nLes constructions, hors clôtures et annexes s’implantent en retrait des limites séparatives, en\nrespectant une marge de recul de 10 mètres minimum.\nDispositions particulières de toute la zone UL :\n   1) L'implantation des constructions par rapport à une cour commune se fera en\n    appliquant les mêmes règles que pour les limites séparatives décrites ci-dessus.\n   2) Sous réserve de leur compatibilité avec l'environnement tant au regard de leur aspect\n    que de leur fonction, les constructions et installations nouvelles nécessaires aux\n    services publics ou d'intérêt collectif s’implantent soit :\n    -   sur une ou plusieurs limites séparatives,\n    -   en retrait des limites séparatives en respectant une marge de recul de 2\n    mètres minimum en cas de façades sans vue et 4m minimum en présence de\n    façades avec vues.\nARTICLE UL. 8 : IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT\nAUX AUTRES SUR UNE MÊME PROPRIÉTÉ\nNon réglementé.\nARTICLE UL. 9 : EMPRISE AU SOL DES CONSTRUCTIONS\n   -   Dans la zone, hors secteur ULa :\nL’emprise au sol des constructions n’excède pas 1% de la superficie du terrain.\n   -   Dans le secteur ULa :\nL’emprise au sol des constructions n’excède pas 70% de la superficie du terrain situé en\nzone ULa,\n   -   Dans toute la zone :\nSous réserve de leur compatibilité avec l'environnement tant au regard de leur aspect que de\nleur fonction, ces dispositions ne s’appliquent pas aux constructions et installations\nnécessaires aux services publics ou d'intérêt collectif.\nPLU de Vaucresson    Règlement","    114\nARTICLE UL. 10 : HAUTEUR MAXIMUM DES CONSTRUCTIONS\nLa hauteur des constructions est mesurée à partir du terrain naturel jusqu'au point le plus\nélevé de la construction (faîtage ou acrotère) ou sur mention spécifique jusqu’à l’égout du\ntoit.\nLa hauteur des constructions ne doit pas excéder 10 mètres au faîtage ou à l’acrotère pour\nles toitures-terrasses.\nDispositions particulières de toute la zone UL :\n   1) Sous réserve de leur compatibilité avec l'environnement tant au regard de leur aspect\n    que de leur fonction, des hauteurs différentes de celles fixées aux paragraphes ci-\n    dessus peuvent être autorisées ou imposées, lorsqu'il s'agit des constructions et\n    installations nécessaires aux services publics ou d'intérêt collectif.\n   2) Les éléments de modénature et les garde-corps à claire-voie peuvent dépasser la\n    hauteur maximale des façades dans une limite de 1,00 mètre ;\n   3) Les éléments de constructions sur terrasses ne sont pas comptés dans la hauteur\n    maximale autorisée, à condition que ceux-ci ne dépassent pas une hauteur maximum\n    de 1,00 m, qu’ils soient implantés en retrait des façades d’une distance d’au moins 3,00\n    m et qu’ils abritent uniquement la machinerie des ascenseurs, la sortie des escaliers,\n    la chaufferie et le conditionnement d’air, les gaines de ventilation, les souches de\n    cheminées ;\n   4) Dans le cas des annexes, la hauteur maximale est limitée à 3,20 mètres au faitage ;\n   5) En cas de terrain en pente, les hauteurs maximums autorisées devront être respectées\n    en tout point de l’emprise au sol de la construction vis-à-vis du terrain naturel. Des\n    dépassements ponctuels pourront être autorisés si ceux-ci ont pour effet de permettre\n    un lissage des hauteurs de la construction.\nARTICLE UL. 11 : ASPECT EXTÉRIEUR DES CONSTRUCTIONS ET AMÉNAGEMENT DE\nLEURS ABORDS\nLes constructions doivent présenter un aspect compatible avec le caractère du site et les\npaysages dans lesquelles elles s’insèrent. Elles ne doivent pas porter atteinte au caractère ou\nà l’intérêt des lieux avoisinants, des sites et des paysages naturels ou urbains.\nEn amont de tout projet d’aménagement et/ou de construction, il est fortement recommandé\nde se reporter et de prendre en compte les dispositions du cahier de recommandations\nenvironnementales, urbaines, paysagères et architecturales situé en annexe du présent\nrèglement.\nCLOTURES :\nLa hauteur totale des clôtures, sur rue comme en limites séparatives, ne doit pas excéder 2\nmètres sauf pour les piliers et les portails qui pourront atteindre 2,50 mètres ou s’il s’agit de\ns’harmoniser avec l’environnement immédiat.\nEn limites séparatives, les clôtures maçonnées (murs, murets, mur-bahuts...) sont interdites.\nLa réalisation d'une clôture végétalisée est à privilégier afin de préserver la perméabilité\npaysagère. Sauf nécessité technique ou liée à l'usage et à la sécurité du site, ces dispositions\ns'appliquent également aux constructions et installations nécessaires aux services publics ou\nd'intérêt collectif. Des dispositions différentes pourront également être admises pour les\nclôtures situées entre une propriété privée et un espace public en cas de nécessités liées à\nl’usage et à la sécurité du site.\nPLU de Vaucresson    Règlement","    115\nDispositions particulières de toute la zone UL :\nSous réserve de leur compatibilité avec l'environnement tant au regard de leur aspect que de\nleur fonction, les dispositions mentionnées ci-avant ne s'appliquent pas aux constructions et\ninstallations nécessaires aux services publics ou d'intérêt collectif.\nARTICLE UL. 12 : OBLIGATIONS IMPOSEES AUX CONSTRUCTEURS EN MATIERE DE\nREALISATION D'AIRES DE STATIONNEMENT\n12.1. - Principes\nLe stationnement des véhicules correspondant aux besoins des constructions et leur\ninstallation doit être assuré en dehors des voies publiques. Les places de stationnement sont\nréalisées sur le terrain d’assiette de l’opération ou dans son environnement immédiat.\nIl doit être réalisé, à l'occasion de toute construction ou installation nouvelle, des aires de\nstationnement selon les prescriptions édictées au paragraphe 2 ci-après du présent article.\nL’extension d’une construction existante doit respecter les normes de stationnement :\n    1) lorsque l’augmentation de la surface de plancher dépasse 20% de celle de la\n    construction initiale\n    2) en cas de changement d’affectation.\nLes constructions neuves à usage principal d’habitation regroupant au moins deux logements,\nà usage principal tertiaire, ou à usage principal de bureaux sont équipés d'un parc de\nstationnement. Une alimentation électrique destinée à la recharge des véhicules, et des places\nde stationnement réservées aux vélos, doivent être prévues (articles R.111-14-2 et suivants\ndu Code de la construction et de l’habitation).\n12.2. - Nombre d'emplacements\n   o 12.2.1. Pour les véhicules motorisés\nLe nombre de places de stationnement à aménager doit être déterminé en tenant compte de\nla nature, de la situation géographique, de la fréquentation de la construction ainsi que des\nstationnements publics situés à proximité.\nLe stationnement des véhicules des usagers, du personnel et des visiteurs, doit être\ncomplètement assuré sur le site.\n   o 12.2.2. Pour les cycles\nIl doit être réservé pour les cycles un emplacement d’une superficie minimale de 1,5 m² pour\n100 m² de surface de plancher pour le stationnement des cycles.\nARTICLE UL.13 : OBLIGATIONS IMPOSÉES AUX CONSTRUCTEURS EN MATIÈRE DE\nRÉALISATION D'ESPACES LIBRES, D'AIRES DE JEUX ET DE LOISIRS, ET DE\nPLANTATIONS\nSe référer à la partie 1 du règlement concernant les dispositions générales de l’article 13.\nEn complément des dispositions du présent article, il est fortement recommandé de prendre\nconnaissance et d'appliquer les dispositions inscrites dans le Contrat de l’Arbre, document\nissu du Guide de gestion contractuelle de l'Arbre des Hauts-de-Seine (annexe 3).\nPLU de Vaucresson    Règlement","    116\nTout arbre abattu doit être remplacé par un arbre de même envergure. Toutefois, il pourra être\nadmis un choix différent pour tenir compte des éventuelles contraintes de l'environnement\ndans lequel il s'implante (port, envergure, hauteur). Le choix de l'essence doit se faire dans la\nliste des espèces végétales recommandées située en annexe 5 du présent règlement.\nToute construction à édifier au-dessus du sol et/ou en sous-sol doit assurer la préservation\ndurable des spécimens de qualité, identifiés comme élément de paysage et mettre en valeur\nles arbres remarquables repérés au document graphique.\nEn règle générale, toutes les mesures doivent être prises pour conserver, protéger et conforter\nles boisements et espaces verts.\nPleine terre :\nDoit être traité en pleine terre : 90% de l’unité foncière. Les espaces imperméabilisés tels que\nles équipements sportifs et des aménagements routiers sont exclus des espaces libres.\nDans l’ensemble de la zone et sous réserve de leur compatibilité avec l'environnement tant au\nregard de leur aspect que de leur fonction, le pourcentage applicable pour les constructions et\ninstallations nécessaires aux services publics ou d'intérêt collectif est de 20% minimum (à\nl’échelle de l’unité foncière).\nPlantation :\nUn arbre de moyen développement (hauteur 15/25m – largeur 8/10m) doit être planté, s’il\nn’existe pas déjà, par tranche de 150 m² d’espaces de pleine-terre, en évitant la proximité des\nlimites séparatives.\nDe plus un arbre à grand développement (hauteur 20/30m – largeur 10/20m) doit être planté,\ns’il n’existe déjà, par tranche de 500 m² de pleine-terre, en évitant la proximité des limites\nséparatives.\nDans le périmètre de protection des arbres, il est interdit de réduire la perméabilité du sol.\nLes haies sont implantées en retrait de 1 mètre de la clôture sur voie, afin de ne pas gêner le\npassage des piétons. Elles sont de préférence paysagères, libres, et composées d’au moins\ntrois espèces mélangeant feuillage caduc et persistant.\nEspaces verts :\nLes espaces verts doivent bénéficier d’une conception diversifiée et équilibrée, utilisant les 3\nstrates végétales (herbacée, arbustive et arborée). Les plantations existantes significatives\ndoivent être maintenues. Le choix des essences doit être adapté au lieu, à l’environnement\nproche, aux données écologiques du milieu en privilégiant les espèces indigènes (liste jointe\nen annexe), car mieux adaptées à la géographie et au climat, et doit prohiber les espèces\ninvasives (liste jointe en annexe).\nLes espaces libres situés à l’intérieur des marges de retrait des constructions par rapport à\nl’alignement doivent être majoritairement végétalisés et contribuer à l’harmonie paysagère de\nla voie.\nAires de stationnement\nA partir de 4 places de stationnement en surface, il est exigé la réalisation d’un ou de plusieurs\nécrans paysagers, sous la forme d’une haie de végétaux d’une hauteur supérieure ou égale à\n1,50 mètre, destinés à masquer les véhicules, notamment à partir de la voie et des parcelles\nvoisines.\nPLU de Vaucresson    Règlement","    117\nAu-delà de 20 places, l’aire de stationnement doit être divisée par des rangée d’arbres afin\nd’améliorer l’aspect et d’en réduire les nuisances.\nL’utilisation de matériaux perméables doit être favorisée pour le sol des aires de stationnement.\nARTICLE UL. 14 : COEFFICIENT D'OCCUPATION DU SOL\nSans objet.\nARTICLE UL. 15 : PERFORMANCES ÉNERGÉTIQUES ET ENVIRONNEMENTALES\nIl est recommandé que les constructions prennent en compte tout ou partie des objectifs du\ndéveloppement durable et de la préservation de l’environnement suivants tout en s’inscrivant\nen harmonie avec le paysage urbain existant par :\n   o l’utilisation de matériaux renouvelables, récupérables, recyclables ;\n   o l’intégration de dispositifs de récupération de l’eau de pluie ;\n   o l’installation de dispositifs de production d’énergie renouvelable pour\n    l’approvisionnement énergétique des constructions (chaudière bois, eau chaude\n    sanitaire solaire, pompes à chaleur, photovoltaïque, géothermie…) ;\n   o l’orientation des constructions pour favoriser la récupération des apports solaires et\n    valoriser la lumière naturelle afin de limiter les dépenses énergétiques ;\nLes équipements liés aux énergies renouvelables (capteurs solaires, panneaux\nphotovoltaïques, vérandas…) doivent être intégrés et adaptés à la composition architecturale\ndes constructions et à leur environnement patrimonial et paysager.\nARTICLE UL.    16   : INFRASTRUCTURES    ET RÉSEAUX    DE COMMUNICATION\nNUMÉRIQUE\nNon réglementé.\nPLU de Vaucresson    Règlement","    118\nPARTIE 3\nDISPOSITIONS APPLICABLES AUX\nZONES NATURELLES\nPARTIE 3DISPOSITIONS\nPLU de Vaucresson   Règlement","    119\n   DISPOSITIONS APPLICABLES A LA ZONE N\n   DISPOSITIONS APPLICABLES A LA ZONE N\nExtrait du rapport de présentation :\nLa zone N correspond au massif boisé, à la Coulée Verte (promenade des quatre forêts) et à\nla plaine de Beauvillier.\nLes dispositions applicables à la zone N et détaillées dans les articles 1 à 16 sont\ncomplémentaires de la Partie 1 - Dispositions générales. Il est nécessaire de prendre\nconnaissance de l'ensemble des dispositions en amont des projets.\nARTICLE N.1 : OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\nSont interdits dans l’ensemble de la zone toutes les occupations et utilisations du sol ne\nsatisfaisant pas aux prescriptions de l’article N.2.\nToute construction nouvelle est interdite dans les « lisières à protéger » indiquées au\ndocument graphique du règlement.\nSont également interdits :\n   -    L’abattage d’un arbre remarquable identifié dans le document graphique du\n    règlement et préservé au titre de l’article l’article L.123 1-5 III 2° (Nouv. art. L151-23)\n    du code de l’urbanisme,\n   -    Tout abattage d’arbre n’ayant pas fait l’objet d’une autorisation,\n   -    Le non-respect des prescriptions liées aux bâtis remarquables.\nARTICLE N.2 : OCCUPATIONS ET UTILISATIONS DU SOL SOUMISES A DES\nCONDITIONS PARTICULIÈRES\nDans toute la zone :\nLes constructions, ouvrages ou travaux sont autorisés à condition d’être liés aux différents\nréseaux, à la voirie ou à la distribution d’énergie (ex : transformateurs).\nLes affouillements et exhaussements du sol sont autorisés à condition d’être liés :\n    o   à une occupation du sol autorisée dans la zone,\n    o   ou à des aménagements paysagers,\n    o   ou à des aménagements hydrauliques,\n    o   ou à des travaux d’infrastructures routières, de transports collectifs, de circulation\n    douce ou d’aménagement d’espace public,\n    oou qu’elle contribue à la mise en valeur du paysage, d’un site ou d’un vestige\n    archéologique.\n   o et à condition, pour les opérations de construction, de ne pas dépasser 0,50m de\n    hauteur.\nLes constructions et installations nécessaires à des équipements collectifs ou à des services\npublics, dès lors qu'ils ne sont pas incompatibles avec l'exercice d'une activité agricole,\npastorale ou forestière dans l'unité foncière où elles sont implantées et qu'elles ne portent pas\natteinte à la sauvegarde des espaces naturels et des paysages.\nPLU de Vaucresson    Règlement","    120\nARTICLE N.3 : CONDITIONS DE DESSERTE DES TERRAINS PAR LES VOIES\nPUBLIQUES OU PRIVÉES ET D'ACCÈS AUX VOIES OUVERTES AU PUBLIC\nPour être constructible, un terrain doit avoir un accès à une voie publique ou privée ouverte à\nla circulation automobile et en état de viabilité. Afin que les caractéristiques des accès\npermettent de satisfaire aux exigences de la sécurité, de la défense contre l'incendie et de la\nprotection civile, ceux-ci devront avoir une largeur supérieure ou égale à 3,5 mètres\nCette sécurité des accès doit être appréciée compte tenu notamment de la position des accès,\nde leur configuration ainsi que de la nature et de l’intensité du trafic.\nLes accès doivent être situés en des points les plus éloignés possibles des carrefours\nexistants, des virages et autres endroits où la visibilité est mauvaise. Lorsque le terrain est\nriverain de plusieurs voies, l’accès sur celles de ces voies qui présente le plus de risques pour\nla circulation peut être interdit.\nLes voies se terminant en impasse doivent être aménagées afin de permettre aux véhicules\nde sécurité de faire demi-tour.\nLe nombre d’entrée charretières depuis une voie publique sur un terrain est limité à un par\ntranche entamée de 30 mètres à l’alignement. Exceptionnellement une unique entrée\ncharretière pourra être autorisée, au-delà des limitations fixées ci-avant, dans le cas des\ngarages donnant sur voie.\nARTICLE N.4 : CONDITIONS DE DESSERTE DES TERRAINS PAR LES RÉSEAUX\nPUBLICS D'EAU, D'ÉLECTRICITÉ ET D'ASSAINISSEMENT\nLa compétence assainissement est exercée par l’établissement public territorial Paris Ouest\nLa Défense.\nAlimentation en eau potable\nToute construction ou installation nouvelle qui, par sa destination, implique une utilisation d'eau\npotable, doit obligatoirement être alimentée par branchement à un réseau collectif de\ndistribution.\nAssainissement des eaux usées et pluviales\nPour consulter l’ensemble des dispositions relatives à l’assainissement, se référer aux\ndispositions générales du présent règlement, « Article 10 : PRECISIONS DE DEFINITIONS\nDE CERTAINS ARTICLES ».\nRéseaux divers\nLe raccordement des constructions aux réseaux concessionnaires (télécommunication,\nélectricité basse tension) doit être en souterrain jusqu'à la limite du domaine public en un point\nà déterminer en accord avec le service gestionnaire.\nDans les opérations d'ensemble telles que lotissement ou ensemble de constructions\ngroupées, la desserte des réseaux intérieurs doit être enterrée.\nDéchets\nDes locaux techniques de superficie suffisante doivent être prévus ou aménagés pour\naccueillir les conteneurs nécessaires à la collecte sélective des déchets ménagers. Ces locaux\ndoivent être facilement accessibles par les résidents.\nPLU de Vaucresson    Règlement","    121\nARTICLE N.5 : SUPERFICIE MINIMALE DES TERRAINS CONSTRUCTIBLES\nSans objet.\nARTICLE N.6 : IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX VOIES\nPUBLIQUES ET PRIVEES\nLes constructions nouvelles, hors clôtures et annexes s’implantent en retrait de l’alignement\ndes voies publiques en respectant une marge de recul de 10 mètres minimum.\nDispositions particulières de toute la zone N :\n   1) des implantations en retrait autres que celles définies ci-dessus peuvent être admises\n    ou imposées pour la réalisation des équipements techniques liés aux différents réseaux\n    dès lors qu'ils sont intégrés au site environnant.\n   2) Les saillies sur voie ne peuvent être situées à moins de 5 mètres au-dessus du niveau\n    de la voie, ni présenter une saillie sur alignement de plus de 0,80 mètre. Les éléments\n    de modénature en saillie sont acceptés sous réserve d’une justification architecturale\n    qualitative ;\n   3) En cas de division de terrain, les voies créées doivent être implantées de façon à\n    préserver l’ordonnancement architectural du bâti existant ainsi que l’équilibre de la\n    composition entre le bâti et l’espace végétalisé du terrain ;\n   4) Si le projet architectural le justifie et participe à l’animation paysagère, des retraits et\n    avancées ponctuelles pourront être autorisés ;\n   5) Sous réserve de leur compatibilité avec l'environnement tant au regard de leur aspect\n    que de leur fonction, les constructions et installations nécessaires aux services publics\n    ou d’intérêt collectif s’implantent soit :\n    • à l’alignement des voies publiques ou privées,\n    • en retrait de l’alignement sur voies publiques ou privées en\n    respectant une marge de recul de 1 mètre minimum.\nARTICLE N.7 : IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX LIMITES\nSEPARATIVES\nLes constructions, hors clôtures et annexes s’implantent en retrait des limites séparatives, en\nrespectant une marge de recul de 10 mètres minimum.\nDispositions particulières de toute la zone N :\n   1) L'implantation des constructions par rapport à une cour commune se fera en\n    appliquant les mêmes règles que pour les limites séparatives décrites ci-dessus.\n   2) Sous réserve de leur compatibilité avec l'environnement tant au regard de leur aspect\n    que de leur fonction, les constructions et installations nouvelles nécessaires aux\n    services publics ou d'intérêt collectif s’implantent soit :\n    - sur une ou plusieurs limites séparatives,\n    - en retrait des limites séparatives en respectant une marge de recul de 2 mètres\n    minimum en cas de façades sans vue et 4m minimum en présence de façades\n    avec vues.\nPLU de Vaucresson    Règlement","    122\nARTICLE N.8 : IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT AUX\nAUTRES SUR UNE MÊME PROPRIÉTÉ\nNon réglementé.\nARTICLE N.9 : EMPRISE AU SOL DES CONSTRUCTIONS\nL’emprise au sol des constructions n’excède pas 1% de la superficie du terrain.\nDispositions particulières de toute la zone N :\nSous réserve de leur compatibilité avec l'environnement tant au regard de leur aspect que de\nleur fonction, ces dispositions ne s’appliquent pas aux constructions et installations\nnécessaires aux services publics ou d'intérêt collectif.\nARTICLE N.10 : HAUTEUR MAXIMUM DES CONSTRUCTIONS\nLa hauteur des constructions est mesurée à partir du terrain naturel jusqu'au point le plus\nélevé de la construction (faîtage ou acrotère) ou sur mention spécifique jusqu’à l’égout du\ntoit.\nLa hauteur des constructions ne doit pas excéder 10 mètres au faîtage ou à l’acrotère pour\nles toitures-terrasses.\nDispositions particulières de toute la zone N :\n   1) Sous réserve de leur compatibilité avec l'environnement tant au regard de leur aspect\n    que de leur fonction, des hauteurs différentes de celles fixées aux paragraphes ci-\n    dessus peuvent être autorisées ou imposées, lorsqu'il s'agit des constructions et\n    installations nécessaires aux services publics ou d'intérêt collectif.\n   2) Les éléments de modénature et les garde-corps à claire-voie peuvent dépasser la\n    hauteur maximale des façades dans une limite de 1,00 mètre ;\n   3) Les éléments de constructions sur terrasses ne sont pas comptés dans la hauteur\n    maximale autorisée, à condition que ceux-ci ne dépassent pas une hauteur maximum\n    de 1,00 m, qu’ils soient implantés en retrait des façades d’une distance d’au moins 3,00\n    m et qu’ils abritent uniquement la machinerie des ascenseurs, la sortie des escaliers,\n    la chaufferie et le conditionnement d’air, les gaines de ventilation, les souches de\n    cheminées ;\n   4) Dans le cas des annexes, la hauteur maximale est limitée à 3,20 mètres au faitage ;\n   5) En cas de terrain en pente, les hauteurs maximums autorisées devront être respectées\n    en tout point de l’emprise au sol de la construction vis-à-vis du terrain naturel. Des\n    dépassements ponctuels pourront être autorisés si ceux-ci ont pour effet de permettre\n    un lissage des hauteurs de la construction.\nPLU de Vaucresson    Règlement","    123\nARTICLE N.11 : ASPECT EXTERIEUR DES CONSTRUCTIONS ET AMENAGEMENT DE\nLEURS ABORDS\nLes constructions doivent présenter un aspect compatible avec le caractère du site et les\npaysages dans lesquelles elles s’insèrent. Elles ne doivent pas porter atteinte au caractère ou\nà l’intérêt des lieux avoisinants, des sites et des paysages naturels ou urbains.\nEn amont de tout projet d’aménagement et/ou de construction, il est fortement recommandé\nde se reporter et de prendre en compte les dispositions du cahier de recommandations\nenvironnementales, urbaines, paysagères et architecturales situé en annexe du présent\nrèglement.\nCLOTURES :\nLa hauteur totale des clôtures, sur rue comme en limites séparatives, ne doit pas excéder 2\nmètres sauf pour les piliers et les portails qui pourront atteindre 2,50 mètres ou s’il s’agit de\ns’harmoniser avec l’environnement immédiat.\nEn limites séparatives, les clôtures maçonnées (murs, murets, mur-bahuts...) sont interdites.\nLa réalisation d'une clôture végétalisée est à privilégier afin de préserver la perméabilité\npaysagère. Sauf nécessité technique ou liée à l'usage et à la sécurité du site, ces dispositions\ns'appliquent également aux constructions et installations nécessaires aux services publics ou\nd'intérêt collectif. Des dispositions différentes pourront également être admises pour les\nclôtures situées entre une propriété privée et un espace public en cas de nécessités liées à\nl’usage et à la sécurité du site.\nDispositions particulières de toute la zone N :\nSous réserve de leur compatibilité avec l'environnement tant au regard de leur aspect que de\nleur fonction, les dispositions mentionnées ci-avant ne s'appliquent pas aux constructions et\ninstallations nécessaires aux services publics ou d'intérêt collectif.\nARTICLE N.12 : OBLIGATIONS IMPOSEES AUX CONSTRUCTEURS EN MATIERE DE\nREALISATION D'AIRES DE STATIONNEMENT\n12.1. - Principes\nLe stationnement des véhicules correspondant aux besoins des constructions et leur\ninstallation doit être assuré en dehors des voies publiques. Les places de stationnement sont\nréalisées sur le terrain d’assiette de l’opération ou dans son environnement immédiat.\nIl doit être réalisé, à l'occasion de toute construction ou installation nouvelle, des aires de\nstationnement selon les prescriptions édictées au paragraphe 2 ci-après du présent article.\nL’extension d’une construction existante doit respecter les normes de stationnement :\n   1) Lorsque l’augmentation de la surface de plancher dépasse 20% de celle de la\n    construction initiale\n   2) En cas de changement d’affectation.\nLes constructions neuves à usage principal d’habitation regroupant au moins deux logements,\nà usage principal tertiaire, ou à usage principal de bureaux sont équipés d'un parc de\nstationnement. Une alimentation électrique destinée à la recharge des véhicules, et des places\nde stationnement réservées aux vélos, doivent être prévues (articles R.111-14-2 et suivants\ndu Code de la construction et de l’habitation).\nPLU de Vaucresson    Règlement","    124\n12.2. - Nombre d'emplacements\n   o 12.2.1. Pour les véhicules motorisés\nLe nombre de places de stationnement à aménager doit être déterminé en tenant compte de\nla nature, de la situation géographique, de la fréquentation de la construction ainsi que des\nstationnements publics situés à proximité.\nLe stationnement des véhicules des usagers, du personnel et des visiteurs, doit être\ncomplètement assuré sur le site.\n   o 12.2.2. Pour les cycles\nIl doit être réservé pour les cycles un emplacement d’une superficie minimale de 1.5 m² pour\n100 m² de surface de plancher pour le stationnement des cycles.\nARTICLE N.13 : OBLIGATIONS IMPOSÉES AUX CONSTRUCTEURS EN MATIÈRE DE\nRÉALISATION D'ESPACES LIBRES, D'AIRES DE JEUX ET DE LOISIRS, ET DE\nPLANTATIONS\nSe référer à la partie 1 du règlement concernant les dispositions générales de l’article 13.\nEn complément des dispositions du présent article, il est fortement recommandé de prendre\nconnaissance et d'appliquer les dispositions inscrites dans le Contrat de l’Arbre, document\nissu du Guide de gestion contractuelle de l'Arbre des Hauts-de-Seine (annexe 3).\nTout arbre abattu doit être remplacé par un arbre de même envergure. Toutefois, il pourra être\nadmis un choix différent pour tenir compte des éventuelles contraintes de l'environnement\ndans lequel il s'implante (port, envergure, hauteur). Le choix de l'essence doit se faire dans la\nliste des espèces végétales recommandées située en annexe 5 du présent règlement.\nToute construction à édifier au-dessus du sol et/ou en sous-sol doit assurer la préservation\ndurable des spécimens de qualité, identifiés comme élément de paysage et mettre en valeur\nles arbres remarquables repérés au document graphique.\nEn règle générale, toutes les mesures doivent être prises pour conserver, protéger et conforter\nles boisements et espaces verts.\nPleine terre :\nDoit être traité en pleine terre : 90% de l’unité foncière. Les espaces imperméabilisés tels que\nles équipements sportifs et des aménagements routiers sont exclus des espaces libres.\nPlantation :\nUn arbre de moyen développement (hauteur 15/25m – largeur 8/10m) doit être planté, s’il\nn’existe pas déjà, par tranche de 150 m² d’espaces de pleine-terre, en évitant la proximité des\nlimites séparatives.\nDe plus un arbre à grand développement (hauteur 20/30m – largeur 10/20m) doit être planté,\ns’il n’existe déjà, par tranche de 500 m² de pleine-terre, en évitant la proximité des limites\nséparatives.\nDans le périmètre de protection des arbres, il est interdit de réduire la perméabilité du sol.\nLes haies sont implantées en retrait de 1 mètre de la clôture sur voie, afin de ne pas gêner le\npassage des piétons. Elles sont de préférence paysagères, libres, et composées d’au moins\ntrois espèces mélangeant feuillage caduc et persistant.\nPLU de Vaucresson    Règlement","    125\nEspaces verts :\nLes espaces verts doivent bénéficier d’une conception diversifiée et équilibrée, utilisant les 3\nstrates végétales (herbacée, arbustive et arborée). Les plantations existantes significatives\ndoivent être maintenues. Le choix des essences doit être adapté au lieu, à l’environnement\nproche, aux données écologiques du milieu en privilégiant les espèces indigènes (liste jointe\nen annexe), car mieux adaptées à la géographie et au climat, et doit prohiber les espèces\ninvasives (liste jointe en annexe).\nLes espaces libres situés à l’intérieur des marges de retrait des constructions par rapport à\nl’alignement doivent être majoritairement végétalisés et contribuer à l’harmonie paysagère de\nla voie.\nARTICLE N.14 : COEFFICIENT D'OCCUPATION DU SOL\nSans objet.\nARTICLE N.15 : PERFORMANCES ÉNERGÉTIQUES ET ENVIRONNEMENTALES\nIl est recommandé que les constructions prennent en compte tout ou partie des objectifs du\ndéveloppement durable et de la préservation de l’environnement suivants tout en s’inscrivant\nen harmonie avec le paysage urbain existant par :\n   o l’utilisation de matériaux renouvelables, récupérables, recyclables ;\n   o l’intégration de dispositifs de récupération de l’eau de pluie ;\n   o l’installation de dispositifs de production d’énergie renouvelable pour\n    l’approvisionnement énergétique des constructions (chaudière bois, eau chaude\n    sanitaire solaire, pompes à chaleur, photovoltaïque, géothermie…) ;\n   o l’orientation des constructions pour favoriser la récupération des apports solaires et\n    valoriser la lumière naturelle afin de limiter les dépenses énergétiques.\nLes équipements liés aux énergies renouvelables (capteurs solaires, panneaux\nphotovoltaïques, vérandas…) doivent être intégrés et adaptés à la composition architecturale\ndes constructions et à leur environnement patrimonial et paysager.\nARTICLE N.16 : INFRASTRUCTURES ET RÉSEAUX DE COMMUNICATION NUMÉRIQUE\nNon réglementé.\nPLU de Vaucresson    Règlement","    126\nPARTIE 4\nEMPLACEMENTS RESERVES\nPLU de Vaucresson   Règlement","    127\n    LISTE DES EMPLACEMENTS RESERVES\n    LISTE DES EMPLACEMENTS\n    ANNEXES Liste des emplacements réservés\n    jonction sente    Emplacement réservé\n    des Buttes /    RESERVES\n    destiné à l'aménagement    environ\n1    AN 345    Commune\n    avenue du Bois    d'un cheminement    130 m²\n    de la Marche    piétonnier\n    jonction avenue\n    Emplacement réservé\n    du Bois de la\n    destiné à l'aménagement    environ\n2   Marche /    AN 363    Commune\n    d'un cheminement    90 m²\n    chemin des\n    piétonnier\n    Eaux\n    Emplacement réservé\n    sente de l'Abbé\n3    AM 19    destiné à la création d'un   Commune   11 m²\n    Suger\n    trottoir\n    Emplacement réservé\n4   rue Emile Testu    AM 293    destiné à la création d'un   Commune   28 m²\n    trottoir\n    Emplacement réservé\n5   rue de Garches    AD 7    destiné à la création d'un   Commune    4 m²\n    trottoir\nPLU de Vaucresson    Règlement","    128\nPARTIE 5\nANNEXES\nPLU de Vaucresson   Règlement","    129\n    Annexe 1 – Lexique\nA\n    ACCES    Annexe 2 – Liste des éléments bâtis\n    remarquablesAnnexe 1 – Lexique\n    Pour être constructible, tout terrain doit avoir accès à une voie (voir ce mot) publique ou privée,\n    soit directement, soit par l’intermédiaire d’un passage aménagé sur un fonds voisin. Tout\n    nouvel accès individuel doit présenter des caractéristiques permettant de satisfaire aux\n    exigences de la sécurité, de la défense contre l’incendie et de la protection civile, et notamment\n    une largeur supérieure ou égale à 3,5 mètres.\n    L'accès assure le désenclavement des parcelles. Il constitue la portion franchissable de la\n    limite séparant l'unité foncière, sur laquelle est projetée une opération, de la voie d'accès ou\n    de la desserte publique ou privée ouverte à la circulation.\n    ACROTERE\n    Il s’agit d’un couronnement situé à la périphérie d’une toiture-terrasse.\n    ALIGNEMENT\n    Limite entre une propriété (un terrain) et une voirie publique ou privée.\n    ANNEXES\n    Une annexe est une construction secondaire, de dimensions réduites et inférieures à la\n    construction principale, qui apporte un complément aux fonctionnalités de la construction\n    principale. Elle peut être accolée ou non à la construction principale avec qui elle entretient un\n    lien fonctionnel, sans disposer d’accès direct depuis la construction principale.\n    Peuvent être considérées comme annexes les constructions secondaires constituant des\n    dépendances tels que : réserves, celliers, remises, abris de jardins, garages, ateliers non\n    professionnels, appentis, piscines, etc.\n    La hauteur maximum des annexes ne peut dépasser 3.2 mètres au faîtage ou à l’acrotère.\n    ARTISANAT\n    Activité professionnelle indépendante de production, de transformation, de réparation, ou de\n    prestation de service relevant de l’Artisanat et figurant sur une liste annexée au décret N°98-\n    247 du 2 avril 1998.\n    PLU de Vaucresson    Règlement","    130\n    ATTIQUE\n    Est considéré comme attique le ou les derniers niveaux placés au sommet d’une construction\n    et situés en retrait des façades. Ces niveaux doivent être compris dans le gabarit-enveloppe.\nB\n    BAIE\n    Percement dans la construction qui autorise des vues.\n    BARDAGE\n    Revêtement d’un mur réalisé en matériaux de charpente (bois) ou de couverture (tuiles,\n    ardoises). Pour les constructions agricoles, le bardage peut être réalisé en tôle d’acier laque\n    ou en aluminium.\n    BATI\n    Un bâtiment est une construction couverte et close.\nC\n    CLOTURE\n    Dispositif ayant pour fonction d’empêcher ou de limiter le libre passage. Il est situé d’une part\n    entre la limite du terrain et la voie, et d’autre part entre le terrain et les parcelles qui lui sont\n    contiguës.\n    COEFFICIENT DE BIOTOPE PAR SURFACE (CBS)\n    Le CBS est un coefficient qui décrit la proportion des surfaces favorables à la biodiversité\n    (surface écoaménageable) par rapport à la surface totale d’une parcelle. Le calcul du CBS\n    permet d’évaluer la qualité environnementale d’une parcelle, d’un ilot, d’un quartier, ou d’un\n    plus vaste territoire.\n    Pour de plus amples informations sur les éléments pris en compte dans le CBS et le mode de\n    calcul, se référer aux dispositions générales du présent règlement, « Article 10 : PRECISIONS\n    DE DEFINITIONS DE CERTAINS ARTICLES ».\n    PLU de Vaucresson    Règlement","    131\n    COEFFICIENT D’OCCUPATION DES SOLS (COS)\n    Rapport exprimant le nombre de m² de plancher hors œuvre susceptibles d’être construits\n    par m² au sol. Il fixe donc la surface de plancher constructible sur le terrain en question.\n    CONSTRUCTION\n    Tout ouvrage édifié hors sol ou en sous-sol, excepté les rampes d’accès et les murs de\n    soutènement.\nD\n    DESSERTE D’UN TERRAIN\n    La desserte d’un terrain s’apprécie à la fois en termes d’accessibilité (il doit disposer d’un\n    accès à une voie) et d’équipements en réseaux (eau potable, assainissement, électricité,\n    télécommunications, etc.).\n    DEPOTS ET DECHARGE\n    Terrains ou emplacements destinés à l’entreposage de matériaux de rebut ou au stockage de\n    déchets ou d’ordures.\n    L'installation de dépôts de ferraille, de vieux véhicules, de matériaux, de combustibles solides\n    ou liquides et de déchets, etc..., non soumis au permis de construire, à la législation sur les\n    installations classées ou à la réglementation concernant le camping est subordonnée à\n    l'obtention d'une autorisation délivrée dans les conditions fixées par l'article R.421-23 et\n    suivants du Code de l'Urbanisme.\n    La demande d'autorisation doit être adressée au Maire, conformément aux dispositions\n    prévues par l'arrêté du 25 avril 1963.\n    L'extension ou la création de décharges (y compris le remblaiement de carrières) devront faire\n    l'objet d'une déclaration préalable à la Mairie du lieu intéressé.\nE\n    EGOUT DU TOIT\n    Limite ou ligne basse d’un pan de couverture vers laquelle ruissellent les eaux de pluie pour\n    s’égoutter dans une gouttière ou un chéneau.\n    EMPLACEMENT RESERVE\n    L’inscription d’un emplacement réservé pour la réalisation d’un projet d’intérêt général, rend\n    inconstructible le terrain ou la partie de terrain concerné pour toute autre utilisation que celle\n    prévue. En contrepartie, le propriétaire peut mettre en demeure la collectivité d’acquérir son\n    terrain. Ces dispositions concernent des aménagements de voirie et pistes cyclables mais\n    également des réserves foncières pour des équipements publics et des espaces verts.\n    EPANNELAGE\n    La notion d’épannelage fait référence à une forme simplifiée des masses bâties constitutives\n    d'un tissu urbain.\n    PLU de Vaucresson    Règlement","    132\n    EQUILIBRE PEDOLOGIQUE\n    La pédologie est l'étude de l'organisation (structures et fonctionnement) des sols, de leurs\n    propriétés, de leur distribution dans l'espace et de leur évolution dans le temps. Chaque sol\n    acquiert ainsi, avec le temps, des propriétés qui lui sont propres.\n    La notion d’« équilibre pédologique » porte ainsi sur le maintien des propriétés naturelles du\n    sol.\n    ESPACES BOISES CLASSES\n    Catégorie particulière d’espaces boisés urbains ou périurbains, protégés par le PLU au titre\n    de l’article L. 130-1 du Code de l’Urbanisme. Il s’agit des bois, forêts, parcs, à conserver, à\n    protéger ou à créer, enclos ou non, attenants ou non à des habitations qui, au-delà de leur\n    intérêt esthétique, présentent un intérêt essentiel sur le plan biologique et environnemental.\n    Le classement au titre des espaces boisés classés interdit tout changement d’affectation ou\n    tout mode d’occupation du sol de nature à compromettre la conservation, la protection ou la\n    création des boisements. Il entraîne de plein droit le rejet de la demande d’autorisation de\n    défrichement.\n    ESPACES LIBRES\n    Les espaces libres sont entendus comme étant la totalité des espaces autres que ceux\n    délimités au sol par l’emprise des constructions édifiées au-dessus du sol à l’intérieur d’une\n    unité foncière.\n    Sont inclus notamment les espaces végétalisés ou non, les aires de stationnement, ainsi que\n    les voies de circulation et cheminements de toute nature.\n    ESPACES VERTS\n    Espaces végétalisés, ce qui exclut les surfaces imperméabilisées (voir ce mot) telles que les\n    parkings, les terrasses, les voies internes en béton, en bitume ou de quelque nature que ce\n    soit, etc., à l’exception de solutions végétalisées.\n    EXTENSION DE CONSTRUCTION\n    L’extension consiste en un agrandissement de la construction existante présentant des\n    dimensions inférieures à celle-ci. L’extension peut être horizontale ou verticale (par\n    surélévation, excavation ou agrandissement), et doit présenter un lien physique et fonctionnel\n    avec la construction existante.\nF\n    FAÇADE\n    Toute face extérieure d’une construction située dans le même plan de manière continue.\n    PLU de Vaucresson    Règlement","    133\n    FAITAGE\n    Éléments composant la partie supérieure de la toiture.\n    FENETRE DE TOIT OU CHASSIS DE TOIT\n    Ouverture à châssis vitré ouvrant ou non, inscrite dans la pente de la toiture.\nG\n    GABARIT\n    Le gabarit désigne l’ensemble des plans verticaux, horizontaux ou obliques constituant la\n    forme extérieure de la construction. Il résulte de la combinaison des règles de hauteur, de\n    prospects et d’emprise au sol.\n    Traditionnellement, on distingue dans un bâtiment un socle, un corps et un couronnement :\n    1) Le socle correspond au soubassement qui surélève l’habitat,\n    2) Le corps désigne la partie centrale du bâtiment, c’est-à-dire le ou les étages,\n    3) Le couronnement fait référence à la partie supérieure du bâti et comprend,\n    généralement, la toiture ou les étages en attique.\nH\n    HABITATION LEGERE ET DE LOISIRS\n    Construction à usage d’habitation démontable ou transportable, destinée à l’occupation\n    temporaire ou saisonnière et dont la gestion et l’entretien sont organisés et assurés de manière\n    permanente.\n    PLU de Vaucresson    Règlement","    134\nHAUTEUR\nLa hauteur se mesure du terrain naturel au point le plus élevé de la construction. Ne sont\npas comptés les ouvrages indispensables et de faible emprise tels que souches de cheminées\nou de ventilation, locaux techniques d'ascenseurs, garde-corps à condition que leur superficie\nn'excède pas 10% de la superficie du dernier niveau de la construction.\nHauteur de la façade au faîtage :\nHauteur de la façade à l’acrotère :\nPour les toitures plates (toitures terrasses), hauteur mesurée en partie supérieure de la toiture\nsur les limites extérieures.\nEn cas de terrain en pente, la hauteur maximum autorisée au droit du bâti ne doit jamais\ndépasser la hauteur maximum autorisée vis-à-vis du terrain naturel. Des dépassements\nponctuels pourront être autorisés si ceux-ci ont pour effet de permettre un lissage des hauteurs\nde la construction.\nPLU de Vaucresson    Règlement","    135\nL\n    LIMITE SEPARATIVE\n    Le terme de limite séparative désigne l’ensemble des limites parcellaires d’une propriété. Il\n    s’agit d’une frontière, matérialisée ou non par une clôture ou des bornes de repère (bornage)\n    implantées à la cote des sols existants.\n    Elle a pour rôle de délimiter la surface d’une propriété que ce soit par rapport aux voies\n    publiques ou privées (alignement), ou aux parcelles voisines (limites latérales et de fond de\n    parcelle).\n    LIMITE SEPARATIVE LATERALE\n    Limite entre deux terrains, qui viennent rejoindre la voie.\n    LIMITE DE FOND DE PARCELLE\n    Limite qui vient rejoindre les limites séparatives latérales.\n    LUCARNE\n    Ensemble particulier d’une toiture dont certains éléments permettent de réaliser une\n    ouverture en saillie.\nM\n    MARGE DE RECUL\n    La marge de recul est le retrait imposé à une construction à édifier en bordure d'une voie\n    publique ou privée et résultant soit d'une indication du plan, soit d'une prescription du présent\n    règlement. Sa largeur se mesure à partir de l'alignement (actuel, ou futur si un élargissement\n    de la voie est prévu au plan) ou pour les voies privées de la limite en tenant lieu.\nP\n    PIGNON\n    Un pignon est une façade qui présente une partie de mur élevée entre les rampants de la\n    toiture jusqu’au faîtage.\n    PLU de Vaucresson    Règlement","    136\n    PLEINE TERRE\n    Les espaces de pleine terre sont des espaces libres non bâtis ni en surface ni en sous-sol\n    permettant la libre infiltration des eaux pluviales.\n    Au niveau du sol :\n    Un espace est considéré comme de pleine terre lorsqu’il peut recevoir des plantations. Les\n    aires de stationnement, quel que soit le revêtement (dalles engazonnées, béton…), ainsi que\n    leurs accès, sont exclus des surfaces de pleine terre. Afin de délimiter leurs positionnements\n    et leurs accès, le gabarit type d’une place de stationnement (5 mètres par 2,5 mètres) devra\n    être utilisé.\n    Au niveau du tréfond :\n    Un espace est considéré comme de pleine terre lorsque les éventuels ouvrages existants ou\n    projetés dans son tréfonds ne portent pas préjudice à l'équilibre pédologique du sol et\n    permettent notamment le raccordement de son sous-sol à la nappe phréatique.\n    Les ouvrages d'infrastructure profonds participant à l'équipement urbain (ouvrages\n    ferroviaires, réseaux, canalisations...) ne sont pas de nature à déqualifier un espace de pleine\n    terre. Les locaux souterrains attenants aux constructions en élévation et en dépendant\n    directement, quelle que soit la profondeur desdits locaux ne permettent pas de le qualifier de\n    pleine terre.\n    PROPRIETE\n    Une propriété est une parcelle ou un ensemble de parcelles d’un seul tenant appartenant à un\n    même propriétaire ou à un même groupe de propriétaires. On parle également d’unité foncière\n    (voir ce mot).\n    PROSPECT\n    Distance minimale autorisée entre les bâtiments.\nR\n    RETRAIT\n    On appelle retrait l'espace situé entre une construction et une limite séparative ; sa largeur\n    (L) est constituée par la mesure de l'horizontale normale au nu de la façade de la construction\n    considérée (saillies et balcons exclus) jusqu'à sa rencontre avec la limite de propriété.\n    Lorsque la largeur minimum du retrait est fonction de la hauteur des constructions pour le\n    calcul de cette largeur minimum, les hauteurs à prendre en compte sont celles de la\n    construction ou du corps de bâtiment correspondant à la façade ou au pignon pris en\n    considération.\n    PLU de Vaucresson    Règlement","    137\n    Les distances par rapport aux limites séparatives sont : L1, L2, L4 et L5.\n    La distance par rapport à la voie est L3.\nS\n    SAILLIE\n    Elément, corps d’ouvrage qui dépasse d’un plan de référence ou du nu d’une façade (les\n    balcons, corniches, pilastres, etc…)\n    SURFACE DE PLANCHER\n    La surface de plancher est égale à la somme des surfaces de plancher de chaque niveau clos\n    et couvert, calculée à partir du nu intérieur des façades. Les loggias ouvertes, toitures-\n    terrasses, balcons ne sont pas considérés comme étant des éléments clos et couverts, ils\n    n'entrent donc pas dans le calcul de la surface de plancher.\n    Pour le calcul exact, il convient de se reporter au Code de l’Urbanisme.\nT\n    TERRAIN\n    Voir Unité foncière\n    TERRAIN D’ANGLE\n    Lorsqu'un terrain est situé à l'angle de deux voies, il n'y a pas de fond de parcelle puisque ses\n    limites sont riveraines de la voirie. Seules sont alors applicables les prescriptions relatives aux\n    limites latérales.\n    PLU de Vaucresson    Règlement","    138\n    TERRAIN NATUREL\n    Le terrain naturel est le profil du terrain existant avant la demande de travaux envisagés, c'est-\n    à-dire n'ayant subi aucune transformation artificielle modifiant son niveau.\n    UNITE FONCIERE\n    Elle est définie comme l’îlot de propriété unique d’un seul tenant et appartenant au même\n    propriétaire. Ainsi, si la propriété est séparée par un chemin ou par des éléments
