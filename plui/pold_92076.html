.search{flex:1;min-width:220px;position:relative}

.filters{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line);cursor:pointer;user-select:none}

.txt h4{margin:18px 0 8px;font-size:15px}
.txt ul{margin:0 0 10px;padding-left:22px}
.txt li{margin:0 0 5px}
.txt ul.sub{margin:5px 0 5px;list-style:circle}
.txt li.nb{list-style:none}
pre.tbl{font:12px/1.35 ui-monospace,Consolas,monospace;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre}
.ref{font-style:italic;color:var(--muted)}

.df{border-bottom:1px dashed var(--muted);cursor:help}
sup{font-size:9px;color:var(--muted)}
mark{background:var(--hl);color:inherit;border-radius:2px}

.sub-list a{display:block;padding:4px 0;text-decoration:none}
.sub-list .cd{color:var(--code);margin-right:6px}
.eq a{margin-right:8px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}

.ob a{display:block;text-decoration:none;padding:3px 0}

.......................................................................................................... 49\n   DISPOSITIONS APPLICABLES A LA ZONE UD .................................................................................................................................. 62\n   DISPOSITIONS APPLICABLES A LA ZONE UE................................................................................................................................... 74\n   DISPOSITIONS APPLICABLES A LA ZONE UF ................................................................................................................................... 85\n   DISPOSITIONS APPLICABLES A LA ZONE UG .................................................................................................................................. 98\n   DISPOSITIONS APPLICABLES A LA ZONE UL ................................................................................................................................. 110\nPARTIE 3 - DISPOSITIONS APPLICABLES AUX ZONES NATURELLES ............................................................................................ 118\n   DISPOSITIONS APPLICABLES A LA ZONE N................................................................................................................................... 119\nPARTIE 4 - EMPLACEMENTS RESERVES .................................................................................................................................. 126\nPARTIE 5 - ANNEXES ................................................................................................................................................................ 128\n   ANNEXE 1 – LEXIQUE ...................................................................................................................................................................... 129\n   ANNEXE 2 – LISTE DES ELEMENTS BATIS REMARQUABLES ......................................................................................................................... 139\n   ANNEXE 3 – CONTRAT DE PRESERVATION DE L’ARBRE ............................................................................................................................. 142\n   ANNEXE 4 – LISTE DES ARBRES REMARQUABLES ..................................................................................................................................... 145\n   ANNEXE 5 – LISTE DES ESPECES VEGETALES ........................................................................................................................................... 151\n   ANNEXE 6 – LISTE DES LINEAIRES COMMERCIAUX ET DES ACTIVITES PRESERVES ........................................................................................... 154\n   ANNEXE 7 – CAHIER DES RECOMMANDATIONS ARCHITECTURALES .............................................................................................................. 155\n    PLU de Vaucresson    Règlement","    3\n    QUE DETERMINE LE PLU ?\nLe Plan Local d’Urbanisme fixe les règles générales d’utilisation des sols. Les modes\nd’occupation et d’utilisation du sol sont définis dans le plan de zonage et le règlement dans\nlequel le territoire communal est divisé en zones et secteurs.\nLe titre I du règlement du P.L.U. (dispositions générales) précise notamment :\n    -   les effets respectifs du règlement P.L.U. et des autres législations et réglementations\n    relatives au droit des sols,\n    -   les divers modes d’occupation et d’utilisation du sol réglementés par le P.L.U.\n    COMMENT UTILISER LES DOCUMENTS ?\nPour connaître les droits afférents à un terrain, il faut :\n1. Repérer le terrain sur le plan de zonage et le situer par rapport à la zone ou au secteur\n   désigné par les lettres UA, UB, UC, UD, UE, UF, UG et N.\n2. Rechercher dans le règlement les dispositions relatives à ces différents secteurs.\n3. Dans chaque zone, le droit des sols applicable à un terrain est défini par seize articles qui\n   ne sont pas exclusifs les uns des autres. Les limites qu’ils déterminent ont donc un effet\n   cumulatif et il conviendra dans tous les cas de respecter les dispositions les plus\n   contraignantes.\nChaque chapitre comporte un corps de règles de seize articles. Le numéro de l’article est\ntoujours précédé du sigle de la zone où il s’applique.\nArticle 1 : Occupations et utilisations du sol interdites.\nArticle 2 : Occupations et utilisations du sol soumises à des conditions particulières.\nArticle 3 : Desserte des terrains par les voies publiques ou privées.\nArticle 4 : Desserte des terrains par les réseaux publics.\nArticle 5 : Superficie minimale des terrains constructibles\nArticle 6 : Implantation par rapport aux voies et emprises publiques.\nArticle 7 : Implantation par rapport aux limites séparatives.\nArticle 8 : Implantation des constructions les unes par rapport aux autres sur une même\n    propriété.\nArticle 9 : Emprise au sol des constructions.\nArticle 10 : Hauteur maximale des constructions.\nArticle 11 : Aspect extérieur des constructions.\nArticle 12 : Gestion du stationnement.\nArticle 13 : Réalisation d’espaces libres, d’aires de jeux et de loisirs, et de plantations.\nArticle 14 : Coefficient d’occupation du sol.\nArticle 15 : Obligations imposées aux constructions, travaux, installations et aménagements,\n    en matière de performances énergétiques et environnementales.\nArticle 16 : Obligations imposées aux constructions, travaux, installations et aménagements,\n    en matière d’infrastructures et réseaux de communications électroniques.\nPLU de Vaucresson    Règlement","    4\n4. Pour une bonne compréhension du texte, les définitions des termes techniques sont\n   données en fin de règlement dans un lexique.\n5. En complément des dispositions applicables spécifiquement à chacune des zones, le\n   règlement comporte également des Dispositions Générales (Partie 1) qui s'appliquent à\n   l'ensemble des zones.\n6. 5. Pour déterminer plus complètement le droit des sols concernant un terrain et identifier\n   les contraintes qui lui sont liées, il convient de se reporter en priorité aux documents\n   suivants du dossier PLU :\n  •   Le rapport de présentation et le projet d’aménagement et de développement durables\n    pour comprendre le contexte général.\n  •   Les documents graphiques qui outre le zonage, mentionnent d’autres dispositions\n    d’urbanisme telles que :\n    - Les emplacements réservés aux voies et ouvrages publics, aux installations\n    d’intérêt général et aux espaces verts.\n    - Les espaces paysagers protégés\n    - Les arbres remarquables\n    - Les constructions remarquables\n  •   Les annexes qui, à titre d’information, peuvent apporter le cas échéant de nombreuses\n    indications, notamment :\n    - Les servitudes d’utilité publique.\n    - Les schémas des réseaux d’eau et d’assainissement.\n    PRINCIPES SCHEMATIQUES DES DISPOSITIONS REGLEMENTAIRES\nPLU de Vaucresson    Règlement","    5\nPARTIE 1\nDISPOSITIONS GENERALES\nPLU de Vaucresson   Règlement","    6\nArticle 1\nCHAMP D’APPLICATION DU PLAN LOCAL D’URBANISME\nLe présent règlement du Plan Local d’Urbanisme s'applique à l'ensemble de la commune de\nVaucresson.\nCe règlement est établi conformément à l’article R.123-9 du Code de l’Urbanisme. Cet article\nénumère neuf destinations qui sont reprises aux articles 1 et 2 du présent règlement.\nCes neuf destinations sont les suivantes :\n • Artisanat : L’artisanat regroupe l’ensemble des activités de fabrication, pouvant\n    comporter une activité complémentaire de vente au détail, exercées par des travailleurs\n    manuels. Exemples : Boulangerie, pâtisserie, Boucherie, Coiffure, Fleuristes, artisanat\n    d’art, confection, réparation, etc.\n • Bureau : Les bureaux correspondent à des locaux où sont exercées des activités de\n    services de direction, gestion, études, ingénierie, informatique, services aux\n    entreprises... C’est principalement la notion d’accessibilité à la clientèle qui distingue les\n    bureaux des commerces. Exemples : Bureaux et activités tertiaires, médical et\n    paramédical, architecte, avocat, notaire, expert, agences immobilières, banques,\n    assurance, travail temporaire, bureau de vente, agences de voyage, auto-école etc.\n • Commerce : La destination « commerces » regroupe les activités économiques d’achat\n    et de vente de biens ou de service. La présentation directe au public constitue une\n    activité prédominante. Exemples : Commerce alimentaire (alimentation générale,\n    caviste, etc.) et commerce non alimentaire (équipement de la personne et de la maison,\n    automobiles-motos-cycles : concessions, vente de véhicule, station essence, loisirs,\n    pharmacie, tabac, presse, plantes, bijouterie, parfumerie, galerie d’art, etc.)\n • Entrepôt : Un entrepôt est un bâtiment logistique destiné au stockage des biens en vue\n    de leur expédition ou de leur utilisation ultérieure. Sont considérés comme entrepôts les\n    bâtiments ou constructions dont le stockage constitue la fonction principale. Lorsqu’ils\n    sont liés à une autre fonction (artisanat, commerce, industrie, ...) et à condition de\n    représenter moins des deux tiers de la superficie des locaux dévolus à cette autre\n    fonction, ils en constituent un local accessoire et ne sont donc pas considérés comme\n    entrepôts.\n • Exploitation agricole et forestière : Sont réputées agricoles toutes les activités\n    correspondant à la maîtrise et à l’exploitation d’un cycle biologique de caractère végétal\n    ou animal et constituant une ou plusieurs étapes nécessaires au déroulement de ce\n    cycle, ainsi que les activités exercées par un exploitant agricole qui sont dans le\n    prolongement de l’acte de production ou qui ont pour support l’exploitation. Les activités\n    de préparation et d'entraînement des équidés domestiques en vue de leur exploitation\n    sont réputées agricoles. Il en est de même de la production et -le cas échéant- de la\n    commercialisation, par un ou plusieurs agricoles, de biogaz, d'électricité et de chaleur\n    par la méthanisation, lorsque cette production est issue pour au moins 50% de matières\n    provenant de ces exploitations.\n    L’exploitation forestière est un processus de production s’appliquant à un ensemble\n    d’arbres en vue de leur valorisation économique.\n • Habitation : Cette destination comprend également les résidences services, les\n    résidences destinées aux étudiants, aux jeunes travailleurs, aux travailleurs immigrants,\n    aux personnes âgées, aux handicapés, aux adolescents et aux enfants.\n • Hébergement hôtelier : Il se distingue de l’habitation par le caractère temporaire de\n    l’hébergement et par l’existence de services tels que restaurant, blanchisserie, accueil,...\n    Il inclut, notamment, les hôtels, les motels, les pensions de famille, les résidences\n    hôtelières, les résidences de tourisme, les gîtes.\n • Industrie : L’industrie regroupe l’ensemble des activités collectives de production de\n    biens à partir de matières brutes, à l’aide de travail ou de capital.\nPLU de Vaucresson    Règlement","    7\n  •    Services publics ou d’intérêt collectif (appelés aussi CINASPIC - Constructions et\n    Installations Nécessaires Aux Services Publics et d'Intérêt Collectif) : Ils sont destinés à\n    accueillir des fonctions d’intérêt général, notamment dans les domaines administratif,\n    hospitalier, sanitaire, social, de l’enseignement et des services annexes, culturel, sportif,\n    de la défense et de la sécurité, qu’il s’agisse d’équipements répondant aux besoins d’un\n    service public ou d’organisme privé chargé de satisfaire un intérêt collectif.\nLe présent règlement et les documents graphiques qui l’accompagnent, notamment les plans\nde zonage, constituent un ensemble cohérent de dispositions réglementaires et de ce fait sont\nindissociables.\nIls s’imposent aux particuliers comme aux personnes morales de droit public et de droit privé.\nIl est accompagné d’un rapport de présentation, d’un projet d’aménagement et de\ndéveloppement durables, d’orientations d’aménagement et de programmation relatives à\ncertains secteurs, ainsi que des annexes prévues aux articles R.123-13 et R.123-14 (Nouv.\nart. R151-52 et R151-53) du Code de l’Urbanisme.\nArticle 2\nDIVISION DU TERRITOIRE EN ZONES ET EN SECTEURS\nLe territoire communal couvert par le Plan Local d’Urbanisme est divisé en zones urbaines\n(indicatif U) et en zones naturelles et forestières (indicatif N).\nLes zones urbaines sur lesquelles s’appliquent les dispositions du titre II du présent\nrèglement.\nIl s’agit des zones :\n    - UA : zone urbaine centrale\n    La zone UA comprend trois secteurs : UAa, UAb et UAc.\n    -    UB, UC, UG, UF : zones urbaines à dominante résidentielle\n    La zone UF comprend deux secteurs : UFa et UFb.\n    -    UD : zone urbaine mixte équipement et résidentielle.\n    La zone UD comprend deux secteurs : UDa et UDb.\n    -    UE : zone d’équipements\n    -    UL : zone d’équipements principalement constituée d’espaces non bâtis. Elle\n    comprend le secteur ULa qui correspond aux constructions et installations au sein de\n    la zone UL, à destination d’équipement, où des possibilités de construire sont ouvertes\nLes zones naturelles et forestières auxquelles s’appliquent les dispositions du titre V.\nLa zone N correspond aux espaces naturels où les possibilités d’utilisation du sol sont limitées\nen raison de la qualité du paysage, des sites et des milieux naturels qui la composent.\nPLU de Vaucresson    Règlement","    8\nArticle 3\nLES PRESCRIPTIONS DU PLAN LOCAL D’URBANISME\n3.1. Les espaces boisés classés à conserver et protéger (EBC).\nLes espaces boisés classés (EBC) à conserver et à protéger figurent au Plan Local\nd’Urbanisme. Ils sont identifiés sur le plan de zonage par un quadrillage rempli de ronds verts.\nA l’intérieur des périmètres délimitant les espaces boisés classés figurés au document\ngraphique, les dispositions des articles L.130-1 à L.130-6 (Nouv. art. L113-1 à L113-7), et\nR.130-1 à R.130-23 (Nouv. art. R421-23 et R113-1 à R113-14) du Code de l’Urbanisme sont\napplicables.\nLe propriétaire sera tenu d’entretenir le boisement existant et en particulier de remplacer les\narbres qui viendraient à disparaître. Tout défrichement ou déboisement y est interdit. Seuls\nsont autorisés les travaux qui ne sont pas susceptibles de compromettre le caractère boisé\ndes lieux.\nLes coupes et abattages d’arbres dans les espaces boisés classés sont dispensés de\ndéclaration préalable au Maire lorsque :\n   -   le propriétaire procède à l’enlèvement des arbres dangereux et des bois morts ;\n   -   les bois et forêts sont soumis au régime forestier et administrés conformément aux\n    dispositions des articles L.111-1 et suivants du Code Forestier ;\n   -   le propriétaire a fait agréer un plan simple de gestion dans les conditions prévues aux\n    articles L.122-1 à L.222-4 et à l’article L.223-2 du Code Forestier ou fait application\n    d’un règlement type de gestion approuvé conformément aux dispositions II de l’article\n    L.8 et de l’article L.222-6 du même code ;\n   -   les coupes entrent dans le cadre d’une autorisation par catégories définies par arrêté\n    préfectoral pris après avis du Centre Régional de la Propriété Forestière (voir arrêté du\n    9 mars 2006).\n3.2. Les éléments du patrimoine bâti remarquable d’intérêt local répertoriés au titre de\nl’article L.123-1-5-III 2° (Nouv. art. L151-19) du Code de l’Urbanisme\nLes éléments de patrimoine repérés au document graphique, au titre de l’article L.123-1-5\n(Nouv. art. L151-19) du code de l’urbanisme, sont des constructions qu’il convient de préserver\ndans toutes leurs caractéristiques. Ils sont identifiés sur le plan de zonage par un figuré rouge.\nEn application des l’articles L.430-1, R.430-3 et R.430-9 (Nouv. art. R421-28.e) du Code de\nl’Urbanisme, la démolition totale ou partielle d’un élément ou d’un ensemble de patrimoine bâti\nrepéré et protégé au titre de l’article L.123-1-5 (Nouv. art. L151-19) du Code de l’Urbanisme\ndoit faire l’objet d’une autorisation préalable.\nTous les travaux exécutés sur un bâtiment faisant l’objet d’une protection au titre de l’article\nL.123-1-5 (Nouv. art. L151-19) du Code de l’Urbanisme, doivent être conçus en évitant toute\ndénaturation des caractéristiques conférant leur intérêt, tels qu’elles sont présentées\ndans l’annexe « Patrimoine local », ainsi que l’article 11 de chaque règlement de zone.\nLe règlement du PLU, notamment les articles 6, 7 et 8 (implantation des constructions par\nrapports aux voies, aux limites séparatives, et les unes par rapport aux autres sur une même\npropriété), 10 (hauteur des constructions) et 11 (aspect extérieur des constructions), précise\nles dispositions contribuant à la valorisation du bâtiment repéré.\nPLU de Vaucresson    Règlement","    9\n3.3. Les espaces paysagers protégé\nOnt été identifiés et localisés, au titre de l'article L.123-1-5 (Nouv. art. L151-23) du Code de\nl'Urbanisme, des éléments de paysage et des sites à protéger pour des motifs d'ordre\nécologique, notamment pour la préservation, le maintien ou la remise en état des continuités\nécologiques et définir.\nSont ainsi classés au titre des espaces paysagers protégé :\n    -   la partie Nord de la plaine de Beauvillier (partie comprise entre la rue de\n    Garches, le parking de Beauvillier et l’allée des Ormes),\n    -   le square de la Croix-blanche.\nCe classement limite tout changement d'affectation ou tout mode d'occupation du sol de nature\nà compromettre le cadre paysagé protégé. L’édification de constructions et installations\nnécessaires aux services publics ou d’intérêt collectif peut être autorisée.\nLorsque la zone protégée recouvre un espace boisé, il est fait application du régime\nd'exception prévu à l'article L. 421-4 pour les coupes et abattages d'arbres.\n3.4. Les emplacements réservés\nLes emplacements réservés sont identifiés sur le plan de zonage par des carrés fins de\ncouleur rouge et répertorié par un numéro de référence.\nLes pièces annexes au PLU donnent toutes précisions sur la destination de la réserve foncière\nainsi que la collectivité ou organisme public bénéficiaire (article R.123-11 (Nouv. art. R151-48\n2°) du Code de l’Urbanisme).\nLa réserve foncière portée au plan est soumise aux dispositions des articles L.123-17 (Nouv.\nart. L152-2), L.230- 1 et suivants et R.123-10 du Code de l’Urbanisme :\n   -   toute construction y est interdite ;\n   -   une construction à titre précaire peut exceptionnellement être réalisée conformément\n    à l’article L433-1 du Code de l’Urbanisme ;\n   -   le propriétaire d’un terrain, bâti ou non, inscrit en emplacement réservé par un PLU\n    peut :\n    § Conserver et jouir de son bien tant que la collectivité bénéficiaire n’aura pas\n    l’intention de réaliser l’équipement prévu,\n    § Mettre en demeure le bénéficiaire de l’emplacement réservé d’acquérir son\n    terrain.\nDans le cas où le propriétaire souhaite mettre en demeure le bénéficiaire d’acquérir la\nréserve foncière, il doit adresser sa demande au Maire de la commune où se situe le bien.\nLa collectivité ou le service public bénéficiaire dispose d’un délai d’un an à compter de la\nréception en mairie de la demande pour se prononcer. En cas d’accord amiable, un délai de\ndeux ans à compter de la réception en mairie de la demande lui est accordé pour réaliser le\npaiement du bien. A défaut d’accord amiable et à l’expiration du délai d’un an à compter de la\nréception de la demande, le propriétaire comme le bénéficiaire peut saisir le juge de\nl’expropriation. Ce dernier fixe alors le prix du bien et prononce le transfert de propriété.\nSi trois mois après l’expiration du délai d’un an, le juge de l’expropriation n’a pas été saisi, la\nréserve n’est plus opposable.\nPLU de Vaucresson    Règlement","    10\n3.5. La prise en compte de la présence de canalisation de gaz\nDans les zones concernées par la servitude d’utilité publique prenant en compte les risques\ngénérés par les canalisations de gaz, les travaux doivent être conduits dans le respect de la\nprocédure de DT/DICT définie par le décret modifié n°2011-1241 du 5 octobre 2011.\nArticle 4\nCLOTURES\nEn application de la délibération du conseil municipal n°C.M. 2007-52 du 26 juin 2007,\nl'édification des clôtures est soumise à déclaration préalable.\nArticle 6\nTRAVAUX D’ISOLATION PHONIQUE ET THERMIQUE PAR L’EXTERIEUR\nLes travaux relatifs à l’isolation thermique et phonique par l’extérieur menés sur les\nconstructions peuvent être autorisés même s’ils ne respectent pas les articles 6, 7 et 8 du\nprésent règlement.\nArticle 7\nADAPTATIONS MINEURES\nConformément à l’article L.123-1 (Nouv. art. L152-3) du Code de l’Urbanisme, des adaptations\nmineures dérogeant à l’application stricte des dispositions des articles 3, et, 5 à 13 des règles\nde zones peuvent être accordées par l’autorité compétente, lorsqu’elles seront rendues\nnécessaires par la nature du sol, la configuration des parcelles, le caractère des constructions\navoisinantes ou du site, ou par un intérêt architectural.\nArticle 8\nPERMIS DE DEMOLIR\nArticle L.421-3 du code de l’urbanisme\nEn application de la délibération du conseil municipal n°C.M. 2007-52 du 26 juin 2007, les\ndémolitions de constructions existantes doivent être précédées de la délivrance d’un permis\nde démolir.\nArticle L.421-6 du code de l’urbanisme\n« Le permis de démolir peut être refusé ou n’être accordé que sous réserve de l’observation\nde prescriptions spéciales si les travaux envisagés sont de nature à compromettre la protection\nou la mise en valeur du patrimoine bâti, des quartiers, des monuments et des sites ».\nPLU de Vaucresson    Règlement","    11\nArticle 9\nRECONSTRUCTION A L’IDENTIQUE SUITE A DEMOLITION OU A SINISTRE\nAu titre de l’article L. 111-15 du Code de l’Urbanisme, la reconstruction à l'identique d'un\nbâtiment détruit ou démoli depuis moins de dix ans est autorisée nonobstant toute disposition\nd'urbanisme contraire dès lors qu'il a été régulièrement édifié.\nSont exclus du champ d’application de l’article L. 111-15 les cas de reconstructions à\nl’identique suite à démolitions qui sont interdites dans tous les emplacements réservés figurant\nau P.L.U.\nArticle 10\nPRECISIONS DE DEFINITIONS DE CERTAINS ARTICLES\nArticle 2 : OCCUPATIONS ET UTILISATIONS DU SOL SOUMISES A DES CONDITIONS\nPARTICULIÈRES\nIl est demandé un minimum de 30% de logements aidés dans tous programmes de\nconstruction, d’aménagement, de réhabilitation ou de changement de destination de locaux à\ndestination d’habitation.\nCette disposition est applicable à partir de 300 m² de surface de plancher ou de 5 logements\navec la règle d’arrondi au nombre entier inférieur jusqu'à 800 m² de surface de plancher.\nSoit (0,30 x nombre de logements)\nSi la surface de plancher est inférieure à 300 m², il est demandé :\nDe 1 à 4 logements, pas de réalisation de logement aidé\n30% de 5 logements = 1,5 donc réalisation de 1 logement aidé sur 5 logements\n30% de 6 logements = 1,8 donc réalisation de 1 logement aidé sur 6 logements\n30% de 7 logements = 2,1 donc réalisation de 2 logements aidés sur 7 logements, etc.\nSi la surface de plancher est supérieure ou égale à 300 m² et jusqu’à 800 m² en\nfonction du nombre de logements réalisés, il est demandé :\n30% de 2 logements = 0,6 donc pas de réalisation de logement aidé\n30% de 3 logements = 0,9 donc pas de réalisation de logement aidé\n30% de 4 logements = 1,2 donc réalisation de 1 logement aidé sur 4 logements\n30% de 5 logements = 1,5 donc réalisation de 1 logement aidé sur 5 logements\n30% de 6 logements = 1,8 donc réalisation de 1 logement aidé sur 6 logements\n30% de 7 logements = 2,1 donc réalisation de 2 logements aidés sur 7 logements etc..\nSi la surface de plancher est supérieure ou égale à 800 m², il est demandé :\n30% de 2 logements = 0,6, soit 1 logement\n30% de 3 logements = 0,9, soit 1 logement\n30% de 4 logements = 1,2 soit 1 logement aidé sur 4 logements\n30% de 5 logements = 1,5 soit 2 logements aidés sur 5 logements\n30% de 6 logements = 1,8 soit 2 logements aidés sur 6 logements\n30% de 7 logements = 2,1 soit 2 logements aidés sur 7 logements etc..\nPLU de Vaucresson    Règlement","    12\nArticle 4 : CONDITIONS DE DESSERTE DES TERRAINS PAR LES RÉSEAUX PUBLICS\nD'EAU, D'ÉLECTRICITÉ ET D'ASSAINISSEMENT\nLa compétence assainissement est exercée par l’établissement public territorial Paris Ouest\nLa Défense.\nAssainissement\n   o Eaux usées\nLe branchement à un réseau collectif d'assainissement de caractéristiques appropriées est\nobligatoire pour toute construction ou installation engendrant des eaux usées. Les eaux\nindustrielles ou artisanales devront faire l’objet d’un prétraitement avant rejet dans le réseau\npublic d’assainissement.\nToute évacuation des eaux ménagères ou des effluents non-traités dans les fossés, cours\nd'eau et égouts pluviaux est interdite.\nTout branchement doit faire l’objet d’une demande adressée à l’EPT POLD et au service\nassainissement de la ville. Cette demande, formulée selon le dernier modèle à jour et\ndisponible sur le site internet de la ville, doit être signée par le propriétaire ou son mandataire.\nLes documents seront accompagnés du plan de masse de la construction sur lequel seront\nindiqués très nettement le tracé souhaité pour le branchement ainsi que son diamètre, sa\nprofondeur, sa longueur.\nL’EPT POLD fixe le nombre de branchements à installer par immeuble à raccorder.\nAu vu de la demande par le propriétaire ou le détenteur du permis de construire, de l’immeuble\nà raccorder, l’EPT POLD valide les conditions techniques d’établissement du branchement en\nprenant en compte les conditions d’exploitation et d’entretien du branchement.\nLes travaux de branchements sont entièrement à la charge du demandeur et réalisé par la\nsociété de son choix, conformément au règlement d’assainissement en vigueur.\nToute demande de branchement est assujettie à la PFAC (Participation pour le Financement\nde l’Assainissement Collectif). Un titre de recette sera émis par l’EPT POLD.\n   o Eaux pluviales\nLe stockage des eaux pluviales et/ou des systèmes d’infiltration à la parcelle permettant une\nrestitution nulle des eaux au réseau public seront mises en place sur la propriété. Seul l’excès\nde ruissellement peut être canalisé et rejeté dans le réseau.\n En cas d’impossibilité pour parvenir aux objectifs précités, une justification technique devra\nêtre fournie. L’installation proposée devra néanmoins rester conforme aux prescriptions\ntechniques définies par le règlement d’assainissement de l’EPT POLD. En tout état de cause,\nle rejet autorisé ne pourra pas être supérieur à 2 l/s/ha.\nEn l’absence de réseau collectif, la totalité des eaux pluviales devra être dirigée vers un\nsystème d’infiltration sur le terrain du pétitionnaire.\nDes prescriptions techniques particulières pour les eaux pluviales de toiture sont notamment\nrecommandées pour l’arrosage.\nLe détournement de la nappe phréatique ou des sources souterraines dans les réseaux\nl’assainissement est interdit et soumis à autorisation de l’EPT POLD dans des conditions\nexceptionnelles.\nPLU de Vaucresson    Règlement","    13\nArticle 6 : IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX VOIES\nPUBLIQUES ET PRIVEES\nLe recul d’une construction est la distance mesurée perpendiculairement aux voies publiques\nou privées et aux emprises publiques (projetées le cas échéant).\nEn cas de réalisation de plusieurs constructions sur un même terrain, ce recul ne s’applique\nqu’aux constructions implantées en premier rang, hors clôture et emprise de stationnement ou\ngarage.\nLes règles d’implantation par rapport aux voies publiques ou privées et aux emprises publiques\nou privées ne s’appliquent pas aux poteaux, pylônes, transformateurs, mobiliers enterrés et\nsemi-enterrés de collecte des déchets ménagers, et autres installations techniques\nnécessaires aux réseaux.\nArticle 7 : IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX LIMITES\nSEPARATIVES\nLe retrait d’une construction est la distance mesurée perpendiculairement aux limites\nséparatives.\nDans le cas où le retrait est dépendant de la hauteur de la construction, cette hauteur est\nmesurée sur la façade la plus proche de la limite. La hauteur de la construction est mesurée\nselon les modalités prévues à l’article 10.\nPLU de Vaucresson    Règlement","    14\nArticle 9 : EMPRISE AU SOL DES CONSTRUCTIONS\nL’emprise au sol des constructions hors sol correspond à leur projection verticale au sol,\nexception faite :\n   - des ornements tels que les éléments de modénature et les marquises ;\n   - les systèmes de fermeture et de protection (volets, grilles, garde-corps,...),\n   - les débords de toiture lorsqu’ils ne sont pas soutenus par des poteaux ou des\n    encorbellements,\n   - les éléments de constructions (ex : terrasses) en surplomb de moins de 0,80 mètre au-\n    dessus du terrain naturel,\n   - des dispositifs nécessaires à l’utilisation des énergies renouvelables et à l’isolation\n    par l’extérieur ;\n   - des dispositifs d’accessibilité des personnes à mobilité réduite (rampes, élévateurs...)\n    dépassant de plus de 0,80 mètre le sol avant travaux.\nIl est rappelé que les piscines sont des constructions et sont donc constitutives d’emprise au\nsol (à l’exception des piscines hors sol posée moins de 3 mois).\nLes pourcentages d’emprise au sol ne sont pas applicables aux travaux de réhabilitation et de\nsurélévation des constructions existantes à la date d’approbation du PLU ayant une emprise\nau sol supérieure à celle définie.\nPLU de Vaucresson    Règlement","    15\nArticle 11 : ASPECT EXTERIEUR DES CONSTRUCTIONS ET AMENAGEMENT DE LEURS\nABORDS\nEn secteur pavillonnaire, des clôtures visant à limiter les nuisances sonores, dérogeant aux\nrègles de hauteur et dans une limite de 3 mètres, peuvent être installées le long des axes\nroutiers bruyants. Ces clôtures devront être conçues de manière à s'harmoniser, par les\nmatériaux, les teintes et le style général, avec la ou les constructions existantes sur la propriété\net dans le voisinage immédiat.\nLes axes routiers dits « bruyants » sont listés ci-après :\n   -   Route Napoléon III,\n   -   Route de la Chasse Royale,\n   -   Route des Puits (tronçon compris entre la route de la chasse Royale et l’avenue Théry).\nArticle 12 : OBLIGATIONS IMPOSEES AUX CONSTRUCTEURS EN MATIERE DE\nREALISATION D'AIRES DE STATIONNEMENT\nEn application du Plan de déplacements urbains de la Région Ile-de-France :\n   -   dans un rayon de 500 mètres autour de la gare, il ne pourra être créé plus d’une\n    place de stationnement pour 45m² de surface de plancher à usage de bureau,\n   -   au-delà d’un rayon de 500 mètres autour de la gare, il peut être imposé au maximum\n    une place de stationnement pour 55m² de surface de plancher à usage de bureau,\nArticle 13 : OBLIGATION IMPOSEES AUX CONSTRUCTEURS EN MATIERE DE\nREALISATION D’ESPACES LIBRES, D’AIRES DE JEUX ET DE LOISIRS, ET DE\nPLANTATION\nLes espaces libres, partie du terrain non occupée par les constructions édifiées au-dessus\ndu sol, doivent bénéficier d’un aménagement paysager de qualité, majoritairement en pleine\nterre, participant à l'intégration de la construction dans le site, à l'amélioration du cadre de\nvie, au renforcement de la biodiversité et à la gestion des eaux pluviales.\nLes espaces verts sont les espaces libres bénéficiant d’un aménagement végétal tels que les\nespaces de pleine terre, les aménagements de surface perméables (dalles alvéolées\nvégétalisées) et les espaces aménagés sur dalle en rez-de-chaussée avec un minimum de 80\ncentimètres de terre végétale.\nLes espaces verts doivent bénéficier d’une conception diversifiée et équilibrée, utilisant les 3\nstrates végétales (herbacée, arbustive et arborée). Les plantations existantes significatives\ndoivent être maintenues. Le choix des essences doit être adapté au lieu, à l’environnement\nproche, aux données écologiques du milieu en privilégiant les espèces endogènes (liste jointe\nen annexe), car mieux adaptées à la géographie et au climat, et doit prohiber les espèces\ninvasives (liste jointe en annexe).\nUn espace est de pleine terre lorsqu'aucun élément ou construction en surface du sol ou en\nsous-sol ne vient limiter la libre infiltration des eaux pluviales, à moins qu’il ne comporte que\nle passage éventuel de réseaux (électricité, téléphone, eaux potable, usées, pluviales).\nPLU de Vaucresson    Règlement","    16\nCoefficient de biotope par surface (CBS)\nLe CBS est un coefficient qui décrit la proportion des surfaces favorables à la biodiversité\n(surface écoaménageable) par rapport à la surface totale d’une parcelle. Le calcul du CBS\npermet d’évaluer la qualité environnementale d’une parcelle, d’un ilot, d’un quartier, ou d’un\nplus vaste territoire.\nLe CBS est une valeur qui se calcule de la manière suivante :\n    CBS = surface écoaménageable / surface de la parcelle.\nLa surface écoaménageable est calculée à partir des différents types de surfaces qui\ncomposent la parcelle :\n    Surface écoaménageable = (surface de type A x coef. A) + (surface de type B x\n    coef. B) + ... + (surface de type N x coef. N).\nPour plus d’informations, il convient de se reporter aux données fournies par l’agence de\nl'environnement et de la maîtrise de l'énergie (Ademe).\nProtection des arbres\nLors de tous travaux de construction et division de parcelle, il doit être considéré un périmètre\nde protection en forme de cercle dont la circonférence est celle de l'arbre à l'âge adulte et dont\nle centre correspond au tronc de l'arbre au niveau du sol.\nArbres remarquables protégés au titre de L.123. 1-5 III 2° (Nouv. art. L151-23) du Code de\nl'Urbanisme.\nPLU de Vaucresson    Règlement","    17\nLa ville de Vaucresson demande qu’un soin particulier soit apporté à l'entretien et à la\npréservation des arbres, conformément aux prescriptions contenues dans le Guide de gestion\ncontractuelle de l'Arbre des Hauts de Seine, approuvé par l’Assemblée départementale du 19\nnovembre 2004 (de même que l’inventaire des arbres remarquables). Ce guide est disponible\nà l’adresse suivante : http://www.hauts-de-seine.fr/cadre-de- vie/patrimoine-vert/patrimoine-\nnaturelLla-gestion-des-arbres-dans-les-hauts-de-seine\nPlus précisément, la ville de Vaucresson a joint en annexe au présent règlement de PLU le\n« Contrat de Préservation de l'Arbre : 7 engagements pour l’Arbre ». Une évolution\nlégislative concernant le point 6 ne permet plus à une collectivité d’en être signataire.\nCependant, la ville de Vaucresson s’engage à respecter et faire respecter par tout acteur les\nengagements constitutifs de ce contrat.\nArticle 14 : LOTISSEMENTS, DIVISIONS FONCIERES ET APPLICATION DU REGLEMENT\nSur l’ensemble du territoire et dans toutes les zones, en application de l’exception mentionnée\nà l’article R151-21.3, dans le cas d'un lotissement ou dans celui de la construction, sur une\nunité foncière ou sur plusieurs unités foncières contiguës, de plusieurs bâtiments dont le terrain\nd'assiette doit faire l'objet d'une division en propriété ou en jouissance, chaque projet\nconcernant un lot issu d’une division est apprécié au regard de la totalité des règles édictées\npar le plan local d'urbanisme.\nEn d'autres termes, l'application des règles se fera à l'échelle de chacune des unités foncières\nnouvelles issues de la division (lot par lot) et non à l'échelle de l'unité foncière initiale.\nPLU de Vaucresson    Règlement","    18\nPARTIE 2\nDISPOSITIONS APPLICABLES AUX\nZONES URBAINES\nPLU de Vaucresson   Règlement","    19\n DISPOSITIONS APPLICABLES A LA ZONE UA\n DISPOSITIONS APPLICABLES A LA ZONE UA\nLa zone UA est divisée en plusieurs secteurs :\n   -   le secteur UAa correspond aux abords du boulevard de la République depuis la gare\n    jusqu’à l’entrée Est de la commune,\n   -   le secteur UAb correspond aux espaces situés au Sud de la gare,\n   -   le secteur UAc correspond au centre historique et à sa continuité à l’Ouest de la rue\n    de l’Eglise à la rue des Fonds Huguenot.\nUne orientation d’aménagement et de programmation précise les conditions d’aménagement\n« centre-ville - secteur gare » comprise sur les secteurs UAa et UAb.\nLes dispositions applicables à la zone UA et détaillées dans les articles 1 à 16 sont\ncomplémentaires de la Partie 1 - Dispositions générales. Il est nécessaire de prendre\nconnaissance de l'ensemble des dispositions en amont des projets.\nARTICLE UA.1 : OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\nSont interdits dans l’ensemble de la zone :\n   -   les constructions destinées à l'exploitation agricole ou forestière ou à la fonction\n    d'entrepôt,\n   -   les constructions et installations à destination d’industrie,\n   -   les terrains de camping ou de caravaning, parcs résidentiels de loisirs, les aires\n    d’accueil des gens du voyage,\n   -   l’implantation et l’extension d’installations classées au titre de la protection de\n    l’environnement et soumises à autorisation ou à déclaration qui par leur nature, leur\n    importance ou leur aspect seraient incompatibles avec la sécurité, la salubrité, la\n    commodité ou le caractère du milieu environnant,\n   -   les décharges, dépôts de ferraille, de matériaux de démolition, de déchets, d’épaves\n    de véhicules,\n   -   l’ouverture et l’exploitation de carrières,\n   -   les affouillements et exhaussements du sol, à l’exception de ceux autorisés à l’article\n    UA.2,\n   -   l’abattage d’un arbre remarquable identifié dans le document graphique du règlement\n    et préservé au titre de l’article L.123 1-5 III 2° (Nouv. art. L151-23) du code de\n    l’urbanisme,\n   -   le non-respect des prescriptions liées aux bâtis remarquables,\n   -   tout abattage d’arbre n’ayant pas fait l’objet d’une autorisation.\nSont interdits dans les secteurs UAa et UAc :\n   -   le changement de destination des rez-de-chaussée accueillant des commerces ou\n    activités artisanales, repérés sur le document graphique du règlement en application\n    de l’article L.123.1.5 II 5° (Nouv. art. L151-16) du code de l’urbanisme.\nPLU de Vaucresson    Règlement","    20\nARTICLE UA.2 : OCCUPATIONS ET UTILISATIONS DU SOL SOUMISES A DES\nCONDITIONS PARTICULIÈRES\nLes constructions destinées au commerce, aux bureaux, à l'artisanat sont autorisées sous\nréserve que les nuisances, notamment sonores, et dangers puissent être prévenus de manière\nsatisfaisante eue égard à la vocation de la zone.\nLe plan de zonage précise les vocations principales des différents secteurs et les linéaires\ndestinés prioritairement aux commerces et aux activités.\nLes affouillements et exhaussements du sol sont autorisés à condition d’être liés à une\noccupation du sol autorisée dans la zone et à condition, pour les opérations de construction,\nde ne pas dépasser 0,50m de hauteur.\nIl est demandé un minimum de 30% de logements sociaux dans tous programmes de\nconstruction, d’aménagement, de réhabilitation ou de changement de destination de locaux à\ndestination d’habitation.\nCette disposition est applicable à partir de 300 m² de surface de plancher ou de 5 logements.\nSe reporter à l’article 9 des dispositions générales du présent règlement, « Précisions de\ndéfinition de certains articles » des dispositions générales du présent règlement pour le calcul\ndu nombre de logements aidés à réaliser.\nLes Orientations d’Aménagement et de Programmation (OAP) précisent les conditions\nd’aménagement et de construction dans la zone. Le cas échéant, les prescriptions des OAP\nportant sur la hauteur, l’implantation ou l’aspect extérieur des constructions se substituent aux\nrègles de la zone. L’orientation d’aménagement et de programmation « centre-ville – secteur\ngare » précise ainsi, notamment, la destination et sous-destination des « commerces et\nactivités de service » autorisées conformément à l’article R151-28 du Code de l’urbanisme.\nARTICLE UA.3 : CONDITIONS DE DESSERTE DES TERRAINS PAR LES VOIES\nPUBLIQUES OU PRIVÉES ET D'ACCÈS AUX VOIES OUVERTES AU PUBLIC\nPour être constructible, un terrain doit avoir un accès à une voie publique ou privée ouverte à\nla circulation automobile et en état de viabilité. Afin que les caractéristiques des accès\npermettent de satisfaire aux exigences de la sécurité, de la défense contre l'incendie et de la\nprotection civile, ceux-ci devront avoir une largeur supérieure ou égale à 3,5 mètres.\nCette sécurité des accès doit être appréciée compte tenu notamment de la position des accès,\nde leur configuration ainsi que de la nature et de l’intensité du trafic.\nTout projet de construction ou d’extension sera refusé sur des terrains ne répondant pas aux\nexigences précitées.\nLes accès doivent être situés en des points les plus éloignés possibles des carrefours\nexistants, des virages et autres endroits où la visibilité est mauvaise. Lorsque le terrain est\nriverain de plusieurs voies, l’accès sur celles de ces voies qui présente le plus de risques pour\nla circulation peut être interdit.\nLes voies se terminant en impasse doivent être aménagées afin de permettre aux véhicules\nde sécurité de faire demi-tour.\nLe nombre d’entrées charretières depuis une voie publique sur un terrain est limité à un par\ntranche entamée de 30 mètres à l’alignement. Exceptionnellement une unique entrée\ncharretière pourra être autorisée, au-delà des limitations fixées ci-avant, dans le cas des\ngarages donnant sur voie.\nPLU de Vaucresson    Règlement","    21\nARTICLE UA.4 : CONDITIONS DE DESSERTE DES TERRAINS PAR LES RÉSEAUX\nPUBLICS D'EAU, D'ÉLECTRICITÉ ET D'ASSAINISSEMENT\nLa compétence assainissement est exercée par l’établissement public territorial Paris Ouest\nLa Défense.\nAlimentation en eau potable\nToute construction ou installation nouvelle qui, par sa destination, implique une utilisation d'eau\npotable, doit obligatoirement être alimentée par branchement à un réseau collectif de\ndistribution.\nAssainissement des eaux usées et pluviales\nPour consulter l’ensemble des dispositions relatives à l’assainissement, se référer aux\ndispositions générales du présent règlement, « Article 10 : PRECISIONS DE DEFINITIONS\nDE CERTAINS ARTICLES ».\nRéseaux divers\nLe raccordement des constructions aux réseaux concessionnaires (télécommunication,\nélectricité basse tension) doit être en souterrain jusqu'à la limite du domaine public en un point\nà déterminer en accord avec le service gestionnaire.\nDans les opérations d'ensemble telles que lotissement ou ensemble de constructions\ngroupées, la desserte des réseaux intérieurs doit être enterrée.\nDéchets\nDes locaux techniques de superficie suffisante doivent être prévus ou aménagés pour\naccueillir les conteneurs nécessaires à la collecte sélective des déchets ménagers. Ces locaux\ndoivent être facilement accessibles par les résidents.\nARTICLE UA.5 : SUPERFICIE MINIMALE DES TERRAINS CONSTRUCTIBLES\nSans objet.\nARTICLE UA.6 : IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX VOIES\nPUBLIQUES ET PRIVEES\nPour le secteur UAa\nLes constructions, hors clôtures et annexes, s’implantent :\n   o Sur voies larges (dont la largeur est supérieure à 12m) :\n    -    à l’alignement des voies publiques ou privées,\n    -    en retrait de l’alignement des voies publiques ou privées en respectant une\n    marge de recul de 1 mètre minimum.\nPLU de Vaucresson    Règlement","    22\n   o Sur voies étroites (dont la largeur est inférieure ou égal à 12m) :\n    -   en retrait de l’alignement des voies publiques ou privées en respectant une\n    marge de recul de 1 mètre minimum.\nPour le secteur UAb et UAc\nLes constructions, hors clôtures et annexes s’implantent soit :\n   o à l’alignement des voies publiques ou privées,\n   o en retrait de l’alignement des voies publiques ou privées en respectant une marge de\n    recul de 3 mètres minimum.\nPLU de Vaucresson    Règlement","    23\nDispositions particulières pour toute la zone UA\n   1) Sous réserve de leur compatibilité avec l'environnement tant au regard de leur aspect\n    que de leur fonction, les constructions et installations nécessaires aux services publics\n    ou d’intérêt collectif s’implantent soit :\n    - à l’alignement des voies publiques ou privées,\n    - en retrait de l’alignement sur voies publiques ou privées en respectant une marge\n    de recul de 1 mètre minimum.\n   2) Les saillies sur voie ne peuvent être situées à moins de 5 mètres au-dessus du niveau\n    de la voie, ni présenter une saillie sur alignement de plus de 0,80 mètre. Les éléments\n    de modénature en saillie sont acceptés sous réserve d’une justification architecturale\n    qualitative ;\n   3) En cas de division de terrain, les voies créées doivent être implantées de façon à\n    préserver l’ordonnancement architectural du bâti existant ainsi que l’équilibre de la\n    composition entre le bâti et l’espace végétalisé du terrain ;\n   4) Une implantation autre que celles autorisées peut être accordée si cela permet une\n    implantation de la construction en continuité d’une construction existante ;\n   5) Un retrait de l’alignement des voies publiques ou privées différent de celui imposé\n    pourra être admis ou imposé afin d’améliorer l’intégration du projet dans son\n    environnement immédiat ou lorsqu'une échappée visuelle sur un espace libre le\n    justifie ;\n   6) Si le projet architectural le justifie et participe à l’animation paysagère, des retraits et\n    avancées ponctuelles pourront être autorisés ;\n   7) Exceptionnellement, les annexes, hors locaux techniques, pourront s’implanter en\n    limites de voies, leur hauteur maximum ne dépasse pas 3,2 mètres au faîtage et une\n    emprise au sol maximale de 25m². Cette disposition n’est applicable qu’une seule fois.\nARTICLE UA.7 : IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX LIMITES\nSEPARATIVES\nLes façades avec vues doivent s’implanter en retrait des limites séparatives, à une distance\nau moins égale à 6 mètres pour toute la zone.\nPour le secteur UAa, les façades sans vue peuvent s’implanter :\n   o sur une ou plusieurs limites séparatives,\n   o en retrait de celles-ci. En cas d’implantation en retrait d’une ou plusieurs limites\n    séparatives, la marge de recul doit être au moins égale à 3 mètres.\nEn limite de secteur UAa, les façades peuvent s’implanter sur une ou plusieurs limites\nséparatives à condition que pour chacune de ces limites, la construction s’adosse à une\nconstruction existante sur le terrain voisin et qu’elle n’en dépasse ni les dimensions ni les\nlimites.\nPour les secteurs UAb et UAc, les façades sans vue peuvent s’implanter :\n   o sur une ou plusieurs limites séparatives à condition que pour chacune de ces limites,\n    la construction s’adosse à une construction existante sur le terrain voisin et qu’elle n’en\n    dépasse ni les dimensions ni les limites\n   o en retrait de celles-ci. En cas d’implantation en retrait d’une ou plusieurs limites\n    séparatives, la marge de recul doit être au moins égale à 3 mètres.\nPLU de Vaucresson    Règlement","    24\n Dispositions particulières de toute la zone UA :\n 1) Sous réserve de leur compatibilité avec l'environnement tant au regard de leur aspect que\n    de leur fonction, les constructions et installations nécessaires aux services publics ou\n    d’intérêt collectif s’implantent soit :\n    - sur une ou plusieurs limites séparatives,\n    - en retrait des limites séparatives en respectant une marge de recul de 2 mètres\n    minimum en cas de façades sans vue et 4m minimum en présence de façades avec\n    vues.\n 2) L'implantation des constructions par rapport à une cour commune se fera en appliquant\n    les mêmes règles que pour les limites séparatives décrites ci-dessus ;\n 3) Pour toute la zone, le bord extérieur des balcons, dont la profondeur est inférieure ou égale\n    à 0,80 mètre, doit être à une distance supérieure ou égale à 3,5 mètres de la limite\n    séparative. Les balcons dont la profondeur est supérieure à 0,80 mètre sont considérés\n    comme des vues ;\n 4) Les éléments architecturaux suivants sont exclus des règles de retrait :\n    - les stores mobiles, les volets, les conduits de fumée,\n    - les corniches, les modénatures de façades, les débords de toiture,\n    - les dispositifs de performance énergétiques.\n 5) En cas de division de terrain, les limites séparatives créées doivent être implantées de\n    façon à préserver l’ordonnancement architectural du bâti existant ainsi que l’équilibre de la\n    composition entre le bâti et l’espace végétalisé du terrain.\n 6) Nonobstant les dispositions du présent article, l'implantation d'une construction en limite\n    séparative peut être refusée si elle a pour effet de porter gravement atteinte à l'aspect du\n    paysage urbain, et notamment à l'insertion de la construction dans le bâti environnant ;\n 7) Exceptionnellement, les annexes, hors locaux techniques, pourront s’implanter en limites\n    séparatives, si leur hauteur maximum ne dépasse pas 3,2 mètres au faîtage et une emprise\n    au sol maximale de 25m². Cette disposition n’est applicable qu’une seule fois.\n ARTICLE UA.8 : IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT\n AUX AUTRES SUR UNE MÊME PROPRIÉTÉ\n Sur une même unité foncière, les constructions non contiguës, hors annexes devront\n s’implanter à une distance minimale les unes des autres :\n    o de 6 m en cas de façades avec vues,\n    o de 3 m en cas de façades sans vue.\n Dispositions particulières de toute la zone UA :\nSous réserve de leur compatibilité avec l'environnement tant au regard de leur aspect que de\nleur fonction et des exigences liées aux règles de sécurité, ces dispositions ne s’appliquent pas\naux constructions et installations nécessaires aux services publics ou d'intérêt collectif.\n ARTICLE UA.9 : EMPRISE AU SOL DES CONSTRUCTIONS\n Sur l’ensemble du terrain, l’emprise au sol ne doit pas excéder :\n    - pour le secteur UAa, 80% de la superficie du terrain.\n    - pour les secteurs UAb, 40% de la superficie du terrain.\n    - pour le secteur UAc, 30% de la superficie du terrain.\n PLU de Vaucresson    Règlement","    25\nDispositions particulières de toute la zone UA :\n   1) Sous réserve de leur compatibilité avec l'environnement tant au regard de leur aspect\n    que de leur fonction, ces dispositions ne s’appliquent pas aux constructions et\n    installations nécessaires aux services publics ou d'intérêt collectif ;\n   2) Exceptionnellement, lors d’une rénovation d’un bâti existant, les dispositifs nécessaires\n    à l’utilisation des énergies renouvelables et à l’isolation par l’extérieur peuvent être\n    soustraits au calcul d’emprise au sol total de la construction ;\n   3) L’emprise au sol peut être augmentée de 5 m² maximum, à condition que cette\n    construction supplémentaire soit d’une hauteur inférieure ou égale à 3,20 mètres au-\n    dessus du terrain naturel. Cette disposition n’est applicable qu’une seule fois.\nARTICLE UA.10 : HAUTEUR MAXIMUM DES CONSTRUCTIONS\nLa hauteur des constructions est mesurée à partir du terrain naturel jusqu'au point le plus élevé\nde la construction (faîtage ou acrotère) ou sur mention spécifique jusqu’à l’égout du toit.\nDans le cas du secteur UAa, les hauteurs sont divisées en hauteur de façade et hauteur au\nfaîtage ou à l’acrotère.\nDans le secteur UAa :\nCalcul des hauteurs maximum\n    - Règle générale\nLa hauteur maximale des constructions ne doit pas excéder 15 mètres au faîtage ou à\nl’acrotère pour les toitures terrasses.\n    - Périmètre cœur de ville\nAu nord et au sud du boulevard de la République, partie comprise entre la rue Émile Testu et\nla rue du Docteur Christen, la hauteur totale des constructions ne doit pas excéder 19 mètres\nau faîtage ou à l’acrotère pour les toitures terrasses excepté le long de la rue de la Folie où la\nhauteur est limitée à 12 mètres sur une profondeur de 12 mètres.\nRègles de gabarit et modalités de calcul :\n    o Le gabarit de couronnement\nLe gabarit couronnement de la construction est le volume bâti compris entre la hauteur des\nfaçades et la hauteur plafond. Ce gabarit est compris, sauf cas particulier, dans un plan incliné\nde 45° (soit un ratio de 1/1). La surface de plancher de chaque niveau compris dans ce gabarit\nde couronnement ne peut représenter plus de 80% de la surface de plancher de l’étage\ninférieur.\n    o La hauteur de façade sur rue\nLa hauteur de façade sur rue se compte du niveau du terrain naturel à l’acrotère ou à l’égout\ndu toit. La hauteur maximum de la façade sur rue ne doit pas dépasser la largeur de la voie\nsur laquelle elle donne augmentée de 4 mètres et dans la limite de 12 mètres sur les voies\nétroites (inférieures ou égales à 12 mètres de large) et 15 mètres sur les voies larges\n(supérieures à 12 mètres de large).\n    o La hauteur de façade en limite séparative\nLa hauteur de façade en limite séparative se compte du niveau du terrain naturel à l’acrotère\nou l’égout du toit. Lorsque la hauteur maximum autorisée est supérieure à 3 mètres, le gabarit\nde couronnement peut être compris dans un ratio de 2/1 le long de ladite limite au lieu du ratio\nde 1/1.\nPLU de Vaucresson    Règlement","    26\n    En secteur UAa - périmètre cœur de ville\n    Hauteurs maximums    Hauteurs maximums\n    sur voies étroites (≤12m)    sur voies larges (≥12m)\nPLU de Vaucresson    Règlement","    27\n    En bordure de secteur UAa\n Différentiel des hauteurs maximum lorsque   Différentiel des hauteurs maximum lorsque\n  les hauteurs maximums au faîtage sont    les hauteurs maximums au faîtage sont\n    inférieures ou égales à un niveau    supérieures à un niveau\nPLU de Vaucresson    Règlement","    28\nDans le secteur UAb :\nLa hauteur maximale des constructions ne doit pas excéder 10 mètres au faîtage ou à\nl’acrotère pour les toitures terrasses\nCas particuliers applicables au secteur UAb :\n   o Dans une bande de 40 mètres de profondeur, au sud de la voie ferrée, entre le\n    boulevard de la République et le boulevard de Jardy, la hauteur des constructions ne\n    doit pas excéder 12 mètres au faîtage ou à l’acrotère pour les toitures terrasses,\n   o Dans une bande de 30 mètres de profondeur à l’Ouest du boulevard de Jardy, la\n    hauteur des constructions ne doit pas excéder 12 mètres au faîtage ou à l’acrotère pour\n    les toitures terrasses.\nDans le secteur UAc :\nLa hauteur maximale des constructions ne doit pas excéder 9 mètres au faîtage ou à l’acrotère\npour les toitures terrasses.\nCas particulier applicable au secteur UAc :\n   1) Dans une bande de 30 mètres de profondeur à l’Ouest du boulevard de Jardy, la\n    hauteur des constructions ne doit pas excéder 12 mètres au faîtage ou à l’acrotère pour\n    les toitures terrasses, avec le dernier niveau en attique.\n   2) Exceptionnellement, il est possible de déroger à cet article dans la limite de 1 mètre de\n    hauteur supplémentaire à condition de répondre aux critères cumulatifs suivants :\n    - L’emprise au sol de la partie de la construction concernée doit être inférieure ou\n    égale à 10 m²\n    - La distance par rapport aux limites séparatives et à la voie, en tout point de cette\n    partie de construction, doit être supérieure ou égale à 10 mètres\n    - Cette disposition n’est applicable qu’une seule fois.\nDispositions particulières de toute la zone UA :\n   1) Sous réserve de leur compatibilité avec l'environnement tant au regard de leur aspect\n    que de leur fonction, des hauteurs différentes de celles fixées aux paragraphes ci-\n    dessus peuvent être autorisées ou imposées, lorsqu'il s'agit des constructions et\n    installations nécessaires aux services publics ou d’intérêt collectif.\n   2) Les éléments de modénature et les garde-corps à claire-voie peuvent dépasser la\n    hauteur maximale des façades dans une limite de 1,00 mètre ;\nPLU de Vaucresson    Règlement","    29\n   3) Les éléments de constructions sur terrasses ne sont pas comptés dans la hauteur\n    maximale autorisée, à condition que ceux-ci ne dépassent pas une hauteur maximum\n    de 1,00 m, qu’ils soient implantés en retrait des façades d’une distance d’au moins 3,00\n    m et qu’ils abritent uniquement la machinerie des ascenseurs, la sortie des escaliers,\n    la chaufferie et le conditionnement d’air, les gaines de ventilation, les souches de\n    cheminées ;\n   4) Dans le cas des annexes, la hauteur maximale est limitée à 3,20 mètres au faitage ;\n   5) En cas de terrain en pente, les hauteurs maximums autorisées devront être respectées\n    en tout point de l’emprise au sol de la construction vis-à-vis du terrain naturel. Des\n    dépassements ponctuels pourront être autorisés si ceux-ci ont pour effet de permettre\n    un lissage des hauteurs de la construction ;\n   6) Des dépassements ponctuels du gabarit-enveloppe pourront être admis sous réserve\n    que ceux-ci participent à un projet architectural cohérent permettant de rythmer les\n    façades ;\n   7) Pour les parcelles d'angle situées à l'intersection de deux voies d'inégales largeurs\n    donnant sur le boulevard de la République, le gabarit et les hauteurs autorisés le long\n    de la voie la plus large, pourront s'appliquer le long de la voie la plus étroite sur une\n    profondeur de 15 mètres, comptée à partir de l'alignement à la voie la plus large.\n    Pour les parcelles d'angle situées à l'intersection de deux voies d'inégales largeurs ne\n    donnant pas sur le boulevard de la République, le gabarit et les hauteurs autorisés le\n    long de la voie la plus étroite, pourront s'appliquer le long de la voie la plus large sur\n    une profondeur de 15 mètres, comptée à partir de l'alignement à la voie la plus étroite.\nARTICLE UA.11 : ASPECT EXTERIEUR DES CONSTRUCTIONS ET AMENAGEMENT DE\nLEURS ABORDS\nLes constructions ne doivent pas porter atteinte au caractère ou à l’intérêt des lieux\navoisinants, des sites et des paysages naturels ou urbains.\nLe projet peut être refusé ou n'être accepté que sous réserve de l'observation de prescriptions\nspéciales si les constructions à édifier ou à modifier, par leur situation, leur architecture, leurs\ndimensions ou leur aspect extérieur, sont de nature à porter atteinte au caractère ou à l'intérêt\ndes lieux avoisinants, aux sites, aux paysages naturels ou urbains ainsi qu'à la conservation\ndes perspectives monumentales.\nEn complément des règles édictées ci-dessous, et en amont de tout projet d’aménagement\net/ou de construction, il est fortement recommandé de se reporter et de prendre en compte les\ndispositions du cahier de recommandations environnementales, urbaines, paysagères et\narchitecturales situé en annexe du présent règlement.\nL’orientation d’aménagement et de programmation précise l’aspect extérieur des constructions\net les aménagements de leurs abords : le cas échéant, ses dispositions se substituent aux\ndispositions du présent article UA.11.\nMATERIAUX ET COULEURS :\nLa façade de la construction devra être en harmonie avec les façades avoisinantes.\nL'utilisation de matériaux nus laissés apparents alors qu’ils sont destinés à être recouverts\n(type parpaings, carreaux de plâtre, plaques de ciment non enduits ou tôles) est interdite. La\ncouleur des menuiseries doit être en harmonie avec la couleur des parements.\nPLU de Vaucresson    Règlement","    30\nFAÇADES :\nTous les murs des constructions doivent présenter une unité d'aspect par façade et une\ncouleur en harmonie avec les constructions existantes dans le voisinage.\nLes pierres de taille, les meulières ou la brique pleine ne peuvent être recouvertes de\nrevêtements, d’enduit ou de peinture, sauf si les contraintes techniques le justifient.\nLa couleur et les matériaux des portes de parking doivent leur assurer une bonne insertion\npaysagère.\nLes linéaires bâtis par façade d’une même construction ne peuvent dépasser 30 mètres le long\ndu boulevard de la République et 20 mètres pour les autres voies.\nLes linéaires bâtis pourront être augmentés si le projet justifie d’un parti pris architectural\ncohérent et suffisamment rythmé de la façade.\nDans certaines configurations particulières liées à un linéaire important du terrain sur voie, ou\nlorsqu’une échappée visuelle sur un espace libre le justifie, peuvent être admises ou imposées\ndes ruptures dans l’implantation de la construction.\nTOITURES :\nLes toitures des constructions doivent présenter une simplicité de volume et une unité de\nconception.\nPour les secteurs UAa et UAb, les toitures devront être composées soit :\n   o d'un ou plusieurs éléments à pentes, sauf pour les vérandas et les annexes isolées\n    d’une superficie maximale de 20 m² d’emprise au sol.\n   o au niveau le plus haut, de toitures terrasses sous réserve d’être végétalisées et non\n    accessibles.\n   o aux niveaux intermédiaires, de toiture terrasses partielles à condition de respecter les\n    distances de vues par rapport aux limites séparatives. Cela signifie que les limites\n    extérieures de la partie accessible sont considérées comme des façades avec vues.\n    Ces toitures terrasses partielles doivent avoir un aménagement paysager pérenne.\nPour le secteur UAc, les toitures devront être composées :\n   o d'un ou plusieurs éléments à pentes, sauf pour les vérandas et les annexes isolées\n    d’une superficie maximale de 20 m² d’emprise au sol.\n   o de toitures terrasses sous réserve d’être végétalisées et non accessibles.\n   o Exceptionnellement, les toits terrasses accessibles sont autorisés :\n    - dans la limite de 3 mètres au-dessus du niveau naturel du sol,\n    - à condition de respecter les distances de vues par rapport aux limites\n    séparatives.\nPLU de Vaucresson    Règlement","    31\nLes couvertures dont l’aspect est comparable à de la tôle ondulée, du fibrociment ou du papier\ngoudronné (shingle) sont interdites.\nLes matériaux de couverture des extensions doivent être en harmonie avec ceux présents sur\nla construction existante. Toutefois, pour les extensions présentant une faible pente, une\ncouverture d’aspect différent ou métallique est admise. Les verrières sont admises pour les\nvérandas.\nLes capteurs solaires ou les panneaux photovoltaïques ainsi que tout autre dispositif de\nproduction d’énergie renouvelable sont autorisés à condition de s’intégrer à la pente du toit et\nà la composition architecturale de la construction (positionnement cohérent avec le traitement\ndes façades, notamment des ouvertures, et préférentiellement en bandeau) ainsi qu’au site.\nCLOTURES :\nLa hauteur totale des clôtures, sur rue comme en limites séparatives, ne doit pas excéder 2\nmètres sauf pour les piliers et les portails qui peuvent atteindre 2,50 mètres.\nNonobstant la règle édictée ci-avant, les clôtures doivent être conçues de manière à\ns'harmoniser par les matériaux avec la ou les constructions existantes sur la propriété, les\nclôtures existantes de caractère, et le voisinage immédiat dans le respect des préconisations\ndu cahier architectural de Vaucresson. Ces clôtures devront être ajourées afin de participer à\nl’animation paysagère des voies.\nAfin de préserver son patrimoine local et l’harmonisation des clôtures, un dépassement des\nrègles de hauteur maximum imposé ci-après pourra être autorisé.\nEn bordure de l'espace de desserte les clôtures doivent être constituées :\n   o soit par un soubassement maçonné de 0,80 mètre de hauteur maximum, surmonté\n    d’éléments disposés verticalement.,\n   o soit d’une haie végétale d’essences locales diversifiée doublée ou non d’un grillage\n    éventuellement posé sur un soubassement n’excédant pas 0,80 mètre de hauteur.\nPLU de Vaucresson    Règlement","    32\n   o soit d’un mur en maçonnerie traditionnelle conservé ou restauré. Dans ces murs\n    existants peuvent être autorisés un percement n’excédant pas 3 mètres de large pour\n    l’accès automobile et un percement inférieur ou égal à 1,20 mètre de large pour l’accès\n    piéton.\nEn limites séparatives, les clôtures maçonnées (murs, murets, mur-bahuts...) sont interdites.\nLa réalisation d'une clôture végétalisée est à privilégier afin de préserver la perméabilité\npaysagère. Sauf nécessité technique ou liée à l'usage et à la sécurité du site, ces dispositions\ns'appliquent également aux constructions et installations nécessaires aux services publics ou\nd'intérêt collectif. Des dispositions différentes pourront également être admises pour les\nclôtures situées entre une propriété privée et un espace public en cas de nécessités liées à\nl’usage et à la sécurité du site.\nDe manière générale, en limites séparatives de propriété et à l'alignement de l’espace de\ndesserte, les clôtures en parpaings, en béton ou plaque de béton préfabriquée non recouverts,\nou en matériau ayant l’aspect de la tôle, sont interdites.\nDes passages seront créés en pieds de clôture, notamment sur les limites séparatives, afin de\nfaciliter le passage de la petite faune locale.\nLes coffrets et les boites aux lettres doivent être encastrés dans les clôtures. Leur implantation\nen saillie sur l’alignement est interdite.\nDispositions particulières de toute la zone UA :\n   1) Sous réserve de leur compatibilité avec l'environnement tant au regard de leur aspect\n    que de leur fonction, les dispositions mentionnées ci-avant ne s'appliquent pas aux\n    constructions et installations nécessaires aux services publics ou d'intérêt collectif ;\n   2) Les antennes doivent avoir une emprise uniquement sur la parcelle et seront, de\n    préférence, non visibles depuis l’espace public ;\n   3) Les appareillages techniques (climatiseurs, pompes à chaleur...) doivent être intégrés\n    à la construction ;\n   4) Concernant les bâtis remarquables protégés au titre de l’article L.123-1-5 III 2° (Nouv.\n    art. L151-19) du code de l’urbanisme, les travaux de réhabilitation doivent concourir à\n    mettre en valeur ou conforter le caractère originel des bâtiments. Certaines adjonctions\n    partielles peuvent être admises lorsqu’elles participent à la mise en valeur de l’édifice.\nARTICLE UA.12 : OBLIGATIONS IMPOSEES AUX CONSTRUCTEURS EN MATIERE DE\nREALISATION D'AIRES DE STATIONNEMENT\n12.1. - Principes\nLe stationnement des véhicules correspondant aux besoins des constructions et leur\ninstallation doivent être assurés en dehors des voies publiques. Les places de stationnement\nsont réalisées sur le terrain d’assiette de l’opération ou dans son environnement immédiat.\nIl doit être réalisé, à l'occasion de toute construction ou installation nouvelle, des aires de\nstationnement selon les prescriptions édictées au paragraphe 2 ci-après du présent article.\nL’extension d’une construction existante doit respecter les normes de stationnement :\n    - lorsque l’augmentation de la surface de plancher dépasse 20% de celle de la\n    construction initiale\n    - en cas de changement d’affectation.\nPLU de Vaucresson    Règlement","    33\nLes constructions neuves à usage principal d’habitation regroupant au moins deux logements,\nà usage principal tertiaire, ou à usage principal de bureaux sont équipés d'un parc de\nstationnement. Une alimentation électrique destinée à la recharge des véhicules, et des places\nde stationnement réservées aux vélos, doivent être prévues (articles R.111-14-2 et suivants\ndu code de la construction et de l’habitation).\n12.2. - Nombre d'emplacements\n    o 2.1. Pour les véhicules motorisés\nConstructions à destination d'habitation pour le logement aidé :\nSelon les dispositions de l’article L.123-1-13 (Nouv. art. L151-35) du code de l’urbanisme une\nseule place de stationnement est exigible lors de la construction de logements locatifs financés\navec un prêt aidé de l’Etat.\nDans un rayon de 500 mètres autour de la gare, les obligations en matière de stationnement\nsont réduites à 0,5 place par logement locatifs financés avec un prêt aidé de l’Etat.\nLes logements financés par des prêts locatifs aidés d'intégration (PLAI) sont exonérés de\nréaliser des places de stationnement.\nConstructions à destination d'habitation pour le logement libre :\nIl doit être créé :\n    o une place de stationnement par tranche de 60 m² de surface de plancher entamée,\n    avec un minimum d’une place par logement.\n    o dans un rayon de 500 mètres autour de la gare, les obligations en matière de\n    stationnement sont réduites à 1 place par logement.\nConstructions à destination d’hébergement hôtelier :\nIl doit être créé une place de stationnement pour 2 chambres.\nConstructions destinées à l'artisanat :\nIl doit être prévu autant de places de stationnement que de véhicules liés à l’activité artisanale.\nConstructions destinées au commerce :\nIl est créé une place de stationnement pour 25% de surface de plancher avec un minimum de\n1 place pour les employés ou visiteur.\nPour les extensions des commerces existants à la date d’approbation du PLU, il doit être créé\nautant de place de stationnement que de véhicules nécessaires à l’activité avec un minimum\nde 1 place.\nConstructions destinées aux bureaux :\nIl est créé une place de stationnement pour 45 m² de surface de plancher. Cette disposition\nne s’applique pas au changement d’affectation.\n    o    2.2. Pour les cycles\nConstruction à destination d’habitat collectif :\nIl doit être réservé un emplacement d’une superficie minimale de 1,50 m² par logement pour\nle stationnement des cycles et des poussettes.\nPLU de Vaucresson    Règlement","    34\nConstructions à destination de bureaux :\nIl doit être réservé pour les cycles un emplacement d’une superficie minimale de 1,5 m² pour\n100m² de surface de plancher pour le stationnement des cycles.\nConstructions à destination de commerces de plus de 500 m² de surface de plancher,\nd’industrie, d’artisanat et pour les constructions et installations nécessaires aux services\npublics ou d'intérêt collectif :\nIl doit être créé au moins une place de stationnement pour les cycles pour dix employés et une\nplace pour douze usagers ou visiteurs hors équipements scolaires.\n12.3 - Caractéristiques du stationnement\n    -   Surface de stationnement pour les parkings collectifs :\nLe nombre de places sera calculé sur la base de 25 m² par place.\nARTICLE UA.13 : OBLIGATIONS IMPOSÉES AUX CONSTRUCTEURS EN MATIÈRE DE\nRÉALISATION D'ESPACES LIBRES, D'AIRES DE JEUX ET DE LOISIRS, ET DE\nPLANTATIONS\nSe référer à la partie 1 du règlement concernant les dispositions générales de l’article 13.\nEn complément des dispositions du présent article, il est fortement recommandé de prendre\nconnaissance et d'appliquer les dispositions inscrites dans le Contrat de l'Arbre, document issu\ndu Guide de gestion contractuelle de l'Arbre des Hauts-de-Seine (annexe 3).\nTout arbre abattu doit être remplacé par un arbre de même envergure. Toutefois, il pourra être\nadmis un choix différent pour tenir compte des éventuelles contraintes de l'environnement\ndans lequel il s'implante (port, envergure, hauteur). Le choix de l'essence doit se faire dans la\nliste des espèces végétales recommandées située en annexe 5 du présent règlement.\nToute construction à édifier au-dessus du sol et/ou en sous-sol doit assurer la préservation\ndurable des spécimens de qualité, identifiés comme élément de paysage et mettre en valeur\nles arbres remarquables repérés au document graphique.\nDans le périmètre des arbres, il est interdit de réduire la perméabilité du sol.\nPleine terre :\nDoit être traité en pleine terre :\n    o En secteur UAa : le coefficient de biotope par surface (CBS) ne doit pas être inférieur\n    à 0,35 (voir la définition et le détail du mode de calcul du CBS dans la partie\n    « dispositions générales » du présent règlement).\n    o En secteur UAb : 40% de l’unité foncière.\n    o En secteur UAc : 50% de l’unité foncière.\nDans l’ensemble de la zone et sous réserve de leur compatibilité avec l'environnement tant au\nregard de leur aspect que de leur fonction, le pourcentage applicable pour les constructions et\ninstallations nécessaires aux services publics ou d'intérêt collectif est de 20% minimum (à\nl’échelle de l’unité foncière).\nPLU de Vaucresson    Règlement","    35\nPlantation :\nUn arbre de moyen développement (hauteur 15/25m – largeur 8/10m) doit être planté, s’il\nn’existe pas déjà, par tranche de 150 m² d’espaces de pleine-terre, en évitant la proximité des\nlimites séparatives.\nDe plus un arbre à grand développement (hauteur 20/30m – largeur 10/20m) doit être planté,\ns’il n’existe déjà, par tranche de 500 m² de pleine-terre, en évitant la proximité des limites\nséparatives.\nLes haies sont implantées en retrait de 1 mètre de la clôture sur voie, afin de ne pas gêner le\npassage des piétons. Elles sont de préférence paysagères, libres, et composées d’au moins\ntrois espèces mélangeant feuillage caduc et persistant.\nEspaces verts :\nLes espaces verts doivent bénéficier d’une conception diversifiée et équilibrée, utilisant les 3\nstrates végétales (herbacée, arbustive et arborée). Les plantations existantes significatives\ndoivent être maintenues. Le choix des essences doit être adapté au lieu, à l’environnement\nproche, aux données écologiques du milieu en privilégiant les espèces indigènes (liste jointe\nen annexe), car mieux adaptées à la géographie et au climat, et doit prohiber les espèces\ninvasives (liste jointe en annexe).\nLes espaces libres situés à l’intérieur des marges de retrait des constructions par rapport à\nl’alignement doivent être majoritairement végétalisés et contribuer à l’harmonie paysagère de\nla voie.\nAires de stationnement\nA partir de 4 places de stationnement en surface, il est exigé la réalisation d’un ou de plusieurs\nécrans paysagers, sous la forme d’une haie de végétaux d’une hauteur supérieure ou égale à\n1,50 mètre, destinés à masquer les véhicules, notamment à partir de la voie et des parcelles\nvoisines.\nL’utilisation de matériaux perméables doit être favorisée pour le sol des aires de stationnement.\nARTICLE UA.14 : COEFFICIENT D'OCCUPATION DU SOL\nSans objet.\nARTICLE UA.15 : PERFORMANCES ÉNERGÉTIQUES ET ENVIRONNEMENTALES\nIl est recommandé que les constructions prennent en compte tout ou partie des objectifs\nsuivants du développement durable et de la préservation de l’environnement tout en\ns’inscrivant en harmonie avec le paysage urbain existant par :\n   o l’utilisation de matériaux renouvelables, récupérables, recyclables ;\n   o l’intégration de dispositifs de récupération de l’eau de pluie ;\n   o l’installation de dispositifs de production d’énergie renouvelable pour\n    l’approvisionnement énergétique des constructions (chaudière bois, eau chaude\n    sanitaire solaire, pompes à chaleur, photovoltaïque, géothermie…) ;\n   o l’orientation des constructions pour favoriser la récupération des apports solaires et\n    valoriser la lumière naturelle afin de limiter les dépenses énergétiques ;\nPLU de Vaucresson    Règlement","    36\nLes équipements liés aux énergies renouvelables (capteurs solaires, panneaux\nphotovoltaïques, …) doivent être intégrés et adaptés à la composition architecturale des\nconstructions et à leur environnement patrimonial et paysager.\nARTICLE UA.16    :   INFRASTRUCTURES    ET   RÉSEAUX    DE    COMMUNICATION\nNUMÉRIQUE\nPour toute construction ou installation nouvelle qui implique une utilisation de moyens de\ncommunication son raccordement au réseau de communication numérique doit être prévu.\nDans le cas où la Commune viendrait à disposer de nouveaux réseaux de distribution, le\nraccordement à ces réseaux sera imposé aux constructions neuves.\nPLU de Vaucresson    Règlement","    37\n DISPOSITIONS APPLICABLES A LA ZONE UB\n DISPOSITIONS APPLICABLES A LA ZONE UB\nExtrait du rapport de présentation :\n«La zone UB correspond au secteur Mazeleyre-Seigneurie ».\nLes dispositions applicables à la zone UB et détaillées dans les articles 1 à 16 sont\ncomplémentaires de la Partie 1 - Dispositions générales. Il est nécessaire de prendre\nconnaissance de l'ensemble des dispositions en amont des projets.\nARTICLE UB.1 : OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\nSont interdits dans l’ensemble de la zone :\n   -   les constructions destinées à l'exploitation agricole ou forestière ou à la fonction\n    d'entrepôt,\n   -   les constructions et installations à destination d’industrie,\n   -   les terrains de camping ou de caravaning, parcs résidentiels de loisirs,\n   -   les aires d’accueil des gens du voyage,\n   -   l’implantation et l’extension d’installations classées au titre de la protection de\n    l’environnement et soumises à autorisation ou à déclaration qui par leur nature, leur\n    importance ou leur aspect seraient incompatibles avec la sécurité, la salubrité, la\n    commodité ou le caractère du milieu environnant,\n   -   les décharges, dépôts de ferraille, de matériaux de démolition, de déchets, d’épaves\n    de véhicules,\n   -   l’ouverture et l’exploitation de carrières,\n   -   les affouillements et exhaussements du sol, à l’exception de ceux autorisés à l’article\n    UB.2.\n   -   l’abattage d’un arbre remarquable identifié dans le document graphique du règlement\n    et préservé au titre de l’article l’article L.123 1-5 III 2° (Nouv. art. L151-23) du code de\n    l’urbanisme.\n   -   le non respect des prescriptions liées aux bâtis remarquables,\n   -   tout abattage d’arbre n’ayant pas fait l’objet d’une autorisation.\nARTICLE UB.2 : OCCUPATIONS ET UTILISATIONS DU SOL SOUMISES A DES\nCONDITIONS PARTICULIÈRES\nLes constructions destinées aux bureaux sont autorisées à condition :\n   -   qu’elles s’inscrivent dans le même volume que l’habitation principale,\n   -   qu’elles n’excèdent pas 100 m² de surface de plancher,\n   -   que les nuisances, notamment sonores, et dangers
