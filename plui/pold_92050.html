<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorador PLU de Nanterre</title>
<style>

:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1d1f22; --muted:#666b73; --line:#e3e1db; --accent:#1f5f8b; --accent-ink:#ffffff;
  --hl:#fff1a8; --chip:#eef1f4; --sum:#eef6ee; --sum-line:#b9d9bb; --code:#1f5f8b; --warn:#fff6e5;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15171a; --panel:#1d2024; --ink:#e7e7e4; --muted:#9aa0a8; --line:#30343a; --accent:#6fb3e0; --accent-ink:#0d1114;
  --hl:#5b4f12; --chip:#262a30; --sum:#1c2a1e; --sum-line:#35573a; --code:#8cc6ee; --warn:#2c2516;
}}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1d2024; --ink:#e7e7e4; --muted:#9aa0a8; --line:#30343a; --accent:#6fb3e0; --accent-ink:#0d1114;
  --hl:#5b4f12; --chip:#262a30; --sum:#1c2a1e; --sum-line:#35573a; --code:#8cc6ee; --warn:#2c2516;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px}
nav.tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto}
nav.tabs a{padding:8px 12px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
nav.tabs a.on{color:var(--ink);border-color:var(--accent);font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:5px 10px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wrap{display:flex;min-height:calc(100vh - 100px)}
aside{width:330px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow:auto;height:calc(100vh - 100px);position:sticky;top:100px}
main{flex:1;min-width:0;padding:18px 28px 80px;max-width:980px}
.filters{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line);cursor:pointer;user-select:none}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tree{padding:6px 0 30px}
.tree .n{display:flex;gap:6px;align-items:baseline;padding:3px 12px;cursor:pointer;font-size:13.5px;line-height:1.35}
.tree .n:hover{background:var(--chip)}
.tree .n.cur{background:var(--chip);box-shadow:inset 3px 0 0 var(--accent)}
.tree .n .cd{color:var(--code);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
.tree .n .pg{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.tree .l0{font-weight:700;margin-top:8px;text-transform:uppercase;font-size:12px;letter-spacing:.03em}
.tree .l1{font-weight:600}
.tree .l2{padding-left:24px}
.tree .l3{padding-left:40px;color:var(--ink)}
.tree .tg{cursor:pointer;color:var(--muted);width:12px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;transform:translateY(-1px)}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.crumb a{text-decoration:none}
h1.st{font-size:22px;margin:0 0 4px;line-height:1.3}
h1.st .cd{color:var(--code)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 14px;font-size:13px;color:var(--muted)}
.sum{background:var(--sum);border:1px solid var(--sum-line);border-radius:10px;padding:10px 14px;margin:0 0 16px}
.sum b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:2px}
.txt p{margin:0 0 10px}
.txt h4{margin:18px 0 8px;font-size:15px}
.txt ul{margin:0 0 10px;padding-left:22px}
.txt li{margin:0 0 5px}
.txt ul.sub{margin:5px 0 5px;list-style:circle}
.txt li.nb{list-style:none}
pre.tbl{font:12px/1.35 ui-monospace,Consolas,monospace;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre}
.ref{font-style:italic;color:var(--muted)}
a.xr{text-decoration:none;border-bottom:1px dotted var(--accent);white-space:nowrap}
a.fg{font-size:12px;background:var(--chip);border-radius:5px;padding:0 5px;text-decoration:none;font-style:normal}
.df{border-bottom:1px dashed var(--muted);cursor:help}
sup{font-size:9px;color:var(--muted)}
mark{background:var(--hl);color:inherit;border-radius:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.box h3{margin:0 0 8px;font-size:15px}
.sub-list a{display:block;padding:4px 0;text-decoration:none}
.sub-list .cd{color:var(--code);margin-right:6px}
.eq a{margin-right:8px}
.notes textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px;font:inherit}
.results .r{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.results .r:hover{background:var(--chip)}
.results .r .cd{color:var(--code);font-weight:600;margin-right:6px}
.results .r .sn{color:var(--muted);font-size:13.5px;margin-top:3px}
.pop{position:absolute;z-index:50;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px 14px;font-size:13.5px;max-height:320px;overflow:auto}
.pop h5{margin:0 0 6px;font-size:14px}
table.cf{width:100%;border-collapse:collapse;font-size:14px}
table.cf td,table.cf th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.cf th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
table.cf td.v{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ob .reg{font-size:12.5px;color:var(--muted);margin:-4px 0 8px}
.ob a{display:block;text-decoration:none;padding:3px 0}
.ob a .cd{color:var(--code);font-weight:600;margin-right:6px;font-size:13px}
.ob a span.w{color:var(--ink)}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.figs .fc{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.figs .fc img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover;object-position:top;background:#fff}
.figs .fc div{padding:8px 10px;font-size:13px}
.figview img{width:100%;max-width:760px;display:block;margin:0 auto 12px;border:1px solid var(--line);border-radius:6px;background:#fff}
.gl .gi{padding:12px 0;border-bottom:1px solid var(--line)}
.gl .gi h3{margin:0 0 4px;font-size:16px}
.gl .refs{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.az{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.warn{background:var(--warn);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.star{font-size:18px;line-height:1;border:none;background:none;padding:0 4px;color:var(--muted)}
.star.on{color:#e0a400}
.menu{display:none}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
@media (max-width:820px){
  aside{position:fixed;left:0;top:0;height:100vh;z-index:40;transform:translateX(-100%);transition:transform .2s;width:86vw;max-width:360px;box-shadow:0 0 30px rgba(0,0,0,.25)}
  aside.open{transform:none}
  .menu{display:inline-block}
  main{padding:14px 16px 80px}
  .brand small{display:none}
}

.pj-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 18px}
.pj-tabs a{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pj-tabs a b{display:block;font-size:15.5px;margin-bottom:2px}
.pj-tabs a span{font-size:12.5px;color:var(--muted)}
.pj-tabs a.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.pj-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pj-cols ul{margin:0;padding-left:18px}.pj-cols li{margin:3px 0;font-size:14px}
.pj-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.pj-prog{flex:1;min-width:160px;height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.pj-prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.pj-bar button{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.pj-g h3{margin:0 0 6px;font-size:15px}
.pj-a{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.pj-a:first-of-type{border-top:0}
.pj-a input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}
.pj-a a{text-decoration:none;color:var(--ink)}
.pj-a .cd{color:var(--code);font-weight:600;margin-right:6px;font-size:13px}
.pj-a .tt{color:var(--muted);font-size:12.5px;display:block}
.pj-a.ok a{opacity:.55}
@media (max-width:760px){.pj-cols{grid-template-columns:1fr}}
@media print{.pj-tabs,.pj-bar button{display:none!important}.pj-a input{accent-color:#000}}
@media print{header,aside,.notes,.no-print{display:none!important} main{max-width:none;padding:0}}

.pg{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:0 0 14px;overflow:hidden}
.pg .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;background:var(--chip);font-size:12.5px;color:var(--muted)}
.pg pre{margin:0;padding:12px 14px;font:13px/1.5 ui-monospace,"Cascadia Mono",Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.pg pre .hh{background:var(--hl);font-weight:700}
.zsel{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.th-l{display:flex;flex-wrap:wrap;gap:6px}
.th-l .chip{font-size:12.5px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px}
.kv b{color:var(--muted);font-weight:600}
.pj-a .zn{font-size:11px;background:var(--chip);border-radius:5px;padding:0 5px;margin-left:6px;color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;font-style:italic}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btns a.b{display:inline-block;border:1px solid var(--line);border-radius:7px;padding:5px 10px;text-decoration:none;font-size:13.5px;background:var(--panel)}
.btns a.b.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
</style>

ES","l":1,"p":272,"q":272,"n":272,"s":"body","a":0,"z":"N","th":[]},{"t":"ARTICLE N 6 – IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX VOIES ET EMPRISES PUBLIQUES","l":1,"p":272,"q":273,"n":273,"s":"body","a":0,"z":"N","th":["voies"]},{"t":"ARTICLE N 7 – IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX LIMITES SEPARATIVES","l":1,"p":273,"q":273,"n":273,"s":"body","a":0,"z":"N","th":["lim"]},{"t":"ARTICLE N 8 – IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT AUX AUTRES SUR UNE MEME PROPRIETE","l":1,"p":273,"q":274,"n":274,"s":"body","a":0,"z":"N","th":["meme"]},{"t":"ARTICLE N 9 – EMPRISE AU SOL* DES CONSTRUCTIONS","l":1,"p":274,"q":274,"n":274,"s":"body","a":0,"z":"N","th":["emp"]},{"t":"ARTICLE N 10 – HAUTEUR MAXIMALE DES CONSTRUCTIONS","l":1,"p":274,"q":275,"n":275,"s":"body","a":0,"z":"N","th":["haut"]},{"t":"ARTICLE N 11 – ASPECT EXTERIEUR DES CONSTRUCTIONS ET AMENAGEMENT DE LEURS ABORDS AINSI QUE LES PRESCRIPTIONS DE NATURE A ASSURER LA","l":1,"p":275,"q":277,"n":277,"s":"body","a":0,"z":"N","th":["asp"]},{"t":"ARTICLE N 12 – LES OBLIGATIONS IMPOSEES AUX CONSTRUCTEURS EN MATIERE DE REALISATION D’AIRES DE STATIONNEMENT","l":1,"p":277,"q":278,"n":278,"s":"body","a":0,"z":"N","th":["stat"]},{"t":"ARTICLE N 13 – LES OBLIGATIONS IMPOSEES AUX CONSTRUCTEURS EN MATIERE DE REALISATION D’ESPACES LIBRES, D’AIRES DE JEUX ET DE LOISIRS ET DE","l":1,"p":278,"q":278,"n":278,"s":"body","a":0,"z":"N","th":["verde"]},{"t":"ARTICLE N 14 – COEFFICIENT D’OCCUPATION DES SOLS","l":1,"p":278,"q":279,"n":279,"s":"body","a":0,"z":"N","th":[]},{"t":"Article N 15 - OBLIGATIONS IMPOSEES AUX CONSTRUCTIONS, TRAVAUX,","l":1,"p":279,"q":280,"n":280,"s":"body","a":0,"z":"N","th":[]},{"t":"Article N 16 - OBLIGATIONS IMPOSEES AUX CONSTRUCTIONS, TRAVAUX,","l":1,"p":280,"q":280,"n":280,"s":"body","a":0,"z":"N","th":[]}],"zones":["N","UA","UB","UBd","UC","UD","UE","UF","UG","UL"],"pages":["    Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\n    Règlement Partie 1\n    REGLEMENT\n    Partie 1\n    PLU approuvé par le Conseil Municipal du\n    15 décembre 2015\n    et mis en compatibilité par le Conseil de territoire en\nP. 1 / 280 /    date du 09 décembre 2025","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\nSOMMAIRE\nTitre I - DISPOSITIONS GENERALES ................................................................................ 3\nTitre II - LEXIQUE ET DEFINITIONS APPLICABLES DANS TOUTES LES ZONES .......11\nTitre III - DISPOSITIONS APPLICABLES DANS LES ZONES URBAINES ......................21\n   ZONE UA ..........................................................................................................................22\n   ZONE UB ..........................................................................................................................51\n   ZONE UBd ........................................................................................................................83\n   ZONE UC........................................................................................................................102\n   ZONE UD........................................................................................................................130\n   ZONE UE ........................................................................................................................156\n   ZONE UF ........................................................................................................................180\n   ZONE UG .......................................................................................................................213\n   ZONE UL ........................................................................................................................241\nTitre IV - DISPOSITIONS APPLICABLES DANS LES ZONES NATURELLES ..............268\n   ZONE N ..........................................................................................................................269\nLe présent document est complété par des annexes règlementaires réunies dans un second\ndocument intitulé « Règlement Partie 2 : Annexes ».\nCes annexes concernent :\n    - Les commerces (annexe de l’article 1)\n    - Les Installations Classées pour la Protection de l’Environnement (annexe de l’article 2)\n    - Le patrimoine bâti (annexe de l’article 11)\n    - Les locaux déchets (annexe de l’article 12)\n    - Les arbres (annexes de l’article 13)\n9 décembre 2025    / P. 2 / 280","    Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\n    Règlement Partie 1\n    Titre I –\n    DISPOSITIONS GENERALES\nP. 3 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\nCHAMP D’APPLICATION ET PORTEE DU REGLEMENT\nLe présent règlement s'applique à l'ensemble du territoire communal de NANTERRE y compris sur les\nsecteurs couverts par des Zones d’Aménagement Concerté.\nLes normes instituées par le présent règlement sont opposables à toute personne publique ou privée,\npour l’exécution de tous travaux, même en l’absence d’obligation d’autorisation ou de déclaration\npréalable au titre du code l’urbanisme.\nCONTENU DU REGLEMENT DU PLU\nLes règles et servitudes définies par le plan local d’urbanisme (PLU) s’appliquent sur la totalité du\nterritoire de la commune, en fonction d’un découpage en plusieurs zones urbaines et une zone\nnaturelle, précisées par des secteurs le cas échéant.\nLe découpage figure sur les « plan de zonages » n°1-A, n° 1-B, n°1-C, n°1-D, n°1-E dans le dossier\ndu PLU.\n1. LES ZONES URBAINES (dont l’intitulé commence par « U ») où s’appliquent les dispositions\ngénérales et les dispositions des différents chapitres des titres III et titre IV:\n UA    Zone mixte du centre ancien de Nanterre.\n    Zone mixte: habitat collectif, commerces, bureaux, équipements collectifs... Cette zone\n    comprend en outre :\n    - un secteur UBa pour les abords des grands axes structurants\n UB    - un secteur UBb pour le quartier de Nanterre Préfecture\n    - un secteur UBd pour la ZAC Rouget de l’Isle, qui a son propre règlement ainsi qu’une\n    carte spécifique (plan n°1g)\n UC    Zone à dominante d’habitat collectif implanté de façon dispersée sur de grandes emprises.\n    Zone à dominante d’habitat individuel, comprenant un secteur UDa, plus dense, situé\n UD\n    principalement aux abords du centre ancien\n UE    Zone de projets urbains de la ZAC Seine Arche, répartie en deux secteurs UEa et UEb.\n    Zone des quartiers d’activités économiques répartie en 6 types de secteurs aux vocations\n    spécifiques :\n    - UFa : activités économiques à dominante d’industries, d’artisanat et d’entrepôt ;\n    commerces et bureaux y sont limités, l’hébergement hôtelier interdit\n    - UFb : activités économiques à dominante tertiaire. Les activités industries et\n    entrepôts sont interdits, et commerce et artisanat limités et en RDC (à proximité de la\n    Défense).\n    - UFc : activités économiques mixtes à dominante tertiaire (Guilleraies et Petit\n UF    Nanterre)\n    - UFd : activités économiques à dominante tertiaire (Champs Pierreux, Bd de la\n    Défense et rue Noël Pons).\n    - UFe : secteur d’activités économiques mixtes (bureaux, artisanat, industrie,\n    commerces, plateforme logistique intermodale) fortement végétalisé sur le site des\n    papèteries.\n    - UFf : secteur principalement dédié aux activités économiques à dominante artisanat\n    et industrie et constituant le « Cœur des Groues ». Les surfaces commerciales et de\n    bureaux y sont limitées et doivent être liées aux autres destinations autorisées.\n UG    Zone urbaine mixte à dominante résidentielle, correspondant au secteur des Groues.\n9 décembre 2025    / P. 4 / 280","    Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\n    Règlement Partie 1\n    Zone correspondant aux grands équipements d’intérêt collectif. Elle comprend deux secteurs :\n    - un secteur ULa correspondant à une zone d’équipements à caractère paysager, peu bâtie :\n    espaces à vocation de sports, détente ou de loisirs, perspective des Terrasses, cimetières…\nUL    - un secteur ULb correspondant à la partie Ouest des berges de Seine au nord des\n    Guilleraies, où des installations peuvent être autorisées pour permettre l’accès au fleuve pour\n    les activités économiques voisines (en zone UFa), superposées à l’objectif de cadre paysager\n    et de détente.\nP. 5 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    2. LA ZONE NATURELLE où s’appliquent les dispositions des différents chapitres du titre V :\n    Zone correspondant aux grands parcs et jardins publics ouverts au public et aux berges de\n    Seine. Elle comprend 3 secteurs :\n    - un secteur Na pour les « parcs départementaux » (André Malraux et Chemin de l’Ile) ;\n N    - un secteur Nb pour les parties des « berges de Seine » réservées à un usage de loisirs\n    dans un cadre naturel et paysager en lien avec la présence du fleuve ;\n    - un secteur Nc pour les « espaces verts communaux » (parc des Chenevreux, jardin\n    pédagogique, Moulin des Gibets)\nLe plan de zonage comprend en outre :\n    le tracé de « linéaires de commerce, artisanat et services en zone UA» et de « linéaires de\n    commerce, artisanat et services / autres zones »visant à maintenir une animation des rez-de-\n    chaussée : cela peut inclure du commerce (article L.123-1-5 II 5° du code de l’urbanisme et\n    référence à une liste restreinte pour le linéaire « / zone UA »), de l’artisanat, des équipements\n    d’intérêt collectif ;\n    des emplacements réservés aux voies et ouvrages publics, aux installations d’intérêt\n    général et aux espaces verts publics (articles L.123-1-5-V).\n    des espaces verts protégés (EVP) à préserver (L.123-1-5 III 2° du code de l’urbanisme).\n    des alignements d’arbres qui par leur rôle dans les paysages urbains de la ville et pour leur\n    contribution à la biodiversité urbaine, sont protégés (L.123-1-5 III 2°du code de l’urbanisme) ;\n    des arbres remarquables qui par leur âge, leur dimension, leur espèce ou leur localisation\n    emblématique, sont protégés (L.123-1-5 III 2°du code de l’urbanisme);\n    des « bâtiments remarquables protégés », des « bâtiments de qualité » et des « ensembles\n    bâtis cohérents » qui par leur caractère, leur architecture, leur rôle dans les paysages urbains de\n    la ville, ne peuvent être démolis mais pourront faire l’objet de façon encadrée de travaux et\n    d’aménagements (L.123-1-5 III 2°du code de l’urbanisme).\n    Des « bâtiments signalés d’intérêt et autres bâtiments de caractère » qui possèdent des\n    caractéristiques architecturales pouvant justifier des mesures particulières en cas de travaux\n    d’extension ou de réhabilitation sur les constructions ou parties de constructions concernées\n    (L.123-1-5 III 2°du code de l’urbanisme).\nLes prescriptions graphiques figurant sur les plans de zonage se substituent le cas échéant aux\nprescriptions figurant dans le présent règlement.\nLe règlement est complété par des orientations d’aménagement et de programmation pour\ncertains secteurs du territoire communal.\nLes dispositions générales, et le lexique et dispositions communes à l’ensemble des zones, sont\nsuivies des règles présentées par zone par zone.\nLe règlement du PLU de chaque zone comporte des règles réparties en articles (article R.123-9 du\ncode de l’urbanisme). Le numéro de l’article est précédé du sigle de la zone où il s’applique : UA-10\nconcerne les dispositions de l’article 10 dans la zone UA.\nLe tableau ci-dessous reprend les intitulés règlementaires de chaque article du règlement :\nArticle 1 - Occupations et utilisations du sol interdites\nArticle 2 - Occupations et utilisations du sol soumises à des conditions particulières\nArticle 3 - Conditions de desserte des terrains par les voies publiques ou privées et d’accès aux voies\nouvertes au public\nArticle 4 – Conditions de desserte des terrains par les réseaux publics d’eau, d’électricité,\nd’assainissement\nArticle 5 – Superficie minimale des terrains constructibles Supprimé par la loi ALUR du 24 mars 2014\nArticle 6 - Implantation des constructions par rapport aux voies et emprises publiques\n9 décembre 2025    / P. 6 / 280","    Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\n    Règlement Partie 1\nArticle 7 - Implantation des constructions par rapport aux limites séparatives\nArticle 8 - Implantation des constructions les unes par rapport aux autres sur une même propriété\nArticle 9 - Emprise au sol des constructions\nArticle 10 - Hauteur maximale des constructions\nArticle 11 - Aspect extérieur des constructions et aménagement de leurs abords, protection des\néléments de paysage\nArticle 12 - Obligations imposées aux constructeurs en matière de réalisation d’aires de stationnement\nArticle 13 - Obligations imposées aux constructeurs en matière de réalisation d’espaces libres, d’aires\nde jeux et de loisirs et de plantations\nArticle 14 - Coefficient d’occupation du sol (C.O.S.) Supprimé par la loi ALUR du 24 mars 2014\nArticle 15 - Obligations imposées aux constructions, travaux, installations et aménagements, en\nmatière de performances énergétiques et environnementales\nArticle 16 - Obligations imposées aux constructions, travaux, installations et aménagements, en\nmatière d'infrastructures et réseaux de communications électroniques\nPORTEE D’AUTRES LEGISLATIONS RELATIVES A L’OCCUPATION DES SOLS\nLes projets faisant l’objet d’une demande d’autorisation d’urbanisme doivent respecter le présent Plan\nLocal d’Urbanisme et les règlementations distinctes du Plan Local d’Urbanisme, notamment les\ndispositions inscrites dans le code de l’urbanisme, le code de la construction et de l’habitation, le code\nde l’environnement et le code du patrimoine.\n Les dispositions du présent règlement se substituent à celles du Plan Local d’Urbanisme\n  antérieur et à celles des articles R. 111 et suivants (règlement national d’urbanisme) du code de\n  l’urbanisme, à l'exception des articles R.111-2, R.111-4, R.111-15 et R.111-21 qui restent\n  applicables.\n Aux règles du Plan Local d’Urbanisme s’ajoutent les prescriptions prises au titre de législations\n  spécifiques concernant les servitudes d’utilité publique affectant l’occupation ou l’utilisation du\n  sol. Ces servitudes sont présentées dans le rapport de présentation et détaillées dans la\n  notice et les plans du dossier « Annexes » du PLU.\n  Au titre de ces servitudes, le territoire de Nanterre est particulièrement concerné par les\n  règlementations suivantes :\n   protection des monuments et sites classés ou inscrits\n   contraintes liées aux risques naturels et technologiques notamment les risques d’inondation,\n    et de mouvements de terrains\n   contraintes liées aux nuisances sonores (par le passage d’infrastructures de transports)\n    Les principales contraintes sont les suivantes :\n     Le risque d’inondation : dans les secteurs inscrits à l’intérieur des zones délimitées par le\n    Plan de Prévention des Risques d’Inondation (PPRI) de la Seine, les constructions sont\n    soumises au respect des conditions spécifiques de son règlement.\n     Les risques technologiques : à l’intérieur des périmètres de protection autour du dépôt\n    pétrolier de la Compagnie Commerciale de Manutention Pétrolière (CCMP – 149 avenue du\n    Général Leclerc / zone d’activités industrielles des Guilleraies), figurant au plan n°2-a\n    (périmètres D1 et D2), les constructions et les extensions si elles ne sont pas mentionnées à\n    l’article UF-1, sont soumises à des conditions spéciales émises par le Service des\n    Installations Classées pour la Protection de l’Environnement.\n     Les périmètres d’anciennes carrières : dans les parties du territoire communal concernées,\n    les constructions peuvent être subordonnées à des prescriptions spéciales afin de s’assurer\n    de conditions techniques compatibles avec la nature du sous-sol. A ce titre, elles doivent faire\n    l’objet d’un avis de l’inspection générale des carrières ou d’une étude du sous-sol préalable.\n     Les secteurs archéologiquement sensibles : dans les parties du territoire communal\n    concernées, les projets de construction doivent faire l’objet d’un avis préalable des services.\nP. 7 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n     Les périmètres de protection des monuments classés ou inscrits à l’inventaire et les\n    sites inscrits : dans les parties du territoire communal concernées les projets de construction\n    et d’utilisation des sols font l’objet d’une consultation préalable de l’architecte des Bâtiments\n    de France.\n        Les nuisances sonores : le long des voies indiquées au plan “ servitudes d’isolement\n    acoustique des bâtiments d’habitation contre les bruits de l’espace extérieur ”, les façades*\n    des bâtiments destinés à l’habitation et si elles sont exposées au bruit direct de la voie,\n    doivent bénéficier d’un isolement suffisant, en fonction du type de voie, du nombre de files de\n    circulation, du type d’urbanisme, de la distance à la voie, de la hauteur des constructions. Les\n    prescriptions d’isolement acoustique sont réduites pour les façades de ces mêmes bâtiments\n    lorsqu’elles sont exposées indirectement au bruit de la voie. Les règles applicables sont celles\n    définies l’arrêté ministériel du 30 mai 1996, relatif à l’isolement acoustique des bâtiments\n    d’habitation contre les bruits de l’espace extérieur.\nL’ensemble des servitudes est présenté dans le rapport de présentation et détaillé dans la\nnotice et les plans du dossier « Annexes » du PLU.\n Découvertes fortuites à caractère archéologique (loi n°41-4011 du 27 septembre 1941 modifiée):\n  « Lorsque, par suite de travaux ou d'un fait quelconque, des monuments, des ruines,\n  substructions, mosaïques, éléments de canalisation antique, vestiges d'habitation ou sépultures\n  anciennes, des inscriptions ou généralement des objets pouvant intéresser la préhistoire,\n  l'histoire, l'art, l'archéologie ou la numismatique sont mis à jour, l'inventeur de ces vestiges ou\n  objets et le propriétaire de l'immeuble où ils ont été découverts sont tenus d'en faire la déclaration\n  immédiate au Maire de la Commune, qui doit les transmettre sans délai au Préfet. »\n Aux règles du PLU s’ajoutent les règlements en vigueur liées aux compétences d’aménagement\n  et d’équipement portées par d’autres collectivités :\n   Le règlement de voirie du Conseil Général des Hauts de Seine sur les voies départementales\n   Les règlements d’assainissement du SIAAP, du Conseil général des Hauts de Seine et de la\n    commune de Nanterre\nINSTALLATIONS CLASSEES (ICPE)\nToute exploitation industrielle susceptible de créer des risques ou de provoquer des pollutions ou\nnuisances, notamment pour la sécurité et la santé des riverains, est une installation classée. Les\nactivités relevant de la législation des installations classées sont énumérées dans une nomenclature\nqui les soumet à un régime d’autorisation, d’enregistrement ou de déclaration en fonction de\nl’importance des risques ou des inconvénients qui peuvent être engendrés.\n     Déclaration : pour les activités les moins polluantes et les moins dangereuses. Une simple\n    déclaration en préfecture est nécessaire.\n     Autorisation : pour les installations présentant les risques ou pollutions les plus importants.\n    L’exploitant doit faire une demande d’autorisation avant toute mise en service, démontrant\n    l’acceptabilité du risque. Le préfet peut autoriser ou refuser le fonctionnement.\n     Enregistrement : pour les secteurs dont les mesures techniques pour prévenir les\n    inconvénients sont bien connues (stations-service, entrepôts...), un régime d’autorisation\n    simplifiée, ou régime dit d’enregistrement, a été créé en 2009.\nLa législation des installations classées confère à l’Etat (Inspection des Installations Classées) des\npouvoirs d’autorisation ou de refus d’autorisation de fonctionnement d’une installation ; de\nréglementation (imposer le respect de certaines dispositions techniques, autoriser ou refuser le\nfonctionnement d’une installation); de contrôle et de sanction.\nADAPTATIONS MINEURES\nLes règles et servitudes définies par le Plan Local d’Urbanisme ne peuvent faire l’objet d’aucune\ndérogation, à l’exception des adaptations mineures rendues nécessaires par la nature du sol, la\nconfiguration des terrains ou le caractère des constructions avoisinantes (article L152-3 du code de\nl’urbanisme)\n9 décembre 2025    / P. 8 / 280","    Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\n    Règlement Partie 1\nRECONSTRUCTION APRES SINISTRE\nLa reconstruction à l'identique d'un bâtiment détruit par sinistre depuis moins de deux ans est\nautorisée nonobstant toute disposition d'urbanisme contraire, sauf si un plan de prévention des\nrisques naturels prévisibles en dispose autrement, et dès lors qu'il avait été régulièrement édifié.\nAPPLICATION DU REGLEMENT AUX LOTISSEMENTS\n     Le règlement d’un lotissement autorisé depuis moins de 10 ans demeure applicable, en même\n    temps que les règles du PLU. La liste des lotissements concernés figure en annexe du\n    règlement (pour info, seulement le lotissement 63/65 rue du Dr Charcot du 3 juin 2008 – Ogé)\n    Les règles d'urbanisme contenues dans les documents du lotissement, notamment le\n    règlement, le cahier des charges s'il a été approuvé ou les clauses de nature réglementaire du\n    cahier des charges s'il n'a pas été approuvé, deviennent caduques au terme de dix années à\n    compter de la délivrance de l'autorisation de lotir.\n     Dans le cas d'un lotissement, les règles du PLU sont appliquées à l’ensemble du terrain\n    d’assiette du projet, en application de l’article R 151-21 du Code de l’urbanisme.\nAPPLICATION DU REGLEMENT EN CAS DE DIVISION EN PROPRIETE OU EN\nJOUISSANCE (AUTRES QUE LOTISSEMENT)\nLes divisions en copropriété et en volumétrie relèvent du mode d’organisation des ensembles\nimmobiliers et donc du droit privé. Le PLU s’applique uniquement en référence à une unité foncière\nidentifiable au sol.\nDans le cas de la construction, sur un même terrain de plusieurs bâtiments dont le terrain d'assiette\ndoit faire l'objet d'une division en propriété ou en jouissance, les règles du PLU sont appliquées à\nl’ensemble du terrain d’assiette du projet, en application de l’article R 151-21 du Code de l’urbanisme.\nIMPOSSIBILITE DE REALISATION D’AIRES DE STATIONNEMENT\nConformément au code de l’urbanisme, article L 151-33, si pour des raisons d’ordre technique, il\ns’avère impossible de réaliser sur le terrain ou dans son environnement immédiat toutes les aires de\nstationnement imposées par le Plan Local d’Urbanisme (articles 12 de chaque zone), le constructeur\npeut être tenu quitte de ces obligations en justifiant, pour les places qu'il ne peut réaliser lui-même,\nsoit de l'obtention d'une concession à long terme dans un parc public de stationnement existant ou en\ncours de réalisation et situé à proximité de l'opération, soit de l'acquisition ou de la concession de\nplaces dans un parc privé de stationnement répondant aux mêmes conditions.\nPARTICIPATION DES CONSTRUCTEURS\nIl est rappelé que les bénéficiaires d’autorisations de construire seront soumis aux taxes et\nparticipations prévues par le Code de l'Urbanisme et participent ainsi au financement des\néquipements.\nSURSIS A STATUER\nAux termes de l’article L 424-1 du code de l’urbanisme, il peut être décidé de surseoir à statuer sur\ntoute demande d’autorisation concernant des travaux, construction ou installation dans les cas\nsuivants :\n     A partir de la date d’ouverture de l’enquête préalable à la déclaration d’utilité publique d’une\n    opération.\n     dès lors que la mise à l'étude d'un projet de travaux publics a été prise en considération par\n    l'autorité compétente .\n     Lorsqu’une opération d’aménagement a été prise en considération par le Conseil Municipal ou\n    dans les périmètres en opération d’intérêt national par le représentant de l’Etat dans le\n    département.\n     A compter de la délibération prescrivant l’élaboration d’un PLU (article L 153-11 3° alinéa).\n     A compter de la publication de l’acte créant une ZAC (article L 311-2)\n     A compter de la publication de l’acte prescrivant l'élaboration d'un plan de sauvegarde et de\n    mise en valeur ou sa révision (article L 313-2 ; alinéa 2).\nP. 9 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\nEMPLACEMENTS RESERVES\nEmplacements délimités sur le plan de zonage et qui sont réservés en vue de réaliser des voies et\nouvrages publics, ou des installations d’intérêt général et/ou espaces verts publics (article L151-41 du\ncode de l’urbanisme).\nLes constructions y sont interdites, sauf exception prévue aux articles L.433-1 à L.433-7 du code de\nl'urbanisme pour les constructions à titre précaire, les constructions conformes à l’objet de\nl’emplacement réservé.\nLes précisions concernant les bénéficiaires (collectivités ou services publics) ou les objets des\nemplacements réservés figurent en annexe du règlement et sont détaillées dans le rapport de\nprésentation.\nLa réglementation des emplacements réservés constitue à la fois une restriction à l'utilisation d'un bien\npar son propriétaire, en même temps qu'une garantie de disponibilité́ de ce bien pour la collectivité́\npublique bénéficiaire.\nAinsi, les propriétaires des terrains concernés peuvent exercer leur droit de délaissement auprès de la\ndirection de la Ville chargée de l'urbanisme, afin de mettre en demeure le bénéficiaire d'acquérir ce\nterrain (modalités encadrées par les articles L 152-2 et L.230-1 du Code de l'urbanisme).\nAUTRES RAPPELS DE PROCEDURE\nSe superposent, en outre, les articles du code de l'urbanisme ou d'autres législations :\n     Le droit de Préemption Urbain DPU (articles L.211-1 et suivants du code de l’urbanisme)\n    selon la délibération du conseil municipal du 5 mai 1987 et le droit de Préemption Urbain\n    renforcé selon la délibération du conseil municipal du 13 décembre 1989 (pour les zones\n    urbaines).\n     Le droit de préemption au titre des zones d’aménagement différé (ZAD) délimitées en\n    application de l’article L 212.1 du code de l’Urbanisme (figurant au plan des servitudes à titre\n    indicatif) et dans lesquelles un droit de préemption est ouvert en application de l’article L\n    212.2 du Code de l’Urbanisme.\n     Le droit de préemption spécifique aux fonds de commerce, artisanaux et baux commerciaux,\n    selon la délibération du 24 avril 2007.\n     L’obligation de permis de démolir, en application de l’articles R.421-27 du code de l’urbanisme\n    et de la délibération du conseil municipal en date du 26 juin 2007.\n     L’obligation de déclaration préalable de travaux pour l'édification de clôtures (article R.421-12\n    d) du Code de l'Urbanisme), instaurée par délibération du conseil municipal du 26 juin 2007.\n     L’obligation de déclaration préalable de travaux pour les ravalements, instaurée par\n    délibération du conseil municipal du 14 octobre 2014.\nILLUSTRATIONS DU REGLEMENT\nLes illustrations du présent règlement ont une fonction pédagogique et explicative. En cas de doute\nsur l’interprétation d’une disposition, le texte prévaut sur l’illustration.\n    Dans le texte du règlement, les termes marqués d’une * sont définis dans la partie « Lexique et\n    définitions applicables dans toutes les zones ».\n9 décembre 2025    / P. 10 / 280","    Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\n    Règlement Partie 1\n    Titre II –\n    LEXIQUE ET DEFINITIONS APPLICABLES\n    DANS TOUTES LES ZONES\nP. 11 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\nAccès\nL’accès est un des éléments de la desserte d’un terrain formant jonction avec une voie ouverte à la circulation\npublique, que celle-ci soit publique ou privée. L’accès doit permettre notamment aux véhicules de pénétrer sur le\nterrain et d’en sortir en toute sécurité.\nAcrotère\nDésigne la partie supérieure d’une façade, masquant un toit plat ou une terrasse.\nL’acrotère est donc situé au-dessus du niveau de la toiture ou de la terrasse et il en\nconstitue un rebord ou un garde-corps pleins ou à claire-voie (exemple « A » ci-\ncontre).\nAffouillement- exhaussement\nL’affouillement est un creusement volontaire du sol naturel, au contraire de\nl’exhaussement qui est une élévation volontaire du sol.\nAlignement\nDésigne la limite entre une parcelle privée et une voie ou une emprise publique. Il peut correspondre à\nl’alignement existant ou projeté (en cas d’emplacement réservé, de plan d’alignement ou de Zone\nd’Aménagement Concerté ou secteur d’OAP).\nAlignement opposé pour l’application des articles 10-1 des règlements de zone : si une voie jouxte\nune emprise publique non bâtie (parc, place etc…), l’alignement opposé cumule la largeur de la voie\net de cette emprise publique non bâtie.\n9 décembre 2025    / P. 12 / 280","    Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\n    Règlement Partie 1\nAnnexe\nL’annexe constitue une construction distincte de la construction principale, non contigüe, assurant un\ncomplément fonctionnel. Elle peut seulement être reliée à la construction principale par un élément\nnon constitutif de surface de plancher, tel qu’un auvent ou un porche. Elle est affectée à une fonction\ncomplémentaire à celle de la construction principale : garage non professionnel, local de stockage des\ndéchets ménagers, local à vélo, remise à bois, abri de jardin, … L’annexe ne peut pas être affectée à\nl’usage d’habitation.\nArbres\nLe règlement fait référence à plusieurs types d’arbres en fonction de leur gabarit.\n    Hauteur à l’âge\n    Type d’arbre\n    adulte\n    15 mètres\n    2ème grandeur / grand développement\n    minimum\n    3ème grandeur / moyen développement    8 à 15 mètres\n    8 mètres\n    4ème grandeur / petit développement\n    maximum\nDes listes d’essences d’arbres correspondant à chaque taille sont fournies en annexe.\nBaie\nIl s’agit d’une ouverture fermée ou non, située sur une façade (arcade, fenêtre, porte-fenêtre…).\nNe sont pas considérées comme une baie, au titre du présent règlement :\n     les ouvertures dans une toiture en pente n’offrant pas de vue droite, et les ouvertures situées\n    au moins à 1,90 mètre au-dessus du plancher.\n     les pavés de verre\n     les châssis fixes et à vitrage non transparent\nBanalisation\nLa banalisation des places consiste à donner aux usagers un droit d’accès dans un parc de\nstationnement, sans que soit précisée la place de stationnement qu’ils doivent utiliser : les places ne\nsont pas différenciées, elles ne sont ni attribuées ni privatives et chacun prend la place non occupée\nqui lui convient.\nL’intérêt essentiel de ce mode d’exploitation est de permettre d’accueillir un plus grand nombre\nd’usagers, à capacité égale, en jouant sur la non-coïncidence des pointes de demande en\nstationnement et sur la complémentarité horaire : les places laissées libres à un instant donné par les\nuns peuvent être occupées par les autres (phénomène de foisonnement et de complémentarité). Voir\naussi: Foisonnement, Mutualisation.\nBâtiment remarquable protégé et bâtiment de qualité\nIl s’agit de deux catégories distinctes portant sur des constructions ayant une valeur historique,\npatrimoniale, architecturale ou urbaine. Ils sont repérés sur le plan de zonage et font l’objet de règles\nparticulières (article 11 du règlement de zones concernées).\nBâtiment signalé d’intérêt\nBâtiment présentant un intérêt architectural, historique ou patrimonial. Ils sont repérés sur le plan de\nzonage et font l’objet de règles particulières (article 11 des règlements de zones concernées).\nB.E.V.A (barème d’évaluation de la valeur de l’arbre)\nToutes atteintes, résultant ou non de travaux de constructions, à des arbres appartenant à la ville fera\nl’objet d’une compensation évaluée selon le barème B.E.V.A en application de la délibération du\nconseil municipal instituant ce dispositif (cf. annexe règlement)\nCINASPIC\nConstructions et installations nécessaires aux services publics ou d’intérêt collectif.\nLes infrastructures, aménagements et équipements nécessaires à la réalisation des tramways font\npartie des CINASPIC.\nP. 13 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\nCoefficient de transmission thermique surfacique des parois\nIl représente le flux de chaleur en régime stationnaire par unité de surface pour une différence de\ntempérature d'un Kelvin entre les milieux situés de part et d'autre du système (W/m².K). Il se calcule\nen prenant l'inverse de la somme des résistances thermiques normalisées superficielles et des\nrésistances thermiques des différents matériaux constituant la paroi.\nE-commerce (local dédié au)\nTransactions commerciales utilisant l'internet ou d'autres réseaux informatiques comme l'échange de\ndonnées informatisé et impliquant un changement de propriété du bien ou du service commandé. Les\nbiens et les services font l'objet d'une commande déposée via ces réseaux, mais le paiement et la\nlivraison ultime du bien ou du service peuvent être effectués par des méthodes traditionnelles\n(définition INSEE).\nLe PLU n’impose des contraintes que pour les locaux qui sont exclusivement dédiés à la commande /\nlivraison/retrait de biens sur internet.\nEmprise au sol\nL’emprise au sol des constructions, y compris des constructions annexes, correspond à leur projection\nverticale au sol, exception faite des éléments de modénature, des éléments architecturaux, des\ndébords de toiture, des éléments d’isolation par l’extérieur des constructions existantes (de 0,30\nmètre d’épaisseur maximum), des oriels et des balcons en saillie, les auvents ne reposant pas sur des\npiliers, des terrasses non couvertes de plein pied avec le terrain naturel ou surélevées de 60cm\nmaximum par rapport au terrain naturel.\nSont inclus dans le calcul de l’emprise au sol les piscines couvertes et non couvertes ainsi que leurs\nsurfaces d’accompagnement hors sol naturel, les bassins, les piscines et toutes constructions ou\nparties de construction maçonnée, quelle que soit leur hauteur : terrasses couvertes, terrains de\ntennis, perrons, rampes d’accès de parkings desservant plus de deux places de stationnement et\ngarages, etc\nSi le terrain est grevé d’un emplacement réservé, la surface prise en compte pour le calcul de\nl’emprise au sol est celle du terrain en déduisant la surface de la partie grevée, sauf si le propriétaire\ndu terrain cède à titre gratuit la partie grevée au bénéficiaire de la réserve, et qu’il est autorisé à\nreporter sur la partie restante de son terrain un droit à construire correspondant à tout ou partie de la\nsuperficie du terrain qu’il cède gratuitement (article R 123-10 du code de l’urbanisme).\nSi le terrain est grevé d’une servitude d’urbanisme (plan d’alignement), la surface prise en compte\npour le calcul de l’emprise est celle du terrain, y compris la servitude d’urbanisme.\nCette définition ne se substitue pas à celle de l’article R 420-1 qui permet de déterminer le champ\nd’application des déclarations et autorisations d’urbanisme.\nEnsemble bâti cohérent :\nEnsemble de bâtiments en ordre continu ou discontinu qui représentent une certaine unité typologique\net/ou de composition architecturale ou urbaine. Ils sont repérés sur le plan de zonage et font l’objet\nde règles particulières (article 11 du règlement de zones concernées) permettant de préserver leur\ncohérence d’ensemble.\nLa démolition/reconstruction de l’un des éléments constituant l’ensemble, est autorisée, si elle\nparticipe d’une revalorisation de l’ensemble et sous réserve de ne pas dénaturer la cohérence de\nl’ensemble bâti.\nLa démolition totale de l’ensemble bâti cohérent est interdite, sauf pour des raisons d’hygiène ou de\nsécurité.\nEspaces libres\nIls correspondent à la superficie du terrain non occupée par l’emprise au sol des constructions. Ils sont\ngénéralement végétalisés (jardins, espaces verts) ou minéralisés (cheminements piétons, voies et\naccès automobiles, espaces de stationnement, etc).\n9 décembre 2025    / P. 14 / 280","    Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\n    Règlement Partie 1\nEspaces verts\nDésigne un espace libre planté ou engazonné. Trois types d’espaces verts sont pris en compte pour\nl’application des articles 13 des règlements de zone :\nLes « espaces verts de pleine-terre » : un espace vert est considéré comme « espace vert de\npleine-terre » lorsqu’il n’est ni bâti, ni occupé par une installation maçonnée en surface et/ou en sous-\nsol, ni recouvert d’un revêtement imperméable. D’éventuels réseaux existants ou projetés dans son\nsous-sol ne doivent pas porter atteinte à l’équilibre du sol et doivent permettre notamment son\nraccordement à la nappe phréatique.\nLes « espaces verts sur dalle » : un espace vert est considéré comme « espace vert sur dalle »\nlorsqu’il est situé au-dessus d’un ouvrage enterré (parking ou voie de circulation par exemple). Celui-ci\ndoit comprendre une épaisseur de terre minimale de 60 cm, hors étanchéité et couche drainante. Une\népaisseur supérieure de terre est imposée pour les fosses d’arbres en application de l’article 13 du\nrèglement.\nDans la limite de deux places de stationnement desservies, la bande de roulement ainsi que les\nplaces de stationnement, sont considérées comme un espace vert lorsqu’elles sont traitées en\n« evergreen ».\nEspaces verts protégés (E.V.P): Identifiés graphiquement, leur fonction est de pérenniser ou\nrenforcer les continuités écologiques. Les prescriptions se rapportant à ces espaces verts protégés\nsont précisées aux articles 13 du présent règlement.\nEspèce indigène (végétation)\nEspèce présente naturellement dans la région Ile de France (exemple : charme, frêne, orme, arbres\nfruitiers …). Cf tableaux de l’annexe de l’article 13 du règlement.\nEspèce invasive (végétation)\nUne espèce est considérée comme invasive lorsque sa capacité de colonisation des milieux et son\ncaractère non indigène l’amènent à perturber les milieux et la diversité biologique. La liste des\nespèces invasives figure en annexe du PLU.\nExtension\nIl s’agit d’une augmentation de la surface et /ou du volume d’une construction, horizontalement dans\nla continuité́ de la construction principale, ou verticalement, par surélévation.\nDans l’application du règlement, à l’exception des articles 6, il est considéré qu’une extension ne peut\nconduire à augmenter de plus de 30% l’emprise au sol du bâtiment existant.\nFaçade\nDésigne chacune des faces verticales en élévation d’un bâtiment.\n    Lorsque la toiture présente une pente supérieure à 60°, elle sera considérée comme faisant\n    partie de la façade.\n    En l’absence d’indications spécifiques dans le règlement, la distance à la façade, au sens des\n    articles 6, 7 et 8, doit s’entendre en tous points de la façade.\n    Un plan de façade en retrait ou en avancée de plus de 3 mètres de profondeur par rapport à la\n    façade principale constitue une nouvelle (partie de) façade pour l’application des règles\n    d’implantation (articles 6, 7 et 8).\n    Un pignon est en totalité une façade\nFaitage\nLigne de rencontre haute de deux versants d'une toiture ou le point le plus haut d’une toiture mono-\npente\nFoisonnement\nPhénomène selon lequel tous les usagers d’un parc de stationnement ne sont pas présents\nsimultanément. Le \"coefficient de foisonnement\" relatif à une catégorie d'abonnés est égal au rapport\nentre la valeur maximale du nombre d'abonnés présents simultanément et le nombre total d'abonnés.\nVoir aussi: Banalisation, Mutualisation.\nP. 15 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\nGabarit\nDésigne la taille et la forme générale que peut prendre un bâtiment en fonction des règlements\nd'urbanisme : modalités d’implantation sur le terrain (articles 6, 7 et 8), emprise au sol maximum\n(article 9), hauteur maximum (article 10). L’application d’autres articles ou de servitudes d’utilité\npublique peuvent venir imposer d’autres contraintes.\nHauteur de construction\nEn l’absence d’indications spécifiques dans les règlements de zones ou sur les documents\ngraphiques, la hauteur d’une construction est calculée à partir du terrain naturel avant travaux (sauf en\nsecteurs inscrits à l’intérieur des zones délimitées par le Plan de Prévention des Risques d’Inondation,\noù la cote casier est prise comme référence) jusqu’à l’égout du toit, ou à l’acrotère (toiture terrasse) ou\nau brisis (toiture Mansart) ou au point le plus haut en cas de toiture arrondie et au faîtage. Les\néléments de construction exclus du champ d’application de l’article 10 de la zone concernée ne sont\npas pris en compte pour le calcul de la hauteur de la construction.\nEn cas de terrain en pente, la hauteur est mesurée en tout point par rapport au terrain naturel.\nLorsque le terrain a fait l’objet de travaux ( remblais , déblais, exhaussement, affouillement… ) d’une\ntelle ampleur que sa morphologie ne peut plus être considérée comme naturel , sa hauteur sera\ncalculée à partir de deux lignes :\n-La première reliant le niveau de la voie ou espace public à celui du fond de parcelle (ou alignement le\ncas échéant )\n-La seconde reliant les niveaux des deux limites latérales de parcelles (ou alignements le cas\néchéant).\nLargeur de façade d’un terrain\nC’est la largeur d’un terrain mesurée au droit de l’alignement.\nLimite séparative :\nLes limites séparatives sont les limites de terrain autres que celles situées en bordure des voies de\ndesserte publiques ou privées et des emprises publiques (entre deux unités foncières contiguës).\nLes limites séparatives latérales sont les limites du terrain qui aboutissent directement à la voie, soit\nen ligne droite, soit selon une ligne brisée (décrochements, coudes).\nLa limite de fond correspond à la limite autre que l’alignement et les limites séparatives latérales\ndéfinis précédemment.\nUn terrain d’angle n’a pas de limite de fond mais une ou des limites séparatives latérales.\n  Les limites séparatives latérales sont représentées en traits rouges sur les schémas suivants.\n9 décembre 2025    / P. 16 / 280","    Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\n    Règlement Partie 1\nLogement social\nDésigne un logement locatif ayant bénéficié, pour sa construction ou son acquisition-amélioration,\nd’un agrément et/ou d’un financement aidé de l’Etat (Prêt locatif aidé : Prêt Locatif Social - PLS, Prêt\nLocatif à Usage Social - PLUS, Prêt locatif Aidé d'Intégration - PLAI).\nLotissement\nConstitue un lotissement la division en propriété ou en jouissance d’une unité foncière ou de plusieurs\nunités foncières contiguës ayant pour objet de créer un ou plusieurs lots destinés à être bâtis. (article\nL. 442-1 du code de l’urbanisme)\nLe périmètre du lotissement comprend le ou les lots destinés à l’implantation de bâtiments ainsi que,\ns’ils sont prévus, les voies de desserte, les équipements et les espaces communs.\nLucarne\nElément    architectural   constituant   une\nouverture située en toiture et offrant une baie\nverticale surmontée de sa propre toiture.\nles 3 types de lucarnes suivants sont\nrecommandés :\n  Lucarne pendante : à l’aplomb de la\n   façade, interrompant l’égout de toit\n  Lucarne en bâtière : toit à deux versants et\n   à pignon recouvert\n  Lucarne à croupe dite “capucine” : lucarne à trois versants de toiture.\nMarge de recul\nDésigne la distance comprise entre la façade d’une construction et l’alignement (en bordure d’une\nvoie publique ou privée). Sa largeur se mesure à partir de l’alignement* actuel ou futur.\nMarge de retrait\nDésigne la distance comprise entre la façade d’une construction et les limites séparatives (latérales ou\nde fond).\nModénature\nÉlément d’ornement constitué par les profils des moulures d’une corniche. Ce terme d’architecture\ndésigne, par extension, l'ensemble des ornements moulurés présents sur une façade.\nMono-Orienté\nAdjectif qui s’applique au logement dont les ouvertures des pièces à vivre sont toutes situées sur une\nmême façade. Le règlement inscrit des contraintes pour les logements dont les ouvertures sont\norientées vers le nord (hors sanitaires) : un logement est mono-orienté nord si l’ensemble de ses\nbaies sont orientées dans un faisceau de 45 degrés de part et d’autre de l’axe du nord.\nMutualisation :\nLa mutualisation consiste en la réalisation d’un seul parc de stationnement, commun à plusieurs\nopérations immobilières et/ou à plusieurs destinations de constructions. Les places répondant aux\nbesoins de plusieurs opérations immobilières et/ ou d’usages différents (bureaux, logements,\ncommerces…) sont ainsi regroupés, mutualisés, dans un seul parc de stationnement (parking non\ncloisonné avec accès communs) avec une gestion unique.\nEn appliquant à la fois le principe de mutualisation d’un parc de stationnement et celui de banalisation\ndes places, et grâce au principe de foisonnement, on peut optimiser le fonctionnement d’un parking et\nson dimensionnement. Voir aussi : Banalisation, Foisonnement.\nNoue\nSont considérés comme des noues, les fossés intégralement végétalisés ou comprenant des\nrevêtements perméables, permettant l’infiltration des eaux pluviales.\nP. 17 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\nPérimètres d’orientation d’aménagement\nLes périmètres d’orientation d’aménagement figurent uniquement dans les secteurs couverts par\nl’Opération d'Aménagement et de Programmation (OAP) Boule/grands axes.\nIls ont pour objet de circonscrire la surface d’application des orientations d’aménagement.\nPlace commandée\nPlace de stationnement automobile nécessitant le déplacement d’un autre véhicule pour être\naccessible.\nPlantations\nElles sont constituées par l’ensemble des végétaux (arbres, arbustes, espaces gazonnées fleuris ou\nnon) plantés en terre, en références aux articles 13 des règlements de chaque zone.\nRampe de parking à double sens alterné :\nEmprise de circulation donnant accès à un parking, et dont la largeur ne permet pas à deux véhicules\nde se croiser, mais qui peut être empruntée dans les deux sens de circulation de façon non\nsimultanée.\nRéhabilitation\nTravaux d’amélioration générale, ou de mise en conformité d’une construction existante avec les\nnormes techniques et d’habitabilité en vigueur. Contrairement à l’extension, la réhabilitation n’a pas\npour effet d’augmenter la surface et /ou le volume de la construction existante.\nRésistance thermique\nNotée R, elle exprime la capacité d'un matériau à résister au froid et au chaud. Plus R est élevé, plus\nle produit est isolant.\nRestauration\nRéfection, rénovation ou reconstitution à l’identique d’un ouvrage ancien présentant un intérêt\nartistique ou historique. Cela peut concerner le rétablissement d’un bâtiment ancien dans son état\nprimitif, ce qui peut impliquer la démolition de parties rapportées.\nSaillie\nCorps d’ouvrage ou élément architectural pouvant constituer un volume clos ou ouvert et qui dépasse\ndu plan de la façade, y compris les éléments fixes, tels que balcons, bow-windows, auvents,\ndevantures de boutique, ….\nSente\nChemin ouvert au public et le plus souvent interdit aux véhicules automobiles. Certaines ne font pas\nl’objet d’un traitement au sol bitumé, gardant l’esprit de cheminement court au caractère verdoyant\nentre des terrains souvent privés.\nSurélévation\nDésigne l’extension (cf. définition) d'un bâtiment existant sur l'emprise au sol totale ou partielle de\ncelui-ci, en déposant la toiture existante, rehaussant les murs périphériques et réalisant une nouvelle\ntoiture.\nSurface en eau\nUne surface est considérée comme « en eau, de type mare » lorsqu’une couche imperméable (argile\nou géomembrane) permet la rétention permanente d’eau (notamment les eaux pluviales) et le\ndéveloppement de milieux humides et aquatiques.\n9 décembre 2025    / P. 18 / 280","    Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\n    Règlement Partie 1\nSurface de plancher\nLa définition suivante est utilisée dans le présent règlement (à la différence de celle utilisée dans le\ncalcul des taxes afférentes à la fiscalité de l’urbanisme). Cf. Circulaire du 3 février 2012 relative au\nrespect des modalités de calcul de la surface de plancher des constructions définie par le livre I du\ncode de l’urbanisme. NOR : DEVL1202266C.\nArt. R. 112-2 du code de l’urbanisme : La surface de plancher est égale à la somme des surfaces de\nplancher de chaque niveau clos et couvert, calculée à partir du nu intérieur des façades après\ndéduction :\n    - des surfaces correspondant à l’épaisseur des murs entourant les embrasures des portes et\n    fenêtres donnant sur l’extérieur,\n    - des vides et des trémies afférentes aux escaliers et ascenseurs,\n    - des surfaces de plancher d’une hauteur sous plafond inférieure ou égale à 1,80 mètre,\n    - des surfaces de plancher aménagées en vue du stationnement des véhicules motorisés ou\n    non, y compris les rampes d’accès et les aires de manœuvres,\n    - des surfaces de plancher des combles non aménageables pour l’habitation ou pour des\n    activités à caractère professionnel, artisanal, industriel ou commercial,\n    - des surfaces de plancher des locaux techniques nécessaires au fonctionnement d’un groupe\n    de bâtiments ou d’un immeuble autre qu’une maison individuelle au sens de l’article L.231-1\n    du code de la construction et de l’habitation, y compris les locaux de stockage des déchets,\n    - des surfaces de plancher des caves et des celliers, annexes des logements, dès lors que ces\n    locaux sont desservis uniquement par une partie commune,\n    - d’une surface égale à 10% des surfaces de plancher affectées à l’habitation telles qu’elles\n    résultent le cas échéant de l’application des alinéas précédents, dès lors que les logements\n    sont desservis par des parties communes intérieures.\nTerrain\nLe terrain pris en compte pour l’application du présent règlement est l’unité foncière, qui est composée\nd'une parcelle ou d'un ensemble de parcelles contiguës appartenant à un même propriétaire ou à la\nmême indivision.\nTerrain naturel\nIl correspond au niveau du sol existant avant le projet de construction, avant les travaux\nd’affouillement, de terrassement, ou d’exhaussement nécessaires pour la réalisation du projet.\nEn cas de terrain en pente ou remanié, il convient de se référer à la définition de la hauteur de\nconstruction.\nToiture végétalisée / Végétalisation de toiture\nDispositif permettant la couverture totale ou partielle d’une toiture par de la végétation. Ce dispositif\ncomprend, au-dessus de la membrane imperméable de couverture comportant un agent anti-racines :\n - une couche de drainage spécialisée, qui comprend parfois des réservoirs d’eau intégrés\n - un tissu ou support filtrant pour contenir les racines et le substrat tout en laissant pénétrer l’eau ;\n - un substrat de croissance (terre végétale ou autre) d’épaisseur variable ;\n - les plantes, adaptées à l’épaisseur du substrat et au contexte.\nEn fonction de l’épaisseur de substrat et du type de plantes choisies, on définit trois types de\nvégétalisation : extensive, semi-intensive et intensive :\no   Système extensif : il se caractérise par un substrat de faible épaisseur (< 10 cm) limitant la\n    surcharge (entre 30 et 100 kg/ m² à capacité maximale en eau). Le tapis végétal associe souvent\n    des plantes du genre Sedum, Saxifraga et des mousses, qui se caractérisent par une forte\n    résistance aux aléas climatiques (sècheresse en été, forte pluie en automne…). De plus, ce type\n    de végétation ne nécessite quasiment aucun entretien. L’arrosage peut être limité aux périodes de\n    longue sècheresse, voire supprimé si l’on accepte un jaunissement temporaire du tapis végétal.\n    Le rôle joué par ce type de végétation pour la faune reste limité. Les Sedums constituent toutefois\n    des plantes nectarifères très attractives pour les insectes butineurs. Moyennant la création de\n    zones à gravillons, le Cochevis huppé, pourra éventuellement y nidifier. On pourra également\nP. 19 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    diversifier les types de végétation, plusieurs offres existant sur le marché. On trouve entre autres\n    des végétations de types :\n     « Toundra » constitué principalement d’espèces nordiques (Sedum, Saxifraga, Erica…) ;\n     « Garrigue » composé d’espèces méditerranéennes (Thyms sp, Lavandes sp…).\n    particulièrement nectarifère ;\n     « Pampa » dominé par des graminées.\n o   Système semi-intensif : il se caractérise par une épaisseur du\n    substrat comprise entre 10 cm et 25 cm et par une surcharge\n    comprise entre 100 et 400 kg/m² à capacité maximale en eau.\n    On doit donc s’assurer que les éléments porteurs sont capables\n    de supporter une telle charge avant de s’engager dans ce type\n    de toiture. Il peut accueillir une végétation à fort développement\n    racinaire et aérien tel que graminées, gazons, plantes vivaces\n    ou arbustes. Comparable à un jardin, il peut être attractif pour la\n    faune, moyennant le choix d’espèces végétales autochtones.\n    Un entretien modéré et un arrosage régulier sont toutefois\n    nécessaires contrairement au système extensif.\n o   Système intensif : il se caractérise par une épaisseur du substrat supérieure à 25 cm et par une\n    surcharge supérieure à 400 kg/m² à capacité maximale en eau. Comme le système semi-intensif,\n    il peut constituer un véritable jardin où l’on pourra planter de petits arbres. Ce système est donc\n    le plus attractif pour la faune. Il est toutefois plus coûteux et nécessite un entretien et des\n    éléments porteurs capables de supporter une forte charge.\nTraitement séquentiel de la façade\nIl s’agit de traduire dans l’architecture de la façade de la construction :\n - un rythme vertical pour ne pas avoir un linéaire uniforme de façade dans sa longueur ;\n - ou un rythme horizontal, pour rechercher une variation d’aspect sur la hauteur de façade, par\n    exemple en traitant de façon distincte le soubassement, les étages courants et le(s) dernier(s)\n    niveau(x).\nTransparence (ou percée) visuelle\nDisposition architecturale d’une construction ou composition spatiale de l’implantation des bâtiments\nsur un terrain, de façon à permettre des vues directes vers le cœur d’ilot depuis l’espace public, à\nhauteur du trottoir (pour les piétons). Ces transparences devront être développées sur le ou les deux\npremiers niveaux (RdC ou RdC/R+1) ou constituer une interruption toute hauteur du bâti.\nUnité commerciale\nIl s’agit d’une cellule de vente correspondant à un seul magasin.\nVoie publique\nDésigne une voie ouverte à la circulation publique, automobile, cyclable ou piétonne, qu’elle\nappartienne ou non à une entité publique\n9 décembre 2025    / P. 20 / 280","    Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\n    Règlement Partie 1\n    Titre III –\n    DISPOSITIONS APPLICABLES\n    DANS LES ZONES URBAINES\nP. 21 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1    UA\n    ZONE UA\nCaractéristiques de la zone :\nLa zone UA est une zone urbaine mixte, à dominante d’habitat et de commerce, correspondant\nprincipalement au centre ancien de Nanterre.\nLes dispositions réglementaires de cette zone prennent en compte les caractéristiques patrimoniales\nde bâtiments anciens et identitaires du centre.\nPour des motifs tenant d’une part, à la protection de la diversité commerciale et, d’autre part, à la\nsécurité des personnes et des biens, certaines activités ne peuvent s’exercer dans les constructions\nimplantées à l’alignement des voies bordées par un « linéaire de commerce, artisanat et services ».\nEn 2018, 310 commerces sont recensés dans le quartier du centre-ville, représentant 36.5% des\ncommerces de la commune.\nLe centre-ville est le pôle commercial majeur de la ville de Nanterre. Il s’agit d’une centralité\nimportante qui dispose de la place du marché et d’une forte concentration de petits commerces. Le\npôle est implanté le long de la Place Gabriel Péri, des Rue Henri Barbusse et Maurice Thorez. Il se\ncaractérise par une offre de commerces de proximité diversifiée. On retrouve des petits commerces\nalimentaires spécialisés (boulangerie, boucherie, traiteurs), des commerces non alimentaires\nd’équipement de la personne (boutiques de prêt-à-porter), d’hygiène et de soin (coiffeur, pharmacie)\net d’équipement de la maison. Enfin, figurent les activités de services, le cinéma de la ville (Les\nLumières) et plusieurs restaurants.\nLa zone UA est ainsi la seule zone de la ville concernée par le linéaires qui a notamment pour objectif\nde conforter et maîtriser la présence du commerce en ville, dans le but de préserver qualité, diversité\net proximité avec les Nanterriens.\nLes dispositions du règlement sont complétées par le document « orientations d’aménagement\net de programmation » du secteur « Boule-grands axes », aux abords de la place Foch et de la\nplace du Marché.\n    Dispositions applicables à la zone UA\nARTICLE UA 1 – OCCUPATION ET UTILISATION DU SOL INTERDITES\nSont interdits :\n    Les constructions à destination d’industrie ou de e-commerces*\n En rez-de-chaussée des constructions implantées à l’alignement des voies bordées par un\n  «linéaire de commerce, artisanat et services en zone UA» repéré sur les plans de zonage, les\n  changements d’activités, les changements de destination, et l’extension ou la création de locaux\n  aux destinations autres que :\n     les commerces, activités artisanales et services mentionnés dans la liste des codes NAF\n    figurant en annexe du présent règlement ;\n     les locaux destinés spécifiquement à assurer une fonction mutualisée de logistique de\n    proximité (centre de regroupement de distribution locale de marchandises) ;\n     les constructions et installations nécessaires aux services publics ou d’intérêt collectif\n    (CINASPIC).\n    Les dépôts couverts ou non couverts de matériaux divers non liés à l’exploitation d’un service\n    public.\n    Les dépôts couverts ou non couverts de flottes de véhicules, non liés à une destination autorisée\n    dans la zone UA ou à l’exploitation d’un service public.\n9 décembre 2025    / P. 22 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD    UA\nRèglement Partie 1\n   L’exploitation de carrières.\n   Les affouillements et exhaussements des sols, qui ne sont pas nécessaires :\n       aux occupations ou utilisations du sol autorisées sur la zone,\n       ou à des aménagements paysagers,\n       ou à des aménagements hydrauliques,\n       ou à des travaux d’infrastructures routières, de transports collectifs, de circulation douce ou\n    d’aménagement d’espace public,\n       ou à la réalisation de recherches archéologiques.\nARTICLE UA 2 – OCCUPATIONS ET UTILISATIONS DU SOL SOUMISES A DES\nCONDITIONS PARTICULIERES\nSont soumises à conditions particulières :\nUA 2-1 Les constructions à destination d’entrepôt sont autorisées à condition qu’elles soient\nnécessaires au fonctionnement :\n d’une construction ou installation nécessaire aux services publics ou d’intérêt collectif\n    (CINASPIC),\n ou sur les «linéaires de commerce, artisanat et services en zone UA » repérés sur les plans de\n    zonage, d’une activité commerciale, artisanale ou de services autorisés dans ces linéaires,\n ou en dehors des « linéaires de commerce, artisanat et services en zone UA », d’une activité\n    commerciale ou artisanale.\nElles ne peuvent pas représenter plus de 20% de la surface de plancher totale de la construction, sauf\npour les entrepôts nécessaires au fonctionnement des constructions et installations nécessaires aux\nservices publics ou d’intérêt collectif (CINASPIC).\nUA 2-2 Les constructions à destination d’habitation : lorsqu’une opération de construction neuve\net/ou de changement de destination comprend au moins 1 200 m² de surface de plancher à\ndestination d’habitation, au moins 40% de la surface de plancher totale à destination d’habitation\ndevra être affectée à des logements sociaux*.\nLorsque les constructions sont inclues dans une opération d’aménagement (ZAC, concession\nd’aménagement, Projet urbain partenarial…), l’obligation d’affecter 40% de la surface de plancher aux\nlogements sociaux s’applique de manière globale à l’ensemble des surfaces de plancher à destination\nd’habitation prévues dans l’opération d’aménagement.\nUA 2-3- Les installations classées : en application des articles L.511-1 et suivants du code de\nl’environnement, l’implantation ou l’extension* d’ICPE (Installations Classées pour la Protection de\nl’Environnement) est autorisée sous réserve du respect de la réglementation en vigueur et à\ncondition :\n de faire partie des catégories listées dans le tableau joint en annexe du présent règlement\n que soient mises en œuvre toutes les dispositions utiles pour les rendre compatibles avec les\n    milieux environnants,\n qu’il n’en résulte pas pour le voisinage une aggravation des dangers et nuisances,\n d’une bonne compatibilité avec les réseaux d’infrastructures et d’assainissement,\nP. 23 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1    UA\nARTICLE UA 3 – CONDITIONS DE DESSERTE DES TERRAINS PAR LES VOIES\nPUBLIQUES OU PRIVEES ET D’ACCES AUX VOIES OUVERTES AU PUBLIC.\nPour être constructible, un terrain doit avoir accès à une voie carrossable publique ou privée, soit\ndirectement, soit par l’intermédiaire d’un passage aménagé sur le terrain* ou sur un terrain voisin.\nUA 3-1 Conditions de desserte des terrains par des voies publiques ou privées\nTout terrain* doit être desservi par une voie carrossable publique ou privée en bon état de viabilité et\nprésentant des caractéristiques permettant de satisfaire aux exigences de la sécurité, de la défense\ncontre l’incendie et de la protection civile.\nLa largeur de cette voie ne peut être inférieure à 3,50 mètres, sauf en cas d’extension ou de\ndémolition / reconstruction d’une construction existante et à condition de ne pas créer de logements\nsupplémentaires.\nIl sera exigé une voie d’une largeur supérieure à 3,50 mètres si cela est nécessaire :\n- du fait de l’importance des constructions projetées, et par conséquent des flux de véhicules et de\n    piétons qui emprunteront cette voie.\n- ou si les accès projetés, du fait de leur configuration ou de leur disposition, présentent un risque\n    pour la sécurité des personnes.\nDes aménagements complémentaires (trottoirs, éclairages, etc…) pourront être imposés lorsque la\nvoie aura une largeur supérieure à 3,50 mètres.\nLes voies en impasse d’une longueur égale ou supérieure à 50 mètres doivent être aménagées de\ntelle sorte que les véhicules puissent faire demi-tour.\nUA 3-2 Conditions d’accès aux voies ouvertes au public\n-Tout terrain doit disposer d’un accès* d’une largeur minimale de 3,50 mètres sur une voie carrossable\npublique ou privée, ou bénéficier d’une servitude de passage d’une largeur minimale de 3,50 mètres,\njusqu’à celle-ci.\n-La largeur de cet accès peut être inférieure à 3,50 mètres en cas d’extension ou de démolition /\nreconstruction d’une construction existante et à condition de ne pas créer de logements\nsupplémentaires.\n-Pour chaque propriété :\n       1 seul accès carrossable est autorisé pour les terrains ayant une longueur de façade\n    (linéaire en contact avec l’emprise publique) inférieure ou égale à 20 mètres ;\n       2 accès maximum pour les terrains ayant une longueur de façade comprise entre 20\n    mètres et 40 mètres ;\n       3 accès maximum pour les terrains ayant une longueur de façade de plus de 40 mètres.\nCette disposition ne s’applique pas aux voies desservant plus de deux logements.\n-L’emplacement des nouveaux accès carrossables doit tenir compte :\n    • du risque éventuel pour la circulation et la sécurité des usagers de l’espace public ou des\n    personnes utilisant ces accès. La sécurité des usagers doit être appréciée compte tenu de la\n    position des accès, de leur configuration ainsi que de la nature et de l'intensité du trafic.\n    • des alignements d’arbres sur la voie publique et autres espaces verts, afin d’assurer le maintien\n    de leur bon état phytosanitaire ;\n    • des dispositifs de signalisation, d’éclairage public, de supports de réseaux ou de tout autre\n    élément de mobilier urbain situé sur l’emprise de la voie ;\n    • des accès existants sur les parcelles limitrophes, afin de limiter l’impact sur l’espace public.\n9 décembre 2025    / P. 24 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD    UA\nRèglement Partie 1\nARTICLE UA 4 – CONDITIONS DE DESSERTE DES TERRAINS PAR LES RESEAUX\nPUBLICS D’EAU, D’ELECTRICITE ET D’ASSAINISSEMENT.\nUA 4-1 Dispositions générales :\nL’emplacement des nouveaux réseaux doit tenir compte des arbres et des alignements d’arbres\nprotégés au titre de l’article L.123-1-5-III-2° du code l’urbanisme afin d’assurer le maintien de leur bon\nétat phytosanitaire.\nUA-4-2 Obligation de raccordement des eaux usées\nComme le prescrit l'article L 1331-1 du Code de la Santé Publique, tous les immeubles qui ont accès\naux égouts disposés pour recevoir les eaux usées domestiques et assimilées domestiques et établis\nsous la voie publique à laquelle ces immeubles ont accès (directement ou par l'intermédiaire de voies\nprivées ou de servitudes de passage), doivent obligatoirement être raccordés à ce réseau dans un\ndélai de deux ans à compter de la date de mise en service du réseau public de collecte.\nTout projet de raccordement ou de rejet au réseau d’assainissement doit faire l'objet d'une demande\nadressée au Service Assainissement1.\nUA-4-3 La gestion des eaux pluviales\nAfin d’alimenter la nappe phréatique d’une part (sous réserve d’installation de dispositifs anti-\npollution), et d’éviter la saturation des réseaux d’autre part, seul l’excès de ruissellement doit être\ncanalisé après qu’aient été mises en œuvre toutes les solutions susceptibles de :\n    -    limiter l’imperméabilisation du terrain,\n    -    limiter la concentration des pollutions,\n    -    favoriser l’évaporation rapide (en privilégiant la végétalisation, le cheminement et le stockage\n    de l’eau à ciel ouvert sur des durées inférieures à 24h),\n    -    favoriser l’infiltration des eaux de pluie en fonction des prescriptions par zones établies à la\n    carte figurant à l’annexe 5b– Carte de zonage pluvial. »\nDifférentes techniques permettent d’atteindre cet objectif du «zéro rejet» d’eaux pluviales pour les\npluies courantes (jusqu’à la pluie annuelle) : toiture terrasse végétalisée, noue*, bassin sec, bassin en\neau, puisard, tranchée d’infiltration, stockage et réutilisation des eaux pluviales pour l’arrosage ou\npour le lavage des espaces extérieurs...\nEn particulier, ces techniques devront être mises en œuvre sur les aires de stationnement à aire libre.\nToutefois, lorsque la rétention de toutes les eaux de pluie sur la parcelle n’est pas possible, le\npropriétaire peut solliciter l’autorisation de raccorder ses eaux de ruissellement au réseau à la\ncondition que ses installations soient conformes aux prescriptions techniques définies par le règlement\nd’assainissement en vigueur.\nL’excédent d’eaux de ruissellement rejoignant le réseau est soumis à des limitations de débit de rejet,\nafin de limiter, à l’aval, les risques d’inondation ou d
