 recherches archéologiques.\n    L’implantation des installations classées qui figurent dans la liste jointe intitulée : « Liste des\n    ICPE soumises à des conditions particulières».\nARTICLE UBd 2 – OCCUPATIONS ET UTILISATIONS DU SOL SOUMISES A DES\nCONDITIONS PARTICULIERES\nSont soumises à conditions particulières :\n1- Les constructions à usage d’entrepôt doivent être liées à un autre mode d’occupation du sol\nautorisé dans la zone.\n2- Les constructions à usage d’habitation : Dans le secteur instauré au titre de l’article L 123-1-5-\n16° du code de l’urbanisme (soit l’ensemble de la zone UB), les opérations de constructions neuves\net/ou de changement de destination comprenant du logement, devront comporter au moins 40% de\nlogements sociaux*.\nLorsque les constructions sont inclues dans une opération d’aménagement (ZAC, Lotissement,\npermis groupé ou valant division…), l’obligation d’affecter 40% de logements sociaux s’applique de\nmanière globale à l’ensemble des surfaces de logement prévues dans l’opération d’aménagement.\nCes dispositions s’appliquent à partir d’une surface de plancher* de 1 200 m² de logement.\n3. Les constructions à usage de commerces et d’artisanat ne doivent pas excéder les surfaces\nsuivantes :\n     500 m² de surface affectée à la vente par unité commerciale\n     500 m² de surface de plancher* pour les constructions artisanales.\nP. 83 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UBd\n4- Les installations classées :\nEn application des articles L.511-1 et suivants du code de l’environnement, l’implantation ou\nl’extension* d’ICPE (Installations Classées pour la Protection de l’Environnement) est autorisée sous\nréserve du respect de la réglementation en vigueur et à condition :\n de faire partie des catégories listées dans le tableau joint en annexe du présent règlement\n que soient mises en œuvre toutes les dispositions utiles pour les rendre compatibles avec les\n    milieux environnants,\n qu’il n’en résulte pas pour le voisinage une aggravation des dangers et nuisances,\n d’une bonne compatibilité avec les réseaux d’infrastructures et d’assainissement,\nARTICLE UBd 3 – CONDITIONS DE DESSERTE DES TERRAINS PAR LES VOIES\nPUBLIQUES OU PRIVEES ET D’ACCES AUX VOIES OUVERTES AU PUBLIC.\nTout terrain* doit être desservi par une voie carrossable publique ou privée en bon état de viabilité et\nprésentant des caractéristiques permettant de satisfaire aux exigences de la sécurité, de la défense\ncontre l’incendie et de la protection civile.\nLa largeur de cette voie ne peut être inférieure à 3,50 m, sauf en cas d’extension* ou de démolition /\nreconstruction d’une construction existante à usage de logements et à condition de ne pas créer de\nlogements supplémentaires.\nCompte tenu de l’importance des constructions ou si les accès présentent un risque pour la sécurité\ndes personnes (Cette sécurité doit être appréciée compte tenu, notamment, de la disposition des\naccès, de leur configuration) il pourra être exigé une voie d’une largeur supérieure à 3,50 m, dans ce\ncas des aménagements complémentaires tels que des trottoirs pourront être imposés.\nLorsque les voies d’une longueur égale ou supérieure à 50 mètres se termineront en impasse, celles-\nci devront être aménagées de telle sorte que les véhicules puissent faire demi-tour.\nPour chaque propriété, les possibilités d’accès carrossable à la voie publique sont limitées à un accès\npar tranche de 15 m de façade*.\nARTICLE UBd 4 – CONDITIONS DE DESSERTE DES TERRAINS PAR LES RESEAUX\nPUBLICS D’EAU, D’ELECTRICITE ET D’ASSAINISSEMENT.\nTous les raccordements aux réseaux devront être enterrés.\nEAU :\nLe branchement sur le réseau d’eau existant est obligatoire pour toute construction qui requiert une\nalimentation en eau.\nASSAINISSEMENT :\nA l’intérieur d’une même propriété, les eaux pluviales et les eaux usées devront être recueillies\nséparément. La gestion des eaux pluviales et des eaux usées devra se faire conformément aux\nrèglements d’assainissement approuvés par les autorités compétentes.    A titre d’information, le\nrèglement départemental d’assainissement impose, dans le cas de rejets vers les installations du\ndépartement, les débits de fuite suivants, quelle que soit la taille de la parcelle et calculée pour une\npluie décennale:\n       2 litres/ seconde/ hectare dans le cas d’un rejet vers le réseau unitaire\n       10 litres/ seconde/ hectare dans le cas d’un rejet vers le milieu naturel (direct ou via un réseau\n    d’eaux pluviales)\nELECTRICITE :\nLes branchements de tous types ne devront pas être apparents sur la construction.\n9 décembre 2025    / P. 84 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UBd\nLocaux de stockage des conteneurs à déchets\nLes types de constructions, ci-après définies devront comporter des locaux de stockage des déchets\ndimensionnés de manière à recevoir et permettre de manipuler sans difficultés tous les conteneurs\nnécessaires à la collecte des déchets. Chaque local doit être pourvu d’un robinet pour le lavage des\nconteneurs et d’un écoulement.\nPour les constructions à usage d’habitation :\n    Les locaux de stockage des déchets doivent être situés au rez-de-chaussée. Ils doivent\n    permettre un accès direct et permanent aux conteneurs destinés à recevoir la collecte\n    sélective.\n     Pour le rangement des conteneurs, la surface minimale du local sera obtenue selon un ratio\n    de 0,3m² par logement. Cette surface ne pourra pas être inférieure à 2m 2.\n     Un espace destiné au stockage des encombrants doit être prévu, dans un local recevant les\n    conteneurs ou dans un local spécifique. Sa surface minimale sera obtenue par un ratio de\n    0,3 m2 par tranche de 100m 2 de surface de plancher construite.\nPour les constructions à destination de commerce\n    Les locaux destinés au stockage des déchets devront être indépendants de ceux prévus pour\n    les habitations.\n    Ils devront avoir une surface minimale de 3 m2 pour les commerces dont la surface de\n    plancher est inférieure à 50 m 2, 4 m2 pour les commerces dont la surface de plancher est\n    comprise entre 50 m2 et 100 m2, 6 m2 pour les commerces dont la surface de plancher est\n    supérieure à 100 m2. Pour ces derniers, il sera demandé 1m 2 de surface supplémentaire pour\n    le local déchet par tranche de 100 m 2 de surface de plancher construite.\nPour les constructions à destination autre que de l’habitation ou de commerce dont la surface de\nplancher est inférieure à 100 m 2, les locaux destinés à l’entreposage des déchets devront avoir une\nsurface minimale de 4m2, puis il sera demandé l’ajout de 0,8m 2 de surface supplémentaire par tranche\nde 100 m2 de surface de plancher construite.\nARTICLE UBd 5 – SUPERFICIE MINIMALE DES TERRAINS CONSTRUCTIBLES\nArticle supprimé par la loi ALUR du 24 mars 2014.\nARTICLE UBd 6 – IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX VOIES\nET EMPRISES PUBLIQUES\nLes constructions devront respecter les principes d’alignement* et de recul figurant au plan de zonage\nau 1/500ème.\nEn l’absence d’indications particulières figurant au plan de zonage au 1/500 ème, les constructions\npourront être implantées à l’alignement* ou en recul. Ce recul ne pourra être inférieur à 3 m. Le choix\nde l’implantation se fera en harmonie avec le contexte environnant, et en tenant compte des\nindications figurant à l’article 11.\n-   Sous secteur C :\n    Rue des Grands Buissons, les constructions devront respecter un recul par rapport à l’emprise\n    publique de 3,00 m. sur les quatre premiers niveaux (RDC, R+1, R+2, R+3) et un recul de 4,50 m.\n    au dernier niveau.\nP. 85 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UBd\n    Les constructions situées à l’angle de l’Avenue de la République et de la rue Becquet respecteront\n    au niveau R+5 un retrait minimum d’1,50 m. par rapport à la limite de l’emprise publique située\n    face à l’espace vert ou de loisirs.\nRappel : les saillies* sur domaine public sont autorisées dans la mesure où elles sont autorisées par le\nrèglement de voirie applicable à la voie concernée et sous les conditions qu’il édicte.\nARTICLE UBd 7 – IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX\nLIMITES SEPARATIVES\n-    Sous secteur A : Les constructions pourront être implantées :\n    o Soit en limite séparative* si la façade* coïncidant avec cette limite est aveugle ;\n    o Soit à une distance minimum de H/2 de cette limite, dans les autres cas avec un minimum\n    de 6,00 m. (H étant la hauteur* de la façade* de la construction mesurée depuis le niveau\n    du sol jusqu’à l’acrotère* ou l’égout du toit).\n-    Sous secteur B : Les constructions pourront être implantées :\n    En limite séparative*:\n    - dans une bande de 20,00 m. à partir de la limite d’emprise publique si la façade* est aveugle\n    ou comporte des jours de souffrance, et à condition que la hauteur* de cette façade* mesurée\n    du niveau du sol, n’excède pas 10 mètres à l’acrotère* ou l’égout du toit :\n    - lorsque la construction nouvelle ne fait face à aucune construction (en bordure de voie ferrée).\n    A une distance minimum de H/2 de cette limite avec un minimum de 6,00 m. dans les autres cas\n    (H étant la hauteur* de la façade* de la construction mesurée depuis le niveau du sol jusqu’à\n    l’acrotère* ou l’égout du toit).\n-    Sous secteur C :\n    Si la façade* coïncidant avec la limite séparative* est aveugle, les constructions pourront\n    s’implanter en limite séparative*.\n    En cas de retrait par rapport aux limites séparatives* :\n    - A l’intérieur d’une zone constructible de transparence visuelle définie graphiquement, les\n    constructions respecteront une distance minimale de 4,00 m. de cette limite. Des liaisons\n    bâties relieront néanmoins les constructions à la limite séparative* et seront constituées de\n    balcons, terrasses, ou jardin d’hiver (sur l’avenue de la République) formant une interruption\n    volumétrique et préservant une transparence sur l’espace du cœur.\n    -    Dans les autres cas :\n    - A une distance minimum de H/2 de cette limite si la construction comporte des baies\n    éclairant des pièces principales*.\n    - A une distance minimum de 4,00 m. dans les autres cas.\nARTICLE UBd 8 – IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT\nAUX AUTRES SUR UNE MEME PROPRIETE\n-    Sous secteurs A et B :\n    Les bâtiments contigus sont autorisés en limite de propriétés.\n    Si les bâtiments ne sont pas contigus, la distance en tout point de la façade*, mesurée\n    perpendiculairement à celle-ci et la séparant de la façade* d’un autre bâtiment, devra être au\n    moins égale à la moitié de la hauteur* de la façade* la plus haute, avec un minimum de 8,00 m.\n    dans le cas où l’une des façades* comporte des baies principales*, et de 6 mètres dans les autres\n    cas.\n9 décembre 2025    / P. 86 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UBd\n    Lorsque les façades* ne sont pas parallèles, les deux règles suivantes se substituent à la règle\n    précédente :\n    - la distance à la façade* existante mesurée perpendiculairement au milieu de la façade*, devra\n    être au moins égale à la moitié de la hauteur* de la façade* la plus haute avec un minimum de\n    8,00 m. dans le cas où l’une des deux façades* comporte des baies principales* et de 6,00 m.\n    dans les autres cas ;\n    - la distance à la façade* existante, mesurée normalement en tout point de la façade* devra\n    être au moins égale au tiers de la hauteur* de la façade* avec un minimum de 6,00 m. dans le\n    cas où l’une des façades* comporte des baies principales* et de 4,00 m. dans les autres cas.\n    Toutefois, dans le cas où la hauteur* des constructions annexes et/ou les ouvrages techniques, ne\n    dépasse pas 3 mètres, il n’est pas fixé de distance minimale :\n    - entre la construction principale et les constructions annexes et/ou les ouvrages techniques\n    - et/ou entre les constructions annexes et les ouvrages techniques.\n-    Sous secteur C :\n    Les constructions seront réalisées sur les zones d’emprise constructible figurant au plan de\n    zonage au 1/500ème.\nARTICLE UBd 9 – EMPRISE AU SOL DES CONSTRUCTIONS\n-    Sous secteurs A et B :\n    Sans objet.\n-    Sous secteur C :\n    L’emprise au sol* maximale des constructions est représentée au plan de zonage au 1/500ème .\n    L’emprise au sol* maximale des constructions de certains îlots respectera les pourcentages\n    indiqués au plan de zonage au 1/500ème.\n    La localisation de principe des zones constructibles de transparence visuelle est repérée sur le\n    plan de zonage au 1/500ème.\n    Les dispositions des paragraphes ci-dessus ne s’appliquent pas aux constructions et installations\n    nécessaires aux services publics ou d’intérêt collectif lorsque les modalités de fonctionnement de\n    ceux-ci l’imposent.\nARTICLE UBd 10 – HAUTEUR MAXIMALE DES CONSTRUCTIONS\nLes constructions ou installations respecteront les hauteurs* maximales définies sur le plan de\nzonage au 1/500ème.\nConformément à ce dernier, la hauteur* maximale des constructions ne pourra dépasser 21 m. La\nhauteur* maximale est mesurée à la partie médiane de la façade* depuis le niveau du sol de\nl’emprise publique jusqu’à l’acrotère* ou l’égout de toiture.\nLes dispositions du paragraphe ci-dessus ne s’appliquent pas à la construction du centre de secours\ndont la hauteur* maximale est fixée à 22 m.\nNe seront pas comptées dans la hauteur* maximum par niveaux autorisée, outre les antennes privées\nou collectives, les constructions annexes sur terrasses à condition qu’elles ne dépassent pas une\nhauteur* maximum de 3,00 m qu’elles soient implantées en retrait des façades* d’une distance au\nmoins égale à leur hauteur* et qu’elles abritent uniquement la machinerie des ascenseurs, la sortie\ndes escaliers, la chaufferie et le conditionnement d’air.\nLes gaines de ventilation, les souches de cheminées pourront ne pas être comptées dans le plafond\nde hauteur*.\n-    Sous secteurs A et B :\n    Dans la portion de la rue Rouget de Lisle comprise entre la rue Becquet et la rue de l’Industrie\n    (ancienne avenue Hoche prolongée), ainsi que dans la rue de l’Avenir aucune partie des\n    constructions, à l’exception des constructions annexes sur terrasse indiquées ci-dessus, ne devra\n    dépasser le gabarit-enveloppe ci-après dessiné :\nP. 87 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UBd\n    2/1\n    H=13,00m.    H=10,00m.\n    Autour de la place du Docteur Pierre, aucune partie des constructions, à l’exception des\n    constructions annexes sur terrasse indiquées ci-dessus, ne devra dépasser le gabarit-enveloppe\n    ci-après dessiné :\n    2/1\n    H=16,00m.    H=13,50m.\n-    Sous secteur C\n    Sur l’avenue de la république, les angles des constructions pourront s’élever d’un niveau supérieur\n    dans une proportion représentant une surface maximale correspondant à environ 40% de la surface\n    du plancher bas du niveau inférieur R+5.\n    Pour les constructions formant angle avec l’avenue de la République et la rue Becquet, les niveaux\n    R+5 et R+6 seront limités dans une proportion ne dépassant pas une proportion correspondant\n    respectivement à 68% et 31% environ de la surface de plancher*bas du niveau inférieur R+4 et R+5.\n    Pour les constructions formant angle avec l’avenue de la République et la rue de l’industrie, le\n    niveau R+6 sera limité à une surface maximale correspondant à environ 25 % de la surface du\n    plancher bas du niveau inférieur à R+5.\n    Conformément au plan de zonage au 1/500ème, les constructions respecteront un recul d’1,50 m.\n    minimum du niveau R+5 par rapport au niveau inférieur R+4. Ce recul concerne la totalité des\n    façades* latérales aux zones constructibles de transparence visuelle et les retours sur cœurs\n    d’opérations pour les constructions donnant sur l’avenue de la République.\nARTICLE UBd 11 – ASPECT EXTERIEUR DES CONSTRUCTIONS ET AMENAGEMENT\nDE LEURS ABORDS AINSI QUE LES PRESCRIPTIONS DE NATURE A ASSURER LA\nPROTECTION DES ELEMENTS DE PAYSAGE , DES QUARTIERS, ILOTS, IMMEUBLES,\nESPACES PUBLICS, MONUMENTS, SITE ET SECTEURS A PROTEGER\n11-1 Protection du paysage :\nToutes les façades* des constructions devront être traitées avec le même soin que les façades*\nprincipales.\nLes coffrets, compteurs et boîtes à lettres doivent être intégrés dans la construction ou les clôtures en\ns’implantant selon une logique de dissimulation qui tienne compte des modénatures et des matériaux\nconstitutifs ; les locaux techniques doivent être intégrés au bâtiment principal ou faire l’objet d’une\nrecherche prenant en compte le bâti annexe, les constructions voisines, la structure végétale existante\net les plantations à créer ; ils feront partie du projet architectural.\nLa pose éventuelle de capteurs solaires doit être particulièrement étudiée, notamment au regard de la\ntrame des ouvertures de la façade*, et afin de favoriser une intégration dans le plan de toiture.\nLes antennes y compris les paraboles doivent être intégrées de façon à réduire l’impact, notamment\nlorsqu’elles sont vues depuis les voies ou les espaces publics.\n9 décembre 2025    / P. 88 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UBd\n11-2 Toitures :\nL’ensemble des bâtiments sur l’avenue de la République comporteront des toitures terrasses.\nCes toitures seront considérées comme une 5ème façade* et traitées comme accessibles jusqu’au\nniveau R+5 et si possible plantées partiellement. Les dispositifs techniques éventuels seront intégrés\ndans un volume fermé. En cas d’impossibilité technique ils pourront être masqués par un dispositif de\nclaires voies.\nChaque fois que cela est possible, la végétalisation des toitures terrasses doit être recherchée.\n11-3 Matériaux :\nDoivent être employés des matériaux et techniques adaptées à la nature du bâti et des matériaux de\nconstruction, au caractère architectural et en rapport avec l’environnement.\nL’aspect des matériaux fabriqués en vue d’être recouverts d’un parement ou d’enduit ne doit pas\nrester apparent ni sur les parements extérieurs des constructions ni sur les clôtures.\n11-4 Energie :\nLa pose d’éventuels châssis de toiture ou de capteurs solaires doit être particulièrement étudiée,\nnotamment au regard de la trame des ouvertures de la façade*, de la recherche d’une intégration\ndans le plan de toiture et éviter la multiplicité des dimensions et des implantations.\n11-5 Rampes de parking:\nLes accès des parcs de stationnement d’immeubles de logements collectifs ou des espaces de\nlivraisons des locaux d’activité devront être intégrés à l’ensemble du projet architectural.\n11-6 Clôtures et portails:\nLes clôtures sur les voies publiques et dans les marges* de recul imposées en bordure de celles-ci,\npermettront la vue sur l’espace planté les séparant du bâti. Elles seront constituées de maçonneries,\nserrureries sur massif maçonné ou haies vives doublant un muret et venant le compléter. S’il y a des\nclôtures en cœur d’opération séparant les espaces verts intérieurs contigus, elles seront conçues\nd’une manière unitaire et devront offrir un maximum de transparence.\nCes dispositions ne sont pas applicables aux constructions et installations nécessaires aux services\npublics ou d’intérêt collectif lorsque les conditions de fonctionnement ou de sécurité l’imposent\nLes portails devront avoir une largeur minimale de 3 m.\n11-7 Descentes d’eaux pluviales :\nLes descentes d’eaux pluviales devront être intégrées dans la composition architecturale de la\nfaçade*. Les rejets d’eau pluviale des balcons, loggias et terrasses devront être canalisées de façon à\néviter toute salissure des façades* et de l’espace public.\n11-8 Façades* :\nPour les façades* d’une longueur supérieure ou égale à 30 m, situées en vis-à-vis d’une voie, le\ntraitement architectural et la composition de la façade* ne devront pas être uniformes mais\nprivilégieront un traitement architectural séquentiel, pouvant ménager des transitions entre les\nséquences ainsi obtenues, le cas échéant, entre l’alignement et le retrait de 4 mètres.\nDes retraits ponctuels du plan de façade* et/ou des saillies ponctuelles du plan des façades et/ou des\ninterruptions ponctuelles du bâti pourront être admis, notamment pour animer les façades*, pour\nfavoriser les transparences visuelles vers les cœurs d’îlots.\nLorsque les constructions seront à l’alignement* de l’emprise publique des retraits sous forme de\nloggias ou jardins d’hiver dans le plan de la façade* sont possibles.\nP. 89 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UBd\n11-9 Commerces :\nLes façades* des locaux de commerce doivent être conçues en harmonie et en préservant les\ncaractéristiques architecturales de l’immeuble dans lequel ils sont situés.\n -   Sous secteurs A et B :\n    Le long de la traversée piétonne paysagère, les clôtures en limite d’emprise publique ne devront\n    pas comporter de parties pleines à une hauteur supérieure à 0,80 m. et devront présenter des\n    transparences sur le cœur d’opération si celui-ci est traité en espace vert, ou être agrémentées\n    de plantations denses dans le cas contraire.\n -   Sous secteur C :\n    Conformément au plan de zonage au 1/500ème, les constructions seront reliées entre elles, dans\n    les zones constructibles de transparence visuelle, par des constructions de liaison de type\n    balcons, terrasses, jardin d’hiver (permis sur la seule avenue de la République), hall au Rez-de-\n    chaussée ou émergence de parking en infrastructure formant une interruption volumétrique et\n    préservant une transparence sur l’espace du cœur d’opération.\n    Ces constructions de liaison seront d’une profondeur minimum de 2,80 m et d’une largeur de 8 m\n    minimum pour celles donnant sur l’avenue de la République et la rue des Grands Buissons et\n    d’une largeur de 9 m minimum pour celles donnant sur les voies perpendiculaires à ces\n    dernières.\nARTICLE UBd 12 – OBLIGATIONS IMPOSEES AUX CONSTRUCTEURS EN MATIERE\nDE REALISATION D’AIRES DE STATIONNEMENT\nLe stationnement des véhicules correspondant aux besoins des constructions et installations, ainsi\nque leurs zones de manœuvre, doivent être assurés en dehors des voies publiques.\nLes règles applicables aux constructions ou établissements non prévus ci-dessous sont celles qui\ns’appliquent aux établissements qui leur sont le plus directement assimilables.\nChaque fois qu’une construction comporte plusieurs destinations, le nombre total des places de\nstationnement exigibles sera déterminé en appliquant à chacune d’entre elles la norme qui lui est\npropre.\nUBd 12-1 Normes de stationnement pour les véhicules motorisés\nUBd 12-1.1 Dispositions générales\n    Le stationnement lié à l’habitat individuel et les parcs de stationnement créés ou réaménagés\n    doivent permettre une circulation satisfaisante des véhicules répondant aux exigences de sécurité,\n    de fonctionnalité, de praticabilité, et de confort. Ils doivent prendre en compte les exigences\n    réglementaires en matière de stationnement des personnes à mobilité réduite et des\n    stationnements des véhicules électriques et hybrides;\n    Le calcul des places de stationnement sera effectué dès la première tranche entamée, et en\n    arrondissant à l’unité supérieure le résultat obtenu par application de la norme, dès que la première\n    décimale est supérieure ou égale à 5.\n    A partir de la création de 20 places de stationnement, une proportion de 50 % au moins des\n    surfaces totales de stationnement définies ci-dessous devra être réalisée dans un volume\n    construit. Cette prescription ne s’applique pas aux constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif (CINASPIC).\n9 décembre 2025    / P. 90 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UBd\n    La suppression de places de stationnement existantes est autorisée uniquement si le nombre total\n    de places répond a minima à la norme plancher, telle que définie par l’article 12.1.2, nécessaire au\n    projet faisant l’objet de la demande d’autorisation d’urbanisme.\n    Dans le cas de réhabilitations et de changements de destination, une variation jusqu’à 10% du\n    nombre de places est autorisée si elle répond à l’évolution des normes sur les parcs de\n    stationnement (dimensions des places, des circulations, contraintes pompiers…)\n    Les places commandées* ne sont pas prises en compte pour le calcul réglementaire du nombre\n    de places plancher à réaliser.\n    Pour l’application d’une règle faisant référence aux zones (1, 2, 3 ou 4), il y a lieu de se reporter\n    au plan page suivante et repris en format agrandi en annexe du règlement. Lorsqu’une unité\n    foncière est concernée par plusieurs zones, c’est la norme la moins contraignante qui s’applique.\nUBd 12-1.2 Normes de stationnement des automobiles pour les constructions nouvelles et les\nextensions des constructions existantes\nIl devra être réalisé lors de toute construction nouvelle ou, extension de construction de plus de 50 m²\nde surface de plancher (ci-après SP), des places de stationnement qui doivent répondre aux normes\nci-dessous calculées au prorata de la surface de plancher créée.\nP. 91 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UBd\n    Destination de la construction    Norme Plancher    Norme Plafond\n    (minimum)    (maximum)\nHabitation\nLogements\n    Zone 1    0,85 place / logement\n    Zone 2    0,9 place / logement\n    Zone 3    1 place / logement\n    Zone 4    1,1 place / logement\nLogements sociaux\n    Zone 1    0,5 place / logement    Pas de norme plafond\n    Zone 2 (T2)    0,5 place / logement\n    Zone 2 (pôle intermodal de la Boule)    0,8 place / logement\n    Zone 3    0,9 place / logement\n    Zone 4    1 place / logement\nEtablissement assurant l’hébergement des\npersonnes âgées, résidences étudiantes,\nrésidences et structures de services à vocation\nsociale\n    Zone 1 et 2    1 place / 180 m² SP\n    Zone 3 et 4    1 place / 150 m² SP\nBureaux\nZone 1 (Gares Préfecture, Université et Groues)    1 place /150 m²    1 place / 75 m²\n    Zone 1 (Gare Nanterre Ville)    1 place /150 m²    1 place / 62 m²\n    Zone 2    1 place / 150 m²    1 place / 62 m²\n    Zones 3 et 4    1 place / 85 m²    1 place / 52 m²\nCommerces :\n- Jusqu’à 300 m² de SP    1 place/150 m² de SP\n- De 301 à 2 000 m² de SP    1 place/70 m² de SP    Pas de norme plafond\n- Au-delà de 2 001 m² de SP    1 place/35 m² de SP\nLe calcul s’effectue par application des normes des\ntranches successivement atteintes\nHébergement hôtelier\n    Zone 1 et 2    0,15 place / chambre    0,4 place / chambre\n    Zone 3 et 4    0,35 place / chambre    0,5 place / chambre\n    Destination de la construction    Norme Plancher    Norme Plafond\n    (minimum)    (maximum)\nArtisanat    1 place/170 m² de SP    Pas de norme plafond\nIndustrie    1 place/ 250 m² de SP    Pas de norme plafond\nEntrepôt    1 place/5 000 m² de SP    Pas de norme plafond\nConstructions ou installations nécessaires    Le nombre de places à réaliser doit être justifié\naux services publics ou d’intérêt collectif    dans la demande d’autorisation d’urbanisme, et\nCINASPIC    suffisant au regard des besoins nécessaires à la\n    nature    de    l'équipement,   son    mode    de\n    fonctionnement, le nombre et le type d'utilisateurs\n    (employés, visiteurs, étudiants…) et sa localisation\n    dans la commune (proximité d'une gare, desserte\n    en transports en commun, existence ou non de\n    parcs publics de stationnement à proximité...).\n9 décembre 2025    / P. 92 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UBd\n    L’illustration ci-dessous des zones différenciées pour les normes de stationnement est\n    complétée du plan détaillé N° 1-F en annexe du règlement.\nP. 93 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UBd\nUBd 12-1.3. Normes de stationnement des automobiles pour les réhabilitations, les\nréaménagements et les changements de destination\nPour les travaux de réhabilitation d'une construction existante, de réaménagement d’une construction\nexistante ayant pour effet la création de logements supplémentaires, et/ou les travaux de changement\nde destination d’une construction existante, le nombre de places plancher exigé résulte de la\ndifférence entre :\n-    le nombre de places qui serait exigé sur la base de l’article 12-1.2 pour la destination de la\n    construction après l’opération.\n-    le nombre de places qui serait exigé sur la base de l’article 12-1.2 pour la destination de la\n    construction avant l’opération.\nLes besoins réglementaires pourront être satisfaits en prenant en compte les places préexistantes\nconservées.\nUBd 12-1.4 Mutualisation des places de stationnement pour les automobiles\nDans le cas où les besoins en stationnement des véhicules automobiles sont satisfaits par la création\nd’un parc de stationnement commun à l’ensemble, ou à une partie, d’une opération faisant l’objet\nd’une seule autorisation d’urbanisme, ou d’une ou plusieurs opérations immobilières réalisées dans le\ncadre d’une même Zone d’Aménagement Concerté ou Concession d’aménagement, le nombre total\nde places à réaliser en application des articles 12-1.2 et 12-1.3 pourra être minoré à condition que\nl’ensemble des conditions suivantes soit respecté:\n- La ou les opération(s) portent sur une ou des constructions ayant au moins deux destinations\ndifférentes ;\n- Le nombre total des places de stationnement obtenu par application des normes définies aux\narticles 12-1.2 et 12-1.3 et entrant dans le périmètre de la mutualisation est supérieur ou égal à 40\nplaces ;\n- Le futur parc de stationnement commun est réalisé dans un rayon de moins de 300 mètres de la ou\ndes constructions desservies ;\n- Le futur parc de stationnement commun est conçu pour un usage permettant la banalisation*, le\nfoisonnement* et la mutualisation* des places des différentes typologies de destinations (fluidité des\naccès, lisibilité du schéma de circulation, accès aisé aux places de stationnement…).\nDe 35% au maximum, cette minoration pourra être calculée à l’aide de la méthode présentée en\nannexe.\nDans tous les cas, le nombre total de places à réaliser après minoration devra être précisé dans une\nnotice de stationnement justifiant des besoins, de l’occupation alternative des places composant le\nparking commun par les usagers fréquentant les différentes opérations desservies, et d’une gestion\nmutualisée, banalisée et foisonnée de ces places.\nEn cas de volonté de mutualisation d’aires de stationnement, il pourra également être admis que le\npétitionnaire ne réalise pas sur le terrain d’assiette de l’opération ou dans son environnement\nimmédiat, tout ou partie du nombre d’emplacements nécessaires au stationnement calculé par\napplication des normes définies aux articles 12-1.2 et 12-1.3. Dans ce cas, le pétitionnaire pourra être\ntenu quitte de ses obligations pour les emplacements qu’il ne réalise pas lui-même :\n    - En justifiant de l’obtention d’une concession à long terme mutualisée dans un parc public ou\n    privé de stationnement existant ou en cours de réalisation situé dans un rayon inférieur à 300\n    mètres du terrain d’assiette de la construction\n    - Ou en justifiant de l’acquisition de places mutualisées dans un parc privé de stationnement\n    existant ou en cours de réalisation situé dans un rayon inférieur à 300 mètres du terrain\n    d’assiette de la construction.\n    PARTIE ANNEXE :\n    Les besoins en stationnement de chaque catégorie de surface desservie par le parking\n    banalisé peuvent être calculés à 5 périodes différentes de la semaine par application des\n    normes plancher, multipliées par les coefficients correctifs adéquats : ces coefficients\n    correctifs sont indiqués dans le tableau ci-dessous.\n9 décembre 2025    / P. 94 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UBd\n    Les périodes de la semaine retenues pour le calcul sont :\n    - la journée de semaine,\n    - la soirée de semaine,\n    - la nuit de semaine,\n    - la journée de week-end,\n    - la soirée de week-end.\n    La demande totale de stationnement engendrée à cette période pourra être établie par\n    addition des besoins élémentaires de chaque surface desservie par le parking banalisé à une\n    période donnée. La capacité du parking banalisé devra être supérieure à la demande\n    maximum constatée entre les 5 périodes.\n    EVOLUTION DE LA DEMANDE\n    DESTINATION\n    Journée    Soirée    Nuit    Journée    Soirée\n    semaine    semaine    semaine    week-end    week-end\nLogements    60 %    90 %    100 %    80 %    90 %\nBureaux, artisanat, industrie\net    100 %    30 %    10 %    10 %    10 %\nentrepôts\nCommerces :\n- Jusqu’à 2000 m²    50 %    50 %    10 %    100 %    50 %\n- Au-delà de 2000 m²    60 %    70 %    10 %    100 %    70 %\nHébergements hôteliers    10 %    80 %    100 %    20 %    70 %\n    A établir en fonction du fonctionnement, de sa fréquentation\n    prévisionnelle\n- CINASPIC\n    et de sa desserte tous modes selon les différentes périodes de la\n    journée\nUBd 12-1.5 - Normes techniques à respecter pour la réalisation des places de stationnement\ndes automobiles\nDimensions des places : les places créées ou réaménagées, ainsi que les boxes et garages,\ndoivent respecter les dimensions minimales suivantes :\n - Longueur : 5 mètres\n - Largeur : 2,30 mètres, portée à 2,50 mètres si la place jouxte un obstacle (mur, poteau…)\n - Dégagement : 5,50 mètres\nDimension minimales des rampes et voies de circulation : les dimensions préconisées pour les\nrampes correspondent à des largeurs circulables, hors obstacles de plus de 10 cm de haut ou\nséparateur central.\n    Rampes et voies de circulation\n   Parking concerné    Circulation autorisée    Rampe et voie droite    Rampe et voie courbe\n   Jusqu’à 50 places    Sens unique ou    3 mètres    3,50 mètres\n    Double sens alterné*\n   Plus de 50 places    sens unique    3 mètres    3,50 mètres\n    double sens    5 mètres    6 mètres\nLe double sens alterné n’est pas autorisé pour les parkings de plus de 50 places\nP. 95 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UBd\nCes rampes ne doivent pas entraîner de modification dans le niveau du trottoir. Leur pente dans les 5\npremiers mètres à partir de l'alignement ne doit pas excéder 5%, sauf dans le cas d'impossibilité\ntechnique.\nAu-delà de ces 5 premiers mètres, la pente maximale admise pour les rampes est de 18%.\nPour les courbes, le rayon de courbure extérieur de la rampe à sens unique, ou le rayon de courbure\nextérieur de la voie intérieure dans les cas d'une rampe à double sens, ne peut être inférieur à 8,50\nmètres. Ce rayon est mesuré en projection horizontale.\nUBd 12-1.6 Normes de stationnement des deux-roues motorisés pour les constructions\nnouvelles.\nPour toute construction à destination d’habitation ou de bureau supérieure à 500 m² de surface de\nplancher, iI est exigé une aire de stationnement pour deux-roues motorisés, dont la surface est\ncalculée au prorata de la surface de plancher créée pour ces destinations, de :\n    Destination    Norme Plancher    Norme Plafond\n    Habitation    5 m²/1000 m² de SP    Pas de norme plafond\n    Bureaux    5 m²/1000 m² de SP    12 m²/ 1000 m² de SP\nLorsqu’une aire de stationnement pour deux-roues motorisés est exigible, l’espace à leur réserver ne\npourra être inférieur à 3 m². Dans les opérations de 10 logements et plus, lorsque plusieurs espaces\nsont réalisés, l’un des espaces doit avoir une surface minimum de 10 m² d’un seul tenant.\nCes espaces seront implantés de préférence avec les places de stationnement voitures, s’il en existe.\nUBd 12-2 Normes de stationnement des vélos :\nDes places de stationnement doivent être réalisées pour les deux roues non motorisés. Elles doivent\nêtre :\n  - couvertes, exclusivement réservées aux vélos, sécurisées et équipées de dispositifs fixes\n    d’accroche, facilitant la performance des systèmes d’antivols ;\n  - facilement accessibles depuis l’espace public et les accès aux constructions ;\n  - situées de préférence en rez-de-chaussée, ou à défaut en extérieur sur la parcelle ou au premier\n    sous-sol\nLorsqu’une surface de stationnement vélos est exigible, l’espace réservé aux vélos sera d’au\nminimum 3 m². Dans les opérations de 10 logements et plus, lorsque plusieurs espaces sont réalisés,\nl’un des espaces doit avoir une surface minimum de 8 m² d’un seul tenant.\nUBd 12-2-1 – Normes de stationnement vélos pour les constructions nouvelles et les\nextensions\nPour toute construction à partir de 2 logements pour l’habitation ou d’une surface supérieure à 200 m²\nde SP pour les autres destinations, ou pour toute extension créant plus de 2 logements pour\nl’habitation ou plus de 200 m² de SP pour les autres destinations, iI est exigé une surface minimale de\nlocaux pour les vélos, calculée au prorata de la surface créée suivante :\nDestination    Norme Plancher\nLogements et logements financés    1,5 m² / logement\npar un prêt aidés de l’Etat\nRésidences étudiantes, résidences\net structures de services à vocation   0.75 m² / logement\nsociale\nBureaux    15 m² pour 1 000 m² de Surface de plancher\nCommerce, artisanat    10 m² pour 1 000 m² de Surface de plancher\nHôtel, industrie et entrepôt    5 m² pour 1 000 m² de Surface de plancher\nConstructions ou installations    Le nombre de places à réaliser doit être justifié dans la\nnécessaires aux services    demande d’autorisation d’urbanisme, et suffisant au regard des\n9 décembre 2025    / P. 96 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UBd\npublics ou d’intérêt collectif    besoins nécessaires à la nature de l'équipement, son mode de\n    fonctionnement, le nombre et le type d'utilisateurs (employés,\n    visiteurs, étudiants…) et sa localisation dans la commune\n    (proximité d'une gare, desserte en transports en commun,\n    existence ou non de parcs publics de stationnement à\n    proximité...).\nUBd 12-2.2 – Normes de stationnement vélos pour les réhabilitations, les réaménagements et\nchangement d’affectation\nPour les travaux de réhabilitation d'une construction existante, de réaménagement d’une construction\nexistante ayant pour effet la création de logements supplémentaires, et/ou les travaux de changement\nde destination d’une construction existante, la surface de plancher de locaux exigée pour les vélos\nrésulte de la différence entre :\n- la surface qui serait exigée par l’article 12-2.1 pour la destination de la construction après l’opération\n- la surface qui serait exigée par l’article 12-2.1 pour la destination de la construction avant l’opération.\nLes besoins réglementaires pourront être satisfaits en prenant en compte les surfaces préexistantes et\nconservées de locaux pour les vélos.\nUBd 12-3 Aires de stationnement pour les livraisons et la dépose/reprise des autocars\nUBd 12-3.1 : Les aires de stationnement pour les livraisons :\nLes emplacements nécessaires et adaptés pour assurer toutes les opérations usuelles de\nchargement, déchargement et manutention pour les livraisons et pour la dépose/reprise des autocars\ndoivent être réalisés sur les emprises privées.\nUne aire de stationnement pour les livraisons doit être prévue pour les constructions neuves dont la\nsurface de plancher totale atteint les seuils ci-dessous :\n- Pour les constructions à destination de commerce et artisanat de plus de 1000 m² de surface de\nplancher : l’aire doit avoir les caractéristiques minimales suivantes :\n Largeur : 3,50 mètres\n Longueur : 8 mètres\n Hauteur : 3,50 mètres\n Surface : 35 m²\n- Pour les constructions à destination de d’entrepôts de plus de 200 m² de surface de plancher, pour\nles opérations d’industrie de plus de 1 000 m² de surface de plancher, et pour toutes les opérations,\nhors habitation, de plus de 4 000 m² de surface de plancher : l’aire doit les caractéristiques minimales\nsuivantes :\n Largeur : 3,5 mètres\n Longueur : 12 mètres\n Hauteur: 3.50 mètres\n Surface : 70 m²\n- Pour les réhabilitations* et changements de destination (hors habitation), dont la surface totale après\ntravaux est supérieure à 4000 m² de SP, une aire de stationnement doit être prévue avec les\ncaractéristiques définies ci-dessus.\nUBd 12-3.2 : Les aires de dépose / reprise pour autocars :\nUne aire de dépose / reprise pour autocars doit être prévue :\n- pour les hôtels d’une surface de plancher supérieure à 2 000 m²\n- pour les équipements au rayonnement intercommunal.\nLe cas échéant, ces aires peuvent coïncider avec les aires de stationnement pour les livraisons.\nP. 97 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UBd\nARTICLE UBd 13 – OBLIGATIONS IMPOSEES AUX CONSTRUCTEURS EN MATIERE\nDE REALISATION D’ESPACES LIBRES, D’AIRES DE JEUX ET DE LOISIRS ET DE\nPLANTATIONS\nUBd 13- 1 Plantations et aménagements paysagers :\n       Les projets de constructions devront être étudiés dans le sens d’une conservation maximum\n    des plantations existantes.\n       Il sera planté au moins un Arbre à grand développement* pour 100 m² d’espaces libres*. Cette\n    disposition n’est pas applicable aux constructions et installations nécessaires aux services\n    publics ou d’intérêt collectif lorsque les conditions de fonctionnement l’imposent.\n       Des écrans boisés seront aménagés autour des parcs de stationnement du plus de 1 000 m²\n    d’un seul tenant. Lorsque leur surface excédera 2 000 m² d’un seul tenant, ils seront divisés\n    par des rangés d’arbres ou d’écrans paysagers.\n       Les sols artificiels (dalle supérieure des sous-sols enterrés située à l’air libre) destinés à être\n    traités en espaces verts* seront recouverts sur leur totalité d’une couche de terre végétale de\n    0,60 m moyen d’épaisseur, comportant tous les composants techniques nécessaires à la\n    création et au maintien d’un espace vert* de qualité. Une hauteur de terre supérieure pourra\n    être imposée en cas de plantation d’arbres à grand développement en fonction des exigences\n    des espèces plantées.\n     Les aires de dépose reprise pour autocars feront l’objet d’un traitement paysager.\nAfin de ne pas accentuer l’imperméabilisation des sols, on privilégiera chaque fois que possible les\nespaces minéraux sablés, dallés, ou pavés selon les règles de l’art de préférence aux espaces\nbitumés ou enrobés.\nSeront notamment recherchées :\n       La contiguïté avec des espaces libres* de terrains* voisins\n       La création d’espaces libre* d’une géométrie simple, d’un seul tenant, en relation avec le parti\n    retenu pour les constructions à édifier\n       La végétalisation de la marge* de recul, de façon préférentielle en pleine terre\nAfin de conforter et développer la biodiversité, il est recommandé de ne pas dépasser une proportion\nde 40 % d’arbustes horticoles dans la composition des haies.\nLes haies monospécifiques d’arbustes à feuillage persistant sont vivement déconseillées.\nDes essences d’arbustes indigènes sont proposées dans la liste des essences recommandées à la\nplantation en annexe du règlement.\nUBd 13-2 Les marges* de recul imposées dans le plan de zonage au 1/500 ème seront obligatoirement\nplantées saufs lorsqu’elles correspondent à des entrées de parkings souterrains ou des entrées des\nconstructions.\n    - Sous secteurs A et B :\n    Programmes de logements :\n    - 50% des espaces en cœur d’opération seront plantés.\n    - Si une partie des espaces plantés en cœur d’opération se situent sur dalle, la hauteur\n    minimum de terre sur cette dalle sera de 60 cm\n    - La bordure des limites séparatives* ou de l’emprise publique le long de la traversée\n    piétonne paysagère fera l’objet d’un traitement particulier.\n    Programmes d’activités, services et bureaux administratifs :\n    - Si une partie du cœur d’opération est traité en zone de stationnement, elle devra être\n    plantée d’un arbre pour quatre places minimum.\n    - Hors des zones de stationnement de surface, le cœur d’îlot sera planté d’un arbre par\n    100 m² minimum.\n    - La bordure des limites séparatives* ou de l’emprise publique le long de la traversée\n    piétonne paysagère fera l’objet d’un traitement particulier.\n9 décembre 2025    / P. 98 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UBd\n    -   Sous secteur C :\n    -    A l’intérieur des espaces libres* une proportion de 80% sera consacrée à la pleine terre*.\n    -    80% des espaces libres* en cœur d’opération seront plantés, 20% pourront comporter\n    des espaces minéraux.\nUBd 13-3 Les dispositions ci dessus (13-1 et 13-2) ne sont pas imposées aux constructions et\ninstallations nécessaires aux services publics ou d’intérêt collectif.\nUBd 13.4 – Les éléments de paysage non bâtis repérés au titre de l’article L.123-1-5-III-2° du\ncode de l’urbanisme.\nEn application de l’article R.421-23 du Code de l’urbanisme, les travaux ayant pour effet de porter\natteinte ou de supprimer un élément de paysage doivent obligatoirement faire l’objet d’une déclaration\npréalable de travaux.\n    - Les alignements d’arbres protégés et les arbres remarquables :\nL’abattage, l’élagage et toute autre atteinte à l’intégrité de ces arbres (racines etc…) est interdit, sauf :\n- en cas de risque pour la sécurité des personnes et des biens, ou en cas d’une expertise\nphytosanitaire démontrant un mauvais état de l’arbre,\n- pour permettre l’accès au terrain, à condition de démontrer qu’il n’y a pas d’autre possibilité d’accès.\nEn cas d’abattage d’un arbre remarquable, une compensation est exigée par la plantation d’un arbre\nde développement équivalent.\nAucune construction ne peut être implantée à moins de 4 mètres du collet (base du tronc au niveau du\nsol) d’un arbre remarquable.\n    - Les « espaces verts protégés » (EVP)\n- L’abattage et toute autre atteinte à l’intégrité (racines etc…) des arbres situés dans les EVP sont\ninterdits, ainsi que les aménagements de toute nature ( voie , cheminement imperméable)\ncompromettant le caractère paysager et végétale des EVP, et la qualité des plantations existantes.\nNéanmoins, l’abattage d’arbres situés dans les EVP est autorisé en cas de risque pour la sécurité des\npersonnes et des biens, ou en cas d’une expertise phytosanitaire démontrant un mauvais état de\nl’arbre. En cas d’abattage, une compensation est exigée par la replantation d’un arbre de\ndéveloppement équivalent dans le périmètre de l’EVP.\n- Aucune construction n’est autorisée, sauf les locaux à usage de stockage d’outillage d’entretien\nd’espaces verts. Un seul local, d’une emprise au sol maximale de 5 m² est autorisé par terrain.\nARTICLE UBd 14 – COEFFICIENT D'OCCUPATION DU SOL C.O.S.\nArticle supprimé par la loi ALUR du 24 mars 2014.\nARTICLE UBd 15 - OBLIGATIONS IMPOSEES AUX CONSTRUCTIONS, TRAVAUX,\nINSTALLATIONS ET AMENAGEMENTS, EN MATIERE DE PERFORMANCES\nENERGETIQUES ET ENVIRONNEMENTALES\nLes extensions de faible envergure (extension d’un bâtiment existant de surface inférieure à 150m² et\nà 30% de la surface du bâtiment existant) n’entrent pas dans le champ d’application de l’article 15.\nP. 99 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UBd\nUBd 15.1 Rénovation de bâtiments existants\nLes opérations de rénovation devront rechercher à atteindre les objectifs de performance\nénergétique ci-dessous, lorsque les éléments suivants seront remplacés ou installés.\n    Critère d'Analyse    Objectifs\n    Parois    U:    Coefficient    de R : Résistance thermique\n    transmission    thermique [m².K/W]**\n    surfacique    des    parois\n    [W/(m².K)]*\n    Mur    Umur≤ 0,25 quand l’isolation Rmur ≥ 4 quand l’isolation\n    par l’extérieur est possible    par l’extérieur est possible\nIsolation thermique\npermettant de limiter les    Umur≤ 0,4 sinon    Rmur ≥ 2,5 sinon\ntransferts de chaleur entre un    Menuiseries Uw≤ 1,6 pour les fenêtres et\nmilieu chaud et un milieu froid\n    porte-fenêtres\n    ≤ 1,8 pour les portes\n    Toiture    Utoiture≤ 0,25 pour les Rtoiture ≥ 4\n    planchers hauts en béton, en\n    Combles    maçonnerie, et toitures en\n    tôles métalliques    Rcombles ≥ 6\n    Ucombles≤ 0,17\n    Plancher    Uplancher≤ 0,4    Rplancher ≥ 2,5\nS : Facteur solaire du vitrage Conforme à la Règlementation Thermique (RT) en vigueur pour les\nexprime les apports solaires bâtiments neufs\nentrants dans le bâtiment\n    En cas de production de chaleur par chaudière, mise en œuvre de\n    chaudière à condensation, avec, pour les chaudières alimentées par un\n    combustible d’origine fossile, un rendement sur PCI à 100% de charge pour\nChauffage    une température moyenne d’eau de 70°C de plus de 98%.\n    En cas de mise en œuvre de pompe à chaleur, amélioration du coefficient\n    de performance (COP) mode chauffage de 15% par rapport à celui exigé\n    par la RT élément par élément.\n    Les autres climatiseurs et les refroidisseurs de liquide à compression\n    utilisant l’électricité, installés ou remplacés, présente un niveau de\nRefroidissement    rendement énergétique (EER) au sens de la norme NF EN 14511 en mode\n    froid supérieur de 20% à la valeur indiquée dans la RT élément par\n    élément.\n    Les auxiliaires de ventilation installés ou remplacés, y compris pour les\n    bâtiments à usage autre qu’habitation, ont une consommation maximale de\n    0,25 Wh/m3 par ventilateur, qui peut être portée à 0,4 Wh/m3 en présence\nVentilation\n    de filtres F5 à F9.\n    Les équipements de préchauffage d’air neuf sont munis d’un dispositif\n    arrêtant leur fonctionnement en dehors de la période de chauffe.\n    La puissance installée pour l’éclairage général du local est inférieure ou\nEclairage non résidentiel    égale à 2,5 W/m²de surface utile et par tranche de niveaux d’éclairement\n    moyen à maintenir de 100 lux.\n    Les lampes sont à haute efficacité lumineuse (≥ 80 lumens / W)\n9 décembre 2025    / P. 100 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UBd\nUBd 15.2 – Construction de bâtiments neufs\nL’atteinte des objectifs suivants devra être recherchée.\n    Critère d'Analyse    Objectifs\nBbio : Besoin bioclimatique conventionnel en\nénergie d'un bâtiment pour le chauffage, le\nrefroidissement et l'éclairage artificiel. Il traduit Bbio < Bbio max– 10 %\nles efforts architecturaux réalisés pour réduire\nles consommations énergétiques.\nCep : Consommation en énergie primaire pour\nle chauffage, le refroidissement, la production\n    Cep < Cep max – 10 %\nd'eau chaude sanitaire, l'éclairage artificiel des\nlocaux et les auxiliaires de fonctionnement.\n    Q4Pa-surf ≤ 0,5 m3/(h.m²) pour les logements\nQ4Pa-surf : Perméabilité à l'air de l'enveloppe\nsous 4 Pa    Q4Pa-surf ≤ 0,8 m3/(h.m²) pour les autres bâtiments avec\n    l'obligation de réaliser un contrôle de l'a perméabilité à\n    l'air\nARTICLE UBd 16 - OBLIGATIONS IMPOSEES AUX CONSTRUCTIONS, TRAVAUX,\nINSTALLATIONS ET AMENAGEMENTS, EN MATIERE D'INFRASTRUCTURES ET\nRESEAUX DE COMMUNICATIONS ELECTRONIQUES\nIl n’est pas fixé de règle\nP. 101 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UC\n    ZONE UC\nCaractéristiques de la zone\nLa zone UC est une zone urbaine à vocation dominante résidentielle. Il s’agit principalement d’habitat\ncollectif réalisé sous forme d’immeubles implantés de façon dispersée sur des terrains souvent vastes\net agrémentés d’espaces verts et de cheminements pour les piétons et les cyclistes.\nLes dispositions du règlement sont complétées par le document « orientations d’aménagement\net de programmation » pour le secteur « Echangeur A14-A86/ Papèteries ».\n    Dispositions applicables à la zone UC\nARTICLE UC 1 – OCCUPATION ET UTILISATION DU SOL INTERDITES\nSont interdits :\n    Les constructions à destination d’industrie\n    Les dépôts couverts ou non couverts de matériaux divers non liés à l’exploitation d’un service\n    public\n    Les dépôts couverts ou non couverts de flottes de véhicules, non liés à une autre destination\n    autorisée dans la zone UC ou à l’exploitation d’un service public.\n    L’exploitation de carrières.\n    Les affouillements et exhaussements des sols, qui ne sont pas nécessaires :\n       aux occupations ou utilisations du sol autorisées sur la zone,\n       ou à des aménagements paysagers,\n       ou à des aménagements hydrauliques,\n       ou à des travaux d’infrastructures routières, de transports collectifs, de circulation douce ou\n    d’aménagement d’espace public,\n       ou à la réalisation de recherches archéologiques.\nARTICLE UC 2 – OCCUPATIONS ET UTILISATIONS DU SOL SOUMISES A DES\nCONDITIONS PARTICULIERES\nSont soumises à conditions particulières\nUC 2-1 Les constructions à destination d’entrepôt sont autorisées à condition qu’elles soient\nréalisées :\n en accompagnement des constructions et installations nécessaires aux services publics ou\n    d’intérêt collectif (CINASPIC),\n en accompagnement d’une activité commerciale ou artisanale.\nElles ne peuvent pas représenter plus de 20% de la surface de plancher totale de la construction, sauf\npour les entrepôts réalisés en accompagnement des constructions et installations nécessaires aux\nservices publics ou d’intérêt collectif (CINASPIC).\nUC 2-2- Les installations classées (Installations classées pour la Protection de l’Environnement) :\nen application des articles L.511-1 et suivants du code de l’environnement, l’implantation ou\nl’extension* d’ICPE est autorisée sous réserve du respect de la réglementation en vigueur et à\ncondition :\n de faire partie des catégories listées dans le tableau joint en annexe du présent règlement,\n que soient mises en œuvre toutes les dispositions utiles pour les rendre compatibles avec les\n    milieux environnants,\n qu’il n’en résulte pas pour le voisinage une aggravation des dangers et nuisances,\n d’une bonne compatibilité avec les réseaux d’infrastructures et d’assainissement.\n9 décembre 2025    / P. 102 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UC\nLes installations classées pour la protection de l’environnement sont autorisées à la condition d’être\nnécessaires à la réalisation des constructions et installations du réseau de transport public du Grand\nParis.\nARTICLE UC 3 – CONDITIONS DE DESSERTE DES TERRAINS PAR LES VOIES\nPUBLIQUES OU PRIVEES ET D’ACCES AUX VOIES OUVERTES AU PUBLIC.\nPour être constructible, un terrain doit avoir accès à une voie publique ou privée, soit directement, soit\npar l’intermédiaire d’un passage aménagé sur le terrain* ou sur un terrain voisin.\nUC 3-1 Conditions de desserte des terrains par des voies publiques ou privées\nTout terrain* doit être desservi par une voie carrossable publique ou privée en bon état de viabilité et\nprésentant des caractéristiques permettant de satisfaire aux exigences de la sécurité, de la défense\ncontre l’incendie et de la protection civile.\nLa largeur de cette voie ne peut être inférieure à 3,50 mètres, sauf en cas d’extension ou de\ndémolition / reconstruction d’une construction existante et à condition de ne pas créer de logements\nsupplémentaires.\nIl sera exigé une voie d’une largeur supérieure à 3,50 mètres si cela est nécessaire :\n- du fait de l’importance des constructions projetées, et par conséquent des flux de véhicules et de\n    piétons qui emprunteront cette voie.\n- ou si les accès projetés, du fait de leur configuration ou de leur disposition, présentent un risque\n    pour la sécurité des personnes\nDes aménagements complémentaires (trottoirs, éclairages, etc…) pourront être imposés lorsque la\nvoie aura une largeur supérieure à 3,50 mètres.\nLes voies en impasse d’une longueur égale ou supérieure à 50 mètres doivent être aménagées de\ntelle sorte que les véhicules puissent faire demi-tour.\nUC 3-2 Conditions d’accès aux voies ouvertes au public\n-Tout terrain doit disposer d’un accès d’une largeur minimale de 3,50 mètres sur une voie ouverte à la\ncirculation publique, ou bénéficier d’une servitude de passage d’une largeur minimale de 3,50 mètres,\njusqu’à celle-ci.\nLa largeur de cette voie ne peut être inférieure à 3,50 mètres, sauf en cas d’extension ou de\ndémolition / reconstruction d’une construction existante et à condition de ne pas créer de logements\nsupplémentaires.\n-Pour chaque propriété :\n   1 seul accès carrossable est autorisé pour les terrains ayant une longueur de façade (linéaire en\n    contact avec l’emprise publique) égale ou inférieure à 20 mètres ;\n   2 accès maximum pour les terrains ayant une longueur de façade comprise entre 20 mètres et 40\n    mètres ;\n   3 accès maximum pour les terrains ayant une longueur de façade de plus de 40 mètres.\nCette disposition ne s’applique pas aux voies desservant plus de deux logements\n-L’emplacement des nouveaux accès carrossables doit tenir compte :\n    • du risque éventuel pour la circulation et la sécurité des usagers de l’espace public ou des\n    personnes utilisant ces accès. La sécurité des usagers doit être appréciée compte tenu de la\n    position des accès, de leur configuration ainsi que de la nature et de l'intensité du trafic.\n    • des alignements d’arbres sur la voie publique et autres espaces verts, et assurer le maintien de\n    leur bon état phytosanitaire ;\n    • des dispositifs de signalisation, d’éclairage public, de supports de réseaux ou de tout autre\n    élément de mobilier urbain situé sur l’emprise de la voie ;\n    • des accès existants sur les parcelles limitrophes, afin de limiter l’impact sur l’espace public.\nP. 103 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UC\nARTICLE UC 4 – CONDITIONS DE DESSERTE DES TERRAINS PAR LES RESEAUX\nPUBLICS D’EAU, D’ELECTRICITE ET D’ASSAINISSEMENT.\nUC 4-1 Dispositions générales :\nL’emplacement des nouveaux réseaux doit tenir compte des arbres et des alignements d’arbres\nprotégés au titre de l’article L.123-1-5-III-2° du code l’urbanisme afin d’assurer le maintien de leur bon\nétat phytosanitaire.\nUC-4-2 Obligation de raccordement des eaux usées\nComme le prescrit l'article L 1331-1 du Code de la Santé Publique, tous les immeubles qui ont accès\naux égouts disposés pour recevoir les eaux usées domestiques et assimilées domestiques et établis\nsous la voie publique à laquelle ces immeubles ont accès (directement ou par l'intermédiaire de voies\nprivées ou de servitudes de passage), doivent obligatoirement être raccordés à ce réseau dans un\ndélai de deux ans à compter de la date de mise en service du réseau public de collecte.\nTout projet de raccordement ou de rejet au réseau d’assainissement doit faire l'objet d'une demande\nadressée au Service Assainissement3.\nUC-4-3 Gestion des eaux pluviales\nAfin d’alimenter la nappe phréatique d’une part (sous réserve d’installation de dispositifs anti-\npollution), et d’éviter la saturation des réseaux d’autre part, seul l’excès de ruissellement doit être\ncanalisé après qu’aient été mises en œuvre toutes les solutions susceptibles de :\n    -    limiter l’imperméabilisation du terrain,\n    -    limiter la concentration des pollutions,\n    -    favoriser l’évaporation rapide (en privilégiant la végétalisation, le cheminement et le stockage\n    de l’eau à ciel ouvert sur des durées inférieures à 24h),\n    -    -    favoriser l’infiltration des eaux de pluie en fonction des prescriptions par zones établies\n    à la carte figurant à l’annexe 5b– Carte de zonage pluvial.\nDifférentes techniques permettent d’atteindre cet objectif du «zéro rejet» d’eaux pluviales pour les\npluies courantes (jusqu’à la pluie annuelle) : toiture terrasse végétalisée, noue*, bassin sec, bassin en\neau, puisard, tranchée d’infiltration, stockage et réutilisation des eaux pluviales pour l’arrosage ou\npour le lavage des espaces extérieurs...\nEn particulier, ces techniques devront être mises en œuvre sur les aires de stationnement à l’air libre.\nToutefois, lorsque la rétention de toutes les eaux de pluie sur la parcelle n’est pas possible, le\npropriétaire peut solliciter l’autorisation de raccorder ses eaux de ruissellement au réseau à la\ncondition que ses installations soient conformes aux prescriptions techniques définies par le\nrèglement d’assainissement en vigueur.\nL’excédent d’eaux de ruissellement rejoignant le réseau est soumis à des limitations de débit de rejet,\nafin de limiter, à l’aval, les risques d’inondation ou de déversements d’eaux polluées au milieu naturel.\nConformément aux règlements communal et départemental d’assainissement en vigueur :\nLe débit de fuite rejeté dans le réseau collecteur, ne doit pas excéder, pour une pluie de retour\ndécennal, 2 litres /seconde /hectare.\nDans le cas d’un rejet en Seine (directement ou via un réseau d’eau pluvial dont l’exutoire aval est la\nSeine), le débit de fuite rejeté ne doit pas excéder 10 l/s/ha.\nLe propriétaire ou l’aménageur doit justifier le dimensionnement suffisant des installations de rétention\nqu’il envisage d’installer en amont du raccordement, par la production de plans et notes de calcul\nappropriées.\nEn cas de rejet direct au milieu naturel, l’autorisation devra être accordée par l’autorité en charge de la\npolice de l’eau. Dans ce cas des installations de dépollution et/ou de limitation de débit peuvent\négalement être demandées.\n3\n    Service assainissement : assainissement@mairie-nanterre.fr\n9 décembre 2025    / P. 104 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UC\nUC-4-4. Eaux usées non domestiques\nLe raccordement des établissements déversant des eaux usées non domestiques au réseau public\nn'est pas obligatoire, conformément à l'article L 1331-10 du Code de la Santé Publique.\nToutefois, ces établissements peuvent être autorisés à déverser leurs eaux usées non domestiques\ndans le réseau public, dans la mesure où ces déversements correspondent aux conditions fixées par\nle règlement d’assainissement applicable en vigueur.\nTout projet de raccordement ou de rejet au réseau d’assainissement doit faire l'objet d'une demande\nadressée au service assainissement compétent.\nUC- 4-5-Autres réseaux\nLes branchements de tous types ne doivent pas être apparents sur la construction.\nLes locaux commerciaux dont la surface de plancher est égale ou supérieure à 100 m² doivent être\néquipés des gaines techniques intérieures permettant l’installation de tous les types de commerces.\nUC 4-6 Locaux de stockage des conteneurs à déchets\nLes types de constructions, ci-après définies devront comporter des locaux de stockage des déchets\ndimensionnés de manière à recevoir et permettre de manipuler sans difficultés tous les conteneurs\nnécessaires à la collecte des déchets. Chaque local doit être pourvu d’un robinet pour le lavage des\nconteneurs et d’un écoulement.\nPour les constructions à usage d’habitation :\n    Les locaux de stockage des déchets doivent être situés au rez-de-chaussée. Ils doivent\n    permettre un accès direct et permanent aux conteneurs destinés à recevoir la collecte\n    sélective.\n     Pour le rangement des conteneurs, la surface minimale du local sera obtenue selon un ratio\n    de 0,3m² par logement. Cette surface ne pourra pas être inférieure à 2m 2.\n     Un espace destiné au stockage des encombrants doit être prévu, dans un local recevant les\n    conteneurs ou dans un local spécifique. Sa surface minimale sera obtenue par un ratio de\n0,3 m2 par tranche de 100m 2 de surface de plancher construite.\nPour les constructions à destination de commerce\n    Les locaux destinés au stockage des déchets devront être indépendants de ceux prévus pour\n    les habitations.\n    Ils devront avoir une surface minimale de 3 m 2 pour les commerces dont la surface de\n    plancher est inférieure à 50 m 2, 4 m2 pour les commerces dont la surface de plancher est\n    comprise entre 50 m2 et 100 m2, 6 m2 pour les commerces dont la surface de plancher est\n    supérieure à 100 m2. Pour ces derniers, il sera demandé 1m 2 de surface supplémentaire pour\n    le local déchet par tranche de 100 m2 de surface de plancher construite.\nPour les constructions à destination autre que de l’habitation ou de commerce dont la surface de\nplancher est inférieure à 100 m 2, les locaux destinés à l’entreposage des déchets devront avoir une\nsurface minimale de 4m2, puis il sera demandé l’ajout de 0.8m2 de surface supplémentaire par tranche\nde 100 m2 de surface de plancher construite.\nARTICLE UC 5 – SUPERFICIE MINIMALE DES TERRAINS CONSTRUCTIBLES\nArticle supprimé par loi ALUR du 24 mars 2014\nP. 105 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UC\nARTICLE UC 6 – IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX VOIES\nET EMPRISES PUBLIQUES\nChamp d’application\nNe sont pas pris en compte pour l’application de la règle, sous réserve du respect des normes\nrelatives à la circulation routière et à la sécurité :\n •   les éléments de modénature, marquises, auvents, débords de toiture, balcons\n •   en cas de travaux sur des bâtiments existants, les dispositifs techniques nécessaires à l’isolation\n    thermique par l’extérieur de moins de 0,20 m uniquement s’ils sont situés au-dessus du rez-de-\n    chaussée de la construction ; cette épaisseur est fixée à 0,30 m sans contrainte de hauteur pour\n    les constructions édifiées en recul ;\n •   dans le cas de constructions édifiées en recul :\n    o les parties enterrées des constructions;\n    o les rampes d’accès pour les personnes à mobilité réduite\n    o les rampes de garage.\n    o Et les escaliers d’accès et les perrons\nDispositions générales\nUC 6-1 Les constructions peuvent être implantées à l’alignement* ou en respectant un recul minimum\nde 4 m par rapport à l’alignement.\nUC 6-2 Les constructions et installations nécessaires aux services publics ou d’intérêt collectif\n(CINASPIC) peuvent être implantées à l’alignement ou avec un recul minimum de 2 mètres par\nrapport à l’alignement.\nCette disposition est également valable pour les constructions de toutes destinations réalisées au sein\ndu sous-secteur B du périmètre de l’OAP pôle de l’hôtel de ville de Nanterre.\nUC 6-3 Pour les constructions implantées à l’alignement, au-delà d’une hauteur de 9 mètres comptés\ndepuis le niveau du trottoir, un recul partiel ou complet de façade est autorisé. La profondeur de ce\nrecul doit être au minimum d’un mètre.\nDispositions particulières\nUC 6-4 Une implantation différente des dispositions fixées ci-dessus est admise si le projet est\nconcerné par l’un des cas suivants :\n    si la construction s’adosse à une construction mitoyenne, en bon état, sous réserve d’une\n    meilleure intégration du projet dans le paysage urbain.\n       pour adapter la construction à la trame parcellaire ou à la configuration de la parcelle.\n       pour se conformer à l’article UC 11-3.\n       pour les locaux annexes\nUC 6-5 Pour tenir compte des éléments de patrimoines naturels ou bâtis repérés sur le plan de\nzonage au titre de l’article L.123-1-5-III-2° du code de l’urbanisme, une implantation particulière pourra\nêtre imposée si elle est nécessaire à leur préservation.\nUC 6-6 Les dispositions des articles UC 6-1 à UC 6-3 ne s’appliquent pas aux extensions*, sous\nréserve que ces dernières soient réalisées dans le prolongement des murs de la construction\nexistante, et à condition que cette implantation assure une meilleure intégration de la construction\ndans le paysage urbain.\nUC 6-7 Les constructions et installations nécessaires au réseau de transport public du Grand Paris\npeuvent s’implanter à l’alignement ou respecter un recul minimum de 1 mètre.\n9 décembre 2025    / P. 106 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UC\nARTICLE UC 7 – IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX LIMITES\nSEPARATIVES\nChamp d’application :\nNe sont pas pris en compte pour l’application de la règle :\n• les éléments de modénature, marquises, auvents, débords de toiture, balcons\n• en cas de travaux sur des bâtiments existants, les dispositifs techniques nécessaires à l’isolation\n   thermique par l’extérieur de moins de 0,30 mètre d’épaisseur ;\n• les parties enterrées des constructions;\n• les rampes d’accès pour les personnes à mobilité réduite\n• Les perrons et escaliers d’accès.\n• les rampes de garage.\nDispositions générales\nUC 7-1 Les constructions peuvent être implantées en limites séparatives* latérales ou en retrait de\nces limites. Elles doivent être implantées en retrait des limites séparatives de fond, cette disposition\nde retrait des limites de fond ne s’impose pas au sein du périmètre de l’OAP Hôpital de Nanterre.\nUC 7-2 Si la limite séparative* correspond à une limite avec un terrain situé dans une autre zone du\nPLU, les constructions doivent être implantées en retrait, sauf :\n   -    si les constructions sont implantées au sein du périmètre de l’OAP Hôpital de Nanterre,\n   -    si elles s’adossent à une construction existante voisine en bon état. La construction nouvelle\n    ne devra pas avoir des dimensions supérieures à celles de la construction voisine sur laquelle\n    elle s’adosse (hauteur et profondeur) sur une longueur minimale de 5 mètres.\nUC 7-3 En cas d’implantation en retrait par rapport aux limites séparatives, les constructions\ndoivent respecter une distance minimale mesurée en tout point perpendiculairement par rapport à la\nlimite séparative :\n       de 8 m, en cas de façade avec baie(s) *,\n       de 3 m en cas de façade sans baie\nUC 7-4 Pour l’application de l’ensemble de l’article 7, les façades des constructions implantées en\nlimites séparatives doivent obligatoirement être aveugles. Elles ne doivent comporter ni baie, ni pavé\nde verre, ni jour de souffrance, ni châssis, fixe ou non, translucide ou non.\nDispositions particulières\nUC 7-5 Les dispositions figurant à l’article UC 7-3 ne s’appliquent pas aux extensions* sous réserve\nque ces dernières soient réalisées dans le prolongement des murs de la construction existante, et\nsans réduire le retrait existant entre la construction et la limite séparative, non conforme aux\ndispositions à l’article 7-3.\nToutefois, aucune baie nouvelle ou agrandissement de baie existante ne peut être réalisé sans\nrespecter le calcul des retraits prévus ci-dessus.\nUC 7-6 Une implantation différente des dispositions fixées ci-dessus est admise si le projet est\nconcerné par l’un des cas suivants :\n    si la construction s’adosse à une construction principale mitoyenne, en bon état et de\n    dimensions égales ou supérieures sous réserve d’une meilleure intégration du projet dans le\n    paysage urbain ;\n       pour adapter la construction à la trame parcellaire ou à la configuration de la parcelle.\nUC 7-7 Lorsque la limite séparative* correspond avec la limite d’une voie privée, les dispositions\nfigurant à l’article UC 6 s’appliquent.\nP. 107 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UC\nUC 7-8 Pour tenir compte des éléments de patrimoines naturels ou bâtis repérés sur le plan de\nzonage au titre de l’article L.123-1-5-III-2° du code de l’urbanisme, une implantation particulière pourra\nêtre imposée si elle est nécessaire à leur préservation.\nUC 7-9 Les constructions et installations nécessaires au réseau de transport public du Grand Paris\npeuvent s’implanter en limites séparatives ou respecter un retrait minimum de 1 mètre.\nARTICLE UC 8 – IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT\nAUX AUTRES SUR UNE MEME PROPRIETE\nChamp d’application :\nDes constructions reliées uniquement en sous-sol ou par des éléments d’architecture ou passerelle\nouverte ou close, arche ou arcade… constituent des constructions distinctes et relèvent du présent\narticle.\nNe sont pas pris en compte pour le calcul des distances dans l’application de la règle :\n• les éléments de modénature, marquises, auvents, débords de toiture, balcons\n• en cas de travaux sur des bâtiments existants, les dispositifs techniques nécessaires à l’isolation\n    thermique par l’extérieur de moins de 0,30 mètre d’épaisseur ;\n• les parties enterrées des constructions;\n• les rampes d’accès pour les personnes à mobilité réduite ;\n• les perrons et escaliers d’accès.\n• les rampes de garage.\nDispositions générales\nUC 8-1\nUC 8-1-1 Lorsque deux constructions réalisées sur une même propriété ne sont pas contiguës, la\ndistance mesurée perpendiculairement, séparant les façades* en tous points doit être au moins égale:\n    si les 2 façades* ou la façade* la plus basse comportent une ou plusieurs baies*, aux deux tiers\n    de la hauteur de la façade la plus haute, avec un minimum de 8 mètres ;\n    si seule la façade* la plus haute comporte une ou plusieurs baies*, à la moitié de la hauteur de la\n    façade* la plus haute, avec un minimum de 8 mètres ;\n    si aucune des façades* ne comporte de baie*, à la moitié de la hauteur de la façade* la plus\n    haute, avec un minimum de 6 mètres.\nUC 8-1-2\nAu sein de l’OAP Hôpital de Nanterre :\n    les dispositions du 8-1-1 s’appliquent uniquement pour permettre la création des porosités\n    visuelles telles qu’elles figurent sur le schéma de l’OAP ;\n    les dispositions du 8-1-1 ne s’appliquent pas pour les constructions réalisées à l’intérieur des\n    principes de « plots » mentionnées sur le schéma de l’OAP et/ou adossées à des constructions\n    existantes. Dans ce cas, il n’est pas fixé de règle ;\nAu sein de l’OAP pôle de l’hôtel de ville : la disposition du 8-1-1 ne s’applique pas au sein du sous-\nsecteur B.\nDispositions particulières\nUC 8-2 Dans le cas où la hauteur* des constructions annexes et/ou les ouvrages techniques, ne\ndépasse pas 3 mètres, il n’est pas fixé de distance minimale entre :\n       la construction principale et les constructions annexes ou les ouvrages techniques\n       les constructions annexes et les ouvrages techniques.\n9 décembre 2025    / P. 108 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UC\nUC 8-3 Il n’est pas fixé de règle pour les constructions et installations nécessaires aux services\npublics ou d’intérêt collectif.\nARTICLE UC 9 – EMPRISE AU SOL* DES CONSTRUCTIONS\nIl n’est pas fixé de règle.\nARTICLE UC 10 – HAUTEUR MAXIMALE DES CONSTRUCTIONS\nChamp d’application\nNe sont pas comptés dans la hauteur* maximale autorisée :\n   - les dispositifs techniques liés à la production d’énergies renouvelables dès lors qu’ils ne\n    dépassent pas une hauteur de 1,50 mètres et respectent les dispositions de l’article UC 11-1\n   - les édicules techniques de 3 mètres de hauteur maximum, à condition qu’ils soient intégrés\n    dans un volume fermé ou masqués par un dispositif à claires voies et qu’ils soient implantés\n    ou en retrait des façades d’une distance au moins égale à leur hauteur ou accolés à un mur\n    pignon\n   - les cheminées des chaufferies collectives mutualisées à un ensemble de constructions\n   - les pylônes supports de lignes électriques ou d’antennes.\nDispositions Générales\nLes constructions doivent respecter la hauteur* par rapport à l’alignement* opposé et la\nhauteur maximale autorisée. Toutefois, au sein du périmètre de l’OAP Hôpital de Nanterre, et des\nsous-secteurs A et B au sein du périmètre de l’OAP pôle de l’hôtel de ville, seule la hauteur maximale\nautorisée est à respecter.\nHauteur par rapport à l’alignement opposé :\nUC 10-1 La hauteur* maximale des constructions est limitée à la plus courte distance comptée\nhorizontalement les séparant de l’alignement* opposé existant ou projeté (emplacement réservé ou\nplan d’alignement figurant sur le plan de zonage) plus 2 mètres.\nCette disposition ne concerne pas les constructions réalisées au sein du périmètre de l’OAP Hôpital\nde Nanterre.\nHauteur* maximale autorisée :\nUC 10-2 Les règles de hauteur maximale autorisée s’appliquent en fonction de 4 types de zones\nrepérées sur les documents graphiques pages suivantes.\nDans le secteur 1:\n- En cas de toitures terrasses : 28 mètres à l’acrotère*\n- En cas de toitures à pentes : 26 mètres à l’égout du toit et 28 mètres au faîtage*\nDans le secteur 2:\n- En cas de toitures terrasses : 21 mètres à l’acrotère*\n- En cas de toitures à pentes : 21 mètres à l’égout du toit et 24 mètres au faîtage*.\nToutefois, le long de l’avenue Georges Clemenceau, les constructions à destination de bureaux\npeuvent avoir une hauteur* maximale de façade* de 24 m à l’acrotère et de 26 m au faîtage*.\nDans le secteur 3 : 9 mètres à l’égout du toit et 12 mètres au faîtage*.\nDans le secteur 4 : En cas de toitures terrasses : 52 mètres à l’acrotère\nP. 109 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UC\n9 décembre 2025    / P. 110 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UC\nP. 111 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UC\nDispositions particulières\nUC 10-3 Pour les constructions implantées à l’angle de plusieurs voies, seule la hauteur maximale\nautorisée s’applique sur les 20 premiers mètres de la construction, comptés à partir de l’angle de la\nconstruction. La longueur de 20 mètres est réduite à 16 mètres le long d’une voie d’une largeur\ninférieure à 10 mètres.\nARTICLE UC 11 – ASPECT EXTERIEUR DES CONSTRUCTIONS ET AMENAGEMENT\nDE LEURS ABORDS AINSI QUE LES PRESCRIPTIONS DE NATURE A ASSURER LA\nPROTECTION DES ELEMENTS DE PAYSAGE, DES QUARTIERS, ILOTS, IMMEUBLES,\nESPACES PUBLICS, MONUMENTS, SITES ET SECTEURS A PROTEGER\nA titre d’information, un Cahier des Recommandations Architecturales, Urbaines et\nPaysagères, donnant des recommandations sur l’aspect extérieur des constructions et de leurs\nabords, et qui n’est pas opposable aux demandes d’autorisations d’urbanisme, est consultable en\nmairie et sur le site internet de la mairie.\nUC 11-1 Aspect extérieur des constructions :\nPar leur volume, leur architecture, les matériaux employés, et leur couleur, les constructions et leurs\néventuels dispositifs liés aux énergies renouvelables doivent s’intégrer de manière harmonieuse dans\nle paysage naturel ou urbain dans lequel elles seront situées, et ne pas porter atteinte au caractère ou\nà l’intérêt des lieux avoisinants ainsi qu’à la conservation des perspectives monumentales.\nLes saillies*, dont les balcons, doivent avoir un rapport équilibré avec la façade*.\nLes balcons en surplomb de l’espace public doivent être situés au-dessus de 6 mètres de hauteur\ncomptés depuis le niveau de l’espace public et ne peuvent dépasser 1 mètre de profondeur en débord\nde l’alignement.\nLes gardes corps des balcons devront être partiellement transparents.\nLes dispositifs de production d’énergies renouvelables peuvent être visibles de l’espace public à\ncondition d’être conçus comme un élément à part entière de la composition architecturale du bâtiment,\net notamment de la composition de ses façades.\nLa pose éventuelle de capteurs solaires doit être étudiée, notamment au
