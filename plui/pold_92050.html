ctions et installations\nnécessaires aux services publics ou d’intérêt collectif (CINASPIC).\nUL 2-2 Les constructions à destination de commerce doivent répondre aux besoins sur site des\nusagers des équipements d’intérêt collectif (buvette, restauration, …). Leur surface de plancher ne\npeut dépasser 150 m², à l’exception du secteur ULa où elle ne peut dépasser 80 m² ;\nUL 2-3 Les constructions à destination de bureaux et d’artisanat doivent être nécessaires au\nfonctionnement des constructions et installations nécessaires aux services publics ou d’intérêt collectif\n(CINASPIC). Leur surface de plancher ne peut être supérieure à 100 m² en secteur ULa.\nUL 2-4 en secteur ULb,\n - les constructions et installations liées à la vocation de promenade des berges ou de loisirs,\n - les installations nécessaires au l’usage du fleuve et au fonctionnement d’activités portuaires\nUL 2-5- Les installations classées (Installations classées pour la Protection de l’Environnement) : en\napplication des articles L.511-1 et suivants du code de l’environnement, l’implantation ou l’extension*\nd’ICPE est autorisée sous réserve du respect de la réglementation en vigueur et à condition :\n de faire partie des catégories listées dans le tableau joint en annexe du présent règlement,\n que soient mises en œuvre toutes les dispositions utiles pour les rendre compatibles avec les\n    milieux environnants,\n qu’il n’en résulte pas pour le voisinage une aggravation des dangers et nuisances,\n d’une bonne compatibilité avec les réseaux d’infrastructures et d’assainissement.\nLes installations classées pour la protection de l’environnement sont autorisées à la condition d’être\nnécessaires à la réalisation des constructions et installations du réseau de transport public du Grand\nParis.\nARTICLE UL 3 – CONDITIONS DE DESSERTE DES TERRAINS PAR LES VOIES\nPUBLIQUES OU PRIVEES ET D’ACCES AUX VOIES OUVERTES AU PUBLIC.\nPour être constructible, un terrain doit avoir accès à une voie publique ou privée, soit directement, soit\npar l’intermédiaire d’un passage aménagé sur la parcelle ou sur un fonds voisin.\nUL 3-1 Conditions de desserte des terrains par des voies publiques ou privées\nTout terrain* doit être desservi par une voie carrossable publique ou privée en bon état de viabilité et\nprésentant des caractéristiques permettant de satisfaire aux exigences de la sécurité, de la défense\ncontre l’incendie et de la protection civile.\nLa largeur de cette voie ne peut être inférieure à 3,50 mètres, sauf en cas d’extension ou de\ndémolition / reconstruction d’une construction existante et à condition de ne pas créer de logements\nsupplémentaires.\nIl sera exigé une voie d’une largeur supérieure à 3,50 mètres si cela est nécessaire :\n- du fait de l’importance des constructions projetées, et par conséquent des flux de véhicules et de\n    piétons qui emprunteront cette voie.\n- ou si les accès projetés, du fait de leur configuration ou de leur disposition, présentent un risque\n    pour la sécurité des personnes\nDes aménagements complémentaires (trottoirs, éclairages, etc…) pourront être imposés lorsque la\nvoie aura une largeur supérieure à 3,50 mètres.\nLes voies en impasse d’une longueur égale ou supérieure à 50 mètres doivent être aménagées de\ntelle sorte que les véhicules puissent faire demi-tour.\n9 décembre 2025    / P. 242 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\nUL 3-2 Conditions d’accès aux voies ouvertes au public\nTout terrain doit disposer d’un accès d’une largeur minimale de 3,50 mètres sur une voie ouverte à la\ncirculation publique, ou bénéficier d’une servitude de passage d’une largeur minimale de 3,50 mètres,\njusqu’à celle-ci.\nLa largeur de cette voie ne peut être inférieure à 3,50 mètres, sauf en cas d’extension ou de\ndémolition / reconstruction d’une construction existante et à condition de ne pas créer de logements\nsupplémentaires.\nPour chaque propriété :\n 1 seul accès carrossable est autorisé pour les terrains ayant une longueur de façade (linéaire en\n    contact avec l’emprise publique) égale ou inférieure à 30 mètres ;\n 2 accès maximum pour les terrains ayant une longueur de façade comprise entre 20 mètres et 40\n    mètres ;\n au-delà de 40 mètres de façade, il est autorisé 1 nouvel accès tous les 15m de façade sans\n    dépasser un total de 3 accès carrossables par terrain ;\nSur les avenues Lénine, Joffre, Clemenceau, République, Commune de Paris, Joliot Curie, Benoît\nFrachon, un seul accès carrossable est autorisé par tranche complète de 30 mètres de façade*, sans\ndépasser 2 accès par terrain.\nL’emplacement des nouveaux accès carrossables doit tenir compte :\n   • du risque éventuel pour la circulation et la sécurité des usagers de l’espace public ou des\n    personnes utilisant ces accès. La sécurité des usagers doit être appréciée compte tenu de la\n    position des accès, de leur configuration ainsi que de la nature et de l'intensité du trafic.\n   • des alignements d’arbres sur la voie publique et autres espaces verts, et assurer le maintien de\n    leur bon état phytosanitaire ;\n   • des dispositifs de signalisation, d’éclairage public, de supports de réseaux ou de tout autre\n    élément de mobilier urbain situé sur l’emprise de la voie ;\n   • des accès existants sur les parcelles limitrophes, afin de limiter l’impact sur l’espace public.\nARTICLE UL 4 – CONDITIONS DE DESSERTE DES TERRAINS PAR LES RESEAUX\nPUBLICS D’EAU, D’ELECTRICITE ET D’ASSAINISSEMENT.\nUL 4-1 Dispositions générales :\nL’emplacement des nouveaux réseaux doit tenir compte des arbres et des alignements d’arbres\nprotégés au titre de l’article L.123-1-5-III-2° du code l’urbanisme afin d’assurer le maintien de leur bon\nétat phytosanitaire.\nUL 4-2 Obligation de raccordement des eaux usées\nComme le prescrit l'article L 1331-1 du Code de la Santé Publique, tous les immeubles qui ont accès\naux égouts disposés pour recevoir les eaux usées domestiques et assimilées domestiques et établis\nsous la voie publique à laquelle ces immeubles ont accès (directement ou par l'intermédiaire de voies\nprivées ou de servitudes de passage), doivent obligatoirement être raccordés à ce réseau dans un\ndélai de deux ans à compter de la date de mise en service du réseau public de collecte.\nTout projet de raccordement ou de rejet au réseau d’assainissement doit faire l'objet d'une demande\nadressée au Service Assainissement8.\nUL 4-3 La gestion des eaux pluviales\nAfin d’alimenter la nappe phréatique d’une part (sous réserve d’installation de dispositifs anti-\npollution), et d’éviter la saturation des réseaux d’autre part, seul l’excès de ruissellement doit être\ncanalisé après qu’aient été mises en œuvre toutes les solutions susceptibles de :\n    -    limiter l’imperméabilisation du terrain,\n    -    limiter la concentration des pollutions,\n8\n    Service assainissement : assainissement@mairie-nanterre.fr\nP. 243 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\n    -   favoriser l’évaporation rapide (en privilégiant la végétalisation, le cheminement et le stockage\n    de l’eau à ciel ouvert sur des durées inférieures à 24h),\n    -   favoriser l’infiltration des eaux de pluie en fonction des prescriptions par zones établies à la\n    carte figurant à l’annexe 5b– Carte de zonage pluvial.\nDifférentes techniques permettent d’atteindre cet objectif du «zéro rejet» d’eaux pluviales pour les\npluies courantes (jusqu’à la pluie annuelle) : toiture terrasse végétalisée, noue*, bassin sec, bassin en\neau, puisard, tranchée d’infiltration, stockage et réutilisation des eaux pluviales pour l’arrosage ou\npour le lavage des espaces extérieurs...\nEn particulier, ces techniques devront être mises en œuvre sur les aires de stationnement à aire libre.\nToutefois, lorsque la rétention de toutes les eaux de pluie sur la parcelle n’est pas possible, le\npropriétaire peut solliciter l’autorisation de raccorder ses eaux de ruissellement au réseau à la\ncondition que ses installations soient conformes aux prescriptions techniques définies par le règlement\nd’assainissement en vigueur.\nL’excédent d’eaux de ruissellement rejoignant le réseau est soumis à des limitations de débit de rejet,\nafin de limiter, à l’aval, les risques d’inondation ou de déversements d’eaux polluées au milieu naturel.\nConformément au règlement, communal et départemental, d’assainissement en vigueur :\nLe débit de fuite rejeté dans le réseau collecteur, ne doit pas excéder, pour une pluie de retour\ndécennal, 2 litres /seconde /hectare.\nDans le cas d’un rejet en Seine (directement ou via un réseau d’eau pluvial dont l’exutoire aval est la\nSeine), le débit de fuite rejeté ne doit pas excéder 10 l/s/ha.\nLe propriétaire ou l’aménageur doit justifier le dimensionnement suffisant des installations de rétention\nqu’il envisage d’installer en amont du raccordement, par la production de plans et notes de calcul\nappropriées.\nEn cas de rejet direct au milieu naturel, l’autorisation devra être accordée par l’autorité en charge de la\npolice de l’eau. Dans ce cas des installations de dépollution et/ou de limitation de débit peuvent\négalement être demandées.\nUL 4-4. Les eaux usées non domestiques\nLe raccordement des établissements déversant des eaux usées non domestiques au réseau public\nn'est pas obligatoire, conformément à l'article L 1331-10 du Code de la Santé Publique.\nToutefois, ces établissements peuvent être autorisés à déverser leurs eaux usées non domestiques\ndans le réseau public, dans la mesure où ces déversements correspondent aux conditions fixées par\nle règlement d’assainissement applicable en vigueur.\nTout projet de raccordement ou de rejet au réseau d’assainissement doit faire l'objet d'une demande\nadressée au service assainissement compétent.\nUL 4-5-Autres réseaux\nLes branchements de tous types ne doivent pas être apparents sur la construction.\nLes locaux commerciaux dont la surface de plancher est égale ou supérieure à 100 m² doivent être\néquipés des gaines techniques intérieures permettant l’installation de tous les types de commerces.\nUL 4-6 Locaux de stockage des conteneurs à déchets\nLes types de constructions, ci-après définies devront comporter des locaux de stockage des déchets\ndimensionnés de manière à recevoir et permettre de manipuler sans difficultés tous les conteneurs\nnécessaires à la collecte des déchets. Chaque local doit être pourvu d’un robinet pour le lavage des\nconteneurs et d’un écoulement.\nPour les constructions à usage d’habitation :\n    Les locaux de stockage des déchets doivent être situés au rez-de-chaussée. Ils doivent\n    permettre un accès direct et permanent aux conteneurs destinés à recevoir la collecte\n    sélective.\n9 décembre 2025    / P. 244 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\n     Pour le rangement des conteneurs, la surface minimale du local sera obtenue selon un ratio\n    de 0,3m² par logement. Cette surface ne pourra pas être inférieure à 2m 2.\n     Un espace destiné au stockage des encombrants doit être prévu, dans un local recevant les\n    conteneurs ou dans un local spécifique. Sa surface minimale sera obtenue par un ratio de\n    0,3 m2 par tranche de 100m 2 de surface de plancher construite.\nPour les constructions à destination de commerce\n    Les locaux destinés au stockage des déchets devront être indépendants de ceux prévus pour\n    les habitations.\n    Ils devront avoir une surface minimale de 3 m 2 pour les commerces dont la surface de\n    plancher est inférieure à 50 m 2, 4 m2 pour les commerces dont la surface de plancher est\n    comprise entre 50 m2 et 100 m2, 6 m2 pour les commerces dont la surface de plancher est\n    supérieure à 100 m2. Pour ces derniers, il sera demandé 1m 2 de surface supplémentaire pour\n    le local déchet par tranche de 100 m 2 de surface de plancher construite.\nPour les constructions à destination autre que de l’habitation ou de commerce dont la surface de\nplancher est inférieure à 100 m 2, les locaux destinés à l’entreposage des déchets devront avoir une\nsurface minimale de 4m2, puis il sera demandé l’ajout de 0,8m2 de surface supplémentaire par tranche\nde 100 m2 de surface de plancher construite.\nARTICLE UL 5 – SUPERFICIE MINIMALE DES TERRAINS CONSTRUCTIBLES\nArticle supprimé par loi ALUR du 24 mars 2014.\nARTICLE UL 6 – IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX VOIES\nET EMPRISES PUBLIQUES\nChamp d’application\nNe sont pas pris en compte pour l’application de la règle, sous réserve de leur respect des normes\nrelatives à la circulation routière et à la sécurité :\n •   les éléments de modénature, marquises, auvents, débords de toiture\n •   les balcons à partir de 6 mètres comptés depuis le niveau de l’espace public et ne dépassant pas\n    1 mètre de profondeur. La profondeur de 1 mètre pourra être réduite pour tenir compte de la\n    largeur de la voie.\n •   en cas de travaux sur des bâtiments existant les dispositifs techniques nécessaires à l’isolation\n    thermique par l’extérieur de moins de 0,20 mètre uniquement s’ils sont situés au-dessus du rez-\n    de-chaussée de la construction ; cette épaisseur est fixée à 0,30 mètre sans contrainte de\n    hauteur pour les constructions édifiées en recul ;\n •   dans le cas de constructions édifiées en recul :\n    o les parties enterrées des constructions;\n    o les rampes d’accès pour les personnes à mobilité réduite\n    o les rampes de garage.\n    o Et les escaliers d’accès et les perrons\nDispositions générales\nUL 6-1 Sauf indication graphique sur le plan de zonage, les constructions peuvent être implantées à\nl’alignement* ou en respectant un recul* minimum de 2 mètres. En secteur ULb, le recul minimum est\nfixé à 1 m.\nLes constructions et installations nécessaires au réseau de transport du Grand Paris peuvent\ns’implanter à l’alignement ou avec un recul minimum de 1 mètre.\nP. 245 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\nDispositions particulières\nUL 6-2 Une implantation différente des dispositions fixées ci-dessus est admise si le projet est\nconcerné par l’un des cas suivants :\n       pour adapter la construction à la trame parcellaire ou à la configuration de la parcelle.\n       pour se conformer à l’article UL 11-3.\nUL 6-3 Pour tenir compte des éléments de patrimoines naturels ou bâtis repérés sur le plan de\nzonage au titre de l’article L.123-1-5-III-2° du code de l’urbanisme, une implantation particulière pourra\nêtre imposée si elle est nécessaire à leur préservation.\nUL 6-4 Les dispositions de l’article UL 6-1 ne s’appliquent pas aux extensions*, sous réserve que ces\ndernières soient réalisées dans le prolongement des murs de la construction existante, et à condition\nque cette implantation assure une meilleure intégration de la construction dans le paysage urbain\nqu’une implantation à l’alignement. L’extension ne peut pas avoir un recul par rapport à l’alignement\nsupérieur à celui de la construction existante.\nARTICLE UL 7 – IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX LIMITES\nSEPARATIVES\nChamp d’application :\nNe sont pas pris en compte pour l’application de la règle :\n• les éléments de modénature, marquises, auvents, débords de toiture ;\n• en cas de travaux sur des bâtiments existants, les dispositifs techniques nécessaires à l’isolation\n   thermique par l’extérieur de moins de 0,30 mètre d’épaisseur ;\n• les parties enterrées des constructions;\n• les rampes d’accès pour les personnes à mobilité réduite ;\n• les perrons et escaliers d’accès ;\n• les rampes de garage\nDispositions générales\nUL 7-1 Les constructions peuvent être implantées sur les limites séparatives* ou en retrait de ces\nlimites*.\nUL 7-2 En cas d’implantation en retrait par rapport aux limites séparatives, les constructions doivent\nrespecter une distance, mesurée perpendiculairement par rapport à la limite séparative, au moins\négale à la moitié de leur hauteur de la construction, et sans être inférieure à :\n       6 mètres, en cas de façade avec baie(s) *,\n       4 mètres en cas de façade sans baie\nUL 7-3 Si la limite séparative* correspond à une limite avec un terrain situé en zone UD, les\nconstructions doivent être implantées en retrait, sauf si elles s’adossent à une construction existante\nvoisine en bon état. La construction nouvelle ne devra pas avoir des dimensions supérieures à la\nfaçade de la construction voisine sur laquelle elle s’adosse (hauteur et longueur).\nUL 7-4 Pour l’application de l’ensemble de l’article 7, les façades des constructions implantées en\nlimites séparatives doivent obligatoirement être aveugles. Elles ne doivent comporter ni baie, ni pavé\nde verre, ni jour de souffrance, ni châssis, fixe ou non, translucide ou non.\n9 décembre 2025    / P. 246 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\nDispositions particulières\nUL 7-5 Les dispositions figurant à l’article UL 7-2 ne s’appliquent pas aux extensions* sous réserve\nque ces dernières soient réalisées dans le prolongement des murs de la construction existante, et\nsans réduire le retrait existant, entre la construction et la limite séparative, non conforme aux\ndispositions des articles UL 7-1 à UL 7-4.\nToutefois, aucune baie* ne pourra être réalisée sur les façades des extensions ayant bénéficié de la\nprésente dérogation.\nUL 7-6 Une implantation différente des dispositions fixées ci-dessus est admise pour adapter la\nconstruction à la trame parcellaire ou à la configuration de la parcelle.\nUL 7-7 Les constructions et installations nécessaires au réseau de transport du Grand Paris peuvent\ns’implanter à l’alignement ou avec un recul minimum de 1 mètre.\nUL 7-8 Lorsque la limite séparative* correspond avec la limite d’une voie privée, les dispositions\nfigurant à l’article UL 6 s’appliquent.\nUL 7-9 Pour tenir compte des éléments de patrimoines naturels ou bâtis repérés sur le plan de\nzonage au titre de l’article L.123-1-5-III-2° du code de l’urbanisme, une implantation particulière pourra\nêtre imposée si elle est nécessaire à leur préservation.\nARTICLE UL 8 – IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT\nAUX AUTRES SUR UNE MEME PROPRIETE\nIl n’est pas fixé de règle.\nARTICLE UL 9 – EMPRISE AU SOL* DES CONSTRUCTIONS\nIl n’est pas fixé de règle, sauf en secteur ULb où l’emprise maximale est limitée à 100 m² par unité\nfoncière.\nARTICLE UL 10 – HAUTEUR MAXIMALE DES CONSTRUCTIONS\nChamp d’application\nNe sont pas comptés dans la hauteur* maximale autorisée :\n   - les dispositifs techniques liés à la production d’énergies renouvelables dès lors qu’ils ne\n    dépassent pas une hauteur de 1,50 mètres et respectent les dispositions de l’article UL 11-1\n   - les édicules techniques de 3 mètres de hauteur maximum, à condition qu’ils soient intégrés\n    dans un volume fermé ou masqués par un dispositif à claires voies et qu’ils soient implantés\n    ou en retrait des façades d’une distance au moins égale à leur hauteur ou accolés à un mur\n    pignon\n   - les cheminées des chaufferies collectives mutualisées à un ensemble de constructions\n   - les pylônes supports de lignes électriques ou d’antennes.\nLes règles ci-dessous ne s’appliquent pas lorsqu’il existe des indications particulières au plan\ngraphique. Dans ce cas, celles-ci devront être respectées\nP. 247 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\nDispositions Générales\nDispositions applicables à la zone UL hormis les secteurs ULa et ULb :\n UL 10-1 La hauteur* des constructions ne pourra dépasser 20 mètres à l’égout et à l’acrotère, à\nl’exception des constructions et installations nécessaires aux services publics ou d’intérêt collectif\n(CINASPIC), dont la hauteur ne pourra pas dépasser 27 mètres à l’égout et à l’acrotère.\nUL 10-2 Dans le secteur 1 repéré sur la carte ci-dessous (l’ilot « Préfecture – Conseil Général –\nTribunal de Grande Instance »), la hauteur maximale des constructions est fixée à 55 mètres à\nl’acrotère et à l’égout (cf. schéma ci-dessous\nDispositions applicables dans le secteur ULa :\nUL 10-3 : la hauteur* maximale des constructions est fixée à 9 mètres à l’égout et à l’acrotère, à\nl’exception du secteur correspondant aux emprises des terrasses de la ZAC Seine-Arche où la\nhauteur maximale des constructions est fixée à 4 mètres à l’égout et à l’acrotère.\nDispositions applicables dans le secteur ULb :\nUL 10-4 : la hauteur* maximale des constructions est fixée à 3 mètres au point le plus haut pour les\nconstructions et installations liées à la vocation de promenade des berges ou de loisirs.\n9 décembre 2025    / P. 248 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\nDispositions particulières\nUL 10-5 Hors des secteurs ULa et ULb, la hauteur maximale autorisée est réduite de 5 mètres à\nl’égout et à l’acrotère pour les constructions ou parties de constructions situées à moins de 8 mètres\nd’une limite séparative latérale ou de fond d’un terrain inscrit en zone UD.\nARTICLE UL 11 – ASPECT EXTERIEUR DES CONSTRUCTIONS ET AMENAGEMENT\nDE LEURS ABORDS AINSI QUE LES PRESCRIPTIONS DE NATURE A ASSURER LA\nPROTECTION DES ELEMENTS DE PAYSAGE, DES QUARTIERS, ILOTS, IMMEUBLES,\nESPACES PUBLICS, MONUMENTS, SITES ET SECTEURS A PROTEGER\nA titre d’information, un Cahier des Recommandations Architecturales, Urbaines et\nPaysagères, donnant des recommandations sur l’aspect extérieur des constructions et de leurs\nabords, et qui n’est pas opposable aux demandes d’autorisations d’urbanisme, est consultable en\nmairie et sur le site internet de la mairie.\nUL 11-1 Aspect extérieur des constructions :\nPar leur volume, leur architecture, les matériaux employés, et leur couleur, les constructions et leurs\néventuels dispositifs liés aux énergies renouvelables doivent s’intégrer de manière harmonieuse dans\nle paysage naturel ou urbain dans lequel elles seront situées, et ne pas porter atteinte au caractère ou\nà l’intérêt des lieux avoisinants ainsi qu’à la conservation des perspectives monumentales.\nDans le secteur ULa des terrasses de la ZAC Seine-Arche, les constructions doivent, par leur\narchitecture et les matériaux employés, assurer des transparences visuelles, afin de conserver la\nperspective des Terrasses.\nDans le secteur ULb, la longueur du linéaire bâti d’un seul tenant est limitée à 15 mètres.\nLes saillies*, dont les balcons, doivent avoir un rapport équilibré avec la façade*.\nLes balcons en surplomb de l’espace public doivent être situés au-dessus de 6 mètres de hauteur\ncomptés depuis le niveau de l’espace public et ne peuvent dépasser 1 mètre de profondeur en débord\nde l’alignement.\nLes gardes corps des balcons devront être partiellement transparents.\nLes dispositifs de production d’énergies renouvelables peuvent être visibles de l’espace public à\ncondition d’être conçus comme un élément à part entière de la composition architecturale du bâtiment,\net notamment de la composition de ses façades.\nLa pose éventuelle de capteurs solaires doit être étudiée, notamment au regard de la composition de\nla façade*, et afin de favoriser leur intégration dans le plan de toiture.\nLes antennes, y compris les paraboles, doivent être installées de façon à réduire leur impact visuel,\nnotamment lorsqu’elles sont visibles depuis les voies ou les espaces publics.\nUL 11-2 Toitures\nLe volume de la toiture doit être proportionné au volume de la construction.\nLes toitures terrasse* sont admises si elles sont justifiées par le parti architectural. En dehors des\nédicules techniques et des relevés d’étanchéité, elles devront être traitées à 90% minimum de façon\nsuivante :\n    - Végétalisées\n    - Et/ou support de dispositifs d’énergie renouvelable\n    - Et/ou destinées à l’usage des occupants des bâtiments\nL’acrotère doit être accompagné d’une couvertine, d’une corniche simple ou de tout autre système afin\nde protéger le mur de façade des effets de ruissellement.\nLe garde-corps de sécurité devra être le plus discret possible : par relèvement de l’acrotère ou avec\nun procédé non opaque\nP. 249 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\nUL 11-3 Façades*\nAfin d’animer les façades, un traitement architectural séquentiel vertical et/ou horizontal doit être\nrecherché notamment :\n- A partir du premier niveau au-dessus du rez-de-chaussée, par\n     des retraits ponctuels du nu de la façade,\n     et/ou des saillies ponctuelles du nu de façade,\n     et/ou des interruptions ponctuelles du bâti.\n- Et/ou par la distinction des trois parties de la construction (socle, étages courants, partie supérieure).\nOutre leur apport à l’expression architecturale du bâtiment, les saillies et retraits pourront permettre de\nmoduler les apports solaires, et sont donc à privilégier en façade sud.\nPour les façades* sur rue d’une longueur supérieure ou égale à 30 mètres, ce traitement architectural\nséquentiel est obligatoire.\nAu niveau des espaces piétons d’accès et de desserte des constructions, il sera recherché une\ntransparence visuelle et/ou une traversée afin de ménager des vues vers l’intérieur de la parcelle.\nLe retrait total ou partiel du dernier niveau est admis lorsqu’il participe à l’insertion urbaine de la\nconstruction dans le contexte environnant.\nEn cas d’interruption complète du bâti sur toute sa hauteur, la règle de distance se calcule en fonction\nde l’article UL 7-1 à 7-4.\nPour les bâtiments comportant des parties non contiguës, lorsqu’au moins une partie du bâtiment est\naffecté à l’habitat collectif, et si au moins une des façades des parties non contigües comporte des\nbaies, la distance mesurée perpendiculairement séparant les façades en tous points des parties non\ncontigües doit être égale à la hauteur de la façade* la plus haute, moins deux mètres, avec un\nminimum de 6 mètres. La hauteur prise en compte pour l’application de cette règle est uniquement la\nhauteur des parties de construction situées au-dessus du socle commun à l’ensemble de la\nconstruction.\nLes façades* latérales et postérieures des constructions doivent être traitées avec le même soin que\nles façades* principales et en harmonie avec elles.\nLa création de murs pignons aveugles donnant sur la rue est interdite.\nLes façades implantées en limites séparatives doivent être aveugles. Pour les autres façades, les\npignons aveugles doivent être évités.\nLes murs pignons aveugles doivent être traités avec le même soin que les façades* principales. La\nvégétalisation des murs pignons laissés apparents doit être recherchée.\nUL 11-4 Descentes d’eaux pluviales :\nLes descentes d’eaux pluviales devront être intégrées dans la composition architecturale de la\nfaçade*. Les rejets d’eau pluviale des balcons, loggias et terrasses devront être canalisés de façon à\néviter toute salissure des façades et de l’espace public.\nUL 11-5 Eléments de modénatures :\nLes façades* visibles depuis l’emprise publique doivent obligatoirement comporter des\nmodénatures telles que des bandeaux, corniches, encadrement de fenêtres, ainsi que des dispositifs\nd’occultation des baies tels que persiennes, volets battants ou coulissants, etc…\nLes modénatures et les dispositifs d’occultation des baies doivent participer à la définition du projet\narchitectural tant du point de vue esthétique que technique, et être en cohérence avec les\nconstructions avoisinantes.\nLes dispositifs de « goutte d’eau » ou larmiers, en sous face d’appui de fenêtre, ou équivalents, sont\nexigés pour limiter le ruissellement de l’eau sur les façades.\n9 décembre 2025    / P. 250 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\nUL 11-6 Matériaux de façades:\nL’utilisation de matériaux et techniques pérennes, adaptés au caractère architectural du bâti, et\ncohérents avec les constructions existantes, doit être recherchée, tels que : enduit à la chaux, briques,\npierre, moellons, bois etc… Dans tous les cas, les matériaux et techniques utilisés doivent aboutir à\nune finition et une mise en œuvre de qualité.\nUne attention particulière est à porter au traitement du (des) matériau(x) de façade du rez-de-\nchaussée, qui se trouve en contact direct de l’espace public, afin de prévenir toute dégradation ou\nvieillissement anticipé.\nPour les éléments vitrés et notamment déployés en grandes surfaces on privilégiera un traitement\ntransparent, éventuellement gravé ou sablé. Les traitements réfléchissants de type miroir, et fumés,\nsont à éviter.\nLes matériaux tels que carreaux de plâtre, briques creuses, parpaings, destinés à être recouverts d’un\nparement ou d’enduits, ne peuvent être laissés apparents sur les parements extérieurs des\nconstructions et sur les clôtures. L’enduit ciment est interdit.\nUL 11-7 Commerces :\nA titre d‘information, une charte des devantures commerciales, donnant des recommandations sur\nl’aspect extérieur des devantures commerciales, et qui n’est pas opposable aux demandes\nd’autorisations d’urbanisme, est consultable en mairie et sur le site internet de la mairie.\nLes façades* des locaux de commerce doivent être conçues en harmonie avec l’ensemble de la\nfaçade, et en préservant les caractéristiques architecturales de l’immeuble dans lequel ces locaux\nsont situés.\nUL 11-8 Les locaux techniques :\nIls doivent faire partie du projet architectural. Les coffrets ou dispositifs techniques, les colonnes\nsèches et les boîtes aux lettres devront être intégrés à la façade* ou à la clôture.\nLes colonnes sèches ne devront pas créer de saillies sur le domaine public et seront intégrées dans la\ncomposition architecturale de la façade.\nUL 11-9 Rampes de parking :\nLes accès des parcs de stationnement des constructions ou des espaces de livraison des locaux\nd’activités et de commerces doivent être intégrés à l’ensemble du projet architectural.\nLa fermeture des accès parking doit être marquée par une grille ou un portail implanté à l’alignement\nafin d’assurer la continuité du front urbain.\nUL 11-10 Clôtures et portails\n    Les clôtures sur rue :\nElles doivent être implantées à l’alignement existant, ou projeté en cas d’emplacement réservé ou de\nplan d’alignement figurant sur le plan de zonage.\nElles ne peuvent dépasser une hauteur totale de 2 mètres par rapport au niveau du trottoir ; elles\ndoivent être constituées d’un mur bahut de 0,80 mètre de hauteur maximum, surmonté d’un dispositif\najouré dont les parties pleines ne peuvent représenter plus de 40% de la surface des éléments situés\nau-dessus du mur bahut. Il est recommandé de doubler les clôtures d’une haie végétale.\nLes portails d’accès voiture doivent avoir une largeur minimale de 3 mètres. Toutefois, une largeur\ncomprise entre 2,80 mètres à 3 mètres est admise pour les opérations de réhabilitation*.\nP. 251 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\nLes clôtures sur les autres limites du terrain :\nIl est recommandé des clôtures ajourées doublées d’une haie végétale.\nLes clôtures ne peuvent pas dépasser une hauteur totale de 2 mètres par rapport au terrain naturel.\nElles peuvent être constituées d’un mur bahut, dans ce cas, celui-ci ne devra pas dépasser 1 mètre de\nhauteur maximum par rapport au terrain naturel, surmonté d’un dispositif ajouré dont les parties\npleines ne peuvent représenter plus de 40% de la surface des éléments situés au-dessus du mur\nbahut, ou végétalisé.\nElles doivent permettre ponctuellement le passage de la petite faune (notamment les hérissons), en\nprésentant a minima une ouverture ponctuelle en bas de clôture de format 15 x 15 cm, par tranche\nentamée de 15 mètres de linéaire de clôture, avec au minimum un passage lorsque le linéaire de\nclôture est inférieure à 15 mètres.\nLes dispositions de l’article 11-10 ne sont pas applicables aux constructions et installations\nnécessaires aux services publics ou d’intérêt collectif lorsque les conditions de fonctionnement ou de\nsécurité l’imposent.\nUL 11-11    Bâtiments remarquables protégés, bâtiments et ensembles bâtis cohérents de\nqualité - art. L.123-1-5-III-2° du code de l’urbanisme, repéré au plan de zonage et dans les fiche\nannexé au présent règlement (prescriptions)\nRègles générales : L’architecture et la volumétrie des constructions existante présentant un intérêt\narchitectural, doivent être respectées lors de ravalement, de réhabilitation*. Toute extension* d’une\nconstruction, qu’elle soit d’architecture traditionnelle ou contemporaine, doit respecter l’architecture\nd’origine ou la mettre en valeur.\nPercements : La création de nouveaux percements doit s’intégrer dans la composition des façades*\n(reprise des proportions, du rythme et des éléments de modénature).\nFaçades* : Les murs en pierre ou briques prévus pour être apparents doivent être préservés. Les\ntravaux d’isolation thermique pour ces deux types de façade doivent être réalisés à l’intérieur de la\nconstruction.\nToiture : la réfection de toiture respectera le style de la construction existante.\nEn complément de ces prescriptions, les règles suivantes s’appliquent en fonction des catégories :\n•    1 / Bâtiments remarquables protégés :\n    • leur démolition est interdite, sauf justification pour raisons d’hygiène ou de sécurité ;\n    • les travaux de restauration* devront être privilégiés.\n    • Les travaux de réhabilitation et d’extension sont autorisés à condition de conserver et\n    mettre en valeur les caractéristiques du bâtiment.\n•    2 / Bâtiments de qualité :\n    • la démolition partielle est autorisée, sous réserve de ne pas supprimer le ou les éléments\n    qui caractérisent la qualité architecturale ou patrimoniale de la construction ;\n    • les travaux de restauration sont autorisés,\n    • les travaux de réhabilitation et d’extension sont autorisés à condition de conserver et\n    mettre en valeur les caractéristiques du bâtiment.\n    •\n•    3 / Ensembles bâtis cohérents :\n    • La démolition partielle est autorisée, sous réserve de ne pas dénaturer la cohérence de\n    l’ensemble bâti ;\n    • les travaux de restauration sont autorisés à condition de respecter et mettre en valeur les\n    caractéristiques de l’ensemble bâti.\n    • Les travaux d’extension et de réhabilitation sont autorisés à condition de ne pas\n    dénaturer la cohérence avec les autres constructions de l’ensemble concerné.\nUL 11-12 Bâtiments et ensembles bâtis cohérents signalés d’intérêt (recommandations) :\nLes recommandations suivantes s’appliquent :\n    - Aux bâtiments signalés d’intérêt\n    - Aux ensembles bâtis cohérents signalés d’intérêt\nEn cas de travaux d’extension ou de réhabilitation, la conservation des éléments architecturaux\ncaractéristiques du bâtiment ou de l’ensemble bâti cohérent sera recherchée.\n9 décembre 2025    / P. 252 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\nARTICLE UL 12 – OBLIGATIONS IMPOSEES AUX CONSTRUCTEURS EN MATIERE DE\nREALISATION D’AIRES DE STATIONNEMENT\nLe stationnement des véhicules correspondant aux besoins des constructions et installations, ainsi\nque leurs zones de manœuvre, doivent être assurés en dehors des voies publiques.\nLes règles applicables aux constructions ou établissements non prévus ci-dessous sont celles qui\ns’appliquent aux établissements qui leur sont le plus directement assimilables.\nChaque fois qu’une construction comporte plusieurs destinations, le nombre total des places de\nstationnement exigibles sera déterminé en appliquant à chacune d’entre elles la norme qui lui est\npropre.\nUL 12-1 Normes de stationnement pour les véhicules motorisés\nUL 12-1.1 Dispositions générales\n    Le stationnement lié à l’habitat individuel et les parcs de stationnement créés ou réaménagés\n    doivent permettre une circulation satisfaisante des véhicules répondant aux exigences de sécurité,\n    de fonctionnalité, de praticabilité, et de confort. Ils doivent prendre en compte les exigences\n    réglementaires en matière de stationnement des personnes à mobilité réduite et des\n    stationnements des véhicules électriques et hybrides;\n    Le calcul des places de stationnement sera effectué dès la première tranche entamée, et en\n    arrondissant à l’unité supérieure le résultat obtenu par application de la norme, dès que la première\n    décimale est supérieure ou égale à 5.\n    A partir de la création de 20 places de stationnement, une proportion de 50 % au moins des\n    surfaces totales de stationnement définies ci-dessous devra être réalisée dans un volume\n    construit. Cette prescription ne s’applique pas aux constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif (CINASPIC).\n    La suppression de places de stationnement existantes est autorisée uniquement si le nombre total\n    de places répond a minima à la norme plancher, telle que définie par l’article 12.1.2, nécessaire au\n    projet faisant l’objet de la demande d’autorisation d’urbanisme.\n    Dans le cas de réhabilitations et de changements de destination, une variation jusqu’à 10% du\n    nombre de places est autorisée si elle répond à l’évolution des normes sur les parcs de\n    stationnement (dimensions des places, des circulations, contraintes pompiers…)\n    Les places commandées* ne sont pas prises en compte pour le calcul réglementaire du nombre\n    de places plancher à réaliser.\n    Pour l’application d’une règle faisant référence aux zones (1, 2, 3 ou 4), il y a lieu de se reporter\n    au plan page suivante et repris en format agrandi en annexe du règlement. Lorsqu’une unité\n    foncière est concernée par plusieurs zones, c’est la norme la moins contraignante qui s’applique.\nUL 12-1.2 Normes de stationnement des automobiles pour les constructions nouvelles et les\nextensions des constructions existantes\nIl devra être réalisé lors de toute construction nouvelle, ou extension de construction de plus de 50 m²\nde surface de plancher (ci-après SP), des places de stationnement qui doivent répondre aux normes\nci-dessous calculées au prorata de la surface de plancher créée.\nP. 253 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\n    Destination de la construction    Norme Plancher    Norme Plafond\n    (minimum)    (maximum)\nHabitation\nLogements\n    Zone 1    0,85 place / logement\n    Zone 2    0,9 place / logement\n    Zone 3    1 place / logement\n    Zone 4    1,1 place / logement\nLogements sociaux\n    Zone 1    0,5 place / logement    Pas de norme plafond\n    Zone 2 (T2)    0,5 place / logement\n    Zone 2 (pôle intermodal de la Boule)    0,8 place / logement\n    Zone 3    0,9 place / logement\n    Zone 4    1 place / logement\nEtablissement assurant l’hébergement des\npersonnes âgées, résidences étudiantes,\nrésidences et structures de services à vocation\nsociale\n    Zone 1 et 2    1 place / 180 m² SP\n    Zone 3 et 4    1 place / 150 m² SP\nBureaux\nZone 1 (Gares Préfecture, Université et Groues)    1 place /150 m²    1 place / 75 m²\n    Zone 1 (Gare Nanterre Ville)    1 place /150 m²    1 place / 62 m²\n    Zone 2    1 place / 150 m²    1 place / 62 m²\n    Zones 3 et 4    1 place / 85 m²    1 place / 52 m²\nCommerces :\n- Jusqu’à 300 m² de SP    1 place/150 m² de SP    1 place / 65m²\n- De 301 à 2 000 m² de SP    1 place/70 m² de SP    1 place / 35m²\n- Au-delà de 2 001 m² de SP    1 place/35 m² de SP    1 place / 20m²\nLe calcul s’effectue par application des normes des\ntranches successivement atteintes\nHébergement hôtelier\n    Zone 1 et 2    0,15 place / chambre    0,4 place / chambre\n    Zone 3 et 4    0,35 place / chambre    0,5 place / chambre\n    Destination de la construction    Norme Plancher    Norme Plafond\n    (minimum)    (maximum)\nArtisanat    1 place/170 m² de SP    Pas de norme plafond\nIndustrie    1 place/ 250 m² de SP    Pas de norme plafond\nEntrepôt    1 place/5 000 m² de SP    Pas de norme plafond\nConstructions ou installations nécessaires    Le nombre de places à réaliser doit être justifié\naux services publics ou d’intérêt collectif    dans la demande d’autorisation d’urbanisme, et\nCINASPIC    suffisant au regard des besoins nécessaires à la\n    nature    de    l'équipement,   son    mode    de\n    fonctionnement, le nombre et le type d'utilisateurs\n    (employés, visiteurs, étudiants…) et sa localisation\n    dans la commune (proximité d'une gare, desserte\n    en transports en commun, existence ou non de\n    parcs publics de stationnement à proximité...).\n9 décembre 2025    / P. 254 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\n    L’illustration ci-dessous des zones différenciées pour les normes de stationnement est\n    complétée du plan détaillé N° 1-F en annexe du règlement.\nP. 255 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\nUL 12-1.3. Normes de stationnement des automobiles pour les réhabilitations, les\nréaménagements et les changements de destination\nPour les travaux de réhabilitation d'une construction existante, de réaménagement d’une construction\nexistante ayant pour effet la création de logements supplémentaires, et/ou les travaux de changement\nde destination d’une construction existante, le nombre de places plancher exigé résulte de la\ndifférence entre :\n-    le nombre de places qui serait exigé sur la base de l’article 12-1.2 pour la destination de la\n    construction après l’opération.\n-    le nombre de places qui serait exigé sur la base de l’article 12-1.2 pour la destination de la\n    construction avant l’opération.\nLes besoins réglementaires pourront être satisfaits en prenant en compte les places préexistantes\nconservées.\nUL 12-1.4 Mutualisation des places de stationnement pour les automobiles\nDans le cas où les besoins en stationnement des véhicules automobiles sont satisfaits par la création\nd’un parc de stationnement commun à l’ensemble, ou à une partie, d’une opération faisant l’objet\nd’une seule autorisation d’urbanisme, ou d’une ou plusieurs opérations immobilières réalisées dans le\ncadre d’une même Zone d’Aménagement Concerté ou Concession d’aménagement, le nombre total\nde places à réaliser en application des articles 12-1.2 et 12-1.3 pourra être minoré à condition que\nl’ensemble des conditions suivantes soit respecté:\n- La ou les opération(s) portent sur une ou des constructions ayant au moins deux destinations\ndifférentes ;\n- Le nombre total des places de stationnement obtenu par application des normes définies aux\narticles 12-1.2 et 12-1.3 et entrant dans le périmètre de la mutualisation est supérieur ou égal à 40\nplaces ;\n- Le futur parc de stationnement commun est réalisé dans un rayon de moins de 300 mètres de la ou\ndes constructions desservies ;\n- Le futur parc de stationnement commun est conçu pour un usage permettant la banalisation*, le\nfoisonnement* et la mutualisation* des places des différentes typologies de destinations (fluidité des\naccès, lisibilité du schéma de circulation, accès aisé aux places de stationnement…).\nDe 35% au maximum, cette minoration pourra être calculée à l’aide de la méthode présentée en\nannexe.\nDans tous les cas, le nombre total de places à réaliser après minoration devra être précisé dans une\nnotice de stationnement justifiant des besoins, de l’occupation alternative des places composant le\nparking commun par les usagers fréquentant les différentes opérations desservies, et d’une gestion\nmutualisée, banalisée et foisonnée de ces places.\nEn cas de volonté de mutualisation d’aires de stationnement, il pourra également être admis que le\npétitionnaire ne réalise pas sur le terrain d’assiette de l’opération ou dans son environnement\nimmédiat, tout ou partie du nombre d’emplacements nécessaires au stationnement calculé par\napplication des normes définies aux articles 12-1.2 et 12-1.3. Dans ce cas, le pétitionnaire pourra être\ntenu quitte de ses obligations pour les emplacements qu’il ne réalise pas lui-même :\n    - En justifiant de l’obtention d’une concession à long terme mutualisée dans un parc public ou\n    privé de stationnement existant ou en cours de réalisation situé dans un rayon inférieur à 300\n    mètres du terrain d’assiette de la construction\n    - Ou en justifiant de l’acquisition de places mutualisées dans un parc privé de stationnement\n    existant ou en cours de réalisation situé dans un rayon inférieur à 300 mètres du terrain\n    d’assiette de la construction.\n    PARTIE ANNEXE :\n    Les besoins en stationnement de chaque catégorie de surface desservie par le parking\n    banalisé peuvent être calculés à 5 périodes différentes de la semaine par application des\n    normes plancher, multipliées par les coefficients correctifs adéquats : ces coefficients\n    correctifs sont indiqués dans le tableau ci-dessous.\n9 décembre 2025    / P. 256 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\n    Les périodes de la semaine retenues pour le calcul sont :\n    - la journée de semaine,\n    - la soirée de semaine,\n    - la nuit de semaine,\n    - la journée de week-end,\n    - la soirée de week-end.\n    La demande totale de stationnement engendrée à cette période pourra être établie par\n    addition des besoins élémentaires de chaque surface desservie par le parking banalisé à une\n    période donnée. La capacité du parking banalisé devra être supérieure à la demande\n    maximum constatée entre les 5 périodes.\n    EVOLUTION DE LA DEMANDE\n    DESTINATION\n    Journée    Soirée    Nuit    Journée    Soirée\n    semaine    semaine    semaine    week-end    week-end\nLogements    60 %    90 %    100 %    80 %    90 %\nBureaux, artisanat, industrie\net    100 %    30 %    10 %    10 %    10 %\nentrepôts\nCommerces :\n- Jusqu’à 2000 m²    50 %    50 %    10 %    100 %    50 %\n- Au-delà de 2000 m²    60 %    70 %    10 %    100 %    70 %\nHébergements hôteliers    10 %    80 %    100 %    20 %    70 %\n    A établir en fonction du fonctionnement, de sa fréquentation\n    prévisionnelle\n- CINASPIC\n    et de sa desserte tous modes selon les différentes périodes de la\n    journée\nUL 12-1.5 - Normes techniques à respecter pour la réalisation des places de stationnement des\nautomobiles\nDimensions des places : les places créées ou réaménagées, ainsi que les boxes et garages, doivent\nrespecter les dimensions minimales suivantes :\n  - Longueur : 5 mètres\n  - Largeur : 2,30 mètres, portée à 2,50 mètres si la place jouxte un obstacle (mur, poteau…)\n  - Dégagement : 5,50 mètres\nDimension minimales des rampes et voies de circulation : les dimensions préconisées pour les\nrampes correspondent à des largeurs circulables, hors obstacles de plus de 10 cm de haut ou\nséparateur central.\n    Rampes et voies de circulation\n   Parking concerné    Circulation autorisée    Rampe et voie droite    Rampe et voie courbe\n   Jusqu’à 50 places    Sens unique ou    3 mètres    3,50 mètres\n    Double sens alterné*\n   Plus de 50 places    sens unique    3 mètres    3,50 mètres\n    double sens    5 mètres    6 mètres\nLe double sens alterné n’est pas autorisé pour les parkings de plus de 50 places\nP. 257 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\nCes rampes ne doivent pas entraîner de modification dans le niveau du trottoir. Leur pente dans les 5\npremiers mètres à partir de l'alignement ne doit pas excéder 5%, sauf dans le cas d'impossibilité\ntechnique.\nAu-delà de ces 5 premiers mètres, la pente maximale admise pour les rampes est de 18%.\nPour les courbes, le rayon de courbure extérieur de la rampe à sens unique, ou le rayon de courbure\nextérieur de la voie intérieure dans les cas d'une rampe à double sens, ne peut être inférieur à 8,50\nmètres. Ce rayon est mesuré en projection horizontale.\nUL 12-1.6 Normes de stationnement des deux-roues motorisés pour les constructions\nnouvelles.\nPour toute construction à destination d’habitation ou de bureau supérieure à 500 m² de surface de\nplancher, iI est exigé une aire de stationnement pour deux-roues motorisés, dont la surface est\ncalculée au prorata de la surface de plancher créée pour ces destinations, de :\n    Destination    Norme Plancher    Norme Plafond\n    Habitation    5 m²/1000 m² de SP    Pas de norme plafond\n    Bureaux    5 m²/1000 m² de SP    12 m²/ 1000 m² de SP\nLorsqu’une aire de stationnement pour deux-roues motorisés est exigible, l’espace à leur réserver ne\npourra être inférieur à 3 m². Dans les opérations de 10 logements et plus, lorsque plusieurs espaces\nsont réalisés, l’un des espaces doit avoir une surface minimum de 10 m² d’un seul tenant.\nCes espaces seront implantés de préférence avec les places de stationnement voitures, s’il en existe.\nUL 12-2 Normes de stationnement des vélos :\nDes places de stationnement doivent être réalisées pour les deux roues non motorisés. Elles doivent\nêtre :\n  - couvertes, exclusivement réservées aux vélos, sécurisées et équipées de dispositifs fixes\n    d’accroche, facilitant la performance des systèmes d’antivols ;\n  - facilement accessibles depuis l’espace public et les accès aux constructions ;\n  - situées de préférence en rez-de-chaussée, ou à défaut en extérieur sur la parcelle ou au premier\n    sous-sol.\nLorsqu’une surface de stationnement vélos est exigible, l’espace réservé aux vélos sera d’au\nminimum 3 m². Dans les opérations de 10 logements et plus, lorsque plusieurs espaces sont réalisés,\nl’un des espaces doit avoir une surface minimum de 8 m² d’un seul tenant.\nUL 12-2-1 – Normes de stationnement vélos pour les constructions nouvelles et les extensions\nPour toute construction à partir de 2 logements pour l’habitation ou d’une surface supérieure à 200 m²\nde SP pour les autres destinations, ou pour toute extension créant plus de 2 logements pour\nl’habitation ou plus de 200 m² de SP pour les autres destinations, iI est exigé une surface minimale de\nlocaux pour les vélos, calculée au prorata de la surface créée suivante :\nDestination    Norme Plancher\nLogements et logements financés    1,5 m² / logement\npar un prêt aidés de l’Etat\nRésidences étudiantes, résidences\net structures de services à vocation   0.75 m² / logement\nsociale\nBureaux    15 m² pour 1 000 m² de Surface de plancher\nCommerce, artisanat    10 m² pour 1 000 m² de Surface de plancher\nHôtel, industrie et entrepôt    5 m² pour 1 000 m² de Surface de plancher\n9 décembre 2025    / P. 258 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\nConstructions ou installations  Le nombre de places à réaliser doit être justifié dans la\nnécessaires aux services    demande d’autorisation d’urbanisme, et suffisant au regard des\npublics ou d’intérêt collectif  besoins nécessaires à la nature de l'équipement, son mode de\n    fonctionnement, le nombre et le type d'utilisateurs (employés,\n    visiteurs, étudiants…) et sa localisation dans la commune\n    (proximité d'une gare, desserte en transports en commun,\n    existence ou non de parcs publics de stationnement à\n    proximité...).\nUL 12-2.2 – Normes de stationnement vélos pour les réhabilitations, les réaménagements et\nchangement d’affectation\nPour les travaux de réhabilitation d'une construction existante, de réaménagement d’une construction\nexistante ayant pour effet la création de logements supplémentaires, et/ou les travaux de changement\nde destination d’une construction existante, la surface de plancher de locaux exigée pour les vélos\nrésulte de la différence entre :\n- la surface qui serait exigée par l’article 12-2.1 pour la destination de la construction après l’opération\n- la surface qui serait exigée par l’article 12-2.1 pour la destination de la construction avant l’opération.\nLes besoins réglementaires pourront être satisfaits en prenant en compte les surfaces préexistantes et\nconservées de locaux pour les vélos.\nUL 12-3 Aires de stationnement pour les livraisons et la dépose/reprise des autocars :\nUL 12-3.1 : Les aires de stationnement pour les livraisons :\nLes emplacements nécessaires et adaptés pour assurer toutes les opérations usuelles de\nchargement, déchargement et manutention pour les livraisons et pour la dépose/reprise des autocars\ndoivent être réalisés sur les emprises privées.\nUne aire de stationnement pour les livraisons doit être prévue pour les constructions neuves dont la\nsurface de plancher totale atteint les seuils ci-dessous :\n- Pour les constructions à destination de commerce et artisanat de plus de 1000 m² de surface de\nplancher : l’aire doit avoir les caractéristiques minimales suivantes :\n Largeur : 3,50 mètres\n Longueur : 8 mètres\n Hauteur : 3,50 mètres\n Surface : 35 m²\n- Pour les constructions à destination de d’entrepôts de plus de 200 m² de surface de plancher, pour\nles opérations d’industrie de plus de 1 000 m² de surface de plancher, et pour toutes les opérations,\nhors habitation, de plus de 4 000 m² de surface de plancher : l’aire doit les caractéristiques minimales\nsuivantes :\n Largeur : 3,5 mètres\n Longueur : 12 mètres\n Hauteur: 3.50 mètres\n Surface : 70 m²\n- Pour les réhabilitations* et changements de destination (hors habitation), dont la surface totale après\ntravaux est supérieure à 4000 m² de SP, une aire de stationnement doit être prévue avec les\ncaractéristiques définies ci-dessus.\nUL 12-3.2 : Les aires de dépose / reprise pour autocars :\nUne aire de dépose / reprise pour autocars doit être prévue :\n- pour les hôtels d’une surface de plancher supérieure à 2 000 m²\n- pour les équipements au rayonnement intercommunal\nLe cas échéant, ces aires peuvent coïncider avec les aires de stationnement pour les livraisons.\nP. 259 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\nUL 12-4 : Locaux de stockage des conteneurs à déchets\nL’emplacement des locaux de stockage des conteneurs sera correctement accessible et\nconvenablement dimensionné pour répondre aux besoins de l’immeuble, de manière à assurer les\ncollectes suivantes : ordures ménagères, multi matériaux, objets encombrants. Des précisions\ntechniques plus précises concernant l’aménagement de ces locaux figurent en annexe du règlement .\nARTICLE UL 13 – OBLIGATIONS IMPOSEES AUX CONSTRUCTEURS EN MATIERE DE\nREALISATION D’ESPACES LIBRES, D’AIRES DE JEUX ET DE LOISIRS ET DE\nPLANTATIONS\nUL 13-1 – Superficie du terrain destinée aux espaces libres et espaces verts\nEn zone UL hormis le secteur ULa :\nAu moins 10 % de la surface du terrain doit être traité en espaces verts* de pleine terre.\nEn secteur ULa hormis le secteur des terrasses de la ZAC Seine-Arche :\nAu moins 60 % de la surface du terrain * doit être traitée en espaces verts de pleine terre*.\nAu moins 50% des espaces libres qui ne sont pas traités en espaces verts doivent être perméables.\nDans le secteur des terrasses de la ZAC Seine-Arche :\nL’ensemble des espaces libres devront être aménagés en espaces verts, déduction faite des surfaces\ndestinées à des voiries de distribution interne.\nSur l’ensemble de la zone :\nIl n’est pas fixé de règle pour les constructions et installations nécessaires aux services publics ou\nd’intérêt collectif (CINASPIC).\nLes toitures végétalisées* semi-intensive et intensive comptent pour la moitié de leur surface dans le\ncalcul des espaces verts.\nLes marges* de recul par rapport aux voies feront l’objet de plantations ou d’aménagements\npaysagers.\nAfin de ne pas accentuer l’imperméabilisation des sols, on privilégiera chaque fois que possible les\nespaces minéraux sablés, dallés, ou pavés selon les règles de l’art de préférence aux espaces\nbitumés ou enrobés.\nDe façon générale, et pour prendre en compte la biodiversité, il est fortement recommandé de réaliser\nun espace vert d’un seul tenant.\nIl est recommandé d’assurer la continuité entre les espaces verts créés, et les espaces verts* des\nterrains voisins, notamment ceux protégés au titre de l’article L.123-1-5-III-2° du code de l’urbanisme.\nUL 13.2 – Plantations et aménagements paysagers :\nLes projets de constructions devront être étudiés dans le sens d’une conservation maximale des\nplantations existantes, sous réserve de leur bon état phytosanitaire.\nEn secteur ULa, les arbres existants devront être maintenus ou remplacés par des arbres de\ndéveloppement équivalent. .\nLes espaces libres doivent être plantés d’arbres, en respectant les ratios minimums suivants :\n    Ratio arbre / surface    Distance minimale entre le tronc de\n    Type d’arbre\n    d’espaces libres    l’arbre et les constructions\n    3ème grandeur / moyen    1 arbre / 100 m² d’espaces\n    Au moins 3 mètres\n    développement    libres\nPour l’application des ratios ci-dessus, dès qu’une tranche de 100 m² est entamée, un nouvel arbre\ndoit être planté.\nLes arbres doivent prioritairement être implantés en espace vert de pleine terre.\n9 décembre 2025    / P. 260 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\nTout arbre planté doit avoir une fosse de plantation ayant les dimensions minimales suivantes :\n   Arbres de petit développement et de moyen développement : les fosses devront avoir les\n    dimensions minimales de terre de 1,30 mètres X 1,30 mètres X 1,30 mètres (L x l x profondeur) ;\n   Arbres de grand développement : les fosses devront avoir les dimensions minimales de terre de 2\n    mètres X 2 mètres X 2 mètres (L x l x profondeur).\nLa plantation d’espèces invasives* est interdite. Il est recommandé de ne pas conserver les espèces\ninvasives existantes sur le terrain.\nAfin de conforter et développer la biodiversité, il est recommandé de ne pas dépasser une proportion\nde 40 % d’arbustes à feuillage persistant dans la composition des haies.\nLes haies monospécifiques d’arbustes à feuillage persistant sont vivement déconseillées.\nDes essences d’arbustes indigènes sont proposées dans la liste des essences recommandées à la\nplantation en annexe du règlement.\nUL 13-3 Plantation des parkings à l’air libre\nPour les terrains comportant un ou plusieurs parkings de véhicules légers de plus de 20 places\nde stationnement d’un seul tenant :\n Au moins 60 % des arbres à planter sur le terrain en application de l’article 13-2 devront être\n   plantés sur le ou les parkings de véhicules légers de plus de 20 places de stationnement d’un seul\n   tenant. Quelle que soit la zone dans laquelle se situe le terrain, les arbres plantés sur le ou les\n   parkings devront être de moyen ou de grand développement.\n La taille de la fosse des arbres plantés sur les parkings devront avoir les dimensions minimales de\n  terre de 2 mètres X 2 mètres X 1,50 mètres (L x l x profondeur). Le pied d’arbre de terre devra\n  avoir une taille minimale 1,30 m sur 1,30 m, et sera bordé d’un dispositif de protection de 15 cm\n  minimum de hauteur. Il devra être végétalisé (plantes vivaces couvre sols recommandées).\n Pour plusieurs arbres plantés en alignement, on privilégiera autant que possible les fosses en\n  tranchées filantes et les pieds d’arbres continus, végétalisés.\n Pour les parkings de plus de 1 000 m² d’un seul tenant : des écrans arborés composés\n  d’essences indigènes* devront être aménagés autour de ces parkings. Les arbres inclus dans ces\n  écrans arborés ne sont pas pris en compte pour le calcul des arbres à planter en application de\n  l’article 13-2 ci-dessus.\n Pour les parkings de plus de 2 000 m² d’un seul tenant : en plus des dispositions prévues pour\n  les parkings de plus de 1000 m² d’un seul tenant, au moins une rangée d’arbres devra être réalisée\n  à l’intérieur du parking, pour le fractionner visuellement.\nP. 261 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\n9 décembre 2025    / P. 262 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\nUL 13.4 – Les éléments de paysage non bâtis repérés au titre de l’article L.123-1-5-III-2° du\ncode de l’urbanisme.\nEn application de l’article R.421-23 du Code de l’urbanisme, les travaux ayant pour effet de porter\natteinte ou de supprimer un élément de paysage doivent obligatoirement faire l’objet d’une déclaration\npréalable de travaux.\n    - Les alignements d’arbres protégés et les arbres remarquables :\nL’abattage, l’élagage et toute autre atteinte à l’intégrité de ces arbres (racines etc…) est interdit, sauf :\n- en cas de risque pour la sécurité des personnes et des biens, ou en cas d’une expertise\nphytosanitaire démontrant un mauvais état de l’arbre,\n- pour permettre l’accès au terrain, à condition de démontrer qu’il n’y a pas d’autre possibilité d’accès.\nEn cas d’abattage d’un arbre remarquable, une compensation est exigée par la plantation d’un arbre\nde développement équivalent.\nAucune construction ne peut être implantée à moins de 4 mètres du collet (base du tronc au niveau du\nsol) d’un arbre remarquable.\n    - Les « espaces verts protégés » (EVP)\n- L’abattage et toute autre atteinte à l’intégrité (racines etc…) des arbres situés dans les EVP sont\ninterdits, ainsi que les aménagements de toute nature ( voie , cheminement imperméable)\ncompromettant le caractère paysager et végétale des EVP, et la qualité des plantations existantes.\nNéanmoins, l’abattage d’arbres situés dans les EVP est autorisé en cas de risque pour la sécurité des\npersonnes et des biens, ou en cas d’une expertise phytosanitaire démontrant un mauvais état de\nl’arbre. En cas d’abattage, une compensation est exigée par la replantation d’un arbre de\ndéveloppement équivalent dans le périmètre de l’EVP.\n- Aucune construction n’est autorisée, sauf les locaux à usage de stockage d’outillage d’entretien\nd’espaces verts. Un seul local, d’une emprise au sol maximale de 5 m² est autorisé par terrain.\nARTICLE UL 14 – COEFFICIENT D’OCCUPATION DES SOLS\nArticle supprimé par la loi ALUR du 24 mars 2014.\nArticle UL 15 - OBLIGATIONS IMPOSEES AUX CONSTRUCTIONS, TRAVAUX,\nINSTALLATIONS ET AMENAGEMENTS, EN MATIERE DE PERFORMANCES\nENERGETIQUES ET ENVIRONNEMENTALES\nLes extensions de faible envergure (extension d’un bâtiment existant de surface inférieure à 150m² et\nLes extensions de faible envergure (extension d’un bâtiment existant de surface inférieure à 150m² et\nà 30% de la surface du bâtiment existant) n’entrent pas dans le champ d’application de l’article 15.\nPour les rénovations et les constructions de bâtiments neufs, des critères de performance ont été\ndéfinis ci-dessous. Pour certains critères de performance, les seuils définis devront être\nobligatoirement atteints (Bbio et Cep). Les seuils des autres critères définis sont des objectifs\nrecommandés.\nUL 15.1 Rénovation de bâtiments existants\nLes opérations de rénovation devront rechercher à atteindre les objectifs de performance\nénergétique ci-dessous, lorsque les éléments suivants seront remplacés ou installés.\nP. 263 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\n    Critère d'Analyse    Objectifs à atteindre\n    Parois    U:    Coefficient    de R : Résistance    thermique\n    transmission    thermique [m².K/W]**\n    surfacique    des    parois\n    [W/(m².K)]*\n    Mur    Umur≤ 0,25 quand l’isolation par Rmur ≥ 4 quand l’isolation par\nIsolation thermique    l’extérieur est possible    l’extérieur est possible\npermettant de limiter les    Umur≤ 0,4 sinon    Rmur ≥ 2,5 sinon\ntransferts de chaleur\nentre un milieu chaud et    Menuiseries Uw≤ 1,6 pour les fenêtres et\nun milieu froid    porte-fenêtres\n    ≤ 1,8 pour les portes\n    Toiture    Utoiture≤   0,25    pour
