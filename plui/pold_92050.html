ie renouvelable\n    réglementaire du bâtiment\nIO : Indice d'ouverture pour limiter les\ndéperditions, les sensations de parois froides et\n    Uniquement pour les bureaux IO inférieur à 35 %\nles surchauffes importantes (surface de baies\nen tableau / surface de plancher)\n    Critère d'Analyse    Objectifs\n    OB ≥ 30% en surface, de préférence en point haut.\nOB : Ratio d'ouverture de baies pour assurer\n    Exception faite sur les façades qui demande un niveau\nune ventilation naturelle (et cela avec les\n    d’isolement de façade de plus de 42dB par rapport à\nprotections solaires mises en place)\n    l’extérieur.\n    > Pour tout bâtiment tertiaire dont la SHON RT est\nRégulation\n    supérieure à 1000 m², mise en place d'une GTB.\nArticle UL 16 - OBLIGATIONS IMPOSEES AUX CONSTRUCTIONS, TRAVAUX,\nINSTALLATIONS ET AMENAGEMENTS, EN MATIERE D'INFRASTRUCTURES ET\nRESEAUX DE COMMUNICATIONS ELECTRONIQUES\nSans objet.\n    *-*-*-*-*-*-*-*\nAnnexe zone ULa\nCaractéristiques des espaces publics à conserver, à modifier ou à créer\nLes espaces publics majeurs de l’opération seine-Arche sont :\n- « les terrasses de Nanterre » numérotées de 1 à 17 du parc du Chemin de l’île à la rue des Sorins ;\n- la place haute de la gare de Nanterre Université ;\n- la grande croisée entre les Terrasses et l’axe Joliot-Curie ;\nP. 265 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\n- les voies publiques transversales aux terrasses de Nanterre qu’elles soient existantes ou à créer\ntelles que le boulevard de la Commune, le boulevard de la république, le nouveau passage entre la\nrue Anatole France et le boulevard Pesaro prolongé, la rue Baise Pascal prolongée, le boulevard des\nprovinces Françaises, l’allée de Gascogne prolongée, les passages entre les terrasses et le boulevard\ndes Bouvets, la rue Hebert, la rue des Sorins, les nouveaux passages entre cimetières et jardins de\nl’Arche…\n- le boulevard de la Défense (RN 314).\n- le parvis des Jardins de l’Arche,\nLes espaces publics des terrasses, organisés en échelle depuis la Seine au Nord-Ouest jusqu’à\nl’Arche au Sud-Est comprennent des promenades et cheminements piétons dallés, un jardin linéaire\norganisé en terrasses ; des voies circulées se composant d’un ou plusieurs trottoir(s) et de bandes de\nroulement, de parcs, squares et jardins publics.\n0.2 Les terrasses : Sont créées sur le principe de l’échelle à savoir : deux montants Est/Ouest et des\nbarreaux perpendiculaires\n02A Le montant Nord de l’échelle est constitué par la promenade piétonne. Elle comprend 15 aplats\ndallés (numérotés de 3 à 17) orientés au Sud devant les immeubles. La pente y est rattrapée par des\nescaliers et rampes accessibles aux handicapés. Chaque aplat dallé est planté d’arbres de haute tige\nà développement libre. La terrasse numéro 1 assure la transition avec le parc du Chemin de L’île. La\nterrasse numéro 2 assure l’articulation avec son environnement et plus particulièrement le toit de la\ncouverture de l'A 86.\n02B Le milieu de l’échelle se compose de 17 terrasse-jardins de 30 mètres de large environ,\nimplantées au-dessus de l’autoroute souterraine A 14 entre la côte NGF 28 et la côte NGF 51,50.\nElles montent régulièrement de la couverture de l’A 86 jusqu’à la grande croisée, avant de\nredescendre légèrement jusqu’à la jetée de l’Arche. Leur caractéristique principale est d’être\nperméable et non arboré. Elles sont doublées au Sud par des «noues» perméables recevant les eaux\npluviales, plantées d’arbres têtards ou cépées.\n02C Le montant Sud de l’échelle est constitué par le boulevard Pesaro existant et prolongé depuis la\ncouverture de l’A 86 jusqu’à la rue des Sorins. Ce boulevard de type conventionnel (trottoir, chaussée,\ntrottoir) est planté au Sud d’une file d’arbres taillés.\n02D Les deux montants de l’échelle sont liés par 6 barreaux circulés, conformément au plan joint des\nespaces publics et 7 barreaux piétons principaux.\n03 La place haute de la gare de Nanterre multi-modale entre les RER, la ligne SNCF, le futur tramway\net les lignes d’autobus. Elle est située à 8,50 mètres au-dessus du réseau ferroviaire.\n04 La rue Anatole France se prolonge en viaduc montant et relie la place haute de la gare depuis le\nniveau du sol naturel jusqu’au-dessus des voies ferrées ; Elle est susceptible d’accueillir une voie de\ncirculation, des trottoirs et un tramway.\n05 La rue de la Folie est prolongée et relie la rue Anatole France au pied de la Place haute de la gare.\nElle s’élargit pour former un parvis piéton devant l’université.\n06 La rue Blaise Pascal prolongée longe le RER A et rejoint la place haute de la gare.\n07 Un passage entre la rue Anatole France et la rue Pesaro prolongée sera créé afin de permettre\nune liaison directe avec « les terrasses »\n08 Une place située à la croisée de l’avenue Joliot Curie et des Terrasses sera aménagée. Elle\ns’ouvrira vers le boulevard des Provinces Françaises, rejoindra la rue de la Folie et le parvis de\nl’université par un grand escalier, et sera reliée aux rues Anatole France et Blaise Pascal prolongées.\n09 Le boulevard de la Défense sera aménagé en boulevard urbain.\n10 Le parvis des Jardins de l’Arche sera le trait d’union entre La Défense et les terrasses de Nanterre.\nLe projet d’aménagement inclus les abords immédiats de l’Arena et plus largement les espaces\n9 décembre 2025    / P. 266 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    UL\npublics en direction de la grande arche, qui seront traités comme un parvis élargi et continu de\nl’Arena. Le parvis des Jardins de l’Arche est identifié par le sous-secteur ULeb.\nL’ensemble des voies et passages existants ou à créer seront traités et aménagés dans un souci de\ncohérence au niveau des matériaux, du mobilier urbain, de l’éclairage et des plantations.\nLes documents graphiques précisent en tant que de besoin les caractéristiques de ces espaces.\nP. 267 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1    UL\n    Titre IV –\n    DISPOSITIONS APPLICABLES\n    DANS LES ZONES NATURELLES\n9 décembre 2025    / P. 268 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    N\n    ZONE N\nCaractéristiques de la zone\nLa zone N est une zone naturelle, majoritairement végétalisée, à dont la vocation est de préserver et\nde développer la biodiversité et d’offrir au public des espaces verts de détente et de loisirs.\nElle est répartie en trois types de secteurs :\n Secteurs Na : les grands parcs publics départementaux (André Malraux et Chemin de l’Ile)\n Secteur Nb : une partie des berges de Seine,\n Secteurs Nc : les espaces verts communaux (parc des Chenevreux, jardin pédagogique, parc du\n    Moulin des Gibets).\nLes dispositions du règlement sont complétées par le document des orientations\nd’aménagement et de programmation, pour le secteur « Echangeur A14/A86 - Papèteries ».\n    Dispositions applicables à la zone N\nARTICLE N 1 – OCCUPATION ET UTILISATION DU SOL INTERDITES\nSont interdits :\n   Toutes constructions autres que celles prévues à l’article N.2 ci-après.\n    L’implantation, l’extension ou la modification des installations classées pour la protection de\n    l’environnement soumises à autorisation, à déclaration préalable préfectorale ou à enregistrement.\n    Les dépôts couverts ou non couverts de matériaux divers non liés à l’exploitation d’un service\n    public.\n   Les dépôts couverts ou non couverts de flottes de véhicules.\n   L’exploitation de carrières.\n   Les affouillements et exhaussements des sols autres que ceux autorisés à l’article N 2.\nARTICLE N 2 – OCCUPATIONS ET UTILISATIONS DU SOL SOUMISES A DES\nCONDITIONS PARTICULIERES\nSont soumis à conditions particulières :\n   Les constructions et installations doivent être :\n    -   En secteur Na :\n    o    d’intérêt collectif et nécessaires à l’exploitation, l’entretien, l’usage et la mise en valeur\n    de ces deux parcs;\n    o    à destination d’habitation destinées à des personnes dont la présence permanente est\n    nécessaire pour assurer la surveillance ou le gardiennage des installations ou\n    espaces naturels.\n    o    liées au fonctionnement des jardins familiaux\n    -   En secteur Nb : situées sur des terrains le long de la Seine entre la rue Jean Perrin et la rue\n    des Peupliers, et à destination de loisirs, de restauration et de mise en valeur du site.\n    -   En secteur Nc : nécessaires au fonctionnement des jardins familiaux.\nP. 269 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    N\n    Les affouillements et exhaussements de sol : ils doivent être directement liés :\n    -   à des travaux de voirie ou de réseaux divers\n    -   ou à des aménagements paysagers,\n    -   ou à la réalisation de locaux dédiés à un service public ou d’intérêt collectif.\nARTICLE N 3 – CONDITIONS DE DESSERTE DES TERRAINS PAR LES VOIES\nPUBLIQUES OU PRIVEES ET D’ACCES AUX VOIES OUVERTES AU PUBLIC.\nN 3-1 Tout terrain* doit être desservi par une voie carrossable publique ou privée en bon état de\nviabilité et présentant des caractéristiques permettant de satisfaire aux exigences de la sécurité, de la\ndéfense contre l’incendie et de la protection civile.\nLa largeur de cette voie ne peut être inférieure à 3,50 m, sauf en cas d’extension d’une construction\nexistante et à condition de ne pas créer un deuxième logement.\nIl sera exigé une voie d’une largeur supérieure à 3,50 mètres si cela est nécessaire :\n- du fait de l’importance des constructions projetées, et par conséquent des flux de véhicules et de\n    piétons qui emprunteront cette voie.\n- ou si les accès projetés, du fait de leur configuration ou de leur disposition, présentent un risque\n    pour la sécurité des personnes\nDes aménagements complémentaires (trottoirs, éclairages, etc…) pourront être imposés lorsque la\nvoie aura une largeur supérieure à 3,50 mètres.\nLes voies en impasse d’une longueur égale ou supérieure à 50 mètres doivent être aménagées de\ntelle sorte que les véhicules puissent faire demi-tour.\nN 3-2 Conditions d’accès aux voies ouvertes au public\nTout terrain doit disposer d’un accès d’une largeur minimale de 3,50 mètres sur une voie ouverte à la\ncirculation publique.\nL’emplacement des nouveaux accès carrossables doit tenir compte :\n   • du risque éventuel pour la circulation et la sécurité des usagers de l’espace public ou des\n    personnes utilisant ces accès. La sécurité des usagers doit être appréciée compte tenu de la\n    position des accès, de leur configuration ainsi que de la nature et de l'intensité du trafic.\n   • des alignements d’arbres sur la voie publique et autres espaces verts, et assurer le maintien de\n    leur bon état phytosanitaire ;\n   • des dispositifs de signalisation, d’éclairage public, de supports de réseaux ou de tout autre\n    élément de mobilier urbain situé sur l’emprise de la voie ;\n   • des accès existants sur les parcelles limitrophes, afin de limiter l’impact sur l’espace public.\nARTICLE N 4 – CONDITIONS DE DESSERTE DES TERRAINS PAR LES RESEAUX\nPUBLICS D’EAU, D’ELECTRICITE ET D’ASSAINISSEMENT.\nN 4-1 Dispositions générales :\nL’emplacement des nouveaux réseaux doit tenir compte des arbres et des alignements d’arbres\nprotégés au titre de l’article L.123-1-5-III-2° du code l’urbanisme afin d’assurer le maintien de leur bon\nétat phytosanitaire.\n9 décembre 2025    / P. 270 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    N\nN 4-2 Obligation de raccordement des eaux usées\nComme le prescrit l'article L 1331-1 du Code de la Santé Publique, tous les immeubles qui ont accès\naux égouts disposés pour recevoir les eaux usées domestiques et assimilées domestiques et établis\nsous la voie publique à laquelle ces immeubles ont accès (directement ou par l'intermédiaire de voies\nprivées ou de servitudes de passage), doivent obligatoirement être raccordés à ce réseau dans un\ndélai de deux ans à compter de la date de mise en service du réseau public de collecte.\nTout projet de raccordement ou de rejet au réseau d’assainissement doit faire l'objet d'une demande\nadressée au Service Assainissement9.\nN 4-3 Gestion des eaux pluviales\nAfin d’alimenter la nappe phréatique d’une part (sous réserve d’installation de dispositifs anti-\npollution), et d’éviter la saturation des réseaux d’autre part, seul l’excès de ruissellement doit être\ncanalisé après qu’aient été mises en œuvre toutes les solutions susceptibles de :\n    -    limiter l’imperméabilisation du terrain,\n    -    limiter la concentration des pollutions,\n    -    favoriser l’évaporation (en privilégiant le cheminement et le stockage de l’eau à ciel ouvert),\n    -    favoriser l’infiltration des eaux de pluie dans les secteurs où l’infiltration est possible (cf.\n    Annexe 5b– Carte de zonage pluvial).\nDifférentes techniques permettent d’atteindre cet objectif du «zéro rejet» d’eaux pluviales pour les\npluies courantes (jusqu’à la pluie annuelle) : toiture terrasse végétalisée, noue*, bassin sec, bassin en\neau, puisard, tranchée d’infiltration, stockage et réutilisation des eaux pluviales pour l’arrosage ou\npour le lavage des espaces extérieurs...\nEn particulier, ces techniques devront être mises en œuvre sur les aires de stationnement à aire libre.\nToutefois, lorsque la rétention de toutes les eaux de pluie sur la parcelle n’est pas possible, le\npropriétaire peut solliciter l’autorisation de raccorder ses eaux de ruissellement au réseau à la\ncondition que ses installations soient conformes aux prescriptions techniques définies par le règlement\nd’assainissement en vigueur.\nL’excédent d’eaux de ruissellement rejoignant le réseau est soumis à des limitations de débit de rejet,\nafin de limiter, à l’aval, les risques d’inondation ou de déversements d’eaux polluées au milieu naturel.\nConformément au règlement, communal et départemental, d’assainissement en vigueur :\nLe débit de fuite rejeté dans le réseau collecteur, ne doit pas excéder, pour une pluie de retour\ndécennal, 2 litres /seconde /hectare.\nDans le cas d’un rejet en Seine (directement ou via un réseau d’eau pluvial dont l’exutoire aval est la\nSeine), le débit de fuite rejeté ne doit pas excéder 10 l/s/ha.\nLe propriétaire ou l’aménageur doit justifier le dimensionnement suffisant des installations de rétention\nqu’il envisage d’installer en amont du raccordement, par la production de plans et notes de calcul\nappropriées.\nEn cas de rejet direct au milieu naturel, l’autorisation devra être accordée par l’autorité en charge de la\npolice de l’eau. Dans ce cas des installations de dépollution et/ou de limitation de débit peuvent\négalement être demandées.\nN 4-4. Eaux usées non domestiques\nLe raccordement des établissements déversant des eaux usées non domestiques au réseau public\nn'est pas obligatoire, conformément à l'article L 1331-10 du Code de la Santé Publique.\nToutefois, ces établissements peuvent être autorisés à déverser leurs eaux usées non domestiques\ndans le réseau public, dans la mesure où ces déversements correspondent aux conditions fixées par\nle règlement d’assainissement applicable en vigueur.\nTout projet de raccordement ou de rejet au réseau d’assainissement doit faire l'objet d'une demande\nadressée au service assainissement compétent.\n9\n    Service assainissement : assainissement@mairie-nanterre.fr\nP. 271 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    N\nN 4-5-Autres réseaux\nLes branchements de tous types ne doivent pas être apparents sur la construction.\nARTICLE N 5 – SUPERFICIE MINIMALE DES TERRAINS CONSTRUCTIBLES\nArticle supprimé par la loi ALUR du 24 mars 2014.\nARTICLE N 6 – IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX VOIES ET\nEMPRISES PUBLIQUES\nChamp d’application\nNe sont pas pris en compte pour l’application de la règle, sous de leur respect des normes relatives à\nla circulation routière et à la sécurité :\n •   les éléments de modénature, marquises, auvents, débords de toiture\n •   les balcons à partir de 6 mètres comptés depuis le niveau de l’espace public et ne dépassant pas\n    1 mètre de profondeur. La profondeur de 1 mètre pourra être réduite pour tenir compte de la\n    largeur de la voie.\n •   en cas de travaux sur des bâtiments existant les dispositifs techniques nécessaires à l’isolation\n    thermique par l’extérieur de moins de 0,20 m uniquement s’ils sont situés au-dessus du rez-de-\n    chaussée de la construction ; cette épaisseur est fixée à 0,30 m sans contrainte de hauteur pour\n    les constructions édifiées en recul ;\n •   dans le cas de constructions édifiées en recul :\n    o les parties enterrées des constructions;\n    o les rampes d’accès pour les personnes à mobilité réduite\n    o les rampes de garage.\n    o Et les escaliers d’accès et les perrons\nDispositions générales\nN 6-1 Les constructions doivent être implantées à l’alignement* ou en respectant un recul minimum de\n2 m.\nDispositions particulières\nN 6-2 Une implantation différente des dispositions fixées ci-dessus est admise si le projet est\nconcerné par l’un des cas suivants :\n    si la construction s’adosse à une construction principale mitoyenne, en bon état et de\n    dimensions égales ou supérieures sous réserve d’une meilleure intégration du projet dans le\n    paysage urbain ;\n       pour adapter la construction à la trame parcellaire ou à la configuration de la parcelle.\n       pour se conformer à l’article N 11-3.\nN 6-3 Pour tenir compte des éléments de patrimoines naturels ou bâtis repérés sur le plan de zonage\nau titre de l’article L.123-1-5-III-2° du code de l’urbanisme, une implantation particulière pourra être\nimposée si elle est nécessaire à leur préservation.\nN 6-4 Les dispositions de l’article N 6-1 ne s’appliquent pas aux extensions*, sous réserve que ces\ndernières soient réalisées dans le prolongement des murs de la construction existante, et à condition\nque cette implantation assure une meilleure intégration de la construction dans le paysage urbain\nqu’une implantation à l’alignement. L’extension ne peut pas avoir un recul par rapport à l’alignement\nsupérieur à celui de la construction existante.\n9 décembre 2025    / P. 272 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    N\nARTICLE N 7 – IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX LIMITES\nSEPARATIVES\nChamp d’application :\nNe sont pas pris en compte pour l’application de la règle :\n• les éléments de modénature, marquises, auvents, débords de toiture ;\n• en cas de travaux sur des bâtiments existants, les dispositifs techniques nécessaires à l’isolation\n   thermique par l’extérieur de moins de 0,30 mètre d’épaisseur ;\n• les parties enterrées des constructions;\n• les rampes d’accès pour les personnes à mobilité réduite ;\n• les perrons et escaliers d’accès ;\n• les rampes de garage.\nDispositions générales\nN 7-1 Les constructions doivent être implantées en respectant un retrait minimum de 6 mètres par\nrapport à toutes les limites séparatives.\nDispositions particulières\nN 7-2 Les dispositions figurant à l’article N 7-1 ne s’appliquent pas aux extensions* sous réserve que\nces dernières soient réalisées dans le prolongement des murs de la construction existante, et sans\nréduire le retrait existant, entre la construction et la limite séparative, non conforme aux dispositions\nde l’article N 7-1.\nToutefois, aucune baie* ne pourra être réalisée sur les façades des extensions ayant bénéficié de la\nprésente dérogation.\nN 7-3 Une implantation différente des dispositions fixées à l’article N 7-1 est admise si le projet est\nconcerné par l’un des cas suivants :\n    si la construction s’adosse à une construction principale mitoyenne, en bon état et de\n    dimensions égales ou supérieures sous réserve d’une meilleure intégration du projet dans le\n    paysage urbain ;\n       pour adapter la construction à la trame parcellaire ou à la configuration de la parcelle.\nN 7-4 Lorsque la limite séparative* correspond avec la limite d’une voie privée, les dispositions\nfigurant à l’article N 6 s’appliquent.\nN 7-5 Pour tenir compte des éléments de patrimoines naturels ou bâtis repérés sur le plan de zonage\nau titre de l’article L.123-1-5-III-2° du code de l’urbanisme, une implantation particulière pourra être\nimposée si elle est nécessaire à leur préservation.\nARTICLE N 8 – IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT\nAUX AUTRES SUR UNE MEME PROPRIETE\nIl n’est pas fixé de règle\nP. 273 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    N\nARTICLE N 9 – EMPRISE AU SOL* DES CONSTRUCTIONS\nChamp d’application\nL’application du présent article renvoie à la définition de l’emprise au sol dans le lexique (Titre II).\nDispositions générales\nL’emprise maximale des constructions est fixée à :\n     en secteur Na :\n    o 500 m² d’emprise au sol* par parc, pour les constructions d’intérêt collectif et\n    nécessaires à l’exploitation, l’entretien, l’usage et la mise en valeur du site ;\n    o 150 m² d’emprise au sol* pour les constructions d’habitation pour surveillance et\n    gardiennage, dans la limite d’un logement par parc départemental.\n    o 5 m² d’emprise au sol* par jardin pour les constructions liées aux jardins familiaux.\n       en secteur Nb : dans le périmètre situé le long de la Seine entre la rue Jean Perrin et la rue\n    des Peupliers, 150 m² d’emprise au sol* par unité foncière pour les constructions à destination\n    de loisirs, de restauration et de mise en valeur du site\n       en secteur Nc :\n    o 5 m² d’emprise au sol* par jardin pour les constructions liées aux jardins familiaux.\nARTICLE N 10 – HAUTEUR MAXIMALE DES CONSTRUCTIONS\nChamp d’application\nNe sont pas comptés dans la hauteur* maximale autorisée :\n   - les dispositifs techniques liés à la production d’énergies renouvelables dès lors qu’ils ne\n    dépassent pas une hauteur de 1,50 mètre et respectent les dispositions de l’article N 11-1\n   - les édicules techniques de 3 mètres de hauteur maximum, à condition qu’ils soient intégrés\n    dans un volume fermé ou masqués par un dispositif à claires voies et qu’ils soient implantés\n    en retrait des façades d’une distance au moins égale à leur hauteur.\n   - Les souches de cheminées de 3 mètres de hauteur maximale\n   - les cheminées des chaufferies collectives mutualisées à un ensemble de constructions\n   - les pylônes supports de lignes électriques ou d’antennes\nN 10-1 la hauteur* des constructions ne pourra dépasser :\n    en secteur Na :\n    o 7 mètres au point le plus haut pour les constructions d’intérêt collectif et nécessaires à\n    l’exploitation, l’entretien, l’usage et la mise en valeur du site\n    o 6 mètres au point le plus haut pour les constructions d’habitation pour surveillance et\n    gardiennage\n    o 3 mètres au point le plus haut pour les constructions liées aux jardins familiaux.\n       en secteur Nb : 5 mètres au point le plus haut.\n       en secteur Nc : 3 mètres au point le plus haut.\n9 décembre 2025    / P. 274 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    N\nARTICLE N 11 – ASPECT EXTERIEUR DES CONSTRUCTIONS ET AMENAGEMENT DE\nLEURS ABORDS AINSI QUE LES PRESCRIPTIONS DE NATURE A ASSURER LA\nPROTECTION DES ELEMENTS DE PAYSAGE, DES QUARTIERS, ILOTS, IMMEUBLES,\nESPACES PUBLICS, MONUMENTS, SITES ET SECTEURS A PROTEGER\nA titre d’information, un Cahier des Recommandations Architecturales, Urbaines et\nPaysagères, donnant des recommandations sur l’aspect extérieur des constructions et de leurs\nabords, et qui n’est pas opposable aux demandes d’autorisations d’urbanisme, est consultable en\nmairie et sur le site internet de la mairie.\nN 11-1 Aspect extérieur des constructions :\nPar leur volume, leur architecture, les matériaux employés, et leur couleur, les constructions et leurs\néventuels dispositifs liés aux énergies renouvelables doivent s’intégrer de manière harmonieuse dans\nle paysage naturel ou urbain dans lequel elles seront situées, et ne pas porter atteinte au caractère ou\nà l’intérêt des lieux avoisinants ainsi qu’à la conservation des perspectives monumentales.\nLes saillies*, dont les balcons, doivent avoir un rapport équilibré avec la façade*.\nLes dispositifs de production d’énergies renouvelables peuvent être visibles à condition d’être conçus\ncomme un élément à part entière de la composition architecturale du bâtiment, et notamment de la\ncomposition de ses façades.\nLa pose éventuelle de capteurs solaires doit être étudiée, notamment au regard de la composition de\nla façade*, et afin de favoriser leur intégration dans le plan de toiture.\nLes antennes, y compris les paraboles, doivent être installées de façon à réduire leur impact visuel,\nnotamment lorsqu’elles sont visibles depuis les voies ou les espaces publics.\nN 11-2 Toitures\nLe volume de la toiture doit être proportionné au volume de la construction.\nL’acrotère doit être accompagné d’une couvertine, d’une corniche simple ou de tout autre système afin\nde protéger le mur de façade des effets de ruissellement.\nLe garde-corps de sécurité devra être le plus discret possible : par relèvement de l’acrotère ou avec\nun procédé non opaque\nN 11-3 Façades*\nLes façades* latérales et postérieures des constructions doivent être traitées avec le même soin que\nles façades* principales et en harmonie avec elles.\nLa création de murs pignons aveugles donnant sur la rue est interdite.\nLes façades implantées en limites séparatives doivent être aveugles. Pour les autres façades, les\npignons aveugles doivent être évités.\nLes murs pignons aveugles doivent être traités avec le même soin que les façades* principales. La\nvégétalisation des murs pignons laissés apparents doit être recherchée.\nN 11-4 Descentes d’eaux pluviales :\nLes descentes d’eaux pluviales devront être intégrées dans la composition architecturale de la\nfaçade*. Les rejets d’eau pluviale des balcons, loggias et terrasses devront être canalisés de façon à\néviter toute salissure des façades et de l’espace public.\nN 11-5 Eléments de modénatures :\nLes façades* visibles depuis l’emprise publique doivent obligatoirement comporter des\nmodénatures telles que des bandeaux, corniches, encadrement de fenêtres, ainsi que des dispositifs\nd’occultation des baies tels que persiennes, volets battants ou coulissants, etc…\nLes modénatures et les dispositifs d’occultation des baies doivent participer à la définition du projet\narchitectural tant du point de vue esthétique que technique, et être en cohérence avec les\nconstructions avoisinantes.\nP. 275 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    N\nLes dispositifs de « goutte d’eau » ou larmiers, en sous face d’appui de fenêtre, ou équivalents, sont\nexigés pour limiter le ruissellement de l’eau sur les façades.\nN 11-6 Matériaux de façades:\nL’utilisation de matériaux et techniques pérennes, adaptés au caractère architectural du bâti, et\ncohérents avec les constructions existantes, doit être recherchée, tels que : enduit à la chaux, briques,\npierre, moellons, bois etc… Dans tous les cas, les matériaux et techniques utilisés doivent aboutir à\nune finition et une mise en œuvre de qualité.\nUne attention particulière est à porter au traitement du (des) matériau(x) de façade du rez-de-\nchaussée, qui se trouve en contact direct de l’espace public, afin de prévenir toute dégradation ou\nvieillissement anticipé.\nLes matériaux tels que carreaux de plâtre, briques creuses, parpaings, destinés à être recouverts d’un\nparement ou d’enduits, ne peuvent être laissés apparents sur les parements extérieurs des\nconstructions et sur les clôtures. L’enduit ciment est interdit.\nN 11-7 Les locaux techniques :\nIls doivent faire partie du projet architectural. Les coffrets ou dispositifs techniques, les colonnes\nsèches et les boîtes aux lettres devront être intégrés à la façade* ou à la clôture.\nLes colonnes sèches ne devront pas créer de saillies sur le domaine public et seront intégrées dans la\ncomposition architecturale de la façade.\nN 11-8 Clôtures\nElles doivent être implantées à l’alignement existant, ou projeté en cas d’emplacement réservé ou de\nplan d’alignement figurant sur le plan de zonage.\nIl est recommandé des clôtures végétalisées ou ajourées doublées d’une haie.\nElles doivent permettre ponctuellement le passage de la petite faune (notamment les hérissons), en\nprésentant a minima une ouverture ponctuelle en bas de clôture de format 15 x 15 cm, par tranche\nentamée de 15 mètres de linéaire de clôture, avec au minimum un passage lorsque le linéaire de\nclôture est inférieure à 15 mètres.\nLes portails doivent avoir une largeur minimale de 3 mètres.\nN 11-9 Bâtiments remarquables protégés, bâtiments et ensembles bâtis cohérents de qualité -\nart. L.123-1-5-III-2° du code de l’urbanisme, repéré au plan de zonage et dans les fiche annexé\nau présent règlement (prescriptions)\nRègles générales : L’architecture et la volumétrie des constructions existante présentant un intérêt\narchitectural, doivent être respectées lors de ravalement, de réhabilitation*. Toute extension* d’une\nconstruction, qu’elle soit d’architecture traditionnelle ou contemporaine, doit respecter l’architecture\nd’origine ou la mettre en valeur.\nPercements : La création de nouveaux percements doit s’intégrer dans la composition des façades*\n(reprise des proportions, du rythme et des éléments de modénature).\nFaçades* : Les murs en pierre ou briques prévus pour être apparents doivent être préservés. Les\ntravaux d’isolation thermique pour ces deux types de façade doivent être réalisés à l’intérieur de la\nconstruction.\nToiture : la réfection de toiture respectera le style de la construction existante.\nEn complément de ces prescriptions, les règles suivantes s’appliquent en fonction des catégories :\n•    1 / Bâtiments remarquables protégés – catégorie A :\n    • leur démolition est interdite, sauf justification pour raisons d’hygiène ou de sécurité ;\n    • les travaux de restauration* devront être privilégiés.\n    • Les travaux de réhabilitation et d’extension sont autorisés à condition de conserver et\n    mettre en valeur les caractéristiques du bâtiment.\n9 décembre 2025    / P. 276 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    N\n•    2 / Bâtiments de qualité – catégorie B :\n    • la démolition partielle est autorisée, sous réserve de ne pas supprimer le ou les éléments\n    qui caractérisent la qualité architecturale ou patrimoniale de la construction ;\n    • les travaux de restauration sont autorisés,\n    • les travaux de réhabilitation et d’extension sont autorisés à condition de conserver et\n    mettre en valeur les caractéristiques du bâtiment\n•    3 / Ensembles bâtis cohérents – catégorie B :\n    • La démolition partielle est autorisée, sous réserve de ne pas dénaturer la cohérence de\n    l’ensemble bâti ;\n    • les travaux de restauration sont autorisés à condition de respecter et mettre en valeur les\n    caractéristiques de l’ensemble bâti.\n    • Les travaux d’extension et de réhabilitation sont autorisés à condition de ne pas\n    dénaturer la cohérence avec les autres constructions de l’ensemble concerné.\nARTICLE N 12 – LES OBLIGATIONS IMPOSEES AUX CONSTRUCTEURS EN MATIERE\nDE REALISATION D’AIRES DE STATIONNEMENT\nLe stationnement des véhicules correspondant aux besoins des constructions et installations, ainsi\nque leurs zones de manœuvre, doivent être assurés en dehors des voies publiques.\nN 12-1 Stationnement pour les véhicules motorisés\n    Le nombre de places à réaliser doit être justifié dans la demande d’autorisation d’urbanisme, et\n    suffisant au regard des besoins nécessaires à la nature de l'équipement, son mode de\n    fonctionnement, le nombre et le type d'utilisateurs (employés, visiteurs, étudiants…) et sa\n    localisation dans la commune (proximité d'une gare, desserte en transports en commun, existence\n    ou non de parcs publics de stationnement à proximité...)\n    Les parcs de stationnement créés ou réaménagés doivent permettre une circulation satisfaisante\n    des véhicules répondant aux exigences de sécurité, de fonctionnalité, de praticabilité, et de confort.\n    Ils doivent prendre en compte les exigences réglementaires en matière de stationnement des\n    personnes à mobilité réduite et des stationnements des véhicules électriques et hybrides;\n    Les places commandées* ne sont pas prises en compte pour le calcul réglementaire du nombre\n    de places plancher à réaliser.\nN 12-2 - Normes techniques à respecter pour la réalisation des places de stationnement des\nautomobiles\nDimensions des places : les places créées ou réaménagées, ainsi que les boxes et garages, doivent\nrespecter les dimensions minimales suivantes :\n  - Longueur : 5 mètres\n  - Largeur : 2,30 mètres, portée à 2,50 mètres si la place jouxte un obstacle (mur, poteau…)\n  - Dégagement : 5,50 mètres\nDimension minimales des rampes et voies de circulation : les dimensions préconisées pour les\nrampes correspondent à des largeurs circulables, hors obstacles de plus de 10 cm de haut ou\nséparateur central.\n    Rampes et voies de circulation\n    Parking concerné    Circulation autorisée    Rampe et voie droite    Rampe et voie courbe\n    Jusqu’à 50 places    Sens unique ou    3 mètres    3,50 mètres\n    Double sens alterné*\n    Plus de 50 places    sens unique    3 mètres    3,50 mètres\n    double sens    5 mètres    6 mètres\nLe double sens alterné n’est pas autorisé pour les parkings de plus de 50 places.\nP. 277 / 280 /","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    N\nN 12-3 Stationnement des deux-roues motorisés\nDes places de stationnement doivent être réalisées, en nombre suffisant au regard des besoins\nnécessaires à la nature de l'équipement, son mode de fonctionnement, le nombre et le type\nd'utilisateurs (employés, visiteurs, …) et sa localisation dans la commune (proximité d'une gare,\ndesserte en transports en commun, existence ou non de parcs publics de stationnement à\nproximité...).\nN 12-4 Stationnement des vélos :\nDes places de stationnement doivent être réalisées, en nombre suffisant au regard des besoins\nnécessaires à la nature de l'équipement, son mode de fonctionnement, le nombre et le type\nd'utilisateurs prévus et sa localisation dans la commune (proximité d'une gare, desserte en transports\nen commun, existence ou non de parcs publics de stationnement à proximité...).\nElles doivent être couvertes, exclusivement réservées aux vélos, sécurisées et équipées de dispositifs\nfixes d’accroche, facilitant la performance des systèmes d’antivols.\nN 12-5 : Locaux de stockage des conteneurs à déchets\nL’emplacement des locaux de stockage des conteneurs sera correctement accessible et\nconvenablement dimensionné pour répondre aux besoins de l’immeuble, de manière à assurer les\ncollectes suivantes : ordures ménagères, multi matériaux, objets encombrants. Des précisions\ntechniques plus précises concernant l’aménagement de ces locaux figurent en annexe du règlement.\nARTICLE N 13 – LES OBLIGATIONS IMPOSEES AUX CONSTRUCTEURS EN MATIERE\nDE REALISATION D’ESPACES LIBRES, D’AIRES DE JEUX ET DE LOISIRS ET DE\nPLANTATIONS\nN 13-1 – Superficie du terrain destinée aux espaces libres et aux espaces verts\nLes espaces libres non affectés aux voies et aux cheminements doivent être aménagés en espaces\nverts de pleine terre.\nLes revêtements des chemins et voies exclusivement dédiés aux piétons et aux cyclistes doivent être\nperméables.\nN 13.2 – Les éléments de paysage non bâtis repérés au titre de l’article L.123-1-5-III-2° du code\nde l’urbanisme.\nEn application de l’article R.421-23 du Code de l’urbanisme, les travaux ayant pour effet de porter\natteinte ou de supprimer un élément de paysage doivent obligatoirement faire l’objet d’une déclaration\npréalable de travaux.\n    - Les alignements d’arbres protégés et les arbres remarquables :\nL’abattage, l’élagage et toute autre atteinte à l’intégrité de ces arbres (racines etc…) est interdit, sauf :\n- en cas de risque pour la sécurité des personnes et des biens, ou en cas d’une expertise\nphytosanitaire démontrant un mauvais état de l’arbre,\n- pour permettre l’accès au terrain, à condition de démontrer qu’il n’y a pas d’autre possibilité d’accès.\nEn cas d’abattage d’un arbre remarquable, une compensation est exigée par la plantation d’un arbre\nde développement équivalent.\nAucune construction ne peut être implantée à moins de 4 mètres du collet (base du tronc au niveau du\nsol) d’un arbre remarquable.\nARTICLE N 14 – COEFFICIENT D’OCCUPATION DES SOLS\nArticle supprimé par la loi ALUR du 24 mars 2014.\n9 décembre 2025    / P. 278 / 280","Plan Local d’Urbanisme / Ville de Nanterre / EPT POLD\nRèglement Partie 1\n    N\n Article N 15 - OBLIGATIONS IMPOSEES AUX CONSTRUCTIONS, TRAVAUX,\n INSTALLATIONS ET AMENAGEMENTS, EN MATIERE DE PERFORMANCES\n ENERGETIQUES ET ENVIRONNEMENTALES\n Les extensions de faible envergure (extension d’un bâtiment existant de surface inférieure à 150m² et\n à 30% de la surface du bâtiment existant) n’entrent pas dans le champ d’application de l’article 15.\n 15.1 Rénovation de bâtiments existants\n Les opérations de rénovation devront rechercher à atteindre les objectifs de performance\n énergétique ci-dessous, lorsque les éléments suivants seront remplacés ou installés.\n    Critère d'Analyse    Objectifs\n    Parois    U:    Coefficient    de R :   Résistance    thermique\n    transmission    thermique [m².K/W]**\n    surfacique    des    parois\n    [W/(m².K)]*\n    Mur    Umur≤ 0,25 quand l’isolation Rmur ≥ 4 quand l’isolation par\n    par l’extérieu function pdfLink(p){

    const part=DATA.pdf.parts.find(r=>p>=r[0]&&p<=r[1]);

  }
  return encodeURI(DATA.pdf.local)+'#page='+p;
}

  <div class="meta">${s.z?`<span class="chip">Zona ${esc(s.z)}</span>`:''} ${chips(s)} <span>págs. ${s.p}–${Math.max(s.q,s.p)}${s.a?' (posición aproximada)':''}</span></div>
  <div class="btns no-print" style="margin-bottom:14px">${pdfBtn(s.p)} ${i>0?`<a class="b" href="#s/${i-1}">← Anterior</a>`:''} ${i<S.length-1?`<a class="b" href="#s/${i+1}">Siguiente →</a>`:''}</div>
  ${k.length?`<div class="box sub-list"><h3>Contenido de esta sección</h3>${k.map(j=>`<a href="#s/${j}">${esc(S[j].t)} <span class="pg" style="color:var(--muted);font-size:12px">p. ${S[j].p}</span></a>`).join('')}</div>`:''}
  <div class="box notes no-print"><h3>Mis notas</h3><textarea id="note" placeholder="Notas sobre esta sección (se guardan en este navegador)">${esc(notes[i]||'')}</textarea></div>
  <h3 style="font-size:14px;color:var(--muted);margin:18px 0 8px">TEXTO OFICIAL (extraído del PDF; tablas y figuras: ver el PDF)</h3>
  ${pagesHtml(s.p,end,s.t)}`;
  bindMore();
  $('#fav').onclick=()=>{if(favs[i]) delete favs[i]; else favs[i]=1; store.set('favs',favs); $('#fav').classList.toggle('on')};
  $('#note').oninput=e=>{notes[i]=e.target.value; if(!notes[i]) delete notes[i]; store.set('notes',notes)};
  window.scrollTo(0,0);
}
function secsFor(th){
  return S.filter(s=>s.th.includes(th));
}
function viewProy(id){
  const P=PROY.find(p=>p.id===id);
  const tabs=`<div class="pj-tabs">${PROY.map(p=>`<a href="#proy/${p.id}" class="${p.id===id?'on':''}"><b>${esc(p.nom)}</b><span>${esc(p.sub)}</span></a>`).join('')}</div>`;
  if(!P){$('#main').innerHTML=`<h1 class="st">¿Qué proyecto tienes?</h1><p>Elige el tipo de obra. Te digo qué artículos de este ${DATA.k.startsWith('pold')?'PLU':'PLUi'} consultar, por orden, y puedes marcarlos a medida que los revisas.</p>${tabs}`;return}
  const ck=checks[id]||{};
  let total=0,done=0;
  const zsel=DATA.zones.length?`<div class="zsel"><span style="font-size:13px;color:var(--muted)">Tu zona:</span><span class="chip ${zone===''?'on':''}" data-z="">sin elegir</span>${DATA.zones.map(z=>`<span class="chip ${zone===z?'on':''}" data-z="${esc(z)}">${esc(z)}</span>`).join('')}</div>`:'';
  const groups=P.grupos.map(([th,txt])=>{
    let list=secsFor(th).filter(s=>!s.z||!zone||s.z===zone);
    // prefer most specific: drop parents whose children also listed
    const ids=new Set(list.map(s=>s.i));
    list=list.filter(s=>!kids[s.i].some(j=>ids.has(j)));
    const common=list.filter(s=>!s.z), zl=list.filter(s=>s.z);
    const item=s=>{total++; const ok=ck[s.i]; if(ok) done++; return `<div class="pj-a ${ok?'ok':''}"><input type="checkbox" data-ck="${s.i}" ${ok?'checked':''}><a href="#s/${s.i}">${esc(s.t)}${s.z?`<span class="zn">${esc(s.z)}</span>`:''}<span class="tt">p. ${s.p} · ${esc(crumb(s).replace(/<[^>]+>/g,''))}</span></a></div>`};
    let body='';
    if(common.length) body+=`<div style="font-size:12px;color:var(--muted);margin-top:6px">Comunes a todas las zonas</div>`+common.slice(0,12).map(item).join('')+(common.length>12?`<div class="empty">… y ${common.length-12} más en <a href="#temas/${th}">Por tema</a></div>`:'');
    if(zl.length) body+=`<div style="font-size:12px;color:var(--muted);margin-top:6px">${zone?'Zona '+esc(zone):'Por zona (elige tu zona arriba para filtrar)'}</div>`+zl.slice(0,zone?30:10).map(item).join('')+(!zone&&zl.length>10?`<div class="empty">… y ${zl.length-10} más: elige tu zona.</div>`:'');
    if(!body) body=`<div class="empty">No he encontrado un artículo con este tema en el índice. Usa el buscador (arriba) con palabras clave.</div>`;
    return `<div class="box pj-g"><h3>${esc(TH[th])}</h3><div class="reg">${esc(txt)}</div>${body}</div>`;
  }).join('');
  $('#main').innerHTML=`${tabs}<h1 class="st">${esc(P.nom)}</h1>
  <div class="pj-cols"><div class="box"><h3>Trámite</h3><ul>${P.tramite.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="box"><h3>Antes de leer el reglamento</h3><ul>${P.antes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
  ${zsel}
  <div class="pj-bar"><div class="pj-prog"><i style="width:${total?Math.round(done*100/total):0}%"></i></div><span style="font-size:13px">${done} de ${total} revisados</span><button id="pjReset">Desmarcar todo</button><button onclick="print()">Imprimir</button></div>
  <div class="warn">La lista se genera por tema a partir del índice del reglamento. Confirma siempre en el texto y en el plano de zonificación; algunos artículos tratan varios temas a la vez.</div>
  ${groups}`;
  $('#main').querySelectorAll('[data-z]').forEach(e=>e.onclick=()=>{zone=e.dataset.z; store.set('zone',zone); renderFilters(); renderTree(); viewProy(id)});
  $('#main').querySelectorAll('[data-ck]').forEach(e=>e.onchange=()=>{const c=checks[id]=checks[id]||{}; if(e.checked) c[e.dataset.ck]=1; else delete c[e.dataset.ck]; store.set('checks',checks); viewProy(id)});
  $('#pjReset').onclick=()=>{checks[id]={}; store.set('checks',checks); viewProy(id)};
}
function viewTemas(th){
  const list=DATA.themes.map(([k,l])=>`<a class="chip ${k===th?'on':''}" href="#temas/${k}">${esc(l)} (${secsFor(k).length})</a>`).join(' ');
  let body='';
  if(th){
    const ss=secsFor(th).filter(s=>!zone||!s.z||s.z===zone);
    body=`<h2 style="font-size:18px">${esc(TH[th])}${zone?' · zona '+esc(zone):''}</h2>`+(ss.map(s=>`<div class="r" onclick="location.hash='#s/${s.i}'"><span class="cd">p. ${s.p}</span>${esc(s.t)} ${s.z?`<span class="chip">${esc(s.z)}</span>`:''}<div class="sn">${esc(crumb(s).replace(/<[^>]+>/g,''))}</div></div>`).join('')||'<div class="empty">Ninguna sección del índice. Prueba el buscador.</div>');
  }
  $('#main').innerHTML=`<h1 class="st">Por tema</h1><p>Secciones del reglamento agrupadas por tema (según su título).${DATA.zones.length?' Si eliges tu zona en el panel izquierdo, se ocultan las de otras zonas.':''}</p><div class="th-l" style="margin-bottom:14px">${list}</div><div class="results">${body}</div>`;
}
function secOfPage(p){let best=null;S.forEach(s=>{if(s.p<=p&&(!best||s.p>=best.p))best=s});return best}
function viewSearch(q){
  const nq=norm(q).trim(); if(nq.length<2){viewHome();return}
  const terms=nq.split(/\s+/);
  const res=[];
  const tit=S.filter(s=>terms.every(t=>norm(s.t).includes(t)));
  for(let i=0;i<DATA.pages.length&&res.length<300;i++){
    const np=NP[i]; if(terms.every(t=>np.includes(t))){
      const j=np.indexOf(terms[0]); const raw=DATA.pages[i]; const a=Math.max(0,j-90);
      res.push({p:i+1,sn:raw.slice(a,a+260).replace(/\s+/g,' ')});
    }
  }
  const hl=t=>{let h=esc(t);terms.forEach(x=>{if(x.length<2)return;const re=new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');h=h.replace(re,m=>`<mark>${m}</mark>`)});return h};
  $('#main').innerHTML=`<h1 class="st">Resultados para «${esc(q)}»</h1>
  ${tit.length?`<div class="box"><h3>En títulos de secciones (${tit.length})</h3>${tit.slice(0,40).map(s=>`<div class="r" onclick="location.hash='#s/${s.i}'"><span class="cd">p. ${s.p}</span>${esc(s.t)}</div>`).join('')}</div>`:''}
  <div class="results"><h3 style="font-size:14px;color:var(--muted)">EN EL TEXTO: ${res.length}${res.length>=300?'+':''} páginas</h3>${res.map(r=>{const s=secOfPage(r.p);return `<div class="r" data-p="${r.p}" data-s="${s?s.i:''}"><span class="cd">p. ${r.p}</span>${s?esc(s.t):''}<div class="sn">… ${hl(r.sn)} …</div></div>`}).join('')}</div>`;
  $('#main').querySelectorAll('.results .r[data-p]').forEach(e=>e.onclick=()=>{location.hash='#p/'+e.dataset.p});
}
function viewPage(p){
  p=Math.max(1,Math.min(DATA.npages,p)); const s=secOfPage(p);
  $('#main').innerHTML=`<div class="crumb">${s?crumb(s)+(crumb(s)?' › ':'')+`<a href="#s/${s.i}">${esc(s.t)}</a>`:''}</div><h1 class="st">Página ${p}</h1>
  <div class="btns no-print" style="margin-bottom:14px">${pdfBtn(p)} ${p>1?`<a class="b" href="#p/${p-1}">← p. ${p-1}</a>`:''} ${p<DATA.npages?`<a class="b" href="#p/${p+1}">p. ${p+1} →</a>`:''}</div>${pagesHtml(p,p)}`;
  const q=$('#q').value; if(q){const terms=norm(q).split(/\s+/).filter(x=>x.length>1); const pre=$('#main pre'); let h=pre.innerHTML; terms.forEach(x=>{const re=new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'); h=h.replace(re,m=>`<mark>${m}</mark>`)}); pre.innerHTML=h}
  window.scrollTo(0,0);
}
function viewNotas(){
  const f=Object.keys(favs).map(Number).filter(i=>S[i]); const n=Object.keys(notes).map(Number).filter(i=>S[i]);
  $('#main').innerHTML=`<h1 class="st">Mis notas y favoritos</h1><p class="empty">Se guardan solo en este navegador.</p>
  <div class="box"><h3>Favoritos (${f.length})</h3>${f.map(i=>`<div class="r" onclick="location.hash='#s/${i}'"><span class="cd">p. ${S[i].p}</span>${esc(S[i].t)}</div>`).join('')||'<div class="empty">Marca secciones con ★.</div>'}</div>
  <div class="box"><h3>Notas (${n.length})</h3>${n.map(i=>`<div class="r" onclick="location.hash='#s/${i}'"><span class="cd">p. ${S[i].p}</span>${esc(S[i].t)}<div class="sn">${esc(notes[i])}</div></div>`).join('')||'<div class="empty">Escribe notas en cualquier sección.</div>'}</div>`;
}
function viewHome(){
  const top=S.filter(s=>s.l===0);
  $('#main').innerHTML=`<h1 class="st">${esc(DATA.nom)}</h1>
  <div class="box"><div class="kv"><b>Documento</b><span>Reglamento escrito del ${DATA.k.startsWith('pold')?'PLU':'PLUi'} (${DATA.npages} páginas)</span><b>Estado</b><span>${esc(DATA.estado)}</span><b>Municipios</b><span>${esc(DATA.communes)}</span><b>Fuente</b><span><a href="${DATA.pdf.url}" target="_blank" rel="noopener">Géoportail de l'urbanisme (PDF oficial)</a></span></div></div>
  <div class="box"><h3>Cómo usarlo</h3><ul style="margin:0;padding-left:18px">
   <li><b>Por proyecto</b>: elige el tipo de obra y tu zona; te lista los artículos a revisar, por orden, con casillas.</li>
   <li><b>Explorar</b>: índice completo a la izquierda; cada sección muestra el texto oficial y el botón para abrir el PDF en esa página.</li>
   <li><b>Buscador</b>: busca en las ${DATA.npages} páginas (palabras en francés: <i>hauteur, clôture, pleine terre…</i>).</li>
   <li><b>Tu zona</b>: mírala en el <a href="https://www.geoportail-urbanisme.gouv.fr/map/" target="_blank" rel="noopener">mapa del Géoportail de l'urbanisme</a> (clic en la parcela) o en los planos de zonificación de la carpeta <i>Reglement</i>.</li></ul></div>
  <div class="pj-tabs">${PROY.map(p=>`<a href="#proy/${p.id}"><b>${esc(p.nom)}</b><span>${esc(p.sub)}</span></a>`).join('')}</div>
  <div class="box sub-list"><h3>Partes del reglamento</h3>${top.map(s=>`<a href="#s/${s.i}">${esc(s.t)} <span style="color:var(--muted);font-size:12px">p. ${s.p}</span></a>`).join('')}</div>
  <div class="box no-print"><h3>Abrir el PDF</h3><p style="font-size:13.5px;margin:0 0 8px">Los botones «Abrir en el PDF» usan: <b>${pdfMode==='local'?'tu copia en el PC (carpeta Reglement junto a este archivo)':'el PDF oficial en internet'}</b>.</p><button id="pdfToggle">Usar ${pdfMode==='local'?'el PDF en internet':'mi copia local'}</button></div>
  ${HOME_URL?`<p><a href="${HOME_URL}">← Volver al mapa de territorios</a></p>`:''}`;
  $('#pdfToggle').onclick=()=>{pdfMode=pdfMode==='local'?'online':'local'; store.set('pdfmode',pdfMode); viewHome(); toast('PDF: '+(pdfMode==='local'?'copia local':'internet'))};
}
const NP=DATA.pages.map(norm);
let qt;
$('#q').addEventListener('input',e=>{clearTimeout(qt); qt=setTimeout(()=>{const v=e.target.value.trim(); if(v.length>=2) location.hash='#q/'+encodeURIComponent(v); else if(!v) location.hash='#home'},350)});
function route(){
  const h=decodeURIComponent(location.hash.slice(1)||'home');
  const [v,a]=[h.split('/')[0],h.split('/').slice(1).join('/')];
  document.querySelectorAll('#tabs a').forEach(x=>x.classList.toggle('on',x.dataset.t===(v==='q'||v==='p'?'':v)));
  if(v==='s') viewSec(+a||0);
  else if(v==='proy') viewProy(a);
  else if(v==='temas') viewTemas(a);
  else if(v==='q'){ if($('#q').value!==a) $('#q').value=a; viewSearch(a)}
  else if(v==='p') viewPage(+a);
  else if(v==='notas') viewNotas();
  else viewHome();
}
window.addEventListener('hashchange',route);
renderFilters(); renderTree(); route();
</script>
</body>
</html>
