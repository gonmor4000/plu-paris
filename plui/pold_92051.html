INE\n   1- Les différentes canalisations de transport intéressant la commune de NEUILLY-SUR-SEINE\n    La commune de NEUILLY-SUR-SEINE est concernée par une canalisation sous pression de transport de\n  matières dangereuses, réglementée par l'arrêté du 4 août 2006 (NOR: INDI0608092A) du ministre d'Etat, ministre\n  de l'intérieur et de l'aménagement du territoire, du ministre des transports, de l'équipement, du tourisme et de la mer\n  et du ministre délégué à l'industrie. Il s'agit de canalisations de transport de gaz exploitées par la société GRTgaz.\n    Le tracé est donné sur la carte ci-après. Pour toute infonnation complémentaire et notamment obtenir une carte\n  des tracés avec une échelle plus fine, il conviendra de se rapprocher directement de l'exploitant dont les coordonnées\n  sont indiquées ci-dessous :\n    GRTgaz\n    Région Val de Seine\n    (26 rue de Calais- 75436 PARIS CEDEX 09\n    TEL.: 01.40.23.36.36)\n    Les renseignements mentionnés sur cette carte ne sauraient engager les organismes ayant contribué à son\n élaboration. Il s'agit d'un document infonnatif. La position mentionnée ne pennet pas la localisation précise sur le\n terrain de certaines catégories de canalisations. Pour tous travaux à proximité des canalisations de transport, il est\n nécessaire d'effectuer auprès de l'exploitant concerné une demande de renseignement ou une déclaration d'intention de\n commencement de travaux confonnément au décret n° 91-1147 du 14 octobre 1991 et à son arrêté d'application du\n 16 novembre 1994 ou de tout autre texte pouvant s'y substituer. De manière générale, les personnes souhaitant des\n infonnations plus précises sur les réseaux de canalisations sous pression sont invitées à se rapprocher de leurs\n exploitants respectifs.\n 2- Maîtrise de l'urbanisation\n Les contraintes en matière d'urbanisme concernent les projets nouveaux relatifs aux établissements recevant du public\n (ERP) les plus sensibles et aux immeubles de grande hauteur (IGH). Ces contraintes s'apprécient au regard des\n informations figurant dans le tableau ci-après et qui sont issues des distances génériques disponibles pour le gaz :\n Canalisations de transport de gaz exploitées par la société GRTgaz\n    Zones justifiant des restrictions en matière de    Zone justifiant vigilance\n    développement de l'urbanisation    et information\n    Zone permanente\n   Caractéristiques des    Zone intennédiaire où des\n    d'interdiction de toutes\n    canalisations    restrictions de construction ou Zone d'infonnation du\n    nouvelles constructions ou\n    d'extension d'IGH et d'ERP    transporteur de tout\n    extensions d'IGH et d'ERP susceptibles de recevoir plus\n    projet d'urbanisme\n    susceptibles de recevoir    de l 00 personnes existent\n    plus de l 00 personnes\n DN 500 et PMS 23,9 bar    Sm    110m    145m\n DN 200 et PMS 40 bar    Sm    35 m    50m\nCes distances s'entendent de part et d'autre de l'axe de la canalisation considérée. En gras : Les distances indiquées sont à\nconsidérer avec précaution car prises pour une PMS de 25 bar (au lieu de 23,9 bar)."," Zones justifiant des restrictions en matière de développement de l'urbanisation\n La première distance délimite la zone dans laquelle toutes constructions ou extensions d'IGH et ERP susceptibles de\n recevoir plus de 100 personnes sont interdites sans qu'il ne soit possible de revenir dessus.\nLa zone intennédiaire nécessite que l'aménageur de chaque projet engage une étude pour s'assurer que les conditions\nde sécurité sont satisfaisantes au regard des risques présentés. Cette étude repose sur les caractéristiques de l'ouvrage\nde transport, de son environnement mais aussi du projet envisagé et du respect de certaines contraintes en matière\nde sécurité (modalité d'évacuation des personnes... ). En outre, la mise en œuvre de mesure compensatoire de type\nphysique sur l'ouvrage de transport (protection mécanique par dalle béton... ) destinée à réduire l'emprise de cette zone\nen limitant la principale source de risque d'accident (travaux tiers) est à privilégier. Cependant, malgré la mise en\nplace de mesures compensatoires et dans certaines conditions, l'interdiction de construction.ou d'extension d'IGH et\nd'ERP susceptibles de recevoir plus de 100 personnes peut intervenir. La DR.IRE devra être consultée a minima lors\nde la procédure de demande de permis de construire.\nZone justifiant vigilance et information\nLa distance la plus grande définit la zone dans laquelle une information du transporteur doit être réalisée pour tout\nprojet d'urbanisme. Cette démarche doit permettre au transporteur de suivre l'évolution de l'environnement à\nproximité de ses ouvrages afin de renforcer le cas échéant leur niveau de sécurité.\nEn outre, cette zone doit servir de référence pour l'élaboration du plan communal de sauvegarde (PCS) et, le cas\néchéant, du document d'information communal sur les risques majeurs (DICRIM).\nD'une manière générale et afin d'anticiper toutes difficultés, il convient d'avertir le plus en amont possible le\ntransporteur de tout projet situé dans les zones figurant dans le tableau ci-dessus.","","    PIECE N°4.2.5\n    PERIMETRE\nDELIMITANT LES MAJORATIONS DES REGLES\n DE CONSTRUCTION POUR LES LOGEMENTS\nLIBRES ET SOCIAUX EN VERTU DES ARTICLES\n    L.127-1 ET L.123-1-11 DU CODE DE\n    L’URBANISME\n    35",""],"themes":[["def","Definiciones / léxico"],["dest","Usos y destinos"],["mix","Mixidad social / funcional"],["voies","Implantación respecto a la calle"],["lim","Implantación respecto a linderos"],["meme","Varios edificios en la misma parcela"],["emp","Ocupación del suelo (emprise au sol)"],["haut","Altura"],["asp","Aspecto exterior, fachadas, cubiertas, cercas"],["verde","Espacios libres, pleine terre, vegetación"],["ener","Energía y medio ambiente (bioclimático)"],["stat","Aparcamiento (coches y bicis)"],["res","Accesos, redes, agua, residuos"],["patr","Patrimonio protegido"],["risq","Riesgos y molestias"],["gen"," function viewNotas(){
  const f=Object.keys(favs).map(Number).filter(i=>S[i]); const n=Object.keys(notes).map(Number).filter(i=>S[i]);
  $('#main').innerHTML=`<h1 class="st">Mis notas y favoritos</h1><p class="empty">Se guardan solo en este navegador.</p>
  <div class="box"><h3>Favoritos (${f.length})</h3>${f.map(i=>`<div class="r" onclick="location.hash='#s/${i}'"><span class="cd">p. ${S[i].p}</span>${esc(S[i].t)}</div>`).join('')||'<div class="empty">Marca secciones con ★.</div>'}</div>
  <div class="box"><h3>Notas (${n.length})</h3>${n.map(i=>`<div class="r" onclick="location.hash='#s/${i}'"><span class="cd">p. ${S[i].p}</span>${esc(S[i].t)}<div class="sn">${esc(notes[i])}</div></div>`).join('')||'<div class="empty">Escribe notas en cualquier sección.</div>'}</div>`;
}
function viewHome(){
  const top=S.filter(s=>s.l===0);
  $('#main').innerHTML=`<h1 class="st">${esc(DATA.nom)}</h1>
  <div class="box"><div class="kv"><b>Documento</b><span>Reglamento escrito del ${DATA.k.startsWith('pold')?'PLU':'PLUi'} (${DATA.npages} páginas)</span><b>Estado</b><span>${esc(DATA.estado)}</span><b>Municipios</b><span>${esc(DATA.communes)}</span><b>Fuente</b><span><a href="${DATA.pdf.url}" target="_blank" rel="noopener">Géoportail de l'urbanisme (PDF oficial)</a></span></div></div>
  <div class="box"><h3>Cómo usarlo</h3><ul style="margin:0;padding-left:18px">
   <li><b>Por proyecto</b>: elige el tipo de obra y tu zona; te lista los artículos a revisar, por orden, con casillas.</li>
   <li><b>Explorar</b>: índice completo a la izquierda; cada sección muestra el texto oficial y el botón para abrir el PDF en esa página.</li>
   <li><b>Buscador</b>: busca en las ${DATA.npages} páginas (palabras en francés: <i>hauteur, clôture, pleine terre…</i>).</li>
   <li><b>Tu zona</b>: mírala en el <a href="https://www.geoportail-urbanisme.gouv.fr/map/" target="_blank" rel="noopener">mapa del Géoportail de l'urbanisme</a> (clic en la parcela) o en los planos de zonificación de la carpeta <i>Reglement</i>.</li></ul></div>
  <div class="pj-tabs">${PROY.map(p=>`<a href="#proy/${p.id}"><b>${esc(p.nom)}</b><span>${esc(p.sub)}</span></a>`).join('')}</div>
  <div class="box sub-list"><h3>Partes del reglamento</h3>${top.map(s=>`<a href="#s/${s.i}">${esc(s.t)} <span style="color:var(--muted);font-size:12px">p. ${s.p}</span></a>`).join('')}</div>
  <div class="box no-print"><h3>Abrir el PDF</h3><p style="font-size:13.5px;margin:0 0 8px">Los botones «Abrir en el PDF» usan: <b>${pdfMode==='local'?'tu copia en el PC (carpeta Reglement junto a este archivo)':'el PDF oficial en internet'}</b>.</p><button id="pdfToggle">Usar ${pdfMode==='local'?'el PDF en internet':'mi copia local'}</button></div>
  ${HOME_URL?`<p><a href="${HOME_URL}">← Volver al mapa de territorios</a></p>`:''}`;
  $('#pdfToggle').onclick=()=>{pdfMode=pdfMode==='local'?'online':'local'; store.set('pdfmode',pdfMode); viewHome(); toast('PDF: '+(pdfMode==='local'?'copia local':'internet'))};
}
const NP=DATA.pages.map(norm);
let qt;
$('#q').addEventListener('input',e=>{clearTimeout(qt); qt=setTimeout(()=>{const v=e.target.value.trim(); if(v.length>=2) location.hash='#q/'+encodeURIComponent(v); else if(!v) location.hash='#home'},350)});
function route(){
  const h=decodeURIComponent(location.hash.slice(1)||'home');
  const [v,a]=[h.split('/')[0],h.split('/').slice(1).join('/')];
  document.querySelectorAll('#tabs a').forEach(x=>x.classList.toggle('on',x.dataset.t===(v==='q'||v==='p'?'':v)));
  if(v==='s') viewSec(+a||0);
  else if(v==='proy') viewProy(a);
  else if(v==='temas') viewTemas(a);
  else if(v==='q'){ if($('#q').value!==a) $('#q').value=a; viewSearch(a)}
  else if(v==='p') viewPage(+a);
  else if(v==='notas') viewNotas();
  else viewHome();
}
window.addEventListener('hashchange',route);
renderFilters(); renderTree(); route();
</script>
</body>
</html>
