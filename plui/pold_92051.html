\n7.3 - Cas des façades comportant des baies principales* et non parallèles aux limites\nséparatives*\n- la distance comptée horizontalement au milieu de la façade à la limite séparative doit être au\nmoins égale à la hauteur de cette façade, sans pouvoir être inférieure à 12 mètres,\nEt\n- la distance comptée horizontalement de la façade à la limite séparative doit être au moins\négale aux 3/4 de la hauteur de cette façade, sans pouvoir être inférieure à 9 mètres.\n    74","7.4 - Cas des bâtiments \"références\"*\na) La conservation des bâtiments \"référence\", ou parties de bâtiments \"référence\"* pourra être\nimposée.\nDans ce cas, les bâtiments conservés pourront être réhabilités ou maintenus dans leur\nimplantation existante, nonobstant les règles générales de la zone.\nb) Dans les cas suivants :\n- Extension du bâtiment référence,\n- Reconstruction d'une partie d'un bâtiment référence ou d'une annexe* présentant un intérêt\nmoindre au regard des critères qui auront déterminé le classement du bâtiment principal,\n- Construction nouvelle secondaire,\n- Reconstruction en cas de démolition autorisée pour des motifs architecturaux,\nL’implantation de la construction nouvelle devra respecter les règles générales de la zone\ndéfinies aux articles UC 7.1, 7.2 et 7.3 sans altérer le caractère du bâtiment \"référence\" lui-\nmême et en préservant l'intérêt des lieux avoisinants.\nc) dans le cas de sinistre ou péril d'un bâtiment \"référence\" la reconstruction sera imposée à\nl'identique.\nCependant si cette reconstruction à l'identique ne peut être mise en œuvre, une construction\nnouvelle de qualité pourra remplacer le bâtiment \"référence\" disparu, dans le respect des\nrègles générales d'implantation de la zone et de l'intérêt des lieux avoisinants.\n7.5 - Cas d’unités foncières d'angle\nA l'angle des voies les prescriptions susvisées restent applicables.\nCependant, lorsque des reculements figurent au plan, on considère que la largeur de l’unité\nfoncière est égale à la distance mesurée respectivement entre le reculement imposé et la limite\nséparative opposée.\nLes constructions peuvent être implantées sur les limites séparatives lorsque cette distance\nest inférieure ou égale à 15 mètres.\n7.6 - Modalités d'application\nSe reporter à la définition de Hauteur*\n7.7 – Saillies* et encorbellements* dans les marges d'isolement* (latérales et arrières)\ndans le respect de l'article UC 11\nDans les marges d’isolements définies aux articles UC 7.1, 7.2 et 7.3, constructions en\nsuperstructure sont interdites à l'exception des encorbellements, et des saillies ; les\nconstructions en infrastructure y sont autorisées.\nLes saillies et encorbellements ne sont autorisés que lorsque la distance séparant la façade*\nde la construction projetée à la limite séparative* opposée est supérieure ou égale à 12 mètres.\nIls sont soumis aux règles suivantes :\n- la partie inférieure de la saillie ou de l’encorbellement doit être située à une hauteur au moins\négale à 2,60 mètres au-dessus du terrain au droit de la saillie.\n- la profondeur de la saillie ou de l’encorbellement ne peut excéder le dixième de la distance\nentre la façade et la limite séparative et 1,40 mètre.\n    75","7.8 - Servitude de cour commune\nLes constructions peuvent être implantées à une distance moindre que celle définie ci-dessus,\nlorsque les deux propriétaires voisins, par acte authentique, s'obligent réciproquement à créer\nune servitude de cour commune au sens de l'article L.471-1 à L.471-3 du Code de l'Urbanisme\nou lorsqu'elle est instituée par voie judiciaire.\nEn outre, l’édification d’une construction en limite de cour commune doit respecter les\ndispositions de l’article UC 8 par rapport aux constructions situées sur l’unité foncière voisine\nconcernée par ladite servitude.\n7.9 – Courettes\nLes constructions pourront ne pas respecter les articles UC 7.1 à 7.3 lorsqu’existe, sur le fonds\nvoisin, une courette en limite séparative* dont les façades comportent une ou des baies et que\nle projet prévoit, en regard de cette courette, la réalisation d’une courette d’une largeur au\nminimum identique à celle du fonds voisin et d’une profondeur (P) d’1,90 mètre minimum. Il en\nsera de même lorsqu’il existe sur le fonds voisin une baie en limite séparative.\n    Croquis\n    VOIE\n7.10 – Règles particulières concernant les constructions et installations nécessaires au\n    service public d’intérêt collectif (CINASPIC)*\nLorsque les constructions ne sont pas implantées sur limites séparatives, la distance comptée\nhorizontalement d’une façade d'un bâtiment aux limites séparatives doit être au moins égale\nà la moitié de la hauteur du bâtiment sans pouvoir être inférieure à 3 mètres.\n    76","Dans le secteur UCz :\n7.11 - Par rapport aux limites séparatives* aboutissants aux voies\n7.11.1 - Cas d'implantation des façades ou parties de bâtiment en retrait des limites\nséparatives aboutissant aux voies\n7.11.1.1 - Implantation des façades ou parties de bâtiments comportant des baies principales*\nLa distance mesurée horizontalement d'une façade comportant des baies principales à la limite\nséparative doit être au moins égale à la hauteur de cette façade avec un minimum de 8 mètres.\nLa distance comptée horizontalement de la façade d’une construction à rez-de-chaussée\ncomportant des baies principales* aux limites séparatives aboutissant aux voies, constituées\nd'un mur aveugle* ou de clôture d’au moins 5 mètres de haut doit être au moins égale à 8\nmètres.\n7.11.1.2 - Implantation des façades ou parties de bâtiment ne comportant pas de baies\nprincipales (baies secondaires ou absence de baies)\nLa distance mesurée horizontalement d'une façade ne comportant pas de baies principales à\nla limite séparative doit être au moins égale à la moitié de la hauteur du bâtiment, sans pouvoir\nêtre inférieure à 3 mètres.\n7.11.2 - Cas d'implantation des façades ou parties de bâtiment sur les limites séparatives\nL'implantation des constructions sur limite séparative est autorisée lorsque le pignon ne\ncomporte pas de baies (hormis des jours de souffrance).\n7.12 - Par rapport aux limites séparatives n’aboutissant pas aux voies (limites de fond)\n7.12.1 - Cas d'implantation des façades ou parties de bâtiment en retrait des limites\nséparatives de fond :\n7.12.1.1 - Implantation des façades ou parties de bâtiment comportant des baies principales\nLa distance mesurée horizontalement d'une façade comportant des baies principales à la limite\nséparative, doit être au moins égale à la hauteur de cette façade, sans pouvoir être inférieure\nà 8 mètres.\n7.12.1.2 - Implantation des façades ou parties de bâtiment ne comptant pas de baies\nprincipales (baies secondaires ou absence de baies)\nLa distance mesurée horizontalement d'une façade ne comportant pas de baies principales à\nla limite séparative doit être au moins égale à la moitié de la hauteur du bâtiment, sans pouvoir\nêtre inférieure à 3 mètres.\n7.12.2 - Cas d'implantation des façades ou parties de bâtiment sur les limites\nséparatives de fond :\nL'implantation des constructions sur limite séparative est autorisée lorsque le pignon ne\ncomporte pas de baies (hormis des jours de souffrance).\n    77","7.13 - Cas d’une façade non parallèle aux limites séparatives\nLa distance horizontale à la limite séparative, mesurée normalement à la façade ou partie de\nfaçade devra être au moins égale :\n- aux ¾ de la hauteur de la façade avec un minimum de 6 mètres si cette façade comporte\ndes baies principales ;\n- ou aux 3/8 ème de la hauteur de la façade avec un minimum de 3 mètres si cette façade ne\ncomporte que des baies secondaires.\n7.14 - Cas des bâtiments \"références\"\na) La conservation des bâtiments \"référence\", ou parties de bâtiments \"référence\" peut être\nimposée.\nDans ce cas, les bâtiments conservés peuvent être réhabilités ou maintenus dans leur\nimplantation existante, nonobstant les règles générales de la zone.\nb) Dans les cas suivants :\n- Extension du bâtiment référence,\n-Reconstruction d'une partie d'un bâtiment référence ou d'une annexe* présentant un intérêt\nmoindre au regard des critères qui auront déterminé le classement du bâtiment principal\n- Construction nouvelle secondaire,\n-Reconstruction en cas de démolition autorisée pour des motifs architecturaux, l'implantation\nde la construction nouvelle devra respecter les règles générales de la zone définies aux articles\nUC 7.1, 7.2 et 7.3 sans altérer le caractère du bâtiment \"référence\" lui-même et en préservant\nl'intérêt des lieux avoisinants.\nc) Dans le cas de sinistre ou péril d'un bâtiment \"référence\" la reconstruction sera imposée à\nl'identique.\nCependant si cette reconstruction à l'identique ne peut être mise en œuvre, une construction\nnouvelle de qualité pourra remplacer le bâtiment \"référence\" disparu, dans le respect des\nrègles générales d'implantation de la zone et de l'intérêt des lieux avoisinants.\n7.15 - Cas des unités foncières d'angle\nA l'angle des voies les prescriptions susvisées restent applicables.\nCependant, lorsque des reculements figurent au plan, on considère que la largeur de l’unité\nfoncière est égale à la distance mesurée respectivement entre le reculement imposé et la limite\nséparative opposée.\nLes constructions peuvent être implantées sur les limites séparatives lorsque cette distance\nest inférieure ou égale à 15 mètres.\n7.16 - Modalités d'application\nSe reporter à la définition de Hauteur*\n    78","7.17 – Saillies* et encorbellements* dans les marges d'isolement* (latérales et arrières)\ndans le respect de l'article UC 11\nDans les marges d’isolement définies aux articles UC 7.1, 7.2 et 7.3 les constructions en\nsuperstructure sont interdites à l'exception des encorbellements, et des saillies ; les\nconstructions en infrastructure y sont autorisées.\nLes saillies et encorbellements ne sont autorisés que lorsque la distance séparant la façade*\nde la construction projetée à la limite séparative* opposée est supérieure ou égale à 12 mètres.\nIls sont soumis aux règles suivantes :\n- la partie inférieure de la saillie ou de l’encorbellement doit être située à une hauteur au moins\négale à 2,60 mètres au-dessus du terrain au droit de la saillie.\n- la profondeur de la saillie ou de l’encorbellement ne peut excéder le dixième de la distance\nentre la façade et la limite séparative et 1,40 mètre.\n7.18 - Servitude de cour commune\nLes constructions peuvent être implantées à une distance moindre que celle définie ci-dessus,\nlorsque les deux propriétaires voisins, par acte authentique, s'obligent réciproquement à créer\nune servitude de cour commune au sens de l'article L.471-1 à L.471-3 du Code de l'Urbanisme\nou lorsqu'elle est instituée par voie judiciaire.\nEn outre, l’édification d’une construction en limite de cour commune doit respecter les\ndispositions de l’article UC 8 par rapport aux constructions situées sur l’unité foncière voisine\nconcernée par ladite servitude.\n7.19 – Courettes\nLes constructions pourront ne pas respecter les articles UC 7.1 à 7.3 lorsqu’existe, sur le fonds\nvoisin, une courette en limite séparative* dont les façades comportent une ou des baies et que\nle projet prévoit, en regard de cette courette, la réalisation d’une courette d’une largeur au\nminimum identique à celle du fonds voisin et d’une profondeur (P) d’1,90 mètre minimum. Il en\nsera de même lorsqu’il existe sur le fonds voisin une baie en limite séparative.\n    Croquis\n    VOIE\n7.20 – Règles particulières concernant les constructions et installations nécessaires au\n    service public et d’intérêt collectif (CINASPIC)*\nLorsque les constructions ne sont pas implantées sur limites séparatives, la distance comptée\nhorizontalement d’une façade d'un bâtiment aux limites séparatives doit être au moins égale\nà la moitié de la hauteur du bâtiment sans pouvoir être inférieure à 3 mètres.\n    79","Article UC8 – Implantation des constructions les unes par rapport aux autres sur une\nmême propriété\nIl est fait application des dispositions des articles 8.1 et 8.2 des dispositions générales pour la\ndiversité de l’habitat.\nDans les secteurs UCa et UCb :\n8.1 – Pour une construction comprenant des façades* en vis-à-vis, l’implantation de ces\nfaçades n’a pas à respecter les règles édictées ci-dessous à l’intention des bâtiments non\ncontigus*.\n8.2 - L’implantation des bâtiments non contigus doit se faire selon les règles suivantes :\nLa distance, comptée horizontalement, séparant deux façades de bâtiments non contigus est\nau moins égale :\na) la hauteur de la façade la plus haute, avec un minimum de 12 mètres, si la façade la plus\nbasse comporte des baies principales*,\nb) la hauteur de la façade la plus basse, avec un minimum de 12 mètres, si cette dernière ne\ncomporte pas de baies principales et que la façade la plus haute en comporte,\nc) au minimum de la hauteur de la façade la plus basse et de la moitié de la hauteur de la\nfaçade la plus haute, avec un minimum de 4 mètres, si les deux façades ne comportent pas\nde baies principales.\n8.3 – Cas des bâtiments \"références\"*\na) La conservation des bâtiments \"référence\", ou parties de bâtiments \"référence\" peut être\nimposée.\nDans ce cas, les bâtiments conservés peuvent être réhabilités ou maintenus dans leur\nimplantation existante, nonobstant les règles générales de la zone.\nb) Dans les cas suivants :\n- Extension du bâtiment référence,\n- Reconstruction d'une partie d'un bâtiment référence ou d'une annexe* présentant un intérêt\nmoindre au regard des critères qui auront déterminé le classement du bâtiment principal,\n- Construction nouvelle secondaire,\n- Reconstruction en cas de démolition autorisée pour des motifs architecturaux, l'implantation\nde la construction nouvelle devra respecter les règles générales de la zone définies aux articles\nUC 8.1et 8.2 sans altérer le caractère du bâtiment \"référence\" lui-même et en préservant\nl'intérêt des lieux avoisinants.\nc) Dans le cas de sinistre ou péril d'un bâtiment \"référence\" la reconstruction sera imposée à\nl'identique.\nCependant si cette reconstruction à l'identique ne peut être mise en œuvre, une construction\nnouvelle de qualité pourra remplacer le bâtiment \"référence\" disparu, dans le respect des\nrègles générales d'implantation de la zone et de l'intérêt des lieux avoisinants.\n    80","8.4 – Saillies* et encorbellements* entre deux façades en vis-à-vis dans le respect de\nl'article UC 11\nIls ne sont autorisés que lorsque la distance séparant les deux façades à l'opposite est\nsupérieure à 12 mètres.\nIls sont soumis aux règles suivantes :\n- la partie inférieure de la saillie ou de l’encorbellement doit être située à une hauteur au moins\négale à 2,60 mètres au-dessus du terrain*,\n- la profondeur de la saillie ou de l’encorbellement ne peut excéder le dixième de la distance\nentre les deux façades et dans tous les cas, ne peut excéder 1,40 mètre.\n8.5 – Modalités d’application\nSe reporter à la définition de Hauteur*\n8.6 -Dans le secteur UCz :\nLes règles sont identiques à celles des secteurs UCa et UCb à l’exception des dispositions\nsuivantes :\nL’implantation des bâtiments non contigus doit se faire selon les règles suivantes:\nLa distance, comptée horizontalement, séparant deux façades de bâtiments non contigus est\nau moins égale à :\na) 3 mètres lorsque les façades ne comportent pas de baies* ou si une seule façade comporte\ndes baies ;\nb) la hauteur de la façade la plus haute, avec un minimum de 8 mètres, si les deux façades\ncomportent des baies.\nArticle UC9 – Emprise au sol* des constructions\nIl est fait application des dispositions des articles 8.1 et 8.2 des dispositions générales pour la\ndiversité de l’habitat.\n9.1 - Dispositions particulières aux secteurs UCa et UCb\n9.1.1- si l’unité foncière ne comprend aucune bande de 15 mètres* figurée au plan (règles\nparticulières de la légende du document graphique) :\nL’emprise au sol des bâtiments ne peut excéder :\n- 36 % de la superficie totale de l’unité foncière en zone UCa,\n- 12 % de la superficie totale de l’unité foncière en zone UCb,\n- l'emprise résultant de l'application des articles 6 et 7 en zone UCb, le long du boulevard Paul-\nÉmile Victor.\n    81","9.1.2- si l’unité foncière comprend une bande de 15 mètres figurée au plan (règles particulières\nde la légende du document graphique) :\n-Dans cette bande de 15 mètres*, l’emprise au sol n’est limitée que par l’application des autres\narticles du règlement.\n- Au-delà de cette bande, l’emprise au sol ne peut excéder 36% de la superficie de cette partie\nd’unité foncière (valable pour UCa).\n9.1.3 - Nonobstant les dispositions prévues à l’article UC 9.1 l'emprise au sol n'est pas limitée\npour les unités foncières existantes situées à l'angle de deux voies et d’une superficie\ninférieure à 300 m².\n9.2 - Dispositions particulières au secteur UCz\nPar dérogation aux dispositions de l’article UC 9.1, le pourcentage d’emprise est limité au\npourcentage existant sur l’unité foncière au jour d’approbation du P.L.U.\n9.3 - Pour toute la zone\n9.3.1 - Emprise des bâtiments \"références\"*\na) la conservation des bâtiments \"référence\", ou parties de bâtiments \"référence\" peut être\nimposée.\nDans ce cas, les bâtiments conservés peuvent être réhabilités ou maintenus dans leur emprise\nexistante, nonobstant les règles de la zone, définies aux articles UC 9.1 et 9.2\nb) Dans les cas suivants :\n-Extension du bâtiment référence,\n-Reconstruction d'une partie d'un bâtiment référence ou d'une annexe présentant un intérêt\nmoindre au regard des critères qui auront déterminé le classement du bâtiment principal,\n-Construction nouvelle secondaire,\n-Reconstruction en cas de démolition autorisée pour des motifs architecturaux,\nL’emprise de la construction nouvelle devra respecter les règles générales de la zone définies\naux articles UC 9.1 et 9.2 sans altérer le caractère du bâtiment \"référence\" lui-même et en\npréservant l'intérêt des lieux avoisinants.\nc) Dans le cas de sinistre ou péril d'un bâtiment \"référence\" la reconstruction sera imposée à\nl'identique.\nCependant si cette reconstruction à l'identique ne peut être mise en œuvre, une construction\nnouvelle de qualité pourra remplacer le bâtiment \"référence\" disparu, dans le respect des\nrègles générales d'emprise de la zone et de l'intérêt des lieux avoisinants.\n9.3.2 – Bâtiments existants : Nonobstant les dispositions des articles UC 9.1 une emprise\nsupplémentaire sera autorisée dans la limite de 20 m² pour les locaux à rez-de-chaussée qui\naméliorent l'hygiène ou la sécurité tels que les locaux poubelles, les ascenseurs, ou le confort\ntels qu’une loge de gardien les abris pour les vélos, même si le bâtiment existant est déjà\nexcédentaire par rapport à la norme.\n9.3.3.- Règles particulières concernant les constructions et installations nécessaires au\nservice public et d’intérêt collectif (CINASPIC)*\nPour les constructions et installations nécessaires au service public et d’intérêt collectif\nl’emprise au sol ne peut excéder 65%.\n    82","Article UC10 – Hauteur maximum des constructions\nIl est fait application des dispositions de l’article 7.3 des dispositions générales pour les unités\nfoncières localisées au plan de zonage 5.3 et des articles 8.1 et 8.2 pour la diversité de l’habitat.\nDans les secteurs UCa et UCb :\n10.1 - Compte tenu du plafond du secteur\n10.1.1 –Secteur UCa\nSauf règle particulière figurant au plan de zonage, la hauteur maximum des constructions est\nfixée à 21 mètres et R*+6.\nUn dépassement de la hauteur maximum de 2 mètres pour les bâtiments d’habitation, et de 4\nmètres pour les immeubles de bureaux, est autorisé à la condition que les hauteurs sous\nplafond* de chaque niveau soient supérieures à 2,5 mètres, sans dépasser R+6.\n10.1.2 - Secteur UCb\nLa hauteur maximum des constructions est fixée à 6,50 mètres par rapport au niveau de la\ncote du trottoir des boulevards Paul-Émile Victor et du Parc.\nSur le boulevard Paul-Émile Victor, un supplément de hauteur au faîtage* de 1,50 mètre est\nautorisé sur 1/3ème de la longueur de l’unité foncière pour motif architectural.\n10.2 - Compte tenu des voies en secteur UCa\n10.2.1 - La hauteur maximum des constructions est déterminée par la plus courte distance les\nséparant de l'alignement* opposé existant ou projeté, augmenté de la marge de reculement*\nimposée sur l'alignement opposé existant ou projeté. En ce qui concerne les voies privées, la\ndistance à prendre en compte pour ce calcul est celle séparant la façade de la construction\nprojetée de la limite opposée de la voie.\n10.2.2 - A l'angle des îlots limités par des voies d'inégales largeurs, la hauteur maximum des\nconstructions édifiées en bordure de la voie la moins large peut être identique à celle autorisée\nen bordure de la voie la plus large, sur une distance au plus égale à 15 mètres comptée à\npartir des alignements ou de tout recul imposé.\n10.2.3 - Toutefois, afin de masquer les murs pignons en bon état sur limites séparatives\naboutissant aux voies, cette hauteur maximum pourra être dépassée pour assurer un front bâti\ncohérent jusqu'à la hauteur maximum du pignon le plus haut.\n10.3 - Hauteur des bâtiments \"références\"*\na) La conservation des bâtiments \"référence\", ou parties de bâtiments \"référence\" peut être\nimposée.\nDans ce cas, les bâtiments conservés peuvent être réhabilités ou maintenus dans leur hauteur\nexistante, nonobstant les règles de l’article UC 10 s’appliquent.\n    83","b) Dans les cas suivants :\n-Extension du bâtiment référence,\n-Reconstruction d'une partie d'un bâtiment référence ou d'une annexe* présentant un intérêt\nmoindre au regard des critères qui auront déterminé le classement du bâtiment principal,\n-Construction nouvelle secondaire,\n-Reconstruction en cas de démolition autorisée pour des motifs architecturaux, la hauteur de\nla construction nouvelle devra respecter les règles générales de la zone sans altérer le\ncaractère du bâtiment \"référence\" lui-même et en préservant l'intérêt des lieux avoisinants.\nc) Dans le cas de sinistre ou péril d'un bâtiment \"référence\" la reconstruction sera imposée à\nl'identique.\nCependant si cette reconstruction à l'identique ne peut être mise en œuvre, une construction\nnouvelle de qualité pourra remplacer le bâtiment \"référence\" disparu, dans le respect des\nrègles générales de hauteur de la zone et de l'intérêt des lieux avoisinants.\n10.4 - Modalités de calcul de la hauteur\nSe reporter à la définition de Hauteur*\n10.5 – Constructions sur toiture-terrasse en UCa\nPeuvent dépasser la hauteur maximum, les constructions sur toiture-terrasse qui remplissent\nles conditions cumulatives suivantes :\n   -   Disposer d’une hauteur d’au maximum 3 mètres pour les pièces de loisirs*, sorties\n    d’escalier, pergolas et locaux techniques* (à l’exception des machineries d’ascenseurs\n    qui peuvent atteindre 4 mètres), comptés à partir du niveau de la terrasse\n   -   Etre implantées en retrait des façades d’une distance au moins égale à leur hauteur\n   -   Que leurs surfaces cumulées occupent 20% au plus de la superficie totale de la\n    terrasse de l’immeuble\n   -   Chaque pièce de loisirs ne doit pas dépasser 35m² de surface de plancher, doit être\n    reliée directement aux locaux d’habitation situés au dernier étage et respecter l’article\n    UC 11.2.\n10.6 – Dans le secteur UCz :\nLes règles sont identiques à celles des secteurs UCa et UCb à l’exception des dispositions\nsuivantes :\nLa hauteur des constructions est fixée au document graphique 5.4.\nArticle UC.11 – Aspect extérieur constructions et aménagement de leurs abords\n11.1 - Dispositions générales\n11.1.1 - Tout projet peut être refusé, ou n'être accordé que sous réserve du respect de\nprescriptions spéciales, si la construction par sa situation, son volume, l'aspect, le rythme ou\nla coloration de ses façades, est de nature à porter atteinte au caractère ou à l'intérêt des lieux\navoisinants notamment aux caractères architecturaux spécifiques des bâtiments \"références\"*\nidentifiés sur le plan, aux sites, aux paysages naturels ou urbains ainsi qu'à la conservation\ndes perspectives monumentales.\n    84","11.1.2 - Matériaux des façades\nLes façades des bâtiments projetés doivent être revêtues de matériaux qui présentent un\naspect de qualité, conserver une bonne tenue dans le temps (pierre massive ou pelliculaire,\nmenuiserie en aluminium laqué ou en bois. ).\nL'emploi de matériaux dits réfléchissants* est interdit.\nLes menuiseries ou les ferronneries qui participent à l'image de l'ensemble d'un édifice doivent\nconserver ou retrouver ce caractère, par la finesse des sections et des moulures d'origine, par\nla qualité des matériaux.\nNotamment :\n- Les persiennes ne doivent pas être ajoutées sur les façades où non prévues à l’origine, elles\nmasquent les modénatures et les décors. Les persiennes qui participent au décor de la façade\ndoivent être conservées,\n- Les garde-corps, grilles, clôtures, le cas échéant, doivent conserver les matériaux tels que\nfer forgé ou fonte moulée,\n- Les menuiseries ou les ferronneries doivent chacune être d'une seule couleur sur une même\nfaçade, toutefois les portes cochères et devantures peuvent avoir des couleurs plus soutenues.\n11.1.3 - Les installations tels que écrans, grillages, treillis, au-dessus des garde-corps, sont\ninterdites.\n11.1.4 – Antennes et paraboles\nLes antennes paraboliques et autres antennes sont interdites en façade. Elles doivent être\ninstallées en toiture et en retrait des façades. Elles ne doivent pas porter atteinte à la qualité\narchitecturale environnante.\n11.1.5 – Encorbellements* en façade\nLes encorbellements en façade doivent avoir une longueur inférieure ou au plus égale au tiers\nde la longueur de la façade intéressée.\n11.1.6 – Les cours anglaises* : Les cours anglaises sont interdites.\n11.1.7 - Le traitement des souches, les systèmes de ventilation, de climatisation et les\nsurélévations des conduits, notamment les conduits de fumée ou de ventilation, devront être\nencoffrés le long des pignons en harmonie avec le pignon.\nL’installation de systèmes de ventilation ou de climatisation est en outre interdite sur rue.\n11.1.8 - Traitement des façades* et modifications des façades existantes\nLes façades doivent être ordonnées pour respecter une cohérence dans le style de la\nconstruction, les hauteurs d'étages, les proportions des ouvertures et une harmonie dans le\nchoix des couleurs et des matériaux.\nNotamment :\n- les modifications effectuées sur une construction existante doivent tenir compte de la\ncomposition d’ensemble de l’édifice,\n- toutes les façades d'une construction, notamment les mur-pignons (mitoyens ou non) doivent\nêtre traitées en harmonie avec la façade dite \"principale\" bordant l’espace public, mais en\ntenant compte des différences d’orientation et d’usage. Les locaux accessoires doivent être\ntraités avec un soin égal à celui apporté aux bâtiments principaux,\n- les couleurs ne doivent pas créer de ruptures dans la lecture du paysage bâti,\n    85","- les travaux sur façade doivent mettre en valeur les détails, permettre la suppression des\najouts qui dénaturent le caractère de la façade, la réutilisation de matériaux traditionnels.\nNotamment, les modénatures, les éléments sculptés, les décors, qui ont un caractère\nremarquable, doivent être conservés, réparés lorsqu’ils sont dégradés et reconstitués lorsqu’ils\nont été supprimés,\n- les raccordements aux réseaux de distribution de l’électricité, du gaz et de télécommunication\ndoivent être dissimulés ou intégrés au bâti.\n11.1.9 - Les pignons sur les limites séparatives* ainsi que les locaux en superstructure doivent\nrecevoir un revêtement en harmonie avec les façades.\nLes murs pignons des bâtiments existants laissés ou rendus apparents par une construction\nnouvelle ou à la suite de la démolition d'une construction jointive, doivent recevoir un enduit\nen harmonie avec la façade* voisine, ciment - pierre ou matériau similaire.\nPour les constructions existantes, l'aspect des façades des extensions de toute nature doit\nêtre en harmonie avec les matériaux constituant des façades existantes.\n11.1.10 - Ravalements\nLes ravalements doivent être exécutés en respectant les matériaux des façades d'origine (les\nrevêtements en ciment gris ainsi que la peinture de la pierre de taille et des briques sont\ninterdits) et sans atténuer aucun des détails.\nIls doivent être exécutés sur toute la façade y compris les délaissés de pignon, de manière à\nrespecter l'homogénéité de la composition de la façade.\n11.1.11- Accès carrossables et entrées d'immeubles\nLes accès carrossables à la voie publique*, notamment les portes et rampes de garage,\ndoivent avoir un impact visuel minimum sur la composition architecturale des édifices et des\nvégétaux qui l'accompagnent, notamment sur la composition des soubassements des\nimmeubles.\nLes transparences des immeubles au rez-de-chaussée doivent être conservées ou\naménagées lorsque l'architecture de l'immeuble et l'environnement le permettent.\n11.1.12- Devantures\nLes compositions des devantures doivent tenir compte de la composition architecturale de la\nfaçade de l’immeuble.\nLes devantures pourront présenter une saillie* ou un empiètement par rapport au nu de la\nfaçade sous réserve de l’accord de l’autorité gestionnaire de la voie et de l’emprise publique.\nDans les bâtiments \"référence\"*, les baies* d’origine dans lesquelles s'inscrivent les\ndevantures doivent être conservées ou restituées.\n11.1.13 - Stores, bannes\nLes stores doivent contribuer à l'unité de la composition des façades des immeubles.\nNotamment :\n- Ils doivent s'inscrire dans les percements en respectant leur géométrie et rester en dessous\ndes linteaux travaillés, sans les altérer,\n- Seuls sont autorisés les stores-capotes et les stores sans lambrequin ni joues. Toutefois les\nstores situés à rez-de-chaussée pourront comporter un lambrequin,\n- Ils doivent être mobiles, en toile tissée, d'une couleur uniforme sur la totalité des percements\nd'un même immeuble. Cette couleur sera choisie parmi les tons clairs, notamment gris, sable\net blanc cassé. Cette disposition ne s’applique pas aux commerces.\nLes bannes en saillie sur le domaine public doivent participer à une harmonie d'ensemble du\npaysage.\n    86","11.1.14 – Clôtures et jardins :\nLa mise en valeur des espaces bâtis doit être accompagnée de celle des espaces non-bâtis\n(mise en valeur paysagère des marges plantées, jardins, cours intérieures) dans le respect de\nl'article UC 13, en particulier en ce qui concerne les jardins entourant les hôtels particuliers.\n11.1.15 - En secteur UCb, le long du boulevard Paul-Émile Victor, les constructions autorisées\n(d'habitation individuelle) doivent comporter des toitures en pente, de 30 % minimum ; les\ntoitures terrasses sont interdites.\n11.1.16 - Pour les constructions situées le long du boulevard du Parc, les toitures doivent être\nobligatoirement pentues et recouvertes de tuiles. La composition de matériaux nobles qui\ndoivent être choisis et mis en œuvre de telle sorte qu'ils assurent la meilleure pérennité au\ntemps.\n11.2 - Dispositions applicables aux toitures-terrasses\n11.2.1.- Les toitures-terrasses seront conçues comme une cinquième façade. Une\nvégétalisation des toitures terrasses sera recherchée.\n11.2.2 - En cas de construction d’une pièce de loisirs sur la toiture-terrasse, un habillage\nvégétal en périphérie de la toiture sera imposé.\n11.2.3 - Tout garde-corps devra s’intégrer au style architectural de l’immeuble (aspect\nextérieur, matériau,…) ou devra avoir un impact visuel réduit (transparence,…).\n11.3 – Clôtures\n11.3.1 - L’édification de clôture en bordure des voies publiques et privées est imposée à\nl'alignement. La clôture doit être constituée par un mur bahut de 0,80 mètre de hauteur\nmaximum surmonté d'une grille à claire-voie, la hauteur totale ne pouvant excéder 2,20 mètres.\n11.3.2 - Dans la marge de reculement, les clôtures doivent être identiques à celles sur\nl'alignement.\n11.3.3 - Au-delà de la marge de reculement, les clôtures en limites de propriété ne doivent pas\nexcéder 3 mètres de haut.\n11.3.4 - Sur toutes les clôtures, sont formellement interdits, les écrans de tôle, treillage,\ncanisses, etc. de quelque nature que ce soit. Cependant, la grille à claire-voie peut être\ndoublée par un écran de verre transparent et, ou, de la végétation.\n    87","11.4 - Bâtiments \"références\"*\nLes bâtiments « référence » sont protégés au titre des dispositions de l’article L. 151-19 du\nCode de l’Urbanisme.\n11.4.1 - Conservation des bâtiments \"référence\"* figurant au plan de zonage :\nLa conservation des bâtiments référence peut être imposée en tout ou en partie. Lorsqu'elle\nest imposée, la restauration de ces bâtiments ou partie de bâtiments, doit conserver ou\nrestituer les dispositions architecturales spécifiques à leur époque, sans exclure certains\naménagements mineurs concourant à l'amélioration des conditions d'habitabilité et d’hygiène.\nDans le cas de construction sinistrée ou dont la vétusté constitue un péril, il pourra être imposé\nsoit la reconstruction à l’identique de tout ou partie de l'édifice endommagé, soit la\nreconstruction avec un projet comportant une architecture de qualité ayant un caractère\ncontemporain qui tienne rigoureusement compte, dans le cas d'une reconstruction partielle,\ndes caractères architecturaux de l’édifice existant.\n11.4.2 - Composition des bâtiments \"référence\"*\nLes compositions des bâtiments référence doivent être sauvegardées dans le respect des\ncaractères propres à chacun des types de bâtiments référence.\nNotamment :\n- le soubassement*, le corps principal et le couronnement d'un bâtiment doivent être traités, le\ncas échéant, dans une composition d'ensemble,\n- les couronnements doivent être mis en valeur en sauvegardant ou retrouvant pentes et\ndétails des toitures d'origine, notamment lucarnes et corniches, ainsi que les détails des\nniveaux hauts qui les soulignent, en particulier balcons moulurés, consoles ou denticules.\n11.4.3 - Transitions avec les bâtiments \"référence\"\nLes compositions des bâtiments projetés doivent traiter les transitions entre construction\nnouvelle et bâtiment référence contigu, notamment en ce qui concerne les volumétries, la\nnature des percements et le choix des matériaux.\n11.4.4 - Immeubles constituant des ensembles (type maisons de ville, hôtels jumelés,\nimmeubles-îlots ou constituant des fronts de rues ayant un caractère unitaire).\nLa mise en valeur des bâtiments référence constituant des ensembles architecturaux, du type\nmaisons construites en bande, immeubles-îlots ou fronts de rues ayant un caractère unitaire,\nainsi que la composition des bâtiments projetés qui les jouxtent, devra concourir à conserver\nou retrouver une unité du front bâti (notamment dans les volumétries, composition des\nfaçades, le choix des matériaux et des couleurs).\nLes constructions semblables groupées deux à deux, en bande ou en vis-à-vis, doivent\nconserver ou retrouver les similitudes exactes de composition, notamment volumétries,\ntoitures, couleurs et décors.\n11.4.5 - Traitement des toitures des bâtiments \"référence\"\n11.4.5.1 - Dispositions générales\nLes toitures des bâtiments référence doivent être traitées en harmonie avec le caractère des\nfaçades du bâtiment qu'elles couvrent.\nLes toitures modifiées et celles des extensions des bâtiments référence doivent s'inscrire dans\nla composition des toitures existantes des bâtiments \"références\" et retrouver, tous les détails\net les matériaux de qualité mis en œuvre à l'origine.\nLes types, les volumes, les matériaux et les couleurs des toitures des bâtiments projetés\ndoivent contribuer à l'intégration des constructions dans le paysage bâti des bâtiments\n\"références\".\n    88","Les matériaux de toitures doivent présenter un aspect de qualité et conserver une bonne tenue\ndans le temps (zinc, ardoise...).\n11.4.5.2 - Aménagements techniques\nLes locaux techniques, notamment les chaufferies, appareils de conditionnement d'air, doivent\nêtre intégrées dans le volume des toitures existantes des bâtiments référence.\nCependant, une sur-hauteur pourra être autorisée pour permettre l'implantation en terrasse\nd'une machinerie d'ascenseur, sous réserve qu'elle ne soit pas visible depuis le domaine public\net qu'elle ne nuise pas aux caractères du bâtiment référence lui-même et des lieux avoisinants.\n11.4.6 - Traitements des façades des bâtiments \"référence\"\nLes façades des bâtiments référence doivent conserver ou retrouver la richesse des matériaux\nd'origine et de leur mise en œuvre, notamment le plâtre mouluré, la pierre et la brique ainsi\nque le bois, les moellons ou la céramique, le cas échéant.\n11.4.7 - Les clôtures existantes caractéristiques des styles des bâtiments référence doivent\nêtre conservées.\n11.5 – Éclairage des façades\nLes dispositifs permanents d’éclairage des façades sont interdits, à l’exception des dispositifs\nde détection de mouvements ou d’intrusion et des dispositifs ponctuels mettant en relief\nl’architecture du bâtiment. Cette interdiction ne s’applique pas aux CINASPIC*.\nArticle UC.12 – Obligations imposées aux constructeurs en matière de réalisation\nd’aires de stationnement\n12.1 - Dispositions générales\nPour toute opération de construction, soumise ou non à autorisation de construire, ou tout\nchangement de destination, s’accompagnant de la réalisation d’aires de stationnement, ces\ndernières devront être réalisées à l’intérieur des constructions ou en sous-sol*. Leurs\ncaractéristiques et leurs normes sont définies ci-après.\n12.1.1 – Les places doubles sont autorisées dans les bâtiments à destination d’habitation,\navec au minimum une place par logement directement accessible à l’aire de dégagement de\ndesserte.\n12.1.2 - Les rampes d'accès doivent avoir la largeur suivante :\n- Sens unique : 3,50 mètres\n- Double sens desservant jusqu'à 50 voitures : 3,50 mètres\n• Cette largeur est comprise entre chasse-roues et la rampe doit être munie d'un feu bicolore,\n• Leur rayon de courbure intérieur ne doit pas être inférieur à 5 mètres. Dans le cas où il est\négal à 5 mètres, la largeur de la rampe doit être portée à 4 mètres dans la courbe.\n- Double sens desservant plus de 50 voitures : 5 mètres\n- Les rampes desservant des stationnements prévus pour les autocars doivent être\ndimensionnées de manière à permettre le passage de ces véhicules.\n    89","Ces rampes ne doivent pas entraîner de modification dans le niveau du trottoir.\nLa pente dans les cinq premiers mètres à partir de l'alignement ne doit pas excéder 5 %.\nCes dispositions, à l’exception de celle relative à l’absence de modification dans le niveau du\ntrottoir, ne s’appliquent pas aux rampes d’accès des bâtiments existants.\n12.1.3 - Les besoins en stationnement de véhicules motorisés individuels sont\ncalculés de la manière suivante :\n12.1.3.1 - Constructions à destination d'habitation\n    - chambres individuelles    1 place / 2 chambres\n    - studios et 2 pièces    1 place / logement\n    - 3 et 4 pièces    1,5 place / logement\n    - 5 pièces et plus    2 places / logement\nPour les logements d'une surface de plancher inférieure à 80 m², il sera exigé une seule place\nde stationnement par logement, nonobstant les règles précédemment définies.\nA moins de 500 mètres d’une gare ou d’une station de transport public guidé ou de transport\ncollectif en site propre et dès lors que la qualité de la desserte le permet : 1 place / logement.\nConstructions existantes :\nL’obligation de réaliser des aires de stationnement n’est pas applicable aux travaux de\ntransformation ou d’amélioration de logements existants, dans le cas où ces travaux ne\ns’accompagnent pas de la création de surface de plancher supplémentaire.\n12.1.3.2 Construction de logements locatifs financés avec un prêt aidé par l’Etat, le nombre\nde places minimal est le suivant :\n- règle générale : 1 place / logement\n- logement d’une surface de plancher inférieure à 60 m² : 0,5 place / logement\n- à moins de 500 mètres d’une gare ou d’une station de transport public guidé ou de transport\ncollectif en site propre et dès lors que la qualité de la desserte le permet : 0,5 place / logement\n- logement sur une unité foncière inférieure à 500 m² (dans tous les cas) : pas de place exigée\nL’obligation de réaliser des aires de stationnement n’est pas applicable aux travaux de\ntransformation ou d’amélioration de logements locatifs financés avec un prêt aidé par l’État, y\ncompris dans le cas où ces travaux s’accompagnent de la création de surface de plancher.\n12.1.3.3 – Occupations du sol autres que celles à destination d'habitation\n- Bureau* : Il est imposé (avec interdiction de réaliser plus de places que la norme):\n    - 1 place pour 70m² de surface de plancher\n    - 1 place pour 90m² de surface de plancher à moins de 500 mètres d’un point de\n    desserte par des lignes de transports collectifs structurantes*.\n- Artisanat* : 20 % de la surface de plancher de la construction avec au minimum 1 place.\n- Commerces :\n- Commerces inférieurs ou égaux à 200 m² de surface de plancher : 60 % de la surface de\nplancher de la construction avec un minimum de 2 places\n- Commerces supérieurs à 200 m² de surface de plancher: 100 % de la surface de plancher\nde la construction + places de livraison* de dimensions suffisantes\n- Marchés couverts 60 % de la surface de plancher de la construction + places aux véhicules\ndes commerçants (X x 35 m²)\n- Hôtels 1 place / 3 chambres et une place de autocar par tranche de 30 chambres,\n    90","- Restaurants (hors restaurants d’entreprise): surface de plancher:\n< Ou égale à 100 m² : 5 places\n100 m² < surface de plancher < ou égale à 350 m ² : 10 places\n>350 m² : 60 places\nPour tout commerce, des places de livraison* correspondant aux besoins doivent également\nêtre réalisées.\nPour tout commerce avec livraison*, il est exigé, en plus des stationnements pour les véhicules,\nla réalisation de places de stationnement pour les deux roues motorisés en dehors de la voie\npublique et en fonction des besoins générés par l’activité.\nNota : De plus, toute place de stationnement générée par l’exercice d’une activité doit être\nréalisée en dehors de la voie publique (auto-école, locations automobiles,..).\nCINASPIC :\nIl est imposé (avec interdiction de réaliser plus de places que la norme):\n   -   1 place pour 70m² de surface de plancher créée\n   -   1 place pour 90m² de surface de plancher créée à moins de 500 mètres d’un point de\n    desserte par des lignes de transports collectifs structurantes*.\nAucune place n’est exigée pour l’extension de CINASPIC existants, dès lors que l’extension\nn’excède pas 70% de la surface de plancher existante.\nNOTA : Dans le cas où les aires de stationnement sont définies par des surfaces, le nombre\nde places doit être égal au quotient de la surface considérée par 25 m².\n12.1.4 - Norme de stationnement vélo dans les constructions neuves et lors de travaux\nsur parcs existants :\nLe stationnement des vélos devra respecter les dispositions et les normes du Code de la\nConstruction et de l’Habitation ainsi que les normes minimums prescrites dans le Plan de\nDéplacement Urbain d’Ile-de-France en vigueur.\n12.1.5 - Les places de stationnement doivent avoir les caractéristiques suivantes :\n- longueur utile 5,00 mètres,\n- largeur utile 2,50 mètres,\n- dégagement utile 5,00 mètres minimum.\n12.1.6 – Bâtiments existants : Toutefois pour les bâtiments restaurés, réhabilités, aménagés\nou changeant de destination, avec ou sans création de surface, il ne sera tenu compte pour le\ncalcul des places de stationnement exigées que des besoins supplémentaires ainsi créés.\n    91","12.2 - Impossibilité technique de réalisation des aires de stationnement\nLorsque le pétitionnaire ne peut satisfaire lui-même aux obligations imposées par un document\nd’urbanisme en matière de réalisation d’aires de stationnement pour les véhicules motorisés,\nil peut être tenu quitte de ces obligations en justifiant, pour les places qu’il ne peut réaliser lui-\nmême sur le terrain d’assiette ou dans son environnement immédiat, soit de l’obtention d’une\nconcession à long terme dans un parc public de stationnement existant ou en cours de\nréalisation, soit de l’acquisition ou de la concession de places dans un parc privé de\nstationnement existant ou en cours de réalisation.\nLorsqu’une aire de stationnement a été prise en compte dans le cadre d’une concession à long\nterme ou dans un parc privé de stationnement, au titre des obligations issues du règlement du\nPLU, elle ne peut plus être prise en compte, en tout ou partie, à l’occasion d’une nouvelle\nautorisation.\nSi les travaux ou constructions ne sont pas soumis à l’obtention d’une autorisation prévue à\nl’article L.421-1 du Code de l’Urbanisme ou soumis à déclaration prévue à l’article L421-4 de\nce même code, les dispositions contenues dans le plan local d’urbanisme relatives à la\nréalisation d’aires de stationnement s’appliquent.\n12.3 - Modification des aires de stationnement\nAucune place de stationnement existante et non conforme aux dispositions du PLU mais\nconforme à la norme NF applicable ne peut être supprimée sans être remplacée.\nArticle UC.13 – Obligations imposées aux constructeurs en matière de réalisation\nd’espaces libres, d’aires de jeux et de loisirs et de plantations\n13.1 - 50 % de la superficie non bâtie de l’unité foncière (hors marge de reculement) doit être\nplantée et comprendre au minimum deux arbres à haute tige* par 100 m² d’espace non bâti\nparmi la liste annexée au présent règlement. L'épaisseur minimale de terre doit être de 1 mètre.\nPour les unités foncières sur lesquelles l'installation de tennis est réalisée, ce pourcentage est\nramené à 25 %.\n13.2. – Les arbres remarquables* figurant sur le plan de zonage et dont la liste est jointe en\nannexe du règlement sont protégés au titre de l’article L. 151-19 du Code de l’Urbanisme et\ndoivent être conservés sauf raisons phytosanitaires, et sous réserve de remplacement par des\narbres à développement similaires parmi une liste limitative annexée au règlement.\n13.3 - Les marges de reculement imposées doivent être plantées sur 80 % de leur\nsuperficie, hors emprise des rampes et accès de parking et des cheminements imposés par\nles règlements de sécurité, et avoir une épaisseur minimale de terre de 1 mètre (dans le\nrespect de l'article UC 6.3).\n13.4 - Les projets de constructions ou réhabilitation doivent permettre une conservation\nmaximale des plantations et espaces verts existants. Les arbres existants de haute tige non\nmaintenus devront être remplacés en nombre équivalent et parmi les essences figurant dans\nla liste non limitative annexée au présent règlement.\n    92","13.5 – CINASPIC*\nLes règles définies à l’article UC 13.1 ne sont pas applicables aux constructions et\naménagements des constructions et installations nécessaires aux services publics ou d’intérêt\ncollectif (CINASPIC).\nToutefois, les projets de construction, d’extension et de réhabilitation de ces constructions\ndoivent rechercher une conservation maximale des plantations et des espaces verts,\ncompatible avec leur fonctionnement.\n    93","    CHAPITRE 4\n    Dispositions applicables à la zone UD\nCette zone, décrite dans le rapport de présentation, est divisée en trois secteurs : UDa,\nUDb et UDc.\n- Le secteur UDa constitue un secteur intermédiaire entre les zones résidentielles peu\ndenses (UDb et UDc) et la zone UA qui est la zone centrale où les activités tertiaires et\ncommerciales côtoient l'habitat ;\n- Le secteur UDb recouvre une grande partie du territoire communal. Il se caractérise\naussi par l'importance de ses espaces libres paysagers\n- Le secteur UDc recouvre une grande partie du sud du territoire communal,\nprincipalement les quartiers Saint-James et Madrid. Il se caractérise aussi par l'importance\nde ses espaces libres paysagers.\nLa protection et la mise en valeur d'hôtels particuliers et de bâtiments collectifs remarquables,\nregroupés sous l'appellation bâtiments \"référence\", et protégés au titre de l’article L. 151-19\ndu Code de l’Urbanisme, est recherchée dans toute la zone UD.\nLa zone UD comprend également un périmètre au titre de l’article L.151-41,5° du Code de\nl’Urbanisme ainsi qu’un périmètre au titre de l’article L.151-41 du même code.\n    94","95","    SECTION 1 – Nature de l’occupation et de l’utilisation du sol\nArticle UD.1 – Occupations et utilisations du sol interdites\n1.1 – Les constructions et occupations du sol à destination de bureaux* (sauf ceux autorisés\nsous conditions à l’article UD 2.3 spécifique au secteur UDb), d'industrie ou d'entrepôt.\n1.2 – Les affouillements et exhaussements des sols supérieurs à 0,6 mètres qui ne sont pas\nnécessaires au projet de construction.\n1.3 – L'implantation et l'aménagement des installations classées suivantes :\na) celles soumises à autorisation, sauf celles prévues à l’article UD 2..1.2 et sauf les\ninstallations nécessaires au fonctionnement des constructions et installations nécessaires\naux services publics ou d’intérêt collectif* et celles qui visent à améliorer les performances\nénergétiques des bâtiments.\nb) celles soumises à déclaration, sauf celles prévues aux articles UD 2.1.1, 2.1.2 et 2.1.3\n1.4 – Les terrains de camping et de caravanes*, les caravanes isolées et les habitations\nlégères de loisirs.\nArticle UD.2 – Occupations et utilisations du sol admises sous conditions\nRappel : Il est fait application des dispositions de l’article 7.5 des dispositions générales.\n2.1 - Dans la zone UD\n2.1.1 Les installations classées soumises à déclaration, à condition qu'elles n'entraînent pour\nle voisinage, aucune incommodité et, en cas d'accident ou de fonctionnement défectueux,\naucune insalubrité ni sinistre susceptible de causer des dommages graves ou irréparables aux\npersonnes et aux biens. En outre, leurs exigences de fonctionnement lors de leur ouverture\nou à terme, doivent être compatibles avec les infrastructures existantes, notamment les voiries\net l'assainissement.\n2.1.2 - L'aménagement des installations classées existantes, à condition :\na) qu'il n'en résulte pas pour le voisinage une aggravation des dangers ou nuisances,\nb) que ces installations par leur importance ou leur aspect extérieur soient compatibles avec\nle milieu environnant.\n2.1.3 – Les installations classées annexes aux constructions (chaufferies d'immeubles,\ndépôts d'hydrocarbures, postes de transformation,…) à condition qu'elles soient réalisées\ndans le volume des bâtiments autorisés ou en sous-sol* de ceux-ci.\n    96","2.1.4 - Protection du commerce et de l’artisanat* sur les linéaires commerciaux : il est\nfait application des dispositions de l’article 9 des dispositions générales.\n2.1.5 - Changements d’usage d’une construction ou de locaux d’habitation : il est fait\napplication des dispositions de l’article 8.3 des dispositions générales.\n2.2 - Dans les parties de la zone soumises au risque technologique de transports de\nmatière dangereuse lié à la présence des canalisations de gaz à haute pression, dont le\ntracé figure en annexe du règlement du PLU, toute occupation ou utilisation du sol doit\nrespecter les règles visant à garantir sa sécurité publique. Les projets concernés par ce risque,\npourront être autorisés après avis et sous réserve de l’observation des prescriptions spéciales\nou mesures conservatoires qui seraient émises par le service intéressé et le service\ngestionnaire de ces ouvrages. Les ouvrages de transports devront se conformer aux\ndispositions en vigueur notamment par des mesures de protection suffisantes. Ces\ndispositions figurent dans une fiche d’information en annexe du règlement.\n2.3 – Dans le secteur UDb\nEn plus des règles applicables à toute la zone,\nLa restructuration, l’aménagement ou la reconstruction des bâtiments existants à destination\nde bureaux est autorisée à condition que :\n- Les parties reconstruites respectent les règles des articles UD 3 à 13,\n- Les travaux sur les parties réhabilitées construites et non conformes aux articles UD 3 à 13\nrendent ces parties plus conformes aux dispositions réglementaires méconnues ou sont\nétrangères à ces dispositions.\nDans l’attente de l’approbation par la commune d’un projet global d’aménagement, une\nservitude au titre de l’article L.151-41,5° du code de l’urbanisme est instaurée et repérée au\nplan de zonage. Seuls y sont autorisés, les travaux ayant pour objet l’adaptation, le\nchangement de destination, la réfection ou l’extension limitée des constructions existantes\nsous réserve qu’ils n’aboutissent pas à la création d’un total de plus de 2% de la surface de\nplancher existante sur l’unité foncière.\n    97","  SECTION 2 – Conditions de l’occupation et de l’utilisation du sol\nArticle UD.3 – Accès et Voirie\n3.1 - Pour être constructible, un terrain doit être accessible d'une voie* privée ou publique :\n- soit directement,\n- ou soit par l'intermédiaire d'un passage aménagé et matérialisé sur le fonds voisin.\n3.2 - Les accès doivent présenter des caractéristiques permettant de satisfaire aux exigences\nde sécurité, de défense contre l'incendie et de la protection civile. Ces exigences doivent être\nrespectées sans porter atteinte au stationnement existant sur les voies riveraines publiques.\n3.3 - Toute création de voie de desserte devra présenter une largeur minimum de 3,50 mètres.\n3.4 - Les voies nouvelles se terminant en impasse doivent être aménagées de telle sorte\nque les véhicules puissent faire demi-tour.\nArticle UD.4 – Conditions de desserte des terrains par les réseaux publics d’eau,\nd’électricité, d’assainissement et de collecte des déchets\n4.1 – Eau potable\nToute construction nouvelle doit être raccordée au réseau public de distribution d'eau potable.\n4.2 - Assainissement par un branchement particulier\n4.2.1 - Eaux usées\nToute construction ou installation nouvelle doit être raccordée au réseau public\nd'assainissement.\n4.2.2 - Eaux pluviales\nLes aménagements réalisés sur le terrain doivent respecter les limitations de ruissellement\nvers les réseaux d’assainissement conformément au règlement d’assainissement en vigueur.\nPour toute construction nouvelle ou reconstruction, le rejet des eaux pluviales dans le réseau\nd’assainissement ne pourra excéder un débit maximal fixé aux règlements intercommunaux et\ndépartementaux en vigueur.\n4.3 – Collecte des déchets\nIl devra être prévu, dans les constructions neuves de plus d’un logement, des locaux dédiés\nuniquement à la collecte des déchets ménagers et assimilés et adaptés au stockage de leurs\nconteneurs. Ces locaux devront être fermés et dimensionnés au nombre de logements réalisés\net à l’accueil de l’ensemble des conteneurs nécessaires aux exigences de la collecte des\ndéchets ménagers et assimilés.\n    98","Article UD.5 – Superficie minimale des terrains constructibles\nNéant.\nArticle UD.6 – Implantation des constructions par rapport aux voies et emprises\npubliques*, existantes ou projetées\nIl est fait application des dispositions des articles 8.1 et 8.2 des dispositions générales pour la\ndiversité de l’habitat.\n6.1 - Principe général :\nLe présent article s’applique aux voies* publiques et privées ainsi qu’aux emprises publiques\net/ou ouvertes au public.\n6.2 - En l’absence de marge de reculement* repérée au plan de zonage\n6.2.1 - Implantation à l'alignement* existant ou projeté.\n6.2.2 – ou implantation en retrait d'au moins 2,50 mètres par rapport à l'alignement existant ou\nprojeté.\n6.2.3 – Pour les voies privées, implantation à 4 mètres minimum de l’axe de la voie.\n6.3 - En présence d’une marge de reculement* repérée au plan de zonage\nLes constructions en superstructure sont interdites dans les marges de reculement (dans le\nrespect de l'article UD 13.3) à l'exception des accès aux rampes de parking, clôtures,\nencorbellements* et saillies*, dans les conditions de l’article UD 6.6.2.\nLes constructions en infrastructure sont interdites dans les marges de reculement inférieures\nà 10 mètres. Elles sont autorisées :\n- dans les marges de reculement de 10 mètres à condition qu'elles soient implantées à plus\nde 4 mètres de l'alignement*,\n- dans les marges de reculement de 20 mètres à condition qu'elles soient implantées à plus\nde 6 mètres de l'alignement*,\npour permettre la réalisation d'espaces plantés conformément à l'article UD 13.\nPour les rampes de parking, leur implantation dans les marges de reculement se fait librement.\nConstructions existantes: La surélévation des constructions existantes dans les marges de\nreculement de 3 ou 4 mètres est autorisée. Dans les autres marges de reculement, sont seuls\nautorisés les travaux de réhabilitation à condition qu'il ne s'agisse ni d'une extension en volume\nni d'une surélévation. Toutefois, les redressements de toiture y sont autorisés, ainsi que les\nextensions en infrastructure à l’aplomb des parkings existants.\n    99","6.4 - Implantation des bâtiments \"références\"*\na) la conservation des bâtiments \"référence\", ou parties de bâtiments \"référence\" pourra être\nimposée.\nDans ce cas, les bâtiments conservés pourront être réhabilités ou maintenus dans leur\nimplantation existante, nonobstant les règles générales de la zone.\nb) dans les cas suivants :\n- extension du bâtiment « référence »,\n- reconstruction d'une partie d'un bâtiment référence ou d'une annexe* présentant un intérêt\nmoindre au regard des critères qui auront déterminé le classement du bâtiment principal,\n- construction nouvelle secondaire,\n- reconstruction en cas de démolition autorisée pour des motifs architecturaux, l'implantation\nde la construction nouvelle devra respecter les règles générales de la zone sans altérer le\ncaractère du bâtiment \"référence\" lui-même et en préservant l'intérêt des lieux avoisinants.\nc) dans le cas de sinistre ou péril d'un bâtiment \"référence\" la reconstruction sera imposée à\nl'identique. Cependant si cette reconstruction à l'identique ne peut être mise en œuvre, une\nconstruction nouvelle de qualité pourra remplacer le bâtiment \"référence\" disparu, dans le\nrespect des règles générales d'implantation de la zone et de l'intérêt des lieux avoisinants.\n6.5 - Modalités d'application\nEn l'absence d'indications particulières figurant au plan de zonage, les propriétés situées à\nl'angle de deux voies doivent supporter un alignement nouveau constitué par un segment de\ndroite de 5 mètres de longueur formant des angles égaux avec chacun des alignements* des\nvoies adjacentes*.\n6.6 - Saillies* et encorbellements*\n6.6.1 - Saillies et encorbellements en surplomb des voies* et emprises publiques*\n6.6.1.1 – Saillies et encorbellements en bordure des voies autres que celles définies à l’article\nUD 6.6.1.2\nLes saillies et encorbellements sont autorisés sur les voies et emprises publiques si leur\nlargeur est supérieure ou égale à 12 mètres, dans le respect de l'article UD 11.\nIls sont soumis aux règles suivantes :\n- leur profondeur doit être inférieure ou au plus égale au trentième de la largeur de la voie ou\nde l’emprise et à 1,20 mètre,\n- la partie inférieure de la saillie doit être à une hauteur supérieure ou égale à 5,50 mètres au-\ndessus du niveau du trottoir.\n6.6.1.2 – Saillies et encorbellements en bordure de certaines voies\nLe long du Boulevard Bineau (RD 908), du Boulevard Bourdon, du Boulevard du Général\nLeclerc, du Boulevard du Général Koenig (RD1), les saillies doivent être conformes à la\nréglementation départementale en vigueur.\n6.6.1.3 – La mise en place d’une isolation thermique en saillie sur domaine public à partir du\nplancher haut du rez-de-chaussée est autorisée sur les bâtiments existants sous réserve de\nfaire l’objet d’un traitement architectural d’ensemble de qualité.\n    100","6.6.2 - Saillies et encorbellements en surplomb des marges de reculement*\nLes saillies et encorbellements dans le respect de l'article UD 11 sont autorisés sur les marges\nde reculement d'au moins 4 mètres.\nIls sont soumis aux règles suivantes :\n- la profondeur de la saillie ou de l’encorbellement doit être inférieure ou au plus égale à 1,20\nmètres si la largeur de la marge de reculement est égale ou supérieure à 4,00 mètres. Elle doit\nêtre inférieure ou au plus égale à 1,40 mètre si la marge de reculement est égale ou supérieure\nà 10 mètres,\n- la partie inférieure de la saillie ou de l’encorbellement doit être à une hauteur supérieure ou\nau moins égale à 2,60 mètres au-dessus du niveau du terrain*.\n6.6.3 – Modénatures\nLes modénatures sont autorisées en saillies.\n6.7 - Implantation des constructions figurant sur les plans-masse\nPour les unités foncières réglementées par un plan-masse, l'implantation des bâtiments par\nrapport aux voies est déterminée conformément aux dispositions des planches graphiques ci-\naprès, nonobstant les règles définies ci-dessus.\nArticle UD.7 – Implantation des constructions par rapport aux limites séparatives\nIl est fait application des dispositions des articles 8.1 et 8.2 des dispositions générales pour la\ndiversité de l’habitat.\n7.1 - Dans le secteur UDa\n7.1.1 - Dans une bande de 20 mètres comptée à partir de l'alignement* de la limite de la\nvoie privée ou de tout recul imposé :\nLes constructions peuvent s'implanter en retrait ou sur les limites séparatives*.\n7.1.2 - Au-delà de la bande de 20 mètres comptée à partir de l'alignement de la limite de\nla voie privée ou de tout recul imposé :\nL'implantation sur les limites séparatives n'est autorisée que dans le cas suivant :\n- lorsque les constructions s'adossent à une construction en bon état et de dimensions égales\nou supérieures existant sur le fonds voisin, et s'insèrent dans les héberges existantes, ou\ns'adossent à un mur de clôture existant d'au moins 5 mètres de haut.\n    101","7.1.3 - Dispositions relatives à l'implantation des bâtiments situés en retrait des limites\nséparatives :\n7.1.3.1 - Implantation des façades* ou parties de bâtiment comportant des baies\nprincipales*\na) la distance d'une façade comportant des baies principales mesurée horizontalement à la\nlimite séparative doit être au moins égale à la hauteur de cette façade avec un minimum de\n12 mètres\nb) la distance comptée horizontalement de la façade d’une construction à rez-de-chaussée\ncomportant des baies principales* aux limites séparatives, constituées d'un mur aveugle* ou\nde clôture d'au moins 5 mètres de haut, doit être au moins égale à 9 mètres.\n7.1.3.2 - Implantation des façades ou parties des bâtiments ne comportant pas de baies\nprincipales (baies secondaires* ou absence de baies*)\nLa distance mesurée horizontalement d'une façade ne comportant pas de baies principales à\nla limite séparative doit être à la moitié de la hauteur du bâtiment, sans pouvoir être inférieure\nà 3 mètres.\n7.2 Dans les secteurs UDb et UDc\n7.2.1 - Par rapport aux limites séparatives* aboutissant aux voies\n7.2.1.1 - Cas d'implantation des façades ou parties de bâtiment en retrait des limites\nséparatives aboutissant aux voies\n7.2.1.1.1 - Implantation des façades ou parties de bâtiments comportant des baies principales\nLa distance d'une façade comportant des baies principales mesurée horizontalement à la limite\nséparative doit être au moins égale à la hauteur de cette façade avec un minimum de 12\nmètres et de 1/6ème de la largeur de l’unité foncière*.\nLa distance comptée horizontalement de la façade d’une construction à rez-de-chaussée\ncomportant des baies principales aux limites séparatives constituées sur le fonds voisin ou en\nmitoyenneté d'un mur aveugle ou de clôture d'au moins 5 mètres de haut, doit être au moins\négale à 9 mètres.\n7.2.1.1.2 - Implantation des façades ou parties des bâtiments ne comportant pas de baies\nprincipales (baies secondaires ou absence de baies)\nLa distance mesurée horizontalement d'une façade ne comportant pas de baies principales à\nla limite séparative doit être au moins égale au 1/6ème de la largeur de l’unité foncière, sans\npouvoir être inférieure à 3 mètres.\n7.2.1.2 - Cas d'implantation des façades ou parties de bâtiment sur les limites\nséparatives* aboutissant aux voies\n7.2.1.2.1 - Cas d'implantation sur les deux limites\na) l'implantation sur les limites est obligatoire sur une profondeur de 15 mètres comptée à\npartir de l'alignement ou des reculements imposés, lorsque l’unité foncière comprend une\nbande de 15 mètres figurée au plan de zonage avec la mention \"ordre continu\".\nb) l'implantation sur les deux limites est autorisée sur une profondeur de 15 mètres comptée\nà partir de l'alignement ou des reculements imposés uniquement dans les cas suivants :\n- si la construction peut s'adosser à deux constructions en bon état édifiées en bordure des\nreculements imposés et s'inscrire dans les héberges existantes ou s'adosser à un mur de\nclôture* existant d'au moins 5 mètres de haut,\n    102","Ou\n- lorsque l’unité foncière a une largeur inférieure ou égale à 18 mètres.\n7.2.1.2.2 - Cas d'implantation sur une seule limite\nL'implantation sur une seule limite est autorisée uniquement dans les cas suivants :\n- sur une profondeur de 15 mètres à partir de l'alignement* ou des reculements imposés si la\nlargeur de l’unité foncière est comprise entre 18 mètres et 20 mètres inclus et à condition de\nréserver en bordure de la limite séparative* opposée, une marge d'isolement* au moins égale\nau 1/6ème de la largeur de l’unité foncière,\nOu\n- lorsque la construction peut s'adosser à une construction en bon état situé sur le fonds voisin\net s'inscrire dans les héberges existantes ou s'adosser à un mur de clôture existant d'au moins\n5 mètres de haut et à condition de réserver en bordure de la limite séparative* opposée, une\nmarge d'isolement au moins égale au 1/3 de la largeur de l’unité foncière.\n7.2.2 - Par rapport aux limites séparatives* n’aboutissant pas aux voies (limites de fond)\n7.2.2.1 - Cas d'implantation des façades ou parties de bâtiment en retrait des limites\nséparatives de fond\n7.2.2.1.1 - Implantation des façades ou parties de bâtiment comportant des baies principales*\nLa distance mesurée horizontalement d'une façade comportant des baies principales à la limite\nséparative*, doit être au moins égale à la hauteur de cette façade, sans pouvoir être inférieure\nà 12 mètres.\nLa distance comptée horizontalement de la façade d’une construction à rez-de-chaussée\ncomportant des baies principales* aux limites séparatives constituées d’un mur aveugle* ou\nde clôture d’au moins 5 mètres de haut doit être au moins égale à 9 mètres.\n7.2.2.1.2 - Implantation des façades ou parties de bâtiment ne comportant pas de baies\nprincipales* (baies secondaires* ou absence de baies*)\nLa distance mesurée horizontalement d'une façade ne comportant pas de baies principales à\nla limite séparative* doit être au moins égale à la moitié de la hauteur du bâtiment, sans pouvoir\nêtre inférieure à 3 mètres.\n7.2.2.2 - Cas d'implantation des façades ou parties de bâtiment sur les limites\nséparatives de fond\nL'implantation sur les limites séparatives est autorisée uniquement dans les cas suivants :\n- si la profondeur de l’unité foncière mesurée au-delà des reculements imposés est inférieure\nou égale à 15 mètres,\nOu\n- si elles s'adossent à une construction en bon état située sur le fonds voisin et s'inscrivent\ndans les héberges existantes ou s'adossent à un mur de clôture existant d'au moins 5 mètres\nde haut\n7.3 - Si une façade ou une partie de bâtiment comportant des baies principales* n'est\npas parallèle aux limites séparatives*\n- la distance mesurée horizontalement au milieu de la façade à la limite séparative doit être au\nmoins égale à la hauteur de cette façade, sans pouvoir être inférieure à 12 mètres,\n- la distance mesurée horizontalement de la façade à la limite séparative doit être au moins\négale aux 3/4 de la hauteur de cette façade, sans pouvoir être inférieure à 9 mètres.\n    103","7.4 - Implantation des bâtiments \"références\"*\na) la conservation des bâtiments \"référence\", ou parties de bâtiments \"référence\" pourra être\nimposée.\nDans ce cas, les bâtiments conservés pourront être réhabilités ou maintenus dans leur\nimplantation existante, nonobstant les règles générales de la zone.\nb) dans les cas suivants :\n- extension du bâtiment référence,\n- reconstruction d'une partie d'un bâtiment référence ou d'une annexe* présentant un intérêt\nmoindre au regard des critères qui auront déterminé le classement du bâtiment principal,\n- construction nouvelle secondaire,\n- reconstruction en cas de démolition autorisée pour des motifs architecturaux,\nL’implantation de la construction nouvelle devra respecter les règles générales de la zone\ndéfinies aux articles UD 7.1, 7.2, 7.3 sans altérer le caractère du bâtiment \"référence\" lui-\nmême et en préservant l'intérêt des lieux avoisinants.\nc) dans le cas de sinistre ou péril d'un bâtiment \"référence\" la reconstruction sera imposée à\nl'identique.\nCependant si cette reconstruction à l'identique ne peut être mise en œuvre, une construction\nnouvelle de qualité pourra remplacer le bâtiment \"référence\" disparu, dans le respect des\nrègles générales d'implantation de la zone et de l'intérêt des lieux avoisinants.\n7.5 - Cas des unités foncières d'angles\nA l'angle des voies, les prescriptions susvisées restent applicables.\nCependant, lorsque les reculements figurent au plan, on considère que la largeur de l’unité\nfoncière est égale à la distance mesurée respectivement entre le reculement imposé et la limite\nséparative opposée.\nLes constructions peuvent être implantées sur les limites séparatives lorsque cette distance\nest inférieure ou égale à 15 mètres.\n7.6 - Modalités d'application\nSe reporter à la définition de Hauteur*\n7.7 – Saillies* et encorbellements* dans les marges d'isolement* (latérales et arrières)\ndans le respect de l'article UD 11\nDans les marges d’isolement définies aux articles UD 7.1, 7.2 et 7.3, les constructions en\nsuperstructure sont interdites à l'exception des encorbellements et des saillies ; les\nconstructions en infrastructure y sont autorisées.\nLes saillies et encorbellements ne sont autorisés que lorsque la distance séparant la façade\nde la construction projetée à la limite séparative opposée est supérieure ou égale à 12 mètres.\nIls sont soumis aux règles suivantes :\n    104","- la partie inférieure de la saillie ou de l’encorbellement doit être située à une hauteur au moins\négale à 2,60 mètres au-dessus du terrain* au droit de la saillie.\n- la profondeur de la saillie ou de l’encorbellement ne peut excéder le dixième de la distance\nentre la façade et la limite séparative* et 1,40 mètre.\n7.8 - Servitude de cour commune\nLes constructions peuvent être implantées à une distance moindre que celle définie ci-dessus,\nlorsque les deux propriétaires voisins, par acte authentique s'obligent réciproquement à créer\nune servitude de cour commune au sens de l'article L.471-1 à L.471-3 du Code de l'Urbanisme\nou lorsqu'elle est instituée par voie judiciaire.\nEn outre, l’édification d’une construction en limite de cour commune doit respecter les\ndispositions de l’article UD 8 par rapport aux constructions situées sur l’unité foncière voisine\nconcernée par ladite servitude.\n7.9 - Implantation des constructions figurant sur les plans-masse\nPour les unités foncières réglementées par un plan-masse, l'implantation des bâtiments par\nrapport aux limites séparatives* est déterminée conformément aux dispositions des planches\ngraphiques ci-après, nonobstant les règles définies ci-dessus.\n7.10 – Courettes\nLes constructions pourront ne pas respecter les articles UD 7.1 à 7.3 lorsqu’existe, sur le fonds\nvoisin, une courette en limite séparative* dont les façades comportent une ou des baies et que\nle projet prévoit, en regard de cette courette, la réalisation d’une courette d’une largeur au\nminimum identique à celle du fonds voisin et d’une profondeur (P) d’1,90 mètre minimum. Il en\nsera de même lorsqu’il existe sur le fonds voisin une baie en limite séparative.\n    Croquis\n    VOIE\n7.11 – Règles particulières concernant les constructions et installations nécessaires au\nservice public et d’intérêt collectif (CINASPIC)*\nLorsque les constructions ne sont pas implantées sur limites séparatives*, la distance comptée\nhorizontalement de la façade d'un bâtiment aux limites séparatives doit être au moins égale à\nla moitié de la hauteur du bâtiment sans pouvoir être inférieure à 3 mètres.\n    105","Article UD.8 – Implantation des constructions les unes par rapport aux autres sur une\nmême propriété\nIl est fait application des dispositions des articles 8.1 et 8.2 des dispositions générales pour la\ndiversité de l’habitat.\n8.1 – Pour une construction comprenant des façades en vis-à-vis, l’implantation de ces\nfaçades n’a pas à respecter les règles édictées ci-dessous à l’intention des bâtiments non\ncontigus*.\n8.2 - L’implantation des bâtiments non contigus doit se faire selon les règles suivantes:\nLa distance, comptée horizontalement, séparant deux façades* de bâtiments non contigus est\nau moins égale :\na) la hauteur de la façade la plus haute, avec un minimum de 12 mètres, si la façade la plus\nbasse comporte des baies principales*,\nb) la hauteur de la façade la plus basse, avec un minimum de 12 mètres, si cette dernière ne\ncomporte pas de baies principales et que la façade la plus haute en comporte,\nc) au minimum de la hauteur de la façade la plus basse et à la moitié de la hauteur de la façade\nla plus haute, avec un minimum de 4 mètres, si les deux façades ne comportent pas de baies\nprincipales.\n8.3 - Implantation des bâtiments \"références\"*\na) la conservation des bâtiments \"référence\", ou parties de bâtiments \"référence\" peut être\nimposée.\nDans ce cas, les bâtiments conservés peuvent être réhabilités ou maintenus dans leur\nimplantation existante, nonobstant les règles générales de la zone.\nb) dans les cas suivants :\n- extension du bâtiment référence,\n- reconstruction d'une partie d'un bâtiment référence ou d'une annexe* présentant un intérêt\nmoindre au regard des critères qui auront déterminé le classement du bâtiment principal,\n- construction nouvelle secondaire,\n- reconstruction en cas de démolition autorisée pour des motifs architecturaux, l'implantation\nde la construction nouvelle devra respecter les règles générales de la zone définies aux articles\nUD 8.1 et UD 8.2 sans altérer le caractère du bâtiment \"référence\" lui-même et en préservant\nl'intérêt des lieux avoisinants.\nc) dans le cas de sinistre ou péril d'un bâtiment \"référence\" la reconstruction sera imposée à\nl'identique.\nCependant si cette reconstruction à l'identique ne peut être mise en œuvre, une construction\nnouvelle de qualité pourra remplacer le bâtiment \"référence\" disparu, dans le respect des\nrègles générales d'implantation de la zone et de l'intérêt des lieux avoisinants.\n    106","8.4 – Saillies* et encorbellements* entre deux façades en vis-à-vis dans le respect de\nl'article UD 11\nIls ne sont autorisés que lorsque la distance séparant les deux façades à l'opposite est\nsupérieure à 12 mètres.\nIls sont soumis aux règles suivantes :\n- la partie inférieure de la saillie ou de l’encorbellement doit être située à une hauteur au moins\négale à 2,60 mètres au-dessus du niveau du terrain*,\n- la profondeur de la saillie ou de l’encorbellement ne peut excéder le dixième de la distance\nentre les deux façades et dans tous les cas, ne peut excéder 1,40 mètre.\n8.5 - Implantation des constructions figurant sur les plans-masse\nPour les unités foncières* réglementées par un plan-masse, l'implantation des bâtiments par\nrapport aux limites séparatives* est déterminée conformément aux dispositions des planches\ngraphiques ci-après, nonobstant les règles définies ci-dessus.\n8.6 – Modalités d’application\nSe reporter à la définition de Hauteur*\nArticle UD.9 – Emprise au sol des constructions\nIl est fait application des dispositions des articles 8.1 et 8.2 des dispositions générales pour la\ndiversité de l’habitat.\n9.1 – Disposition particulière au secteur UDa\nL'emprise au sol* des bâtiments ne peut excéder 55% de la superficie totale de l’unité\nfoncière*.\nNonobstant les dispositions de l'article UD 9.1, une emprise au sol minimale est autorisée de\n100 m² sur les unités foncières ayant une façade sur voie.\n9.2 – Dispositions particulières aux secteurs UDb et UDc\n9.2.1 - Si l’unité foncière ne comprend aucune bande figurée au plan (règles particulières de\nla légende du document graphique) :\nL'emprise au sol des bâtiments ne peut excéder 36% de la superficie totale de l’unité foncière.\n9.2.2 - Si l’unité foncière comprend une bande de 15 mètres figurée au plan (règles\nparticulières de la légende du document graphique) :\n- dans cette bande de 15 mètres, l'emprise au sol n'est limitée que par l'application des autres\narticles du règlement.\n- au-delà de cette bande, l'emprise au sol ne peut excéder 36 % de la superficie de l’unité\nfoncière située au-delà de cette bande.\n    107","9.2.3 - Nonobstant les dispositions prévues aux articles UD 9.2.1 et UD.9.2.2, l'emprise au sol\nn'est pas limitée pour les unités foncières existantes situées à l'angle de deux voies et d’une\nsuperficie inférieure à 300 m².\n9.3 - Emprise des bâtiments \"références\"*\na) la conservation des bâtiments \"référence\", ou parties de bâtiments \"référence\" peut être\nimposée.\nDans ce cas, les bâtiments conservés peuvent être réhabilités ou maintenus dans leur emprise\nexistante, nonobstant les règles de l’article UD.9.\nb) dans les cas suivants :\n- extension du bâtiment référence,\n- reconstruction d'une partie d'un bâtiment référence ou d'une annexe* présentant un intérêt\nmoindre au regard des critères qui auront déterminé le classement du bâtiment principal,\n- construction nouvelle secondaire,\n- reconstruction en cas de démolition autorisée pour des motifs architecturaux,\nL’emprise de la construction nouvelle devra respecter les règles générales de la zone définies\naux articles UD 9.1 et 9.2 sans altérer le caractère du bâtiment \"référence\" lui-même et en\npréservant l'intérêt des lieux avoisinants.\nc) dans le cas de sinistre ou péril d'un bâtiment \"référence\" la reconstruction sera imposée à\nl'identique. Cependant si cette reconstruction à l'identique ne peut être mise en œuvre, une\nconstruction nouvelle de qualité pourra remplacer le bâtiment \"référence\" disparu, dans le\nrespect des règles générales d'emprise de la zone et de l'intérêt des lieux avoisinants.\n9.4 – Bâtiments existants\nNonobstant les dispositions des articles UD 9.1 et 9.2 une emprise supplémentaire sera\nautorisée dans la limite de 20 m² pour les locaux à rez-de-chaussée qui améliorent l'hygiène\nou la sécurité tels que les locaux poubelles, les ascenseurs, ou le confort tels qu’une loge de\ngardien les abris pour les vélos, même si le bâtiment existant est déjà excédentaire par rapport\nà la norme.\n9.5 - Emprise des constructions figurant sur les plans-masse\nPour les parcelles réglementées par un plan-masse, l'emprise des bâtiments est déterminée\nconformément aux dispositions des planches graphiques ci-après, nonobstant les règles\ndéfinies ci-dessus.\n9.6.- CINASPIC*\nPour les constructions et installations nécessaires au service public et d’intérêt collectif,\nl’emprise au sol ne peut excéder 65%.\n    108","Article UD.10 – Hauteur maximum des constructions\nIl est fait application des dispositions de l’article 7.3 des dispositions générales pour les unités\nfoncières localisées au plan d
