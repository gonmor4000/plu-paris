e zonage 5.3 et des articles 8.1 et 8.2 des dispositions générales\npour la diversité de l’habitat.\n10.1 - Compte tenu du plafond du secteur\n10.1.1 – Secteur UDa\nSauf règle particulière figurant au plan de zonage, la hauteur maximum des constructions est\nfixée à 21 mètres et R*+6.\n10.1.2 – Secteur UDb\nSauf règle particulière figurant au plan de zonage, la hauteur maximum des constructions est\nfixée à 15 mètres et R+4.\nNonobstant ces dispositions, la hauteur est fixée à 30 mètres pour l'îlot délimité par les 22 à\n22 quater Boulevard du général Leclerc et le 27 rue Soyer.\n10.1.3 – Secteur UDc\nSauf règle particulière figurant au plan de zonage, la hauteur maximum des constructions est\nfixée à 12 mètres et R+3.\n10.1.4 – Dans toute la zone UD\nUn dépassement de la hauteur maximum de 2 mètres pour les bâtiments d’habitation est\nautorisé à la condition que les hauteurs sous plafond* de chaque niveau soient supérieures à\n2,5 mètres, le nombre de niveaux défini pour chaque secteur ne pouvant être dépassé.\nUn dépassement de la hauteur maximum de 1 mètre peut être autorisé et bénéficier\nuniquement au rez-de-chaussée lorsque les constructions comprennent des locaux de\ncommerce ou d’artisanat* en rez-de-chaussée.\n10.2 - Compte tenu des voies\n10.2.1 - La hauteur maximum des constructions est déterminée par la plus courte distance les\nséparant de l'alignement opposé existant ou projeté, augmenté de la marge de reculement*\nimposée sur l'alignement opposé existant ou projeté. En ce qui concerne les voies privées, la\ndistance à prendre en compte pour ce calcul est celle séparant la façade de la construction\nprojetée de la limite opposée de la voie.\n10.2.2 - A l'angle des îlots limités par des voies d'inégales largeurs, la hauteur maximum des\nconstructions édifiées en bordure de la voie la moins large peut être identique à celle autorisée\nen bordure de la voie la plus large. Dans ce cas, la longueur de la façade pouvant bénéficier\nd'un supplément de hauteur ne peut excéder la largeur de la bande de 15 mètres.\n10.2.3 - Toutefois, afin de masquer les murs pignons en bon état sur limites séparatives*\naboutissant aux voies, cette hauteur maximum pourra être dépassée pour assurer un front bâti\ncohérent jusqu'à la hauteur maximum du pignon le plus haut.\n    109","10.3 - Hauteur des bâtiments \"références\"*\na) la conservation des bâtiments \"référence\", ou parties de bâtiments \"référence\" peut être\nimposée.\nDans ce cas, les bâtiments conservés peuvent être réhabilités ou maintenus dans leur hauteur\nexistante, nonobstant les règles de l’article UD.10.\nb) dans les cas suivants :\n- extension du bâtiment référence,\n- reconstruction d'une partie d'un bâtiment référence ou d'une annexe* présentant un intérêt\nmoindre au regard des critères qui auront déterminé le classement du bâtiment principal,\n- construction nouvelle secondaire,\n- reconstruction en cas de démolition autorisée pour des motifs architecturaux, la hauteur de\nla construction nouvelle devra respecter les règles générales de la zone sans altérer le\ncaractère du bâtiment \"référence\" lui-même et en préservant l'intérêt des lieux avoisinants.\nc) dans le cas de sinistre ou péril d'un bâtiment \"référence\" la reconstruction sera imposée à\nl'identique.\nCependant si cette reconstruction à l'identique ne peut être mise en œuvre, une construction\nnouvelle de qualité pourra remplacer le bâtiment \"référence\" disparu, dans le respect des\nrègles générales de hauteur de la zone et de l'intérêt des lieux avoisinants.\n10.4 - Modalités de calcul de la hauteur\nSe reporter à la définition de Hauteur*\n10.5 – Constructions sur toiture-terrasse\nPeuvent dépasser la hauteur maximum, les constructions sur toiture-terrasse qui remplissent\nles conditions cumulatives suivantes :\n   -   Disposer d’une hauteur d’au maximum 3 mètres pour les pièces de loisirs*, sorties\n    d’escalier, pergolas et locaux techniques* (à l’exception des machineries d’ascenseurs\n    qui peuvent atteindre 4 mètres), comptés à partir du niveau de la terrasse\n   -   Etre implantées en retrait des façades d’une distance au moins égale à leur hauteur\n   -   Que leurs surfaces cumulées occupent 20% au plus de la superficie totale de la\n    terrasse de l’immeuble\n   -   Chaque pièce de loisirs ne doit pas dépasser 35m² de surface de plancher, doit être\n    reliée directement aux locaux d’habitation situés au dernier étage et respecter l’article\n    UD 11.2.\n10.6 - Hauteur des constructions figurant sur les plans-masse\nPour les unités foncières réglementées par un plan-masse, la hauteur des bâtiments est\ndéterminée conformément aux dispositions des planches graphiques ci-après, nonobstant les\nrègles définies ci-dessus.\n    110","Article UD.11 – Aspect extérieur des constructions et aménagement de leurs abords\n11.1 - Dispositions générales\n11.1.1. – Tout projet peut être refusé, ou n'être accordé que sous réserve du respect de\nprescriptions spéciales, si la construction par sa situation, son volume, l'aspect, le rythme ou\nla coloration de ses façades, est de nature à porter atteinte au caractère ou à l'intérêt des lieux\navoisinants notamment aux caractères architecturaux spécifiques des bâtiments \"références\"\nidentifiés sur le plan, aux sites, aux paysages naturels ou urbains ainsi qu'à la conservation\ndes perspectives monumentales.\nLes façades des bâtiments projetés doivent être revêtues de matériaux qui présentent un\naspect de qualité, conserver une bonne tenue dans le temps (pierre massive ou pelliculaire,\nmenuiserie en aluminium laqué ou en bois. ).\nL'emploi de matériaux dits réfléchissants* est interdit.\nLes menuiseries ou les ferronneries qui participent à l'image de l'ensemble d'un édifice doivent\nconserver ou retrouver ce caractère, par la finesse des sections et des moulures d'origine, par\nla qualité des matériaux, notamment :\n- les persiennes ne doivent pas être ajoutées sur les façades où, non prévues à l’origine, elles\nmasquent les modénatures et les décors. Les persiennes qui participent au décor de la façade\ndoivent être conservées,\n- les garde-corps, grilles, clôtures, le cas échéant, doivent conserver les matériaux tels que fer\nforgé ou fonte moulée,\n- les menuiseries ou les ferronneries doivent chacune être d'une seule couleur sur une même\nfaçade, toutefois les portes cochères et devantures peuvent avoir des couleurs plus soutenues.\nLe traitement des souches, les systèmes de ventilation, de climatisation et les surélévations\ndes conduits, notamment les conduits de fumée ou de ventilation, devront être encoffrés le\nlong des pignons en harmonie avec le pignon.\nL’installation de systèmes de climatisation est en outre interdite en façade, à l’exception des\nfaçades sur cour et au rez-de-chaussée pour les commerces.\nLes installations tels que écrans, grillages, treillis, au-dessus des garde-corps, sont interdits.\n11.1.2 - Ravalements\nLes ravalements doivent être exécutés en respectant les matériaux des façades d'origine (les\nrevêtements en ciment gris ainsi que la peinture de la pierre de taille et des briques sont\ninterdits) et sans atténuer aucun des détails. Ils doivent être exécutés sur toute la façade y\ncompris les délaissés de pignon, de manière à respecter l'homogénéité de la composition de\nla façade.\n11.1.3 – Antennes et paraboles\nLes antennes paraboliques et autres antennes sont interdites en façade. Elles doivent être\ninstallées en toiture et en retrait des façades. Elles ne doivent pas porter atteinte à la qualité\narchitecturale environnante.\n11.1.4.- Les encorbellements* en façade doivent avoir une longueur inférieure ou au plus\négale au tiers de la longueur de la façade intéressée.\n11.1.5 - Les cours anglaises* sont interdites.\n    111","11.1.6- Traitement des façades et modification des façades existantes\nLes façades doivent être ordonnées pour respecter une cohérence dans le style de la\nconstruction, les hauteurs d'étages, les proportions des ouvertures et une harmonie dans le\nchoix des couleurs et des matériaux.\nNotamment :\n- les modifications effectuées sur une construction existante doivent tenir compte de la\ncomposition d’ensemble de l’édifice,\n- toutes les façades d'une construction, notamment les mur-pignons (mitoyens ou non) doivent\nêtre traitées en harmonie avec la façade dite \"principale\" bordant l’espace public, mais en\ntenant compte des différences d’orientation et d’usage. Les locaux accessoires doivent être\ntraités avec un soin égal à celui apporté aux bâtiments principaux,\n- les couleurs ne doivent pas créer de ruptures dans la lecture du paysage bâti,\n- les travaux sur façade doivent mettre en valeur les détails, permettre la suppression des\najouts qui dénaturent le caractère de la façade, la réutilisation de matériaux traditionnels.\nNotamment, les modénatures, les éléments sculptés, les décors, qui ont un caractère\nremarquable, doivent être conservés, réparés lorsqu’ils sont dégradés et reconstitués lorsqu’ils\nont été supprimés,\n- les raccordements aux réseaux de distribution de l’électricité, du gaz et de\ntélécommunication, doivent être dissimulés ou intégrés au bâti.\n11.1.7 - Les pignons sur les limites séparatives ainsi que les locaux en superstructure doivent\nrecevoir un revêtement en harmonie avec les façades.\nLes murs pignons des bâtiments existants laissés ou rendus apparents par une construction\nnouvelle ou à la suite de la démolition d'une construction jointive, doivent recevoir un enduit\nen harmonie avec la façade voisine, ciment - pierre ou matériau similaire.\nPour les constructions existantes, l'aspect des façades des extensions de toute nature doit\nêtre en harmonie avec les matériaux constituant des façades existantes.\n11.1.8 - Accès carrossables et entrées d'immeubles\nLes accès carrossables à la voie publique, notamment les portes et rampes de garage, doivent\navoir un impact visuel minimum sur la composition architecturale des édifices et des végétaux\nqui l'accompagnent, notamment sur la composition des soubassements des immeubles.\nLes transparences des immeubles au rez-de-chaussée doivent être conservées ou\naménagées lorsque l'architecture de l'immeuble et l'environnement le permettent.\n11.1.9 - Devantures\nLes compositions des devantures doivent tenir compte de la composition architecturale de la\nfaçade de l’immeuble.\nLes devantures pourront présenter une saillie* ou un empiètement par rapport au nu de la\nfaçade sous réserve de l’accord de l’autorité gestionnaire de la voie et de l’emprise publique.\nDans les bâtiments \"référence\"*, les baies* d’origine dans lesquelles s'inscrivent les\ndevantures doivent être conservées ou restituées.\n11.1.10 - Stores, bannes\nLes stores doivent contribuer à l'unité de la composition des façades des immeubles.\nNotamment :\n- ils doivent s'inscrire dans les percements en respectant leur géométrie et rester en dessous\ndes linteaux travaillés, sans les altérer,\n- seuls sont autorisés les stores-capotes et les stores sans lambrequin ni joues. Toutefois les\nstores situés à rez-de-chaussée pourront comporter un lambrequin,\n- ils doivent être mobiles, en toile tissée, d'une couleur uniforme sur la totalité des percements\nd'un même immeuble. Cette couleur sera choisie parmi les tons clairs, notamment gris, sable\net blanc cassé. Cette disposition ne s’applique pas aux commerces.\n    112","Les bannes en saillie sur le domaine public doivent participer à une harmonie d'ensemble du\npaysage de l'avenue.\n11.1.11 – Clôtures et jardins\nLa mise en valeur des espaces bâtis doit être accompagnée de celle des espaces non-bâtis\n(mise en valeur paysagère des marges plantées, jardins, cours intérieures) dans le respect de\nl'article UD 13, en particulier en ce qui concerne les jardins entourant les hôtels particuliers.\n11.2 - Dispositions applicables aux toitures-terrasses\n11.2.1.- Les toitures-terrasses seront conçues comme une cinquième façade. Une\nvégétalisation des toitures terrasses sera recherchée.\n11.2.2 - En cas de construction d’une pièce de loisirs sur la toiture-terrasse, un habillage\nvégétal en périphérie de la toiture sera imposé.\n11.2.3 - Tout garde-corps devra s’intégrer au style architectural de l’immeuble (aspect\nextérieur, matériau,…) ou devra avoir un impact visuel réduit (transparence,…).\n11.3 – Clôtures\n11.3.1 - L’édification de clôtures en bordure des voies* publiques et privées, est imposée à\nl’alignement*. La clôture doit être constituée par un mur bahut de 0,80 mètre de hauteur\nmaximum surmonté d'une grille à claire-voie, la hauteur totale ne pouvant excéder 2,20 mètres.\n11.3.2 - Dans la marge de reculement*, les clôtures doivent être identiques à celles sur\nl'alignement*.\n11.3.3 - Au-delà de la marge de reculement, les clôtures en limites de propriété ne doivent pas\nexcéder 3 mètres de haut.\n11.3.4 - Sur toutes les clôtures, sont formellement interdits, les écrans de tôle, treillage,\ncanisses, etc. de quelque nature que ce soit. Cependant, la grille à claire-voie peut être\ndoublée par un écran de verre transparent et, ou, de la végétation.\n11.3.5 - En bordure des boulevards des Sablons, Maillot, Maurice Barrès et du Général\nKoenig, les clôtures* des propriétés doivent être constituées par une grille de fer, bronzée de\nla même teinte, reposant sur un socle bas conformément au modèle adopté pour l'avenue de\nl'Impératrice (aujourd'hui avenue Foch à Paris) par la loi du 22 juin 1854 et par le décret du 13\naoût suivant, modèle adopté pour le chemin de l'Empereur entre Saint Cloud et le bois de\nBoulogne (aujourd'hui Quai du 4 septembre à Boulogne Billancourt).\nLes clôtures séparant les propriétés contiguës ou situées à l'alignement des voies aboutissant\nau boulevard doivent être identiques au modèle susvisé, dans la marge de reculement.\n11.4 - Bâtiments \"références\"*\nLes bâtiments « référence » sont protégés au titre des dispositions de l’article L. 151-19 du\nCode de l’Urbanisme.\n11.4.1 - Conservation des bâtiments \"référence\" figurant au plan de zonage\nLa conservation des bâtiments référence peut être imposée en tout ou en partie. Lorsqu'elle\nest imposée, la restauration de ces bâtiments ou partie de bâtiments, doit conserver ou\nrestituer les dispositions architecturales spécifiques à leur époque, sans exclure certains\naménagements mineurs concourant à l'amélioration des conditions d'habitabilité et d’hygiène.\nDans le cas de construction sinistrée ou dont la vétusté constitue un péril, il pourra être imposé\nsoit la reconstruction à l’identique de tout ou partie de l'édifice endommagé, soit la\n    113","reconstruction avec un projet comportant une architecture de qualité ayant un caractère\ncontemporain qui tienne rigoureusement compte, dans le cas d'une reconstruction partielle,\ndes caractères architecturaux de l’édifice existant.\n11.4.2 - Composition des bâtiments \"référence\"\nLes compositions des bâtiments référence doivent être sauvegardées dans le respect des\ncaractères propres à chacun des types de bâtiments référence, notamment :\n- le soubassement*, le corps principal et le couronnement* d'un bâtiment doivent être traités,\nle cas échéant, dans une composition d'ensemble,\n- les couronnements* doivent être mis en valeur en sauvegardant ou retrouvant pentes et\ndétails des toitures d'origine, notamment lucarnes et corniches, ainsi que les détails des\nniveaux hauts qui les soulignent, en particulier balcons moulurés, consoles ou denticules.\n11.4.3 - Transitions avec les bâtiments référence\nLes compositions des bâtiments projetés doivent traiter les transitions entre construction\nnouvelle et bâtiment référence contigu*, notamment en ce qui concerne les volumétries, la\nnature des percements et le choix des matériaux.\n11.4.4 - Immeubles constituant des ensembles (type maisons de ville, hôtels jumelés,\nimmeubles-îlots ou constituant des fronts de rues ayant un caractère unitaire)\nLa mise en valeur des bâtiments référence constituant des ensembles architecturaux, du type\nmaisons construites en bande, immeubles-îlots ou fronts de rues ayant un caractère unitaire,\nainsi que la composition des bâtiments projetés qui les jouxtent, devra concourir à conserver\nou retrouver une unité du front bâti (notamment dans les volumétrie, composition des façades,\nle choix des matériaux et des couleurs).\nLes constructions semblables groupées deux à deux, en bande ou en vis-à-vis, doivent\nconserver ou retrouver les similitudes exactes de composition, notamment volumétries,\ntoitures, couleurs et décors.\n11.4.5 - Traitement des toitures des bâtiments \"référence\"\n11.4.5.1 - Dispositions générales\nLes toitures des bâtiments référence doivent être traitées en harmonie avec le caractère des\nfaçades du bâtiment qu'elles couvrent.\nLes toitures modifiées et celles des extensions des bâtiments référence doivent s'inscrire dans\nla composition des toitures existantes des bâtiments \"références\" et retrouver, tous les détails\net les matériaux de qualité mis en oeuvre à l'origine.\nLes types, les volumes, les matériaux et les couleurs des toitures des bâtiments projetés\ndoivent contribuer à l'intégration des constructions dans le paysage bâti des bâtiments\n\"références\".\nLes matériaux de toitures doivent présenter un aspect de qualité et conserver une bonne tenue\ndans le temps (zinc, ardoise...).\n11.4.5.2 - Aménagements techniques\nLes locaux techniques, notamment les chaufferies, appareils de conditionnement d'air, doivent\nêtre intégrées dans le volume des toitures existantes des bâtiments référence.\nCependant, une sur-hauteur pourra être autorisée pour permettre l'implantation en terrasse\nd'une machinerie d'ascenseur, sous réserve qu'elle ne soit pas visible depuis le domaine public\net qu'elle ne nuise pas aux caractères du bâtiment référence lui-même et des lieux avoisinants.\n11.4.6 - Traitements des façades des bâtiments \"référence\"\nLes façades des bâtiments référence doivent conserver ou retrouver la richesse des matériaux\nd'origine et de leur mise en oeuvre, notamment le plâtre mouluré, la pierre et la brique ainsi\nque le bois, les moellons ou la céramique, le cas échéant.\n    114","11.4.7 - Les clôtures existantes caractéristiques des styles des bâtiments référence doivent\nêtre conservées.\n11.5 - Éclairage des façades\nLes dispositifs permanents d’éclairage des façades sont interdits, à l’exception des dispositifs\nde détection de mouvements ou d’intrusion et des dispositifs ponctuels mettant en relief des\npoints singuliers de la façade du bâtiment. Cette interdiction ne s’applique pas aux CINASPIC*.\nArticle UD.12 – Obligations imposées aux constructeurs en matière de réalisation\nd’aires de stationnement\n12.1 - Dispositions générales\nPour toute opération de construction, soumise ou non à autorisation de construire, ou tout\nchangement de destination, s’accompagnant de la réalisation d’aires de stationnement, ces\ndernières devront être réalisées à l’intérieur des constructions ou en sous-sol*. Leurs\ncaractéristiques et leurs normes sont définies ci-après.\n12.1.1 – Les places doubles sont autorisées dans les bâtiments à destination d’habitation,\navec au minimum une place par logement directement accessible à l’aire de dégagement de\ndesserte.\n12.1.2 - Les rampes d'accès doivent avoir la largeur suivante :\n- sens unique : 3,50 mètres\n- double sens desservant jusqu'à 50 voitures : 3,50 mètres\n• Cette largeur est comprise entre chasse-roues et la rampe doit être munie d'un feu bicolore,\n• Leur rayon de courbure intérieur ne doit pas être inférieur à 5 mètres. Dans le cas où il est\négal à 5 mètres, la largeur de la rampe doit être portée à 4 mètres dans la courbe.\n- double sens desservant plus de 50 voitures : 5 mètres\n- les rampes desservant des stationnements prévus pour les autocars doivent être\ndimensionnées de manière à permettre le passage de ces véhicules.\nCes rampes ne doivent pas entraîner de modification dans le niveau du trottoir.\nLa pente dans les cinq premiers mètres à partir de l'alignement ne doit pas excéder 5 %.\nCes dispositions, à l’exception de celle relative à l’absence de modification dans le niveau du\ntrottoir, ne s’appliquent pas aux rampes d’accès des bâtiments existants.\n12.1.3 - Les besoins en stationnement des véhicules motorisés individuels sont\ncalculés de la manière suivante :\n12.1.3.1 - Constructions à destination d'habitation\n- chambres individuelles    1 place / 2 chambres\n- studios et 2 pièces    1 place / logement\n- 3 et 4 pièces    1,5 place / logement\n- 5 pièces et plus    2 places / logement\nPour les logements d'une surface de plancher inférieure à 80 m², il sera exigé une seule place\nde stationnement par logement, nonobstant les règles précédemment définies.\n    115","A moins de 500 mètres d’une gare ou d’une station de transport public guidé ou de transport\ncollectif en site propre et dès lors que la qualité de la desserte le permet : 1 place / logement.\nConstructions existantes :\nL’obligation de réaliser des aires de stationnement n’est pas applicable aux travaux de\ntransformation ou d’amélioration de logements existants, dans le cas où ces travaux ne\ns’accompagnent pas de la création de surface de plancher supplémentaire.\n12.1.3.2 Construction de logements locatifs financés avec un prêt aidé par l’Etat, le nombre\nde places minimal est le suivant :\n- règle générale : 1 place / logement\n- logement d’une surface de plancher inférieure à 60 m² : 0,5 place / logement\n- à moins de 500 mètres d’une gare ou d’une station de transport public guidé ou de transport\ncollectif en site propre et dès lors que la qualité de la desserte le permet : 0,5 place / logement\n- logement sur une unité foncière inférieure à 500 m² (dans tous les cas) : pas de place exigée\nL’obligation de réaliser des aires de stationnement n’est pas applicable aux travaux de\ntransformation ou d’amélioration de logements locatifs financés avec un prêt aidé par l’État, y\ncompris dans le cas où ces travaux s’accompagnent de la création de surface de plancher.\n12.1.3.3 – Occupations du sol autres que celles à destination d'habitation\n- Bureau* : Il est imposé (avec interdiction de réaliser plus de places que la norme):\n    - 1 place pour 70m² de surface de plancher\n    - 1 place pour 90m² de surface de plancher à moins de 500 mètres d’un point de\n    desserte par des lignes de transports collectifs structurantes*.\n- Artisanat* : 20 % de la surface de plancher de la construction avec au minimum 1 place.\n- Commerces :\n- Commerces inférieurs ou égaux à 200 m² de surface de plancher : 60 % de la surface de\nplancher de la construction avec un minimum de 2 places\n- Commerces supérieurs à 200 m² de surface de plancher: 100 % de la surface de plancher\nde la construction + places de livraison* de dimensions suffisantes\n- Marchés couverts 60 % de la surface de plancher de la construction + places aux véhicules\ndes commerçants (X x 35 m²)\n- Hôtels 1 place / 3 chambres et une place de autocar par tranche de 30 chambres,\n- Restaurants (hors restaurants d’entreprise): surface de plancher:\n< Ou égale à 100 m² : 5 places\n100 m² < surface de plancher < ou égale à 350 m ² :10 places\n>350 m² : 60 places\nPour tout commerce, des places de livraison* correspondant aux besoins doivent également\nêtre réalisées.\nPour tout commerce avec livraison*, il est exigé, en plus des stationnements pour les véhicules,\nla réalisation de places de stationnement pour les deux roues motorisés en dehors de la voie\npublique et en fonction des besoins générés par l’activité.\nNota : De plus, toute place de stationnement générée par l’exercice d’une activité doit être\nréalisée en dehors de la voie publique (auto-école, locations automobiles,..).\n    116","CINASPIC :\nIl est imposé (avec interdiction de réaliser plus de places que la norme):\n    -   1 place pour 70m² de surface de plancher créée\n    -   1 place pour 90m² de surface de plancher créée à moins de 500 mètres d’un point de\n    desserte par des lignes de transports collectifs structurantes*.\nAucune place n’est exigée pour l’extension de CINASPIC existants, dès lors que l’extension\nn’excède pas 70% de la surface de plancher existante.\nNOTA : Dans le cas où les aires de stationnement sont définies par des surfaces, le nombre\nde places doit être égal au quotient de la surface considérée par 25 m².\n12.1.4 - Norme de stationnement vélo dans les constructions neuves et lors de travaux\nsur parcs existants\nLe stationnement des vélos devra respecter les dispositions et les normes du Code de la\nConstruction et de l’Habitation ainsi que les normes minimums prescrites dans le Plan de\nDéplacement Urbain d’Ile-de-France en vigueur.\n12.1.5 - Les places de stationnement doivent avoir les caractéristiques suivantes :\n- longueur utile 5,00 mètres,\n- largeur utile 2,50 mètres,\n- dégagement utile 5,00 mètres minimum.\n12.1.6 – Bâtiments existants : Toutefois pour les bâtiments restaurés, réhabilités, aménagés\nou changeant de destination, avec ou sans création de surface, il ne sera tenu compte pour le\ncalcul des places de stationnement exigées que des besoins supplémentaires ainsi créés.\n12.2 - Impossibilité technique de réalisation des aires de stationnement\nLorsque le pétitionnaire ne peut satisfaire lui-même aux obligations imposées par un document\nd’urbanisme en matière de réalisation d’aires de stationnement pour les véhicules motorisés,\nil peut être tenu quitte de ces obligations en justifiant, pour les places qu’il ne peut réaliser lui-\nmême sur le terrain d’assiette ou dans son environnement immédiat, soit de l’obtention d’une\nconcession à long terme dans un parc public de stationnement existant ou en cours de\nréalisation, soit de l’acquisition ou de la concession de places dans un parc privé de\nstationnement existant ou en cours de réalisation.\nLorsqu’une aire de stationnement a été prise en compte dans le cadre d’une concession à long\nterme ou dans un parc privé de stationnement, au titre des obligations issues du règlement du\nPLU, elle ne peut plus être prise en compte, en tout ou partie, à l’occasion d’une nouvelle\nautorisation.\nSi les travaux ou constructions ne sont pas soumis à l’obtention d’une autorisation prévue à\nl’article L.421-1 du Code de l’Urbanisme ou soumis à déclaration prévue à l’article L421-4 de\nce même code, les dispositions contenues dans le plan local d’urbanisme relatives à la\nréalisation d’aires de stationnement s’appliquent.\n    117","12.3 - Modification des aires de stationnement\nAucune place de stationnement existante et non conforme aux dispositions du PLU, mais\nconforme à la norme NF applicable ne peut être supprimée sans être remplacée.\nArticle UD.13 – Espaces libres et plantations\n13.1 - 80 % de la superficie non bâtie de l’unité foncière* (hors marge de reculement*) doit être\nplantée et comprendre un minimum de deux arbres de haute tige* par 100 m² d’espace non\nbâti parmi la liste annexée au présent règlement.\nL'épaisseur minimale de terre doit être de 1 mètre.\n13.2. – Les arbres remarquables* figurant sur le plan de zonage et dont la liste est jointe en\nannexe du règlement sont protégés au titre de l’article L. 151-19 du Code de l’Urbanisme et\ndoivent être conservés sauf raisons phytosanitaires, et sous réserve de remplacement par des\narbres à développement similaires parmi une liste limitative annexée au règlement.\n13.3 - Les marges de reculement imposées doivent être plantées sur 80 % de leur\nsuperficie, hors emprise des rampes et accès de parking et des cheminements imposés par\nles règlements de sécurité, et avoir une épaisseur minimale de terre de 1 mètre (dans le\nrespect de l'article UD 6.3).\n13.4 - Les projets de constructions ou réhabilitation doivent permettre une conservation\nmaximale des plantations et espaces verts existants. Les arbres existants de haute tige non\nmaintenus devront être remplacés en nombre équivalent et parmi les essences figurant dans\nla liste non limitative annexée au présent règlement.\n13.5 - La liste des espaces boisés classés est la suivante :\nDans le secteur UDa\n- Jardin privé intérieur : sis 14 à 20 rue Cino del Duca et 28 à 38 rue Parmentier et 39 à 43\navenue de la Porte de Villiers.\nDans le secteur UDb\n- Jardin Beloeuil : 55 rue Pauline Borghèse\n- Parc Saint-Dominique : 36 avenue Sainte-Foy\nDans le secteur UDc\n- Parc de la Folie Saint-James : 34 avenue de Madrid.\n- Jardin privé : 17-19 avenue de Madrid\n- Jardin privé : 18 rue Delabordère\n- Jardin privé : 96-96 ter rue de Longchamp et 1 à 15 rue Ernest Deloison\n- Jardin privé : 13 à 17 boulevard Richard Wallace, 2 à 8 rue de Bagatelle, 137-145 rue de\nLongchamp\n- Jardin privé : 27 à 29 avenue de Bretteville, 1 à 5 rue de Bagatelle, 19 à 21 boulevard Richard\nWallace et 2 rue de Maréchal de Lattre de Tassigny\n- Jardin privé : 31 à 37 boulevard du commandant Charcot, 23 à 27 boulevard Richard Wallace,\n1 à 7 rue du Maréchal de Lattre de Tassigny et 1 à 25 rue de Bretteville.\n13.6 - Pour les unités foncières régies par des plans-masses, les espaces libres sont\ndéterminés comme sur la planche graphique nonobstant l'article UD 13.1.\n    118","13.7.- CINASPIC*\nLes règles définies à l’article UD 13.1 ne sont pas applicables aux constructions et\naménagements des constructions et installations nécessaires aux services publics ou d’intérêt\ncollectif (CINASPIC).\nToutefois, les projets de construction, d’extension et de réhabilitation de ces constructions\ndoivent rechercher une conservation maximale des plantations et des espaces verts,\ncompatible avec leur fonctionnement\n    119","","","","    CHAPITRE 5\n    Dispositions applicables à la zone UE\nCette zone est constituée par l'ensemble des plans-masse déterminés spécifiquement pour\nchaque \"villas\" \"allées\" \"avenues\" et ensemble de maisons de ville dont les constructions sont\nexclusivement réservées à l'habitation résidentielle.\nCes ensembles généralement organisés autour de voies privées perpendiculaires, sous la\nforme de lotissement dont l'ordonnancement est de qualité, nécessitent des règles\nparticulières adaptées à leur tissu.\nLes différents périmètres constituant la zone sont définis par les planches graphiques\nsuivantes :\n    UE a -    Square Chézy\n    UE b -    Allée Borghèse\n    UE c -    Allée des Tilleuls\n    UE d -    Villa Pasteur\n    UE e -    Rue Martin de Thézillat\n    UE f -    Avenue Philippe le Boucher\n    UE g -    Villa Méquillet\n    UE h -    Square du Roule\n    UE i -    Square Perronet\n    UE j -    Villa du Roule\n    UE k -    Avenue Céline\n    UE l -    Villa Sainte Foy\n    UE m -    Avenue Perronet\n    UE n -    Villa de l'Acacia\n    UE p -    Avenue du Château\n    UE q -    Rue de la Saussaye\n    UE r -    29/31 rue Pauline Borghèse\n    UE s -    Lotissement de l'avenue du Parc St James\n    UE t -    Villa Madrid\n    UE u -    Allée Pierre Chalons\n    UE v -    Îlot Maillot\n    UE w -    secteur n° 1 : 47 au 75 boulevard du Général Koenig\n    UE x -    secteur n° 2 : 6 au 16 rue Victor Daix /7 au 17 rue de Longpont\n    UE y -    Villa des Peupliers\n    UEz -    Villa de Villiers\n    UE Aa -    Rue Metman\n    121","122","    SECTION 1 – Nature de l’occupation et de l’utilisation du sol\nArticle UE.1 – Occupations et utilisations du sol interdites\n1.1 – Les constructions et occupations du sol à destination de commerces, d’artisanat*, de\nbureaux*, d'industrie ou d'entrepôt.\n1.2 – Les affouillements et exhaussements des sols supérieurs à 0,6 mètres qui ne sont pas\nnécessaires au projet de construction.\n1.3 – L'implantation et l'aménagement des installations classées suivantes :\na) celles soumises à autorisation, sauf celles prévues à l’article UE 2.1.2 et sauf les\ninstallations nécessaires au fonctionnement des constructions et installations nécessaires\naux services publics ou d’intérêt collectif* (CINASPIC) et celles qui visent à améliorer les\nperformances énergétiques des bâtiments.\nb) celles soumises à déclaration, sauf celles prévues aux articles UE 2.1.1, 2.1.2 et 2.1.3\n1.4 – Les terrains de camping et de caravanes*, les caravanes isolées et les habitations\nlégères de loisirs.\nArticle UE.2 – Occupations et utilisations du sol admises sous conditions\n2.1 Sont admis sous conditions spéciales :\n2.1.1 Les installations classées soumises à déclaration, à condition qu'elles n'entraînent pour\nle voisinage, aucune incommodité et, en cas d'accident ou de fonctionnement défectueux,\naucune insalubrité ni sinistre susceptible de causer des dommages graves ou irréparables aux\npersonnes et aux biens. En outre, leurs exigences de fonctionnement lors de leur ouverture\nou à terme, doivent être compatibles avec les infrastructures existantes, notamment les voiries\net l'assainissement.\n2.1.2 - L'aménagement des installations classées existantes, à condition :\na) qu'il n'en résulte pas pour le voisinage une aggravation des dangers ou nuisances,\nb) que ces installations par leur importance ou leur aspect extérieur soient compatibles avec\nle milieu environnant.\n2.1.3 – Les installations classées annexes aux constructions (chaufferies d'immeubles, dépôts\nd'hydrocarbures, postes de transformation,…) à condition qu'elles soient réalisées dans le\nvolume des bâtiments autorisés ou en sous-sol* de ceux-ci.\n2.2 - Protection du commerce et de l’artisanat* sur les linéaires commerciaux : il est fait\napplication des dispositions de l’article 9 des dispositions générales\n    123","2.3 - Rappels\n-Plan de Prévention des Risques d’Inondation (P.P.R.I.) de la Seine dans les Hauts-de-Seine :\nDans les parties de zones repérées au P.P.R.I., annexé au PLU, la nature de l’occupation et\nde l’utilisation des sols est subordonnée aux dispositions réglementaires dudit Plan approuvé.\n-Il est fait application des dispositions de l’article 7.5 des dispositions générales.\n2.4 - Dans les parties de la zone soumises au risque technologique de transports de matière\ndangereuse lié à la présence des canalisations de gaz à haute pression, dont le tracé figure\nen annexe du règlement du PLU, toute occupation ou utilisation du sol doit respecter les règles\nvisant à garantir sa sécurité publique. Les projets concernés par ce risque, pourront être\nautorisés après avis et sous réserve de l’observation des prescriptions spéciales ou mesures\nconservatoires qui seraient émises par le service intéressé et le service gestionnaire de ces\nouvrages. Les ouvrages de transports devront se conformer aux dispositions en vigueur\nnotamment par des mesures de protection suffisantes. Ces dispositions figurent dans une fiche\nd’information en annexe du règlement.\n    124","  SECTION 2 – Conditions de l’occupation et de l’utilisation du sol\nArticle UE.3 – Accès et Voirie\n3.1 - Pour être constructible, un terrain doit être accessible d'une voie* privée ou\npublique :\n- soit directement,\n- ou soit par l'intermédiaire d'un passage aménagé et matérialisé sur le fonds voisin.\n3.2 - Les accès doivent présenter des caractéristiques permettant de satisfaire aux exigences\nde sécurité, de défense contre l'incendie et de la protection civile. Ces exigences doivent être\nrespectées sans porter atteinte au stationnement existant sur les voies riveraines publiques.\n3.3 - Toute création de voie de desserte devra présenter une largeur minimum de 3.50 mètres.\n3.4 - Les voies se terminant en impasse doivent être aménagées de telle sorte que les\nvéhicules puissent faire demi-tour.\nArticle UE.4 – Desserte par les réseaux\n4.1 – Eau potable\nToute construction nouvelle doit être raccordée au réseau public de distribution d'eau potable.\n4.2 - Assainissement par un branchement particulier\n4.2.1 - Eaux Usées\nToute construction ou installation nouvelle doit être raccordée au réseau public\nd'assainissement.\n4.2.2 - Eaux pluviales\nLes aménagements réalisés sur le terrain doivent respecter les limitations de ruissellement\nvers les réseaux d’assainissement conformément au règlement d’assainissement en vigueur.\nPour toute construction nouvelle ou reconstruction, le rejet des eaux pluviales dans le réseau\nd’assainissement ne pourra excéder un débit maximal fixé aux règlements intercommunaux et\ndépartementaux en vigueur.\n4.3 – Collecte des déchets\nIl devra être prévu, dans les constructions neuves de plus d’un logement, des locaux dédiés\nuniquement à la collecte des déchets ménagers et assimilés et adaptés au stockage de leurs\nconteneurs. Ces locaux devront être fermés et dimensionnés au nombre de logements réalisés\net à l’accueil de l’ensemble des conteneurs nécessaires aux exigences de la collecte des\ndéchets ménagers et assimilés.\n    125","Article UE.5 – Superficie minimale des terrains constructibles\nNéant.\nArticle UE.6 – Implantation des constructions par rapport aux voies et emprises\npubliques, existantes ou projetées\n6.1 - L'implantation des constructions se fait conformément aux dispositions de la planche\ngraphique concernée.\n6.2.- Les constructions en superstructure sont interdites dans les marges de reculement* à\nl'exception des clôtures, des accès aux rampes de parking et des surplombs et saillies* dans\nles conditions de l’article UE 6.3.\nLes constructions en infrastructures sont autorisées dans les marges de reculement* sous\ncertaines conditions (article UE 6.4) dans le respect de l'article UE 13. Pour les rampes de\nparking, leur implantation dans les marges de reculement se fait librement.\n6.3 – Saillies* et encorbellements* en surplomb des marges de reculement*\nLes saillies et encorbellements dans le respect de l'article UE 11 sont autorisés sur les marges\nde reculement d’au moins 4 mètres.\nIls sont soumis aux règles suivantes :\n- la profondeur de la saillie ou de l’encorbellement doit être inférieure ou au plus égale à 1,20\nmètre si la largeur de la marge de reculement est égale ou supérieure à 4 mètres. Elle doit\nêtre inférieure ou au plus égale à 1,40 mètre si la marge de reculement est égale ou supérieure\nà 10 mètres,\n- la partie inférieure de la saillie ou de l’encorbellement doit être à une hauteur supérieure ou\nau moins égale à 2,60 mètres au-dessus du niveau du terrain*.\n- La mise en place d’une isolation thermique en saillie sur domaine public à partir du plancher\nhaut du rez-de-chaussée est autorisée sur les bâtiments existants sous réserve de faire l’objet\nd’un traitement architectural d’ensemble de qualité.\n6.4 - Constructions en infrastructure dans les marges de reculement*\nLes constructions en infrastructure sont interdites dans les marges de reculement inférieures\nà 10 mètres.\nElles sont autorisées :\n- dans les marges de reculement supérieures ou égales à 10 mètres et inférieure à 20 mètres,\nà condition qu'elles soient implantées à plus de 4 mètres de l'alignement,\n- dans les marges de reculement de 20 mètres à condition qu'elles soient implantées à plus\nde 6 mètres de l'alignement*,\npour permettre la réalisation d'espaces plantés conformément à l'article UE 13.\n    126","6.5 – Modénatures\nLes modénatures sont autorisées en saillies.\nArticle UE.7 – Implantation des constructions par rapport aux limites séparatives\nL'implantation des bâtiments se fait conformément aux dispositions de la planche graphique\nconcernée.\nArticle UE.8 – Implantation des constructions les unes par rapport aux autres sur une\nmême propriété\nLa construction de plusieurs bâtiments sur une même unité foncière* est autorisée dans le\nrespect des dispositions de la planche graphique concernée.\nArticle UE.9 – Emprise au sol* des constructions\nL'emprise au sol* des constructions est fixée par la planche graphique concernée.\nArticle UE.10 – Hauteur maximum des constructions\n10.1 - La hauteur des bâtiments ne peut dépasser celle prévue sur la planche graphique\nconcernée.\n10.2 - Modalités de calcul de la hauteur\nSe reporter à la définition de Hauteur*\nArticle UE.11 – Aspect extérieur constructions et aménagement de leurs abords\n11.1 - Aspect extérieur\n11.1.1 -Tout projet peut être refusé, ou n'être accordé que sous réserve du respect de\nprescriptions spéciales, si la construction par sa situation, son volume, l'aspect, le rythme ou\nla coloration de ses façades, est de nature à porter atteinte au caractère ou à l'intérêt des lieux\navoisinants, aux sites, aux paysages naturels ou urbains ainsi qu'à la conservation des\nperspectives monumentales.\nDans le cas où le bâtiment projeté présente une façade de longueur notablement supérieure\nà celle des façades avoisinantes, le traitement architectural de la façade doit s'harmoniser au\nrythme parcellaire des bâtiments bordant la voie.\n    127","11.1.2 - Matériaux de façades\nLes façades des bâtiments doivent être revêtues de matériaux qui présentent un aspect de\nqualité, conserver une bonne tenue dans le temps (pierre massive ou pelliculaire, menuiserie\nen aluminium laqué ou en bois. ).\nL'emploi de matériaux dits réfléchissants* est interdit.\nLes menuiseries ou les ferronneries qui participent à l'image de l'ensemble d'un édifice doivent\nconserver ou retrouver ce caractère, par la finesse des sections et des moulures d'origine, par\nla qualité des matériaux.\nNotamment :\n- Les persiennes ne doivent pas être ajoutées sur les façades où non prévues à l’origine, elles\nmasquent les modénatures et les décors. Les persiennes qui participent au décor de la façade\ndoivent être conservées,\n- Les garde-corps, grilles, clôtures, le cas échéant, doivent conserver les matériaux tels que\nfer forgé ou fonte moulée,\n- Les menuiseries ou les ferronneries doivent chacune être d'une seule couleur sur une même\nfaçade, toutefois les portes cochères et devantures peuvent avoir des couleurs plus soutenues,\n- La pierre doit rester apparente et les éléments de stéréotomie, tel que chaînage, arcs,\nvoussure, plates-bandes, etc. sont conseillés. La modénature des corniches, encadrements\nde baies et les bandeaux, doit être respectée et reconstituée dans le cas de dégradation,\n - Les enduits doivent être finement lissés ou moulurés ; d'une manière générale, les crépis\ndits \"rustiques\" sont interdits,\n  - La brique du parement doit être soigneusement rejointoyée et ne doit jamais recevoir aucun\nenduit ni peinture.\n11.1.3 – Baies*\nConstructions existantes : Les baies doivent être percées dans le respect des principes\nénoncés à l’article UE 11.1.10 tout en respectant l’équilibre existant entre les pleins et les\nvides.\n11.1.4- Balcons et terrasses\nLes gardes corps en pierre, fer forgé, fonte ou bois, sont conseillés.\n11.1.5 - Les installations tels que écrans, grillages, treillis, au-dessus des garde-corps, sont\ninterdites.\n11.1.6 – Antennes et paraboles\n Les antennes paraboliques et autres antennes sont interdites en façade. Elles doivent être\ninstallées en toiture et en retrait des façades. Elles ne doivent pas porter atteinte à la qualité\narchitecturale environnante.\n11.1.7- Les encorbellements* en façade\nLes encorbellements* en façade doivent avoir une longueur inférieure ou au plus égale au tiers\nde la longueur de la façade intéressée\n11.1.8 – Les cours anglaises*\nLes cours anglaises* sont interdites.\n11.1.9 - Le traitement des souches, les systèmes de ventilation, de climatisation et les\nsurélévations des conduits, notamment les conduits de fumée ou de ventilation, devront être\nencoffrés le long des pignons en harmonie avec le pignon.\nL’installation de systèmes de ventilation ou de climatisation est en outre interdite sur rue.\n - Les raccordements aux réseaux de distribution de gaz et d’électricité et de\ntélécommunication doivent être dissimulés ou intégrés au bâti.\n    128","11.1.10 - Traitement des façades et modifications de façades existantes\nLes façades doivent être ordonnées pour respecter une cohérence dans le style de la\nconstruction, les hauteurs d'étages, les proportions des ouvertures et une harmonie dans le\nchoix des couleurs et des matériaux.\nNotamment :\n- Les modifications effectuées sur une construction existante ne doivent pas être faites au coup\npar coup, mais en tenant compte de la composition d’ensemble de l’édifice,\n- Toutes les façades d'une construction, notamment les mur-pignons (mitoyens ou non)\ndoivent être traitées en harmonie avec la façade dite \"principale\" bordant la voie. Les locaux\naccessoires doivent être traités avec un soin égal à celui apporté aux bâtiments principaux,\n- Les couleurs ne doivent pas créer de ruptures dans la lecture du paysage bâti,\n- Les travaux sur façade doivent mettre en valeur les détails, permettre la suppression des\najouts qui dénaturent le caractère de la façade, la réutilisation de matériaux traditionnels.\nNotamment, les modénatures, les éléments sculptés, les décors, qui ont un caractère\nremarquable, doivent être conservés, réparés lorsqu’ils sont dégradés et reconstitués lorsqu’ils\nont été supprimés,\n11.1.11 - Les pignons sur les limites séparatives ainsi que les locaux en superstructure doivent\nrecevoir un revêtement en harmonie avec les façades.\nLes murs pignons des bâtiments existants laissés ou rendus apparents par une construction\nnouvelle ou à la suite de la démolition d'une construction jointive, doivent recevoir un enduit\nen harmonie avec la façade voisine, ciment - pierre ou matériau similaire.\nPour les constructions existantes, l'aspect des façades des extensions de toute nature doit\nêtre en harmonie avec les matériaux constituant les façades existantes.\n11.1.12 - Ravalements\nLes ravalements doivent être exécutés en respectant les matériaux des façades d'origine (les\nrevêtements en ciment gris ainsi que la peinture de la pierre de taille et des briques sont\ninterdits) et sans atténuer aucun des détails. Ils doivent être exécutés sur toute la façade y\ncompris les délaissés de pignon, de manière à respecter l'homogénéité de la composition de\nla façade.\n11.1.13 - Accès carrossables et entrées d'immeubles\nLes accès carrossables à la voie publique*, notamment les portes et rampes de garage,\ndoivent avoir un impact visuel minimum sur la composition architecturale des édifices et des\nvégétaux qui l'accompagnent, notamment sur la composition des soubassements des\nimmeubles.\nLes transparences des immeubles au rez-de-chaussée doivent être conservées ou\naménagées lorsque l'architecture de l'immeuble et l'environnement le permettent.\n11.1.14 – Clôtures et jardins\nLa mise en valeur des espaces bâtis doit être accompagnée de celle des espaces non-bâtis\n(mise en valeur paysagère des marges plantées, jardins, cours intérieures) dans le respect de\nl'article UE 13, en particulier en ce qui concerne les jardins entourant les hôtels particuliers.\n11.2 – Clôtures\n11.2.1 – L’édification de clôtures en bordure des voies publiques et privées est imposée à\nl'alignement ou en limite de voie pour les voies privées. La clôture doit être constituée par un\nmur bahut de 1,20 mètre de hauteur maximum surmonté d'une grille en fer, peinte de couleur\nsombre, la hauteur totale ne pouvant excéder 2,20 mètres, sauf dispositions particulières du\ncahier des charges existant.\n11.2.2 - Dans la marge de reculement, les clôtures doivent être identiques à celles imposées\nà l'alignement, sauf dispositions particulières du cahier des charges existant.\n    129","11.2.3 - Au-delà de la marge de reculement, les clôtures en limites de propriété ne doivent pas\nexcéder 3 mètres, sauf dispositions particulières du cahier des charges existant.\n11.2.4 - Sur toutes les clôtures, sont formellement interdits, les écrans de tôle, treillage,\ncanisses, etc. de quelque nature que ce soit. Cependant, la grille à claire-voie peut être\ndoublée par un écran de verre transparent et, ou, de la végétation.\nArticle UE.12 – Obligations imposées aux constructeurs en matière de réalisation\nd’aires de stationnement\n12.1 – Dispositions générales\nPour toute opération de construction, soumise ou non à autorisation de construire, ou tout\nchangement de destination, s’accompagnant de la réalisation d’aires de stationnement, ces\ndernières devront être réalisées à l’intérieur des constructions ou en sous-sol*.\n12.2 - Pour les constructions ou reconstructions en bordure de la Villa Madrid, de l'Avenue du\nChâteau et de l'Avenue du Parc Saint James, il est exigé une superficie de stationnement\négale à 15 % de la surface de plancher construite ou reconstruite, dans le volume des\nbâtiments ou en sous-sol*.\n12.3 - Toutefois pour les bâtiments restaurés, réhabilités, aménagés ou changeant de\ndestination, il ne sera tenu compte pour le calcul des places de stationnement exigées que\ndes besoins supplémentaires ainsi créés.\n12.4 - Impossibilité technique de réalisation des aires de stationnement\nLorsque le pétitionnaire ne peut satisfaire lui-même aux obligations imposées par un document\nd’urbanisme en matière de réalisation d’aires de stationnement pour les véhicules motorisés,\nil peut être tenu quitte de ces obligations en justifiant, pour les places qu’il ne peut réaliser lui-\nmême sur le terrain d’assiette ou dans son environnement immédiat, soit de l’obtention d’une\nconcession à long terme dans un parc public de stationnement existant ou en cours de\nréalisation, soit de l’acquisition ou de la concession de places dans un parc privé de\nstationnement existant ou en cours de réalisation.\nLorsqu’une aire de stationnement a été prise en compte dans le cadre d’une concession à long\nterme ou dans un parc privé de stationnement, au titre des obligations issues du règlement du\nPLU, elle ne peut plus être prise en compte, en tout ou partie, à l’occasion d’une nouvelle\nautorisation.\nSi les travaux ou constructions ne sont pas soumis à l’obtention d’une autorisation prévue à\nl’article L.421-1 du Code de l’Urbanisme ou soumis à déclaration prévue à l’article L421-4 de\nce même code, les dispositions contenues dans le plan local d’urbanisme relatives à la\nréalisation d’aires de stationnement s’appliquent.\n12.5 - Modification des aires de stationnement\nAucune place de stationnement existante et non conforme aux dispositions du PLU, mais\nconforme à la norme NF applicable ne peut être supprimée sans être remplacée.\n    130","12.6.- L’obligation de réaliser des aires de stationnement n’est pas applicable aux travaux de\ntransformation ou d’amélioration de bâtiments affectés à des logements locatifs financés avec\nun prêt aidé par l’État, y compris dans le cas où ces travaux s’accompagnent de la création de\nsurface hors œuvre nette, dans la limite d’un plafond fixé par décret en Conseil d’État.\nIl ne peut, nonobstant toute disposition des documents d’urbanisme, être exigé la réalisation\nde plus d’une aire de stationnement par logement lors de la construction de logements locatifs\nfinancés avec un prêt aidé par l’État.\nArticle UE.13 – Obligations imposées aux constructeurs en matière de réalisation\nd’espaces libres, d’aires de jeux et de loisirs et de plantations\n13.1 - Les espaces libres doivent être traités en espace d'agrément. L'épaisseur minimale de\nterre doit être de 1 mètre.\n13.2. – Les arbres remarquables* figurant sur le plan de zonage et dont la liste est jointe en\nannexe du règlement sont protégés au titre de l’article L. 151-19 du Code de l’Urbanisme et\ndoivent être conservés sauf raisons phytosanitaires, et sous réserve de remplacement par des\narbres à développement similaires parmi une liste limitative annexée au règlement.\n13.3 - Les marges de reculement* imposées sur les planches graphiques doivent être\ntraitées en espaces plantés à l’exception des rampes et accès de parking.\n13.4 - Les projets de constructions ou réhabilitation doivent permettre une conservation\nmaximale des plantations et espaces verts existants. Les arbres de haute tige* existants non\nmaintenus devront être remplacés en nombre équivalent et parmi les essences figurant dans\nla liste non limitative annexée au présent règlement.\n    131","","","","","","","","","","","","","","","","","","","","","","","","","","","    CHAPITRE 6\n    Dispositions applicables à la zone UL\nIl s'agit d'une zone à vocation de loisirs et d'espace vert, de détente et de sports. Cette zone\nrecouvre la partie Sud-Ouest de l'Île de la Jatte.\n    133","134","    SECTION 1 – Nature de l’occupation et de l’utilisation du sol\nArticle UL.1 – Occupations et utilisations du sol interdites\n1.1 – Les constructions et occupations du sol à destination d’habitation, d’hébergement\nhôtelier, de commerces, d’artisanat*, de bureaux*, d'industrie ou d'entrepôt.\n1.2 – Les équipements autres que ceux de sport, de détente ou liés aux espaces verts ainsi\nque les équipements qui en découlent.\n1.3 – Les affouillements et exhaussements des sols supérieurs à 0,6 mètres qui ne sont pas\nnécessaires au projet.\n1.4 – L'implantation et l'aménagement des installations classées suivantes :\na) celles soumises à autorisation, sauf celles prévues à l’article UL 2.2 et sauf les installations\nnécessaires au fonctionnement des constructions et installations nécessaires aux services\npublics ou d’intérêt collectif* (CINASPIC) et celles qui visent à améliorer les performances\nénergétiques des bâtiments.\nb) celles soumises à déclaration, sauf celles prévues aux articles UL 2.1, 2.2 et 2.3.\n1.5 – Les terrains de camping et de caravanes*, les caravanes isolées et les habitations\nlégères de loisirs.\nArticle UL.2 – Occupations et utilisations du sol soumises à des conditions particulières\n2.1 - Les installations classées soumises à déclaration, à condition qu'elles n'entraînent pour\nle voisinage, aucune incommodité et, en cas d'accident ou de fonctionnement défectueux,\naucune insalubrité ni sinistre susceptible de causer des dommages graves ou irréparables aux\npersonnes et aux biens. En outre, leurs exigences de fonctionnement lors de leur ouverture\nou à terme, doivent être compatibles avec les infrastructures existantes, notamment les voiries\net l'assainissement.\n2.2 - L'aménagement des installations classées existantes, à condition :\na) qu'il n'en résulte pas pour le voisinage une aggravation des dangers ou nuisances,\nb) que ces installations par leur importance ou leur aspect extérieur soient compatibles avec\nle milieu environnant.\n2.3 - Rappels :\n-Plan de Prévention des Risques d’Inondation (P.P.R.I.) de la Seine dans les Hauts-de-Seine :\nDans les parties de zones repérées au P.P.R.I. la nature de l’occupation et de l’utilisation des\nsols est subordonnée aux dispositions réglementaires dudit Plan approuvé.\n    135","  SECTION 2 – Conditions de l’occupation et de l’utilisation du sol\nArticle UL.3 – Accès et Voirie\nNéant.\nArticle UL.4 – Desserte par les réseaux\nNéant.\nArticle UL.5 – Caractéristiques des terrains\nNéant.\nArticle UL.6 – Implantation des constructions par rapport aux voies et emprises\npubliques*, existantes ou projetées\nLe présent article s’applique aux voies* publiques et privées ainsi qu’aux emprises publiques*\net/ou ouvertes au public.\n6.1 – Principe général\nÀ l'exception des plantations, des accès aux rampes de parking et des clôtures, aucune\noccupation du sol n'est autorisée à moins de 6 mètres de l'axe des voies publiques et à moins\nde 4 mètres de l'axe des voies privées.\n6.2 – Saillies* et encorbellements* en surplomb des voies et emprises publiques\nLes saillies et encorbellements sont autorisés sur les voies et emprises publiques si leur\nlargeur est supérieure ou égale à 12 mètres.\nIls sont soumis aux règles suivantes :\n- leur profondeur doit être inférieure ou au plus égale au trentième de la largeur de la voie ou\nde l’emprise et à 1,20 mètre.\n- la partie inférieure de la saillie ou de l’encorbellement doit être à une hauteur supérieure ou\négale à 5,50 mètres au-dessus du niveau du trottoir.\n6.3 – Modénatures\nLes modénatures sont autorisées en saillies.\n    136","Article UL.7 – Implantation des constructions par rapport aux limites séparatives\n7.1 - Implantation des façades*\nLa distance d'une façade comportant des baies*, à la limite séparative* mesurée\nhorizontalement doit être au moins égale à la moitié de la hauteur de cette façade.\n7.2 - Cas des saillies* et encorbellements* en surplomb des marges d'isolement*\nIls ne sont autorisés que lorsque la distance séparant la façade de la limite séparative est\nsupérieure ou égale à 12 mètres.\nIls sont soumis aux règles suivantes :\n- la partie inférieure de la saillie ou de l’encorbellement doit être située à une hauteur au moins\négale à 2,60 mètres au-dessus du niveau du sol,\n- la profondeur de la saillie ou de l’encorbellement ne peut excéder le dixième de la distance\nentre la façade et la limite séparative et 1,40 mètre.\n7.3 - Modalités d'application\nSe reporter à la définition de Hauteur*\nArticle UL.8 – Implantation des constructions les unes par rapport aux autres sur une\nmême propriété\nNéant.\nArticle UL.9 – Emprise au sol des constructions\nNéant.\nArticle UL.10 – Hauteur maximum des constructions\nNéant.\n    137","Article UL.11 – Aspect extérieur constructions et aménagement de leurs abords\nNéant.\nArticle UL.12 – Obligations imposées aux constructeurs en matière de réalisation\nd’aires de stationnement\nNéant.\nArticle UL.13 – Obligations imposées aux constructeurs en matière de réalisation\nd’espaces libres, d’aires de jeux et de loisirs et de plantations\nNéant.\n    138","  TITRE III\nDEFINITIONS\n    139","140","    D E F I    N I    T I   O   N   S\nACROTERE\nMuret situé en bordure de toiture-terrasse destiné à recevoir un relevé d’étanchéité.\nALIGNEMENT\nL'alignement est la limite commune d'un fonds privé et du domaine public. Dans le présent\nPLU, il recouvre l’alignement existant ou futur.\nANNEXE ou CONSTRUCTION SECONDAIRE\nUne annexe est une construction secondaire, de dimensions réduites et inferieures à la\nconstruction principale, qui apporte un complément aux fonctionnalités de la construction\nprincipale. Elle peut être accolée ou non à la construction principale avec qui elle entretient un\nlien fonctionnel, sans disposer d’accès direct depuis la construction principale.\nL’annexe est nécessairement située sur la même unité foncière que la construction principale à\nlaquelle elle est liée fonctionnellement.\nARBRE DE HAUTE TIGE\nArbre atteignant au moins 15 mètres à l'âge adulte.\nARBRE REMARQUABLE\nArbre repéré au plan de zonage, figurant sur la liste annexée au règlement et protégé au titre\nde l’article L. 151-19 du Code de l’Urbanisme pour son intérêt.\nARTISANAT\nActivités professionnelles et indépendantes de production, de transformation, de réparation ou\nde prestation de service relevant de l’artisanat et figurant sur une liste annexée au décret n°98-\n247 du 2 avril 1998.\nBATIMENT\nUn bâtiment est une construction couverte et close. Il constitue un sous-ensemble de la notion\nde construction. Il est réalisé en élévation et peut comprendre un sous-sol. Il est\nimpérativement couvert par une toiture et doté de systèmes de fermeture en permettant une\nclôture totale.\n    141","Sont considérées comme relevant de la définition du bâtiment uniquement les constructions\nqui présentent l’ensemble des caractéristiques suivantes :\n   - des façades closes,\n   - une toiture,\n   - une porte permettant d’empêcher le passage ou la circulation (hors dispositifs destinés\n   uniquement à donner artificiellement l’apparence d’une pièce close, comme dans le cas\n   d’une galerie).\nBATIMENT « REFERENCES »\nÉdifice ayant une architecture de qualité réalisée par des architectes ayant acquis une grande\nrenommée, édifice dont les caractères sont représentatifs d’un style ou d’un courant\narchitectural, édifice qui marque une ponctuation dans le tissu urbain.\nCes bâtiments sont repérés au plan de zonage et leur liste figure en annexe du règlement ; ils\nsont protégés au titre de l’article L.151-19 du Code de l’Urbanisme.\nBAIE\nOuverture pratiquée dans une paroi verticale (mur, façade…) ou une toiture destinée à permettre le\npassage de la lumière, de l’air ou des personnes. Il peut s’agir d’une fenêtre, d’une porte, d’une\nporte-fenêtre ou d’une baie vitrée.\nBAIES PRINCIPALES\nBaies éclairant une pièce destinée au séjour, au sommeil ou au travail.\nLorsqu’une même pièce dispose de baies sur plusieurs façades, sont considérées comme\nbaies principales les baies situées sur la façade comportant la surface vitrée la plus importante.\nLes autres baies sont alors qualifiées de « baies secondaires ».\nBAIES SECONDAIRES\nBaies éclairant une pièce secondaire (pièce destinée à la cuisine, hall, escaliers, toilettes, salle\nde bain,…).\nEst également qualifiée de baie secondaire, toute baie éclairant une pièce, destinée au séjour,\nau sommeil ou au travail, dès lors que cette pièce dispose, sur une autre façade, une ou\nplusieurs baies qualifiées de baies principales.\nBANDE DE 15 METRES\nBande de 15 mètres de profondeur qui figure au plan de zonage et se calcule à partir de\nl'alignement ou des reculements imposés lorsqu'ils existent. Cette définition trouve son\napplication dans les articles 7, 9 et 10 des règlements de chaque zone.\nBUREAU\nLocaux où sont exercées des activités administratives, de direction, de services, de conseil,\nd’études, d’ingénierie, d’informatique, de recherche, de conception.\n    142","CARAVANES\nConformément à l’article R.111-37 du Code de l’Urbanisme, sont regardés comme des\ncaravanes les véhicules terrestres habitables qui sont destinés à une occupation temporaire\nou saisonnière à usage de loisir, qui conservent en permanence des moyens de mobilité leur\npermettant de se déplacer par eux-mêmes ou d’être déplacés par traction et que le code de la\nroute n’interdit pas de faire circuler.\nCOMBLE\nPartie d’un bâtiment située sous la toiture, comprise entre le dernier plancher haut et le versant\ndu toit.\nIl n’est admis qu’un seul niveau habitable dans les combles.\nCONSTRUCTION\nUne construction est un ouvrage fixe et pérenne, comportant ou non des fondations et\ngénérant un espace utilisable par l’Homme en sous-sol ou en surface.\nLa notion de construction recouvre notamment les constructions en surplomb (constructions\nsur pilotis, cabanes dans les arbres), et les constructions non comprises dans la définition du\nbâtiment, telles que les pergolas, hangars, abris de stationnement, piscines, les sous-sols non\ncompris dans un bâtiment.\nCONSTRUCTION EXISTANTE\nUne construction est considérée comme existante si elle est reconnue comme légalement\nconstruite.\nUne ruine, c’est-à-dire lorsque la majorité des fondations ou des éléments hors fondations\ndéterminant la résistance et la rigidité de l’ouvrage ne remplissent plus leurs fonctions, ne peut\npas être considérée comme une construction existante.\nCONSTRUCTIONS ET INSTALLATIONS NECESSAIRES AUX SERVICES PUBLICS OU\nD’INTERET COLLECTIF (CINASPIC)\nLes CINASPIC désignent l'ensemble des constructions et installations destinées à assurer la\nfourniture de services publics ou d'intérêt collectif.\nSont considérés comme CINASPIC :\n- Les locaux affectés aux services publics municipaux, départementaux, régionaux, nationaux,\nintercommunaux.\n- Les équipements de petite enfance\n- Les établissements d’enseignement maternel, primaire, secondaire et universitaire\n- Les établissements de soins tels que les hôpitaux, les cliniques et les maisons de santé\n- Les établissements culturels\n- Les édifices cultuels\n- Les organismes d’utilité publique (pour l’exercice de leurs activités)\n- Les établissements sportifs à caractère non commercial\n- Les bâtiments ou installations techniques conçus spécialement pour le fonctionnement de\nréseaux ou de services urbains\n- Les constructions et installations techniques nécessaires au fonctionnement des services de\nsecours, de lutte contre l'incendie et de police (sécurité, circulation, aérations,...)\n    143","CONSTRUCTION SECONDAIRE\nVoir « Annexe »\nCONTIGUS\nDes constructions ou terrains sont contigus lorsqu’une façade, un pignon ou une limite sont\ndirectement en contact l’un avec l’autre. Des constructions seulement reliées par un élément\narchitectural tel qu’un portique, pergola, porche ou angle de construction, etc. ne constituent\npas des constructions contiguës.\nCOURONNEMENT\nLe couronnement est la partie supérieure de la composition d'un édifice.\nCOUR ANGLAISE\nCour située en contrebas du terrain, en façade d'un bâtiment et sur laquelle donnent les portes\net/ou les fenêtres d'un sous-sol ou d’un rez-de-jardin. Elle est généralement ceinturée par des\nmurs de soutènement et peut être protégée par des garde-corps.\nEn application du présent règlement, les cours anglaises sur rue sont interdites.\nEMPRISE AU SOL\nL'emprise au sol est la projection verticale du volume de la construction, tous débords et\nsurplombs inclus.\nLa surface de l’unité foncière prise en compte pour le calcul de l’emprise au sol exclut :\n  •   les surfaces situées en avant de l’alignement futur, lorsqu’un projet d’alignement est\n    prévu, pour les terrains riverains d’une voie ;\n  •   les marges de reculement bordées par une bande constructible de 15 mètres figurée au\n    plan de zonage ;\n  •   les surfaces grevées par une servitude d’alignement ou un emplacement réservé.\n    144","145","146","EMPRISE PUBLIQUE\nL’emprise publique correspond aux espaces extérieurs ouverts au public qui ne répondent pas\nà la notion de voie ni d’équipement public.\nIl s’agit notamment des :\n- Jardins publics, parcs, squares, mails, espaces verts.\n- Cours d’eaux domaniaux.\n- Voies ferrées, lignes de métro et tramways.\nENCORBELLEMENT\nVoir la définition illustrée dans « Emprise au sol »\nEXTENSION\nL’extension consiste en un agrandissement de la construction existante présentant des\ndimensions inferieures à celle-ci. L’extension peut être horizontale ou verticale (par\nsurélévation, excavation ou agrandissement), et doit présenter un lien physique et fonctionnel\navec la construction existante.\nFAÇADE\nLes façades d’un bâtiment ou d’une construction correspondent à l’ensemble de ses parois\nextérieures hors toiture. Elles intègrent tous les éléments structurels, tels que les baies, les\nbardages, les ouvertures, l’isolation extérieure et les éléments de modénature tels que les\nacrotères, les bandeaux, les corniches, les moulures décoratives ou fonctionnelles, les\nbordures, les chambranles ou marquises.\nLes « façades » s’entendent du nu de chaque façade. Un décroché de façade de 1 mètre crée\nune partie de façade indépendante. Les règles de recul s’appliquent alors indépendamment\npour chaque partie de façades.\nFAITAGE\nPartie supérieure de la ligne de jonction de deux pans de toiture inclinée ou point le plus haut\nd’une toiture à un pan.\nGABARIT\nLe gabarit désigne l’ensemble des plans verticaux, horizontaux ou obliques constituant la\nforme extérieure de la construction. Il résulte de la combinaison des règles de hauteur, de\nprospects et d’emprise au sol.\nPour l’application des majorations du volume constructible, notamment issues des articles\nL.151-28,1° et L.151-28,2° du code de l’urbanisme, le gabarit correspond aux règles de\ndistance des constructions les unes par rapport aux autres sur une même propriété (articles\n8) ainsi que par rapport aux limites séparatives (articles 7) et aux voies et emprises publiques\n(articles 6). Dans cette dernière hypothèse, la majoration peut, également, déroger aux règles\nde hauteur imposées compte-tenu des voies.\n    147","HAUTEUR\nLa hauteur totale d’une construction, d’une façade, ou d’une installation correspond à la\ndifférence de niveau entre son point le plus haut et son point le plus bas situé à sa verticale.\nLes installations techniques sont exclues du calcul de la hauteur.\n    Modalités de calcul de la hauteur\n    Ces modalités s’appliquent à la mise en œuvre des dispositions des articles\n    7, 8 et 10 du présent règlement.\n    La hauteur maximum de la construction est mesurée :\n    Pour le point le plus bas :\n    - à partir de la cote de casier lorsque le niveau d’une partie de l’unité foncière\n    est inférieur à la cote mentionnée dans le règlement du Plan de Prévention\n    des Risques d’Inondation de la Seine\n    - à partir de la cote médiane (moyenne entre le point le plus bas et le point\n    le plus haut) du niveau du trottoir au droit de l’alignement ou de la limite de la\n    voie selon qu’il s’agit d’une voie publique ou privée\n    - à partir de la cote médiane de nivellement du pourtour de l’unité foncière\n    en cas d’unité foncière ne bordant aucune voie.\n    Pour le point le plus haut, la cote à l'acrotère des immeubles en cas de toitures-\n    terrasses ou terrasses en attique, ou la cote au faîtage* des immeubles en cas\n    de toitures à pentes.\n    Pour le calcul du nombre de niveaux des unités foncières en pente et des\n    unités foncières situées dans le périmètre du PPRI, les niveaux partiellement\n    enterrés ne sont pas pris en compte si leur hauteur au-dessus de la cote médiane\n    ou de la cote casier n’excède pas 1,50 mètre. Pour toute unité foncière concernée\n    par les deux cas (unités foncières en pentes et celles situées en PPRI), il sera\n    fait application de la plus favorable d’entre elles.\nHAUTEUR SOUS PLAFOND\nHauteur libre mesurée entre le plancher et le plafond.\nIMPLANTATION EN ORDRE CONTINU\nType d’implantation indiqué au document graphique qui implique des constructions implantées\nd’une limite séparative joignant l’alignement à l’autre.\nIMPLANTATION EN ORDRE DISCONTINU\nType d’implantation indiqué au document graphique qui implique des constructions\nimplantées en retrait par rapport aux limites séparatives joignant l'alignement.\n    148","LIMITE SEPARATIVE\nLimite séparant deux unités foncières privées. On distingue les limites séparatives latérales\ndes limites séparatives de fond de parcelle.\nLes limites séparatives correspondent aux limites entre le terrain d’assiette de la construction,\nconstitué d’une ou plusieurs unités foncières, et le ou les terrains contigus. Elles peuvent être\ndistinguées en deux types : les limites séparatives aboutissant aux voies, aussi appelées\nlimites latérales et les limites de fond de terrain. En sont exclues les limites de l’unité foncière\npar rapport aux voies au sens du présent lexique et emprises publiques.\nLes limites de fond de parcelle sont celles qui ne remplissent pas la condition requise pour\nêtre regardées comme « latérales ». Elles sont, le plus souvent, situées à l’opposé de la voie.\nLIVRAISON (places de livraison)\nLes places de livraison sont les places nécessaires à la réception des marchandises mais\négalement celles nécessaires à la vente à emporter des commerces et restaurants.\nElles comprennent, selon la nature de l’activité, des places pour les poids-lourds, les véhicules\nlégers, les fourgons et camionnettes mais aussi les deux-roues, motorisés ou non.\nLOCAL ACCESSOIRE\nLe local accessoire fait soit partie intégrante d’une construction principale, soit il en constitue\nune annexe, soit une extension. Il est indissociable du fonctionnement de la construction\nprincipale.\n    149","Les locaux accessoires dépendent, ou font partie intégrante, d’une construction principale à\nlaquelle ils apportent une fonction complémentaire et indissociable. Ils peuvent recouvrir des\nconstructions de nature très variée et être affectés à des usages divers : garage d’une\nhabitation ou d’un bureau, atelier de réparation, entrepôt d’un commerce, remise, logement\npour le personnel, lieu de vie du gardien d’un bâtiment industriel, local de stockage pour un\ncommerce, laverie d’une résidence étudiante ...\nDe plus, conformément à l’article R151-29 du code de l’urbanisme les locaux accessoires sont\nréputés avoir la même destination et sous-destination que le bâtiment principal auquel ils se\nrattachent.\nLOCAUX TECHNIQUES\nSont notamment considérés comme locaux techniques : les locaux abritant chaufferies,\nclimatisations, machineries d'ascenseur des immeubles, groupes électrogènes, équipements\nliés au fonctionnement des antennes et équipements liés aux énergies renouvelables.\nLa surface des locaux La surface des locaux techniques est constituée par leur emprise.\nMARGE DE RECULEMENT\nRetrait minimum imposé aux constructions à édifier en bordure d'une voie au sens du présent\nlexique ou d’une emprise publique et repéré au plan de zonage.\nMARGES D'ISOLEMENT\nRetrait minimum imposé aux constructions à édifier par rapport aux limites séparatives.\nMUR AVEUGLE\nMur ne comportant ni baies principales ni baies secondaires, mais pouvant comporter des\njours de souffrance.\nNIVELLEMENT GENERAL DE LA FRANCE (NGF)\nIl s’agit de l’altitude orthométrique de référence NGF69 Certaines cotes figurant au P.L.U sont\nrattachées au Nivellement General de la France (cotes NGF).\nNIVEAU DU TERRAIN\nPour l’application du présent règlement, le niveau du terrain est calculé comme suit :\n    - à partir de la cote de casier lorsque le niveau d’une partie de l’unité foncière est inférieur\n    à la cote mentionnée dans le règlement du Plan de Prévention des Risques d’Inondation\n    de la Seine,\n    - à partir de la cote médiane (moyenne entre le point le plus bas et le point le plus haut)\n    du niveau du trottoir au droit de l’alignement ou de la limite de la voie selon qu’il s’agit\n    d’une voie publique ou privée,\n    - à partir de la cote médiane de nivellement du pourtour de l’unité foncière en cas d’unité\n    foncière ne bordant aucune voie.\n    150","PIECE DE LOISIRS\nLocaux d’habitation permettant l’accès aux toitures-terrasses et pouvant être occupés. La\nsurface de la pièce de loisirs est constituée par sa surface de plancher.\nPOINT DE DESSERTE    PAR    DES    LIGNES    DE    TRANSPORTS    COLLECTIFS\nSTRUCTURANTES\nEn vertu du Plan des mobilités d’Ile-de-France (PDMIF), stations de métro, stations de\ntramway et stations de T Zen, gares desservies par des lignes de RER ou de trains de banlieue.\nPLANCHER FONCTIONNEL (PPRI)\nPlancher où s’exerce de façon permanente une activité quelle que soit sa nature (industrie,\ncommerce,…) à l’exception de l’habitation.\nPLANCHER HABITABLE (PPRI)\nPlancher où se situe le logement\nR\nAbréviation de rez-de-chaussée\nREFLECHISSANT\nLe matériau dit réfléchissant s'entend dans un sens strict, c'est-à-dire lorsque le matériau a un\neffet miroir total. Cela veut dire que le matériau qui renvoie faiblement les images est autorisé.\nSAILLIE\nAvancée d'un élément de la construction, soit d'un mur (balcon, encorbellement,…), soit d'un\ntoit (lucarne,…) par rapport au nu de la façade.\nSOL FINI\nSol comprenant les matériaux de recouvrement (dalles,…)\n    151","SOUBASSEMENT\nLe soubassement est la partie inférieure de la composition d'un édifice.\nSOUS-SOL\nPartie d’un bâtiment située entièrement ou partiellement en dessous du niveau du terrain\nexistant. Un niveau est considéré comme un sous-sol soit dès lors que le niveau en question\nest entièrement situé en dessous du niveau du terrain existant, soit lorsque, sur plus de la\nmoitié de sa hauteur totale (mesurée du plancher bas jusqu’au plafond), ce niveau est situé\nen dessous du niveau du terrain existant.\nTERRAIN NATUREL\nLe terrain naturel est le sol de la parcelle existant avant toute construction.\nUNITE FONCIERE\nPropriété foncière d’un seul tenant composée d’une parcelle ou d’un ensemble de parcelles\nappartenant à un même propriétaire ou à une même indivision.\n    152","UNITE FONCIERE RIVERAINE\nEst considéré comme une unité foncière riveraine de l’avenue Charles de Gaulle ou de la Place\ndu Marché au sens de l’article UA.7.2.1, l’unité foncière dont au moins une des limites\nparcellaires est directement en contact avec l'avenue et/ou place.\nVOIE\nEst considérée comme une voie, au sens du présent règlement, tout passage aménagé pour\nassurer la circulation des véhicules et desservant au moins deux propriétés, lots ou unités\nfoncières divisées en propriété ou en jouissance. La voie peut être de statut public ou privé.\nElle comprend l’ensemble de l’espace affecté à la circulation : chaussée destinée aux\nvéhicules motorisés, cheminements piétons et cyclables, ainsi que les fossés, talus et\naccotements qui la bordent.\nNe constituent pas des voies :\n   •   les accès individuels ou servitudes de passage ne répondant pas aux critères ci-\n    dessus,\n   •   les espaces de circulation internes à une unité foncière ne desservant qu’une seule\n    construction.\n    153","    DEPARTEMENT DES HAUTS DE SEINE\n    Ville de Neuilly-sur-Seine\nplan    local    d’urbanisme\nPièce n° 4.2 : Annexes au règlement\n PLU approuvé le 21 novembre 2013 et modifié le 24 septembre 2015\n    1","    PIECE N°4.2.1\nLISTE DES EMPLACEMENTS RESERVES ET\nDES SERVITUDES DE L’ARTICLE L.123-2 DU\n    CODE DE L’URBANISME\n    PLU modifié le 20/12/17\n    2","    LISTE DES EMPLACEMENTS RESERVES AU\n    TITRE DE L’ARTICLE\n    L.123-1-5,8° DU CODE DE L’URBANISME\n    (dans sa version au 21 novembre 2013)\nA - LISTE DES EMPLACEMENTS RESERVES POUR VOIRIE\n(FIGURES AU PLAN DE ZONAGE)\nI- VOIRIE DEPARTEMENTALE\nBénéficiaire : Département des Hauts-de-Seine\nN°1: C.D 1 (Boulevard du Général Leclerc)\nElargissement de l’emprise du R.D.1 pour permettre les aménagements de la rive\ndroite de Seine tout en conservant à cette voie sa fonction de desserte locale.\nElargissement allant de la rue Garnier à la rue Soyer et du bd d’Argenson à la rue\nPerronet.\nSurface: 4 820 m²\nII- VOIRIE COMMUNALE\nBénéficiaire : Commune de Neuilly-sur-Seine\nN°2: (rue du Château)\nElargissement entre l’avenue Charles de Gaulle et l'avenue Sainte Foy, afin de faciliter\nle trafic et permettre une meilleure desserte de quartiers à quartiers.\nSurface : 810 m²\nN°3: (rue d'Orléans)\nElargissement à 30 mètres entre le boulevard des Sablons et l'avenue Charles de\nGaulle permettant le débouché de la rue d'Orléans jusqu'à la R.N.
