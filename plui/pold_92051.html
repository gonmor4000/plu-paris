*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px}
nav.tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto}
nav.tabs a{padding:8px 12px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
nav.tabs a.on{color:var(--ink);border-color:var(--accent);font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:5px 10px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wrap{display:flex;min-height:calc(100vh - 100px)}
aside{width:330px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow:auto;height:calc(100vh - 100px);position:sticky;top:100px}
main{flex:1;min-width:0;padding:18px 28px 80px;max-width:980px}
.filters{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line);cursor:pointer;user-select:none}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tree{padding:6px 0 30px}
.tree .n{display:flex;gap:6px;align-items:baseline;padding:3px 12px;cursor:pointer;font-size:13.5px;line-height:1.35}
.tree .n:hover{background:var(--chip)}
.tree .n.cur{background:var(--chip);box-shadow:inset 3px 0 0 var(--accent)}
.tree .n .cd{color:var(--code);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
.tree .n .pg{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.tree .l0{font-weight:700;margin-top:8px;text-transform:uppercase;font-size:12px;letter-spacing:.03em}
.tree .l1{font-weight:600}
.tree .l2{padding-left:24px}
.tree .l3{padding-left:40px;color:var(--ink)}
.tree .tg{cursor:pointer;color:var(--muted);width:12px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;transform:translateY(-1px)}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.crumb a{text-decoration:none}
h1.st{font-size:22px;margin:0 0 4px;line-height:1.3}

.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 14px;font-size:13px;color:var(--muted)}
.sum{background:var(--sum);border:1px solid var(--sum-line);border-radius:10px;padding:10px 14px;margin:0 0 16px}
.sum b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:2px}
.txt p{margin:0 0 10px}
.txt h4{margin:18px 0 8px;font-size:15px}
.txt ul{margin:0 0 10px;padding-left:22px}
.txt li{margin:0 0 5px}
.txt ul.sub{margin:5px 0 5px;list-style:circle}
.txt li.nb{list-style:none}
pre.tbl{font:12px/1.35 ui-monospace,Consolas,monospace;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre}
.ref{font-style:italic;color:var(--muted)}
a.xr{text-decoration:none;border-bottom:1px dotted var(--accent);white-space:nowrap}
a.fg{font-size:12px;background:var(--chip);border-radius:5px;padding:0 5px;text-decoration:none;font-style:normal}
.df{border-bottom:1px dashed var(--muted);cursor:help}
sup{font-size:9px;color:var(--muted)}
mark{background:var(--hl);color:inherit;border-radius:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.box h3{margin:0 0 8px;font-size:15px}
.sub-list a{display:block;padding:4px 0;text-decoration:none}
.sub-list .cd{color:var(--code);margin-right:6px}
.eq a{margin-right:8px}
.notes textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px;font:inherit}
.results .r{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.results .r:hover{background:var(--chip)}
.results .r .cd{color:var(--code);font-weight:600;margin-right:6px}
.results .r .sn{color:var(--muted);font-size:13.5px;margin-top:3px}
.pop{position:absolute;z-index:50;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px 14px;font-size:13.5px;max-height:320px;overflow:auto}
.pop h5{margin:0 0 6px;font-size:14px}
table.cf{width:100%;border-collapse:collapse;font-size:14px}
table.cf td,table.cf th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.cf th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
table.cf td.v{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ob .reg{font-size:12.5px;color:var(--muted);margin:-4px 0 8px}
.ob a{display:block;text-decoration:none;padding:3px 0}
.ob a .cd{color:var(--code);font-weight:600;margin-right:6px;font-size:13px}

.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.figs .fc{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.figs .fc img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover;object-position:top;background:#fff}

.menu{display:none}

.pj-a:first-of-type{border-top:0}
.pj-a input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}
.pj-a a{text-decoration:none;color:var(--ink)}
.pj-a .cd{color:var(--code);font-weight:600;margin-right:6px;font-size:13px}
.pj-a .tt{color:var(--muted);font-size:12.5px;display:block}
.pj-a.ok a{opacity:.55}

s constructions","l":1,"p":166,"q":167,"n":167,"s":"body","a":0,"z":"UL","th":["haut"]},{"t":"Article UL.11 – Aspect extérieur constructions et aménagement de leurs abords","l":1,"p":167,"q":167,"n":167,"s":"body","a":0,"z":"UL","th":["asp"]},{"t":"Article UL.12 – Obligations imposées aux constructeurs en matière de réalisation","l":1,"p":167,"q":167,"n":167,"s":"body","a":0,"z":"UL","th":[]},{"t":"Article UL.13 – Obligations imposées aux constructeurs en matière de réalisation","l":1,"p":167,"q":221,"n":221,"s":"body","a":0,"z":"UL","th":[]}],"zones":["UA","UA10","UA8","UA9","UB","UC","UC10","UC8","UC9","UD","UE","UL","URBAINES"],"pages":["    DEPARTEMENT DES HAUTS DE SEINE\n    Ville de Neuilly-sur-Seine\nPlan    local    d’ u r b a n i s m e\nP\ni\nè\nc\ne\nn\n°\n4\n.\n1\n:\nPièce n° 4 : Règlement et annexes au règlement\nPLU approuvé","Pièce n°4 : Règlement et annexes au règlement\nSommaire\nPièce n°4.1 : Règlement (titre I : dispositions générales, Titre II : dispositions\napplicables aux zones urbaines, Titre III : définitions)\nPièce n°4.2 : Annexes au règlement\n    Pièce n°4.2.1 : Liste des emplacements réservés et des servitudes\n    prises en vertu de l’article L.123-2 du Code de l’urbanisme\n    Pièce n°4.2.2 : Liste des bâtiments et ensembles urbains à protéger\n    au titre de l’article L.123-1-5,7° du Code de l’Urbanisme (bâtiments\n    références, arbres remarquables et monuments funéraires avec plan)\n    Pièce n°4.2.3 : Liste des essences d’arbres à planter ou venant en\n    remplacement des arbres de haute tige supprimés\n    Pièce n°4.2.4 : Canalisations de gaz haute pression (tracé et fiche\n    d’information)\n    Pièce n°4.2.5 : Périmètre délimitant les majorations des règles de\n    construction pour les logements libres et sociaux en vertu des articles\n    L.127-1 et L.123-1-11 du Code de l’Urbanisme","   DÉPARTEMENT DES HAUTS DE SEINE\n    Ville de Neuilly-sur-Seine\nPlan    local    d’ u r b a n i s m e\nPièce n° 4.1 : Règlement (Titre I : dispositions\ngénérales, Titre II : dispositions applicables aux\nzones urbaines, Titre III : définitions)\nPLU approuvé le 21 novembre 2013 et modifié le 24 septembre 2015, le 20\ndécembre 2017, le 25 juin 2019, le 8 février 2021, le 29 juin 2021 et le 30 juin\n2026.\n    1","2","    SOMMAIRE\nTITRE I : DISPOSITIONS GÉNÉRALES    page 5\nTITRE II : DISPOSITIONS APPLICABLES AUX ZONES URBAINES   page 13\nCHAPITRE 1 : Zone UA    page 15\nCHAPITRE 2 : Zone UB    page 42\nCHAPITRE 3 : Zone UC    page 66\nCHAPITRE 4 : Zone UD    page 94\nCHAPITRE 5 : Zone UE    page 121\nCHAPITRE 6 : Zone UL    page 133\nTITRE III : DÉFINITIONS    page 139\n    3","4","    TITRE I\nDISPOSITIONS GÉNÉRALES\n    5","6","Les articles de codes cités le sont dans leur version au 1er janvier 2020.\nArticle 1 – Champ d’application territorial\nLe présent règlement s’applique à l’ensemble du territoire communal.\nArticle 2 – Portée respective du règlement à l’égard d’autres législations relatives à\nl’occupation des sols\nSont et demeurent applicables sur le territoire de la Commune :\n2.1 - Les articles d'ordre public du règlement national d'urbanisme en vertu de l'article\nR.111-1 du code de l'urbanisme :\n    -R.111-2 salubrité et sécurité publique\n    -R.111-4 conservation et mise en valeur d'un site ou vestige archéologique\n    - R.111-20 à R.111-27\n2.2 - Les servitudes d'utilité publique affectant l'utilisation du sol\nLa liste des servitudes figure en annexe du PLU et un Plan de Prévention des Risques\nd’Inondation de la Seine dans le département des Hauts-de-Seine a été prescrit en date du 29\nmai 1998 et approuvé le 9 janvier 2004 par arrêté préfectoral.\nArticle 3 – Division du territoire en zones\n3.1 - Les zones urbaines et les secteurs\nLe territoire couvert par le présent P.L.U. est divisé en 6 zones urbaines (U).\n- zone UA avec les secteurs UAa et UAb et les sous-secteurs UAa1 et UAa2\n- zone UB\n- zone UC avec les secteurs UCa, UCb, et UCz.\n- zone UD avec les secteurs UDa UDb UDc.\n- zone UE\n- zone UL\nIl n’existe ni zone naturelle ou forestière ni zone à urbaniser ou agricole.\n    7","3.2 – Les bâtiments « référence »\nLa mise en valeur d'hôtels particuliers et de bâtiments collectifs remarquables, regroupés sous\nl'appellation bâtiments \"référence\" est recherchée.\nAinsi, pour les bâtiments \"référence\" disséminés sur l'ensemble du territoire de la commune,\ndont la conservation en tout ou en partie pourra être imposée, il sera fait application de l'article\nL.151-19 du code de l'urbanisme.\nCes bâtiments \"référence\" sont localisés sur le plan de zonage et inscrits dans une liste\nannexée au règlement.\n3.3 – Les emplacements réservés et les espaces boisés classés\nLes emplacements réservés sont repérés aux documents graphiques et répertoriés dans une\nliste figurant en annexe du présent règlement.\nLes espaces boisés classés de l'article L.113-1 du code de l'urbanisme sont repérés au\ndocument graphique (L.151-19 Code de l’Urbanisme).\nArticle 4 – Adaptations mineures et dérogations\nLes règles et servitudes définies par ce Plan Local d’Urbanisme peuvent faire l’objet\nd’adaptations mineures rendues nécessaires par la nature du sol, la configuration des\nparcelles ou le caractère des constructions avoisinantes. Elles ne peuvent cependant être\naccordées que par rapport aux articles 3 et 13 du règlement de chaque zone. Des dérogations\npeuvent également être accordées dans les cas mentionnés à l’article L.152-4 du Code de\nl’Urbanisme.\nArticle 5 – Reconstruction de bâtiments\nSur l’ensemble du territoire communal s’appliquent les dispositions de l’article L.111-15 du\nCode de l’Urbanisme concernant la reconstruction à l’identique d’un bâtiment régulièrement\nédifié. La reconstruction, dans ce cas, est soumise aux conditions fixées aux articles 2 du\nrèglement de chaque zone. Par reconstruction à l’identique, il faut entendre toute\nreconstruction comprenant la même implantation et le même volume qu’avant démolition sans\ndépasser la surface de plancher avant démolition.\nToutefois, cette reconstruction n’est pas autorisée pour les bâtiments «référence » protégés\nen application de l’article L 151-19 du Code de l’Urbanisme, sauf en cas de sinistre ou de péril.\n    8","Article 6 – Rappels\na) l'édification des clôtures est soumise à déclaration, par délibération n°2 du conseil municipal\ndu 13 septembre 2007 (Article R.421-12 du Code de l'Urbanisme).\nb) les démolitions sont soumises au permis de démolir sur l'ensemble du territoire de la\nCommune, par délibération n°2 du 13 septembre 2007.\nc) lorsqu'un projet porte sur un immeuble inscrit au titre des monuments historiques,\nl’autorisation de construire doit faire l’objet de l’accord de l’architecte des bâtiments de France.\nCet accord est donné par le préfet de région (Art. R.425-16 Code de l’Urbanisme). Lorsque le\nprojet est situé dans un site classé ou en instance de classement, la décision prise sur la\ndemande de permis ou sur la déclaration préalable ne peut intervenir qu'avec l'accord exprès\nprévu par les articles L. 341-7 et L. 341-10 du code de l'environnement (Art. R.425-17 Code\nde l’Urbanisme).\nd) les coupes et abattages d'arbres sont soumis à autorisation préalable dans les espaces\nboisés classés. (Article L.113-2 et suivants du Code de l'Urbanisme).\ne) Le droit de préemption urbain renforcé s’applique sur l’ensemble du territoire de la commune\n(cf. annexes du P.L.U.)\nf) Les servitudes d’utilité publique applicables sur le territoire de Neuilly-sur-Seine figurent en\nannexe du P.L.U.\ng) Les prescriptions relatives aux obligations d’isolement acoustique aux abords des\ninfrastructures de transport terrestre figurent en annexe du P.L.U.\nh) Les termes du règlement faisant l’objet d’une définition dans le lexique en troisième\npartie du règlement sont indiqués d’un astérisque lors de leur première citation dans\nchaque article.\nArticle 7 – Prescriptions spéciales\n7.1 – Bâtiments « références »\nPour tenir compte du caractère des bâtiments \"référence\" ou partie de bâtiments \"référence\",\nou de l'intérêt des lieux avoisinants des bâtiments « références », des prescriptions spéciales\npourront être imposées dans le règlement. Ces bâtiments sont protégés au titre de l’article\nL.151-19 du Code de l’Urbanisme.\n7.2 – Constructions et installations nécessaires au service public et d’intérêt collectif\n(CINASPIC)\nLes dispositions du présent règlement sont applicables à l’ensemble des CINASPIC définis en\nannexe du règlement.\n    9","7.3 – Unités foncières localisées au plan de zonage 5.3\nSur les unités foncières représentées graphiquement et comprenant déjà des constructions\ndont la hauteur est supérieure à la hauteur maximale autorisée à l’article 10 de chaque zone,\nl’extension, l’aménagement ou la reconstruction des bâtiments sont autorisés avec une\nhauteur maximum égale à la plus grande hauteur des constructions existantes sur l’unité\nfoncière (correspondant à la définition prévue dans les modalités d’applications de l’article 10)\nà la date d’approbation du PLU, à condition de respecter les autres règles.\n7.4 – Arbres et espaces publics remarquables\nLes arbres remarquables repérés sur le plan de zonage et dont la liste figure en annexe du\nrèglement sont protégés au titre de l’article L. 151-19 du Code de l’Urbanisme. Leur coupe et\nabattage ne peuvent être autorisés que pour des raisons phytosanitaires et sous réserve de\nremplacement par des arbres à développement similaire parmi une liste limitative annexée au\nrèglement.\nLa partie du cimetière dont le périmètre figure sur le plan de zonage est protégée au titre de\nl’article L. 151-19 du Code de l’Urbanisme. Tout aménagement à l’intérieur de ce périmètre\ndevra contribuer à la mise en valeur de ce site. Il ne peut être porté atteinte à la qualité des\nmonuments funéraires dont la liste figure en annexe du règlement.\n7.5 – Servitudes d’urbanisme\na) Dans l’attente de l’approbation par la commune d’un projet global d’aménagement, des\nservitudes au titre de l’article L 151-41,5°du code de l’urbanisme sont instaurées et repérées\nau plan de zonage. Seuls y sont autorisés, les travaux ayant pour objet l’adaptation, le\nchangement de destination, la réfection ou l’extension limitée des constructions existantes\nsous réserve qu’ils n’aboutissent pas à la création d’un total de plus de 2% de la surface de\nplancher existante sur l’unité foncière.\nb) Sur les unités foncières repérées au plan de zonage par une servitude de l’article L.151-41\ndu Code de l’Urbanisme, un équipement sportif et un espace vert devront être réalisés\nconformément à l’annexe du règlement.\nArticle 8 – Protection et développement de l’habitat\n8.1 – Dispositions favorisant la diversité de l’habitat\nSur tout le territoire communal, un dépassement des règles relatives au gabarit*, à la hauteur\net à l’emprise au sol résultant du PLU est autorisé dans une limite de 20% pour permettre\nl’agrandissement ou la construction de bâtiments à usage d’habitation. L’application du\ndépassement, ainsi, autorisé ne peut conduire à la création d’une surface de plancher\nsupérieure de plus de 20% à la surface de plancher existante (article L.151-28,1° du Code de\nl’Urbanisme).\nEgalement, dans les secteurs définis au plan annexé au règlement, une majoration du volume\nconstructible tel qu’il résulte des règles relatives au gabarit*, à la hauteur et à l’emprise au sol,\nest autorisée dans une limite de 30% pour la réalisation de programmes de logements\ncomprenant des logements locatifs sociaux (article L.151-28,2° du Code de l’Urbanisme).\n    10","Cette majoration, pour chaque opération, ne peut être supérieure au rapport entre le nombre\nde logements locatifs sociaux et le nombre total des logements de l’opération.\nNota : ces majorations de constructibilité ont été instaurées par délibération n°45 du Conseil\nMunicipal de Neuilly-sur-Seine du 28 avril 2011.\n8.2 – Modalités d’application des majorations prévues aux paragraphes ci-dessus\nü   Rappel : La majoration du volume constructible permise par l’article article L.151-28,1° est\n    exclusive de celle de l’article article L.151-28,2° (L.151-29 Code de l’Urbanisme).\nü   Le dépassement ne peut excéder 20 ou 30% pour chacune des règles concernées (de\n    gabarit, de hauteur ou d’emprise).\nü   Les projets de construction bénéficiant des majorations spécifiques prévues aux articles\n    UA 10.1.2, UA 10.2.3, UB 10.1, UB 10.2.3, UC 10.1.1, UC 10.1.2, UC 10.2.3, UD 10.1.4\n    et UD 10.2.3 ne peuvent bénéficier des majorations de hauteur du 8.1.\nü   Lorsque la hauteur des constructions est exprimée en nombre de niveaux, le résultat de\n    l’application de ces majorations est arrondi au chiffre inférieur.\n    Exemples : pour une hauteur de 21 mètres et de R*+ 6, une majoration de 30 % aboutit à\n    une hauteur autorisée de 27,3 mètres et un nombre de niveaux de R + 8 ; une majoration\n    de 20 % aboutit à une hauteur de 25,2 mètres et un nombre de niveaux de R +7.\n    Autre exemple : pour une hauteur de 12 mètres et de R+3, une majoration de 30 % aboutit\n    à une hauteur autorisée de 15,6 mètres et un nombre de R+4 ; une majoration de 20 %\n    aboutit à une hauteur de 14,4 mètres et un nombre de niveaux de R+3.\n8.3 – Changement d’usage des locaux d’habitation\nToute demande de changement d’usage devra se conformer aux délibérations du Conseil\nMunicipal modifiées par le Conseil de Territoire de l’Etablissement Public Territorial Paris\nOuest La Défense.\nArticle 9 - Protection du commerce de proximité et de l’artisanat\nSur les secteurs repérés au plan de zonage 5.2 en tant que linéaires commerciaux, lorsque\ndes locaux d’artisanat* ou de commerce sont implantés au rez-de-chaussée et/ou au premier\nétage, le changement de destination de ces commerces ou artisanat en bureaux*, est interdit.\nCette disposition s’applique uniquement aux locaux bénéficiant d’une ouverture (devanture,\nporte d’accès, vitrine…) sur le linéaire repéré au document graphique, dans une bande de\n5 mètres de profondeur comptés depuis la façade, sur l’ensemble du local concerné.\nLe changement de destination peut toutefois être autorisé pour les surfaces/locaux\naccessoires aux activités de bureau (notamment accès - y compris rampes d’accès aux\nparkings souterrains, issues de secours, locaux techniques, ou encore locaux vélos, aires de\nlivraisons…), qu’ils soient disposés en continu ou non, et dans la limite de 50% de la longueur\nde la façade projetée, comprise dans l’autorisation d’urbanisme, et concernée par le linéaire\nrepéré au document graphique.\n    11","Article 10 – Travaux sur constructions existantes non conformes\n Lorsqu’une construction existante n’est pas conforme aux dispositions applicables dans la\n zone où elle se situe, l’autorisation d’exécuter des travaux ne peut être accordée que pour des\n travaux qui n’aggravent pas la non-conformité de la construction à ces dispositions ou qui sont\n sans effet à leur égard, sauf dispositions particulières du règlement de la zone.\n Toutefois, peuvent être autorisés des travaux visant à améliorer la performance énergétique\n des constructions, l’isolation phonique, acoustique ou thermique, ainsi que les modénatures\n et saillies ou empiétements par rapport au nu de la façade visant à harmoniser l’insertion du\n bâtiment dans son environnement ou l’expression d’une composition architecturale, qu’elles\n soient ou non conformes aux dispositions du règlement.\nArticle 11 – Tableau de correspondance des destinations et sous-destinations\n(ancienne et nouvelle nomenclature)\n    12","    TITRE II\nDISPOSITIONS APPLICABLES AUX ZONES\n    URBAINES\n    13","14","    CHAPITRE 1\n    Dispositions applicables à la zone UA\nLa zone UA, décrite dans le rapport de présentation, est une zone dense à caractère central.\nCette zone est divisée en deux secteurs, UAa et UAb.\nLe secteur UAa est situé le long de l'avenue Charles de Gaulle et de la Place du Marché, de\npart et d'autre de l'axe historique. Il est lui-même divisé en deux sous-secteurs UAa1 et UAa2.\n* Le sous-secteur UAa1 correspond à la séquence d'architecture dite \"moderne\" de l’avenue\n* Le sous-secteur UAa2 correspond aux séquences d'architecture dites \"classique\", situées\naux extrémités de l'avenue et le long de la Place du Marché\nLe secteur UAb s'étend sur l'ancienne \"Plaine des Sablons\" au-delà du secteur de l'axe de\nl’avenue Charles de Gaulle.\nEn outre, la zone UA comprend des secteurs spécifiques de zone de plan de masse dont les\nrègles diffèrent aux articles 6, 7, 8, 9, 10.\n    15","16","    SECTION 1 – Nature de l’occupation et de l’utilisation du sol\nArticle UA.1 – Occupations et utilisations du sol interdites\n1.1.1 – Les constructions et occupations du sol à destination d’industrie ou d’entrepôt.\n1.1.2 – Les affouillements et exhaussements des sols supérieurs à 0,6 mètres qui ne\nsont pas nécessaires au projet de construction.\n1.1.3 – L'implantation et l'aménagement des installations classées suivantes :\na) celles soumises à autorisation, sauf celles prévues à l’article UA 2.1.2 et sauf les garages\nd'entretien de voitures, les dépôts d'hydrocarbures liés aux chaufferies et station-service,\nles installations de climatisation de bureaux et de salle d'ordinateur, les installations\nnécessaires au fonctionnement des constructions et installations nécessaires aux services\npublics ou d’intérêt collectif (CINASPIC)* et celles qui visent à améliorer les performances\nénergétiques des bâtiments.\nb) celles soumises à déclaration, sauf celles prévues à l’article UA 2.1.\n1.1.4 – Les terrains de camping et de caravanes*, les caravanes isolées et les habitations\nlégères de loisirs.\nArticle UA.2 – Occupations et utilisations du sol soumises à des conditions particulières\n2.1- Dans la zone UA :\n2.1.1 Les installations classées soumises à déclaration, à condition qu'elles n'entraînent pour\nle voisinage, aucune incommodité et, en cas d'accident ou de fonctionnement défectueux,\naucune insalubrité ni sinistre susceptible de causer des dommages graves ou irréparables aux\npersonnes et aux biens. En outre, leurs exigences de fonctionnement lors de leur ouverture\nou à terme, doivent être compatibles avec les infrastructures existantes, notamment les voiries\net l'assainissement.\n2.1.2 - L'aménagement des installations classées existantes, à condition :\na) qu'il n'en résulte pas pour le voisinage une aggravation des dangers ou nuisances,\nb) que ces installations par leur importance ou leur aspect extérieur soient compatibles avec\nle milieu environnant.\n2.1.3 – Les installations classées annexes aux constructions (chaufferies d'immeubles, dépôts\nd'hydrocarbures, postes de transformation) à condition qu'elles soient réalisées dans le volume\ndes bâtiments autorisés ou en sous-sol* de ceux-ci.\n    17","2.2 - Dans le sous-secteur UAa2 :\nPour chaque unité foncière, dans la bande de 20 mètres à compter de l’alignement de l'avenue\nCharles de Gaulle et de la Place du Marché, les destinations bureau, commerce, à condition\nque le total de ces destinations n’excède pas le tiers de la surface de plancher totale (existante\net projetée) des constructions dans cette bande.\n2.3 - Reconstruction à l’identique :\n2.3.1 - Principe général\nLa reconstruction à l’identique des constructions existantes fait l’objet des règles prévues à\nl’article 5 des dispositions générales.\n2.3.2 - Bâtiments « références »*\na) la conservation des bâtiments \"référence\", ou parties de bâtiments \"référence\" pourra être\nimposée.\nDans ce cas, les bâtiments conservés pourront être réhabilités ou maintenus dans leurs\nimplantation, emprise, hauteur, aspect extérieur et surface de plancher existants nonobstant\nles règles générales de la zone.\nb) dans les cas suivants :\n- extension du bâtiment référence,\n- reconstruction d'une partie d'un bâtiment référence ou d'une annexe* présentant un intérêt\nmoindre au regard des critères qui auront déterminé le classement du bâtiment principal\n- Construction nouvelle secondaire,\n- Reconstruction en cas de démolition autorisée pour des motifs architecturaux, l'implantation\nde la construction nouvelle devra respecter les règles générales de la zone définies aux articles\nUA 6.1, 6.2 et 6.3, sans altérer le caractère du bâtiment \"référence\" lui-même et en préservant\nl'intérêt des lieux avoisinants le bâtiment référence.\nc) dans le cas de sinistre ou péril d'un bâtiment \"référence\" la reconstruction sera imposée à\nl'identique. Cependant si cette reconstruction à l'identique ne peut être mise en œuvre, une\nconstruction nouvelle de qualité pourra remplacer le bâtiment \"référence\"* disparu, dans le\nrespect des règles générales d'implantation de la zone et de l'intérêt des lieux avoisinants.\n2.4 - Rappels :\nPlan de Prévention des Risques d’Inondation (P.P.R.I.) de la Seine dans les Hauts-de-Seine :\nDans les parties de zones repérées au P.P.R.I., annexé au PLU, la nature de l’occupation et\nde l’utilisation des sols est subordonnée aux dispositions réglementaires dudit Plan approuvé.\n2.5 - Protection du commerce et de l’artisanat* sur les linéaires commerciaux : il est fait\napplication des dispositions de l’article 9 des dispositions générales\n2.6 - Changements d’usage d’une construction ou de locaux d’habitation : il est fait\napplication des dispositions de l’article 8.3 des dispositions générales.\n2.7 - Dans les parties de la zone soumises au risque technologique de transports de\nmatière dangereuse lié à la présence des canalisations de gaz à haute pression, dont le\ntracé figure en annexe du règlement du PLU, toute occupation ou utilisation du sol doit\nrespecter les règles visant à garantir sa sécurité publique. Les projets concernés par ce risque,\npourront être autorisés après avis et sous réserve de l’observation des prescriptions spéciales\nou mesures conservatoires qui seraient émises par le service intéressé et le service\ngestionnaire de ces ouvrages. Les ouvrages de transports devront se conformer aux\ndispositions en vigueur notamment par des mesures de protection suffisantes. Ces\ndispositions figurent dans une fiche d’information en annexe du règlement.\n    18","  SECTION 2 – Conditions de l’occupation et de l’utilisation du sol\nArticle UA.3 – Accès et Voirie\n3.1 - Pour être constructible, un terrain doit être accessible d'une voie* privée ou\npublique :\n- soit directement,\n- soit par l'intermédiaire d'un passage aménagé et matérialisé sur le fonds voisin.\n3.2 - Les accès doivent présenter des caractéristiques permettant de satisfaire aux exigences\nde sécurité, de défense contre l'incendie et de la protection civile. Ces exigences doivent être\nrespectées sans porter atteinte au stationnement existant sur les voies riveraines publiques.\n3.3 - Toute création de voie de desserte devra présenter une largeur minimum de 3,50 mètres.\n3.4 - Les voies nouvelles se terminant en impasse doivent être aménagées de telle sorte\nque les véhicules puissent faire demi-tour.\nArticle UA.4 – Conditions de desserte des terrains par les réseaux publics d’eau,\nd’électricité, d’assainissement et de collecte des déchets\n4.1 – Eau potable\nToute construction nouvelle doit être raccordée au réseau public de distribution d'eau potable.\n4.2 - Assainissement par un branchement particulier\n4.2.1 - Eaux usées\nToute construction ou installation nouvelle doit être raccordée au réseau public\nd'assainissement.\n4.2.2 - Eaux pluviales\nLes aménagements réalisés sur l’unité foncière doivent respecter les limitations de\nruissellement vers les réseaux d’assainissement conformément aux règlements\nd’assainissement en vigueur.\nPour toute construction nouvelle ou reconstruction, le rejet des eaux pluviales dans le réseau\nd’assainissement ne pourra excéder un débit maximal fixé aux règlements intercommunaux et\ndépartementaux en vigueur.\n    19","4.3 – Collecte des déchets\nIl devra être prévu, dans les constructions neuves de plus d’un logement, des locaux dédiés\nuniquement à la collecte des déchets ménagers et assimilés et adaptés au stockage de leurs\nconteneurs. Ces locaux devront être fermés et dimensionnés au nombre de logements réalisés\net à l’accueil de l’ensemble des conteneurs nécessaires aux exigences de la collecte des\ndéchets ménagers et assimilés.\nArticle UA.5 – Superficie minimale des terrains constructibles\nNéant.\nArticle UA.6 – Implantation des constructions par rapport aux voies et emprises\npubliques* existantes ou projetées\nIl est fait application des dispositions des articles 8.1 et 8.2 des dispositions générales pour la\ndiversité de l’habitat.\n6.1 - Principe général :\nLe présent article s’applique aux voies* publiques et privées ainsi qu’aux emprises publiques\net/ou ouvertes au public.\n6.2 - En l’absence de marge de reculement* repérée au plan de zonage\n6.2.1 - Implantation à l'alignement* existant ou projeté.\n6.2.2 - Pour se conformer à l’article UA 10.2 : implantation des derniers niveaux en retrait d’au\nmoins 2,50 mètres par rapport à l’alignement existant ou projeté.\n6.2.3 – Pour les voies privées, implantation à 4 mètres minimum de l’axe de la voie.\n6.3 - En présence d’une marge de reculement* repérée au plan de zonage\nLes constructions en superstructure sont interdites dans les marges de reculement (dans le\nrespect de l'article UA 13.4) à l'exception des accès aux rampes de parking, clôtures,\nencorbellements* et saillies* dans les conditions de l’article UA 6.6.2.\nLes constructions en infrastructure sont interdites dans les marges de reculement inférieures\nà 10 mètres. Elles sont autorisées dans les marges de reculement de 10 mètres ou plus à\ncondition qu'elles soient implantées à plus de 4 mètres de l'alignement pour permettre la\nréalisation d'espaces plantés conformément à l'article UA 13. Pour les rampes de parking, leur\nimplantation dans les marges de reculement se fait librement.\n    20","Pour les constructions existantes situées dans les marges de reculement figurées au plan de\nzonage, tous les travaux de réhabilitation soumis à autorisation d'urbanisme sont autorisés à\ncondition qu'il s'agisse ni d'une extension en volume, ni d'une surélévation. Toutefois, les\nredressements de toiture y sont autorisés, ainsi que les extensions en infrastructure à l’aplomb\ndes parkings existants.\n6.4 - Implantation des Bâtiments \"références\"*\na) La conservation des bâtiments \"référence\", ou parties de bâtiments \"référence\" pourra être\nimposée.\nDans ce cas, les bâtiments conservés pourront être réhabilités ou maintenus dans leur\nimplantation existante, nonobstant les règles générales de la zone.\nb) Dans les cas suivants :\n- Extension du bâtiment « référence »,\n- Reconstruction d'une partie d'un bâtiment référence ou d'une annexe* présentant un intérêt\nmoindre au regard des critères qui auront déterminé le classement du bâtiment principal ;\n- Construction nouvelle secondaire ;\n- Reconstruction en cas de démolition autorisée pour des motifs architecturaux,\nL'implantation de la construction nouvelle devra respecter les règles générales de la zone\ndéfinies aux articles UA 6.1, 6.2, 6.3, sans altérer le caractère du bâtiment \"référence\" lui-\nmême et en préservant l'intérêt des lieux avoisinants.\nc) Dans le cas de sinistre ou péril d'un bâtiment \"référence\" la reconstruction sera imposée à\nl'identique. Cependant si cette reconstruction à l'identique ne peut être mise en œuvre, une\nconstruction nouvelle de qualité pourra remplacer le bâtiment \"référence\" disparu, dans le\nrespect des règles générales d'implantation de la zone et de l'intérêt des lieux avoisinants.\n6.5 - Modalités d'application\n6.5.1 - En l'absence d'indications particulières figurant au plan de zonage, les propriétés\nsituées à l'angle de deux voies doivent supporter un alignement nouveau constitué par un\nsegment de droite de 5 mètres de longueur formant des angles égaux avec chacun des\nalignements des voies adjacentes dans le respect de l’article UA 11.\n6.5.2 - Dans le secteur UAa, l'implantation d'une partie de bâtiment ainsi que le couronnement*\net le soubassement* peuvent faire l'objet de prescriptions spéciales concernant les retraits ou\nsaillies par rapport à l'alignement*, pour s'harmoniser avec l'environnement ou l'expression\nd'une composition architecturale.\n6.6 – Saillies* et encorbellements*\n6.6.1 - Saillies et encorbellements en surplomb des voies et emprises publiques*\n6.6.1.1 – Saillies et encorbellements en bordure des voies autres que celles visées à l’article\nUA 6.6.1.2.\nLes saillies et encorbellements sont autorisés sur les voies et emprises publiques si leur\nlargeur est supérieure ou égale à 12 mètres, dans le respect de l'article UA 11.\nIls sont soumis aux règles suivantes :\n- leur profondeur doit être inférieure ou au plus égale au trentième de la largeur de la voie ou\nde l’emprise et à 1,20 mètres,\n- la partie inférieure de la saillie ou du surplomb doit être à une hauteur supérieure ou égale à\n5,50 mètres au-dessus du niveau du trottoir.\n    21","6.6.1.2 – Saillies et encorbellements en bordure de certaines voies\nLe long du Boulevard Bineau (RD 908) du Boulevard Bourdon, du Boulevard du Général\nLeclerc et du Boulevard du Général Koenig (RD1), les saillies doivent être conformes aux\nréglementations nationale et départementale en vigueur.\n6.6.1.3 - Dans tous les cas, la superficie de la façade en surplomb ne doit pas être supérieure\nau double de la superficie de la façade en retrait ou à l'alignement*, sauf pour les parcelles\nriveraines de l’avenue Charles de Gaulle, où la mise en place d’une isolation thermique en\nsaillie sur domaine public à partir du plancher haut du rez-de-chaussée est autorisée sur les\nbâtiments existants sous réserve de faire l’objet d’un traitement architectural d’ensemble de\nqualité.\n6.6.2 – Saillies et encorbellements en surplomb des marges de reculement*\n  Les saillies et encorbellements sont autorisés sur les marges de reculement dans le respect\n  de l'article UA 11.\n  Ils sont soumis aux règles suivantes :\n  - la partie inférieure de la saillie ou de l’encorbellement doit être à une hauteur supérieure ou\n  égale à 2,60 mètres au-dessus du niveau du terrain*,\n  - s'il s'agit d'un balcon, la profondeur de la saillie doit être de 1,20 mètre maximum, si la largeur\n  de la marge de reculement est égale ou supérieure à 4,00 mètres. Elle doit être de 1,40 mètre\n  maximum, si la largeur de la marge de reculement est égale ou supérieure à 10 mètres,\n- s'il s'agit d'un encorbellement, celui-ci doit avoir une profondeur maximum de 1,20 mètre dans\n  les marges inférieures à 10 mètres et de 1,40 mètre dans les marges égales ou supérieures à\n  10 mètres.\n- s’il s’agit d’une saillie autre qu’un balcon ou un encorbellement, sa profondeur doit être de\n  1,20 mètre maximum.\n6.6.3 – Modénatures\nLes modénatures sont autorisées en saillies.\nArticle UA.7 – Implantation des constructions par rapport aux limites séparatives\nIl est fait application des dispositions des articles 8.1 et 8.2 des dispositions générales pour la\ndiversité de l’habitat.\n7.1 - Dans une bande de 20 mètres comptée à partir de l'alignement*, de la limite de la\nvoie privée ou de tout recul imposé\n7.1.1 - Les constructions doivent être implantées sur les limites séparatives* aboutissant aux\nvoies*. Toutefois, les surélévations et extensions des constructions existantes non implantées\nen limite séparative sont autorisées dans le prolongement des murs existants.\n7.1.2 - Les constructions peuvent s'implanter en retrait ou sur les autres limites séparatives\n(limites de fond).\n    22","7.2 - Au-delà de la bande de 20 mètres comptée à partir de l'alignement, de la limite de\nla voie privée ou de tout recul imposé\n7.2.1 - L'implantation des façades* ou parties de bâtiments sur les limites séparatives\nn'est autorisée que dans les cas suivants :\n- pour les constructions qui s'adossent à un bâtiment en bon état situé sur le fonds voisin et\nqui s'insèrent dans les héberges existantes ou s'adossent à un mur séparatif existant d'au\nmoins 5 mètres de haut.\nOu\n- pour les unités foncières* riveraines* de l'avenue Charles de Gaulle et/ou de la Place du\nMarché, à condition que la hauteur de la construction sur la limite séparative ne dépasse pas\n5 mètres à rez-de-chaussée.\n7.2.2 - L'implantation des façades ou parties de bâtiments en retrait des limites\nséparatives n’est autorisée que dans les cas suivants :\na) la distance du nu de la façade à la limite séparative comptée horizontalement d'une façade\ncomportant des baies principales* doit être au moins égale aux trois quarts de la hauteur de\ncette façade, sans pouvoir être inférieure à 12 mètres.\nb) la distance comptée horizontalement de la façade d'une construction ne comportant aucune\nbaie* ou comportant des baies secondaires* aux limites séparatives doit être au moins égale\nà la moitié de la hauteur de cette façade ou de ce mur aveugle* sans pouvoir être inférieure à\n3 mètres.\nCependant, pour les unités foncières d’une profondeur inférieure ou égale à 15 mètres, la\ndistance comptée horizontalement de toute façade ne comportant pas de baies principales\naux limites séparatives n’aboutissant pas aux voies (limites de fonds), doit être au moins égale\nau tiers de la hauteur de cette façade, sans pouvoir être inférieure à 3 mètres.\nc) la distance comptée horizontalement de la façade d’une construction à rez-de-chaussée\ncomportant des baies principales à la limite séparative constituée d’un mur aveugle ou de\nclôture d’au moins 5 mètres de haut doit être au moins égale à 9 mètres.\n7.3 – Cas des façades comportant des baies principales et non parallèles aux limites\nséparatives\n- la distance comptée horizontalement au milieu de la façade à la limite séparative, doit être\nau moins égale à la hauteur de cette façade, sans pouvoir être inférieure à 12 mètres.\n- la distance de la façade à la limite séparative, comptée horizontalement, doit être au moins\négale aux ¾ de la hauteur de cette façade, sans pouvoir être inférieure à 9 mètres.\n7.4 – Cas des Bâtiments \"références\"*\na) La conservation des bâtiments \"référence\", ou parties de bâtiments \"référence\" peut être\nimposée.\nDans ce cas, les bâtiments conservés sont réhabilités ou maintenus dans leur implantation\nexistante, nonobstant les règles générales de la zone.\n    23","b) Dans les cas suivants :\n- Extension du bâtiment référence,\n- Reconstruction d'une partie d'un bâtiment référence ou d'une annexe* présentant un intérêt\nmoindre au regard des critères qui auront déterminé le classement du bâtiment principal,\n- Construction nouvelle secondaire,\n- Reconstruction en cas de démolition autorisée pour des motifs architecturaux,\nL’implantation de la construction nouvelle devra respecter les règles générales de la zone\ndéfinies aux articles UA 7.1, 7.2, 7.3, sans altérer le caractère du bâtiment \"référence\" lui-\nmême et en préservant l'intérêt des lieux avoisinants.\nc) Dans le cas de sinistre ou péril d'un bâtiment \"référence\" la reconstruction sera imposée à\nl'identique.\nCependant si cette reconstruction à l'identique ne peut être mise en œuvre, une construction\nnouvelle de qualité pourra remplacer le bâtiment \"référence\" disparu, dans le respect des\nrègles générales d'implantation de la zone et de l'intérêt des lieux avoisinants.\n7.5 - Modalités d'application\nSe reporter à la définition de Hauteur*\n7.6 – Saillies* et encorbellements* dans les marges d'isolement* (latérales et arrières)\ndans le respect de l'article UA11\nDans les marges d’isolement définies aux articles UA 7.2.2 et 7.3 ci-dessus, les constructions\nen superstructure sont interdites à l'exception des encorbellements et des saillies. Les\nconstructions en infrastructure y sont autorisées.\nLes saillies et encorbellements ne sont autorisés que lorsque la distance séparant la façade\nde la construction projetée à la limite séparative opposée est supérieure ou égale à 12 mètres.\nIls sont soumis aux règles suivantes :\n- la partie inférieure de la saillie ou de l’encorbellement doit être située à une hauteur au moins\négale à 2,60 mètres au-dessus du terrain au droit de la saillie.\n- la profondeur de la saillie ou de l’encorbellement ne peut excéder le dixième de la distance\nentre la façade et la limite séparative opposée et, dans tous les cas, ne peut excéder 1,40\nmètre.\n7.7 - Servitude de cour commune\nLes constructions peuvent être implantées à une distance moindre que celle définie ci-dessus,\nlorsque les deux propriétaires voisins, par acte authentique s'obligent réciproquement à créer\nune servitude de cour commune au sens de l'article L.471-1 à L.471-3 du Code de l'Urbanisme\nou lorsqu'elle est instituée par voie judiciaire.\nEn outre, l’édification d’une construction en limite de cour commune doit respecter les\ndispositions de l’article UA 8 par rapport aux constructions situées sur l’unité foncière\nconcernée par la dite servitude.\n    24","7.8 – Courettes\nLes constructions pourront ne pas respecter les articles UA 7.1 à 7.3 lorsqu’existe, sur le fonds\nvoisin, une courette en limite séparative dont les façades comportent une ou des baies et que\nle projet prévoit, en regard de cette courette, la réalisation d’une courette d’une largeur au\nminimum identique à celle du fonds voisin et d’une profondeur (P) d’1,90 mètre minimum. Il en\nsera de même lorsqu’il existe sur le fonds voisin une baie en limite séparative.\n    Croquis\n    VOIE\n7.9 – Règles particulières concernant les constructions et installations nécessaires au\nservice public et d’intérêt collectif (CINASPIC)*\nLorsque les bâtiments ne sont pas implantés en limites séparatives, la distance comptée\nhorizontalement de la façade d'un bâtiment aux limites séparatives opposées doit être au\nmoins égale à la moitié de la hauteur du bâtiment sans pouvoir être inférieure à 3 mètres.\n7.10 – Dispositions particulières pour les zones de plans-masse :\nL'implantation des constructions se fait librement à l’intérieur des emprises constructibles\nrepérées au document graphique spécifique.\nDans une bande de 20 mètres à compter de l’alignement ou de la marge de reculement*, les\nconstructions doivent être implantées sur les limites séparatives aboutissant aux voies.\nAu-delà de cette bande de 20 mètres, les constructions doivent être implantées soit en limite\nséparative soit en retrait de 9 mètres minimum lorsqu’il s’agit de baies principales et de 6\nmètres minimum lorsqu’il s’agit de baies secondaires.\nArticle UA8 – Implantation des constructions les unes par rapport aux autres sur une\nmême propriété\nIl est fait application des dispositions des articles 8.1 et 8.2 des dispositions générales pour la\ndiversité de l’habitat.\n    25","8.1 – Pour une construction comprenant des façades* en vis-à-vis, l’implantation de ces\nfaçades n’a pas à respecter les règles édictées ci-dessous à l’intention des bâtiments non\ncontigus*.\n8.2 - L’implantation des bâtiments non contigus doit se faire selon les règles suivantes:\nLa distance, comptée horizontalement, séparant deux façades de bâtiments non contigus est\nau moins égale :\na) A la hauteur de la façade la plus haute, avec un minimum de 12 mètres, si la façade la plus\nbasse comporte une ou des baies principales*.\nb) A la hauteur de la façade la plus basse, avec un minimum de 12 mètres, si cette dernière\nne comporte pas de baies principales et que la façade la plus haute en comporte,\nc) Aux trois quarts du minimum de la hauteur de la façade la plus basse et à la moitié de la\nhauteur de la façade la plus haute, avec un minimum de 4 mètres, si les deux façades ne\ncomportent pas de baies principales.\n8.3 - Implantation des Bâtiments \"références\"*\na) La conservation des bâtiments \"référence\", ou parties de bâtiments \"référence\" peut être\nimposée.\nDans ce cas, les bâtiments conservés peuvent être réhabilités ou maintenus dans leur\nimplantation existante, nonobstant les règles générales de la zone.\nb) Dans les cas suivants :\n- Extension du bâtiment référence,\n- Reconstruction d'une partie d'un bâtiment référence ou d'une annexe* présentant un intérêt\nmoindre au regard des critères qui auront déterminé le classement du bâtiment principal,\n- Construction nouvelle secondaire,\n- Reconstruction en cas de démolition autorisée pour des motifs architecturaux,\nL’implantation de la construction nouvelle devra respecter les règles générales de la zone\ndéfinies aux articles UA 8.1, 8.2, sans altérer le caractère du bâtiment \"référence\" lui-même et\nen préservant l'intérêt des lieux avoisinants.\nc) Dans le cas de sinistre ou péril d'un bâtiment \"référence\" la reconstruction sera imposée à\nl'identique.\n Cependant si cette reconstruction à l'identique ne peut être mise en œuvre, une\nconstruction nouvelle de qualité pourra remplacer le bâtiment \"référence\" disparu, dans le\nrespect des règles générales d'implantation de la zone et de l'intérêt des lieux avoisinants.\n8.4 – Saillies* et encorbellements* entre deux façades en vis-à-vis dans le respect de\nl'article UA11\nIls ne sont autorisés que lorsque la distance séparant les deux façades à l'opposite est\nsupérieure à 12 mètres.\nIls sont soumis aux règles suivantes :\n- la partie inférieure de la saillie ou de l’encorbellement doit être située à une hauteur au moins\négale à 2,60 mètres au-dessus du terrain*,\n- la profondeur de la saillie ou de l’encorbellement ne peut excéder le dixième de la distance\nentre les deux façades et dans tous les cas, ne peut excéder 1,40 mètre.\n    26","8.5 – Dispositions particulières pour les zones de plans-masse\nL'implantation des constructions les unes par rapport aux autres se fait librement à l’intérieur\ndes emprises constructibles repérées au document graphique spécifique.\n8.6 – Modalités d’application\nSe reporter à la définition de Hauteur*\nArticle UA9 – Emprise au sol* des constructions\nIl est fait application des dispositions des articles 8.1 et 8.2 des dispositions générales pour la\ndiversité de l’habitat.\nDéfinition :\nPour l’application de cet article, l’emprise au sol* est définie au lexique du règlement. Cette\ndéfinition est différente de celle prise en compte pour le champ d’application des permis de\nconstruire et de recours à l’architecte.\n9.1 – Dispositions générales\nL'emprise au sol des bâtiments ne peut excéder 55 % de la superficie totale de l’unité foncière*.\nNonobstant les dispositions précédentes, une emprise au sol minimale est autorisée :\n- de 100 m² sur les unités foncières ayant une façade sur voie publique ou privée ouverte à la\ncirculation,\n- de 300 m² sur les unités foncières situées à l'angle de deux voies publiques ou privées\nouvertes à la circulation.\n9.2 – Dispositions particulières au secteur UAa pour les unités foncières ayant une\nfaçade sur l'avenue Charles de Gaulle et/ou la place du Marché\n- dans la bande de 20 mètres comprise à partir de l'alignement de l'avenue Charles de Gaulle\net de la Place du marché, l’emprise au sol des bâtiments, quelle que soit leur destination, peut\noccuper 100% de la superficie de cette bande de terrain,\n- au-delà de la bande de 20 mètres, comptée à partir de l'alignement de l'avenue Charles de\nGaulle et de la Place du marché, l’emprise au sol des bâtiments ne peut excéder 55% de la\nsuperficie de l’unité foncière située au-delà de cette bande.\n    27","9.3 – Règles particulières aux bâtiments \"références\"*\na) La conservation des bâtiments \"référence\", ou parties de bâtiments \"référence\" peut être\nimposée.\nDans ce cas, les bâtiments conservés peuvent être réhabilités ou maintenus dans leur emprise\nexistante, nonobstant les règles générales de la zone.\nb) Dans les cas suivants :\n- Extension du bâtiment référence,\n- Reconstruction d'une partie d'un bâtiment référence ou d'une annexe* présentant un intérêt\nmoindre au regard des critères qui auront déterminé le classement du bâtiment principal,\n- Construction nouvelle secondaire,\n- Reconstruction en cas de démolition autorisée pour des motifs architecturaux,\nl’emprise de la construction nouvelle devra respecter les règles générales de la zone définies\naux articles UA 9.1, 9.2, sans altérer le caractère du bâtiment \"référence\" lui-même et en\npréservant l'intérêt des lieux avoisinants.\nc) dans le cas de sinistres ou périls d'un bâtiment \"référence\" la reconstruction sera imposée\nà l'identique.\nCependant si cette reconstruction à l'identique ne peut être mise en œuvre, une construction\nnouvelle de qualité pourra remplacer le bâtiment \"référence\" disparu, dans le respect des\nrègles générales d'implantation de la zone et de l'intérêt des lieux avoisinants.\n9.4 - Règles particulières concernant les constructions et installations nécessaires au\nservice public et d’intérêt collectif (CINASPIC)*\nPour les constructions et installations nécessaires au service public et d’intérêt collectif,\nl’emprise au sol ne peut excéder 65% de la superficie totale de l’unité foncière ou 65% de la\nsuperficie de l’unité foncière située au-delà de la bande de 20 mètres mentionnée à l’article\nUA 9.2. Cette disposition s’applique, également, aux constructions dans lesquelles des\nCINASPIC sont intégrés, dès lors que la surface de plancher à destination de CINASPIC est\nmajoritaire dans la construction objet des travaux.\n9.5 – Bâtiments existants\nNonobstant les dispositions de l'article UA 9.1 une emprise supplémentaire sera autorisée\ndans la limite de 20m² pour les locaux à rez-de-chaussée qui améliorent l'hygiène ou la\nsécurité tels que les locaux poubelles, ascenseurs, ou le confort, tels qu’une loge de\ngardien, des abris pour les vélos, même si le bâtiment existant est déjà excédentaire par\nrapport à la norme.\n9.6 – Dispositions particulières pour les zones de plans-masse\nL’emprise au sol des constructions peut occuper la totalité des « emprises constructibles »\nrepérées au document graphique spécifique.\n    28","Article UA10 – Hauteur maximum des constructions\nIl est fait application des dispositions de l’article 7.3 des dispositions générales pour les unités\nfoncières localisées au plan de zonage 5.3 et des articles 8.1 et 8.2 des dispositions générales\npour la diversité de l’habitat.\n10.1 - Compte tenu du plafond du secteur\n10.1.1 - La hauteur maximum des constructions est fixée à 21 mètres et R*+6.\nCependant, pour les immeubles ayant une façade sur la place Parmentier, ou sur la rue\nJacques Dulud, entre les rues d’Orléans et Victor Noir, la hauteur des bâtiments est fixée à\nR+4+combles* (soit 18 mètres maximum au faîtage*) dans une bande de 15 mètres à partir de\nl’alignement actuel ou projeté des voies précitées.\n10.1.2 – Dépassements de la hauteur maximum :\n   -   Un dépassement de la hauteur maximum de 2 mètres pour les bâtiments d’habitation,\n    et de 4 mètres pour les immeubles de bureaux, est autorisé à la condition que les\n    hauteurs sous plafond* de chaque niveau soient supérieures à 2,5 mètres sans\n    dépasser R+6.\n   -   Un dépassement de la hauteur maximum de 1 mètre peut être autorisé et bénéficier\n    uniquement au rez-de-chaussée, lorsque les constructions comprennent des locaux de\n    commerce ou d’artisanat en rez-de-chaussée.\n10.2 - Compte tenu des voies\n10.2.1 - La hauteur maximum des constructions est déterminée par la plus courte distance les\nséparant de l'alignement* opposé existant ou projeté, augmenté de la marge de reculement*\nimposée sur l'alignement opposé existant ou projeté. En ce qui concerne les voies privées, la\ndistance à prendre en compte pour ce calcul est celle séparant la façade de la construction\nprojetée de la limite opposée de la voie.\n10.2.2 - A l'angle des îlots limités par des voies d'inégales largeurs, la hauteur maximum des\nconstructions édifiées en bordure de la voie la moins large peut être identique à celle autorisée\nen bordure de la voie la plus large, sur une distance au plus égale à 15 mètres comptée à\npartir des alignements* actuels ou futurs ou de tout recul imposé.\nPour les unités foncières d'angle, bordant l'avenue Charles de Gaulle, cette distance est fixée\nà 20 mètres.\n10.2.3 - Toutefois, afin de masquer les murs pignons en bon état sur limites séparatives*\naboutissant aux voies, cette hauteur maximum pourra être dépassée pour assurer un front bâti\ncohérent jusqu'à la hauteur maximum du pignon le plus haut.\n    29","10.3 - Hauteur des bâtiments \"références\"*\na) La conservation des bâtiments \"référence\", ou parties de bâtiments \"référence\" peut être\nimposée.\nDans ce cas, les bâtiments conservés peuvent être réhabilités ou maintenus dans leur hauteur\nexistante, nonobstant les règles de l’article UA 10.\nb) Dans les cas suivants :\n- Extension du bâtiment référence,\n-Reconstruction d'une partie d'un bâtiment référence ou d'une annexe* présentant un intérêt\nmoindre au regard des critères qui auront déterminé le classement du bâtiment principal,\n- Construction nouvelle secondaire,\n- Reconstruction en cas de démolition autorisée pour des motifs architecturaux,\nLa hauteur de la construction nouvelle devra respecter les règles générales de la zone définies\naux articles UA 10.1, 10.2 ou 10.4, sans altérer le caractère du bâtiment \"référence\" lui-même\net en préservant l'intérêt des lieux avoisinants.\nc) Dans le cas de sinistre ou péril d'un bâtiment \"référence\" la reconstruction sera imposée à\nl'identique, Cependant si cette reconstruction à l'identique ne peut être mise en œuvre, une\nconstruction nouvelle de qualité pourra remplacer le bâtiment \"référence\" disparu, dans le\nrespect des règles générales de hauteur de la zone et de l'intérêt des lieux avoisinants.\n10.4 - Dispositions particulières au secteur UAa\n10.4.1 - Séquences \"classiques\"(sous-secteur UAa2)\nDans une bande de 20 mètres comptée à partir de l'alignement, la hauteur maximum d'une\nconstruction est égale à 24 mètres (combles* compris) (R*+6) Toutefois pour les bâtiments\nmodernes existants situés aux numéros donnés ci-dessous la hauteur maximum est de 27\nmètres augmentée d'un étage supplémentaire de 4 mètres maximum construit en retrait des\nfaçades dans les conditions édictées à l'article UA 10.4.4.\nCôté pair n° 24, 30, 32, 34, 56, 58, 72 à 80\nPuis, côté pair n° 164, 168bis, 168ter, 176 à 180, 182\nCôté impair n° 73\nPlace du Marché n° 14, 16\nAu-delà de la bande de 20 mètres comptée à partir de l’alignement, la hauteur maximum des\nconstructions est fixée à 21 mètres et R+6.\n10.4.2 - Séquence \"moderne\" (sous-secteur UAa1)\nDans une bande de 20 mètres comptée à partir de l'alignement*, la hauteur maximum des\nconstructions est égale à 27 mètres (R+8) augmentée d'un étage supplémentaire de 4 mètres\nmaximum construit en retrait des façades dans les conditions édictées à l'article UA 10.4.4.\nAu-delà de la bande de 20 mètres comptée à partir de l'alignement, la hauteur maximum d'une\nconstruction est égale à 21 mètres et R+6 (combles* compris). Il pourra être autorisé un\nsupplément de hauteur de 2 mètres à la condition que les hauteurs sous plafond de chaque\nniveau soient supérieures à 2,5 mètres, sans dépasser R+6.\n    30","10.4.3 –Îlots « tête de pont »\nNonobstant les dispositions précitées, la hauteur maximum des constructions est fixée à 42,50\nmètres (R+12) pour l'îlot délimité par : 225 à 229 avenue Charles de Gaulle, 2 à 6 rue du\nGénéral Lanrezac et 1 à 5 Boulevard Koenig ainsi que pour l'îlot délimité par : 190 à 192\nAvenue Charles de Gaulle , 1 à 11 rue Blaise Pascal, 33 à 41 rue Garnier et 2 à 6 rue du\nGénéral Leclerc.\n10.4.4 - La construction des étages en retrait visée aux articles UA 10.4.1 et 10.4.2 doit être\nréalisée avec un retrait de 3 mètres minimum par rapport à l'alignement* sur toute la longueur\nde la façade et de 3 mètres minimum par rapport à la façade arrière.\nToutefois pour les immeubles jouxtant un bâtiment \"référence\" d'une moindre hauteur un\nretrait pourra être imposé le long des limites séparatives* aboutissant aux voies publiques*.\nEn cas de réhabilitation d'un bâtiment existant et pour assurer la continuité du front bâti, les\nétages supplémentaires visés ci-dessus seront implantés en retrait de la façade de la\nconstruction projetée ou remplacés par un traitement architectural des derniers niveaux réalisé\nsur toute la longueur de la façade et habillant l'ensemble des édicules techniques et\nsuperstructures existants eux-mêmes en retrait de 3 mètres.\n10.4.5 - Nonobstant les dispositions édictées dans les articles UA 10.4.1 et 10.4.2 et à\nl'exception des hauteurs des immeubles \"références\" autorisées à l'article UA 10.4.6\nEn cas de construction accolée à un bâtiment référence, il pourra être imposé, par rapport à\nla hauteur plafond, la réduction ou l'augmentation de la hauteur de cette construction, ou partie\nde construction, projetée en bordure de l'avenue Charles de Gaulle et de la Place du Marché,\nafin de ne pas créer de décalage supérieur à la hauteur moyenne d'un étage par rapport au\nbâtiment \"référence\" contigu, pour éviter de créer ou de laisser à découvert des mur-pignons\net dans le respect de la hauteur plafond autorisée dans la séquence moderne, à 27 mètres +\n4 mètres maximum.\n10.4.6 - Bâtiments \"références\"*\nLes immeubles, ou parties de bâtiments \"références\" qui sont conservés doivent être\nmaintenus dans leur hauteur existante.\n10.5 – Constructions sur toiture-terrase\n10.5.1 - Peuvent dépasser la hauteur maximum, les constructions sur toiture-terrasse qui\nremplissent les conditions cumulatives suivantes :\n   -   Disposer d’une hauteur d’au maximum 3 mètres pour les pièces de loisirs*, sorties\n    d’escalier, pergolas et locaux techniques*(à l’exception des machineries d’ascenseurs\n    qui peuvent atteindre 4 mètres), comptés à partir du niveau de la terrasse\n   -   Etre implantées en retrait des façades d’une distance au moins égale à leur hauteur\n   -   Que leurs surfaces cumulées occupent 20% au plus de la superficie totale de la\n    terrasse de l’immeuble\n   -   Chaque pièce de loisirs ne doit pas dépasser 35m² de surface de plancher, doit être\n    reliée directement aux locaux d’habitation situés au dernier étage et respecter l’article\n    UA 11.2.\n    31","10.5.2 - Dans la bande de 20 mètres comptée à partir de l'alignement de l'avenue Charles de\nGaulle et/ou de la Place du Marché, toutes les constructions (y compris les locaux techniques)\net les équipements techniques (appareils de traitement et de conditionnement d'air, …) doivent\nêtre intégrés dans la hauteur maximum de la construction, à l’exception des cheminées et\nantennes de radio-téléphonie.\n10.6 – Dispositions particulières pour les zones de plans-masse\nLes règles de l’article UA 10 s’appliquent aux zones de plan-masse.\nCependant, dans les zones de plan-masse où la hauteur maximum est fixée à R+8, un étage\nsupplémentaire est autorisé à la condition qu’il ne dépasse pas 4 mètres de haut et soit\nimplanté en retrait minimum de 3 mètres de la façade sur rue et d’au moins 3 mètres et H=L\nde la façade arrière et ce, nonobstant l’article UA6.2.1.\n10.7 - Modalités de calcul\nSe reporter à la définition de Hauteur*\nArticle UA.11 – Aspect extérieur des constructions et aménagement de leurs abords\n11.1. – Dispositions générales\n11.1.1 -Tout projet peut être refusé, ou n'être accordé que sous réserve du respect de\nprescriptions spéciales, si la construction par sa situation, son volume, l'aspect, le rythme ou\nla coloration de ses façades, est de nature à porter atteinte au caractère ou à l'intérêt des lieux\navoisinants, aux sites, aux paysages naturels ou urbains ainsi qu'à la conservation des\nperspectives monumentales notamment :\n- aux caractères dominants des séquences urbaines dites \"classiques\", ou \"moderne\",\n- aux caractères architecturaux spécifiques des bâtiments \"références\"* identifiés au plan de\nzonage et dont la liste est donnée en annexe.\nLes façades doivent être revêtues de matériaux qui présentent un aspect de qualité et\nconservent une bonne tenue dans le temps (pierre massive ou pelliculaire, menuiseries en\naluminium laqué ou en bois...), de manière à souligner le caractère de prestige de la zone.\nL'emploi de matériaux dits réfléchissants* est interdit.\nLes installations tels que écrans, grillages, treillis, au-dessus des garde-corps, sont interdits.\nLes matériaux de toitures doivent présenter un aspect de qualité et conserver une bonne tenue\ndans le temps (zinc, ardoise...) de manière à ne pas nuire au caractère du bâtiment ou à\nl'intérêt des lieux avoisinants.\nLe traitement des souches, des systèmes de ventilation, de climatisation et les surélévations\ndes conduits doivent faire l'objet d'un traitement intégré à l'architecture de l'immeuble,\nnotamment les conduits de fumée ou de ventilation devront être encoffrés le long des pignons\nen harmonie avec le pignon.\nL’installation de systèmes de ventilation ou de climatisation est en outre interdite en façade\nsur rue, à l’exception des commerces en rez-de-chaussée.\n11.1.2 – Dispositions applicables aux bâtiments « référence » figurant au plan de\nzonage\nLes bâtiments « référence » sont protégés au titre des dispositions de l’article L.151-19 du\nCode de l’Urbanisme.\nLa conservation des bâtiments \"référence\" peut être imposée en tout ou en partie. Lorsqu'elle\nest exigée, la restauration de ces bâtiments ou partie de bâtiments, doit conserver ou restituer\nles dispositions architecturales spécifiques à leur époque, sans exclure les aménagements\n    32","mineurs concourant à l'amélioration des conditions d'habitabilité et d'hygiène.\nDans le cas de construction sinistrée, il pourra être imposé soit la reconstruction à l’identique\nde tout ou partie des façades de l'édifice endommagé soit la reconstruction dans des matériaux\ncontemporains qui tiennent rigoureusement compte des caractères architecturaux de l’édifice\nsinistré.\n11.1.3 – Ravalements\nLes ravalements doivent être exécutés en respectant les matériaux d'origine des façades (les\nrevêtements en ciment gris ainsi que la peinture de la pierre de taille et des briques sont\ninterdits) et sans atténuer aucun des détails. Ils doivent être exécutés sur toute la façade y\ncompris les délaissés de pignons, de manière à respecter l'homogénéité de la composition de\nla façade.\n11.1.4 – Antennes et paraboles\nLes antennes paraboliques et autres antennes sont interdites en façade. Elles doivent être\ninstallées en toiture et en retrait des façades. Elles ne doivent pas porter atteinte à la qualité\narchitecturale environnante.\n11.1.5 - Les encorbellements* en façade doivent avoir une longueur inférieure ou au plus\négale au tiers de la longueur de la façade intéressée (sauf en UAa : article UA 6.5.2)\n11.1.6 – Les cours anglaises*\nLes cours anglaises sont interdites.\n11.2 – Dispositions applicables aux toitures-terrasses\n11.2.1.- Les toitures-terrasses sont interdites pour les immeubles ayant une façade* sur la\nplace Parmentier et pour ceux situés au 58 bis, 60, 60 bis, 62, 156, 158, 160 et 162 de l'avenue\nCharles de Gaulle.\n11.2.2.- Les toitures-terrasses seront conçues comme une cinquième façade. Une\nvégétalisation des toitures terrasses sera recherchée.\n11.2.3 - En cas de construction d’une pièce de loisirs sur la toiture-terrasse, un habillage\nvégétal en périphérie de la toiture sera imposé.\n11.2.4 - Tout garde-corps devra s’intégrer au style architectural de l’immeuble (aspect\nextérieur, matériau,…) ou devra avoir un impact visuel réduit (transparence,…).\n11.3 – Dispositions applicables au secteur UAa\n11.3.1 - Composition des immeubles\n11.3.1.1- Lignes générales de composition horizontale et verticales\nLa composition des constructions projetées doit :\n- mettre en valeur les grandes lignes de composition du paysage de l'avenue Charles de\nGaulle,\n- comporter un soubassement*, un corps principal et un couronnement*,\n- s'harmoniser au rythme des façades du front bâti de la séquence à laquelle ils appartiennent.\n11.3.1.2 – Soubassements* et couronnements*\nLes compositions du soubassement et du couronnement de la construction doivent faire partie\n    33","de la composition d'ensemble de la façade.\nLa composition du soubassement et du couronnement de la construction doivent l'un et l'autre\nêtre ordonnés sur deux niveaux, modulés pour permettre un raccordement satisfaisant avec\nle soubassement et le couronnement des immeubles contigus*.\nLes couronnements des bâtiments \"référence\" et ceux des immeubles \"classiques\" maintenus,\ndoivent être mis en valeur en sauvegardant ou retrouvant pentes et détails des toitures\nd'origine, notamment lucarnes et corniches, qui les soulignent, notamment balcons moulurés,\nconsoles ou denticules.\n11.3.1.3 – Transitions\nLes compositions des constructions projetées doivent traiter les transitions entre construction\nnouvelle et bâtiments contigus* en particulier avec les bâtiments \"référence\", notamment en\nce qui concerne le nu des façades, la nature des percements et le choix des matériaux.\n11.3.1.4 - Façades de la place du Marché\nLa composition des constructions le long de la place du Marché, doit concourir à créer une\nunité du front bâti de la place (notamment dans les volumétries, la composition des façades,\nles soubassements, le traitement des vis-à-vis et le choix des matériaux et couleurs).\n11.3.2 - Traitement des toitures et modification des toitures existantes\nLes types, les volumes, les matériaux et les couleurs des toitures doivent contribuer à\nl'intégration des constructions dans le paysage bâti des séquences dans lesquelles elles sont\nsituées.\nLes toitures doivent être traitées en harmonie avec le caractère des façades de l'immeuble\nqu'elles couvrent.\n11.3.3 - Traitement des façades et modification des façades existantes\n11.3.3.1 - Dispositions générales\nLes façades doivent être ordonnées pour respecter une cohérence dans le style de la\nconstruction, les hauteurs d'étages, les proportions des ouvertures et une harmonie dans le\nchoix des couleurs et des matériaux.\nNotamment :\n- les modifications effectuées sur une construction existante doivent tenir compte de la\ncomposition d’ensemble de l’édifice.\n- toutes les façades d'une construction, notamment les mur-pignons (mitoyens ou non) doivent\nêtre traitées en harmonie avec la façade dite principale bordant l’espace public. Les façades\ndes locaux accessoires doivent être traitées avec un soin égal à celui apporté aux bâtiments\nprincipaux.\n- les couleurs ne doivent pas créer de ruptures dans la cohérence du front bâti.\n11.3.3.2 – Saillies* et retraits\nLes saillies et les retraits en façade des constructions doivent :\n- être traités comme un des éléments d'une composition d'ensemble du corps principal de la\nfaçade,\n- tenir compte du modelé des façades des immeubles de la séquence architecturale où la\nconstruction projetée est située,\n- conserver, le long des limites latérales de la construction, des travées de façade permettant\nun raccordement satisfaisant de la construction nouvelle avec le bâti environnant.\n    34","11.3.3.3 – Unité foncière à l’angle de deux voies publiques\nLorsqu'une construction est située sur une unité foncière d'angle à l'intersection de deux voies,\ndes saillies*, encorbellements* ou retraits peuvent être autorisés à l'angle de la construction\nau-dessus d'une hauteur de 5,50 mètres.\n11.3.3.4 - Bâtiments \"référence\"*\nLes travaux sur façade doivent mettre en valeur les détails, permettre la suppression des\najouts qui dénaturent le caractère de la façade, la réutilisation de matériaux traditionnels.\nLes modénatures, les éléments sculptés ainsi que les décors doivent être conservés, réparés\nlorsqu’ils sont dégradés et reconstitués lorsqu’ils ont été supprimés.\nLes menuiseries ou les ferronneries qui participent à l'image de l'ensemble d'un édifice doivent\nconserver ou retrouver ce caractère, par la finesse des sections et moulures d'origine, la\nqualité des matériaux et des dessins existants à l’origine.\nNotamment :\n- les persiennes ne doivent pas être ajoutées sur les façades où, non prévues à l’origine, elles\nmasquent les modénatures et les décors. Les persiennes qui participent au décor de la façade\ndoivent être conservées,\n- les garde-corps, grilles, clôtures, doivent conserver les matériaux d'origine tels que fer forgé\nou fonte moulée,\n- les menuiseries ou les ferronneries doivent chacune être d'une seule couleur sur une même\nfaçade, toutefois les portes cochères et devantures peuvent avoir des couleurs différentes plus\nsoutenues,\n11.3.3.5 - Entrées d'immeubles et accès carrossables\nLes entrées d'immeubles devront participer au caractère de prestige de l'avenue Charles de\nGaulle notamment par leurs dimensions, la présence en façade de matériaux de qualité.\nLes accès carrossables à la voie* publique, notamment les portes et rampes de garage,\ndoivent avoir un impact visuel minimum.\nLes transparences des immeubles qui ouvrent des vues sur des jardins aménagés à rez-de-\nchaussée doivent être conservées.\n11.3.3.6 – Devantures\nLes compositions des devantures doivent tenir compte de la composition architecturale de la\nfaçade de l’immeuble.\nLes devantures pourront présenter une saillie* ou un empiètement par rapport au nu de la\nfaçade sous réserve de l’accord de l’autorité gestionnaire de la voie et de l’emprise publique.\nDans les bâtiments \"référence\"*, les baies* d’origine dans lesquelles s'inscrivent les\ndevantures doivent être conservées ou restituées.\n11.3.3.7 - Stores, stores-bannes\n11.3.3.7.1 Commerce\nLes stores et stores-bannes présentant une saillie* ou un empiètement par rapport au nu\nde la façade sont autorisés sous réserve de l’accord de l’autorité gestionnaire de la voie et\nde l’emprise publique.\n11.3.3.7.2 Autres destinations\nLes stores doivent contribuer à l'unité de la composition des façades des immeubles :\n- ils doivent s'inscrire dans les percements en respectant leur géométrie et rester en dessous\ndes linteaux travaillés, sans les altérer;\n- seuls sont autorisés les stores-capotes et les stores sans lambrequin ni joues. Toutefois les\nstores situés à rez-de-chaussée pourront comporter un lambrequin,\n    35","- ils doivent être mobiles, en toile tissée, d'une couleur uniforme sur la totalité des percements\nd'un même immeuble. Cette couleur sera choisie parmi les tons clairs, notamment gris, sable\net blanc cassé.\nLes bannes en saillie sur le domaine public doivent participer à une harmonie d'ensemble du\npaysage.\n11.4 – Clôtures\n11.4.1 – L’édification de clôtures en bordure des voies* publiques et privées, doit se faire à\nl’alignement*. La clôture doit être constituée par un mur bahut de 0,80 mètre de hauteur\nmaximum surmonté d’une grille à claire-voie, la hauteur totale ne pouvant excéder 2,20 mètres.\n11.4.2 - Dans la marge de reculement*, les clôtures doivent être identiques à celles sur\nl’alignement*.\n11.4.3 - Au-delà de la marge de reculement*, les clôtures en limites de propriété ne doivent\npas excéder 3 mètres de haut.\n11.4.4 - Sur toutes les clôtures, sont formellement interdits, les écrans de tôle, treillage,\ncanisses, etc. de quelque nature que ce soit. Cependant, la grille à claire-voie peut être\ndoublée par un écran de verre transparent et, ou, de la végétation.\n11.4.5 - En bordure de la rue d'Orléans, entre l'avenue Charles de Gaulle et la rue Jacques\nDulud, les clôtures des propriétés doivent être constituées par une grille de fer, bronzée de la\nmême teinte, reposant sur un socle bas conformément au modèle adopté pour l'avenue de\nl'Impératrice (aujourd'hui avenue Foch à Paris) par la loi du 22 juin 1854 et par le décret du 13\naoût suivant, modèle adopté pour le chemin de l'Empereur entre Saint Cloud et le bois de\nBoulogne (aujourd'hui Quai du 4 septembre à Boulogne Billancourt).\nLes clôtures séparant les propriétés contiguës ou situées à l’alignement* des voies aboutissant\nau boulevard doivent être identiques au modèle susvisé, dans la marge de reculement*.\n11.4.6. – Clôture: modèle des boulevards des Sablons, Maillot, Maurice Barrès et Général\nKoenig\nLes grilles reposeront sur un socle bas en pierre de taille ; elles seront en fer avec ornement\nen fonte sans aucune pile en pierre ; elles seront bronzées de la même teinte.\nLe muret en pierre de taille devra être inférieur ou égal à 0,3 mètre. La grille et le muret ne\ndevront pas dépasser une hauteur totale de 2,15 mètres.\n11.5 – Éclairage des façades\nLes dispositifs permanents d’éclairage des façades sont interdits, à l’exception des dispositifs\nde détection de mouvements ou d’intrusion et des dispositifs ponctuels mettant en relief des\npoints singuliers de la façade du bâtiment. Cette interdiction ne s’applique pas aux CINASPIC*.\n    36","Article UA.12 – Obligations imposées aux constructeurs en matière de réalisation\nd’aires de stationnement\n12.1 - Dispositions générales\nPour toute opération de construction, soumise ou non à autorisation de construire, ou tout\nchangement de destination, s’accompagnant de la réalisation d’aires de stationnement, ces\ndernières devront être réalisées à l’intérieur des constructions ou en sous-sol*. Leurs\ncaractéristiques et leurs normes sont définies ci-après.\n12.1.1 – Les places doubles sont autorisées dans les bâtiments à destination d’habitation,\navec au minimum une place par logement directement accessible à l’aire de dégagement.\n12.1.2 - Les rampes d'accès doivent avoir la largeur suivante :\n- sens unique : 3,50 mètres.\n- double sens desservant jusqu'à 50 voitures : 3,50 mètres\n• Cette largeur est comprise entre chasse-roues et la rampe doit être munie d'un feu bicolore,\n• Leur rayon de courbure intérieur ne doit pas être inférieur à 5 mètres. Dans le cas où il est\négal à 5 mètres, la largeur de la rampe doit être portée à 4 mètres dans la courbe.\n- double sens desservant plus de 50 voitures : 5 mètres\n- les rampes desservant des stationnements prévus pour les autocars doivent être\ndimensionnées de manière à permettre le passage de ces véhicules.\nCes rampes ne doivent pas entraîner de modification dans le niveau du trottoir.\nLa pente dans les cinq premiers mètres à partir de l'alignement* ne doit pas excéder 5 %.\nCes dispositions, à l’exception de celle relative à l’absence de modification dans le niveau du\ntrottoir, ne s’appliquent pas aux rampes d’accès des bâtiments existants.\n12.1.3 – Normes de stationnement des véhicules motorisés individuels:\n12.1.3.1 - Constructions à destination d'habitation\n- chambres individuelles    1 place / 2 chambres\n- studios et 2 pièces    1 place / logement\n- 3 et 4 pièces    1,5 place / logement\n- 5 pièces et plus    2 places / logement\nPour les logements d'une surface de plancher inférieure à 80 m², il sera exigé une seule place\nde stationnement par logement, nonobstant les règles précédemment définies.\nA moins de 500 mètres d’une gare ou d’une station de transport public guidé ou de transport\ncollectif en site propre et dès lors que la qualité de la desserte le permet : 1 place / logement.\nConstructions existantes :\nL’obligation de réaliser des aires de stationnement n’est pas applicable aux travaux de\ntransformation ou d’amélioration de logements existants, dans le cas où ces travaux ne\ns’accompagnent pas de la création de surface de plancher supplémentaire.\n    37","12.1.3.2 Construction de logements locatifs financés avec un prêt aidé par l’Etat, le nombre\nde places minimal est le suivant :\n- règle générale : 1 place / logement\n- logement d’une surface de plancher inférieure à 60 m² : 0,5 place / logement\n- à moins de 500 mètres d’une gare ou d’une station de transport public guidé ou de transport\ncollectif en site propre et dès lors que la qualité de la desserte le permet : 0,5 place / loge
