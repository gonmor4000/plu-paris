nte oblique.\n    • La hauteur plafond sera de 19,50 mètres\n    46\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n10.1.1.5. Le gabarit enveloppe 5 se compose successivement\n    • D'une verticale de hauteur (H) d’au maximum 12,50 mètres, dressée à l'aplomb de\n    l'alignement (ou de la marge de recul ou de la marge verte).\n    • D'une oblique de pente 2/1 (63° par rapport à l'horizontale) élevée au sommet de\n    la verticale de hauteur H.\n    • La hauteur plafond sera de 16,50 mètres.\n    47\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n10.1.2. Dispositions spécifiques\n10.1.2.1. Gabarit enveloppe en secteur UAa, pour les constructions destinées au\nbureau*\nLe gabarit enveloppe des constructions destinées au bureau (pouvant comporter en sous-\nsol, rez-de-chaussée et/ou 1er étage, une autre destination) se compose d'une verticale de\nhauteur (H) d’au maximum 26 mètres, dressée à l'aplomb de l'alignement, (ou de la marge\nde recul, ou de la marge verte) suivie d’une horizontale limitée également à 26 mètres.\n10.1.2.2. Gabarits enveloppes des constructions implantées en retrait dont les\nunités foncières* ne disposent ni de marge verte ni de marge de recul\nLes gabarits enveloppes des constructions implantées partiellement ou totalement dans un\nretrait de 4 mètres au maximum à compter de l’alignement s’appliquent en pied de façade\net sur tout le linéaire de la construction.\n    48\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n10.1.3. Dépassements des gabarits enveloppes\nUn dépassement de gabarit enveloppe sera autorisé pour les ouvrages de faible emprise\nsitués sur les terrasses ou les toitures (lucarnes, souches de cheminée, éléments\ndécoratifs, les ouvrages techniques de type capteurs d’énergie tels par exemple des\npanneaux solaires...) ainsi que pour les garde-corps, à condition qu'ils n'excèdent pas une\nhauteur de 1,80 mètre mesurée verticalement à partir des plans obliques composant les\ngabarits enveloppes définis au paragraphe 10.1.1. du présent article.\nUn dépassement de gabarit enveloppe sera autorisé pour le prolongement des saillies*\nponctuelles de façade (bow-windows...) ; ou lorsqu’il s’agira de traiter la partie d’un\nbâtiment situé à l’angle de deux voies.\nUn dépassement du gabarit enveloppe, limité à 3 mètres mesurés verticalement à partir\ndes plans obliques composant les gabarits enveloppes définis aux paragraphes 10.1.1. et\n10.1.2. sera autorisé lorsqu’il s’agira de masquer par adossement, totalement ou\npartiellement, un ou des murs pignons existant côté voie ou emprise publique.\nUn dépassement du gabarit enveloppe sera autorisé lorsqu’il s’agira de signaler le\ncaractère emblématique d’un CINASPIC*.\nUn dépassement des gabarits enveloppes définis aux paragraphes 10.1.1. sera autorisé\npour le redressement de la toiture à faible pente d’une construction existante lorsque la\nhauteur verticale de cette construction dépasse la hauteur H de 12,50 mètres, ou de 16\nmètres ou de 18,50 mètres, et sous réserve que :\n    • Ce redressement soit réservé à la destination habitation.\n    • La pente maximum de ce redressement s’inscrive dans une oblique de pente 2/1\n    (63°par rapport à l’horizontale), dans le respect de l'article 10.8.\n    • La hauteur entre le plancher (ou l’entrait) du comble et son faîtage ou acrotère\n    n’excède pas 3,50 mètres et reste comprise dans la hauteur plafond figurant au\n    document graphique n° 5.2, dans le respect de l'article 10.8.\n10.2. Hauteurs plafonds et nombre de niveaux autorisés des\nconstructions\nLes hauteurs plafonds des constructions sont mesurées à partir du terrain naturel* jusqu’à\nl’acrotère* ou au faîtage*. Elles sont applicables sur une épaisseur définie aux paragraphes\n10.3. et 10.4.\nElles sont indiquées au document graphique n° 5.2 « hauteurs et des gabarits ».\n    49\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n10.2.1. Dispositions applicables à l’ensemble de la zone UA\nLe nombre maximum de niveaux inclus dans les hauteurs plafonds autorisées se\ndétermine selon le tableau ci-après :\n    Hauteurs plafonds autorisées    Nombre de niveaux maximum rez-de-chaussée compris\n    5,00 mètres    R*\n    16,50 mètres    5 (R+4)\n    19,50 mètres    6 (R+5)\n    22,50 mètres    7 (R+6)\nToutefois, le nombre de niveaux maximum, indiqué dans le tableau ci-dessus, pourra être\ndépassé :\n • D’un niveau ponctuel correspondant aux dépassements de la hauteur plafond prévus\n   aux articles 10.5.1.6° et 10.5.3.2 ci-après,\n • D’un seul niveau correspondant à la hauteur plafond prévu à l’article 10.5.3.1 ci-après.\nLa hauteur du rez-de-chaussée sur rue des constructions nouvelles (mesurée entre le\ndessus du plancher bas et le dessus du plancher supérieur) ne pourra être inférieure à\n3,50 mètres. Toutefois cette règle ne s’applique pas pour les constructions nouvelles\ncomportant moins de quatre logements.\n10.2.2. Disposition spécifique au secteur UAa\nLes constructions destinées au bureau et repérées au document graphique n° 5.2\n« hauteurs et gabarits » pourront atteindre la hauteur plafond de 26 mètres et 7 niveaux de\nconstructions. Ils pourront comporter en sous-sol, rez-de-chaussée et/ou au 1er étage, une\nautre destination.\n10.3. Hauteurs dégressives pour les unités foncières d'une\nsuperficie inférieure ou égale à 2 000 m²\n10.3.1. Dans la bande de 20 mètres définie au paragraphe 7.1. de\nl'article UA.7\n10.3.1.1. Cas général\nLa hauteur plafond s’applique sur 15 mètres d’épaisseur de construction (balcons exclus).\nAu-delà de l’épaisseur de 15 mètres, les constructions ne doivent pas dépasser une\nhauteur maximum* de :\n    50\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n    • 7,50 mètres (le nombre de niveaux de plancher étant limité à 2, soit R+1).\n    • 10 mètres pour les CINASPIC (constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif).\n10.3.1.2. Dans le secteur UAa\nLa hauteur plafond s’applique sur 18 mètres d’épaisseur de construction (balcons exclus)\ndès lors que la construction est destinée au bureau (elle pourra comporter en sous-sol, rez-\nde-chaussée, et/ou 1er étage, une autre destination)\nAu-delà de l’épaisseur 18 mètres, les constructions à destination de bureau, commerce,\nartisanat et industrie ne doivent pas dépasser une hauteur maximum de 7.50 mètres, le\nnombre de niveaux de plancher restant toutefois limité à deux (R+1).\n10.3.2. Au-delà de la bande de 20 mètres définie au paragraphe 7.1. de\nl'article UA.7\n10.3.2.1. Cas général\nLa hauteur maximum des constructions est limitée à 7,50 mètres (le nombre de niveaux de\nplancher étant limité à 2, soit R+1).\n10.3.2.2. Dispositions particulières\nCette hauteur maximum est portée à 10 mètres pour les CINASPIC, quel que soit le\nnombre de niveaux.\n    51\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n10.4. Hauteurs dégressives pour les unités foncières d'une\nsuperficie supérieure à 2 000 m²\nLes dispositions du présent paragraphe 10.4. ne s’appliquent pas aux CINASPIC\nlesquelles bénéficient de la hauteur plafond sur l’ensemble de l’unité foncière.\n10.4.1. Cas général\n10.4.1.1. Dans une bande de 30 mètres comptée à partir de l'alignement, de la\nmarge de recul ou de la marge verte\nLa hauteur plafond, précisée au document graphique n° 5.2 « hauteurs et gabarits »,\ns’applique, ainsi que le nombre de niveaux correspondant précisé au paragraphe 10.2.1.\n10.4.1.2. Au-delà de la bande de 30 mètres comptée à partir de l'alignement, de la\nmarge de recul ou de la marge verte\nPour les unités foncières comprises dans une zone où la hauteur plafond est de\n22,50 mètres ou de 19,50 mètres, la hauteur maximum des constructions ne devra pas\nexcéder 19,50 mètres (correspondant au plus à 6 niveaux de plancher) entre 30 et\n40 mètres et 13,50 mètres (correspondant au plus à 4 niveaux de plancher) au-delà de\n40 mètres.\n    52\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\nPour les unités foncières comprises dans une zone où la hauteur plafond est de 16,50\nmètres, la hauteur maximum des constructions ne devra pas excéder 16,50 mètres\n(correspondant au plus à 5 niveaux de plancher) entre 30 et 40 mètres et 13,50 mètres\n(correspondant au plus à 4 niveaux de plancher) au-delà de 40 mètres.\nToutefois, le nombre de niveaux maximum, visé dans le présent article, pourra être\ndépassé d’un niveau ponctuel correspondant aux dépassements de la hauteur maximum\nprévus à l’article 10.6.2.1.6°.\n10.4.1.3. En limite de propriété\nAu-delà de la bande de 20 mètres définie au paragraphe 7.1. de l'article UA.7, la hauteur\ndes constructions en limite de propriété est limitée à 7,50 mètres (le nombre de niveaux\nétant limité à 2, soit R+1) et à 10 mètres pour les CINASPIC, quel que soit le nombre de\nniveaux.\n    53\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n10.4.2. Cas particuliers\n10.4.2.1. Constructions destinées au bureau en secteur UAa\nDans une bande de 30 mètres comptée à partir de l'alignement (ou de la marge de recul,\nou de la marge verte), la hauteur plafond de 26 mètres (correspondant au plus à 7 niveaux\nde plancher, soit R+6) s’applique.\nAu-delà de la bande de 30 mètres comptée à partir de l'alignement (ou de la marge de\nrecul, ou de la marge verte), la hauteur maximum des constructions ne devra pas excéder\n19.50 mètres (correspondant au plus à 6 niveaux de plancher, soit R+5) entre 30 et 40\nmètres et 15,50 mètres (correspondant au plus à 4 niveaux de plancher, soit R+3) au-delà\nde 40 mètres.\n    54\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n10.4.2.2. Dans le cas d’unité foncière traversante ou d'îlot bordé de plusieurs\nvoies, les bandes fixées ci-dessus (10.4.1. et 10.4.2.1.) seront comptées à partir\nde chaque alignement, marge de recul ou marge verte mentionnées aux\nparagraphes 6.2.5.2. et 6.2.5.3. de l'article UA-6 (cf. croquis).\n    55\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n10.4.2.3. Dans le cas d’unité foncière traversante d'une profondeur de moins de\n60 mètres entre alignements, marge de recul ou marge verte\n    • Dans une zone où les constructions bénéficient d’une hauteur plafond inférieure\n    ou égale à 22,50 mètres, les constructions ne pourront excéder une hauteur\n    maximum de 19,50 mètres (correspondant au plus à 6 niveaux de plancher) au-\n    delà d'une bande de 20 mètres comptée à partir de chaque alignement, marge de\n    recul ou marge verte mentionnées au paragraphe 6.2.6. de l'article UA6,\n    • Lorsque la hauteur plafond autorisée est inférieure ou égale à 16,50 mètres, les\n    constructions ne pourront excéder une hauteur maximum de 16,50 mètres\n    (correspondant au plus à 5 niveaux de plancher) au-delà d'une bande de 20\n    mètres comptée à partir de chaque alignement, marge de recul ou marge verte\n    mentionnée au paragraphe 6.2.6. de l'article UA6,\n    • En secteur UAa, pour les constructions destinées au bureau (dont les sous-sols,\n    rez-de-chaussée et/ou 1er étage peuvent comporter une autre destination), lorsque\n    la hauteur plafond autorisée est inférieure ou égale à 26 mètres, les constructions\n    ne pourront excéder une hauteur de 19.50 mètres (correspondant au plus à 5\n    niveaux de plancher, soit R+4) au-delà d'une bande de 20 mètres mesurée à partir\n    de chaque alignement, marge de recul ou marge verte mentionnées au\n    paragraphe 6.2.6. de l'article UA6,\n    56\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n    57\nPLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n10.5. Dépassements de la hauteur plafond\n10.5.1. Dépassements généraux\nPeuvent dépasser la hauteur plafond ou la hauteur maximale des secteurs UPM :\n  1° Les garde-corps dans les limites de 1,50 mètre.\n  2° Les ouvrages techniques tels que antennes, gaines de ventilation, souches de\n  cheminées, panneaux solaires thermiques ou photovoltaïques et autres capteurs\n  d’énergie et ouvrages de récupération d’eau… sous réserve d'être situés en retrait de\n  l'acrotère, et de manière à être le moins visible possible depuis le domaine public.\n  3° Les motifs ornementaux tels que frontons, sculptures etc... et les verrières éclairant\n  les surfaces de planchers inférieures, ceci de façon ponctuelle.\n  4° La réalisation d’un ascenseur dans le cadre du réaménagement ou de la\n  réhabilitation d’un bâtiment existant dans la limite de 2.50 mètres.\n  5° Les machineries d'ascenseurs : elles seront obligatoirement situées à l'intérieur des\n  bâtiments, la partie technique située en superstructure devant être limitée à 1,80 mètre\n  de hauteur et être située en retrait de la façade du dernier niveau.\n  6° Les volumes comportant un accès aux toitures-terrasses:\n  a) Dans les immeubles à destination principale d’habitation comportant au minimum 3\n  logements sous les conditions suivantes :\n    - Que l’emprise de ces volumes soit inférieure ou égale à 15% de la surface totale\n    de la toiture-terrasse.\n    - Qu’ils soient adossés, dans la mesure du possible, aux ouvrages techniques ou\n    aux cheminées éventuelles dans une composition d’ensemble.\n    - Que leur hauteur soit limitée (acrotère compris) à 3 mètres à partir de la dalle de\n    la toiture-terrasse.\n    - Qu’ils soient situés à au moins 1,50 mètre de l’ensemble des façades du dernier\n    niveau de l’immeuble sur lequel ils sont édifiés.\n    - Qu’ils respectent, par rapport aux limites séparatives, une distance de 3 mètres\n    minimum sans possibilité d’ouvrir des baies et de 6 mètres minimum en cas\n    d’ouverture de baie. Néanmoins, ils pourront s’implanter sur la limite séparative\n    s’ils s’adossent à un pignon mitoyen d’une hauteur au moins équivalente.\n    - Qu’ils desservent une terrasse accessible paysagée* et végétalisée dans les\n    conditions fixées à l’article UA 11.2.8.2. (toitures-terrasses).\n    - Que les toitures-terrasses de ces volumes soient végétalisées.\n  b) Dans les immeubles à destination principale d’habitation comportant moins de 3\n  logements et les immeubles à destination autre que l’habitation sous les conditions\n  suivantes :\n    - Que l’emprise de ces volumes soit strictement nécessaire à l’accès des toitures-\n    terrasses.\n    - Qu’ils soient adossés, dans la mesure du possible, aux ouvrages techniques ou\n    aux cheminées éventuelles dans une composition d’ensemble.\n    58\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n    -   Que leur hauteur soit limitée (acrotère compris) à 3 mètres à partir de la dalle de\n    la toiture-terrasse.\n    -   Qu’ils soient situés à au moins 1,50 mètre de l’ensemble des façades du dernier\n    niveau de l’immeuble sur lequel ils sont édifiés.\n    -   Qu’ils respectent, par rapport aux limites séparatives, une distance de 3 mètres\n    minimum sans possibilité d’ouvrir des baies et de 6 mètres minimum en cas\n    d’ouverture de baie. Néanmoins, ils pourront s’implanter sur la limite séparative\n    s’ils s’adossent à un pignon mitoyen d’une hauteur au moins équivalente.\n    -   Qu’ils desservent une terrasse accessible paysagée* et végétalisée dans les\n    conditions fixées à l’article UA 11.2.8.2. (toitures-terrasses).\n    -   Que les toitures-terrasses de ces volumes soient végétalisées.\n   7° Les pare-vues dans les limites de 1,90 mètre.\n   8° Les serres, locaux et installations liés à l’agriculture urbaine, dans la limite de 3\n   mètres à partir de la dalle de la toiture terrasse existante.\n10.5.2. Dispositions spécifiques aux immeubles de bureaux dans le\nsecteur UAa\nLe dernier niveau des constructions destinées aux bureaux en application de l’article\nUA10.2.2. devra intégrer tous les éléments techniques nécessaires au fonctionnement\ndesdits bureaux, à l’exception des antennes et des panneaux solaires thermiques ou\nphotovoltaïques et autres capteurs d’énergie et ouvrages de récupération des eaux…\nNéanmoins, de façon ponctuelle et limitée, pourront dépasser de ce dernier niveau ainsi\nque de la hauteur plafond autorisée à l’article 10.2.2. des éléments techniques ne pouvant\npas être intégrés dans le bâtiment (échappement de groupe électrogène, éléments de\ngroupe froid, dispositifs antichute, nacelles…) sous réserve que ces dépassements\nn’excèdent pas 2,50 mètres et soient situés de façon à être le moins visible possible depuis\nl’espace public.\n10.5.3. Dépassements autorisés de la hauteur plafond et du\nnombre de niveaux, réservés aux bâtiments implantés dans la\nbande constructible de 20 mètres visée à l'article UA 7.1.\nLes dépassements sont réservés aux cas suivants :\n10.5.3.1. Pour masquer les murs pignons voisins existants, visibles de\nl'espace public et situés sur la limite séparative aboutissant aux voies\nSous réserve que ce dépassement soit limité à 3 mètres et à un seul niveau habitable, et\nque la hauteur plafond de 22,50 mètres soit respectée, le gabarit enveloppe imposé à\nl’unité foncière en application du plan des hauteurs et gabarits (document graphique N°3.2\n« plan des hauteurs et gabarits ») sera remplacé par le gabarit suivant : une verticale H\ndressée à l’aplomb de l’alignement (de la marge de recul ou de la marge verte) jusqu’au-\n    59\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\ndessus du plancher supérieur de l’avant dernier étage, puis d’une oblique de pente 2/1 (63°\npar rapport à l’horizontale) élevée au sommet de cette verticale et limitée à 3,5 mètres au-\ndessus de ce sommet.\nLe linéaire sur rue du dépassement ne pourra excéder 15 mètres, nonobstant les\ndispositions du paragraphe 7.1. de l'article UA-7. Dans ce cas, tout percement de baie\nprincipale devra se situer à 8 mètres ou plus de la limite séparative aboutissant à la voie.\nLe linéaire de 15 mètres maximum peut être réparti, au choix, suivant qu'il y a un ou deux\npignons mitoyens à masquer.\nPour les unités foncières d’angle le linéaire de 15 mètres est calculé hors pans coupés\nimposés à l’article 6.4.1.\n    60\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n10.5.3.2. Pour un bâtiment situé à l'angle de deux voies\nAfin d'assurer le traitement architectural de cet angle, seront autorisés en dépassement de\n3,50 mètres maximum de la hauteur plafond, les dômes, coupoles, belvédères et petits\nvolumes de couronnement accessibles assurant un rehaussement visuel décoratif et limité\nà cet angle. Pour les constructions destinées au bureau, ce rehaussement ne devra pas\nêtre créateur de surface de plancher (SDP*).\n10.6. Dépassements de la hauteur maximum\n10.6.1. Unités foncières d’une superficie inférieure à 2000 m²\nPeuvent dépasser de la hauteur maximum définie à l’article 10.3.\n • Les garde-corps dans la limite de 1,50 mètre.\n • Les pare-vues dans les limites de 1,90 mètre.\n • Les ouvrages techniques tels que gaines de ventilation, souches de cheminées,\n    panneaux solaires thermiques ou photovoltaïques et autres capteurs d’énergie et\n    ouvrages de récupération d’eau… sous réserve d’être situés en retrait de l’acrotère et\n    de manière à être le moins visible possible.\n • Des motifs ornementaux tels que frontons, sculptures etc… ceci de façon ponctuelle.\n • La réalisation d’un ascenseur dans le cadre du réaménagement ou de la\n    réhabilitation d’un bâtiment existant\n10.6.2. Unités foncières d’une superficie supérieure à 2000 m²\n10.6.2.1. De manière générale, peuvent dépasser de la hauteur maximum définie\nà l’article 10.4\n    61\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n    1° Les garde-corps dans les limites de 1,50 mètre.\n    2° Les ouvrages techniques tels que antennes, gaines de ventilation, souches de\n    cheminée, panneaux solaires thermiques ou photovoltaïques et autres capteurs\n    d’énergie et ouvrages de récupération d’eau… sous réserve d’être situés en retrait de\n    l’acrotère, et de manière à être le moins visible possible.\n    3° Les motifs ornementaux tels que frontons, sculptures etc.…et les verrières\n    éclairant les surfaces de planchers inférieures, ceci de façon ponctuelle.\n    4° La réalisation d’un ascenseur dans le cadre du réaménagement ou de la\n    réhabilitation d’un bâtiment existant dans la limite de 2, 50 mètres.\n    5° Les machineries d’ascenseur : elles seront obligatoirement situées à l’intérieur des\n    bâtiments, la partie technique située en superstructure devant être limitée à 1,80\n    mètre de hauteur et être située en retrait de la façade du dernier niveau.\n    6° Les volumes comportant un accès aux toitures-terrasses dans les conditions\n    définies à l’article UA10.5.1.6°.\n    7° Les pare-vues dans les limites de 1,90 mètres.\n10.6.2.2. Dispositions spécifiques aux immeubles de bureaux dans le secteur\nUAa\nLe dernier niveau des constructions destinées aux bureaux en application des articles\n10.4.2.1. à 10.4.2.3., devra intégrer tous les éléments techniques nécessaires au\nfonctionnement desdits bureaux, à l’exception des antennes et des panneaux solaires\nthermiques ou photovoltaïques et autres capteurs d’énergie et ouvrages de récupération\ndes eaux…\nNéanmoins, de façon ponctuelle et limitée, pourront dépasser de ce dernier niveau ainsi\nque de la hauteur maximum autorisée à l’article 10.4. des éléments techniques ne pouvant\npas être intégrés dans le bâtiment (échappement de groupe électrogène, éléments de\ngroupe froid, dispositifs antichute, nacelles…) sous réserve que ces dépassements\nn’excèdent pas 2,50 mètres et soient situés de façon à être le moins visible possible.\n10.7. Dispositions spécifiques aux constructions existantes\n10.7.1. Pour les constructions existantes à destination d'habitation\nLa fermeture de balcons existants sur des façades dépassant la hauteur plafond ou la\nhauteur maximum autorisée est admise sous réserve des prescriptions de l’article 11.2.1.\nCette fermeture est également admise au-delà de l’épaisseur de 15 mètres visée à l’article\n10.3.1. et des bandes fixées à l’article 10.4.1.\n10.7.2 Travaux et aménagements en faveur de l’isolation des bâtiments\n  Les travaux sur les façades et les toitures d’une construction existante pour la mise en\n  œuvre d'une isolation qui excèdent les gabarits ou la hauteur visés aux paragraphes\n  10.1., 10.2., 10.3. et 10.4. ci-dessus sont autorisés dans la limite de 30 centimètres par\n  rapport au gabarit et à la hauteur de la construction existante. Dans le cas de travaux\n  visant à végétaliser une toiture-terrasse existante, ce dépassement est porté à 1 mètre.\n    62\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n10.8. Dispositions spécifiques aux plafonds des hauteurs\nDans l’objectif d’une meilleure intégration du projet à son environnement, une hauteur\ndifférente de celles prévues par le règlement peut être imposée dans les cas suivants :\n    - lorsqu’une construction ou l'extension d'une construction est inscrite au sein d'une\n    séquence d'un ensemble de constructions ou située entre deux constructions dont\n    les hauteurs sont différentes de celles prévues par le règlement. Dans ce cas et\n    dans l'objectif de garantir un épannelage harmonieux, la hauteur de la construction\n    peut être modulée (réduite ou augmentée sans dépasser la hauteur plafond) au\n    niveau de la hauteur du mur pignon existant voisin situé en limite séparative sur\n    tout ou partie de la construction. L'harmonie de l'épannelage est appréciée sans\n    tenir compte des constructions dont la hauteur est hors d'échelle au regard de celle\n    prévue par la règle.\n   -   pour les constructions identifiées aux plans de zonage comme faisant l’objet de\n    prescriptions relatives à la qualité urbaine et architecturale identifiées comme «\n    bâtiments ou ensembles bâtis à valoriser ».\n    63\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\nArticle UA.11. Aspect extérieur des constructions et\naménagement de leurs abords\n11.1. Dispositions générales\nTout projet peut être refusé ou n'être accordé que sous réserve de l'observation de\nprescriptions spéciales si les constructions par leur architecture, leur situation, leurs\ndimensions ou l'aspect extérieur des bâtiments ou ouvrages à édifier ou à modifier, sont de\nnature à porter atteinte au caractère ou à l'intérêt des lieux avoisinants, aux sites, aux\npaysages naturels ou urbains, ainsi qu'à la conservation des perspectives monumentales,\nnotamment pour les plus remarquables (cf. pièce graphique n° 5.1 « zonage et\nservitude »).\n11.2. Dispositions particulières\n11.2.1. Composition générale des façades\nUn traitement particulier de la façade pourra être imposé lorsque le projet concernera un\nlinéaire de façade sur rue important (subdivision par la modénature, par un jeu d'avancées\nou de reculs grâce à des balcons, des oriels, des loggias,...).\nAfin de préserver la perception du front bâti et le modelé des façades voisines, il pourra\nêtre exigé que les balcons, loggias ou terrasses des façades à l’alignement des voies et\nemprises publiques comportent des garde-corps fins et ajourés ; une attention particulière\ndevra être portée au traitement de leur sous face.\nLes surélévations et redressements de toitures des bâtiments existants devront être traités\nen harmonie avec l'architecture originelle et les matériaux du bâtiment concerné.\nLe caractère d'origine des façades des bâtiments existants devra être préservé, notamment\nlorsqu'elles sont composées de pierre de taille ou de briques soigneusement mises en\nœuvre. Les ravalements devront être exécutés en respectant les matériaux d'origine de la\nfaçade ainsi que les composants de sa modénature. Les revêtements en ciment gris ainsi\nque la peinture de la pierre de taille sont interdits.\nLes éléments d'ornementation existants (moulures, corniches, volets, persiennes, garde-\ncorps, ferronneries, céramiques,...) devront être sauf impossibilité technique avérée,\nconservés et restaurés. Leur reconstitution pourra être exigée.\nLa fermeture isolée des balcons visibles depuis l’espace public est interdite.\nEn dehors de l’interdiction visée à l’article 11.7., la fermeture des balcons sera néanmoins\nautorisée dans le cadre d’une recomposition architecturale globale de la façade concernée\nenglobant des fermetures simultanées, et notamment si elle permet d’améliorer les\nperformances énergétiques de la construction.\nEn outre, la possibilité de fermeture peut être limitée par les règles relatives aux volumes\nhabitables en encorbellement édictées à l’article 6.5.1.2.\n    64\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\nLa fermeture isolée des balcons non visibles de l’espace public sera autorisée sous\nréserve de s’effectuer en harmonie avec l’architecture et les matériaux de la façade\nconcernée.\n11.2.2. Matériaux, couleurs des façades, dispositifs liés au\ndéveloppement durable\nL’emploi à nu, en parement extérieur, de matériaux destinés à être recouverts est interdit.\nLe pavé de verre est interdit en rez-de-chaussée des façades sur rue.\nL’installation de dispositifs favorisant la retenue des eaux pluviales ou la production\nd’énergie renouvelable correspondant aux besoins de la consommation domestique des\noccupants de l’immeuble ou de la partie d’immeuble concerné est autorisée sous réserve\nde s’inscrire qualitativement dans la composition du bâtiment et de s’intégrer dans le\npaysage urbain.\n11.2.3. Pignons, locaux annexes\nLes murs pignons, mitoyens ou non, devront être traités en harmonie avec les façades\nprincipales*. Les locaux annexes doivent être traités avec un soin égal à celui apporté aux\nbâtiments principaux.\n11.2.4. Façades commerciales, enseignes\nOn entend par façade commerciale toute devanture établie dans un but commercial, et\nentraînant la modification ou le recouvrement du gros œuvre.\nEn cas de création ou de modification de façades commerciales les prescriptions suivantes\ndevront être observées :\n    • Les percements destinés à recevoir des vitrines devront s'adapter à l'architecture\n    de l'immeuble concerné.\n    • Lorsqu'un même commerce sera établi sur plusieurs immeubles contigus, les\n    percements de vitrines devront respecter le rythme de leurs façades respectives.\n    • Les vitrines pourront présenter une saillie* ou un empiètement par rapport au nu\n    de la façade, correspondant aux dispositions du paragraphe 6.5. de l'article UA-6,\n    sous réserve de l’accord de l’autorité compétente gestionnaire de la voie ou de\n    l’emprise publique*.\nLe rez-de-chaussée des constructions destiné à du commerce ou de l’artisanat* devra\ncomporter l'emplacement d'un bandeau destiné à recevoir leur enseigne. Celui-ci devra\nêtre séparé de façon visible des étages supérieurs, en s'inspirant des systèmes\ntraditionnels (corniches, retraits,...).\nLa hauteur du bandeau ou sa proportion devra respecter le règlement local de publicité\nintercommunal Paris Ouest La Défense\nA l'occasion de travaux concernant des devantures implantées sur des bâtiments existants,\nil pourra être imposé de dégager, de restaurer ou de restituer les bandeaux ou corniches\nexistants ou ayant existé.\n    65\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n11.2.5. Façade de bureaux*\nPour les constructions destinées exclusivement au bureau, le rez-de-chaussée et le 1er\nétage devront bénéficier d’un traitement spécifique avec notamment la réalisation d’une\nentrée de grande dimension sur double niveaux avec un effort particulier en matière de\nmatériaux et de conception architecturale de la façade et en privilégiant les effets de\ntransparence.\n11.2.6. Façade de rez-de-chaussée\nEn cas de transformation du rez-de-chaussée d’une façade en faveur de l’habitat, les\nouvertures devront respecter le rythme général de la façade.\n11.2.7. Clôtures\n11.2.7.1. Les clôtures existantes qui présentent une unité d’aspect avec la construction\nprincipale ne seront pas dénaturées.\n11.2.7.2. Les clôtures en bordure de voies ou entre propriétés dans le cas de retrait de la\nconstruction, devront être constituées par un mur bahut d'une hauteur maximum de 0,60\nmètre, surmonté d'une grille à claire voie. La hauteur totale de l'ensemble ne pourra\nexcéder 2 mètres. Toutefois, la hauteur du portail de l’accès à l’unité foncière n’est pas\nrèglementée.\n11.2.7.3. Sur toutes les clôtures l'ajout d'écrans opaques est interdit ; seul le doublage par\ndes écrans ajourés est autorisé, ainsi qu’un doublage par des haies végétales ou des\nplantes grimpantes.\n11.2.7.4. Les dispositions des paragraphes 11.2.7.2. et 11.2.7.3. ne s’appliquent pas aux\nCINASPIC*.\n11.2.8. Toitures\n11.2.8.1. Toitures en pente\nLes matériaux des toitures en pente devront présenter une bonne tenue dans le temps.\nL'éclairement des combles existants sera assuré, soit par des lucarnes, soit par des\nverrières ou châssis de toit. Les lucarnes seront soit à deux ou trois versants, soit\nrentrantes, et suivront, dans la mesure du possible, l'axe des percements des étages\ninférieurs. Il leur est interdit de dépasser en largeur hors tout, la dimension horizontale de\nla fenêtre située à l'étage inférieur. Il est interdit de relier entre elles des lucarnes. Les\nchiens assis (lucarnes rampantes) sont proscrits.\n11.2.8.2. Toitures-terrasses\n    66\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n11.2.8.2.1. Principes généraux\nLes toitures-terrasses de tout type devront être traitées avec autant de soin que les\nfaçades. Les étanchéités auto protégées des toitures-terrasses ne pourront être laissées\napparentes. Les protections par gravillons lavés leurs sont interdites.\nLa partie minérale sera traitée avec soin et constituée d'un revêtement soigné.\n11.2.8.2.2. Toitures-terrasses inaccessibles\nLes toitures-terrasses inaccessibles seront végétalisées à l’exception des parties occupées\npar les ouvrages techniques, verrières, capteurs d’énergie (panneaux solaires…)… Cette\nvégétalisation sera assurée par une solution technique de type traditionnel (végétalisation\nintensive* ou semi-intensive* avec apport de terre végétale), ou par toute autre solution\nnon traditionnelle (végétalisation extensive comportant une couche végétale sur substrat\npar exemple). Lorsqu’il y a utilisation de substrats, ceux-ci devront comporter une\népaisseur minimum de 15 centimètres.\nCette végétalisation devra également être réalisée en cas de réhabilitation lourde ou de la\nréfection de la toiture d’un bâtiment existant qui n’en n’aurait pas bénéficié lors de sa\nconstruction. Dans ce cas l’épaisseur de substrat imposée ci-dessus pourra être ajustée\naux contraintes techniques de l’existant.\nCette végétalisation devra être maintenue lors d’une réfection de la toiture.\n11.2.8.2.3. Toitures terrasses accessibles\nEn dehors des parties occupées par les ouvrages techniques visés à l’article UA10.5 ou\npar les circulations nécessaires aux usagers et espaces voués aux loisirs, les terrasses\naccessibles devront être paysagées* et recevoir une végétalisation intensive, semi-\nintensive ou extensive*.\nEn cas de transformation de la toiture d'un immeuble existant comportant brisis et\nterrasson pour créer une toiture-terrasse accessible, le terrasson existant situé en limite\navec le brisis du toit devra être conservé sur une largeur d'au minimum 1,50 mètre et\nformer ainsi partiellement ou totalement le garde-corps.\n11.3. Prescriptions diverses relatives à l'aspect extérieur des\nbâtiments\nLes cours anglaises sur la rue sont interdites.\nLes ouvrages tels que les groupes électrogènes, les ouvrages de climatisation des\nconstructions nouvelles, etc., seront situés à l'intérieur des bâtiments sauf impossibilité\ntechnique.\nLes édicules affectés aux machineries d'ascenseurs et aux sorties d'escaliers, lorsqu'ils ne\nseront pas intégrés dans le volume du dernier étage, seront traités avec le même matériau\nque les façades et intégrés à l'aménagement d'ensemble de la toiture terrasse.\nLes réseaux techniques en toiture ou en terrasse, tels que la ventilation mécanique\ncontrôlée, les ventilations diverses, seront sauf impossibilité technique avérée, camouflés\npar un revêtement identique à la façade ou s'harmonisant avec elle. Les ouvrages ou\n    67\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\nédicules techniques extérieurs au bâtiment et situés en rez-de-chaussée, ainsi que les\nventilations de sous-sols non situées en toiture devront être traités avec soin et\ns'harmoniser avec les façades tant en ce qui concerne les matériaux que la couleur.\nLes surélévations des conduits de fumée feront l'objet d'un traitement architectural\ns’intégrant à la construction.\nLes évacuations d'eaux pluviales correspondant aux loggias et aux balcons pleins devront\nêtre intégrées à l'intérieur des bâtiments, être situées en fond de loggia, être encastrées\ndans la façade ou être placées en limite séparatives* d'immeubles.\nLes antennes d'émission ou de réception de signaux radioélectriques (antennes,\nparaboles...) devront être installées sur les toitures de la façon la moins visible possible\ndepuis l'espace public. Sur les toitures terrasses, elles seront implantées de manière\nprivilégiée en zone centrale.\nLes coffrets, compteurs et boites aux lettres des immeubles collectifs seront situées à\nl'intérieur des bâtiments.\nLes branchements (câbles électriques, télécom…) seront obligatoirement réalisés en\nsouterrain, ou bien intégrés au volume des bâtiments.\nL’ajout d’escaliers sur les constructions existantes devra s’harmoniser avec la composition\nde la façade.\nLa pose de coffre de volets roulants sur des constructions existantes ne pourra excéder\nl'épaisseur du tableau de la fenêtre. Pour les façades donnant sur voie ou emprise\npublique, ce coffre devra être habillé d'un lambrequin en harmonie avec l'architecture de\nl'immeuble.\n11.4. Bâtiments faisant l'objet d'une protection grâce aux\ndispositions prévues par le Code de l’urbanisme permettant à\nun PLU d’identifier et de localiser les éléments de paysage, à\nmettre en valeur ou à requalifier pour des motifs d'ordre\nculturel, historique ou écologique\n11.4.1. Cas général\nTous les travaux exécutés sur un bâtiment faisant l'objet d'une protection (figurant au\ndocument graphique n° 5.1 « zonage et servitudes » et dans le document n° 4.2.3 « cahier\nde protection du patrimoine architectural ») doivent être conçus en évitant toute\ndénaturation des caractéristiques constituant son intérêt esthétique.\nLes projets situés à proximité immédiate des bâtiments ainsi protégés doivent être conçus\ndans la perspective d'une mise en valeur de ce patrimoine.\nLes fiches du « cahier de protection du patrimoine architectural », annexé au présent\nrèglement, présentent les caractéristiques principales du bâtiment, son historique et des\néléments spécifiques d’intérêt.\n    68\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\nLe cas échéant des mesures de vigilance ou des orientations spécifiques au bâtiment\nconcerné sont édictées (« mesures spécifiques de protection »). Elles doivent absolument\nêtre prises en compte dans le cadre des interventions sur les bâtiments, en sus de celles\nvisées aux paragraphes suivants.\n11.4.2. Bâtiments remarquables à préserver\nLes interventions sur les bâtiments répertoriés en annexe au présent règlement en tant que\n« bâtiments remarquables à préserver » devront être réalisées dans le respect strict des\ncaractéristiques originelles des édifices (volumétrie, composition et traitement des façades,\nornementation et modénatures, nombre, proportions et traitement des ouvertures, mise en\nœuvre des matériaux, typologie de la toiture…) et contribuer à leur restauration et à leur\nmise en valeur. La volumétrie existante du bâtiment devra être conservée dans ses\ncaractéristiques générales.\n11.4.3. Bâtiments ou ensembles bâtis à valoriser\nLes interventions, surélévations ou extension horizontale des bâtiments répertoriés en\nannexe au présent règlement en tant que « bâtiments ou ensembles bâtis à valoriser »\npourront être autorisées à condition de respecter l’esprit du bâtiment d’origine. Une\nattention particulière sera portée :\n    • Au respect du nombre et des proportions des ouvertures par niveaux existants et\n    pour tout nouveau niveau de construction.\n    • A la composition et au traitement général des façades.\n    • A la proportion des niveaux de construction et à leur réinterprétation en cas de\n    surélévation.\n    • Aux détails d’ornementation qui pourront être restaurés ou remis à jour à\n    l’occasion de travaux.\n11.5. Espaces publics faisant l’objet d’une protection grâce aux\ndispositions prévues par le Code de l’urbanisme permettant à\nun PLU d’identifier et de localiser les éléments de paysage, à\nmettre en valeur ou à requalifier pour des motifs d'ordre\nculturel, historique ou écologique\nLes espaces publics à mettre en valeur, figurant au document graphique n° 5.1 « zonage et\nservitudes » participent de façon intéressante à la qualité du paysage urbain grâce à leur\nqualité intrinsèque et de l’association qu’ils forment avec les bâtiments qui les bordent. En\nconséquence, une vigilance particulière sera portée aux travaux et ravalement des\nbâtiments concernés, au respect de la composition urbaine d’ensemble (axes, symétries,\nportiques…), au maintien des éléments végétaux, à la qualité des traitements de sols, des\nclôtures, enseignes et éléments de mobilier urbain.\n    69\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n11.6. « Ensembles urbains et paysagers à préserver et mettre\nen valeur » faisant l’objet d’une protection grâce aux\ndispositions prévues par le code de l’urbanisme permettant à\nun PLU d’identifier et de localiser les éléments de paysage, à\nmettre en valeur ou à requalifier pour des motifs d'ordre\nculturel, historique ou écologique\nLes bâtiments situés à l’intérieur de ce périmètre et aux abords des espaces publics à\nmettre en valeur ont été identifiés en tant « qu’ensembles urbains bâtis et paysagers à\npréserver et à mettre en valeur» figurant au document graphique n° 5.1 « zonage et\nservitudes » et sur la liste annexée au document n° 4.2.2 du présent règlement.\nDe façon générale, le style, les éléments de construction spécifiques et les éléments\ndécoratifs des bâtiments présents dans ces ensembles devront être préservés ou\nréinterprétés, afin de conserver la cohérence historique, urbaine et paysagère des lieux.\nPlus particulièrement dans ces ensembles viennent s’ajouter localement des prescriptions\nparticulières relatives :\n    • Aux bâtiments remarquables à valoriser, précisées à l’article UA 11.4.\n    • Aux végétaux, précisées à l’article UA 13.3.4.2.\n    • Aux espaces publics, précisées à l’article UA 11.5.\n11.7. Mesure spécifique pour les façades des constructions\nouvrant sur les parcs et jardins identifiés au document\ngraphique n° 5.1 « zonage et servitudes »\nLa fermeture de leurs balcons et terrasses est interdite.\n    70\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\nArticle UA.12. Obligations imposées aux constructeurs\nen matière de réalisation d’aires de stationnement\n12.1. Stationnement des véhicules motorisés\n12.1.1. Dispositions Générales\nLe stationnement de véhicules motorisés correspondant aux besoins des constructions et\ninstallations nouvelles ou aux travaux sur constructions existantes doit être assuré en\ndehors de la voie publique, sur l’unité foncière* propre à l’opération ou dans son\nenvironnement immédiat.\nS’il est admis qu’une impossibilité technique ou des motifs d’architecture ou d’urbanisme\ninterdisent de réaliser les places de stationnement résultant de l’application des\nparagraphes 12.1.2 à 12.1.5, le pétitionnaire peut être autorisé à les reporter à proximité,\nen apportant la preuve qu’il les obtient par concession dans un parc public ou par\nconcession ou acquisition dans un parc privé existant ou en cours de réalisation.\nLorsqu'une aire de stationnement a été prise en compte dans le cadre d'une concession à\nlong terme ou d'un parc privé de stationnement, au titre des obligations prévues aux\npremier et deuxième alinéas ci-dessus, elle ne peut plus être prise en compte, en tout ou\nen partie, à l'occasion d'une nouvelle autorisation.\n12.1.2. Accès\nLes rampes d’accès au sous-sol ne doivent pas entraîner de modification dans le niveau du\ntrottoir, et leur pente, dans les cinq premiers mètres à partir de l’alignement*, ne doit pas\nexcéder 5%, sauf en cas d’impossibilité technique.\nLes rampes d’accès doivent avoir la largeur minimum suivante :\n    • Sens unique ou double sens desservant jusqu’à 50 places de stationnement pour\n    voitures : 3,50 mètres.\n    • Double sens desservant plus de 50 places de stationnement pour voitures : 6\n    mètres.\nLes rampes d’accès au sous-sol doivent présenter un rayon intérieur de courbure supérieur\nou égal à 5 mètres. Leur rayon extérieur de courbure doit être d’au minimum 9 mètres.\nToutefois, les dimensions des rampes d’accès et/ou des rayons de courbure pourront être\nmodulées pour tenir compte des nécessités résultant de contraintes techniques motivées,\nnotamment par l’exiguïté de certaines unités foncières.\n    71\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n12.1.3. Dimensions des emplacements\nDans une aire collective de stationnement, chaque emplacement, doit présenter des\ndimensions au moins égale à :\n    • longueur : 5 mètres\n    • largeur : 2,30 mètres\n    • dégagement :\n    • 6 mètres entre poteaux ou portes de boxes\n    • 5 mètres entre places non cloisonnées\n    72\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n12.1.4. Dispositions spécifiques\nLes aires de stationnement devront être réalisées en sous-sol.\nLes normes s’appliquent aux constructions ou installations nouvelles ainsi qu’aux\nconstructions existantes, dès lors qu’il n’est pas expressément prévu d’exception.\nLorsqu’une construction comprend des parties à destinations différenciées, le nombre total\ndes places à réaliser résulte du cumul des places exigibles pour chaque destination de\nconstructions.\nLe nombre de places requises sera arrondi au chiffre inférieur lorsque le calcul du nombre\nde places de stationnement a une décimale inférieure ou égale à 0,5, et arrondi au chiffre\nsupérieur lorsque la décimale est supérieure ou égale à 0,6.\n12.1.5. Normes de stationnement\n12.1.5.1. Constructions à destination d’habitation*\n12.1.5.1.1. Dispositions générales\nIl est exigé une place de stationnement automobile par tranche de 85 m² de surface de\nplancher (SDP*), avec un minimum d’une place par logement.\nPour les résidences ou foyers pour étudiants ou pour personnes âgées il ne sera exigé\nqu’une place pour 150 m² de S.D.P.\nPour la construction de logements locatifs financés avec un prêt aidé par l’Etat, il ne sera\nexigé que 0,50 place de stationnement automobile par logement.\nLes places doubles sont autorisées à condition que le nombre des places directement\naccessibles soit au moins égal au nombre de logements.\nPar ailleurs, il est exigé la réalisation d’aires de stationnement pour les deux roues\nmotorisées, représentant 1 % de la SDP, avec un minimum de 10 m².\nPour les résidences pour personnes âgées, il n’est exigé que la réalisation d’une aire de 10\nm² minimum réservée aux deux roues motorisées.\nCes dispositions ne s’appliquent qu’aux bâtiments comprenant un parc de stationnement.\n12.1.5.1.2. Dispositions particulières et dispenses\nLorsqu’il n’est pas possible d’inscrire, dans le terrain, assiette de l’opération, un rectangle\nde 17 mètres x 15 mètres, ou lorsqu’il s’agit d’une parcelle d’angle dans laquelle il n’est pas\npossible d’inscrire un carré de 17 mètres de côté, il ne sera pas fait référence à la SDP\npour le calcul de places à réaliser, mais au nombre de logement créés, la norme étant\nd’une place par logement créé.\nPar ailleurs, il ne sera exigé aucune place de stationnement:\n  • pour la construction de logements locatifs financés avec un prêt aidé par l’Etat\n    lorsqu’il n’est pas possible d’inscrire, dans le terrain, assiette de l’opération, un\n    73\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n    rectangle de 17 mètres x 15 mètres, ou lorsqu’il s’agit d’une parcelle d’angle dans\n    laquelle il n’est pas possible d’inscrire un carré de 17 mètres de côté.\n  •    Lorsque le terrain, assiette de l’opération, présente un unique linéaire sur rue\n    inférieur ou égal à 10 mètres et une superficie inférieure à 250 m².\n  •    pour les programmes de construction de moins de trois logements.\n12.1.5.1.3. Extensions, travaux sur constructions existantes et changements de destination\nIl n’est pas exigé la réalisation de place de stationnement automobile lors de travaux avec\nextension et/ou de changement de destination d’une construction vers l’habitation, sous\nréserve que :\n    • La SDP créée par extension ou changement de destination soit inférieure ou égale\n    à 150 m² et ne crée pas plus de deux nouveaux logements.\n    •    Les travaux ne suppriment pas de places existantes en sous-sol qui permettent de\n    répondre aux nombres exigibles.\nL’obligation de réaliser des aires de stationnement n’est pas applicable :\n    • Aux travaux de transformation ou d’amélioration de bâtiments affectés à des\n    logements locatifs financés avec un prêt locatif aidé de l’Etat\n    • Aux changements de destination d’une construction en vue de l’affecter à des\n    logements locatifs financés avec un prêt aidé par l’Etat,\nY compris dans le cas où ces travaux et changements de destination s’accompagnent de la\ncréation de SDP, dans la limite de 50% de la SDP existante avant le commencement des\ntravaux.\nCependant lesdits travaux ne doivent pas supprimer de places existantes en sous-sol qui\npermettent de répondre au nombre exigible.\n12.1.5.2. Constructions à destination de bureaux*\nIl sera créé une place de stationnement automobile par tranche de 120 m² de SDP créée.\nDans un rayon de 300 mètres autour des accès des stations de métro « Anatole France »,\n« Louise Michel », « Pont de Levallois » et de la gare SNCF, la norme est d’une place par\ntranche de 150 m² de SDP créée.\nLes places doubles sont autorisées sous réserve de ne pas représenter plus de 10 % des\nplaces exigibles.\nPour les programmes dont la SDP est supérieure à 10 000 m², il est exigé la réalisation\nd’aires de chargement, déchargement, et de manutention nécessaires au fonctionnement\nde l’établissement. Nonobstant la disposition imposant aux aires de stationnement d’être\nobligatoirement réalisées en sous-sol, ces aires de chargement, de déchargement et de\nmanutention pourront être réalisées en rez-de-chaussée, sous réserve d’être intégrées au\nbâtiment.\nPar ailleurs, il est exigé la réalisation d’aires de stationnement pour les deux roues\nmotorisées, représentant 0,30% de la SDP, avec un minimum de 10 m².\nEn l’absence d’un parc de stationnement dans un immeuble à destination principale\nd’habitation, les dispositions imposant des places ou aires de stationnement ne\ns’appliquent pas.\n    74\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n12.1.5.3. Constructions à destination de commerces\nIl n’est pas exigé la réalisation de places de stationnement automobile pour les commerces\ndont la SDP est inférieure ou égale à 300 m² ou qui sont situés dans un rayon de    150\nmètres autour de l’accès véhicule d’un parking public existant ou projeté.\nIl est exigé 1 place de stationnement automobile par tranche de :\n    • 150 m² de SDP pour les commerces dont la SDP est comprise entre 300 m² et\n    1 000 m².\n    • 60 m² de SDP pour les commerces dont la SDP est supérieure à 1 000 m² et\n    inférieure ou égale à 2 000 m² ;\n    • 45 m² pour les commerces dont la SDP est supérieure à 2 000 m².\nPar ailleurs, pour les commerces dont la SDP est supérieure à 2 000 m², il est exigé la\nréalisation d’aires de chargement, déchargement, et de manutention nécessaires au\nfonctionnement de l’établissement. Nonobstant la disposition imposant aux aires de\nstationnement d’être obligatoirement réalisées en sous-sol, ces aires de chargement,\ndéchargement et de manutention pourront être réalisées en rez-de-chaussée sous réserve\nd’être intégrées au bâtiment.\nEn l’absence d’un parc de stationnement dans un immeuble à destination principale\nd’habitation, les dispositions imposant des places ou aires de stationnement ne\ns’appliquent pas.\n12.1.5.4. Artisanat*, industrie*\nIl n’est pas exigé la réalisation de places de stationnement automobile pour les locaux à\ndestination d’artisanat et d’industrie, dont la SDP est inférieure ou égale à 300 m².\nIl est exigé une place de stationnement automobile par tranche de 300 m² de SDP créée.\nEn plus des aires de stationnement pour véhicules particuliers, il sera imposé pour les\nlocaux dont la SDP est supérieure à 1 000 m², la création d’aires de livraison adaptées aux\nopérations de chargement, déchargement et manutention inhérentes à l’établissement.\nEn l’absence d’un parc de stationnement dans un immeuble à destination principale\nd’habitation, les dispositions imposant des places ou aires de stationnement ne\ns’appliquent pas.\n12.1.5.5. Hébergement hôtelier*\n12.1.5.5.1. Véhicules particuliers\nIl sera réalisé au minimum une place de stationnement par tranche de cinq chambres.\n12.1.5.5.2. Autocars\nToutes dispositions devront être prises pour que la desserte des hôtels de tourisme par\nautocars et taxis ne génère aucune gêne pour la circulation publique.\nAu-delà de 150 chambres, il sera exigé une place de stationnement d'autocar par tranche\nde 150 chambres, calculée par excès. Dans ce cas, l'obligation de créer les places de\nstationnement en sous-sol ne sera pas imposée.\n    75\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n12.1.5.6. Constructions et Installations Nécessaires aux Services Publics ou\nd’Intérêt Collectif (CINASPIC)*\nLe nombre de places à réaliser devra correspondre aux besoins de l’immeuble à\nconstruire, appréciés en fonction de la nature de l’établissement, de son fonctionnement et\nde sa situation géographique (notamment par rapport aux parkings publics et aux\ntransports en commun).\nPar ailleurs, les aires de chargement, déchargement et de manutention nécessaires au\nfonctionnement de l’établissement pourront être imposées sur le terrain.\n12.1.5.7. Immeubles protégés au titre des monuments historiques ou de l’article\nL. 151-19 du Code de l’urbanisme\nIl n’est pas exigé la réalisation de place de stationnement en cas de travaux de\nrestauration, de changement de destination ou de reconstruction à l’identique des\nimmeubles protégés.\nCette dispense n’autorise pas la suppression des places existantes avant travaux.\n12.1.5.8. Cas de la parcelle concernée par le retrait végétalisé imposé\nEn cas de réalisation d’un retrait végétalisé imposé ou de la sauvegarde d’un arbre\nintéressant*, le constructeur pourra dans les cas prévus aux paragraphes 13.2.3. et 13.3.1.\nde l’article UA.13, être dispensé de la réalisation de 2 places de stationnement.\n12.2. Stationnement des vélos et poussettes\n12.2.1 Stationnement des vélos\nDans les immeubles d’habitation ou de bureau, le stationnement des vélos devra respecter\nles dispositions et les normes du Code de la Construction et de l’Habitation et être situé au\nrez-de-chaussée ou au premier sous-sol réservé au stationnement automobile, dans des\nlocaux clos et facilement accessibles.\nPour les CINASPIC, les résidences pour personnes âgées, les foyers d’accueil pour\npersonnes handicapées : la superficie à réserver éventuellement au stationnement des\nvélos doit tenir compte de la nature et du fonctionnement des établissements, de leur\nsituation géographique et de leurs utilisateurs.\n12.2.2. Dispositions particulières pour le stationnement des vélos\nEn l’absence de réalisation de parc de stationnement, il devra néanmoins être réalisé, dans\nles immeubles principalement d’habitation ou de bureau, un ou plusieurs locaux en rez-de-\nchaussée, clos et couverts, pour le stationnement des vélos, dont la surface totale devra\ncorrespondre aux besoins de l’immeuble.\n    76\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\nCes locaux pourront être communs avec ceux réservés aux poussettes et situés en rez-de-\nchaussée des constructions.\n12.2.3. Stationnement des poussettes\nPour les constructions à destination d’habitation créant plus de 10 logements, il devra être\nréalisé un ou plusieurs locaux en rez-de-chaussée, clos et couverts, pour le stationnement\ndes poussettes.\nLa surface réservée au stationnement des poussettes doit représenter au minimum 4 m²\npar tranche complète de 10 logements.\nCes locaux pourront être communs avec ceux réservés aux vélos, dès lors que ces\nderniers sont situés au rez-de-chaussée des constructions.\nCes dispositions ne s’appliquent pas aux résidences ou foyers pour étudiants, pour\npersonnes âgées, aux logements-foyers, et aux foyers d’accueil pour personnes\nhandicapées.\n12.3. Suppression des places de stationnement des véhicules\nmotorisés ou aires de stationnement de véhicules non\nmotorisés\nAucune surface ou place de stationnement existante ne peut être supprimée, dès lors\nqu’elle n’est pas excédentaire au regard des normes du P.L.U.\nCette disposition ne s'applique pas aux places de stationnement des véhicules motorisés\nsituées en front de rue à rez-de-chaussée des immeubles collectifs d'habitation.\n    77\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\nArticle UA.13 Obligations en matière de réalisation\nd'espaces libres*, d'aires de jeux et de loisirs, et de\nplantations\nNota :\nDans les secteurs de plan de masse UPM1, UPM2 et UPM3, les prescriptions de l’article\nUA13 sont remplacées par celles du document graphique relatif aux secteurs tels que\njoints au présent règlement, à l’exception de certains articles indiqués sur les plans masse,\nqui continuent à s’appliquer.\n13.1. Espaces boisés classés*\nLes espaces boisés classés à conserver, à protéger ou à créer figurant au document\ngraphique n° 5.1 « zonage et servitudes » sont soumis aux dispositions spécifiques\nprévues par le code de l'urbanisme.\n13.2. Espaces libres*\n13.2.1. Surface imposée d’espace libre\n13.2.1.1. Unité foncière* d'une superficie supérieure à 2 000 m²\n13.2.1.1.1. Superficie minimale\nLa superficie minimale des espaces libres est fixée à 40 % de la superficie de l'unité\nfoncière. Cette disposition ne s’applique pas le long des linéaires commerciaux figurant sur\nle document graphique n° 5.1 « zonage et servitudes ».\n13.2.1.1.2. Continuité\nLes espaces libres intérieurs (situés à l'arrière des bâtiments en front de rue) devront\nobligatoirement présenter une continuité de cheminement. Lorsque ce passage se situe\nentre une construction et une limite séparative de propriété (ou sous porche), il sera d’une\nlargeur minimum de 4 mètres.\n13.2.1.1.3. Compacité\nAu moins 15 % de la superficie de l’unité foncière sera aménagée en espace libre d'un seul\ntenant.\n13.2.1.2. Unité foncière d'une superficie inférieure ou égale à 2 000 m²\n    78\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\nLa superficie minimale des espaces libres est fixée à 20 % de la superficie de l'unité\nfoncière dont la surface est supérieure ou égale à 500 m² et inférieure ou égale 2 000 m².\nCette disposition ne s’applique pas aux immeubles à destination exclusive de bureau*\nsitués dans le secteur UAa, ni le long des linéaires commerciaux figurant sur le document\ngraphique n° 5.1 « zonage et servitudes ».\nIl n’est pas fixé de superficie minimale d’espaces libres pour les unités foncières dont la\nsurface est inférieure à 500 m².\n13.2.2. Traitement des espaces libres (hors retraits cf. 13.2.3.)\n13.2.2.1. Dispositions générales\nLes espaces libres seront aménagés préférentiellement en contiguïté de ceux existants le\ncas échéant sur les unités foncières voisines. La partie du terrain en espace libre d’une\nsurface supérieure à 20 m² doit être aménagée principalement en espaces verts*. Les\nplantations y bénéficieront d'un traitement de qualité et diversifié.\n13.2.2.2. Obligations de traitement en pleine terre*\nL'aménagement des espaces libres présentant une superficie de plus de 100 m² en dehors\nde la bande de 20 mètres définie au paragraphe 7.1 de l'article UA.7, satisfera aux\ndispositions suivantes concernant la pleine terre* :\n    • Pour les unités foncières d'une superficie supérieure ou égale à 500 m² et\n    inférieure ou égale à 2 000 m², il sera exigé au moins 5 % de la superficie de\n    l’unité foncière, soit en pleine terre, soit en surface d’une profondeur minimum de\n    2 mètres de terre végétale (non comprise la couche drainante*).\n    • Pour les unités foncières d'une superficie supérieure à 2 000 m², il sera exigé en\n    pleine terre au moins 10 % de la superficie de l’unité foncière.\nLa pleine terre ou la profondeur de terre végétale sera répartie librement sur l’unité\nfoncière.\n13.2.2.3. Obligations de traitement des espaces verts\nLes espaces verts devront présenter les épaisseurs de terre végétale* nécessaires aux\ndifférentes catégories de plantations : pelouses et arbustes, arbres* à petit, moyen et grand\ndéveloppement. Cette épaisseur ne sera en aucun cas inférieure à 0,50 mètre non compris\nla couche drainante.\n13.2.2.4. Plantation d’arbres\nLe nombre d'arbres à grand (plus de 15 mètres de hauteur à l’âge adulte) ou moyen (entre\n8 et 15 mètres à l’âge adulte) développement devra correspondre au minimum à 1 sujet\npar fraction entière de 100 m² de la superficie totale des espaces libres de l’unité foncière.\n    79\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\nCes arbres devront être plantés prioritairement dans les zones de pleine terre prévues au\nparagraphe 13.2.2.2., et, lorsqu'ils se situeront hors des zones de pleine terre, dans une\népaisseur minimale de terre végétale (non compris la couche drainante) au moins égale à :\n    • 1 mètre pour les arbres à petit développement.\n    • 1,5 mètre pour les arbres à moyen développement.\n    • 2 mètres pour les arbres à grand développement.\nDans le cadre de la réalisation d'un immeuble collectif à destination principale d'habitation,\nla plantation d’arbre, afin d’en assurer leur pérennité, sera prioritairement réalisée en\ndehors de tout espace privatif dépendant d'un logement.\n13.2.3. Traitement spécifique des espaces libres situés dans les retraits\nsur alignement*\nNota :\nLes retraits sur alignement correspondent à l'espace libre compris entre la construction et\nles voies ou emprises publiques*. Ils peuvent être imposés dans certains cas définis au\nparagraphe 6.2. de l'article UA.6.\n13.2.3.1. Unité foncière d'un linéaire de façade inférieur à 25 mètres\nLes surfaces non occupées par les accès doivent être traitées en espaces verts\ncomportant une épaisseur minimum de 0,50 mètre de terre végétale.\nSur les unités foncières inférieures à 2 000 m2, la plantation d’un arbre permet la dispense\nde 2 places de stationnement, dès lors qu’elle permet de dégager une surface minimale de\n25 m2 d’espaces libres par arbre, d’une profondeur minimale de 2 mètres de terre végétale\nà compter du niveau du sol.\n13.2.3.2. Unité foncière d'un linéaire de façade supérieur ou égal à 25 mètres et\ninférieur à 45 mètres\nLes surfaces non occupées par les accès doivent être traitées en espaces verts. Il sera\nexigé la plantation d’un arbre à petit ou moyen développement par fraction de 7 mètres de\nfaçade de l’immeuble en retrait. Ces arbres devront disposer d'une épaisseur minimum de\n2 mètres de terre végétale, à compter du niveau naturel du sol, non comprise la couche\ndrainante.\nSur les unités foncières inférieures à 2 000 m2, la plantation d’un arbre permet la dispense\nde 2 places de stationnement, dès lors qu’elle permet de dégager une surface minimale de\n25 m2 d’espaces libres par arbre, d’une profondeur minimale de 2 mètres de terre végétale\nà compter du niveau du sol.\n13.2.3.3. Unité foncière d'un linéaire de façade supérieur ou égal à 45 mètres\nLes surfaces non occupées par les accès doivent être traitées en espaces verts. Il sera\nexigé la plantation d'un arbre à moyen ou grand développement par fraction de 7 mètres de\nfaçade de l’immeuble en retrait, déduction faite des accès. Ces arbres devront disposer\n    80\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\nd'une épaisseur minimum de 2 mètres de terre végétale, à compter du niveau du sol, non\ncomprise la couche drainante.\nSur les unités foncières inférieures à 2 000 m2, la plantation d’un arbre à moyen ou grand\ndéveloppement permet la dispense de 2 places de stationnement, dès lors qu’elle permet\nde dégager une surface minimale de 25 m2 d’espaces libres par arbre, d’une profondeur\nminimale de 2 mètres de terre végétale à compter du niveau du sol.\n13.2.3.4. Façade sur rue comportant des commerces, de l'artisanat* ou des\nCINASPIC* à rez-de-chaussée\nLorsque la façade sur rue comporte à rez-de-chaussée des vitrines commerciales, de\nl'artisanat ou des CINASPIC, le traitement végétal du retrait sur alignement pourra se\nlimiter à la plantation des arbres prévus aux articles 13.2.3.1. à 13.2.3.3., sans traitement\nvégétal des surfaces au sol.\n13.2.4. Unités foncières de faible profondeur\nLes dispositions des paragraphes 13.2.1. à 13.2.3 ne sont pas obligatoires pour les unités\nfoncières d'une profondeur inférieure à 25 mètres par rapport à l'alignement, lorsque ces\ndispositions conduiront à des impossibilités techniques avérées dans l'établissement des\nrampes de parking.\n13.3. Arbres existants*, arbres intéressants*, ensembles\nurbains et paysagers, espaces verts* à préserver et à mettre en\nvaleur\nLes dispositions des paragraphes 13.2.1. à 13.2.4. seront adaptées autant que de besoin\npour permettre à tout aménagement de respecter les dispositions du présent paragraphe.\n13.3.1. Arbres intéressants\nDes arbres intéressants sont mentionnés au document graphique n° 5.1 « zonage et\nservitudes ». Ils sont protégés grâce aux dispositions prévues par le Code de l’urbanisme\npermettant à un PLU d’identifier et de localiser les éléments de paysage, à mettre en valeur\nou à requalifier pour des motifs d'ordre culturel, historique ou écologique.\nLes aménagements et constructions prévus sur les unités foncières concernées devront\ntenir compte de ce patrimoine naturel.\nL'abattage d'un arbre intéressant est autorisé uniquement pour des raisons phytosanitaires.\nDans le cas où un arbre intéressant serait abattu, il devra être remplacé par un arbre de\nmême espèce ou par une espèce susceptible de redonner une valeur paysagère\néquivalente. La force du sujet ne pourra être inférieure à 20/25 centimètres, mesurée à un\nmètre de hauteur, lors de sa replantation. De surcroît, dans le cadre d'une construction\nnouvelle, le sujet en remplacement sera planté en pleine terre et, dans le cadre de la\nréalisation d'un immeuble collectif à destination principale d'habitation, il devra être planté\nen dehors de tout espace privatif dépendant d'un logement, afin d'assurer sa pérennité.\n    81\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\nPour la sauvegarde d'un arbre intéressant en cas de construction nouvelle, il pourra être\nappliqué une dispense de 2 places de stationnement.\n13.3.2. Arbres existants\nDans le cas où un arbre serait abattu, il devra être remplacé.\n.\n13.3.3. Marges vertes\nLeur plantation devra assurer un verdissement visuel marqué, la qualité des clôtures sera\nparticulièrement soignée ; le cas échéant une cohérence avec les plantations sur espace\npublic sera recherchée (poursuite d’alignements d’arbre etc…).\nLes espaces de pleine terre devront être préservés sauf pour l’accueil des installations\ntechniques autorisées à l’article UA 2.1.1.2.5.\n13.3.4. Ensembles urbains et paysagers, espaces verts à préserver ou\nà mettre en valeur en application des dispositions prévues par le code\nde l’urbanisme permettant à un PLU d’identifier et de localiser les\néléments de paysage, à mettre en valeur ou à requalifier pour des\nmotifs d'ordre culturel, historique ou écologique\nCes ensembles et espaces sont répertoriés au document graphique n° 5.1 « zonage et\nservitudes ».\n13.3.4.1. Espaces verts à préserver ou à mettre en valeur\nToute construction, reconstruction, installation ou aménagement au sol devra\ncontribuer à mettre en valeur ou améliorer les espaces plantés, voire à restituer le\ncaractère de l'élément paysager concerné.\nLa requalification d’aire de stationnement existante est possible si ces aménagements\npermettent de conserver les arbres existants et contribuent à favoriser l’emploi de matériau\nperméable pour les places de stationnement.\nLa disparition ou l'altération - accidentelle ou intentionnelle - des arbres ne pourra en aucun\ncas déqualifier l'espace et supprimer la servitude qui le grève.\n13.3.4.2. Ensembles urbains et paysagers à préserver ou mettre en valeur\nDans les secteurs de l’Hôtel de ville et ses abords, de la Villa Chaptal et ses abords, du 16,\nrue Aristide Briand / 50, rue Chaptal, du 42 et 44, rue Chaptal / 13, rue Louis Rouquier, de\nl'église-St-Justin et ses abords, les espaces verts et les plantations en bordure de rue\nseront conservés ou éventuellement remplacés in situ, sans diminution de l'épaisseur de\nterre existante.\n    82\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\nDans le secteur du 18, rue Chaptal / 13, rue Louise Michel, il sera maintenu un espace vert\nintérieur ainsi que la vision de celui-ci depuis la place du maréchal de Lattre de Tassigny\nau moins par un porche sur deux niveaux.\nDans le secteur du parc de la Planchette et ses abords les accès et les espaces libres\nattenants ou susceptibles d'y être reliés devront être maintenus ou étendus, leurs espaces\nplantés mis en valeur ou améliorés.\n13.3.5. « Plantations à réaliser » identifiées au document graphique\nCes espaces figurent au document graphique n° 5.1 «zonage et servitudes ». Ils doivent\nêtre libres de construction et plantés au minimum d’arbres à petit développement.\nLa requalification d’aire de stationnement existante est possible si ces aménagements\npermettent de conserver les arbres existants et contribuent à favoriser l’emploi de matériau\nperméable pour les places de stationnement.\n13.4. Constructions et installations nécessaires aux services\npublics ou d’intérêt collectif* (CINASPIC)\nDès lors que la fonctionnalité, la programmation et/ou les impératifs techniques des\nCINASPIC sont incompatibles avec les dispositions des paragraphes 13.2.1., 13.2.2. et\n13.3.2., seuls leur sont applicables les dispositions des paragraphes 13.2.3., 13.3.1.,\n13.3.3., 13.3.4. et 13.3.5.\n13.5. Travaux et aménagements en faveur de la salubrité, de\nl’accessibilité et de l’isolation des bâtiments\n•    Lorsque la réhabilitation d’un bâtiment existant destiné à l’habitation comporte la\n  création d’un ascenseur, ou d’un local vélo dans un immeuble de plus de 2 logements,\n  qu’il serait techniquement impossible de réaliser dans le volume de la construction,\n  ceux-ci pourront être implantés à l’extérieur de la construction en dérogation aux\n  dispositions des articles 13.2.1.1.1, 13.2.1.1.3, 13.2.1.2 et 13.2.2.1, à 13.2.2.3 qui en\n  empêcheraient la réalisation.\n•    Est également autorisée dans les cours d’immeubles existants l’implantation de\n  locaux d’ordures ménagères fermés, dès lors qu’il est impossible de les intégrer à\n  l’intérieur du bâtiment, et sous réserve d’un traitement soigné de leur apparence en\n  dérogation aux dispositions des articles 13.2.1.1.1, 13.2.1.1.3, 13.2.1.2 et 13.2.2.1 qui\n  en empêcheraient la réalisation.\n•    La mise en œuvre d'une isolation ou d'un dispositif de protection contre le\n  rayonnement solaire en saillie des façades ou des murs pignons susceptibles de\n  diminuer la superficie d’espace libre ou de pleine terre sont autorisés dans la limite de\n  30 centimètres par rapport à l’emprise au sol au nu extérieur des façades de la\n  construction existante en dérogation aux dispositions de l’article 13.2 qui empêcheraient\n  la réalisation. Ils sont également autorisés dans les mêmes limites dans les espaces\n  verts à préserver ou à mettre en valeur ainsi que dans les ensembles urbains et\n  paysagers à préserver ou à mettre en valeur.\n    83\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\nSection 3\nPossibilités maximales d'occupation du\nsol\nArticle UA.14. Coefficient d’Occupation des Sols*\nIl n’est pas fixé de règle.\n    84\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    157\n    32\n 138\n    31\n    35\n    *\n    156\n    33\n    32\n    20\n    220\n    *\n    191    21\n    30\n    31\n    192    *\n    28\n    *\n    29\n    26\n    224    *\n    27\n    217    26\n    22\n    25\n    152\n144\n    147    148\n    21\n    27\n    20\n    146    149\n    151\n    151\n    19\n    150\n  31b    31t    33\n    35    45\n    37    39\n    26    28\n    *La hauteur maximale est mesurée à partir du terrain naturel jusqu'à l'acrotère ou au faîtage\n    67\n    64\n    17\n    65\n    66    1", "    A IRE\n    LT\n    VO\n    E\n    RU\n    Hauteur maximale* 7.5 m - R+1\n    Hauteur maximale* 16.5 m - R+4\n    Hauteur maximale* 19.5 m - R+5\n    ≥1\n    R+4\n    m\n    ≥2    5.1    Hauteur maximale* 22.5 m - R+6\n    5m\n    R+5    5m\n    RU\n    18.\n    RU\n    R+6    R+5\n    ≥\n    E\n    E\n    x\n    5m    au\n    ive\n    DA\n    R+5\n    ≤1\n    MA\n    m    2 n    Espace verts, plantations à réaliser (hors accès)\n    N\n    ≥2\n    e\n    rch\n    RIU\n    TO\n    ≤1\n    R+1    s   po    R+6\n    N\n    sou\n    S\n    2.8\n    e\n    AU\n    0    a g\n    2.5    ass\n    m\n    p    Liaison piétonne à créer.\n    FA\n    R+5\n    ≥1\n    N\n    (Tracé indicatif) (art - L. 151-38 du CU)\n    m    1.5\n    ≥2\n    ≥5\n    R+5\n    m\n    >8\n    m\n    R+4\n    R+5    *La hauteur maximale est mesurée à partir du terrain naturel jusqu'à\n    m\n    ≥2\n    R+6    l'acrotère ou au faîtage\n    m\n    5m    m\n    m\n    ≤1    ≥2\n    R+4    R+6    ≥4    R+6\n    he\n    p orc\n    s\n    e sou au\n    ag    ive\n    p   ass 1 n\n    ES    m\n    RB    1.73\n    ≥1\n    A\n    E\n    B\n    m    ≥2\n    7.3\n    RU    ≥2\n    15m\n    m\n    R+5    ≤\n    R+6\n    D\n    RIA N\n    B\n    TIDE    Nota : demeurent applicables les articles UA1, UA2, UA3, UA4,\n    IS\n    AR    UA5, UA6.5,UA7.5, UA7.7,\n    E\n    RU    UA10.5.1 (sauf 6°), UA11, UA12, UA13.2.2.1 à UA13.2.2.4 et\n    UA14\nARCHITECTE :    ADRESSE DU PROJET :    ECHELLE :\n    7   Modification n°2\n    35-37, rue Berthollet\n    94 110 ARCUEIL\n    Secteur de plan masse UPM2    74 Rue DANTON et 59 Rue Marius AUFAN\n    LEVALLOIS-PERRET\n    1 : 500\n    T : 01.49.69.18.50\n    contact@groupesynthese.com\n    26/06/2024", "    Y\n    N    ZA\n    JEA\n    O    LIN    CE\n    RJ    PLA\n    MA\n    RE    TE\n    UA    LET\n    SQ    S   O\n    ROS\n    B\n    RRE\n    P IE    Hauteur maximale* 7.5 m\n    E    Nombre maximal de niveau autorisé - R+1\n    RU\n    d\n    fon    Hauteur maximale* 10 m\n    ≥ 8\n    de\n    rati\n    ve    m\n    i   te s\n    épa    ≥4    Nombre maximal de niveau autorisé - R+2\n    m\n    Lim\n    R+1\n    Lim\n    Hauteur maximale* 13.5 m\n    R+2\n    i\n    te s\n    Nombre maximal de niveau autorisé - R+3\n    é\n    par\n    m\n    ati\n    ≥4\n    ve d\n    e\n    R+1    Espace verts,plantations à réaliser (hors accès)\n    fon\n    RU\n    d\n    2m\n    Lim\n    E\n    ≥1\n    i\n    R+1\n    te s\n    RA\n    épar\n    Espace vert de pleine terre\n    ≥1\n    ati\n    SP\n    ve a\n    5.5\n    AIL\n    bou\n    m\n    ≥8\n    tiss\n    m\n    R+1    voie d'accès\n    nt àa\n    la v\n    oie\n    R+3\n    *La hauteur maximale est mesurée à partir du terrain naturel jusqu'à\n    l'acrotère ou au faîtage\n    RU\n    E\n    ≥1\n    MA\n    R+1\n    1m\n    5m\n    RJO\n    ≥ 2\n    LIN\n    ≥2\n    R+1    .50    nd\n    fo\n    de\n    a tive\n    r\n    épa\n    i   te s\n    Lim\n    0m\n    4,5\n    D\n    RIA N\n    Accès    B\n    TIDE\n    IS\n    AR\n    E\n    RU\n    Portail à    Nota : demeurent applicables les articles UA1, UA2, UA3, UA4,\n    claire-voie    UA5, UA7.5, UA10.5.1( sauf 6°), UA11, UA12, UA13.2.2.1,\n    UA13.2.2.3, UA13.2.2.4 et UA14\nARCHITECTE :    ADRESSE DU PROJET :    ECHELLE :\n    6   Modification n°2\n    Secteur de plan masse UPM 3\n    1 : 500\n    107 RUE ARISTIDE BRIAND\n    35-37, rue Berthollet\n    94 110 ARCUEIL    LEVALLOIS-PERRET\n    T : 01.49.69.18.50\n    contact@groupesynthese.com\n    17/04/2023", "    ZONE UB\nChapitre II\nDispositions    applicables    en\nzone UB\nLa zone UB correspond au quartier récent couvert par le périmètre de la ZAC « Front\nde Seine » (créée par arrêté préfectoral du 11 Août 1987) occupant la totalité du bord de\nSeine. Elle présente une grande mixité de l'occupation du sol : habitat, bureaux,\ncommerces, équipements… Initiée dans les années 80 sur de grandes emprises\nindustrielles, cette opération s’est traduite par le redécoupage des îlots en grandes\nparcelles. Les bâtiments, au linéaire imposant, assurent la continuité bâtie sur rue et\ndégagent des jardins en cœur d’îlots…\nElle est le siège de la majeure partie des implantations des grandes fonctions\néconomiques d’envergure métropolitaine de la ville, ainsi que de la construction de\nprogrammes de logements libres et sociaux, opérés depuis une vingtaine d’années. Elle\noccupe par conséquent une place de choix dans le rôle joué par Levallois dans le\nrayonnement du cœur francilien.\nLa zone est divisée en 6 secteurs et comprend des immeubles existants conservés\npouvant être restructurés. Ces immeubles, numérotés de 1 à 11, figurent sur le document\ngraphique n° UB 5.3.D « constructibilité des îlots ». Au nombre de ces immeubles existants\nconservés trois sont classés « bâtiments remarquables à préserver et mettre en valeur »\npar le « cahier de protection du patrimoine architectural », annexé au règlement (pièce\nn° 4.2.3). Ils font l’objet d’une protection grâce aux dispositions prévues par le Code de\nl’Urbanisme permettant à un PLU d’identifier et de localiser les éléments de paysage, à\nmettre en valeur ou à requalifier pour des motifs d'ordre culturel, historique ou écologique\net sont repérés au document graphique n° UB 5.3.B « implantation des constructions –\nservitudes d’urbanisme et d’architecture.\nCertaines dispositions règlementaires applicables à chaque îlot sont précisées dans les\ndocuments graphiques suivants :\n    • document graphique n° UB 5.3.A « traitement des espaces publics et localisation\n    des équipements publics » ;\n    • document graphique n° UB 5.3.B « implantation des constructions – servitudes\n    d’urbanisme et d’architecture » ;\n    • document graphique N° UB 5.3.C « hauteurs des constructions » ;\n    • document graphique N° UB 5.3.D « constructibilité des îlots ».\n    1\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\nSection 1\nNature de l'occupation et de l'utilisation\ndu sol\nArticle UB.1. Occupations et utilisations du sol\ninterdites\n1.1. Les constructions à destination d’entrepôt*.\n1.2. Les dépôts de ferrailles, de matériaux, de combustibles solides, ainsi que les\nentreprises de cassage de voitures et de transformation de matériaux de récupération.\n1.3. Les dépôts d'ordures ménagères, de résidus urbains ou de déchets de matériaux.\n1.4. Les carrières.\n1.5. Les installations classées soumises à la directive SEVESO, ou présentant des risques\ntechnologiques graves, ainsi que celles qui pourraient entraîner, pour le voisinage, une\ninsalubrité ou un sinistre susceptible de causer des dommages graves ou irréparables aux\npersonnes et/ou aux biens.\n1.6. Le stationnement des caravanes isolées, de résidences mobiles de loisirs,\nd’habitations légères de loisirs, l'ouverture de terrains de camping ou de caravanes.\n    2\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\nArticle UB.2. Occupations et utilisations du sol\nsoumises à des conditions particulières\n2.1. Les occupations et utilisations du sol suivantes ne sont\nadmises que si elles respectent les conditions ci-après\n2.1.1. Règles générales\nLes destinations d’occupation des sols pr
