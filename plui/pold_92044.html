  <div class="meta">${s.z?`<span class="chip">Zone ${esc(s.z)}</span>`:''} ${chips(s)} <span>p. ${s.p}–${Math.max(s.q,s.p)}${s.a?' (position approximative)':''}</span></div>
  <div class="btns no-print" style="margin-bottom:14px">${pdfBtn(s.p)} ${i>0?`<a class="b" href="#s/${i-1}">← Précédent</a>`:''} ${i<S.length-1?`<a class="b" href="#s/${i+1}">Suivant →</a>`:''}</div>
  ${k.length?`<div class="box sub-list"><h3>Contenu de cette section</h3>${k.map(j=>`<a href="#s/${j}">${esc(S[j].t)} <span class="pg" style="color:var(--muted);font-size:12px">p. ${S[j].p}</span></a>`).join('')}</div>`:''}
  <div class="box notes no-print"><h3>Mes notes</h3><textarea id="note" placeholder="Notes sur cette section (enregistrées dans ce navigateur)">${esc(notes[i]||'')}</textarea></div>
  <h3 style="font-size:14px;color:var(--muted);margin:18px 0 8px">TEXTE OFFICIEL (extrait du PDF ; tableaux et figures : voir le PDF)</h3>
  ${pagesHtml(s.p,end,s.t)}`;
  bindMore();
  $('#fav').onclick=()=>{if(favs[i]) delete favs[i]; else favs[i]=1; store.set('favs',favs); $('#fav').classList.toggle('on')};
  $('#note').oninput=e=>{notes[i]=e.target.value; if(!notes[i]) delete notes[i]; store.set('notes',notes)};
  window.scrollTo(0,0);
}
function secsFor(th){
  return S.filter(s=>s.th.includes(th));
}
function viewProy(id){
  const P=PROY.find(p=>p.id===id);
  const tabs=`<div class="pj-tabs">${PROY.map(p=>`<a href="#proy/${p.id}" class="${p.id===id?'on':''}"><b>${esc(p.nom)}</b><span>${esc(p.sub)}</span></a>`).join('')}</div>`;
  if(!P){$('#main').innerHTML=`<h1 class="st">Quel est votre projet ?</h1><p>Choisissez le type de travaux. La page indique, dans l’ordre, les articles de ce ${DATA.k.startsWith('pold')?'PLU':'PLUi'} à consulter, et vous pouvez les cocher au fur et à mesure.</p>${tabs}`;return}
  const ck=checks[id]||{};
  let total=0,done=0;
  const zsel=DATA.zones.length?`<div class="zsel"><span style="font-size:13px;color:var(--muted)">Votre zone :</span><span class="chip ${zone===''?'on':''}" data-z="">non choisie</span>${DATA.zones.map(z=>`<span class="chip ${zone===z?'on':''}" data-z="${esc(z)}">${esc(z)}</span>`).join('')}</div>`:'';
  const groups=P.grupos.map(([th,txt])=>{
    let list=secsFor(th).filter(s=>!s.z||!zone||s.z===zone);
    // prefer most specific: drop parents whose children also listed
    const ids=new Set(list.map(s=>s.i));
    list=list.filter(s=>!kids[s.i].some(j=>ids.has(j)));
    const common=list.filter(s=>!s.z), zl=list.filter(s=>s.z);
    const item=s=>{total++; const ok=ck[s.i]; if(ok) done++; return `<div class="pj-a ${ok?'ok':''}"><input type="checkbox" data-ck="${s.i}" ${ok?'checked':''}><a href="#s/${s.i}">${esc(s.t)}${s.z?`<span class="zn">${esc(s.z)}</span>`:''}<span class="tt">p. ${s.p} · ${esc(crumb(s).replace(/<[^>]+>/g,''))}</span></a></div>`};
    let body='';
    if(common.length) body+=`<div style="font-size:12px;color:var(--muted);margin-top:6px">Communs à toutes les zones</div>`+common.slice(0,12).map(item).join('')+(common.length>12?`<div class="empty">… et ${common.length-12} de plus dans <a href="#temas/${th}">Par thème</a></div>`:'');
    if(zl.length) body+=`<div style="font-size:12px;color:var(--muted);margin-top:6px">${zone?'Zone '+esc(zone):'Par zone (choisissez votre zone ci-dessus pour filtrer)'}</div>`+zl.slice(0,zone?30:10).map(item).join('')+(!zone&&zl.length>10?`<div class="empty">… et ${zl.length-10} de plus : choisissez votre zone.</div>`:'');
    if(!body) body=`<div class="empty">Aucun article de ce thème dans l’index. Utilisez la recherche (en haut) avec des mots-clés.</div>`;
    return `<div class="box pj-g"><h3>${esc(TH[th])}</h3><div class="reg">${esc(txt)}</div>${body}</div>`;
  }).join('');
  $('#main').innerHTML=`${tabs}<h1 class="st">${esc(P.nom)}</h1>
  <div class="pj-cols"><div class="box"><h3>Procédure</h3><ul>${P.tramite.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="box"><h3>Avant de lire le règlement</h3><ul>${P.antes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
  ${zsel}
  <div class="pj-bar"><div class="pj-prog"><i style="width:${total?Math.round(done*100/total):0}%"></i></div><span style="font-size:13px">${done} sur ${total} vérifiés</span><button id="pjReset">Tout décocher</button><button onclick="print()">Imprimer</button></div>
  <div class="warn">La liste est générée par thème à partir de l’index du règlement. Vérifiez toujours dans le texte et sur le plan de zonage ; certains articles traitent plusieurs thèmes à la fois.</div>
  ${groups}`;
  $('#main').querySelectorAll('[data-z]').forEach(e=>e.onclick=()=>{zone=e.dataset.z; store.set('zone',zone); renderFilters(); renderTree(); viewProy(id)});
  $('#main').querySelectorAll('[data-ck]').forEach(e=>e.onchange=()=>{const c=checks[id]=checks[id]||{}; if(e.checked) c[e.dataset.ck]=1; else delete c[e.dataset.ck]; store.set('checks',checks); viewProy(id)});
  $('#pjReset').onclick=()=>{checks[id]={}; store.set('checks',checks); viewProy(id)};
}
function viewTemas(th){
  const list=DATA.themes.map(([k,l])=>`<a class="chip ${k===th?'on':''}" href="#temas/${k}">${esc(l)} (${secsFor(k).length})</a>`).join(' ');
  let body='';
  if(th){
    const ss=secsFor(th).filter(s=>!zone||!s.z||s.z===zone);
    body=`<h2 style="font-size:18px">${esc(TH[th])}${zone?' · zone '+esc(zone):''}</h2>`+(ss.map(s=>`<div class="r" onclick="location.hash='#s/${s.i}'"><span class="cd">p. ${s.p}</span>${esc(s.t)} ${s.z?`<span class="chip">${esc(s.z)}</span>`:''}<div class="sn">${esc(crumb(s).replace(/<[^>]+>/g,''))}</div></div>`).join('')||'<div class="empty">Aucune section dans l’index. Essayez la recherche.</div>');
  }
  $('#main').innerHTML=`<h1 class="st">Par thème</h1><p>Sections du règlement regroupées par thème (d’après leur titre).${DATA.zones.length?' Si vous choisissez votre zone dans le panneau de gauche, les autres zones sont masquées.':''}</p><div class="th-l" style="margin-bottom:14px">${list}</div><div class="results">${body}</div>`;
}
function secOfPage(p){let best=null;S.forEach(s=>{if(s.p<=p&&(!best||s.p>=best.p))best=s});return best}
function viewSearch(q){
  const nq=norm(q).trim(); if(nq.length<2){viewHome();return}
  const terms=nq.split(/\s+/);
  const res=[];
  const tit=S.filter(s=>terms.every(t=>norm(s.t).includes(t)));
  for(let i=0;i<DATA.pages.length&&res.length<300;i++){
    const np=NP[i]; if(terms.every(t=>np.includes(t))){
      const j=np.indexOf(terms[0]); const raw=DATA.pages[i]; const a=Math.max(0,j-90);
      res.push({p:i+1,sn:raw.slice(a,a+260).replace(/\s+/g,' ')});
    }
  }
  const hl=t=>{let h=esc(t);terms.forEach(x=>{if(x.length<2)return;const re=new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');h=h.replace(re,m=>`<mark>${m}</mark>`)});return h};
  $('#main').innerHTML=`<h1 class="st">Résultats pour « ${esc(q)} »</h1>
  ${tit.length?`<div class="box"><h3>Dans les titres de sections (${tit.length})</h3>${tit.slice(0,40).map(s=>`<div class="r" onclick="location.hash='#s/${s.i}'"><span class="cd">p. ${s.p}</span>${esc(s.t)}</div>`).join('')}</div>`:''}
  <div class="results"><h3 style="font-size:14px;color:var(--muted)">DANS LE TEXTE : ${res.length}${res.length>=300?'+':''} pages</h3>${res.map(r=>{const s=secOfPage(r.p);return `<div class="r" data-p="${r.p}" data-s="${s?s.i:''}"><span class="cd">p. ${r.p}</span>${s?esc(s.t):''}<div class="sn">… ${hl(r.sn)} …</div></div>`}).join('')}</div>`;
  $('#main').querySelectorAll('.results .r[data-p]').forEach(e=>e.onclick=()=>{location.hash='#p/'+e.dataset.p});
}
function viewPage(p){
  p=Math.max(1,Math.min(DATA.npages,p)); const s=secOfPage(p);
  $('#main').innerHTML=`<div class="crumb">${s?crumb(s)+(crumb(s)?' › ':'')+`<a href="#s/${s.i}">${esc(s.t)}</a>`:''}</div><h1 class="st">Page ${p}</h1>
  <div class="btns no-print" style="margin-bottom:14px">${pdfBtn(p)} ${p>1?`<a class="b" href="#p/${p-1}">← p. ${p-1}</a>`:''} ${p<DATA.npages?`<a class="b" href="#p/${p+1}">p. ${p+1} →</a>`:''}</div>${pagesHtml(p,p)}`;
  const q=$('#q').value; if(q){const terms=norm(q).split(/\s+/).filter(x=>x.length>1); const pre=$('#main pre'); let h=pre.innerHTML; terms.forEach(x=>{const re=new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'); h=h.replace(re,m=>`<mark>${m}</mark>`)}); pre.innerHTML=h}
  window.scrollTo(0,0);
}
function viewNotas(){
  const f=Object.keys(favs).map(Number).filter(i=>S[i]); const n=Object.keys(notes).map(Number).filter(i=>S[i]);
  $('#main').innerHTML=`<h1 class="st">Mes notes et favoris</h1><p class="empty">Elles sont enregistrées uniquement dans ce navigateur.</p>
  <div class="box"><h3>Favoris (${f.length})</h3>${f.map(i=>`<div class="r" onclick="location.hash='#s/${i}'"><span class="cd">p. ${S[i].p}</span>${esc(S[i].t)}</div>`).join('')||'<div class="empty">Marquez des sections avec ★.</div>'}</div>
  <div class="box"><h3>Notes (${n.length})</h3>${n.map(i=>`<div class="r" onclick="location.hash='#s/${i}'"><span class="cd">p. ${S[i].p}</span>${esc(S[i].t)}<div class="sn">${esc(notes[i])}</div></div>`).join('')||'<div class="empty">Écrivez des notes dans n’importe quelle section.</div>'}</div>`;
}
function viewHome(){
  const top=S.filter(s=>s.l===0);
  $('#main').innerHTML=`<h1 class="st">${esc(DATA.nom)}</h1>
  <div class="box"><div class="kv"><b>Document</b><span>Règlement écrit du ${DATA.k.startsWith('pold')?'PLU':'PLUi'} (${DATA.npages} pages)</span><b>État</b><span>${esc(DATA.estado)}</span><b>Communes</b><span>${esc(DATA.communes)}</span><b>Source</b><span><a href="${DATA.pdf.url}" target="_blank" rel="noopener">Géoportail de l’urbanisme (PDF officiel)</a></span></div></div>
  <div class="box"><h3>Mode d’emploi</h3><ul style="margin:0;padding-left:18px">
   <li><b>Par projet</b> : choisissez le type de travaux et votre zone ; la page liste les articles à vérifier, dans l’ordre, avec des cases à cocher.</li>
   <li><b>Explorer</b> : index complet à gauche ; chaque section affiche le texte officiel et un bouton pour ouvrir le PDF à cette page.</li>
   <li><b>Recherche</b> : dans les ${DATA.npages} pages (ex. : <i>hauteur, clôture, pleine terre…</i>).</li>
   <li><b>Votre zone</b> : consultez la <a href="https://www.geoportail-urbanisme.gouv.fr/map/" target="_blank" rel="noopener">carte du Géoportail de l’urbanisme</a> (clic sur la parcelle) ou les plans de zonage du dossier <i>Reglement</i>.</li></ul></div>
  <div class="pj-tabs">${PROY.map(p=>`<a href="#proy/${p.id}"><b>${esc(p.nom)}</b><span>${esc(p.sub)}</span></a>`).join('')}</div>
  <div class="box sub-list"><h3>Parties du règlement</h3>${top.map(s=>`<a href="#s/${s.i}">${esc(s.t)} <span style="color:var(--muted);font-size:12px">p. ${s.p}</span></a>`).join('')}</div>
  <div class="box no-print"><h3>Ouvrir le PDF</h3><p style="font-size:13.5px;margin:0 0 8px">Les boutons « Ouvrir dans le PDF » utilisent : <b>${pdfMode==='local'?'votre copie locale (dossier Reglement à côté de ce fichier)':'le PDF officiel en ligne'}</b>.</p><button id="pdfToggle">Utiliser ${pdfMode==='local'?'le PDF en ligne':'ma copie locale'}</button></div>
  ${HOME_URL?`<p><a href="${HOME_URL}">← Retour à la carte des territoires</a></p>`:''}`;
  $('#pdfToggle').onclick=()=>{pdfMode=pdfMode==='local'?'online':'local'; store.set('pdfmode',pdfMode); viewHome(); toast('PDF : '+(pdfMode==='local'?'copie locale':'en ligne'))};
}
const NP=DATA.pages.map(norm);
let qt;
$('#q').addEventListener('input',e=>{clearTimeout(qt); qt=setTimeout(()=>{const v=e.target.value.trim(); if(v.length>=2) location.hash='#q/'+encodeURIComponent(v); else if(!v) location.hash='#home'},350)});
function route(){
  const h=decodeURIComponent(location.hash.slice(1)||'home');
  const [v,a]=[h.split('/')[0],h.split('/').slice(1).join('/')];
  document.querySelectorAll('#tabs a').forEach(x=>x.classList.toggle('on',x.dataset.t===(v==='q'||v==='p'?'':v)));
  if(v==='s') viewSec(+a||0);
  else if(v==='proy') viewProy(a);
  else if(v==='temas') viewTemas(a);
  else if(v==='q'){ if($('#q').value!==a) $('#q').value=a; viewSearch(a)}
  else if(v==='p') viewPage(+a);
  else if(v==='notas') viewNotas();
  else viewHome();
}
window.addEventListener('hashchange',route);
renderFilters(); renderTree(); route();
</script>
</body>
</html>
