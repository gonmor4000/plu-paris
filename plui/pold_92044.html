évues au document graphique n° UB 5.3.D.\n« constructibilité des îlots », sous réserve du respect de la SDP précisée dans le tableau.\nA l’exception de celles régies par l’article UB.1, les installations classées pour la protection\nde l’environnement sous réserve que leurs exigences de fonctionnement, lors de\nl’ouverture ou à terme, soient compatibles avec les infrastructures existantes, notamment\nles voiries et l’assainissement.\nLes affouillements et exhaussements de sol, à condition qu’ils soient liés à la réalisation\ndes occupations et utilisations du sol autorisées dans la zone.\n2.1.2. Règles spécifiques\n2.1.2.1. Dispositions applicables à l’habitation*\nToute construction nouvelle ou tout changement de destination ayant pour effet de créer\nplus de cinq logements devra comporter un minimum de 65 % de logements de trois\npièces et plus.\nCette disposition ne s’applique pas aux résidences ou foyers pour étudiants, pour\npersonnes âgées, aux logements-foyers, et aux foyers d’accueil pour personnes\nhandicapées.\n2.1.2.2. Reconstructions à l’identique\nEn cas de sinistre, est autorisée, la reconstruction de locaux régulièrement édifiés et\ndétruits après sinistre depuis moins de dix ans, dès lors qu’elle ne modifie pas la\ndestination existante, et ne dépasse ni la surface de plancher (SDP*), ni le, volume, ni\nl’implantation des bâtiments ou parties de bâtiments existants avant le sinistre. Cette\nreconstruction devra disposer du même nombre de places de stationnement existant avant\nsinistre ou respecter les nouvelles dispositions de l’article UB.12.\nHors cas de sinistres, est autorisée la reconstruction de locaux, régulièrement édifiés et\ndémolis depuis moins de dix ans, dès lors qu’elle ne modifie pas la destination existante et\nne dépasse ni la SDP, ni l’implantation, ni le volume existants avant démolition.\n    3\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\nLes reconstructions de locaux régulièrement édifiés et détruits depuis moins de dix ans,\ndoivent respecter les dispositions du Plan de Prévention des Risques d’Inondation de la\nSeine dans les Hauts de Seine (PPRI) dont le plan et le règlement sont reportés dans les\nannexes du présent dossier (pièce n° 6.1.2.).\n2.2. Rappels\nLes constructions nouvelles à destination d’habitation et les établissements\nd’enseignement doivent répondre aux normes d’isolement acoustique conformément aux\narrêtés préfectoraux du 30 mai 1996 et du 9 janvier 1995 lorsque leurs façades sont\nexposées au bruit des infrastructures de transport terrestres classées par l’arrêté\npréfectoral du 29 juin 2000 (le classement figure dans les annexes en pièce n° 6.2.2 du\nprésent dossier).\nDans les parties de zones repérées au Plan de Prévention des Risques d’Inondation de la\nSeine dans le Département des Hauts-de-Seine approuvé par l’arrêté Préfectoral du\n09/01/2004 (P.P.R.I. : pièces n° 6.1.2 du présent dossier), la nature de l’occupation et de\nl’utilisation du sol est subordonnée aux dispositions règlementaires dudit Plan de\nPrévention des Risques d’Inondation approuvé.\n    4\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\nSection 2\nConditions de l'occupation du sol\nArticle UB.3. Conditions de desserte des terrains par\nles voies publiques ou privées et accès aux voies\nouvertes au public\n3.1. Conditions de desserte des unités foncières*\nPour être constructible, une unité foncière doit être desservie par une voie publique ou\nprivée en état de viabilité et dont les caractéristiques permettent de répondre aux\nexigences de la sécurité civile, de la lutte contre l'incendie et du ramassage des ordures\nménagères.\nToute création de voie de desserte devra présenter une largeur au moins égale à\n3,50 mètres.\n3.2. Voies couvertes\nLes voies couvertes laisseront un gabarit libre de hauteur de 4,50 mètres, à l’exception de\nla zone située entre les îlots 5.3.1 et 5.1, où le gabarit ne pourra être inférieur à la cote\nindiquée sur le document graphique n° UB 5.3.C « hauteurs des constructions ».\nCependant les voies séparant les îlots 1.1. et 1.2. d’une part, et les îlots 2.1. et 2.2. d’autre\npart, laisseront un gabarit libre de hauteur de 3,50 mètres minimum, sur la profondeur\nindiquée au document graphique n° UB 5.3.C « hauteurs des constructions », par une\ntrame pointillée.\nCes raccordements entre constructions seront traités en façade par des éléments de\nporches.\n3.3. Accès aux voies\n3.3.1. Aucun accès des véhicules riverains n’est autorisé sur la RD1, exception faite des\naccès sur berges, des accès pompiers figurant au document graphique\nn° UB 5.3.A « traitement des espaces publics et localisation des équipements publics » ; et\nde l’entrée-sortie des immeubles de bureaux de l’îlot 3-4 figurant au document graphique\nn° UB 5.3.B « implantation des constructions – servitudes d’urbanisme et d’architecture ».\n3.3.2. Les accès véhicules sur les espaces piétons sont interdits, sauf aux endroits\nindiqués sur document graphique n° UB 5.3.A « Traitement des espaces publics et\nlocalisation des équipements publics »\n    5\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\n3.3.3. Les raccordements et accès privés aux voies publiques principales seront implantés\nde façon à respecter conjointement les dispositions suivantes :\n    • une distance minimum longue de 20 mètres, calculée jusqu’à l’angle du terrain le\n    plus proche de deux voies principales. Lorsque l’angle est situé Quai Michelet, les\n    raccordements et accès parkings situés sur une voie transversale seront distant de\n    30 mètres de cet angle. Ces distances sont comptées à partir de la limite de\n    l’accès la plus proche de cet angle.\n    • une distance minimum de 30 mètres entre chaque entraxe de raccordement ou\n    accès, avec possibilité de regroupement de ces accès par deux. S’il s’agit d’une\n    entrée et d’une sortie d’un même parking, et si ces deux accès ne sont pas\n    contigus, la distance entre leurs entraxes ne pourra pas excéder 15 mètres.\nCes dispositions pourront être assouplies pour les îlots et sous îlots dont les linéaires sur\nrue ne permettent pas de respecter les contraintes techniques citées ci-dessus.\nDans le cas de parcelle existante conservée, située dans un angle de voies où la façade\nprésente un linéaire sur rue inférieur à 20 mètres, les raccordements et accès privés aux\nvoies principales publiques seront implantés de façon à se situer sur le plus grand côté de\nl’angle de deux voies, et en limite de la parcelle voisine, avec possibilité de regroupement\nde ces accès par deux.\n    6\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\n    7\nPLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\nArticle UB.4. Conditions de desserte des terrains par\nles réseaux publics d'eau, d'assainissement, de\ncommunication, d’énergie et de collecte des déchets\n4.1. Alimentation en eau potable\nToute construction ou installation nouvelle qui, par sa destination, implique une utilisation d’eau\npotable, doit être obligatoirement alimentée par un branchement sur le réseau public d’eau\npotable.\n4.2. Assainissement\n4.2.1. Eaux usées\nLe branchement sur le réseau collectif d’assainissement est obligatoire pour toute\nconstruction ou installation nouvelle engendrant des eaux usées. Toute évacuation dans\nles fossés et cours d’eau est interdite.\nLe rejet dans le réseau collectif des eaux résiduaires industrielles pourra être soumis à des\nconditions particulières et devra notamment être soumis à un prétraitement.\n4.2.2. Eaux pluviales\nLes aménagements réalisés sur une unité foncière* ne doivent pas faire obstacle au libre\nécoulement des eaux pluviales (articles 640 et 641 du Code Civil).\nPour toute construction nouvelle, reconstruction ou réhabilitation, et quelle que soit la taille\nde l’unité foncière concernée, le rejet des eaux pluviales dans le réseau d'assainissement\ndevra respecter le règlement d’assainissement intercommunal de l’Etablissement Public\nTerritorial Paris Ouest La Défense.\nDans le cas où les caractéristiques de l’unité foncière ne permettent pas d’assurer une\nrétention naturelle d’eau suffisante, doivent être prévus des dispositifs de rétention\ncomplémentaires aux possibilités du réseau et utilisant des techniques alternatives.\nLes eaux de lessivage des parcs de stationnement, chaussées aires de services, de\nmanœuvre ou d’activités, doivent faire l’objet de prétraitement avant déversement dans le\nréseau public (dessablage, déshuilage, séparateur d’hydrocarbures,…)\n    8\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\n4.3. Réseau public de communications\nLes constructions ou installations nouvelles devront comporter les infrastructures\nnécessaires à leur branchement sur les réseaux de communication existants ou projetés :\n    • les réseaux traditionnels publics (téléphone, télex, liaisons spécialisées ...) ;\n    • les réseaux câblés de radiotélévision publics.\n4.4. Collecte des déchets\n4.4.1. Dispositions générales\nLes constructions nouvelles doivent comporter des locaux de stockage des déchets,\nsuffisamment dimensionnés de manière à recevoir et permettre de manipuler sans\ndifficultés tous les récipients nécessaires à la collecte sélective des déchets.\nCes locaux seront isolés et fermés.\n4.4.2. Dispositions spécifiques suivant la ou les destinations des\nconstructions\nPour les constructions nouvelles à destination d’habitation*, ces locaux doivent être situés\nau rez-de-chaussée, à moins de 15 mètres de la voie ou de l’emprise publique et satisfaire\naux contraintes techniques de la collecte sélective en porte à porte.\nPour les constructions nouvelles à destination autres que d’habitation, ces locaux doivent\nêtre situés en rez-de-chaussée ou en sous-sol, mais préférentiellement en rez-de-\nchaussée.\nEn cas de mixité des destinations, ces locaux doivent répondre aux besoins de la collecte\nsélective des déchets de chacune des destinations.\n4.4.3. Dispositions spécifiques à certaines constructions\nLes dispositions de l’article 4.4. ne s’appliquent pas aux constructions nouvelles à\ndestination d’habitation qui comportent moins de trois logements.\nCes dispositions ne s’appliquent pas non plus aux constructions dont la S.D.P. est\ninférieure ou égale à 50 m².\n4.4.4. Dispositions spécifiques aux travaux sur constructions\nexistantes\nLors de travaux accompagnés d’un changement de destination de l’ensemble de la\nconstruction, les dispositions des articles 4.4.1. et 4.4.2. s’appliquent. Cependant, elles\npourront être adaptées si les caractéristiques des constructions ou de l’unité foncière ne le\npermettent pas.\n    9\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\n4.5. Rappels : Energies renouvelables\nL’utilisation des énergies renouvelables pour l’approvisionnement énergétique des\nconstructions sera privilégiée.\n4.5.1. Réseaux de distribution de chaleur et de froid\nLorsqu’existent des périmètres de développement prioritaires, toute installation d’un\nbâtiment neuf, ou faisant l’objet de travaux de rénovation importants, qu’il s’agisse\nd’installations industrielles ou d’installations de chauffage de locaux, de climatisation ou de\nproduction d’eau chaude, doit être raccordée au réseau concerné. L’exploitant du réseau\nd’énergie précisera les conditions de raccordement. Cette obligation de raccordement ne\nfait pas obstacle à l’utilisation d’installations de secours ou de complément.\n4.5.2. Alimentations pour véhicules rechargeables\nToute construction d’un immeuble d’habitation comportant au minimum 2 logements ou\nd’un bâtiment à destination de bureau* équipé de places de stationnement couvertes ou\nd’accès sécurisé doit doter une partie de ces places des gaines techniques, câblages et\ndispositifs de sécurité nécessaires à l’alimentation de prises de recharge pour les véhicules\nélectriques ou hybrides rechargeables et permettant un comptage individuel conformément\nau Code de la Construction et de l’Habitation.\n    10\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\nArticle UB.5. Superficie minimale des terrains\nconstructibles\nIl n’est pas fixé de règle.\nArticle UB.6. Implantation des constructions par\nrapport aux voies et emprises publiques*\n6.1. Dispositions générales\nLes constructions devront être implantées soit à l’alignement* des voies et emprises\npubliques*, soit en retrait, de manière différenciée suivant les rues et emprises publiques\nconsidérées et tel que figuré sur le document graphique n° UB 5.3.B « implantation des\nconstructions – servitudes d’urbanisme et d’architecture », et respecter l’emprise\nconstructible de l’îlot concerné issue de ce même document graphique.\n6.1.1. Implantation à l’alignement\nPour les constructions à l’alignement, repérées au document graphique n° UB 5.3.B\n« implantation des constructions – servitudes d’urbanisme et d’architecture », leurs façades\ns'implanteront dans le plan vertical de la ligne figurant l'alignement.\nElles pourront présenter des retraits et saillies* sur cet alignement justifiés par une\ncomposition architecturale et à condition :\n    • que 40 % au minimum de la surface de la façade concernée par l'alignement\n    s'inscrive dans le plan vertical de la ligne figurant l'alignement. Sont exclus des 40\n    % les balcons et loggias ainsi que les retraits des immeubles d'angle mentionnés\n    ci-après ;\n    • que les retraits soient situés à plus de 5 mètres de toute limite séparative* de\n    parcelles ;\n    • que l'espace compris entre le retrait et l'alignement soit traité dans la même nature\n    que l'espace public : minéral ou végétal.\nCependant, en cas d'extension partielle ou de réhabilitation d'un bâtiment situé sur une\nparcelle conservée, l'alignement défini ci-dessus ne pourra pas être imposé.\n6.1.2. Implantation en retrait\nLes constructions devront être implantées conformément aux retraits précisés sur le\ndocument graphique n° UB 5.3.B « implantation des constructions – servitudes\nd’urbanisme et d’architecture » et respecter l’emprise constructible de l’îlot concerné issue\nde ce même document graphique.\n    11\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\n6.1.3. Les unités foncières* à l’angle de deux voies\nL’aménagement des immeubles d’angle, repérés comme tels sur le document graphique n°\nUB 5.3.B. « Implantation des constructions – servitudes d’urbanisme et d’architecture »,\ns’effectuera sur une distance au plus égale à 20 mètres comptés à partir de l'angle\nconcerné.\nLes constructions pourront s'établir en retrait de l'alignement sur 15 mètres maximum\ncomptés à partir de l'angle concerné, avec l'obligation de revenir à l'alignement sur les\n5 mètres restants, dans le cas où l'angle est délimité par la ligne continue figurant\nl'alignement.\n6.1.4. Dispositions diverses\nLes passages piétonniers publics à aménager dans le volume bâti: ces servitudes de\npassages piétonniers devront impérativement être établies sur toute la profondeur bâtie et\nsur une largeur minimum cotée sur le document graphique n° UB 5.3.B. « Implantation des\nconstructions – servitudes d’urbanisme et d’architecture ».\nLes aménagements de porches, lorsqu'ils s'accompagnent d'une indication portant sur la\nnotion de transparence, devront permettre une continuité visuelle entre l'espace public et le\ncœur d'îlot sur toute l'épaisseur construite.\nLes portiques devront être réalisés aux endroits indiqués sur le document graphique\nn° UB 5.3.B « implantation des constructions – servitudes d’urbanisme et\nd’architecture » sur une ou deux hauteurs d'étage maximum.\nLe traitement de la place s'effectuera conformément au plan de détails figurant au\ndocument graphique n° UB 5.3.B « implantation des constructions – servitudes\nd’urbanisme et d’architecture ».\nLe long de l’avenue Georges Pompidou, les balcons et éléments d'ornementation sont\nautorisés en surplomb de la zone de plafond variant entre la cote minimum de 49,80\nmètres et maximum de 51,30 mètres.\n    12\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\n6.2.\nSaillies\nLes saillies (balcons, loggias, bow-window, auvents et éléments d'ornementation) sur\nl'espace public ou au-delà de l'alignement défini ci-dessus ne pourront prendre naissance\nqu'à partir du plancher haut du 1er étage, et leur débord ne pourra excéder 1,50 mètre au-\ndelà de l'alignement sauf pour les CINASPIC* pour lesquels le débord maximum autorisé\nest de 2,50 mètres.\n    13\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\nDans l’îlot 4.4, des débords de saillies de 0,60 mètre au-delà de l'alignement strict seront\nautorisés à partir du plancher haut du rez-de-chaussée.\nDans le cas de façades comportant des portiques en rez-de-chaussée représentées au\ndocument graphique n° UB 5.3.B « implantation des constructions – servitudes\nd’urbanisme et d’architecture », ces éléments de saillies pourront s'établir à partir du\nplancher bas du 1er étage.\nLes saillies sur le cimetière (îlots 3.4.,3-7-1 et 3-7-2) sont strictement interdites.\nSur les voies départementales, le règlement de voirie départemental approuvé le 12\ndécembre 1994 par le Conseil Départemental 92 s’applique.\n    14\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\nArticle UB.7. Implantation des constructions par\nrapport aux limites séparatives\n7.1. Dispositions générales\n7.1.1 Implantation par rapport aux limites séparatives* et également par\nrapport aux limites de la zone UB constituant des limites séparatives\n7.1.1.1. Implantation sur les limites séparatives\nLes constructions peuvent s’implanter sur les limites séparatives à condition que la façade\nsur ladite limite ne comporte pas de baie principale*.\n7.1.1.2. Implantation en retrait des limites séparatives\nLes constructions devront être implantées de façon à ce que la distance comptée\nhorizontalement de tout point de la construction au point de la limite séparative qui en est le\nplus rapproché soit au moins égale à la moitié de la hauteur entre ces deux points.\nCe retrait est au minimum de 4 mètres.\n7.1.1.3. Fermeture de balcon\nLa fermeture de balcons existants sera autorisée nonobstant les distances par rapport aux\nlimites séparatives imposées par l’article 7.1.1.1 et 7.1.1.2., sous réserve de respecter les\nprescriptions de l’article 11.6.\n7.1.2. Implantation par rapport aux parcelles comportant des\nimmeubles existants (numérotées de 1 à 11)\nLes dispositions édictées aux 7.1.1. ci-dessus s’appliquent aux constructions en limite\nséparative des parcelles comportant des immeubles existants conservés tels que figurés\nau document graphique n° UB-5.3.D « constructibilité des îlots » (parcelles n° 1 à 11).\n7.1.3. Implantation à l’intérieur des îlots\nA l’intérieur des îlots, seules s’appliquent les règles d’implantation des constructions les\nunes par rapport aux autres telles que définies à l’article UB-8, et ce, dans le respect des\nemprises constructibles.\n    15\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\n7.2. Dispositions diverses : cœurs d’îlots\nDans le cas de cœurs d'îlots délimités au document graphique n° UB 5.3.B « implantation\ndes constructions – servitudes d’urbanisme et d’architecture », les constructions\ns'implanteront dans l'emprise qui figure sur ce plan.\nDans le cas de cœurs d'îlots ouverts sur l'espace public, aucune construction ou extension\nen superstructure n'est admise.\nCette dernière disposition s’applique également aux espaces privés plantés et jardins\nprivés ouverts sur l’espace public.\nEn cas de superstructure autorisée en cœur d'îlot au document graphique n° UB 5.3.C\n« hauteurs des constructions », les constructions ne sont admises que si elles ne\ndépassent pas une hauteur de 4,00 mètres sur dalle, comptée à partir de la cote de\nréférence, et si elles respectent les règles d'implantation définies à l'article 7.1.\nCes dalles seront alors obligatoirement plantées sur au moins l'emprise du cœur d'îlot, et\naccessibles.\nEn cas d'infrastructure, les dalles seront aménagées en jardin sur un volume de terre de 1\nmètre moyen d'épaisseur, compté à partir d'une cote de référence calculée par\ninterpolation entre les cotes qui marquent les angles des îlots, à condition toutefois de\nrespecter les dispositions de l'article 2.2. concernant le secteur soumis à des risques\nd'inondation.\n    16\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\nArticle UB.8. Implantation des constructions les unes\npar rapport aux autres sur une même propriété\n8.1. Dispositions générales\nLa construction de plusieurs bâtiments à l’intérieur d’un îlot ou d’un groupe d’îlots\nrespectera les dispositions suivantes :\n8.1.1. Conditions relatives aux baies principales\nLa plus courte distance horizontale, mesurée normalement, entre toute baie principale*\nd'un bâtiment et tout point d'un bâtiment non contigu sera au moins égale à 8 mètres.\n8.1.2. Conditions relatives aux distances entre bâtiments non contigus\nLa plus courte distance horizontale mesurée perpendiculairement de tout point d'une\nfaçade d'un bâtiment à tout point d'un bâtiment non contigu sera au moins égale à la moitié\nde la hauteur du bâtiment en ce premier point, avec un minimum de 8 mètres.\n8.1.3. Conditions relatives aux distances entre bâtiments contigus\nLa plus courte distance horizontale mesurée perpendiculairement de tout point d'une\nfaçade d'un bâtiment à tout point d'un bâtiment contigu sera au moins égale à la moitié de\nla hauteur de la façade en ce premier point.\n8.2. Dispositions particulières\n8.2.1. Dans l’îlot 3-4, tel que délimité au document graphique n° UB 5.3.D « constructibilité\ndes îlots », la plus courte distance horizontale mesurée perpendiculairement de tout point\nd'une façade d'un bâtiment à tout point d'un bâtiment non contigu sera au moins égale à la\nmoitié de la hauteur du bâtiment en ce premier point, avec un minimum de 10 mètres.\n8.2.2. La fermeture de balcons existants est autorisée sous réserve que les nouvelles baies\nrésultant de ces fermetures soient situées à 8 mètres minimum du point le plus proche du\nnu de la façade d’une autre construction située en vis-à-vis, et dans le respect des\nprescriptions de l’article 11.6.\n    17\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\nArticle UB.9. Emprise au sol des constructions\n9.1. Construction en superstructures\nElle résulte des dispositions figurant au document graphique n° UB 5.3.B « implantation\ndes constructions – servitudes d’urbanisme et d’architecture ».\n9.2. Construction en infrastructures\nLes sous-sols pourront s'étendre sous toute l'emprise des îlots constructibles figurant au\ndocument graphique n° UB 5.3.D « constructibilité des îlots », à l'exception des parcelles\nn° 100 et 102, rue de Villiers et n° 5 et 7 rue E. Cognacq, 178 rue Danton, et 159 rue\nAnatole France où ils ne pourront s'étendre au-delà de la limite d'implantation des\nconstructions figurant au document graphique n° UB 5.3.B « implantation des constructions\n– servitudes d’urbanisme et d’architecture ».\nLes sous-sols ne sont pas autorisés sous les espaces verts privatifs indiqués au document\ngraphique n° UB 5.3.B « implantation des constructions – servitudes d’urbanisme et\nd’architecture » donnant sur rue pour les îlots 5.8 et 4.1.\nSous réserves de la concordance des projets des îlots cités ci-après avec la présence\néventuelle de réseaux techniques communaux en infrastructure :\n    • Les sous-sols des îlots 1.1, 1.2, 2.1 et 2.2 pourront s'étendre sous toute l'emprise\n    des îlots constructibles figurant au document graphique n° UB 5.3.D\n    « constructibilité des îlots », ainsi que sous l'emprise publique des passages\n    séparant les deux îlots 1.1 et 1.2 d'une part, et les deux îlots 2.1 et 2.2 d'autre\n    part : ces sous-sols pourront s'étendre sur une largeur de 1 mètre et sur la\n    longueur du passage, soit 15,50 mètres.\n    • Les sous-sols des îlots 5.1 et 5.3.1 pourront s'étendre sous toute l'emprise des\n    îlots constructibles figurant au document graphique n° UB 5.3.D « constructibilité\n    des îlots », ainsi que sous la voie publique séparatrice de ces 2 îlots.\n    • Les sous-sols de l'îlot 2.7 pourront s'étendre sous l'espace public nommé « Place\n    Marie Jeanne Bassot » jusqu'à la limite de l'ancienne parcelle cadastrée J n°20\n    sous réserve que la dalle supérieure du sous-sol soit recouverte d'une couche de\n    terre végétale* d'au moins 2 mètres d'épaisseur.\n    • Les sous-sols de l'îlot 5.6 pourront s'étendre sous toute l'emprise de l'îlot\n    constructible figurant au document graphique n° UB 5.3.D « constructibilité des\n    îlots », ainsi que sous l'emprise des espaces piétons compris strictement entre les\n    deux avancées des bâtiments le long de la rue Greffülhe et sur une profondeur de\n    16 mètres.\n    • Les sous-sols des îlots 5.5 et 5.7 pourront s'étendre sous toute l'emprise des îlots\n    constructibles figurant au document graphique n° UB 5.3.D « constructibilité des\n    18\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\n îlots », ainsi que sous l'emprise des espaces piétons compris strictement entre les\n 2 avancées des bâtiments et sur une profondeur de 10 mètres.\n• La construction des parkings sous les espaces verts publics séparatifs des îlots\n  5.3.1 et 5.3.2, et 5.1 et 5.2, est autorisée à condition :\n• que la cote du sol naturel ne soit pas sensiblement modifiée,\n• que la dalle supérieure du sous-sol soit recouverte d'une couche de terre végétale\n  d'au moins 2 mètres d'épaisseur.\n• La construction des sous-sols de l'îlot 1.6 est autorisée sous l'espace public, sur\n  une bande de terrain de 21,73 mètres x 10,50 mètres, le long de la rue A. France,\n  à condition que la dalle supérieure du sous-sol soit recouverte d'une couche de\n  terre végétale d'au moins 0,60 mètre d'épaisseur.\n• Les sous-sols de l'îlot 4.3 pourront s'étendre sous l'espace public, exclusivement le\n  long des rues Anatole France et Danton, jusqu'à la limite des anciennes parcelles\n  cadastrées section D, numéro 25, 20, 21 :\n• côté de la rue Danton, l'étanchéité des sous-sols sera à la côte maximum de 27,45\n  NGF ;\n• côté de la rue Anatole France, l'étanchéité des sous-sols sera à la côte maximum\n  de 30,40 NGF.\n    19\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\nArticle UB.10. Hauteur maximale des constructions\n10.1. Hauteur des constructions\nLes constructions respecteront « a) » ou ne pourront dépasser « b) » les hauteurs\nindiquées au document graphique n° UB 5.3.C. « hauteurs des constructions ».\nFigurent sur ce document :\n    a) L’indication accompagnée d’une flèche de la cote NGF* normale des acrotères* ou\n    corniches visibles depuis l’espace public : cette cote marquant le gabarit de la rue sera\n    respectée impérativement sur toute la longueur de la façade indiquée sur le plan, y\n    compris lorsque celle-ci présente un retrait.\n    Lorsque deux cotes figurent sur ce plan, elles indiquent un seuil minimum et un seuil\n    maximum.\n    b) L’indication des plafonds de hauteur pour l’ensemble des volumes susceptible d’être\n    construits.\n    Il s'agit d'une hauteur maximale fixant un vélum à ne pas dépasser.\n    Les volumes construits pourront s'établir à cette cote ou en deçà de cette cote, à\n    condition de respecter les hauteurs imposées d'acrotères et de corniches indiquées\n    au a) ci-dessus.\n    c) Les zones représentées par une trame croisée expriment la possibilité de descendre à\n    45° à partir du plafond le plus haut et dans les profondeurs indiquées sur le plan.\nDans le cas où les terrasses ne sont pas réalisées, le bâtiment s'implantera en retrait dans\nla profondeur indiquée sur le plan.\nLes rez-de-chaussée à destination de commerce pourront, néanmoins, s'implanter\nlibrement sous réserve que les terrasses ainsi créées soient accessibles.\nDans le cas de limites séparatives*, une solution de raccordement des constructions\nsituées de part et d'autre de la limite séparative devra être recherchée : notamment, les\nconstructions pourront s'établir sur l'alignement extérieur sur une largeur minimum de 5\nmètres en respectant un acrotère stricte correspondant au plafond le plus haut.\nSur les quais, les terrasses obligatoires seront traitées en toitures-terrasses plantées. Elles\ns'établiront à 45 ° à partir de la cote d'acrotère basse et dans la profondeur indiquée sur le\nplan. Des saillies* ponctuelles seront autorisées sur une largeur représentant le tiers de la\nfaçade sur quais. Leur hauteur sera limitée à 3 mètres au-dessus du plan oblique à 45°\ndéfini ci-dessus\n10.2. Dépassements généraux\n10.2.1. Les volumes de superstructure : machineries d’ascenseurs,\nlocaux de ventilation et de climatisation, capteurs d’énergie, antennes,\nparatonnerres, chaufferies en superstructure, etc…, à condition :\n    20\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\n    • qu’ils s’insèrent dans une composition d’ensemble ;\n    • qu’ils n’excèdent pas une hauteur de 3 mètres au-dessus du velum de la zone\n    dans laquelle ils sont situés ;\n    • qu’ils soient situés à une distance de 2 mètres minimum des façades du dernier\n    niveau de l’immeuble.\n10.2.2. Les garde-corps des terrasses à condition :\n    • qu’ils n’excèdent pas la hauteur minimum fixée par les normes en vigueur.\n10.2.3. Les volumes d’accès aux toitures-terrasses et leurs extensions\npour une surface de plancher (SDP*) maximum de 80 m² par cage\nd’escalier d’immeuble, à condition :\n    • que la surface de 80 m² autorisée ci-dessus soit répartie en deux volumes\n    maximum, limités à 40 m² de SDP chacun ;\n    • qu’ils s’insèrent dans une composition d’ensemble, en liaison avec les édicules\n    techniques (cage d’escalier…) de l’immeuble ;\n    • qu’ils n’excèdent pas une hauteur de 3 mètres au-dessus du velum de la zone\n    dans laquelle ils sont situés ;\n    • qu’ils soient situés à une distance de 2 mètres minimum des façades du dernier\n    niveau de l’immeuble ;\n    • qu’il n’en résulte pas une occupation de la toiture-terrasse de l’immeuble\n    supérieure à 50 % de celle-ci ;\n    • qu’ils soient traités avec le même soin et les mêmes matériaux que les façades de\n    l’immeuble, avec une préférence pour les matériaux transparents, et que la\n    terrasse qui leur correspond soit traitée en terrasse d’agrément avec plantations ;\n    • Dans le cas où ces volumes sont contigus ou reliés entre eux, les façades percées\n    de baies devront être édifiées dans le même alignement (croquis a) ;\n    • Leurs extensions, dès lors qu’elles sont accolées, seront édifiées selon les mêmes\n    dispositions (croquis b) ;\n    • Toutefois, si elles ne sont pas accolées, ces extensions devront être séparées par\n    une terrasse-jardin de 2 mètres minimum par pièce de loisirs (croquis c).\n10.2.4. Recommandations concernant les machineries d'ascenseurs\nIl est souhaitable d'intégrer les machineries d’ascenseur à l'intérieur des bâtiments, la\npartie technique en superstructure étant alors limitée à 1,80 mètre.\nDans le cas contraire, il conviendra de rechercher une localisation et un traitement en\nharmonie avec l'architecture du bâtiment.\n    21\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\n    CROQUIS EXPLICATIF\nPour l’application de l’article UB.10. concernant les volumes d’accès aux toitures-terrasses.\nCroquis a) édification de volumes d’accès aux toitures-terrasses contigus ou reliés entre\neux par un édifice technique\n    22\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\n    limite terrasse privative\n    P.L. 1    P.L. 2\n    édifice\n    technique\nCroquis b) dans le cas d’extension accolée\n    limite terrasse privative\n    extension    extension\n    P.L. 1    P.L. 2\n    extension    extension\n    édifice\n    technique\nCroquis c) dans le cas d’extension non accolée\n    limite terrasse privative\n    extension    2m    2m    extension\n    P.L. 1    P.L. 2\n    extension    2m    2m    extension\n    édifice\n    technique\nLégende\n    Façade percée de baie\n    23\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\n10.3. Dispositions spécifiques aux constructions existantes à\nla date d’approbation du P.L.U.\nLes travaux sur les façades et toitures d'une construction existante, en vue d'améliorer son\nisolation thermique, et excédant ou susceptibles d'excéder les gabarits, les hauteurs\nplafonds et hauteurs maximum définis aux paragraphes 10.1. et 10.2. ci-dessus, peuvent\nêtre admis. Dans ce cas, le dépassement sera limité à 30 cm par rapport au volume\nexistant.\nArticle UB.11. Aspect extérieur des constructions et\naménagement de leurs abords\n11.1. Dispositions générales\nTout projet peut être refusé ou n'être accordé que sous réserve de l'observation de\nprescriptions spéciales si les constructions par leur architecture, leurs dimensions ou\nl'aspect extérieur des bâtiments ou ouvrages à édifier ou à modifier, sont de nature à porter\natteinte au caractère ou à l'intérêt des lieux avoisinants, aux sites, au paysages naturels ou\nurbains, ainsi qu'à la conservation des perspectives monumentales.\nLes constructions renforceront par leur conception architecturale et la qualité de leur\ntraitement, les caractéristiques urbaines de l’espace public.\n11.2. Matériaux, couleurs des façades, dispositifs liés au\ndéveloppement durable\nL’emploi à nu, en parement extérieur, de matériaux destinés à être recouverts est interdit.\nLe pavé de verre est interdit en rez-de-chaussée des façades sur rue.\nL’installation de dispositifs favorisant la retenue des eaux pluviales ou la production\nd’énergie renouvelable correspondant aux besoins de la consommation domestique des\noccupants de l’immeuble ou de la partie d’immeuble concerné est autorisée sous réserve\nde s’inscrire qualitativement dans la composition du bâtiment et de s’intégrer dans le\npaysage urbain.\n11.3. Pignons\nLes murs pignons, mitoyens ou non, feront l’objet d’un traitement particulier en harmonie\navec les façades.\n11.4. Façade de bureaux*\n    24\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\nPour les constructions destinées exclusivement au bureau, le rez-de-chaussée et le\n1er étage devront bénéficier d’un traitement spécifique avec notamment la réalisation d’une\nentrée de grande dimension sur double niveaux avec un effort particulier en matière de\nmatériaux et de conception architecturale de la façade et en privilégiant les effets de\ntransparence.\n11.5. Clôtures\nLes clôtures seront à dominante végétale.\nTout traitement minéral de clôture ne pourra excéder une hauteur de 1,20 mètre, au delà\nde laquelle il pourra être complété d’éléments de grilles ou de végétal.\nSur toutes les clôtures à l’exception de celles des CINASPIC*, l'ajout d'écrans opaques est\ninterdit ; seul le doublage par des écrans ajourés est autorisé, ainsi qu’un doublage par des\nhaies végétales ou des plantes grimpantes.\n11.6. Fermeture de balcons et terrasses intermédiaires\nLa fermeture isolée des balcons et terrasses intermédiaires visibles depuis l’espace public\nest interdite. La fermeture des balcons sera néanmoins autorisée dans le cadre d’une\nrecomposition architecturale globale de la façade concernée englobant des fermetures\nsimultanées, et notamment si elle permet d’améliorer les performances énergétiques de la\nconstruction.\nLa fermeture isolée des balcons non visibles de l’espace public sera autorisée sous\nréserve de s’effectuer en harmonie avec l’architecture et les matériaux de la façade\nconcernée.\n11.7. Traitement des toitures et des superstructures\nLes superstructures et ouvrages techniques mentionnés à l'article 10 seront intégrés à la\nconstruction, et feront partie de la composition volumétrique d'ensemble.\nIls seront traités avec les mêmes matériaux et dans la même qualité de finition que les\nfaçades. Les toitures accessibles seront traitées en terrasses aménagées ou plantées.\nLes réseaux techniques en toitures tels que VMC, climatisation, ventilations diverses seront\nobligatoirement camouflés par un revêtement en pierre, ou des caillebotis bois, ou des\nmatériaux identiques à la façade.\nLes étanchéités apparentes sont interdites.\n    25\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\n11.8. Toitures-terrasses\nLes toitures-terrasses, qu'elles soient accessibles ou non, devront faire l'objet d'un\ntraitement de qualité. Les étanchéités autoprotégées ne pourront être laissées apparentes\net la protection par gravillons est interdite.\nLes toitures-terrasses inaccessibles seront traitées de la manière suivante :\n    • soit végétalisées par solution traditionnelle avec apport de terre végétale*, ou par\n    toute autre solution type substrat. Lorsqu’il y a utilisation de substrats, ceux-ci\n    devront comporter une épaisseur minimum de 11 centimètres.\n   Cette végétalisation devra également être réalisée en cas de réhabilitation lourde ou de\n   la réfection de la toiture d’un bâtiment existant qui n’en n’aurait pas bénéficié lors de sa\n   construction. Dans ce cas l’épaisseur de substrat imposée ci-dessus pourra être\n   ajustée aux contraintes techniques de l’existant.\n    • soit un mixage avec un minimum de 60 % de terre végétale pouvant associer alors\n    plantations diverses et traitement minéral. Ce traitement minéral sera dans ce cas\n    constitué d'un revêtement approprié : carrelages, dalles sur plots, caillebotis bois\n    ou protection dur.\nLa végétalisation (ou mixage terre végétale, plantations et traitement minéral) devra être\nmaintenue lors d’une réfection de la toiture.\n11.9. Prescriptions relatives à l’aspect extérieur des\nconstructions\nLes surélévations des conduits de fumée des bâtiments voisins nécessitées par une\nconstruction nouvelle feront l'objet d'un aménagement architectural, afin de les intégrer\nparfaitement à la construction nouvelle.\nIl est recommandé que l'installation de trop-pleins sur les balcons, loggias et terrasses, les\névacuations d'eaux pluviales soient situées de telle façon qu'elles ne puissent être visibles\net décelables en tant que telles, depuis l'espace public et les cœurs d'îlots.\n11.10. Dispositions particulières à certains espaces\n11.10.1. La place centrale et ses accès figurant aux documents graphiques n° UB 5.3.A\n« traitement des espaces publics et localisation des équipements publics » et n° UB 5.3.B\n« implantation des constructions – servitudes d’urbanisme et d’architecture », par une\ntrame, est soumise à l’obligation d’un traitement architectural d’ensemble.\n11.10.2. Certains éléments privilégiés de façades marquant les angles de rue, les têtes\nd’immeuble, les transparences, les porches, les portiques, les façades composées en\nfonds de perspectives, figurant au document graphique n° UB 5.3.B « implantation des\n    26\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\nconstructions – servitudes d’urbanisme et d’architecture » par une indication particulière,\nferont l’objet d’une recherche architecturale visible dans le traitement des façades.\n11.10.3. Les squares publics plantés représentés au document graphique n° UB 5.3.A\n« Traitement des espaces publics et localisation des équipements publics » pourront\nrecevoir des aménagements de superstructures légers.\n11.10.4 Les espaces privés de jardins ouverts sur l’espaces public seront enclos par des\néléments de grilles et portails aux endroits indiqués au document graphique n° UB 5.3.B.\n« Implantation des constructions – servitudes d’urbanisme et d’architecture ».\n11.10.5. Les espaces publics à mettre en valeur, figurant au document graphique n° 5.1\n« zonage et servitudes » participent de façon intéressante à la qualité du paysage urbain\ngrâce à leur qualité intrinsèque et de l’association qu’ils forment avec les bâtiments qui les\nbordent. En conséquence, une vigilance particulière sera portée aux travaux et ravalement\ndes bâtiments concernés, au respect de la composition urbaine d’ensemble (axes,\nsymétries, portiques…), au maintien des éléments végétaux, à la qualité des traitements de\nsols, des clôtures, enseignes et éléments de mobilier urbain.\n11.11. Dispositions particulières aux bâtiments remarquables à\npréserver et mettre en valeur repérés au document graphique\nn° UB 5.3.B\nTous les travaux exécutés sur un bâtiment faisant l'objet d'une protection (figurant au\ndocument graphique n° UB 5.3.B et dans le document « cahier de protection du patrimoine\narchitectural », pièce n° 4.2.3) doivent être conçus en évitant toute dénaturation des\ncaractéristiques constituant son intérêt esthétique.\nLes projets situés à proximité immédiate des bâtiments ainsi protégés doivent être conçus\ndans la perspective d'une mise en valeur de ce patrimoine.\nLes interventions sur les bâtiments répertoriés en annexe au présent règlement en tant que\n« bâtiments remarquables à préserver » devront être réalisées dans le respect strict des\ncaractéristiques originelles des édifices (volumétrie, composition et traitement des façades,\nornementation et modénatures, nombre, proportions et traitement des ouvertures, mise en\nœuvre des matériaux, typologie de la toiture…) et contribuer à leur restauration et à leur\nmise en valeur. La volumétrie existante du bâtiment devra être conservée dans ses\ncaractéristiques générales.\n    27\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\nArticle UB.12. Obligations imposées aux constructeurs\nen matière de réalisation d'aires de stationnement\n12.1. Dispositions Générales\nLe stationnement de véhicules motorisés correspondant aux besoins des constructions et\ninstallations nouvelles ou aux travaux sur constructions existantes doit être assuré en\ndehors de la voie publique, sur l’unité foncière* propre à l’opération ou dans son\nenvironnement immédiat.\nS’il est admis qu’une impossibilité technique ou des motifs d’architecture ou d’urbanisme\ninterdisent de réaliser les places de stationnement résultant de l’application des\nparagraphes 12.1.2 à 12.1.5, le pétitionnaire peut être autorisé à les reporter à proximité,\nen apportant la preuve qu’il les obtient par concession dans un parc public ou par\nconcession ou acquisition dans un parc privé existant ou en cours de réalisation.\nLorsqu'une aire de stationnement a été prise en compte dans le cadre d'une concession à\nlong terme ou d'un parc privé de stationnement, au titre des obligations prévues aux\npremier et deuxième alinéas ci-dessus, elle ne peut plus être prise en compte, en tout ou\nen partie, à l'occasion d'une nouvelle autorisation.\nLes aires de stationnement devront être réalisées en sous-sol.\n12.2. Normes dimensionnelles\n12.2.1. Dimensions utiles des places\nChaque emplacement doit présenter des dimensions au moins égale à :\n    • longueur : 5 mètres\n    • largeur : 2,30 mètres\n    • dégagement : 5,5 mètres\n12.2.2. Rampes d'accès\nLes rampes d’accès doivent avoir la larguer minimum suivante :\n    • sens unique : 3,50 mètres\n    • Double sens desservant : 3,50 mètres jusqu'à 70 voitures\n    • Double sens desservant : 6 mètres plus de 70 voitures\nA l'exception des rampes des parkings publics, ces rampes d'accès ne doivent pas\nentraîner de modifications dans le niveau du trottoir.\n    28\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\nLeur pente dans les 5 premiers mètres à partir de l'alignement* ne doit pas excéder 5 %, et\nne pas excéder 18 % pour le restant.\nLeur rayon de courbure intérieur ne peut être inférieur à 5 mètres.\nLe rayon extérieur devra au moins être égal au rayon intérieur augmenté d'une largeur de\n3,50 mètres pour une rampe à sens unique ou de 6 mètres pour une rampe à double sens,\nsans pour autant descendre au-dessous de 9,50 mètres et 12 mètres dans chacun des\ncas.\nToute rampe extérieure aux bâtiments, visible depuis l'espace public est interdite, exceptée\ncelles des sorties de parkings des îlots 3.4, 5.1 et 5.3.1 qui seront situées sur les trottoirs\nde l'avenue André Malraux, des rues Léon Jamin et Jules Guesde et sur le Quai Michelet.\n12.3. Normes de stationnement\n12.3.1. Habitation*\nIl est exigé une place de stationnement automobile par tranche commencée de 85 m² de\nsurface de plancher (SDP*) de construction, avec un minimum d’une place par logement.\nDans les îlots d’une surface inférieure à 600 m², il est exigé une place de stationnement\nautomobile par logement.\nPour les résidences ou foyers pour étudiants ou pour personnes âgées il ne sera exigé\nqu’une place pour 150m² de SDP.\nPar ailleurs, il est exigé la réalisation d’aires de stationnement pour les deux roues\nmotorisées, représentant 1 % de la SDP, avec un minimum de 10 m².\nPour la construction de logements locatifs financés avec un prêt aidé par l’Etat, il ne sera\nexigé que 0,50 place de stationnement automobile par logement.\n12.3.2. Commerce, artisanat*, industrie*,\nIl n’est pas exigé la réalisation de places de stationnement automobile pour les\nconstructions à destination de commerce, d’artisanat et d’industrie qui sont situées dans un\nrayon de 150 mètres autour de l’accès véhicule d’un parking public existant ou projeté.\nLes aires de stationnement automobile pour les constructions à destination de commerce,\nd’artisanat et d’industrie, représenteront au minimum :\n    • 60 % de la SDP créée pour les commerces ;\n    • 25 % de la SDP créée pour l’industrie et l’artisanat.\n  Dans le cas ci-dessus (artisanat et industrie), il est demandé que la (ou les places)\n  créée(s), outre les dimensions minimum imposées à l’article 12.1, soient adaptées aux\n  caractéristiques de fonctionnement de l’activité considérée (dégagement…).\n    29\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\n12.3.3. Bureaux*\nIl sera créé une place de stationnement automobile par tranche de 120 m² de surface de\nplancher créée.\nDans un rayon de 300 mètres autour des accès de la station de métro « Pont de\nLevallois », la norme est d’une place par tranche de 150 m² de SDP créée.\nPar ailleurs, il est exigé la réalisation d’aires de stationnement pour les deux roues\nmotorisées, représentant 0,3 % de la SDP avec un minimum de 10 m².\n12.3.4. Hébergement hôtelier*\n12.3.4.1. Véhicules particuliers\nIl sera réalisé au minimum une place de stationnement pour 3 chambres.\n12.3.4.2. Autocars\nToutes dispositions devront être prises pour que la desserte des hôtels de tourisme par\nautocars et taxis ne génère aucune gêne pour la circulation publique.\nIl sera exigé une place de stationnement d'autocar pour 100 chambres.\n12.3.5. CINASPIC*\nLe nombre de places à réaliser devra correspondre aux besoins de l’immeuble à\nconstruire, appréciés en fonction de la nature de l’établissement, de son fonctionnement et\nde sa situation géographique (notamment par rapport aux parkings publics et aux\ntransports en commun).\n12.3.6. Immeubles protégés au titre des monuments historiques ou de\nl’article L. 151-19 du Code de l’urbanisme\nIl n’est pas exigé la réalisation de place de stationnement en cas de travaux de\nrestauration, de changement de destination ou de reconstruction à l’identique des\nimmeubles protégés.\nCette dispense n’autorise pas la suppression des places existantes avant travaux.\n    30\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\n12.4. Stationnement des vélos et poussettes\n12.4.1 Stationnement des vélos\nDans les immeubles d’habitation ou de bureau, le stationnement des vélos devra respecter\nles dispositions et les normes du Code de la Construction et de l’Habitation et être situé au\nrez-de-chaussée ou au premier sous-sol réservé au stationnement automobile, dans des\nlocaux clos et facilement accessibles.\nPour les CINASPIC, les résidences pour personnes âgées, les foyers d’accueil pour\npersonnes handicapées : la superficie à réserver éventuellement au stationnement des\nvélos doit tenir compte de la nature et du fonctionnement des établissements, de leur\nsituation géographique et de leurs utilisateurs.\n12.4.2. Dispositions particulières pour le stationnement des vélos\nEn l’absence de réalisation de parc de stationnement, il devra néanmoins être réalisé, dans\nles immeubles principalement d’habitation ou de bureau, un ou plusieurs locaux en rez-de-\nchaussée, clos et couverts, pour le stationnement des vélos, dont la surface totale devra\ncorrespondre aux besoins de l’immeuble.\nCes locaux pourront être communs avec ceux réservés aux poussettes et situés en rez-de-\nchaussée des constructions.\n12.4.3. Stationnement des poussettes\nPour les constructions à destination d’habitation créant plus de 10 logements, il devra être\nréalisé un ou plusieurs locaux en rez-de-chaussée, clos et couverts, pour le stationnement\ndes poussettes.\nLa surface réservée au stationnement des poussettes doit représenter au minimum 4m²\npar tranche complète de 10 logements.\nCes locaux pourront être communs avec ceux réservés aux vélos, dès lors que ces\nderniers sont situés au rez-de-chaussée des constructions.\nCes dispositions ne s’appliquent pas aux résidences ou foyers pour étudiants, pour\npersonnes âgées, aux logements-foyers, et aux foyers d’accueil pour personnes\nhandicapées.\n12.5. Aires de livraisons et de dépose à réaliser\nLes constructions doivent réserver sur l’unité foncière* des aires de livraison ou des aires\nde dépose pour autocars conformes aux normes et prescriptions définies ci-après.\nLes normes et prescriptions concernant les aires de livraison et les aires de dépose pour\nautocars ne s'appliquent pas aux surfaces de planchers existantes ni à leurs extensions\nmodérées.\n    31\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\nLes aires de dépose pour autocars et les aires de livraison, ainsi que leur accès doivent\nprésenter des caractéristiques adaptées aux besoins.\n12.5.1. Bureaux\nLorsqu'il est construit sur une unité foncière, une surface de plancher supérieure à 10 000\nm² (hormis les surfaces de locaux pour archives et informatique en sous-sol), il doit être\nprévu sur la dite unité foncière, les emplacements nécessaires à toutes les opérations de\nchargement, déchargement et manutention.\n12.5.2. Artisanat, industrie, commerce\nLorsqu'il est construit sur une unité foncière*, un bâtiment relevant de l'une de ces\ndestinations, il doit être réservé sur ladite unité foncière, les emplacements nécessaires et\nadaptés à toutes les opérations de chargement, déchargement et manutention qui sont\ninduites par la nature et la taille de ces destinations.\nPour la création de commerces ou services inférieurs à 150 m² SDP il n’est pas imposé\nd’obligation.\n12.5.3. Hébergement hôtelier\nLorsqu'il est construit sur une unité foncière un hôtel de plus de 100 chambres, il doit être\nréservé sur ladite unité foncière, une aire de dépose et de reprise des passagers. Cette\naire peut être utilisée comme aire de livraison, elle doit dans ce cas être adaptée à toutes\nles opérations de chargement, déchargement et manutention.\nLorsqu'il est construit sur un terrain un programme mixte, les aires de livraison peuvent être\ncommunes, dans ce cas il sera fait application de la norme la plus contraignante.\n    32\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\nArticle UB.13. Obligations imposées aux constructeurs\nen matière de réalisation d'espaces libres, d'aires de\njeux et de loisirs, et de plantations\n13.1. Espaces boisés classés*\nLes espaces boisés classés sont indiqués au document graphique n° UB 5.3.A « traitement\ndes espaces publics et localisation des équipements publics » ; et soumis aux dispositions\nspécifiques du Code de l'urbanisme.\n13.2. Cœurs d’îlots et espaces privés plantés repérés au\ndocument graphique n° UB 5.3.B\nLes « cœurs d’îlots et espaces privés plantés repérés au document graphique n° UB 5.3.B\n« implantation des constructions – servitudes d’urbanisme et d’architecture » seront\naménagés en espaces verts*.\nIl y sera planté un arbre* de grand développement pour 150 m² de l'emprise de cœur d'îlot\ndélimitée au document graphique n° UB 5.3.B « implantation des constructions –\nservitudes d’urbanisme et d’architecture ».\nLes sols artificiels (dalle supérieure de sous-sol, couverture de parking) seront recouverts\nsur leur totalité d'une couche de terre végétale* d'un mètre moyen d'épaisseur, comportant\ntous les composants techniques (couches drainantes*, feutres anticontaminants, etc…)\nnécessaires à la création et au maintien d'un espace vert de qualité.\nLes étanchéités apparentes et protections d'étanchéité seront interdites.\nLes circulations et espaces de détente seront traités en dallage.\n13.3. Espaces libres*\nLes espaces libres compris entre l'espace public et les constructions seront traités en\nliaison avec l'espace public minéral ou végétal.\nIls seront accompagnés d'éléments de grilles ou portails aux endroits indiqués sur le\ndocument graphique n° UB 5.3.B « implantation des constructions – servitudes\nd’urbanisme et d’architecture ».\n13.4 Arbres intéressants*\nLes arbres intéressants sont repérés au document graphique n° 5.1 « zonage et\nservitudes ».\n    33\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\nLes aménagements prévus sur les terrains devront tenir compte de ce patrimoine naturel :\nl’implantation des constructions devra, sauf impossibilité technique avérée, éviter leur\ndestruction.\nToutefois, dans le cas où un arbre intéressant serait abattu, il devra être remplacé par un\narbre de même espèce ou par un arbre susceptible de redonner une valeur paysagère\néquivalente.\n13.5 Arbres existants\nDans le cas où un arbre serait abattu, il devra être remplacé.\n13.6. Espaces verts à préserver et à mettre en valeur\nToute construction, reconstruction, installation ou aménagement au sol devra\ncontribuer à mettre en valeur ou améliorer les espaces plantés, voire à restituer le\ncaractère de l'élément paysage concerné.\nLa requalification d’aire de stationnement existante est possible si ces aménagements\npermettent de conserver les arbres existants et contribuent à favoriser l’emploi de matériau\nperméable pour les places de stationnement.\nLa disparition ou l'altération - accidentelle ou intentionnelle - des arbres ne pourra en aucun\ncas déqualifier l'espace et supprimer la servitude qui le grève.\n    34\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UB\nSection 3\nPossibilités maximales d'occupation du\nsol\nArticle UB.14. Coefficient d'occupation du sol\nIl n’est pas fixé de coefficient d’occupation du sol.\nLes possibilités maximales d’occupation des sols sont indiqués sur le document graphique\nn° UB 5.3.D « constructibilité des îlots ».\n    35\n    PLU Levallois-Perret –Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UC\nChapitre III\nDispositions applicables en\nzone UC\nLa zone UC, dite îlot « Collange » recouvre des terrains délimités par les rues Paul Vaillant\nCouturier, Marjolin, Baudin et Jules Guesde, situés entre le Front de Seine et le tissu\nancien de la ville.\nSa vocation principale est d’accueillir de l’habitat, des commerces et services ainsi que des\néquipements publics, notamment un des principaux parcs paysagers de la ville. Les\nbureaux y sont interdits.\nElle fait l’objet d’orientations d’aménagement et de programmation.\nCertains terrains de la zone sont concernés par des servitudes instaurées au titre de\nl’article L.151-41 du code de l’urbanisme pour l’aménagement d’un parc public,\nl’élargissement des trottoirs et la création d’un parc de stationnement public.\nCertaines dispositions règlementaires qui lui sont applicables sont figurées au document\ngraphique n° 5.4 « dispositions règlementaires applicables à la zone UC ».\n    1\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UC\nSection 1\nNature de l'occupation et de l'utilisation\ndu sol\nArticle UC.1. Occupations et utilisations du sol\ninterdites\n1.1. Les constructions à destination d’entrepôt*.\n1.2. Les dépôts de ferrailles, de matériaux, de combustibles solides, ainsi que les\nentreprises de cassage de voitures et de transformation de matériaux de récupération.\n1.3. Les dépôts d'ordures ménagères, de résidus urbains ou de déchets de matériaux.\n1.4. Les carrières.\n1.5. Les installations classées soumises à la directive SEVESO, ou présentant des risques\ntechnologiques graves, ainsi que celles qui pourraient entraîner, pour le voisinage, une\ninsalubrité ou un sinistre susceptible de causer des dommages graves ou irréparables aux\npersonnes et/ou aux biens.\n1.6. Le stationnement des caravanes isolées, de résidences mobiles de loisirs,\nd’habitations légères de loisirs, l'ouverture de terrains de camping ou de caravanes.\n1.7. Les bureaux*.\n1.8. L’industrie*.\n1.9. La reconstruction à l’identique de bâtiments ou parties de bâtiments détruits et non\nconformes aux règles du présent règlement.\n    2\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UC\nArticle UC.2. Occupations et utilisations du sol\nsoumises à des conditions particulières\n2.1. Les occupations et utilisations du sol suivantes ne sont\nadmises que si elles respectent les conditions ci-après\n2.1.1. Règles générales\nA l’exception de celles régies par l’article UC.1., les installations classées pour la protection\nde l’environnement sous réserve que leurs exigences de fonctionnement, lors de\nl’ouverture ou à terme, soient compatibles avec les infrastructures existantes, notamment\nles voiries et l’assainissement.\nLes affouillements et exhaussements de sol, à condition qu’ils soient liés à la réalisation\ndes occupations et utilisations du sol autorisées dans la zone.\n2.1.2. Règles spécifiques\n2.1.2.1. Dispositions applicables aux commerces et artisanats*\nLa création, par construction, et/ou changement de destination, de surface de plancher\n(SDP*) destinée au commerce ou à l’artisanat, à condition d’être située en sous- sol, et/ou\nrez-de-chaussée.\n2.1.2.2. Dispositions applicables à l’habitation*\nToute construction nouvelle ou tout changement de destination ayant pour effet de créer\nplus de cinq logements devra comporter un minimum de 65 % de logements de trois pièces\net plus.\nCette disposition ne s’applique pas aux résidences ou foyers pour étudiants, pour\npersonnes âgées, aux logements-foyers, et aux foyers d’accueil pour personnes\nhandicapées.\n2.1.2.3. Dispositions applicables dans l’emprise du parc public et sur les\nemprises à végétaliser\nSur l’emprise du parc public et sur les emprises à végétaliser figurant sur ce document\ngraphique, sont toutefois autorisées :\n  • L’édification d’ouvrages techniques et de petits édicules liés aux accès et à l’occupation\n    des sous-sols qui ne pourraient être intégrés dans les constructions à condition de\n    respecter les hauteurs maximum fixées au paragraphe UC 10.5.\n    3\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UC\n • L’édification d’installations légères publiques telles que sanitaires, local jardiniers,\n   kiosque, abri,…, à condition que la SDP totale créée par l’ensemble de ces installations\n   n’excède pas 40m².\n2.2. Rappels\nLes constructions nouvelles à destination d’habitation et les établissements\nd’enseignement doivent répondre aux normes d’isolement acoustique conformément aux\narrêtés préfectoraux du 30 mai 1996 et du 9 janvier 1995 lorsque leurs façades sont\nexposées au bruit des infrastructures de transport terrestres classées par l’arrêté\npréfectoral du 29 juin 2000 (le classement figure dans les annexes en pièce n° 6.2.2 du\nprésent dossier).\n    4\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UC\nSection 2\nConditions de l'occupation du sol\nArticle UC.3. Conditions de desserte des terrains par\nles voies publiques ou privées et accès aux voies\nouvertes au public\n3.1. Conditions de desserte des unités foncières*\nPour être constructible, une unité foncière doit être desservie par une voie publique ou\nprivée en état de viabilité et dont les caractéristiques permettent de répondre aux\nexigences de la sécurité civile, de la lutte contre l'incendie et du ramassage des ordures\nménagères.\nToute création de voie de desserte devra présenter une largeur au moins égale à 3,50\nmètres.\n3.2. Accès aux voies ouvertes au public\nLorsque la situation d’une unité foncière permet d’accéder à plusieurs voies publiques ou\nprivées ouvertes au public, l’accès carrossable devra être réalisé sur la voie où la gêne\npour le piéton, l’usager des voies et la circulation est moindre.\n3.3. Parcours piétonniers (aménagements en faveur du piéton,\nliaisons piétonnes)\nLes liaisons piétonnes existantes ou à créer ainsi que les aménagements en faveur du\npiéton, figurant au document graphique n° 5.1 « zonage et servitudes » devront être\nassurés.\nArticle UC.4. Conditions de desserte des terrains par\nles réseaux publics d'eau, d'assainissement, de\ncommunication, d’énergie et de collecte des déchets\n4.1. Alimentation en eau potable\nToute construction ou installation qui, par sa destination, implique une utilisation d'eau\npotable, doit être obligatoirement alimentée par un branchement sur le réseau public d'eau\npotable.\n    5\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UC\n4.2. Assainissement\n4.2.1. Eaux usées\nLe branchement sur le réseau public d'assainissement est obligatoire pour toute\nconstruction ou installation engendrant des eaux usées. Toute évacuation dans les fossés\net cours d'eau est interdite.\nLe rejet dans le réseau public des eaux résiduaires industrielles pourra être soumis à des\nconditions particulières et devra notamment être soumis à un prétraitement.\n4.2.2. Eaux pluviales\nLes aménagements réalisés sur une unité foncière* ne doivent pas faire obstacle au libre\nécoulement des eaux pluviales (articles 640 et 641 du Code Civil).\nPour toute construction nouvelle, reconstruction ou réhabilitation, et quelle que soit la taille\nde l’unité foncière concernée, le rejet des eaux pluviales dans le réseau d'assainissement\ndevra respecter le règlement d’assainissement intercommunal de l’Etablissement Public\nTerritorial Paris Ouest La Défense.\nDans le cas où les caractéristiques de l’unité foncière ne permettent pas d'assurer une\nrétention naturelle d'eau suffisante, doivent être prévus des dispositifs de rétention\ncomplémentaires aux possibilités du réseau et utilisant des techniques alternatives.\nLes eaux de lessivage des parcs de stationnement, chaussées, aires de services, de\nmanœuvre ou d'activités, doivent faire l'objet de prétraitement avant déversement dans le\nréseau public (dessablage, déshuilage, séparateur d’hydrocarbures,…).\n4.3. Réseau public de communications\nLes constructions ou installations nouvelles devront comporter les infrastructures\nnécessaires à leur branchement sur les réseaux de communication existants ou projetés :\n • Les réseaux traditionnels publics (téléphone, télex, liaisons spécialisées ...).\n • Les réseaux câblés de radiotélévision publics.\n • Les antennes d’émission ou de réception de signaux radioélectriques (antennes,\n   paraboles…) devront être installées sur les toitures de la façon la moins visible possible\n   depuis l’espace public.\n4.4. Collecte des déchets\n4.4.1. Dispositions générales\nLes constructions nouvelles doivent comporter des locaux de stockage des déchets,\nsuffisamment dimensionnés de manière à recevoir et permettre de manipuler sans\ndifficultés tous les récipients nécessaires à la collecte sélective des déchets.\nCes locaux seront isolés et fermés.\n    6\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UC\n4.4.2. Dispositions spécifiques suivant la ou les destinations des\nconstructions\n•   Pour les constructions nouvelles à destination d’habitation*, ces locaux doivent être\n    situés au rez-de-chaussée, à moins de 15 mètres de la voie ou de l’emprise publique et\n    satisfaire aux contraintes techniques de la collecte sélective en porte à porte.\n•   Pour les constructions nouvelles à destination autre que d’habitation, ces locaux\n    doivent être situés en rez-de-chaussée ou en sous-sol, mais préférentiellement en rez-\n    de-chaussée.\n•   En cas de mixité des destinations, ces locaux doivent répondre aux besoins de la\n    collecte sélective des déchets de chacune des destinations.\n4.4.3. Dispositions spécifiques à certaines constructions à destination\nd’habitation\nLes dispositions des articles 4.4.1. et 4.4.2. ne s’appliquent pas aux constructions\nnouvelles à destination d’habitation qui comportent moins de trois logements.\nCes dispositions ne s’appliquent pas non plus aux constructions dont la SDP est inférieure\nou égale à 50 m².\n4.4.4. Dispositions spécifiques aux travaux sur constructions\nexistantes\nLors de travaux accompagnés d’un changement de destination de l’ensemble de la\nconstruction, les dispositions des articles 4.4.1. et 4.4.2. s’appliquent. Cependant, elles\npourront être adaptées si les caractéristiques des constructions ou de l’unité foncière ne le\npermettent pas.\n4.5. Rappels : Energies renouvelables\nL’utilisation des énergies renouvelables pour l’approvisionnement énergétique des\nconstructions sera privilégiée.\n4.5.1. Réseaux de distribution de chaleur et de froid\nLorsqu’existent des périmètres de développement prioritaire, toute installation d’un\nbâtiment neuf, ou faisant l’objet de travaux de rénovation importants, qu’il s’agisse\nd’installations industrielles ou d’installations de chauffage de locaux, de climatisation ou de\nproduction d’eau chaude, doit être raccordée au réseau concerné. L’exploitant du réseau\nd’énergie précisera les conditions de raccordement. Cette obligation de raccordement ne\nfait pas obstacle à l’utilisation d’installations de secours ou de complément.\n4.5.2. Alimentations pour véhicules rechargeables\nToute construction d’un immeuble d’habitation comportant au minimum 2 logements ou\nd’un bâtiment à destination de bureau* équipé de places de stationnement couvertes ou\n    7\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UC\nd’accès sécurisé doit doter une partie de ces places des gaines techniques, câblages et\ndispositifs de sécurité nécessaires à l’alimentation de prises de recharge pour les véhicules\nélectriques ou hybrides rechargeables et permettant un comptage individuel conformément\nau Code de la Construction et de l’Habitation.\nArticle UC.5. Superficie minimale des terrains\nconstructibles\nIl n’est pas fixé de règle.\nArticle UC.6. Implantation des constructions par\nrapport aux voies et emprises publiques\nLes constructions, saillies*, balcons et encorbellements* compris, doivent être implantées à\nl’intérieur des emprises constructibles A et B définies au document graphique n° 5.4\n« dispositions règlementaires applicables à la zone UC ».\nArticle UC.7. Implantation des constructions par\nrapport aux limites séparatives\nLes constructions, saillies*, balcons et encorbellements* compris, doivent être implantées à\nl’intérieur des emprises constructibles A et B définies au document graphique n° 5.4\n« dispositions règlementaires applicables à la zone UC ».\nArticle UC.8. Implantation des constructions les unes\npar rapport aux autres sur une même propriété\nLes constructions, saillies*, balcons et encorbellements* compris, doivent être implantées à\nl’intérieur des emprises constructibles A et B définies au document graphique n° 5.4\n« dispositions règlementaires applicables à la zone UC ».\n    8\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UC\nArticle UC.9. Emprise au sol des constructions*\n9.1. Dispositions générales\nLes constructions en superstructure doivent être édifiées à l’intérieur des emprises\nconstructibles A et B définies au document graphique n° 5.4 « dispositions règlementaires\napplicables à la zone UC ».\n9.2. Dispositions particulières\nSur l’espace concerné par la réalisation d’un porche, tel que figuré au document graphique\nn° 5.4 « dispositions règlementaires applicables à la zone UC », il n’y a pas d’emprise au\nsol.\n9.3. Rappel : Les constructions en infrastructure\nLes constructions en infrastructure peuvent s’étendre sous toute l’emprise des parcelles\ncadastrées en section H, n° 102 et n° 136 repérées au document graphique n° 5.4\n« dispositions règlementaires applicables à la zone UC ».\n    9\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UC\nArticle UC.10. Hauteur maximum des constructions\n10.1. Dispositions générales\n10.1.1. La hauteur maximum est mesurée à partir du terrain naturel* jusqu’au point le plus\nélevé du bâtiment (faîtage* ou l’acrotère*).\n10.1.2. La hauteur maximum des constructions est de 33 mètres, avec un maximum de 11\nniveaux (R*+10).\n10.1.3. Les façades du niveau R+10 doivent obligatoirement être implantées en retrait d’au\nmoins 3,50 mètres par rapport aux plans de façades passant par les pieds d’immeuble,\nétant exclus de ces plans les balcons, volumes habitables en encorbellement (bow-\nwindows…) et les loggias.\n10.1.4. La hauteur des rez-de-chaussée sur voie, mesurée entre le dessus du plancher bas\net le dessus du plancher supérieur, ne peut être inférieure à 3,50 mètres.\n10.1.5. 35 % de la superficie du plancher bas du dernier niveau doivent être traités en\nterrasses conformément à l’article UC.11.8.\n10.2. Dispositions particulières à l’emprise constructible A\nDans l’emprise constructible A, les constructions doivent respecter les retraits imposés à\nchaque niveau tel que figuré au document graphique n° 5.4 « dispositions règlementaires\napplicables à la zone UC », suivant légende « limite de terrasses sur parc ».\n10.3. Dispositions particulières à l’emprise constructible B\nDans l’emprise constructible B, les passages sous porche figurés au document graphique\nn° 5.4 « dispositions règlementaires applicables à la zone UC » ont une hauteur minimum\ncorrespondant à R+1.\n10.4. Césures* en partie supérieure d’immeuble\nPar ailleurs, les façades des constructions présentent en partie supérieure d’immeuble\ndeux césures soit de type 1, soit de type 2, sur toute la profondeur de la construction, telles\nque localisées au document graphique n° 5.4 « dispositions règlementaires applicables à la\nzone UC ».\n    10\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UC\nLa hauteur de la césure est fixée à :\n• Un niveau pour les césures de façade de type 1.\n• Deux niveaux pour les césures de façade de type 2.\nLa largeur de la césure est d’au moins 6 mètres.\n10. 5. Hauteur maximum des ouvrages et édicules autorisés à\nl’article UC 2.1.2.3.\nLes petits édicules, ouvrages techniques et aménagements liés aux accès et à l’occupation\nen sous-sol autorisés au paragraphe UC.2.1.2.3. à l’intérieur de l’emprise du parc public et\ndes emprises à végétaliser figurant au document graphiques n° 5.4 « dispositions\nrèglementaires applicables à la zone UC » ne peuvent excéder une hauteur de 4 mètres\ncomptée à partir du niveau fini de l’emprise concernée.\n10.6. Dépassements autorisés\nD’une manière générale, les éléments suivants peuvent dépasser la hauteur maximum\ndéfinie au paragraphe 10.1. :\n • Les garde-corps.\n • Les motifs ornementaux tels que frontons, sculptures etc... et les verrières éclairant les\n    surfaces de planchers inférieurs, ceci de façon ponctuelle.\n • Les ouvrages techniques tels que antennes, gaines de ventilation, souches de\n    cheminée, panneaux solaires thermiques ou photovoltaïques et autres capteurs\n    d’énergie et ouvrages de récupération d’eau… sous réserve d'être situés en retrait de\n    l'acrotère, et de manière à être le moins visible possible depuis le domaine public. Ce\n    retrait est au moins égal à la hauteur de l’ouvrage technique.\n • Les machineries d'ascenseurs : elles seront obligatoirement situées à l'intérieur des\n    bâtiments, la partie technique située en superstructure devant être limitée à 1,80 mètre\n    de hauteur et être située en retrait de la façade du dernier niveau.\n    11\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UC\nArticle UC.11. Aspect extérieur des constructions et\naménagement de leurs abords\n11.1. Dispositions générales\nTout projet peut être refusé ou n’être accordé que sous réserve de l’observation de\nprescriptions spéciales si les constructions, par leur architecture, leurs dimensions ou\nl’aspect extérieur des bâtiments ou ouvrages à édifier ou à modifier, sont de nature à porter\natteinte au caractère ou à l’intérêt des lieux avoisinants, aux sites, aux paysages naturels\nou urbains, ainsi qu’à la conservation des perspectives monumentales, notamment pour les\nplus remarquables (cf. document graphique n° 5.1).\n11.2. Cours anglaises\nLes cours anglaises sur voies et sur le parc public sont interdites pour les constructions à\ndestination d’habitation*.\n11.3. Matériaux, couleurs des façades, dispositifs liés au\ndéveloppement durable\nL’emploi à nu, en parement extérieur, de matériaux destinés à être recouverts est interdit.\nLe pavé de verre est interdit en rez-de-chaussée des façades sur rue.\nL’installation de dispositifs favorisant la retenue des eaux pluviales ou la production\nd’énergie renouvelable correspondant aux besoins de la consommation domestique des\noccupants de l’immeuble ou de la partie d’immeuble concerné est autorisée sous réserve\nde s’inscrire qualitativement dans la composition du bâtiment et de s’intégrer dans le\npaysage urbain.\n11.4. Pignons et locaux annexes\nLes murs pignons, mitoyens ou non, devront être traités en harmonie avec les façades\nprincipales.\nLes locaux annexes seront traités avec un soin égal à celui apporté aux constructions\nprincipales.\n11.5. Façades commerciales, enseignes\nOn entend par façade commerciale toute devanture établie dans un but commercial et\nentraînant la modification ou le recouvrement du gros œuvre.\n    12\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UC\nLes façades commerciales devront répondre aux conditions suivantes :\n • Les percements destinés à recevoir des vitrines devront être adaptés à l’architecture de\n   la construction concernée.\n • Lorsqu’un même commerce sera établi sur plusieurs constructions contiguës, les\n   percements des vitrines devront en respecter les limites séparatives.\n • Les vitrines ne pourront présenter de saillie* au delà de la limite de l’emprise\n   constructible figurant au document graphique n° 5.4 « dispositions règlementaires\n   applicables à la zone UC ».\nLe rez-de-chaussée des constructions nouvelles destiné à des commerces ou des services\ndevra comporter l’emplacement d’un bandeau destiné à recevoir leur enseigne.\nLa façade commerciale devra être séparée de façon visible des étages supérieurs en\ns’inspirant des systèmes traditionnels (corniches, retraits,…).\n11.6. Clôtures\nLes clôtures situées en bordure des voies et du parc public feront partie d’une composition\nd’ensemble.\nSur toutes les clôtures l'ajout d'écrans opaques est interdit; seul le doublage par des\nécrans ajourés est autorisé, ainsi qu’un doublage par des haies végétales ou des plantes\ngrimpantes.\n11.7. Fermeture de balcons et terrasses intermédiaires\nLa fermeture des balcons (sauf loggias) et des terrasses intermédiaires visibles depuis\nl’espace public est interdite.\n11.8. Toitures-terrasses\n11.8.1. Principes généraux\nLes toitures-terrasses de tout type devront être traitées avec autant de soin que les\nfaçades. Les étanchéités autoprotégées des toitures-terrasses ainsi que les protections par\ngravillons ne pourront être laissées apparentes.\nLa partie minérale sera traitée avec soin et constituée d’un revêtement soigné.\n11.8.2. Toitures-terrasses inaccessibles\nLes toitures-terrasses inaccessibles seront végétalisées à l’exception des parties occupées\npar les ouvrages techniques, verrières, capteurs d’énergie (panneaux solaires…)… Cette\nvégétalisation sera assurée par une solution technique de type traditionnel (végétalisation\nintensive* ou semi-intensive*avec apport de terre végétale*), ou par toute autre solution\nnon traditionnelle (végétalisation extensive* comportant une couche végétale couvre-sols\nsur substrats…).Lorsqu’il y a utilisation de substrats, ceux-ci devront comporter une\népaisseur minimum de 11 centimètres.\n    13\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UC\nCette végétalisation devra également être réalisée en cas de réhabilitation lourde ou de la\nréfection de la toiture d’un bâtiment existant qui n’en n’aurait pas bénéficié lors de sa\nconstruction. Dans ce cas l’épaisseur de substrat imposée ci-dessus pourra être ajustée\naux contraintes techniques de l’existant\nCette végétalisation devra être maintenue lors d’une réfection de la toiture.\n11.8.3. Toitures-terrasses accessibles\nEn dehors des parties occupées par les circulations nécessaires aux usagers et les\nespaces voués aux loisirs, les terrasses accessibles devront être paysagées* et recevoir\nune végétalisation intensive*, semi-intensive* ou extensive*.\n11.9. Prescriptions relatives à l’aspect extérieur des\nconstructions\nLes ouvrages tels que groupes électrogènes, ouvrages de climatisation des constructions\nnouvelles etc., seront situés à l’intérieur des constructions.\nLes édicules affectés aux machineries d’ascenseurs et aux sorties d’escaliers, lorsqu’ils ne\nseront pas intégrés dans le volume du dernier étage, seront traités avec le même matériau\nque les façades et intégrés à l’aménagement d’ensemble de la toiture-terrasse.\nLes réseaux techniques en toiture ou en terrasse tels que la ventilation mécanique\ncontrôlée, les ventilations diverses, seront, sauf impossibilité technique avérée, camouflés\npar un revêtement identique à la façade ou s’harmonisant avec elle. Les ouvrages ou\nédicules techniques extérieurs au bâtiment et situés en rez-de-chaussée, ainsi que les\nventilations des sous-sols non situées en toiture devront être traités avec soin et\ns’harmoniser avec les façades tant en ce qui concerne la nature des matériaux que leur\ncouleur.\nLes évacuations d’eaux pluviales correspondant aux loggias et aux balcons pleins devront\nêtre intégrées à l’intérieur des bâtiments, être situées en fond de loggia, être encastrées\ndans la façade ou être placées en limites séparatives* d’immeubles.\nLes antennes d’émission ou de réception de signaux radioélectriques (antennes,\nparaboles,…) devront être install
