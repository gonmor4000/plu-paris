 applicables en zone UPE\nTitre III – Lexique", "", "Titre I – Dispositions générales", "", "Le présent règlement est établi conformément aux dispositions de l’article L. 123-1 du\nCode de l'urbanisme.\nNota : Conformément à l’article 12 IV du Décret n°2015-1783 du 28 décembre 2015 relatif à la partie\nréglementaire du livre Ier du Code de l’Urbanisme et à la modernisation du contenu du plan local\nd’urbanisme, le contenu modernisé du P.L.U. ne s’applique qu’aux P.L.U. élaborés ou faisant l’objet d’une\nrévision générale postérieurement au 1er janvier 2016. Les P.L.U. dont le contenu est issu des\ndispositions en vigueur avant la réforme et qui font l’objet de procédures de modification, de mise en\ncompatibilité ou de révision allégée (lancées avant ou après le 1er janvier 2016) continuent à appliquer\nles dispositions des articles réglementaires en vigueur au 31 décembre 2015 jusqu’à leur prochaine\nrévision générale.\nLa Commune de Levallois a lancé une procédure de modification du P.L.U. le 18 décembre 2015. Le P.L.U.\ncontinue ainsi d’appliquer les dispositions règlementaires en vigueur au 31 décembre 2015.\nPour conserver la cohérence entre les articles réglementaires et législatifs du Code de l’Urbanisme, le\nP.L.U. continue également d’appliquer les dispositions de la partie législative du Code de l’Urbanisme\navant recodification à droit constant par l’Ordonnance n°2015-1174 du 23 septembre 2015.\nUn tableau de concordance des articles du Code de l’Urbanisme est annexé à l’additif au rapport de\nprésentation.\nArticle 1. Champ d'application territorial du Plan Local\nd'Urbanisme\nLe présent règlement s'applique à l’ensemble du territoire de la commune.\nArticle 2. Portée respective du règlement à l’égard\nd’autre législations relatives à l’occupation des sols\nSont et demeurent notamment applicables au territoire couvert par le présent plan local\nd’urbanisme :\n2.1. Les articles suivants du Code de l'urbanisme :\n  •    R.111-2 : salubrité et sécurité publique.\n  •    R.111-4 : conservation et mise en valeur d’un site ou de vestiges archéologiques.\n  •    R.111-15 : respect des préoccupations d’environnement.\n  •    R.111-21 : respect des sites, paysages naturels ou urbains et conservation des\n    perspectives monumentales.\n2.2. Les servitudes d'utilité publique instituant une limitation administrative au droit de\npropriété et décrites aux documents « servitudes d'utilité publique », pièce n° 6.1.1 « liste\net plans des servitudes d’utilité publique » au dossier « Annexes », pièce n° 6 du présent\ndossier de plan local d’urbanisme.\n2.3. Les articles du Code de l'urbanisme ou d'autres législations concernant s’il y a lieu :\n    1\n    PLU Levallois-Perret – Modification n°1 du PLU\n    Pièce n°4.1. Règlement", " •    Les périmètres à l'intérieur desquels l’autorité compétente peut surseoir à statuer\n    sur les demandes d’autorisation en application de l’article L. 111-10 du Code de\n    l’urbanisme,\n •    Les zones à l’intérieur desquelles la démolition des immeubles est soumise à la\n    délivrance d’un permis de démolir, pièce n° 6.2.3 du dossier Annexes, pièce n° 6 du\n    présent dossier de plan local d’urbanisme.\n •    Les périmètres à l’intérieur desquels est appliqué le droit de préemption urbain\n   (L. 211-1), pièce n° 6.2.3 du dossier Annexes, pièce n° 6 du présent dossier de plan\n   local d’urbanisme.\n •    Les périmètres des secteurs situés au voisinage des infrastructures de transports\n   terrestres classées par l’arrêté préfectoral du 29 juin 2000, à l’intérieur desquels les\n   constructions nouvelles à destination d’habitation et les établissements d’enseignement\n   devront répondre aux normes d’isolement acoustique conformément aux arrêtés du 30\n   mai 1996 et du 9 janvier 1995 lorsque leurs façades sont exposées, pièce n° 6.2.2 du\n   dossier Annexes, pièce n° 6 du présent dossier de plan local d’urbanisme.\n •    Le Plan de Prévention des Risques d’Inondation de la Seine dans les Hauts de\n   Seine (PPRI), approuvé par arrêté préfectoral du 9 janvier 2004, pièce n° 6.1.2 du\n   dossier Annexes, pièce n° 6 du présent dossier de plan local d’urbanisme.\n2.4. Le Schéma Directeur de la Région Ile de France (SDRIF) approuvé le 27 décembre\n2013.\nArticle 3. Division du territoire en zones\n3.1. Le territoire couvert par le présent Plan Local d’Urbanisme est divisé en 11 zones\nurbaines (U) dont les délimitations sont reportées au document graphique intitulé « zonage\net servitudes » (pièce n° 5.1. du dossier). Certaines des règles applicables dans chaque\nzone et détaillées aux articles 6 et 10 des règlements de zones (Chapitre 1 à 11 du titre II\ndu présent règlement), sont également représentées graphiquement dans un document\nintitulé « plan des hauteurs et des gabarits » (pièce n° 5.2.du dossier).\nCes zones disposent de servitudes instaurées en application des articles L. 123-2 et\nL. 123-3 du Code de l’urbanisme ainsi que d’emplacements réservés au titre de l’article\nL. 123-1-5. V de ce même code ainsi que d’espaces boisés classés reproduits sur le\ndocument graphique intitulé « zonage et servitudes » (pièce n° 5.1. du dossier).\nCes servitudes sont détaillées dans les « annexes au règlement» constituant la pièce\nn° 4.2.1.\nCes zones sont également concernées par des éléments de paysage à protéger ou à\nmettre en valeur au titre de l’article L. 123-1-5. III 2° du Code de l’urbanisme répertoriés\ndans les « annexes au règlement» constituant la pièce n°4.2.2.\nIl n’existe pas de zone naturelle ou non équipée ni de zone à urbaniser ou agricole.\n3.2. Les zones urbaines auxquelles s’appliquent les dispositions du titre II du présent\nrèglement sont :\n  •    La zone UA décrite au chapitre 1 du titre II du présent règlement et dont certaines\n    parties sont couvertes par un secteur spécifique UAa, ainsi que des secteurs de plan\n    masse UPM.\n  •    La zone UB décrite au chapitre 2 du titre II du présent règlement.\n    2\n    PLU Levallois-Perret – Modification n°1 du PLU\n    Pièce n°4.1. Règlement", " •    La zone UC décrite au chapitre 3 du titre II du présent règlement.\n •    La zone UD décrite au chapitre 4 du titre II du présent règlement, et dont certaines\n   parties sont couvertes par un secteur spécifique UDa.\n •    La zone UE décrite au chapitre 5 du titre II du présent règlement.\n •    La zone UG décrite au chapitre 6 du titre II du présent règlement.\n •    La zone UPA décrite au chapitre 7 du titre II du présent règlement.\n •    La zone UPB décrite au chapitre 8 du titre II du présent règlement.\n •    La zone UPC décrite au chapitre 9 du titre II du présent règlement.\n •    La zone UPD décrite au chapitre 10 du titre II du présent règlement.\n •    La zone UPE décrite au chapitre 11 du titre II du présent règlement.\n3.3. Le titre III du présent règlement intègre un lexique donnant la définition d’un certain\nnombre de termes utilisés dans le règlement.\n3.4. Le caractère et la vocation de chacune de ces zones sont définis en tête du chapitre\nqui lui correspond et sont extraits du rapport de présentation.\nChaque chapitre comporte un corps de règles en trois sections et quatorze articles.\nArticle 4. Adaptations mineures\nConformément aux dispositions de l’article L. 123-1-9 du Code de l’urbanisme « Les règles\net servitudes définies par un plan local d'urbanisme ne peuvent faire l'objet d'aucune\ndérogation, à l'exception des adaptations mineures rendues nécessaires par la nature du\nsol, la configuration des parcelles ou le caractère des constructions avoisinantes.»\nArticle 5. Dérogations\nCependant, conformément aux dispositions de l’article L. 123-5 du Code de l’urbanisme,\nl’autorité compétente pour délivrer l’autorisation peut, par décision motivée, accorder des\ndérogations à une ou plusieurs règles du plan local de l’urbanisme pour permettre :\n    1° La reconstruction de bâtiments détruits ou endommagés à la suite d’une\n    catastrophe naturelle survenue depuis moins d’un an, lorsque les prescriptions\n    imposées aux constructeurs en vue d’assurer la sécurité des biens et des\n    personnes sont contraires à ces règles ;\n    2° La restauration ou la reconstruction d'immeubles protégés au titre de la\n    législation sur les monuments historiques, lorsque les contraintes architecturales\n    propres à ces immeubles sont contraires à ces règles ;\n    3° Des travaux nécessaires à l'accessibilité des personnes handicapées à un\n    logement existant.\nArticle 6. Autorisations particulières\nEnfin, lorsqu’un immeuble bâti existant régulièrement édifié n’est pas conforme aux règles\nédictées par le règlement applicable à la zone dans laquelle il se situe, l’autorisation\n    3\n    PLU Levallois-Perret – Modification n°1 du PLU\n    Pièce n°4.1. Règlement", "d’exécuter des travaux peut être accordée pour des travaux qui ont pour objet d’améliorer\nla conformité de ces immeubles avec lesdites règles ou qui sont sans effet à leur égard.\nArticle 7. Lexique\nLes termes repérés par un astérisque dans le corps du règlement sont définis dans le titre\nIII du présent document.\n    4\n    PLU Levallois-Perret – Modification n°1 du PLU\n    Pièce n°4.1. Règlement", "Titre II – Dispositions applicables\n    aux zones urbaines", "", "    ZONE UA\nChapitre I\nDispositions    applicables    en\nzone UA\n« La zone UA correspond au tissu urbain ancien de Levallois, rénové sur certains îlots par\ndes opérations d'aménagement aujourd'hui achevées (ZAC Trézel-Briand, ZAC du Front\nde Paris, ZAC Victor Hugo…).\nCette zone, qui couvre une grande partie du territoire communal, est caractérisée par une\ntrès forte mixité des fonctions urbaines : habitation*, commerce et artisanat*, bureaux*,\néquipements…\nLe règlement de la zone UA conforte cette mixité urbaine, tout en favorisant l'accueil de\nlogements neufs, notamment au travers d'une certaine limitation des destinations bureau,\ncommerce et artisanat, sauf dans le secteur UAa implanté le long d'axes bruyants et à\nproximité des transports en commun (métro, gare SNCF, bus).\nCette zone comprend des éléments de paysage bâtis ou végétaux qui font l'objet de\nprescriptions spécifiques pour leur protection ou leur mise en valeur conformément aux\ndispositions prévues par le Code de l’Urbanisme : « Les PLU peuvent identifier et localiser\nles éléments de paysage et délimiter les quartiers, îlots, immeubles, espaces publics,\nmonuments, sites et secteurs à protéger, à mettre en valeur ou à requalifier pour des motifs\nd'ordre culturel, historique ou écologique et définir, le cas échéant, les prescriptions de\nnature à assurer leur protection. »\nLa zone UA comprend trois secteurs de plan masse (UPM1, UPM2 et UPM3).\n    1\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\nSection 1\nNature de l'occupation et de l'utilisation\ndu sol\nArticle UA.1. Occupations et utilisations du sol\ninterdites\n1.1. Les constructions à destination d’entrepôt*.\n1.2. Les dépôts de ferrailles, de matériaux, de combustibles solides, ainsi que les\nentreprises de cassage de voitures et de transformation de matériaux de récupération.\n1.3. Les dépôts d'ordures ménagères, de résidus urbains ou de déchets de matériaux.\n1.4. Les carrières.\n1.5. Les installations classées soumises à la directive SEVESO, ou présentant des risques\ntechnologiques graves, ainsi que celles qui pourraient entraîner, pour le voisinage, une\ninsalubrité ou un sinistre susceptible de causer des dommages graves ou irréparables aux\npersonnes et/ou aux biens.\n1.6. Le stationnement des caravanes isolées, de résidences mobiles de loisirs,\nd’habitations légères de loisirs, l'ouverture de terrains de camping ou de caravanes.\n1.7. Dans les marges vertes* repérées au document graphique n° 5.1 « zonage et\nservitudes», toutes constructions et installations nouvelles de toute nature et destination,\nen superstructure et infrastructure, à l’exception de celles autorisées à l’article\nUA.2.1.1.2.5.\n    2\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\nArticle UA.2. Occupations et utilisations du sol\nsoumises à des conditions particulières\n2.1. Les occupations et utilisations du sol suivantes ne sont\nadmises que si elles respectent les conditions ci-après\n2.1.1. Dans la zone UA\n2.1.1.1. Règles générales\nA l’exception de celles régies par l’article UA.1., les installations classées pour la protection\nde l’environnement sous réserve que leurs exigences de fonctionnement, lors de\nl’ouverture ou à terme, soient compatibles avec les infrastructures existantes, notamment\nles voiries et l’assainissement.\nLes affouillements et exhaussements de sol, à condition qu’ils soient liés à la réalisation\ndes occupations et utilisations du sol autorisées dans la zone.\n2.1.1.2. Règles spécifiques\n2.1.1.2.1. Dispositions applicables aux bureaux*, commerces, artisanats* et industries*\nLa création, par construction et/ou changement de destination, de surface de plancher\n(SDP*) destinée au bureau, au commerce, à l’industrie ou à l’artisanat, à condition d’être\nsituée en sous-sol, et/ou rez-de-chaussée et/ou premier étage.\n2.1.1.2.2.. Dispositions supplémentaires en faveur du commerce, de l’artisanat et du\nbureau\nSont autorisés la réhabilitation, l’extension, la surélévation et/ou le changement de\ndestination des constructions existantes déjà à destination de commerce, d’artisanat et de\nbureau, excédant l’implantation imposés à l’article 2.1.1.2.1., dès lors que ces travaux\nn’engendrent pas d’augmentation de SDP supérieure à 15% par rapport à la SDP existante\net que les parties en extension respectent les règles édictées aux articles UA3 à UA13.\nDans ce cas de figure, les dispositions de l’article UA10.3.1.2 relatives aux immeubles de\nbureaux dans le secteur UAa s’appliqueront.\n2.1.1.2.3.. Dispositions applicables à l’habitation*\nToute construction nouvelle ou tout changement de destination ayant pour effet de créer\nplus de cinq logements devra comporter un minimum de 65 % de logements de trois pièces\net plus. Cette disposition ne s’applique pas aux résidences ou foyers pour étudiants, pour\npersonnes âgées, aux logements-foyers, et aux foyers d’accueil pour personnes\nhandicapées.\n    3\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n2.1.1.2.4. Reconstructions à l’identique\nSous réserve du respect des dispositions du Plan de Prévention des Risques d’Inondation\nde la Seine dans les Hauts de Seine (PPRI) dont le plan et le règlement sont reportés dans\nles annexes du présent dossier (pièce n° 6.1.2.) :\n    • En cas de sinistre, est autorisée la reconstruction de locaux régulièrement édifiés\n    et détruits après sinistre depuis moins de dix ans, dès lors qu’elle ne modifie pas la\n    destination existante, et ne dépasse ni la SDP, ni le volume, ni l’implantation des\n    bâtiments ou parties de bâtiments existants avant le sinistre. Cette reconstruction\n    devra disposer du même nombre de places de stationnement existant avant\n    sinistre ou respecter les nouvelles dispositions de l’article UA.12.\n    • Hors cas de sinistres, est autorisée la reconstruction de locaux, régulièrement\n    édifiés, à destination de bureaux et démolis depuis moins de dix ans, dès lors\n    qu’elle ne dépasse ni la SDP, ni l’implantation, ni le volume existants avant\n    démolition.\n2.1.1.2.5. Dispositions applicables dans les marges vertes\nDans les marges vertes figurant au plan n° 5.1 « zonage et servitudes » et dans le secteur\nde plan de masse UPM1 :\n    • Tous travaux, à l’exception des travaux de surélévation, sur constructions et\n    installations, existantes dans les marges vertes, en superstructure ou\n    infrastructure, ainsi que les aménagements strictement nécessaires à leur\n    accessibilité, sécurité, hygiène, isolation phonique ou thermique.\n    • Les installations techniques nouvelles strictement nécessaires à l’accessibilité,\n    l’hygiène et la sécurité ainsi qu’au fonctionnement des services publics, l’isolation\n    phonique et thermique des constructions situées en dehors des marges vertes..\n2.1.1.2.6. Dispositions applicables dans les « Espaces verts*, plantations à réaliser »\nDans les secteurs de plan masse UPM1, UPM2 et UPM3 ainsi que dans le reste de la zone\nUA où figure au document graphique n° 5.1 « zonage et servitudes» la mention « Espaces\nverts, plantations à réaliser », sont admis le changement de destination, le percement de\nbaies*, la réhabilitation et l’extension limitée des constructions existantes, ainsi que la\nrequalification d’aire de stationnement existante si ces aménagements permettent de\nconserver les arbres existants et contribuent à favoriser l’emploi de matériaux perméables\npour les places de stationnement.\n2.1.1.2.7. Dispositions applicables dans les périmètres assujettis à certaines servitudes\nprévues par le code de l’urbanisme\nSur les unités foncières ou parties d’unités foncières, frappées de la servitude permettant\nde réserver des emplacements en vue de la réalisation de programmes de logements\ndevant respecter des objectifs de mixité sociale, tout programme de logements sera\nautorisé à condition de respecter le pourcentage de logements sociaux défini en annexe\ndes documents graphiques.\n2.1.2. Dans le secteur UAa\nEn outre, dans le secteur UAa, est autorisée la création de SDP par construction, ou\nchangement de destination, destinée au bureau, au commerce, à l’industrie ou à l’artisanat\nsans les restrictions édictées à l’article UA.2.1.1.2.1.\n    4\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n2.2. Rappels\nLes constructions nouvelles à usage d’habitation et les établissements d’enseignement\ndoivent répondre aux normes d’isolement acoustique conformément aux arrêtés\npréfectoraux du 30 mai 1996 et du 9 janvier 1995 lorsque leurs façades sont exposées au\nbruit des infrastructures de transport terrestres classées par l’arrêté préfectoral du 29 juin\n2000 (le classement figure dans les annexes en pièce n° 6.2.2 du présent dossier).\nDans les parties de zones repérées au Plan de Prévention des Risques d’Inondation de la\nSeine dans le Département des Hauts-de-Seine approuvé par l’arrêté Préfectoral du 9\njanvier 2004 (P.P.R.I. : pièces n° 6.1.2 du présent dossier), la nature de l’occupation et de\nl’utilisation du sol est subordonnée aux dispositions règlementaires dudit Plan de\nPrévention des Risques d’Inondation approuvé.\nDes secteurs ont été repérés en tant que « ensemble urbain et paysager à préserver et à\nmettre en valeur » au document graphique n° 5.1 « zonage et servitudes », grâce aux\ndispositions prévues par le code de l’urbanisme permettant à un PLU d’identifier et de\nlocaliser les éléments de paysage, à mettre en valeur ou à requalifier pour des motifs\nd'ordre culturel, historique ou écologique :\n    • Tous travaux ayant pour effet de détruire un élément de paysage végétal ou\n    minéral situé à l’intérieur de cet ensemble doivent faire l'objet d'une autorisation\n    préalable au titre des travaux, installations et aménagements conformément aux\n    dispositions prévues par le code de l'urbanisme.\n    • Toute destruction partielle ou totale d'un élément bâti localisé au document\n    graphique et identifié en annexe du présent règlement comme devant être\n    protégé, doit préalablement faire l'objet d'une demande de permis de démolir,\n    conformément aux dispositions prévues par le code de l'urbanisme.\n    5\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\nSection 2\nConditions de l'occupation du sol\nArticle UA.3. Conditions de desserte des terrains par\nles voies publiques ou privées et accès aux voies\nouvertes au public\n3.1. Conditions de desserte des unités foncières*\nPour être constructible, une unité foncière doit être desservie par une voie publique ou\nprivée en état de viabilité et dont les caractéristiques permettent de répondre aux\nexigences de la sécurité civile, de la lutte contre l'incendie et du ramassage des ordures\nménagères.\nToute création de voie de desserte devra présenter une largeur au moins égale à 3,50\nmètres.\n3.2. Accès aux voies ouvertes au public\nLorsque la situation d’une unité foncière permet d’accéder à plusieurs voies publiques ou\nprivées ouvertes au public, l’accès carrossable devra être réalisé sur la voie où la gêne\npour le piéton, l’usager des voies et la circulation est moindre.\n3.3. Parcours piétonniers (aménagements en faveur du piéton,\nliaisons piétonnes)\nLes liaisons piétonnes existantes ou à créer ainsi que les aménagements en faveur du\npiéton, figurant au document graphique n° 5.1 « zonage et servitudes » devront être\nassurés.\n    6\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\nArticle UA.4. Conditions de desserte des terrains par\nles réseaux publics d'eau, d'assainissement, de\ncommunication, d’énergie et de collecte des déchets\n4.1. Alimentation en eau potable\nToute construction ou installation qui, par sa destination, implique une utilisation d'eau\npotable, doit être obligatoirement alimentée par un branchement sur le réseau public d'eau\npotable.\n4.2. Assainissement\n4.2.1. Eaux usées\nLe branchement sur le réseau public d'assainissement est obligatoire pour toute\nconstruction ou installation engendrant des eaux usées. Toute évacuation dans les fossés\net cours d'eau est interdite.\nLe rejet dans le réseau public des eaux résiduaires industrielles pourra être soumis à des\nconditions particulières et devra notamment être soumis à un prétraitement.\n4.2.2. Eaux pluviales\nLes aménagements réalisés sur une unité foncière* ne doivent pas faire obstacle au libre\nécoulement des eaux pluviales (articles 640 et 641 du Code Civil).\nPour toute construction nouvelle, reconstruction ou réhabilitation, et quelle que soit la taille\nde l’unité foncière concernée, le rejet des eaux pluviales dans le réseau d'assainissement\ndevra respecter le règlement d’assainissement intercommunal de l’Etablissement Public\nTerritorial Paris Ouest La Défense.\nDans le cas où les caractéristiques de l’unité foncière ne permettent pas d'assurer une\nrétention naturelle d'eau suffisante, doivent être prévus des dispositifs de rétention\ncomplémentaires aux possibilités du réseau et utilisant des techniques alternatives.\nLes eaux de lessivage des parcs de stationnement, chaussées, aires de services, de\nmanœuvre ou d'activités, doivent faire l'objet de prétraitement avant déversement dans le\nréseau public (dessablage, déshuilage, séparateur d’hydrocarbures,…).\n    7\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n4.3. Réseau public de communications\nLes constructions ou installations nouvelles devront comporter les infrastructures\nnécessaires à leur branchement sur les réseaux de communication existants ou projetés :\n    • Les réseaux traditionnels publics (téléphone, télex, liaisons spécialisées ...).\n    • Les réseaux câblés de radiotélévision publics.\n    • Les antennes d’émission ou de réception de signaux radioélectriques (antennes,\n    paraboles…) devront être installées sur les toitures de la façon la moins visible\n    possible depuis l’espace public.\n4.4. Collecte des déchets\n4.4.1. Dispositions générales\nLes constructions nouvelles doivent comporter des locaux de stockage des déchets,\nsuffisamment dimensionnés de manière à recevoir et permettre de manipuler sans\ndifficultés tous les récipients nécessaires à la collecte sélective des déchets.\nCes locaux seront isolés et fermés.\n4.4.2. Dispositions spécifiques suivant la ou les destinations des\nconstructions\n    • Pour les constructions nouvelles à destination d’habitation*, ces locaux doivent\n    être situés au rez-de-chaussée, à moins de 15 mètres de la voie ou de l’emprise\n    publique et satisfaire aux contraintes techniques de la collecte sélective en porte à\n    porte.\n    • Pour les constructions nouvelles à destination autre que d’habitation, ces locaux\n    doivent être situés en rez-de-chaussée ou en sous-sol, mais préférentiellement en\n    rez-de-chaussée.\n    • En cas de mixité des destinations, ces locaux doivent répondre aux besoins de la\n    collecte sélective des déchets de chacune des destinations.\n4.4.3. Dispositions spécifiques à certaines constructions\nLes dispositions des articles 4.4.1 et 4.4.2. ne s’appliquent pas aux constructions nouvelles\nà destination d’habitation qui comportent moins de trois logements.\nCes dispositions ne s’appliquent pas non plus aux constructions dont la SDP est inférieure\nou égale à 50 m².\n    8\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n4.4.4. Dispositions spécifiques aux travaux sur constructions\nexistantes\nLors de travaux accompagnés d’un changement de destination de l’ensemble de la\nconstruction, les dispositions des articles 4.4.1. et 4.4.2. s’appliquent. Cependant, elles\npourront être adaptées si les caractéristiques des constructions ou de l’unité foncière ne le\npermettent pas.\n4.5. Rappels : Energies renouvelables\nL’utilisation des énergies renouvelables pour l’approvisionnement énergétique des\nconstructions sera privilégiée.\n4.5.1. Réseaux de distribution de chaleur et de froid\nLorsqu’existent des périmètres de développement prioritaire, toute installation d’un\nbâtiment neuf, ou faisant l’objet de travaux de rénovation importants, qu’il s’agisse\nd’installations industrielles ou d’installations de chauffage de locaux, de climatisation ou de\nproduction d’eau chaude, doit être raccordée au réseau concerné. L’exploitant du réseau\nd’énergie précisera les conditions de raccordement. Cette obligation de raccordement ne\nfait pas obstacle à l’utilisation d’installations de secours ou de complément.\n4.5.2. Alimentations pour véhicules rechargeables\nToute construction d’un immeuble d’habitation comportant au minimum 2 logements ou\nd’un bâtiment à destination de bureau* équipé de places de stationnement couvertes ou\nd’accès sécurisé doit doter une partie de ces places des gaines techniques, câblages et\ndispositifs de sécurité nécessaires à l’alimentation de prises de recharge pour les véhicules\nélectriques ou hybrides rechargeables et permettant un comptage individuel conformément\nau Code de la Construction et de l’Habitation.\nArticle UA.5. Superficie minimale des terrains\nconstructibles\nIl n’est pas fixé de règle.\nArticle UA.6. Implantation par rapport aux voies et\nemprises publiques\nNota :\nDans les secteurs de plan masse UPM1, UPM2 et UPM3, les prescriptions de l’article UA6\nsont remplacées par celles du document graphique relatif aux secteurs concernés tels que\njoints au présent règlement, à l’exception de certains articles indiqués sur les plans masse,\nqui continuent à s’appliquer.\n    9\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n6.1. Principe général d'implantation\nLes constructions nouvelles devront s'implanter à l'alignement*.\nToutefois, certains cas particuliers justifient une implantation en retrait pour assurer le\nverdissement des rues et espaces publics au moyen de retraits végétalisés imposés\n(UA.6.2. gestion des retraits végétalisés) et/ou présenter un raccordement ou une\nharmonisation avec les éventuels bâtiments implantés sur les fonds voisins (6.3. gestion\ndes raccordements).\n6.2. Implantation en retrait, gestion des retraits végétalisés\nimposés\nCes retraits seront obligatoirement végétalisés conformément à l'article UA.13.2.3.\nIls seront localisés en tenant compte des prescriptions de l’article UA.6.3.\nL'implantation en retrait est imposée sur tout ou partie de l’unité foncière* concernée dans\nles cas suivants.\n6.2.1. Unités foncières présentant un linéaire de façade sur rue\ninférieur à 25 mètres et/ou une profondeur inférieure ou égale à\n25 mètres par rapport à l'alignement\nS'il existe un ou des arbres* à moyen ou grand développement situés en bordure de rue ou\nd’emprise publique* et à moins de 4 mètres de l'alignement, un retrait sera imposé pour\nassurer la sauvegarde du ou des arbres, sauf si l'exiguïté ou la configuration de l’unité\nfoncière ou l'emplacement du ou des arbres empêchent de façon notoire sa constructibilité\nou son raccordement à un bâtiment sur fonds voisin (UA.6.3. gestion des raccordements).\nDans ce cas, le ou les arbres pourront être abattus et devront être remplacés selon les\nconditions prescrites aux paragraphes 13.3.1. ou 13.3.2. de l’article UA 13.\nLes arbres intéressants* mentionnés au document graphique n° 5.1 « zonage et\nservitudes» relèvent en outre de l'application du paragraphe 13.3.1. de l'article UA 13.\n6.2.2. Unités foncières présentant un linéaire de façade sur rue\nsupérieur ou égal à 25 mètres et inférieur à 45 mètres, ainsi qu'une\nprofondeur supérieure à 25 mètres par rapport à l'alignement\n6.2.2.1. Dimensions du retrait.\nLes constructions nouvelles devront s’implanter en retrait d'au moins 2,5 mètres par rapport\nà l'alignement et sur une distance d’au moins un tiers du linéaire de façade sur rue de\nl’unité foncière dans les cas suivants (cf. planche graphique ci-après) :\n    • L’unité foncière concernée est située en face d'une unité foncière présentant en\n    bord de rue des arbres à moyen ou grand développement (cf. cas a).\n    • L’unité foncière concernée est contigüe ou en face d'un espace vert public existant\n    ou projeté (cf. cas b).\n    10\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n    • L’unité foncière concernée est contigüe à une unité foncière comportant un ou des\n    arbres de moyen ou grand développement situés dans une bande de 4 mètres de\n    profondeur à partir de l'alignement et à moins de 10 mètres de la limite séparative*\n    commune de propriété (cf. cas c).\n6.2.2.2. Localisation du retrait\nAfin d'accroître le verdissement existant ou futur visible de la rue ou de l’emprise publique,\nla localisation de ce retrait sera imposée en limite séparative de propriété dans les cas b et\nc visés au 6.2.2.1.\n    11\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n6.2.3. Unités foncières présentant un linéaire de façade sur rue\nsupérieur ou égal à 45 mètres et une profondeur supérieure à\n25 mètres par rapport à l'alignement\n6.2.3.1. Dimensions du retrait (cf. planche graphique ci-après)\nLes constructions nouvelles devront être implantées en retrait d'au moins 4 mètres par\nrapport à l'alignement et :\n    • Lorsque le linéaire de façade sur rue de l’unité foncière est compris entre 45 et\n    60 mètres, le retrait de la construction sera imposé sur une distance d’au minimum\n    un tiers de ce linéaire (cas de figure a).\n    • Lorsque le linéaire de façade sur rue de l’unité foncière est supérieur à 60 mètres,\n    le retrait de la construction sera imposé sur une distance d’au minimum la moitié\n    de ce linéaire (cas de figure b).\n    12\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n6.2.3.2. Localisation du retrait\nAfin d'accroître le verdissement actuel ou futur visible de la rue, la localisation de ce retrait\nsera imposée (cf. planche graphique ci-après) en limite séparative latérale de propriété\ndans les cas suivants :\n    • L’unité foncière est contigüe à un espace vert public existant ou projeté (cf. cas a).\n    • L’unité foncière est contigüe à une unité foncière comportant des arbres de moyen\n    ou grand développement situés dans une bande de 4 mètres de profondeur\n    mesurée à partir de l'alignement et à moins de 10 mètres de la limite séparative\n    commune de propriété (cf. cas b).\n    13\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n6.2.4. Modalités pratiques d'application des articles 6.2.1., 6.2.2. et\n6.2.3.\n6.2.4.1. Pour les unités foncières d'angle\nLes linéaires de façade d’unité foncière à prendre en compte sont à considérer rue par rue,\nhors pans coupés imposés par le paragraphe 6.4.1. du présent article (cf. planche\ngraphique ci-après).\n6.2.4.2. Pour les unités foncières traversantes\nLes retraits s’imposent sur l'une et l'autre façade sur rue, sauf impossibilité de construire\ndue à la faible profondeur de l’unité foncière.\n    14\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n6.2.5. Dispositions particulières : non application des paragraphes\n6.2.1., 6.2.2. et 6.2.3.\n6.2.5.1. Dispositions particulières et non application des retraits végétalisés\nimposés\nPour des raisons de composition urbaine et architecturale, les dispositions des\nparagraphes 6.2.1., 6.2.2. et 6.2.3. du présent article ne s'appliquent pas à la rue Anatole\nFrance côté pair entre la rue Louise Michel et la rue Kléber ; à la rue du Président Wilson\nentre la rue Jean Jaurès et la rue Paul Vaillant Couturier ; à la rue et la place Henri\nBarbusse ; aux sections de rues bordant les jardins de l'Hôtel de Ville ; à la rue Jacques\nMazaud et aux places du Général Leclerc, Jean Zay, du Maréchal de Lattre de Tassigny,\nde la Libération et du 11 novembre 1918.\n6.2.5.2. Prescriptions concernant les marges de recul*\nLes dispositions des paragraphes 6.2.1., 6.2.2. et 6.2.3. du présent article ne s’appliquent\npas :\n    • Le long des parties de voies indiquées au document graphique n° 5.1 «zonage et\n    servitudes » comme faisant l'objet d'une « marge de recul ».\n    • A la marge de reculement située à la limite sud-ouest du parc de la Planchette.\nDans ces deux cas, les constructions devront s'implanter en limite de ladite marge ou en\nrecul de celle-ci.\n6.2.5.3. Prescriptions relatives aux marges vertes*\nLes dispositions des paragraphes 6.2.1., 6.2.2. et 6.2.3. du présent article ne s’appliquent\npas aux unités foncières frappées au document graphique n° 5.1 « zonage et servitudes »\npar une marge verte. Dans ce cas, les constructions devront s’implanter en limite de ladite\nmarge ou en retrait de celle-ci.\n6.3. Gestion des raccordements et harmonisation avec les\nbâtiments sur fonds voisins\nLes constructions nouvelles devront s’implanter à l’alignement, à l’exception des cas des\nparagraphes 6.2.5.2. (marges de recul), 6.2.5.3. (marges vertes), 6.2.2.2. et 6.2.3.2\n(retraits imposés).\nToutefois, le principe d’une implantation à l’alignement pourra être adapté, dans les cas\nsuivants (6.3.1., 6.3.2. et 6.3.3.), afin de présenter un raccordement et/ou une\nharmonisation avec les bâtiments voisins pérennes.\n    15\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n6.3.1. Dispositions applicables lorsque sur un ou plusieurs fonds\nvoisins existent des constructions implantées à l'alignement\n6.3.1.1 Les constructions sur fonds voisin sont implantées sur la limite\nséparative* commune avec l’unité foncière assiette du projet\nDans ce cas, les constructions nouvelles seront implantées, du côté concerné, à\nl'alignement.\nCependant, des retraits sont possibles, dès lors qu’ils respectent les prescriptions\nsuivantes.\n6.3.1.1.1. Les parties de façade situées à moins de 0,5 mètre des limites séparatives\naboutissant à la voie ou à l'emprise publique (limites séparatives latérales) seront\nimplantées à l'alignement.\nCes parties de façade pourront soit être à l’alignement strict, soit comporter des loggias,\ndes balcons ou des encorbellements* assurant la continuité du volume général de la\nconstruction nouvelle à la verticale de l'alignement (croquis a et b – cas 1 à 3 ci-après).\n    16\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n6.3.1.1.2. Les dispositions du paragraphe 6.3.1.1.1. pourront ne pas être appliquées :\n    • Aux aménagements et extensions des constructions existantes qui ne seraient pas\n    situées à l'alignement.\n    • Aux parties de façade situées à moins de 0,50 mètre des limites séparatives\n    latérales, lorsqu'elles sont situées au-dessus des héberges des immeubles voisins\n    situés à l'alignement et sur la limite séparative commune.\n    • Lorsqu'il existe sur l’unité foncière des arbres à moyen ou grand développement à\n    conserver situés en bordure de la voie et à proximité des limites séparatives, cas\n    visés aux paragraphes 6.2.1., 6.2.2., 6.2.3. du présent article.\n6.3.1.2. Les constructions sur fonds voisin sont implantées à distance de la\nlimite séparative commune avec l’unité foncière assiette du projet\nDans ce cas, les constructions nouvelles seront implantées, du côté concerné, à\nl'alignement.\n6.3.2. Dispositions applicables lorsque sur un ou plusieurs fonds\nvoisins existent des constructions implantées en retrait de l'alignement\n6.3.2.1. Les constructions sur fonds voisin sont implantées sur la limite\nséparative commune avec l’unité foncière assiette du projet\nDans ce cas, la construction sera implantée, du côté concerné :\n    • Soit à l'alignement et sous réserve de respecter les dispositions du paragraphe\n    7.3.1. de l’article UA.7 (croquis a).\n    17\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n    • Soit en observant un retrait par rapport à l'alignement qui n'excédera pas celui de\n    l'immeuble voisin et en respectant les dispositions du paragraphe 7.3.1. de l’article\n    UA. 7 (croquis b, c et e)\n    • Soit en opérant un décroché afin de se raccorder à l’immeuble sur fonds voisin et\n    en respectant les dispositions du paragraphe 7.3.1. de l’article UA.7 (croquis d et\n    f).\n6.3.2.2. Les constructions sur fonds voisin sont implantées en recul de la limite\nséparative commune avec l’unité foncière assiette du projet\nDans ce cas, la construction sera implantée, du côté concerné :\n    • Soit à l'alignement, en respectant les dispositions du paragraphe 7.3.3. de l’article\n    UA-7 (croquis g).\n    • Soit en retrait de l’alignement sans pouvoir excéder le retrait de l’immeuble sur\n    fonds voisins et en respectant les dispositions du paragraphe 7.3.3. de l’article UA-\n    7    (croquis h).\n    18\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n    19\nPLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n6.3.3. Lorsque sur le ou les fonds voisins, aucune construction\npérenne n’existe\nDans ce cas, la construction sera implantée, du côté concerné, à l’alignement.\n6.4. Dispositions particulières\n6.4.1. Angles de rues\nLes constructions nouvelles s'implantant à l'angle de deux voies devront observer un pan\ncoupé d'au moins 5 mètres de largeur, perpendiculaire à la bissectrice de l'angle des deux\nvoies ou de la voie et de l'emprise publique. Leur implantation se fera soit à l'alignement\nsoit en retrait de ce pan coupé. La dimension des saillies* au-dessus de ce pan coupé\nrelève du paragraphe 6.5. du présent article.\n    20\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n6.4.2. Unités foncières riveraines de la rue Paul Vaillant Couturier,\nsituées entre la rue du Parc et la rue des Marronniers et cadastrés sous\nles numéros J 30, J 31, et J 32.\nElles devront respecter une emprise de passage pour les piétons sous la forme d'une\ngalerie couverte présentant les caractéristiques suivantes :\n    • Avoir une largeur de 6 mètres mesurée à partir de la limite de l'emplacement\n    réservé    (pièce n° 4.2.1 « liste des emplacements réservés ») destiné à\n    l'élargissement de la rue (cf. planche graphique ci-après).\n    • Avoir une hauteur libre de 5,5 mètres sous poutres.\n    • Avoir des poteaux ou piliers de soutien situés dans une bande comprise entre\n    0,30 mètre et 1,3 mètre mesurée à partir de la limite de l'emplacement réservé\n    destiné à l'élargissement de la rue, afin de laisser un passage libre de 4,7 mètres\n    de largeur pour les piétons.\n    21\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n6.5. Saillies* et encorbellements*\nNOTA : Sur les voies départementales, le règlement de voirie départemental en vigueur\ns’applique.\n6.5.1. Saillies et encorbellements sur le domaine public communal,\ndéfinitions générales et dimensions\n6.5.1.1. Saillies (hors volumes habitables en encorbellements)\nLes saillies (balcons,…) sont autorisées en empiétement par rapport à l'alignement*.\nLeur définition englobe notamment les seuils, socles, soubassements, bandeaux,\ncorniches, appuis, encadrements, pilastres et nervures.\nLes saillies visées ci-dessus ne devront pas excéder une épaisseur de :\n    • 0,16 mètre jusqu’à 3 mètres au-dessus du trottoir.\n    • 0,22 mètre de 3 mètres à 4,30 mètres au-dessus du trottoir.\n    • 0,40 mètre au-dessus de 4,30 mètres au-dessus du trottoir dans les voies d’une\n    largeur inférieure à 10 mètres.\n    • 0,80 mètre au-dessus de 4,30 mètres au-dessus du trottoir dans les voies d’une\n    largeur supérieure ou égale à 10 mètres.\n    • En outre lorsqu’il s’agit exclusivement de balcons d’immeubles d’habitation : 1\n    mètre au-dessus de 4,30 mètres au-dessus du trottoir dans les voies d’une largeur\n    supérieure ou égale à 11,50 mètres.\nLes parties les plus saillantes des ouvrages ne devront toutefois pas se situer à moins de\n0,50 mètre d’un plan vertical passant par l’arête de la bordure du trottoir.\n6.5.1.2. Volumes habitables en encorbellement\n6.5.1.2.1. Quelle que soit la destination de la construction,\nLes volumes habitables, oriels et bow-windows construits en encorbellement sur\nl'alignement sont interdits dans les voies d'une largeur inférieure à 10 mètres entre les\nalignements.\nLorsqu’ils sont autorisés, les volumes habitables, oriels et bow-windows construits en\nencorbellements sur l’alignement ne devront pas excéder une épaisseur de :\n    • 0,16 mètre jusqu’à 3 mètres au-dessus du trottoir quelle que soit la largeur de la\n    voie.\n    • 0,22 mètre de 3 mètres à 4,30 mètres au-dessus du trottoir quelle que soit la\n    largeur de la voie.\n    • 0,60 mètre à partir d’une hauteur de 4,30 mètres au-dessus du trottoir dans les\n    voies d’une largeur supérieure ou égale à 10 mètres et inférieure à 11,50 mètres.\n    • 0,80 mètre à partir d’une hauteur de 4,30 mètres au-dessus du trottoir dans les\n    voies d’une largeur supérieure ou égale à 11,50 mètres.\n    22\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n6.5.1.2.2. Quelle que soit la destination de la construction, à l’exception des CINASPIC*,\nLa longueur totale de l'emprise des encorbellements ne peut excéder 50 % du linéaire de\nfaçade sur rue (cf. croquis ci-après).\nPour les unités foncières* situées à l’angle de deux voies, la longueur totale d’emprise des\nencorbellements imposée ci-dessus est de 50 % rue par rue. Le ou les pans coupés\nmentionnés au paragraphe 6.4.1. du présent article sont exclus de ce calcul et peuvent\nlibrement comporter des encorbellements si ceux-ci apportent une valorisation du\ntraitement architectural de l’angle du bâtiment.\nPour chaque encorbellement la longueur à prendre en compte sera la plus grande (cf.\ncroquis).\nLes éléments en encorbellement seront distants d'au moins 0,50 mètre des limites\nséparatives de l’unité foncière\n6.5.2. Saillies et encorbellements sur pan coupé\nLes saillies et encorbellements sur pan coupé obéiront aux mêmes dispositions que les\nsaillies et encorbellements sur le domaine public définis au paragraphe 6.5.1. du présent\narticle UA 6.\n6.5.3. Saillies et encorbellements sur les marges de recul* ou les\nmarges vertes* figurant au document graphique n° 5.1 « zonage et\nservitudes » et sur les retraits inférieurs ou égaux à 4 mètres de\nprofondeur définis aux paragraphes 6.2. et 6.3. du présent article\nLes saillies et encorbellements sur lesdits retraits obéiront aux mêmes dispositions que les\nsaillies et encorbellements sur le domaine public définis au paragraphe 6.5.1. du présent\narticle UA 6.\nCependant pour les immeubles d’habitation, l’épaisseur des saillies et volumes habitables\nen encorbellement et ce, quelle que soit la largeur de la voie, respectera les dimensions\nsuivantes :\nPour les balcons : 1,20 mètre à partir d’une hauteur de 4,30 m au-dessus du terrain\nnaturel,\nPour les volumes habitables, oriels et bow-windows : 0,80 m à partir d’une hauteur de 4,30\nm au-dessus du terrain naturel.\n    23\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n    24\nPLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\nArticle UA.7. Implantation des constructions par\nrapport aux limites séparatives\nNota :\n    • Dans les secteurs de plan masse UPM1, UPM2 et UPM3 les prescriptions de\n    l’article UA.7 sont remplacées par celles du document graphique relatif à ce\n    secteur tel que joint au présent règlement, à l’exception de certains articles\n    indiqués sur les documents graphiques des plans masse qui continuent à\n    s’appliquer.\n    • Pour l’article UA.7 (dont UPM1, UPM2 et UPM3), l’application des prospects\n    s’entend à partir du nu de la façade (saillies* exclues) et perpendiculairement.\n7.1. Cas général des constructions implantées dans la bande\nde 20 mètres (mesurée à partir de chaque alignement*, retraits\nimposés aux articles 6.2.2.2 et 6.2.3.2, marge de recul* ou\nmarge verte* imposées aux paragraphes 6.2.5.2. et 6.2.5.3. de\nl'article UA.6)\n7.1.1. Implantation par rapport aux limites séparatives* aboutissant aux\nvoies\n7.1.1.1. Dans la bande de 20 mètres définie ci-dessus, les constructions seront implantées\nsur les limites séparatives aboutissant aux voies, sur une profondeur minimum de 6\nmètres, mesurée à partir de l’alignement, des retraits imposés aux articles 6.2.2.2 et\n6.2.3.2, des marges de recul ou des marges vertes.\n7.1.1.2. Au-delà de ces 6 mètres, les constructions d’une hauteur inférieure ou égale à 7,50\nmètres (soit R+1) et 10 mètres pour les CINASPIC* pourront néanmoins s’éloigner de ces\nlimites séparatives d’une distance comptée horizontalement de tout point du nu de la\nfaçade au point de la limite qui en est le plus rapproché de :\n    • 6 mètres minimum en cas de baies principales*.\n    • 3 mètres minimum en l’absence de baie principale.\n7.1.1.3. Au-delà de ces 6 mètres, les constructions d’une hauteur supérieure à 7,50 mètres\npourront néanmoins s’éloigner de ces limites séparatives dans les conditions édictées à\nl’article 7.2.2.\n7.1.2. Par rapport aux autres limites séparatives (limites de fond), elles\nseront implantées\n    • Soit en limite séparative.\n    25\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n    • Soit comme il est dit au paragraphe 7.2. ci-après en matière d’implantation des\n    constructions au-delà de la bande des 20 mètres mesurée à partir de l’alignement,\n    marge de recul ou marge verte.\nLes constructions inférieures ou égales à 7,50 mètres de hauteur (10 mètres pour les\nCINASPIC) pourront bénéficier des dispositions de l’article 7.1.1.2. ci-dessus.\n7.1.3. Dispositions spécifiques aux constructions à destination\nprincipale d’habitation ou de CINASPIC sur des unités foncières* d’une\nprofondeur inférieure ou égale à 20 mètres mesurée à partir de\nl’alignement, des retraits imposés aux articles 6.2.2.2 et 6.2.3.2, des\nmarges de recul ou des marges vertes\n7.1.3.1. Les constructions s’implanteront sur les limites séparatives aboutissant aux voies\nsur une profondeur de 6 mètres minimum, mesurée à partir de l’alignement, des retraits\nimposés aux articles 6.2.2.2 et 6.2.3.2, des marges de recul ou des marges vertes.\n7.1.3.2. Au-delà de ces 6 mètres, les constructions seront implantées :\n    • Soit en limite séparative.\n    • Soit en recul de la limite séparative, de façon à ce que la distance comptée\n    horizontalement de tout point de la construction au point de la limite séparative qui\n    en est le plus rapproché soit au moins égale à\n    - 6 mètres minimum en cas de baie(s) principale(s).\n    - 4 mètres en cas de baie(s) secondaires(s) ou de mur ou partie de façade aveugle.\n    Cette distance est ramenée à 3 mètres pour les constructions dont la hauteur est\n    inférieure ou égale à 7,50 mètres (soit R + 1).\n7.1.3.3. Par rapport aux autres limites séparatives (limites de fond) pour l’implantation des\nconstructions, il sera fait application de l’article 7.1.3.2 ci-avant.\nEn outre, le 6ème et 7ème niveau des façades arrière seront respectivement en retrait de\n1,50 mètre minimum par rapport à l’étage inférieur. Les parties de façades qui abritent les\ncheminements verticaux de la construction (ascenseur, escalier, trémie et gaine …) ne sont\npas concernées par cette obligation de retrait.\n7.1.4. Dispositions spécifiques aux bâtiments situés à l’angle de deux\nvoies\nDans le cas du dépassement autorisé à l’article 10.5.3.2. pour un bâtiment situé à l’angle\nde deux voies, une distance de 8 mètres devra être respectée entre ce dépassement et\nchaque limite séparative latérale de propriété, dès lors que le dépassement comporte le\npercement de baies principales, et de 3 mètres dans les autres cas.\n7.2. Cas général des constructions implantées au-delà de la\nbande de 20 mètres définie au paragraphe 7.1.\n    26\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n7.2.1. Sur une hauteur inférieure ou égale de 7,50 mètres mesurée à\npartir du terrain naturel\nLes constructions seront implantées soit en limite séparative, soit en observant par rapport\nà celle-ci une marge de recul au moins égale à 6 mètres si la façade concernée comporte\ndes baies principales situées en regard de la limite séparative, ou au moins égale à\n3 mètres si elle n'en comporte pas.\n7.2.2. Au-dessus d'une hauteur de 7,50 mètres mesurée à partir du\nterrain naturel\nLes constructions devront être implantées de façon à ce que la distance comptée\nhorizontalement de tout point de la construction au point de la limite qui en est le plus\nrapproché soit au moins égale à la différence d'altitude entre ces deux points diminuée de\n8 mètres, sans pouvoir être inférieure à 8 mètres si la façade concernée comporte des\nbaies principales situées en regard de la limite séparative, ou au moins égale à 3 mètres si\nelle n'en comporte pas.\n7.2.3. Pour les CINASPIC\nLa hauteur de 7,50 mètres, fixée ci-dessus pour l’application des dispositions 7.2.1. et\n7.2.2., est de 10 mètres.\n7.2.4. Les constructions pourront toutefois s'implanter sur la seule\nlimite séparative aboutissant aux voies concernées si elles peuvent\ns'adosser à une construction pérenne existante sur le fonds voisin\nDans ce cas, les dimensions de la partie de la construction ne correspondant pas aux\ndispositions des paragraphes 7.2.1. et 7.2.2. ne devront pas excéder celles de l'immeuble\nvoisin ni la hauteur plafond définie à l'article UA-10.\n7.2.5. Continuité de cheminements\nL'implantation des constructions devra respecter la continuité de cheminement au sein des\nespaces libres suivant les dispositions du paragraphe 13.2.1.1.2) de l'article UA-13\nconcernant les unités foncières d'une superficie supérieure à 2 000 m².\n    27\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n    28\nPLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n7.3. Cas particuliers où les constructions implantées dans une bande\nde 20 mètres (mesurée à partir de chaque alignement, de la marge de\nrecul ou de la marge verte imposée à l’article UA6 –aux paragraphes\n6.2.5.2. et 6.2.5.3.) pourront ne pas respecter la règle générale\n7.3.1. Immeuble sur le fonds voisin, implanté en limite séparative et en\nretrait de l'alignement, de la marge de recul ou de la marge verte\nDans ce cas, la construction s’implantera :\n7.3.1.1. Soit sur la limite séparative commune aboutissant à la voie en respectant\nles dispositions du paragraphe 11.2.3. de l'article UA-11 concernant l'aspect des\nconstructions (croquis a)\n7.3.1.2. Soit en observant par rapport à cette limite, un recul qui respecte les\nconditions suivantes\n    • Lorsque le mur de la construction projetée située en regard de la limite séparative\n    est aveugle, la construction sera implantée en observant par rapport à cette limite\n    une distance au moins égale à 4 mètres (croquis b).\n    • Lorsque la façade ou partie de façade de la construction projetée située en regard\n    de la limite séparative comporte des baies, le nu de la façade de la construction\n    doit être implanté à au moins 4 mètres de cette limite (croquis b). De plus, ce recul\n    (l) est au moins égal à la largeur (n) de la façade ou de la partie de façade\n    comportant les baies mesurée à partir de l'alignement (croquis c et d).\n    29\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n7.3.2. Immeuble sur le fonds voisin, implanté en limite séparative et\nprésentant une épaisseur différente de la construction projetée\n7.3.2.1. Adossement à un immeuble existant sur le fonds voisin, moins épais\nLorsque sur le fonds voisin existe un immeuble dont l’épaisseur (« E » sur les croquis)\nmesurée à partir de l'alignement (de la marge de recul ou de la marge verte imposée aux\nparagraphes 6.2.5.2. et 6.2.5.3. de l'article UA-6) est moins grande que celle de la\nconstruction projetée, la construction projetée devra s’implanter :\n  a. Sur la limite séparative commune aboutissant à la voie, sans que le pignon de la\n    construction projetée dépasse de plus de 2 mètres le pignon de l'immeuble situé sur\n    le fonds voisin.\n    Ce dépassement est porté à 3 mètres lorsque l’unité foncière est encadrée sur\n    chaque fonds voisin par un immeuble existant moins épais que la construction\n    projetée, et que le linéaire sur rue de cette unité foncière est inférieur ou égal à douze\n    mètres.\n  b. En observant par rapport à la limite séparative commune aboutissant à la voie et sur\n    une profondeur au plus égale à la différence de profondeur entre les deux immeubles\n    (d ou d' sur le croquis), un recul (« l » sur les croquis) au moins égal à cette\n    différence de profondeur, sans pouvoir être inférieur à 4 mètres.\n    La façade située en regard de la limite séparative aboutissant à la voie ne devra alors\n    pas comporter de baies principales. Néanmoins, si les dispositions de l’article 7.2.2.\n    concernant les baies principales sont respectées, la dite façade pourra en comporter.\n    Ne sont pas assujetties à l’obligation de limitation de la profondeur et à l’obligation de\n recul visées aux alinéas a) et b) ci-dessus :\n    •   Les parties de construction faisant corps avec l’immeuble projeté et dont la\n    hauteur est inférieure ou égale à 7, 50 mètres (soit R+1) et 10 mètres pour\n    les CINASPIC, qui restent soumises à l’article 7.1.1.2.\n    •   Les unités foncières d’une profondeur inférieure ou égale à 20 mètres qui\n    restent soumises aux prescriptions de l’article 7.1.3.\n    PRINCIPE D’IMPLANTATION LORSQU’UN\n    IMMEUBLE SUR FONDS VOISIN PRESENTE\n    UNE PROFONDEUR REDUITE\n    30\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n7.3.2.2. Adossement à un immeuble existant sur le fonds voisin, plus épais\nLorsque sur le fonds voisin existe, en limite séparative, un immeuble dont la profondeur\nmesurée à partir de l'alignement ou de la marge de recul ou de la marge verte imposée aux\nparagraphes 6.2.5.2. et 6.2.5.3. de l'article UA-6 est plus grande que celle de la\nconstruction projetée, la construction projetée s’implantera :\n    • Sur la limite concernée\n    • Sur une profondeur correspondant au plus à celle de l'immeuble voisin, sans\n    pouvoir excéder 20 mètres d'épaisseur à partir de l'alignement (de la marge de\n    recul ou de la marge verte imposée aux paragraphes 6.2.5.2. et 6.2.5.3. de l'article\n    UA-6), avec une longueur de façade en retour au plus égale à 8 mètres ; ceci tout\n    en respectant les dispositions des paragraphes 7.1. et 7.2. du présent article,\n    relatives aux prospects (croquis 7.3.2.2.).\nDe surcroît, lorsque le terrain présente une superficie inférieure à 2 000 m², l'adossement\nde la construction sur 20 mètres de profondeur pourra atteindre la hauteur de l'immeuble\nvoisin, dans la limite de la hauteur plafond autorisée des constructions dans la zone,\nnonobstant les dispositions du paragraphe 10.3.1. de l'article UA-10.\n7.3.3. Immeuble existant sur fonds voisin implanté en recul de la limite\nséparative ou fonds voisin non construit ou avec une construction non\npérenne\nLorsque sur le fonds voisin existe un immeuble implanté en retrait de la limite séparative\ncommune aboutissant à la voie ou lorsque le fonds voisin n’est pas construit, la\nconstruction pourra être implantée :\n    • Soit sur la limite séparative commune aboutissant à la voie en respectant les\n    dispositions du paragraphe 11.2.3. de l'article UA-11 concernant l'aspect des\n    constructions (croquis 7.3.3.a).\n    31\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n    • Soit en observant un recul par rapport à cette limite (« r » sur le croquis). Dans ce\n    cas, ce recul par rapport à la limite séparative respectera les dispositions\n    suivantes :\nLa distance du nu de la façade de la construction au point de la limite séparative qui en est\nle plus rapproché doit être au moins égale à la différence d’altitude entre ces deux points\ndiminuée de 8 mètres sans pouvoir être inférieure à 8 mètres.\n7.4. Cas particuliers des constructions implantées ou non dans\nune bande de 20 mètres (mesurée à partir de l’alignement, de la\nmarge de recul ou de la marge verte imposée à l’article UA-6\naux paragraphes 6.2.5.2. et 6.2.5.3.) : Courette sur le fonds\nvoisin\n7.4.1. Lorsqu'il existe sur le fonds voisin une courette répondant aux\ndeux caractéristiques suivantes\n    • Avoir pour seul éclairement latéral, son côté ouvert sur le fonds concerné par la\n    construction projetée.\n    32\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n    • Donner le jour à des baies principales,\nDans ce cas, et sans tenir compte de la profondeur visée aux articles 7.1.1.1. et 7.1.3.1., la\nconstruction projetée devra, à partir du niveau de la courette voisine :\n    • Soit respecter, par rapport à la limite séparative commune, un recul (« l » sur le\n    croquis a) d'au moins 4 mètres sur une profondeur (« m » sur le croquis a)\n    correspondant à la largeur de la courette, augmentée de la partie située entre la\n    limite de la courette et la façade arrière du bâtiment projeté. La façade située en\n    regard de la limite séparative commune ne devra alors pas comporter de baies\n    principales.\n    • Soit comporter une courette fermée, située en regard de la courette voisine, d'une\n    largeur d'au moins 4 mètres mesurée par rapport à la limite séparative commune\n    (« l » sur le croquis b), d'une profondeur (« m » sur le croquis b) au moins\n    équivalente à celle de la courette voisine avec un minimum de 4 mètres et ne\n    comportant aucune baie principale.\n7.4.2. Lorsqu'il existe sur le fonds voisin une ou plusieurs baies\nouvrant directement en limite séparative de propriété\nIl pourra alors être fait application des mesures ci-dessus autorisées pour les courettes.\n    33\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n7.5. Dispositions spécifiques aux constructions existantes\n7.5.1. Percement de baies sur constructions existantes\nQuelle que soit la hauteur du bâtiment existant, le percement de baies est autorisé sous\nréserve que la distance mesurée perpendiculairement entre la limite séparative et la façade\n(ou partie de la façade) concernée par ce percement soit au moins égale à 6 mètres.\nPour les constructions (ou partie de construction) n’excédant pas 11 mètres de hauteur,\nmesurée à partir du terrain naturel, cette distance est ramenée à 3 mètres pour les baies\nsecondaires.\n7.5.2. Surélévations et extensions\n7.5.2.1. Constructions d’une hauteur inférieure ou égale à 7,5 mètres mesurés à\npartir du terrain naturel\nLes surélévations et extensions de constructions ou parties de constructions existantes\npourront bénéficier de l'ensemble des dispositions du paragraphe 7.5.1. de l’article UA-7 en\ncas de percement de baie.\n7.5.2.2. Constructions d’une hauteur supérieure à 7,5 mètres mesurés à partir du\nterrain naturel\n• Les surélévations et extensions des constructions dont la hauteur est supérieure à\n  7,50 mètres mesurés à partir du terrain naturel respecteront les dispositions des articles\n  7.1. et 7.2. Toutefois, il n’est pas exigé de profondeur minimum d’implantation sur les\n  limites séparatives telle que mentionnée aux articles 7.1.1.1. et 7.1.3.1., les distances\n  d’éloignement sont celles édictées aux articles 7.1.1.3 et 7.1.3.2.\n   Cependant les constructions implantées à l’alignement ou en retrait d’une voie ou\n   emprise publique pourront ne pas respecter ces dispositions pour des travaux de\n   redressement de la toiture à faible pente d’une construction existante sous réserve que :\n    - Ce redressement soit réservé à la destination habitation,\n    - La pente maximum de ce redressement s’inscrive dans une oblique de pente 2/1\n    (63° par rapport à l’horizontale), dans le respect de l'article 10.8.\n    - La hauteur entre le plancher (ou l’entrait) du comble et son faîtage ou acrotère\n    n’excède pas 3,50 mètres et reste comprise dans la hauteur plafond figurant au\n    document graphique n° 5.2, dans le respect de l'article 10.8\n   Dans ces conditions, la distance mesurée perpendiculairement entre la limite séparative\n   et la façade ou partie de la façade concernée par cette surélévation sera au moins égale\n   à 6 mètres si le comble comporte des baies et 1,90 mètre s’il n’en comporte pas.\n• Les constructions implantées à l’alignement ou en retrait d’une voie ou emprise publique\n  dans une bande de 20 mètres (mesurée à partir de chaque alignement*, marge de\n  recul* ou marge verte* imposées aux paragraphes 6.2.5.2. et 6.2.5.3. de l'article UA.6)\n  pourront ne pas respecter les dispositions des articles 7.1. et 7.2 pour des travaux de\n    34\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n    construction de volumes comportant un accès à la toiture terrasse existante d’un\n    immeuble sous réserve de respecter les dispositions de l’article 10.5.1.6°.\n7.5.2.3. Travaux et aménagements en faveur de la salubrité, de l’accessibilité et\nde l’isolation des bâtiments\n•    Lorsque la réhabilitation d’un bâtiment existant destiné à l’habitation comporte la\n    création d’un ascenseur, ou d’un local vélo dans un immeuble de plus de 2 logements,\n    qu’il serait techniquement impossible de réaliser dans le volume de la construction,\n    ceux-ci pourront être implantés à l’extérieur de la construction soit sur limites\n    séparatives soit en recul des limites séparatives à une distance d’au moins 1,5 mètre.\n•    Est également librement autorisée dans les cours d’immeubles existants\n  l’implantation de locaux d’ordures ménagères fermés, dès lors qu’il est impossible de les\n  intégrer à l’intérieur du bâtiment, et sous réserve d’un traitement soigné de leur\n  apparence\n•    Les travaux sur les façades, murs pignons ou les toitures d’une construction\n  existante pour la mise en œuvre d'une isolation en saillie des façades ou d'un dispositif\n  de protection contre le rayonnement solaire et susceptibles d’excéder les prospects\n  définis aux articles 7.1. à 7.4.. ci-dessus sont autorisés dans la limite de 30 centimètres\n  par rapport à l’implantation (distance et gabarit) de la construction existante.\n7.5.3. Fermeture de balcons\nLa fermeture de balcons existants sera autorisée nonobstant les distances par rapport aux\nlimites séparatives imposées par l’article 7.1 et 7.2., sous réserve de respecter les\nprescriptions de l’article 11.2.1.\n7.6. Dépassement des prospects pour les ouvrages de faible\nemprise situés sur les terrasses ou les toitures (lucarnes,\nsouches de cheminées, éléments décoratifs...) ainsi que les\ngarde-corps\nUn tel dépassement des prospects pourra être autorisé à condition qu'il n'excède pas une\nhauteur de 1,80 mètre mesurée verticalement à partir des plans obliques composant les\nprospects définis aux paragraphes 7.1. à 7.5. de l’article UA.7.\n7.7. Cours communes\nLorsque la délivrance d’une autorisation d’urbanisme nécessite la création d’une servitude\nde cour commune, il sera fait application des dispositions de l’article UA.8.\n    35\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\nArticle UA.8. Implantation des constructions les unes\npar rapport aux autres sur une même propriété\nNota :\n    • Dans les secteurs de plan masse UPM1, UPM2 et UPM3 les prescriptions de\n    l’article UA.8. sont remplacées par celles du document graphique relatif aux\n    secteurs concernés tels que joints au présent règlement, à l’exception de certains\n    articles indiqués sur les documents graphiques des plans de masse qui continuent\n    à s’appliquer.\n    • Pour l’article UA.8 (dont UPM1, UPM2 et UPM3), l’application des prospects\n    s’entend à partir du nu de la façade (saillies* exclues) et perpendiculairement.\n8.1. Cas Général\n8.1.1. Lorsque les façades en vis-à-vis ne comportent ni l'une ni l'autre\nde baies principales*\nLa distance comptée horizontalement de tout point du nu de la façade d'une construction\nau point le plus proche du nu de la façade d'une autre construction doit être au moins égale\nà 6 mètres.\n8.1.2. Lorsque la façade la plus basse comporte des baies principales\nLa distance comptée horizontalement de tout point du nu de la façade de la construction la\nplus haute au point le plus proche du nu de la façade de la construction la plus basse, doit\nêtre :\n    • Au moins égale à la différence d'altitude entre ce point et le pied de cette façade la\n    plus basse diminué de 6 mètres.\n    • Au moins égale à 8 mètres.\n    36\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n8.1.3. Lorsque la façade la plus basse ne comporte pas de baies\nprincipales et que la façade la plus haute en comporte\nLa distance comptée horizontalement de tout point du nu de la façade de la construction la\nplus basse au point le plus proche du nu de la façade de la construction la plus haute doit\nêtre :\n    • Au moins égale à la différence d'altitude entre ce point et le pied de cette façade la\n    plus haute diminuée de 6 mètres,\n    • Au moins égale à 8 mètres.\n    37\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n8.1.4. Lorsque les façades en vis-à-vis de mêmes hauteurs comportent\nchacune des baies principales\nLa distance comptée horizontalement de tout point du nu de la façade d'une construction\nau point le plus proche du nu de la façade d'une autre construction doit être :\n    • Au moins égale à la différence d'altitude entre ce point et le pied de la façade qui\n    lui fait face diminuée de 6 mètres.\n    • Au moins égale à 8 mètres.\n8.2. Cas des unités foncières* inférieures ou égales à 2 000 m²\ncomportant des constructions à destination d’habitation* en\nvis-à-vis.\nLorsque les constructions ou partie de construction en vis-à-vis sont à destination\nd'habitation, les dispositions de l'alinéa 8.1.2. (cas où la façade la plus basse comporte des\nbaies principales) sont remplacées par les dispositions suivantes :\nLa distance comptée horizontalement de tout point du nu de la façade de la construction la\nplus haute au point le plus proche du nu de la façade de la construction la plus basse doit\nêtre :\n    • Au moins égale à la différence d'altitude entre ce point et le pied de cette façade la\n    plus basse diminuée de 8 mètres.\n    • Au moins égale à 8 mètres.\nLa règle ci-dessus s’applique lorsqu’un CINASPIC* occupe une partie d’un immeuble\nd’habitation.\n    38\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n8.3. Dispositions spécifiques aux CINASPIC\nIl n’est exigé aucune règle de distance pour des constructions entièrement destinées à un\nou plusieurs CINASPIC implantées sur une même unité foncière.\n8.4. Dispositions spécifiques, réservées aux constructions\nexistantes\nLes surélévations et extensions des constructions existantes respecteront les dispositions\ndes articles 8.1. et 8.2.\nToutefois, il sera fait application de dispositions spécifiques dans les cas énoncés aux\narticles suivants :\n8.4.1. Redressements de toitures des constructions existantes\nimplantées à l’alignement* ou en retrait d’une voie ou d’une emprise\npublique*\n• Pour des travaux de redressement de la toiture à faible pente d’une construction, la\n  distance mesurée perpendiculairement entre la façade (ou partie de façade) de la\n  construction concernée par cette surélévation et le pied de la construction lui faisant\n  face sera au moins égale à 6 mètres si cette dernière comporte des baies principales, 3\n  mètres si cette dernière ne comporte que des baies secondaires et 1,50 mètres si elle\n  n’en comporte pas ou s’il s’agit d’annexes (local d’ordures ménagères, local vélos…) et\n  sous réserve que :\n    - Ce redressement soit destiné à l’habitation.\n    - La pente maximum de ce redressement s’inscrive dans un oblique de pente 2/1\n    (63° par rapport à l’horizontal) dans le respect de l'article 10.8.\n    - La hauteur entre le plancher (ou l’entrait) du comble et son faîtage ou acrotère\n    n’excède pas 3,50 mètres dans le respect de l'article 10.8.\n8.4.2. Surélévations et extensions des constructions existantes en fond\nde parcelle\nLes surélévations et extensions d’une construction existante située en fond de parcelle et\nen vis-à-vis d’une autre construction existante sur la même unité foncière sont autorisées\nsous réserve que :\n    • Le bâtiment, une fois surélevé et/ou étendu, ne dépasse pas une hauteur de\n    7,50 mètres mesurée à partir du terrain naturel.\n    • Cette surélévation et/ou extension soit destinée à l’habitation.\n    • La distance la plus proche de cette surélévation et/ou extension au nu de la façade\n    ou partie de façade située en vis-à-vis soit au moins égale à 6 mètres.\n    39\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n8.4.3. Percement de baies d’une construction existante implantée en\nvis-à-vis d’une autre construction située sur la même unité foncière\nL’ouverture de baies est autorisée sous réserve que :\n    • La façade ou partie de façade comportant ces baies à créer soit située à 6 mètres\n    minimum du point le plus proche du nu de la façade de l’autre construction située\n    en vis-à-vis.\n    • La construction ou partie de construction objet du percement de baie soit destinée\n    à l’habitation.\n8.4.4. Aménagements techniques nécessaires aux constructions\nexistantes à destination principale d’habitation déjà situées en vis-à-vis\nsur une même unité foncière\nDans le cas de constructions existantes, lorsque la réalisation d’un ascenseur, d’un local\npour le stationnement des vélos ou d’un local d’ordures ménagères, serait techniquement\nimpossible dans le volume de la construction, ceux-ci pourront être réalisés à l’extérieur de\nla construction sans tenir compte des dispositions définies aux paragraphes 8.1. et 8.2. ci-\ndessus.\n8.4.5. Travaux d’isolation nécessaires aux constructions existantes\nLes travaux sur les façades, murs pignons ou les toitures d’une construction existante pour\nla mise en œuvre d'une isolation en saillie des façades ou d'un dispositif de protection\ncontre le rayonnement solaire et susceptibles d’excéder les prospects définis aux\nparagraphes 8.1. et 8.2. ci-dessus sont autorisés dans la limite de 30 centimètres par\nrapport à l’implantation (distance et gabarit) de la construction existante.\n8.4.6. Fermeture de balcons\nLa fermeture de balcons existants est autorisée sous réserve que les nouvelles baies\nrésultant de ces fermetures soient situées à 6 mètres minimum du point le plus proche du\nnu de la façade d’une autre construction située en vis-à-vis, et dans le respect des\nprescriptions de l’article 11.2.1.\n8.4.7. Volumes comportant un accès aux toitures-terrasses des\nconstructions existantes\nLes constructions implantées à l’alignement ou en retrait d’une voie ou emprise publique\ndans une bande de 20 mètres (mesurée à partir de chaque alignement*, marge de recul*\nou marge verte* imposées aux paragraphes 6.2.5.2. et 6.2.5.3. de l'article UA.6) pourront\nne pas respecter les dispositions des articles 8.1. et 8.2 pour des travaux de construction\nde volumes comportant un accès à la toiture terrasse existante d’un immeuble sous\nréserve de respecter les dispositions de l’article 10.5.1.6°.\n    40\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n8.5. Dépassements\nLes ouvrages de faible emprise situés sur les terrasses ou les toitures (lucarnes, souches\nde cheminées, éléments décoratifs, les ouvrages techniques de type capteurs d’énergie\ntels par exemple des panneaux solaires...) ainsi que les garde-corps pourront être\nautorisés à condition qu'ils n'excèdent pas une hauteur de 1,80 mètre, mesurée\nverticalement à partir des plans obliques composant les prospects définis aux paragraphes\n8.1., 8.2. et 8.4.1.ci-avant.\nArticle UA.9. Emprise au sol*\nNota :\nDans les secteurs de plan masse UPM1, UPM2 et UPM3 les prescriptions de l’article UA 9\nsont remplacées par celles du document graphique relatif aux secteurs concernés tels que\njoints au présent règlement.\n9.1. Constructions nouvelles\n9.1.1. Dispositions spécifiques aux immeubles d’habitation*\ncomportant en étages bas (1er étage et/ou rez-de-chaussée) des locaux\nà destination de bureaux* ou d’industrie*\nEn cas de réalisation d’un immeuble d’habitation comportant en étages bas des locaux à\ndestination de bureaux ou d’industrie, l’emprise en superstructure de ces derniers ne devra\npas excéder sur l’arrière de l’unité foncière* celle de l’immeuble d’habitation.\n9.1.2. Dispositions spécifiques aux immeubles d’habitation comportant\nen étages bas (1er étage et/ou rez-de-chaussée) des locaux à\ndestination de commerce ou d’artisanat*\nEn cas de construction d’un immeuble d’habitation comportant en étages bas des locaux à\ndestination de commerce ou d’artisanat, l’emprise en superstructure de ces derniers pourra\nexcéder celle de l’immeuble d’habitation jusqu’à 3 mètres sur l’arrière de l’unité foncière.\nNéanmoins ces locaux pourront s’étendre sur la totalité de l’unité foncière* :\n    • Sur les unités foncières situées en bordure des voies faisant l’objet de dispositions\n    spécifiques en faveur du commerce ou de l’artisanat repérées au document\n    graphique n° 5.1 « zonage et servitudes ».\n    • Sur les unités foncières dont la profondeur est inférieure à 15 mètres.\nLe traitement des toitures terrasses ainsi dégagées devra être conforme aux dispositions\ndu 11.2.8.2. de l’article UA 11.\n    41\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n9.2. Travaux sur constructions existantes\n9.2.1. Sont autorisés les aménagements et réhabilitations des locaux existants à\ndestination de bureau, industrie, commerce et/ou artisanat situés en étages bas et ne\nrespectant pas les emprises énoncées à l’article 9.1., dès lors que les travaux n’entraînent\naucune extension au sol.\n9.2.2. Toutefois :\n    • Le long des voies faisant l’objet de dispositions spécifiques en faveur du\n    commerce ou de l’artisanat repérées au document graphique n° 5.1 « zonage et\n    servitudes », les extensions au sol à destination de commerce ou d’artisanat sont\n    autorisées.\n    • Les aménagements et réhabilitations des locaux visés à l’article 9.2.1. sont\n    possibles sans limitation, dès lors qu’ils sont destinés aux services publics ou\n    d’intérêt collectif.\n    42\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\nArticle UA.10. Hauteur des constructions\nNota :\nDans les secteurs de plan masse UPM1, UPM2 et UPM3 les prescriptions de l’article UA\n10 sont remplacées par celles du document graphique relatif aux secteurs concernés tels\nque joints au présent règlement, à l’exception de certains articles indiqués sur les\ndocuments graphiques des plans de masse, qui continuent à s’appliquer\nPar ailleurs, la définition de la hauteur plafond du 10.2. s’applique également.\nPrincipe général\nLes constructions doivent respecter les gabarits enveloppes* et les hauteurs plafonds*\nfixés aux 10.1. et 10.2. ci-après.\n10.1. Gabarit enveloppe en bordure des voies et emprises\npubliques*, des marges de recul* ou des marges vertes*\nLes constructions devront s'inscrire dans les gabarits enveloppe indiqués au document\ngraphique n° 5.2 « hauteurs et gabarits ».\nIls sont de 5 types et sont définis selon les règles suivantes (voir croquis pour chaque cas\nde figure ci-après).\n10.1.1. Dispositions générales\n10.1.1.1. Le gabarit enveloppe 1 se compose successivement\n    • D'une verticale de hauteur (H) d’au maximum 16 mètres, dressée à l'aplomb de\n    l'alignement (ou de la marge de recul imposée en application de l’article UA-6 ou\n    de la marge verte).\n    • D'une oblique de pente 2/1 (63° par rapport à l'horizontale), élevée au sommet de\n    la verticale de hauteur H et limitée à 3 mètres au-dessus de ce sommet.\n    • D'une oblique de pente 1/1 (45° par rapport à l'horizontale), élevée au sommet de\n    la précédente oblique.\n    • La hauteur plafond sera de 22,50 mètres.\n    43\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n10.1.1.2. Le gabarit enveloppe 2 se compose successivement\n    • D'une verticale de hauteur (H) d’au maximum 18,50 mètres, dressée à l'aplomb de\n    l'alignement (ou de la marge de recul ou de la marge verte).\n    • D'une oblique de pente 2/1 (63° par rapport à l'horizontale) élevée au sommet de\n    la verticale de hauteur H.\n    • La hauteur plafond sera de 22,50 mètres.\n    44\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n10.1.1.3. Le gabarit enveloppe 3 se compose successivement\n    • D'une verticale de hauteur (H) d’au maximum 16 mètres, dressée à l'aplomb de\n    l'alignement (ou de la marge de recul ou de la marge verte).\n    • D'une oblique de pente 2/1 (63° par rapport à l'horizontale) élevée au sommet de\n    la verticale de hauteur H.\n    • La hauteur plafond sera de 19,50 mètres.\n    45\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UA\n10.1.1.4. Le gabarit enveloppe 4 se compose successivement\n    • D'une verticale de hauteur (H) d’au maximum 12,50 mètres, dressée à l'aplomb de\n    l'alignement (ou de la marge de recul ou de la marge verte).\n    • D'une oblique de pente 2/1 (63° par rapport à l'horizontale), élevée au sommet de\n    la verticale de hauteur H et limitée à 3 mètres au-dessus de ce sommet.\n    • D'une oblique de pente 1/1 (45° par rapport à l'horizontale), élevée au sommet de\n    la précéde
