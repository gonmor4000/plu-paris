atrimoine architectural », annexé au présent\nrèglement, présentent les caractéristiques principales du bâtiment, son historique et des\néléments spécifiques d’intérêt.\nLe cas échéant des mesures de vigilance ou des orientations spécifiques au bâtiment\nconcerné sont édictées (« mesures spécifiques de protection »). Elles doivent absolument\nêtre prises en compte dans le cadre des interventions sur les bâtiments, en sus de celles\nvisées aux paragraphes suivants.\n11.3.2. Bâtiments remarquables à préserver\nLes interventions sur les bâtiments répertoriés en annexe au présent règlement en tant que\n« bâtiments remarquables à préserver » devront être réalisées dans le respect strict des\ncaractéristiques originelles des édifices (volumétrie, composition et traitement des façades,\nornementation et modénatures, nombre, proportions et traitement des ouvertures, mise en\nœuvre des matériaux, typologie de la toiture…) et contribuer à leur restauration et à leur\nmise en valeur. La volumétrie existante du bâtiment devra être conservée dans ses\ncaractéristiques générales.\n    8\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPB\n11.3.3. Bâtiments ou ensembles bâtis à valoriser\nLes interventions, surélévations ou extension horizontale des bâtiments répertoriés en\nannexe au présent règlement en tant que « bâtiments ou ensembles bâtis à valoriser »\npourront être autorisées à condition de respecter l’esprit du bâtiment d’origine. Une\nattention particulière sera portée :\n    • Au respect du nombre et des proportions des ouvertures par niveaux existants et\n    pour tout nouveau niveau de construction.\n    • A la composition et au traitement général des façades.\n    • A la proportion des niveaux de construction et à leur réinterprétation en cas de\n    surélévation.\n    • Aux détails d’ornementation qui pourront être restaurés ou remis à jour à\n    l’occasion de travaux.\nArticle UPB.12. Obligations imposées aux\nconstructeurs en matière de réalisation d'aires de\nstationnement\nLe stationnement des véhicules de toute nature correspondant aux besoins des\nconstructions nouvelles sera dans la mesure du possible assuré en dehors de la voie\npublique.\nDans le cas où le stationnement est réalisé sur le terrain d’assiette, toutes mesures devront\nêtre prises afin de ne pas dénaturer le caractère de l’ensemble du bâtiment, du jardin et de\nla clôture.\nArticle UPB.13. Obligations imposées aux\nconstructeurs en matière de réalisation d'espaces\nlibres, d'aires de jeux et de loisirs, et de plantations\n13.1. Espaces boisés classés\nIl n’est pas fixé de règle.\n13.2. Éléments de paysage végétal à protéger et à mettre en\nvaleur\nLes jardins repérés au document graphique n° 5.9 « dispositions règlementaires\napplicables à la zone UPB » devront être préservés et mis en valeur, sans diminution de\nl'épaisseur de terre existante.\n    9\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPB\nLes plantations existantes seront conservées ou remplacées in situ par des plantations\néquivalentes.\nSection 3\nPossibilités maximales d'occupation du\nsol\nArticle UPB.14. Coefficient d'occupation du sol\nIl n’est pas fixé de coefficient d’occupation du sol.\n    10\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPC\nChapitre IX\nDispositions    applicables    en\nzone UPC\nLa zone UPC correspond à un ensemble urbain formé de maisons basses et petits\nimmeubles alignés sur une ruelle : « l’impasse Gravel ».\nLe caractère spécifique de cet ensemble en impasse, rare à Levallois, amène à le traiter\nsous la forme d'un plan de masse définissant les principales dispositions volumétriques qui\nlui sont applicables.\nCe plan de masse fait l’objet d’un document graphique spécifique, n° 5.10 « dispositions\nrèglementaires applicables à la zone UPC ».\nCertains terrains de la zone sont concernés par des servitudes instaurées au titre de\nl’article L. 123- 2.b consistant à réserver des emplacements en vue de la réalisation, dans\nle respect des objectifs de mixité sociale, de programme de logements sociaux.\n    1\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPC\nSection 1\nNature de l'occupation et de l'utilisation\ndu sol\nArticle UPC.1. Occupations et utilisations du sol\ninterdites\n1.1. Les constructions à destination d’entrepôt*.\n1.2. Les dépôts de ferrailles, de matériaux, de combustibles solides, ainsi que les\nentreprises de cassage de voitures et de transformation de matériaux de récupération.\n1.3. Les dépôts d'ordures ménagères, de résidus urbains ou de déchets de matériaux.\n1.4. Les carrières.\n1.5. Les installations classées soumises à la directive SEVESO, ou présentant des risques\ntechnologiques graves, ainsi que celles qui pourraient entraîner, pour le voisinage, une\ninsalubrité ou un sinistre susceptible de causer des dommages graves ou irréparables aux\npersonnes et/ou aux biens.\n1.6. Le stationnement des caravanes isolées, de résidences mobiles de loisirs,\nd’habitations légères de loisirs, l'ouverture de terrains de camping ou de caravanes.\n1.7. Les constructions à destination de bureau*, de commerce, d’artisanat* et d’’industrie*.\n1.8. Les cours anglaises.\n    2\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPC\nArticle UPC.2. Occupations et utilisations du sol\nsoumises à des conditions particulières\n2.1. Les occupations et utilisations du sol suivantes ne sont\nadmises que si elles respectent les conditions ci-après\nLa reconstruction à l’identique des bâtiments ou parties de bâtiments détruits après sinistre\nn’est autorisée que sous réserve de respecter les emprises constructibles définies au\ndocument graphique n° 5.10 « dispositions règlementaires applicables à la zone UPC ».\nA l’exception de celles régies par l’article UPC.1, les installations classées pour la\nprotection de l’environnement soumises à déclaration, sous réserve de leur bonne\nintégration dans le site et à condition :\n • qu’elles correspondent à des besoins nécessaires à la vie et à la commodité des\n   usagers de la zone tels que chaufferie d’immeubles, équipements de climatisation,…\n • qu’elles n’entraînent aucune incommodité ou nuisance susceptible de provoquer une\n   gêne pour les constructions à destination d’habitation*,\n • qu’elles respectent le caractère architectural des constructions,\n • que leurs exigences de fonctionnement lors de l’ouverture ou à terme soient\n   compatibles avec les infrastructures existantes, notamment les voiries et\n   l’assainissement.\nLes affouillements et exhaussements de sol, à condition qu’ils soient liés à la réalisation\ndes occupations et utilisations du sol autorisées dans la zone.\nSur les terrains ou parties de terrains repérés au document graphique n° 5.10\n« dispositions règlementaires applicables à la zone UPC » en tant qu’ « emplacements\nréservés en vue de la réalisation de programmes de logements sociaux », les opérations\nde logements à condition que 100 % de la SDP affectée à de l’habitation soient destinés à\ndu logement social.\nToute construction nouvelle ou tout changement de destination ayant pour effet de créer\nplus de cinq logements devra comporter un minimum de 65 % de logements de trois\npièces et plus.\nCette disposition ne s’applique pas aux résidences ou foyers pour étudiants, pour\npersonnes âgées, aux logements-foyers, et aux foyers d’accueil pour personnes\nhandicapées.\n2.2. Rappel\nLes constructions nouvelles à destination d’habitation* et les établissements\nd’enseignement doivent répondre aux normes d’isolement acoustique conformément aux\narrêtés du 30 mai 1996 et du 9 janvier 1995 lorsque leurs façades sont exposées au bruit\ndes infrastructures de transport terrestres classées par l’arrêté préfectoral du 29 juin 2000\n(le classement figure dans les annexes en pièce n° 6.2.2 du présent dossier).\n    3\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPC\nSection 2\nConditions de l'occupation du sol\nArticle UPC.3. Conditions de desserte des terrains par\nles voies publiques ou privées et accès aux voies\nouvertes au public\nPour être constructible, une unité foncière* doit disposer d'un accès à une voie publique ou\nprivée en état de viabilité et dont les caractéristiques permettent de répondre aux\nexigences de la sécurité civile et de la lutte contre l'incendie.\nArticle UPC.4. Conditions de desserte des terrains par\nles réseaux publics d'eau, d'assainissement de\ncommunication, d’énergie et de collecte des déchets\n4.1. Alimentation en eau potable\nToute construction ou installation qui, par sa destination, implique une utilisation d'eau\npotable, doit être obligatoirement alimentée par un branchement sur le réseau public d'eau\npotable.\n4.2. Assainissement\n4.2.1. Eaux usées\nLe branchement sur le réseau public d'assainissement est obligatoire pour toute\nconstruction ou installation engendrant des eaux usées. Toute évacuation dans les fossés\net cours d'eau est interdite.\n    4\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPC\n4.2.2. Eaux pluviales\nLes aménagements réalisés sur une unité foncière* ne doivent pas faire obstacle au libre\nécoulement des eaux pluviales (articles 640 et 641 du Code civil).\nPour toute construction nouvelle, reconstruction ou réhabilitation, et quelle que soit la taille\nde l’unité foncière concernée, le rejet des eaux pluviales dans le réseau d'assainissement\ndevra respecter le règlement d’assainissement intercommunal de l’Etablissement Public\nTerritorial Paris Ouest La Défense.\nDans le cas où les caractéristiques de l’unité foncière ne permettent pas d'assurer une\nrétention naturelle d'eau suffisante, doivent être prévus des dispositifs de rétention\ncomplémentaires aux possibilités du réseau et utilisant des techniques alternatives.\n4.3. Réseau public de communications\nLes constructions ou installations nouvelles devront comporter les infrastructures\nnécessaires à leur branchement sur les réseaux de communication existants ou projetés :\n  • réseaux traditionnels publics (téléphone, télex, liaisons spécialisées,…),\n  • réseaux câblés de radiotélévision publics.\nLes antennes d'émission ou de réception de signaux radioélectriques (antennes,\nparaboles...) devront être installées conformément à l’article UPC.11.2\n4.4. Collecte des déchets\nLes constructions nouvelles doivent comporter des locaux de stockage des déchets,\nsuffisamment dimensionnés de manière à recevoir et permettre de manipuler sans\ndifficultés tous les récipients nécessaires à la collecte sélective des déchets.\nCes locaux seront isolés et fermés.\n4.5. Rappels : Energies renouvelables\nL’utilisation des énergies renouvelables pour l’approvisionnement énergétique des\nconstructions sera privilégiée.\nArticle UPC.5. Superficie minimale des terrains\nconstructibles\nIl n’est pas fixé de règle.\n    5\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPC\nArticle UPC.6. Implantation des constructions par\nrapport aux voies et emprises publiques\n6.1. Principe général d'implantation des constructions\nLes constructions devront être implantées à l’intérieur des emprises et volumes\nconstructibles définis en zones A, B, C et D au document graphique n° 5.10 « dispositions\nrèglementaires applicables à la zone UPC ».\n6.2. Saillies* et encorbellements*\nLes saillies et encorbellements ne sont autorisés qu’à compter du 1er étage. Leurs\ndimensions se mesurent à partir de la limite de l’emprise constructible reportée au\ndocument graphique n° 5.10 « dispositions règlementaires applicables à la zone UPC ».\n6.2.1. Saillies et encorbellements par rapport aux voies et emprises\npubliques\nLes saillies et encorbellements devront correspondre à des éléments mettant en valeur la\ntypologie de la construction concernée tels que : ouvrages décoratifs, éléments\nornementaux, débords de toiture,…\nIls ne pourront excéder une profondeur de 0,20 mètre.\n6.2.2. Saillies et encorbellements par rapport aux jardins, plantations à\ncréer ou à mettre en valeur repérés au document graphique n° 5.10\n« dispositions règlementaires applicables à la zone UPC »\nLes saillies et encorbellements ne pourront excéder une profondeur de 0,40 mètre.\nArticle UPC.7. Implantation des constructions par\nrapport aux limites séparatives\nA l’intérieur des emprises constructibles définies en A, B, C et D au document graphique\nn° 5.10 « dispositions règlementaires applicables à la zone UPC », les constructions\ndevront s’établir en ordre continu côté voie.\n    6\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPC\nArticle UPC.8. Implantation des constructions les unes\npar rapport aux autres sur une même propriété\nIl n’est pas fixé de règle.\nArticle UPC.9. Emprise au sol des constructions\nL'emprise au sol des constructions* ne doit pas excéder les emprises constructibles\ndélimitées au document graphique n° 5.10 « dispositions règlementaires applicables à la\nzone UPC ».\nL'aménagement sans extension des parties de constructions existantes déjà situées à\nl’extérieur de l’emprise constructible est toutefois autorisé.\nArticle UPC.10. Hauteur maximale des constructions\nLes constructions devront s’établir à l’intérieur des volumes constructibles résultant des\nemprises et gabarits définis au document graphique n° 5.10 « dispositions règlementaires\napplicables à la zone UPC ».\nLa hauteur totale maximum des constructions, mesurée à partir du terrain naturel* jusqu'au\npoint le plus élevé de la construction (faîtage* ou acrotère*), ouvrages techniques et\ncheminées exclus, est fixée à :\n  • 17 mètres dans la zone A, le nombre maximum de niveaux réalisables dans cette\n    hauteur est fixé à 5 (R+4),\n  • 15 mètres dans la zone B, le nombre maximum de niveaux réalisables dans cette\n    hauteur est fixé à 4 (R+3), hors cour anglaise existante,\n  • 11 mètres dans la zone C, le nombre maximum de niveaux réalisables dans cette\n    hauteur est fixé à 3 (R+2),\n  • 8 mètres dans la zone D, le nombre maximum de niveaux réalisables dans cette\n    hauteur est fixé à 2 (R+1).\nLa hauteur des façades des constructions du côté de l’impasse Gravel ne devra pas\nexcéder :\n  • 15 mètres dans la zone A,\n  • 12 mètres dans la zone B,\n  • 9 mètres dans la zone C,\n  • 6 mètres dans la zone D.\nLa partie supérieure des constructions devra être traitée en comble en pentes (les combles\nà la Mansart étant interdits) ou en terrasses. Dans ce dernier cas, la hauteur totale de la\nconstruction n’excèdera pas celle de sa façade.\n    7\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPC\nArticle UPC.11. Aspect extérieur des constructions et\naménagement de leurs abords\n11.1. Dispositions générales\nTout projet peut être refusé ou n'être accordé que sous réserve de l'observation de\nprescriptions spéciales si les constructions par leur architecture, leur situation, leurs\ndimensions ou l'aspect extérieur des bâtiments ou ouvrages à édifier ou à modifier, sont de\nnature à porter atteinte au caractère ou à l'intérêt des lieux avoisinants, aux sites, aux\npaysages naturels ou urbains, ainsi qu'à la conservation des perspectives monumentales,\nnotamment pour les plus remarquables (cf. document graphique n° 5.1 « zonage et\nservitudes »).\n11.2. Matériaux\nL’emploi à nu, en parement extérieur, de matériaux destinés à être recouverts est interdit.\n11.3. Pignons et locaux annexes\nLes murs pignons, mitoyens ou non, devront être traités en harmonie avec les façades\nprincipales.\n11. Aspect\nLes locaux annexes et dépendances seront traités avec un soin égal à celui apporté aux\nconstructions principales.\n11.4. Clôtures\nLes clôtures situées en bordure de voie ou entre propriétés dans le cas de retrait de la\nconstruction feront partie d’une composition d’ensemble.\nElles devront être constituées par un mur bahut d'une hauteur maximum de 0,60 mètre,\nsurmonté d'une grille à claire voie. La hauteur totale de l'ensemble ne pourra excéder 1,80\nmètre.\n11.5. Toitures-terrasses\n11.5.1. Principes généraux\nLes toitures-terrasses de tout type devront être traitées avec autant de soin que les\nfaçades. Les étanchéités auto protégées des toitures-terrasses ne pourront être laissées\napparentes. Les protections par gravillons lavés leurs sont interdites.\nLa partie minérale sera traitée avec soin et constituée d'un revêtement soigné.\n    8\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPC\n11.5.2. Toitures-terrasses inaccessibles\nLes toitures-terrasses inaccessibles seront végétalisées à l’exception des parties occupées\npar les ouvrages techniques, verrières, capteurs d’énergie (panneaux solaires…)… Cette\nvégétalisation sera assurée par une solution technique de type traditionnel (végétalisation\nintensive* ou semi-intensive* avec apport de terre végétale), ou par toute autre solution\nnon traditionnelle (végétalisation extensive comportant une couche végétale sur substrat\npar exemple).\nCette végétalisation devra être maintenue lors d’une réfection de la toiture.\n11.6. Prescriptions relatives à l’aspect extérieur des\nconstructions\nLes ouvrages tels que les groupes électrogènes, les ouvrages de climatisation des\nconstructions nouvelles, etc., seront situés à l'intérieur des bâtiments sauf impossibilité\ntechnique.\nLes édicules affectés aux machineries d'ascenseurs et aux sorties d'escaliers, lorsqu'ils ne\nseront pas intégrés dans le volume du dernier étage, seront traités avec le même matériau\nque les façades et intégrés à l'aménagement d'ensemble de la toiture-terrasse.\nLes réseaux techniques en toiture ou en terrasse, tels que la ventilation mécanique\ncontrôlée, les ventilations diverses, seront sauf impossibilité technique avérée, camouflés\npar un revêtement identique à la façade ou s'harmonisant avec elle. Les ouvrages ou\nédicules techniques extérieurs au bâtiment et situés en rez-de-chaussée, ainsi que les\nventilations de sous-sols non situées en toiture devront être traités avec soin et\ns'harmoniser avec les façades tant en ce qui concerne la nature des matériaux que la\ncouleur.\nLes surélévations des conduits de fumée feront l'objet d'un traitement architectural\ns’intégrant parfaitement à la construction.\nLes évacuations d'eaux pluviales correspondant aux loggias et aux balcons pleins devront\nêtre intégrées à l'intérieur des bâtiments, être situées en fond de loggia, être encastrées\ndans la façade ou être placées en limite séparatives* d'immeubles.\nLes antennes d'émission ou de réception de signaux radioélectriques (antennes,\nparaboles...) devront être installées sur les toitures de la façon la moins visible possible\ndepuis l'espace public. Sur les toitures terrasses, elles seront implantées de manière\nprivilégiée en zone centrale.\nLes coffrets, compteurs et boites aux lettres des immeubles collectifs seront situées à\nl'intérieur des bâtiments.\nLes branchements (câbles électriques, télécom…) seront obligatoirement réalisés en\nsouterrain, ou bien intégrés au volume des bâtiments.\nL’ajout d’escaliers sur les constructions existantes devra s’harmoniser avec la composition\nde la façade.\n    9\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPC\nArticle UPC.12. Obligations imposées aux\nconstructeurs en matière de réalisation d'aires de\nstationnement\nDans les immeubles d’habitation, le stationnement des vélos devra respecter les\ndispositions et les normes du Code de la Construction et de l’Habitation et être situé au\nrez-de-chaussée ou au premier sous-sol réservé au stationnement automobile, dans des\nlocaux clos et facilement accessibles.\nEn l’absence de réalisation de parc de stationnement et dans les immeubles créant plus de\n4 logements, il devra néanmoins être réalisé un ou plusieurs locaux en sous-sol ou en rez-\nde-chaussée, clos et couvert, dont la surface totale devra correspondre aux besoins de\nl’immeuble.\nArticle UPC.13. Obligations imposées aux\nconstructeurs en matière de réalisation d'espaces\nlibres, d'aires de jeux et de loisirs, et de plantations\n13.1. Espaces boisés classés*\nIl n’est pas fixé de règle.\n13.2. Jardins et plantations à créer ou à mettre en valeur\nLes jardins ou plantations à créer ou à mettre en valeur repérés au document graphique\nn° 5.10 « dispositions règlementaires applicables à la zone UPC », devront être aménagés\nen espaces verts* pouvant comporter des aires de jeux ou de détente ainsi que des\naménagements piétonniers. Ces espaces libres* feront l’objet d’un traitement végétal de\nqualité et diversifié.\n    10\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPC\nSection 3\nPossibilités maximales d'occupation du\nsol\nArticle UPC.14. Coefficient d'occupation du sol\nIl n’est pas fixé de coefficient d’occupation du sol.\n    11\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPD\nChapitre X\nDispositions    applicables    en\nzone UPD\nLa zone UPD correspond à un ensemble urbain présentant une architecture particulière\nqu'il convient de maintenir : la « Villa Muller ».\nLe caractère spécifique de cet ensemble composé de maisons basses jumelées, ainsi que\ncelui des éléments paysagers qui l'accompagnent (clôtures, jardins,...) amène à le traiter\nsous la forme d'un plan de masse définissant les principales dispositions volumétriques qui\nlui sont applicables.\nCe plan de masse fait l’objet d’un document graphique spécifique, pièce n° 5.11\n« dispositions règlementaires applicables à la zone UPD ».\n    1\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPD\nSection 1\nNature de l'occupation et de l'utilisation\ndu sol\nArticle UPD.1. Occupations et utilisations du sol\ninterdites\n1.1. Les occupations et utilisations du sol suivantes sont\ninterdites\n1.1.1. Les constructions à destination d’entrepôt*.\n1.1.2. Les dépôts de ferrailles, de matériaux, de combustibles solides, ainsi que les\nentreprises de cassage de voitures et de transformation de matériaux de récupération.\n1.1.3. Les dépôts d'ordures ménagères, de résidus urbains ou de déchets de matériaux.\n1.1.4. Les carrières.\n1.1.5. Les installations classées soumises à la directive SEVESO, ou présentant des\nrisques technologiques graves, ainsi que celles qui pourraient entraîner, pour le voisinage,\nune insalubrité ou un sinistre susceptible de causer des dommages graves ou irréparables\naux personnes et/ou aux biens.\n1.1.6. Le stationnement des caravanes isolées, de résidences mobiles de loisirs,\nd’habitations légères de loisirs, l'ouverture de terrains de camping ou de caravanes.\n1.1.7. Les constructions à destination de bureau*, de commerce, d’artisanat* et\nd’’industrie*.\n1.1.8. Les cours anglaises.\n    2\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPD\nArticle UPD.2. Occupations et utilisations du sol\nsoumises à des conditions particulières\n2.1. Les occupations et utilisations du sol suivantes ne sont\nadmises que si elles respectent les conditions ci-après\nLa reconstruction à surfaces de plancher (SDP*), destination, volume et emprise identiques\ndes bâtiments ou parties de bâtiments détruits après sinistre.\nA l’exception de celles régies par l’article UPD.1, les installations classées pour la\nprotection de l’environnement soumises à déclaration, sous réserve de leur bonne\nintégration dans le site et à condition :\n  • qu’elles correspondent à des besoins nécessaires à la vie et à la commodité des\n    usagers de la zone tels que chaufferie d’immeubles, équipements de climatisation,… ;\n • qu’elles n’entraînent aucune incommodité ou nuisance susceptible de provoquer une\n   gêne pour les constructions à destination d’habitation ;\n • qu’elles respectent le caractère architectural des constructions ;\n • que leurs exigences de fonctionnement lors de l’ouverture ou à terme soient\n   compatibles avec les infrastructures existantes, notamment les voiries et\n   l’assainissement.\nLes affouillements et exhaussements de sol, à condition qu’ils soient liés à la réalisation\ndes occupations et utilisations du sol autorisées dans la zone.\n2.2. Rappel\nLes constructions nouvelles à destination d’habitation* et les établissements\nd’enseignement doivent répondre aux normes d’isolement acoustique conformément aux\narrêtés du 30 mai 1996 et du 9 janvier 1995 lorsque leurs façades sont exposées au bruit\ndes infrastructures de transport terrestres classées par l’arrêté préfectoral du 29 juin 2000\n(le classement figure dans les annexes en pièce n° 6.2.2 du présent dossier).\n    3\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPD\nSection 2\nConditions de l'occupation du sol\nArticle UPD.3. Conditions de desserte des terrains par\nles voies publiques ou privées et accès aux voies\nouvertes au public\nPour être constructible, une unité foncière* doit disposer d'un accès à une voie publique ou\nprivée en état de viabilité et dont les caractéristiques permettent de répondre aux\nexigences de la sécurité civile et de la lutte contre l'incendie.\nArticle UPD.4. Conditions de desserte des terrains par\nles réseaux publics d'eau, d'assainissement, de\ncommunication, d’énergie et de collecte des déchets\n4.1. Alimentation en eau potable\nToute construction ou installation qui, par sa destination, implique une utilisation d'eau\npotable, doit être obligatoirement alimentée par un branchement sur le réseau public d'eau\npotable.\n4.2. Assainissement\n4.2.1. Eaux usées\nLe branchement sur le réseau public d'assainissement est obligatoire pour toute\nconstruction ou installation engendrant des eaux usées. Toute évacuation dans les fossés\net cours d'eau est interdite.\nLe rejet dans le réseau public des eaux résiduaires industrielles pourra être soumis à des\nconditions particulières et devra notamment être soumis à un prétraitement.\n4.2.2. Eaux pluviales\nLes aménagements réalisés sur une unité foncière* ne doivent pas faire obstacle au libre\nécoulement des eaux pluviales (articles 640 et 641 du Code civil).\n    4\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPD\nPour toute construction nouvelle, reconstruction ou réhabilitation, et quelle que soit la taille\nde l’unité foncière concernée, le rejet des eaux pluviales dans le réseau d'assainissement\ndevra respecter le règlement d’assainissement intercommunal de l’Etablissement Public\nTerritorial Paris Ouest La Défense.\nDans le cas où les caractéristiques de l’unité foncière ne permettent pas d'assurer une\nrétention naturelle d'eau suffisante, doivent être prévus des dispositifs de rétention\ncomplémentaires aux possibilités du réseau et utilisant des techniques alternatives.\n4.3. Réseau public de communications\nLes constructions ou installations nouvelles devront comporter les infrastructures\nnécessaires à leur branchement sur les réseaux de communication existants ou projetés :\n  • réseaux traditionnels publics (téléphone, télex, liaisons spécialisées,…),\n  • réseaux câblés de radiotélévision publics.\nLes antennes d'émission ou de réception de signaux radioélectriques (antennes,\nparaboles...) devront être installées conformément à l’article UPD.11.2.\n4.4. Ordures ménagères\nLes constructions nouvelles doivent comporter des locaux de stockage des déchets,\nsuffisamment dimensionnés de manière à recevoir et permettre de manipuler sans\ndifficultés tous les récipients nécessaires à la collecte sélective des déchets.\nCes locaux seront isolés et fermés.\n4.5. Rappels : Energies renouvelables\nL’utilisation des énergies renouvelables pour l’approvisionnement énergétique des\nconstructions sera privilégiée.\nArticle UPD.5. Superficie minimale des terrains\nconstructibles\nIl n’est pas fixé de règle.\n    5\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPD\nArticle UPD.6. Implantation des constructions par\nrapport aux voies et emprises publiques\n6.1. Principe général d'implantation des constructions\nLes constructions devront être implantées à l’intérieur des emprises et volumes\nconstructibles définis au document graphique n° 5.11 « dispositions règlementaires\napplicables à la zone UPD ».\n6.2. Saillies* et encorbellements sur l’espace public et par\nrapport aux jardins à préserver et mettre en valeur repérés au\ndocument graphique n° 5.11 « dispositions règlementaires\napplicables à la zone UPD »\nLa dimension des saillies et encorbellements se mesure à partir de la limite de l’enveloppe\nconstructible sur voie reportée au document graphique n° 5.11 « dispositions\nrèglementaires applicables à la zone UPD ».\nLes saillies et encorbellements devront correspondre à des éléments mettant en valeur la\ntypologie de la construction concernée tels que : perron, marquise,… en rez-de-chaussée,\nbalcons en étage, ouvrages décoratifs, éléments ornementaux, débords de toiture,…\nIls ne pourront excéder une épaisseur de 0,30 m.\nArticle UPD.7. Implantation des constructions par\nrapport aux limites séparatives\nLes constructions devront être implantées à l’intérieur des emprises constructibles définies\nau document graphique n° 5.11 « dispositions règlementaires applicables à la zone UPD ».\nA l’intérieur des emprises constructibles repérées en A, B1 et B2 sur ce document\ngraphique, les constructions devront s’établir en ordre continu.\nArticle UPD.8. Implantation des constructions les unes\npar rapport aux autres sur une même propriété\nLes constructions devront être implantées à l’intérieur des emprises constructibles définies\nau document graphique n° 5.11 en respectant les distances minimales qui y figurent.\n    6\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPD\nArticle UPD.9. Emprise au sol des constructions*\nL'emprise au sol des constructions ne doit pas excéder les emprises constructibles\ndélimitées au document graphique n° 5.11.\nL'aménagement sans extension des parties de constructions existantes déjà situées à\nl’extérieur des emprises constructibles est toutefois autorisé.\nArticle UPD.10. Hauteur maximale des constructions\n10.1. Définitions et principes généraux\nLa hauteur totale est mesurée à partir du terrain naturel* jusqu'au point le plus élevé de la\nconstruction faîtage en cas de toiture en pente et jusqu’à l’acrotère ou le garde-corps plein\nen cas de toiture terrasse.\nN’entrent pas dans le calcul de la hauteur les ouvrages techniques et les cheminées.\nLes constructions devront s’établir à l’intérieur des volumes constructibles résultant des\nemprises et des gabarits définis au document graphique n° 5.11 en respectant les hauteurs\nmaximum fixées ci-après.\nLes dispositions prévues en 10.2. et 10.3. ci-après ne s’appliquent pas à l’aménagement et\nla réhabilitation de parties de constructions déjà existantes non conformes à ces règles.\n10.2. Hauteur totale maximum des constructions\nLa hauteur totale maximum des constructions est fixée à :\n • 11,50 mètres dans les emprises A et B1, le nombre maximum de niveaux réalisables\n   dans cette hauteur est fixé à 3 (R+2 maximum),\n • 8,50 mètres dans l’emprise B2, le nombre maximum de niveaux réalisables dans cette\n   hauteur est fixé à 2 (R+1 maximum).\n • 8 mètres dans l’emprise C, le nombre maximum de niveaux réalisables dans cette\n   hauteur est fixé à 2 (R+1 maximum).\n • 4 mètres dans les emprises D, le nombre maximum de niveau réalisable dans cette\n   hauteur est fixé à 1 (RDC maximum),\n • 3 mètres dans l’emprise E, le nombre maximum de niveau réalisable dans cette\n   hauteur est fixé à 1 (RDC maximum).\n10.3. Hauteur de façade\nLa hauteur de façade ne devra excéder :\n • 10 mètres dans l’emprise B1,\n • 7,50 mètres dans les emprises A et B2,\n • 6,00 mètres, dans l’emprise C.\n    7\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPD\nArticle UPD.11. Aspect extérieur des constructions et\naménagement de leurs abords\n11.1. Rappel\nTout projet peut être refusé ou n'être accordé que sous réserve de l'observation de\nprescriptions spéciales si les constructions, par leur architecture, leur situation, leurs\ndimensions ou l'aspect extérieur des bâtiments ou ouvrages à édifier ou à modifier, sont de\nnature à porter atteinte au caractère ou à l'intérêt des lieux avoisinants, aux sites, aux\npaysages naturels ou urbains, ainsi qu'à la conservation des perspectives monumentales,\n(cf. document graphique n° 5.1 « zonage et servitudes »).\n11.2. Dispositions particulières\nDe façon générale, le style, les éléments de construction spécifiques et les éléments\ndécoratifs des bâtiments présents dans ces ensembles devront être préservés ou\nréinterprétés, afin de conserver la cohérence historique, urbaine et paysagère des lieux.\nLes travaux sur une construction ou une clôture existante (surélévation, ravalement,\nmodification d'aspect,...) devront respecter et mettre en valeur le style et les\ncaractéristiques architecturales du bâtiment et s'harmoniser avec les constructions\nvoisines.\nLes modénatures, corniches, éléments sculptés, décors, persiennes, garde-corps, grilles et\nferronneries devront être conservés ou réparés lorsqu'ils seront dégradés. Leur\nreconstitution pourra être imposée.\nLes constructions nouvelles, les reconstructions ou les travaux sur constructions existantes\ndevront respecter le style d'architecture de la zone en ce qui concerne les façades, toitures\net clôtures côté voies. Les surélévations des bâtiments existants devront faire l’objet d’une\nrecomposition architecturale globale des emprises concernées.\nL'emploi à nu de matériaux destinés à être recouverts (tels que carreaux de plâtre, briques\ncreuses, agglomérés de béton, etc. ...) est interdit, de même que l'utilisation de tôles\nondulées et d'enduit au mortier de ciment non teinté.\nLes murs pignons, mitoyens ou non, devront être traités en harmonie avec les façades\nprincipales.\nLes locaux annexes et dépendances seront traités avec un soin égal à celui apporté aux\nconstructions principales.\nLes antennes d'émission ou de réception de signaux radioélectriques (antennes,\nparaboles...) devront être installées sur les toitures de la façon la moins visible possible\ndepuis la voie.\nLes éléments tels que cheminées, ouvrages techniques devront être conçus en harmonie\navec la typologie de la construction : forme, matériaux, dimensions.\nDans les emprises A, B1, B2 et C, les toitures-terrasses sont interdites.\nDans l’emprise A, la partie supérieure devra être traitée en comble à la Mansart pouvant\ncomporter des ouvertures de type lucarnes traditionnelles, à l’exclusion des chiens assis.\n    8\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPD\n11.3. Bâtiments faisant l'objet d'une protection grâce aux\ndispositions prévues par le Code de l’urbanisme permettant à\nun PLU d’identifier et de localiser les éléments de paysage, à\nmettre en valeur ou à requalifier pour des motifs d'ordre\nculturel, historique ou écologique\n11.3.1. Cas général\nTous les travaux exécutés sur un bâtiment faisant l'objet d'une protection (figurant aux\ndocuments graphiques n° 5.1 « zonage et servitudes » et n°5.11, ainsi que dans le\ndocument n° 4.2.3 « cahier de protection du patrimoine architectural ») doivent être conçus\nen évitant toute dénaturation des caractéristiques constituant son intérêt esthétique.\nLes projets situés à proximité immédiate des bâtiments ainsi protégés doivent être conçus\ndans la perspective d'une mise en valeur de ce patrimoine.\nLes fiches du « cahier de protection du patrimoine architectural », annexé au présent\nrèglement, présentent les caractéristiques principales du bâtiment, son historique et des\néléments spécifiques d’intérêt.\nLe cas échéant des mesures de vigilance ou des orientations spécifiques au bâtiment\nconcerné sont édictées (« mesures spécifiques de protection »). Elles doivent absolument\nêtre prises en compte dans le cadre des interventions sur les bâtiments, en sus de celles\nvisées aux paragraphes suivants.\n11.3.2. Bâtiments remarquables à préserver\nLes interventions sur les bâtiments répertoriés en annexe au présent règlement en tant que\n« bâtiments remarquables à préserver » devront être réalisées dans le respect strict des\ncaractéristiques originelles des édifices (volumétrie, composition et traitement des façades,\nornementation et modénatures, nombre, proportions et traitement des ouvertures, mise en\nœuvre des matériaux, typologie de la toiture…) et contribuer à leur restauration et à leur\nmise en valeur. La volumétrie existante du bâtiment devra être conservée dans ses\ncaractéristiques générales.\n11.3.3. Bâtiments ou ensembles bâtis à valoriser\nLes interventions, surélévations ou extension horizontale des bâtiments répertoriés en\nannexe au présent règlement en tant que « bâtiments ou ensembles bâtis à valoriser »\npourront être autorisées à condition de respecter l’esprit du bâtiment d’origine. Une\nattention particulière sera portée :\n    • Au respect du nombre et des proportions des ouvertures par niveaux existants et\n    pour tout nouveau niveau de construction.\n    • A la composition et au traitement général des façades.\n    • A la proportion des niveaux de construction et à leur réinterprétation en cas de\n    surélévation.\n    • Aux détails d’ornementation qui pourront être restaurés ou remis à jour à\n    l’occasion de travaux.\n    9\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPD\nArticle UPD.12. Obligations imposées aux\nconstructeurs en matière de réalisation d'aires de\nstationnement\nLe stationnement des véhicules de toute nature correspondant aux besoins des\nconstructions nouvelles sera dans la mesure du possible assuré en dehors de la voie\npublique.\nDans le cas où le stationnement est réalisé sur le terrain d’assiette, toutes mesures devront\nêtre prises afin de ne pas dénaturer le caractère de l’ensemble du bâtiment, du jardin et de\nla clôture.\nArticle UPD.13. Obligations imposées aux\nconstructeurs en matière de réalisation d'espaces\nlibres, d'aires de jeux et de loisirs, et de plantations\n13.1. Espaces boisés classés\nIl n’est pas fixé de règle.\n13.2. Éléments de paysage végétal à protéger et à mettre en\nvaleur\nLes jardins repérés au document graphique n° 5.11 « dispositions règlementaires\napplicables à la zone UPD » devront être préservés et mis en valeur, sans diminution de\nl'épaisseur de terre existante.\nLes plantations existantes seront conservées ou remplacées par des plantations\néquivalentes.\n    10\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPD\nSection 3\nPossibilités maximales d'occupation du\nsol\nArticle UPD.14. Coefficient d'occupation du sol\nIl n’est pas fixé de coefficient d’occupation du sol.\n    11\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPE\nChapitre XI\nDispositions    applicables    en\nzone UPE\nLa zone UPE recouvre la partie levalloisienne de l’Île de la Jatte ainsi que la passerelle qui\nla relie au reste de la commune.\nC’est une zone urbaine à vocation principale d’habitat, d’équipements publics, de loisirs et\nd’espaces verts\nLa composition urbaine et les éléments naturels et végétaux ont conduit à inclure cette\nzone et ses abords dans un secteur à protéger et à mettre en valeur en application de\nl'article L. 123-1-5 III 2° du Code de l'urbanisme et tel que figuré au document graphique\nn° 5.1 « zonage et servitudes ».\nLe caractère spécifique de cet ensemble amène à le traiter sous la forme d’un plan de\nmasse définissant les principales dispositions volumétriques qui lui sont applicables.\nCe plan de masse fait l’objet d’un document graphique n° 5.12 « dispositions\nrèglementaires applicables à la zone UPE ».\n    1\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPE\nSection 1\nNature de l'occupation et de l'utilisation\ndu sol\nArticle UPE.1. Occupations et utilisations du sol\ninterdites\nLes occupations et utilisations du sol suivantes sont interdites :\n1.1. Les constructions à destination d’entrepôt*.\n1.2. Les dépôts de ferrailles, de matériaux, de combustibles solides, ainsi que les\nentreprises de cassage de voitures et de transformation de matériaux de récupération.\n1.3. Les dépôts d'ordures ménagères, de résidus urbains ou de déchets de matériaux.\n1.4. Les carrières.\n1.5. Les installations classées soumises à la directive SEVESO, ou présentant des risques\ntechnologiques graves, ainsi que celles qui pourraient entraîner, pour le voisinage, une\ninsalubrité ou un sinistre susceptible de causer des dommages graves ou irréparables aux\npersonnes et/ou aux biens.\n1.6. Le stationnement des caravanes isolées, de résidences mobiles de loisirs,\nd’habitations légères de loisirs, l'ouverture de terrains de camping ou de caravanes.\n1.7. Les constructions à destination de bureau*, de commerce, d’artisanat* et d’industrie*, à\nl’exclusion de ceux visés à l’article 2.1.2. ci-après.\n1.8. Les cours anglaises.\n    2\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPE\nArticle UPE.2. Occupations et utilisations du sol\nsoumises à des conditions particulières\n2.1. Les occupations et utilisations du sol suivantes ne sont\nadmises que si elles respectent les conditions ci-après\n2.1.1. Sur l’ensemble de la zone\nLa reconstruction à surfaces de plancher (SDP*), destination, volume et emprise identiques\ndes bâtiments ou parties de bâtiments détruits après sinistre.\nA l’exception de celles régies par l’article UPE.1., les installations classées pour la\nprotection de l’environnement soumises à déclaration, sous réserve de leur bonne\nintégration dans le site et à condition :\n • qu’elles correspondent à des besoins nécessaires à la vie et à la commodité des\n   usagers de la zone tels que chaufferie d’immeubles, équipements de climatisation,… ;\n • qu’elles n’entraînent aucune incommodité ou nuisance susceptible de provoquer une\n   gêne pour les constructions à destination d’habitation ;\n • qu’elles respectent le caractère architectural des constructions ;\n • que leurs exigences de fonctionnement lors de l’ouverture ou à terme soient\n   compatibles avec les infrastructures existantes, notamment les voiries et\n   l’assainissement.\nLes affouillements et exhaussements de sol, à condition qu’ils soient liés à la réalisation\ndes occupations et utilisations du sol autorisées dans la zone.\n2.1.2. Sur l’emprise constructible A et la zone de terrasses repérées au\ndocument graphique n° 5.12 « dispositions règlementaires applicables\nà la zone UPE »\nOutre les occupations et utilisations du sol soumises à des conditions particulières au\nparagraphe 2.1.1 ci-dessus, sont autorisées, sous réserve qu’il n’en résulte pas de gêne\nanormale pour le voisinage :\n • sur l’emprise constructible repérée en A au document graphique n° 5.12 :\n    • les activités commerciales de restauration, culturelles et de loisirs,\n    • les bureaux à condition qu’ils soient situés en étages ;\n • sur la « zone de terrasses » repérée au document graphique n° 5.12 : l’occupation en\n   terrasse liée aux activités commerciales autorisées ci-dessus.\n    3\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPE\n2.2. Rappel\nLes constructions nouvelles à destination d’habitation* et les établissements\nd’enseignement doivent répondre aux normes d’isolement acoustique conformément aux\narrêtés du 30 mai 1996 et du 9 janvier 1995 lorsque leurs façades sont exposées au bruit\ndes infrastructures de transport terrestres classées par l’arrêté préfectoral du 29 juin 2000\n(le classement figure dans les annexes en pièce n° 6.2.2 du présent dossier).\nDans les parties de zones repérées au Plan de Prévention des Risques d’Inondation\n(PPRI : pièce n° 6.1.2 du présent dossier), la nature de l’occupation et de l’utilisation du sol\nest subordonnée aux dispositions règlementaires dudit PPRI approuvé.\nSection 2\nConditions de l'occupation du sol\nArticle UPE.3. Conditions de desserte des terrains par\nles voies publiques ou privées et accès aux voies\nouvertes au public\n3.1. Accès véhicules\nPour être constructible, un terrain doit disposer d'un accès à une voie publique ou privée en\nétat de viabilité et dont les caractéristiques permettent de répondre aux exigences de la\nsécurité civile et de la lutte contre l'incendie.\nLes accès véhicules aux parkings sont limités aux abords du rond-point Claude Monet aux\nendroits figurant au document graphique n° 5.12.\n3.2. Parcours piétons\nLa continuité des parcours piétons reportés au document graphique n° 5.12 devra être\nassurée.\n    4\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPE\nArticle UPE.4. Conditions de desserte des terrains par\nles réseaux publics d'eau, d'assainissement de\ncommunication, d’énergie et de collecte des déchets\n4.1. Alimentation en eau potable\nToute construction ou installation qui, par sa destination, implique une utilisation d'eau\npotable, doit être obligatoirement alimentée par un branchement sur le réseau public d'eau\npotable.\n4.2. Assainissement\n4.2.1. Eaux usées\nLe branchement sur le réseau public d'assainissement est obligatoire pour toute\nconstruction ou installation engendrant des eaux usées. Toute évacuation dans les fossés\net cours d'eau est interdite.\nLe rejet dans le réseau public des eaux résiduaires industrielles pourra être soumis à des\nconditions particulières et devra notamment être soumis à un prétraitement.\n4.2.2. Eaux pluviales\nLes aménagements réalisés sur une unité foncière* ne doivent pas faire obstacle au libre\nécoulement des eaux pluviales (articles 640 et 641 du Code civil).\nPour toute construction nouvelle, reconstruction ou réhabilitation, et quelle que soit la taille\nde l’unité foncière concernée, le rejet des eaux pluviales dans le réseau d'assainissement\ndevra respecter le règlement d’assainissement intercommunal de l’Etablissement Public\nTerritorial Paris Ouest La Défense.\nDans le cas où les caractéristiques de l’unité foncière ne permettent pas d'assurer une\nrétention naturelle d'eau suffisante, doivent être prévus des dispositifs de rétention\ncomplémentaires aux possibilités du réseau et utilisant des techniques alternatives.\n4.3. Réseau public de communications\nLes constructions ou installations nouvelles devront comporter les infrastructures\nnécessaires à leur branchement sur les réseaux de communication existants ou projetés :\n • réseaux traditionnels publics (téléphone, télex, liaisons spécialisées,…),\n • réseaux câblés de radiotélévision publics.\nLes antennes d'émission ou de réception de signaux radioélectriques (antennes,\nparaboles...) devront être installées conformément à l’article UPE.11.2.\n    5\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPE\n4.4. Ordures ménagères\nLes constructions nouvelles doivent comporter des locaux de stockage des déchets,\nsuffisamment dimensionnés de manière à recevoir et permettre de manipuler sans\ndifficultés tous les récipients nécessaires à la collecte sélective des déchets.\nCes locaux seront isolés et fermés.\n4.5. Rappels : Energies renouvelables\nL’utilisation des énergies renouvelables pour l’approvisionnement énergétique des\nconstructions sera privilégiée.\nArticle UPE.5. Superficie minimale des terrains\nconstructibles\nIl n’est pas fixé de règle.\nArticle UPE.6. Implantation des constructions par\nrapport aux voies et emprises publiques\n6.1. Principe d’implantation des constructions\nLes constructions en superstructure devront être implantées à l’intérieur des emprises\nconstructibles définies au document graphique n° 5.12.\nA l’extérieur de ces emprises constructibles, l’édification de constructions à usage public\n(installations légères de loisirs, édicules et équipements) nécessaires au fonctionnement\ndu parc, tels que kiosque, abri, sanitaires publics… ainsi que les installations liées à\nl’usage de la voie d’eau et à sa signalisation sont toutefois autorisées sous réserve de\nrespecter les dispositions prévues au paragraphe 9.2 de l’article UPE.9 ci-après.\n6.2. Gestion des raccordements entre constructions\nA l’intérieur des emprises constructibles figurant au document graphique n° 5.12, les\nconstructions devront s’établir en ordre continu.\n    6\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPE\n6.3. Saillies* et encorbellements sur espace public, jardins et\nespaces verts à préserver et mettre en valeur repérés au\ndocument graphique n° 5.12 « dispositions règlementaires\napplicables à la zone UPE »\nLes saillies et encorbellements à l’extérieur des limites des emprises constructibles sont\ninterdits, à l’exception des endroits où figure une indication reportée au document\ngraphique n° 5.12.\nLorsqu’ils sont autorisés, ils ne pourront excéder une épaisseur de :\n • 0,16 mètre jusqu'à 3,00 mètres au-dessus du niveau du sol,\n • 0,22 mètre de 3,00 mètres à 4,30 mètres au-dessus du niveau du sol,\n • 0,80 mètre au-dessus de 4,30 mètres au-dessus du niveau du sol.\nLes volumes habitables construits en encorbellement autorisés aux endroits ci-dessus\ndevront en outre répondre aux dispositions suivantes (voir croquis ci-dessous) :\n • la longueur totale de l'emprise des encorbellements ne pourra excéder 50 % du linéaire\n   de façade sur rue,\n • pour chaque encorbellement la longueur à prendre en compte sera la plus grande,\n • les éléments en encorbellement seront distants d'au moins 0,50 mètre des limites\n   séparatives de l’unité foncière.\n    7\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPE\nArticle UPE.7. Implantation des constructions par\nrapport aux limites séparatives\n7.1. Implantation des constructions par rapport à la limite\ncommunale avec Neuilly-sur-Seine\nSur la zone d’implantation reportée au document graphique n° 5.12 en limite avec la\ncommune de Neuilly-sur-Seine, les constructions devront être implantées sur ladite limite\ncommunale.\nSur les parties restantes de cette limite, les constructions pourront être implantées :\n • soit au ras de la dite limite : dans ce cas elles ne devront pas dégager de pignons\n   aveugles de plus de 2 mètres ;\n • soit en retrait de cette limite : dans ce cas, la distance comptée horizontalement de tout\n   point de la construction au point de la limite qui en est le plus rapproché ne pourra être\n   inférieure à :\n    • 8 mètres si la façade concernée comporte des baies éclairant des pièces\n    principales situées en regard de la limite séparative,\n    • 6 mètres si elle n'en comporte pas.\nLa distance ci-dessus s’entend au nu de la façade, balcons non clos exclus.\n7.2. Implantation des constructions par rapport aux autres\nlimites séparatives\nLes constructions devront être implantées à l’intérieur des emprises constructibles définies\nau document graphique n° 5.12 « dispositions règlementaires applicables à la zone UPE ».\nArticle UPE.8. Implantation des constructions les unes\npar rapport aux autres sur une même propriété\nLa distance minimum entre deux constructions non contigües sur une même unité foncière\nest fixée à 8 mètres dès lors que l’une au moins des constructions présente une baie\nprincipale.\nLa distance ci-dessus s’entend au nu de la façade, balcons non clos exclus.\n    8\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPE\nArticle UPE.9. Emprise au sol des constructions*\n9.1. Les constructions en superstructure\nLes constructions en superstructure devront être édifiées à l’intérieur des emprises\nconstructibles définies au document graphique n° 5.12.\nA l’extérieur de ces emprises constructibles, sont toutefois autorisés, sous réserve d’une\nbonne intégration dans le site :\n • Sur les emprises délimitées au paragraphe 9.2. ci-dessous : l’édification d’ouvrages\n    techniques et de petits édicules, liés aux accès et à l’occupation des sous-sols qui ne\n    pourraient être intégrés dans les constructions à condition de respecter la hauteur\n    maximum fixée au paragraphe 10.2.\n • Sur l’ensemble de la zone à l’exclusion des espaces boisés classés figurant au\n   document graphique n° 5.12, l’exclusion ne concerne pas les jardins protégés au titre\n   de L.123-1-5.7° :\n    • l’édification de constructions à usage public (installations légères de loisirs,\n    édicules et équipements) nécessaires au fonctionnement du parc, tels que\n    kiosque, abri, sanitaires publics… à condition de respecter la hauteur maximum\n    fixée au paragraphe 10.2,\n    • ainsi que les ouvrages et installations liées à l’usage et de la voie d’eau et à sa\n    signalisation.\n9.2. Les constructions en infrastructure\nLes constructions en infrastructure pourront s’étendre sous toute l’emprise des parcelles\ncadastrées en section A, n° 1, 17, 18, 22, 23, 25, 27, 29, 31, 33, 37, hors espaces boisés\nclassés figurant au document graphique n°5.12.\nArticle UPE.10. Hauteur maximale des constructions\n10.1. Hauteur maximum des constructions à l’intérieur des\nemprises constructibles\nA l’intérieur des emprises constructibles, la hauteur maximum des constructions résulte de\nl'application des hauteurs fixées en côte NGF* et reportées sur le document graphique\nn° 5.12.\nCette côte maximum correspond au point le plus élevé du bâtiment mesuré au faîtage du\ntoit en cas de toiture à pente ou à l’acrotère ou garde-corps plein en cas de toiture-\nterrasse.\nLe nombre maximal de niveaux autorisé dans ces hauteurs est reporté sur ce document\ngraphique.\n    9\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPE\n10.2. Hauteur maximum des édicules, ouvrages et\nconstructions autorisés au paragraphe 9.1.\nLes équipements publics, petits édicules, ouvrages techniques et installations légères\nautorisés au paragraphe 9.2. de l’article UPE.9., ne pourront excéder une hauteur de\n5 mètres correspondant à 1 niveau maximum (rez-de-chaussée).\nCette hauteur est mesurée à partir du sol naturel jusqu’au point le plus élevé du bâtiment\n(faîtage en cas de toit, acrotère ou garde-corps plein en cas de toiture-terrasse).\n10.3. Dépassements généraux autorisés\nPeuvent dépasser les hauteurs maximum fixées aux paragraphes 10.1. et 10.2. ci-dessus :\n • les ouvrages techniques tels que antennes, gaines de ventilation, souches de\n   cheminée, capteurs d’énergie, machinerie d’ascenseurs… sous réserve d’être situés en\n   retrait de la façade du dernier niveau et de manière la moins visible possible depuis\n   l’espace public, à condition de ne pas excéder 1,5 m de dépassement,\n • les lisses des garde-corps pleins ou ajourés à condition de ne pas excéder 0,50 m de\n   dépassement,\n • les installations liées à l’usage de la voie d’eau et à sa signalisation.\nArticle UPE.11. Aspect extérieur des constructions et\naménagement de leurs abords\n11.1. Dispositions générales\nTout projet peut être refusé ou n’être accordé que sous réserve de l’observation de\nprescriptions spéciales si les constructions, par leur architecture, leurs dimensions ou\nl’aspect extérieur des bâtiments ou ouvrages à édifier ou à modifier, sont de nature à porter\natteinte au caractère ou à l’intérêt des lieux avoisinants, aux sites, aux paysages naturels\nou urbains, ainsi qu’à la conservation des perspectives monumentales.\n11.2. Traitement des façades\nLes imitations de matériaux et l’emploi à nu en parement extérieur de matériaux destinés à\nêtre recouverts sont interdits.\nLe caractère d'origine de la façade devra être préservé. Les ravalements devront être\nexécutés en respectant les matériaux d'origine de la façade ainsi que les composants de\nsa modénature. Les revêtements en ciment gris ainsi que la peinture de la pierre de taille\nsont interdits.\n    10\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPE\nLes surélévations et redressements de toitures des bâtiments existants devront être traités\nen harmonie avec l'architecture originelle et les matériaux du bâtiment concerné.\nLa nature et la teinte des matériaux apparents en façade, y compris pour les parties de\nfaçade en retrait, devront être choisies de façon à conserver une tenue correcte dans le\ntemps, en tenant compte de l’harmonie générale du site.\n11.3 Fermeture de balcons et terrasses intermédiaires\n •   La fermeture des terrasses est interdite au-dessus des hauteurs fixées en cote NGF\n    sur le document graphique n° 5.12.\n •   La fermeture des balcons ainsi que des loggias est interdite sur l’ensemble des\n    constructions à destination d’habitation.\n    Néanmoins pourra être autorisée la fermeture des balcons existants sur la façade\n    côté Seine des constructions à destination d’habitation situées du n° 8 au n° 18 allée\n    Claude Monet, sous réserve que cette fermeture s’effectue dans le cadre d’une\n    recomposition architecturale globale de la totalité de cette façade commune\n    englobant des fermetures simultanées, et en harmonie avec la volumétrie et les\n    matériaux d’origine.\n11.4. Murs pignons et locaux annexes\nLes murs pignons devront être traités en harmonie avec les façades principales. Les locaux\nannexes seront traités avec un soin égal à celui apporté aux constructions principales.\n11.5. Façades commerciales, enseignes\nOn entend par façade commerciale toute devanture établie dans un but commercial et\nentraînant la modification ou le recouvrement du gros œuvre.\nLes façades commerciales devront répondre aux conditions suivantes :\n • les percements destinés à recevoir des vitrines devront être adaptés à l’architecture de\n   la construction concernée,\n •    les vitrines ne pourront présenter de saillie à l’extérieur de la limite de l’emprise\n   constructible figurant au document graphique n° 5.12.\n11.6. Clôtures\nLes clôtures font partie intégrante de l’harmonie générale du site. Toute modification ou\ncréation de clôtures devra faire l’objet d’un projet d’ensemble.\n    11\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPE\nLes clôtures en bordure de voie ou entre propriétés devront être à claire voie. La hauteur\nne pourra excéder 2 mètres.\nSur toutes les clôtures l’ajout à posteriori d’écrans opaques est interdit, seul le doublage\npar des haies végétales ou des plantes grimpantes est autorisé.\n11.7. Toitures\n11.7.1. Toitures en pente\nLes matériaux des toitures en pente devront présenter une bonne tenue dans le temps.\n11.7.2. Toitures-terrasses\n11.7.2.1. Principes généraux\nLes toitures terrasses de tout type devront être traitées avec autant de soin que les\nfaçades.\nLes étanchéités auto-protégées des toitures terrasses ainsi que les protections par\ngravillons ne pourront être laissées apparentes.\nLes terrasses jardins devront être conçues de manière à ce que le verdissement soit autant\nque possible perceptible depuis l’espace public.\nLes parties minérales seront traitées avec soin et constituées d’un revêtement soigné.\n11.7.2.2. Toitures-terrasses inaccessibles\nLes toitures-terrasses inaccessibles seront végétalisées à l’exception des parties occupées\npar les ouvrages techniques, verrières, capteurs d’énergie (panneaux solaires…)… Cette\nvégétalisation sera assurée par une solution technique de type traditionnel (végétalisation\nintensive* ou semi-intensive* avec apport de terre végétale), ou par toute autre solution\nnon traditionnelle (végétalisation extensive comportant une couche végétale sur substrat\npar exemple).\nLorsqu’il y a utilisation de substrats, ceux-ci devront comporter une épaisseur minimum de\n11 centimètres.\nCette végétalisation devra également être réalisée en cas de réhabilitation lourde ou de la\nréfection de la toiture d’un bâtiment existant qui n’en n’aurait pas bénéficié lors de sa\nconstruction. Dans ce cas l’épaisseur de substrat imposée ci-dessus pourra être ajustée\naux contraintes techniques de l’existant.\nCette végétalisation devra être maintenue lors d’une réfection de la toiture.\n    12\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPE\n11.7.2.3. Toitures-terrasses accessibles\nEn dehors des parties occupées par les ouvrages techniques ou par les circulations\nnécessaires aux usagers et espaces voués aux loisirs, les terrasses accessibles devront\nêtre paysagées* et recevoir une végétalisation intensive, semi-intensive ou extensive*.\n11.7.2.4. Toitures-terrasses vérandas\nLes vérandas, autorisées en couverture de terrasses aux endroits indiqués au document\ngraphique n° 5.12, devront constituer un ensemble homogène et soigné dans leur\nvolumétrie, le choix et la mise en œuvre des matériaux utilisés,…\n11.8. Prescriptions relatives à l’aspect extérieur des\nconstructions\nLes ouvrages et installations tels que groupes électrogènes, appareils de climatisation…,\nseront situés à l’intérieur des constructions, ou intégré en fond de loggia ou en toiture-\nterrasse.\nLes édicules affectés aux machineries d’ascenseurs et aux sorties d’escaliers, lorsqu’ils ne\nseront pas intégrés dans le volume du dernier étage, seront traités avec le même matériau\nque les façades et intégrés à l’aménagement d’ensemble de la toiture-terrasse.\nLes réseaux techniques en toiture ou en terrasse tels que la ventilation mécanique\ncontrôlée, les ventilations diverses, seront, sauf impossibilité technique avérée, camouflés\npar un revêtement identique à la façade ou s’harmonisant avec elle.\nLes ouvrages ou édicules techniques et l’aménagement des entrées extérieurs à la\nconstruction et situés à rez-de-chaussée, ainsi que les ventilations des sous-sols non\nsituées en toiture devront être traités avec soin et s’harmoniser avec les façades tant en ce\nqui concerne la nature des matériaux que leur couleur.\nLes évacuations d’eaux pluviales correspondant aux loggias et aux balcons pleins devront\nêtre intégrées à l’intérieur des constructions, situées en fond de loggia ou encastrées dans\nla façade.\nLes antennes d’émission ou de réception de signaux radioélectriques (antennes,\nparaboles,…) devront être installées sur les toitures de la façon la moins visible possible\ndepuis l’espace public.\nLes boites aux lettres des immeubles collectifs seront situées à l’intérieur des bâtiments.\n    13\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPE\nArticle UPE.12. Obligations imposées aux\nconstructeurs en matière de réalisation d'aires de\nstationnement\n12.1. Dispositions générales\nLe stationnement de véhicules motorisés correspondant aux besoins des constructions et\ninstallations nouvelles ou aux travaux sur constructions existantes doit être assuré en\ndehors de la voie publique, sur l’unité foncière* propre à l’opération ou dans son\nenvironnement immédiat.\nS’il est admis qu’une impossibilité technique ou des motifs d’architecture ou d’urbanisme\ninterdisent de réaliser les places de stationnement résultant de l’application des\nparagraphes 12.2. à 12.3., le pétitionnaire peut être autorisé à les reporter à proximité, en\napportant la preuve qu’il les obtient par concession dans un parc public ou par concession\nou acquisition dans un parc privé existant ou en cours de réalisation.\nLorsqu'une aire de stationnement a été prise en compte dans le cadre d'une concession à\nlong terme ou d'un parc privé de stationnement, au titre des obligations prévues aux\npremier et deuxième alinéas ci-dessus, elle ne peut plus être prise en compte, en tout ou\nen partie, à l'occasion d'une nouvelle autorisation.\n12.2. Caractéristiques dimensionnelles et nombre\nd’emplacements\nLes espaces à réserver pour assurer l’évolution et le stationnement des véhicules doivent\nsatisfaire aux normes et prescriptions définies ci-après.\n12.2.1. Dimensions des places et des rampes d’accès au sous-sol\nL’aménagement des aires de stationnement devra répondre aux caractéristiques\ndimensionnelles suivantes :\nChaque emplacement doit préserver une accessibilité satisfaisante et des dimensions au\nmoins égales à :\n • longueur : 5 mètres\n • largeur : 2,30 mètres\n • dégagement :\n    • 6 mètres entre poteaux ou portes de boxes,\n    • 5 mètres entre places non cloisonnées.\nLes rampes d’accès aux sous-sols ne doivent pas entraîner de modification dans le niveau\ndu trottoir et leur pente, dans les cinq premiers mètres ne doit pas excéder 5 % sauf en cas\nd’impossibilité technique.\n    14\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPE\nElles doivent avoir la largeur minimum suivante :\n • sens unique : 3,50 mètres,\n • double sens desservant moins de 50 voitures : 3,50 mètres,\n • double sens desservant plus de 50 voitures : 6,00 mètres.\nLeur rayon intérieur de courbure doit être supérieur ou égal à 5 mètres. Leur rayon\nextérieur de courbure doit être supérieur ou égal à 9 mètres.\nToutefois, les dimensions des rayons de courbure pourront être modulées pour tenir\ncompte des nécessités résultant de contraintes techniques motivées.\n12.2.2. Nombre d’emplacements\n12.2.2.1. Constructions à usage d’habitation*\nIl sera créé une place de stationnement par tranche de 75 m² de surface de plancher\n(SDP*) de construction avec un minimum d’une place par logement.\nLes places doubles sont autorisées à condition que le nombre des places directement\naccessibles soit au moins égal au nombre de logements.\nPour la construction de logements locatifs financés avec un prêt aidé par l’Etat, il ne sera\nexigé que 0,50 place de stationnement par logement.\n12.2.2.2. Activités commerciales\nLa surface des aires de stationnement à réaliser devra être au moins égale à 60% de la\nsurface de plancher créée affectée à l’activité commerciale.\n12.2.2.3. Constructions à usage de bureaux*\nII sera créé une place de stationnement par tranche de 70 m² de surface de plancher.\nLes places doubles ne sont pas comptabilisées dans le calcul des normes imposées.\n12.2.2.4. Constructions et Installations Nécessaires aux Services Publics ou\nd’Intérêt Collectif (CINASPIC)*\nLe nombre de places à créer devra correspondre aux besoins de l’établissement à\nconstruire, appréciés en fonction de sa nature, de son fonctionnement et de sa situation\ngéographique. Ces places pourront être intégrées dans un parking public.\n12.2.3. Calcul du nombre de places\nLe nombre de places sera arrondi au chiffre inférieur lorsque le calcul du nombre de places\nde stationnement a une décimale égale ou inférieure à 0,5, et au chiffre supérieur lorsque\nla décimale est supérieure ou égale à 0,6.\n    15\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPE\n12.3. Normes de stationnement spécifiques aux deux roues\nDans les immeubles d’habitation ou de bureau, le stationnement des vélos devra respecter\nles dispositions et les normes du Code de la Construction et de l’Habitation et être situé au\nrez-de-chaussée ou au premier sous-sol réservé au stationnement automobile, dans des\nlocaux clos et facilement accessibles.\nCependant, pour les résidences pour personnes âgées, les foyers d’accueil pour\npersonnes handicapées la superficie à réserver éventuellement au stationnement des\nvélos doit tenir compte de la nature et du fonctionnement des établissements, de leur\nsituation géographique et de leurs utilisateurs.\nEn l’absence de réalisation de parc de stationnement, il devra néanmoins être réalisé, dans\nles immeubles principalement d’habitation ou de bureau, un ou plusieurs locaux en sous-\nsol ou en rez-de-chaussée, clos et couvert dont la surface totale devra correspondre aux\nbesoins de l’immeuble.\nPour le commerce, la surface du ou des locaux devra avoir une superficie de 1 m² pour 150\nm² de SDP créée à partir de 300 m² de SDP créée.\nPour les CINASPIC, ces locaux devront correspondre au besoin de l’immeuble.\n12.4. Suppression des aires de stationnement\nAucune place de stationnement existante ne peut être supprimée lorsque les normes\ndéfinies ci-dessus ne sont pas respectées.\nArticle UPE.13. Obligations imposées aux\nconstructeurs en matière de réalisation d'espaces\nlibres, d'aires de jeux et de loisirs, et de plantations\n13.1. Espaces boisés classés\nLes espaces boisés classés* à conserver, à protéger ou à créer figurant au document\ngraphique n° 5.12 « dispositions règlementaires applicables à la zone UPE » sont soumis\naux dispositions spécifiques prévues par le Code de l'urbanisme.\n    16\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPE\n13.2. Traitement des espaces verts et jardins existants ou à\ncréer\nLes espaces verts et jardins repérés au document graphique n° 5.12 devront être\npréservés et mis en valeur, sans diminution de l'épaisseur de terre existante. Ils peuvent\ncomporter des aires de jeux ou de détente ainsi que des aménagements piétonniers Les\nplantations existantes seront conservées ou remplacées in situ.\nL’aménagement des espaces verts et jardins situés en bordure de voie devra en outre\npermettre la plantation d'un arbre de moyen ou grand développement par fraction de 7\nmètres de linéaire sur voie. Ces arbres devront disposer d'une épaisseur minimum de 2\nmètres de terre végétale non compris la couche drainante.\n13.3. Traitement des espaces libres à l’intérieur des emprises\nconstructibles\nLes espaces libres de construction situés à l’intérieur des emprises constructibles repérées\nau document graphique n° 5.12 devront être aménagés en continuité des espaces verts et\njardins figurant au document graphique et recevoir un traitement de qualité.\n13.4. Edicules, ouvrages et constructions autorisés au\nparagraphe 9.2. de l’article UPE.9.\nLes dispositions des paragraphes 13.2. à 13.3 ci-dessus ne s’appliquent pas aux édicules,\nouvrages et constructions autorisés au paragraphe 9.2. dans les conditions fixées au\nparagraphe 10.2. de l’article UPE.10.\n    17\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UPE\nSection 3\nPossibilités maximales d'occupation du\nsol\nArticle UPE.14. Coefficient d'occupation du sol\nIl n’est pas fixé de coefficient d’occupation du sol.\n    18\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "Titre III – Lexique", "", "Les termes repérés par un astérisque dans le corps du règlement sont définis ci-\ndessous :\nAcrotère : L'acrotère est le muret situé en bordure de toiture terrasse permettant le relevé\nd’étanchéité, non compris les éléments d’ornementation et garde-corps pleins ou à claire-\nvoie.\nAlignement : Limite du domaine public (voirie, places et squares publics, emprises\nferroviaires, cimetières…) au droit des propriétés privées riveraines.\nArtisanat : Cette destination comprend les locaux et leurs annexes où sont exercés des\nactivités de production, de transformation, de réparation ou de prestation de service\nrelevant de l'artisanat.\nArbre : On distingue :\n • les arbres à petit développement (hauteur jusque 8 mètres à la taille adulte) ;\n • les arbres à moyen développement (hauteur supérieure à 8 mètres et inférieure à 15\n   mètres à la taille adulte) ;\n • les arbres à grand développement (hauteur supérieure à 15 mètres à la taille adulte).\nLes dalles couvrant des parcs de stationnement et autres constructions en sous-sol\ndevront recevoir une épaisseur de terre végétale au moins égale à :\n • 1 mètre pour les arbres à petit développement,\n • 1,5 mètre pour les arbres à moyen développement,\n • 2 mètres pour les arbres à grand développement.\nArbre « existant » : Arbre non mentionné au plan de zonage, contrairement à l’arbre dit «\nintéressant ».\nArbre « intéressant » : Arbre mentionné notamment au document graphique n° 5.1\n« zonage et servitudes ». Un arbre est considéré comme « intéressant » de part tout ou\npartie des caractéristiques suivantes : son essence, son âge, sa valeur paysagère, son\nenvergure remarquable, ...\nBaie : Une baie est une ouverture pratiquée dans une paroi qui permet à une personne de\nvoir à l’extérieur à partir de la position debout sur le plancher du local. Les portes et\nfenêtres sont des baies. Les balcons ne sont pas des baies ne s’agissant pas d’ouvertures\npratiquées dans une paroi.\nBaie principale : Toute baie éclairant une pièce principale (pièce destinée au séjour, au\nsommeil ou au travail).\nBaie secondaire : Toute baie éclairant une pièce secondaire (pièce destinée à la cuisine,\nsalle de bain, toilettes, hall…)\nBalcon : élément d'architecture consistant en une plate-forme entourée d’un garde-corps\nou d'une balustrade faisant saillie sur la façade d'un bâtiment et sur laquelle on peut\naccéder de l'intérieur par une ou plusieurs baies.\nBureaux : Cette destination comprend les locaux et annexes dépendant d'organismes\npublics ou privés ou de personnes physiques.\nSont considérés comme locaux à destination de bureaux tous les locaux et leurs annexes\ntels que couloirs, dégagements salles de réunion, d'exposition, d'archives, salles d'attente\n    1\n    PLU Levallois-Perret –Modification n°1 du PLU\n    Pièce n°4.1. Règlement", "et de réception, où sont exercées des activités de direction, de services, de conseil, de\ngestion, d'étude, d'ingénierie, de conception, de recherche et développement, de traitement\nmécanographique ou d'informatique de gestion et quelle que soit leur implantation, les\nbureaux de la direction générale d'une entreprise industrielle, de ses services généraux,\nfinanciers, juridiques et commerciaux.\nLes professions libérales telles que cabinets médicaux, juridiques, … en font également\npartie.\nCésure : Dans la zone UC, la césure consiste en une interruption de la volumétrie d’un\nbâtiment dans les derniers niveaux de la construction. Il existe de types deux césures selon\nqu’elle affecte le dernier ou les deux derniers niveaux. Ces pauses d’une largeur minimum\nde 6 mètres permettent d’y réaliser des terrasses plantées et végétalisées renforçant le\nverdissement de l’îlot.\nCommerce : Cette destination comprend les locaux affectés à la vente de produits ou de\nservices et accessibles à la clientèle, et leurs annexes (à l'exception des locaux relevant de\nla destination artisanat définie plus haut). Les activités de présentation et de vente\ndirecte au public doivent constituer une activité prédominante.\nConstructions et installations nécessaires aux services publics ou d’intérêt collectif\n(CINASPIC) : Elles recouvrent les destinations correspondant aux catégories suivantes :\n  • Les locaux affectés aux services publics municipaux, départementaux, régionaux ou\n    nationaux.\n  • Les constructions et installations techniques nécessaires au fonctionnement des\n    services de secours, de lutte contre l'incendie et de police (sécurité, circulation...).\n • Les crèches et haltes garderies.\n • Les établissements d’enseignement maternel, primaire et secondaire.\n • Les établissements universitaires.\n • Les établissements pénitentiaires.\n • Les établissements de santé : hôpitaux (y compris les locaux affectés à la recherche),\n   cliniques, dispensaires, centres de court et moyen séjour, résidences médicalisées...\n • Les établissements culturels et les salles de spectacle spécialement aménagées de\n   façon permanente pour y donner des concerts, des spectacles de variétés ou des\n   représentations d’art dramatique, lyrique ou chorégraphique, à caractère non\n   commercial.\n • Les centres d’hébergement et de réinsertion sociale, les établissements suivants\n   lorsqu’ils sont financés par un prêt aidé par l’Etat : résidences sociales, logements-\n   foyers définis à l’article R 351-55 du Code de la construction et de l’habitation et foyers-\n   étudiants.\n • Les édifices cultuels.\n • Les établissements sportifs à caractère non commercial.\n • Les bâtiments ou installations techniques conçus spécialement pour le fonctionnement\n   de réseaux ou de services urbains.\n • Les constructions et installations nécessaires au fonctionnement de l’activité ferroviaire.\nCote NGF : Altitude de référence appelée cote de « Nivellement Général de la France »\nconstituant un réseau de repères altimétriques disséminés sur le territoire français\nmétropolitain. Ce réseau est actuellement le réseau de nivellement officiel en France\nmétropolitaine. Le niveau « zéro » est déterminé par le marégraphe de Marseille.\n    2\n    PLU Levallois-Perret –Modification n°1 du PLU\n    Pièce n°4.1. Règlement", "Couche drainante : Couche de matériaux perméables qui permet de collecter l’eau\nd’infiltration.\nEmplacement réservé : Les documents graphiques du règlement délimitent des\nemplacements sur lesquels sont interdits toutes constructions ou aménagements autres\nque ceux prévus par le document d’urbanisme (équipement public, ouvrage public ou\ninstallation d'intérêt général, espace vert public, voirie publique). Les propriétaires des\nterrains concernés peuvent exercer le droit de délaissement auprès de la collectivité\nbénéficiaire de l’emplacement. Les emplacements réservés sont recensés en annexe du\nrèglement du PLU.\nEmprise au sol des constructions : Il s’agit de la superficie qu’occupe au sol une\nconstruction en superstructure.\nEmprise publique : Espaces publics non qualifiés de voies publiques qui permettent\nd’ordonnancer les constructions pour l’application de l’article 6 du règlement de zone (place\nurbaine…).\nEncorbellement : L’encorbellement est une construction en saillie du plan vertical d’un\nmur, soutenue en porte-à-faux. Un volume habitable en encorbellement correspond à des\nparties d’étages (bow-windows par exemple), des galeries ou des balcons clos. Le mot\nhabitable ne se limite pas à la destination « habitation » mais concerne toute destination.\nEntrepôt : Cette destination comprend les locaux d’entreposage et de reconditionnement\nde produits ou de matériaux.\nEspace Boisé Classé : Le PLU peut classer en espace dit « Espace Boisé classé » des\nbois, forêts, parcs, arbres isolés, haies, plantations d'alignement… à conserver, protéger\nou créer, qu'ils soient ou non soumis au Code forestier, enclos ou non. Ce classement\ninterdit tout changement d'affectation et tout mode d'occupation du sol de nature à\ncompromettre la conservation, la protection ou la création de ces boisements.\nEspaces libres : Les espaces libres correspondent aux espaces non occupés par des\nconstructions en élévation. Ils comprennent les surfaces des voiries et d’accès, les aires de\njeux et de détente, les espaces verts, les cheminements piétons et deux-roues, les rampes\nd'accès à des sous-sols, les aires extérieures de stationnement, les rampes et\nemmarchements d'une hauteur inférieure ou égale à 0,60 mètre, les bassins de plain-\npied…\nEspace vert : Un espace vert désigne un espace planté d'arbres, d'arbustes, de légumes,\nde fleurs et / ou engazonné ainsi que les éléments ornementaux, les accès, les sentiers\nnon imperméabilisés. Il peut être ou non en \"pleine terre\".\nFaçade principale : La façade principale est la façade où est localisée l’entrée principale\ndu bâtiment.\nFaîtage : Ligne de jonction supérieure de deux pans de toiture inclinés suivant d
