ées sur les toitures de la façon la moins visible possible\ndepuis l’espace public. Sur les toitures-terrasses, elles seront implantées de manière\nprivilégiée en zone centrale.\nLes coffrets, compteurs et boites aux lettres des immeubles collectifs seront situées à\nl’intérieur des bâtiments.\nLes branchements (câbles électriques, télécom…) seront obligatoirement réalisés en\nsouterrain, ou bien intégrés au volume des bâtiments.\n    14\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UC\nArticle UC.12. Obligations imposées aux constructeurs\nen matière de réalisation d'aires de stationnement\n12.1. Stationnement des véhicules motorisés\n12.1.1. Dispositions Générales\nLe stationnement de véhicules motorisés correspondant aux besoins des constructions et\ninstallations nouvelles ou aux travaux sur constructions existantes doit être assuré en\ndehors de la voie publique, sur l’unité foncière* propre à l’opération ou dans son\nenvironnement immédiat.\nS’il est admis qu’une impossibilité technique ou des motifs d’architecture ou d’urbanisme\ninterdisent de réaliser les places de stationnement résultant de l’application des\nparagraphes 12.1.2. à 12.1.5., le pétitionnaire peut être autorisé à les reporter à proximité,\nen apportant la preuve qu’il les obtient par concession dans un parc public ou par\nconcession ou acquisition dans un parc privé existant ou en cours de réalisation.\nLorsqu'une aire de stationnement a été prise en compte dans le cadre d'une concession à\nlong terme ou d'un parc privé de stationnement, au titre des obligations prévues aux\npremier et deuxième alinéas ci-dessus, elle ne peut plus être prise en compte, en tout ou\nen partie, à l'occasion d'une nouvelle autorisation.\n12.1.2. Accès\nLes rampes d’accès au sous-sol ne doivent pas entraîner de modification dans le niveau du\ntrottoir, et leur pente, dans les cinq premiers mètres à partir de l’alignement*, ne doit pas\nexcéder 5 %, sauf en cas d’impossibilité technique.\nLes rampes d’accès doivent avoir la largeur minimum suivante :\n  • Sens unique ou double sens desservant moins de 50 places de stationnement pour\n    voitures : 3,50 mètres.\n  • Double sens desservant plus de 50 places de stationnement pour voitures : 6 mètres.\nLes rampes d’accès au sous-sol doivent présenter un rayon intérieur de courbure supérieur\nou égal à 5 mètres. Leur rayon extérieur de courbure doit être d’au minimum 9 mètres.\nToutefois, les dimensions des rayons de courbure pourront être modulées pour tenir\ncompte des nécessités résultant de contraintes techniques motivées, notamment par\nl’exiguïté de certaines unités foncières.\n    15\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UC\n12.1.3. Dimensions des emplacements\nDans une aire collective de stationnement, chaque emplacement, doit présenter des\ndimensions au moins égale à :\n • longueur : 5 mètres\n • largeur : 2,30 mètres\n • dégagement :\n    • 6 mètres entre poteaux ou portes de boxes\n    • 5 mètres entre places non cloisonnées\n    16\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UC\n12.1.4. Dispositions spécifiques\nLes aires de stationnement devront être réalisées en sous-sol.\nLes normes s’appliquent aux constructions ou installations nouvelles ainsi qu’aux\nconstructions existantes, dès lors qu’il n’est pas expressément prévu d’exception.\nLorsqu’une construction comprend des parties à destinations différenciées, le nombre total\ndes places à réaliser résulte du cumul des places exigibles pour chaque destination de\nconstructions.\nLe nombre de places requises sera arrondi au chiffre inférieur lorsque le calcul du nombre\nde places de stationnement a une décimale inférieure ou égale à 0,5, et arrondi au chiffre\nsupérieur lorsque la décimale est supérieure ou égale à 0,6.\n12.1.5. Normes de stationnement\n12.1.5.1. Constructions à destination d’habitation*\nIl est exigé une place de stationnement automobile par tranche de 85 m² de surface de\nplancher (SDP*) de construction, avec un minimum d’une place par logement.\nPour les résidences ou foyers pour étudiants ou pour personnes âgées il ne sera exigé\nqu’une place pour 150m² de SDP.\nPour la construction de logements locatifs financés avec un prêt aidé par l’Etat, il ne sera\nexigé que 0,50 place de stationnement automobile par logement.\nLes places doubles sont autorisées à condition que le nombre des places directement\naccessibles soit au moins égal au nombre de logements.\nPar ailleurs, il est exigé la réalisation d’aires de stationnement pour les deux roues\nmotorisées, représentant 1 % de la SDP, avec un minimum de 10 m².\nPour les résidences pour personnes âgées, il n’est exigé que la réalisation d’une aire de 10\nm² minimum réservée aux deux roues motorIsées.\nCes dispositions ne s’appliquent qu’aux bâtiments comprenant un parc de stationnement.\n12.1.5.2. Constructions à destination de commerces\nIl n’est pas exigé la réalisation de places de stationnement automobile pour les commerces\ndont la SDP est inférieure ou égale à 300 m² ou qui sont situés dans un rayon de    150\nmètres autour de l’accès véhicule d’un parking public existant ou projeté.\nIl est exigé 1 place de stationnement automobile par tranche de :\n• 150 m² de SDP pour les commerces dont la SDP est comprise entre 300 m² et    1\n    000 m².\n• 60 m² de SDP pour les commerces dont la SDP est supérieure à 1 000 m² et inférieure\n    ou égale à 2 000 m².\n• 45 m² pour les commerces dont la SDP est supérieure à 2 000 m².\n    17\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UC\nPar ailleurs, pour les commerces dont la SDP est supérieure à 2 000 m², il est exigé la\nréalisation d’aires de chargement, déchargement, et de manutention nécessaires au\nfonctionnement de l’établissement. Nonobstant la disposition imposant aux aires de\nstationnement d’être obligatoirement réalisées en sous-sol, ces aires de chargement,\ndéchargement et de manutention pourront être réalisées en rez-de-chaussée sous réserve\nd’être intégrées au bâtiment.\n12.1.5.3. Artisanat*\nIl n’est pas exigé la réalisation de places de stationnement automobile pour les locaux à\ndestination d’artisanat et d’industrie, dont la SDP est inférieure ou égale à 300 m².\nIl est exigé une place de stationnement automobile par tranche de 300 m² de SDP créée.\nEn plus des aires de stationnement pour véhicules particuliers, il sera imposé pour les\nlocaux dont la SDP est supérieure à 1 000 m², la création d’aires de livraison adaptées aux\nopérations de chargement, déchargement et manutention inhérentes à l’établissement.\n12.1.5.4. Hébergement hôtelier*\n12.1.5.4.1. Véhicules particuliers\nIl sera réalisé au minimum une place de stationnement pour 5 chambres.\n12.1.5.4.2. Autocars\nToutes dispositions devront être prises pour que la desserte des hôtels de tourisme    par\nautocars et taxis ne génère aucune gêne pour la circulation publique.\nAu-delà de 150 chambres, il sera exigé une place de stationnement d'autocar par tranche\nde 150 chambres, calculée par excès. Dans ce cas, l'obligation de créer les places de\nstationnement en sous-sol ne sera pas imposée.\n12.1.5.5. Constructions et Installations Nécessaires aux Services Publics ou\nd’Intérêt Collectif (CINASPIC)*\nLe nombre de places à réaliser devra correspondre aux besoins de l’immeuble à\nconstruire, appréciés en fonction de la nature de l’établissement, de son fonctionnement et\nde sa situation géographique (notamment par rapport aux parkings publics et aux\ntransports en commun).\nPar ailleurs, les aires de chargement, déchargement et de manutention nécessaires au\nfonctionnement de l’établissement pourront être imposées sur le terrain.\n12.2. Stationnement des vélos et poussettes\n12.2.1 Stationnement des vélos\nDans les immeubles d’habitation ou de bureau, le stationnement des vélos devra respecter\nles dispositions et les normes du Code de la Construction et de l’Habitation et être situé au\n    18\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UC\nrez-de-chaussée ou au premier sous-sol réservé au stationnement automobile, dans des\nlocaux clos et facilement accessibles.\nPour les CINASPIC, les résidences pour personnes âgées, les foyers d’accueil pour\npersonnes handicapées : la superficie à réserver éventuellement au stationnement des\nvélos doit tenir compte de la nature et du fonctionnement des établissements, de leur\nsituation géographique et de leurs utilisateurs.\n12.2.2. Dispositions particulières pour le stationnement des vélos\nEn l’absence de réalisation de parc de stationnement, il devra néanmoins être réalisé, dans\nles immeubles principalement d’habitation ou de bureau, un ou plusieurs locaux en rez-de-\nchaussée, clos et couverts, pour le stationnement des vélos, dont la surface totale devra\ncorrespondre aux besoins de l’immeuble.\nCes locaux pourront être communs avec ceux réservés aux poussettes et situés en rez-de-\nchaussée des constructions.\n12.2.3. Stationnement des poussettes\nPour les constructions à destination d’habitation créant plus de 10 logements, il devra être\nréalisé un ou plusieurs locaux en rez-de-chaussée, clos et couverts, pour le stationnement\ndes poussettes.\nLa surface réservée au stationnement des poussettes doit représenter au minimum 4m²\npar tranche complète de 10 logements.\nCes locaux pourront être communs avec ceux réservés aux vélos, dès lors que ces\nderniers sont situés au rez-de-chaussée des constructions.\nCes dispositions ne s’appliquent pas aux résidences ou foyers pour étudiants, pour\npersonnes âgées, aux logements-foyers, et aux foyers d’accueil pour personnes\nhandicapées.\n12.3. Suppression des places de stationnement des véhicules\nmotorisés ou aires de stationnement de véhicules non\nmotorisés\nAucune surface ou place de stationnement existante ne peut être supprimée, dès lors que\nla surface ou le nombre de places exigibles n’est pas réalisé.\n    19\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UC\nArticle UC.13. Obligations imposées aux constructeurs\nen matière de réalisation d'espaces libres, d'aires de\njeux et de loisirs, et de plantations\n13.1. Espaces boisés classés*\nLes espaces boisés classés à conserver, à protéger ou à créer, figurant au document\ngraphique n° 5.1 « zonage et servitudes » sont soumis aux dispositions spécifiques du\ncode de l’urbanisme.\n13.2. Traitement des espaces libres et des emprises à\nvégétaliser\nLes espaces libres et les emprises à végétaliser repérées au document graphique\nn° 5.1 « zonage et servitudes » doivent être aménagés en espaces verts et recevoir un\ntraitement paysager de qualité et diversifié, comportant des arbres* et/ou arbustes.\nCes espaces pourront comporter des aires de jeux ou de détente ainsi que des\naménagements piétonniers.\n13.3. Traitement du parc public\nLe parc public, hors ouvrages techniques, édicules et installations légères autorisés au\nparagraphe 2.1.2.3. et hors traitement des accès aux équipements et au parc de\nstationnement public, doit présenter les épaisseurs de terre végétale* nécessaires aux\ndifférentes catégories de plantation : pelouse, arbustes, arbres* à petit, moyen et grand\ndéveloppement.\nLes ouvrages techniques, édicules, installations légères et aménagement des accès aux\néquipements publics doivent faire partie intégrante de la composition d’ensemble du parc.\n13.4. Arbres intéressants*\nLes arbres intéressants sont repérés au document graphique n° 5.1 « zonage et\nservitudes ».\nLes aménagements prévus sur les terrains devront tenir compte de ce patrimoine naturel :\nl’implantation des constructions devra, sauf impossibilité technique avérée, éviter leur\ndestruction.\nToutefois, dans le cas où un arbre intéressant serait abattu, il devra être remplacé par un\narbre de même espèce ou par un arbre susceptible de redonner une valeur paysagère\néquivalente.\n    20\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UC\n13.5. CINASPICS*\nLes dispositions des paragraphes 13.1. et 13.2. ci-dessus pourront être assouplies pour\ns’adapter à la destination et au fonctionnement propre aux CINASPIC.\n    21\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UC\nSection 3\nPossibilités maximales d'occupation du\nsol\nArticle UC.14. Coefficient d'occupation du sol\nIl n’est pas fixé de coefficient d’occupation du sol.\n    22\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\nChapitre IV\nDispositions    applicables    en\nzone UD\n« La zone UD correspond à un secteur situé entre le quartier Front de Seine et le tissu\nancien et est caractérisée par un urbanisme hétérogène et mutable. Pour ménager une\ntransition urbaine entre le tissu ancien et le nouveau quartier Front de Seine, une zone\nspécifique est créée. Le lien direct avec la station de métro Pont de Levallois offre\nl’opportunité de définir un projet emblématique en conformité avec les orientations du\nPADD qui visent à renforcer les fonctions économiques de la commune et son rôle actif\ndans le rayonnement de l’agglomération parisienne tout en favorisant l’équilibre entre\nemploi et habitat. Cette zone permet un développement urbain mixte (habitat, bureaux,\ncommerce, équipements) avec l’intégration de trottoirs élargis (Paul Vaillant-Couturier,\nMarius Aufan, Anatole France et Baudin) et paysagers pour certains, afin d’assurer des\ncontinuités vertes le long de certains axes. Elle participe à la satisfaction du double objectif\nde valorisation d’un pôle économique marquant l’entrée de la rue Anatole France et de\nconstruction de logements ».\nLa zone UD fait l’objet d’orientations d’aménagement et de programmation.\nCertains terrains de la zone sont concernés par des servitudes instaurées au titre de\nl’article L.151-41 du code de l’urbanisme pour l’élargissement de trottoirs.\nCertaines dispositions règlementaires qui lui sont applicables sont figurées au document\ngraphique n° 5.5 « dispositions règlementaires applicables à la zone UD ».\nLa zone UD comprend un secteur UDa, à l’intérieur duquel les constructions à destination\nde bureau et d’industrie sont admises.\n    1\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\nSection 1\nNature de l'occupation et de l'utilisation\ndu sol\nArticle UD.1. Occupations et utilisations du sol\ninterdites\n1.1. Les constructions à destination d’entrepôt*.\n1.2. Les dépôts de ferrailles, de matériaux, de combustibles solides, ainsi que les\nentreprises de cassage de voitures et de transformation de matériaux de récupération.\n1.3. Les dépôts d'ordures ménagères, de résidus urbains ou de déchets de matériaux.\n1.4. Les carrières.\n1.5. Les installations classées soumises à la directive SEVESO, ou présentant des risques\ntechnologiques graves, ainsi que celles qui pourraient entraîner, pour le voisinage, une\ninsalubrité ou un sinistre susceptible de causer des dommages graves ou irréparables aux\npersonnes et/ou aux biens.\n1.6. Le stationnement des caravanes isolées, de résidences mobiles de loisirs,\nd’habitations légères de loisirs, l'ouverture de terrains de camping ou de caravanes.\n1.7. La reconstruction à l’identique des bâtiments ou parties de bâtiments détruits et non\nconformes aux règles du présent règlement.\nDans toute la zone UD, à l’exception du secteur UDa, sont interdites :\n1.8. Les constructions à destination de bureaux* et d’industrie*.\n    2\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\nArticle UD.2. Occupations et utilisations du sol\nsoumises à des conditions particulières\n2.1. Les occupations et utilisations du sol suivantes ne sont\nadmises que si elles respectent les conditions ci-après\n2.1.1. Règles générales\nA l’exception de celles régies par l’article UD.1., les installations classées pour la protection\nde l’environnement sous réserve que leurs exigences de fonctionnement, lors de\nl’ouverture ou à terme, soient compatibles avec les infrastructures existantes, notamment\nles voiries et l’assainissement.\nLes affouillements et exhaussements de sol, à condition qu’ils soient liés à la réalisation\ndes occupations et utilisations du sol autorisées dans la zone.\n2.1.2. Règles spécifiques\n2.1.2.1. Dispositions applicables aux commerces et à l’artisanat* dans toute la\nzone UD, à l’exception du secteur UDa\nLa création, par construction, et/ou changement de destination, de SDP destinée au\ncommerce ou à l’artisanat, à condition d’être située en sous- sol, et/ou rez-de-chaussée\net/ou premier étage.\n2.1.2.2. Dispositions applicables à l’habitation*\nToute construction nouvelle ou tout changement de destination ayant pour effet de créer\nplus de cinq logements devra comporter un minimum de 65 % de logements de trois\npièces et plus.\nCette disposition ne s’applique pas aux résidences ou foyers pour étudiants, pour\npersonnes âgées, aux logements-foyers, et aux foyers d’accueil pour personnes\nhandicapées.\n2.2. Rappels\nLes constructions nouvelles à destination d’habitation et les établissements\nd’enseignement doivent répondre aux normes d’isolement acoustique conformément aux\narrêtés préfectoraux du 30 mai 1996 et du 9 janvier 1995 lorsque leurs façades sont\nexposées au bruit des infrastructures de transport terrestres classées par l’arrêté\npréfectoral du 29 juin 2000 (le classement figure dans les annexes en pièce n° 6.2.2 du\nprésent dossier).\n    3\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\nDans les parties de zones repérées au Plan de Prévention des Risques d’Inondation de la\nSeine dans le Département des Hauts-de-Seine approuvé par l’arrêté Préfectoral du 9\nJanvier 2004 (P.P.R.I. : pièces n° 6.1.2 du présent dossier), la nature de l’occupation et de\nl’utilisation du sol est subordonnée aux dispositions règlementaires dudit Plan de\nPrévention des Risques d’Inondation approuvé.\n    4\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\nSection 2\nConditions de l'occupation du sol\nArticle UD.3. Conditions de desserte des terrains par\nles voies publiques ou privées et accès aux voies\nouvertes au public\nPour être constructible, une unité foncière doit être desservie par une voie publique ou\nprivée en état de viabilité et dont les caractéristiques permettent de répondre aux\nexigences de la sécurité civile, de la lutte contre l'incendie et du ramassage des ordures\nménagères.\nToute création de voie de desserte devra présenter une largeur au moins égale à 3,50\nmètres.\nArticle UD.4. Conditions de desserte des terrains par\nles réseaux publics d'eau, d'assainissement, de\ncommunication, d’énergie et de collecte des déchets\n4.1. Alimentation en eau potable\nToute construction ou installation nouvelle qui, par sa destination, implique une utilisation\nd’eau potable, doit être obligatoirement alimentée par un branchement sur le réseau public\nd’eau potable.\n4.2. Assainissement\n4.2.1. Eaux usées\nLe branchement sur le réseau collectif d’assainissement est obligatoire pour toute\nconstruction ou installation nouvelle engendrant des eaux usées. Toute évacuation dans\nles fossés et cours d’eau est interdite.\nLe rejet dans le réseau collectif des eaux résiduaires industrielles pourra être soumis à des\nconditions particulières et devra notamment être soumis à un prétraitement.\n4.2.2. Eaux pluviales\nLes aménagements réalisés sur une unité foncière* ne doivent pas faire obstacle au libre\nécoulement des eaux pluviales (articles 640 et 641 du Code Civil).\n    5\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\nPour toute construction nouvelle, reconstruction ou réhabilitation, et quelle que soit la taille\nde l’unité foncière concernée, le rejet des eaux pluviales dans le réseau d'assainissement\ndevra respecter le règlement d’assainissement intercommunal de l’Etablissement Public\nTerritorial Paris Ouest La Défense.\nDans le cas où les caractéristiques de l’unité foncière ne permettent pas d’assurer une\nrétention naturelle d’eau suffisante, doivent être prévus des dispositifs de rétention\ncomplémentaires aux possibilités du réseau et utilisant des techniques alternatives.\nLes eaux de lessivage des parcs de stationnement, chaussées aires de services, de\nmanœuvre ou d’activités, doivent faire l’objet de pré-traitement avant déversement dans le\nréseau public (dessablage, déshuilage, séparateur d’hydrocarbures,…).\n4.3. Réseau public de communication\nLes constructions ou installations nouvelles devront comporter les infrastructures\nnécessaires à leur branchement sur les réseaux de communication existants ou projetés :\n • Les réseaux traditionnels publics (téléphone, télex, liaisons spécialisées...).\n • Les réseaux câblés de radiotélévision publics.\n • Les dispositifs d’émission ou de réception de signaux radioélectriques (antennes,\n   paraboles…) devront être installés sur la toiture de la façon la moins visible possible\n   depuis l’espace public.\n4.4. Collecte des déchets\n4.4.1. Dispositions générales\nLes constructions nouvelles doivent comporter des locaux de stockage des déchets\nsuffisamment dimensionnés de manière à recevoir et permettre de manipuler sans difficultés\ntous les récipients nécessaires à la collecte sélective des déchets.\nCes locaux seront isolés et fermés.\n4.4.2. Dispositions spécifiques suivant la ou les destinations des\nconstructions\n • Pour les constructions nouvelles à destination d’habitation*, ces locaux doivent être\n   situés au rez-de-chaussée, à moins de 15 mètres de la voie ou de l’emprise publique et\n   satisfaire aux contraintes techniques de la collecte sélective en porte à porte.\n • Pour les constructions nouvelles à destination autre que d’habitation, ces locaux\n   doivent être situés en rez-de-chaussée ou en sous-sol.\n • En cas de mixité des destinations, ces locaux doivent répondre aux besoins de la\n   collecte sélective des déchets de chacune de ces destinations.\n    6\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\n4.4.3. Dispositions spécifiques à certaines constructions à destination\nd’habitation\nLes dispositions des articles 4.4.1 et 4.4.2. ne s’appliquent pas aux constructions nouvelles\nà destination d’habitation qui comportent moins de trois logements.\nCes dispositions ne s’appliquent pas non plus aux constructions dont la SDP est inférieure\nou égale à 50 m².\n4.4.4. Dispositions spécifiques aux travaux sur constructions\nexistantes\nLors de travaux accompagnés d’un changement de destination de l’ensemble de la\nconstruction, les dispositions des articles 4.4.1. et 4.4.2. s’appliquent. Cependant, elles\npourront être adaptées si les caractéristiques des constructions ou de l’unité foncière ne le\npermettent pas.\n4.5. Rappel : Energies renouvelables\nL’utilisation des énergies renouvelables pour l’approvisionnement énergétique des\nconstructions sera privilégiée.\n4.5.1. Réseaux de distribution de chaleur et de froid\nLorsqu’existent des périmètres de développement prioritaire, toute installation d’un\nbâtiment neuf, ou faisant l’objet de travaux de rénovation importants, qu’il s’agisse\nd’installations industrielles ou d’installations de chauffage de locaux, de climatisation ou de\nproduction d’eau chaude, doit être raccordée au réseau concerné. L’exploitant du réseau\nd’énergie précisera les conditions de raccordement. Cette obligation de raccordement ne\nfait pas obstacle à l’utilisation d’installations de secours ou de complément.\n4.5.2. Alimentations pour véhicules rechargeables\nToute construction d’un immeuble d’habitation comportant au minimum 2 logements ou\nd’un bâtiment à destination de bureau* équipé de places de stationnement couvertes ou\nd’accès sécurisé doit doter une partie de ces places des gaines techniques, câblages et\ndispositifs de sécurité nécessaires à l’alimentation de prises de recharge pour les véhicules\nélectriques ou hybrides rechargeables et permettant un comptage individuel conformément\nau Code de la Construction et de l’Habitation.\nArticle UD.5. Superficie minimale des terrains\nconstructibles\nIl n’est pas fixé de règle.\n    7\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\nArticle UD.6. Implantation des constructions par\nrapport aux voies et emprises publiques\nLe mot alignement* s’entend comme l’alignement actuel ou futur.\n6.1. Dispositions générales applicables à l’ensemble de la zone\nUD\nLe nu des façades des constructions en superstructure doit être implanté à l’intérieur des\nemprises constructibles telles que figurées sur le document graphique n° 5.5 « dispositions\nrèglementaires applicables à la zone UD ».\n6.2. Saillies* et encorbellements* sur alignement et en\nsurplomb de l’espace public\nNota : Sur les voies départementales, le règlement de voirie départemental approuvé le 12\ndécembre 1994 par le Conseil Départemental 92 s’applique.\n6.2.1. Immeuble en surplomb de la rue Marius Aufan\nAu-dessus de la rue Marius Aufan, dans la bande telle que figurée au document graphique\nn° 5.5 « dispositions règlementaires applicables à la zone UD », l’implantation d’un\nimmeuble en surplomb est autorisée.\nCelui-ci devra respecter les dispositions suivantes :\n • La hauteur libre sous le bâtiment mesurée à partir du niveau du sol de la rue Marius\n   Aufan doit être au minimum de 7 mètres.\n • Les saillies et encorbellements de l’immeuble doivent respecter les dispositions ci-\n   après.\n6.2.2. Saillies (hors volume habitables en encorbellements)\n6.2.2.1. Généralités\nLes saillies (balcons,…) sont autorisées en empiétement par rapport à l'alignement.\nLeur définition englobe notamment les seuils, socles, soubassements, bandeaux,\ncorniches, appuis, encadrements, pilastres et nervures.\nLes saillies devront tenir compte du modèle des façades d’immeubles voisins du bâtiment\nprojeté, et de l’aspect général de la voie. Une attention particulière devra être portée au\ntraitement de leur sous-face.\n    8\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\nAfin de préserver la perception du front bâti, il pourra être exigé que les balcons ou\nterrasses en surplomb par rapport à l'alignement comportent des garde-corps fins et\najourés.\nLes saillies visées ci-dessus ne devront pas excéder une épaisseur de :\n • 0,16 mètre jusqu’à 3 mètres au-dessus du trottoir.\n • 0,22 mètre de 3 mètres à 4,30 mètres au-dessus du trottoir.\n • 0,40 mètre au-dessus de 4,30 mètres au-dessus du trottoir dans les voies d’une largeur\n   inférieure à 10 mètres.\n • 0,80 mètre au-dessus de 4,30 mètres au-dessus du trottoir dans les voies d’une largeur\n   supérieure ou égale à 10 mètres.\nEn outre, lorsqu’il s’agit exclusivement de balcons d’immeubles d’habitation :\n • 1 mètre au-dessus de 4,30 mètres au-dessus du trottoir dans les voies d’une largeur\n   supérieure ou égale à 11,50 mètres.\n • 1,20 mètre au-dessus de 4,30 mètres au-dessus du trottoir dans les voies d’une largeur\n   supérieure ou égale à 12,5 mètres.\n • Les parties les plus saillantes des ouvrages ne devront toutefois pas se situer à moins\n   de 0,50 mètre d’un plan vertical passant par l’arête de la bordure du trottoir.\n6.2.2.2. Cas particulier : Immeubles de bureaux dans le secteur UDa\nPar exception aux dispositions de l’article 6.2.2.1, les saillies des façades d’immeubles à\ndestination principale de bureaux repérées par un « traitement architectural particulier à\nl’échelle urbaine » dans les Orientations d’Aménagement et de Programmation (pièce\nn° 3 du présent dossier), sont autorisées en empiétement par rapport à l’alignement des\nrues Baudin et Anatole France jusqu’à 1 mètre d’épaisseur. A l’angle des rues Anatole\nFrance et Baudin, cette dimension sera portée à 2 mètres d’épaisseur, afin de marquer\nl’angle (auvent,…).\n6.2.3. Volumes habitables en encorbellement\n6.2.3.1. Quelle que soit la destination de la construction\nLes volumes habitables, oriels et bow-windows construits en encorbellement sur\nl'alignement sont interdits dans les voies d'une largeur inférieure à 10 mètres entre les\nalignements.\nLorsqu’ils sont autorisés, les volumes habitables, oriels et bow-windows construits en\nencorbellements sur l’alignement ne devront pas excéder une épaisseur de :\n • 0,16 mètre jusqu’à 3 m au-dessus du trottoir quelle que soit la largeur de la voie.\n • 0,22 mètre de 3 m à 4,30 m au-dessus du trottoir quelle que soit la largeur de la voie.\n • 0,60 mètre à partir d’une hauteur de 4,30 m au-dessus du trottoir dans les voies d’une\n   largeur supérieure ou égale à 10 m et inférieure à 11,50 m.\n • 0,80 mètre à partir d’une hauteur de 4,30 m au-dessus du trottoir dans les voies d’une\n   largeur supérieure ou égale à 11,50 m.\n    9\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\n6.2.3.2. Quelle que soit la destination de la construction, à l’exception des\nCINASPIC*\nLa longueur totale de l'emprise des encorbellements ne peut excéder 50 % du linéaire de\nfaçade sur rue (cf. croquis ci-après).\nPour les unités foncières* situées à l’angle de deux voies, la longueur totale d’emprise des\nencorbellements imposée ci-dessus est de 50 % rue par rue. Le ou les pans coupés\nrepérés au document graphique n° 5.5 « dispositions règlementaires applicables à la zone\nUD» sont exclus de ce calcul et peuvent librement comporter des encorbellements si ceux-\nci apportent une valorisation du traitement architectural de l’angle du bâtiment.\nPour chaque encorbellement la longueur à prendre en compte sera la plus grande (voir\ncroquis ci-après).\n    10\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\nArticle UD.7. Implantation des constructions par\nrapport aux limites de propriété\nLes constructions en superstructure doivent être implantées à l’intérieur des emprises\nconstructibles définies au document graphique n° 5.5 « dispositions règlementaires\napplicables à la zone UD ».\nArticle UD.8. Implantation des constructions les unes\npar rapport aux autres sur une même propriété\nLes constructions en superstructure doivent être implantées à l’intérieur des emprises\nconstructibles définies document graphique n° 5.5 « dispositions règlementaires\napplicables à la zone UD ».\nArticle UD.9. Emprise au sol des constructions*\n9.1. Dispositions générales\nLes constructions en superstructure doivent être édifiées à l’intérieur des emprises\nconstructibles définies au document graphique n° 5.5 « dispositions règlementaires\napplicables à la zone UD».\n9.2. Dispositions particulières\nSur l’espace surplombant la rue Marius Aufan, tel que figuré au document graphique n° 5.5\n« dispositions règlementaires applicables à la zone UD», il n’y a pas d’emprise au sol.\n    11\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\nArticle UD.10. Hauteur maximum des constructions\n10.1. Définitions et principes généraux\nLa hauteur maximum des constructions est mesurée à partir du terrain naturel* jusqu’à\nl’acrotère* ou au faîtage*.\n10.2. Les hauteurs maximum autorisées\nLes hauteurs maximum de construction sont fixées en fonction de la localisation de la\nconstruction et/ou de sa destination. Les hauteurs maximum admises ainsi que le nombre\nmaximum de niveaux sont reportés au document graphique n° 5.5 « dispositions\nrèglementaires applicables à la zone UD».\n10.3. Dépassement exceptionnel à l’angle des voies Paul\nVaillant Couturier et Marius Aufan\nAfin d'assurer le traitement architectural de cet angle, seront autorisés en dépassement de\n3,50 mètres maximum de la hauteur maximum, les dômes, coupoles, belvédères et petits\nvolumes de couronnement accessibles assurant un rehaussement visuel décoratif et limité\nà cet angle.\nUne distance de 8 mètres doit être respectée entre ce dépassement et chaque limite\nséparative latérale de propriété, dès lors que le dépassement comporte le percement de\nbaies principales, et 3 mètres dans les autres cas\n10.4. Hauteur des rez-de-chaussée\nLa hauteur du rez-de-chaussée sur rue des constructions nouvelles (mesurée entre le\ndessus du plancher bas et le dessus du plancher supérieur) ne pourra être inférieure à\n3,50 mètres.\n10.5 Dépassements généraux de la hauteur maximum\nD’une manière générale, les éléments suivants peuvent dépasser la hauteur maximum\ndéfinie au paragraphe 10.2. :\n   1° Les garde-corps dans les limites de 1,50 mètre.\n   2° Les ouvrages techniques tels que antennes, gaines de ventilation, souches de\n   cheminées, panneaux solaires thermiques ou photovoltaïques et autres capteurs\n   d’énergie et ouvrages de récupération d’eau… sous réserve d'être situés en retrait de\n   l'acrotère, et de manière à être le moins visible possible depuis le domaine public.\n    12\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\n3° Les motifs ornementaux tels que frontons, sculptures etc... et les verrières éclairant\nles surfaces de planchers inférieurs, ceci de façon ponctuelle.\n4° La réalisation d’un ascenseur dans le cadre du réaménagement ou de la\nréhabilitation d’un bâtiment existant dans la limite de 2.50 mètres.\n5° Les machineries d'ascenseurs : elles seront obligatoirement situées à l'intérieur des\nbâtiments, la partie technique située en superstructure devant être limitée à 1,80 mètre\nde hauteur et être située en retrait de la façade du dernier niveau.\n 6° Les volumes comportant un accès aux toitures-terrasses:\na) Dans les immeubles à destination principale d’habitation comportant au minimum 3\nlogements sous les conditions suivantes :\n    - Que l’emprise de ces volumes soit inférieure ou égale à 15% de la surface totale\n    de la toiture-terrasse.\n    - Qu’ils soient adossés, dans la mesure du possible, aux ouvrages techniques ou\n    aux cheminées éventuelles dans une composition d’ensemble.\n    - Que leur hauteur soit limitée (acrotère compris) à 3 mètres à partir de la dalle de\n    la toiture-terrasse.\n    - Qu’ils soient situés à au moins 1,50 mètre de l’ensemble des façades du dernier\n    niveau de l’immeuble sur lequel ils sont édifiés.\n    - Qu’ils respectent, par rapport aux limites séparatives, une distance de 3 mètres\n    minimum sans possibilité d’ouvrir des baies et de 6 mètres minimum en cas\n    d’ouverture de baie. Néanmoins, ils pourront s’implanter sur la limite séparative\n    s’ils s’adossent à un pignon mitoyen d’une hauteur au moins équivalente.\n    - Qu’ils desservent une terrasse accessible paysagée* et végétalisée dans les\n    conditions fixées à l’article UA 11.2.8.2. (toitures-terrasses).\n    - Que les toitures-terrasses de ces volumes soient végétalisées.\nb) Dans les immeubles à destination principale d’habitation comportant moins de 3\nlogements et les immeubles à destination autre que l’habitation sous les conditions\nsuivantes :\n    - Que l’emprise de ces volumes soit strictement nécessaire à l’accès des toitures-\n    terrasses.\n    - Qu’ils soient adossés, dans la mesure du possible, aux ouvrages techniques ou\n    aux cheminées éventuelles dans une composition d’ensemble.\n    - Que leur hauteur soit limitée (acrotère compris) à 3 mètres à partir de la dalle de\n    la toiture-terrasse.\n    - Qu’ils soient situés à au moins 1,50 mètre de l’ensemble des façades du dernier\n    niveau de l’immeuble sur lequel ils sont édifiés.\n    - Qu’ils respectent, par rapport aux limites séparatives, une distance de 3 mètres\n    minimum sans possibilité d’ouvrir des baies et de 6 mètres minimum en cas\n    d’ouverture de baie. Néanmoins, ils pourront s’implanter sur la limite séparative\n    s’ils s’adossent à un pignon mitoyen d’une hauteur au moins équivalente.\n    - Qu’ils desservent une terrasse accessible paysagée* et végétalisée dans les\n    conditions fixées à l’article UA 11.2.8.2. (toitures-terrasses).\n    - Que les toitures-terrasses de ces volumes soient végétalisées.\n    13\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\n10.6. Dispositions spécifiques aux constructions à destination\nde bureau* dans le secteur UDa\nLe dernier niveau des constructions destinées aux bureaux devra intégrer tous les\néléments techniques nécessaires au fonctionnement desdits bureaux, à l’exception des\nantennes, panneaux solaires thermiques ou photovoltaïques et autres capteurs d’énergie\net ouvrages de récupération des eaux…\nNéanmoins, de façon ponctuelle et limitée, pourront dépasser de ce dernier niveau ainsi\nque de la hauteur maximum autorisée à l’article 10.2.2. des éléments techniques ne\npouvant pas être intégrés dans le bâtiment (échappement de groupe électrogène, éléments\nde groupe froid, dispositifs antichute, nacelles…) sous réserve que ces dépassements\nn’excèdent pas 3 mètres et soient situés de façon à être le moins visible possible depuis\nl’espace public.\nEn outre, un signal visuel à l’échelle urbaine est autorisé en dépassement de 10 mètres de\nla hauteur maximum (flèche de toiture, structure ajourée, …) à l’angle des rues Baudin et\nAnatole France.\nCe dépassement n’est autorisé que s’il ne crée aucune surface de plancher.\nArticle UD.11. Aspect extérieur des constructions et\naménagement de leurs abords\n11.1. Cours anglaises\nLes cours anglaises sur voies et espaces publics sont interdites pour les constructions à\ndestination d’habitation*.\n11.2. Matériaux, couleurs des façades, dispositifs liés au\ndéveloppement durable\nL’emploi à nu, en parement extérieur, de matériaux destinés à être recouverts est interdit.\nLe pavé de verre est interdit en rez-de-chaussée des façades sur rue.\nL’installation de dispositifs favorisant la retenue des eaux pluviales ou la production\nd’énergie renouvelable correspondant aux besoins de la consommation domestique des\noccupants de l’immeuble ou de la partie d’immeuble concerné est autorisée sous réserve\nde s’inscrire qualitativement dans la composition du bâtiment et de s’intégrer dans le\npaysage urbain.\n11.3. Pignons et locaux annexes\nLes murs pignons, mitoyens ou non, devront être traités en harmonie avec les façades\nprincipales.\n    14\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\nLes locaux annexes seront traités avec un soin égal à celui apporté aux constructions\nprincipales.\n11.4. Façades commerciales, enseignes\nOn entend par façade commerciale toute devanture établie dans un but commercial et\nentraînant la modification ou le recouvrement du gros œuvre.\nLes façades commerciales devront répondre aux conditions suivantes :\n • Les percements destinés à recevoir des vitrines devront être adaptés à l’architecture de\n   la construction concernée.\n • Lorsqu’un même commerce sera établi sur plusieurs constructions contiguës, les\n   percements des vitrines devront en respecter les limites séparatives.\nLe rez-de-chaussée des constructions nouvelles destiné à des commerces ou des services\ndevra comporter l’emplacement d’un bandeau destiné à recevoir leur enseigne.\nLa façade commerciale devra être séparée de façon visible des étages supérieurs\n(corniches, retraits,…).\n11.5. Façade de bureaux*\nPour les constructions destinées exclusivement au bureau, le rez-de-chaussée et le\n1er étage devront bénéficier d’un traitement spécifique avec notamment la réalisation d’une\nentrée de grande dimension sur double niveaux au minimum, avec un effort particulier en\nmatière de matériaux et de conception architecturale de la façade et en privilégiant les\neffets de transparence.\n11.6. Clôtures\nLes clôtures situées en bordure des voies et emprises publiques feront partie d’une\ncomposition d’ensemble.\nSur toutes les clôtures l'ajout d'écrans opaques est interdit, seul le doublage par des\nécrans ajourés est autorisé, ainsi qu’un doublage par des haies végétales ou des plantes\ngrimpantes.\n11.7. Fermeture de balcons et terrasses intermédiaires\nLa fermeture des balcons (sauf loggias) et des terrasses intermédiaires visibles depuis\nl’espace public est interdite.\n    15\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\n11.8. Toitures-terrasses\n11.8.1. Principes généraux\nLes toitures-terrasses de tout type devront être traitées avec autant de soin que les\nfaçades. Les étanchéités autoprotégées des toitures-terrasses ainsi que les protections par\ngravillons ne pourront être laissées apparentes.\nLa partie minérale sera traitée avec soin et constituée d’un revêtement soigné.\n11.8.2. Toitures-terrasses inaccessibles\nLes toitures-terrasses inaccessibles seront végétalisées à l’exception des parties occupées\npar les ouvrages techniques, verrières, capteurs d’énergie (panneaux solaires…)… Cette\nvégétalisation sera assurée par une solution technique de type traditionnel (végétalisation\nintensive* ou semi-intensive* avec apport de terre végétale*), ou par toute autre solution\nnon traditionnelle (végétalisation extensive* comportant une couche végétale couvre-sols\nsur substrats…).\nLorsqu’il y a utilisation de substrats, ceux-ci devront comporter une épaisseur minimum de\n11 centimètres.\nCette végétalisation devra également être réalisée en cas de réhabilitation lourde ou de la\nréfection de la toiture d’un bâtiment existant qui n’en n’aurait pas bénéficié lors de sa\nconstruction. Dans ce cas l’épaisseur de substrat imposée ci-dessus pourra être ajustée\naux contraintes techniques de l’existant.\nCette végétalisation devra être maintenue lors d’une réfection de la toiture.\n11.8.3. Toitures-terrasses accessibles\nEn dehors des parties occupées par les circulations nécessaires aux usagers et les\nespaces voués aux loisirs, les terrasses accessibles devront être paysagées* et recevoir\nune végétalisation intensive*, semi-intensive* ou extensive*.\n11.9. Prescriptions relatives à l’aspect extérieur des\nconstructions\nLes ouvrages tels que groupes électrogènes, ouvrages de climatisation des constructions\nnouvelles etc., seront situés à l’intérieur des constructions.\nLes édicules affectés aux machineries d’ascenseurs et aux sorties d’escaliers, lorsqu’ils ne\nseront pas intégrés dans le volume du dernier étage, seront traités avec le même matériau\nque les façades et intégrés à l’aménagement d’ensemble de la toiture-terrasse.\nLes réseaux techniques en toiture ou en terrasse tels que la ventilation mécanique\ncontrôlée, les ventilations diverses, seront, sauf impossibilité technique avérée, camouflés\n    16\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\npar un revêtement identique à la façade ou s’harmonisant avec elle. Les ouvrages ou\nédicules techniques extérieurs au bâtiment et situés en rez-de-chaussée, ainsi que les\nventilations des sous-sols non situées en toiture devront être traités avec soin et\ns’harmoniser avec les façades tant en ce qui concerne la nature des matériaux que leur\ncouleur.\nLes évacuations d’eaux pluviales correspondant aux loggias et aux balcons pleins devront\nêtre intégrées à l’intérieur des bâtiments, être situées en fond de loggia, être encastrées\ndans la façade ou être placées en limites séparatives* d’immeubles.\nLes antennes d’émission ou de réception de signaux radioélectriques (antennes,\nparaboles,…) devront être installées sur les toitures de la façon la moins visible possible\ndepuis l’espace public. Sur les toitures-terrasses, elles seront implantées de manière\nprivilégiée en zone centrale.\nLes coffrets, compteurs et boites aux lettres des immeubles collectifs seront situées à\nl’intérieur des bâtiments.\nLes branchements (câbles électriques, télécom…) seront obligatoirement réalisés en\nsouterrain, ou bien intégrés au volume des bâtiments.\nArticle UD.12. Obligations imposées aux constructeurs\nen matière de réalisation d'aires de stationnement\n12.1. Stationnement des véhicules motorisés\n12.1.1. Dispositions Générales\nLe stationnement de véhicules motorisés correspondant aux besoins des constructions et\ninstallations nouvelles ou aux travaux sur constructions existantes doit être assuré en\ndehors de la voie publique, sur l’unité foncière* propre à l’opération ou dans son\nenvironnement immédiat.\nS’il est admis qu’une impossibilité technique ou des motifs d’architecture ou d’urbanisme\ninterdisent de réaliser les places de stationnement résultant de l’application des\nparagraphes 12.1.2. à 12.1.5., le pétitionnaire peut être autorisé à les reporter à proximité,\nen apportant la preuve qu’il les obtient par concession dans un parc public ou par\nconcession ou acquisition dans un parc privé existant ou en cours de réalisation.\nLorsqu'une aire de stationnement a été prise en compte dans le cadre d'une concession à\nlong terme ou d'un parc privé de stationnement, au titre des obligations prévues aux\npremier et deuxième alinéas ci-dessus, elle ne peut plus être prise en compte, en tout ou\nen partie, à l'occasion d'une nouvelle autorisation.\n    17\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\n12.1.2. Accès\nLes rampes d’accès au sous-sol ne doivent pas entraîner de modification dans le niveau du\ntrottoir, et leur pente, dans les cinq premiers mètres à partir de l’alignement, ne doit pas\nexcéder 5 %, sauf en cas d’impossibilité technique.\nLes rampes d’accès doivent avoir la largeur minimum suivante :\n • Sens unique ou double sens desservant moins de 50 places de stationnement pour\n   voitures : 3,50 mètres.\n • Double sens desservant plus de 50 places de stationnement pour voitures : 6 mètres.\nLes rampes d’accès au sous-sol doivent présenter un rayon intérieur de courbure supérieur\nou égal à 5 mètres. Leur rayon extérieur de courbure doit être d’au minimum 9 mètres.\nToutefois, les dimensions des rayons de courbure pourront être modulées pour tenir\ncompte des nécessités résultant de contraintes techniques motivées, notamment par\nl’exiguïté de certaines unités foncières.\n    18\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\n12.1.3. Dimensions des emplacements\nDans une aire collective de stationnement, chaque emplacement, doit présenter des\ndimensions au moins égale à :\n  • longueur : 5 mètres\n  • largeur : 2,30 mètres\n  • dégagement :\n    • 6 mètres entre poteaux ou portes de boxes\n    • 5 mètres entre places non cloisonnées\n    19\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\n12.1.4. Dispositions spécifiques\nLes aires de stationnement devront être réalisées en sous-sol.\nLes normes s’appliquent aux constructions ou installations nouvelles ainsi qu’aux\nconstructions existantes, dès lors qu’il n’est pas expressément prévu d’exception.\nLorsqu’une construction comprend des parties à destinations différenciées, le nombre total\ndes places à réaliser résulte du cumul des places exigibles pour chaque destination de\nconstructions.\nLe nombre de places requises sera arrondi au chiffre inférieur lorsque le calcul du nombre\nde places de stationnement a une décimale égale ou inférieure à 0,5, et arrondi au chiffre\nsupérieur lorsque la décimale est supérieure ou égale à 0,6.\n12.1.5. Normes de stationnement\n12.1.5.1 Constructions à destination d’habitation*\n12.1.5.1.1. Dispositions générales\nIl est exigé une place de stationnement automobile par tranche de 85 m² de surface de\nplancher (SDP*), avec un minimum d’une place par logement.\nPour les résidences ou foyers pour étudiants ou pour personnes âgées il ne sera exigé\nqu’une place pour 150m² de S.D.P.\nPour la construction de logements locatifs financés avec un prêt aidé par l’Etat, il ne sera\nexigé que 0,50 place de stationnement automobile par logement.\nLes places doubles sont autorisées à condition que le nombre des places directement\naccessibles soit au moins égal au nombre de logements.\nPar ailleurs, il est exigé la réalisation d’aires de stationnement pour les deux roues\nmotorisées, représentant 1 % de la SDP, avec un minimum de 10 m².\nPour les résidences pour personnes âgées, il n’est exigé que la réalisation d’une aire de 10\nm² minimum réservée aux deux roues motorisées.\nCes dispositions ne s’appliquent qu’aux bâtiments comprenant un parc de stationnement.\n12.1.5.1.2. Dispositions particulières et dispenses\nLorsqu’il n’est pas possible d’inscrire, dans le terrain assiette de l’opération, un rectangle\nde 17 mètres x 15 mètres, ou lorsqu’il s’agit d’une parcelle d’angle dans laquelle il n’est pas\npossible d’inscrire un carré de 17 mètres de côté, il ne sera pas fait référence à la SDP\npour le calcul de nombre de places à réaliser, mais au nombre de logements créés, la\nnorme étant d’une place par logement crée.\nPar ailleurs, il ne sera exigé aucune place de stationnement :\n  • pour la construction de logements locatifs financés avec un prêt aidé par l’Etat\n    lorsqu’il n’est pas possible d’inscrire, dans le terrain, assiette de l’opération, un\n    20\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\n    rectangle de 17 mètres x 15 mètres, ou lorsqu’il s’agit d’une parcelle d’angle dans\n    laquelle il n’est pas possible d’inscrire un carré de 17 mètres de côté.\n  •    Lorsque le terrain, assiette de l’opération, présente un unique linéaire sur rue\n    inférieur ou égal à 10 mètres et une superficie inférieure à 250 m².\n  •    pour les programmes de construction de moins de trois logements.\n12.1.5.1.3. Extensions, travaux sur constructions existantes et changements de destination\nIl n’est pas exigé la réalisation de place de stationnement automobile lors de travaux avec\nextension et/ou de changement de destination d’une construction vers l’habitation, sous\nréserve que :\n    • La SDP créée par extension ou changement de destination soit inférieure ou égale\n    à 150 m² et ne crée pas plus de deux nouveaux logements.\n    •    Les travaux ne suppriment pas de places existantes en sous-sol qui permettent de\n    répondre aux nombres exigibles.\nL’obligation de réaliser des aires de stationnement n’est pas applicable :\n    • Aux travaux de transformation ou d’amélioration de bâtiments affectés à des\n    logements locatifs financés avec un prêt locatif aidé de l’Etat\n    • Aux changements de destination d’une construction en vue de l’affecter à des\n    logements locatifs financés avec un prêt aidé par l’Etat,\nY compris dans le cas où ces travaux et changements de destination s’accompagnent de la\ncréation de SDP, dans la limite de 50% de la SDP existante avant le commencement des\ntravaux.\nCependant lesdits travaux ne doivent pas supprimer de places existantes en sous-sol qui\npermettent de répondre au nombre exigible.\n12.1.5.2. Constructions à destination de bureaux*\nIl sera créé une place de stationnement automobile par tranche de 120 m² de SDP créée.\nDans un rayon de 300 mètres autour des accès de la station de métro « Pont de\nLevallois », la norme est d’une place par tranche de 150 m² de SDP créée.\nLes places doubles sont autorisées sous réserve de ne pas représenter plus de 10 % des\nplaces exigibles.\nPour les programmes dont la SDP est supérieure à 10 000 m², il est exigé la réalisation\nd’aires de chargement, déchargement, et de manutention nécessaires au fonctionnement\nde l’établissement. Nonobstant la disposition imposant aux aires de stationnement d’être\nobligatoirement réalisées en sous-sol, ces aires de chargement, de déchargement et de\nmanutention pourront être réalisées en rez-de-chaussée, sous réserve d’être intégrées au\nbâtiment.\nPar ailleurs, il est exigé la réalisation d’aires de stationnement pour les deux roues\nmotorisées, représentant 0,30% de la SDP, avec un minimum de 10 m².\n12.1.5.3. Constructions à destination de commerces\nIl n’est pas exigé la réalisation de places de stationnement automobile pour les commerces\ndont la SDP est inférieure ou égale à 300 m² ou qui sont situés dans un rayon de    150\nmètres autour de l’accès véhicule d’un parking public existant ou projeté.\n    21\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\nIl est exigé une place de stationnement par tranche de :\n   • 150 m² de SDP pour les commerces dont la SDP est comprise entre 300 m² et    1\n    000 m².\n • 60 m² de SDP pour les commerces dont la SDP est supérieure à 1 000 m² et inférieure\n   ou égale à 2 000 m².\n  • 45 m² pour les commerces dont la SDP est supérieure à 2 000 m².\nPar ailleurs, pour les commerces dont la SDP est supérieure à 2 000 m², il est exigé la\nréalisation d’aires de chargement, déchargement, et de manutention nécessaires au\nfonctionnement de l’établissement. Nonobstant la disposition stipulant que les aires de\nstationnement sont obligatoirement réalisées en sous-sol, ces aires de chargement,\ndéchargement et de manutention pourront être réalisées en rez-de-chaussée sous réserve\nd’être intégrées au bâtiment.\n12.1.5.4. Artisanat*, industrie*\nIl n’est pas exigé la réalisation de places de stationnement automobile pour les locaux à\ndestination d’artisanat et d’industrie, dont la SDP est inférieure ou égale à 300 m².\nIl est exigé une place de stationnement automobile par tranche de 300 m² de SDP créée.\nEn plus des aires de stationnement pour véhicules particuliers, il sera imposé pour les\nlocaux dont la SDP est supérieure à 1 000 m², la création d’aires de livraison adaptées aux\nopérations de chargement, déchargement et manutention inhérentes à l’établissement.\n12.1.5.5. Hébergement hôtelier*\n12.1.5.5.1. Véhicules particuliers\nIl sera réalisé au minimum une place de stationnement pour 5 chambres.\n12.1.5.5.2. Autocars\nToutes dispositions devront être prises pour que la desserte des hôtels de tourisme par\nautocars et taxis ne génère aucune gêne pour la circulation publique.\nAu-delà de 150 chambres, il sera exigé une place de stationnement d'autocar par tranche\nde 150 chambres, calculée par excès. Dans ce cas, l'obligation de créer les places de\nstationnement en sous-sol ne sera pas imposée.\n12.1.5.6. Dispositions applicables aux CINASPIC*\nLe nombre de places à réaliser devra correspondre aux besoins de l’immeuble à\nconstruire, appréciés en fonction de la nature de l’établissement, de son fonctionnement et\nde sa situation géographique (notamment par rapport aux parkings publics et aux\ntransports en commun).\nPar ailleurs, les aires de chargement, déchargement et de manutention nécessaires au\nfonctionnement de l’établissement pourront être imposées sur le terrain.\n    22\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\n12.2. Stationnement des vélos et poussettes\n12.2.1 Stationnement des vélos\nDans les immeubles d’habitation ou de bureau, le stationnement des vélos devra respecter\nles dispositions et les normes du Code de la Construction et de l’Habitation et être situé au\nrez-de-chaussée ou au premier sous-sol réservé au stationnement automobile, dans des\nlocaux clos et facilement accessibles.\nPour les CINASPIC, les résidences pour personnes âgées, les foyers d’accueil pour\npersonnes handicapées : la superficie à réserver éventuellement au stationnement des\nvélos doit tenir compte de la nature et du fonctionnement des établissements, de leur\nsituation géographique et de leurs utilisateurs.\n12.2.2. Dispositions particulières pour le stationnement des vélos\nEn l’absence de réalisation de parc de stationnement, il devra néanmoins être réalisé, dans\nles immeubles principalement d’habitation ou de bureau, un ou plusieurs locaux en rez-de-\nchaussée, clos et couverts, pour le stationnement des vélos, dont la surface totale devra\ncorrespondre aux besoins de l’immeuble.\nCes locaux pourront être communs avec ceux réservés aux poussettes et situés en rez-de-\nchaussée des constructions.\n12.2.3. Stationnement des poussettes\nPour les constructions à destination d’habitation créant plus de 10 logements, il devra être\nréalisé un ou plusieurs locaux en rez-de-chaussée, clos et couverts, pour le stationnement\ndes poussettes.\nLa surface réservée au stationnement des poussettes doit représenter au minimum 4m²\npar tranche complète de 10 logements.\nCes locaux pourront être communs avec ceux réservés aux vélos, dès lors que ces\nderniers sont situés au rez-de-chaussée des constructions.\nCes dispositions ne s’appliquent pas aux résidences ou foyers pour étudiants, pour\npersonnes âgées, aux logements-foyers, et aux foyers d’accueil pour personnes\nhandicapées.\n12.3. Suppression des places de stationnement des véhicules\nmotorisés ou aires de stationnement de véhicules non\nmotorisés\nAucune surface ou place de stationnement existante ne peut être supprimée dès lors que\nla surface ou le nombre de places exigibles n’est pas réalisé.\n    23\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\nArticle UD.13. Obligations imposées aux constructeurs\nen matière de réalisation d’espaces libres, d’aires de\njeux et de loisirs et de plantations\n13.1. Traitement des espaces libres (hors marges de recul,\ncf. 13.2.)\n13.1.1. Dispositions générales\nLes espaces libres seront aménagés préférentiellement en contiguïté de ceux existants le\ncas échéant sur les unités foncières* voisines. La partie du terrain en espace libre doit être\naménagée principalement en espaces verts*. Les plantations y bénéficieront d'un\ntraitement de qualité et diversifié.\n13.1.2. Obligations de traitement des espaces verts\nLes espaces verts doivent présenter les épaisseurs de terre végétale* nécessaires aux\ndifférentes catégories de plantations : pelouses et arbustes, arbres* à petit, moyen et grand\ndéveloppement. Cette épaisseur n’est en aucun cas inférieure à 0,50 mètre non compris la\ncouche drainante.\n13.1.3. Plantation d’arbres\nLe nombre d'arbres doit correspondre au minimum à 1 sujet par fraction entière de 200 m²\nde la superficie totale des espaces libres de l’unité foncière.\n13.2. Traitement de la marge de recul* sur la rue Danton\nLes espaces non occupés par les accès doivent être traités en espaces verts comportant\nune épaisseur minimum de 0,50 mètre de terre végétale.\n    24\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UD\nSection 3\nPossibilités maximales d'occupation du\nsol\nArticle UD.14. Coefficient d'occupation du sol\nII n'est pas fixé de coefficient d'occupation du sol.\n    25\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UE\nChapitre V\nDispositions    applicables    en\nzone UE\n« La zone UE est une zone urbaine mixte destinée à accueillir de l’habitat, des bureaux,\ndes services, des commerces notamment un important centre commercial et des\néquipements intégrant la création d’un vaste parc urbain paysagé. »\nLa zone est divisée en quatre îlots (A, B, C et D).\nCertains terrains de la zone sont concernés par des servitudes instaurées au titre de\nl’article L.151-41 du code de l’urbanisme notamment pour la création d'un parvis public.\nCertaines dispositions règlementaires qui lui sont applicables sont précisées dans les\ndocuments graphiques suivants :\n • Document graphique n° UE 5.6.A « occupation des sols ».\n • Document graphique n° UE 5.6.B « emprise maximale et l’implantation des\n   constructions en superstructure ».\n • Document graphique n° UE 5.6.C « hauteurs maximales des constructions »\n • Document graphique n° UE 5.6.D « délimitation des îlots sur plan cadastral et\n   attribution des constructibilités par îlot ».\n    1\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UE\nSection 1\nNature de l'occupation et de l'utilisation\ndu sol\nArticle UE.1. Occupations et utilisations du sol\ninterdites\n1.1. Les constructions à destination d’entrepôt*.\n1.2. Les dépôts de ferrailles, de matériaux, de combustibles solides, ainsi que les\nentreprises de cassage de voitures et de transformation de matériaux de récupération.\n1.3. Les dépôts d'ordures ménagères, de résidus urbains ou de déchets de matériaux.\n1.4. Les carrières.\n1.5. Les installations classées soumises à la directive SEVESO, ou présentant des risques\ntechnologiques graves, ainsi que celles qui pourraient entraîner, pour le voisinage, une\ninsalubrité ou un sinistre susceptible de causer des dommages graves ou irréparables aux\npersonnes et/ou aux biens.\n1.6. Le stationnement des caravanes isolées, de résidences mobiles de loisirs,\nd’habitations légères de loisirs, l'ouverture de terrains de camping ou de caravanes.\n    2\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UE\nArticle UE.2. Occupations et utilisations du sol\nsoumises à des conditions particulières\n2.1. Les occupations et utilisations du sol suivantes ne sont\nadmises que si elles respectent les conditions ci-après\n2.1.1. Règles générales\nEn superstructure, les destinations d’occupation des sols prévues au document graphique\nn° UE 5.6.A « occupation des sols », ainsi que les locaux techniques strictement\nnécessaires à leur fonctionnement.\nLes commerces, bureaux, équipements et CINASPIC sous réserve du respect de la SDP\nprécisée au document graphique n°UE 5.6.D. « Délimitation des îlots sur le plan cadastral\net attribution des constructibilités par îlots ».\nA l’exception de celles régies par l’article UE.1., les installations classées pour la protection\nde l’environnement sous réserve que leurs exigences de fonctionnement, lors de\nl’ouverture ou à terme, soient compatibles avec les infrastructures existantes, notamment\nles voiries et l’assainissement.\nLes affouillements et exhaussements de sol, à condition qu’ils soient liés à la réalisation\ndes occupations et utilisations du sol autorisées dans la zone.\n2.1.2. Règles spécifiques\n2.1.2.1. Reconstructions à l’identique\n2.1.2.1.1. En cas de sinistre\nEst autorisée, la reconstruction de locaux régulièrement édifiés et détruits après sinistre\ndepuis moins de dix ans, dès lors qu’elle ne modifie pas la destination existante, et ne\ndépasse ni la surface de plancher (SDP*), ni le volume, ni l’implantation des bâtiments ou\nparties de bâtiments existants avant le sinistre. Cette reconstruction devra disposer du\nmême nombre de places de stationnement existant avant sinistre ou respecter les\nnouvelles dispositions de l’article UE.12.\n2.1.2.1.2. Hors cas de sinistres\nEst autorisée la reconstruction de locaux, régulièrement édifiés et démolis depuis moins de\ndix ans, dès lors qu’elle ne modifie pas la destination existante et ne dépasse ni la SDP, ni\nl’implantation, ni le volume existant avant démolition.\n    3\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UE\n2.1.2.2. Règles spécifiques au parc urbain\nSur l’emprise du parc urbain sont admis, sous réserve du respect de la SDP précisée au\ndocument graphique n°UE 5.6.D. « Délimitation des îlots sur le plan cadastral et attribution\ndes constructibilités par îlots », les aménagements suivants :\n • La réalisation d’ouvrages techniques, édicules, cours anglaises, locaux d’entretien…\n   liés aux accès et à l’occupation des sous-sols qui ne pourraient être intégrés dans les\n   constructions ;\n • L’édification d’installations légères publiques, telles que sanitaires, local jardinier,\n   kiosque, abri…\n2.2. Rappels\nLes constructions nouvelles à destination d’habitation* et les établissements\nd’enseignement doivent répondre aux normes d’isolement acoustique conformément aux\narrêtés préfectoraux du 30 mai 1996 et du 9 janvier 1995 lorsque leurs façades sont\nexposées au bruit des infrastructures de transport terrestres classées par l’arrêté\npréfectoral du 29 juin 2000 (le classement figure dans les annexes en pièce n° 6.2.2 du\nprésent dossier).\nSection 2\nConditions de l'occupation du sol\nArticle UE.3. Conditions de desserte des terrains par\nles voies publiques ou privées et accès aux voies\nouvertes au public\n3.1. Conditions de desserte des unités foncières*\nPour être constructible, une unité foncière doit être desservie par une voie publique ou\nprivée en état de viabilité et dont les caractéristiques permettent de répondre aux\nexigences de la sécurité civile, de la lutte contre l'incendie et du ramassage des ordures\nménagères.\n    4\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UE\nToute création de voie de desserte devra présenter une largeur au moins égale à\n3,50 mètres.\n3.2. Accès aux voies ouvertes au public\nLorsque la situation d’une unité foncière permet d’accéder à plusieurs voies publiques ou\nprivées ouvertes au public, l’accès carrossable devra être réalisé sur la voie où la gêne\npour le piéton, l’usager des voies et la circulation est moindre.\n3.3. Parcours piétonniers (aménagements en faveur du piéton,\nliaisons piétonnes)\nLes liaisons piétonnes existantes ou à créer ainsi que les aménagements en faveur du\npiéton, figurant au document graphique n° 5.1 « zonage et servitudes », devront être\nassurés.\nArticle UE.4. Conditions de desserte des terrains par\nles réseaux publics d'eau, d'assainissement, de\ncommunication, d’énergie et de collecte des déchets\n4.1. Alimentation en eau potable\nToute construction ou installation nouvelle qui, par sa destination, implique une utilisation\nd’eau potable, doit être obligatoirement alimentée par un branchement sur le réseau public\nd’eau potable.\n4.2. Assainissement\n4.2.1. Eaux usées\nLe branchement sur le réseau collectif d’assainissement est obligatoire pour toute\nconstruction ou installation nouvelle engendrant des eaux usées. Toute évacuation dans\nles fossés et cours d’eau est interdite.\nLe rejet dans le réseau collectif des eaux résiduaires industrielles pourra être soumis à des\nconditions particulières et devra notamment être soumis à un pré-traitement.\n    5\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UE\n4.2.2. Eaux pluviales\nLes aménagements réalisés sur une unité foncière* ne doivent pas faire obstacle au libre\nécoulement des eaux pluviales (articles 640 et 641 du Code Civil).\nPour toute construction nouvelle, reconstruction ou réhabilitation, et quelle que soit la taille\nde l’unité foncière concernée, le rejet des eaux pluviales dans le réseau d'assainissement\ndevra respecter le règlement d’assainissement intercommunal de l’Etablissement Public\nTerritorial Paris Ouest La Défense.\nDans le cas où les caractéristiques de l’unité foncière ne permettent pas d’assurer une\nrétention naturelle d’eau suffisante, doivent être prévus des dispositifs de rétention\ncomplémentaires aux possibilités du réseau et utilisant des techniques alternatives.\nLes eaux de lessivage des parcs de stationnement, chaussées, aires de services, de\nmanœuvre ou d’activités, doivent faire l’objet de pré-traitement avant déversement dans le\nréseau public (dessablage, déshuilage, séparateur d’hydrocarbures,…).\n4.3. Réseau public de communications\nLes constructions ou installations nouvelles devront comporter les infrastructures\nnécessaires à leur branchement sur les réseaux de communication existants ou projetés :\n • Les réseaux traditionnels publics (téléphone, télex, liaisons spécialisées ...).\n • Les réseaux câblés de radiotélévision publics.\n • Les dispositifs d’émission ou de réception de signaux radioélectriques (antennes,\n   paraboles…) devront être installés sur la toiture de la façon la moins visible possible\n   depuis l’espace public.\n4.4. Collecte des déchets\n4.4.1. Dispositions générales\nLes constructions nouvelles doivent comporter des locaux de stockage des déchets,\nsuffisamment dimensionnés de manière à recevoir et permettre de manipuler sans\ndifficultés tous les récipients nécessaires à la collecte sélective des déchets.\nCes locaux seront isolés et fermés.\nCes dispositions ne s’appliquent pas aux constructions dont la SDP est inférieure ou égale\nà 50 m².\n    6\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UE\n4.4.2. Dispositions spécifiques suivant la ou les destinations des\nconstructions\nPour les constructions nouvelles à destination d’habitation*, ces locaux doivent être situés\nau rez-de-chaussée, à moins de 15 mètres de la voie ou de l’emprise publique et satisfaire\naux contraintes techniques de la collecte sélective en porte à porte.\nPour les constructions nouvelles à destination autres que d’habitation, ces locaux doivent\nêtre situés en rez-de-chaussée ou en sous-sol, mais préférentiellement en rez-de-\nchaussée.\nEn cas de mixité des destinations, ces locaux doivent répondre aux besoins de la collecte\nsélective des déchets de chacune des destinations.\n4.4.3. Dispositions spécifiques aux travaux sur constructions\nexistantes\nLors de travaux accompagnés d’un changement de destination de l’ensemble de la\nconstruction, les dispositions des articles 4.4.1. et 4.4.2. s’appliquent. Cependant, elles\npourront être adaptées si les caractéristiques des constructions ou de l’unité foncière ne le\npermettent pas.\n4.5. Rappels : Energies renouvelables\nL’utilisation des énergies renouvelables pour l’approvisionnement énergétique des\nconstructions sera privilégiée.\n4.5.1. Réseaux de distribution de chaleur et de froid\nLorsqu’existent des périmètres de développement prioritaires, toute installation d’un\nbâtiment neuf, ou faisant l’objet de travaux de rénovation importants, qu’il s’agisse\nd’installations industrielles ou d’installations de chauffage de locaux, de climatisation ou de\nproduction d’eau chaude, doit être raccordée au réseau concerné. L’exploitant du réseau\nd’énergie précisera les conditions de raccordement. Cette obligation de raccordement ne\nfait pas obstacle à l’utilisation d’installations de secours ou de complément.\n4.5.2. Alimentations pour véhicules rechargeables\nToute construction d’un immeuble d’habitation comportant au minimum 2 logements ou\nd’un bâtiment à destination de bureau* équipé de places de stationnement couvertes ou\nd’accès sécurisé doit doter une partie de ces places des gaines techniques, câblages et\ndispositifs de sécurité nécessaires à l’alimentation de prises de recharge pour les véhicules\nélectriques ou hybrides rechargeables et permettant un comptage individuel conformément\nau Code de la Construction et de l’Habitation.\n    7\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UE\nArticle UE.5. Superficie minimale des terrains\nconstructibles\nIl n’est pas fixé de règle.\nArticle UE.6. Implantation des constructions par\nrapport aux voies et emprises publiques\n6.1. Dispositions générales applicables à l’ensemble de la zone\nLes constructions nouvelles en superstructure devront s’implantées à l’intérieur de « la\nlimite d’implantation maximum » des constructions définies au document graphique n° UE\n5.6.B « emprise maximale et implantation des constructions en superstructure ».\n6.2. Saillies* et encorbellements*\nLes saillies (balcons, loggias, bow-windows et éléments d’ornementation) sur les voies\npubliques existantes ou futures ne pourront prendre naissance qu’à partir de 3,50 mètres\n(niveau fini du trottoir).\nDans le cas de façades comportant des portiques en rez-de-chaussée, ces éléments de\nsaillies pourront s’établir à partir du plancher bas du 1er étage.\nArticle UE.7. Implantation des constructions par\nrapport aux limites de propriété\nLes constructions sont autorisées en limite séparative* ou en retrait dans le respect des\nprescriptions suivantes :\n  • Implantation sur les limites séparatives : les constructions sont autorisées sur les limites\n    séparatives si la façade ne comporte pas de baie*.\n  • Implantation en retrait des limites séparatives : les constructions devront être\n    implantées de façon à ce que la distance comptée horizontalement de tout point de la\n    construction comportant des baies principales* au point de la limite séparative qui en\n    est le plus rapproché soit au moins égale à 1,90 mètre.\n    8\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UE\nArticle UE.8. Implantation des constructions les unes\npar rapport aux autres sur une même propriété\nLa distance comptée horizontalement de tout point d’une construction au point le plus\nproche d’une autre construction doit être au moins égale à 8 mètres dans le cas de baies\nprincipales* et au moins égale à 4 mètres dans les autres cas.\nArticle UE.9. Emprise au sol des constructions\n9.1. Emprise au sol des constructions en superstructure\nToutes les constructions en superstructure s’inscriront dans les emprises constructibles\ndéfinies au document graphique n° UE 5.6.B « emprise maximale et l’implantation des\nconstruction en superstructure », à l’exception :\n  • Des accès divers, locaux et ouvrages techniques.\n  • Des couvertures de rampe du parking ou d’aires de livraison.\n • Le cas échéant de l’émergence du plancher haut du 1er sous-sol dans la limite\n   maximum de 1,60 mètre par rapport à la cote NGF* de la voie.\n9.2. Rappel des dispositions pour les constructions en\ninfrastructures\nDans l’îlot A comprenant les secteurs A1 et A2, ainsi que dans l’îlot D, les constructions\nadmises à l’article UE.14. pourront s’étendre sous toute l’emprise de l’îlot.\nDe plus, dans l’emprise du parc situé dans l’îlot A2, sous la cote de référence NGF 36, sont\nautorisées les constructions dont les destinations sont précisées à l’article UE.14.\n    9\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UE\nArticle UE.10. Hauteur maximale des constructions\nLes constructions ne dépasseront pas une hauteur maximum correspondant en altitude\naux cotes NGF* indiquées au document graphique n° UE 5.6.C « hauteurs maximales des\nconstructions ».\nN’entrent pas dans le calcul de la hauteur maximale, et sous réserve d’une bonne insertion\ndans le projet de construction :\n • Les verrières nécessaires à l’éclairement des surfaces commerciales, à condition\n   qu’elles soient situées à une distance minimum de 8 mètres par rapport aux façades ou\n   parties de façades comportant des baies principales* et à condition qu’elles n’excèdent\n   pas une hauteur de 2 mètres au-dessus de la hauteur maximale définie au document\n   graphique n° UE 5.6.C « hauteurs maximales des constructions ».\n • Les éléments décoratifs d’architecture.\n • Les antennes, paratonnerre, paraboles et équipements de transmission et de réception.\n • Les volumes de superstructures tels que machineries d’ascenseur, locaux techniques,\n   locaux de ventilation et de climatisation, capteurs d’énergie, chaufferie en\n   superstructure, etc… à condition qu’ils n’excèdent pas une hauteur de 3 mètres au-\n   dessus de la hauteur maximale définie au document graphique n° UE 5.6.C « hauteurs\n   maximales des constructions ».\n • Les garde-corps des terrasses, à condition qu’ils n’excèdent pas 1,50 mètre de hauteur\n   au-dessus de la hauteur maximale définie au document graphique n° UE 5.6.C\n   « hauteurs maximales des constructions ».\n • Les installations techniques des immeubles IGH sous forme d’un étage technique.\n    10\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UE\nArticle UE.11. Aspect extérieur des constructions et\naménagement de leurs abords\n11.1. Dispositions générales applicables à toutes les\nconstructions\nL’emploi à nu, en parement extérieur, de matériaux destinés à être recouverts est interdit.\nLe pavé de verre est interdit en rez-de-chaussée des façades sur rue.\nL’installation de dispositifs favorisant la retenue des eaux pluviales ou la production\nd’énergie renouvelable correspondant aux besoins de la consommation domestique des\noccupants de l’immeuble ou de la partie d’immeuble concerné est autorisée sous réserve\nde s’inscrire qualitativement dans la composition du bâtiment et de s’intégrer dans le\npaysage urbain.\n11.2. Dispositions applicables aux constructions neuves et/ ou\nréhabilitation\n11.2.1. Traitement des toitures et des superstructures\nLes ouvrages techniques en superstructure mentionnés à l’article UE 10. feront partie de la\ncomposition volumétrique d’ensemble. Ils seront traités dans la même qualité de finition et\nsi possible avec les mêmes matériaux.\nLes toitures accessibles seront traitées en terrasses aménagées ou plantées. Les réseaux\ntechniques en toitures tels que VMC, climatisation, ventilations diverses seront\nobligatoirement camouflés ou encoffrés.\nLes toitures terrasses inaccessibles de plus de 50 m² et situées à une côte inférieure à\n60,00 m NGF* seront majoritairement végétalisées, à l’exception des parties occupées par\nles ouvrages techniques strictement nécessaires au fonctionnement du bâtiment et ne\npouvant être intégrés à l’intérieur, ou par des verrières, puits de lumière ou éléments\ndécoratifs…\nCette végétalisation sera assurée par une disposition de type traditionnelle avec apport de\nterre végétale*, ou par toute autre solution non traditionnelle sous réserve qu’elle assure\nune végétalisation de qualité (complexe comportant une couche végétale sur substrat par\nexemple).\nLorsqu’il y a utilisation de substrats, ceux-ci devront comporter une épaisseur minimum de\n11 centimètres.\nCette végétalisation devra également être réalisée en cas de réhabilitation lourde ou de la\nréfection de la toiture d’un bâtiment existant qui n’en n’aurait pas bénéficié lors de sa\n    11\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UE\nconstruction. Dans ce cas l’épaisseur de substrat imposée ci-dessus pourra être ajustée\naux contraintes techniques de l’existant.\nLes étanchéités auto-protégées ne pourront être laissées apparentes. La protection par\ngravillons est interdite à l’exception des toitures-terrasses des immeubles IGH.\n11.2.2. Pignons, locaux annexes\nLes murs pignons, mitoyens ou non, devront être traités en harmonie avec les façades\nprincipales.\nLes locaux annexes devront être traités avec un soin égal à celui apporté aux bâtiments\nprincipaux.\n11.2.3. Clôtures\nLes nouvelles clôtures en bordure de la voie publique (hors parc public) devront être\nconçues en harmonie avec les façades des bâtiments et ne pas dépasser une hauteur de\n1,60 mètre mesuré côté terrain privé.\n11.2.4. Edicules techniques\nLes ouvrages ou édicules techniques extérieurs au bâtiment et situés en rez-de-chaussée,\nainsi que les ventilations de sous-sol non situées en toiture devront être traités avec soin et\ns’harmoniser avec les façades tant en ce qui concerne les matériaux que les couleurs.\nCependant, sur la partie occupée par le futur parvis public, les édicules et ouvrages\ntechniques seront impérativement réduits au strict minimum nécessaire.\n    12\n    PLU Levallois-Perret – Modification n°2 du PLU\n    Pièce n°4.1. Règlement", "    ZONE UE\nArticle UE.12. Obligations imposées aux constructeurs\nen matière de réalisation d'aires de stationnement\n12.1. Dispositions Générales\nToutes les places seront trouvées en sous-sol.\nL’ensemble des places de stationnement sera trouvé sur l’unité foncière* (terrain d’assiette\nde la construction) ou dans l’îlot A.\nLe stationnement de véhicules motorisés correspondant aux besoins des constructions et\ninstallations nouvelles ou aux travaux
