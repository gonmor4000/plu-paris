<style>

:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1d1f22; --muted:#666b73; --line:#e3e1db; --accent:#1f5f8b; --accent-ink:#ffffff;
  --hl:#fff1a8; --chip:#eef1f4; --sum:#eef6ee; --sum-line:#b9d9bb; --code:#1f5f8b; --warn:#fff6e5;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15171a; --panel:#1d2024; --ink:#e7e7e4; --muted:#9aa0a8; --line:#30343a; --accent:#6fb3e0; --accent-ink:#0d1114;
  --hl:#5b4f12; --chip:#262a30; --sum:#1c2a1e; --sum-line:#35573a; --code:#8cc6ee; --warn:#2c2516;
}}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1d2024; --ink:#e7e7e4; --muted:#9aa0a8; --line:#30343a; --accent:#6fb3e0; --accent-ink:#0d1114;
  --hl:#5b4f12; --chip:#262a30; --sum:#1c2a1e; --sum-line:#35573a; --code:#8cc6ee; --warn:#2c2516;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px}
nav.tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto}
nav.tabs a{padding:8px 12px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
nav.tabs a.on{color:var(--ink);border-color:var(--accent);font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:5px 10px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wrap{display:flex;min-height:calc(100vh - 100px)}
aside{width:330px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow:auto;height:calc(100vh - 100px);position:sticky;top:100px}
main{flex:1;min-width:0;padding:18px 28px 80px;max-width:980px}
.filters{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line);cursor:pointer;user-select:none}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tree{padding:6px 0 30px}
.tree .n{display:flex;gap:6px;align-items:baseline;padding:3px 12px;cursor:pointer;font-size:13.5px;line-height:1.35}
.tree .n:hover{background:var(--chip)}
.tree .n.cur{background:var(--chip);box-shadow:inset 3px 0 0 var(--accent)}
.tree .n .cd{color:var(--code);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
.tree .n .pg{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.tree .l0{font-weight:700;margin-top:8px;text-transform:uppercase;font-size:12px;letter-spacing:.03em}
.tree .l1{font-weight:600}
.tree .l2{padding-left:24px}
.tree .l3{padding-left:40px;color:var(--ink)}
.tree .tg{cursor:pointer;color:var(--muted);width:12px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;transform:translateY(-1px)}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.crumb a{text-decoration:none}
h1.st{font-size:22px;margin:0 0 4px;line-height:1.3}
h1.st .cd{color:var(--code)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 14px;font-size:13px;color:var(--muted)}
.sum{background:var(--sum);border:1px solid var(--sum-line);border-radius:10px;padding:10px 14px;margin:0 0 16px}
.sum b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:2px}
.txt p{margin:0 0 10px}
.txt h4{margin:18px 0 8px;font-size:15px}
.txt ul{margin:0 0 10px;padding-left:22px}
.txt li{margin:0 0 5px}
.txt ul.sub{margin:5px 0 5px;list-style:circle}
.txt li.nb{list-style:none}
pre.tbl{font:12px/1.35 ui-monospace,Consolas,monospace;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre}
.ref{font-style:italic;color:var(--muted)}
a.xr{text-decoration:none;border-bottom:1px dotted var(--accent);white-space:nowrap}
a.fg{font-size:12px;background:var(--chip);border-radius:5px;padding:0 5px;text-decoration:none;font-style:normal}
.df{border-bottom:1px dashed var(--muted);cursor:help}
sup{font-size:9px;color:var(--muted)}
mark{background:var(--hl);color:inherit;border-radius:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.box h3{margin:0 0 8px;font-size:15px}
.sub-list a{display:block;padding:4px 0;text-decoration:none}
.sub-list .cd{color:var(--code);margin-right:6px}
.eq a{margin-right:8px}
.notes textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px;font:inherit}
.results .r{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.results .r:hover{background:var(--chip)}
.results .r .cd{color:var(--code);font-weight:600;margin-right:6px}
.results .r .sn{color:var(--muted);font-size:13.5px;margin-top:3px}
.pop{position:absolute;z-index:50;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px 14px;font-size:13.5px;max-height:320px;overflow:auto}
.pop h5{margin:0 0 6px;font-size:14px}
table.cf{width:100%;border-collapse:collapse;font-size:14px}
table.cf td,table.cf th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.cf th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
table.cf td.v{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ob .reg{font-size:12.5px;color:var(--muted);margin:-4px 0 8px}
.ob a{display:block;text-decoration:none;padding:3px 0}
.ob a .cd{color:var(--code);font-weight:600;margin-right:6px;font-size:13px}
.ob a span.w{color:var(--ink)}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.figs .fc{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.figs .fc img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover;object-position:top;background:#fff}
.figs .fc div{padding:8px 10px;font-size:13px}
.figview img{width:100%;max-width:760px;display:block;margin:0 auto 12px;border:1px solid var(--line);border-radius:6px;background:#fff}
.gl .gi{padding:12px 0;border-bottom:1px solid var(--line)}
.gl .gi h3{margin:0 0 4px;font-size:16px}
.gl .refs{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.az{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.warn{background:var(--warn);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.star{font-size:18px;line-height:1;border:none;background:none;padding:0 4px;color:var(--muted)}
.star.on{color:#e0a400}
.menu{display:none}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
@media (max-width:820px){

  .menu{display:inline-block}

.pj-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 18px}
.pj-tabs a{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pj-tabs a b{display:block;font-size:15.5px;margin-bottom:2px}
.pj-tabs a span{font-size:12.5px;color:var(--muted)}
.pj-tabs a.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.pj-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pj-cols ul{margin:0;padding-left:18px}.pj-cols li{margin:3px 0;font-size:14px}
.pj-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.pj-prog{flex:1;min-width:160px;height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.pj-prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.pj-bar button{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.pj-g h3{margin:0 0 6px;font-size:15px}
.pj-a{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.pj-a:first-of-type{border-top:0}
.pj-a input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}
.pj-a a{text-decoration:none;color:var(--ink)}
.pj-a .cd{color:var(--code);font-weight:600;margin-right:6px;font-size:13px}
.pj-a .tt{color:var(--muted);font-size:12.5px;display:block}
.pj-a.ok a{opacity:.55}
@media (max-width:760px){.pj-cols{grid-template-columns:1fr}}
@media print{.pj-tabs,.pj-bar button{display:none!important}.pj-a input{accent-color:#000}}
@media print{header,aside,.notes,.no-print{display:none!important} main{max-width:none;padding:0}}

.pg{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:0 0 14px;overflow:hidden}
.pg .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;background:var(--chip);font-size:12.5px;color:var(--muted)}
.pg pre{margin:0;padding:12px 14px;font:13px/1.5 ui-monospace,"Cascadia Mono",Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.pg pre .hh{background:var(--hl);font-weight:700}
.zsel{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.th-l{display:flex;flex-wrap:wrap;gap:6px}
.th-l .chip{font-size:12.5px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px}
.kv b{color:var(--muted);font-weight:600}
.pj-a .zn{font-size:11px;background:var(--chip);border-radius:5px;padding:0 5px;margin-left:6px;color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;font-style:italic}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btns a.b{display:inline-block;border:1px solid var(--line);border-radius:7px;padding:5px 10px;text-decoration:none;font-size:13.5px;background:var(--panel)}
.btns a.b.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
</style>

:40,"q":40,"n":40,"s":"toc","a":1,"z":"UA","th":[]},{"t":"2.1 – Zone UC 14-20","l":1,"p":40,"q":40,"n":40,"s":"toc","a":1,"z":"UC","th":[]},{"t":"2.1 – Zone UE 21-27","l":1,"p":40,"q":40,"n":40,"s":"toc","a":1,"z":"UE","th":[]},{"t":"2.1 – Zone UL 28-33","l":1,"p":40,"q":40,"n":40,"s":"toc","a":1,"z":"UL","th":[]},{"t":"2.1 – Zone N 34-37","l":1,"p":40,"q":40,"n":40,"s":"toc","a":1,"z":"N","th":[]},{"t":"3ème PARTIE – EMPLACEMENTS RESERVES 38-41","l":0,"p":40,"q":44,"n":44,"s":"toc","a":0,"z":null,"th":["er"]},{"t":"4ème PARTIE – ANNEXES 42-59","l":0,"p":44,"q":61,"n":44,"s":"toc","a":0,"z":null,"th":[]},{"t":"4.1 – Définitions de certains termes utilisés dans le présent règlement 42-43","l":1,"p":44,"q":45,"n":45,"s":"toc","a":0,"z":null,"th":["def"]},{"t":"4.2 – Délimitations de quartiers décrits au règlement 43-48","l":1,"p":45,"q":61,"n":61,"s":"toc","a":0,"z":null,"th":[]}],"zones":["N","UA","UC","UE","UL"],"pages":["    DATE    OBJET\n    07.12.2015    Approbation du PLU – Délibération du Conseil Municipal de Garches\n    18.05.2020    Mise à jour n° 1 – Arrêté de l’EPT « POLD »\n    30.06.2020    Modification n° 1 – Délibération de l’EPT « POLD »\n    15.02.2022    Modification simplifiée n° 2 - Délibération de l’EPT « POLD »\n    23.09.2025    Modification n° 3 - Délibération de l’EPT « POLD »\nMODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    1","    SOMMAIRE\n1ère PARTIE – DISPOSITIONS GÉNÉRALES    3-6\n1.1 – Champ d’application territorial du plan    3\n1.2 – Portée respective du règlement et des autres réglementations relatives à l’occupation des sols\n    3-4\n1.3 – Division du territoire en zones    4\n1.4 – Adaptations mineures de certaines règles    4\n1.5 – Reconstruction suite à sinistre    4-5\n1.6 – Prescriptions d’isolement acoustique    5\n1.7 – Protection du patrimoine archéologique    5\n1.8 – Eléments des patrimoines bâtis et naturels à protéger    5-6\n1.9 – Stationnement pour la construction de logements locatifs sociaux    6\n1.10 – Prescriptions architecturales, environnementales et paysagères    6\n2ème PARTIE – DISPOSITIONS APPLICABLES AUX ZONES    7-41\n2.1 – Zone UA    7-13\n2.1 – Zone UC    14-20\n2.1 – Zone UE    21-27\n2.1 – Zone UL    28-33\n2.1 – Zone N    34-37\n3ème PARTIE – EMPLACEMENTS RESERVES    38-41\n4ème PARTIE – ANNEXES    42-59\n4.1 – Définitions de certains termes utilisés dans le présent règlement    42-43\n4.2 – Délimitations de quartiers décrits au règlement    43-48\n4.3 – Liste du patrimoine bâti remarquable    49\n4.4 – Prescriptions architecturales – Cahier des couleurs de Garches    50-59\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    2","    1ère PARTIE – DISPOSITIONS GÉNÉRALES\n1.1 – Champ d’application territorial du plan\nLe présent règlement dont les dispositions s’imposent aux personnes physiques (particuliers) comme\naux personnes morales de droit public ou privé, s’applique à l’ensemble du territoire de la Commune\nde Garches.\nSes dispositions sont opposables pour l’exécution de tous travaux, même en l’absence d’obligation\nd’autorisation ou de déclaration préalable au titre du Code de l’Urbanisme\nAttention, des règlements spécifiques aux lotissements trouvent à s’appliquer dans certains cas.\nPar dérogation à l’article R.151-21 du Code de l’urbanisme, dans le cas d'un lotissement ou d’un permis\nde construire valant division, les règles du PLU sont appliquées à chaque lot et au reliquat éventuel.\nEn application de l’article L.442-9 du Code de l’urbanisme, les règles d'urbanisme contenues dans les\ndocuments du lotissement, notamment le règlement et le cahier des charges, deviennent caduques au\nterme de 10 années à compter de la délivrance de l'autorisation de lotir.\n1.2 – Portée respective du règlement et des autres règlementations relatives à l’occupation des\nsols\nSont et demeurent notamment applicables au territoire couvert par le PLU les dispositions suivantes du\nCode de l’Urbanisme :\nLes dispositions de l’article L.421-1 du Code de l’Urbanisme : sursis à statuer\nLes dispositions de l’article R.111-1 du Code de l’Urbanisme :\n    • Article R.111-2 : atteinte à la salubrité ou à la sécurité publique,\n    • Article R.111-4 : conservation ou la mise en valeur d’un site ou de vestiges\n    archéologiques,\n    • Articles R.111-20 à R111-27, dont :\n    o Article R.111-26 : conséquences dommageables pour l'environnement,\n    o Article R.111-27 : atteinte au caractère ou à l’intérêt des lieux avoisinants, aux\n    sites, aux paysages naturels ou urbains ainsi qu’à la conservation des\n    perspectives monumentales.\n    a) Les Servitudes d’Utilité Publique qui instituent une limitation administrative au\n    droit de propriété. La liste figure dans un document annexe.\n    Les servitudes d’alignement imposant un recul des constructions à réaliser sont décrites aux\n    plans de zonage et d’alignement ainsi que dans un document annexe.\n    b) Les articles du Code de l’Urbanisme ou d’autres législations concernant :\n    •   Les espaces naturels sensibles (art. L.142-1)\n    •   Le droit de préemption urbain (art. L.210-1) : L'ensemble des zones urbaines (U) est\n    soumis au Droit de Préemption Urbain renforcé conformément à l’article R.211.1 et\n    suivants du Code de l’urbanisme, selon les modalités définies en Conseil de Territoire.\n    •   Le règlement départemental d’assainissement des Hauts-de-Seine,\n    •   Le règlement du service assainissement Paris Ouest La Défense\n    •   Les servitudes de périmètre d’attente au titre du 5°de l’article L.151-41 du Code de\n    l’Urbanisme (PAPAG)Les emplacements réservés (art. L123-1-5 et suivants).\n    •   Les périmètres de Déclaration d’Utilité Publique,\n    •   Les périmètres du Projet Urbain Partenarial en substitution de la taxe d’aménagement.\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    3","1.3 – Division du territoire en zones\nLe territoire couvert par le Plan Local d’Urbanisme de Garches est divisé en zones urbaines (U) et en\nzones naturelles (N). A chacune des zones s’appliquent les dispositions au titre II du présent règlement.\n    1) La zone urbaine comprend les zones « U » :\n    -   La zone UA\n    -   La zone UC\n    -   La zone UE\n    -   La zone UL\n    2) La zone naturelle comprend la zone : « N »\n    3) Règlement d’urbanisme et emplacements réservés\n    En application de l’article L. 151-41 du Code de l’Urbanisme, des emplacements sont réservés\n    pour servir d’emprise aux voies et ouvrages publics, aux installations d’intérêt général ainsi\n    qu’aux espaces verts. Ces emplacements figurent dans un document annexe joint au dossier\n    avec indication sur les plans du zonage applicable.\n    Les constructions sont interdites sur les terrains bâtis ou non compris dans lesdits\n    emplacements réservés, sauf exception prévue à l’article L. 433-1 du Code de l’Urbanisme\n    pour les constructions à titre précaire.\n1.4 – Adaptations mineures de certaines règles\nLes dispositions des articles 3 à 13 du règlement ne peuvent faire l’objet que d’adaptations mineures\nrendues nécessaires par la nature du sol, la configuration des parcelles ou le caractère des\nconstructions avoisinantes conformément à l’article L. 152-3 du Code de l’Urbanisme.\nLes dispositions de l’article 1 et 2 ne peuvent faire l’objet d’aucune dérogation ou adaptation mineure.\n1.5 – Reconstruction suite a sinistre\nLa reconstruction sur un même terrain, de bâtiments ou de corps de bâtiments légalement édifiés peut\nêtre autorisée, à condition que la nouvelle construction ait la même destination que la construction\ninitiale et qu’elle présente une emprise au sol et une surface de plancher au plus égale à la surface de\nplancher au maximum égales à celles de la construction initiale. Ce afin :\n    -   soit d’assurer la conservation du patrimoine immobilier bâti, de manière à maintenir la\n    capacité économique et résidentielle de la Commune,\n    -   soit de moderniser ce patrimoine, sans porter gravement atteinte aux capacités d’accueil\n    des locaux existants, lorsqu’il est soit fonctionnellement inadapté à sa destination actuelle\n    ou prévue, soit en état de vétusté ne satisfaisant pas aux dispositions d’ordre public\n    applicables en matière d’urbanisme (hygiène, salubrité, sécurité),\n    -   soit de maintenir l’harmonie d’ensemble du paysage urbain issu notamment de la\n    volumétrie du bâti ou de l’existence du front bâti de rue,\n    -   soit de mettre en valeur le patrimoine architectural en assurant un front bâti cohérent au\n    droit de la voie par la couverture des murs pignons existants (terrains d’angle, terrains\n    bordés par plusieurs voies, dents creuses, …).\nAu titre de l’article L.111-15 du Code de l’Urbanisme, la reconstruction à l’identique d’un bâtiment\ndétruit depuis moins de 10 ans est autorisée nonobstant toute disposition d’urbanisme contraire, dès\nlors qu’il a été régulièrement édifié.\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    4","Dans tous les cas, une demande de permis de construire devra être déposée en mairie.\n1.6 – Prescriptions d’isolement acoustique\nL’arrêté préfectoral n° 2000-208 du 26 juillet 2000 porte classement des infrastructures de transports\nterrestres et prescrit l’isolation acoustique des bâtiments dans les secteurs affectés par le bruit ainsi\nque la carte associée aux Plans de Prévention du bruit dans l’environnement (art. L.572-10 du Code\nde l’Environnement).\nL’arrêté préfectoral n°2018-2-405 du 28 décembre 2018 porte approbation des cartes de bruit\nrelatives aux infrastructures routières dont le trafic annuel est supérieur à 3 millions de véhicules et\naux infrastructures ferroviaires dont le trafic annuel est supérieur à 30 000 passages de train.\nLes façades des bâtiments concernés doivent ainsi bénéficier d’un isolement suffisant en fonction du\ntype de la voie, du nombre de files de circulation, du type d’urbanisme, de la distance de la voie, de la\nhauteur de la construction.\n1.7 – Protection du patrimoine archéologique\nSur l’ensemble du territoire communal, s’applique la réglementation relative aux découvertes fortuites\nsusceptibles de présenter un caractère archéologique (art. L.531-14 du Code du Patrimoine) en\nprocédant à une déclaration en mairie et au service régional de l’archéologie.\nLes abords de l’église sont particulièrement concernés.\n1.8 – Eléments des patrimoines bâtis et naturels à protéger\nLe PLU protège, en application de l’articles L.151-19 et R.151-41 du Code de l’Urbanisme, le patrimoine\nbâti qui possède une qualité architecturale remarquable, ou constituent un témoignage dans la\nformation de l’histoire de la ville ou d’un quartier, ou assurent par leur volumétrie un repère particulier\ndans le paysage urbain, ou appartiennent à une séquence architecturale remarquable par son\nhomogénéité. Ces éléments remarquables sont de trois type : des éléments bâtis remarquables\nspectaculaires, des ensembles bâtis remarquables, et des éléments bâtis remarquables. Ils font l’objet\nd’une annexe spécifique du PLU et leur liste est rappelée en annexe du présent règlement. Ils sont\ndésignés au document graphique.\nPar principe, toutes dispositions doivent être prises pour conserver les éléments identifiés comme\nremarquables au PLU. Tous travaux réalisés sur les constructions et ouvrages supportant ces éléments\ndoivent obligatoirement prévoir la conservation des éléments architecturaux remarquables en façade,\nen toiture et sur clôture. Ils doivent contribuer à les mettre en valeur ou les restaurer. La suppression\nde ces références remarquables du patrimoine urbain ou architectural oblige de prévoir leur\nreconstitution ou leur restauration dans la réalisation du projet en justifiant leur suppression qui doit\nêtre liée à des contraintes techniques, de sécurité et/ou géotechniques.\nIl en est de même pour ce qui concerne le patrimoine végétal qui présente un intérêt de conservation\ndans l’équilibre du paysage. La liste des arbres identifiés figure dans un document annexe au présent\nrèglement. Ils sont désignés au document graphique. Leur abattage est interdit sauf en cas de risque\navéré pour la sécurité des personnes et des biens, ou de mauvais état phytosanitaire tel qu’aucune\nmesure de préservation ne permet de sauver l’arbre concerné. Le Guide de l’arbre du Département\ndes Hauts-de-Seine joint en annexe définit les règles à appliquer pour protéger de manière efficace les\narbres départementaux dans le cadre de travaux d’aménagements.\nEn cas d’abattage nécessaire, il est exigé la replantation d’un arbre à développement équivalent par\narbre abattu.\nDes espaces paysagers à protéger sont également identifiés sur le document graphique. Il s’agit\nd’espaces libres en partie ou en totalité végétalisés, plantés le cas échéant d’essences arbustives ou\narborées, présentant un intérêt dans le maintien des équilibres écologiques, pour leur qualité végétale\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    5","ou paysagère, notamment en termes de mise en valeur d’une construction ou d’une vue lointaine.\nL’ensemble de la surface de ces espaces sera conservé généralement en pleine terre, avec une logique\nde continuité herbacée au sol.\nLes plantations existantes, notamment les arbres de haute tige, doivent être impérativement\nmaintenues ou remplacées par des plantations d’essences adaptées au site et à l’évolution du climat.\n1.9 – Stationnements pour la construction de logements locatifs sociaux\nEn application des articles L.151-34 à L.151-36 du Code de l’Urbanisme, les exigences en matière de\nstationnement du présent PLU sont modulées pour les projets destinés à l’habitation situés à moins de\n500 m d'une gare :\nPour les logements mentionnés à l'article L. 151-34 du Code de l’Urbanisme, il ne peut être exigé la\nréalisation de plus de 0,5 aire de stationnement par logement social,\nPour les autres constructions destinées à l'habitation, il ne peut être exigé la réalisation de plus d’une\naire de stationnement par logement.\nEn cas d’impossibilité de réalisation d’aires de stationnement\nConformément à l’article L.151-33 Code de l’urbanisme, lorsque le règlement impose la réalisation\nd'aires de stationnement pour les véhicules motorisés, celles-ci peuvent être réalisées sur le terrain\nd'assiette ou dans son environnement immédiat. La situation des places dans le voisinage immédiat doit\nréellement permettre leur utilisation.\nLorsque le bénéficiaire du permis ou de la décision de non-opposition à une déclaration préalable ne\npeut pas satisfaire aux obligations résultant du premier alinéa, il peut être tenu quitte de ces obligations\nen justifiant, pour les places qu'il ne peut réaliser lui-même :\n    - Soit de l'obtention d'une concession à long terme dans un parc public de stationnement\n    existant ou en cours de réalisation et situé à proximité de l'opération dans un rayon\n    n’excédant pas 300 m ;\n    - Soit de l'acquisition ou de la concession de places dans un parc privé de stationnement\n    répondant aux mêmes conditions.\nLorsqu'une aire de stationnement a été prise en compte dans le cadre d'une concession à long terme\nou d'un parc privé de stationnement, elle ne peut plus être prise en compte, en tout ou en partie, à\nl'occasion d'une nouvelle autorisation.\nCes dispositions s’appliquent dans toutes les zones du PLU à Garches.\n1.10 – Prescriptions architecturales, environnementales et paysagères\nLes prescriptions architecturales, environnementales et paysagères jointes en annexe et auxquelles\nrenvoie le règlement d’urbanisme relèvent de la préconisation.\nLes dispositions qui sont décrites visent à préserver des éléments remarquables et structurants\nparticipant à la composition du paysage garchois et à faciliter l’insertion des constructions nouvelles\ndans l’environnement existant.\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    6","    2ème PARTIE – DISPOSITIONS APPLICABLES AUX ZONES\n    ZONE UA\nIl s’agit d’une zone dense à dominante d’habitat avec des commerces et des services où\nles bâtiments sont construits en ordre continu.\nElle couvre les quartiers du centre-ville, de la gare et du Petit-Garches.\n    SECTION I – NATURE DE L’OCCUPATION ET DE L’UTILISATION DU SOL\nArticle UA 1 : occupation et utilisation du sol interdites\n1.1 – Les constructions à usage d’activités industrielles ou d’entreposage sauf dans l’emprise ferroviaire\noù elles sont permises. L’emprise ferroviaire est définie en annexe du règlement.\n1.2 – Toutes constructions, dépôts ou aménagements, même à titre provisoire, apportant une nuisance\ntant du point de vue esthétique que du bruit, des odeurs ou encore présentant un risque pour la\nsécurité des personnes et des biens ou une atteinte à la salubrité publique (dépôts de ferraille, de\nmatériels, d’épaves, de combustibles solides ou liquides, de matériaux, ...).\n1.3 – Le camping et le caravanage.\n1.4 - Les affouillements et les exhaussements de sols non liés à un projet de construction.\nArticle UA 2 : occupation et utilisation du sol admises sous conditions\n2.1 – Il sera créé au moins 30 % de logements sociaux dans tout programme de construction,\nd’aménagement ou de changement de destination de locaux à partir de 800 m² de surface plancher à\ndestination d’habitation. Ces logements sociaux devront représenter au moins 30 % du nombre total\nde logements à l’issue du projet.\n2.2 – Les travaux portant sur le patrimoine bâti et naturel à protéger sont autorisés à condition de\nrespecter les dispositions aux articles I.8 et I.10 du présent règlement. Une attention particulière sera\nportée aux qualités architecturales du projet, aux matériaux employés, et au traitement des espaces\nlibres.\n    SECTION II – CONDITIONS DE L’OCCUPATION DU SOL\nArticle UA 3 : voie et accès\n3.1 – Pour être constructible, un terrain non bâti doit être accessible à une voie publique ou privée\nd’une largeur minimum de 3 m. Cette largeur de voie d’accès ne s’impose pas aux terrains déjà bâtis.\n3.2 – La voie doit présenter des caractéristiques permettant de satisfaire aux exigences de la sécurité\net de la défense contre l’incendie.\n3.3 – Les opérations d’aménagement créant plus de 2 lots doivent avoir une voie de desserte commune\nrépondant aux caractéristiques présentées ci-avant.\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    7","3.4 – Les voies se terminant en impasse doivent être aménagées de façon à permettre aux véhicules\nde faire demi-tour.\nArticle UA 4 : desserte par les réseaux\n4.1 – Eau : Toute construction nouvelle ou installation susceptible de requérir une alimentation en eau\npotable doit être raccordée au réseau public d’eau potable conformément aux règles en vigueur.\n4.2 – Assainissement : Toute construction nouvelle ou installation nouvelle susceptible de générer des\neaux usées doit être raccordée au réseau public d’assainissement conformément au règlement du\nservice d’assainissement en vigueur.\nConformément aux règlements d'assainissement en vigueur (POLD ou Département selon l'adresse\ndu point de rejet), quels que soient le terrain concerné, le statut du porteur de projet et l'état\nd'imperméabilisation initiale, les eaux de ruissellement générées par toute nouvelle construction, tout\nnouvel aménagement où toute extension doivent être gérées sur l'emprise du projet, a minima jusqu'à\nla pluie de retour 10 ans, sans raccordement direct ou indirect au réseau public d'assainissement sauf\nen cas d’impossibilité dûment justifiée. Le mode de gestion à la source des eaux pluviales doit être\nétudié dès la conception, comme une composante à part entière du projet.\nPour les pluies exceptionnelles (au-delà de la décennale), il convient d'anticiper les écoulements des\neaux pluviales ainsi que leurs conséquences sur les biens et les personnes.\nRappel : Le service assainissement n'est pas tenu de collecter les eaux pluviales. Leur rejet au réseau\npublic est soumis à dérogation.\n4.3 – Réseaux secs : Tous les fileries et branchements (électricité, courants faibles, câbles et réseaux\ndivers) doivent être réalisés en souterrain.\n4.4 – Déchets urbains : Un ou plusieurs locaux ou emplacements extérieurs pour recevoir des\ncontainers. Ces locaux et emplacements devront être facilement accessibles aux habitants.\nArticle UA 5 : caractéristiques des terrains\nSans objet.\nArticle UA 6 : implantation des constructions par rapport aux voies publiques ou privées\n6.1 – Les constructions, à l’exception des annexes, doivent être implantées à l’alignement des voies\npubliques ou privées desservant la propriété. Une implantation en retrait est toutefois autorisée dans\nles cas suivants :\n    - pour se raccorder à une construction voisine en recul,\n    - pour préserver des plantations existantes,\n    - pour valoriser un élément ancien ou caractéristique du paysage,\n6.2 – Lorsqu’il s’agit de travaux d’extension et surélévation de constructions existantes à la date\nd'approbation du PLU implantées différemment de la règle. Dans ce cas, l’extension peut être réalisée\nen respectant la même implantation que celle de la construction existante sous réserve d’une insertion\nqualitative dans l’environnement proche.\n6.3 – Ces dispositions ne s’appliquent pas aux constructions et installations nécessaires à l’activité\nferroviaire, situées dans l’emprise ferroviaire ni aux services publics ou d’intérêt collectif.\nArticle UA 7 : implantation des constructions par rapport aux autres limites séparatives\nde terrain\n7.1 – Les constructions, à l’exception des annexes, doivent respecter les règles de retrait qui suivent :\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    8","    a) les façades sans baies sont autorisées en limites séparatives ou en retrait à condition de\n    respecter un recul minimum de 3 m par rapport à la limite séparative opposée,\n    b) les façades comportant des baies principales doivent respecter un recul minimum de 6 m par\n    rapport à la limite séparative opposée,\n    c) les façades comportant des baies secondaires doivent respecter un recul minimum de 3 m par\n    rapport à la limite séparative opposée.\n7.2 – L’extension et la surélévation d’une construction existante ne respectant pas les retraits définis\nprécédemment peuvent être réalisées en respectant la même implantation que celle de la construction\nexistante sous réserve d’une insertion qualitative dans l’environnement proche.\n7.3 – Sont exclus des règles de retrait, les éléments architecturaux cités en annexe du règlement\nrelative aux annexes et plus précisément dans la définition du retrait des constructions.\n 7.4 – Ces dispositions ne s’appliquent pas aux constructions et installations nécessaires à l’activité\nferroviaire, situées dans l’emprise ferroviaire ni aux services publics ou d’intérêt collectif.\nArticle UA 8 : implantation des constructions les unes par rapport aux autres sur une\nmême propriété\n8.1 – Dans le cas de plusieurs constructions séparées, autres que des annexes, il convient de respecter\nune distance minimum entre les façades qui devra être :\n    -   de 6 m si l’une des façades comporte au moins une baie principale,\n    -   de 3 m dans les autres cas.\n8.2 – Ces dispositions ne s’appliquent pas aux constructions et installations nécessaires à l’activité\nferroviaire, situées dans l’emprise ferroviaire, ni aux services publics ou d’intérêt collectif.\nArticle UA 9 : emprise au sol\nSans objet.\nArticle UA 10 : hauteur maximum\n10.1 – Le plafond de la zone est le suivant :\n    -   Quartier centre et gare : 15 m.\n    Cette hauteur est majorée de 2 m pour un niveau en attique respectant un retrait d’au moins\n    1 m calculé à partir du nu extérieur de la façade du niveau inférieur.\n    Cette hauteur est limitée à 12 m en limite séparative avec un terrain situé en zone UE.\n    -   Quartier de la Poste et de l’Abreuvoir : 13 m au faîtage ou à l’acrotère\n    La hauteur à l’égout du toit est fixée à 10 m.\n    -   Quartier du Petit-Garches : 11 m au faîtage ou à l’acrotère.\n    La hauteur à l’égout du toit est fixée à 8 m.\nLes quartiers sont identifiés en annexe du règlement.\n10.2 – Dans le cas des annexes, la hauteur maximum est la suivante :\n    -   3,5 m au faîtage,\n    -   3 m à l’acrotère ou égout du toit.\n10.3 – Les ouvrages extérieurs (antennes, souches de cheminée, conduits, capteurs d’énergie solaire,\ngarde-corps ajourés, …) sont exclus des règles de hauteur. Les cabines d’ascenseurs et les locaux\ndivers ne peuvent dépasser 1 m au-dessus du plafond de la zone.\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    9","10.4 – En cas d’extension ou de surélévation d’une construction existante, la hauteur maximum sera\ncelle de la construction existante ou de celle qui lui est contigüe si l’une ou l’autre dépasse le plafond\nde la zone fixée à l’article 10.1.\nArticle UA 11 : aspect extérieur – clôtures\n11.1 – Le projet peut être refusé ou n’être accepté que sous réserve de l’observation de prescriptions\nspéciales si les constructions, par leur situation, leur architecture, leurs dimensions, ou l’aspect\nextérieur des bâtiments ou ouvrages à édifier ou à modifier, sont de nature à porter atteinte au\ncaractère ou à l’intérêt des lieux avoisinants, aux sites, aux paysages naturels ou urbains qu’à la\nconservation des perspectives monumentales (Art. R.111-27 du Code de l’Urbanisme).\nAspect extérieur\n11.2 – Les surfaces visibles de l’extérieur de la construction, destinées à recevoir un parement ou un\nenduit (parpaings, carreaux de plâtre, briques creuses…), ne peuvent être laissées brutes de fabrication\net doivent être revêtues.\n11.3 – Sont interdits :\n    -   les assemblages de couleurs non définis dans le guide des « couleurs de Garches » présenté à\n    l’annexe du règlement,\n    -   les couvertures en tôle, en amiante, d’aspect ciment, en papier goudronné, en plastique, en\n    fausses tuiles, en ardoises composites ou bac acier,\n    -   les clôtures en éléments de plastique,\n    -   les enduits à effet rustique prononcé (gros grain),\n    -   les matériaux réfléchissants,\n    -   le béton et les enduits ciment gris laissés à l’état brut y compris sur les clôtures,\n    -   les antennes de toutes sortes y compris les paraboles posées en saillie ou en applique sur les\n    façades, balcons, fenêtres.\n11.4 – Les façades latérales et postérieures des constructions doivent être traitées avec le même soin\nque les façades principales, en harmonie avec elles et celles des constructions existantes sur les terrains\ncontigus. Il en est ainsi notamment des pignons apparents. Ces dispositions s’appliquent également aux\nmurs de clôture et de soutènement en limites de propriété.\n11.5 – Le traitement des constructions annexes, garages, clôtures, extensions, doit être en harmonie\navec la construction principale tant par le choix des matériaux que par la qualité de finition.\n11.6 – Le traitement des devantures de commerce est laissé à l’appréciation de l’enseigne à condition\nde bien s’intégrer par rapport à la façade de l’immeuble.\n11.7 - Pour les constructions neuves à destination de logement d’au moins 3 logements, chaque\nlogement doit disposer au minimum d'un espace extérieur privatif (jardin, balcon, terrasse, loggia…)\n11.8 - Les installations techniques de type pompe à chaleur, dispositif extérieur de ventilation, de\nchauffage ou de climatisation… doivent être habillées d’un cache ou d’un coffrage anti-bruit.\nClôtures\n11.9 – La hauteur des clôtures ne peut être supérieure à 2 m à l’exception des piliers des portails\nd’entrée limités à 2,20 m de hauteur. Elles doivent être doublées d’une haie végétale.\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    10","11.10 – Le long des voies, les clôtures comportent des parties pleines d’une hauteur maximale de\n0,80 m à partir du trottoir. En bordure des voies départementales, les clôtures pleines sont autorisées\nsauf en cas de servitudes de visibilité. Lorsque de part et d’autre de la clôture à créer existent des\nmurs-bahuts présentant un certain caractère, celle-ci pourra être traitée de façon identique.\nLorsque la dénivellation entre le terrain et le trottoir ou la propriété voisine nécessite un mur de\nsoutènement, ce mur n’est alors pas pris en compte dans le calcul de la hauteur de la clôture.\n11.11 – Les clôtures à claire-voie ou grillage à prévoir en partie supérieures des murs-bahuts doivent\nprésenter des vides suffisants pour ne pas être assimilés à une paroi pleine. Les parois constituées\nd’échalas accolés sont assimilées à un mur plein. L’utilisation des éléments en bambou est proscrite.\nSeules les constructions situées le long boulevard Raymond Pointcarré et du boulevard du Général de\nGaulle peuvent bénéficier de clôture en mur plein.\n11.12 – Des passages seront créés en pied des clôtures sur les limites séparatives de parcelles pour\nfaciliter le passage de la faune sauvage.\n11.13 - Ces dispositions ne s’appliquent pas aux constructions et installations nécessaire à l’activité\nferroviaire, situées dans l’emprise ferroviaires, ni aux services publics.\n11.14 – Conformément à l'article L114-1 du code de la sécurité routière, les propriétés riveraines ou\nvoisines des voies publiques, situées à proximité de croisements, virages ou points dangereux ou\nincommodes pour la circulation publique peuvent être frappées de servitudes destinées à assurer une\nmeilleure visibilité.\nBâti protégé\n11.15 – Les travaux portant sur le patrimoine bâti à protéger doivent respecter les dispositions des\narticles I.8 et I.10 du présent règlement. Une attention particulière doit être portée aux qualités\narchitecturales du projet, aux matériaux employés, et au traitement des espaces libres.\nArticle UA 12 : stationnement\n12.1 – Les places de stationnement ont une longueur de 5 m et une largeur de 2,3 m.\n12.2 – Les rampes ne doivent pas entraîner de modification dans le niveau du trottoir. Leur pente ne\ndoit pas excéder 18 % et permettre un accès facile par rapport à la voie.\n12.3 – Besoins en stationnement pour :\n    •   Les voitures\n    Pour l’habitation :\n    -   2 pièces et 3 pièces : 1 place/logement\n    -   4 pièces et plus : 2 places/logement\n    -   Dans le cas de logements sociaux : 1 place/logement à partir du 2 pièces\n    -   Dans le périmètre de 500m autour de la gare : 1 place/logement\n    -   Dans le cas de logements sociaux dans le périmètre de 500m autour de la gare : 0,5\n    place/logement\n    Les vélos :\n    -   Bureaux : 1,5 m² pour 100 m² de surface de plancher\n    -   Habitation : 0,75 m² par logement à partir du 2 pièces.\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    11","    •   Les deux-roues motorisés : un emplacement facilement accessible devra être prévu pour\n    ces véhicules.\n12.4 – Les besoins en stationnement pour les autres constructions étant essentiellement fonction du\ncaractère des établissements, ils pourront varier compte tenu de leur nature, leur situation par rapport\naux transports collectifs ou d’une polyvalence des aires de stationnement dans l’environnement du\nprojet. Cette disposition s'applique également aux services publics ou d’intérêt collectif ainsi qu'aux\nconstructions à destination d'hébergement à caractère médico-social.\n12.5 – Lors de la création de logement supplémentaire, une place de stationnement est exigée par\nlogement créé.\n12.6 – Toutes dispositions devront être prises pour faciliter les dégagements les manœuvres de\nvéhicules à l’intérieur des constructions.\n12.7 – Lors de la création de plus de 30 logements (autres que sociaux) ou d’une surface d’activité\nsupérieure à 2.000 m², une borne de recharge sera créée dans l’opération pour les véhicules électriques\nainsi qu’une place de stationnement réservée à cet usage.\nArticle UA 13 : espaces libres et plantations\n13.1 – La surface minimale à traiter en espace pleine terre doit représenter au moins 20 % de la\nsuperficie du terrain. Les bandes de roulement et les aires de stationnement des véhicules ne sont pas\nconsidérés comme des espaces pleine terre, même s’ils sont engazonnés.\n13.2 – Il convient de prévoir un arbre par tranche de 150 m² d’espaces verts. Les projets de\nconstruction doivent être étudiés dans le sens d’une conservation maximum des plantations existantes\nen veillant à respecter au pourtour des arbres existants remarquables ou de qualité, un périmètre de\nprotection « non aedificandi » défini selon un cercle de rayon supérieur de 30 % au rayon du cercle\nformé par la ramure.\n13.3 – Ces dispositions ne sont pas applicables aux services publics ou d'intérêt collectif ainsi qu'aux\nconstructions à destination d'hébergement à caractère médico-social.\n13.4 – Patrimoine naturel protégé : les travaux portant sur le patrimoine naturel à protéger doivent\nrespecter les dispositions de l’article I.10 du présent règlement. Une attention particulière doit être\nportée à la préservation des arbres pendant toute la durée des travaux suivant la Charte de l’Arbre.\n    SECTION III – POSSIBILITÉS MAXIMALES D’OCCUPATION DU SOL\nArticle UA 14 : sans objet\n    SECTION IV – DISPOSITIONS PARTICULIÈRES\nArticle UA 15 : performances énergétiques et environnementales\n15.1 – Dans le cas d’éco-îlot défini dans les orientations d’aménagement et de programmation, les\nperformances énergétiques et environnementales seront « renforcées » en mettant en place des\ndispositifs ayant recours à des techniques ou des énergies renouvelables.\n15.2 – Les dispositifs, nécessaires à l’utilisation des énergies renouvelables et/ou l’amélioration des\nperformances énergétiques (tels que capteurs solaires, isolations par l’extérieur, …) à condition de ne\npas excéder 20 cm d’épaisseur par rapport au nu de la façade, sont exclus des règles de retrait et de\ndistance définies aux articles 6, 7 et 8 du PLU.\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    12","15.3 – Le recours à des matériaux, y compris ceux normalement prohibés à l’article 11, et à des mises\nen œuvre innovantes en matière d’aspect et de techniques de construction liées à une démarche\nrelevant de la Haute Qualité Environnementale est admis sous réserve d’une bonne insertion dans\nl’environnement.\n15.4 L’installation de panneaux photovoltaïques et/ou capteurs solaires est autorisée sur les éléments\nsuivants, dans le cas où ils sont intégrés à la toiture et de la même couleur que celle-ci :\n- sur le patrimoine bâti spectaculaire remarquable ;\n- sur les ensembles bâtis remarquables ;\n- sur les constructions comportant au moins 2 éléments d’architecture remarquable ;\n- sur les constructions visibles depuis la rue.\n15.5 – Il est fortement recommander d’utiliser des énergies renouvelables (énergie solaire thermique,\nphotovoltaïque, chaudière bois…) pour l’approvisionnement énergétique des constructions neuves, en\nfonction des caractéristiques de ces constructions, et sous réserve de la protection des sites et des\npaysages.\n15.6- Dans le cadre d’aménagements extérieurs, de constructions neuves ou de travaux sur\nconstructions existantes, l’utilisation des biomatériaux est vivement encouragée. Dans une logique de\ndéveloppement durable, les constructions doivent viser la sobriété énergétique. Les porteurs de projet\nsont donc encouragés à construire des bâtiments passifs ou à énergie positive en travaillant par exemple\nsur l’implantation des constructions afin d’optimiser les apports solaires.\n15.7 – Dans un objectif de gestion à la parcelle des eaux pluviales, les dispositifs favorisant la rétention,\nl’infiltration, l’évaporation, voire la réutilisation des eaux pluviales avant rejet dans les réseaux doivent\nêtre utilisés (réservoirs, mares, noues végétalisées) sauf en cas d’impossibilité dûment justifiée.\nArticle UA 16 : infrastructures et réseaux de communications électroniques\n16.1 – Les constructions créant plus de 10 logements ou des surfaces d’activités supérieures à 1.000\nm² sont tenues d’être raccordées aux réseaux de communications électroniques notamment la fibre\noptique si elle existe.\n16.2 – Dans le cas où la commune viendrait à disposer d’un réseau de distribution de chaleur ou de\nfroid, le raccordement à ces réseaux serait imposé aux constructions neuves situées à l’intérieur de\nces périmètres.\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    13","    ZONE UC\nIl s’agit d’une zone mixte d’habitat collectif, d’activités et de services construits en ordre\ndiscontinu dans un cadre verdoyant.\nElle couvre principalement les résidences existantes implantées sur les versants des\ncoteaux ainsi qu’en périphérie Nord et Est de la commune.\nCette zone fait l’objet de deux Périmètres d’Attente d’un Projet d’Aménagement global\n(PAPAG) sur le secteur de l’hôpital et sur le parc de la clinique du Château.\nSECTION I – NATURE DE L’OCCUPATION ET DE L’UTILISATION DU SOL\nArticle UC 1 : occupation et utilisation du sol interdites\n1.1 – Les constructions à usage d’activités industrielles.\n1.2 – Toutes constructions, dépôts ou aménagements, même à titre provisoire, apportant une nuisance\ntant du point de vue esthétique que du bruit, des odeurs ou encore présentant un risque pour la\nsécurité des personnes et des biens ou une atteinte à la salubrité publique (dépôts de ferraille, de\nmatériels, d’épaves, de combustibles solides ou liquides, de matériaux, ...).\n1.3 – Le camping et le caravanage.\n1.4 – Les installations classées soumises à autorisation autre que celles nécessaires à l’exploitation d’un\néquipement existant.\n1.5 – Les affouillements et les exhaussements de sols non liés à un projet de construction.\nArticle UC 2 : occupation et utilisation du sol admises sous conditions\n2.1 – Il sera créé au moins 30 % de logements sociaux dans tout programme de construction,\nd’aménagement ou de changement de destination de locaux créant au moins 800 m² de surface de\nplancher à destination d’habitation. Ces logements sociaux devront représenter au moins 30 % du\nnombre de logements total à l’issue du projet.\n2.2 – Les travaux portant sur le patrimoine bâti et naturel à protéger sont autorisés à condition de\nrespecter les dispositions des articles I.8 et I.10 du présent règlement. Une attention particulière sera\nportée aux qualités architecturales du projet, aux matériaux employés, et au traitement des espaces\nlibres.\n2.3 Les constructions à usage d’entrepôt sont admises dans la limite d’une emprise au sol de 100m².\n2.4 Dans le Périmètre d’Attente de Projet d’Aménagement Global au titre de l’article L.151-41 du\nCode de l’Urbanisme sont autorisées, les destinations suivantes :\n    -   L’adaptation, , la réfection des constructions existantes ;\n    -   Les extensions des constructions à condition qu’elles ne dépassent pas 10 m² de surface de\n    plancher et ce pour une durée de 5 ans à partir de la date d’approbation de la procédure de\n    modification n°3 du PLU, dans l’attente de l’approbation par la commune d’un projet\n    d’aménagement global.\nSECTION II – CONDITIONS DE L’OCCUPATION DU SOL\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    14","Article UC 3 : voie et accès\n3.1 – Pour être constructible, un terrain non bâti doit être accessible à une voie publique ou privée\nd’une largeur minimum de 3 m. Cette largeur de voie d’accès ne s’impose pas aux terrains déjà bâtis.\n3.2 – La voie doit présenter des caractéristiques permettant de satisfaire aux exigences de la sécurité\net de la défense contre l’incendie.\n3.3 – Les opérations d’aménagement créant plus de 2 lots doivent avoir une voie de desserte commune\nrépondant aux caractéristiques présentées ci-avant.\n3.4 – Les voies se terminant en impasse doivent être aménagées de façon à permettre aux véhicules\nde faire demi-tour.\nArticle UC 4 : desserte par les réseaux\n4.1 – Eau : Toute construction nouvelle ou installation susceptible de requérir une alimentation en eau\npotable doit être raccordée au réseau public d’eau potable conformément aux règles en vigueur.\n4.2 – Assainissement : Toute construction nouvelle ou installation nouvelle susceptible de générer des\neaux usées doit être raccordée au réseau public d’assainissement conformément au règlement du\nservice d’assainissement en vigueur.\nConformément aux règlements d'assainissement en vigueur (POLD ou Département selon l'adresse\ndu point de rejet), quels que soient le terrain concerné, le statut du porteur de projet et l'état\nd'imperméabilisation initiale, les eaux de ruissellement générées par toute nouvelle construction, tout\nnouvel aménagement où toute extension doivent être gérées sur l'emprise du projet, a minima jusqu'à\nla pluie de retour 10 ans, sans raccordement direct ou indirect au réseau public d'assainissement sauf\nen cas d’impossibilité dûment justifiée. Le mode de gestion à la source des eaux pluviales doit être\nétudié dès la conception, comme une composante à part entière du projet.\nPour les pluies exceptionnelles (au-delà de la décennale), il convient d'anticiper les écoulements des\neaux pluviales ainsi que leurs conséquences sur les biens et les personnes.\nRappel : Le service assainissement n'est pas tenu de collecter les eaux pluviales. Leur rejet au réseau\npublic est soumis à dérogation.\n4.3 – Réseaux secs : Tous les fileries et branchements (électricité, courants faibles, câbles et réseaux\ndivers) doivent être réalisés en souterrain.\n4.4 – Déchets urbains : Un ou plusieurs locaux ou emplacements extérieurs pour recevoir des\ncontainers. Ces locaux et emplacements devront être facilement accessibles aux habitants.\nUne aire de stockage devra être définie à proximité de la voie publique pour les bacs, les sacs et les\nencombrants afin de faciliter les opérations de collectes.\nArticle UC 5 : caractéristiques des terrains\nSans objet.\nArticle UC 6 : implantation des constructions par rapport aux voies publiques ou privées\n6.1 – Les constructions, à l’exception des clôtures et des annexes, doivent être implantées en retrait\nde 5 m minimum de l’alignement, actuel ou futur, des voies publiques ou privées. Une implantation\nmoindre est autorisée dans les cas suivants :\n    - pour se raccorder à une construction voisine,\n    - pour préserver des plantations existantes,\n    - pour valoriser un élément ancien ou caractéristique du paysage,\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    15","6.2 – Les constructions enterrées sont autorisées dans la marge de retrait.\n6.3 – Les saillies sur marge de retrait, avec un maximum de 2 m, sont admises pour les constructions\nnon closes tels que balcons, auvents, débords de toiture, escaliers, perrons, murs de soutènement,\njardinières, …\n6.4 – L’extension et la surélévation d’une construction existante ne respectant pas le reculement défini\nprécédemment, peuvent être réalisées en respectant la même implantation que celle de la construction\nexistante sous réserve d’une insertion qualitative dans l’environnement proche.\nArticle UC 7 : implantation des constructions par rapport aux autres limites séparatives\nde terrain\nLes constructions, à l’exception des annexes, doivent respecter les règles de retrait qui suivent :\n7.1 – Dans une bande de 20 m comptée à partir de la marge de retrait définie à l’article UC 6 :\n    a) les façades sans baies sont autorisées, soit en limites de propriété, soit en retrait à\n    condition de respecter un retrait minimum de 3 m par rapport à la limite séparative\n    opposée,\n    b) les façades comportant des baies principales doivent respecter un retrait minimum de 8 m\n    par rapport à la limite séparative opposée,\n    c) les façades comportant des baies secondaires doivent respecter un retrait minimum de 3\n    m par rapport à la limite séparative opposée.\nL’extension et la surélévation d’une construction existante ne respectant pas les retraits définis\nprécédemment peuvent être réalisées en respectant la même implantation que celle de la construction\nexistante sous réserve d’une insertion qualitative dans l’environnement proche.\n7.2 – Au-delà d’une bande de 20 m comptée à partir de la marge de retrait définie à l’article UC 6 :\n    a) les façades sans baies sont interdites en limites de propriété,\n    b) les façades comportant des baies principales doivent respecter un retrait minimum de 8 m\n    par rapport à la limite séparative opposée,\n    c) les façades comportant des baies secondaires doivent respecter un retrait minimum de 3\n    m par rapport à la limite séparative opposée,\n    d) les façades doivent s’insérer dans les héberges d’une construction, en bon état, existante\n    sur le terrain voisin ou s’il s’agit de façades aveugles de construction annexes.\n7.3 – Sont exclus des règles de retrait, les éléments architecturaux suivants :\n    -   les stores mobiles, les volets, les conduits de fumée, les barbecues,\n    -   les jours de lucarnes si elles sont aveugles,\n    -   les corniches, les débords de couverture,\n    -   les murs de soutènement, les jardinières, les escaliers extérieurs,\n    -   les toitures,\n    -   les dispositifs de performance énergétique.\n7.4 – Dans le cas d’une construction édifiée à l’angle de deux rues, la bande d’une profondeur de 20 m\nprévue par les dispositions précitées, est déterminée à partir de l’une ou l’autre des voies.\nArticle UC 8 : implantation des constructions les unes par rapport aux autres sur une\nmême propriété\n8.1 – Dans le cas de plusieurs constructions séparées, autres que des annexes, il convient de respecter\nune distance minimum entre les façades des constructions qui devra être :\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    16","    -   de 8 m si l’une des façades comporte au moins une baie principale,\n    -   de 3 m dans les autres cas.\nCes dispositions ne sont pas applicables aux services publics ou d’intérêt collectif.\nArticle UC 9 : emprise au sol\n9.1 – L’emprise au sol des constructions ne peut excéder 50 % de la surface du terrain.\nCes dispositions ne sont pas applicables aux services publics ou d'intérêt collectif ainsi qu'aux\nconstructions à destination d'hébergement à caractère médico-social.\nArticle UC 10 : hauteur maximum\n10.1 – Le plafond de la zone est fixé à 15 m sauf :\n    -   l’hôpital (sauf les zones Colbert et Deprez), la Cité du Personnel « Raymond Poincaré », la\n    hauteur est de 16,50 m.\nCette hauteur est limitée à 12 m en limite séparative avec un terrain situé en zone UE.\n10.2 – Dans le cas des annexes, la hauteur maximum est la suivante :\n    -   3,5 m au faîtage,\n    -   3 m à l’acrotère.\n10.3 – Les ouvrages extérieurs (antennes, souches de cheminée, conduits, capteurs d’énergie solaire,\ngarde-corps ajourés, …) sont exclus des règles de hauteur. Les cabines d’ascenseurs et les locaux\ndivers ne peuvent dépasser 1 m au-dessus du plafond de la zone.\n10.4 – En cas d’extension d’une construction, la hauteur sera limitée à celle du bâtiment existant\nlorsqu’il dépasse le plafond fixé à l’article 10.1.\nArticle UC 11 : aspect extérieur – clôtures\nAspect extérieur\n11.1 – Le projet peut être refusé ou n’être accordé que sous réserve de l’observation de prescriptions\nspéciales si les constructions, par leur situation, leur architecture, leurs dimensions, ou l’aspect\nextérieur des bâtiments ou ouvrages à édifier ou à modifier, sont de nature à porter atteinte au\ncaractère ou à l’intérêt des lieux avoisinants, aux sites, aux paysages naturels ou urbains qu’à la\nconservation des perspectives monumentales (Art. R.111-27 du Code de l’Urbanisme).\n11.2 – Les surfaces visibles de l’extérieur de la construction, destinées à recevoir un parement ou un\nenduit (parpaings, carreaux de plâtre, briques creuses…), ne peuvent être laissées brutes de fabrication\net doivent être revêtues.\n11.3 – Sont interdits :\n   - les assemblages de couleurs non définis dans le guide des « couleurs de Garches » présenté en\n    annexe du règlement,\n   - les couvertures en tôle, en amiante, d’aspect ciment, en papier goudronné, en plastique, en\n    fausses tuiles, en ardoises composites ou bac acier,\n   - les clôtures en éléments de plastique,\n   - les enduits à effet rustique prononcé (gros grain),\n   - les matériaux réfléchissants,\n   - le béton et les enduits ciment gris laissés à l’état brut y compris sur les clôtures,\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    17","    -   les antennes de toutes sortes y compris les paraboles posées en saillie ou en applique sur les\n    façades, balcons, fenêtres.\n11.4 – Les façades latérales et postérieures des constructions doivent être traitées avec le même soin\nque les façades principales, en harmonie avec elles et celles des constructions existantes sur les terrains\ncontigus. Il en est ainsi notamment des pignons apparents. Ces dispositions s’appliquent également aux\nmurs de clôture et de soutènement en limites de propriété.\n11.5 – Le traitement des constructions annexes, garages, clôtures, extensions, doit être en harmonie\navec la construction principale tant par le choix des matériaux que par la qualité de finition.\n11.6 – Le traitement des devantures de commerce est laissé à l’appréciation de l’enseigne à condition\nde bien s’intégrer par rapport à la façade de l’immeuble.\n11.7 - Pour les constructions neuves à destination de logement d’au moins 3 logements, chaque\nlogement doit disposer au minimum d'un espace extérieur privatif (jardin, balcon, terrasse, loggia…)\n11.8 - Les installations techniques de type pompe à chaleur, dispositif extérieur de ventilation, de\nchauffage ou de climatisation… doivent être habillées d’un cache ou d’un coffrage anti-bruit.\nClôtures\n11.9 – La hauteur des clôtures ne peut être supérieure à 2 m à l’exception des piliers des portails\nd’entrée limités à 2,20 m de hauteur. Elles doivent être doublées d’une haie végétale.\n11.10 – Le long des voies, les clôtures comportent des parties pleines d’une hauteur maximale de\n0,80 m à partir du trottoir. En bordure des voies départementales, les clôtures pleines sont autorisées\nsauf en cas de servitudes de visibilité. Lorsque de part et d’autre de la clôture à créer existent des\nmurs-bahuts présentant un certain caractère, celle-ci pourra être traitée de façon identique.\nLorsque la dénivellation entre le terrain et le trottoir ou la propriété voisine nécessite un mur de\nsoutènement, ce mur n’est alors pas pris en compte dans le calcul de la hauteur de la clôture.\n11.11 Les clôtures à claire-voie ou grillage à prévoir en partie supérieures des murs-bahuts doivent\nprésenter des vides suffisants pour ne pas être assimilés à une paroi pleine. Les parois constituées\nd’échalas accolés sont assimilées à un mur plein. L’utilisation des éléments en bambou est proscrite.\nSeules les constructions situées le long du boulevard Raymond Pointcarré et du boulevard du Général\nde Gaulle peuvent bénéficier de clôture en mur plein.\n11.12 – Des passages seront créés en pied des clôtures sur les limites séparatives de parcelles pour\nfaciliter le passage de la faune sauvage.\n11.13- Ces dispositions ne sont pas applicables aux services publics ou d’intérêt collectif.\n11.14 – Conformément à l'article L114-1 du code de la sécurité routière, les propriétés riveraines ou\nvoisines des voies publiques, situées à proximité de croisements, virages ou points dangereux ou\nincommodes pour la circulation publique peuvent être frappées de servitudes destinées à assurer une\nmeilleure visibilité.\nBâti protégé\n11.15 – Les travaux portant sur le patrimoine bâti à protéger doivent respecter les dispositions des\narticles I.8 et I.10 du présent règlement. Une attention particulière doit être portée aux qualités\narchitecturales du projet, aux matériaux employés, et au traitement des espaces libres.\nArticle UC 12 : stationnement\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    18","12.1 – Les places de stationnement ont une longueur de 5 m et une largeur de 2,3 m.\n12.2 – Les rampes ne doivent pas entraîner de modification dans le niveau du trottoir. Leur pente ne\ndoit pas excéder 18 % et permettre un accès facile par rapport à la voie.\n12.3 – Besoins en stationnement pour :\n    •   Les voitures\n    Pour l’habitation :\n    -   2 pièces et 3 pièces : 1 place/logement\n    -   4 pièces et plus : 2 places/logement\n    -   Dans le cas de logements sociaux : 1 place/logement\n    -   Dans le périmètre de 500m autour de la gare : 1 place/logement\n    -   Dans le cas de logements sociaux dans le périmètre de 500m autour de la gare : 0,5\n    place/logement\n    •   Les vélos :\n    -   Habitation : 0,75 m² par logement à partir du 2 pièces.\n    -   Bureaux : 1,50 m² par 100 m² de surface de plancher.\n    •   Les deux-roues motorisés : Un emplacement facilement accessible devra être prévu pour\n    ces véhicules.\n12.4 – Les besoins en stationnement pour les autres constructions étant essentiellement fonction du\ncaractère des établissements, ils pourront varier compte tenu de leur nature, leur situation par rapport\naux transports collectifs ou d’une polyvalence des aires de stationnement dans l’environnement du\nprojet. Cette disposition s'applique également aux services publics ou d’intérêt collectif ainsi qu'aux\nconstructions à destination d'hébergement à caractère médico-social.\n12.5 – Les exigences en matière de stationnement s’appliquent exclusivement aux surfaces\nnouvellement créées ou aux logements créés par changement de destination ou pas, à l’occasion du\nprojet.\n12.6 – Une proportion de 70 % au moins des places totales de stationnement définies ci-dessus devra\nêtre couvertes ou en sous-sol.\n12-7 – Toutes dispositions devront être prises pour réserver sur la propriété et à l’intérieur des\nconstructions des surfaces nécessaires aux dégagements et aux manœuvres des véhicules (voitures,\ncamions, deux roues).\n12.8 – Lors de la création de plus de 30 logements (autres que sociaux) ou d’une surface d’activités\nsupérieure à 2.000 m², une borne de recharge sera créée dans l’opération pour les véhicules électriques\nainsi qu’une place de stationnement réservée à cet usage.\nArticle UC 13 : espaces libres et plantations\n13.1 – La surface minimale à traiter en espaces verts doit représenter au moins 40 % de la surface du\nterrain, et au moins la moitié de ces espaces verts doit être constituée d’espaces verts de pleine terre.\nLes bandes de roulement et les aires de stationnement des véhicules ne sont pas considérés comme\ndes espaces pleine terre, même s’ils sont engazonnés.\n13.2 – Il convient de prévoir un arbre de haute tige par tranche de 150 m² d’espaces verts. Les projets\nde construction doivent être étudiés dans le sens d’une conservation maximum des plantations\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    19","existantes en veillant à respecter au pourtour des arbres existants remarquables ou de qualité, un\npérimètre de protection « non aedificandi » défini selon un cercle de rayon supérieur de 30 % au rayon\ndu cercle formé par la ramure.\n13.3 – Ces dispositions ne sont pas applicables aux services publics ou d'intérêt collectif ainsi qu'aux\nconstructions à destination d'hébergement à caractère médico-social.\n13.4 – Patrimoine naturel protégé : les travaux portant sur le patrimoine naturel à protéger doivent\nrespecter les dispositions de l’article I.10. Une attention particulière doit être portée à la préservation\ndes arbres pendant toute la durée des travaux suivant la Charte de l’Arbre.\nSECTION III – POSSIBILITÉS MAXIMALES D’OCCUPATION DU SOL\nArticle UC 14 : sans objet\nSECTION IV – DISPOSITIONS PARTICULIÈRES\nArticle UC 15 : performances énergétiques et environnementales\n15.1 – Dans le cas d’éco-îlot défini dans les orientations d’aménagement et de programmation, les\nperformances énergétiques et environnementales seront « renforcées » en mettant en place des\ndispositifs ayant recours à des techniques ou des énergies renouvelables.\n15.2 – Les dispositifs, nécessaires à l’utilisation des énergies renouvelables et/ou l’amélioration des\nperformances énergétiques (tels que capteurs solaires, isolations par l’extérieur, …) à condition de ne\npas excéder 20 cm d’épaisseur par rapport au nu de la façade, sont exclus des règles de retrait et de\ndistance définies aux articles 6, 7 et 8 du PLU.\n15.3 – Le recours à des matériaux, y compris ceux normalement prohibés à l’article 11, et à des mises\nen œuvre innovantes en matière d’aspect et de techniques de construction liées à une démarche\nrelevant de la Haute Qualité Environnementale est admis sous réserve d’une bonne insertion dans\nl’environnement.\n15.4 L’installation de panneaux photovoltaïques et/ou capteurs solaires est autorisée sur les éléments\nsuivants, dans le cas où ils sont intégrés à la toiture et de la même couleur que celle-ci :\n- sur le patrimoine bâti spectaculaire remarquable,\n- sur les ensembles bâtis remarquables,\n- sur les constructions comportant au moins 2 éléments d’architecture remarquable,\n- sur les constructions visibles depuis la rue.\n15.5 – Il est fortement recommander d’utiliser des énergies renouvelables (énergie solaire thermique,\nphotovoltaïque, chaudière bois…) pour l’approvisionnement énergétique des constructions neuves, en\nfonction des caractéristiques de ces constructions, et sous réserve de la protection des sites et des\npaysages.\n15.6 – Dans le cadre d’aménagements extérieurs, de constructions neuves ou de travaux sur\nconstructions existantes, l’utilisation des biomatériaux est vivement encouragée. Dans une logique de\ndéveloppement durable, les constructions doivent viser la sobriété énergétique. Les porteurs de projet\nsont donc encouragés à construire des bâtiments passifs ou à énergie positive en travaillant par exemple\nsur l’implantation des constructions afin d’optimiser les apports solaires.\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    20","15.7 –Dans un objectif de gestion à la parcelle des eaux pluviales, les dispositifs favorisant la rétention,\nl’infiltration, l’évaporation, voire la réutilisation des eaux pluviales avant rejet dans les réseaux doivent\nêtre utilisés (réservoirs, mares, noues végétalisées) sauf en cas d’impossibilité dûment justifiée.\nArticle UC 16 : infrastructures et réseaux de communications électroniques\n16.1 – Les constructions créant plus de 10 logements ou des surfaces d’activités supérieures à 1.000\nm² sont tenues d’être raccordées aux réseaux de communications électroniques notamment la fibre\noptique si elle existe.\n16.2 – Dans le cas où la commune viendrait à disposer d’un réseau de distribution de chaleur ou de\nfroid, le raccordement à ces réseaux serait imposé aux bâtiments neufs situés à l’intérieur de ces\npérimètres.\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    21","    ZONE UE\nIl s’agit d’une zone à dominante d’habitat faiblement dense et comportant des constructions\nimplantées en ordre discontinu dans un cadre verdoyant.\nSECTION I – NATURE DE L’OCCUPATION ET DE L’UTILISATION DU SOL\nArticle UE 1 : occupation et utilisation du sol interdites\n1.1 – Les constructions à usage d’activités industrielles.\n1.2 – Toutes constructions, dépôts ou aménagements, même à titre provisoire, apportant une nuisance\ntant du point de vue esthétique que du bruit, des odeurs ou encore présentant un risque pour la\nsécurité des personnes et des biens ou une atteinte à la salubrité publique (dépôts de ferraille, de\nmatériels, d’épaves, de combustibles solides ou liquides, de matériaux, …).\n1.3 – Le camping et le caravanage.\n1.4 – Les installations classées soumises à autorisation autre que celles nécessaires à l’exploitation d’un\néquipement existant.\n1.5 – Les affouillements et les exhaussements de sols non liés à un projet de construction.\nArticle UE 2 : occupation et utilisation du sol admises sous conditions\n2.1 – Il sera créé au moins 30 % de logements sociaux dans tout programme de construction,\nd’aménagement ou de changement de destination de locaux à partir de 800 m² de surface de plancher\nà destination d’habitation. Ces logements sociaux devront représenter au moins 30 % du nombre de\nlogements total à l’issue du projet.\n2.2 – Les travaux portant sur le patrimoine bâti et naturel à protéger sont autorisés à condition de\nrespecter les dispositions aux articles I.8 et I.10 du présent règlement. Une attention particulière sera\nportée aux qualités architecturales du projet, aux matériaux employés, et au traitement des espaces\nlibres.\n2.3 Les constructions à usage d’entrepôt sont admises dans la limite d’une emprise au sol de 100m².\nSECTION II – CONDITIONS DE L’OCCUPATION DU SOL\nArticle UE 3 : voie et accès\n3.1 – Pour être constructible, un terrain non bâti doit être accessible à une voie publique ou privée\nd’une largeur minimum de 3 m. Cette largeur de voie d’accès ne s’impose pas aux terrains déjà bâtis.\n3.2 – La voie doit présenter des caractéristiques permettant de satisfaire aux exigences de la sécurité\net de la défense contre l’incendie.\n3.3 – Les opérations d’aménagement créant plus de 2 lots doivent avoir une voie de desserte commune\nrépondant aux caractéristiques présentées ci-avant.\n3.4 – Les voies se terminant en impasse doivent être aménagées de façon à permettre aux véhicules\nde faire demi-tour.\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    22","Article UE 4 : desserte par les réseaux\n4.1 – Assainissement : Toute construction nouvelle ou installation nouvelle susceptible de générer des\neaux usées doit être raccordée au réseau public d’assainissement conformément au règlement du\nservice d’assainissement en vigueur.\nConformément aux règlements d'assainissement en vigueur (POLD ou Département selon l'adresse\ndu point de rejet), quels que soient le terrain concerné, le statut du porteur de projet et l'état\nd'imperméabilisation initiale, les eaux de ruissellement générées par toute nouvelle construction, tout\nnouvel aménagement où toute extension doivent être gérées sur l'emprise du projet, a minima jusqu'à\nla pluie de retour 10 ans, sans raccordement direct ou indirect au réseau public d'assainissement sauf\nen cas d’impossibilité dûment justifiée. Le mode de gestion à la source des eaux pluviales doit être\nétudié dès la conception, comme une composante à part entière du projet.\nPour les pluies exceptionnelles (au-delà de la décennale), il convient d'anticiper les écoulements des\neaux pluviales ainsi que leurs conséquences sur les biens et les personnes.\nRappel : Le service assainissement n'est pas tenu de collecter les eaux pluviales. Leur rejet au réseau\npublic est soumis à dérogation.\n4.3 – Réseaux secs : Tous les fileries et branchements (électricité, courants faibles, câbles et réseaux\ndivers) doivent être réalisés en souterrain.\n4.4 – Déchets urbains : Un ou plusieurs locaux ou emplacements extérieurs pour recevoir des\ncontainers. Ces locaux et emplacements devront être facilement accessibles aux habitants.\nUne aire de stockage devra être définie à proximité de la voie publique pour les bacs, les sacs et les\nencombrants afin de faciliter les opérations de collectes.\nArticle UE 5 : caractéristiques des terrains\nSans objet.\nArticle UE 6 : implantation des constructions par rapport aux voies publiques ou privées\n6.1 – Les constructions, à l’exception des clôtures et des annexes, doivent être implantées en retrait\nde 5 m minimum de l’alignement, actuel ou futur, des voies publiques ou privées.\nUne implantation moindre est autorisée dans les cas suivants :\n    -   pour se raccorder à une construction voisine,\n    -   pour préserver des plantations existantes,\n    -   pour valoriser un élément ancien ou caractéristique du paysage,\n6.2 – Les constructions enterrées sont autorisées dans la marge de retrait.\n6.3 – Les saillies dans la marge de retrait sont admises pour les constructions non closes tels que\nbalcons, auvents, débords de toiture, escaliers, perrons, murs de soutènement, jardinières, …\n6.4 – Lorsqu’il s’agit de travaux d’extension et surélévation de constructions existantes à la date\nd'approbation du PLU implantées différemment de la règle. Dans ce cas, l’extension peut être réalisée\nen respectant la même implantation que celle de la construction existante sous réserve d’une insertion\nqualitative dans l’environnement proche.\nArticle UE 7 : implantation des constructions par rapport aux autres limites séparatives\nde terrain\nLes constructions, à l’exception des annexes, doivent respecter les règles de retrait qui suivent :\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    23","7.1 – Par rapport aux limites de propriété joignant l’alignement des voies.\n    7.1.1 – Dans une bande de 20 m comptée à partir de la marge de retrait définie à l’article UE 6 :\n    a) les façades sans baies sont autorisées en limites séparatives ou en retrait à condition de\n    respecter un recul minimum de 3 m par rapport à la limite séparative opposée,\n    b) les façades comportant des baies principales doivent respecter un retrait minimum de 8 m par\n    rapport à la limite séparative opposée,\n    c) les façades comportant des baies secondaires doivent respecter un retrait minimum de 3 m\n    par rapport à la limite séparative opposée.\n    7.1.2 – Au-delà d’une bande de 20 m comptée à partir de la marge de retrait définie à l’article UE\n6:\n    a) les constructions doivent s’écarter de toutes les limites sauf si elles s’insèrent dans les héberges\n    d’une construction, en bon état, existante sur le terrain voisin,\n    b) les façades comportant des baies principales doivent respecter un retrait minimum de 8 m par\n    rapport à la limite séparative opposée,\n    c) les façades comportant des baies secondaires doivent respecter un retrait minimum de 3 m\n    par rapport à la limite séparative opposée.\n– Dans le cadre d’aménagements extérieurs, de constructions neuves ou de travaux sur constructions\nexistantes, l’utilisation des biomatériaux est vivement encouragée. Dans une logique de développement\ndurable, les constructions doivent viser la sobriété énergétique. Les porteurs de projet sont donc\nencouragés à construire des bâtiments passifs ou à énergie positive en travaillant par exemple sur\nl’implantation des constructions afin d’optimiser les apports solaires.\n7.1.3 – L’extension et la surélévation d’une construction existante ne respectant pas les retraits définis\nprécédemment peuvent être réalisées en respectant la même implantation que celle de la construction\nexistante sous réserve d’une insertion qualitative dans l’environnement proche.\n7.2 – Par rapport aux limites de fonds ne joignant pas l’alignement des voies.\n    d) Les façades en limites de propriété sont interdites à l’exception des abris de jardin.\n    e) les façades comportant des baies principales doivent respecter un retrait minimum de 8 m par\n    rapport à la limite séparative opposée.\n    f) les façades comportant des baies secondaires doivent respecter un retrait minimum de 3 m\n    par rapport à la limite séparative opposée.\n7.3 – Sont exclus des règles de retrait, les éléments architecturaux suivants :\n    - les balcons et autres saillies non closes,\n    - les stores mobiles, les volets, les conduits de fumée, les barbecues,\n    - les jours de lucarnes si elles sont aveug
