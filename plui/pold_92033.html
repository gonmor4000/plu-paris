les,\n    - les corniches, les débords de couverture,\n    - les murs de soutènement, les jardinières, les escaliers extérieurs,\n    - les toitures,\n    - les dispositifs de performance énergétique.\n7.4 – Dans le cas d’une construction édifiée à l’angle de deux rues, la bande d’une profondeur de 20\nm, prévue par les dispositions précitées, est déterminée à partir de l’une ou l’autre des voies.\nArticle UE 8 : implantation des constructions les unes par rapport aux autres sur une\nmême propriété\n8.1 – Dans le cas de plusieurs constructions séparées, autres que des annexes, il convient de respecter\nune distance minimum entre les façades qui devra être :\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    24","    -   de 8 m si l’une des façades comporte au moins une baie principale,\n    -   de 3 m dans les autres cas.\nArticle UE 9 : emprise au sol\n9.1 – L’emprise au sol des constructions ne peut excéder 25 % de la surface du terrain.\nPour des travaux d’extension d’un bâti existant sur un terrain existant avant la date d’approbation de\nla modification n°1 du PLU, l’emprise totale des constructions est portée à 35 % de la surface du\nterrain.\nCes dispositions ne sont pas applicables aux services publics ou d'intérêt collectif ainsi qu'aux\nconstructions à destination d'hébergement à caractère médico-social.\nArticle UE 10 : hauteur maximum\n10.1 – Hauteur des constructions :\n    a) En cas de toiture avec pente, 7 m à l’égout et 10 m au faîtage.\n    b) En cas de toiture-terrasse, 7 m à l’acrotère. Un niveau supplémentaire en attique peut être\n    autorisé à condition de respecter un retrait d’au moins 1 mètre calculé à partir du nu extérieur\n    de la façade du niveau inférieur, et de vérifier une hauteur maximale de 10 m au faîtage ou à\n    l’acrotère.\n10.2 – Dans le cas des annexes, la hauteur maximum est la suivante :\n    -   3,5 m au faîtage\n    -   3 m à l’égout du toit ou à l’acrotère.\n10.3 – Les ouvrages extérieurs (antennes, souches de cheminée, conduits, capteurs d’énergie solaire,\ngarde-corps ajourés, …) sont exclus des règles de hauteur. Les cabines d’ascenseurs et les locaux\ndivers (sauf cheminées, conduit de ventilation, …) doivent être compris dans le plafond de la zone.\nArticle UE 11 : aspect extérieur – clôtures\nAspect extérieur\n11.1 – Le projet peut être refusé ou n’être accepté que sous réserve de l’observation de prescriptions\nspéciales si les constructions, par leur situation, leur architecture, leurs dimensions, ou l’aspect\nextérieur des bâtiments ou ouvrages à édifier ou à modifier, sont de nature à porter atteinte au\ncaractère ou à l’intérêt des lieux avoisinants, aux sites, aux paysages naturels ou urbains qu’à la\nconservation des perspectives monumentales (Art. R.111-27 du Code de l’Urbanisme).\n11.2 – Les surfaces visibles de l’extérieur de la construction, destinées à recevoir un parement ou un\nenduit (parpaings, carreaux de plâtre, briques creuses…), ne peuvent être laissées apparentes et\ndoivent être revêtues.\n11.3 – Sont interdits :\n   - les assemblages de couleurs non définis dans le guide des « couleurs de Garches » indiqué en\n    annexe du règlement,\n   - les couvertures en tôle, en amiante, d’aspect ciment, en papier goudronné, en plastique, en\n    fausses tuiles, en ardoises composites ou bac acier\n   - les clôtures en éléments de plastique,\n   - les enduits à effet rustique prononcé (gros grain),\n   - les matériaux réfléchissants,\n   - le béton et les enduits ciment gris laissés à l’état brut y compris sur les clôtures,\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    25","    -   les antennes de toutes sortes y compris les paraboles posées en saillie ou en applique sur les\n    façades, balcons, fenêtres,\n    -   toit à la Mansard.\n11.4 – Les façades latérales et postérieures des constructions doivent être traitées avec le même soin\nque les façades principales, en harmonie avec elles et celles des bâtiments existants sur les terrains\ncontigus. Il en est ainsi notamment des pignons apparents. Ces dispositions s’appliquent également aux\nmurs de clôture et de soutènement en limites de propriété.\n11.5 – Le traitement des constructions annexes, garages, clôtures, extensions, doit être en harmonie\navec la construction principale tant par le choix des matériaux que par la qualité de finition.\n11.6 – Le traitement des devantures de commerces est laissé à l’appréciation de l’enseigne à condition\nde bien s’intégrer à la façade de l’immeuble.\n11.7 - Pour les constructions neuves à destination de logement d’au moins 3 logements, chaque\nlogement doit disposer au minimum d'un espace extérieur privatif (jardin, balcon, terrasse, loggia…)\n11.8 - Les installations techniques de type pompe à chaleur, dispositif extérieur de ventilation, de\nchauffage ou de climatisation… doivent être habillées d’un cache ou d’un coffrage anti-bruit.\n Clôtures\n11.9 – D’une façon générale, la hauteur des clôtures ne peut être supérieure à 2 m, à l’exception des\npiliers des portails d’entrée limités à 2,20 m de hauteur. Elles doivent être doublées d’une haie végétale.\n11.10 – Le long des voies, elles ne peuvent comporter de parties pleines à une hauteur supérieure à\n0,80 m à partir du trottoir. En bordure des voies départementales, les clôtures pleines sont autorisées\nsauf en cas de servitudes de visibilité. Lorsque de part et d’autre de la clôture à créer existent des\nmurs-bahuts présentant un certain caractère, celle-ci pourra être traitée de façon identique.\nLorsque la dénivellation entre le terrain et le trottoir ou la propriété voisine nécessite un mur de\nsoutènement, ce mur n’est alors pas pris en compte dans le calcul de la hauteur de la clôture.\n11.11 – Les treillages ou grillages à prévoir en partie supérieure des murs-bahuts doivent présenter\ndes vides suffisants pour ne pas être assimilés à une paroi pleine. Les parois constituées d’échalas\naccolés sont assimilées à un mur plein. L’utilisation des éléments en bambou est proscrite. Seules les\nconstructions situées le long du boulevard Raymond Pointcarré et du boulevard du Général de Gaulle\npeuvent bénéficier de clôture en mur plein.\n11.12 – Des passages seront créés en pied des clôtures sur les limites séparatives de parcelles pour\nfaciliter le passage de la faune sauvage.\n11.13 Les dispositions relatives aux clôtures ne s’appliquent pas aux services publics ou d’intérêt\ncollectif.\n11.14 – Conformément à l'article L114-1 du code de la sécurité routière, les propriétés riveraines ou\nvoisines des voies publiques, situées à proximité de croisements, virages ou points dangereux ou\nincommodes pour la circulation publique peuvent être frappées de servitudes destinées à assurer une\nmeilleure visibilité.\nBâti protégé\n11.15 - Les travaux portant sur le patrimoine bâti à protéger doivent respecter les dispositions aux\narticles I.8 et I.10 du présent règlement. Une attention particulière doit être portée aux qualités\narchitecturales du projet, aux matériaux employés, et au traitement des espaces libres.\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    26","Article UE 12 : stationnement\n12.1 – Les places de stationnement ont une longueur de 5 m et une largeur de 2,3 m.\n12.2 – Besoins en stationnement\n    Pour l’habitation :\n    -   2 pièces et 3 pièces : 1 place/logement\n    -   4 pièces et plus : 2 places/logement\n    -   Dans le cas des logements sociaux : 1 place/logement\nLa Ville pourra adapter les obligations de création d’aires de stationnement applicables aux logements\ndans le cas de construction située à moins de 500 m de la gare.\n    Pour les activités :\n    -   Commerces, locaux artisanaux, entrepôts et ateliers : sans objet.\n    -   Bureaux non liés à la destination principale du local à usage d’habitation :\n    o A moins de 500 m de la gare, une place par 60 m² de surface de plancher,\n    o A plus de 500 m de la gare, une place par 50 m² de surface de plancher.\n    Pour les autres locaux : Les besoins en stationnement étant essentiellement fonction du\n    caractère des établissements, les surfaces minimales pourront varier compte tenu de la nature\n    et de la situation de la construction et d’une polyvalence éventuelle d’utilisation des aires.\n    Cette disposition s'applique également aux services publics ou d’intérêt collectif ainsi qu'aux\n    constructions à destination d'hébergement à caractère médico-social.\n12.3 – Les rampes ne doivent pas entraîner de modification dans le niveau du trottoir. Leur pente ne\ndoit pas excéder 18 % et permettre un accès facile par rapport à la voie.\n12.4 – Les exigences en matière de stationnement s’appliquent exclusivement aux surfaces\nnouvellement créées ou aux logements créés par changement de destination ou pas, à l’occasion du\nprojet.\n12.5 – Toutes dispositions devront être prises pour réserver sur la propriété et à l’intérieur des\nconstructions des surfaces nécessaires aux dégagements et aux manœuvres des véhicules (voitures,\ncamions, deux roues).\nArticle UE 13 : espaces libres et plantations\n13.1 – Un projet neuf de construction entraîne l’obligation de traiter en espace vert 65 % au moins de\nla superficie du terrain dont 55% seront traités en espace pleine terre.\nCette proportion est portée à au moins 55 % d’espace pleine terre de la superficie du terrain lorsqu’il\ns’agit d’un projet d’extension du bâti dans un terrain existant avant la date d’approbation de la\nmodification n° 1 du PLU.\nCes dispositions ne sont pas applicables aux services publics ou d'intérêt collectif ainsi qu'aux\nconstructions à destination d'hébergement à caractère médico-social.\nLes bandes de roulement et les aires de stationnement des véhicules ne sont pas considérés comme\ndes espaces pleine terre, même s’ils sont engazonnés.\nIl convient de planter au minimum un arbre haute tige par 150 m² d’espaces verts.\n13.2 – Les projets de construction doivent être étudiés dans le sens d’une conservation maximum de\nla biodiversité en veillant à respecter au pourtour des arbres de qualité, un périmètre de protection\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    27","« non aedificandi » défini selon un cercle de rayon supérieur à 30 % au rayon du cercle formé par la\nramure.\nSECTION III – POSSIBILITÉS MAXIMALES D’OCCUPATION DU SOL\nArticle UE 14 : sans objet\nSECTION IV – DISPOSITIONS PARTICULIÈRES\nArticle UE 15 : performances énergétiques et environnementales\n15.1 – Dans le cas d’éco-îlot défini dans les orientations d’aménagement et de programmation, les\nperformances énergétiques et environnementales seront « renforcées » en mettant en place des\ndispositifs ayant recours à des techniques ou des énergies renouvelables.\n15.2 – Les dispositifs, nécessaires à l’utilisation des énergies renouvelables et/ou l’amélioration des\nperformances énergétiques (tels que capteurs solaires, isolations par l’extérieur, …) à condition de ne\npas excéder 20 cm d’épaisseur par rapport au nu de la façade, sont exclus des règles de retrait et de\ndistance définies aux articles 6, 7 et 8 du PLU.\n15.3 – Le recours à des matériaux, y compris ceux normalement prohibés à l’article 11, et à des mises\nen œuvre innovantes en matière d’aspect et de techniques de construction liées à une démarche\nrelevant de la Haute Qualité Environnementale est admis sous réserve d’une bonne insertion dans\nl’environnement.\n15.4 L’installation de panneaux photovoltaïques et/ou capteurs solaires est autorisée sur les éléments\nsuivants, dans le cas où ils sont intégrés à la toiture et de la même couleur que celle-ci :\n- sur le patrimoine bâti spectaculaire remarquable,\n- sur les ensembles bâtis remarquables,\n- sur les constructions comportant au moins 2 éléments d’architecture remarquable,\n- sur les constructions visibles depuis la voie.\n15.5 – Il est fortement recommander d’utiliser des énergies renouvelables (énergie solaire thermique,\nphotovoltaïque, chaudière bois…) pour l’approvisionnement énergétique des constructions neuves, en\nfonction des caractéristiques de ces constructions, et sous réserve de la protection des sites et des\npaysages.\n15.6 – Dans le cadre d’aménagements extérieurs, de constructions neuves ou de travaux sur\nconstructions existantes, l’utilisation des biomatériaux est vivement encouragée. Dans une logique de\ndéveloppement durable, les constructions doivent viser la sobriété énergétique. Les porteurs de projet\nsont donc encouragés à construire des bâtiments passifs ou à énergie positive en travaillant par exemple\nsur l’implantation des constructions afin d’optimiser les apports solaires.\n15.7 – Dans un objectif de gestion à la parcelle des eaux pluviales, les dispositifs favorisant la rétention,\nl’infiltration, l’évaporation, voire la réutilisation des eaux pluviales avant rejet dans les réseaux doivent\nêtre utilisés (réservoirs, mares, noues végétalisées) sauf en cas d’impossibilité dûment justifiée.\nArticle UE 16 : infrastructures et réseaux de communications électroniques\nSans objet.\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    28","MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME   29","    ZONE UL\nIl s’agit d’une zone urbaine de faible densité à vocation de loisirs et de sports.\nElle comprend les terrains publics et privés aménagés pour des activités de détente, de\nplein air mais aussi de loisirs et de culture.\nSECTION I – NATURE DE L’OCCUPATION ET DE L’UTILISATION DU SOL\nArticle UL 1 : occupation et utilisation du sol interdites\n1.1 – Les constructions sauf celles soumises à conditions spéciales.\n1.2 – Toutes constructions, dépôts ou aménagements, même à titre provisoire, apportant une nuisance\ntant du point de vue esthétique que du bruit, des odeurs ou encore présentant un risque pour la\nsécurité des personnes et des biens ou une atteinte à la salubrité publique (dépôts de ferraille, de\nmatériels, d’épaves, de combustibles solides ou liquides, de matériaux, ...).\n1.3 – Le camping et le caravanage.\n1.4 – Les installations classées soumises à autorisation en dehors de celles utiles à l’exploitation de la\nzone.\nArticle UL 2 : occupation et utilisation du sol admises sous conditions\n2.1 – Les constructions, installations et travaux divers nécessaires à l’exploitation et de la zone.\n2.2 – Les travaux portant sur le patrimoine bâti et naturel à protéger sont autorisés à condition de\nrespecter les dispositions des articles I.8 et I.10 du présent règlement. Une attention particulière sera\nportée aux qualités architecturales du projet, aux matériaux employés, et au traitement des espaces\nlibres.\nSECTION II – CONDITIONS DE L’OCCUPATION DU SOL\nArticle UL 3 : voie et accès\n3.1 – 3.1 – Pour être constructible, un terrain non bâti doit être accessible à une voie publique ou\nprivée d’une largeur minimum de 3 m. Cette largeur de voie d’accès ne s’impose pas aux terrains déjà\nbâtis.\n3.2 – La voie doit présenter des caractéristiques permettant de satisfaire aux exigences de la sécurité\net de la défense contre l’incendie.\n3.3 – Les opérations d’aménagement créant plus de 2 lots doivent avoir une voie de desserte commune\nrépondant aux caractéristiques présentées ci-avant.\n3.4 – Les voies se terminant en impasse doivent être aménagées de façon à permettre aux véhicules\nde faire demi-tour.\nArticle UL 4 : desserte par les réseaux\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    30","4.1 – Assainissement : Toute construction nouvelle ou installation nouvelle susceptible de générer des\neaux usées doit être raccordée au réseau public d’assainissement conformément au règlement du\nservice d’assainissement en vigueur.\nConformément aux règlements d'assainissement en vigueur (POLD ou Département selon l'adresse\ndu point de rejet), quels que soient le terrain concerné, le statut du porteur de projet et l'état\nd'imperméabilisation initiale, les eaux de ruissellement générées par toute nouvelle construction, tout\nnouvel aménagement où toute extension doivent être gérées sur l'emprise du projet, a minima jusqu'à\nla pluie de retour 10 ans, sans raccordement direct ou indirect au réseau public d'assainissement sauf\nen cas d’impossibilité dûment justifiée. Le mode de gestion à la source des eaux pluviales doit être\nétudié dès la conception, comme une composante à part entière du projet.\nPour les pluies exceptionnelles (au-delà de la décennale), il convient d'anticiper les écoulements des\neaux pluviales ainsi que leurs conséquences sur les biens et les personnes.\nRappel : Le service assainissement n'est pas tenu de collecter les eaux pluviales. Leur rejet au réseau\npublic est soumis à dérogation.\n4.2 – Réseaux secs : Tous les fileries et branchements (électricité, courants faibles, câbles et réseaux\ndivers) doivent être réalisés en souterrain.\n4.3 – Déchets urbains : Un ou plusieurs locaux ou emplacements extérieurs pour recevoir des\ncontainers. Ces locaux et emplacements devront être facilement accessibles aux habitants.\nUne aire de stockage devra être définie à proximité de la voie publique pour les bacs, les sacs et les\nencombrants afin de faciliter les opérations de collectes.\nArticle UL 5 : caractéristiques des terrains\nSans objet.\nArticle UL 6 : implantation des constructions par rapport aux voies publiques ou privées\n6.1 – Les constructions, à l’exception des clôtures et des annexes, doivent être implantées en retrait\nde 5 m de l’alignement actuel ou futur des voies publiques ou privées desservant la propriété. Une\nimplantation moindre est autorisée dans les cas suivants :\n    -    pour se raccorder à une construction voisine,\n    -    pour préserver des plantations existantes,\n    -    pour valoriser un élément ancien ou caractéristique du paysage,\n    -    pour respecter une autre marge de reculement définie au plan de zonage.\n6.2 – Les constructions enterrées sont autorisées dans la marge de retrait.\nLes saillies sur marge de retrait, avec un minimum de 2 m, sont admises pour les constructions non\ncloses tels que balcons, auvents, débords de toiture, escaliers, perrons, murs de soutènement,\njardinières, …\n6.3 – L’extension et la surélévation d’une construction existante ne respectant pas le retrait défini\nprécédemment, sont autorisées à condition de ne pas aggraver la non-conformité à la règle.\nArticle UL 7 : implantation des constructions par rapport aux autres limites séparatives\nde terrain\n7.1 – Les constructions doivent respecter les règles de retrait qui suivent :\n    a)    les façades sans baies sont autorisées, soit en limites de propriété, soit en retrait minimum\n    de 3 m par rapport à la limite séparative opposée,\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    31","    b)    les façades comportant des baies principales doivent respecter un retrait minimum de 8 m\n    par rapport à la limite séparative opposée,\n    c)    les façades comportant des baies secondaires doivent respecter un retrait minimum de 3 m\n    par rapport à la limite séparative opposée.\n7.2 – L’extension et la surélévation d’une construction existante ne respectant pas les retraits définis\nprécédemment sont autorisées à condition de ne pas aggraver le non-respect de la règle.\n7.3 – Sont exclus des règles de retrait, les éléments architecturaux suivants :\n    - les balcons et autres saillies non closes,\n    - les stores mobiles, les volets, les conduits de fumée, les barbecues,\n    - les jours de lucarnes si elles sont aveugles,\n    - les corniches, les débords de couverture,\n    - les murs de soutènement, les jardinières, les escaliers extérieurs,\n    - les toitures,\n    - les dispositifs de performance énergétique.\nArticle UL 8 : implantation des constructions les unes par rapport aux autres sur une\nmême propriété\n8.1 – Dans le cas de plusieurs constructions séparés, autres que des annexes, il convient de respecter\nune distance minimum entre les façades des constructions qui devra être :\n    -    de 8 m si l’une des façades comporte au moins une baie principale,\n    -    de 3 m dans les autres cas.\nCes dispositions ne s’appliquent pas aux services publics ou d’intérêt collectif.\nArticle UL 9 : emprise au sol\n9.1 – L’emprise au sol des bâtiments ne pourra excéder 10 % de la surface du terrain.\nLe coefficient d’emprise au sol ne s’applique pas aux services publics ou d’intérêt collectif.\nArticle UL 10 : hauteur maximum\n10.1 – Le plafond de la zone est fixé à 13 m.\n10.2 – Les ouvrages extérieurs (antennes, souches de cheminée, conduits, capteurs d’énergie solaire,\ngarde-corps ajourés, …) sont exclus des règles de hauteur. Les cabines d’ascenseurs et les locaux\ndivers ne peuvent dépasser 1 m au-dessus du plafond de la zone.\n10.3 – En cas d’extension ou de surélévation d’une construction existante, la hauteur maximum sera\ncelle de la construction existante ou de celle qui lui est contigüe si l’une ou l’autre dépasse le plafond\nde la zone fixée à l’article 10.1.\nArticle UL 11 : aspect extérieur – clôtures\n11.1 – Le projet peut être refusé ou n’être accepté que sous réserve de l’observation de prescriptions\nspéciales si les constructions, par leur situation, leur architecture, leurs dimensions, ou l’aspect\nextérieur des bâtiments ou ouvrages à édifier ou à modifier, sont de nature à porter atteinte au\ncaractère ou à l’intérêt des lieux avoisinants, aux sites, aux paysages naturels ou urbains qu’à la\nconservation des perspectives monumentales (Art. R.111-27 du Code de l’Urbanisme).\nAspect extérieur\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    32","11.2 – Les surfaces visibles de l’extérieur, destinées à recevoir un parement ou un enduit, ne peuvent\nêtre laissées apparentes et doivent être revêtues.\n11.3 – Sont interdits :\n    -   les assemblages de couleurs non définis dans le guide des « couleurs de Garches » indiqué en\n    annexe du règlement,\n    -   les couvertures en tôle, en amiante, d’aspect ciment, en papier goudronné, en plastique, en\n    fausses tuiles, en ardoises composites ou bac acier,\n    -   les clôtures en éléments de plastique,\n    -   les enduits à effet rustique prononcé (gros grain),\n    -   les matériaux réfléchissants,\n    -   le béton et les enduits ciment gris laissés à l’état brut y compris sur les clôtures,\n    -   les antennes de toutes sortes y compris les paraboles posées en saillie ou en applique sur les\n    façades, balcons, fenêtres.\n11.4 – Les façades latérales et postérieures des constructions doivent être traitées avec le même soin\nque les façades principales, en harmonie avec elles et celles des bâtiments existants sur les terrains\ncontigus. Il en est ainsi notamment des pignons apparents. Ces dispositions s’appliquent également aux\nmurs de clôture et de soutènement en limites de propriété.\n11.5 – Le traitement des constructions annexes, garages, clôtures, extensions, doit être en harmonie\navec la construction principale tant par le choix des matériaux que par la qualité de finition.\nClôtures\n11.6 – La hauteur des clôtures ne peut être supérieure à 2 m à l’exception des piliers des portails\nd’entrée limités à 2,20 m de hauteur. Elles doivent être doublées d’une haie végétale.\n11.7 – Le long des voies, les clôtures ne peuvent comporter de parties pleines à une hauteur supérieure\nà 0,80 m à partir du trottoir. En bordure des voies départementales, les clôtures pleines sont autorisées\nsauf en cas de servitudes de visibilité. Lorsque de part et d’autre de la clôture à créer existent des\nmurs-bahuts présentant un certain caractère, celle-ci pourra être traitée de façon identique.\nLorsque la dénivellation entre le terrain et le trottoir ou la propriété voisine nécessite un mur de\nsoutènement, ce mur n’est alors pas pris en compte dans le calcul de la hauteur de la clôture.\n11.8 – Les treillages ou grillages à prévoir en partie supérieure des murs-bahuts doivent présenter des\nvides suffisants pour ne pas être assimilés à une paroi pleine. Les parois constituées d’échalas accolés\nsont assimilées à un mur plein. L’utilisation des éléments en bambou est proscrite.\n11.9 – Des passages seront créés en pied des clôtures sur les limites séparatives de parcelles pour\nfaciliter le passage de la faune sauvage.\n11.10 - Pour les constructions neuves à destination de logement d’au moins 3 logements, chaque\nlogement doit disposer au minimum d'un espace extérieur privatif (jardin, balcon, terrasse, loggia…)\n11.11 - Les installations techniques de type pompe à chaleur, dispositif extérieur de ventilation, de\nchauffage ou de climatisation… doivent être habillées d’un cache ou d’un coffrage anti-bruit.\n11.12 – Conformément à l'article L114-1 du code de la sécurité routière, les propriétés riveraines ou\nvoisines des voies publiques, situées à proximité de croisements, virages ou points dangereux ou\nincommodes pour la circulation publique peuvent être frappées de servitudes destinées à assurer une\nmeilleure visibilité.\n11.13 – Ces dispositions ne s’appliquent pas aux services publics ou d’intérêt collectif.\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    33","Bâti protégé\n11.14 - Les travaux réalisés sur un bâtiment ou sur une partie d’ouvrage protégé au titre de l’article\nL.151-19 du code de l’urbanisme et identifié par les documents graphiques du présent règlement\ndoivent respecter les dispositions ci-dessous :\n11.15.1 – Au titre du bâti spectaculaire remarquable,\n    -   Respecter et mettre en valeur les caractéristiques structurelles du bâtiment en permettant des\n    travaux qui amélioreront les conditions d’accessibilité, d’habitabilité ou de sécurité,\n    -   Respecter et mettre en valeur les caractéristiques architecturales du bâtiment en obligeant de\n    conserver l’aspect d’origine de manière à ne pas altérer son aspect extérieur,\n    -   Interdire la démolition du bâti principal sauf pour des cas exceptionnels liés à des impératifs\n    de sécurité,\n    -   Préserver les espaces libres situés aux abords immédiats du bâtiment par un traitement de\n    qualité approprié à ses qualités architecturales.\n11.15.2 – Au titre des éléments bâtis remarquables,\n    -   Les travaux entrepris sur des éléments particuliers qui sont protégés par le règlement au titre\n    des prescriptions architecturales du chapitre 4.3 (p. 56) doivent être conservés, restaurés, mis\n    en valeur pour être intégrés au mieux au nouvel ensemble bâti (façades, ornements, peintures,\n    clôtures, ferronnerie, porches, briques, décors, lucarnes, boiseries, ...).\n11.15.3 – Au titre des ensembles bâtis remarquables,\n    -   Les travaux réalisés sur les parcelles répertoriées comme « Ensemble bâti remarquable » sont\n    exclus des contraintes susvisées mais sont soumis à l’application renforcée de l’article 11.1 du\n    PLU pour parvenir à une bonne insertion urbaine en préservant le paysage de la voie.\nArticle UL 12 : stationnement\n12.1 – Les places de stationnement ont une longueur de 5 m et une largeur de 2,3 m.\n12.2 – Les rampes ne doivent pas entraîner de modification dans le niveau du trottoir ou de la place\npublique. Leur pente ne doit pas excéder 18 % et permettre un accès facile par rapport à la voie.\n12.3 – Les besoins en stationnement étant essentiellement fonction du caractère des établissements,\nils pourront varier compte tenu de la nature et de la situation de la construction et d’une polyvalence\néventuelle d’utilisation des aires.\n12.4 – Les exigences en matière de stationnement s’appliquent exclusivement aux surfaces et\nlogements nouvellement créés à l’occasion du projet.\n12.5 – Toutes dispositions devront être prises pour réserver sur la propriété et à l’intérieur des\nconstructions des surfaces nécessaires aux dégagements et aux manœuvres des véhicules (voitures,\ncamions, deux roues).\nArticle UL 13 : espaces libres et plantations\n13.1 – Les espaces libres devront être agrémentés de plantations et aménagés majoritairement en\nespace pleine terre.\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    34","13.2 – Les projets de construction devront être étudiés dans le sens de conservation maximum des\nplantations existantes en veillant à respecter au pourtour des arbres existants de qualité, un périmètre\nde protection « non aedificandi » définit selon un cercle de rayon supérieur à 30 % au rayon du cercle\nformé par la ramure.\n13.3 – Les sols artificiels (dalle supérieure de sous-sol, couverture de parking) destinés à être traités\nen espace vert seront recouverts sur leur totalité d’une couche de terre végétale de 0,80 m moyen\nd’épaisseur au moins, comportant tous les composants techniques nécessaires à la création et au\nmaintien d’un espace vert de qualité.\nSECTION III – POSSIBILITÉS MAXIMALES D’OCCUPATION DU SOL\nArticle UL 14 : sans objet.\nSECTION IV – DISPOSITIONS PARTICULIÈRES\nArticle UL 15 : performances énergétiques et environnementales\n15.1 – Les dispositifs, nécessaires à l’utilisation des énergies renouvelables et/ou l’amélioration des\nperformances énergétiques (tels que capteurs solaires, isolations par l’extérieur, …) à condition de ne\npas excéder 20 cm d’épaisseur par rapport au nu de la façade, sont exclus des règles de retrait et de\ndistance définis aux articles 6, 7 et 8 du PLU.\n15.2 – Le recours à des matériaux, y compris ceux normalement prohibés à l’article 11, et à des mises\nen œuvre innovantes en matière d’aspect et de techniques de construction liées à une démarche\nrelevant de la Haute Qualité Environnementale est admis sous réserve d’une bonne insertion dans\nl’environnement.\n15.3 – Dans un objectif de gestion à la parcelle des eaux pluviales, les dispositifs favorisant la rétention,\nl’infiltration, l’évaporation, voire la réutilisation des eaux pluviales avant rejet dans les réseaux doivent\nêtre utilisés (réservoirs, mares, noues végétalisées) sauf en cas d’impossibilité dûment justifiée.\nArticle UL 16 : infrastructures et réseaux de communications électroniques\nSans objet.\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    35","    ZONE N\nIl s’agit d’une zone à protéger de l’urbanisation en raison de la qualité des espaces naturels\net de son intérêt d’un point de vue esthétique et écologique.\nElle couvre les parties non urbanisées inscrites en site sensible ou à conserver en l’état\nnaturel en étant source de biotope.\nSECTION I – NATURE DE L’OCCUPATION ET DE L’UTILISATION DU SOL\nArticle N 1 : occupation et utilisation du sol interdites\n1.1 – Toutes les occupations et utilisations du sol qui ne figurent pas à l’article N 2.\nArticle N 2 : occupation et utilisation du sol admises sous conditions\n2.1 – Ne sont admis que les travaux d’aménagement de l’espace qui pourraient comprendre la\nréalisation d’équipements nécessaires à l’exploitation du site et de ceux indispensables à la poursuite\ndes activités en cours.\n2.2 – Les travaux effectués sur un bâti spectaculaire remarquable ou portant sur un bâti comportant\ndes éléments remarquables ou sur un ensemble bâti remarquable, identifiés aux documents graphiques\ndu règlement, sont soumis à des conditions spécifiques énoncées à l’article 11 du présent règlement.\nLes travaux mettant en cause des arbres remarquables sont soumis aux exigences de l’article 13 du\nprésent règlement.\nSECTION II – CONDITIONS DE L’OCCUPATION DU SOL\nArticle N 3 : accès\nSans objet.\nArticle N 4 : desserte par les réseaux\nConformément aux règlements d'assainissement en vigueur (POLD ou Département selon l'adresse\ndu point de rejet), quels que soient le terrain concerné, le statut du porteur de projet et l'état\nd'imperméabilisation initiale, les eaux de ruissellement générées par toute nouvelle construction, tout\nnouvel aménagement où toute extension doivent être gérées sur l'emprise du projet, a minima jusqu'à\nla pluie de retour 10 ans, sans raccordement direct ou indirect au réseau public d'assainissement sauf\nen cas d’impossibilité dûment justifiée. Le mode de gestion à la source des eaux pluviales doit être\nétudié dès la conception, comme une composante à part entière du projet.\nPour les pluies exceptionnelles (au-delà de la décennale), il convient d'anticiper les écoulements des\neaux pluviales ainsi que leurs conséquences sur les biens et les personnes.\nRappel : Le service assainissement n'est pas tenu de collecter les eaux pluviales. Leur rejet au réseau\npublic est soumis à dérogation.\nArticle N 5 : caractéristiques des terrains\nSans objet.\nArticle N 6 : implantation des constructions par rapport aux voies publiques ou privées\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    36","6.1 – Les constructions, à l’exception des clôtures et des annexes, doivent être implantées en retrait\nde 5 m minimum de l’alignement, actuel ou futur, des voies publiques ou privées. Une implantation\nmoindre est autorisée dans les cas suivants :\n    -   pour se raccorder à une construction voisine,\n    -   pour préserver des plantations existantes,\n    -   pour valoriser un élément ancien ou caractéristique du paysage,\n    -   pour respecter une autre marge de reculement définie au plan de zonage.\n6.2 – Les constructions enterrées sont autorisées dans la marge de retrait.\nLes saillies dans la marge de retrait sont admises pour les constructions non closes tels que balcons,\navuent, débords de toiture, escaliers, perrons, murs de soutènement, jardinières, …\n6.3 – L’extension et la surélévation d’une construction existante ne respectant pas le reculement défini\nprécédemment, sont autorisées à condition de ne pas aggraver la non-conformité à la règle.\nArticle N 7 : implantation des constructions par rapport aux autres limites séparatives de\nterrain\n7.1 – Sont autorisées les façades en limites de propriété lorsqu’elles ne comportent pas de baies autres\nque des jours de souffrance. Quant aux façades comportant des baies, elles doivent être en retrait de\n3 m au minimum des limites de propriété.\nArticle N 8 : implantation des constructions les unes par rapport aux autres sur une\nmême propriété\nSans objet.\nArticle N 9 : emprise au sol\nL’emprise des construction ne pourra excéder 5 % de la surface du terrain sauf pour les services publics\nou d’intérêt collectif.\nArticle N 10 : hauteur maximum\nLe plafond de la zone est fixé à 11 m. Les cabines d’ascenseurs et les locaux divers doivent s’intégrer\ndans le plafond de la zone.\nArticle N 11 : aspect extérieur - clôtures\nAspect extérieur\n11.1 – Les surfaces visibles de l’extérieur, destinées à recevoir un parement ou un enduit, ne peuvent\nêtre laissées brutes de fabrication.\nClôtures\n11.2 – D’une façon générale, la hauteur des clôtures ne peut être supérieure à 2 m à l’exception des\npiliers des portails d’entrée limités à 2,20 m de hauteur. Elles doivent être doublées d’une haie végétale.\nLes parements seront réalisés en pied des clôtures pour faciliter le passage de la faune sauvage.\n11.3 – Le long des voies, elles ne peuvent comporter de parties pleines à une hauteur supérieure à\n0,80 m à partir du trottoir. En bordure des voies départementales, les clôtures pleines sont autorisées\nsauf en cas de servitudes de visibilité. Lorsque de part et d’autre de la clôture à créer existent des\nmurs-bahuts présentant un certain caractère, celle-ci pourra être traitée de façon identique.\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    37","Lorsque la dénivellation entre le terrain et le trottoir ou la propriété voisine nécessite un mur de\nsoutènement, ce mur n’est alors pas pris en compte dans le calcul de la hauteur de la clôture.\nBâti protégé\n11.4 – Les travaux réalisés sur une construction ou sur une partie d’ouvrage protégé au titre de l’article\nL.151-19 du code de l’urbanisme et identifié par les documents graphiques du présent règlement\ndoivent respecter les dispositions ci-dessous :\n11.4.1 – Au titre du bâti spectaculaire remarquable,\n    -   Respecter et mettre en valeur les caractéristiques structurelles de la construction en\n    permettant des travaux qui amélioreront les conditions d’accessibilité, d’habitabilité ou de\n    sécurité,\n    -   Respecter et mettre en valeur les caractéristiques architecturales de la construction en\n    obligeant de conserver l’aspect d’origine de manière à ne pas altérer son aspect extérieur,\n    -   Interdire la démolition du bâti principal sauf pour des cas exceptionnels liés à des impératifs\n    de sécurité,\n    -   Préserver les espaces libres situés aux abords immédiats de la construction par un traitement\n    de qualité approprié à ses qualités architecturales.\n11.4.2 – Au titre des éléments bâtis remarquables,\n    -   Les travaux entrepris sur des éléments particuliers qui sont protégés par le règlement au titre\n    des prescriptions architecturales du chapitre 4.3 doivent être conservés, restaurés, mis en\n    valeur pour être intégrés, au mieux, au nouvel ensemble bâti (façades, ornements, peintures,\n    clôtures, ferronnerie, porches, briques, décors, lucarnes, boiseries, ...).\n11.4.3 – Au titre des ensembles bâtis remarquables,\n    -   Les travaux réalisés sur les parcelles répertoriées comme « Ensemble bâti remarquable » sont\n    exclus des contraintes susvisées mais sont soumis à l’application renforcée de l’article 11.1 du\n    PLU pour parvenir à une bonne insertion urbaine en préservant le paysage de la voie.\n11.5 – Conformément à l'article L114-1 du code de la sécurité routière, les propriétés riveraines ou\nvoisines des voies publiques, situées à proximité de croisements, virages ou points dangereux ou\nincommodes pour la circulation publique peuvent être frappées de servitudes destinées à assurer une\nmeilleure visibilité.\nArticle N 12 : stationnement\nSans objet.\nArticle N 13 : espaces libres et plantations\n13.1 – Les projets de construction devront être étudiés dans le sens de conservation maximum des\nplantations existantes en veillant à respecter au pourtour des arbres existants de qualité, un périmètre\nde protection « non aedificandi » défini selon un cercle de rayon supérieur à 30 % du rayon du cercle\nformé par la ramure.\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    38","13.2 – Des exigences particulières seront réclamées pour préserver les arbres remarquables et de\nqualité en réclamant des règles de retrait lors d’implantation de construction ou dans la réalisation\nd’aménagements qui viendraient modifier la consistance des sols.\n13.3 – Un soin particulier devra être pris pour garantir l’hydrologie des sols afin de maintenir\nl’irrigation des espèces végétales selon l’orientation des pentes et des éventuels obstacles résultant du\nprojet.\nSECTION III – POSSIBILITÉS MAXIMALES D’OCCUPATION DU SOL\nArticle N 14 : sans objet\nSECTION IV – DISPOSITIONS PARTICULIÈRES\nArticle N 15 : performances énergétiques et environnementales\n15.1 – Les dispositifs, nécessaires à l’utilisation des énergies renouvelables et/ou l’amélioration des\nperformances énergétiques (tels que capteurs solaires, isolations par l’extérieur, …) à condition de ne\npas excéder 20 cm d’épaisseur par rapport au nu de la façade, sont exclus des règles de retrait et de\ndistance définis aux articles 6, 7 et 8 du PLU.\n15.2 – Le recours à des matériaux, y compris ceux normalement prohibés à l’article 11, et à des mises\nen œuvre innovantes en matière d’aspect et de techniques de construction liées à une démarche\nrelevant de la Haute Qualité Environnementale est admis sous réserve d’une bonne insertion dans\nl’environnement.\nArticle N 16 : infrastructures et réseaux de communications électroniques\nSans objet.\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    39","    3ème PARTIE – EMPLACEMENT RESERVE\nLes emplacements réservés pour l’amélioration de la voirie à retenir au PLU sont les suivants et figurent\nsur le plan de zonage.\n    Emprise (m)    Empris\n   Réf.    Emplacemen    Bénéficiair    eà\n    Actuell Projet    Observations\n   plan    t    e    réalise\n    e    ée\n    r\n    Élargissement du trottoir de 2,5\n    Grande Rue    m dans le prolongement des\n    5    Commune    7,5 m    10 m    36 m²\n    N° 221    façades mitoyennes. Le trottoir\n    est actuellement très étroit.\n    Rue de    Élargissement du trottoir à 2 m\n    6    l’Abreuvoir    Commune    10 m    11 m    74 m²    du côté pair. Actuellement le\n    Du n° 2 au 16    trottoir est de 1 m environ.\n    Élargissement du trottoir du côté\n    pair et impair à 2,5 m de chaque\n    Grande Rue\n    côté contre 1 m actuellement\n    8    Entre le 235 et    Commune    7,5 m    10 m    168 m²\n    alors que le secteur est\n    249\n    fortement fréquenté par les\n    piétons.\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    40","MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME   41","MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME   42","MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME   43","    4ème PARTIE – ANNEXES\n4.1 – Définitions de certains termes utilisés dans le présent règlement\nLes définitions ci-après s’imposent dans l’ensemble des zones U et N décrites dans le présent règlement.\nAbri de jardin : Construction légère facilement démontable d’une hauteur maximum de 2,5 m et d’une emprise\nau sol limitée à 20 m², destinée à accompagner des activités de jardinage ou de maraichage.\nAccès : Point de passage aménagé en limite de terrain pour accéder à celui-ci depuis une voie ouverte à la\ncirculation, que celle-ci soit publique ou privée. L’accès doit permettre notamment aux véhicules de pénétrer sur\nle terrain et d’en sortir en toute sécurité.\nAcrotère : Désigne la partie supérieure d’une façade, masquant un toit plat (ou à faible pente) ou une terrasse.\nL’acrotère est situé au-dessus du niveau de la toiture ou de la terrasse et il en constitue un rebord ou un garde-\ncorps plein ou à claire-voie.\nAffouillement – exhaussement : L’affouillement est un creusement volontaire du sol naturel, au contraire de\nl’exhaussement qui est une élévation volontaire du sol.\nAlignement : Désigne la limite entre une parcelle privée et une voie ouverte à la circulation ou une emprise\npublique (hors sente, espace vert ou équipement public). Il peut correspondre à l’alignement existant ou projeté.\nAnnexes : Sont considérées comme des annexes, les constructions de faibles dimensions ayant un caractère\naccessoire/secondaire/complémentaire aux fonctionnalités de la construction principale (telles que remises,\ngarages non professionnels, remise à bois, locaux vélos, celliers…).\nArbre de haute tige : Arbre mesurant au minimum 7 mètres à l’âge adulte.\nAttique : Dernier étage en retrait par rapport à la façade inférieure du bâtiment.\nBaies : Ouvertures pratiquées dans une façade qui permettent à une personne de voir à l’extérieur. Les fenêtres\net les portes vitrées, par exemple, sont des baies.\nBaies principales : Baies donnant sur les pièces principales constituées par les séjours, salles à manger,\nchambres et bureaux, ainsi que sur les locaux à destination autre que l’habitation, à l’exception des réserves et\nentrepôts.\nBaies secondaires : Baies donnant sur les cuisines fermées, salles de bains, toilettes, dégagements, halls, et\nautres pièces secondaires (dressings, buanderies, caves, garages…).\nLes baies dont la partie basse du clair de vue est située à 1,90 m au minimum au-dessus du plancher sont\négalement considérées comme des baies secondaires pour l’application des règles du présent PLU même si elles\néclairent une pièce principale.\nCalcul du retrait des façades : La distance « D », nécessaire au calcul des retraits de la construction par\nrapport aux limites séparatives de propriété, est la distance mesurée perpendiculairement et horizontalement à\npartir du nu extérieur, de l’élément de façade considéré. Les lucarnes, chiens assis, fenêtre de toit sont des\néléments de la couverture qui sont exclus des règles de retrait relatifs aux façades des constructions.\nEgout du toit : Limite basse d’un pan de toiture, vers laquelle ruissellent les eaux de pluie pour s’égoutter dans\nune gouttière ou un chéneau.\nEmprise au sol : Projection verticale au sol du volume d’une construction, exception faite, pour l’application\ndu présent règlement : des ornements tels que les éléments de modénature et les marquises, ainsi que des\ndébords de toiture lorsqu’ils ne sont pas soutenus par des poteaux ou des encorbellements, en saillie d’une\nprofondeur maximale de 1 m.\nSont inclus dans le calcul de l’emprise au sol toutes les constructions ou parties de construction, telles que les\npiscines, les terrasses de plus de 60 cm de haut.\nEspace vert : Désigne un espace libre de toute construction planté ou engazonné à usage paysager, de jardin\nou de loisir,. Il peut être de pleine terre, végétalisé et faire l’objet de cheminements perméables laissant la libre\ninfiltration des eaux pluviales\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    44","Espace de pleine terre : sols non artificialisés de l’unité foncière à compter de sa surface jusqu’au tréfonds à\nl’exclusion du passage des réseaux, permettant la libre et entière infiltration des eaux pluviales\nEspace végétalisé : espace vert en superficie et non couvert qui peut être situé au-dessus d’un ouvrage enterré\n(parking, réseau important) ou en terrasse surélevée avec une épaisseur du sol supérieur à 20cm. Il s’agit d’une\nsurface perméable.\nFaçades : Ce sont les faces verticales en élévation d’une construction. Les façades latérales sont le plus souvent\nappelées pignons si elles épousent la forme triangulaire du comble. La couverture ne fait pas partie de la façade.\nFaîtage : Partie supérieure de la ligne de jonction de deux pans d’une toiture inclinée ou point le plus haut d’une\ntoiture à un pan.\nJours de souffrance : Il s’agit d’ouvertures établies nécessairement à verre dormant, c’est-à-dire fixe et\ntranslucide – sans donner passage à l’air et interdisant de manière continue de regarder chez autrui en excluant\ntout système d’ouverture.\nLimite de fonds : Il s’agit de limites de propriété ne joignant pas l’alignement de la voie.\nLimite séparative : Il s’agit de limite de propriété joignant l’alignement de la voie.\nHauteur des constructions : Les constructions ne peuvent dépasser les hauteurs ou plafonds de zones\nindiqués à l’article 10. Dans le cas d’une hauteur, elle est calculée verticalement en tout point du terrain naturel\navant travaux.\nTerrain naturel avant travaux : Niveau du sol existant avant le projet de construction et avant les travaux\nd’affouillement, d’exhaussement ou de terrassement prévus. Le sol à prendre en considération pour la hauteur\nest celui qui existe dans son état antérieur aux travaux sollicités.\nTerrain ou unité foncière : Îlot de propriété composé de parcelles contiguës les unes aux autres et\nappartenant à un même propriétaire ou indivision.\nVoie : Espace ouvert à la circulation automobile, public ou privé, desservant plus d’une propriété. Ne constitue\npas une voie, mais un accès, une servitude de passage qui ne remplirait pas les conditions ci-avant.\n4.2 – Délimitations de quartiers décrits au règlement\nLe règlement fait référence à différents quartiers dans la commune qu’il convient, par conséquent, d’identifier.\n    -    Le quartier centre,\n    -    Le quartier de la gare, ainsi que l’emprise ferroviaire,\n    -    Le quartier de la Poste et de l’Abreuvoir,\n    -    Le quartier du Petit-Garches,\n    -    Le quartier de l’Hôpital,\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    45","MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME   46","MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME   47","MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME   48","MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME   49","MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME   50","4.3 – Prescriptions architecturales sur les couleurs et les éléments bâtis remarquables.\n4.3.1 – Identification du bâti remarquable « spectaculaire »\nLe bâti remarquable « spectaculaire » fait l’objet d’un repérage sur le plan de zonage du PLU en identifiant les 20\nadresses ci-dessous :\n    1.   Villa Michel – 32, avenue Brézin\n    2.   Fondation Davaine– 29, avenue de Brétigny (château et maison à décor en céramique)\n    3.   Villa l’Excentrique – 10, avenue de Brétigny\n    4.   Castel – 7, avenue de Brétigny\n    5.   Le Manoir – 4, avenue de Brétigny\n    6.   Pavillon La Dauphine – 80, boulevard Raymond Poincaré\n    7.   Villa la Quinta – 25, rue de Marnes\n    8.   Château Jean Cotxet – 8, avenue Foch\n    9.   Pavillon de villégiature – 4, avenue de Lorraine\n    10. Villa Régina – 7, rue de Toulon\n    11. Clinique du Château – 2, Grande Rue (château et chapelle)\n    12. Hôtel de ville – 2, rue Claude Liard\n    13. Maison meulière – 7, rue Claude Liard\n    14. Eglise Saint Louis – 2, rue de l’Eglise / Place Saint Louis\n    15. Maison versaillaise – 25 avenue des Coteaux / 11bis rue Athime Rué\n    16. Ecole élémentaire Pasteur B – 13, rue de Suresnes\n    17. Villa Canivet – 18 rue Alphonse de Neuville\n    18. Portail d’entrée et grille – 16 rue Alphonse de Neuville\n    19. Domaine des Quatre Vents – 60bis, rue du 19 Janvier\n    20. Villa façade Art Déco – 47, avenue des Jockeys\nUne fiche d’identification justifiant la nature du classement remarquable « spectaculaire» figure dans le rapport\nde présentation du PLU.\n4.3.2 – Identification des éléments bâtis remarquables\nCes parties d’ouvrage correspondent à des décors particuliers qui traduisent un style local à conserver et à\nvaloriser (matériaux de façade, décors, ornements, peintures, clôtures, ferronnerie, porches, lucarnes,\nboiseries…). Il s’agit notamment des éléments architecturaux suivants :\n    - La brique et/ou la meulière ;\n    - La céramique et/ou la faïence ;\n    - La ferronnerie d’art (garde-corps, marquise, grille, portail…) ;\n    - La toiture travaillée et décorée ;\n4.3.3 – Identification des ensembles bâtis remarquables\nIls sont actuellement au nombre de 3 sites, à savoir :\n    - Côté impair de la rue Frédéric Clément, situé entre l’avenue d’Alsace et la Grande Rue,\n    - La Grande Rue, côté Petit-Garches, entre la rue Guynemer et la rue de la Rangée,\n    - 161 et 163 Grande Rue (maisons villageoises) et 13-15 et 17 avenue Maréchal Leclerc (maisons meulière)\n    : tête d’îlot\nCes secteurs urbains figurent dans le rapport de présentation du PLU.\n MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME    51","MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME   52","MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME   53","MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME   54","MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME   55","MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME   56","MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME   57","MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME   58","MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANISME   59","MODIFICATION N° 3 DU PLAN LOCAL D’URBANISME DE GARCHES – REGLEMENT D’URBANIS function pdfLink(p){

    const part=DATA.pdf.parts.find(r=>p>=r[0]&&p<=r[1]);

}

  const t=DATA.themes.map(([k,l])=>`<span class="chip ${fth.includes(k)?'on':''}" data-th="${k}">${esc(l)}</span>`).join('');
  $('#filters').innerHTML=(DATA.zones.length?`<div style="width:100%;font-size:11px;color:var(--muted)">MI ZONA (opcional)</div><span class="chip ${zone===''?'on':''}" data-z="">Todas</span>${zs}`:'')+
   `<details style="width:100%;margin-top:4px"><summary style="font-size:11px;color:var(--muted);cursor:pointer">FILTRAR POR TEMA ${fth.length?'('+fth.length+')':''}</summary><div class="th-l" style="margin-top:6px">${t}</div></details>`;
  $('#filters').querySelectorAll('[data-z]').forEach(e=>e.onclick=()=>{zone=e.dataset.z; store.set('zone',zone); renderFilters(); renderTree(); route()});
  $('#filters').querySelectorAll('[data-th]').forEach(e=>e.onclick=()=>{const k=e.dataset.th; fth=fth.includes(k)?fth.filter(x=>x!==k):[...fth,k]; store.set('fth',fth); renderFilters(); renderTree(); const d=$('#filters details'); if(d) d.open=true});
}
let cur=-1;
function renderTree(){
  const filt=fth.length||zone;
  const out=[];
  S.forEach(s=>{
    if(filt){ if(!visible(s)) return; }
    else { let p=par[s.i], hide=false; while(p!==null){ if(collapsed[p]){hide=true;break} p=par[p]} if(hide) return; }
    const k=kids[s.i].length;
    const tg=k&&!filt?`<span class="tg" data-tg="${s.i}">${collapsed[s.i]?'▸':'▾'}</span>`:'<span class="tg"></span>';
    out.push(`<div class="n l${Math.min(s.l,3)} ${s.i===cur?'cur':''}" data-i="${s.i}" style="padding-left:${12+s.l*14}px">${tg}<span class="t">${esc(s.t)}</span><span class="pg">${s.p}</span></div>`);
  });
  $('#tree').innerHTML=out.join('')||'<div class="empty" style="padding:12px">Nada con estos filtros.</div>';
  $('#tree').querySelectorAll('.n').forEach(e=>e.onclick=ev=>{
    if(ev.target.dataset.tg!==undefined){const i=+ev.target.dataset.tg; if(collapsed[i]) delete collapsed[i]; else collapsed[i]=1; store.set('col',collapsed); renderTree(); return}
    location.hash='#s/'+e.dataset.i; $('#side').classList.remove('open');
  });
}
// ---------- views
function crumb(s){const a=[];let p=par[s.i];while(p!==null){a.unshift(`<a href="#s/${p}">${esc(S[p].t)}</a>`);p=par[p]}return a.join(' › ')}
function chips(s){return s.th.map(t=>`<a class="chip" href="#temas/${t}">${esc(TH[t])}</a>`).join(' ')}
function pagesHtml(a,b,hl){
  const out=[];const max=Math.min(b,a+11);
  for(let p=a;p<=max;p++){
    let t=esc(DATA.pages[p-1]||'');
    if(hl&&p===a){const h=esc(hl).slice(0,40); const i=t.indexOf(h.slice(0,25)); if(i>=0){const e=t.indexOf('\n',i); t=t.slice(0,i)+'<span class="hh">'+t.slice(i,e<0?undefined:e)+'</span>'+(e<0?'':t.slice(e))}}
    out.push(`<div class="pg"><div class="ph"><span>Página ${p} del PDF</span><a target="_blank" rel="noopener" href="${pdfLink(p)}">abrir en el PDF ↗</a></div><pre>${t}</pre></div>`);
  }
  if(b>max) out.push(`<div class="box">Esta sección sigue hasta la página ${b}. <button data-more="${max+1},${b}">Mostrar 12 páginas más</button></div>`);
  return out.join('');
}
function bindMore(hl){document.querySelectorAll('[data-more]').forEach(btn=>btn.onclick=()=>{const [a,b]=btn.dataset.more.split(',').map(Number); const div=document.createElement('div'); div.innerHTML=pagesHtml(a,b); btn.parentNode.replaceWith(div); bindMore()})}
function viewSec(i){
  const s=S[i]; if(!s){viewHome();return}
  cur=i; renderTree(); const n=$('#tree .cur'); if(n) n.scrollIntoView({block:'nearest'});
  const k=kids[i];
  const end=Math.max(s.p,(k.length?S[k[0]].p:s.n));
  const fav=favs[i]?'on':'';
  $('#main').innerHTML=`<div class="crumb">${crumb(s)}</div>
  <h1 class="st">${esc(s.t)} <button class="star ${fav}" id="fav" title="Favorito">★</button></h1>
  <div class="meta">${s.z?`<span class="chip">Zona ${esc(s.z)}</span>`:''} ${chips(s)} <span>págs. ${s.p}–${Math.max(s.q,s.p)}${s.a?' (posición aproximada)':''}</span></div>
  <div class="btns no-print" style="margin-bottom:14px">${pdfBtn(s.p)} ${i>0?`<a class="b" href="#s/${i-1}">← Anterior</a>`:''} ${i<S.length-1?`<a class="b" href="#s/${i+1}">Siguiente →</a>`:''}</div>
  ${k.length?`<div class="box sub-list"><h3>Contenido de esta sección</h3>${k.map(j=>`<a href="#s/${j}">${esc(S[j].t)} <span class="pg" style="color:var(--muted);font-size:12px">p. ${S[j].p}</span></a>`).join('')}</div>`:''}
  <div class="box notes no-print"><h3>Mis notas</h3><textarea id="note" placeholder="Notas sobre esta sección (se guardan en este navegador)">${esc(notes[i]||'')}</textarea></div>
  <h3 style="font-size:14px;color:var(--muted);margin:18px 0 8px">TEXTO OFICIAL (extraído del PDF; tablas y figuras: ver el PDF)</h3>
  ${pagesHtml(s.p,end,s.t)}`;
  bindMore();
  $('#fav').onclick=()=>{if(favs[i]) delete favs[i]; else favs[i]=1; store.set('favs',favs); $('#fav').classList.toggle('on')};
  $('#note').oninput=e=>{notes[i]=e.target.value; if(!notes[i]) delete notes[i]; store.set('notes',notes)};
  window.scrollTo(0,0);
}
function secsFor(th){
  return S.filter(s=>s.th.includes(th));
}
function viewProy(id){
  const P=PROY.find(p=>p.id===id);
  const tabs=`<div class="pj-tabs">${PROY.map(p=>`<a href="#proy/${p.id}" class="${p.id===id?'on':''}"><b>${esc(p.nom)}</b><span>${esc(p.sub)}</span></a>`).join('')}</div>`;
  if(!P){$('#main').innerHTML=`<h1 class="st">¿Qué proyecto tienes?</h1><p>Elige el tipo de obra. Te digo qué artículos de este ${DATA.k.startsWith('pold')?'PLU':'PLUi'} consultar, por orden, y puedes marcarlos a medida que los revisas.</p>${tabs}`;return}
  const ck=checks[id]||{};
  let total=0,done=0;
  const zsel=DATA.zones.length?`<div class="zsel"><span style="font-size:13px;color:var(--muted)">Tu zona:</span><span class="chip ${zone===''?'on':''}" data-z="">sin elegir</span>${DATA.zones.map(z=>`<span class="chip ${zone===z?'on':''}" data-z="${esc(z)}">${esc(z)}</span>`).join('')}</div>`:'';
  const groups=P.grupos.map(([th,txt])=>{
    let list=secsFor(th).filter(s=>!s.z||!zone||s.z===zone);
    // prefer most specific: drop parents whose children also listed
    const ids=new Set(list.map(s=>s.i));
    list=list.filter(s=>!kids[s.i].some(j=>ids.has(j)));
    const common=list.filter(s=>!s.z), zl=list.filter(s=>s.z);
    const item=s=>{total++; const ok=ck[s.i]; if(ok) done++; return `<div class="pj-a ${ok?'ok':''}"><input type="checkbox" data-ck="${s.i}" ${ok?'checked':''}><a href="#s/${s.i}">${esc(s.t)}${s.z?`<span class="zn">${esc(s.z)}</span>`:''}<span class="tt">p. ${s.p} · ${esc(crumb(s).replace(/<[^>]+>/g,''))}</span></a></div>`};
    let body='';
    if(common.length) body+=`<div style="font-size:12px;color:var(--muted);margin-top:6px">Comunes a todas las zonas</div>`+common.slice(0,12).map(item).join('')+(common.length>12?`<div class="empty">… y ${common.length-12} más en <a href="#temas/${th}">Por tema</a></div>`:'');
    if(zl.length) body+=`<div style="font-size:12px;color:var(--muted);margin-top:6px">${zone?'Zona '+esc(zone):'Por zona (elige tu zona arriba para filtrar)'}</div>`+zl.slice(0,zone?30:10).map(item).join('')+(!zone&&zl.length>10?`<div class="empty">… y ${zl.length-10} más: elige tu zona.</div>`:'');
    if(!body) body=`<div class="empty">No he encontrado un artículo con este tema en el índice. Usa el buscador (arriba) con palabras clave.</div>`;
    return `<div class="box pj-g"><h3>${esc(TH[th])}</h3><div class="reg">${esc(txt)}</div>${body}</div>`;
  }).join('');
  $('#main').innerHTML=`${tabs}<h1 class="st">${esc(P.nom)}</h1>
  <div class="pj-cols"><div class="box"><h3>Trámite</h3><ul>${P.tramite.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="box"><h3>Antes de leer el reglamento</h3><ul>${P.antes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
  ${zsel}
  <div class="pj-bar"><div class="pj-prog"><i style="width:${total?Math.round(done*100/total):0}%"></i></div><span style="font-size:13px">${done} de ${total} revisados</span><button id="pjReset">Desmarcar todo</button><button onclick="print()">Imprimir</button></div>
  <div class="warn">La lista se genera por tema a partir del índice del reglamento. Confirma siempre en el texto y en el plano de zonificación; algunos artículos tratan varios temas a la vez.</div>
  ${groups}`;
  $('#main').querySelectorAll('[data-z]').forEach(e=>e.onclick=()=>{zone=e.dataset.z; store.set('zone',zone); renderFilters(); renderTree(); viewProy(id)});
  $('#main').querySelectorAll('[data-ck]').forEach(e=>e.onchange=()=>{const c=checks[id]=checks[id]||{}; if(e.checked) c[e.dataset.ck]=1; else delete c[e.dataset.ck]; store.set('checks',checks); viewProy(id)});
  $('#pjReset').onclick=()=>{checks[id]={}; store.set('checks',checks); viewProy(id)};
}
function viewTemas(th){
  const list=DATA.themes.map(([k,l])=>`<a class="chip ${k===th?'on':''}" href="#temas/${k}">${esc(l)} (${secsFor(k).length})</a>`).join(' ');
  let body='';
  if(th){
    const ss=secsFor(th).filter(s=>!zone||!s.z||s.z===zone);
    body=`<h2 style="font-size:18px">${esc(TH[th])}${zone?' · zona '+esc(zone):''}</h2>`+(ss.map(s=>`<div class="r" onclick="location.hash='#s/${s.i}'"><span class="cd">p. ${s.p}</span>${esc(s.t)} ${s.z?`<span class="chip">${esc(s.z)}</span>`:''}<div class="sn">${esc(crumb(s).replace(/<[^>]+>/g,''))}</div></div>`).join('')||'<div class="empty">Ninguna sección del índice. Prueba el buscador.</div>');
  }
  $('#main').innerHTML=`<h1 class="st">Por tema</h1><p>Secciones del reglamento agrupadas por tema (según su título).${DATA.zones.length?' Si eliges tu zona en el panel izquierdo, se ocultan las de otras zonas.':''}</p><div class="th-l" style="margin-bottom:14px">${list}</div><div class="results">${body}</div>`;
}
function secOfPage(p){let best=null;S.forEach(s=>{if(s.p<=p&&(!best||s.p>=best.p))best=s});return best}
function viewSearch(q){
  const nq=norm(q).trim(); if(nq.length<2){viewHome();return}
  const terms=nq.split(/\s+/);
  const res=[];
  const tit=S.filter(s=>terms.every(t=>norm(s.t).includes(t)));
  for(let i=0;i<DATA.pages.length&&res.length<300;i++){
    const np=NP[i]; if(terms.every(t=>np.includes(t))){
      const j=np.indexOf(terms[0]); const raw=DATA.pages[i]; const a=Math.max(0,j-90);
      res.push({p:i+1,sn:raw.slice(a,a+260).replace(/\s+/g,' ')});
    }
  }
  const hl=t=>{let h=esc(t);terms.forEach(x=>{if(x.length<2)return;const re=new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');h=h.replace(re,m=>`<mark>${m}</mark>`)});return h};
  $('#main').innerHTML=`<h1 class="st">Resultados para «${esc(q)}»</h1>
  ${tit.length?`<div class="box"><h3>En títulos de secciones (${tit.length})</h3>${tit.slice(0,40).map(s=>`<div class="r" onclick="location.hash='#s/${s.i}'"><span class="cd">p. ${s.p}</span>${esc(s.t)}</div>`).join('')}</div>`:''}
  <div class="results"><h3 style="font-size:14px;color:var(--muted)">EN EL TEXTO: ${res.length}${res.length>=300?'+':''} páginas</h3>${res.map(r=>{const s=secOfPage(r.p);return `<div class="r" data-p="${r.p}" data-s="${s?s.i:''}"><span class="cd">p. ${r.p}</span>${s?esc(s.t):''}<div class="sn">… ${hl(r.sn)} …</div></div>`}).join('')}</div>`;
  $('#main').querySelectorAll('.results .r[data-p]').forEach(e=>e.onclick=()=>{location.hash='#p/'+e.dataset.p});
}
function viewPage(p){
  p=Math.max(1,Math.min(DATA.npages,p)); const s=secOfPage(p);
  $('#main').innerHTML=`<div class="crumb">${s?crumb(s)+(crumb(s)?' › ':'')+`<a href="#s/${s.i}">${esc(s.t)}</a>`:''}</div><h1 class="st">Página ${p}</h1>
  <div class="btns no-print" style="margin-bottom:14px">${pdfBtn(p)} ${p>1?`<a class="b" href="#p/${p-1}">← p. ${p-1}</a>`:''} ${p<DATA.npages?`<a class="b" href="#p/${p+1}">p. ${p+1} →</a>`:''}</div>${pagesHtml(p,p)}`;
  const q=$('#q').value; if(q){const terms=norm(q).split(/\s+/).filter(x=>x.length>1); const pre=$('#main pre'); let h=pre.innerHTML; terms.forEach(x=>{const re=new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'); h=h.replace(re,m=>`<mark>${m}</mark>`)}); pre.innerHTML=h}
  window.scrollTo(0,0);
}
function viewNotas(){
  const f=Object.keys(favs).map(Number).filter(i=>S[i]); const n=Object.keys(notes).map(Number).filter(i=>S[i]);
  $('#main').innerHTML=`<h1 class="st">Mis notas y favoritos</h1><p class="empty">Se guardan solo en este navegador.</p>
  <div class="box"><h3>Favoritos (${f.length})</h3>${f.map(i=>`<div class="r" onclick="location.hash='#s/${i}'"><span class="cd">p. ${S[i].p}</span>${esc(S[i].t)}</div>`).join('')||'<div class="empty">Marca secciones con ★.</div>'}</div>
  <div class="box"><h3>Notas (${n.length})</h3>${n.map(i=>`<div class="r" onclick="location.hash='#s/${i}'"><span class="cd">p. ${S[i].p}</span>${esc(S[i].t)}<div class="sn">${esc(notes[i])}</div></div>`).join('')||'<div class="empty">Escribe notas en cualquier sección.</div>'}</div>`;
}
function viewHome(){
  const top=S.filter(s=>s.l===0);
  $('#main').innerHTML=`<h1 class="st">${esc(DATA.nom)}</h1>
  <div class="box"><div class="kv"><b>Documento</b><span>Reglamento escrito del ${DATA.k.startsWith('pold')?'PLU':'PLUi'} (${DATA.npages} páginas)</span><b>Estado</b><span>${esc(DATA.estado)}</span><b>Municipios</b><span>${esc(DATA.communes)}</span><b>Fuente</b><span><a href="${DATA.pdf.url}" target="_blank" rel="noopener">Géoportail de l'urbanisme (PDF oficial)</a></span></div></div>
  <div class="box"><h3>Cómo usarlo</h3><ul style="margin:0;padding-left:18px">
   <li><b>Por proyecto</b>: elige el tipo de obra y tu zona; te lista los artículos a revisar, por orden, con casillas.</li>
   <li><b>Explorar</b>: índice completo a la izquierda; cada sección muestra el texto oficial y el botón para abrir el PDF en esa página.</li>
   <li><b>Buscador</b>: busca en las ${DATA.npages} páginas (palabras en francés: <i>hauteur, clôture, pleine terre…</i>).</li>
   <li><b>Tu zona</b>: mírala en el <a href="https://www.geoportail-urbanisme.gouv.fr/map/" target="_blank" rel="noopener">mapa del Géoportail de l'urbanisme</a> (clic en la parcela) o en los planos de zonificación de la carpeta <i>Reglement</i>.</li></ul></div>
  <div class="pj-tabs">${PROY.map(p=>`<a href="#proy/${p.id}"><b>${esc(p.nom)}</b><span>${esc(p.sub)}</span></a>`).join('')}</div>
  <div class="box sub-list"><h3>Partes del reglamento</h3>${top.map(s=>`<a href="#s/${s.i}">${esc(s.t)} <span style="color:var(--muted);font-size:12px">p. ${s.p}</span></a>`).join('')}</div>
  <div class="box no-print"><h3>Abrir el PDF</h3><p style="font-size:13.5px;margin:0 0 8px">Los botones «Abrir en el PDF» usan: <b>${pdfMode==='local'?'tu copia en el PC (carpeta Reglement junto a este archivo)':'el PDF oficial en internet'}</b>.</p><button id="pdfToggle">Usar ${pdfMode==='local'?'el PDF en internet':'mi copia local'}</button></div>
  ${HOME_URL?`<p><a href="${HOME_URL}">← Volver al mapa de territorios</a></p>`:''}`;
  $('#pdfToggle').onclick=()=>{pdfMode=pdfMode==='local'?'online':'local'; store.set('pdfmode',pdfMode); viewHome(); toast('PDF: '+(pdfMode==='local'?'copia local':'internet'))};
}
const NP=DATA.pages.map(norm);
let qt;
$('#q').addEventListener('input',e=>{clearTimeout(qt); qt=setTimeout(()=>{const v=e.target.value.trim(); if(v.length>=2) location.hash='#q/'+encodeURIComponent(v); else if(!v) location.hash='#home'},350)});
function route(){
  const h=decodeURIComponent(location.hash.slice(1)||'home');
  const [v,a]=[h.split('/')[0],h.split('/').slice(1).join('/')];
  document.querySelectorAll('#tabs a').forEach(x=>x.classList.toggle('on',x.dataset.t===(v==='q'||v==='p'?'':v)));
  if(v==='s') viewSec(+a||0);
  else if(v==='proy') viewProy(a);
  else if(v==='temas') viewTemas(a);
  else if(v==='q'){ if($('#q').value!==a) $('#q').value=a; viewSearch(a)}
  else if(v==='p') viewPage(+a);
  else if(v==='notas') viewNotas();
  else viewHome();
}
window.addEventListener('hashchange',route);
renderFilters(); renderTree(); route();
</script>
</body>
</html>
