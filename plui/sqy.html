<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorador Saint-Quentin-en-Yvelines (SQY)</title>
<style>

:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1d1f22; --muted:#666b73; --line:#e3e1db; --accent:#1f5f8b; --accent-ink:#ffffff;
  --hl:#fff1a8; --chip:#eef1f4; --sum:#eef6ee; --sum-line:#b9d9bb; --code:#1f5f8b; --warn:#fff6e5;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15171a; --panel:#1d2024; --ink:#e7e7e4; --muted:#9aa0a8; --line:#30343a; --accent:#6fb3e0; --accent-ink:#0d1114;
  --hl:#5b4f12; --chip:#262a30; --sum:#1c2a1e; --sum-line:#35573a; --code:#8cc6ee; --warn:#2c2516;
}}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1d2024; --ink:#e7e7e4; --muted:#9aa0a8; --line:#30343a; --accent:#6fb3e0; --accent-ink:#0d1114;
  --hl:#5b4f12; --chip:#262a30; --sum:#1c2a1e; --sum-line:#35573a; --code:#8cc6ee; --warn:#2c2516;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px}
nav.tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto}
nav.tabs a{padding:8px 12px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
nav.tabs a.on{color:var(--ink);border-color:var(--accent);font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:5px 10px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wrap{display:flex;min-height:calc(100vh - 100px)}
aside{width:330px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow:auto;height:calc(100vh - 100px);position:sticky;top:100px}
main{flex:1;min-width:0;padding:18px 28px 80px;max-width:980px}
.filters{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line);cursor:pointer;user-select:none}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tree{padding:6px 0 30px}
.tree .n{display:flex;gap:6px;align-items:baseline;padding:3px 12px;cursor:pointer;font-size:13.5px;line-height:1.35}
.tree .n:hover{background:var(--chip)}
.tree .n.cur{background:var(--chip);box-shadow:inset 3px 0 0 var(--accent)}
.tree .n .cd{color:var(--code);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
.tree .n .pg{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.tree .l0{font-weight:700;margin-top:8px;text-transform:uppercase;font-size:12px;letter-spacing:.03em}
.tree .l1{font-weight:600}
.tree .l2{padding-left:24px}
.tree .l3{padding-left:40px;color:var(--ink)}
.tree .tg{cursor:pointer;color:var(--muted);width:12px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;transform:translateY(-1px)}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.crumb a{text-decoration:none}
h1.st{font-size:22px;margin:0 0 4px;line-height:1.3}
h1.st .cd{color:var(--code)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 14px;font-size:13px;color:var(--muted)}
.sum{background:var(--sum);border:1px solid var(--sum-line);border-radius:10px;padding:10px 14px;margin:0 0 16px}
.sum b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:2px}
.txt p{margin:0 0 10px}
.txt h4{margin:18px 0 8px;font-size:15px}
.txt ul{margin:0 0 10px;padding-left:22px}
.txt li{margin:0 0 5px}
.txt ul.sub{margin:5px 0 5px;list-style:circle}
.txt li.nb{list-style:none}
pre.tbl{font:12px/1.35 ui-monospace,Consolas,monospace;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre}
.ref{font-style:italic;color:var(--muted)}
a.xr{text-decoration:none;border-bottom:1px dotted var(--accent);white-space:nowrap}
a.fg{font-size:12px;background:var(--chip);border-radius:5px;padding:0 5px;text-decoration:none;font-style:normal}
.df{border-bottom:1px dashed var(--muted);cursor:help}
sup{font-size:9px;color:var(--muted)}
mark{background:var(--hl);color:inherit;border-radius:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.box h3{margin:0 0 8px;font-size:15px}
.sub-list a{display:block;padding:4px 0;text-decoration:none}
.sub-list .cd{color:var(--code);margin-right:6px}
.eq a{margin-right:8px}
.notes textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px;font:inherit}
.results .r{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.results .r:hover{background:var(--chip)}
.results .r .cd{color:var(--code);font-weight:600;margin-right:6px}
.results .r .sn{color:var(--muted);font-size:13.5px;margin-top:3px}
.pop{position:absolute;z-index:50;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px 14px;font-size:13.5px;max-height:320px;overflow:auto}
.pop h5{margin:0 0 6px;font-size:14px}
table.cf{width:100%;border-collapse:collapse;font-size:14px}
table.cf td,table.cf th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.cf th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
table.cf td.v{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ob .reg{font-size:12.5px;color:var(--muted);margin:-4px 0 8px}
.ob a{display:block;text-decoration:none;padding:3px 0}
.ob a .cd{color:var(--code);font-weight:600;margin-right:6px;font-size:13px}
.ob a span.w{color:var(--ink)}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.figs .fc{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.figs .fc img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover;object-position:top;background:#fff}
.figs .fc div{padding:8px 10px;font-size:13px}
.figview img{width:100%;max-width:760px;display:block;margin:0 auto 12px;border:1px solid var(--line);border-radius:6px;background:#fff}
.gl .gi{padding:12px 0;border-bottom:1px solid var(--line)}
.gl .gi h3{margin:0 0 4px;font-size:16px}
.gl .refs{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.az{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.warn{background:var(--warn);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.star{font-size:18px;line-height:1;border:none;background:none;padding:0 4px;color:var(--muted)}
.star.on{color:#e0a400}
.menu{display:none}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
@media (max-width:820px){
  aside{position:fixed;left:0;top:0;height:100vh;z-index:40;transform:translateX(-100%);transition:transform .2s;width:86vw;max-width:360px;box-shadow:0 0 30px rgba(0,0,0,.25)}
  aside.open{transform:none}
  .menu{display:inline-block}
  main{padding:14px 16px 80px}
  .brand small{display:none}
}

.pj-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 18px}
.pj-tabs a{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pj-tabs a b{display:block;font-size:15.5px;margin-bottom:2px}
.pj-tabs a span{font-size:12.5px;color:var(--muted)}
.pj-tabs a.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.pj-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pj-cols ul{margin:0;padding-left:18px}.pj-cols li{margin:3px 0;font-size:14px}
.pj-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.pj-prog{flex:1;min-width:160px;height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.pj-prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.pj-bar button{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.pj-g h3{margin:0 0 6px;font-size:15px}
.pj-a{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.pj-a:first-of-type{border-top:0}
.pj-a input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}
.pj-a a{text-decoration:none;color:var(--ink)}
.pj-a .cd{color:var(--code);font-weight:600;margin-right:6px;font-size:13px}
.pj-a .tt{color:var(--muted);font-size:12.5px;display:block}
.pj-a.ok a{opacity:.55}
@media (max-width:760px){.pj-cols{grid-template-columns:1fr}}
@media print{.pj-tabs,.pj-bar button{display:none!important}.pj-a input{accent-color:#000}}
@media print{header,aside,.notes,.no-print{display:none!important} main{max-width:none;padding:0}}

.pg{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:0 0 14px;overflow:hidden}
.pg .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;background:var(--chip);font-size:12.5px;color:var(--muted)}
.pg pre{margin:0;padding:12px 14px;font:13px/1.5 ui-monospace,"Cascadia Mono",Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.pg pre .hh{background:var(--hl);font-weight:700}
.zsel{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.th-l{display:flex;flex-wrap:wrap;gap:6px}
.th-l .chip{font-size:12.5px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px}
.kv b{color:var(--muted);font-weight:600}
.pj-a .zn{font-size:11px;background:var(--chip);border-radius:5px;padding:0 5px;margin-left:6px;color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;font-style:italic}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btns a.b{display:inline-block;border:1px solid var(--line);border-radius:7px;padding:5px 10px;text-decoration:none;font-size:13.5px;background:var(--panel)}
.btns a.b.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
</style>
</head>

TIONS PARTICULIERES ...................................................................................................................94\nARTICLE N 3 -    CONDITIONS DE DESSERTE DES TERRAINS* PAR LES VOIES* PUBLIQUES OU PRIVEES ET D’ACCES* AUX VOIES* OUVERTES AU PUBLIC.......................................................97\nARTICLE N 4 -    CONDITIONS DE DESSERTES DES TERRAINS* PAR LES RESEAUX PUBLICS .....................................................................................................................................97\nARTICLE N 5 -    SUPERFICIE MINIMALE DES TERRAINS* ..............................................................................................................................................................................98\nARTICLE N 6 -    IMPLANTATION DES CONSTRUCTIONS* PAR RAPPORT AUX VOIES* ET EMPRISES PUBLIQUES* ........................................................................................................98\nARTICLE N 7 -    IMPLANTATION DES CONSTRUCTIONS* PAR RAPPORT AUX LIMITES SEPARATIVES* ......................................................................................................................98\nARTICLE N 8 -    IMPLANTATION DES CONSTRUCTIONS* LES UNES PAR RAPPORT AUX AUTRES SUR UNE MEME PROPRIETE .........................................................................................98\nARTICLE N 9 -    EMPRISE AU SOL ..........................................................................................................................................................................................................99\nARTICLE N 10 -    HAUTEUR* MAXIMALE DES CONSTRUCTIONS* ....................................................................................................................................................................99\nARTICLE N 11 -    ASPECT EXTERIEUR .....................................................................................................................................................................................................101\nARTICLE N 12 –    STATIONNEMENT .......................................................................................................................................................................................................103\nARTICLE N 13 -    ESPACES LIBRES ET PLANTATIONS, ESPACES BOISES CLASSES .................................................................................................................................................103\n    PLUi – Règlement – Modification simplifiée n°3 – Février 2026\n    3/103","TITRE I : DISPOSITIONS GENERALES\n   PLUi – Règlement – Modification simplifiée n°3 – Février 2026\n    4/103"," Dispositions\n  Générales\nARTICLE 1 -    CHAMP D’APPLICATION TERRITORIAL DU PLAN\nLe présent règlement s’applique sur la totalité du territoire de la Communauté d’agglomération de Saint-\nQuentin-en-Yvelines (CASQY) dans son périmètre antérieur au 1er janvier 2016, soit sur les communes\nd’Élancourt, Guyancourt, La Verrière, Magny-les-Hameaux, Montigny-le-Bretonneux, Trappes et Voisins-\nle-Bretonneux.\nARTICLE 2 -    DIVISION DU TERRITOIRE EN ZONES ET CONTENU DES\n    DOCUMENTS GRAPHIQUES\nLes documents graphiques présentent la division du territoire intercommunal en :\n    −    zones urbaines (U) ;\n    −    zones à urbaniser (AU) ;\n    −    zones naturelles (N) ;\n    −    zones agricoles (A).\nLes documents graphiques comportent également des inscriptions graphiques relatives à :\n    −    des emplacements réservés aux voies et ouvrages publics, aux installations d’intérêt\n    général et aux espaces verts,\n    −    des espaces boisés classés à conserver, à protéger ou à créer,\n    −    des alignements d’arbres à préserver ou à créer,\n    −    des arbres remarquables à protéger,\n    −    des espaces paysagers à protéger, à mettre en valeur ou à requalifier,\n    −    des espaces paysagers modulés, cœurs d’îlots et fonds de parcelles protégés,\n    −    des mares à protéger ou à mettre en valeur,\n    −    des zones humides à protéger,\n    −    des bâtiments ou éléments de construction remarquables à protéger ou à mettre en\n    valeur,\n    −    des ensembles urbains remarquables à protéger ou à mettre en valeur,\n    −    des murs remarquables à protéger,\n    −    des œuvres d’art remarquables à protéger ou à mettre en valeur,\n    −    des périmètres de constructibilité limitée,\n    −    des secteurs de mixité sociale dans lesquels, en cas de réalisation d’un programme de\n    logements, un pourcentage de ce programme est affecté à des objectifs de mixité sociale,\n    −    des linéaires et des secteurs de préservation et de développement de la diversité\n    commerciale,\n    −    des dispositions particulières nécessitant une représentation graphique (bandes\n    constructibles, reculs* d’alignement*, secteurs de limitation du stationnement pour les\n    commerces, jardins familiaux à conserver …).\n    PLUi – Règlement – Modification simplifiée n°3 – Février 2026\n    5/103"," Dispositions\n  Générales\nARTICLE 3 -    PORTEE RESPECTIVE DU REGLEMENT A L’EGARD D’AUTRES\n    LEGISLATIONS RELATIVES A L’OCCUPATION DU SOL\nPérimètres visés à l’article R151-52 du Code de l'Urbanisme\nLe territoire intercommunal est concerné par un certain nombre de périmètres visés à l’article R151-52 du\nCode de l'Urbanisme qui sont reportés, à titre d'information, en annexe du présent Plan Local d'Urbanisme\nintercommunal :\n    −    Les zones d’aménagement concerté (ZAC) ;\n    −    Le périmètre opérationnel de l’Opération d’Intérêt National Paris-Saclay ;\n    −    Les zones de préemption délimitées en application de l'article L113-8 du Code de\n    l’Urbanisme dans sa rédaction antérieure à la loi n°85-729 du 18 juillet 1985 relative à la\n    définition et à la mise en œuvre de principes d'aménagement et de l'article L113-14 du Code\n    de l’Urbanisme dans sa rédaction issue de la même loi ;\n    −    Les périmètres à l'intérieur desquels s'applique le droit de préemption urbain défini aux\n    articles L211-1 et suivants du Code de l'Urbanisme ainsi que le périmètre des Zones\n    d'Aménagement Différé créées en application des articles L212-1 et suivants du Code de\n    l'Urbanisme ;\n    −    Le périmètre des secteurs situés au voisinage des infrastructures de transports terrestres,\n    dans lesquels des prescriptions d'isolement acoustique ont été édictées en application de\n    l'article L571-10 du Code de l'Environnement ;\n    −    Le plan des zones à risques d’exposition au plomb.\nDocuments annexés au PLUi en application de l’article R151-52 du Code de l'Urbanisme\nSont annexés au présent PLUi les documents afférents aux diverses servitudes applicables sur tout ou\npartie du territoire intercommunal, nonobstant les dispositions du PLUi :\n    −    Les servitudes d'utilité publique citées aux articles L151-43 et R151-51 du Code de\n    l’Urbanisme concernant le territoire intercommunal ;\n    −    La liste des lotissements dont les règles d’urbanisme ont été maintenues en application du\n    deuxième alinéa de l’article L442-9 du Code de l’Urbanisme ;\n    −    Les schémas des réseaux d'eau et d'assainissement et des systèmes d'élimination des\n    déchets, existants ou en cours de réalisation, en précisant les emplacements retenus pour\n    le captage, le traitement et le stockage des eaux destinées à la consommation, les stations\n    d'épuration des eaux usées et le stockage et le traitement des déchets ;\n    −    D'une part, les prescriptions d'isolement acoustique édictées, en application des articles\n    L571-9 et L571-10 du Code de l'Environnement, dans les secteurs qui, situés au voisinage\n    des infrastructures de transports terrestres, sont affectés par le bruit et, d'autre part, la\n    référence des arrêtés préfectoraux correspondants et l'indication des lieux où ils peuvent\n    être consultés ;\n    −    Les actes instituant des zones de publicité restreinte et des zones de publicité élargie, en\n    application des articles L581-10 à L581-14 du Code de l'Environnement ;\n    −    Les dispositions d'un projet de plan de prévention des risques naturels prévisibles rendues\n    opposables en application de l'article L562-2 du Code de l'Environnement.\n    PLUi – Règlement – Modification simplifiée n°3 – Février 2026\n    6/103"," Dispositions\n  Générales\nRèglement National d’Urbanisme (dispositions d’ordre public)\nLes règles du PLUi se substituent au Règlement National d’Urbanisme à l’exception des articles suivants\ndu Code de l’Urbanisme qui demeurent applicables sur l’ensemble du territoire intercommunal couvert par\nle PLUi :\n    −    Article R111-2 : Le projet peut être refusé ou n'être accepté que sous réserve de\n    l'observation de prescriptions spéciales s'il est de nature à porter atteinte à la salubrité ou\n    à la sécurité publique du fait de sa situation, de ses caractéristiques, de son importance ou\n    de son implantation à proximité d'autres installations.\n    −    Article R111-4 : Le projet peut être refusé ou n'être accepté que sous réserve de\n    l'observation de prescriptions spéciales s'il est de nature, par sa localisation et ses\n    caractéristiques, à compromettre la conservation ou la mise en valeur d'un site ou de\n    vestiges archéologiques.\n    −    Article R111-26 : Le permis ou la décision prise sur la déclaration préalable doit respecter\n    les préoccupations d'environnement définies aux articles L110-1 et L110-2 du Code de\n    l'Environnement. Le projet peut n'être accepté que sous réserve de l'observation de\n    prescriptions spéciales si, par son importance, sa situation ou sa destination, il est de nature\n    à avoir des conséquences dommageables pour l'environnement.\n    −    Article R111-27 : Le projet peut être refusé ou n'être accepté que sous réserve de\n    l'observation de prescriptions spéciales si les constructions, par leur situation, leur\n    architecture, leurs dimensions ou l'aspect extérieur des bâtiments ou ouvrages à édifier ou\n    à modifier, sont de nature à porter atteinte au caractère ou à l'intérêt des lieux avoisinants,\n    aux sites, aux paysages naturels ou urbains ainsi qu'à la conservation des perspectives\n    monumentales.\nArticle L111-6 et suivants du Code de l’Urbanisme (dit « amendement Dupont »)\nLes dispositions des articles L111-6 et suivants issus de la loi du 2 février 1995 relative au renforcement\nde la protection de l’environnement s’appliquent sur les parties non urbanisées du territoire de\nl’intercommunalité couverte par le PLUi :\n« En dehors des espaces urbanisés des communes, les constructions ou installations sont interdites dans\nune bande de 100 mètres de part et d'autre de l'axe des autoroutes, des routes express et des déviations\nau sens du Code de la Voirie Routière et de 75 mètres de part et d'autre de l'axe des autres routes classées\nà grande circulation. Cette interdiction s’applique également dans une bande de 75 mètres de part et\nd’autre des routes visées à l’article L141-19.\nL’interdiction mentionnée à l’article L111-6 ne s'applique pas :\n    −    Aux constructions ou installations liées ou nécessaires aux infrastructures routières ;\n    −    Aux services publics exigeant la proximité immédiate des infrastructures routières ;\n    −    Aux bâtiments d'exploitation agricole ;\n    −    Aux réseaux d'intérêt public.\nElles ne s'appliquent pas non plus à l'adaptation, au changement de destination, à la réfection ou à\nl'extension de constructions existantes ».\nToutefois, la réalisation d’une Orientation d’Aménagement et de Programmation (OAP), valant étude\n« entrées de ville », permet de déroger aux règles de ces articles. En effet, conformément aux articles\nL111-6 et suivants du Code de l’Urbanisme, cette OAP présente une étude justifiant, en fonction des\nspécificités locales, que ces règles sont compatibles avec la prise en compte des nuisances, de la sécurité,\nde la qualité architecturale, ainsi que de la qualité de l'urbanisme et des paysages.\n    PLUi – Règlement – Modification simplifiée n°3 – Février 2026\n    7/103"," Dispositions\n  Générales\nRèglementation relative aux vestiges archéologiques\nSont applicables dans ce domaine les dispositions ci-après :\n    −    l’article L531-1 du Code du Patrimoine relatif aux autorisations de fouilles par l’Etat,\n    −    l’article L531-14 du Code du Patrimoine relatif aux découvertes fortuites,\n    −    l’article 8 du décret n°2004-490 du 3 juin 2004, relatif aux procédures administratives et\n    financières en matière d’archéologie préventive, qui précise les modalités de saisine du\n    Préfet de Région par les services instructeurs.\nARTICLE 4 -    DISPOSITIONS GENERALES CONCERNANT L’APPLICATION DU\n    REGLEMENT AUX CAS DES LOTISSEMENTS ET DES PROJETS\n    D’AMENAGEMENT D’ENSEMBLE\nL’article R.151-21 du code de l’urbanisme précise « Dans les zones U et AU, le règlement peut, à l'intérieur\nd'une même zone, délimiter des secteurs dans lesquels les projets de constructions situés sur plusieurs\nunités foncières contiguës qui font l'objet d'une demande de permis de construire ou d'aménager conjointe\nsont appréciés comme un projet d'ensemble et auxquels il est fait application de règles alternatives édictées\nà leur bénéfice par le plan local d'urbanisme.\nCes règles alternatives définissent notamment les obligations faites à ces projets lorsque le règlement\nprévoit sur ces secteurs, en application de l'article R. 151-15, qu'un pourcentage des programmes de\nlogements doit être affecté à des catégories de logement en précisant ce pourcentage et les catégories\nprévues.\nDans le cas d'un lotissement ou dans celui de la construction, sur une unité foncière ou sur plusieurs unités\nfoncières contiguës, de plusieurs bâtiments dont le terrain d'assiette doit faire l'objet d'une division en\npropriété ou en jouissance, l'ensemble du projet est apprécié au regard de la totalité des règles édictées\npar le plan local d'urbanisme, sauf si le règlement de ce plan s'y oppose. »\nLe règlement du PLUi de ne s’y oppose pas sur les secteurs suivants.\nIl précise, qu’en sus de l’application de l’article R.151-21 du code de l’urbanisme, toutes les opérations\nd’aménagement d’ensemble font l’objet d’une appréciation globale au regard de la totalité des l’ensemble\ndes obligations réglementaires.\nSont considérées notamment comme des opérations d’aménagement d’ensemble :\nLes lotissements, soumis ou non à permis d’aménager.\nLes ZAC,\nLes opérations faisant l’objet d’un permis groupé, ou valant division,\nLes opérations portant sur une unité foncière* d’une superficie supérieure à 5000 m²,\nLes OAP quand les modalités sont précisées dans le texte de l’OAP.\nTableau des secteurs où le PLUi s’applique à l’échelle de l’opération :\n Commune    Secteur où le PLUi s’applique à l’échelle de\n    l’opération\n La Verrière    Secteurs de la ZAC Gare-Bécannes et du NPNRU\n    du Bois de l’étang\n Trappes    Toute la commune\n Voisins le Bretonneux    Secteur de la ZAC de la Remise\n    PLUi – Règlement – Modification simplifiée n°3 – Février 2026\n    8/103"," Dispositions\n  Générales\nDans les secteurs suivants en revanche, le PLUi s’oppose à ce que les règles édictées s’apprécient\nau regard de l’ensemble du projet.\nAussi, sur ces secteurs, les règles édictées par le PLUi s’apprécient au regard de chacun des lots issus\nd’un lotissement ou de chacun des terrains d’assiette issu d’une division foncière en propriété ou en\njouissance.\n Commune    Secteur où le PLUi s’applique à l’échelle de chacun\n    des terrains à l’issue de l’opération\n Elancourt    Toute la commune\n Guyancourt    Toute la commune\n Magny-les-Hameaux    Toute la commune\n Montigny-le-Bretonneux    Toute la commune\n Voisins-le-Bretonneux    Toute la commune sauf le secteur de la ZAC de la\n    Remise\n La Verrière    Toute la commune sauf les secteurs de la ZAC\n    Gare-Bécanes et du NPNRU du Bois de l’étang\n    PLUi – Règlement – Modification simplifiée n°3 – Février 2026\n    9/103"," Dispositions\n  Générales\nARTICLE 5 -    INFORMATIONS ET RAPPELS RELATIFS AUX RISQUES ET\n    NUISANCES AFFECTANT LE TERRITOIRE DE LA CASQY\nRisque Carrière\nLe Plan de Prévention des Risques Naturels Prévisibles relatif aux zones de risque d’effondrement ou\nd’affaissement du sol liés à la présence d’anciennes carrières souterraines abandonnées (arrêté préfectoral\ndu 5 août 1986) soumet les constructions réalisées dans le périmètre des zones à risques liés aux carrières\n(répertoriées sur le plan des servitudes) aux recommandations techniques préalables de l'Inspection\nGénérale des Carrières – service interdépartemental Yvelines, Val d’Oise et Essonne, 5 rue de la Patte\nd’Oie – 78000 Versailles. Ces constructions peuvent faire l'objet de prescriptions spéciales.\nRisque d’inondation\nL’arrêté préfectoral du 2 novembre 1992, valant Plan de Prévention des Risques Naturels Prévisibles\nportant délimitation des zones submersibles à risque d’inondation des cours d’eau non domaniaux, soumet\nles constructions projetées dans le périmètre des zones à risques (répertoriées sur le plan des servitudes)\nà des contraintes spécifiques.\nAléas de mouvement de terrain différentiel consécutif à la sécheresse et à la réhydratation des sols\nLe BRGM identifie des secteurs d’aléas de retrait-gonflement des argiles de niveau faible ou moyen sur le\nterritoire de Saint-Quentin-en-Yvelines.\nLes secteurs concernés sont rappelés au plan des obligations et informations diverses figurant en annexe\ndu présent PLUi.\nRisque lié au transport de matières dangereuses\nDans les zones impactées par le risque lié au transport de matières dangereuses identifiées au sein des\nannexes du PLUi, les constructions devront respecter les dispositions suivantes :\n    −    Dans la zone permanente : sont interdites toutes nouvelles constructions ou extensions\n    d’Immeuble de Grande Hauteur et Établissement Recevant du Public susceptibles de\n    recevoir plus de 100 personnes.\n    −    Dans la zone intermédiaire : l’aménageur de chaque projet devra engager une étude pour\n    s’assurer que les conditions de sécurité sont satisfaisantes au regard des risques\n    présentés. Cette étude repose sur les caractéristiques de l’ouvrage de transport, de son\n    environnement mais aussi du projet envisagé et du respect de certaines contraintes en\n    matière de sécurité. En outre, la mise en œuvre de mesures compensatoires de type\n    physique sur l’ouvrage de transport destinée à réduire l’emprise de cette zone en limitant la\n    principale source de risque d’accident est à privilégier. Cependant, malgré la mise en place\n    de mesures compensatoires et dans certaines conditions, l’interdiction de construction ou\n    d’extension d’IGH et d’ERP susceptibles de recevoir plus de 100 personnes peut intervenir.\n    La DRIEE devra être consultée lors de la procédure de demande de permis de construire.\n    −   Ces informations sont reportées pour information en annexe.\nPollution des sols\nIl appartient au pétitionnaire de vérifier l’état sanitaire du sol et du sous-sol avec les occupations du sol\nenvisagées. L’état des connaissances sur les pollutions avérées ou potentielles du sol ou du sous-sol est\ndisponible respectivement dans la base de données BASOL sur les sites et sols pollués ou potentiellement\npollués appelant une action des pouvoirs publics à titre préventif et curatif et dans l’inventaire historique\ndes sites industriels et activités de service (base de données) BASIAS.\nZones humides\nIl appartient au pétitionnaire de confirmer le caractère humide ou non de ses terrains et de se conformer\naux obligations qui en découlent.\nLa cartographie des secteurs présentant une probabilité importante de zone humide (enveloppe classe 3)\nétablie par la DRIEE Ile de France en 2010 est reportée pour information en annexe sur le plan 7.25.\n    PLUi – Règlement – Modification simplifiée n°3 – Février 2026\n    10/103","Dispositions\n Générales\nARTICLE 6 -    EMPLACEMENTS RESERVES AUX VOIES ET OUVRAGES PUBLICS,\n    AUX INSTALLATIONS D’INTERET GENERAL ET AUX ESPACES\n    VERTS\n   Les emplacements réservés aux créations ou extensions de voies et ouvrages publics, aux\n   installations d'intérêt général et aux espaces verts, sont repérés au document graphique par un figuré\n   surfacique dont la signification et le bénéficiaire sont rappelés par le tableau des emplacements\n   réservés.\n   Sous réserve des dispositions du Code de l'Urbanisme, la construction est interdite sur les terrains\n   bâtis ou non, concernés par un emplacement réservé dans le Plan Local d’Urbanisme intercommunal.\n   Le propriétaire d'un terrain réservé peut, à compter du jour où le Plan Local d’Urbanisme\n   intercommunal a été approuvé et rendu opposable aux tiers, exiger de la collectivité ou du service\n   public au bénéfice duquel ce terrain a été réservé qu'il soit procédé à son acquisition en application\n   des dispositions du Code de l'Urbanisme.\nARTICLE 7 -    ESPACES BOISES CLASSES\n   Certains terrains sont repérés aux documents graphiques au titre d’espaces boisés à conserver, à\n   protéger ou à créer en application des dispositions du Code de l’Urbanisme.\n   Ce classement interdit tout changement d'affectation ou tout mode d'occupation du sol de nature à\n   compromettre la conservation, la protection ou la création des boisements. Nonobstant toutes\n   dispositions contraires, il entraîne le rejet de plein droit de la demande d'autorisation de défrichement\n   prévue par le code forestier.\n   Sauf application des dispositions du Code de l'Urbanisme, ces terrains sont inconstructibles à\n   l'exception des bâtiments strictement nécessaires à l'exploitation des bois soumis au régime forestier.\n    PLUi – Règlement – Modification simplifiée n°3 – Février 2026\n    11/103","Dispositions\n Générales\nARTICLE 8 -    BANDE INCONSTRUCTIBLE DE 50 METRES EN LISIERE DES\n    MASSIFS BOISES DE PLUS DE 100 HECTARES\n   Le Schéma Directeur de la Région Ile-de-France, approuvé par décret du Premier Ministre le 27\n   décembre 2013, a placé dans ses objectifs généraux l’ambition d’« améliorer l’espace urbain et son\n   environnement naturel » en gérant notamment « durablement l’écosystème naturel [...] de l’Ile-de-\n   France ».\n   Ses orientations détaillées (Livre 3) prévoient des règles strictes avec lesquelles les documents\n   d'urbanisme doivent être compatibles : « préserver et valoriser les espaces boisés et les espaces\n   naturels ».\n   Les règles strictes :\n   « Sans préjudice des dispositions du Code de l’Environnement, les espaces naturels [...] des\n   différentes parties du territoire doivent être préservés. [...].\n   Sans préjudice des dispositions du Code Forestier en matière de gestion durable, les bois et forêts\n   doivent être préservés.\n   Lorsque les dispositions législatives et réglementaires applicables à ces espaces permettent de\n   l’envisager, peuvent être autorisés :\n    −    Le passage des infrastructures, à condition qu’aucune autre solution ne soit techniquement\n    possible à un coût raisonnable et que son impact soit limité [...] ;\n    −    L’exploitation de carrières, sous réserve de ne pas engager des destructions irréversibles\n    et de garantir le retour à une vocation naturelle ou boisée des sols concernés.\n   D’autres projets peuvent être rendus possibles à titre exceptionnel [...], sous réserve de compensation\n   prévue pour les espaces boisés. Les aménagements et constructions doivent être économes en\n   espaces et veiller à une bonne intégration environnementale et paysagère, notamment par le maintien\n   ou la restauration des continuités écologiques [...].\n   Les lisières des espaces boisés doivent être protégées. En dehors des sites urbains constitués, à\n   l’exclusion des bâtiments à destination agricole, toute nouvelle urbanisation ne peut être implantée\n   qu’à une distance d’au moins 50 mètres des lisières des massifs boisés de plus de 100 hectares. Un\n   ensemble de constructions éparses ne saurait être regardé comme site urbain constitué.\n   Peuvent être autorisés les aménagements et les installations assurant la vocation multifonctionnelle\n   de la forêt, à savoir la production forestière, l’accueil du public, les missions écologiques et\n   paysagères, et notamment :\n    −    L’accès pour les besoins de la gestion forestière ;\n    −    L’implantation des équipements nécessaires au développement économique de la filière\n    bois ;\n    −    L’extension du patrimoine forestier ouvert au public, notamment en secteur périurbain et\n    dans les secteurs carencés du cœur métropole ».\n   Une cartographie, en annexe, représente, pour information, les massifs boisés de plus de 100 ha\n   présents sur le territoire intercommunal, la lisière de 50 mètres et les sites urbains constitués.\n    PLUi – Règlement – Modification simplifiée n°3 – Février 2026\n    12/103"," Dispositions\n  Générales\nARTICLE 9 -    RAPPELS DE PROCEDURES\nL’édification des clôtures est soumise à déclaration préalable uniquement dans les cas prévus à l’article\nR.421-12 du Code de l’Urbanisme.\nLes démolitions sont soumises à permis de démolir dans les conditions définies aux articles R.421-26 et\nsuivants du Code de l’Urbanisme.\nSur la commune d’Élancourt :\nLes clôtures sont soumises à déclaration préalable en application de la délibération du Conseil Municipal\ndu 20 mai 2016.\nLes permis de démolir sont maintenus en application de la délibération du Conseil Municipal du 20 mai\n2016, les démolitions sont donc soumises à autorisation préalable.\nSur la commune de Guyancourt :\nLes clôtures sont soumises à déclaration préalable en application de la délibération du Conseil\nCommunautaire du 20 septembre 2012.\nLes permis de démolir sont maintenus en application de la délibération du Conseil Municipal du 3 juillet\n2012, les démolitions sont donc soumises à autorisation préalable.\nSur la commune de La Verrière :\nLes clôtures sont soumises à déclaration préalable en application de la délibération du Conseil Municipal\ndu 15 décembre 2015.\nLes permis de démolir sont maintenus en application de la délibération du Conseil Municipal du 15\ndécembre 2015, les démolitions sont donc soumises à autorisation préalable.\nSur la commune de Magny-les-Hameaux :\nLes clôtures sont soumises à déclaration préalable en application de la délibération du Conseil\nCommunautaire du 21 février 2008.\nSur la commune de Montigny-le-Bretonneux :\nLes clôtures sont soumises à déclaration préalable en application de la délibération du Conseil\nCommunautaire du 29 mai 2008.\nLes permis de démolir sont maintenus en application de la délibération du Conseil Municipal du 22\noctobre 2007, les démolitions sont donc soumises à autorisation préalable.\nSur la commune de Trappes :\nLes clôtures sont soumises à déclaration préalable en application de la délibération du Conseil\nCommunautaire du 10 décembre 2009.\nLes permis de démolir sont maintenus en application de la délibération du Conseil Municipal du 24\nseptembre 2007, les démolitions sont donc soumises à autorisation préalable.\nSur la commune de Voisins-le-Bretonneux :\nLes clôtures sont soumises à déclaration préalable en application des délibérations du Conseil Municipal\ndu 20 septembre 2007 et du Conseil Communautaire du 21 février 2008.\nLes permis de démolir sont maintenus en application de la délibération du Conseil Municipal du 20\nseptembre 2007, les démolitions sont donc soumises à autorisation préalable.\n    PLUi – Règlement – Modification simplifiée n°3 – Février 2026\n    13/103"," Dispositions\n  Générales\nARTICLE 10 -    RECONSTRUCTION\nLa reconstruction à l'identique d'un bâtiment détruit ou démoli depuis moins de dix ans est autorisée\nnonobstant toute disposition d'urbanisme contraire, sauf si la carte communale, le plan local d'urbanisme\nou le plan de prévention des risques naturels prévisibles en dispose autrement, dès lors qu'il a été\nrégulièrement édifié.\nPeut également être autorisée, sauf dispositions contraires des documents d'urbanisme et sous réserve\ndes dispositions de l'article L421-5, la restauration d'un bâtiment dont il reste l'essentiel des murs porteurs\nlorsque son intérêt architectural ou patrimonial en justifie le maintien et sous réserve de respecter les\nprincipales caractéristiques de ce bâtiment.\nARTICLE 11 -    ADAPTATIONS MINEURES\nLes règles et les servitudes définies par le Plan Local d’Urbanisme intercommunal ne peuvent faire l’objet\nd’aucune dérogation à l’exception des adaptations mineures rendues nécessaires par la nature du sol, la\nconfiguration des parcelles ou le caractère des constructions avoisinantes (article L152-3 du Code de\nl’Urbanisme).\n    PLUi – Règlement – Modification simplifiée n°3 – Février 2026\n    14/103","Dispositions\nCommunes\n    TITRE II : DISPOSITIONS COMMUNES\n    APPLICABLES A TOUTES LES ZONES\n    PLUi – Règlement – Modification simplifiée n°3 – Février 2026\n    15/103"," Dispositions\n Communes\nARTICLE 1 -    DESTINATION DES CONSTRUCTIONS\nLe Code de l'Urbanisme (article R123-9 du Code de l’Urbanisme dans sa version antérieure au 1er janvier\n2016) détermine la liste des destinations qui peuvent faire l’objet de règles différentes au travers des\ndifférents articles du règlement du PLU :\n    1.    Habitation,\n    2.    Hébergement hôtelier,\n    3.    Bureaux,\n    4.    Commerce,\n    5.    Artisanat,\n    6.    Industrie,\n    7.    Entrepôt,\n    8.    Exploitation agricole ou forestière,\n    9.    Constructions et Installations Nécessaires aux Services Publics ou d'Intérêt Collectif.\nLa liste des destinations ci-dessous est indicative et non exhaustive. Dans le cas d’une demande pour une\ndestination non mentionnée dans la liste ci-dessous, l’instruction se fera au regard de la destination s’en\napprochant le plus.\n   Destinations    Liste non exhaustive\n    des activités concernées\n    Cette destination comprend toutes les formes d’habitat.\n    Cette destination comprend ainsi les résidences services si elles n’ont pas les services leur\n    Habitation    permettant d’être considérées comme de l’hébergement hôtelier, les résidences destinées\n    aux étudiants, aux jeunes travailleurs, aux travailleurs migrants, aux personnes âgées (sauf\n    EHPAD), aux handicapés, aux adolescents et aux enfants.\n    L’hébergement hôtelier se distingue de l’habitation par le caractère temporaire de\n   Hébergement    l’hébergement et par l’existence de services tels que restaurant, blanchisserie, accueil…\n    hôtelier    Il inclut, notamment, les hôtels, les motels, les pensions de famille, les résidences hôtelières,\n    les résidences de tourisme, les chambres d’hôtes.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    16/103","Dispositions\nCommunes\n Destinations    Liste non exhaustive\n    des activités concernées\n    Les bureaux correspondent à des locaux et annexes* où sont exercées des activités de\n    services de direction, gestion, études, ingénierie, informatique, services aux entreprises…\n    C’est principalement la notion d’accessibilité à la clientèle qui distingue les bureaux des\n    commerces. Appartiennent à la destination « bureaux », par exemple :\n    •   bureaux et activités tertiaires ;\n    •   médical et paramédical : laboratoire d’analyse, professions libérales médicales ;\n    •   sièges sociaux ;\n    •   autres professions libérales : architecte, avocat, notaire, expert-comptable, écrivain\n   Bureaux    public, éditeur, vétérinaires, etc. ;\n    •   bureaux d’études : informatique, urbanisme, ingénierie, etc. ;\n    •   agences : agences immobilières, banques, assurance, travail temporaire, bureau de\n    vente, agences de voyage, auto-école, etc. ;\n    •   prestations de services aux entreprises : nettoyage, etc. ;\n    La destination « commerces » comprend les locaux qui regroupent les activités économiques\n    d’achat et de vente de biens ou de services. La présentation directe au public constitue une\n    activité prédominante.\n    Commerce alimentaire par exemple :\n    •   alimentation générale ;\n    •   boulangerie, pâtisserie, confiserie, viennoiserie ;\n    •   boucherie, charcuterie, traiteurs, volaillers, poissonnerie ;\n    •   caviste ;\n    •   cafés et restaurants ;\n    •   produits diététiques ;\n    • primeurs.\n  Commerce    Commerce non alimentaire par exemple :\n    •   équipements de la personne : chaussures, lingerie, sport, prêt-à-porter ; optique ;\n    •   équipement de la maison : brocante, gros et petit électroménager, gros et petit mobilier\n    (literie, mobilier de bureau), quincaillerie, tissus, vaisselle et liste de mariage ;\n    •   automobiles-motos-cycles : concessions, agents, vente de véhicule, station essence, si\n    non associés à un atelier ou un garage\n    •   loisirs : sports hors vêtements, musique, jouets, jeux, librairie, bouquinerie, papeterie ;\n    •   divers : pharmacie, tabac, presse, cadeaux divers, fleuristes, graines, plantes,\n    horlogerie, bijouterie, mercerie, maroquinerie, parfumerie, galerie d’art, animalerie.\n    •   petits établissements de service ou de location de matériel (laveries automatiques,\n    stations de lavage, automobile, vidéothèque, salle de jeux, etc.) d’une SdP inférieure à\n    300 m² ;\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    17/103","  Dispositions\n  Communes\n    Destinations    Liste non exhaustive\n    des activités concernées\n    L’artisanat regroupe l’ensemble des activités de fabrication, pouvant comporter une activité\n    complémentaire de vente au détail, exercées par des travailleurs manuels. Les activités\n    suivantes constituent des activités artisanales :\n    •   coiffure, soins esthétiques et soins corporels ;\n    •   cordonnerie ;\n    •   photographie ;\n    •   reprographie, imprimerie, photocopie ;\n    •   menuiserie ;\n    Artisanat    •   serrurerie ;\n    •   pressing, retouches, repassage ;\n    •   toilettage ;\n    •   toute activité artisanale ouverte au public avec vente au détail en magasin : bâtiment,\n    artisanat d’art, confection, réparation, etc.\n    •   automobiles-motos-cycles : concessions, agents, vente de véhicule, associé à un\n    garage ou un atelier.\n    •   établissements de service ou de location de matériel (laveries automatiques, stations de\n    lavage, automobile, vidéothèque, salle de jeux, activités de loisirs etc.) ;\n    L’industrie regroupe l’ensemble des activités collectives de production de biens à partir de\n    Industrie    matières brutes, à l’aide de travail ou de capital : ce sont celles qui correspondent au secteur\n    secondaire, y compris l’industrie du bâtiment et des travaux publics.\n    Un entrepôt est un bâtiment logistique destiné au stockage des biens en vue de leur\n    expédition ou de leur utilisation ultérieure.\n    Entrepôt    Sont considérés comme entrepôts les bâtiments ou constructions* dont le stockage constitue\n    la fonction principale. Sont également considérés comme entrepôts, les locaux hébergeant\n    les centres de données.\n    Sont réputées agricoles toutes les activités correspondant à la maîtrise et à l’exploitation d’un\n    cycle biologique de caractère végétal ou animal et constituant une ou plusieurs étapes\n    nécessaires au déroulement de ce cycle, ainsi que les activités exercées par un exploitant\n    agricole qui sont dans le prolongement de l’acte de production ou qui ont pour support\nExploitation agricole\n    l’exploitation.\n    ou forestière\n    L’exploitation forestière est un processus de production s’appliquant à un ensemble d’arbres\n    en vue de leur valorisation économique.\n    Les activités équestres, en dehors des centres équestres qui peuvent constituer un\n    CINASPIC, sont intégrées aux activités agricoles.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    18/103"," Dispositions\n Communes\n   Destinations    Liste non exhaustive\n    des activités concernées\n    Ils sont destinés à accueillir des fonctions d’intérêt général, notamment dans les domaines\n    administratif, hospitalier, sanitaire, social, de l’enseignement et des services annexes,\n    culturel, cultuel, loisirs, sportif (y compris les centres équestres), de la défense et de la\n    sécurité, qu’il s’agisse d’équipements répondant aux besoins d’un service public ou\n    d’organismes privés chargés de satisfaire un intérêt collectif.\n Constructions et\n    Les aires d’accueil des gens du voyage, les jardins familiaux, les chaufferies collectives, les\n   Installations\n    halls d’exposition à vocation événementielle, les établissements d'hébergement pour\n Nécessaires aux\n    personnes âgées dépendantes (EHPAD), les installations techniques liées à l’activité des\nServices Publics ou\n    opérateurs de téléphonie mobile constituent notamment des services publics ou d’intérêt\n d’Intérêt Collectif\n    collectif au sens de la présente définition.\n    (CINASPIC)\n    L’Ile de loisirs, le Golf de Saint-Quentin-en-Yvelines et la colline d’Élancourt constituent des\n    CINASPIC, ainsi, les constructions accessoires (bureau de la direction, buvette, restaurant,\n    sanitaires, camping, logement de gardien, etc.) directement liées et nécessaires au\n    fonctionnement de leurs équipements de loisirs (existants ou projetés) constituent également\n    des services publics ou d’intérêt collectif au sens de la présente définition.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    19/103"," Dispositions\n Communes\nARTICLE 2 -    DEFINITIONS ET PRECISIONS SUR L’APPLICATION DES REGLES\nAbris de jardin*\nLes abris de jardins* sont des petites constructions destinées à protéger des intempéries le matériel de\njardinage, outils, machines, mobilier de jardin, ... Il peut être démontable ou non, avec ou sans\nfondations. Leur hauteur ne doit pas dépasser 2,5 mètres, leur emprise au sol ne doit pas dépasser 10\nm² et ils doivent être bien intégrés afin de ne pas produire de nuisances pour le voisinage.\nAccès*\nL’accès* correspond au seuil assurant le lien entre la voie* et le terrain* d’assiette du projet. Ce dernier doit\npermettre aux véhicules et aux piétons de pénétrer sur le terrain* et d’en sortir en toute sécurité.\nAcrotère* (cf. également Hauteur*)\n    Élément d’une façade* situé au-dessus du niveau d’une toiture-\n    terrasse ou d’une toiture à faible pente pour en masquer la couverture.\n    L’acrotère* est souvent constitué d’un muret plein ou à claire-voie situé\n    en bordure des toitures terrasses pour permettre le relevé\n    d’étanchéité.\n    La hauteur* des façades* des constructions* est mesurée au pied de\n    l’acrotère*, c’est-à-dire au niveau haut brut de la dalle de terrasse et\n    n’inclut pas les éléments techniques nécessaires au relevé\n    d’étanchéité et l’épaisseur de terre en cas de toiture végétalisée.\n    La hauteur de l’acrotère* ne peut pas dépasser de plus d’un mètre la\n    hauteur* de façade* autorisée.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    20/103"," Dispositions\n Communes\nAlignement*\nL’alignement* est la limite entre le terrain* et le domaine public.\nLorsque le terrain* est desservi par une voie* privée, la limite entre le terrain* et cette voie* tient lieu\nd’alignement* pour l’application de l’article 6 du règlement.\nLorsqu’un emplacement réservé est inscrit sur le terrain* en vue de la création ou de l‘élargissement d’une\nvoie* ou d’un carrefour, la limite de l’emplacement réservé tient lieu d’alignement* pour l’application de\nl’article 6 du règlement.\nAnnexe*\nEdifiée sur une même unité foncière*, l’annexe est une construction* dissociée ou non de la construction*\nprincipale, de dimensions réduites et inférieures à la construction principale, non affectée à l’habitation ou\nà l’activité principale (garage, abris de jardin*, local vélo, piscine, etc.).\nLes annexes* dont la hauteur* totale et l’emprise au sol n’excèdent pas respectivement 2,50 mètres et 15\nm² de surface peuvent bénéficier d’exonération de certaines règles pour permettre leur implantation.\nAttique* ou étage en attique\n    Étage supérieur d’un édifice construit en retrait par rapport au plan\n    des façades* de la partie basse de la construction.\n    Pour pouvoir être comptabilisé en comble ou attique (C) au sens de\n    2m    l’article 10 du présent règlement, le recul du plan de la façace de\n    l’attique doit être supérieur à deux mètres par rapport au plan des\n    Partie basse de    façades de la partie basse de la construction, sur au moins 2\n    la construction    façades.\nCoefficient d’emprise au sol*\nLe coefficient d’emprise au sol* est le rapport entre l’emprise au sol* des constructions* (y compris les\nannexes*) et la surface du terrain*.\nCoefficient d’espaces végétalisés* (cf. espaces végétalisés de pleine terre* et espaces végétalisés\ncomplémentaires*)\nCorrespond à un pourcentage minimum d’espaces végétalisés à réaliser sur les espaces libres du terrain*.\nCelui-ci est défini en fonction de l’indice en lettre minuscule porté dans le nom de la zone ou du secteur.\nCe pourcentage minimum d’espaces végétalisés doit être réalisé de la manière suivante :\n− Soit en totalité d’espaces végétalisés de pleine terre* ;\n− Soit conformément à la répartition précisée dans l’article 13 des dispositions particulières applicables\n   aux zones urbaines et aux zones à urbanisées réglementées :\n       Un pourcentage minimum d’espaces végétalisés de pleine terre* (à l’exception\n    des zones et secteurs indicés « a ») ;\n    Auquel s’ajoute,\n       Un pourcentage maximum comptabilisable en espaces végétalisés\n    complémentaires* (auquel s’applique un coefficient modérateur, défini dans le\n    règlement de la zone, en fonction de la qualité des espaces végétalisés\n    complémentaires*) qui peut venir compléter les espaces végétalisés de pleine\n    terre* pour obtenir le pourcentage total d’espaces verts exigé sur le terrain*.\nClôture*\nDésigne tout type de construction* (mur, muret, grillage, portail, etc.) ou de plantation de végétaux, qui clôt\nun terrain* et qui sert à délimiter deux propriétés privées et/ou une propriété privée et le domaine public.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    21/103"," Dispositions\n Communes\nComble*\n    Superstructure d’un bâtiment, comprenant la charpente et\n    sa couverture ; par extension, volume entre le plancher\n    haut et la toiture d’un bâtiment.\nConstruction*\nUne construction* est un ouvrage fixe et pérenne, édifié de manière temporaire ou non,comportant ou non\ndes fondations et générant un espace utilisable par l’Homme en sous-sol ou en surface.\nConstruction* existante\nUne construction* est considérée comme existante si elle est reconnue comme légalement construite et\nsi la majorité des fondations ou des éléments hors fondations déterminant la résistance et la rigidité de\nl'ouvrage remplissent leurs fonctions. Une ruine ne peut pas être considérée comme une construction*\nexistante*.\nUne construction* est régulièrement ou légalement édifiée si elle bénéficie d’une autorisation d’urbanisme\nen règle ou si elle a été construite avant 1943.\nDispositif de production d’énergie renouvelable*\nLes énergies renouvelables sont des énergies primaires inépuisables à très long terme car issues\ndirectement de phénomènes naturels, réguliers ou constants, liés à l’énergie du soleil, de la terre ou de la\ngravitation. Les dispositifs de production d’énergie renouvelable* sont ainsi les dispositifs qui transforment\nces énergies en énergie utile, tels que : chauffe-eau solaire, module photovoltaïque, pompe à chaleur,\ngéothermie, éolienne, chauffage bois, …\nEmprise au sol\n    L’emprise au sol* correspond à la projection verticale du\n    volume de la construction*, tous débords et surplombs\n    inclus. Toutefois, les ornements tels que les éléments de\n    modénature et les marquises sont exclus, ainsi que les\n    débords de toiture lorsqu’ils ne sont pas soutenus par des\n    poteaux ou des encorbellements.\n    Les rampes d’accès au parking souterrain et rampe\n    d’accès PMR ne constituent pas de l’emprise au sol, mais\n    sont comptabilisés au même titre que les espaces de\n    circulation comme des espaces imperméabilisés.\nTout élément d’un bâtiment ou toute construction créant un volume qu’il est possible de projeter au sol\nforme logiquement de l’emprise au sol. A ce titre, nous trouvons donc :\n    - la surface au sol du rez-de-chaussée d’une construction\n    - les surfaces non closes au RDC mais dont la projection au sol est possible : porche ou terrasse\n    surélevés ou couverts par un toit soutenu par des poteaux. La surélévation doit être suffisante\n    (terrasse sur pilotis par exemple ou porche accessible avec plusieurs marches d’escalier) et sur\n    fondations importantes.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    22/103"," Dispositions\n Communes\n    -    les débords de toit portés par des poteaux (les simples débords de toit traditionnels sur le pourtour\n    d’une maison ne sont pas comptés dans l’emprise au sol)\n    -    les rampes d’accès extérieures\n    -    les bassins de piscine (couverte ou non, intérieure ou extérieure) ou de rétention d’eau\n    -    un abri à voiture ouvert mais couvert par une toiture supportée par des poteaux ou des murs. Bien-\n    sûr, un garage fermé indépendant de la maison fait partie de l’emprise au sol.\n    -    un abri à jardin, un atelier indépendant … qu’il soient clos et couverts ou similaires à l’abri à voitures\n    ci-dessus\n    -    un abri à poubelles dans le même cas que l’abri à voiture\n    -    un balcon ou une terrasse en étage en surplomb du RDC\n    -    tous les volumes en porte-à-faux au-dessus du RDC (un étage décalé, par exemple)\nEmprise publique*\nL’emprise publique* correspond à un espace public.\nLe terrain* d’assiette d’une construction* peut ainsi jouxter, non seulement une voie* ou une autre propriété\nprivée, mais également une emprise publique*.\nConstituent ainsi des emprises publiques* les voies ferrées, les lignes de métro et tramways, les cours\nd’eau domaniaux, les canaux, les jardins et parcs publics, les canaux, les bois et forêts domaniales, les\nplaces publiques, et les complexes sportifs, …\nEspaces végétalisés de pleine terre\nSont considérés comme espaces végétalisés de pleine terre* les espaces non bâtis ni en surface ni en\nsous-sol permettant la libre infiltration des eaux pluviales pouvant comprendre des noues, bassins\nvégétalisés, etc. Tout espace vert surplombé d’une terrasse ou d’un balcon ne peut être considéré\ncomme un espace végétalisé de pleine terre*. Toutefois, il peut sous conditions être comptabilisé au titre\ndes espaces végétalisés complémentaires*. Les aires de stationnement en surface et leurs accès ne sont\npas comptabilisés au titre des espaces végétalisés de pleine terre. Toutefois, il peut sous conditions être\ncomptabilisé au titre des espaces végétalisés complémentaires*\n    Coefficient    Schéma\n    Description\n    modérateur    illustratif\n Espaces végétalisés\n    1\n   de pleine terre\nIllustration Urban Eco\nEspaces végétalisés complémentaires\nSont considérés comme espaces végétalisés complémentaires* les espaces suivants :\n   - Espaces végétalisés surplombés d’une terrasse ou d’un balcon. Ces espaces se verront attribuer\n    un coefficient modérateur de 0,8.\n   - Espaces végétalisés sur dalle ou toiture présentant une épaisseur de terre supérieure ou égale à\n    0,60 mètre. Ces espaces se verront attribuer un coefficient modérateur de 0,6.\n   - Toitures d’une épaisseur de terre inférieure à 60 cm ou murs végétalisés Ces éléments se verront\n    attribuer un coefficient modérateur de 0,2.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    23/103","    Dispositions\n    Communes\n    -    Les aires de stationnement et leurs accès perméables et végétalisées peuvent être comptabilisés\n    au titre des espaces végétalisés complémentaires avec un coefficient modérateur de 0,4, sous\n    réserve de respecter les conditions suivantes :\n    o pour permettre l’évolution des constructions à destination de logement et des constructions\n    nécessaires aux services publics et d’intérêt collectif existants à la date d’approbation du\n    PLU ;\n    o pour l’aménagement des aires de stationnement de plus de 20 places, dans la limite de 50\n    % de la superficie de l’aire de stationnement considérée et de ses accès.\n    Coefficient    Schéma\n    Description\n    modérateur    illustratif\n    0,8\n    1 m² est\nEspaces végétalisés de pleine terre\n    comptabilisé\nnon bâtis en sous-sols et surplombés\n    pour 0,8 m²\nde balcons, débord de toiture, auvent,\n    d’espace\nbrise soleil ;\n    végétalisé\n    complémentaire\n    0,6\n    1 m² est\nEspaces végétalisés sur dalle d’une\n    comptabilisé\nprofondeur supérieure ou égale à 0,60\n    pour 0,6 m²\nmètre.\n    d’espace\n    complémentaire\n    0,2\n    1 m² est\n    comptabilisé\nToitures ou murs végétalisés.    pour 0,2 m²\n    d’espace\n    végétalisé\n    complémentaire\n Les aires de stationnement et leurs\n accès ainsi que les aires de jeux\n perméables et végétalisées, dans les\n cas suivant :\n- pour permettre l’évolution des    0 ,4\n    constructions à destination de    1 m² est\n    logement et des constructions    comptabilisé\n    nécessaires aux services publics et    pour 0,4 m²\n    d’intérêt collectif existants à la date d’espace\n    d’approbation du PLU ;    végétalisé\n- pour l’aménagement des aires de    complémentaire\n    stationnement de plus de 20 places,\n    dans la limite de 50 % de la\n    superficie de l’aire de stationnement\n    considérée et de ses accès.\n   Illustration Urban Eco (en vert foncé la proportion comptabilisée au titre des espaces verts)\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    24/103"," Dispositions\n Communes\nExtension*\nL’extension* consiste en un agrandissement de la construction* existante*, l’extension* doit présenter un\nvolume total inférieurs à celui de la construction* existante*. L’extension* peut être horizontale ou\nverticale (par surélévation* ou excavation), et doit présenter un lien physique et fonctionnel avec la\nconstruction* existante*.\nFaçade*\nUne façade* est un mur extérieur délimitant l’enveloppe d’une construction*. On distingue la façade*\nprincipale (façade* sur rue), la façade* arrière et les façades* latérales le plus souvent appelées pignon,\nainsi que les façades des atiques. Elles intègrent tous les éléments structurels, tels que les baies, les\nbardages, les ouvertures*, l’isolation extérieure et les éléments de modénature.\nLe calcul des distances par rapport à l’alignement* ou par rapport aux limites séparatives* s’effectue à partir\ndu plan (mur extérieur) des façades* hors saillies*.\nPour les auvents et les carports d’une hauteur et d’une superficie supérieure ou égale à 2,5 mètres et à\n15m² d’emprise au sol, le calcul des distances par rapport à l’alignement* ou par rapport aux limites\nséparatives* s’effectue à partir du point le plus proche de la construction, vis-à-vis de la limite en question.\nLes règles de distances par rapport à l’alignement* ou par rapport aux limites séparatives* ne s’appliquent\npas pour les auvents et carports d’une superficie inférieure à 15m².\nFaitage*\nLigne de jonction supérieure de deux ou plusieurs pans de toiture inclinés suivant des pentes opposées. Il\nconstitue la ligne de partage des eaux pluviales.\nDans les autres cas, limite supérieure de la toiture.\nGabarit\nLe gabarit* désigne l’ensemble des plans verticaux, horizontaux ou obliques constituant la forme\nextérieure de la construction* tous débords inclus. Il résulte de la combinaison des règles de hauteur*, de\nprospects et d’emprise au sol*.\nHauteur*\nLes hauteurs* maximales se mesurent :\n    -   Pour les constructions* à l’alignement*, à partir du niveau fini du trottoir ou des espaces publics\n    existants ou prévus, en limite de terrain* jusqu’au point le plus haut de la construction*.\n    -   Pour les constructions* en recul*, à partir du sol naturel* jusqu’au point le plus haut de la\n    construction*.\n    -   Par ailleurs, pour les terrains* en pente, le linéaire de chaque façade* est découpé en sections\n    nivelées de 15 mètres maximum dans le sens de la pente. La hauteur* est mesurée au milieu\n    de chaque section.\nLa hauteur* maximale autorisée des constructions* est une hauteur* exprimée en mètre. Celle-ci repose\nsur les éléments suivants :\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    25/103"," Dispositions\n Communes\n−   Une hauteur* maximale au point le plus haut de la construction* (H) U\n    Les ouvrages techniques indispensables, tels que les souches de cheminées ou de ventilation, les\n    locaux techniques d’ascenseurs, les garde-corps, les dispositifs de production d’énergie\n    renouvelable*, les locaux techniques, les antennes, etc. ne sont pas comptés dans le calcul de la\n    hauteur*. Un travail d’intégration de ces éléments doit être mis en œuvre pour qu’ils soient le moins\n    visible possible depuis les espaces publics.\n−   Une hauteur* maximale de façade* (h) définie à l’égout du toit ou au pied de l’acrotère* des terrasses\n    (hors attique).\nHébergement\nForme de logement temporaire qui vise à répondre à des problématiques spécifiques. L’hébergement\nrecouvre les constructions* destinées à l'hébergement dans des résidences ou foyers avec service, tels\nles maisons de retraite, les résidences universitaires, les foyers de travailleurs et les résidences\nautonomie.\nInstallations classées pour la protection de l’environnement*\nÉquipements ou installations qui, par leur nature, présentent un risque d’incommodité, d’insalubrité ou de\ndanger. Ces établissements figurent dans la nomenclature établie par décret en Conseil d’État en\napplication de la loi du 19 Juillet 1976.\nLa nomenclature classe ces installations en trois catégories :\n−   Déclaration : pour les activités les moins polluantes et les moins dangereuses. Une simple déclaration\n    en préfecture est nécessaire.\n−   Autorisation : pour les installations présentant les risques ou pollutions les plus importants. L’exploitant\n    doit faire une demande d’autorisation avant toute mise en service, démontrant l’acceptabilité du risque.\n    Le préfet peut autoriser ou refuser le fonctionnement.\n−   Enregistrement : pour les secteurs dont les mesures techniques pour prévenir les inconvénients sont\n    bien connues (stations-service, entrepôts...), un régime d’autorisation simplifiée, ou régime dit\n    d’enregistrement, a été créé en 2009.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    26/103"," Dispositions\n Communes\nLimite séparative*\nLes limites séparatives* désignent\nl’ensemble des limites d’un terrain*, ce\nsont donc les lignes séparant deux\npropriétés contigües. Il existe deux\ntypes de limites séparatives* :\n−    Les limites latérales qui séparent\n    deux unités foncières* et qui\n    joignent l’alignement*,\n−    Les limites de fond de parcelle qui\n    ne joignent pas l’alignement*.\nEn se référant à un terrain* présentant\nla configuration d’un quadrilatère\nrégulier, les limites qui aboutissent à\nl’alignement* constituent les limites\nséparatives* latérales, la limite opposée\nà l’alignement* constitue la limite de\nfond de parcelle.\nDans l’acceptation courante, il faut\nassimiler toute forme parcellaire\ncomplexe à cette configuration en\nconsidérant comme limite séparative*\nlatérale tout côté de terrain* aboutissant\nà l’alignement*, y compris les éventuels\ndécrochements, coudes ou brisures.\nLocal accessoire\nLe local accessoire* fait soit partie intégrante d’une construction* principale, soit il en constitue une\nannexe*, soit une extension*. Il est indissociable du fonctionnement de la construction* principale.\nLucarne*\nOuverture ménagée dans un pan de toiture pour donner du jour et de l’air aux locaux sous combles. Sa\nbaie est verticale, et est abritée par un ouvrage de charpente et de couverture.\nModule de plantation*\nUn module de plantation* correspond à un regroupement de plusieurs sujets végétaux au sein d’un secteur\ndélimité. Un module de plantation* sera constitué d’une fosse de plantation unique comportant au minimum\n10 unités de plantation*.\nNGF*\nNivellement Général de la France (altitude orthométrique de référence).\nNiveau*\nUn niveau* est l’espace compris entre le plancher et le plafond dans un bâtiment.\nNe sont pas comptabilisés comme niveaux* au sens du présent règlement, ni les niveaux* partiels\nconstitués par des mezzanines, ni les niveaux* en sous-sol.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    27/103"," Dispositions\n Communes\nOpération d’aménagement d’ensemble*\nConstituent des opérations d’aménagement d’ensemble* les procédures ou dispositifs opérationnels\nsuivants : les zones d’aménagement concerté (ZAC), les lotissements, les permis valant division, les\npermis d’aménager.\nOuverture*\nToute baie, orifice ou passage traversant de part en part une paroi de maçonnerie extérieure.\nPente de toiture*\nDegré d’inclinaison du ou des versants d’une toiture.\nRecul* (par rapport à l’alignement*)\n    Le recul* est la distance séparant une\n    construction* des emprises publiques* ou\n    des voies* (publiques ou privées) ou d’un\n    emplacement réservé. Il se mesure\n    horizontalement et perpendiculairement à la\n    limite d’emprise publique*, de voie publique\n    ou privée ou d’emplacement réservé.\n    Réhabilitation*\nCorrespond à une remise en état profond d’une construction* ancienne sans procéder à une démolition-\nreconstruction.\nRetrait* (par rapport aux limites séparatives*)\nLe retrait* est la distance séparant la construction* d’une limite séparative*. Il se mesure horizontalement\net perpendiculairement à la limite séparative* relativement au plan des façades* (hors saillies*).\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    28/103"," Dispositions\n Communes\nSaillie*\nOn appelle saillie* toute partie ou élément de construction* ponctuel qui dépasse le plan d’une façade*\nd’une construction* et non constitutive d’une surface de plancher* (SP). Les balcons, corniches, moulures,\netc. constituent des saillies*.\nSol naturel*\nNiveau de terrain pris comme référence pour les différentes cotes de niveau d’une construction*. Le sol\nnaturel* correspond au sol existant avant tout travaux d’affouillement ou d’exhaussement.\nSTECAL*\nSecteur de taille et de capacité limitées pouvant être délimité en zones agricole ou naturelle. A titre\nexceptionnel, ces derniers peuvent autoriser : des constructions*, des aires d’accueil et des terrains\nfamiliaux locatifs destinés à l’habitat des gens du voyage, des résidences démontables constituant l’habitat\npermanent de leur utilisateur.\nSurélévation*\nLe terme « surélévation* » d’une construction* signifie toute augmentation de la hauteur* de la\nconstruction*.\nSurface de plancher*\nLa surface de plancher* est une unité de calcul des surfaces de construction* (créée par l'ordonnance du\n16 novembre 2011, le décret du 29 décembre 2011 et la circulaire du 3 février 2012), qui sert, depuis le 1er\nmars 2012, à la délivrance des permis de construire et des autres autorisations d'urbanisme.\nLa surface de plancher* de la construction* est égale* à la somme des surfaces de plancher* de chaque\nniveau* clos et couvert, calculée à partir du nu intérieur des façades* après déduction :\n−    Des surfaces correspondant à l'épaisseur des murs entourant les embrasures des portes et fenêtres\n    donnant sur l'extérieur ;\n−    Des vides et des trémies afférentes aux escaliers et ascenseurs ;\n−    Des surfaces de plancher* d'une hauteur sous plafond inférieure ou égale à 1,80 mètre ;\n−    Des surfaces de plancher* aménagées en vue du stationnement des véhicules motorisés ou non, y\n    compris les rampes d'accès et les aires de manœuvres ;\n−    Des surfaces de plancher* des combles* non aménageables pour l'habitation ou pour des activités à\n    caractère professionnel, artisanal, industriel ou commercial ;\n−    Des surfaces de plancher* des locaux techniques nécessaires au fonctionnement d'un groupe de\n    bâtiments ou d'un immeuble autre qu'une maison individuelle au sens de l'article L. 231-1 du Code de\n    la Construction et de l'Habitation, y compris les locaux de stockage des déchets ;\n−    Des surfaces de plancher* des caves ou des celliers, annexes* à des logements, dès lors que ces\n    locaux sont desservis uniquement par une partie commune à plusieurs logements ;\n−    D'une surface égale à 10 % des surfaces de plancher* affectées à l'habitation telles qu'elles résultent\n    le cas échéant de l'application des alinéas précédents, dès lors que les logements sont desservis par\n    des parties communes intérieures.\nTerrain* ou unité foncière*\nUn terrain* (ou unité foncière*) est une propriété foncière d’un seul tenant, composée d’une parcelle ou\nd’un ensemble de parcelles contiguës appartenant à un même propriétaire ou un même groupe de\npropriétaires.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    29/103"," Dispositions\n Communes\nUnité de plantation*\nLe tableau ci-dessous défini la valeur des plans en unité de plantation* :\n    Valeur du plant en nombre\n    Plant    Taille à maturité\n    d’unité de plantation*\n    1 arbre de grand développement    > 20 mètres    8\n    1 arbre de moyen développement    7 à 20 mètres    4\n    1 arbre de petit développement    3 à 7 mètres    2\n    1 petit arbuste    1 à 3 mètres    1\nSource : Urban Eco\nVéranda*\nUne véranda est une construction légère, close et couverte, appliquée en saillie d’une construction.\nElle se compose généralement d’une structure en métal, bois ou matériau composite et de façades\nmajoritairement en vitrage.\nVoie*\nCe terme englobe toute voie*, existante ou à créer dans le cadre d'un projet, quel que soit son statut (public\nou privé), ouverte à la circulation et à tous modes de déplacement (automobile, modes « doux », transports\ncollectifs...), permettant la desserte de l'espace naturel ou urbain et desservant plus d’une propriété.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    30/103"," Dispositions\n Communes\nARTICLE 3 -    CONDITIONS DE DESSERTE DES TERRAINS* PAR LES VOIES*\n    PUBLIQUES OU PRIVEES ET D’ACCES* AUX VOIES* OUVERTES AU\n    PUBLIC\nRappel : Tout terrain* enclavé est inconstructible à moins que son propriétaire ne bénéficie d’une servitude\nde passage suffisante, instituée par acte authentique ou par voie judiciaire en application de l’article 682\ndu Code Civil.\n    3.1.    Accès*\n    3.1.1   Les accès* doivent être adaptés à l’opération, aménagés de façon à apporter la moindre\n    gêne à la circulation publique et satisfaire aux exigences de la sécurité, de la protection\n    civile, de la défense contre l’incendie et du ramassage des ordures ménagères.\n    3.2.    Voies*\n    3.2.1   Les dimensions, formes et caractéristiques des voies* nouvelles doivent être adaptées aux\n    usages qu’elles supportent et aux opérations qu’elles doivent desservir.\n    3.2.2   Les voies* nouvelles en impasse d’une longueur supérieure à 50 mètres doivent être\n    aménagées dans leur partie terminale afin de permettre à tout véhicule (et notamment ceux\n    des services de secours et des services publics) de faire demi-tour.\nARTICLE 4 -    CONDITIONS DE DESSERTES DES TERRAINS* PAR LES RESEAUX\n    PUBLICS\n    4.1. Eau potable\n    4.1.1    La Communauté d’agglomération de Saint Quentin en Yvelines a transféré à deux syndicats mixtes\n    intercommunaux la compétence eau potable sur le territoire de Saint-Quentin en Yvelines :\n    AQUAVESC et SIRYAE.\n    Tout projet d’alimentation en eau potable doit respecter le schéma de distribution d’eau potable tel que\n    décrit à l’article L2224-7-1 du CGCT qui a pour objet de déterminer les zones desservies par le réseau\n    d’eau potable pour lesquelles une obligation de desserte s'applique (cf. cartographies en annexe du\n    PLUi). Celui-ci arrête la zone desservie au réseau de distribution existant. En cas de demande de\n    raccordement dans une zone non desservie, l’extension de réseau est alors à la charge du\n    pétitionnaire. Des refus de raccordements sont néanmoins possibles dans la zone desservie, s’ils sont\n    justifiés (construction illégale…).\n    4.1.2   Toute construction* à usage d’habitation doit être raccordée au réseau public d'eau potable ;\n    4.1.3   Toute construction* nouvelle à usage autre que d’habitation qui requiert une alimentation en\n    eau potable doit être raccordée au réseau public de distribution d’eau potable ou justifier\n    d’une ressource suffisante (captages, forages, puits) et de qualité conforme aux\n    réglementations en vigueur (Code de la Santé Publique) ;\n    4.1.4   Tout projet d’alimentation en eau potable par une ressource privée devra obligatoirement\n    faire l’objet d’un dossier de déclaration (bâtiment à usage d’habitation unifamiliale) ou d’un\n    dossier d’autorisation (bâtiment à usage autre qu’unifamilial) ;\n    4.1.5   Lorsqu’il est envisagé d’utiliser l’eau potable pour alimenter un réseau ou un circuit fermé\n    pouvant présenter des risques particuliers pour la distribution située en amont, tout\n    particulier et toute activité doit respecter les consignes de sécurité vis-à-vis du réseau en\n    disposant des disconnecteurs ou similaires pour pallier d’éventuels retours vers celui-ci.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    31/103","Dispositions\nCommunes\n    4.2. Assainissement\n    4.2.1   Les réseaux d’eaux usées et d’eaux pluviales doivent être de type séparatif ;\n    4.2.2   Toute opération devra respecter les prescriptions imposées dans les règlements\n    d’assainissement (collectif et non collectif) de la Communauté d’agglomération de Saint-\n    Quentin-en-Yvelines, dans le Schéma Directeur d'Aménagement et de Gestion des Eaux\n    (SDAGE) Seine Normandie et dans le Schéma d’Aménagement et de Gestion des Eaux\n    (SAGE) où se situe le projet (Bièvre, Mauldre ou Orge-Yvette).\n    Eaux usées\n    4.2.3   Toute construction ou installation nouvelle à usage domestique située en zone\n    d'assainissement collectif doit être raccordée au réseau public de collecte des eaux usées\n    dès qu’il existe conformément au zonage définissant les zones d'assainissement collectif et\n    non collectif de la Communauté d’agglomération de Saint-Quentin-en-Yvelines représenté\n    au plan n°7.22 annexé au présent PLUi.\n    4.2.4   Le raccordement des eaux usées devra faire l’objet d’une demande de branchement auprès\n    du service assainissement de la Communauté d’agglomération de Saint-Quentin-en-\n    Yvelines.\n    4.2.5   Les modalités techniques et administratives de raccordement sont définies dans le\n    règlement d’assainissement collectif de la Communauté d’agglomération de Saint-Quentin-\n    en-Yvelines et dans le cahier de prescriptions techniques en matière d’assainissement en\n    vigueur.\n    4.2.6   Les opérations de construction* situées en zone d'assainissement non collectif doivent\n    disposer d'une installation d'assainissement autonome conforme à la réglementation en\n    vigueur et aux prescriptions de la Communauté d’agglomération de Saint-Quentin-en-\n    Yvelines.\n    4.2.7   L’évacuation des eaux usées non-domestiques dans le rése
