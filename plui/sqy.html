sées.\n11.3.7   Pour les secteurs régis par l’indice 8,\n    −   les toitures terrasses sont interdites, sauf pour les constructions* et installations\n    nécessaires aux services publics ou d’intérêt collectif.\n    −   les toitures à pentes présenteront une inclinaison maximum de 40°.\n    −   Pour les aménagements de combles et surélévations : La pente de la toiture* d’origine\n    sera conservée ou comprise entre 30° et 40°, toutefois, les lucarnes* sont autorisées.\n    Le sens du faîtage de la toiture d’origine sera conservé.\n    La lucarne doit être dimensionnée en fonction des ouvertures situées au niveau\n    inférieur, Elle doit présenter des dimensions en cohérence avec la composition de la\n    façade. Elle sera axée, dans la mesure du possible, par rapport aux fenêtres de la\n    façade\n    L’encombrement total des lucarnes ne devra pas excéder plus du tiers de la longueur\n    totale du pan de toiture\n    −   Pour les extensions créant une emprise au sol :\n    −   Concernant les extensions en pignon :\n    Les toitures seront à versants, la pente et le sens du faîtage de la toiture du\n    bâtiment existant seront conservés.\n    −   Concernant les extensions en façade principale ou arrière :\n    Les extensions comporteront un seul versant si elles conservent le sens du\n    faîtage du bâtiment existant, en cas d'impossibilité manifeste\n        Présence d'une ouverture à l'étage : la pente de toiture pourra\n    être abaissée à 12° minimum sous l’ouverture\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    75/103","    ZONES\n    U AU\n       absence d’étage : la pente de toiture pourra être abaissée à 12°\n    minimum à compter de l’égout du toit\n    Les extensions comporteront 2 versants si elles ne conservent pas le sens du\n    faîtage du bâtiment existant, la pente de toiture sera identique à celle du\n    bâtiment principal ou comprise entre 30° et 40 °\n    −    Règles particulières concernant les extensions en façade principale, arrière ou\n    pignon :\n    Un degré de pente et un sens de faitage différents sont autorisés pour des\n    éléments de constructions ponctuels : véranda, marquise, auvent.\n11.4    Clôtures*\n11. 4. 1 Dispositions générales pour toutes les clotures\n11.4.1.1 Qualité des clotures :\n    Les clôtures participent à la composition du paysage. Identité visuelle de l’espace public elles\n    doivent faire l’objet d’un soin aussi attentif que la construction et l’aménagement du terrain en\n    tenant compte de son environnement : dimension, choix des matériaux, coloris, végétaux…\n    Tout projet ne présentant pas les composantes garantissant la qualité des paysages\n    urbains et naturels pourra être refusé.\n    Il est recommandé de prévoir des ouvertures au niveau du sol, pour faciliter les déplacements\n    de la petite faune.\n    Pour toute installation de cloture, il est conseillé de se reporter au chapitre 3 relatif aux clôtures\n    du guide de l’éco-jardin disponible en annexe 9 du présent règlement.\n11.4.1.2 Des dérogations aux règles relatives aux clôtures pourront être accordées, aussi bien terme\n    de hauteur que d’aspect :\n    −    dans le cadre de projet global et en accord avec la commune concernée, pour assurer\n    la protection par rapport aux axes structurants créateurs de nuisances,\n    −    Pour la surélévation par un dispositif ajouré des clôtures existantes dont les murets\n    existants ne permettraient pas de respecter la répartition un tier/deux tiers entre partie\n    pleine et partie ajourée.\n    −    pour les CINASPIC devant répondre aux obligations du plan Vigipirate,\n    −    Pour des raisons de sécurité liées au fonctionnement des activités ou des équipements.\n    Une note argumentée, explicitant les motifs et les intentions, devra être réalisée pour\n    pouvoir déroger à la règle ;\n11.4.1.3 Composition des clôtures\n    Les clôtures* et les éléments entrant dans leur composition, tels que les murs, portes, portails,\n    grilles ou balustrades, doivent présenter une cohérence d’aspect avec la construction* et être\n    conçus avec simplicité en évitant les éléments d’aspect précaire, de caractère insolite ou trop\n    recherché ;\n    Sont notamment interdits :\n    −    La tôle,\n    −    Le fil barbelé,\n    −    Les parpaings non enduits.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    76/103","    ZONES\n    U AU\n    Les haies seront constituées de préférence par des essences locales et plurispécifiques\n    mentionnées au sein de la palette végétale présentée en annexe 1 et 2 du présent règlement,\n    doublée ou non d’un grillage de couleur foncée.\n11.4.1.4 La hauteur des clôtures* ne doit pas excéder 2 mètres pour les secteurs régis par les indices\n    1, 2, 3, 5, 6, 7 et 1,80 m pour les secteurs régis par les indices 4, 8 et 9.\n    Toutefois des hauteurs supérieures peuvent être autorisées :\n    −   Pour permettre la reconstruction à l’identique de clôtures* anciennes présentant un\n    intérêt d’aspect ;\n11.4.2    En plus des dispositions générales, en limite des voies* publiques ou privées ou\n    d’emprise publique les clôtures devront respecter les règles suivantes :\n    Les matériaux et filtres visuels qui tendent à homogénéiser les paysages urbains et détériorent\n    la qualité des espaces urbains sont à éviter. Les canisses, bâches textiles, haies ou treillis\n    artificiels sont interdits sur les voies et espaces publics.\n    11.4.2.1 Pour les secteurs régis par les indices 1, 2, 3, 5, 6, 7, 8 et 9 les clôtures* seront\n    composées soit :\n    −   d’un muret, surmonté d’un dispositif ajouré sur toute sa hauteur doublé ou non d’une\n    haie. En ce cas la partie pleine fera un tiers de la hauteur totale. Les maçonneries\n    devront être enduites ou harmonieuses avec la construction principale.\n    −   d’un dispositif ajouré sur toute sa hauteur, doublé ou non d’une haie ; les grillages\n    doivent être rigides,\n    −   d’une haie,\n    −   en outre, en indice 9 uniquement, des murs pleins peuvent être tolérés s’ils présentent\n    une parfaite intégration urbaine.\n    11.4.2.2 Pour les secteurs régis par l’indice 4, les clotures seront composées :\n    −   par un mur ou un mur bahut d’une hauteur minimale de 90 cm de clôture* en\n    maçonneries enduites ou constituées de moellons de pierre meulière ou des mêmes\n    matériaux que la construction*. Les murs bahut pourront être surmontés d’un dispositif\n    ajouré sur toute sa hauteur.\n    −   Les murs en pierre de pays identifiés au document graphique et au Titre VII du\n    règlement devront être préservés conformément à l’Article 7 des dispositions\n    communes du présent règlement.\n11.4.7    En plus des dispositions générales, en limite séparative*, les clôtures* seront de\n    préférence constituées d’un grillage doublé d’une haie.\n11.5    Bâtiments annexes*\n11.5.1    Les bâtiments annexes* doivent faire l’objet d’un soin particulier dans leur implantation par\n    rapport à la construction* principale et au traitement paysager de la parcelle ;\n11.5.2    Les bâtiments annexes* seront de préférence recouverts d’un matériau présentant une\n    homogénéité de teinte et de matières avec la construction* principale. D’une manière\n    générale, les matériaux mis en œuvre doivent permettre un vieillissement correct de l’ouvrage.\n11.6    Éléments techniques\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    77/103","    ZONES\n    U AU\n    11.6.1   Les antennes paraboliques doivent être intégrées au site par tous moyens adaptés et ne pas\n    dépasser du faîtage pour les toitures à pente(s) de manière à en réduire l’impact visuel depuis\n    les voies* publiques et privées. La pose d’antenne est interdite en saillie* des balcons et des\n    façades*.\n    11.6.2   De manière générale pour les logements groupés et/ ou collectifs, les systèmes d’antenne\n    collective ou tous les autres systèmes de regroupement de dispositifs de réception devront\n    être privilégiés afin de limiter les impacts visuels de ces dispositifs techniques ;\n    11.6.3   Les éléments des dispositifs de production d’énergie solaire (panneaux, tuiles, etc.) ainsi que\n    tous dispositifs de production d’énergie renouvelable* sont encouragés à condition d’être\n    intégrés de manière harmonieuse à la construction* ; il est ainsi préconisé de :\n    −    regrouper les panneaux et éviter une implantation verticale du champ de captage par\n    rapport à la toiture,\n    −    s’adosser à la pente des toitures, et garder une proportion cohérente entre surface de\n    captage et surface de toiture,\n    −    aligner le champ de capteurs avec les ouvertures existantes en façade, et privilégier\n    une certaine symétrie,\n    −    éviter une implantation près du faîtage et respecter une distance minimale par rapport\n    à la gouttière et aux rives,\n    −    préférer une implantation encastrée, plutôt qu’en superposition,\n    −    privilégier les implantations sur les toitures secondaires ou les dépendances,\n    −    choisir un capteur dont le coloris et la texture sont en accord avec la toiture.\nDans les périmètres délimité des abords des monuments historiques, ces préconisations deviennent\nobligatoires.\n    11.6.4   Les boîtes aux lettres et les coffrets techniques devront être intégrés dans les constructions*\n    ou dans les murs de clôture*.\n    ARTICLE U 12 - STATIONNEMENT\n    Se reporter à l’article 12 des dispositions communes applicables à toutes les zones.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    78/103","    ZONES\n    U AU\nARTICLE U 13 -    ESPACES LIBRES ET PLANTATIONS, ESPACES BOISES CLASSES\n13.1    Espaces Boisés Classés\n13.1.1    Les terrains* repérés au règlement graphique au titre d’Espaces Boisés Classés, en\n    application des dispositions des articles L113-1 et suivants du Code de l’Urbanisme sont à\n    conserver, à protéger ou à créer ;\n13.1.2    Tout changement d’affectation ou tout mode d’occupation du sol de nature à compromettre la\n    conservation, la protection ou la création de boisements est interdit ;\n13.1.3    Nonobstant, toutes dispositions contraires, ce classement entraine le rejet de plein droit de la\n    demande d’autorisation de défrichement prévue à l’article L 311-1 du Code Forestier.\n13.2.    Les espaces libres et plantations :\n13.2.1    Les terrains* doivent comprendre un pourcentage minimum d’espaces végétalisés défini en\n    fonction de l’indice porté dans le nom de la zone ou du secteur, conformément au tableau ci-\n    après.\n13.2.2    Ce pourcentage minimum d’espaces végétalisés doit être réalisé de la manière suivante :\n    −   Soit en totalité en espaces végétalisés de pleine terre* ;\n    −   Soit conformément à la répartition figurant au tableau ci-après :\n       Un pourcentage minimum d’espaces végétalisés de pleine terre* (à l’exception des\n    zones et secteurs indicés « a ») ;\n    Auquel s’ajoute,\n       Un pourcentage maximum comptabilisable en espaces végétalisés\n    complémentaires* qui peut venir compléter les espaces végétalisés de pleine\n    terre* pour obtenir le pourcentage total d’espaces végétalisés exigé sur le terrain*.\n    Les espaces verts complémentaires sont définis dans le lexique et un coefficient\n    modérateur leur est appliqué en fonction de leurs qualités\n    Pourcentage minimum d’espaces verts sur le terrain*\n    Règle de répartition\n Indice    Pourcentage total\n    Pourcentage maximum\n U\n    minimum    Pourcentage minimum\n    comptabilisable\n    d’espaces    d’espaces végétalisés\n    Espaces végétalisés\n    végétalisés    de pleine terre\n    complémentaires*\n    a    20%    0%    20%\n    b    25%    15%    10%\n    c    30%    20%    10%\n    d    40%    25%    15%\n    e    50%    25%    25%\n    f    60%    30%    30%\n13.2.3 Dispositions complémentaires applicables aux secteurs régis par l’indice 8\n    Dans les secteurs régis par l’indice 8, la répartition ci-dessus définie s’applique uniquement\n    pour les terrains* nus.\n    Pour les terrains* déjà bâtis et pour les constructions à destination d’habitat, les espaces\n    libres, non bâtis et non occupés par des aires de stationnement devront représenter au\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    79/103","    ZONES\n    U AU\n    minimum 20% de la superficie du terrain*. Ceux-ci seront à maintenir ou à réaliser en espaces\n    végétalisés de pleine terre*.\n13.2.4 Dispositions spécifiques applicables aux constructions et installations nécessaires aux services\n    publics et d’intérêt collectifs\n    Pour permettre l’évolution des établissements d’enseignement et des crèches existants à la\n    date d’approbation du PLUi une dérogation peut être accordée sur la quantité d’espaces verts\n    exigée, sans que celle-ci puisse être diminuée de plus d’un tiers des surfaces exigibles.\nObligation de planter :\n13.2.4   Les espaces végétalisés, qu’ils soient de pleine terre* ou complémentaires*, doivent être\n    plantés à raison à minima d’une unité de plantation* par tranche entamée de 20 m² ;\n    Ainsi, pour un espace végétalisé de 200 m2, il est nécessaire de réaliser 10 unités de plantation* (200m2\n    P   P    P\n    / 10m2). Ces unités de plantation* doivent être réparties en panachant les différents types de plants\n    P    P   P\n    présents dans le tableau inclus dans la définition présente dans le titre II « Dispositions communes\n    applicables à toutes les zones », article 2 « Définitions et précisions sur l’application des règles » du\n    présent règlement. Par exemple, dans ce cas précis il peut être envisagé la plantation d’1 arbre de\n    moyen développement, celle d’un arbre de petit développement et d’une haie de 4 petits arbustes ((0*8)\n    + (1*4) + (1*2) + (4*1))= 10).\n13.2.5   Les aires de stationnement non couvertes doivent être plantées à raison d’une unité de\n    plantation* pour une place de stationnement ;\n13.2.6   Pour les aires de stationnement non couvertes de plus de 20 places, les plantations doivent\n    être regroupées en module de plantation*, à raison d’un module de plantation* par tranche\n    échue de 10 places de stationnement. Un module de plantation* sera constitué d’une fosse\n    de plantation unique comportant au minimum 10 unités de plantation*. Les modules de\n    plantation* doivent être répartis sur l’ensemble de l’aire de stationnement ;\n13.2.7   La strate arbustive devra de préférence être composée d’un mix d’essences persistantes et\n    d’essences caduques.\n13.2.8   Les espèces végétales seront préférentiellement choisies parmi la flore indigène du bassin\n    parisien selon la liste de recommandation présentée en annexe 2 du présent règlement, et\n    pour la commune de Magny-les-Hameaux, il est conseillé de respecter la palette végétale\n    présentée en annexe 4.\n13.2.9   Les espèces végétales invasives inscrites sur les listes I et II présentées en annexe 3 du\n    présent règlement sont interdites.\n13.2.10 Aucun sol ne sera laissé nu. Les pieds d’arbres accueilleront une végétation herbacée et des\n    couvre-sols.\n13.2.11 Les plantations doivent être adaptées au contexte dans lequel elles sont plantées pour assurer\n    leur bon développement. Il est conseillé de se reporter à la charte de l’arbre annexée au\n    présent règlement.\n    Les plantations doivent être plantées en bonne intelligence avec le voisinage et dans le\n    respect des règles minimales du Code Civil. Il est conseillé de se reporter à la note présentant\n    « Les distances de plantation d’arbres sur le domaine privé » présentée en annexe 7 du\n    présent règlement.\n13.2.12 Les règles de l’article U 13.2 ne s’appliquent pas aux constructions et installations nécessaires\n    au réseau de transport public du Grand Paris, qui feront néanmoins l’objet d’un traitement\n    paysager qualitatif.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    80/103","    ZONES\n    U AU\nARTICLE U 14 -    COEFFICIENT D’OCCUPATION DU SOL\n14.1.    Dispositions générales relatives au coefficient d’occupation du sol\n14.1.1 Il n'est pas fixé de coefficient d’occupation du sol.\nARTICLE U 15 -    OBLIGATIONS IMPOSEES EN MATIERE    DE    PERFORMANCES\n    ENERGETIQUES ET ENVIRONNEMENTALES\n15.1    Toute construction* neuve supérieure à 2000 m² de surface de plancher* doit comporter un\n    dispositif de production d’énergie renouvelable* et au moins un dispositif destiné à économiser\n    l’eau.\n    Cette règle ne s’applique pas aux constructions et installations nécessaires au réseau de\n    transport public du Grand Paris.\nARTICLE U 16 -    OBLIGATIONS IMPOSEES EN MATIERE D'INFRASTRUCTURES    ET\n    RESEAUX DE COMMUNICATIONS ELECTRONIQUES\n16.1    Les constructions* nouvelles doivent être raccordées aux réseaux de distribution de\n    télécommunication (téléphone, câble, fibre optique) présents au droit de la construction*.\n16.2    Ces réseaux doivent être conçus en souterrain, sauf difficulté technique reconnue par le\n    service gestionnaire intéressé.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    81/103","   ZONE\nAU STRICTE\n    TITRE IV : DISPOSITIONS PARTICULIÈRES\n    APPLICABLES À LA ZONE À URBANISER\n    STRICTE\n  Il s’agit d’une zone actuellement non équipée, destinée à l’urbanisation sous forme de plans d’aménagement\n  d’ensemble et sous réserve de la réalisation des équipements publics nécessaires. Cette zone est actuellement\n  inconstructible, son ouverture à l’urbanisation est subordonnée à une modification ou à une révision du PLU.\n  Le règlement de la zone AU est complété par le titre I présentant les dispositions générales et le titre II du\n  présent règlement qui fixe les dispositions communes applicables à toutes les zones.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    82/103","   ZONE\nAU STRICTE\n   ARTICLE AU 1 -    OCCUPATIONS ET UTILISATION DU SOL INTERDITES\n   1.1   Sont interdites toutes formes de constructions et d’aménagement à l’exception de ceux soumis\n    à condition en AU2\n   ARTICLE AU 2 -    OCCUPATIONS ET UTILISATIONS DU SOL ADMISES SOUS CONDITIONS\n    PARTICULIERES\n   2.1   Les affouillements et exhaussements de sol à condition qu’ils respectent au moins l’une des\n    conditions suivantes :\n    -   que leur réalisation soit liée aux occupations ou utilisations admises dans le secteur,\n    -   qu’ils contribuent à l’amélioration de l’environnement et de l’aspect paysager,\n    -   qu’ils soient rendus nécessaires :\n    o   pour la recherche ou la mise en valeur d’un site ou de ses vestiges\n    archéologiques,\n    o   pour des raisons fonctionnelles (travaux d’infrastructures routières, de\n    transports collectifs, de circulation douce ou d’aménagement d’espace public)\n    ou de raccordement aux réseaux (aménagements hydrauliques, etc.).\n   ARTICLE AU 3 - CONDITIONS DE DESSERTE DES TERRAINS* PAR LES VOIES* PUBLIQUES OU\n    PRIVEES ET D’ACCES* AUX VOIES* OUVERTES AU PUBLIC\n   3.1   Se référer à l’article 3 des dispositions communes applicables à toutes les zones.\n   ARTICLE AU 4 -    CONDITIONS DE DESSERTES DES TERRAINS* PAR LES RESEAUX\n   PUBLICS\n   4.1    Se référer à l’article 4 des dispositions communes applicables à toutes les zones.\n   ARTICLE AU 5 -    SUPERFICIE MINIMALE DES TERRAINS*\n   5.1    Sans objet.\n   ARTICLE AU 6 -    IMPLANTATION DES CONSTRUCTIONS* PAR RAPPORT AUX VOIES* ET\n    EMPRISES PUBLIQUES*\n   6.1    Il n’est pas fixé de règle.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    83/103","   ZONE\nAU STRICTE\n   ARTICLE AU 7 -    IMPLANTATION DES CONSTRUCTIONS* PAR RAPPORT AUX LIMITES\n    SEPARATIVES*\n   7.1    Il n’est pas fixé de règle.\n   ARTICLE AU 8 -    IMPLANTATION DES CONSTRUCTIONS* LES UNES PAR RAPPORT AUX\n    AUTRES SUR UNE MEME PROPRIETE\n   8.1    Il n’est pas fixé de règle.\n   ARTICLE AU 9 -    EMPRISE AU SOL\n   9.1    Il n’est pas fixé de règle.\n   ARTICLE AU 10 -    HAUTEUR* MAXIMALE DES CONSTRUCTIONS*\n   10.1    Il n’est pas fixé de règle.\n   ARTICLE AU 11 -    ASPECT EXTERIEUR\n   11.1    Il n’est pas fixé de règle.\n   ARTICLE AU 12 -    STATIONNEMENT\n   12.1    Se référer à l’article 12 des dispositions communes applicables à toutes les zones.\n   ARTICLE AU 13 -    ESPACES LIBRES ET PLANTATIONS, ESPACES BOISES CLASSES\n   13.1    Espaces Boisés Classés\n   13.1.1    Les terrains* repérés au règlement graphique au titre d’Espaces Boisés Classés, en\n    application des dispositions des articles L113-1 et suivants du Code de l’Urbanisme sont à\n    conserver, à protéger ou à créer ;\n   13.1.2    Tout changement d’affectation ou tout mode d’occupation du sol de nature à compromettre la\n    conservation, la protection ou la création de boisements est interdit ;\n   13.1.3    Nonobstant toutes dispositions contraires, ce classement entraine le rejet de plein droit de la\n    demande d’autorisation de défrichement prévue à l’article L 311-1 du Code Forestier.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    84/103","   ZONE\nAU STRICTE\n   13.2.    Les espaces libres et plantations :\n   Obligation de planter :\n   13.2.1    Les espaces végétalisés, qu’ils soient de pleine terre* ou complémentaires*, doivent être\n    plantés à raison à minima d’une unité de plantation* par tranche entamée de 20 m² ;\n    Ainsi, pour un espace végétalisé de 200 m2, il est nécessaire de réaliser 10 unités de plantation* (200m2\n    P   P    P\n    / 20m2). Ces unités de plantation* doivent être réparties en panachant les différents types de plants\n    P    P   P\n    présents dans le tableau inclus dans la définition présente dans le titre II « Dispositions communes\n    applicables à toutes les zones », article 2 « Définitions et précisions sur l’application des règles » du\n    présent règlement. Par exemple, dans ce cas précis il peut être envisagé la plantation d’1 arbre de\n    moyen développement, celle d’un arbre de petit développement et d’une haie de 4 petits arbustes ((08)\n    + (1*4) + (1*2) + (4*1))= 10).\n   13.2.2    Les aires de stationnement non couvertes doivent être plantées à raison d’une unité de\n    plantation* pour une place de stationnement ;\n   13.2.3    Pour les aires de stationnement non couvertes de plus de 20 places, les plantations doivent\n    être regroupées en module de plantation*, à raison d’un module de plantation* par tranche\n    échue de 10 places de stationnement. Un module de plantation* sera constitué d’une fosse\n    de plantation unique comportant au minimum 10 unités de plantation*. Les modules de\n    plantation* doivent être répartis sur l’ensemble de l’aire de stationnement ;\n   13.2.4    La strate arbustive devra de préférence être composée d’un mix d’essences persistantes et\n    d’essences caduques.\n   13.2.5    Les espèces végétales seront préférentiellement choisies parmi la flore indigène du bassin\n    parisien selon la liste de recommandation présentée en annexe 2 du présent règlement, et\n    pour la commune de Magny-les-Hameaux, il est conseillé de respecter la palette végétale\n    présentée en annexe 1 du présent règlement.\n   13.2.6    Les espèces végétales invasives inscrites sur les listes I et II présentée en annexes 3 du\n    présent règlement sont interdites.\n   13.2.7    Aucun sol ne sera laissé nu. Les pieds d’arbres accueilleront une végétation herbacée et des\n    couvre-sols.\n   13.2.8    Les plantations doivent être adaptées au contexte dans lequel elles sont plantées pour assurer\n    leur bon développement. Il est conseillé de se reporter à la charte de l’arbre annexée au\n    présent règlement. Les plantations doivent être plantées en bonne intelligence avec le\n    voisinage et dans le respect des règles minimales du Code Civil. Il est conseillé de se reporter\n    à la note du CAUE 77 présentant « Les distances de plantation d’arbres sur le domaine privé »\n    annexé au présent règlement.\n   ARTICLE AU 14 -    COEFFICIENT D’OCCUPATION DU SOL\n   14.1.    Dispositions générales relatives au coefficient d’occupation du sol\n   Il n'est pas fixé de coefficient d’occupation du sol.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    85/103","ZONE\n  A\n  TITRE V : DISPOSITIONS PARTICULIERES\n    APPLICABLES A LA ZONE AGRICOLE\nIl s'agit des « secteurs de l’agglomération, équipés ou non, à protéger en raison du potentiel agronomique,\nbiologique ou économique des terres agricoles » (article R.151-22 du code de l'urbanisme). C'est un régime strict\net surveillé, seules les constructions* ou installations nécessaires aux services publics et à l'exploitation agricole\npeuvent y être autorisées.\nLe règlement de la zone A est complété par le titre I présentant les dispositions générales et le titre II du\nprésent règlement qui fixe les dispositions communes applicables à toutes les zones.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    86/103","ZONE\n  A\nARTICLE A 1 - OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\n1.1    Occupations et utilisations du sol interdites dans la zone A et tous ses secteurs\n1.1.1    Sont interdites toutes les occupations et utilisations du sol non mentionnées à l’article A 2.\n1.1.2    En-dehors des sites urbains constitués, toutes les constructions* et installations non\n    destinées aux exploitations agricoles sont interdites dans les périmètres situés à moins de\n    50 mètres des massifs boisés de plus de 100 hectares\nARTICLE A 2 - OCCUPATIONS ET UTILISATIONS DU SOL ADMISES SOUS CONDITIONS\n    PARTICULIERES\n2.1.    Dispositions générales\nDans la mesure où, par leur nature, leur importance ou leur aspect, elles ne portent pas atteinte ni à\nla préservation des sols agricoles et forestiers, ni à la sauvegarde des sites, milieux naturels et\npaysages sont autorisées, sous réserve de conditions particulières, les occupations et utilisations du\nsol suivantes :\n2.1.1   L’entretien, la réfection et la rénovation des constructions* régulièrement autorisée\n    existantes à la date d’approbation du présent PLUi ;\n2.1.2   Les constructions* et installations nécessaires aux services publics ou d’intérêt collectif, à\n    condition qu’elles soient compatibles avec l’exercice d’une activité agricole, pastorale ou\n    forestière.\n2.1.3   Le changement de destination des bâtiments anciennement à usage agricole, en particulier\n    des bâtiments repérés au règlement graphique au titre de l’article L151-19 du Code de\n    l’Urbanisme, qui ne répondent plus aux contraintes techniques de l’exploitation, à condition\n    qu’il ne compromette pas l’activité agricole, qu’il n’altère pas la qualité paysagère du site et\n    qu’il s’opère en faveur d’une activité support à l’activité agricole.\n2.2.    Occupations et utilisations du sol admises sous conditions en sus en zone A, à\n    l’exclusion du secteur Ap\nSont autorisées, sous réserve de conditions particulières, les occupations et utilisations du sol\nsuivantes :\n2.2.1   Les constructions* et installations nécessaires à l’exploitation agricole, équestre ou forestière\n    à condition de garantir leur bonne insertion dans le site ;\n2.2.2   Les constructions* qui ont pour support l’activité agricole : locaux de vente des produits de\n    l’exploitation, équipements d’accueil touristiques constituant un complément de l’exploitation,\n    à condition qu’elles soient directement nécessaires au fonctionnement de l’activité agricole,\n    qu’elles se situent sur la même unité foncière* et à moins de 40 mètres des bâtiments\n    d’exploitation ;\n2.2.3    Les constructions* et extension de construction à usage d’habitation à conditions qu’elles\nrespectent cumulativement les conditions suivantes :\n- qu’elles soient limitées à un total maximum de 200 m² de surface de plancher* dévolue au logement\npar unité d’exploitation,\n- qu’elles soient directement nécessaires au fonctionnement de l’activité agricole, l’exploitant en fera\nla démonstration,\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    87/103","ZONE\n  A\n- qu’elles soient regroupées (distance de moins de 40 m) avec les bâtiments d’exploitation qui\nrequièrent leur présence,\n- que leur intégration dans le grand paysage soit assurée.\nARTICLE A 3 - CONDITIONS DE DESSERTE DES TERRAINS* PAR LES VOIES* PUBLIQUES OU\n    PRIVEES ET D’ACCES* AUX VOIES* OUVERTES AU PUBLIC\nSe reporter à l’article 3 des dispositions communes applicables à toutes les zones.\nARTICLE A 4 - CONDITIONS DE DESSERTES DES TERRAINS* PAR LES RESEAUX PUBLICS\nSe reporter à l’article 4 des dispositions communes applicables à toutes les zones.\nARTICLE A 5 - SUPERFICIE MINIMALE DES TERRAINS*\nSans objet.\nARTICLE A 6 - IMPLANTATION DES CONSTRUCTIONS* PAR RAPPORT AUX VOIES* ET\n    EMPRISES PUBLIQUES*\n6.1.    Dispositions générales\n6.1.1    Le présent article s’applique aux voies* existantes et à créer. Ainsi, lorsqu’un emplacement\n    réservé est inscrit sur le terrain* en vue de la création ou de l’élargissement d’une voie* ou\n    d’un carrefour, la limite de l’emplacement réservé tient lieu d’alignement* pour l’application\n    du présent article ;\n6.1.2    Les constructions* doivent s’implanter en respectant un recul* de 10 mètres à partir de\n    l’alignement* des voies* départementales et de 6 mètres à partir de l’alignement* des autres\n    voies* ;\n6.1.3    Des dispositions différentes peuvent être admises pour les constructions* annexes* d’une\n    hauteur* totale inférieure à 3,50 mètres et les dispositifs techniques (type transformateur\n    EDF).\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    88/103","ZONE\n  A\nARTICLE A 7 - IMPLANTATION    DES   CONSTRUCTIONS*    PAR    RAPPORT    AUX    LIMITES\n    SEPARATIVES*\n7.1.    Dispositions générales\n7.1.1    La distance est calculée de la limite séparative* au plan des façades* tous débords et\n    surplomb exclus.\n7.1.2    Les constructions* peuvent s’implanter :\n    −    Soit en limite(s) séparative(s)* ;\n    −    Soit en retrait*.\n7.1.3    Les constructions* qui ne s’implantent pas en limite séparative*, doivent être implantées\n    avec un retrait* minimal égal à la moitié de la hauteur* de la façade* (L=h/2) avec un\n    minimum de 5 mètres ;\n7.1.4    Le présent article ne s’applique pas aux constructions* annexes* présentant une hauteur*\n    totale inférieure ou égale à 3,50 mètres.\nARTICLE A 8 - IMPLANTATION DES CONSTRUCTIONS* LES UNES PAR RAPPORT AUX\n    AUTRES SUR UNE MEME PROPRIETE\n8.1    Il n’est pas fixé de règle.\nARTICLE A 9 - EMPRISE AU SOL\n9.1    Il n’est pas fixé de règle.\nARTICLE A 10 -    HAUTEUR* MAXIMALE DES CONSTRUCTIONS*\n10.1.    Dispositions générales\n10.1    La hauteur* maximale des constructions* et installations nécessaires aux exploitations\n    agricoles ou équestres ne pourra excéder 12 mètres au point le plus haut de la construction*\n    (H) ;\n10.2    La hauteur* maximale des constructions* d’habitation ne pourra excéder 7 mètres à l’égout\n    du toit ou au pied de l’acrotère* des toitures terrasses (h) ;\n10.3    Il n’est pas fixé de règle pour l’implantation des constructions* et installations nécessaires\n    aux services publics ou d’intérêt collectif.\nARTICLE A 11 -    ASPECT EXTERIEUR\n11.1.    Dispositions générales\n11.1.1   Nonobstant les dispositions du présent article, le projet peut être refusé ou n'être accepté\n    que sous réserve de l'observation de prescriptions spéciales pour les constructions* ou\n    installations ne présentant pas d’unité d’aspect, ni de réel équilibre dans le jeu des volumes,\n    dans le rythme et les proportions des percements, dans la modénature et dans la coloration\n    des parements de façades*.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    89/103","ZONE\n  A\n11.1.2   Les constructions* doivent être adaptées par leur type ou leur conception à la topographie\n    du terrain* et non l’inverse.\n11.1.3   Les locaux techniques (locaux poubelles, boîtes aux lettres, bornes techniques, etc …)\n    doivent être intégrés dans la construction* ou un mur de clôture*.\n11.1.4   Les emplacements destinés aux déchets doivent être masqués depuis la voie* publique.\n11.1.5   Les constructions* et installations nécessaires aux services publics ou d’intérêt collectif ne\n    sont pas soumises à ces dispositions.\n11.2    Façades*\n11.2.1   Les nouvelles constructions* doivent utiliser des matériaux de qualité et présenter une\n    bonne qualité architecturale. D’une manière générale, les matériaux mis en œuvre doivent\n    être compatibles avec l’architecture des bâtiments et doivent permettre un vieillissement\n    correct de l’ouvrage ;\n11.2.2   Le revêtement des façades* doit être pensé en harmonie avec celui des constructions*\n    avoisinantes ou faire l’objet d’une composition qui s’intègre à l’environnement. Les teintes\n    choisies devront s’appuyer de préférence sur le nuancier présenté en annexe 1 du présent\n    règlement ;\n11.2.3   L’ensemble de la construction*, y compris les ouvrages techniques ainsi que les façades*\n    latérales et arrières, doivent être traités avec le même soin que la façade* principale et en\n    harmonie avec elle (matériaux, couleurs, nature des parements, etc.) ;\n11.2.4   L’emploi à nu des matériaux destinés à être recouvert est interdit.\n11.3    Toitures\n11.3.1   Les toitures des constructions* devront présenter une simplicité de volume et une unité de\n    conception ;\n11.3.2   Pour éviter les effets de toiture importants, les combles* ne pourront abriter qu’un seul\n    niveau* aménageable ;\n11.3.3   Les toitures terrasses sont autorisées à condition de faire l’objet d’un traitement de finition\n    particulièrement soigné.\n11.4    Clôtures*\n11.4.1   La hauteur des clôtures* ne doit pas excéder 2 mètres. Toutefois des hauteurs supérieures\n    peuvent être autorisées :\n    −    Pour permettre la reconstruction à l’identique de clôtures* anciennes présentant un\n    intérêt d’aspect ;\n    −    Pour des raisons de sécurité liées au fonctionnement des activités ou des\n    équipements. Une note argumentée, explicitant les motifs et les intentions, devra\n    être réalisée pour pouvoir déroger à la règle ;\n11.4.2   Les clôtures* et les éléments entrant dans leur composition, tels que les murs, portes,\n    portails, grilles ou balustrades, doivent présenter une cohérence d’aspect avec la\n    construction* et être conçus avec simplicité en évitant les éléments d’aspect précaire, de\n    caractère insolite ou trop recherché ;\n11.4.3   Les clôtures* en limite des voies* publiques ou privées et emprises publiques*, seront\n    composées soit :\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    90/103","ZONE\n  A\n    −    d’un muret, surmonté d’un dispositif ajouré sur toute sa hauteur, et doublé ou non\n    d’une haie. En ce cas la partie pleine fera un tiers de la hauteur totale.\n    −    d’un dispositif ajouré sur toute sa hauteur, doublé ou non d’une haie ;\n    −    d’une haie.\n11.4.4   En limite séparative*, les clôtures* seront de préférence constituées d’un grillage doublé\n    d’une haie. Il est recommandé de prévoir des ouvertures au niveau du sol, pour faciliter les\n    déplacements de la petite faune.\n11.4.5 Les haies seront constituées de préférence par des essences locales et plurispécifiques\n    mentionnées au sein de la palette végétale présentée en annexe 1 du présent règlement,\n    doublée ou non d’un grillage de couleur foncée.\n11.5    Bâtiments annexes*\n11.5.1   Les bâtiments annexes* doivent faire l’objet d’un soin particulier dans leur implantation par\n    rapport à la construction* principale et au traitement paysager de la parcelle ;\n11.5.2   Les bâtiments annexes* seront de préférence recouverts d’un matériau présentant une\n    homogénéité de teinte et de matières avec la construction* principale. D’une manière\n    générale, les matériaux mis en œuvre doivent permettre un vieillissement correct de\n    l’ouvrage.\n11.6    Éléments techniques\n11.6.1   Les antennes paraboliques doivent être intégrées au site par tous moyens adaptés et ne\n    pas dépasser du faîtage pour les toitures à pente(s) de manière à en réduire l’impact visuel\n    depuis les voies* publiques et privées. La pose d’antenne est interdite en saillie* des\n    balcons et des façades*.\n11.6.2   Les éléments des dispositifs de production d’énergie solaire (panneaux, tuiles, etc.) ainsi\n    que tous dispositifs de production d’énergie renouvelable* sont encouragés à condition\n    d’être intégrés de manière harmonieuse à la construction* ;\n11.6.3   Les boîtes aux lettres et les coffrets techniques devront être intégrés dans les\n    constructions* ou dans les murs de clôture*.\nARTICLE A 12 -    STATIONNEMENT\n12.1    Se reporter à l’article 12 des dispositions communes applicables à toutes les zones\n12.2    Pour les aires de stationnement réalisées à l’air libre, un revêtement limitant\n    l’imperméabilisation, devra être privilégié.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    91/103","ZONE\n  A\nARTICLE A 13 -    ESPACES LIBRES ET PLANTATIONS, ESPACES BOISES CLASSES\n13.1    Espaces Boisés Classés\n13.1.1   Les terrains* repérés au règlement graphique au titre d’Espaces Boisés Classés, en\n    application des dispositions des articles L113-1 et suivants du Code de l’Urbanisme sont à\n    conserver, à protéger ou à créer ;\n13.1.2   Tout changement d’affectation ou tout mode d’occupation du sol de nature à compromettre\n    la conservation, la protection ou la création de boisements est interdit ;\n13.1.3   Nonobstant toutes dispositions contraires, ce classement entraine le rejet de plein droit de\n    la demande d’autorisation de défrichement prévue à l’article L 311-1 du Code Forestier.\n13.2.    Les espaces libres et plantations :\nObligation de planter :\n13.2.1   Les aires de stationnement non couvertes doivent être plantées à raison de deux unités de\n    plantation pour une place de stationnement ;\n13.2.2   Pour les aires de stationnement non couvertes de plus de 10 places, les plantations doivent\n    être regroupées en module de plantation*, à raison d’un module de plantation* par tranche\n    échue de 5 places de stationnement. Un module de plantation* sera constitué d’une fosse\n    de plantation unique comportant au minimum 10 unités de plantation*. Les modules de\n    plantation* doivent être répartis sur l’ensemble de l’aire de stationnement ;\n13.2.3   La strate arbustive devra de préférence être composée d’un mix d’essences persistantes\n    et d’essences caduques.\n13.2.4   Les espèces végétales seront préférentiellement choisies parmi la flore indigène du bassin\n    parisien selon la liste de recommandation présentée en annexe 2 du présent règlement, et\n    pour la commune de Magny-les-Hameaux, il est conseillé de respecter la palette végétale\n    présentée en annexe 4 du présent règlement.\n13.2.5   Les espèces végétales invasives inscrites sur les listes I et II présentée en annexe 3 du\n    présent règlement sont interdites.\n13.2.6   Aucun sol ne sera laissé nu. Les pieds d’arbres accueilleront une végétation herbacée et\n    des couvre-sols.\n13.2.7   Les plantations doivent être adaptées au contexte dans lequel elles sont plantées pour\n    assurer leur bon développement. Il est conseillé de se reporter à la charte de l’arbre\n    annexée au présent règlement.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    92/103","    TITRE VI : DISPOSITIONS PARTICULIERES\n    APPLICABLES A LA ZONE NATURELLE\nLes zones naturelles et forestières, dites « zones N » : ce sont les « secteurs de la commune, équipés ou non, à\nprotéger en raison soit de la qualité des sites, des milieux naturels, des paysages et de leur intérêt, notamment du\npoint de vue esthétique, historique ou écologique, soit de l'existence d'une exploitation forestière, soit de leur caractère\nd'espaces naturels, soit de la nécessité de préserver ou de restaurer les ressources naturelles, soit de la nécessité de\nprévenir les risques notamment d’expansion des crues » (article R. 151-24 du code de l'urbanisme).\nLe règlement de la zone N est complété par le titre I présentant les dispositions générales et le titre II du présent\nrèglement qui fixe les dispositions communes applicables à toutes les zones.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    93/103","ARTICLE N 1 - OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\n1.1    Occupations et utilisations du sol interdites en zone N et dans tous les secteurs Ne et Nh\n    (STECAL*)\n1.1.1    Sont interdites toutes les occupations et utilisations du sol non mentionnées à l’article N 2.\n1.1.2    En-dehors des sites urbains constitués, toutes les constructions* et installations sont interdites\n    dans les périmètres situés à moins de 50 mètres des massifs boisés de plus de 100 hectares\nARTICLE N 2 - OCCUPATIONS    ET   UTILISATIONS    DU   SOL   ADMISES    SOUS    CONDITIONS\n    PARTICULIERES\n2.1    Dispositions générales\n    Dans la mesure où, par leur nature, leur importance ou leur aspect, elles ne portent pas atteinte ni à\n    la préservation des sols agricoles et forestiers, ni à la sauvegarde des sites, milieux naturels et\n    paysages sont autorisées, sous réserve de conditions particulières, les occupations et utilisations du\n    sol suivantes :\n2.1.1    Les constructions* et installations à condition qu’elles soient nécessaires à l’exploitation agricole\n    et forestière ;\n2.1.2    Les travaux d’extension* des bâtiments d’habitation existants à condition que le projet ne\n    conduise pas à une augmentation de plus de 20 m2 de la surface de plancher* existante à la date\n    P   P\n    d’approbation du PLUi;\n2.1.3    Le changement de destination des bâtiments repérés au règlement graphique au titre de l’article\n    L151-19 du Code de l’Urbanisme à condition qu’il ne compromette pas l’activité agricole et qu’il\n    n’altère pas la qualité paysagère du site ;\n2.1.4    Les constructions*, installations et ouvrages techniques liés aux réseaux de transport d’énergie,\n    d’eau et télécommunication à condition de garantir leur bonne insertion dans le site ;\n2.1.5    Dans les secteurs repérés aux documents graphiques, comme jardins familiaux, les\n    constructions* liées aux activités de jardinage et maraîchage à condition que leur surface de\n    plancher* soit inférieure à 5 m² et leur hauteur* totale soit inférieure à 3 m, un local commun à\n    condition que sa surface de plancher* soit inférieure à 20 m² est également autorisée.\n2.1.6    L’entretien, la réfection et la rénovation des constructions* régulièrement autorisées existantes à\n    la date d’approbation du présent PLUi ;\n2.1.7    Les constructions et installations du réseau de transport public du Grand Paris à condition de\n    garantir leur bonne insertion dans le site.\n2.2    Occupations et utilisations du sol admises sous conditions dans tous les secteurs Ne :\n2.2.1    Les constructions* et installations nécessaires aux services publics ou d’intérêt collectif ainsi que\n    les constructions* accessoires nécessaires à leur fonctionnement, à condition qu’elles ne soient\n    pas incompatibles avec l’exercice d’une activité agricole, pastorale ou forestière et qu’elles ne\n    portent pas atteinte à la sauvegarde des espaces naturels et des paysages ;\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    94/103","   En sus des conditions ci-dessus le tableau ci-après précise la localisation et la destination de chacun des\n   secteurs Ne ainsi que les conditions spécifiques pour chacun d’eux.\nNuméro    Destination    Condition\n    Commune    L torisés dans le secteur dans une limite de 90 m²\n    de surface de plancher* par logement.\n   2.3    Occupation et utilisations du sol admises sous conditions dans les secteurs Nh\n    (STECAL*) :\n   2.3.1    Pour le secteur NhEL01\n    Sont autorisées les constructions* à usage d’habitation et d’activités liées à la vocation de la zone, à\n    condition de leur parfaite insertion dans le site, de s’inscrire dans les emprises des ruines des anciens\n    bâtiments présents sur le site et dans la limite de 900 m² de surface de plancher*.\n   2.3.2    Pour le secteur NhMB02\n    Sont autorisées à condition qu’elles ne soient pas incompatibles avec l’exercice d’une activité agricole,\n    pastorale ou forestière et qu’elles ne portent pas atteinte à la sauvegarde des espaces naturels et des\n    paysages et dans la limite de 9500 m² de surface de plancher* :\n    -    les constructions* et installations nécessaires aux services publics ou d’intérêt collectif ainsi que les\n    constructions* accessoires nécessaires à leur fonctionnement,\n    -    les constructions* et installations liées à l’activité du camping (commerces, activités, mobil home,\n    sanitaire, …) de l’Ile de Loisirs. Il s’agit de rénover le camping existant et lui permettre d’accueillir entre\n    300 et 400 emplacements.\n    -    Les constructions* à destination d’habitation, dans la limite d’une surface de plancher* de 90 m², à\n    condition qu’elles caractérisent une fonction de gardiennage, accessoire et directement nécessaire à\n    l’activité du terrain de camping.\n   ARTICLE N 3 - CONDITIONS DE DESSERTE DES TERRAINS* PAR LES VOIES* PUBLIQUES OU\n    PRIVEES ET D’ACCES* AUX VOIES* OUVERTES AU PUBLIC\n   Se reporter à l’article 3 des dispositions communes applicables à toutes les zones.\n   ARTICLE N 4 - CONDITIONS DE DESSERTES DES TERRAINS* PAR LES RESEAUX PUBLICS\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    97/103","Se reporter à l’article 4 des dispositions communes applicables à toutes les zones.\nARTICLE N 5 - SUPERFICIE MINIMALE DES TERRAINS*\nSans objet.\nARTICLE N 6 - IMPLANTATION DES CONSTRUCTIONS* PAR RAPPORT AUX VOIES* ET EMPRISES\n    PUBLIQUES*\n6.1.    Dispositions applicables dans les secteurs N, Ne et Nh\n6.1.1    Sauf dispositions particulières portées aux documents graphiques, le plan des façades* des\n    constructions* doit être implanté avec un recul* au moins égal à la hauteur* des bâtiments par\n    rapport à l’alignement* des voies* avec un minimum de 10 mètres par rapport aux routes\n    départementales, de 15 mètres par rapport à l’avenue des Garennes et de 6 mètres par rapport\n    aux autres voies* ;\n6.1.2    Des dispositions différentes peuvent être admises pour les constructions* annexes* dont la\n    hauteur* totale est inférieure à 3,50 mètres sous réserve de ne pas générer de nuisances\n    particulières notamment au regard de la sécurité routière.\nARTICLE N 7 - IMPLANTATION    DES    CONSTRUCTIONS*   PAR    RAPPORT    AUX    LIMITES\n    SEPARATIVES*\n7.1.    Dispositions générales\n7.1.1    Les constructions* peuvent s’implanter :\n    −    Soit en limite(s) séparative(s)* ;\n    −    Soit en retrait*.\n7.1.2    Pour les constructions* qui ne s’implantent pas en limite séparative*, elles doivent respecter :\n    −    un retrait* au moins égal à la moitié de la hauteur* de la façade* de la construction*\n    avec un minimum de 6 mètres par rapport aux limite(s) séparative(s)* ;\n7.1.3    Le présent article ne s’applique pas aux constructions* annexes* présentant une hauteur* totale\n    inférieure ou égale à 2,50 mètres et une emprise au sol inférieure à 15 m².\n7.1.4    Le présent article ne s’applique pas aux ouvrages techniques tels que les transformateurs.\n7.2.    Dispositions spécifiques applicables aux secteurs Ne et Nh\n7.2.1    Les constructions* doivent être implantées à un retrait* au moins égal à la moitié de la hauteur*\n    de la construction* avec un minimum de 6 mètres par rapport aux limite(s) séparative(s)* ou de\n    la limite du secteur Ne ou Nh.\nARTICLE N 8 - IMPLANTATION DES CONSTRUCTIONS* LES UNES PAR RAPPORT AUX AUTRES\n    SUR UNE MEME PROPRIETE\n8.1.    Dispositions générales applicables aux secteurs N, Ne et Nh\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    98/103","   8.1.1    Les constructions* non contiguës implantées sur une même unité foncière* devront respecter une\n    marge de retrait* au moins égale à la moitié de la hauteur* de la façade* de la construction* la\n    plus haute, avec un minimum de 5 m.\n   8.1.2    Le présent article ne s’applique pas aux constructions* annexes* et aux abris des jardins\n    familiaux.\n   ARTICLE N 9 - EMPRISE AU SOL\n   9.1.    Dispositions générales\n   9.1.1    Les extensions* des constructions* existantes à la date d’approbation du PLUi ne devront pas\n    conduire à une augmentation de plus de 20 m2 de la surface de plancher* totale (dans la limite\n    P   P\n    d’une seule extension* possible) ;\n   9.1.2    L’emprise au sol maximale autorisée pour les abris de jardin* ne peut excéder 10 m² de surface,\n    à raison d’un abri maximum par jardin.\n   9.2.    Dispositions applicables à la zone N à l’exclusion des secteurs Ne et Nh\n   9.2.1    L’emprise au sol maximale des constructions* ne peut excéder 10% de l’unité foncière* dans\n    laquelle elle se situe ;\n   9.3.    Dispositions spécifiques applicables aux secteurs Ne et Nh à l’exclusion de la zone N\n   9.3.1    L’emprise au sol maximale des constructions* ne peut excéder 15% de l’emprise délimitée par\n    le secteur Ne ou Nh dans laquelle l’emprise foncière se situe.\n   ARTICLE N 10 -    HAUTEUR* MAXIMALE DES CONSTRUCTIONS*\n   10.1.    Dispositions générales applicable dans les secteurs N et Ne\n   10.1    La hauteur* maximale des constructions* et installations nécessaires aux exploitations agricoles\n    ou équestres ne pourra excéder 12 mètres au point le plus haut de la construction* ;\n   10.2    La hauteur* maximale des façades* des constructions* d’habitation ne pourra excéder 7\n    mètres ;\n   10.3    Les hauteurs* pour l’implantation des constructions* et installations nécessaires aux services\n    publics ou d’intérêt collectif et locaux accessoires est définie par sous-secteur Ne selon le\n    tableau ci-après :\nNuméro Ne    Commune    Localisation    Hauteur maximale autorisée\n NeEL01    Élancourt    Colline    La hauteur* totale (H) est limitée à 13 mètres\n NeEL02    Élancourt    Colline    La hauteur* totale (H) est limitée à 13 mètres\n Ne EL03    Élancourt    Villedieu    La hauteur* totale (H) est limitée à 13 mètres\n NeEL04    Élancourt    Fondation Méquignon    La hauteur* totale (H) est limitée à 13 mètres\n    Ouest du secteur des IV    La hauteur* totale (H) est limitée à 13 mètres\n NeEL05    Élancourt\n    Arbres\n NeGU01    Guyancourt    Golf National    La hauteur* de façade* (h) est limitée à 6 mètres\n    Ouest du secteur de la Petite    La hauteur* de façade* (h) est limitée à 10 mètres\n NeGU02    Guyancourt\n    Minière\n NeGU03    Guyancourt    Commanderie    La hauteur* de façade* (h) est limitée à 6 mètres\n NeGU04    Guyancourt    Entrée est Bois de la Grille    La hauteur* de façade* (h) est limitée à 6 mètres\n    La hauteur* totale maximale autorisée est celle du\n NeMH01    Magny    Port Royal\n    bâtiment le plus haut existant dans le secteur\n    La hauteur* totale maximale autorisée est celle du\n NeMH02    Magny    Port Royal\n    bâtiment le plus haut existant dans le secteur\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    99/103","Numéro Ne    Commune    Localisation    Hauteur maximale autorisée\n NeMH04    Magny    Golf National    La hauteur* de façade* (h) est limitée à 13 mètres\n NeMH05    Magny    Étang de Romainville    La hauteur* de façade* (h) est limitée à 5 mètres\n    La hauteur* totale maximale autorisée est celle du\n NeMH06    Magny    Croix du Bois\n    bâtiment le plus haut existant dans le secteur\n    La hauteur* totale maximale autorisée est celle du\n NeMH07    Magny    Mérantais\n    bâtiment le plus haut existant dans le secteur\n    La hauteur* totale maximale autorisée est celle du\nNe MB01    Montigny    Ile de Loisirs\n    bâtiment le plus haut existant dans le secteur\n    Sud commune et sud-est du    La hauteur* totale maximale autorisée est celle du\nNe MB04    Montigny\n    Manet    bâtiment le plus haut existant dans le secteur\n    La hauteur* totale maximale autorisée est celle du\nNe MB05    Montigny    Ile de Loisirs\n    bâtiment le plus haut existant dans le secteur\n NeTR01    Trappes    Ile de Loisirs    La hauteur* totale (H) est limitée à 15 mètres\n    La hauteur* totale maximale autorisée est celle du\n NeTR02    Trappes    Ile de Loisirs\n    bâtiment le plus haut existant dans le secteur\n    La hauteur* totale maximale autorisée est celle du\n NeTR03    Trappes    Ile de Loisirs\n    bâtiment le plus haut existant dans le secteur\n    La hauteur* totale maximale autorisée est celle du\n NeTR04    Trappes    Ile de Loisirs\n    bâtiment le plus haut existant dans le secteur\n    La hauteur* totale maximale autorisée est celle du\n NeTR05    Trappes    Ile de Loisirs\n    bâtiment le plus haut existant dans le secteur\n NeTR06    Trappes    Ile de Loisirs    La hauteur* totale (H) est limitée à 3 mètres\n    La hauteur* totale maximale autorisée est celle du\n NeTR07    Trappes    Ile de Loisirs\n    bâtiment le plus haut existant dans le secteur\n    La hauteur* totale maximale autorisée est celle du\n NeTR08    Trappes    Ile de Loisirs\n    bâtiment le plus haut existant dans le secteur\n   10.2.    Dispositions applicables aux seuls secteurs Nh / STECAL* :\n   10.2.1   Pour le secteur NhEL01\n    La hauteur* maximale autorisée est de 9 mètres au point le plus haut de la construction* (H) et de 7 mètres\n    à l’égout du toit ou au pied de l’acrotère* des toits terrasses (h).\n   10.2.2   Pour le secteur NhMB02\n    La hauteur* maximale des nouvelles constructions* ne pourra pas dépasser la hauteur* des bâtiments\n    existants dans le secteur à la date d’approbation du présent PLUi.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    100/103","ARTICLE N 11 -    ASPECT EXTERIEUR\n11.1.    Dispositions générales\n11.1.1   Nonobstant les dispositions du présent article, le projet peut être refusé ou n'être accepté que\n    sous réserve de l'observation de prescriptions spéciales pour les constructions* ou installations\n    ne présentant pas d’unité d’aspect, ni de réel équilibre dans le jeu des volumes, dans le rythme\n    et les proportions des percements, dans la modénature et dans la coloration des parements de\n    façades*.\n11.1.2   Les constructions* doivent être adaptées par leur type ou leur conception à la topographie du\n    terrain* et non l’inverse.\n11.1.3   Les locaux techniques (locaux poubelles, boîtes aux lettres, bornes techniques, etc …) doivent\n    être intégrés dans la construction* ou un mur de clôture*.\n11.1.4   Les emplacements destinés aux déchets doivent être masqués depuis la voie* publique.\n11.1.5   Les constructions* et installations nécessaires aux services publics ou d’intérêt collectif ne sont\n    pas soumises à ces dispositions.\n11.2    Façades*\n11.2.1   Les nouvelles constructions* doivent utiliser des matériaux de qualité et présenter une bonne\n    qualité architecturale. D’une manière générale, les matériaux mis en œuvre doivent être\n    compatibles avec l’architecture des bâtiments et doivent permettre un vieillissement correct de\n    l’ouvrage ;\n11.2.2   Le revêtement des façades* doit être pensé en harmonie avec celui des constructions*\n    avoisinantes ou faire l’objet d’une composition qui s’intègre à l’environnement. Les teintes\n    choisies devront s’appuyer de préférence sur le nuancier présenté en annexe 1 du présent\n    règlement ;\n11.2.3   L’ensemble de la construction*, y compris les ouvrages techniques ainsi que les façades*\n    latérales et arrières, doivent être traités avec le même soin que la façade* principale et en\n    harmonie avec elle (matériaux, couleurs, nature des parements, etc.) ;\n11.2.4   L’emploi à nu des matériaux destinés à être recouvert est interdit.\n11.2.5   Les éventuelles baies vitrées de grandes dimensions devront être composées de verres peu\n    réfléchissants : colorés, sérigraphiés ou translucides sur au moins 25 % de leur surface\n11.3    Toitures\n11.3.1   Les toitures des constructions* devront présenter une simplicité de volume et une unité de\n    conception ;\n11.3.2   Pour éviter les effets de toiture importants, les combles* ne pourront abriter qu’un seul niveau*\n    aménageable ;\n11.3.3   Les toitures terrasses sont autorisées à condition de faire l’objet d’un traitement de finition\n    particulièrement soigné.\n11.3.4   Les éventuelles baies vitrées de grandes dimensions devront être composées de verres peu\n    réfléchissants : colorés, sérigraphiés ou translucides sur au moins 25 % de leur surface.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    101/103","11.4    Clôtures*\n11.4.1   La hauteur des clôtures* ne doit pas excéder 2 mètres. Toutefois des hauteurs supérieures\n    peuvent être autorisées :\n    −   Pour permettre la reconstruction à l’identique de clôtures* anciennes présentant un\n    intérêt d’aspect ;\n    −   Pour des raisons de sécurité liées au fonctionnement des activités ou des équipements.\n    Une note argumentée, explicitant les motifs et les intentions, devra être réalisée pour\n    pouvoir déroger à la règle ;\n11.4.2   Les clôtures* et les éléments entrant dans leur composition, tels que les murs, portes, portails,\n    grilles ou balustrades, doivent présenter une cohérence d’aspect avec la construction* et être\n    conçus avec simplicité en évitant les éléments d’aspect précaire, de caractère insolite ou trop\n    recherché ;\n11.4.3   Les clôtures* en limite des voies* publiques ou privées et emprises publiques* seront\n    composées soit :\n    −   d’un muret, surmonté d’un dispositif ajouré sur toute sa hauteur, et doublé ou non d’une\n    haie. En ce cas la partie pleine fera un tiers de la hauteur totale.\n    −   d’un dispositif ajouré sur toute sa hauteur, doublé ou non d’une haie ;\n    −   d’une haie.\n11.4.4   En limite séparative*, les clôtures* seront de préférence constituées d’un grillage doublé d’une\n    haie. Il est recommandé de prévoir des ouvertures au niveau du sol, pour faciliter les\n    déplacements de la petite faune.\n11.4.5 Les haies seront constituées de préférence par des essences locales et plurispécifiques\n    mentionnées au sein de la palette végétale présenté en annexe 2 et 4 du présent règlement,\n    doublée ou non d’un grillage de couleur foncée.\n11.5    Bâtiments annexes*\n11.5.1   Les bâtiments annexes* doivent faire l’objet d’un soin particulier dans leur implantation par\n    rapport à la construction* principale et au traitement paysager de la parcelle ;\n11.5.2   Les bâtiments annexes* seront de préférence recouverts d’un matériau présentant une\n    homogénéité de teinte et de matières avec la construction* principale. D’une manière générale,\n    les matériaux mis en œuvre doivent permettre un vieillissement correct de l’ouvrage.\n11.6    Éléments techniques\n11.6.1   Les antennes paraboliques doivent être intégrées au site par tous moyens adaptés et ne pas\n    dépasser du faîtage pour les toitures à pente(s)* de manière à en réduire l’impact visuel depuis\n    les voies* publiques et privées. La pose d’antenne est interdite en saillie* des balcons et des\n    façades*.\n11.6.2   Les éléments des dispositifs de production d’énergie solaire (panneaux, tuiles, etc.) ainsi que\n    tous dispositifs de production d’énergie renouvelable* sont encouragés à condition d’être\n    intégrés de manière harmonieuse à la construction* ;\n11.6.3   Les boîtes aux lettres et les coffrets techniques devront être intégrés dans les constructions* ou\n    dans les murs de clôture*.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    102/103","ARTICLE N 12 –    STATIONNEMENT\n12.1    Se reporter à l’article 12 des dispositions communes applicables à toutes les zones ;\n12.2    Pour les aires de stationnement réalisées à l’air libre,    un   revêtement    limitant\nl’imperméabilisation, de type dalles engazonnées, devra être privilégié.\nARTICLE N 13 -    ESPACES LIBRES ET PLANTATIONS, ESPACES BOISES CLASSES\n13.1    Espaces Boisés Classés\n13.1.1   Les terrains* repérés au règlement graphique au titre d’Espaces Boisés Classés, en application\n    des dispositions des articles L113-1 et suivants du Code de l’Urbanisme sont à conserver, à\n    protéger ou à créer ;\n13.1.2   Tout changement d’affectation ou tout mode d’occupation du sol de nature à compromettre la\n    conservation, la protection ou la création de boisements est interdit ;\n13.1.3   Nonobstant, toutes dispositions contraires, ce classement entraine le rejet de plein droit de la\n    demande d’autorisation de défrichement prévue à l’article L 311-1 du Code Forestier.\n13.2.    Les espaces libres et plantations :\nObligation de planter :\n13.2.1   Les aires de stationnement non couvertes doivent être plantées à raison de deux unités de\n    plantation* pour une place de stationnement ;\n13.2.2   Pour les aires de stationnement non couvertes de plus de 10 places, les plantations doivent\n    être regroupées en module de plantation*, à raison d’un module de plantation* par tranche\n    échue de 5 places de stationnement. Un module de plantation* sera constitué d’une fosse de\n    plantation unique comportant au minimum 10 unités de plantation*. Les modules de plantation*\n    doivent être répartis sur l’ensemble de l’aire de stationnement ;\n13.2.3   La strate arbustive devra de préférence être composée d’un mix d’essences persistantes et de\   <div class="pj-cols"><div class="box"><h3>Trámite</h3><ul>${P.tramite.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="box"><h3>Antes de leer el reglamento</h3><ul>${P.antes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
  ${zsel}
  <div class="pj-bar"><div class="pj-prog"><i style="width:${total?Math.round(done*100/total):0}%"></i></div><span style="font-size:13px">${done} de ${total} revisados</span><button id="pjReset">Desmarcar todo</button><button onclick="print()">Imprimir</button></div>
  <div class="warn">La lista se genera por tema a partir del índice del reglamento. Confirma siempre en el texto y en el plano de zonificación; algunos artículos tratan varios temas a la vez.</div>
  ${groups}`;
  $('#main').querySelectorAll('[data-z]').forEach(e=>e.onclick=()=>{zone=e.dataset.z; store.set('zone',zone); renderFilters(); renderTree(); viewProy(id)});
  $('#main').querySelectorAll('[data-ck]').forEach(e=>e.onchange=()=>{const c=checks[id]=checks[id]||{}; if(e.checked) c[e.dataset.ck]=1; else delete c[e.dataset.ck]; store.set('checks',checks); viewProy(id)});
  $('#pjReset').onclick=()=>{checks[id]={}; store.set('checks',checks); viewProy(id)};
}
function viewTemas(th){
  const list=DATA.themes.map(([k,l])=>`<a class="chip ${k===th?'on':''}" href="#temas/${k}">${esc(l)} (${secsFor(k).length})</a>`).join(' ');
  let body='';
  if(th){
    const ss=secsFor(th).filter(s=>!zone||!s.z||s.z===zone);
    body=`<h2 style="font-size:18px">${esc(TH[th])}${zone?' · zona '+esc(zone):''}</h2>`+(ss.map(s=>`<div class="r" onclick="location.hash='#s/${s.i}'"><span class="cd">p. ${s.p}</span>${esc(s.t)} ${s.z?`<span class="chip">${esc(s.z)}</span>`:''}<div class="sn">${esc(crumb(s).replace(/<[^>]+>/g,''))}</div></div>`).join('')||'<div class="empty">Ninguna sección del índice. Prueba el buscador.</div>');
  }
  $('#main').innerHTML=`<h1 class="st">Por tema</h1><p>Secciones del reglamento agrupadas por tema (según su título).${DATA.zones.length?' Si eliges tu zona en el panel izquierdo, se ocultan las de otras zonas.':''}</p><div class="th-l" style="margin-bottom:14px">${list}</div><div class="results">${body}</div>`;
}
function secOfPage(p){let best=null;S.forEach(s=>{if(s.p<=p&&(!best||s.p>=best.p))best=s});return best}
function viewSearch(q){
  const nq=norm(q).trim(); if(nq.length<2){viewHome();return}
  const terms=nq.split(/\s+/);
  const res=[];
  const tit=S.filter(s=>terms.every(t=>norm(s.t).includes(t)));
  for(let i=0;i<DATA.pages.length&&res.length<300;i++){
    const np=NP[i]; if(terms.every(t=>np.includes(t))){
      const j=np.indexOf(terms[0]); const raw=DATA.pages[i]; const a=Math.max(0,j-90);
      res.push({p:i+1,sn:raw.slice(a,a+260).replace(/\s+/g,' ')});
    }
  }
  const hl=t=>{let h=esc(t);terms.forEach(x=>{if(x.length<2)return;const re=new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');h=h.replace(re,m=>`<mark>${m}</mark>`)});return h};
  $('#main').innerHTML=`<h1 class="st">Resultados para «${esc(q)}»</h1>
  ${tit.length?`<div class="box"><h3>En títulos de secciones (${tit.length})</h3>${tit.slice(0,40).map(s=>`<div class="r" onclick="location.hash='#s/${s.i}'"><span class="cd">p. ${s.p}</span>${esc(s.t)}</div>`).join('')}</div>`:''}
  <div class="results"><h3 style="font-size:14px;color:var(--muted)">EN EL TEXTO: ${res.length}${res.length>=300?'+':''} páginas</h3>${res.map(r=>{const s=secOfPage(r.p);return `<div class="r" data-p="${r.p}" data-s="${s?s.i:''}"><span class="cd">p. ${r.p}</span>${s?esc(s.t):''}<div class="sn">… ${hl(r.sn)} …</div></div>`}).join('')}</div>`;
  $('#main').querySelectorAll('.results .r[data-p]').forEach(e=>e.onclick=()=>{location.hash='#p/'+e.dataset.p});
}
function viewPage(p){
  p=Math.max(1,Math.min(DATA.npages,p)); const s=secOfPage(p);
  $('#main').innerHTML=`<div class="crumb">${s?crumb(s)+(crumb(s)?' › ':'')+`<a href="#s/${s.i}">${esc(s.t)}</a>`:''}</div><h1 class="st">Página ${p}</h1>
  <div class="btns no-print" style="margin-bottom:14px">${pdfBtn(p)} ${p>1?`<a class="b" href="#p/${p-1}">← p. ${p-1}</a>`:''} ${p<DATA.npages?`<a class="b" href="#p/${p+1}">p. ${p+1} →</a>`:''}</div>${pagesHtml(p,p)}`;
  const q=$('#q').value; if(q){const terms=norm(q).split(/\s+/).filter(x=>x.length>1); const pre=$('#main pre'); let h=pre.innerHTML; terms.forEach(x=>{const re=new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'); h=h.replace(re,m=>`<mark>${m}</mark>`)}); pre.innerHTML=h}
  window.scrollTo(0,0);
}
function viewNotas(){
  const f=Object.keys(favs).map(Number).filter(i=>S[i]); const n=Object.keys(notes).map(Number).filter(i=>S[i]);
  $('#main').innerHTML=`<h1 class="st">Mis notas y favoritos</h1><p class="empty">Se guardan solo en este navegador.</p>
  <div class="box"><h3>Favoritos (${f.length})</h3>${f.map(i=>`<div class="r" onclick="location.hash='#s/${i}'"><span class="cd">p. ${S[i].p}</span>${esc(S[i].t)}</div>`).join('')||'<div class="empty">Marca secciones con ★.</div>'}</div>
  <div class="box"><h3>Notas (${n.length})</h3>${n.map(i=>`<div class="r" onclick="location.hash='#s/${i}'"><span class="cd">p. ${S[i].p}</span>${esc(S[i].t)}<div class="sn">${esc(notes[i])}</div></div>`).join('')||'<div class="empty">Escribe notas en cualquier sección.</div>'}</div>`;
}
function viewHome(){
  const top=S.filter(s=>s.l===0);
  $('#main').innerHTML=`<h1 class="st">${esc(DATA.nom)}</h1>
  <div class="box"><div class="kv"><b>Documento</b><span>Reglamento escrito del ${DATA.k.startsWith('pold')?'PLU':'PLUi'} (${DATA.npages} páginas)</span><b>Estado</b><span>${esc(DATA.estado)}</span><b>Municipios</b><span>${esc(DATA.communes)}</span><b>Fuente</b><span><a href="${DATA.pdf.url}" target="_blank" rel="noopener">Géoportail de l'urbanisme (PDF oficial)</a></span></div></div>
  <div class="box"><h3>Cómo usarlo</h3><ul style="margin:0;padding-left:18px">
   <li><b>Por proyecto</b>: elige el tipo de obra y tu zona; te lista los artículos a revisar, por orden, con casillas.</li>
   <li><b>Explorar</b>: índice completo a la izquierda; cada sección muestra el texto oficial y el botón para abrir el PDF en esa página.</li>
   <li><b>Buscador</b>: busca en las ${DATA.npages} páginas (palabras en francés: <i>hauteur, clôture, pleine terre…</i>).</li>
   <li><b>Tu zona</b>: mírala en el <a href="https://www.geoportail-urbanisme.gouv.fr/map/" target="_blank" rel="noopener">mapa del Géoportail de l'urbanisme</a> (clic en la parcela) o en los planos de zonificación de la carpeta <i>Reglement</i>.</li></ul></div>
  <div class="pj-tabs">${PROY.map(p=>`<a href="#proy/${p.id}"><b>${esc(p.nom)}</b><span>${esc(p.sub)}</span></a>`).join('')}</div>
  <div class="box sub-list"><h3>Partes del reglamento</h3>${top.map(s=>`<a href="#s/${s.i}">${esc(s.t)} <span style="color:var(--muted);font-size:12px">p. ${s.p}</span></a>`).join('')}</div>
  <div class="box no-print"><h3>Abrir el PDF</h3><p style="font-size:13.5px;margin:0 0 8px">Los botones «Abrir en el PDF» usan: <b>${pdfMode==='local'?'tu copia en el PC (carpeta Reglement junto a este archivo)':'el PDF oficial en internet'}</b>.</p><button id="pdfToggle">Usar ${pdfMode==='local'?'el PDF en internet':'mi copia local'}</button></div>
  ${HOME_URL?`<p><a href="${HOME_URL}">← Volver al mapa de territorios</a></p>`:''}`;
  $('#pdfToggle').onclick=()=>{pdfMode=pdfMode==='local'?'online':'local'; store.set('pdfmode',pdfMode); viewHome(); toast('PDF: '+(pdfMode==='local'?'copia local':'internet'))};
}
const NP=DATA.pages.map(norm);
let qt;
$('#q').addEventListener('input',e=>{clearTimeout(qt); qt=setTimeout(()=>{const v=e.target.value.trim(); if(v.length>=2) location.hash='#q/'+encodeURIComponent(v); else if(!v) location.hash='#home'},350)});
function route(){
  const h=decodeURIComponent(location.hash.slice(1)||'home');
  const [v,a]=[h.split('/')[0],h.split('/').slice(1).join('/')];
  document.querySelectorAll('#tabs a').forEach(x=>x.classList.toggle('on',x.dataset.t===(v==='q'||v==='p'?'':v)));
  if(v==='s') viewSec(+a||0);
  else if(v==='proy') viewProy(a);
  else if(v==='temas') viewTemas(a);
  else if(v==='q'){ if($('#q').value!==a) $('#q').value=a; viewSearch(a)}
  else if(v==='p') viewPage(+a);
  else if(v==='notas') viewNotas();
  else viewHome();
}
window.addEventListener('hashchange',route);
renderFilters(); renderTree(); route();
</script>
</body>
</html>
