au public d’assainissement est\n    subordonnée à l’autorisation du Président de la Communauté d’agglomération de Saint-\n    Quentin-en-Yvelines.\n    4.2.8   Tout nouveau projet d’aménagement d’ensemble* doit être étudié en s’assurant de sa\n    viabilité au regard des stations d’épuration existantes ou en prévoyant les travaux\n    nécessaires sur les équipements publics.\n    Eaux pluviales\n    4.2.9   Le raccordement au réseau d’eaux pluviales n’est pas obligatoire ;\n    4.2.10 En cas de nécessité de raccordement au réseau public des eaux pluviales, celui-ci est\n    soumis à autorisation. Une demande de branchement devra être adressée au service\n    assainissement de la Communauté d’agglomération de Saint-Quentin-en-Yvelines. Cette\n    dernière pourra refuser tout branchement aux réseaux d’eaux pluviales pour toute opération\n    de construction* pouvant générer des débits susceptibles de provoquer une saturation des\n    réseaux ou de la station d’épuration.\n    Particulièrement, les opérations de construction* anticiperont et analyseront les effets des\n    évènements pluvieux dits « exceptionnels » susceptibles de provoquer une saturation des\n    réseaux afin d’éviter ou limiter les dégâts sur les personnes et les biens : identification des\n    axes d’écoulement et des zones susceptibles d’être inondées sur le terrain d’assiette du\n    projet, étude des solutions permettant de protéger les personnes et les biens (muret,\n    profilage de voirie, espaces verts en creux, etc.)\n    4.2.11 Les modalités techniques et administratives de raccordement des eaux pluviales sont\n    définies dans le règlement d’assainissement collectif de la Communauté d’agglomération de\n    Saint-Quentin-en-Yvelines et dans le cahier de prescriptions techniques en matière\n    d’assainissement en vigueur.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    32/103","Dispositions\nCommunes\n    4.2.12 Conformément aux dispositions des Schéma Directeur d'Aménagement et de Gestion des\n    Eaux (SDAGE) et des Schémas d'Aménagement et de Gestion des Eaux (SAGE), il doit être\n    recherché, dès la conception des aménagements et réaménagements, des solutions\n    permettant l’absence de rejet d’eaux pluviales au réseau public jusqu’à la pluie de référence\n    indiquée dans le zonage des eaux pluviales (annexe N° 7.23 du PLUi) pour l’ensemble de\n    la parcelle concernée par le projet.\n    4.2.13 En cas d’une impossibilité d’atteindre l’objectif de « zéro rejet » d’eaux pluviales au réseau\n    public jusqu’à la pluie de référence indiquée dans le zonage des eaux pluviales représenté\n    au plan n°7.23 annexé au présent PLUi,, les aménagements réalisés doivent être tels qu’ils\n    permettent d’atteindre à minima l’objectif du « zéro rejet » d’eaux pluviales pour les pluies\n    courantes (10 mm/24H). Après que toutes les solutions techniques possibles favorisant\n    l’infiltration, évapotranspiration des eaux pluviales aient été mises en œuvre à minima pour\n    les pluies courantes, le rejet de l'excédent d'eau pluviale, au-delà des pluies courantes,\n    pourra être envisagé vers le réseau public des eaux pluviales conformément aux\n    prescriptions en terme de débit limite et de pluie de référence du zonage des eaux pluviales\n    de la Communauté d’agglomération de Saint-Quentin-en-Yvelines représenté au plan\n    n°7.23 annexé au présent PLUi, cet excédent est soumis à des limitations avant rejet.\n    4.2.14 Dans le cas où les eaux pluviales rejoignent directement le milieu naturel, le débit de\n    ruissellement généré en sortie de parcelle doit être conforme aux limites fixées par le\n    Schéma d’Aménagement et de Gestion des Eaux (SAGE) où se situe le projet (Bièvre,\n    Mauldre ou Orge-Yvette).\n    4.2.15 La gestion des eaux pluviales doit s’effectuer au plus près d’où la pluie tombe (gestion à la\n    source) et de manière intégrée à l’aménagement (combiner plusieurs fonctions) par la mise\n    en place de dispositifs conçus selon des méthodes alternatives à l’utilisation systématique\n    de bassins de rétention enterrés et pompes de relevages associées : revêtements\n    perméables tels que les pavés non jointifs (aires de stationnements, cheminements..),\n    noues, tranchées d’infiltration, toitures végétalisées, systèmes de récupération des eaux\n    pluviales pour l’arrosage des espaces verts ou le lavage des espaces extérieurs, etc. Le\n    constructeur ou l’aménageur recherchera préférentiellement une gestion visible et\n    gravitaire de l’eau pluviale permettant une bonne valorisation de l‘eau dans la ville.\n    Une note de dimensionnement relatifs aux dispositifs de gestion des eaux pluviales qui\n    seront mis en œuvre devra être fournies afin de vérifier le respect des prescriptions\n    auxquelles est soumise l’opération d’aménagement.\n    4.2.16 Pour toute opération de construction*, les possibilités d’infiltration à la parcelle devront faire\n    l’objet d’études d’infiltrabilité des sols de telle sorte que l’absorption sur l’unité foncière soit\n    systématiquement privilégiée au maximum de sa capacité. Dans le cas où les\n    caractéristiques du sous-sol limitent l’infiltration en profondeur, l’infiltration à la surface du\n    sol (20-30 premiers cm) devra être privilégiée (et les aménagements plantés afin de\n    favoriser l’évapotranspiration).\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    33/103","Dispositions\nCommunes\n    Domanialité des réseaux d’assainissement\n    4.2.17 Les collecteurs d'assainissement publics traversant le domaine privé doivent faire l'objet\n    d'une inscription aux hypothèques et d'une servitude de passage signée entre la\n    Communauté d’agglomération de Saint-Quentin-en-Yvelines et le propriétaire.\n    4.2.18 Les modalités d'accès aux ouvrages d'assainissement doivent être conformes aux modalités\n    présentes dans le cahier de prescriptions techniques en matière d'assainissement en\n    vigueur.\n    4.3. Réseaux divers\n    4.3.1    Pour toute construction* nouvelle, les réseaux de distribution d’énergie (électricité, gaz),\n    de télécommunication (téléphone, câble, fibre optique) doivent être conçus en souterrain,\n    sauf difficulté technique reconnue par le service gestionnaire intéressé. Si cette\n    impossibilité est constatée dans le cas de restauration d’une construction* existante, le\n    branchement peut être assuré par câble torsadé ou courant posé sur les façades*\n    (technique « dissimulée ») ;\n    4.4 Gestion du stockage des déchets\n    4.4.1    Les bâtiments, locaux ou installations soumis à permis de construire doivent comporter des\n    espaces de stockage des déchets dimensionnés, en fonctions des contextes locaux et de\n    l’organisation de la collecte des déchets.\n    4.4.2    Dans les opérations d’aménagement la gestion des déchets peut être mutualisable à\n    l’échelle de tout ou partie de l’opération.\n    Ainsi, pour tout projet nécessitant un dépôt de permis de construire, il est conseillé au\n    pétitionnaire de prendre attache auprès du service « Déchets » de SQY pour définir les\n    modalités de stockage et de localisation pertinentes à retenir pour la mise en œuvre des\n    espaces et locaux de déchets.\n    4.4.3    Dans le cadre d’une opération de plus de 30 logements, il est recommandé d’intégrer un\n    service d’apport volontaire sous forme de bornes enterrées sur le terrain d’assiette de\n    l’opération et accessible de la voie publique.\n    4.4.4    Dans le cas où des locaux sont mis en place, ils doivent être aménagés en rez-de-\n    chaussée des constructions.\n    4.4.5    Pour toute opération de plus de 5 logements collectifs, un local destiné au stockage des\n    encombrants devra être adapté aux besoins et prévu en respectant les mêmes\n    préconisations que pour les autres déchets.\n    4.4.6    Afin de faciliter le ramassage par les services compétents, une ou plusieurs aires de\n    présentation à la collecte sur le terrain d’assiette de l’opération et accessibles depuis la\n    voie devront être aménagées, en plus des locaux.\n    4.4.7    Pour toute opération de plus de 15 logements collectifs, il est recommandé d’intégrer un\n    dispositif de compostage collectif préférentiellement installé en extérieur.\n    4.4.8    Dans le cas d’une opération mixte (habitat, commerces, entreprises, etc.), chaque entité\n    doit disposer de ses propres locaux de stockage.\n    4.4.9    Dans l’objectif de limiter l’impact sur la circulation au moment de la collecte des déchets,\n    les bornes d’apport volontaire et les aires de présentation à la collecte devront\n    prioritairement être installées le long des voies les moins circulées.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    34/103"," Dispositions\n Communes\nARTICLE 6 -    ELEMENTS NATURELS ET PAYSAGERS REMARQUABLES\nLes éléments naturels constitutifs du cadre naturel repérés sur les documents graphiques se répartissent\nen 8 catégories :\n    1 - LES ESPACES BOISES CLASSES A CONSERVER, A PROTEGER OU A CREER SOUMIS AUX\n    DISPOSITIONS DE L’ARTICLE L113.1° DU CODE DE L’URBANISME ;\nLes terrains* boisés identifiés aux documents graphiques comme espaces boisés, à conserver, à protéger\nou à créer sont soumis au régime des articles L113-1, R421-23 et suivants du Code de l’Urbanisme.\nY sont notamment interdits, les recouvrements du sol par tous matériaux imperméables (ciment, bitume)\nainsi que les remblais. Les coupes et abattages d’arbres sont notamment soumis à déclaration préalable.\nLes accès* aux propriétés sont admis dans la mesure où ils ne compromettent pas la préservation des\nboisements existants.\nSauf application des dispositions du Code de l’Urbanisme, ces terrains* sont inconstructibles à l’exception\ndes bâtiments strictement nécessaires à l’exploitation des bois soumis au régime forestier.\n    2 - LES ALIGNEMENTS D’ARBRES A PRESERVER OU A CREER, SOUMIS AUX DISPOSITIONS\n    DE L’ARTICLE L 151-23 DU CODE DE L’URBANISME ;\nLes plantations d’alignement repérées sont à conserver. Les symboles graphiques employés constituent\nun principe de repérage et non une localisation exacte des arbres à conserver ou à planter.\nLeur abattage n’est autorisé que si l’état phytosanitaire de l’arbre est jugé dégradé, ou s’il représente une\nmenace pour la sécurité des biens et personnes. Tout abattage doit être compensé par la plantation d’un\narbre de qualité égale ou de développement équivalent à maturité. Les fosses d’arbres qui accueilleront\nles nouveaux individus doivent présenter les caractéristiques suffisantes selon le système racinaire de\nl’espèce choisie pour assurer sa pérennité.\nLes accès* aux propriétés et les voies* nouvelles sont admis en tenant compte des arbres ou plantations\nexistantes.\nPar ailleurs, certains alignements d’arbres sont soumis à des mesures de protection et de mise en valeur\nspécifiques traduites sous forme de prescriptions particulières figurant au titre VII du présent règlement.\n    3 - LES ARBRES REMARQUABLES EXISTANTS A PROTEGER, SOUMIS AUX DISPOSITIONS DE\n    L’ARTICLE L151-23 DU CODE DE L’URBANISME ;\nLes arbres remarquables repérés sur les documents graphiques sont à conserver. Les symboles\ngraphiques employés constituent un principe de repérage.\nLeur abattage n’est autorisé que si l’état phytosanitaire de l’arbre est jugé dégradé, ou s’il représente une\nmenace pour la sécurité des biens et personnes. Tout abattage doit être compensé par la plantation d’un\narbre de qualité égale ou de développement équivalent à maturité. Les fosses d’arbres qui accueilleront\nles nouveaux individus doivent présenter les caractéristiques suffisantes selon le système racinaire de\nl’espèce choisie pour assurer sa pérennité.\nPar ailleurs, certains arbres remarquables sont soumis à des mesures de protection et de mise en valeur\nspécifiques traduites sous forme de prescriptions particulières figurant au titre VII du présent règlement.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    35/103"," Dispositions\n Communes\n    4 - LES ESPACES PAYSAGERS A PROTEGER, METTRE EN VALEUR OU A REQUALIFIER,\n    SOUMIS AUX DISPOSITIONS DE L’ARTICLE L151-23 DU CODE DE L’URBANISME ;\nCes espaces non bâtis, nécessaires au maintien des continuités écologiques, sont à protéger. Leur\nconstructibilité est très fortement limitée. Ainsi, sont interdites toutes les constructions* et installations, à\nl'exception de celles soumises aux conditions ci-dessous :\n    1) Les aménagements et constructions* de locaux techniques et de constructions* liées au\n    fonctionnement du service public ou d’intérêt collectif* et nécessaires à la valorisation de ces\n    espaces (aires de jeux, abris vélos, cheminements doux, bacs de compostage légers, …) sont\n    autorisés, à condition :\n    -   de préserver la dominante végétale de ces espaces,\n    -   de limiter l’emprise au sol des constructions* à 5 % de la superficie protégée du terrain*.\n   2) Des accès* et voies* peuvent y être aménagés.\nLes arbres compris dans ces espaces doivent être préservés. Toutefois, quand leur abattage est\nnécessaire, un arbre dont le développement sera équivalent à terme, doit être replanté à proximité.\n    5 - LES ESPACES PAYSAGERS MODULES ET LES FONDS DE PARCELLES A PROTEGER,\n    SOUMIS AUX DISPOSITIONS DE L’ARTICLE L151-23 DU CODE DE L’URBANISME ;\nCes espaces non bâtis, nécessaires au maintien des continuités écologiques, sont à préserver. Leur\nconstructibilité est limitée. Ainsi, sont interdites toutes les constructions* et installations, à l'exception de\ncelles soumises aux conditions ci-dessous :\n 1) Les aménagements et constructions* de locaux techniques et de constructions* liées au\n    fonctionnement du service public ou d’intérêt collectif* et nécessaires à la valorisation de ces espaces\n    (aires de jeux, abris vélos, cheminements doux, bacs de compostage légers …) sont autorisés, à\n    condition :\n    -   de préserver la dominante végétale de ces espaces,\n    -   de limiter l’emprise au sol des constructions* à 5 % de la superficie protégée du terrain*.\n 2) Des accès* et voies* peuvent y être aménagés.\n 3) Les annexes et extensions de constructions*\n    autorisées dans la zone concernée sont\n    autorisées dans les espaces paysagers modulés\n    sous réserve de respecter les conditions\n    suivantes :\n    -   que leur hauteur* soit limitée à 3 mètres,\n    -   qu’elles soient situées en retrait* minimum\n    de 2 mètres par rapport à la limite\n    parcellaire impactée par l’espace paysager\n    délimité,\n    -   qu’elles respectent des dispositions des autres articles du présent règlement.\n    4) Les clôtures devront conserver, quant elles pré-existent, l’aspect végétal du paysage type\n    grillage doublé d’une haie végétale.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    36/103"," Dispositions\n Communes\n    6 - LES JARDINS FAMILIAUX OU COLLECTIFS A PROTEGER, METTRE EN VALEUR OU A CREER,\n    SOUMIS AUX DISPOSITIONS DE L’ARTICLE L 151-23 DU CODE DE L’URBANISME ;\nLes secteurs repérés aux documents graphiques, comme jardins familiaux ou collectifs, sont à protéger, à\nvaloriser ou à créer. Pour ce faire, seuls y sont autorisées les constructions* liées aux activités de jardinage\net maraîchage d’une surface de plancher* inférieure à 5 m² et d’une hauteur* totale inférieure à 3 m, un\nlocal commun d’une surface de plancher* inférieure à 20 m² est également autorisé.\n    7 - LES MARES A PROTEGER OU METTRE EN VALEUR, SOUMIS AUX DISPOSITIONS DE\n    L’ARTICLE L151-23 DU CODE DE L’URBANISME ;\nLes mares existantes sur le territoire intercommunal ont été identifiées au zonage. Cette identification\npermet d’assurer la pérennité de ces espaces en eau, rares en milieu urbain, notamment vis-à-vis du\ncomblement et des constructions*.\nSeuls les aménagements et ouvrages techniques qui visent à assurer leur mise en valeur, leur pérennité\net leur vocation de régulation hydraulique sont autorisés.\nLes constructions* nouvelles sont interdites dans un rayon de 10 mètres, à compter du haut de la berge,\nautour de l’entité.\n    8 - ZONES HUMIDES A PRESERVER SOUMIS AUX DISPOSITIONS DE L’ARTICLE L151-23 DU\n    CODE DE L’URBANISME ;\nOn entend par zone humide les terrains*, exploités ou non, habituellement inondés ou gorgés d'eau douce,\nsalée ou saumâtre de façon permanente ou temporaire ; la végétation, quand elle existe, y est dominée\npar des plantes hygrophiles pendant au moins une partie de l'année.\nConformément aux dispositions du Schéma Directeur d'Aménagement et de Gestion des Eaux (SDAGE)\net des Schémas d'Aménagement et de Gestion des Eaux (SAGE), la destruction des zones humides doit\nêtre évitée en recherchant prioritairement la possibilité technicoéconomique d'implanter les projets en\ndehors de ces zones. À défaut du principe d'évitement, lorsque l'exception à ce principe est justifiée, la\nréduction de l'incidence du projet sur la zone humide devra être recherchée et démontrée.\nSi l'analyse technico-économique a démontré qu'il ne peut être envisagé d'établir le projet en dehors de\nces zones, la destruction, y compris partielle, d'une zone humide est soumise à mesures compensatoires.\nLes zones humides identifiées sont recensées sur le plan de zonage. La cartographie présentée n’a pas\nde caractère exhaustif. Des zones humides répondant aux critères de l’arrêté du 24 juin 2008 modifié le 1er\noctobre 2009 peuvent exister sans pour autant être repérées sur cette carte.\nCette identification permet d’assurer la pérennité de ces espaces qui connaissent de fortes régressions.\nLes prescriptions opposables sont définies dans chaque règlement du SAGE où la zone humide se situe.\nAussi, dans les espaces ainsi identifiés, les prescriptions sont :\nd’interdire tout mouvement de terrain susceptible de porter atteinte au caractère humide du secteur ;\nde préserver les écoulements pour maintenir l’alimentation hydrique du secteur.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    37/103"," Dispositions\n Communes\nARTICLE 7 -    ELEMENTS BATIS ET ARCHITECTURAUX REMARQUABLES\nLes éléments bâtis et architecturaux remarquables repérés sur les documents graphiques se répartissent\nen 4 catégories :\n    −    les bâtiments ou éléments de construction* remarquables à protéger ou à mettre en\n    valeur soumis aux dispositions de l’article L151-19 du Code de l’Urbanisme.\n    −    les ensembles urbains remarquables à protéger ou à mettre en valeur, soumis aux\n    dispositions de l’article L 151-19 du Code de l’Urbanisme ;\n    −    les murs remarquables à protéger, soumis aux dispositions de l’article L151-19 du Code\n    de l’Urbanisme ;\n    −    les œuvres d’art remarquables à protéger ou à mettre en valeur soumises aux\n    dispositions des articles L151-19 du Code de l’Urbanisme.\nTous les travaux réalisés sur les constructions* identifiées doivent être conçus dans le respect des\ndispositions générales et applicables aux zones concernées du règlement, et dans le respect d’une\npréservation et d’une mise en valeur des caractéristiques historiques, culturelles et paysagères qui ont\nconduit à leur classification au titre VII du présent règlement.\nAinsi, lorsque les prescriptions spécifiques présentes au titre VII les y autorisent, les différentes mesures à\nprendre en compte dans le cadre du présent règlement sont :\nDémolition\n    •   La démolition des constructions* ou parties de constructions* à valeur patrimoniale identifiées au\n    titre de l'article L151-19 du Code de l'Urbanisme est autorisée, dans les seuls cas suivants :\n    o    Démolition(s) partielle(s) rendue(s) nécessaire(s) lors de travaux de mise en conformité\n    avec des normes impératives (sécurité incendie, accessibilité pour des personnes à\n    mobilité réduite, etc…) ;\n    o    Démolition(s) partielle(s) ou totale rendue(s) nécessaire(s) de construction* menaçant\n    ruine en application du Code de la Construction et de l'Habitation, ou d'immeuble insalubre\n    en application du Code de la Santé Publique.\nRéhabilitation*\n    •   Tout projet de réhabilitation* doit être respectueux de l’identité architecturale de la construction*.\nModification des volumes, façades*\n    •   Toute modification éventuelle apportée en termes de volumétrie générale et de modification de\n    façade* ne doit pas dénaturer, lorsque cela est demandé, la composition d’ensemble et le caractère\n    architectural de la construction* d’origine.\nSurélévation*\n    •   Tout projet de surélévation* du bâtiment d’origine peut être refusé s’il entraine des changements\n    trop radicaux en termes de composition d’ensemble urbain (alignement* bâti, volumétrie\n    générale…) et/ou de volumétrie et de composition de façades* de la construction* d’origine.\n    •   Pour l’ensemble des mesures énoncées ci-dessus, tout projet de modification peut être refusé s’il\n    porte atteinte, de par son implantation, aux espaces extérieurs attenants à la construction* ayant\n    une qualité paysagère forte, à sa volumétrie et/ou aux traitements de façades* et toitures de la\n    construction* d’origine.\n    •   Tout nouveau projet doit assurer l’insertion des nouvelles constructions* avec le tissu urbain\n    existant, ayant une valeur patrimoniale ponctuelle et/ou d’ensemble.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    38/103","    Dispositions\n    Communes\nARTICLE 8 -    PERIMETRE DE CONSTRUCTIBILITE LIMITEE\nDans les périmètres identifiés au sein du règlement graphique au titre de l’article L151-41 5° du Code de\nl’Urbanisme, les constructions* ou installations supérieures à 50 m2 de surface de plancher* sont interdites.\n    P   P\nToutefois, les travaux ayant pour objet l’extension*, le changement de destination, la réfection ou la mise\naux normes thermiques des constructions* existantes sont autorisés à condition que ces travaux respectent\nles prescriptions du présent règlement et qu'ils n'aboutissent pas à la création d'un total de plus de 20 m2P\nde surface de plancher* supplémentaire sur chaque terrain*.\nP\n    La servitude est fixée pour une durée de 5 ans à compter de l’instauration des périmètres.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    39/103"," Dispositions\n Communes\nARTICLE 9 -    ELEMENTS RELATIFS AUX OBJECTIFS DE MIXITE SOCIALE\nLes secteurs de mixité sociale sont les secteurs identifiés au document graphique et dans lesquels, en cas\nde réalisation d’un programme de logements, un pourcentage de ce programme est affecté à des objectifs\nde mixité sociale, soumis aux dispositions de l’article L151-41 4° du Code de l’Urbanisme\nCe présent article ne s’applique pas aux constructions* destinées à l’hébergement des publics spécifiques.\nDans les périmètres identifiés, les constructions* à destination d’habitation sont autorisées à condition de\nrépondre aux répartitions définie selon les communes dans les paragraphes suivants.\nLe calcul se fait par tranche entière entamée.\nLa programmation et répartition de la typologie par taille de logements devront être préalablement étudiées\navec les services de la ville et de l’agglomération pour correspondre aux objectifs de rééquilibrage du parc\nde logements.\nPour la commune de Guyancourt :\nDans les périmètres identifiés, les constructions* à destination d’habitation sont autorisées à condition que\nchaque opération d’aménagement d’ensemble* entraînant la réalisation d’au moins 50 logements comporte\nau moins :\n   − 50 % de la surface de plancher* de l’opération destinée aux logements locatifs financés par un prêt\n    agréé par l’État ;\n   − et 25 % de la surface de plancher* de l’opération destinée aux logements en accession aidée à la\n    propriété.\nPour la commune de Magny-les-Hameaux :\nDans les périmètres identifiés, les constructions* à destination d’habitation sont autorisées à condition que\nchaque opération d’aménagement d’ensemble* entraînant la réalisation d’au moins 14 logements et/ou de\nplus de 800m² de surface de plancher comporte au moins 30% du nombre de logements et/ou de la Surface\nde Plancher* destinée aux logements locatifs financés par un prêt agréé par l’État ;\nPour la commune de Voisins-le-Bretonneux :\nDans les périmètres identifiés, les constructions* à destination d’habitation sont autorisées à condition que\nchaque opération d’aménagement d’ensemble* entraînant la réalisation :\n   − d’au moins 3 logements comporte au moins 33 % du nombre de logements destinées aux\n    logements locatifs financés par un prêt agréé par l’État sur le secteur Centre-Ville ;\n   − d’au moins 4 logements comporte au moins 25 % du nombre de logements destinées aux\n    logements locatifs financés par un prêt agréé parl’État sur le secteur de la rue Jean Bart ;\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    40/103"," Dispositions\n Communes\nARTICLE 10 -    AUTRES INSCRIPTIONS GRAPHIQUES\n    ÉLEMENTS RELATIFS A LA PRESERVATION ET AU DEVELOPPEMENT DE LA DIVERSITE\n    COMMERCIALE\nAu titre de l’article L151-16 du Code de l’Urbanisme, le changement de destination des locaux commerciaux\nsitués en rez-de-chaussée le long des voies*, ou sections de voies*, et dans les secteurs repérés aux\ndocuments graphiques par figuré linéaire ou surfacique, est interdit à l'exception des cas suivants :\n    − Changement de destination en bureaux ;\n    − Changement de destination en artisanat ;\n    − Changement de destination en hébergement hôtelier ;\n    − Changement de destination en constructions* et installations nécessaires aux services publics ou\n    d'intérêt collectif.\nLe changement de destination en logement des locaux situés en rez-de-chaussée le long des voies*, ou\nsections de voies* repérées aux documents graphiques par figuré linéaire est strictement interdit.\nDans les secteurs A et Ai les commerces ne sont autorisés uniquement dans les îlots délimités pour la\ndiversité commerciale.\n    RECULS* D’ALIGNEMENT*\nToute nouvelle construction*, sauf dispositif technique nécessaire au fonctionnement des infrastructures,\nest interdite dans les marges de recul* figurées sur les plans de zonages. La distance de recul* est indiquée\nen mètres sur le plan.\n    BANDES CONSTRUCTIBLES\nLes constructions* ne pourront être implantées que sur une profondeur de 25 m mesurée parallèlement à\nla limite de l’alignement*, conformément à la marge fixée par le document graphique.\nAu-delà de la bande de 25 m, seront autorisées, dans la limite de 10 m² d’emprise au sol, les extensions*\naccolées aux constructions* existantes et les annexes* dont la hauteur* totale et l’emprise au sol n’excèdent\npas respectivement 2,50 mètres et 15 m2 de surface.\n    P   P\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    41/103"," Dispositions\n Communes\nARTICLE 11 -    DISPOSITIONS RELATIVES AUX CONSTRUCTIONS* EXISTANTES\nLes dispositions suivantes s’appliquent dans toutes les zones du PLUi :\n    − aux constructions* existantes à la date d’approbation du PLUi et régulièrement autorisées non\n    conformes aux dispositions des règlements des zones dans lesquelles elles sont implantées.\n    − aux travaux d’isolation thermique des constructions* existantes au 1er janvier 2013 (date d’entrée\n    P   P\n    en application de la RT2012) et régulièrement autorisées.\n    ARTICLE 6 -    IMPLANTATION DES CONSTRUCTIONS* PAR RAPPORT AUX VOIES* ET\n    EMPRISES PUBLIQUES*\n    6.1. Constructions* existantes non conformes aux dispositions du présent règlement\n    U\n    6.1.1 Une implantation différente de celle autorisée à l’article 6 de la zone d’implantation de la\n    construction* concernée est admise, pour les annexes*, extensions* et surélévations* de\n    constructions* existantes non implantées conformément aux dispositions de cet article 6, afin\n    d’harmoniser les implantations avec la construction* existante. En ce cas, elles doivent être\n    réalisées avec un recul* par rapport à l’alignement* égal à celui de la construction* existante.\n    6.1.2 Les changements de destination sont autorisés pour les constructions* existantes non\n    implantées conformément aux dispositions de l’article 6 de la zone d’implantation de la\n    construction* concernée, dans le respect des dispositions des articles 1 et 2 de cette zone.\n    6.2. Cas des travaux d'isolation thermique des constructions* existantes\n    6.2.1 Les travaux d'isolation thermique par l’extérieur sur les façades* sont autorisés.\n    6.2.2 La distance de recul* peut être réduite de 0,50 mètre pour permettre de réaliser une isolation\n    par l’extérieur de constructions* existantes.\n    6.2.3 Le non-respect de la distance de recul* peut être aggravé de 0,50 mètre pour permettre de\n    réaliser une isolation par l’extérieur de constructions* existantes.\n    ARTICLE 7 -    IMPLANTATION    DES    CONSTRUCTIONS*    PAR    RAPPORT    AUX    LIMITES\n    SEPARATIVES*\n    7.1. Constructions* existantes non conformes aux dispositions du présent règlement\n    U\n    7.1.1    Une implantation différente de celle autorisée à l’article 7 de la zone d’implantation de la\n    construction* concernée est admise, pour les annexes*, extensions* et surélévations* de\n    constructions* existantes non implantées conformément aux dispositions de cet article 7 afin\n    d’harmoniser les implantations avec la construction* existante. En ce cas, elles doivent être\n    réalisées avec un retrait* par rapport à la limite séparative* égal à celui de la construction*\n    existante.\n    7.1.2   Les changements de destination sont autorisés pour les constructions* existantes non\n    implantées conformément aux dispositions de l’article 7 de la zone d’implantation de la\n    construction* concernée dans le respect des dispositions des articles 1 et 2 de cette zone.\n    7.2. Cas des travaux d'isolation thermique des constructions* existantes\n    U\n    7.2.1    Les travaux d'isolation thermique par l’extérieur sur les façades* sont autorisés.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    42/103","Dispositions\nCommunes\n    7.2.2    La distance de retrait* peut être réduite de 0,50 mètre et le non-respect de la distance de\n    retrait* peut être aggravé de 0,50 mètre pour permettre de réaliser une isolation par\n    l’extérieur de constructions* existantes.\n    ARTICLE 8 -    IMPLANTATION DES CONSTRUCTIONS* LES UNES PAR RAPPORT AUX\n    AUTRES SUR UNE MEME PROPRIETE\n    8.1. Constructions* existantes non conformes aux dispositions du présent règlement\n    U\n    8.1.1    Une implantation différente de celle autorisée à l’article 8 de la zone d’implantation de la\n    construction* concernée est admise, pour les annexes*, extensions* et surélévations* de\n    constructions* existantes non implantées conformément aux dispositions de cet article 8,\n    afin d’harmoniser les implantations avec la construction* existante. En ce cas, la distance\n    entre les constructions* sur un même terrain* doit être égale à distance existante entre les\n    constructions* déjà implantées sur le terrain*.\n    8.1.2    Les changements de destination sont autorisés pour les constructions* ou partie de\n    constructions* existantes non implantées conformément aux dispositions de l’article 8 de\n    la zone d’implantation de la construction* concernée, dans le respect des dispositions des\n    articles 1 et 2 de cette zone.\n    8.2. Cas des travaux d'isolation thermique des constructions* existantes\n    U\n    8.2.1    Les travaux d'isolation thermique par l’extérieur sur les façades* sont autorisés.\n    8.2.2    La distance de retrait* peut être réduite de 0,50 mètre et le non-respect de la distance de\n    retrait* peut être aggravé de 0,50 mètre pour permettre de réaliser une isolation par\n    l’extérieur de constructions* existantes.\n    ARTICLE 9 -    EMPRISE AU SOL\n    9.1. Constructions* existantes non conformes aux dispositions du présent règlement\n    9.1.1    Les constructions* existante peuvent évoluer sous réserve de ne pas aggraver le non-\n    respect des règles prévues.\n    9.1.2   Les changements de destination sont autorisés pour les constructions* ou partie de\n    constructions* existantes dont l’emprise au sol excède les dispositions de l’article 9 de la\n    zone d’implantation de la construction* concernée, dans le respect des dispositions des\n    articles 1 et 2 de cette zone.\n    9.2. Cas des travaux d'isolation thermique des constructions* existantes\n    U\n    9.2.1    Les travaux d'isolation thermique par l’extérieur sur les façades* sont autorisés.\n    9.2.2    Le non-respect de l’emprise au sol autorisé peut être aggravé pour permettre la mise en\n    œuvre d’une isolation thermique par l’extérieur de 0,50 mètre de la constructions*\n    existantes.\n    ARTICLE 10 -    HAUTEUR* MAXIMALE DES CONSTRUCTIONS*\n    10.1. Constructions* existantes ne respectant pas les règles définies par le présent article\n    U\n    10.1.1    Les dispositions de l’article 10 de la zone d’implantation de la construction* concernée ne\n    s’appliquent pas aux travaux d’entretien, d’amélioration, d’isolation et de mise aux normes\n    des constructions* existantes ne respectant pas les règles définies par cet article.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    43/103","Dispositions\nCommunes\n    10.1.2    Les changements de destination sont autorisés pour les constructions* existantes, non\n    implantées conformément aux dispositions de l’article 10 de la zone d’implantation de la\n    construction* concernée, dans le respect des dispositions des articles 1 et 2 de cette zone.\n    10.2. Cas des travaux d'isolation thermique des constructions* existantes\n    U\n    10.2.1    Les travaux d'isolation thermique par l’extérieure des toitures sont autorisés.\n    10.2.2    La hauteur* peut être augmentée de 0,50 mètre et le non-respect de la hauteur* plafond\n    peut être aggravé de 0,50 mètre pour permettre de réaliser une isolation par l’extérieur de\n    constructions* existantes.\n    ARTICLE 13 -    ESPACES LIBRES ET PLANTATIONS, ESPACES BOISES CLASSES\n    13.1. Constructions* existantes non conformes aux dispositions du présent règlement\n    13.1.1    Les constructions* existante peuvent évoluer sous réserve de ne pas aggraver le non-\n    respect des règles prévues.\n    13.1.2   Les changements de destination sont autorisés pour les constructions* ou partie de\n    constructions* existantes qui ne respectent pas le pourcentage d’espace vert exigé dans\n    l’article 9 de la zone d’implantation de la construction* concernée, dans le respect des\n    dispositions des articles 1 et 2 de cette zone.\n    13.2. Cas des travaux d'isolation thermique des constructions* existantes\n    U13\n    13.2.1    Les travaux d'isolation thermique par l’extérieur sur les façades* sont autorisés.\n    13.2.2    Le non-respect du pourcentage d’espace vert exigé peut être aggravé pour permettre la\n    mise en œuvre d’une isolation thermique par l’extérieur de 0,50 mètre des constructions*\n    existantes.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    44/103"," Dispositions\n Communes\nARTICLE 12 -    DISPOSITIONS RELATIVES AU STATIONNEMENT\n    12.1.    Dispositions générales\n    12.1.1 Le stationnement des véhicules correspondant aux besoins des constructions* doit être\n    assuré en dehors des voies* publiques et des emprises publiques* ;\n    12.1.2 En cas d’impossibilité de réaliser les places de stationnement des véhicules exigées par\n    le présent article sur le terrain* d’assiette de l’opération ou sur un terrain* situé dans\n    l’environnement immédiat, le constructeur peut se dégager de ses obligations :\n    -   Soit en acquérant dans un parc privé de stationnement, existant ou en cours de\n    réalisation, situé à moins de 300 mètres du terrain* de l’opération les surfaces de\n    stationnement qui lui font défaut, à la condition que celles-ci ne soient pas\n    nécessaires aux stricts besoins d’une autre opération ou d’une construction\n    existante,\n    -    Soit en obtenant une concession dont la pérenité est assurée dans un parc public\n    ou privé de stationnement existant ou en cours de réalisation, et situé à moins de\n    300 mètres de l’opération, à la condition que celles-ci ne soient pas nécessaires\n    aux stricts besoins d’une autre opération ou d’une construction existante.\n    -    Soit en présentant une note de fonctionnement mutualisé avec des\n    stationnements à proximité (autres équipements, stationnement public, …) pour\n    les équipements et les CINASPIC.\n    12.1.3 Sont soumis à l’obligation de réaliser des aires de stationnement automobiles et des\n    véhicules à deux-roues motorisés ou non :\n    -   Toute construction* nouvelle.\n    -   Tout changement de destination ou aménagement susceptibles de générer des\n    nouveaux besoins qu’il soit soumis ou non à autorisation ou déclaration.\n    -   Toute extension* de plus de 25 m² générant une nouvelle tranche au regard des\n    normes de stationnement par rapport à la surface de plancher existante. Les\n    aménagements de combles générant de la surface habitable constituent une\n    extension qui peut entrainer le passage à une nouvelle tranche en matière de\n    stationnement.\n    -   Pour la destination « habitation », toute évolution entraînant la création d’un ou\n    plusieurs logements.\n    12.1.4 En cas de changement de destination de tout ou partie d’une construction*, les normes de\n    stationnement à respecter sont celles de la nouvelle destination.\n    12.1.5 En cas de division foncière :\n    -  Les nouvelles constructions* sont soumises aux dispositions du présent article.\n    -  Pour les constructions* existantes, le nombre de place de stationnement existant\n    et/ou déjà pris en compte dans le cadre d’une autorisation d’urbanisme précédente\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    45/103","Dispositions\nCommunes\n    doit être maintenu, sauf en cas de réalisation d’un nombre de place supérieur à la\n    règle exigée.\n    12.1.6 Modalité de calcul des places de stationnement : le calcul se fait par tranche entière\n    entamée, ainsi lorsqu’il est exigé une place de stationnement par tranche de 50 m² de\n    surface de plancher* (SdP), le nombre de places exigées, pour une opération de 60 m² de\n    surface de plancher*, est de 2 places.\n    12.1.7 Le stationnement des cycles non motorisés devra être assuré dans des espaces couverts,\n    sécurisés et situés de préférence au rez-de-chaussée des constructions* ou des annexes*.\n    En cas de difficulté technique à réaliser ces places en rez-de-chaussée, un travail sur\n    l’accessibilité des stationnements devra être réalisé permettant de réaliser ces\n    stationnements au R-1 du bâtiment sous réserve de présenter, dans une note explicative\n    à joindre au permis de construire, les dispositifs techniques garantissant l’accessibilité\n    aisée et pratique indispensable pour un usage quotidien des cycles. Le stationnement des\n    cycles non motorisés est interdit en dessous du niveau R-1.\n    Les locaux vélos devront disposer d’au moins 1,5 m² par place de stationnement exigée.\n    Si la surface du local dévolu au stationnement est inférieure, un note jointe au permis de\n    construire, devra détailler les dispositifs mis en place pour assurer le stationnement aisé\n    du nombre de vélos requis.\n    Pour les CINASPIC, notamment ceux qui requièrent un nombre important de\n    stationnement pour les cycles et sous réserve de mise en place des dispositifs de\n    protections et de sécurité adéquate, le stationnement des cycles pourra être assuré en\n    dehors d’espaces couverts.\n    Pour les bureaux et commerces de moins de 200 m², en cas d’impossibilité technique de\n    réaliser les stationnements cycles non motorisés requis, ceux-ci peuvent être reportés sur\n    l’espace public sous réserve de son organisation en accord avec le gestionnaire de\n    l’espace public.\n    12.1.8 La conception des places de stationnements doit garantir leur bonne utilisation, ainsi :\n    -   les places commandées sont tolérées si les places fonctionnent ensemble et sont\n    destinées à un seul logement ;\n    -   les tailles, formes et accès des places doivent permettre les manœuvres aisées\n    de véhicules ; se reporter a l’annexe n°8 du présent règlement.\n    12.1.9 Des adaptations des règles de stationnement peuvent être précisées dans les Orientations\n    d’aménagement et de programmation.\n    12.1.10 Les normes de stationnement qui s’imposent aux constructions* sont les suivantes :\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    46/103","Dispositions\nCommunes\n    Norme de    Norme de    Norme de    Norme de\n    stationnement des    stationnement des    stationnement    stationnement\n    véhicules exigée    véhicules exigée    exigée pour le    exigée pour le\n    sur l’ensemble du    dans un rayon de    stationnement des    stationnement des\n    Destination\n    territoire de    500 m autour des    véhicules à deux-    cycles non\n    l’agglomération en    gares (reporté sur le    roues motorisés    motorisés\n    dehors du cercle de    plan de zonage)\n    proximité des gares\n    Habitation    Pour les    Pour les\n    1 place par tranche    1 place par\n    de 60 m2 de SdP,\n    P   P    logement    opérations de plus    opérations de plus\n    avec un minimum    de 500 m² de SdP,    de 3 logements : 1\n    d’une place par    1 place par tranche   place par tranche\n    logement.\n    de 700 m² de SdP    de 70 m² de SdP\n    Habitation    1 place par    0,5 place par    /    Pour les\n    logement    logement\n Logement loca hydrauliques, électricité, eau potable, etc.).\n    -   A l’installation de pylônes nécessaires aux fonctionnements des télécommunications à condition que\n    ces dernières respectent les critères cumulatifs suivants :\n    •    que leur hauteur soit limitée à 30 mètres ;\n    •    que l’implantation de telles installations se fasse préférentiellement de manière groupée afin\n    de mutualiser ces dernières, dès lors qu’aucune contrainte technique ou de couverture du\n    territoire, ne vient rendre impossible une telle mutualisation.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    50/103"," Dispositions\n Communes\nARTICLE 14 -    DISPOSITIONS RELATIVES AUX PERFORMANCES ENERGETIQUES\nDans le respect des objectifs généraux de performance énergétique et environnementale des bâtiments,\nles nouvelles constructions soumises à une autorisation d'exploitation commerciale, de locaux à usage\nindustriel ou artisanal, d'entrepôts, de hangars non ouverts au public faisant l'objet d'une exploitation\ncommerciale ainsi qu'aux nouveaux parcs de stationnement couverts accessibles au public. et qui créent\nplus de 1 000 mètres carrés d'emprise au sol, ne peuvent être autorisées que si elles intègrent soit un\nprocédé de production d'énergies renouvelables, soit un système de végétalisation, soit tout autre dispositif\naboutissant au même résultat.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    51/103","ZONES\n U AU\n TITRE III : DISPOSITIONS PARTICULIERES\n APPLICABLES AUX ZONES URBAINE ET À\n    URBANISER REGLEMENTEES\nLes zones urbaines, dites « zones U » : ce sont « les secteurs déjà urbanisés et les secteurs où les équipements\npublics existants ou en cours de réalisation ont une capacité suffisante pour desservir les constructions* à\nimplanter » (article R.151-18 du code de l'urbanisme).\nLes zones à urbaniser, dites « zones AU » : l'article R. 151-20 du code de l'urbanisme les définit comme pouvant\n« être classées en zone à urbaniser les secteurs destinés à être ouverts à l'urbanisation ». On distingue deux\ntypes de zones AU :\n    o   les secteurs urbanisables immédiatement en raison de la présence des « réseaux d’eau, d’électricité\n    et, le cas échéant, d'assainissement existant à la périphérie immédiate d'une zone AU » et ayant\n    « une capacité suffisante pour desservir les constructions* à implanter dans l'ensemble de cette\n    zone » ; ces secteurs sont réglementés selon la même nomenclature que les zone U du PLUi dans\n    le titre III du présent règlement ; Ainsi, par exemple, le secteur AUM1d13 sera réglementé comme\n    un secteur UM1d13.\n    o   si cette capacité est insuffisante, l'ouverture à l'urbanisation est subordonnée à une modification ou\n    une révision du PLUi ; ces secteurs sont réglementés au Titre IV du présent règlement :\n    DISPOSITIONS PARTICULIÈRES APPLICABLES À LA ZONE À URBANISER STRICTE\nLe règlement des zones U et AU réglementées est complété par le titre I présentant les dispositions\ngénérales et le titre II du présent règlement qui fixe les dispositions communes applicables à toutes les\nzones.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    52/103","    ZONES\n    U AU\n    ARTICLE U 0 - FONCTIONNEMENT DU SYSTEME D’INDICES\nLa zone urbaine et la zone à urbaniser de Saint Quentin en Yvelines sont réglementées selon un système\nd’indice qui correspond à la dénomination du secteur :\nAinsi, le règlement précise pour chacun des articles et au-delà des règles qui s’appliquent dans toutes les\nzones U et AU, les règles qui s’appliquent à l’indice du secteur concerné.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    53/103","    ZONES\n    U AU\nARTICLE U 1 - OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\n1.1.    Occupations et utilisations du sol interdites dans tous les secteurs des zones U et AU\n    1.1.1   En-dehors des sites urbains constitués, toutes les constructions* et installations sont\n    interdites dans les périmètres situés à moins de 50 mètres des massifs boisés de plus de\n    100 hectares\n    1.1.2   Les constructions*, installations et ouvrages à destination d’exploitation agricole ou\n    forestière, ainsi que leur extension* à l’exception de celles autorisées en U 2.1 ;\n    1.1.3   Les installations classées pour la protection de l’environnement*, à l’exception de celles\n    mentionnées à l’article U 2 ;\n    1.1.4   L’ouverture et l’exploitation de carrières, ainsi que toute exploitation du sous-sol ;\n    1.1.5   Les affouillements, exhaussements, décaissements et remblaiements des sols nécessitant\n    une autorisation au titre des articles R421-9, R421-20 et R421-23 du Code de l’Urbanisme,\n    à l’exception de ceux autorisés à l’article U 2 ;\n    1.1.6   Les dépôts sauvages de ferrailles, matériaux, combustibles solides ou liquides, ainsi que\n    les dépôts de véhicules à l’air libre à l’exception des aires de stationnement.\n1.2.    Occupations et utilisations du sol interdites en secteur M\nEn sus des occupations et utilisations du sol interdites dans tous les secteurs des zones U et AU, sont\ninterdites en secteur M, les occupations et utilisations du sol suivantes :\n1.2.1    Les constructions*, installations et ouvrages à destination exclusive d’entrepôt ;\n1.2.2    Les constructions*, installations et ouvrages à destination d’artisanat, ainsi que leur extension*,\n    à l’exception de celles mentionnées à l’article U 2.2 ;\n1.2.3    Les constructions*, installations et ouvrages à destination d’industrie, ainsi que leur extension* ;\n1.3.    Occupations et utilisations du sol interdites en secteurs R et Rs\nEn sus des occupations et utilisations du sol interdites dans tous les secteurs des zones U et AU, sont\ninterdites en secteur R et Rs, les occupations et utilisations du sol suivantes :\n1.3.1    Les constructions*, installations et ouvrages à destination d’industrie, ainsi que leur extension* ;\n1.3.2    Les constructions*, installations et ouvrages à destination exclusive d’entrepôt ;\n1.3.3    Les constructions*, installations et ouvrages à destination d’artisanat, ainsi que leur extension*,\n    à l’exception de celles mentionnées à l’article U 2.3 ;\n1.3.4    Les constructions*, installations et ouvrages à destination de bureaux, ainsi que leur extension*,\n    à l’exception de celles mentionnées à l’article U 2.3 ;\n1.3.5    Les constructions*, installations et ouvrages à destination de commerces, ainsi que leur\n    extension*, à l’exception de celles mentionnées à l’article U 2.3. ;\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    54/103","    ZONES\n    U AU\n1.4.    Occupations et utilisations du sol interdites en secteurs A, Ai, As et Az\nEn sus des occupations et utilisations du sol interdites dans tous les secteurs des zones U et AU, sont\ninterdites en secteur A, Ai, As et Az, les occupations et utilisations du sol suivantes :\n1.4.1    Les constructions*, installations et ouvrages à destination d’habitat, ainsi que leur extension*, à\n    l’exception de celles mentionnées à l’article U 2.4. ;\n1.4.2    L’ouverture et l’exploitation de carrières, ainsi que toute exploitation du sous-sol ;\n1.4.3    En dehors des îlots délimités pour la diversité commerciale, les constructions* à usage de\n    commerces, à l’exclusion de celles mentionnées à l’article U 2.4.\nEn sus des occupations et utilisations du sol interdites à l’article 1.4, sont interdites dans les secteurs A\net As, à l’exclusion du secteur Ai et Az :\n1.4.4    Les constructions*, installations et ouvrages à destination d’industrie, ainsi que leur extension* ;\nEn sus des occupations et utilisations du sol interdites à l’article 1.4, sont interdites dans les secteurs\nA, As et Az à l’exclusion du secteur Ai :\n1.4.5    Les constructions*, installations et ouvrages à destination exclusive d’entrepôt ainsi que leur\n    extension* à l’exception de celles mentionnées à l’article U 2.4.\n1.5.    Occupations et utilisations du sol interdites en secteur E\n1.5.1    Sont interdites toutes les occupations et utilisations du sol non mentionnées à l’article U 2.5.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    55/103","    ZONES\n    U AU\nARTICLE U 2 - OCCUPATIONS    ET UTILISATIONS DU SOL ADMISES SOUS CONDITIONS\n    PARTICULIERES\n2.1.    Occupations et utilisations du sol admises sous conditions dans tous les secteurs des\n    zones U et AU\n2.1.1    La création, l’extension* et la modification des installations classées pour la protection de\n    l'environnement*, à condition qu’elles correspondent à des besoins nécessaires à la vie et à la\n    commodité des habitants et autres usagers du secteur ou à condition qu’elle revête un caractère\n    d’intérêt général démontré dans le cadre d’une procédure de déclaration de projet ou qu’elle\n    s’insère dans une opération d’aménagement qui présente elle aussi un caractère d’intérêt\n    général ayant fait l’objet d’une procédure de déclaration de projet, que soient mises en œuvre\n    toutes les dispositions pour les rendre compatibles avec l’habitat environnant, qu’il n’en résulte\n    pas pour le voisinage de nuisances (bruits, circulation, etc.) ou de risques (incendie, explosion,\n    etc.) ou à condition d’être nécessaire au fonctionnement du réseau de transport public du Grand\n    Paris ;\n2.1.2    Les constructions*, installations et ouvrages à destination d’exploitation agricole ou forestière,\n    ainsi que leur extension* à condition qu’ils respectent cumulativement les conditions suivantes :\n    -    que par leur implantation, volumétrie, accès ils ne compromettent pas le\n    fonctionnement urbain du secteur concerné ;\n    -    que ceux-ci n’entrainent pas de limitations d’usages sur les destinations autorisées\n    en zone U et ne créent pas de nouvelles nuisances.\n2.2.    Occupations et utilisations du sol admises sous conditions en secteur M\nSont autorisées, sous réserve de conditions particulières, les occupations et utilisations du sol\nsuivantes :\n2.2.1    Les constructions*, installations et ouvrages à destination d’entrepôt, ainsi que leur extension*,\n    à condition qu’ils soient directement liés à une construction* autorisée dans la zone, qu’ils soient\n    situés sur le même terrain* que la construction* dont ils dépendent et que leur surface n’excède\n    pas un tiers de la surface de plancher* totale de l’activité admise ;\n2.2.2    Les constructions*, installations et ouvrages à destination d’artisanat, ainsi que leur extension*,\n    à condition que leur surface de plancher* n’excède pas 800 m² et qu’elles ne présentent pas de\n    nuisances incompatibles avec la proximité de l’habitat;\n2.3.    Occupations et utilisations du sol admises sous conditions en secteurs R et Rs\nSont autorisées, sous réserve de conditions particulières, les occupations et utilisations du sol\nsuivantes :\n2.3.1    Les réhabilitations* de constructions*, installations et ouvrages existants à destination\n    d’entrepôts, d’artisanat, de commerces régulièrement autorisés à condition qu’elles soient\n    nécessaires et liées au fonctionnement de l’activité principale de la construction* compatible\n    avec le caractère de la zone ;\n2.3.2    Les constructions*, installations et ouvrages à destination de bureaux, ainsi que l’extension* de\n    ces dernières à condition que leur surface de plancher* n’excède pas 300 m² ;\nEn sus des occupations et utilisations du sol autorisées à l’article 2.3, sont autorisés sous conditions\ndans le seul secteur R, à l’exclusion du secteur Rs :\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    56/103","    ZONES\n    U AU\n 2.3.3    Les constructions*, installations et ouvrages à destination d’artisanat, ainsi que leur extension*,\n    à condition que leur surface de plancher* n’excède pas 200 m² ;\n 2.3.4    Les constructions*, installations et ouvrages à destination de commerces, ainsi que leur\n    extension*, à condition que leur surface de plancher* n’excède pas 200 m² ;\n2.4. Occupations et utilisations du sol admises sous conditions en secteurs A, As, Ai et Az\nSont autorisées, sous réserve de conditions particulières, les occupations et utilisations du sol\nsuivantes :\n   2.4.1    Les constructions*, installations et ouvrages à destination d’habitation à condition qu’elles\n    soient directement liées à la fonction de gardiennage ou directement nécessaires à une\n    activité autorisée dans le secteur, qu’elles soient situées sur le même terrain* que l’activité\n    dont elles dépendent et que leur surface de plancher* n’excède pas 90 m² ;\n   2.4.2    Les constructions à usages de commerces, à condition qu’elles respectent au moins l’une des\n    conditions suivantes :\n    -   A condition qu’elles constituent un local accessoire à une activité autorisée et que leurs\n    surfaces soient limitées à 1/3 de la destination principale,\n    ou\n    -   A condition qu’elles soient à destination exclusive de restauration,\n    ou\n    -   A condition qu’elles soient situées dans un îlot délimité pour la diversité commerciale ou\n    dans une gare du réseau de transport public du Grand Paris.\n    Sur la commune de Montigny-le-Bretonneux uniquement, les constructions et\n    installations à usage de commerces situées dans un îlot délimité pour la diversité\n    commerciale sont, en sus, limitées à une surface de vente de 400 m².\nEn sus des occupations et utilisations du sol admises sous conditions à l’article U 2.4.1 et 2.4.2, sont\nadmises sous conditions dans les seuls secteurs A, As et Az :\n   2.4.3    Les constructions*, installations et ouvrages à destination d’entrepôt, ainsi que leur\n    extension*, à condition qu’ils soient directement liés à une construction* autorisée dans la\n    zone, qu’ils soient situés sur le même terrain* que la construction dont ils dépendent et que\n    leur surface n’excède pas un tiers de la surface de plancher* totale de l’activité admise ;\n 2.5.    Occupations et utilisations du sol admises sous conditions en secteur E\n Sont autorisées, sous réserve de conditions particulières, les occupations et utilisations du sol\n suivantes :\n 2.5.1    Les constructions*, installations et ouvrages nécessaires aux services publics ou d’intérêt\n    collectif, ainsi que leur extension* à condition de garantir leur bonne insertion dans le site ;\n 2.5.2    Les constructions*, installations et ouvrages à destination d’habitation à condition qu’elles soient\n    directement liées à la fonction de gardiennage ou directement nécessaires à une activité\n    autorisée dans la zone, qu’elles soient situées sur le même terrain* que l’activité dont elles\n    dépendent et que leur surface de plancher* n’excède pas 90 m2 ;   P   P\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    57/103","    ZONES\n    U AU\nARTICLE U 3 - CONDITIONS DE DESSERTE DES TERRAINS* PAR LES VOIES* PUBLIQUES OU\n    PRIVEES ET D’ACCES* AUX VOIES* OUVERTES AU PUBLIC\nSe reporter à l’article 3 des dispositions communes applicables à toutes les zones.\nARTICLE U 4 - CONDITIONS DE DESSERTES DES TERRAINS* PAR LES RESEAUX PUBLICS\nSe reporter à l’article 4 des dispositions communes applicables à toutes les zones.\nARTICLE U 5 - SUPERFICIE MINIMALE DES TERRAINS*\nSans objet.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    58/103","    ZONES\n    U AU\nARTICLE U 6 - IMPLANTATION    DES CONSTRUCTIONS* PAR RAPPORT AUX VOIES* ET\n    EMPRISES PUBLIQUES*\n6.1.    Dispositions générales\n6.1.1    Le présent article s’applique aux voies* existantes et à créer telles que définies dans le présent\n    règlement. Ainsi, lorsqu’un emplacement réservé est inscrit sur le terrain* en vue de la création\n    ou de l’élargissement d’une voie* ou d’un carrefour, la limite de l’emplacement réservé tient\n    lieu d’alignement* pour l’application du présent article ;\n6.1.2    Lorsque le terrain* est desservi par plusieurs voies*, Une adaptation respectant l’organisation\n    urbaine et les spécificités locales pourra être étudiée, en fonction du contexte local pour ne\n    pas obérer leur constructibilité ;\n6.1.3    Les éventuelles saillies* et surplombs au-dessus du domaine public peuvent être autorisés\n    sous réserve d’une autorisation délivrée par le gestionnaire de l’espace public.\n6.1.4    Pour la destination « habitation » des dispositions doivent être prises pour assurer l’intimité\n    des logements construits en rez-de-chaussée.\n6.2.    Dispositions applicables aux constructions* et installations nécessaires aux services\n    publics ou d’intérêt collectif quel que soit l’indice du secteur\n6.2.1.    Sauf dispositions particulières portées aux documents graphiques, le plan des façades* des\n    constructions* peut être implanté :\n    −    Soit à l’alignement* ;\n    −    Soit en recul* de 0,50 mètres minimum de l’alignement* des voies*.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    59/103","    ZONES\n    U AU\n6.3.    Dispositions applicables aux secteurs régis par les indices 1, 7 et 8\n6.3.1    Sauf dispositions particulières portées aux documents graphiques, le plan des façades* des\n    constructions* peut être implanté :\n    −    Soit à l’alignement* des voies;\n    −    Soit en recul* de 0,50 mètre minimum de l’alignement*.\n6.3.2    Sauf dispositions particulières portées aux documents graphiques, le plan des façades* des\n    constructions* doit être implanté à l’alignement ou en recul* de 1 mètres minimum de\n    l’alignement* des emprises publiques* ;\n6.4.    Dispositions applicables aux secteurs régis par l’indice 2\n6.4.1    Sauf dispositions particulières portées aux documents graphiques, le plan des façades* des\n    constructions* doit être implanté en recul* de 3 mètres minimum de l’alignement* des voies* ;\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    60/103","    ZONES\n    U AU\n6.4.2    Sauf dispositions particulières portées aux documents graphiques, le plan des façades* des\n    constructions* doit être implanté en recul* de 3 mètres minimum de l’alignement* des emprises\n    publiques* ;\n6.5.    Dispositions applicables aux secteurs régis par l’indice 4\n6.5.1    Sauf dispositions particulières portées aux documents graphiques, le plan des façades* des\n    constructions* doit être implanté à l’alignement* des voies* ;\n6.5.2    Toutefois, un recul* est admis dans les cas suivants :\n    − Si un mur de clôture* tel que défini à l’article 11 est réalisé pour maintenir la continuité\n    urbaine, dans ce cas, les constructions* peuvent s’implanter en recul* d’au moins 1 mètre\n    ;\n    − Si la parcelle comporte un immeuble dont le traitement et l’agencement de l’entrée est\n    rendu impossible ;\n    − Si la parcelle comporte un espace boisée classé au titre de l’article L113-1 et suivant du\n    Code de l’Urbanisme ou un élément repéré et protégé au titre de l’article L151-23 du Code\n    de l’Urbanisme, dont la localisation rend impossible une implantation des constructions*\n    conforme à l’article 6.4.1.\n6.5.3    Sauf dispositions particulières portées aux documents graphiques, le plan des façades* des\n    constructions* doit être implanté en recul* de 3 mètres minimum de l’alignement* des emprises\n    publiques* ;\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    61/103","    ZONES\n    U AU\n6.6.    Dispositions applicables aux secteurs régis par les indices 3 et 5\n6.6.1    Sauf dispositions particulières portées aux documents graphiques, le plan des façades* des\n    constructions* doit être implanté en recul* de 5 mètres minimum de l'alignement* des voies.\n6.6.2    Sauf dispositions particulières portées aux documents graphiques, le plan des façades* des\n    constructions* doit être implanté en recul* de 5 mètres minimum de l’alignement* des\n    emprises publiques* ;\n6.7.    Dispositions applicables aux secteurs régis par l’indice 6\n6.7.1    Sauf dispositions particulières portées aux documents graphiques, le plan des façades* des\n    constructions* doit être implanté avec un recul* au moins égal à la moitié de la hauteur* de la\n    façade* (L= h/2) avec un minimum de 5 mètres par rapport à l’alignement*.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    62/103","    ZONES\n    U AU\n6.8.    Dispositions applicables aux secteurs régis par l’indice 9\n6.8.1    Sauf dispositions particulières portées aux documents graphiques, le plan des façades* des\n    constructions* doit être implanté en recul* de 3 mètres minimum de l’alignement* des voies* ;\n    3\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    63/103","    ZONES\n    U AU\nARTICLE U 7 - IMPLANTATION    DES    CONSTRUCTIONS*    PAR    RAPPORT    AUX    LIMITES\n    SEPARATIVES*\n7.1.    Dispositions générales\n7.1.1    Le présent article ne s’applique pas aux constructions* annexes* dont la hauteur* totale et\n    l’emprise au sol n’excèdent pas respectivement 2,50 mètres et 15 m² de surface.\n7.1.2    La distance est calculée de la limite séparative* au plan des façades* tous débords et surplomb\n    exclus.\n7.2.    Dispositions applicables aux constructions* et installations nécessaires aux services\n    publics ou d’intérêt collectif quel que soit l’indice du secteur\n7.2.1    Les constructions* peuvent s’implanter :\n    −    Soit en limite(s) séparative(s)* ;\n    −    Soit en retrait* d’1 mètre minimum.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    64/103","    ZONES\n    U AU\n7.3.    Dispositions applicables aux secteurs régis par les indices 1, 2, et 4.\n7.3.1    Les constructions* peuvent s’implanter :\n    −    Soit en limite(s) séparative(s)* ;\n    −    Soit en retrait*.\n7.3.2    Pour les constructions* qui ne s’implantent pas en limite séparative* :\n    −    Les constructions* dont la hauteur* de façade* est inférieure ou égale à 10 mètres\n    doivent être implantées en retrait* de 2,50 mètres minimum des limite(s)\n    séparative(s)* ;\n    −    Les constructions* dont la hauteur* de façade* est supérieure à 10 mètres doivent être\n    implantées en retrait* de 5 mètres minimum des limite(s) séparative(s)*.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    65/103","    ZONES\n    U AU\n7.4.    Dispositions applicables aux secteurs régis par l’indice 3\n7.4.1    Les constructions* doivent s’implanter en retrait* des limites séparatives* en respectant les\n    dispositions suivantes :\n    −    Les constructions* dont la hauteur* est inférieure ou égale à 4 mètres doivent être\n    implantées en retrait* de 5 mètres minimum des limites séparatives* ;\n    −    Les constructions* dont la hauteur* est supérieure à 4 mètres doivent être implantées\n    en retrait* de 7 mètres minimum des limites séparatives*.\n7.4.2    Le présent article ne s’applique pas aux auvents, préaux et aux extensions* des constructions*\n    existantes inférieures à 25 m² d’emprise au sol * et dont la hauteur* totale est inférieure à 3\n    mètres.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    66/103","    ZONES\n    U AU\n7.5.    Dispositions applicables aux secteurs régis par l’indice 5\n7.5.1    Les constructions* doivent\n    s’implanter en retrait* des\n    limites séparatives* en\n    respectant un retrait* minimum\n    de 5 mètres.\n7.6.    Dispositions applicables aux secteurs régis par l’indice 6\n7.6.1    Les constructions* doivent\n    s’implanter en retrait* des\n    limites séparatives*. Le plan\n    des    façades*    des\n    constructions* doit respecter un\n    retrait* minimum égal à la\n    moitié de la hauteur* de\n    façade* (L=h/2) avec un\n    minimum de 5 mètres.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    67/103","    ZONES\n    U AU\n7.7.    Dispositions applicables aux secteurs régis par l’indice 7\n7.7.1    Les constructions* peuvent s’implanter :\n    −    Soit en limite(s) séparative(s)* ;\n    −    Soit en retrait*.\n7.7.2    Pour les constructions* qui ne s’implantent pas en limites séparatives* :\n    −    Le plan des façades* des constructions* doit respecter un retrait* minimum égal à la\n    moitié de la hauteur* de façade* (L=h/2) avec un minimum de 5 mètres.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    68/103","    ZONES\n    U AU\n7.8.    Dispositions applicables aux secteurs régis par l’indice 8\n7.8.1    Les    constructions*    peuvent\n    s’implanter :\n    −    Soit en limite(s) séparative(s)*\n    si elles n’ont pas d’ouverture* ;\n    −    Soit en retrait*.\n7.8.2    Pour les constructions*    qui ne\n    s’implantent    pas en    limite(s)\n    séparative(s)* :\n    Pour les constructions* comportant\n    des    ouvertures*    en    rez-de-\n    chaussée, la distance de retrait* est\n    de 5 m minimum par rapport à la\n    limite séparative* de fond de\n    parcelle. Il n’est fixé aucune\n    distance de retrait* par rapport aux\n    limites séparatives* latérales.\n    Les parties de façades* comportant\n    des ouvertures* situées à une\n    hauteur* supérieure à 3 mètres du\n    sol naturel*, c’est-à-dire à l’étage\n    des    constructions*,    doivent\n    respecter un retrait* minimum de 5\n    mètres. Sur les limites séparatives\n    latérales,cette distance peut être\n    réduite à 2,5 mètres si aucune des\n    dimensions de ces ouvertures* n’est supérieure à 50 cm.\n7.9.    Dispositions applicables aux secteurs régis par l’indice 9\n7.9.1    Les constructions* peuvent s’implanter :\n    −   Soit en limite(s) séparative(s)* si elles n’ont\n    pas d’ouverture* ;\n    −    Soit en retrait*.\n7.9.2    Pour les constructions* qui ne s’implantent pas en\n    limite(s) séparative(s)* :\n    −   Si la façade* en vis-à-vis de la limite\n    séparative* n’a pas d’ouverture*, les\n    constructions* doivent s’implanter avec un retrait*\n    minimum de 3 mètres.\n    −    Si la façade* en vis-à-vis de la limite\n    séparative* comporte une ou plusieurs\n    ouvertures*, les constructions* doivent\n    s’implanter avec un retrait* minimum de 6 mètres.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    69/103","    ZONES\n    U AU\nARTICLE U 8 - IMPLANTATION DES CONSTRUCTIONS* LES UNES PAR RAPPORT AUX AUTRES\n    SUR UNE MEME PROPRIETE\n8.1.    Dispositions générales\n8.1.1    Le présent article ne s’applique pas aux constructions* et installations nécessaires aux\n    services publics ou d’intérêt collectif.\n8.1.2    Le présent article ne s’applique pas aux constructions* annexes* dont la hauteur* totale et\n    l’emprise au sol n’excèdent pas respectivement 2,50 mètres et 15 m² de surface.\n8.1.3    La distance est calculée au plan des façades* tous débords et surplomb exclus.\n8.2.    Dispositions aux secteurs régis par les indices 1, 2, 4, 5, 6 et 7\n8.2.1    Les constructions* non contiguës implantées sur une même unité foncière* devront respecter\n    une distance de retrait* qui doit être au moins égale à la moitié de la hauteur* de la façade*\n    de la construction* la plus haute sans pouvoir être inférieure à 2,5 mètres.\n8.3    Dispositions applicables aux secteurs régis par l’indice 3\n8.3.1    Les constructions* non contiguës implantées sur une même unité foncière* devront respecter\n    une distance de retrait* qui doit être au moins égale à la moitié de la hauteur* de la façade*\n    de la construction* la plus haute sans pouvoir être inférieure à 10 mètres.\n8.4.    Dispositions applicables aux seuls secteurs régis par l’indice 9\n8.4.1    Les constructions* non contiguës implantées sur une même unité foncière* devront respecter\n    une distance de retrait* qui doit être au moins égale à la moitié de la hauteur* de la façade*\n    de la construction* la plus haute sans pouvoir être inférieure à 10 mètres.\n8.5.    Dispositions applicables aux seuls secteurs régis par l’indice 8\n8.5.1    Les constructions* non contiguës implantées sur une même unité foncière* devront respecter\n    une distance de retrait* qui doit être au moins égale à la moitié de la hauteur* de la façade*\n    de la construction* la plus haute sans pouvoir être inférieure à 6 mètres.\n8.5.2    Toutefois, cette distance peut être réduite de moitié, pour les parties de constructions* ne\n    comportant pas d’ouverture* ou qui comporte une ouverture* dont aucune dimension n’excède\n    50 cm.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    70/103","    ZONES\n    U AU\n    ARTICLE U 9 - EMPRISE AU SOL\n    9.1.    Dispositions générales\nL’emprise au sol maximale des constructions* est fixée en fonction de l’indice porté dans le nom de la zone\nou du secteur, conformément au tableau suivant.\n    Indices    Emprise au sol maximale des constructions*\n    «a»    Non règlementée\n    «b»    80% de la surface du terrain*\n    «c»    60% de la surface du terrain*\n    «d»    50% de la surface du terrain*\n    « e»    40% de la surface du terrain*\n    «f»    30% de la surface du terrain*\nPour les constructions et installations du réseau de transport public du Grand Paris, l’emprise au sol n’est pas\nrèglementée.\n    9.2.    Dispositions applicables aux seuls secteurs régis par l’indice 8\nDans les seuls secteurs régis par l’indice 8 et uniquement pour les constructions* existantes à destination\nd’habitation, les possibilités d’extension* au sol, par habitation, sont permises conformément au tableau ci-\ndessous. Les possibilités d’extension* sont définies par rapport à l’emprise au sol indiquée dans le permis\nde construire initial.\n  Superficie des terrains*    Extension* au sol dans le\n    compris entre    prolongement de la    Abri de jardin*- abri à bois –\n    0 et 400 m²    construction* existante    construction* annexe*\n 0 - 200 m2    20 m²    6 m² maximum qui viennent en déduction\n    des 20 m² autorisés\n 201 - 300 m2    20 m²    6 m²\n 301 - 400 m2    25 m²    6 m²\n  Superficie des terrains*    Superficie maximale    Abri de\n    compris entre    Extension* au sol limitée à    autorisée pour une    jardin* -\n    401 et +500 m²    construction* annexe*    abri à bois\n    venant en déduction de\n    l’extension* autorisée\n    401 - 500 m2    35 m²    15 m²    6 m²\n    + 500 m2    45 m²    20m²    6 m²\nPour les terrains* compris dans des copropriétés horizontales, chaque construction* à usage d’habitation\npeut bénéficier de 20 m² d’extension* par rapport au permis initial.\nPour les constructions* neuves et pour les autres destinations, les règles mentionnées en 9.1 s’appliquent.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    71/103","    ZONES\n    U AU\n    ARTICLE U 10 -    HAUTEUR* MAXIMALE DES CONSTRUCTIONS*\n    10.1    Dispositions générales\nLa hauteur* maximale autorisée des constructions* est une hauteur* exprimée en mètres. Celle-ci repose sur\nles éléments suivants :\n    -    Une hauteur* maximum au point le plus haut de la construction*U (H) exprimée par le dernier\n    nombre porté par le nom du secteur.\n    -    Une hauteur* maximale de la façade*(h) hors attique définie à l’égout du toit ou au pied de\n    l’acrotère* des terrasses\n    -    A cette hauteur* maximale autorisée est associé le tableau de correspondance ci-dessous\n    affichant le nombre de niveaux* maximum admis pour une hauteur* donnée :\n  Hauteur* totale maximale de Nombre de niveaux*    Hauteur* maximale en mètres\n la construction* = indice porté maximum admis pour    de la façade*\n    dans la zone (H)    les constructions*    (h)\n    6    R ou R+C ou A    4\n    9    R+1 ou R+1+C ou A    7\n    13    R+2 ou R+2+C ou A    10\n    16    R+3 ou R+3+C ou A    13\n    19    R+4 ou R+4+C ou A    16\n    22    R+5 ou R+5+C ou A    19\n    25    R+6 ou R+6+C ou A    22\n    28    R+7 ou R+7+C ou A    25\n    31    R+8 ou R+8+C ou A    28\n    34    R+9 ou R+9+C ou A    31\n    37    R+10 ou R+10+C ou A    34\n    40    R+11 ou R+11+C ou A    37\n    43    R+12 ou R+12+C ou A    40\n*Le « R »correspond au rez-de-chaussée, le chiffre au nombre d’étage et le « C ou A » au comble* ou à l’attique*.\n    -    Des précisions ou exceptions aux règles de hauteur peuvent être apportées ponctuellement dans\n    les Orientations d’Aménagement et de Programmation, afin de permettre la réalisation de points\n    hauts ou d’assurer un horizon compatible aux objectifs des projets portés par les OAP.\n    10.2    Dispositions complémentaires applicables aux seuls secteurs régis par l’indice 8\n    -    Pour les terrains* déjà bâtis à la date d’approbation du PLUi n’est autorisée qu’une seule\n    surélévation* par rapport au permis de construire d’origine.\n    -    Dans le cas d’une surélévation* sur tout ou partie de la construction*, la hauteur* de façade* ne\n    peut pas être augmentée de plus d’un mètre par rapport à la construction* d’origine.\n    -    La hauteur* des extensions* créant une emprise au sol ne peut pas être supérieure à 5 mètres.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    72/103","    ZONES\n    U AU\n    -    La hauteur* des annexes* accolées ou dissociées de la construction principale est limitée à 2,50\n    mètres.\n    10.3    Dispositions complémentaires applicables aux seuls secteurs A, Ai et Az\nDans les secteurs dévolus à l’activité, des hauteurs plus importantes sont autorisées pour permettre la\nconstruction et la rénovation des cheminées et autres dispositifs techniques nécessaires au fonctionnement\ndes activités industrielles et artisanales, sous réserve d’une bonne intégration à leur environnement.\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    73/103","    ZONES\n    U AU\nARTICLE U 11 -    ASPECT EXTERIEUR\n11.1.    Dispositions générales\n11.1.1    Tout projet ne s’intégrant pas dans son contexte urbain ou niant la structure paysagère et\n    l’organisation du quartier dans lequel il se trouve pourra être refusé.\n    Nonobstant les dispositions du présent article, le projet peut être refusé ou n'être accepté que\n    sous réserve de l'observation de prescriptions spéciales pour les constructions* ou\n    installations ne présentant pas d’unité d’aspect, ni de réel équilibre dans le jeu des volumes,\n    dans le rythme et les proportions des percements, dans la modénature et dans la coloration\n    des parements de façades*.\n11.1.2    Les constructions* doivent être adaptées par leur type ou leur conception à la topographie du\n    terrain* et non l’inverse.\n11.1.3    Les locaux techniques (locaux poubelles, boîtes aux lettres, bornes techniques, etc …) doivent\n    être intégrés dans la construction*, un mur de clôture* ou être regroupés dans des locaux\n    annexes bien intégrés à l’opération.\n11.1.4    Les emplacements destinés aux déchets doivent être masqués depuis la voie* publique.\n11.1.5    Les climatiseurs et pompes à chaleur visibles depuis l’espace public doivent être intégrés dans\n    des éléments d’architecture. Sur les autres façades, ils devront être intégrés (non saillants) à\n    la façade. S’ils sont posés sur des toitures terrasses ils devront être intégrés à des éléments\n    d’architecture.\n11.1.6    Les constructions* et installations nécessaires au fonctionnement des services publics ou\n    d’intérêt collectif ne sont pas soumises à ces dispositions.\n11.2    Façades*\n11.2.1    Les nouvelles constructions* doivent utiliser des matériaux de qualité et de préférence les\n    matériaux déjà présents sur les édifices du quartier et présenter une bonne qualité\n    architecturale. D’une manière générale, les matériaux mis en œuvre doivent être compatibles\n    avec l’architecture des bâtiments et doivent permettre un vieillissement correct de l’ouvrage ;\n11.2.2    Le revêtement des façades* doit être pensé en harmonie avec celui des constructions*\n    avoisinantes ou faire l’objet d’une composition qui s’intègre à l’environnement. Les teintes\n    choisies devront s’appuyer de préférence sur les nuanciers présenté en annexe 1 du présent\n    règlement ou en annexe 6 du présent règlement pour la commune de Montigny-le-\n    Bretonneux ;\n11.2.3    L’ensemble de la construction*, y compris les ouvrages techniques ainsi que les façades*\n    latérales et arrières, doivent être traités avec le même soin que la façade* principale et en\n    harmonie avec elle (matériaux, couleurs, nature des parements, etc.) ;\n11.2.4    L’emploi à nu des matériaux destinés à être recouvert est interdit.\n11.3    Toitures\n11.3.1    Les toitures des constructions* devront présenter une simplicité de volume et une unité de\n    conception ;\n11.3.2    Pour éviter les effets de toiture importants, les combles* ne pourront abriter qu’un seul niveau*\n    aménageable ;\n    PLUi – Règlement – Modification simplifiée n°3 – février 2026\n    74/103","    ZONES\n    U AU\n11.3.3   Les toitures terrasses sont autorisées à condition de faire l’objet d’un traitement de finition\n    particulièrement soigné.\n11.3.4   Les vérandas, auvents et marquises sont autorisés sans qu’aucune pente ne soit imposée.\n11.3.5   Pour les secteurs régis par les indices 1, 2, 3, 5, 6, 7 et 9 les toitures à pentes présenteront\n    une inclinaison maximum de 40°.\n11.3.6   Pour les secteurs régis par l’indice 4,\n    −   les toitures à pentes présenteront une inclinaison de 45° maximum,\n    −   la forme des toitures existantes à la date d’approbation du PLUi seront conservées,\n    −   lorsqu’elles existent, les petites tuiles plates seront conservées en couverture de toiture,\n    −   pour les constructions* neuves, les matériaux utilisés en couverture pour les toitures à\n    pentes devront préférentiellement avoir l’aspect de petites tuiles plates traditionnelles,\n    −   les toitures terrasses ne sont autorisées que si elles sont végétali
