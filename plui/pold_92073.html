e plancher\nSalles de spectacles    . 1 place / 10 personnes    1 place / 100 personnes\nEnseignement primaire    . 1 place / classe    Non réglementé.\nEnseignement secondaire    . 1 place / classe    Non règlementé\nEnseignement supérieur    . 1 place / 7 élèves    7 places / 100 m² de surface de plancher\nRésidence personnes âgées    . 1 place pour 10 unités d’habitation.    Non réglementé.\nFoyer de travailleurs    . 1 place pour 4 lits/ unités d’habitation.    Non réglementé.\n    12.3    Cas des changements de destination et des extensions\n    12.3.1 Il est obligatoire de maintenir les places de stationnement automobile existantes, dans la limite\n    des nouveaux besoins, avec possibilité de les déplacer.\n    12.3.2 En cas d’extension sans création de logements, les normes énoncées aux articles 12.1 à 12.2 ne\n    sont applicables que pour la surface de plancher créée et lorsqu’elle induit la création de plus de 2 places\n    de stationnement.\n    72","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n12.3.3 En cas de changement de destination, les normes énoncées aux articles 12.1 à 12.2 ne sont\napplicables que lorsqu’il induit la création de plus de 2 places de stationnement.\n12.4    Prise en compte des transports en commun\n12.4.1 Lorsque l’accès des logements mentionnés au 1er et 3ème alinéa de l’article L151-34 du Code\nde l’Urbanisme, est situé à moins de 500 m par les voies praticables d’une gare ou d’une station de\ntransport public guidé ou de transport collectif en site propre et que la qualité de la desserte le permet, le\nnombre d’aires de stationnement exigible par logement ne peut dépasser 0.5, s’il s’agit de logements\nlocatifs financés avec un prêt aidé par l’Etat, d’établissements assurant l’hébergement de personnes âgées\nou de résidences universitaires, et 1 pour les autres catégories de logements.\n12.5    Modalités d’application\n12.5.1 Les places de stationnement doivent être réalisées dans le volume de la construction principale\nde manière privilégiée. Une place maximum peut être réalisée en surface à l’air libre. Cette disposition ne\ns’applique pas aux installations nécessaires aux services publics ou d’intérêt collectif.\n12.5.2 Les places de stationnement aménagées en surface, devront être stabilisées, et\nperméables (pavage non joint, ever-green, etc…) afin de limiter le ruissellement. Elles ne seront âs\ncomptabilisées dans le calcul du coefficient d’espaces verts.\n12.5.3 Les places destinées au stationnement des cycles doivent être aménagées dans un local clos,\ncouvert et éclairé, accessible en toute sécurité. Ce local peut être scindé en plusieurs emplacements et\npeut en outre, accueillir les voitures pour enfants.\n12.5.4 Par ailleurs, il n’est pas fixé de normes pour les installations nécessaires aux services publics ou\nd’intérêt collectif non cités préalablement, les places de stationnement seront en rapport avec le\nfonctionnement et les besoins desdits équipements.\n12.5.5 En cas d’impossibilité architecturale ou technique d’aménager sur le terrain de l’opération, le\nnombre d’emplacements nécessaires au stationnement, le constructeur est autorisé à aménager sur un\nautre terrain, dans un rayon de 300m par les voies praticables, les surfaces de stationnement qui lui font\ndéfaut à condition qu’il apporte la preuve qu’il réalise ou fait réaliser lesdites places.\n12.6    Dispositions diverses\nPour les opérations comptant plus de 15 logements ainsi que les bureaux et les constructions de service\npublic ou d’intérêt collectif, des bornes électriques seront disposées afin d’inciter les utilisateurs à\ndéserter les énergies fossiles. Les dispositions du décret n°2011-873 du 25 juillet 2011 relatif à\nl'application des articles R. 111-14-2 à R. 111-14-5 du code de la construction et de l'habitation) et\nl’arrêté du 20 février 2012 devront être respectées.\n    73","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UD 13 – Espaces libres et plantations, espaces boisés classés\n13.1    Espaces verts\n13.1.1 Les superficies minimales suivantes d'espace vert doivent être aménagées comme suit :\n    Zone    UD\n    -Unité foncière ≤ 150 m² : 20% d’espaces verts dont la totalité\n    en pleine terre\n    -Unité foncière > 150 m² et ≤ 300 m² : 40 % d’espaces verts\n    Coefficient total espace vert\n    dont la totalité en pleine terre\n    Unité foncière > 300 m² : 50% d’espaces verts dont la totalité\n    en pleine terre\nLes toitures végétalisées compteront dans le calcul de la superficie des espaces verts à hauteur de 40 %\nmaximum de cette superficie. Dans ce cas particulier, la notion de pleine terre ne s’applique pas.\n13.1.2 Règle particulière\nDans le cas des unités foncières de plus de 300 m², situées à l’angle de plusieurs rues le coefficient total\nd’espace vert de pleine terre est de 30 %.\n13.2    Plantations\n13.2.1 S’ils existent, les espaces verts doivent être paysagers et plantés à raison d’un arbre par tranche\nde 100 m².\nCette disposition s’applique à partir de 100m². Afin de favoriser la biodiversité, la plantation\nd’essences différentes est à privilégier.\n13.2.2 Les aires de stationnement de surface doivent être plantées à raison d'un arbre pour 3 places.\n13.2.3 Les dalles de parc de stationnement et des constructions à rez-de-chaussée devront faire l’objet\nd’un traitement végétalisé, et recevoir pour cela 50 cm au moins de terre végétale.\n13.2.4 La bande de retrait le long de la voie est traitée en espace vert de façon privilégiée.\n13.3    Dans le cas des installations nécessaires aux services publics ou d’intérêt collectif nécessitant par\nnature d’importants espaces non bâtis, les articles 13.1 et 13.2 ne s’appliquent pas.\n    74","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n SECTION III – Possibilités maximales d’occupation des sols\nARTICLE UD 14 – Coefficient d’occupation du sol (C.O.S.)\nSans objet\n    SECTION IV – Autres dispositions\nARTICLE UD 15 – Performances énergétiques et environnementales\nLes opérations de plus de 1 000 m² de surface de plancher à destination de bureaux ou d’habitation\ndevront respecter les labels de performances énergétiques en vigueur.\nARTICLE UD 16 – Infrastructures et réseaux de communications\nélectroniques.\nLes constructeurs sont invités à se raccorder au réseau numérique dès que cela est possible.\n    75","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    ZONE UE\nCette zone correspond à la Cité-Jardins.\nSECTION I – Nature de l’occupation et de l’utilisation du sol\nARTICLE UE 1 – Occupations et utilisations du sol interdites\n1.1    Sont interdites toutes les occupations et utilisations du sol qui ne sont pas\n    mentionnées à l’article UE 2.\n    -   Les constructions à usage d’activités agricole, artisanales ou industrielles\n    -   Les constructions à usage d’activités commerciales autres que celles autorisées sous condition à\n    l’article 2.\n    -   Les installations classées autres que celles autorisées sous condition à l’article 2\n    -   Le stationnement des caravanes isolées au sens du code de l'urbanisme.\n    -   L’ouverture de terrains aménagés pour l’accueil des campeurs et des caravanes,\n    -   Les dépôts de ferrailles, de matériaux, de combustibles solides ou liquides (hors station service),\n    ainsi que les entreprises de casse de voiture, et de transformation de matériaux de récupération.\n    -   L’ouverture et l’exploitation des carrières ainsi que les affouillements et exhaussements des sols\n    qui n'ont pas de rapport direct avec les travaux de construction ou avec l'aménagement paysager\n    des espaces verts.\nARTICLE UE 2 – Occupations et utilisations du sol soumises à des\nconditions particulières\n2.1    Les occupations et utilisations du sol suivantes sont autorisées si elles respectent les\n    conditions ci-après :\n    -   Les extensions de pavillons conformément au plan masse joint au règlement de l’AVAP valant\n    « site patrimonial remarquable » (conformément à la loi relative à la liberté de la création, à\n    l’architecture et au patrimoine, promulguée le 7 juillet 2016.\n    -   Les extensions des logements de type collectif et des installations nécessaires aux services\n    publics ou d’intérêt collectif sous réserve qu’elles soient en harmonie avec les volumes existants.\n    -   L’aménagement et l’extension des commerces et services dans les volumes des constructions\n    existantes à condition que ces occupations du sol n’entraînent, pour le voisinage aucune\n    nuisance.\n    -   L’aménagement et l’extension dans la limite des constructions existantes des installations\n    classées à condition :\n     que soient mises en œuvre toutes les dispositions utiles pour les rendre compatibles avec\n    les milieux environnants,\n     d’éviter toute pollution, nuisance ou dangers non maîtrisables,\n    -   La construction ou reconstruction de logements collectifs aidés, d’installations nécessaires aux\n    services publics ou d’intérêt collectif, sous réserve d’une bonne intégration dans le site\n    environnant.\n    76","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    SECTION II – Conditions de l’occupation du sol\nARTICLE UE 3 – Accès et voirie\n3.1    Toute nouvelle unité foncière doit disposer d’un accès pour les automobiles par une voie\npublique ou privée, d’une largeur de 3,50 m minimum.\nCette disposition ne s’applique pas aux unités foncières existantes à la date d’approbation du P.L.U.\n3.2    Toute nouvelle voie se terminant en impasse doit être aménagée à son extrémité, de telle manière\nque tous les véhicules amenés à l’emprunter puissent aisément faire demi-tour.\n3.3    Ces accès ne doivent pas présenter un risque pour la sécurité des usagers des voies publiques ou\npour celle des personnes utilisant ces accès.\nCette sécurité doit être appréciée compte tenu notamment, de la disposition des accès, de leur\nconfiguration ainsi que de la nature et de l'intensité du trafic.\nARTICLE UE 4 – Desserte par les réseaux\n4.1    Alimentation en eau potable\nToute construction ou installation nouvelle qui nécessite une alimentation en eau doit être raccordée au\nréseau public de distribution d'eau potable.\n4.2    Assainissement\nToute construction devra respecter les documents suivants :\n     Le règlement du service départemental d’assainissement des Hauts-de-Seine ;\n     Le règlement du service d’assainissement de l’EPT Paris Ouest La Défense.\nCes deux documents sont disponibles en annexe du présent Plan Local d’urbanisme.\n4.3    Autres réseaux\nA l’occasion de toute construction neuve, extension ou surélévation, soumise à permis de construire, les\nréseaux, raccordements (électricité, câble, téléphone…), les installations nouvelles et branchements seront\nobligatoirement réalisés en souterrain ou s'intégreront au bâti.\n4.4    Déchets\nPour les nouvelles constructions de plus de deux logements, des locaux poubelles, correctement\ndimensionnés pour accueillir l’ensemble des bacs de la collecte sélective nécessaires aux usagers, doivent\nêtre aménagés de préférence à rez-de-chaussée des constructions, avec accès direct sur le domaine public.\nDans le cas où les locaux ne permettent pas l’accès direct sur rue, il est vivement recommandé de prévoir\nun lieu de stockage sur le domaine privé, facilitant l’accès aux bacs les jours de collecte.\nUn cahier des charges est joint à l’annexe 6 de la pièce 4.2 « Annexes du rêglement ».\nARTICLE UE 5 – Caractéristiques des terrains\nNon réglementé.\n    77","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UE 6 – Implantation des constructions par rapport aux voies\net emprises publiques ou privées\nLes constructions autorisées doivent s’implanter à l’alignement ou en retrait et en harmonie avec les\nbâtiments existants de la Cité-Jardins ou conformément aux documents graphiques et descriptifs joints à\nl’AVAP valant « site patrimonial remarquable », en cas d’extension de pavillon.\nARTICLE UE 7 – Implantation des constructions par rapport aux\nlimites séparatives\nLes constructions peuvent être implantées :\n    - soit sur les limites séparatives si la façade du batiment sur la limite ne comporte pas de baies,\n    - soit en retrait de 4 mètres minimum,\n    - ou conformément aux documents graphiques et descriptifs joints à l’AVAP valant « site\n    patrimonial remarquable », en cas d’extension de pavillon.\nElles devront être en harmonie avec les bâtiments existants de la Cité-Jardins.\nARTICLE UE 8 – Implantation des constructions non-contigües les\nunes par rapport aux autres sur une même propriété\nLa construction de plusieurs bâtiments non contigus sur une même unité foncière est autorisée, à\ncondition que : en tout point de chaque façade, la distance la séparant de la façade d’un autre bâtiment,\nmesurée perpendiculairement et horizontalement, soit au moins égale à : L = H/2 ≥ 4 m ou conformément\naux documents graphiques et descriptifs joints l’AVAP valant « site patrimonial remarquable », en cas\nd’extension de pavillon.\nARTICLE UE 9 – Emprise au sol\nLes constructions doivent se maintenir dans les emprises au sol d’origine, excepté dans le cas des\nextensions ou constructions autorisées à l’article UE 2 qui doivent se faire en harmonie avec les bâtiments\nexistants de la Cité-Jardins, ou conformément aux documents graphiques et descriptifs joints à l’AVAP\nvalant « site patrimonial remarquable », en cas d’extension de pavillon.\nARTICLE UE 10 – Hauteur maximale des constructions\nLes constructions doivent se maintenir dans les hauteurs d’origine, excepté dans le cas des extensions ou\nconstructions autorisées à l’article UE 2 qui doivent se faire en harmonie avec les bâtiments existants de\nla Cité-Jardins, ou conformément aux documents graphiques et descriptifs joints à l’AVAP valant « site\npatrimonial remarquable », en cas d’extension de pavillon.\n    78","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UE 11 – Aspect extérieur - clôtures\nLe projet peut être refusé ou n’être accepté que sous réserve de l’observation de prescriptions spéciales si\nles constructions, par leur situation, leur architecture, leurs dimensions ou l’aspect extérieur des bâtiments\nou ouvrages à édifier ou à modifier, sont de nature à porter atteinte au caractère ou à l’intérêt des lieux\navoisinants, aux sites, aux paysages naturels ou urbains ainsi qu’à la conservation des perspectives\nmonumentales.\nToute construction, agrandissement, restauration ou aménagement d’immeuble devra prendre en compte\nle caractère du site de façon à s’harmoniser avec son environnement architectural et paysager (toitures,\nmatériaux…).\n11.1    Aspect extérieur\n    -    Les travaux doivent respecter la couleur, la nature des matériaux (matériaux les plus\n    proches de ceux d’origine), les caractéristiques architecturales de l’existant, excepté dans le\n    cas des extensions autorisées à l’article UE2 qui doivent se faire conformément aux\n    documents graphiques et descriptifs joints à l’AVAP valant « site patrimonial remarquable ».\n    -    Les constructions, y compris les clôtures, par leur situation, leur architecture, leur dimensions ou\n    l’aspect extérieur des bâtiments ou ouvrage à édifier ou à modifier, ne doivent pas être de nature\n    à porter atteinte au caractère ou à l’intérêt du site de la Cité-Jardins ainsi qu’à sa conservation.\n    -    Les éléments d’ornementation existants (modénatures, corniches, volets, persiennes, ...) devront,\n    dans la mesure du possible, être conservés et restaurés. Leur restauration pourra être exigée.\n    -    Les antennes collectives et paraboliques sont interdites au même titre que les climatisations en\n    façade sur rue, et seront implantées sur les toitures ou sur les façades du bâtiment, non visibles\n    de la rue\n11.2    Façade\n11.2.1 Les modifications en façade des pavillons doivent se faire conformément aux documents\ngraphiques et descriptifs joints à l’AVAP valant « site patrimonial remarquable ».\n11.2.2 Les modifications en façade des immeubles collectifs et des installations nécessaires aux services\npublics ou d’intérêt collectif doivent respecter les symétries du tracé originel et les couleurs d’origine.\n11.2.3 Les menuiseries doivent respecter le style et la couleur d’origine.\nLa pose de capteurs solaires doit être étudiée, notamment au regard de la trame des ouvertures de la\nfaçade, et afin de favoriser une intégration dans le plan de toiture en façade.\n11.3    Façade commerciale\nLa création et l'aménagement de façades commerciales est autorisée dans les limites suivantes :\n    - La hauteur est limitée au bandeau de séparation du rez-de-chaussée,\n    - La saillie des devantures est limitée à 0,30m par rapport à la façade,\n    - Les percements destinés à recevoir des vitrines devront s’adapter à l’architecture du bâtiment et\n    ne pas empiéter sur les parties maçonnées.\n11.4    Locaux techniques\n11.4.1 Les coffrets, compteurs, boîtes aux lettres devront être intégrés dans les murs de construction ou\nles clôtures.\n11.4.2 En cas d’impossibilité, ils seront réalisés dans une annexe qui prendra en compte le bâti annexe,\nles constructions voisines, la structure végétale existante et les plantations à créer.\n    79","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n11.4.3 Les locaux techniques y compris ceux destinés au stockage des conteneurs adaptés aux ordures\nménagères et au tri sélectif, devront être traités en harmonie avec le bâti principal.\n11.5    Clôtures\nLes clôtures sur les voies publiques ou privées doivent être en harmonie avec les constructions principales\net l’environnement, et en particulier avec les clôtures existantes.\nARTICLE UE 12 - Stationnement\n12.1    Caractéristiques applicables aux parcs de stationnement collectifs\nLes rampes d’accès aux aires de stationnement en sous-sol ne doivent pas entraîner de modification dans\nle niveau du trottoir. Leur pente dans les cinq premiers mètres à partir de l’alignement, ne doit pas\nexcéder 5 %, sauf impossibilité technique.\nA titre indicatif, la surface moyenne par emplacement (dégagement compris) est de l’ordre de 25m² pour\nles automobiles, 4m² pour les motos et 1m² pour les cycles.\nLes places doubles sont autorisées uniquement pour les parcs de stationnement liés à un immeuble\nd’habitation pour lequel le ratio de places directement accessibles est d’une place minimum par logement.\nLargeurs minimales des rampes d’accès :\n    - Sens unique : 3,50 m\n    - Double sens desservant jusqu’à 70 voitures : 3,50 m\n    - Double sens desservant plus de 70 voitures : 6,00 m\n12.2    Nombre d’emplacements\nLes places de stationnement seront en rapport avec le fonctionnement et les besoins des constructions\nréalisées.\n12.3    Insertion dans l’environnement\nLe stationnement devra s’intégrer harmonieusement dans l’environnement, et notamment les aires ou\nparcs de stationnement qui ne doivent pas altérer l’intégrité du site.\nARTICLE UE 13 – Espaces libres et plantations, espaces boisés classés\n13.1 Plantations\n    -    Les espaces verts existants et les arbres de moyenne et de haute tige devront être préservés dans\n    la mesure du possible afin de pérenniser le caractère végétal de la Cité-Jardins.\n    -    Tout arbre de moyenne et de haute tige abattue, devra être remplacé.\n    -    Les plantations d’ornement de type jardins fleuris sont interdites. Les massifs de fleurs sont\n    encouragés.\n    -    Néanmoins les espèces non compatibles avec le type de sol calcaire Suresnois sont à éviter. Une\n    liste complète des végétaux recommandés est présente dans le règlement de l’AVAP valant « site\n    patrimonial remarquable » (arbres des espaces publics et semi-publics : marronnier, platane,\n    acacia, peuplier, tilleul, catalpa, érable, bouleau ; haies de troènes verts taillés ; arbustes : lilas,\n    rosier haut, althéa, lauriers-thym, escallonia).\n13.2    Les aires de stationnement de surface doivent être entourées de haies et plantées à raison d'un\narbre de haute tige pour 2 places.\n    80","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n SECTION III – Possibilités maximales d’occupation des sols\nARTICLE UE 14 – Coefficient d’occupation du sol (C.O.S.)\nSans objet\n    SECTION IV – Autres dispositions\nARTICLE UE 15 – Performances énergétiques et environnementales\nLes opérations de plus de 1 000m² de surface de plancher à destination de bureaux ou d’habitation\ndevront respecter les labels de performances énergétiques en vigueur.\nARTICLE UE 16 – Infrastructures et réseaux de communications\nélectroniques.\nLes constructeurs sont invités à se raccorder au réseau numérique dès que cela est possible.\n    81","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    ZONE UM\nIl s’agit d’une zone d’activité affectée principalement au fonctionnement du service public ferroviaire.\nSECTION I – Nature de l’occupation et de l’utilisation du sol\nARTICLE UM 1 – Occupations et utilisations du sol interdites\nSont interdites les occupations et utilisations du sol suivantes :\n    - Les constructions à usage d’habitation autres que celles définies à l’article 2\n    - Les constructions à usage d’activités agricole, artisanales ou industrielles autres que celles\n    autorisées sous condition à l’article 2\n    - Les installations classées autres que celles soumises à conditions à l’article 2\n    - Les dépots à l’air libre autre que ceux soumis à condition à l’article 2.\n    - Le stationnement des caravanes isolées au sens du code de l'urbanisme.\n    - L’ouverture de terrains aménagés pour l’accueil des campeurs et des caravanes,\nARTICLE UM 2 – Occupations et utilisations du sol soumises à des\nconditions particulières\n2.1    Ne sont autorisées que les constructions et utilisations du sol définies ci-après :\n    -   Les constructions, installations, dépôts et occupations du sol nécessaires au fonctionnement du\n    service public ferroviaire et ceux réalisés par les clients du chemin de fer pour les emplacements\n    mis à leur disposition pour l’exercice de leurs activités liées au service public ferroviaire\n    (entreposage, stockage et conditionnement des marchandises).\n    -   Le logement des personnes dont la présence est nécessaire pour assurer le fonctionnement et le\n    gardiennage.\nLes constructions à usage de stockage, de services commerce ou artisanat ou installations nécessaires aux\nservices publics ou d’intérêt collectif à condition qu’elles ne soient pas de nature à créer des nuisances\npour le voisinage.\n2.2    Les occupations et utilisations du sol suivantes sont admises si elles respectent les\nconditions ci-après :\nLes installations classées soumise à déclaration, à condition :\n    - que soient mises en œuvre toutes les dispositions utiles pour les rendre compatibles avec les\n    milieux environnants,\n    - d’éviter toute pollution, nuisance ou dangers non maîtrisables.\n    82","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    SECTION II – Conditions de l’occupation du sol\nARTICLE UM 3 – Accès et voirie\n3.1    Toute nouvelle unité foncière doit disposer d’un accès pour les automobiles par une voie\npublique ou privée, d’une largeur de 3,50 m minimum.\nCette disposition ne s’applique pas aux unités foncières existantes à la date d’approbation du PLU.\n3.2    Toute nouvelle voie se terminant en impasse doit être aménagée à son extrémité, de telle manière\nque tous les véhicules amenés à l’emprunter puissent aisément faire demi-tour.\n3.3    Ces accès ne doivent pas présenter un risque pour la sécurité des usagers des voies publiques ou\npour celle des personnes utilisant ces accès. Cette sécurité doit être appréciée compte tenu notamment, de\nla disposition des accès, de leur configuration ainsi que de la nature et de l'intensité du trafic.\nARTICLE UM 4 – Desserte par les réseaux\n4.1    Alimentation en eau potable\nToute construction ou installation nouvelle qui nécessite une alimentation en eau doit être raccordée au\nréseau public de distribution d'eau potable.\n4.2    Assainissement\nToute construction devra respecter les documents suivants :\n     Le règlement du service départemental d’assainissement des Hauts-de-Seine ;\n     Le règlement du service d’assainissement de l’EPT Paris Ouest La Défense.\nCes deux documents sont disponibles en annexe du présent Plan Local d’urbanisme.\n4.3    Autres réseaux\nA l’occasion de toute construction neuve, extension ou surélévation, soumise à permis de construire, les\nréseaux, raccordements (électricité, câble, téléphone…), les installations nouvelles et branchements seront\nobligatoirement réalisés en souterrain ou s'intégreront au bâti.\n4.4    Déchets\nPour les nouvelles constructions de plus de deux logements, des locaux poubelles, correctement\ndimensionnés pour accueillir l’ensemble des bacs de la collecte sélective nécessaires aux usagers, doivent\nêtre aménagés de préférence à rez-de-chaussée des constructions, avec accès direct sur le domaine public.\nDans le cas où les locaux ne permettent pas l’accès direct sur rue, il est vivement recommandé de prévoir\nun lieu de stockage sur le domaine privé, facilitant l’accès aux bacs les jours de collecte.\nUn cahier des charges est joint à l’annexe 6 de la pièce 4.2 « Annexes du rêglement ».\n    83","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UM 5 – Caractéristiques des terrains\nNon réglementé.\nARTICLE UM 6 – Implantation des constructions par rapport aux voies\net emprises publiques ou privées\nA l’exception des plantations et des installations dont l’implantation est commandée par les impératifs\ntechniques de l’exploitation ferroviaire, aucune occupation du sol ni du sous-sol n’est autorisée à moins\nde 1 m de l’alignement.\nARTICLE UM 7 – Implantation des constructions par rapport aux\nlimites séparatives\n    -    Les constructions sont autorisées sur les limites séparatives ou en retrait si la façade du batiment\n    donnant sur la limite est aveugle.\n    -    En retrait de 3 m minimum si la façade comporte des baies.\nARTICLE UM 8 – Implantation des constructions les unes par rapport\naux autres sur une même propriété\nNon réglementé.\nARTICLE UM 9 – Emprise au sol\nNon réglementé.\nARTICLE UM 10 – Hauteur maximale des constructions\nLa hauteur des constructions hormis les cheminées, pylônes, supports de lignes électriques ou d’antennes\net les constructions dont l’implantation est commandée par les impératifs techniques de l’exploitation\nferroviaire ne pourra dépasser 13 m.\nARTICLE UM 11 – Aspect extérieur – clôtures\nLe projet peut être refusé ou n’être accepté que sous réserve de l’observation de prescriptions spéciales si\nles constructions, par leur situation, leur architecture, leurs dimensions ou l’aspect extérieur des bâtiments\nou ouvrages à édifier ou à modifier, sont de nature à porter atteinte au caractère ou à l’intérêt des lieux\navoisinants, aux sites, aux paysages naturels ou urbains ainsi qu’à la conservation des perspectives\nmonumentales.\nToute construction, agrandissement, restauration ou aménagement d’immeuble devra prendre en compte\nle caractère du site de façon à s’harmoniser avec son environnement architectural et paysager (toitures,\nmatériaux…).\n    84","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n11.1    Aspect des toitures\nLes toitures végétalisées sont préconisées. Les couvertures d’aspect précaires sont interdites et en règle\ngénérale les couvertures doivent faire l’objet d’un traitement soigné.\n11.2    Façades - Pignons\n    -    Les différents murs d’un bâtiment ou d’un ensemble de bâtiments doivent être traités avec le\n    même soin et en harmonie entre elles.\n    -    L’emploi à nu de matériaux destinés à être recouverts est interdit.\n    -    Les couleurs de matériaux de parement et des peintures extérieures devront s’harmoniser entre\n    elles et ne pas porter atteinte au caractère urbain.\n    -    Les antennes collectives et paraboliques sont interdites au même titre que les climatisations en\n    façade sur rue et seront implantées sur les toitures ou sur les façades du bâtiment, non visibles de\n    la rue.\n    -    La pose de capteurs solaires doit être étudiée, notamment au regard de la trame des ouvertures de\n    la façade, et afin de favoriser une intégration dans le plan de toiture ou en façade.\n11.3    Annexes, locaux techniques\nLes citernes à gaz liquéfié ou à mazout, ainsi que les installations similaires seront implantées de telle\nmanière qu’elles ne soient pas visibles de la voie publique et devront être masquées.\n11.3.1 Annexes, garages, boxes\nLes bâtiments annexes doivent être conçus en harmonie de volumes et de matériaux avec les constructions\nexistantes. Les annexes réalisées avec des moyens de fortune tels que des matériaux de démolition,\nrécupération de matériaux destinés à être recouverts, utilisés à nu, sont interdits.\n11.4    Clôtures\nLa hauteur totale des clôtures ne pourra excéder 2,60 m.\nARTICLE UM 12 - Stationnement\nLes places de stationnement seront en rapport avec le fonctionnement et les besoins des constructions\nréalisées.\nARTICLE UM 13 – Espaces libres et plantations, espaces boisés classés\n13.1    Espaces verts\nLes superficies minimales suivantes d'espace vert devront être aménagées comme suit :\n40 % au moins des espaces libres doivent être traités en espace vert, dont la moitié en pleine terre.\nLes toitures végétalisées compteront dans le calcul de la superficie des espaces verts à hauteur de 40 %\nmaximum de cette superficie.\n* espaces libres : espaces non construits, non occupés par la voirie, la circulation piétonne ou le stationnement\nobligatoire\n13.2    Plantations\n13.2.1 S’ils existent, les espaces libres doivent être paysagers et afin de favoriser la bio-diversité, la\nplantation d’essences différentes est à privilégier.\n    85","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n SECTION III – Possibilités maximales d’occupation des sols\nARTICLE UM 14 – Coefficient d’occupation du sol (C.O.S.)\nLa surface de plancher constructible résulte des règles précédentes.\n    SECTION IV – Autres dispositions\nARTICLE UM 15 – Performances énergétiques et environnementales\nLes opérations de plus de 1 000 m² de surface de plancher à destination de bureaux ou d’habitation\ndevront respecter les labels de performances énergétiques en vigueur.\nARTICLE UM 16 – Infrastructures et réseaux de communications\nélectroniques.\nLes constructeurs sont invités à se raccorder au réseau numérique dès que cela est possible.\n    86","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    ZONE UPM 1\n    ILOT FOCH\nCARACTERE ET VOCATION DE LA ZONE\nIl s'agit d'une zone recouvrant les principaux bâtiments de l’Hôpital Foch ou le respect des dispositions d'un plan-\nmasse est exigé.\nSECTION I – Nature de l’occupation et de l’utilisation du sol\nARTICLE UPm 1.1 – Occupations et utilisations du sol interdites\nSont interdites toutes les occupations et utilisations du sol, autres que celles définies à l’article UPm 2.\nARTICLE UPm 1.2 – Occupations et utilisations du sol soumises à des\nconditions particulières\n    -   Les constructions nécessaires à l'amélioration et à l'extension d'une unité médicale et ses annexes.\n    -   Les constructions à usage de bureaux, à condition que la surface de plancher ne dépasse pas 10\n    % de la surface de plancher totale de l'unité foncière.\n    SECTION II – Conditions de l’occupation du sol\nARTICLE UPm 1.3 – Accès et voirie\n3.1    Toute nouvelle unité foncière doit disposer d’un accès pour les automobiles par une voie\npublique ou privée, d’une largeur de 3,50 m minimum. Cette disposition ne s’applique pas aux unités\nfoncières existantes à la date d’approbation du PLU\n3.2    Toute nouvelle voie se terminant en impasse doit être aménagée à son extrémité, de telle manière\nque tous les véhicules amenés à l’emprunter puissent aisément faire demi-tour.\n3.3    Ces accès ne doivent pas présenter un risque pour la sécurité des usagers des voies publiques ou\npour celle des personnes utilisant ces accès. Cette sécurité doit être appréciée compte tenu notamment, de\nla disposition des accès, de leur configuration ainsi que de la nature et de l'intensité du trafic.\n    87","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UPm 1. 4 – Desserte par les réseaux\n4.1    Alimentation en eau potable\nToute construction ou installation nouvelle qui nécessite une alimentation en eau doit être raccordée au\nréseau public de distribution d'eau potable.\n4.2    Assainissement\n    -   Toute construction devra respecter les documents suivants :\n       Le règlement du service départemental d’assainissement des Hauts-de-Seine ;\n       Le règlement du service d’assainissement de l’EPT Paris Ouest La Défense.\nCes deux documents sont disponibles en annexe du présent Plan Local d’urbanisme.\n    -   Les toitures végétalisées devront prévoir une zone stérile de 50-80 cm de large aménagée autour\n    de la toiture pour la circulation du matériel technique (et du personnel associé) et l’évacuation\n    des eaux pluviales.\n4.3    Autres réseaux\nA l’occasion de toute construction neuve, extension ou surélévation, soumise à permis de construire, les\nréseaux ou raccordements (électricité, câble, téléphone…) seront obligatoirement réalisés en souterrain ou\ns'intégreront au bâti.\n4.4    Déchets\nPour les nouvelles constructions de plus de deux logements des locaux poubelles, correctement\ndimensionnés pour accueillir l’ensemble des bacs de la collecte sélective nécessaires aux usagers, doivent\nêtre aménagés de préférence à rez-de-chaussée des constructions, avec accès direct sur le domaine public.\nDans le cas où les locaux ne permettent pas l’accès direct sur rue, il est vivement recommandé de prévoir\nun lieu de stockage sur le domaine privé, facilitant l’accès aux bacs les jours de collecte.\nUn cahier des charges est joint à l’annexe 6 de la pièce 4.2 « Annexes du rêglement ».\nARTICLE UPm 1.5 – Caractéristiques des terrains\nNon réglementé.\nARTICLE UPm 1.6 – Implantation des constructions par rapport aux\nvoies et emprises publiques ou privées\nLes implantations des constructions par rapport aux voies publiques ou privées, existantes ou à créer,\ndoivent être conformes aux implantations figurant au plan-masse.\nLes constructions annexes de faibles dimensions sont autorisées en dehors de ces implantations.\nARTICLE UPm 1.7 – Implantation des constructions par rapport aux\nlimites séparatives\nLes constructions en superstructure doivent être implantées à l'intérieur des périmètres de constructibilité\ndéfinis au plan masse.\n    88","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nLes constructions annexes de faibles dimensions sont autorisées en-dehors de ces périmètres.\nARTICLE UPm 1.8 – Implantation des constructions les unes par\nrapport aux autres\nLes constructions doivent être implantées à l'intérieur des périmètres de constructibilité définis au plan-\nmasse.\nLes constructions annexes de faibles dimensions sont autorisées en-dehors de ces périmètres.\nARTICLE UPm 1.9 – Emprise au sol\nLes constructions en superstructure doivent s'implanter dans les emprises définies au plan-masse.\nLes constructions annexes de faibles dimensions sont autorisées en-dehors de ces emprises.\nARTICLE UPm 1.10 – Hauteur maximale\nLes constructions doivent respecter les hauteurs maximales indiquées en cote N.G.F. sur le plan-masse.\nPour l’extension projetée sur la rue Desbassayns de Richemont, la hauteur du bâtiment est limitée par le\nrespect du gabarit L=H sur rue entre le niveau du sol (terrain naturel) et la cote 64 NGF, puis H=L+2.5\nmètres, sur la rue entre la cote 64 NGF et le plafond de zone limité à 77 NGF, ou 80 NGF, suivant le plan\njoint.\nSont autorisées au-dessus de cette hauteur maximale :\n    - Les garde-corps ;\n    - Les édicules en toiture-terrasse végétalisée de faible dimension respectant une hauteur maximale\n    de 3 mètres par rapport au niveau fini de la toiture et un recul d’au moins 10 mètres par rapport\n    aux alignements sur voie.\nLes constructions annexes de faibles dimensions et de hauteur inférieure à 3 m, sont autorisées.\nARTICLE UPm 1.11 – Aspect extérieur – clôtures\nLe projet peut être refusé ou n’être accepté que sous réserve de l’observation de prescriptions spéciales si\nles constructions, par leur situation, leur architecture, leurs dimensions ou l’aspect extérieur des bâtiments\nou ouvrages à édifier ou à modifier, sont de nature à porter atteinte au caractère ou à l’intérêt des lieux\navoisinants, aux sites, aux paysages naturels ou urbains ainsi qu’à la conservation des perspectives\nmonumentales.\nToute construction, agrandissement, restauration ou aménagement d’immeuble devra prendre en compte\nle caractère du site de façon à s’harmoniser avec son environnement architectural et paysager (toitures,\nmatériaux…).\n11.1    Aspect extérieur\nLes constructions, y compris les clôtures, par leur situation, leur architecture, leurs dimensions ou l’aspect\nextérieur des bâtiments ou ouvrages à édifier ou à modifier, ne doivent pas être de nature à porter atteinte\nau caractère ou à l’intérêt des lieux avoisinants, aux sites aux paysages naturels ou urbains, ainsi qu’à la\nconservation des perspectives vers les sites remarquables.\n    89","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n11.1.1 Aspect des toitures\nLes terrasses non-accessibles devront être végétalisées chaque fois que cela est possible. Les couvertures\nd’aspect précaires sont interdites et en règle générale les couvertures doivent faire l’objet d’un traitement\nsoigné.\n11.1.2 Volumes\n    -    Afin d’éviter les gaines en toitures, les dispositifs de type VMC inversée sont à privilégier. Les\n    ouvrages et locaux techniques tels que machineries d’ascenseurs, de réfrigération, sortie de\n    secours, gaines de ventilation … doivent faire partie de la composition volumétrique d’ensemble\n    et ne pas être laissés apparents notamment dans le cas de toiture terrasse : usage de toiture\n    partielle, de dalle, ou de coffrage s’intégrant dans l’ensemble du bâti par exemple.\n    -    Les châssis oscillo-basculants devront être encastrés dans le plan de la toiture.\n11.2    Façades - Pignons\n    -    Les différents murs d’un bâtiment ou d’un ensemble de bâtiments doivent être traités avec le\n    même soin et en harmonie entre eux.\n    -    L’utilisation de matériaux de qualité pour les façades est recommandée.\n    -    L’emploi à nu de matériaux destinés à être recouverts, est interdit.\n    -    Les couleurs de matériaux de parement et des peintures extérieures devront s’harmoniser entre\n    elles.\n    -    Les antennes collectives et paraboliques sont interdites au même titre que les climatisations en\n    façade sur rue et seront implantées sur les toitures ou sur les façades du bâtiment, non visibles de\n    la rue.\n11.1.4 - La pose de capteurs solaires doit être étudiée, notamment au regard de la trame des ouvertures\nde la façade, et afin de favoriser une intégration dans le plan de toiture ou en façade.\n11.3    Locaux techniques\n    -    Les coffrets, compteurs, boîtes aux lettres devront être intégrés dans les murs de construction.\n    -    Les locaux techniques y compris ceux destinés au stockage des conteneurs adaptés aux ordures\n    ménagères et au tri sélectif, devront être intégrés au bâti principal.\n    -    En cas d’impossibilité, ils seront réalisés dans une annexe qui prendra en compte le bâti annexe,\n    les constructions voisines, la structure végétale existante et les plantations à créer.\n11.4    Clôtures\nLes clôtures sur les voies publiques ou privées doivent être en harmonie avec la construction principale.\nARTICLE UPm 1.12 - Stationnement\nLe stationnement des véhicules, automobiles, motocycles et cycles correspondant aux besoins des\nconstructions et installations doit être assuré en dehors des voies publiques. A cet effet, il devra être\nréalisé sur le terrain propre à l’opération des aires de stationnement dont les normes minimales sont\ndéfinies ci-après.\n12.1    Caractéristiques applicables au parc de stationnement souterrain\nLes rampes d’accès aux aires de stationnement en sous-sol ne doivent pas entraîner de modification dans\nle niveau du trottoir. Leur pente dans les cinq premiers mètres à partir de l’alignement ne doit pas excéder\n5 %, sauf impossibilité technique.\nA titre indicatif, la surface moyenne par emplacement (dégagement compris) est de l’ordre de 25m² pour\nles automobiles, 4m² pour les motos et 1 m² pour les vélos.\n    90","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nLes places doubles sont autorisées uniquement pour les parcs de stationnement liés à un immeuble\nd’habitation pour lequel le ratio de place directement accessible est au moins d’une place par logement.\nLargeurs minimales des rampes d’accès :\n    - Sens unique : 3,50 m\n    - Double sens desservant jusqu’à 70 voitures : 3,50 m\n    - Double sens desservant plus de 70 voitures : 6,00 m\n12.2    Nombre d’emplacements\nPour le calcul des places de stationnement nécessaires à une opération, le nombre obtenu par l’application\ndes normes définies ci-dessous sera dans tous les cas arrondis au nombre entier immédiatement supérieur.\nHôpitaux - cliniques :\n   - Stationnement automobile : 30 % surface de plancher nouvelle avec obligation de maintenir les\n    places existantes\n   - Stationnement des deux roues : 0,5 % de la surface de plancher nouvelle\n12.3    Cas des changements de destination et des extensions\n12.3.1 Il est obligatoire de maintenir les places de stationnement automobile existantes, dans la limite\ndes nouveaux besoins, avec possibilité de les déplacer.\n12.3.2 En cas d’extension, les normes énoncées aux articles 12.1 à 12.2 ne sont applicables que pour la\nsurface de plancher créée et lorsqu’elle induit la création de plus de 2 places de stationnement.\n12.3.3 En cas de changement de destination, les normes énoncées aux articles 12.1 à 12.2 ne sont\napplicables que lorsqu’il induit la création de plus de 2 places de stationnement.\n12.4    Prise en compte des transports en commun\nLorsque l’accès des logements mentionnés au 1er et 3ème alinéa de l’article L151-34 du Code de\nl’Urbanisme, est situé à moins de 500 m par les voies praticables d’une gare ou d’une station de transport\npublic guidé ou de transport collectif en site propre et que la qualité de la desserte le permet, le nombre\nd’aires de stationnement exigible par logement ne peut dépasser 0.5, s’il s’agit de logements locatifs\nfinancés avec un prêt aidé par l’Etat, d’établissements assurant l’hébergement de personnes âgées ou de\nrésidences universitaires, et 1 pour les autres catégories de logements.\n12.5    Modalités d’application\n12.5.1 Les places de stationnement aménagées en surface, devront être stabilisée, et perméables (pavage\nnon joint ever-green, etc…) afin de limiter le ruissellement.\n12.5.3 En cas d’impossibilité architecturale ou technique d’aménager sur le terrain de l’opération, le\nnombre d’emplacements nécessaires au stationnement, le constructeur est autorisé à aménager sur un\nautre terrain, dans un rayon de 300 m par les voies praticables, les surfaces de stationnement qui lui font\ndéfaut à condition qu’il apporte la preuve qu’il réalise ou fait réaliser lesdites places.\n12.6    Dispositions diverses\nPour les opérations comptant plus de 15 logements ainsi que les bureaux et les constructions de service\npublic ou d’intérêt collectif, des bornes électriques seront disposées afin d’inciter les utilisateurs à\ndéserter les énergies fossiles. Les dispositions du décret n°2011-873 du 25 juillet 2011 relatif à\nl'application des articles R. 111-14-2 à R. 111-14-5 du code de la construction et de l'habitation) et\nl’arrêté du 20 février 2012 devront être respectées.\n    91","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UPm 1.13 – Espaces libres et plantations\n13.1    Espaces verts\n50 % au moins des espaces libres* devront être traités en espace vert.\nLes toitures végétalisées compteront dans le calcul de la superficie des espaces verts à hauteur de 40 %\nmaximum de cette superficie.\nLes toitures végétalisées devront disposer d’une épaisseur minimale de 30 cm lorsque les conditions\ntechniques le permettent.\n* espaces libres : espaces non construits, non occupés par de la voirie, des circulations piétonnes ou du\nstationnement obligatoire\n13.2    Plantations\n13.2.1 Les espaces verts doivent être paysagers et plantés à raison d’un arbre pour les 100 premier m² et\nd’un arbre supplémentaire par tranche de 200 m² d’espace vert.\n13.2.2 Lorsqu’un reculement figure au plan, 20 % au moins de sa surface doivent être traités en espace\nvert.\n13.2.3 Les aires de stationnement doivent être plantées à raison d'un arbre pour 3 places.\n13.3    Dans le cas des installations nécessaires aux services publics ou d’intérêt collectif équipements\ncollectifs ou d’intérêt général nécessitant par nature d’importants espaces non bâtis, seul le coefficient\nd’espace paysager s’applique et l’article 13.2.1 ne s’exerce pas.\n   SECTION III – Possibilités maximales d’occupation du sol\nARTICLE UPm 1.14 – Coefficient d’occupation du sol (C.O.S.)\nLe C.O.S. découle de l’application des règles précédentes.\n    SECTION IV – Autres dispositions\nARTICLE UPm1.15 – Performances énergétiques et environnementales\nLes opérations de plus de 1 000 m² de surface plancher à destination de bureaux ou d’habitation devront\nrespecter les labels de performances énergétiques en vigueur.\n    92","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UPm1.16 – Infrastructures et réseaux de communications\nélectroniques.\nLes constructeurs sont invités à se raccorder au réseau numérique dès que cela est possible.\n    93","P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    94","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    ZONE UPM 2\nCARACTERE ET VOCATION DE LA ZONE\nIl s'agit d'une zone comprise entre les rues F Clavel, du Docteur Magnan, des Meunier, Pasteur ainsi que de la\nparcelle à l'angle des rues Pasteur, F Clavel et République;\n SECTION I - Nature de l'occupation et de l'utilisation du sol\nARTICLE UPm 2.1 - Occupations et utilisations du sol interdites\nSont interdites les occupations et utilisations du sol suivantes :\n    -    Les installations classées autres que celles autorisées à l'article 2.\n    -    Les constructions à usage d’activités à caractère industriel.\n    -    Les constructions à usage d’activités artisanales autres que celles autorisées à l’article 2.\n    -    Les constructions à usage d'entrepôts autres que celles autorisées à l’article 2.\n    -    Les projets de constructions situés dans les zones inondables autres que ceux autorisés à l’article\n    2.\n    -    Les dépôts de ferrailles, de matériaux, de combustibles solides ou liquides (hors station service),\n    ainsi que les entreprises de casse de voiture, et de transformation de matériaux de récupération.\n    -    L’ouverture et l’exploitation de carrières.\n    -    Le stationnement des caravanes ou d'habitation légère de loisirs.\n    -    Les terrains de camping et de caravanage.\n    -    Les affouillements, exhaussements des sols autres que ceux autorisés à l'article 2.\nARTICLE UPm 2.2 - Occupations et utilisations du sol soumises à des\nconditions particulières\nLes occupations et utilisations du sol suivantes sont autorisées si elles respectent les conditions ci-\naprès :\n    - Les installations classées, à condition :\n       que soient mises en œuvre toutes les dispositions utiles pour les rendre compatibles avec\n    les milieux environnants,\n       d’éviter toute pollution, nuisance ou dangers non maîtrisables.\n    - Les constructions à usage d'entrepôts s’ils ne sont pas en façade sur rue.\n    - Les constructions à usage d’activités artisanales à condition qu’elles n’entraînent, pour le\n    voisinage, aucune nuisance.\n    - Les affouillements et exhaussements, s’ils sont nécessaires aux travaux d’aménagement paysager\n    des espaces libres et de construction.\n    95","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    SECTION II - Conditions de l'occupation du sol\nARTICLE UPm 2.3 - Accès et voirie\n3.1    Toute nouvelle unité foncière doit disposer d’un accès pour les automobiles par une voie\npublique ou privée, d’une largeur de 3,50 m minimum.\nCette disposition ne s’applique pas aux unités foncières existantes à la date d’approbation du PLU\n3.2    Toute nouvelle voie se terminant en impasse doit être aménagée à son extrémité, de telle manière\nque tous les véhicules amenés à l’emprunter puissent aisément faire demi-tour.\n3.3    Ces accès ne doivent pas présenter un risque pour la sécurité des usagers des voies publiques ou\npour celle des personnes utilisant ces accès. Cette sécurité doit être appréciée compte tenu notamment, de\nla disposition des accès, de leur configuration ainsi que de la nature et de l'intensité du trafic.\nARTICLE UPm 2.4 - Desserte par les réseaux\n4.1    Alimentation en eau potable\nToute construction ou installation nouvelle qui nécessite une alimentation en eau doit être raccordée au\nréseau public de distribution d'eau potable.\n4.2    Assainissement\nToute construction devra respecter les documents suivants :\n     Le règlement du service départemental d’assainissement des Hauts-de-Seine ;\n     Le règlement du service d’assainissement de l’EPT Paris Ouest La Défense.\nCes deux documents sont disponibles en annexe du présent Plan Local d’urbanisme.\n4.3    Autres réseaux\nA l’occasion de toute construction neuve, extension ou surélévation, soumise à permis de construire, les\nréseaux, raccordements (électricité, câble, téléphone…), les installations nouvelles et branchements seront\nobligatoirement réalisés en souterrain ou s'intégreront au bâti.\n4.4    Déchets\nPour les nouvelles constructions de plus de deux logements des locaux poubelles, correctement\ndimensionnés pour accueillir l’ensemble des bacs de la collecte sélective nécessaires aux usagers, doivent\nêtre aménagés de préférence à rez-de-chaussée des constructions, avec accès direct sur le domaine public.\nDans le cas où les locaux ne permettent pas l’accès direct sur rue, il est vivement recommandé de prévoir\nun lieu de stockage sur le domaine privé, facilitant l’accès aux bacs les jours de collecte.\nUn cahier des charges est joint à l’annexe 6 de la pièce 4.2 « Annexes du rêglement ».\n    96","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UPm 2.5 - Caractéristiques des terrains\nSans objet\nARTICLE UPm 2.6 - Implantation des constructions par rapport aux\nvoies et emprises publiques ou privées\n6.1    Les constructions doivent s’implanter à l'alignement des voies publiques ou privées, existantes\nou à créer.\nPour les constructions ayant façade sur l'emplacement réservé n° 9, qui doivent s’implanter à 3 m de\nl'alignement futur, entre les n° 6 à 14 rue F. Clavel.\n6.2    Saillies\nLes saillies sur voie publique ou privée sont autorisées sous réserve :\n    - qu’elles soient placées à une hauteur de 5,50 m minimum, au-dessus de la chaussée,\n    - que leur profondeur n’excède pas 0,80 m,\n    - que l’ensemble du linéaire de saillies par niveau, ne dépasse pas 30 % du linéaire de la façade.\nMarge de reculement : à partir de 5,50 m de hauteur à condition qu'elles ne dépassent pas 2 m de\nprofondeur et 60 % du linéaire de façade.\nNota : Les saillies localisées sur les voies départementales devront également respecter les dispositions du\nrèglement de la voirie départementale.\n6.3    A l'angle de deux voies\nEn l’absence d’indication au plan, sur les terrains situés à l'angle de deux voies, les constructions\ndevront s’inscrire à l’intérieur d’un pan coupé d'une largeur minimale de 5m, perpendiculaire à la\nbissectrice de l'angle des deux voies.\nLa mise en place d’une isolation thermique sur domaine public est autorisée sur les bâtiments existants à\nla date d’approbation du PLU sous réserve de faire l’objet d’un traitement architectural d’ensemble de\nqualité, que la largeur du trottoir après travaux reste égale ou supérieur à 1,40 mètre, de la prise en\ncompte des reseaux existants et sous réserve de l’accord du gestionnaire de la voirie.\nARTICLE UPm 2.7 - Implantation des constructions par rapport aux\nlimites séparatives\n7.1    Retraits\n7.1.1    En cas de retrait, la distance, mesurée perpendiculairement et horizontalement, comptée en tout\npoint de la façade d’un batiment par rapport à la limite séparative la plus proche, doit être :\n    - Au moins égale à la hauteur en tout point de la façade du batiment, sans pouvoir être inférieure à\n    8 m lorsque la façade comporte une ou des baies principales : L = H ≥ 8 m,\n    - Au moins égale à sa demi hauteur en tout point de la façade du batiment, sans pouvoir être\n    inférieure à 4 m dans les autres cas : L = H/2 ≥ 4 m.\n    97","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n7.1.2    Lorsque les façades ne sont pas parallèles à la limite séparative, les deux règles suivantes se\nsubstituent à la règle énoncée à l’article 7.1.1 :\nSi la façade comporte une ou des baies principales :\n    - La distance entre la limite séparative et le milieu de la façade du bâtiment, mesurée\n    perpendiculairement et horizontalement doit au moins être égale à la hauteur de cette façade,\n    avec un minimum de 8 m : L = H ≥ 8 m.\n    Et\n    - La distance entre la limite séparative et tout point de la façade du bâtiment, mesurée\n    perpendiculairement et horizontalement doit être au moins égale aux 3/4 de la hauteur de cette\n    façade, avec un minimum de 6 m : L = ¾ H ≥ 6 m.\nDans les autres cas :\nLa distance entre la limite séparative et tout point de la façade du bâtiment, mesurée perpendiculairement\net horizontalement, doit être au moins égale à la moitié de la hauteur de cette façade, sans pouvoir être\ninférieure à 4 m : L = H/2 ≥ 4 m.\n7.2    Les constructions en superstructure doivent s’implanter à l’intérieur des périmètres de\nconstructibilité définis au plan masse à l’exception des extensions inférieures ou égales à de 20 m²\nd’emprise au sol des constructions principales existantes à la date d’approbation du PLU. Sous cette\ncontrainte :\n7.2.1    Les constructions doivent s’implanter :\n    -   en limites latérales en façade sur rue.\n    -   en cas de retrait partiel, les constructions devront s’écarter de ces limites conformément aux\n    prescriptions de l’article 7.1.\n7.2.2  Les constructions doivent s’implanter en retrait des limites séparatives de fond de propriété,\nconformément aux prescriptions de l’article 7.1.\n7.3    Cours communes\nLes constructions peuvent être implantées à une distance moindre que celle définie ci-dessus, lorsque les\ndeux propriétaires voisins, s’obligent réciproquement à créer une servitude de cour commune propre à\nrespecter les prescriptions de l’article 8.\nEn l’absence d’accord amiable, il peut être fait application des dispositions de l’article R.471.1 du Code\nde l’Urbanisme.\n7.4    Sous réserve que les murs situés en limite séparative soient aveugles, les annexes de moins de 15\nm² d’emprise au sol et dont la hauteur totale n’excède pas 2,60 m peuvent s’implanter en limite séparative\nou en retrait minimum de 1 m sur l’ensemble de l’unité foncière. En cas de baies les prescriptions des\narticles 7.1 à 7.4 s’appliquent.\nARTICLE UPm 2.8 - Implantation des constructions les unes par\nrapport aux autres sur une même propriété\nLes constructions doivent s’implanter à l’intérieur des périmètres de constructibilité définis au plan\nmasse. Sous cette contrainte, la construction de plusieurs bâtiments non contigus sur une même unité\nfoncière est autorisée, à condition que :\n    98","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    -    En tout point de chaque façade, la distance la séparant de la façade d’un autre bâtiment, mesurée\n    perpendiculairement et horizontalement, soit au moins égale à :\n        La hauteur de la façade la plus haute, avec un minimum de 8 m, si la façade la plus\n    basse comporte des baies principales,\n        La hauteur de la façade la plus basse, avec un minimum de 8 m, si cette dernière ne\n    comporte pas de baies principales et que la façade la plus haute en comporte,\n        Au minimum de la hauteur de la façade la plus basse ou de la moitié de la hauteur de la\n    façade la plus haute, avec un minimum de 4 m, si les deux façades ne comportent pas de\n    baies principales.\n    -    Et que la plus courte distance entre deux bâtiments soit supérieure à 4 m.\nARTICLE UPm 2.9 - Emprise au sol\nL’emprise au sol de l’ensemble des constructions en superstructure est définie sur le plan masse ci-joint.\nARTICLE UPm 2.10 - Hauteur maximale\n10.1    La hauteur maximale autorisée des constructions est indiquée sur le plan masse ci-joint.\n10.2    Compte tenu des voies adjacentes :\n10.2.1 Lorsque le bâtiment est construit en bordure d'une voie publique, la distance horizontale de tout\npoint de ce bâtiment au point le plus proche de l'alignement opposé, actuel ou futur, doit être au moins\négale à la différence d'altitude entre les deux points mesurés au niveau du trottoir (prospect H = L par\nrapport à l’alignement opposé).\n10.2.2 A l'angle des îlots limités par des voies d'inégales largeurs, la hauteur maximale des\nconstructions édifiées en bordure de la voie la moins large, peut être identique à celle autorisée en\nbordure de la voie la plus large, ce sur une distance égale au plus à 5 m comptée à partir des alignements\nou reculs imposés.\n10.3    Compte tenu du plafond de la zone\n10.3.1 La hauteur des constructions ne peut être inférieur à 8 m et ne peut dépasser 12 m au faîtage ou\nau niveau supérieur de la terrasse calculée à partir du niveau du terrain naturel avant travaux (8 m < H <\n12 m).\nToutefois, en cas de toiture terrasse, afin d'animer et de planter la cinquième façade, la hauteur pourra être\nportée ponctuellement à 15 m maximum sur le linéaire compris entre les 16 à 26 rue F Clavel, et les 27 à\n43 rue du Docteur Magnan (8 m < H < 15 m).\n10.3.2 Dans le cas de toitures terrasses, afin d’animer et de planter la « cinquième façade », le dernier\nétage devra faire l’objet d’une étude architecturale soignée, être en recul par rapport à la façade sur rue,\nen fonction du prospect : H = L.\n10.3.3 Le long de la rue Pasteur entre les n° 68 à 76 et le long de la rue des Meuniers entre les n° 19 à\n27, la hauteur des constructions est fixée à 8 m.\n10.3.4 Le long de la rue F. Clavel, dans la portion de voie comprise entre le n° 6 et le n° 14, la hauteur\ndes constructions peut atteindre 15 m (8 m < H < 15 m).\nDans ce cas, le dernier étage devra faire l'objet d'une étude architecturale soignée, être en recul par\n    99","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nrapport à la façade sur rue en fonction du gabarit (L = H), et respecter en tous points l'article UPm 2 - 11.\nARTICLE UPm 2.11 - Aspect extérieur – clôtures\nLe projet peut être refusé ou n’être accepté que sous réserve de l’observation de prescriptions spéciales si\nles constructions, par leur situation, leur architecture, leurs dimensions ou l’aspect extérieur des bâtiments\nou ouvrages à édifier ou à modifier, sont de nature à porter atteinte au caractère ou à l’intérêt des lieux\navoisinants, aux sites, aux paysages naturels ou urbains ainsi qu’à la conservation des perspectives\nmonumentales.\nToute construction, agrandissement, restauration ou aménagement d’immeuble devra prendre en compte\nle caractère du site de façon à s’harmoniser avec son environnement architectural et paysager (toitures,\nmatériaux…).\n11.1    Aspect extérieur\nLes constructions, y compris les clôtures, par leur situation, leur architecture, leur dimension ou l’aspect\nextérieur des bâtiments ou ouvrages à édifier ou à modifier, ne doivent pas être de nature à porter atteinte\nau caractère ou à l’intérêt des lieux avoisinants, aux sites aux paysages naturels ou urbains, ainsi qu’à la\nconservation des perspectives vers les sites remarquables.\n11.1.1 Aspect des toitures\nLes toitures terrasse non accessibles, devront être végétalisées chaque fois que cela est possible. Les\ncouvertures d’aspect précaires sont interdites et en règle générale les couvertures doivent faire l’objet\nd’un traitement soigné.\n11.1.2 Volumes\nAfin d’éviter les gaines en toitures, les dispositifs de type VMC inversée sont à privilégier. Les ouvrages\net locaux techniques tels que machineries d’ascenseurs, de réfrigération, sortie de secours, gaines de\nventilation … doivent faire partie de la composition volumétrique d’ensemble et ne pas être laissés\napparents notamment dans le cas de toiture terrasse : usage de toiture partielle, de dalle, ou de coffrage\ns’intégrant dans l’ensemble du bâti par exemple.\n11.1.3 En cas de construction d'un niveau supplémentaire (soit au dessus de 12 m de hauteur), un soin\nparticulier doit être apporté au traitement de la cinquième façade.\nLes parties de construction à édifier en toiture ne peuvent pas avoir une surface supérieure à 50 % à celle\nd’un étage courant du bâtiment sur lequel elles sont implantées, excepté :\n    -    Pour les constructions comprises entre les n° 6 et 14 rue F Clavel, où ce 5ème niveau peut\n    atteindre 100 % de la surface d'un étage courant,\n    -    Lorsque le document graphique le permet, en cas de création d’équipements collectifs ou\n    d’intérêt général, la surface peut atteindre 100 % sur la rue du Docteur Magnan.\nCes unités devront être traitées de façon homogène avec le bâtiment sur lequel elles sont édifiées.\nLes installations techniques en toiture devront être accolées à ces constructions, si elles existent.\n11.1.4 La pose de capteurs solaires doit être étudiée, notamment au regard de la trame des ouvertures de\nla façade, et afin de favoriser une intégration dans le plan de toiture ou en façade.\n11.1.5 Façades - Pignons\n    -    Les différents murs d’un bâtiment ou d’un ensemble de bâtiments doivent être traités avec le\n    même soin et en harmonie entre eux.\n    -    L’utilisation de matériaux de qualité pour les façades est recommandée.\n    100","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    -   L’emploi à nu de matériaux destinés à être recouverts, est interdit.\n    -   Les couleurs de matériaux de parement et des peintures extérieures devront s’harmoniser entre\n    elles.\n    -   Les conduits de fumée ou de ventilation à surélever le long d’une façade ou d’un pignon doivent\n    être traités en harmonie avec cette façade ou ce pignon.\n    -   Les antennes collectives et paraboliques sont interdites au même titre que les climatisations en\n    façade sur rue et seront implantées sur les toitures ou sur les façades du bâtiment, non visibles de\n    la rue.\nPour les façades commerciales : la création de façades commerciales est autorisée dans les limites\nsuivantes :\n    -    Les percements destinés à recevoir des vitrines devront s’adapter à l’architecture du bâtiment,\n    -    Lorsqu’un même commerce sera établi sur plusieurs immeubles contigus, les percements de\n    vitrine devront respecter les limites séparatives.\n11.2    Annexes, locaux techniques\n11.2.1 Extensions, garages, boxes\nLes bâtiments annexes doivent être conçus en harmonie de volumes et de matériaux avec les constructions\nexistantes. Les annexes réalisées avec des moyens de fortune tels que des matériaux de démolition,\nrécupération de matériaux destinés à être recouverts, utilisés à nu, sont interdits.\n11.2.2 Locaux techniques\n    -   Les coffrets, compteurs, boîtes aux lettres devront être intégrés dans les murs de construction.\n    Les locaux techniques y compris ceux destinés au stockage des conteneurs adaptés aux ordures\n    ménagères et au tri sélectif, devront être intégrés au bâti principal.\n    -   En cas d’impossibilité, ils seront réalisés dans une annexe qui prendra en compte le bâti annexe,\n    les constructions voisines, la structure végétale existante et les plantations à créer.\n11.3    Clôtures\n11.3.1 Clôtures sur les voies publiques ou privées\n    -   Les clôtures sur les voies publiques ou privée doivent être en harmonie avec la construction\n    principale. Elles doivent être d’un modèle simple et sans décoration inutile et conçues en\n    fonction de celles déjà existantes dans la voie.\n    -   Elles ne peuvent pas comporter de parties pleines d’une hauteur supérieure à 1,20 m à partir du\n    trottoir. La hauteur totale de la clôture ne peut être supérieure à 2 m.\n    -   Quand il y a nécessité de création d’un mur de soutènement, celui-ci peut constituer la partie\n    pleine de la clôture jusqu’à concurrence de 1,20 m de hauteur, sans que la hauteur totale ne\n    dépasse 2 m, le reste doit être traité en talus.\n    -   Pour les parcelles dont la largeur est inférieure ou égale à 6m et dans le cas où il est nécessaire\n    d’installer un système enroulant : la hauteur globale prenant en compte les piliers de portails\n    d’accès véhicules et les linteaux, est portée à 2,60m maximum.\n    -   La partie de la marge de reculement bordant le domaine public devra être close par des grilles à\n    barreaudage vertical, de couleur sombre.\n    -   Les piliers des portails d’entrée et de clôture ne peuvent pas dépasser 2,20 m de hauteur. Les\n    différents portails d’une même propriété seront de même style architectural. Dans le cas de rue\n    en pente, les hauteurs sont prises au milieu de chaque élément de clôture.\n    -   Toutefois, pour des raisons de sécurité, la hauteur totale des clôtures pourra être portée à 2,60 m\n    pour les équipements collectifs ou d’intérêt général.\n11.3.2 Clôtures sur les limites séparatives\nLa hauteur totale de la clôture ne peut être supérieure à 2,60 m. Elles devront être aménagées de manière\nà laisser passer la faune.\n    101","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    11.3.3 Dans le cas de terrain en pente, les hauteurs sont prises au milieu de chaque élément de clôture.\n    Lorsqu’il y a nécessité de créer un mur de soutènement, celui-ci peut constituer la partie pleine de la\n    clôture jusqu’à concurrence de 1,20 m. Le reste doit être traité en talus.\n    11.4    Les équipements collectifs ou d’intérêt général ne sont pas assujettis aux limitations de hauteur\n    des clôtures de l’article 11.3.\n    ARTICLE UPm 2.12 - Stationnement\n    Le stationnement des véhicules, automobiles, motocycles et cycles correspondant aux besoins des\n    constructions et installations doit être assuré en dehors des voies publiques. A cet effet, il devra être\n    réalisé sur le terrain propre à l’opération des aires de stationnement dont les normes mnimales sont\n    définies ci-après.\n    12.1    Caractéristiques applicables au parc de stationnement collectif\n    Les rampes d’accès aux aires de stationnement en sous-sol ne doivent pas entraîner de modification dans\n    le niveau du trottoir. Leur pente dans les cinq premiers mètres à partir de l’alignement ne doit pas excéder\n    5 %, sauf impossibilité technique.\n    A titre indicatif, la surface moyenne par emplacement (dégagement compris) est de l’ordre de 25m² pour\n    les automobiles, 4m² pour les motos et 1m² pour les cycles.\n    Les places doubles sont autorisées uniquement pour les parcs de stationnement liés à un immeuble\n    d’habitation pour lequel le ratio de places directement accessibles est au moins d’une place par logement.\n    Largeurs minimales des rampes d’accès :\n    -   Sens unique : 3,50 m\n    -   Double sens desservant jusqu’à 70 voitures : 3,50 m\n    -   Double sens desservant plus de 70 voitures : 6,00 m\n    12.2    Nombre d’emplacements\n    Pour le calcul des places de stationnement nécessaires à une opération, le nombre obtenu par l’application\n    des normes définies ci-dessous sera dans tous les cas arrondis au nombre entier immédiatement supérieur.\n    12.2.1 Constructions à usage d’habitat\nStationnement    Automobiles    Motocycles    Cycles\nLogement - cas général    1 place mini. pour Local clos ou couvert dont la superficie\n    . 1 place par tranche de 60 m² de surface    10 logements    correspondra    au    minimum    0,75\n    de plancher    m²/logement jusqu’à 2 pièces principales\n    . Avec 1 place mini. par logement    et 1,5 m²/logement de 3 pièces\n    principales et plus ou au minimum une\n    superficie de 3 m².\n    Cette règle s’applique à partir de trois\n    logements collectifs.\nConstructions visées à l’article    1 place mini pour Local clos ou couvert dont la superficie\nL151-35 du Code de    . 1 place par logement (article 46 de la 10 logements.    correspondra    au    minimum    0,75\nl’Urbanisme    loi du 29 juillet 1998).    m²/logement jusqu’à 2 pièces principales\n    et 1,5 m²/logement de 3 pièces\n    principales et plus ou au minimum une\n    superficie de 3 m².\n    Cette règle s’applique à partir de trois\n    102","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    logements collectifs.\nLogements sociaux : travaux de    Il n’est pas fait obligation de réaliser des Non réglementé.    Non réglementé.\ntransformation ou    aires de stationnement.\nd’amélioration*\nRésidences pour étudiants    1 place pour 4 unités d’habitation    Non réglementé    Non réglementé\n    (*)    Bâtiments affectés à du logement locatif, financés avec un prêt aidé par l’Etat, y compris dans le cas où ces travaux\n    s’accompagnent de création de surface de plancher, dans la limite d’un plafond fixé par décret au Conseil d’Etat.\n    12.2.2 Constructions à usage d’activités\nStationnement    Automobiles    Motocycles    Cycles\nSurface commerciale :\n. surface de plancher ≤ 300 m²    . 25 % de la surface de plancher    Non réglementé.    Non réglementé.\n. 300 m² ≤ surface de plancher ≤    . 50 % de la surface de plancher    Non réglementé.    Non réglementé.
