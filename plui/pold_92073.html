positions de l’article 6.1 et sous réserve d’une bonne intégration au site urbain\nenvironnant.\n6.2.3   Sur les terrains situés à l'angle de deux voies les constructions devront s’inscrire à l’intérieur\nd’un pan coupé d'une largeur minimale de 5 m, perpendiculaire à la bissectrice de l'angle des deux voies.\n6.3    Saillies\nLes saillies sur voie publique ou privée sont autorisées sous réserve :\n    - que la largeur de la voie soit supérieure ou égale à 10 mètres\n    - qu’elles soient placées à une hauteur de 4,30 m minimum, au-dessus de la chaussée,\n    - que leur profondeur n’excède pas 0,80 m,\n    - que l’ensemble du linéaire de saillies constitutives de surfaces de plancher par niveau ne dépasse\n    pas 30 % du linéaire de la façade.\nLa mise en place d’une isolation thermique sur voie publique est autorisée sur les bâtiments existants à la\ndate d’approbation du PLU sous réserve de faire l’objet d’un traitement architectural d’ensemble de\nqualité, que la largeur du trottoir après travaux reste égale ou supérieur à 1,40 mètre, de la prise en\ncompte des réseaux existants et sous réserve de l’accord du gestionnaire de la voirie.\nNota : Les saillies localisées sur les voies départementales devront également respecter les dispositions du\nrèglement de la voirie départementale.\n    32","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UB 7 - Implantation des constructions par rapport aux limites\nséparatives\n7.1    Retraits\n7.1.1    En cas de retrait, la distance mesurée perpendiculairement et horizontalement, comptée en tout\npoint de la façade d’un bâtiment par rapport à la limite séparative la plus proche, doit être :\n    - Au moins égale à la hauteur en tout point de la façade du bâtiment, sans pouvoir être inférieure à\n    8 m lorsque la façade comporte une ou des baies principales : L = H  8 m.\n    - Au moins égale à sa demi-hauteur en tout point de la façade du bâtiment, sans pouvoir être\n    inférieure à 4 m, dans les autres cas : L = H/2  4 m.\nDans le secteur visé à l’art.2-2-2 bénéficiant d’une majoration de 35% du volume constructible, La\ndistance entre la limite séparative et tout point de la façade du bâtiment, mesurée perpendiculairement et\nhorizontalement, doit être au moins égale à la moitié de la hauteur de cette façade : L = H/2.\n7.1.2    Lorsque les façades ne sont pas parallèles à la limite séparative, les deux règles suivantes se\nsubstituent à la règle énoncée à l’article 7.1.1:\nSi la façade comporte une ou des baies principales :\n     La distance entre la limite séparative et le milieu de la façade du bâtiment, mesurée\n    perpendiculairement et horizontalement doit au moins être égale à la hauteur de cette façade,\n    avec un minimum de 8 m : L = H  8 m.\n    Et\n     La distance entre la limite séparative et tout point de la façade du bâtiment, mesurée\n    perpendiculairement et horizontalement doit être au moins égale aux 3/4 de la hauteur de cette\n    façade, avec un minimum de 6 m : L = ¾ H  6 m\nDans les autres cas :\nLa distance entre la limite séparative et tout point de la façade du bâtiment, mesurée perpendiculairement\net horizontalement, doit être au moins égale à la moitié de la hauteur de cette façade, sans pouvoir être\ninférieure à 4 m : L = H/2  4 m.\n7.2    Bande de constructibilité\nUne bande de constructibilité est définie pour chaque secteur :\n    - UBa : 40 m\n    - UBc : pas de bande de constructibilité\n    - UBb, UBd*, UBe : 20 m\n     En zone UBd, pour l’îlot compris entre la rue des Nouvelles, la rue de la Procession, le\n    boulevard du Maréchal de Lattre de Tassigny, la bande de constructibilité est définie sur\n    le plan figurant à l’article 10.2. En dehors de cette bande de constructibilité, les\n    constructions en superstructure et en infrastructure sont interdites.\n7.3    Implantation par rapport aux limites séparatives dans la bande de constructibilité\n    sur rue\n7.3.1   Dans les secteurs UBa, UBb et UBc :\nLes constructions sont autorisées :\n    - Soit sur les limites séparatives si la façade sur la limite est aveugle.\n    - Soit en retrait de ces limites et conformément aux prescriptions de l’article 7.1.\n    33","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n7.3.2    Dans les secteurs UBd et UBe :\n7.3.2.1 Pour les unités foncières dont la largeur de façade est inférieure ou égale à\n15 m, les constructions sont autorisées :\n    - Soit sur les limites séparatives si la façade sur la limite est aveugle.\n    - Soit en retrait de ces limites. En cas de retrait, les constructions devront s’écarter de ces limites\n    conformément aux prescriptions de l’article 7.1.\n7.3.2.2 Pour les unités foncières dont la largeur de façade est supérieure à 15 m, les constructions sont\nautorisées :\n    - Sur au plus une des deux limites séparatives latérales. En cas de retrait, les constructions devront\n    s’écarter de ces limites conformément aux prescriptions de l’article 7.1.\n7.3.3    Règle particulière\nLorsque la construction est implantée sur une limite séparative, un retrait du dernier niveau de la\nconstruction est autorisé, sous réserve que la distance comptée horizontalement et perpendiculairement de\ntout point de la façade du dernier niveau, soit au moins égale à la hauteur de celle-ci, avec un minimum de\n3 m.\n7.4    Implantation par rapport aux limites séparatives au-delà de la bande de\n    constructibilité sur rue\n7.4.1    Les constructions doivent s’implanter en retrait, dans ce cas, elles devront s’écarter de ces\nlimites conformément aux prescriptions de l’article 7.1.\n7.4.2    Toutefois, sous réserve que les murs situés en limite séparative soient aveugles, une construction\npeut s’implanter en limite séparative si :\n    -   Elle s’adosse à une construction principale existante et en bon état, située sur l’unité foncière\n    voisine. La construction nouvelle ne doit alors, pas dépasser les héberges existantes et doit\n    respecter, sur au moins une des limites séparatives (limite latérale ou fond de parcelle) un retrait\n    en profondeur et hauteur tel que défini à l’article 7.1.\n    -   Ou s’il s’agit d’un rez-de-chaussée à usage d’artisanat ou de commerce n’excédant pas une\n    hauteur totale de 5 m.\n7.4.3    Sur l’îlot compris entre le boulevard du Maréchal de Lattre de Tassigny et les rues des Nouvelles\net de la Procession, seules sont autorisées les constructions d’annexes de moins de 15 mètres carrés\nd’emprise au sol, à condition que leur hauteur totale n’excède pas 2,60 mètres. Elles pourront s’implanter\nsoit sur les limites séparatives soit en retrait minimum de 1 mètre.\n7.5    Cours communes\n7.5.1    Les constructions peuvent être implantées à une distance moindre que celle définie ci-dessus,\nlorsque les deux propriétaires voisins, s’obligent réciproquement à créer une servitude de cour commune\npropre à respecter les prescriptions suivantes : en tout point de chaque façade, la distance la séparant de la\nfaçade d’un autre bâtiment, mesurée perpendiculairement et horizontalement doit etre au moins égale à sa\ndemi hauteur en tout point, sans pouvoir etre inférieur à 4m : L = H/2  4 m.\nEn l’absence d’accord amiable, il peut être fait application des dispositions de l’article 471-1 du Code de\nl’Urbanisme.\n7.5.2    La notion de cour commune s’applique au sol naturel (servitude non aedificandi) et/ou à un sol\nartificiel correspondant au niveau le plus élevé d’un bâtiment existant (servitude non altius tollendi).\n    34","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n7.5.3    Dans le cas où une construction principale, située sur une parcelle voisine comporte une courette\nou un puits de lumière en limite séparative, sur lequel s’ouvrent des baies, un retrait au moins symétrique\nest autorisé, afin d’assurer un éclairement convenable à la construction existante.\n7.6    Des retraits inférieurs aux prescriptions de l’article 7.1 peuvent être autorisés sous condition,\ndans le cas de constructions existant à la date d’approbation du PLU, et ne respectant pas les dispositions\ndes articles 7.1 à 7.4 pour :\n    - La surélévation d’un niveau maximum, d’une construction, si la surélévation des murs concernés\n    ne comporte pas de baies, et à condition qu’elle se fasse dans le prolongement des murs\n    existants,\n    - Une extension de faible importance (5 % de l’emprise au sol existante) dont le but est\n    l’amélioration du confort (ascenseurs, sanitaires, mise aux normes, locaux déchets ménagers,\n    locaux vélos, ...), l’amélioration des performances énergétiques (isolation extérieure) ou\n    l’accessibilité d’un bâtiment existant aux Personnes à Mobilité Réduite.\n7.7    Toutefois, sous réserve que les murs situés en limite séparative soient aveugles ou ne présentent\nque des jours de souffrance, les annexes de moins de 15 m² d’emprise au sol et dont la hauteur totale\nn’excède pas 2,60 m peuvent s’implanter en limite séparative ou en retrait minimum de 1 m sur\nl’ensemble de l’unité foncière. En cas de baies, les prescriptions des articles 7.1 à 7.5 s’appliquent.\n7.8    Les installations nécessaires aux services publics ou d’intérêt collectif ne sont pas assujetties aux\ndispositions des articles 7.1 et suivants et peuvent s’implanter soit en limites séparatives, soit en retrait de\n4 m minimum de ces limites.\nARTICLE UB 8 - Implantation des constructions non contigües les unes\npar rapport aux autres sur une même propriété\n8.1.    Règles générales\nLa construction de plusieurs bâtiments non contigus sur une même unité foncière, est autorisée, à\ncondition que :\n    - En tout point de chaque façade, la distance la séparant de la façade d’un autre bâtiment, mesurée\n    perpendiculairement et horizontalement, soit au moins égale à :\n     La hauteur de la façade en tout point, sans pouvoir être inférieure à 8 m lorsque la\n    façade la plus basse comporte des baies principales : L = H  8 m,\n     Sa demi-hauteur en tout point, sans pouvoir être inférieure à 4 m dans les autres cas : L\n    = H/2  4 m.\n8.2    Règles particulières\n8.2.1    Les installations nécessaires aux services publics ou d’intérêt collectif peuvent s’implanter soit\nen contiguïté, soit à une distance de 4 m minimum.\n8.2.2    Les annexes de moins de 15 m² d’emprise au sol et dont la hauteur totale n’excède pas\n2,60 m, ne sont pas assujetties aux prescriptions de l’article 8.1 et peuvent :\n    - S’implanter à une distance de 3m minimum des autres constructions si ces dernières comportent\n    des baies,\n    - S’implanter librement y compris s’accoler aux autres constructions, si ces dernières ne\n    comportent pas de baies.\n    35","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UB 9 - Emprise au sol\n9.1    Règles générales\n9.1.1    Unité foncière dont la superficie est inférieure à 400 m².\nLe coefficient d’emprise au sol de la totalité des constructions est fixé par la formule suivante :\n    Coefficient d’emprise au sol = 0,2 + (120/ S)  1\n    (S : superficie de l’unité foncière)\n9.1.2    Unité foncière dont la superficie est supérieure à 400 m²\nL’emprise au sol de la totalité des constructions ne doit pas excéder 50 % de la surface totale de l’unité\nfoncière (soit un coefficient d’emprise au sol = 0,5).\n emprise au sol\nmaximale autorisée\n    en %\n 100%\n  90%\n  80%    Emprise au Sol = 0,2 + 120/S\n  70%\n  60%\n  50%\n    S = surface de\n    l'unité foncière en m2\n    0    150    200    250    300    350    400m2\n9.2    Cas particuliers\n9.2.1    Dans l’ensemble de la zone\n    -   Pour les unités foncières de plus de 300 m², et dans le cas de constructions à usage d’activités,\n    d’artisanat, de commerce, d’accueil ou d’exposition, l’emprise au sol de l’ensemble des\n    constructions peut atteindre 60 % (soit un coefficient d’emprise au sol = 0,6), en rez-de-chaussée\n    uniquement, la règle définie à l’article 9-1 s’appliquant pour les étages supérieurs.\n    -   Pour les unités foncières de plus de 300 m², et dans le cas de constructions à usage de parcs de\n    stationnement, d’installations nécessaires aux services publics ou d’intérêt collectif, l’emprise au\n    sol de l’ensemble des constructions peut atteindre 80% (soit un coefficient d’emprise au sol =\n    0,8), en rez-de-chaussée uniquement, la règle définie à l’article 9-1 s’appliquant pour les étages\n    supérieurs. Les toitures-terrasses de constructions à rez-de-chaussée devront alors faire l’objet\n    d’un traitement paysager soigné sur au moins 50% de leur surface.\n    -   Dans le cas de constructions existantes à la date d’approbation du P.L.U., un dépassement de 5\n    % de l’emprise au sol existante pourra être autorisé, pour la réalisation de travaux destinés à\n    l’amélioration du confort, (ascenseur, escalier de secours, sanitaires, mise aux normes, locaux\n    déchets ménagers, locaux vélos, ...) l’amélioration de la performance énergétique (isolation\n    extérieure) ou de l’accessibilité du bâtiment existant aux Personnes à Mobilité Réduite.\n    -   Dans le cas des unités foncières dont la profondeur n’excède pas 20 m, ou situées à l’angle\n    de plusieurs rues, et afin d’assurer un front bâti continu sur rue, le coefficient d’emprise au\n    36","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    sol peut être majoré jusqu’à la valeur de 1 (soit une emprise au sol de 100% de la surface de\n    l’unité foncière).\n    -    Toutefois, cette possibilité ne peut être accordée que si elle se justifie par une meilleure insertion\n    dans le site.\n9.2.2    Dans les secteurs UBb et UBd\n    -    Dans le cas des unités foncières traversantes de moins de 50 m de profondeur et dont la largeur\n    de façade ne dépasse pas 15 m, afin de permettre la construction d’un front bâti continu sur rue,\n    le coefficient d’emprise au sol est fixé par la formule suivante :\n    Coefficient d’emprise au sol = 0,17 + (16,6 / P)  1\n    (P : profondeur de l’unité foncière.)\n    -    Les prescriptions de l’article 9.2.1 restent valables lorsque l’emprise au sol résultant de la\n    formule précédente est inférieure.\n    emprise au sol\n    maximale autorisée\n    en %\n    100%\n    90%\n    80%\n    Emprise au Sol = 0,17 + 16,6/P\n    70%\n    60%\n    50%\n    P = profondeur\n    des parcelles\n    0    10m    20m    30m    40m    50m    60m\nARTICLE UB 10 - Hauteur maximale des constructions\n10.1    Gabarit enveloppe\n10.1.1 Gabarit enveloppe sur rue\nLa construction devra s’inscrire à l’intérieur d’un gabarit enveloppe défini en fonction de l’emprise des\nvoies par :\n    - Un plan vertical à l’alignement s’élevant jusqu’à la hauteur intermédiaire,\n    - Un quart de cercle de 6 m de rayon pour les secteurs UBa, UBb, UBd et UBe, et de 7 m de\n    rayon pour le secteur UBc, se développant à partir de la hauteur intermédiaire (Hi),\n    - une hauteur totale maximale (H).\nDans le secteur UBe, la règle du gabarit s'appliquera non à partir de l'alignement, mais à partir du recul\nimposé.\n    37","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    10.1.2 Parcelles d'angle\n    Pour les parcelles d'angle situées à l'intersection de deux voies d'inégales largeurs, le gabarit et les\n    hauteurs autorisés le long de la voie la plus large, pourront s'appliquer le long de la voie la plus étroite sur\n    une profondeur de 15 m, comptée à partir de l'alignement actuel ou futur.\n    10.2    Hauteurs maximales *\n    Les constructions doivent respecter les caractéristiques suivantes (les hauteurs sont mesurées par rapport\n    au terrain naturel avant travaux) :\n    Secteurs\n    Secteur UBa    UBb –    Secteur UBc    UBe\n    UBd***\nDans la bande de constructibilité sur rue**\nHauteur maximale intermédiaire Hi = L + 1 avec    Hi = L + 1 avec Hi  16 m    Hi  12 m\n    Hi  16 m (*)    Hi  16 m (*)\nHauteur total maximale    H = L + 7 avec    H = L + 7 avec 19 m et 23 m (cf. art. 10.4)    H  15 m\n    H  19 m    H  19 m\nAu-delà de cette bande de constructibilité\nHauteur totale maximale    16 m    12 m    Pas de bande de constructibilité    12 m\n    * L : distance entre deux alignements actuels ou futurs\n    Hi : Hauteur maximale intermédiaire\n    ** Pour le secteur UBa, la bande de constructibilité sur rue est celle définie à l’article 7.2.\n    Dans le cas des secteurs UBb, UBd et UBe, il s’agit d’une bande de 20 m le long des voies suivantes : boulevard du\n    Maréchal Lattre de Tassigny, rue de la Poterie, rue du docteur Bombiger, boulevard Henri Sellier, rue de\n    République, rue Pasteur, rue des Moulineaux, rue des carrières, rue Gambetta, rue Honoré d’Estienne d’Orves, rue\n    Gardénat Lapostol, rue Carnot, rue des Bas-Rogers, rue Duclaux, rue de Verdun et rue des Fusillés de la Résistance\n    (cf. croquis pages suivantes) :\n    *** pour l’îlot De Lattre/Nouvelles/Procession, les constructions devront respecter les hauteurs maximales définies\n    sur le schéma de principe suivant :\n    -    12 mètres pour les parcelles donnant sur la rue des Nouvelles et sur la rue de la Procession\n    -    13 mètres permettant la construction d’un rez-de-chaussée surélevé à usage de commerces sur le\n    boulevard du Maréchal de Lattre de Tassigny.\n    38","P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    39","P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    40","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n10.3    Dépassements de la hauteur totale maximale autorisée dans l’ensemble de la zone\n10.3.1 Le dépassement de la hauteur totale maximale fixée, peut être accordé, lorsque la construction\ns’implante en contiguïté d’un bâtiment existant à la date d’approbation du PLU, dépassant cette hauteur,\nafin de réaliser une meilleure intégration dans la limite de l’héberge voisine la plus haute du bâtiment\nexistant contigu. Cette dérogation ne peut être autorisée que dans la limite de 50% du linéaire de la façade\nsur rue du bâtiment.\n10.3.2 En ce qui concerne les équipements cultuels, un dépassement ponctuel sera autorisé pour la\nconstruction d’un point haut de reconnaissance (clocher, flèche,…).\n10.3.3 Afin de prendre en compte les impératifs techniques des locaux commerciaux ou artisanaux en\npied d’immeuble et des équipements de service public et d’intérêt collectif, une bonification de 1 m de\nhauteur est accordée pour les constructions neuves en comportant. Cette bonification de hauteur porte\nuniquement sur la hauteur des locaux commerciaux et doit figurer sur les plans.\n10.4    Dépassements de la hauteur totale maximale autorisée dans le secteur UBc\n10.4.1 Des dépassements ponctuels jusqu’à 23 m (1 niveau supplémentaire maximum), ne représentant\npas plus de 40 % de l’emprise au sol de l’avant dernier niveau sont autorisés. Ces dépassements\ndevront s’inscrire dans le gabarit enveloppe défini à l’article 10.1.\n10.4.2 La hauteur pourra atteindre 23 m (un niveau supplémentaire maximum), si plus de 60 % de\nl'emprise au sol totale sont sur pilotis, et assurent des transparences vers le cœur d'îlot.\n10.4.3 A l’emplacement de la parcelle située 33 quai Galliéni, la hauteur maximale est limitée à 45\nmètres au-dessus du terrain naturel avant travaux.\n10.4.4 Sur une portion de terrain défini au plan de zonage, la hauteur maximale est portée à 29m. Cette\nhauteur ne pourra être atteinte que par des retraits successifs à partir de 23m.\n10.5    Règle particulière\nDans une bande de six mètres le long des limites séparatives avec un terrain situé en zone UD, la hauteur\nautorisée est limitée à 9 mètres à l’acrotère ou à l’égout du bâtiment, et à 12 mètres du faitage en cas de\ntoiture à pente.\n    41","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UB 11 - Aspect extérieur - clôtures\nLe projet peut être refusé ou n’être accepté que sous réserve de l’observation de prescriptions spéciales si\nles constructions, par leur situation, leur architecture, leurs dimensions ou l’aspect extérieur des bâtiments\nou ouvrages à édifier ou à modifier, sont de nature à porter atteinte au caractère ou à l’intérêt des lieux\navoisinants, aux sites, aux paysages naturels ou urbains ainsi qu’à la conservation des perspectives\nmonumentales.\nToute construction, agrandissement, restauration ou aménagement d’immeuble devra prendre en compte\nle caractère du site de façon à s’harmoniser avec son environnement architectural et paysager (toitures,\nmatériaux…).\n11.1    Aspect extérieur\n11.1.1 Aspect des toitures\nLes toitures terrasses non-accessibles devront être végétalisées chaque fois que cela est possible. Les\ncouvertures d’aspect précaires sont interdites et en règle générale les couvertures doivent faire l’objet\nd’un traitement soigné.\n11.1.2 Volumes\n    -    Afin d’éviter les gaines en toitures, les dispositifs de type VMC inversée sont à privilégier. Les\n    ouvrages et locaux techniques tels que machineries d’ascenseurs, de réfrigération, sortie de\n    secours, gaines de ventilation … doivent faire partie de la composition volumétrique d’ensemble\n    et ne pas être laissés apparents notamment dans le cas de toiture terrasse : usage de toiture\n    partielle, de dalle, ou de coffrage s’intégrant dans l’ensemble du bâti par exemple.\n    -    Les châssis oscillo-basculants devront être encastrés dans le plan de la toiture.\n11.1.3 Façades - Pignons\n    -    Les différents murs d’un bâtiment ou d’un ensemble de bâtiments doivent être traités avec le\n    même soin et en harmonie entre elles.\n    -    L’utilisation de matériaux de qualité pour les façades est recommandée.\n    -    L’emploi à nu de matériaux destinés à être recouverts, est interdit.\n    -    Les couleurs de matériaux de parement et des peintures extérieures devront s’harmoniser entre\n    elles et ne pas porter atteinte au caractère urbain.\n    -    Les antennes collectives et paraboliques sont interdites au même titre que les climatisations en\n    façade sur rue et seront implantées sur les toitures ou sur les façades du bâtiment, non visibles de\n    la rue.\nPour les constructions existantes\nLes éléments d’ornementation existants (modénatures, corniches, volets, persiennes, ...) devront, dans la\nmesure du possible, être conservés et restaurés.\nPour les façades commerciales\nLa création de façades commerciales est autorisée dans les limites suivantes :\n    - Les percements destinés à recevoir des vitrines devront s’adapter à l’architecture du bâtiment,\n    - Lorsqu’un même commerce est établi sur plusieurs immeubles contigus, les percements de\n    vitrine devront respecter les limites séparatives.\n11.1.4 La pose de capteurs solaires doit être étudiée, notamment au regard de la trame des ouvertures de\nla façade, et afin de favoriser une intégration dans le plan de toiture ou en façade.\n    42","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n11.2    Annexes, locaux techniques\n11.2.1 Extensions, garages, boxes\nLes bâtiments annexes doivent être conçus en harmonie de volumes et de matériaux avec les constructions\nexistantes. Les annexes réalisées avec des moyens de fortune tels que des matériaux de démolition,\nrécupération de matériaux destinés à être recouverts, utilisés à nu, sont interdits.\n11.2.2 Locaux techniques\nLes coffrets, compteurs, et boîtes aux lettres devront être intégrés dans les murs de construction.\nLes locaux techniques y compris ceux destinés au stockage des conteneurs adaptés aux ordures ménagères\net au tri sélectif, devront être intégrés au bâti principal.\nEn cas d’impossibilité, ils seront réalisés dans une annexe qui prendra en compte le bâti annexe, les\nconstructions voisines, la structure végétale existante et les plantations à créer.\n11.3    Clôtures\n11.3.1 Clôtures sur les voies publiques ou privées : cas général\n    -    Les clôtures sur les voies publiques ou privées doivent être en harmonie avec la construction\n    principale\n    -    Elles ne peuvent pas comporter de parties pleines d’une hauteur supérieure à 1,20 m à partir du\n    trottoir. La hauteur totale de la clôture ne peut être supérieure à 2 m. Les piliers des portails\n    d’entrée et de clôture ne peuvent pas dépasser 2,20 m de hauteur. Les différents portails d’une\n    même propriété seront de même style architectural.\n    -    Pour les parcelles dont la largeur est inférieure ou égale à 6m et dans le cas où il est nécessaire\n    d’installer un système enroulant : la hauteur globale prenant en compte les piliers de portails\n    d’accès véhicules et les linteaux, est portée à 2,60m maximum.\n    -    Dans le cas de rue en pente, les hauteurs sont prises au milieu de chaque élément de clôture.\n    -    Toutefois, pour des raisons de sécurité, la hauteur totale des clôtures pourra être portée à 2,60 m\n    pour les installations nécessaires aux services publics ou d’intérêt collectif.\n    -    Les clôtures anciennes ayant un caractère architectural affirmé, devront être conservées et\n    restaurées avec les mêmes matériaux.\n11.3.2 Clôtures le long des rues de Verdun, Ledru Rollin et Salomon de Rothschild\nLe long de ces voies, la hauteur des clôtures doit s’inscrire entre 1,60 m et 2,00 m. Les clôtures peuvent\ncomporter une partie pleine qui varie entre 0,60 m et 1,20 m mais comportent obligatoirement une grille à\nclaire voie dont le motif est vertical.\nLes différents portails d’une même propriété seront de même style architectural.\n11.3.3 Clôtures sur les limites séparatives\nLa hauteur totale de la clôture ne peut être supérieure à 2,60 m. Elles devront être aménagées de manière\nà laisser passer la faune.\n11.3.4 Dans le cas de terrain en pente, les hauteurs sont prises au milieu de chaque élément de clôture.\nLorsqu’il y a nécessité de créer un mur de soutènement, celui-ci peut constituer la partie pleine de la\nclôture jusqu’à concurrence de 1,20 m. Le reste doit être traité en talus.\n11.4    Les installations nécessaires aux services publics ou d’intérêt collectif ne sont pas assujettis aux\nlimitations de hauteur des clôtures de l’article 11.3.\n    43","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    ARTICLE UB 12 - Stationnement\n    Le stationnement des véhicules, automobiles, motocycles et cycles correspondant aux besoins des\n    constructions et installations doit être assuré en dehors des voies publiques. A cet effet, il devra être\n    réalisé sur le terrain propre à l’opération des aires de stationnement dont les normes minimales sont\n    définies ci-après.\n    12.1    Caractéristiques applicables aux parcs de stationnement collectifs\n    Les rampes d’accès aux aires de stationnement en sous-sol ne doivent pas entraîner de modification dans\n    le niveau du trottoir. Leur pente dans les cinq premiers mètres à partir de l’alignement ne doit pas excéder\n    5 %, sauf impossibilité technique.\n    A titre indicatif, la surface moyenne par emplacement (dégagement compris) est de l’ordre de 25m² pour\n    les automobiles, 4m² pour les motos et 1m² pour les cycles.\n    Les places doubles sont autorisées uniquement pour les parcs de stationnement liés à un immeuble\n    d’habitation pour lequel le ratio de places directement accessibles est au moins d’une place par logement,\n    Largeurs minimales des rampes d’accès :\n    - Sens unique : 3,50 m\n    - Double sens desservant jusqu’à 70 voitures : 3,50 m\n    - Double sens desservant plus de 70 voitures : 6,00 m\n    12.2    Nombre d’emplacements\n    Pour le calcul des places de stationnement nécessaires à une opération, le nombre obtenu par l’application\n    des normes définies ci-dessous sera dans tous les cas arrondis au nombre entier immédiatement supérieur.\n    12.2.1 Constructions à usage d’habitat\nStationnement    Automobiles    Motocycles    Cycles\nLogement    . 1 place par tranche de 60 m² de surface de 1 place mini. pour 10    Local clos ou couvert dont la\nCas général    plancher    logements    superficie    correspondra    au\n    . Avec 1 place mini. par logement    minimum à 0,75 m²/logement\n    jusqu’à 2 pièces principales et 1,5\n    m²/logement de 3 pièces principales\n    et plus ou au minimum une\n    superficie de 3 m².\n    Cette règle s’applique à partir de\n    trois logements collectifs.\n    Local clos ou couvert dont la\n    superficie    correspondra    au\n    minimum à 0,75 m²/logement\n    jusqu’à 2 pièces principales et 1,5\nConstructions visées à\n    . 1 place par logement (article 46 de la loi du 1 place mini pour 10    m²/logement de 3 pièces principales\nl’article L151-35 du Code\n    29 juillet 1998).    logements.    et plus ou au minimum une\nde l’Urbanisme\n    superficie de 3 m².\n    Cette règle s’applique à partir de\n    trois logements collectifs.\nLogements sociaux :\n    Il n’est pas fait obligation de réaliser des aires de\ntravaux de transformation    Non réglementé.    Non réglementé.\n    stationnement.\nou d’amélioration*\n    (*)    Bâtiments affectés à du logement locatif, financés avec un prêt aidé par l’Etat, y compris dans le cas où\n    ces travaux s’accompagnent de création de surface de plancher dans la limite d’un plafond fixé par décret au\n    Conseil d’Etat.\n    44","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    12.2.2 Constructions à usage d’activités\nStationnement    Automobiles    Motocycles    Cycles\nSurface commerciale :\n. surface de plancher  300 m²    . 25 % de la surface de plancher    Non réglementé.    Non réglementé.\n. 300 m²  surface de plancher \n    . 50 % de la surface de plancher    Non réglementé.    Non réglementé.\n2 000 m²\n    15 % de la surface de\n. surface de plancher  2 000 m²    . 100 % de la surface de plancher.    Non réglementé.\n    plancher\nMarché\n    . 70 % de la surface de plancher    Non réglementé.    Non réglementé.\n    . Norme minimum : 35 % de la surface de plancher.\n    Toutefois, il ne pourra être construit plus d’1 place\n    pour 60 m² de surface de plancher à moins de 500\n    mètres d’un point de desserte de transport en\n    1 % de la surface de 1,5 % de la surface de\nBureaux    commun structurant.\n    plancher    plancher\n    Il ne pourra être construit plus d’1 place pour 50 m²\n    de surface de plancher à plus de 500 mètres d’un\n    point de desserte de transport en commun\n    structurant.\n    . 50 % de la surface de plancher\nHôtels    . 1 place de car pour 50 chambres    1 % de la surface de plancher\n    . 25 % de surface de plancher avec 1 place minimale\nAutres    par activité    1 % de la surface de plancher\n    12.2.3 Constructions à usage d’équipements\n   Stationnement    Automobiles    Motocycles    Cycles\n   Hôpitaux - cliniques    .    40 % de la surface de plancher nouvelle    1 % de la surface de plancher\n   Salles de spectacles    .    1 place / 10 personnes    1 place / 100 personnes\n   Enseignement primaire    .    1 place / classe    Non réglementé.\n   Enseignement secondaire    .    1 place / classe    Non réglementé\n   Enseignement supérieur    .    1 place / 7 élèves    7 places / 100 m² de surface de plancher\n   Résidence services    .    1 place pour 10 unités d’habitation.    Non réglementé.\n    12.3    Cas des changements de destination et des extensions\n    12.3.1 Il est obligatoire de maintenir les places de stationnement automobile existantes, dans la limite\n    des nouveaux besoins, avec possibilité de les déplacer.\n    12.3.2 En cas d’extension sans création de logements, les normes énoncées aux articles 12.1 à 12.2 ne\n    sont applicables que pour la surface de plancher créée et lorsqu’elle induit la création de plus de 2 places\n    de stationnement.\n    12.3.3 En cas de changement de destination, les normes énoncées aux articles 12.1 à 12.2 ne sont\n    applicables que lorsqu’il induit la création de plus de 2 places de stationnement.\n    12.4    Prise en compte des transports en commun\n    Lorsque l’accès des logements mentionnés au 1er et 3ème alinéa de l’article L151-34 du Code de\n    l’Urbanisme, est situé à moins de 500 m par les voies praticables d’une gare ou d’une station de transport\n    public guidé ou de transport collectif en site propre et que la qualité de la desserte le permet, le nombre\n    45","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nd’aires de stationnement exigible par logement ne peut dépasser 0.5, s’il s’agit de logements locatifs\nfinancés avec un prêt aidé par l’Etat, d’établissements assurant l’hébergement de personnes âgées ou de\nrésidences universitaires, et 1 pour les autres catégories de logements.\n12.5    Modalités d’application\n12.5.1 Part minimale d’emplacements de stationnement enterrés ou couvert*, inclus dans un volume de\nbâtiment : 80%\n* Cette norme s’applique à partir de 3 places de stationnement groupées et ne concerne pas les installations\nnécessaires aux services publics ou d’intérêt collectif.\n12.5.2 Les places de stationnement aménagées en surface, devront être stabilisée, et perméables (pavage\nnon joint, ever-green, etc…) afin de limiter le ruissellement.\n12.5.3 Les places destinées au stationnement des cycles doivent être aménagées dans un local clos et\ncouvert, et éclairé, accessible en toute sécurité. Ce local peut être scindé en plusieurs emplacements et\npeut en outre, accueillir les voitures pour enfants.\n12.5.4 Par ailleurs, il n’est pas fixé de normes pour les installations nécessaires aux services publics ou\nd’intérêt collectif non cités préalablement, les places de stationnement seront en rapport avec le\nfonctionnement et les besoins desdits équipements.\n12.5.5 En cas d’impossibilité architecturale ou technique d’aménager sur le terrain de l’opération, le\nnombre d’emplacements nécessaires au stationnement, le constructeur est autorisé à aménager sur un\nautre terrain, dans un rayon de 300 m par les voies praticables, les surfaces de stationnement qui lui font\ndéfaut à condition qu’il apporte la preuve qu’il réalise ou fait réaliser lesdites places.\n12.6    Dispositions diverses\nPour les opérations comptant plus de 15 logements ainsi que les bureaux et les constructions de service\npublic ou d’intérêt collectif, des bornes électriques seront disposées afin d’inciter les utilisateurs à\ndéserter les énergies fossiles. Les dispositions du décret n°2011-873 du 25 juillet 2011 relatif à\nl'application des articles R. 111-14-2 à R. 111-14-5 du code de la construction et de l'habitation) et\nl’arrêté du 20 février 2012 devront être respectées.\nARTICLE UB 13 - Espaces libres et plantations, espaces boisés classés\n13.1    Espaces verts\n13.1.1 Les superficies minimales suivantes d'espace vert doivent être aménagées comme suit :\nPour les terrains  400 m²\nCoefficient total espace vert par rapport à la surface de    40 % des espaces libres dont la moitié en pleine terre\nl’unité foncière\nPour les terrains > 400 m²\nCoefficient total espace vert par rapport à la surface de 20% dont la moitiée en pleine terre\nl’unité foncière\n* espaces libres : espaces non construits, non occupés par de la voirie, des circulations piétonnes ou du\nstationnement obligatoire\nLes toitures végétalisées compteront dans le calcul de la superficie des espaces verts à hauteur de 40 %\nmaximum de cette superficie.\n    46","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n13.1.2 Exceptions faites : Des unités foncières bénéficiant des dispositions définies à l’article 9.2.\nDans ces cas, 50 % au moins des espaces libres*, s’ils existent, devront être traités en espace vert, dont la\nmoitié en pleine terre.\n13.1.3 Les marges de recul sur rue définies à l’article 6.1, doivent être traitées en espace vert excepté\npour l’emprise des rampes d’accès et des porches.\n13.2    Plantations\n13.2.1 S’ils existent, les espaces verts doivent être paysagers et plantés à raison d’un arbre par tranche\nde 100 m².\nCette disposition s’applique à partir de 100m². Afin de favoriser la biodiversité, la plantation\nd’essences différentes est à privilégier.\n13.2.2 Les aires de stationnement de surface doivent être plantées à raison d'un arbre pour 3 places.\n13.2.3 Les dalles de parc de stationnement et des constructions à rez-de-chaussée devront faire l’objet\nd’un traitement végétalisé, et recevoir pour cela 50 cm au moins de terre végétale.\n13.3    Dans le cas des installations nécessaires aux services publics ou d’intérêt collectif nécessitant par\nnature d’importants espaces non bâtis, les articles 13.1 et 13.2 ne s’appliquent pas.\n  SECTION III - Possibilités maximales d’occupation des sols\nARTICLE UB 14 - Coefficient d’occupation du sol\nLes possibilités maximales d’occupation du sol résultent de l’application des règles précédentes.\n    SECTION IV – Autres dispositions\nARTICLE UB 15 – Performances énergétiques et environnementales\nLes opérations de plus de 1 000 m² de surface de plancher à destination de bureaux ou d’habitation\ndevront respecter les labels de performances énergétiques en vigueur.\nARTICLE UB 16 – Infrastructures et réseaux de communications\nélectroniques.\nLes constructeurs sont invités à se raccorder au réseau numérique dès que cela est possible.\n    47","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    ZONE UC\nCette zone correspond aux opérations collectives qu’il s’agisse d’habitat ou d’équipements.\nLa zone UC comprend deux sous secteurs (UCa, UCb) dont les règles diffèrent aux articles 2 et 9.\nSECTION I – Nature de l’occupation et de l’utilisation du sol\nARTICLE UC 1 – Occupations et utilisations du sol interdites\n1.1    Dans le secteur UCa\nSont interdites les occupations et utilisations du sol suivantes :\n   - Les installations classées autres que celles autorisées sous condition à l'article UC 2.\n   - Les constructions à usage d’activités commerciales, artisanales ou industrielles autres que celles\n    autorisées sous condition à l’article UC 2.\n   - Les constructions à usage d'entrepôts autres que celles autorisées sous condition à l'article UC 2.\n   - Les dépôts de ferrailles, de matériaux, de combustibles solides ou liquides (hors station service),\n    ainsi que les entreprises de casse de voiture, et de transformation de matériaux de récupération.\n   - L’ouverture et l’exploitation de carrières.\n   - Le stationnement des caravanes ou d'habitation légère de loisirs.\n   - Les terrains de camping et de caravanage.\n   - Les affouillements, exhaussements des sols autres que ceux autorisés sous condition à l'article\n    UC2.\n1.2    Dans le secteur UCb\nSont interdites les occupations et utilisations du sol suivantes :\n    - Les installations classées autres que celles autorisées sous condition à l'article UC 2.\n    - Les constructions autres que celles autorisées sous condition à l’article UC 2.\n    - Les constructions à usage d’activités artisanales ou à caractère industriel.\n    - L’ouverture et l’exploitation de carrières.\n    - Le stationnement des caravanes ou d'habitation légère de loisirs.\n    - Les terrains de camping et de caravanage.\n    - Les constructions à usage de parc de stationnement et les aires de stationnement en surface autre\n    que celles précisées sous condition à l’article 2.\n    - Les affouillements, exhaussements des sols autres que ceux autorisés sous condition à l'article\n    UC 2.\nARTICLE UC 2 – Occupations et utilisations du sol soumises à des\nconditions particulières\n2.1    Sont autorisées :\n2.1.1   Dans le secteur UCa\nToutes les occupations et utilisations du sol qui ne sont pas interdites à l’article UC 1, sous réserve des\nconditions de l’article UC 2.2.\n    48","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n2.1.2    Dans le secteur UCb\n    -   Les installations nécessaires aux services publics ou d’intérêt collectif.\n    -   L’aménagement, la transformation et l’extension des constructions existantes.\n    -   Les installations et constructions à usage d’équipements techniques liées aux réseaux divers et\n    voiries.\n    -   Les constructions liées à l’activité du site militaire du Mont-Valérien.\n2.2    Les occupations et utilisations du sol suivantes sont autorisées si elles respectent les\n    conditions ci-après :\n2.2.1    Dans l’ensemble de la zone :\nLes installations classées, à condition :\n    - que soient mises en œuvre toutes les dispositions utiles pour les rendre compatibles avec les\n    milieux environnants,\n    - d’éviter toute pollution, nuisance ou dangers non maîtrisables,\n2.2.2    Dans le secteur UCa\n    -   Les constructions à usage d'entrepôts s’ils ne sont pas en façade sur rue.\n    -   Les constructions à usage d’activités commerciales, artisanales ou industrielles à condition\n    qu’elles n’entraînent, pour le voisinage, aucune nuisance.\n    -   Les constructions à usage de parc de stationnement et les aires de stationnement en surface si\n    elles sont liées à une occupation du sol autorisée.\n    -   Les affouillements et exhaussements, s’ils sont nécessaires aux travaux d’aménagement paysager\n    des espaces libres et de construction.\n    -   A l’emplacement figurant sur le document graphique, les opérations comprenant plus de 20\n    logements doivent comprendre 30 % du programme de logements affecté aux logements sociaux.\n2.2.3    Dans le secteur UCb\n    -   Les constructions à usage de parc de stationnement et les aires de stationnement en surface si\n    elles sont liées à une occupation du sol autorisée.\n    -   Les constructions à usage d’habitation et leurs annexes si elles sont complémentaires à une\n    installation nécessaire aux services publics ou d’intérêt collectif.\n    SECTION II – Conditions de l’occupation du sol\nARTICLE UC 3 – Accès et voirie\n3.1    Toute nouvelle unité foncière doit disposer d’un accès pour les automobiles par une voie\npublique ou privée d’une largeur de 3,50 m minimum.\nCette disposition ne s’applique pas aux unités foncières existantes à la date d’approbation du PLU.\n3.2    Toute nouvelle voie se terminant en impasse doit être aménagée à son extrémité, de telle manière\nque tous les véhicules amenés à l’emprunter puissent aisément faire demi-tour.\n3.3    Ces accès ne doivent pas présenter un risque pour la sécurité des usagers des voies publiques ou\npour celle des personnes utilisant ces accès. Cette sécurité doit être appréciée compte tenu notamment, de\nla disposition des accès, de leur configuration ainsi que de la nature et de l'intensité du trafic.\n    49","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UC 4 – Desserte par les réseaux\n4.1    Alimentation en eau potable\nToute construction ou installation nouvelle qui nécessite une alimentation en eau doit être raccordée au\nréseau public de distribution d'eau potable.\n4.2    Assainissement\nToute construction devra respecter les documents suivants :\n     Le règlement du service départemental d’assainissement des Hauts-de-Seine ;\n     Le règlement du service d’assainissement de l’EPT Paris Ouest La Défense.\nCes deux documents sont disponibles en annexe du présent Plan Local d’urbanisme.\n4.3    Autres réseaux\nA l’occasion de toute construction neuve, extension ou surélévation, soumise à permis de construire, les\nréseaux, raccordements (électricité, câble, téléphone…), les installations nouvelles et branchements seront\nobligatoirement réalisés en souterrain ou s'intégreront au bâti.\n4.4    Déchets\nPour les nouvelles constructions de plus de deux logements, des locaux poubelles, correctement\ndimensionnés pour accueillir l’ensemble des bacs de la collecte sélective nécessaires aux usagers, doivent\nêtre aménagés de préférence à rez-de-chaussée des constructions, avec accès direct sur le domaine public.\nDans le cas où les locaux ne permettent pas l’accès direct sur rue, il est vivement recommandé de prévoir\nun lieu de stockage sur le domaine privé, facilitant l’accès aux bacs les jours de collecte.\nUn cahier des charges est joint à l’annexe 6 de la pièce 4.2 « Annexes du rêglement ».\nARTICLE UC 5 – Caractéristiques des terrains\nSans objet.\nARTICLE UC 6 – Implantation des constructions par rapport aux voies\net emprises publiques ou privées.\n6.1.    Règles générales\nLes constructions doivent s’implanter :\n    - En retrait de 2 mètres minimum par rapport aux voies publiques ou privées, existantes ou à créer.\n6.2.    Règles particulières\n6.2.1    Des implantations autres que celles définies à l’article 6.1 sont possibles, lorsque le projet de\nconstruction assure la continuité de volume avec les immeubles voisins existants, et sous réserve d’une\nbonne intégration au site urbain environnant.\n    50","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n6.2.2    Des implantations autres que celles définies à l’article 6.1 sont possibles, dans le cas d’une\nextension et/ou d’une surélévation d’une construction existante à la date d’approbation du PLU, ne\nrespectant pas les dispositions de l’article 6.1, et sous réserve d’une bonne intégration au site urbain\nenvironnant.\nPour les équipements publics ou d’intérêt collectif, qui peuvent être implantés à l’alignement ou en retrait\nde 2 m minimum.\n6.2.3   Sur les terrains situés à l’angle de deux voies les constructions devront s’inscrire à l’intérieur\nd’un pan coupé d'une largeur minimale de 5 m, perpendiculaire à la bissectrice de l'angle des deux voies.\n6.3    Saillies\nLes saillies sur voie publique ou privée sont autorisées sous réserve :\n    - que la largeur de la voie soit supérieure ou égale à 10 mètres\n    - qu’elles soient placées à une hauteur de 4,30 m minimum, au-dessus de la chaussée,\n    - que leur profondeur n’excède pas 0,80 m,\n    - que l’ensemble du linéaire de saillies constitutives de surfaces de plancher par niveau ne dépasse\n    pas 30 % du linéaire de la façade.\nLa mise en place d’une isolation thermique sur voie publique est autorisée sur les bâtiments existants à la\ndate d’approbation du PLU sous réserve de faire l’objet d’un traitement architectural d’ensemble de\nqualité, que la largeur du trottoir après travaux reste égale ou supérieur à 1,40 mètre, de la prise en\ncompte des réseaux existants et sous réserve de l’accord du gestionnaire de la voirie.\nNota : Les saillies localisées sur les voies départementales devront également respecter les dispositions du\nrèglement de la voirie départementale.\n    51","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UC 7 – Implantation des constructions par rapport aux\nlimites séparatives\n7.1    Retraits\n7.1.1    En cas de retrait, la distance comptée, mesurée perpendiculairement et horizontalement, en tout\npoint de la façade du batiment par rapport à la limite séparative la plus proche, doit être :\n    - Au moins égale à la hauteur en tout point de la façade du bâtiment, sans pouvoir être inférieure à\n    8 m si la façade comporte une ou des baies principales : L = H ≥ 8 m,\n    - Au moins égale à sa demi hauteur en tout point de la façade du batiment, sans pouvoir être\n    inférieure à 4 m dans les autres cas : L = H/2 ≥ 4 m.\n7.1.2    Lorsque les façades ne sont pas parallèles à la limite séparative, les deux règles suivantes se\nsubstituent à la règle énoncée à l’article 7.1.2 :\nSi la façade comporte une ou des baies principales :\n    - La distance entre la limite séparative et le milieu de la façade du bâtiment, mesurée\n    perpendiculairement et horizontalement doit au moins être égale à la hauteur de cette façade,\n    avec un minimum de 8 m : L = H ≥ 8 m\n    Et\n    - La distance entre la limite séparative et tout point de la façade du bâtiment, mesurée\n    perpendiculairement et horizontalement doit être au moins égale aux 3/4 de la hauteur de cette\n    façade, avec un minimum de 6 m : L = ¾ H ≥ 6 m.\nDans les autres cas :\nLa distance entre la limite séparative et tout point de la façade du bâtiment, mesurée perpendiculairement\net horizontalement doit être au moins égale à la moitié de la hauteur de cette façade, sans pouvoir être\ninférieure à 4 m : L = H/2 ≥ 4 m.\n7.2    Les constructions doivent s’implanter en retrait des limites séparatives, conformément aux\nprescriptions de l’article 7.1.\n7.3    Cours communes\n7.3.1. Les constructions peuvent être implantées à une distance moindre que celle définie ci-dessus,\nlorsque les deux propriétaires voisins, s’obligent réciproquement à créer une servitude de cour commune\npropre à respecter les prescriptions de l’article 8.\nEn l’absence d’accord amiable, il peut être fait application des dispositions de l’article 471-1 du Code de\nl’Urbanisme.\n7.3.2    La notion de cour commune s’applique au sol naturel (servitude non aedificandi) et/ou à un sol\nartificiel correspondant au niveau le plus élevé d’un bâtiment existant (servitude non altius tollendi).\n7.3.3    Dans le cas où une construction principale située sur une parcelle voisine comporte une courette\nou un puits de lumière en limite séparative sur lequel s’ouvrent des baies, un retrait au moins symétrique\nest autorisé afin d’assurer un éclairement convenable à la construction existante.\n7.4    Des retraits inférieurs aux prescriptions de l’article 7.1 peuvent être autorisés sous condition,\ndans le cas de constructions existant à la date d’approbation du P.L.U., et ne respectant pas les\ndispositions des articles 7.1 à 7.3 pour :\n    52","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    -   La surélévation d’un niveau maximum, d’une construction, si la surélévation des murs concernés\n    ne comportent pas de baies et à condition qu’elle se fasse dans le prolongement des murs\n    existants,\n    -   Une extension de faible importance des constructions principales existantes à la date\n    d’approbation du P.L.U (5 % de l’emprise au sol existante) dont le but est l’amélioration du\n    confort (ascenseurs, sanitaires, mise aux normes, locaux déchets ménagers, locaux vélos, ...) ou\n    l’amélioration de la performance énergétique (isolation extérieure) ou l’amélioration de\n    l’accessibilité des bâtiments aux Personnes à Mobilité Réduite.\n    -   Une extension d’un niveau maximum et dont l’implantation se réalise dans le prolongement des\n    murs existants, sous réserve que les façades donnant sur les limites latérales ne comportent pas\n    de baies.\n7.5    Sous réserve que les murs situés en limite séparative soient aveugles, les annexes de moins de 15\nm² d’emprise au sol et dont la hauteur totale n’excède pas 2,60 m peuvent s’implanter en limite séparative\nou en retrait minimum de 1 m sur l’ensemble de l’unité foncière. En cas de baies les prescriptions des\narticles 7.1 à 7.4 s’appliquent.\n7.6    Les installations nécessaires aux services publics ou d’intérêt collectif ne sont pas assujettis aux\ndispositions des articles 7.1 et peuvent s’implanter soit en limites séparatives, soit en retrait de 4 m\nminimum de ces limites.\nARTICLE UC 8 – Implantation des constructions les unes par rapport\naux autres sur une même propriété\n8.1.    Règles générales\nLa construction de plusieurs bâtiments non contigus sur une même unité foncière est autorisée, à\ncondition que :\n    - En tout point de chaque façade, la distance la séparant de la façade d’un autre bâtiment, mesurée\n    perpendiculairement et horizontalement, soit au moins égale à :\n     La hauteur de la façade en tout point, sans pouvoir être inférieure à 8 m lorsque la\n    façade la plus basse comporte des baies principales : L = H ≥ 8 m.\n     Sa demi-hauteur en tout point, sans pouvoir être inférieure à 4 m dans les autres cas\n    (L = H/2 ≥ 4 m).\n8.2    Règles particulières\n8.2.1    Les installations nécessaires aux services publics ou d’intérêt collectif peuvent s’implanter soit\nen contiguïté, soit à une distance de 4 m minimum.\n8.2.2    Les annexes de moins de 15 m² d’emprise au sol et dont la hauteur totale n’excède pas 2,60 m,\nne sont pas assujetties aux prescriptions de l’article 8.1 et peuvent :\n    - S’implanter à une distance de 3 m minimum des autres constructions si ces dernières comportent\n    des baies.\n    - S’implanter librement y compris s’accoler aux autres constructions, si ces dernières ne\n    comportent pas de baies.\n    53","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UC 9 – Emprise au sol\n9.1    Cas général\n9.1.1    Dans le secteur UCa\nL’emprise au sol de l’ensemble des constructions ne pourra excéder 40 % de la superficie du terrain.\nToutefois, ces dispositions ne sont pas applicables aux installations nécessaires aux services publics,\nd’intérêt collectif ou constructions à usage d’activités, pour lesquelles l’emprise au sol est portée à 60 %.\n9.1.2    Dans le secteur UCb\nNon réglementé.\n9.2    Cas particuliers\nDans le cas de constructions existantes à la date d’approbation du P.L.U., un dépassement de 5 % de\nl’emprise au sol existante pourra être autorisé, pour la réalisation de travaux destinés à l’amélioration du\nconfort (ascenseur, escalier de secours, mise aux normes, locaux déchets ménagers, locaux vélos, ...),\nl’amélioration de la performance énergétique du bâtiment (isolation par l’extérieur) ou amélioration de\nl’accessibilité du bâtiment aux Personnes à Mobilité Réduite\nARTICLE UC 10 – Hauteur maximale des constructions\n10.1    Hauteur maximale\nLes constructions doivent respecter la hauteur maximale fixée à 16 m.\n10.2    Dépassements de la hauteur totale maximale autorisée dans l’ensemble de la zone\nLe dépassement de la hauteur totale maximale fixée, peut être accordé, lorsque la construction s’implante\nen contiguïté d’un bâtiment existant à la date d’approbation du PLU, dépassant cette hauteur, afin de\nréaliser une meilleure intégration dans la limite de l’héberge voisine la plus haute du bâtiment existant\ncontigu. Cette dérogation ne peut être autorisée que dans la limite de 50% du linéaire de la façade sur rue\ndu bâtiment.\n10.3    Règle particulière\nDans une bande de six mètres le long des limites séparatives avec un terrain situé en zone UD, la hauteur\nautorisée est limitée à 9 mètres à l’acrotère ou à l’égout du bâtiment, et à 12 mètres du faitage en cas de\ntoiture à pente.\n10.4.   Afin de prendre en compte les impératifs techniques des locaux commerciaux ou artisanaux en\npied d’immeuble et des équipements de service public et d’intérêt collectif, une bonification de 1 m de\nhauteur est accordée pour les constructions neuves en comportant. Cette bonification de hauteur porte\nuniquement sur la hauteur des locaux commerciaux et doit figurer sur les plans.\nARTICLE UC 11 – Aspect extérieur - clôtures\nLe projet peut être refusé ou n’être accepté que sous réserve de l’observation de prescriptions spéciales si\nles constructions, par leur situation, leur architecture, leurs dimensions ou l’aspect extérieur des bâtiments\nou ouvrages à édifier ou à modifier, sont de nature à porter atteinte au caractère ou à l’intérêt des lieux\navoisinants, aux sites, aux paysages naturels ou urbains ainsi qu’à la conservation des perspectives\nmonumentales.\n    54","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nToute construction, agrandissement, restauration ou aménagement d’immeuble devra prendre en compte\nle caractère du site de façon à s’harmoniser avec son environnement architectural et paysager (toitures,\nmatériaux…).\n11.1    Aspect extérieur\n11.1.1 Aspect des toitures\nLes toitures terrasses non-accessibles devront être végétalisée chaque fois que cela est possible. Les\ncouvertures d’aspect précaires sont interdites et en règle générale les couvertures doivent faire l’objet\nd’un traitement soigné.\n11.1.2 Volumes\n    -    Afin d’éviter les gaines en toitures, les dispositifs de type VMC inversée sont à privilégier. Les\n    ouvrages et locaux techniques tels que machineries d’ascenseurs, de réfrigération, sortie de\n    secours, gaines de ventilation … doivent faire partie de la composition volumétrique d’ensemble\n    et ne pas être laissés apparents notamment dans le cas de toiture terrasse : usage de toiture\n    partielle, de dalle, ou de coffrage s’intégrant dans l’ensemble du bâti par exemple.\n    -    Les châssis oscillo-basculants devront être encastrés dans le plan de la toiture.\n11.1.3 Façades - Pignons\n    -    Les différents murs d’un bâtiment ou d’un ensemble de bâtiments doivent être traités avec le\n    même soin et en harmonie entre elles.\n    -    L’utilisation de matériaux de qualité pour les façades est recommandée.\n    -    L’emploi à nu de matériaux destinés à être recouverts, est interdit.\n    -    Les couleurs de matériaux de parement et des peintures extérieures devront s’harmoniser entre\n    elles.\n    -    Les antennes collectives et paraboliques sont interdites au même titre que les climatisations en\n    façade sur rue et seront implantées sur les toitures ou sur les façades du bâtiment, non visibles de\n    la rue.\nPour les façades commerciales :\nLa création de façades commerciales est autorisée dans les limites suivantes :\n    - Les percements destinés à recevoir des vitrines devront s’adapter à l’architecture du bâtiment,\n    - Lorsqu’un même commerce est établi sur plusieurs immeubles contigus, les percements de\n    vitrine devront respecter les limites séparatives.\n11.1.4 La pose de capteurs solaires doit être étudiée, notamment au regard de la trame des ouvertures\nde la façade, et afin de favoriser une intégration dans le plan de toiture ou en façade.\n11.2    Annexes, locaux techniques\n11.2.1 Extensions, garages, boxes\nLes bâtiments annexes doivent être conçus en harmonie de volumes et de matériaux avec les constructions\nexistantes. Les annexes réalisées avec des moyens de fortune tels que des matériaux de démolition,\nrécupération de matériaux destinés à être recouverts, utilisés à nu, sont interdits.\n11.2.2 Locaux techniques\n    -    Les coffrets, compteurs, boîtes aux lettres devront être intégrés dans les murs de construction.\n    -    Les locaux techniques y compris ceux destinés au stockage des conteneurs adaptés aux ordures\n    ménagères et au tri sélectif, devront être intégrés au bâti principal.\n    -    En cas d’impossibilité, ils seront réalisés dans une annexe qui prendra en compte le bâti annexe,\n    les constructions voisines, la structure végétale existante et les plantations à créer.\n11.3    Clôtures\n11.3.1 Clôtures sur les voies publiques ou privées\n    55","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    -    Les clôtures sur les voies publiques ou privée doivent être en harmonie avec la construction\n    principale\n    -    Elles ne peuvent pas comporter de parties pleines d’une hauteur supérieure à 1,20 m à partir du\n    trottoir.\n    -    La hauteur totale de la clôture ne peut être supérieure à 2 m. Les piliers des portails d’entrée et\n    de clôture ne peuvent pas dépasser 2,20 m de hauteur.\n    -    Les différents portails d’une même propriété seront de même style architectural.\n    -    Pour les parcelles dont la largeur est inférieure ou égale à 6m et dans le cas où il est nécessaire\n    d’installer un système enroulant : la hauteur globale prenant en compte les piliers de portails\n    d’accès véhicules et les linteaux, est portée à 2,60m maximum.\n    -    Dans le cas de rue en pente, les hauteurs sont prises au milieu de chaque élément de clôture.\n    -    Toutefois, pour des raisons de sécurité, la hauteur totale des clôtures pourra être portée à 2,60 m\n    pour les installations nécessaires aux services publics ou d’intérêt collectif.\n11.3.2 Clôtures sur les limites séparatives\nLa hauteur totale de la clôture ne peut être supérieure à 2,60 m. Elles devront être aménagées de manière\nà laisser passer la faune.\n11.3.3 Dans le cas de terrain en pente, les hauteurs sont prises au milieu de chaque élément de clôture.\nLorsqu’il y a nécessité de créer un mur de soutènement, celui-ci peut constituer la partie pleine de la\nclôture jusqu’à concurrence de 1,20 m. Le reste doit être traité en talus.\n11.4    Les installations nécessaires aux services publics ou d’intérêt collectif ne sont pas assujetties aux\nlimitations de hauteur des clôtures de l’article 11.3\nARTICLE UC 12 - Stationnement\nLe stationnement des véhicules, automobiles, motocycles et cycles correspondant aux besoins des\nconstructions et installations doit être assuré en dehors des voies publiques. A cet effet, il devra être\nréalisé sur le terrain propre à l’opération des aires de stationnement dont les normes minimales sont\ndéfinies ci-après.\n12.1    Caractéristiques applicables aux parcs de stationnement collectifs\nA titre indicatif, la surface moyenne par emplacement (dégagement compris) est de l’ordre de 25m² pour\nles automobiles, 4m² pour les motos et 1m² pour les cycles.\nLes rampes d’accès aux aires de stationnement en sous sol ne doivent pas entrainer de modification dans\nle niveau de trottoir. Leur pente dans les 5 premiers mètres à partir de l’alignement ne doit pas excéder\n5% sauf impossibilité techniques.\nLes places doubles sont autorisées uniquement pour les parcs de stationnement liés à un immeuble\nd’habitation pour lequel le ratio de places directement accessibles est d’au moins une place par logement.\nLargeurs minimales des rampes d’accès :\n    - Sens unique : 3,50 m\n    - Double sens desservant jusqu’à 70 voitures : 3,50 m\n    - Double sens desservant plus de 70 voitures : 6,00 m\n12.2    Nombre d’emplacements\nPour le calcul des places de stationnement nécessaires à une opération, le nombre obtenu par l’application\ndes normes définies ci-dessous sera dans tous les cas arrondis au nombre entier immédiatement supérieur.\n    56","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    12.2.1 Constructions à usage d’habitat\nStationnement    Automobiles    Motocycles    Cycles\nConstruction nouvelle    . 1 place par tranche de 60 m² de surface    1 place mini. pour 10 Local clos ou couvert dont la superficie\n    de plancher    logements    correspondra au minimum à 0,75\n    . Avec 1 place mini. par logement    m²/logement jusqu’à 2 pièces principales\n    et 1,5 m²/logement de 3 pièces\n    principales et plus ou au minimum une\n    superficie de 3 m².\n    Cette règle s’applique à partir de trois\n    logements collectifs\nConstructions visées à    . 1 place par logement (article 46 de la loi 1 place mini pour 10 Local clos ou couvert dont la superficie\nl’article L151-35 du Code    du 29 juillet 1998).    logements.    correspondra au minimum à 0,75\nde l’Urbanisme    m²/logement jusqu’à 2 pièces principales\n    et 1,5 m²/logement de 3 pièces\n    principales
