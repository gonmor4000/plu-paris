 logements\n    locatifs financés avec un prêt aidé par l’Etat, d’établissements assurant l’hébergement de personnes âgées\n    ou de résidences universitaires, et 1 pour les autres catégories de logements.\n    12.5    Modalités d’application\n    12.5.1 80 % minimum des emplacements de stationnement doivent être réalisées dans des constructions\n    en sous-sol ou, à défaut, en cas de réhabilitation de bâtiments existants, dans le volume bâti, sauf dans le\n    cas des équipements publics pour lesquels le stationnement peut être réalisé dans le volume des bâtiments\n    ou exceptionnellement en surface.\n    12.5.2 Les places de stationnement aménagées en surface, devront être (stabilisées et perméables :\n    pavage non joint ever-green, etc.…) afin de limiter le ruissellement.\n    116","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n12.5.3 Les places destinées au stationnement des cycles doivent être aménagées dans un local clos et\ncouvert situé dans le volume et de préférence à rez-de-chaussée, accessible en toute sécurité. Ce local\npeut en outre, accueillir les voitures pour enfants.\n12.5.4 Par ailleurs, il n’est pas fixé de normes pour les installations nécessaires aux services publics ou\nd’intérêt collectif non cités préalablement, les places de stationnement seront en rapport avec le\nfonctionnement et les besoins desdits équipements.\n12.5.5 En cas d’impossibilité architecturale ou technique d’aménager sur le terrain de l’opération, le\nnombre d’emplacements nécessaires au stationnement, le constructeur est autorisé à aménager sur un\nautre terrain, dans un rayon de 300 m par les voies praticables, les surfaces de stationnement qui lui font\ndéfaut à condition qu’il apporte la preuve qu’il réalise ou fait réaliser lesdites places.\n12.6    Dispositions diverses\nPour les opérations comptant plus de 15 logements ainsi que les bureaux et les constructions de service\npublic ou d’intérêt collectif, des bornes électriques seront disposées afin d’inciter les utilisateurs à\ndéserter les énergies fossiles. Les dispositions du décret n°2011-873 du 25 juillet 2011 relatif à\nl'application des articles R. 111-14-2 à R. 111-14-5 du code de la construction et de l'habitation) et\nl’arrêté du 20 février 2012 devront être respectées.\nARTICLE UPm 3.13 - Espaces libres et plantations\n13.1    Espaces verts\nTout espace non bâti doit être planté et ce, pour tout projet de construction. Ceci entraîne l'obligation de\ntraiter en espace vert les espaces libres*.\nLes toitures végétalisées compteront dans le calcul de la superficie des espaces verts à hauteur de 40 %\nmaximum de cette superficie.\n* espaces libres : espaces non construits, non occupés par de la voirie, des circulations piétonnes ou du\nstationnement obligatoire\n13.2    Plantations\n13.2.1 S’ils existent, les espaces verts doivent être paysagers et plantés à raison d’un arbre par tranche\nde 100 m².\nCette disposition s’applique à partir de 100m². Afin de favoriser la biodiversité, la plantation\nd’essences différentes est à privilégier.\n13.2.2 Les dalles de parc de stationnement et des constructions à rez-de-chaussée devront faire l’objet\nd’un traitement végétalisé sur 30% de leur surface minimum, et recevoir pour cela 50 cm au moins de\nterre végétale.\n13.3    Dans le cas des installations nécessaires aux services publics ou d’intérêt collectif nécessitant par\nnature d’importants espaces non bâtis, le coefficient d’espace vert est ramené à 20 % et l’article 13.2.1 ne\ns’exerce pas.\n    117","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n   SECTION III - Possibilités maximales d'occupation du sol\nARTICLE UPm 3.14 - Coefficient d'occupation du sol (C.O.S.)\nLe C.O.S. découle de l’application des règles précédentes.\n    SECTION IV – Autres dispositions\nARTICLE UPm 3.15 - Performances énergétiques et environnementales\nLes opérations de plus de 1 000 m² de surface de plancher à destination de bureaux ou d’habitation\ndevront respecter les labels de performances énergétiques en vigueur.\nARTICLE UPm3. 16 – Infrastructures et réseaux de communications\nélectroniques.\nLes constructeurs sont invités à se raccorder au réseau numérique dès que cela est possible.\n    118","P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    119","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    ZONE UPM 4\nLe secteur Caron - Jaurès couvre la majorité de l'îlot compris entre les rues A. Caron, Syndicat des Cultivateurs,\navenues Jean Jaurès et Edouard Vaillant.\nC'est une zone mixte principalement affectée à l'habitat et aux commerces. L'expression architecturale devra être\nconçue en réponse à celle de la Cité Jardins en face, et des barres de logements sociaux existant sur le site.\n SECTION I - Nature de l’occupation et de l’utilisation du sol\nARTICLE UPm 4.1 - Occupations et utilisations du sol interdites\nSont interdites les occupations et utilisations du sol suivantes :\n    -    Les installations classées autres que celles autorisées à l'article 2.\n    -    Les constructions à usage d’activités, bureaux, services et commerces autres que celles autorisées\n    à l’article 2.\n    -    Les dépôts de ferrailles, de matériaux, de combustibles solides ou liquides (hors station service),\n    ainsi que les entreprises de casse de voiture, et de transformation de matériaux de récupération.\n    -    L’ouverture et l’exploitation de carrières.\n    -    Le stationnement des caravanes ou d'habitation légère de loisirs.\n    -    Les terrains de camping et de caravanage.\n    -    Les affouillements, exhaussements des sols autres que ceux autorisés à l'article 2.\nARTICLE UPm 4.2 - Occupations et utilisations du sol soumises à des\nconditions particulières\nLes occupations et utilisations du sol suivantes sont autorisées si elles respectent les conditions ci-\naprès :\n    -    Les installations classées, à condition :\n     que soient mises en œuvre toutes les dispositions utiles pour les rendre compatibles avec\n    les milieux environnants,\n     d’éviter toute pollution, nuisance ou dangers non maîtrisables.\n    -    Les constructions à usage d’activités, bureaux, services et commerces à condition qu’elles\n    n’entraînent, pour le voisinage, aucune nuisance.\n    -    Les affouillements et exhaussements, s’ils sont nécessaires aux travaux d’aménagement paysager\n    des espaces libres et de construction.\n    120","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    SECTION II - Conditions de l’occupation du sol\nARTICLE UPm 4.3 - Accès et voirie\n3.1    Toute nouvelle unité foncière doit disposer d’un accès pour les automobiles par une voie\npublique ou privée, d’une largeur de 3,50 m minimum. Cette disposition ne s’applique pas aux unités\nfoncières existantes à la date d’approbation du PLU.\n3.2    Toute nouvelle voie se terminant en impasse doit être aménagée à son extrémité, de telle manière\nque tous les véhicules amenés à l’emprunter puissent aisément faire demi-tour.\n3.3    Ces accès ne doivent pas présenter un risque pour la sécurité des usagers des voies publiques ou\npour celle des personnes utilisant ces accès. Cette sécurité doit être appréciée compte tenu notamment, de\nla disposition des accès, de leur configuration ainsi que de la nature et de l'intensité du trafic.\nARTICLE UPm 4.4 - Desserte par les réseaux\n4.1    Alimentation en eau potable\nToute construction ou installation nouvelle qui nécessite une alimentation en eau doit être raccordée au\nréseau public de distribution d'eau potable.\n4.2    Assainissement\nToute construction devra respecter les documents suivants :\n     Le règlement du service départemental d’assainissement des Hauts-de-Seine ;\n     Le règlement du service d’assainissement de l’EPT Paris Ouest La Défense.\nCes deux documents sont disponibles en annexe du présent Plan Local d’urbanisme.\n4.3    Autres réseaux\nA l’occasion de toute construction neuve, extension ou surélévation, soumise à permis de construire, les\nréseaux, raccordements (électricité, câble, téléphone…), les installations nouvelles et branchements seront\nobligatoirement réalisés en souterrain ou s'intégreront au bâti.\n4.4    Déchets\nPour les nouvelles constructions de plus de deux logements des locaux poubelles, correctement\ndimensionnés pour accueillir l’ensemble des bacs de la collecte sélective nécessaires aux usagers, doivent\nêtre aménagés de préférence à rez-de-chaussée des constructions, avec accès direct sur le domaine public.\nDans le cas où les locaux ne permettent pas l’accès direct sur rue, il est vivement recommandé de prévoir\nun lieu de stockage sur le domaine privé, facilitant l’accès aux bacs les jours de collecte.\nUn cahier des charges est joint à l’annexe 6 de la pièce 4.2 « Annexes du rêglement ».\n    121","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UPm 4.5 - Caractéristiques des terrains\nSans objet\nARTICLE UPm 4.6 - Implantation des constructions par rapport aux\nvoies et emprises publiques ou privées\n6.1    Les constructions doivent s’implanter à l’intérieur des polygones d’implantation définis au\ndocument graphique.\n6.2    Sur les portions de polygones exprimées sur le document graphique par un simple trait, les\nconstructions doivent s’implanter, soit à l’alignement ainsi défini, soit en retrait.\n6.3    Sur les portions de polygones exprimées sur le document graphique par un double trait, les\nconstructions doivent s’implanter à l’alignement ainsi défini et en ordre continu.\n6.3.1    L’obligation d’implantation sur alignement autorise des retraits ponctuels, et des ruptures de\ncontinuité bâtie dans la mesure où l’alignement reste majoritairement construit : 70 % de la façade\nconcernée au minimum.\n6.3.2   Elle autorise des retraits du ou des deux niveaux supérieurs, dans la mesure où trois niveaux au\nmoins (rez-de-chaussée + deux étages soit 9 m minimum) demeurent dans le plan vertical de l’alignement.\n6.4    Saillies\nLes saillies sur voie publique ou privée sont autorisées, sous réserve :\n     qu’elles soient placées à une hauteur de 4,30 m minimum, au-dessus de la chaussée,\n     que leur profondeur n’excède pas 0,80 m,\n     que l’ensemble du linéaire de saillies par niveau, ne dépasse pas 30 % du linéaire de la\n    façade.\nLa mise en place d’une isolation thermique sur voie publique est autorisée sur les bâtiments existants à la\ndate d’approbation du PLU sous réserve de faire l’objet d’un traitement architectural d’ensemble de\nqualité, que la largeur du trottoir après travaux reste égale ou supérieur à 1,40 mètre, de la prise en\ncompte des réseaux existants et sous réserve de l’accord du gestionnaire de la voirie.\nNota : Les saillies localisées sur les voies départementales devront également respecter les dispositions du\nrèglement de la voirie départementale.\nARTICLE UPm 4.7 - Implantation des constructions par rapport aux\nlimites séparatives\n7.1    Retraits\nEn cas de retrait, la distance, mesurée perpendiculairement et horizontalement, comptée en tout point de\nla façade d’un bâtiment par rapport à la limite séparative la plus proche, doit être :\n    122","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    -   Au moins égale à la moitié de la hauteur en tout point de la façade du batiment, sans pouvoir être\n    inférieure à 9 m lorsque la façade comporte des baies principales : L = (H /2) ≥ 9 m,\n    -   Au moins égale à 5 m dans les autres cas : L ≥ 5 m.\n7.2    Cas général\n7.2.1    Les constructions peuvent s’implanter :\n    -   En limite séparative, si la partie de façade du batiment concernée est aveugle.\n    -   En retrait de la limite séparative, dans ce cas, les constructions devront s’écarter de ces limites\n    conformément aux prescriptions de l’article 7.1.\n7.2.2    Dans le cas où un bâtiment est implanté en limite séparative, et comporte au dernier niveau un\nretrait par rapport au plan vertical de cette limite, la façade de ce niveau qui regarde la limite séparative\npeut être aveugle ou ne comporter des baies à condition qu’un retrait de 3 m minimum soit respecté par\nrapport au plan vertical de cette limite.\n7.3    Cas des deux bâtiments conservés indiqués au plan.\n7.3.1    L’assiette foncière de ces bâtiments coïncide avec leur emprise.\n7.3.2    L’extension de leurs rez-de-chaussée et entresols à vocation d’activités commerciales ou autres,\nsous réserve du règlement, est autorisée.\n7.3.3    En cas de réalisation d’une toiture en pente une surélévation de 3 m maximum par rapport à\nl’égout existant est autorisée.\n7.3.4    Les implantations de constructions nouvelles respecteront par rapport à ces bâtiments les règles\nde l’article 8.\n7.3.5    Les constructions contiguës aux parties des façades de ces bâtiments aveugles ou ne comportant\nque des jours de souffrance sont autorisées,\n7.4 Cas particulier de l’ilot C\nDans l’ilot C, les constructions en superstructure doivent s’implanter à l’intérieur des polygones de\nconstructibilité définis au plan masse.\nLes prescriptions des articles 7.1 et 7.2 ne s’appliquent pas.\nLes prospects résultent de l’application des règles de distances et de hauteurs maximales définies sur le\nplan masse.\n7.5    Cours communes\nLes constructions peuvent être implantées à une distance moindre que celle définie ci-dessus, lorsque les\ndeux propriétaires voisins, s’obligent réciproquement à créer une servitude de cour commune propre à\nrespecter les prescriptions de l’article 8.\nEn l’absence d’accord amiable, il peut être fait application des dispositions de l’article R.451.1 du Code\nde l’Urbanisme.\n7.6    Sous réserve que les murs situés en limite séparative soient aveugles, les annexes de moins de 15\nm² d’emprise au sol et dont la hauteur totale n’excède pas 2,60 m peuvent s’implanter en limite séparative\nou en retrait minimum de 1 m sur l’ensemble de l’unité foncière. En cas de baies les prescriptions des\narticles 7.1 à 7.4 s’appliquent.\n    123","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UPm 4.8 - Implantation des constructions les unes par\nrapport aux autres sur la même unité foncière\n8.1    La construction de plusieurs bâtiments non contigus sur une même unité foncière est autorisée, à\ncondition que :\n    -    En tout point de chaque façade, la distance la séparant de la façade d’un autre bâtiment, mesurée\n    perpendiculairement et horizontalement, soit au moins égale à :\n        La hauteur de la façade la plus haute diminuée de 3 m, avec un minimum de 8 m, si\n    la façade la plus basse comporte des baies principales,\n        La hauteur de la façade la plus basse diminuée de 3 m, avec un minimum de 8 m, si\n    cette dernière ne comporte pas de baies principales et que la façade la plus haute en\n    comporte,\n        5 m minimum, si les deux façades ne comportent pas de baies principales.\n8.2    Lorsqu’un bâtiment comporte au rez-de-chaussée des locaux commerciaux ou des locaux autres\nque d’habitation ou de travail, le prospect que doit respecter un immeuble lui faisant face, se mesure par\nrapport à son premier plancher habitable.\nARTICLE UPm 4.9 - Emprise au sol\n9.1    Cas 1 : Ilot A\nL’emprise maximale des constructions en superstructure est celle définie au document graphique par le\n“ polygone de constructibilité en superstructure ” en dehors de l’espace privé central.\n9.2    Cas 2 : Ilots B et C\nL’emprise maximale des constructions en superstructure est celle définie au document graphique par les\n“ polygones de constructibilité en superstructure ” en dehors de “ l’espace privé non constructible en\nsuperstructure à partir du 1er étage ”.\nLes rez-de-chaussée ne sont constructibles dans leur totalité (100 % de l’emprise de l’assiette foncière)\nqu’à condition qu’ils soient à usage de commerces ou d’activités.\n9.3    Cas 3 : Ilot D\nLorsqu’au document graphique, un polygone de constructibilité ne comporte pas “ d’espace privé non\nconstructible en superstructure ”, l’emprise au sol des constructions en superstructure, ne peut excéder 70\n% de la superficie de l’unité foncière.\n9.4    Cas 4 : Ilot E\nSur la place du marché, le polygone E définit l’emprise maximale du marché, hors édicules techniques\nliés au fonctionnement du marché et aux circulations verticales\nARTICLE UPm 4.10 - Hauteur maximale des constructions\n10.1    Règle générale\n    124","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n10.1.1 La hauteur des constructions est limitée à 19m à l’égout ou au niveau supérieur de la terrasse.\nPour favoriser la réalisation de toitures en pente, une hauteur totale maximale de 22 m (au faîtage) peut\nêtre autorisée à condition que les 3 m supplémentaires ne soient utilisés que pour réaliser les plans\nobliques de ces toitures et que ces toitures aient des pentes supérieures à 30°, en fonction des matériaux\nutilisés.\n10.1.2 Les constructions doivent, en outre, respecter le nombre de niveaux minimum indiqué au\ndocument graphique sur au moins 60 % de l’emprise de l’étage courant (soit R+ 4 : 16 m minimum).\n10.2    Compte tenu des espaces adjacents publics ou privés non constructibles :\n10.2.1 En bordure des voies suivantes (avenues Jean Jaurès et Edouard Vaillant, rues du Syndicat des\nCultivateurs et Albert Caron), la hauteur des constructions devra respecter un prospect H = L par rapport\nà l’alignement opposé.\nA l’angle de deux voies d’inégales largeurs, la hauteur obtenue par application du prospect H = L sur la\nvoie la plus large peut être retournée sur la voie la plus étroite sur une distance de 15m maximum à partir\nde l’angle.\n10.2.2 En bordure des emprises publiques à l’intérieur du secteur de plan de masse ou en bordure\nd’espaces privés non constructibles, la hauteur des bâtiments peut être celle définie en 10.1, sous réserve,\nen ce qui concerne le polygone A, de respecter un prospect minimal de H = L par rapport aux fonds de\nparcelles des pavillons existants de la rue Albert Caron.\n10.3    Cas particulier de l’ilot C\nDans l’ilot C, la hauteur totale maximale des constructions est indiquée sur le plan masse ci-joint.\nLes prescriptions des articles 10.1 et 10.2 ne s’appliquent pas.\nLa hauteur de 22m est conditionnée par la réalisation de toitures terrasses végétalisées et de rez de\nchaussée affectée principalement à usage de commerces ou d’activités.\nPour favoriser un traitement d’angle soigné, la hauteur de 24 m est uniquement conditionnée par la\nréalisation de rez-de-chaussée affectéS principalement à usage de commerces ou d’activités.\n10.4    Compte tenu des infrastructures existantes\nIl existe entre les bâtiments existants conservés indiqués au plan un parc de stationnement souterrain dont\nla surface du plancher haut est à une cote moyenne entre le niveau de la rue Albert Caron et celui de la\nplace Jean Jaurès.\nPour les constructions superposées à cet ouvrage ou en bordure de celui-ci (unité foncière limitrophe de\ncet ouvrage) le niveau de référence à partir duquel sera mesurée la hauteur sera celui de la surface actuelle\nde ce parc de stationnement (soit une cote de 92.75 N.G.F.).\nARTICLE UPm 4.11 - Aspect extérieur - clôtures\nLe projet peut être refusé ou n’être accepté que sous réserve de l’observation de prescriptions spéciales si\nles constructions, par leur situation, leur architecture, leurs dimensions ou l’aspect extérieur des bâtiments\nou ouvrages à édifier ou à modifier, sont de nature à porter atteinte au caractère ou à l’intérêt des lieux\navoisinants, aux sites, aux paysages naturels ou urbains ainsi qu’à la conservation des perspectives\nmonumentales.\n    125","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nToute construction, agrandissement, restauration ou aménagement d’immeuble devra prendre en compte\nle caractère du site de façon à s’harmoniser avec son environnement architectural et paysager (toitures,\nmatériaux…).\n11.1    Aspect extérieurs\n11.1.1 Aspect des toitures\nLes toitures terrasses non accessibles, devront être végétalisées chaque fois que cela est possible. Les\ncouvertures d’aspect précaires sont interdites et en règle générale les couvertures doivent faire l’objet\nd’un traitement soigné.\n11.1.2 Volumes\nAfin d’éviter les gaines en toitures, les dispositifs de type VMC inversée sont à privilégier. Les ouvrages\net locaux techniques tels que machineries d’ascenseurs, de réfrigération, sortie de secours, gaines de\nventilation … doivent faire partie de la composition volumétrique d’ensemble et ne pas être laissés\napparents notamment dans le cas de toiture terrasse : usage de toiture partielle, de dalle, ou de coffrage\ns’intégrant dans l’ensemble du bâti par exemple.\n11.1.3 Façades - Pignons\n    -    Les différents murs d’un bâtiment ou d’un ensemble de bâtiments doivent être traités avec le\n    même soin et en harmonie entre eux.\n    Ceci n’exclut pas que les façades « intérieures » (sur cour ou jardins privatifs) aient un caractère\n    différent des façades « extérieures » (tournées sur les espaces publics).\n    -    L’utilisation de matériaux de qualité pour les façades est recommandée.\n    -    L’emploi à nu de matériaux destinés à être recouverts, est interdit.\n    -    Les couleurs de matériaux de parement et des peintures extérieures devront s’harmoniser entre\n    elles\n    -    Les conduits de fumée ou de ventilation à surélever le long d’une façade ou d’un pignon doivent\n    être traités en harmonie avec cette façade ou ce pignon.\n    -    Les antennes collectives et paraboliques sont interdites au même titre que les climatisations en\n    façade sur rue et seront implantées sur les toitures ou sur les façades du bâtiment, non visibles de\n    la rue.\nPour les constructions existantes\n   -    Le caractère d’origine de la façade devra être préservé, notamment lorsqu’elle est composée de\n    pierres de taille ou de briques soigneusement mises en œuvre.\n   -    Les éléments d’ornementation existants (modénatures, corniches, volets ou persiennes, ...)\n    devront, dans la mesure du possible, être conservés et restaurés.\nPour les surélévations\nLes surélévations et redressements de toiture des constructions existantes devront respecter les\ndispositions des articles 6 à 11 du présent règlement, et être traités en harmonie avec l’architecture\noriginelle et les matériaux du bâtiment concerné.\nPour les façades commerciales : la création de façades commerciales est autorisée dans les limites\nsuivantes :\n    -    Les percements destinés à recevoir des vitrines devront s’adapter à l’architecture du bâtiment,\n    -    Lorsqu’un même commerce est établi sur plusieurs immeubles contigus, les percements de\n    vitrine devront respecter les limites séparatives.\n11.1.4 La pose de capteurs solaires doit être étudiée, notamment au regard de la trame des ouvertures de\nla façade, et afin de favoriser une intégration dans le plan de toiture ou en façade.\n11.2    Annexes, locaux techniques\n    126","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n11.2.1 Extensions, garages, boxes\nLes bâtiments annexes doivent être conçus en harmonie de volumes et de matériaux avec les constructions\nexistantes. Les annexes réalisées avec des moyens de fortune tels que des matériaux de démolition,\nrécupération de matériaux destinés à être recouverts, utilisés à nu, sont interdits.\n11.2.2 Locaux techniques\n    -    Les coffrets, compteurs, boîtes aux lettres devront être intégrés dans les murs de construction.\n    Les locaux techniques y compris ceux destinés au stockage des conteneurs adaptés aux ordures\n    ménagères et au tri sélectif, devront être intégrés au bâti principal.\n    -    En cas d’impossibilité, ils seront réalisés dans une annexe qui prendra en compte le bâti annexe,\n    les constructions voisines, la structure végétale existante et les plantations à créer.\n11.3    Clôtures\n11.3.1 Clôtures sur les voies publiques ou privées\n    -    Les clôtures sur les voies publiques ou privée doivent être en harmonie avec la construction\n    principale. Elles doivent être d’un modèle simple et sans décoration inutile et conçues en\n    fonction de celles déjà existantes dans la voie et de l’architecture du projet.\n    -    Elles ne peuvent pas comporter de parties pleines d’une hauteur supérieure à 1,20 m à partir du\n    trottoir. La hauteur totale de la clôture ne peut être supérieure à 2 m.\n    -    Pour les parcelles dont la largeur est inférieure ou égale à 6m et dans le cas où il est n écessaire\n    d’installer un système enroulant : la hauteur globale prenant en compte les piliers de portails\n    d’accès véhicules et les linteaux, est portee à 2,60m maximum.\n    -    En cas de mur de clôture existant, si celui-ci présente un caractère esthétique intéressant, il devra\n    être conservé et restauré si sa conservation est compatible avec le projet.\n    -    Lorsque l’alignement n’est pas occupé par la façade même d’un bâtiment, une clôture doit\n    marquer la limite des domaines privés et publics sans ambiguïté.\n    -    Les haies végétales le long du domaine public ne dispensent pas de clôture : elles ne sont qu’un\n    doublage dans le cas de grilles sur muret bas par exemple.\n    -    Dans tous les cas doit être soit prévu un dispositif pour la retenue des terres.\n    -    Toutefois, pour des raisons de sécurité, la hauteur totale des clôtures pourra être portée à 2,60 m\n    pour les installations nécessaires aux services publics ou d’intérêt collectif.\n11.3.2 Clôtures sur les limites séparatives\n    -    La hauteur totale de la clôture ne peut être supérieure à 2,60 m. Elles devront être aménagées de\n    manière à laisser passer la faune.\n    -    Les clôtures végétales sans doublage par une grille sont autorisées sur limite séparative à\n    condition que soit prévu un dispositif pour la retenue des terres.\n11.3.3 Dans le cas de terrain en pente, les hauteurs sont prises au milieu de chaque élément de clôture.\nLorsqu’il y a nécessité de créer un mur de soutènement, celui-ci peut constituer la partie pleine de la\nclôture jusqu’à concurrence de 1,20 m. Le reste doit être traité en talus.\n11.4    Les installations nécessaires aux services publics et/ou d’intérêt collectif ne sont pas assujettis\naux limitations de hauteur des clôtures de l’article 11.3.\nARTICLE UPm 4.12 - Stationnement\nLe stationnement des véhicules, automobiles, motocycles et cycles correspondant aux besoins des\nconstructions et installations doit être assuré en dehors des voies publiques. A cet effet, il devra être\nréalisé sur le terrain propre à l’opération des aires de stationnement dont les normes minimales sont\ndéfinies ci-après.\n    127","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    12.1    Caractéristiques applicables au parc de stationnement\n    Les rampes d’accès aux aires de stationnement en sous-sol ne doivent pas entraîner de modification dans\n    le niveau du trottoir. Leur pente dans les cinq premiers mètres à partir de l’alignement ne doit pas excéder\n    5 %, sauf impossibilité technique.\n    A titre indicatif, la surface moyenne par emplacement (dégagement compris) est de l’ordre de 25m² pour\n    les automobiles, 4m² pour les motos et 1m² pour les cycles.\n    Les places doubles sont autorisées uniquement pour les parcs de stationnement liés à un immeuble\n    d’habitation pour lequel le ratio de place directement accessible est au moins d’une place par logement.\n    Largeurs minimales des rampes d’accès :\n    -   Sens unique : 3,50 m\n    -   Double sens desservant jusqu’à 70 voitures : 3,50 m\n    -   Double sens desservant plus de 70 voitures : 6,00 m\n    12.2    Nombre d’emplacements\n    Pour le calcul des places de stationnement nécessaires à une opération, le nombre obtenu par l’application\n    des normes définies ci-dessous sera dans tous les cas arrondis au nombre entier immédiatement supérieur.\n    12.2.1 Constructions à usage d’habitat\nStationnement    Automobiles    Motocycles    Cycles\n    Local clos ou couvert dont la superficie\nLogement - cas général    . 1 place par tranche de 60 m² de surface de 1 place mini. pour 10 correspondra au minimum à 0,75\n    plancher    logements    m²/logement    jusqu’à    2    pièces\n    . Avec 1 place mini. par logement    principales et 1,5 m²/logement de 3\n    pièces principales et plus ou au\n    minimum une superficie de 3 m².\n    Cette règle s’applique à partir de trois\n    logements collectifs\n    Local clos ou couvert dont la superficie\nConstructions visées à    . 1 place par logement (article 46 de la loi 1 place mini pour 10 correspondra au minimum à 0,75\nl’article L151-35 du Code    du 29 juillet 1998).    logements.    m²/logement    jusqu’à    2    pièces\nde l’Urbanisme    principales et 1,5 m²/logement de 3\n    pièces principales et plus ou au\n    minimum une superficie de 3 m².\n    Cette règle s’applique à partir de trois\n    logements collectifs\nLogements    sociaux   : Il n’est pas fait obligation de réaliser des aires Non réglementé.    Non réglementé.\ntravaux de transformation de stationnement.\nou d’amélioration*\nRésidence pour étudiants   1 place pour 4 unité d’habitation    Non réglementé    Non réglementé\n    (*)    Bâtiments affectés à du logement locatif, financés avec un prêt aidé par l’Etat, y compris dans le cas où ces travaux\n    s’accompagnent de création de surface de plancher, dans la limite d’un plafond fixé par décret au Conseil d’Etat.\n    12.2.2 Constructions à usage d’activités\nStationnement    Automobiles    Motocycles    Cycles\nSurface commerciale :\n. surface de plancher ≤ 300 m²    . 25 % de la surface de plancher    Non réglementé.    Non réglementé.\n    128","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n. 300 m² ≤ surface de plancher ≤    . 35 % de la surface de plancher    Non réglementé.    Non réglementé.\n2 000 m²\n. surface de plancher ≥ 2 000 m²    . 70 % de la surface de plancher    15 % de la surface de Non réglementé.\n    plancher\nMarché    . 70 % de la surface de plancher    Non réglementé    Non réglementé.\nBureaux    . Norme minimum : 35 % de la surface de plancher. 1 % de la surface de 1,5 % de la surface de\n    Toutefois, il ne pourra être construit plus d’1 place plancher    plancher\n    pour 60 m² de surface de plancher à moins de 500\n    mètres d’un point de desserte de transport en\n    commun structurant.\n    Il ne pourra être construit plus d’1 place pour 50 m²\n    de surface de plancher à plus de 500 mètres d’un\n    point de desserte de transport en commun\n    structurant.\nHôtels    . 40 % de la surface de plancher\n    . 1 place de car pour 50 chambres    1 % de la surface de plancher\nAutres    . 20 % de la surface de plancher avec 1 place\n    minimale par activité    1 % de la surface de plancher\n    12.2.3 Constructions à usage d’équipements\nStationnement    Automobiles    Motocycles    Cycles\nHôpitaux - cliniques    . 30 % de la surface de plancher nouvelle    1 % de la surface de plancher\nSalles de spectacles    . 1 place / 10 personnes    1 place / 100 personnes\nEnseignement primaire    . 1 place / classe    Non réglementé.\nEnseignement secondaire    . 1 place / classe    Non réglementé\nEnseignement supérieur    . 1 place / 7 élèves    7 places / 100 m² de surface de plancher\nRésidence personnes âgées    . 1 place pour 10 unités d’habitation.    Non réglementé.\nFoyer de travailleurs    . 1 place pour 4 lits/ unités d’habitation.    Non réglementé.\n    12.3    Cas des changements de destination et des extensions\n    12.3.1 Il est obligatoire de maintenir les places de stationnement automobile existantes, dans la limite\n    des nouveaux besoins, avec possibilité de les déplacer.\n    12.3.2 En cas d’extension sans création de logements, les normes énoncées aux articles 12.1 à 12.2 ne\n    sont applicables que pour la surface de plancher créée et lorsqu’elle induit la création de plus de 2 places\n    de stationnement.\n    12.3.3 En cas de changement de destination, les normes énoncées aux articles 12.1 à 12.2 ne sont\n    applicables que lorsqu’il induit la création de plus de 2 places de stationnement.\n    12.4    Prise en compte des transports en commun\n    12.4.1 Lorsque l’accès des logements mentionnés au 1er et 3ème alinéa de l’article L151-34 du Code\n    de l’Urbanisme, est situé à moins de 500 m par les voies praticables d’une gare ou d’une station de\n    transport public guidé ou de transport collectif en site propre et que la qualité de la desserte le permet, le\n    129","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nnombre d’aires de stationnement exigible par logement ne peut dépasser 0.5, s’il s’agit de logements\nlocatifs financés avec un prêt aidé par l’Etat, d’établissements assurant l’hébergement de personnes âgées\nou de résidences universitaires, et 1 pour les autres catégories de logements.\n12.5    Modalités d’application\n12.5.1 80 % minimum des emplacements de stationnement doivent être réalisées dans des constructions\nen sous-sol ou, à défaut, en cas de réhabilitation de bâtiments existants, dans le volume bâti, sauf dans le\ncas des équipements publics pour lesquels le stationnement peut être réalisé dans le volume des bâtiments\nou exceptionnellement en surface.\n12.5.2 Les places de stationnement aménagées en surface, devront être stabilisées, et\nperméables (pavage non joint, ever-green, etc.…) afin de limiter le ruissellement.\n12.5.3 Les places destinées au stationnement des cycles doivent être aménagées dans un local clos et\ncouvert situé dans le volume et de préférence à rez-de-chaussée, accessible en toute sécurité. Ce local\npeut en outre, accueillir les voitures pour enfants.\n12.5.4 Par ailleurs, il n’est pas fixé de normes pour les installations nécessaires aux services publics ou\nd’intérêt collectif non cités préalablement, les places de stationnement seront en rapport avec le\nfonctionnement et les besoins desdits équipements.\n12.5.5 En cas d’impossibilité architecturale ou technique d’aménager sur le terrain de l’opération, le\nnombre d’emplacements nécessaires au stationnement, le constructeur est autorisé à aménager sur un\nautre terrain, dans un rayon de 300 m par les voies praticables, les surfaces de stationnement qui lui font\ndéfaut à condition qu’il apporte la preuve qu’il réalise ou fait réaliser lesdites places.\n12.6    Dispositions diverses\nPour les opérations comptant plus de 15 logements ainsi que les bureaux et les constructions de service\npublic ou d’intérêt collectif, des bornes électriques seront disposées afin d’inciter les utilisateurs à\ndéserter les énergies fossiles. Les dispositions du décret n°2011-873 du 25 juillet 2011 relatif à\nl'application des articles R. 111-14-2 à R. 111-14-5 du code de la construction et de l'habitation) et\nl’arrêté du 20 février 2012 devront être respectées.\nARTICLE UPm 4.13 - Espaces libres et plantations\n13.1    Les espaces privés non constructibles en superstructure et les espaces privés non constructibles\nen superstructure à partir du R + 1 doivent être traités en jardin sur au moins 70 % de leur surface.\n13.2    Les dalles de couverture des parcs de stationnement souterrains recevront une épaisseur de terre\nde 0,50 m au minimum (couche drainant non comprise) sur une surface suffisante pour répondre à\nl’exigence ci-dessus. (Cette imposition ne concerne pas le parc de stationnement existant dont la surface\nest destinée à accueillir les étals extérieurs du marché couvert).\n13.3    Toute unité foncière ne rentrant pas dans les alinéas ci-dessus devra être plantée sur au moins\n20 % de sa superficie.\n    130","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n13.4    S’ils existent, les espaces verts doivent être paysagers et plantés à raison d’un arbre par tranche\nde 100 m².\nCette disposition s’applique à partir de 100m². Afin de favoriser la biodiversité, la plantation\nd’essences différentes est à privilégier.\n13.5    Pour les constructions à usage uniquement d’activité artisanale ou industrielle, les surfaces non\nbâties et non utilisées pour le stationnement ou les manœuvres des véhicules doivent être plantées.\n13.6    Lorsque les constructions sont implantées en retrait de l’alignement, la marge de recul dès\nqu’elle atteint 0,60 m doit être plantée d’arbustes formant des haies continues et homogènes sur une\nhauteur compatible avec l’allège des baies du premier niveau de la construction.\n13.7    Dans la mesure du possible, les sujets existants doivent être préservés ou remplacés par des\nsujets équivalents.\n   SECTION III - Possibilités maximales d’occupation du sol\nARTICLE UPm 4.14 - Coefficient d’occupation du sol (C.O.S.)\nLes possibilités maximales d’occupation du sol résultent de l’application des règles précédentes et des\nindications du document graphique.\n    SECTION IV – Autres dispositions\nARTICLE UPm 4.15 - Performances énergétiques et environnementales\nLes opérations de plus de 1 000 m² de surface de plancher à destination de bureaux ou d’habitation\ndevront respecter les labels de performances énergétiques en vigueur.\nARTICLE UPm 4.16 – Infrastructures et réseaux de communications\nélectroniques.\nLes constructeurs sont invités à se raccorder au réseau numérique dès que cela est possible.\n    131","P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    132","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    ZONE UPM 5\nCARACTERE ET VOCATION DE LA ZONE\nLe secteur de plan masse Pasteur couvre le périmètre de l'ancienne ZAC Pasteur : l’îlot compris entre les rues\nPasteur, Marcel Monge, Frédéric Clavel et les quais de Seine.\n SECTION I - Nature de l’occupation et de l’utilisation du sol\nARTICLE UPm 5.1 - Occupations et utilisations du sol\nSont interdites les occupations et utilisations du sol suivantes :\n    -    Les installations classées autres que celles autorisées à l'article 2.\n    -    Les dépôts de ferrailles, de matériaux, de combustibles solides ou liquides (hors station service),\n    ainsi que les entreprises de casse de voiture, et de transformation de matériaux de récupération.\n    -    L’ouverture et l’exploitation de carrières.\n    -    Le stationnement des caravanes ou d'habitation légère de loisirs.\n    -    Les terrains de camping et de caravanage.\n    -    Les affouillements, exhaussements des sols autres que ceux autorisés à l'article 2.\nARTICLE UPm 5.2 - Occupations et utilisations du sol soumises à des\nconditions particulières\nLes occupations et utilisations du sol suivantes sont autorisées si elles respectent les conditions ci-\naprès :\n    -    Les installations classées, à condition :\n     que soient mises en œuvre toutes les dispositions utiles pour les rendre compatibles avec\n    les milieux environnants,\n     d’éviter toute pollution, nuisance ou dangers non maîtrisables.\n    -    Les constructions à usage d’activités, bureaux, services et commerces à condition qu’elles\n    n’entraînent, pour le voisinage, aucune nuisance.\n    -    Les affouillements et exhaussements, s’ils sont nécessaires aux travaux d’aménagement paysager\n    des espaces libres et de construction.\n    -    La reconstruction et/ou l'extension du groupe scolaire, sous réserve du respect des articles UPm\n    5.1 à UPm 5.15.\n    -    Dans les secteurs identifiés en rouge sur le plan de zonage, les surfaces affectées à la destination\n    « bureau » ne peuvent être transformées en une autre destination que l’une de celles énumérées\n    ci-dessous :\n       Dans la destination « habitation », les sous-destinations hébergement et logement dans\n    la mesure où celles-ci sont minoritaires dans la surface de plancher développée par le\n    projet et sont intrinsèquement liées à l’activité principale du bâtiment.\n       Dans la destination « commerces et activités de service », les sous-destinations\n    133","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    suivantes : artisanat et commerce de détail, restauration, activités de service où\n    s’effectue l’acceuil d’une clientèle.\n       Dans la destination « équipements d’intérêt collectif et services publics », les sous-\n    destinations suivantes : locaux et bureaux accueillant du public des administrations\n    publiques et assimilés, établissement d’enseignement, de santé et d’action sociale.\n       Dans la destination « autres activités des secteurs secondaire ou tertiaire », les sous-\n    destinations suivantes : industrie, bureau, centre de congrès et d’exposition.\nLes surfaces existantes inférieures à 100m² ne sont pas concernées par la présente disposition.\n    -   Les projets de construction situés en zones inondables doivent être conformes au règlement\n    du PPRI de la Seine dans les Hauts-de-Seine.\n    SECTION II - Conditions de l’occupation du sol\nARTICLE UPm 5.3 - Accès et voirie\n3.1    Toute nouvelle unité foncière doit disposer d’un accès pour les automobiles par une voie\npublique ou privée, d’une largeur de 3,50 m minimum. Cette disposition ne s’applique pas aux unités\nfoncières existantes à la date d’approbation du PLU\n3.2    Toute nouvelle voie se terminant en impasse doit être aménagée à son extrémité, de telle manière\nque tous les véhicules amenés à l’emprunter puissent aisément faire demi-tour.\n3.3    Ces accès ne doivent pas présenter un risque pour la sécurité des usagers des voies publiques ou\npour celle des personnes utilisant ces accès. Cette sécurité doit être appréciée compte tenu notamment, de\nla disposition des accès, de leur configuration ainsi que de la nature et de l'intensité du trafic.\nARTICLE UPm 5.4 - Desserte par les réseaux\n4.1    Alimentation en eau potable\nToute construction ou installation nouvelle qui nécessite une alimentation en eau doit être raccordée au\nréseau public de distribution d'eau potable.\n4.2    Assainissement\nToute construction devra respecter les documents suivants :\n     Le règlement du service départemental d’assainissement des Hauts-de-Seine ;\n     Le règlement du service d’assainissement de l’EPT Paris Ouest La Défense.\nCes deux documents sont disponibles en annexe du présent Plan Local d’urbanisme.\n4.3    Autres réseaux\nA l’occasion de toute construction neuve, extension ou surélévation, soumise à permis de construire, les\nréseaux, raccordements (électricité, câble, téléphone…), les installations nouvelles et branchements seront\nobligatoirement réalisés en souterrain ou s'intégreront au bâti.\n    134","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n4.4    Déchets\nPour les nouvelles constructions de plus de deux logements des locaux poubelles, correctement\ndimensionnés pour accueillir l’ensemble des bacs de la collecte sélective nécessaires aux usagers, doivent\nêtre aménagés de préférence à rez-de-chaussée des constructions, avec accès direct sur le domaine public.\nDans le cas où les locaux ne permettent pas l’accès direct sur rue, il est vivement recommandé de prévoir\nun lieu de stockage sur le domaine privé, facilitant l’accès aux bacs les jours de collecte.\nUn cahier des charges est joint à l’annexe 6 de la pièce 4.2 « Annexes du rêglement ».\nARTICLE UPm 5.5 - Caractéristiques des terrains\nNon réglementé.\nARTICLE UPm 5.6 - Implantation des constructions par rapport aux\nvoies et emprises publiques ou privées\nLes constructions en superstructure doivent s’implanter à l’intérieur des périmètres d’implantation définis\nau plan de masse.\nLes équipements collectifs ou d'intérêt général devront être implantés soit à l'alignement, soit en retrait de\n4m minimum.\nARTICLE UPm 5.7 - Implantation des constructions par rapport aux\nlimites séparatives\n    -   Les constructions en superstructure doivent être implantées à l’intérieur des périmètres de\n    constructibilité définis au plan de masse.\n    -   Les équipements collectifs ou d’intérêt général peuvent s’implanter soit en limites séparatives,\n    soit en retrait de 4 m minimum de ces limites.\nARTICLE UPm 5.8 - Implantation des constructions les unes par\nrapport aux autres sur la même unité foncière\n    -   Les constructions en superstructure doivent être implantées à l’intérieur des périmètres de\n    constructibilité définis au plan de masse.\n    -   Les équipements collectifs ou d'intérêt général peuvent s'implanter soit en continuité, soit à une\n    distance de 4m minimum.\n    135","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UPm 5.9 - Emprise au sol\n    -    Les constructions en superstructure doivent s’implanter dans l’emprise définie au plan de masse.\n    -    La reconstruction de l'école devra se faire conformément à l'emprise existante. Une extension\n    pourra toutefois être réalisée dans la limite de 20% de l'existant.\nARTICLE UPm 5.10 - Hauteur maximale des constructions\n    -    Les constructions doivent respecter les hauteurs maximales indiquées en cote N.G.F. sur le plan\n    masse ainsi que pour les édicules en toitures à condition que l'article 11.1.2 soit respecté.\n    -    La reconstruction et/ou extension de l'école devra se faire dans la limite des hauteurs des\n    bâtiments existants.\nARTICLE UPm 5.11 - Aspect extérieur - clôtures\nLe projet peut être refusé ou n’être accepté que sous réserve de l’observation de prescriptions spéciales si\nles constructions, par leur situation, leur architecture, leurs dimensions ou l’aspect extérieur des bâtiments\nou ouvrages à édifier ou à modifier, sont de nature à porter atteinte au caractère ou à l’intérêt des lieux\navoisinants, aux sites, aux paysages naturels ou urbains ainsi qu’à la conservation des perspectives\nmonumentales.\nToute construction, agrandissement, restauration ou aménagement d’immeuble devra prendre en compte\nle caractère du site de façon à s’harmoniser avec son environnement architectural et paysager (toitures,\nmatériaux…).\n11.1    Aspects extérieurs\n11.1.1 Aspect des toitures\nLes toitures terrasses non accessibles, devront être végétalisées chaque fois que cela est possible. Les\ncouvertures d’aspect précaires sont interdites et en règle générale les couvertures doivent faire l’objet\nd’un traitement soigné.\n11.1.2 Volumes\n    -    Afin d’éviter les gaines en toitures, les dispositifs de type VMC inversée sont à privilégier. Les\n    ouvrages et locaux techniques tels que machineries d’ascenseurs, de réfrigération, sortie de\n    secours, gaines de ventilation … doivent faire partie de la composition volumétrique d’ensemble\n    et ne pas être laissés apparents notamment dans le cas de toiture terrasse : usage de toiture\n    partielle, de dalle, ou de coffrage s’intégrant dans l’ensemble du bâti par exemple.\n    -    Les châssis oscillo-basculants devront être encastrés dans le plan de la toiture.\n11.1.3 Façades - Pignons\n    -    Les différents murs d’un bâtiment ou d’un ensemble de bâtiments doivent être traités avec le\n    même soin et en harmonie entre elles.\n    -    L’utilisation de matériaux de qualité pour les façades est recommandée.\n    -    L’emploi à nu de matériaux destinés à être recouverts, est interdit.\n    Les couleurs de matériaux de parement et des peintures extérieures devront s’harmoniser entre\n    elles.\n    136","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    -    Les antennes collectives et paraboliques sont interdites au même titre que les climatisations en\n    façade sur rue et seront implantées sur les toitures ou sur les façades du bâtiment, non visibles de\n    la rue.\n11.1.4 La pose de capteurs solaires doit être étudiée, notamment au regard de la trame des ouvertures de\nla façade, et afin de favoriser une intégration dans le plan de toiture ou en façade.\n11.2    Clôtures\n11.2.1 Clôtures sur les voies publiques ou privées : cas général\n    -    Les clôtures sur les voies publiques ou privées doivent être en harmonie avec la construction\n    principale.\n    -    Elles ne peuvent pas comporter de parties pleines d’une hauteur supérieure à 1,20 m à partir du\n    trottoir. La hauteur totale de la clôture ne peut être supérieure à 2 m. Les piliers des portails\n    d’entrée et de clôture ne peuvent pas dépasser 2,20 m de hauteur. Les différents portails d’une\n    même propriété seront de même style architectural.\n    -    Pour les parcelles dont la largeur est inférieure ou égale à 6m et dans le cas où il est necessaire\n    d’installer un système enroulant : la hauteur globale prenant en compte les piliers de portails\n    d’accès véhicules et les linteaux, est portee à 2,60m maximum.\n    -    Dans le cas de rue en pente, les hauteurs sont prises au milieu de chaque élément de clôture.\n    -    Sont préconisés les dispositifs de clôtures suivants : un muret surmonté d’une grille avec piliers\n    maçonnés, doublé d’un écran végétal.\n    -    Toutefois, pour des raisons de sécurité, la hauteur totale des clôtures pourra être portée à 2,60 m\n    pour les équipements collectifs ou d’intérêt général.\n    -    Les clôtures anciennes ayant un caractère architectural affirmé, devront être conservées et\n    restaurées avec les mêmes matériaux.\n11.2.2 Clôtures sur les limites séparatives\nLa hauteur totale de la clôture ne peut être supérieure à 2,60 m.\n11.2.3 Dans le cas de terrain en pente, les hauteurs sont prises au milieu de chaque élément de clôture.\nLorsqu’il y a nécessité de créer un mur de soutènement, celui-ci peut constituer la partie pleine de la\nclôture jusqu’à concurrence de 1,20 m. Le reste doit être traité en talus.\n11.3    Les équipements collectifs et/ou d’intérêt général ne sont pas assujettis aux limitations de hauteur\ndes clôtures de l’article 11.2.\nARTICLE UPm 5.12 - Stationnement\nLe stationnement des véhicules, automobiles, motocycles et cycles correspondant aux besoins des\nconstructions et installations doit être assuré en dehors des voies publiques. A cet effet, il devra être\nréalisé sur le terrain propre à l’opération des aires de stationnement dont les normes minimales sont\ndéfinies ci-après.\n12.1    Caractéristiques\nLes rampes d’accès aux aires de stationnement en sous-sol ne doivent pas entraîner de modification dans\nle niveau du trottoir. Leur pente dans les cinq premiers mètres à partir de l’alignement ne doit pas excéder\n5 %, sauf impossibilité technique.\n    137","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nA titre indicatif, la surface moyenne par emplacement (dégagement compris) est de l’ordre de 25m² pour\nles automobiles, 4m² pour les motos et 1m² pour les cycles.\nLes places doubles sont autorisées uniquement pour les parcs de stationnement liés à un immeuble\nd’habitation pour lequel le ratio de places directement accessibles est au moins d’une place par logement.\nLargeurs minimales des rampes d’accès :\n    -   Sens unique : 3,50 m\n    -   Double sens desservant jusqu’à 70 voitures : 3,50 m\n    -   Double sens desservant plus de 70 voitures : 6,00 m\n12.2    Nombre d’emplacements\nPour le calcul des places de stationnement nécessaires à une opération, le nombre obtenu par l’application\ndes normes minimales définies ci-dessous sera dans tous les cas arrondis au nombre entier immédiatement\nsupérieur.\n  Stationnement    Automobiles    Motocycles    Cycles\n    . Norme minimum : 35 % de la\n    surface de plancher. Toutefois,\n    il ne pourra être construit plus\n    d’1 place pour 60 m² de surface\n    de plancher à moins de 500\n    mètres d’un point de desserte de\n    transport    en    commun\n  Bureaux    1 % de la surface de plancher\n    structurant.\n    Il ne pourra être construit plus\n    d’1 place pour 50 m² de surface\n    de plancher à plus de 500\n    mètres d’un point de desserte de\n    transport    en    commun\n    structurant.\n12.3    Pour les équipements collectifs ou d'intérêt général, il n'est pas fixé de norme. Les places de\nstationnement seront en rapport avec le fonctionnement et les besoins desdits équipements.\nARTICLE UPm 5.13 - Espaces libres et plantations\n13.1    Espaces verts\n13.1.1   Les superficies minimales suivantes d'espace vert doivent être aménagées comme suit :\nPour les terrains  400 m²    - 50 % mini des espaces libres *\nCoefficient total d’espace vert\nPour les terrains > 400 m²\nCoefficient total d’espace vert    - 30 % de la surface de l’unité foncière\n* espaces libres : espaces non construits, non occupés par de la voirie, des circulations piétonnes ou du\nstationnement obligatoire.\nLes toitures végétalisées compteront dans le calcul de la superficie des espaces verts à hauteur de 40 %\nmaximum de cette superficie.\n13.1.2 Exceptions faites :\n    138","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nPour les équipements collectifs ou d'intérêt général.\nDans ces cas, 50 % au moins des espaces libres*, s’ils existent, devront être traités en espace vert.\n13.1.3 Les marges de recul sur rue définies à l’article 6.1, doivent être traitées en espace vert excepté\npour l’emprise des rampes de parcs souterrains de stationnement et des porches.\n13.2    Plantations\n13.2.1 S’ils existent, les espaces verts doivent être paysagers et plantés à raison d’un arbre par tranche\nde 100 m².\nCette disposition s’applique à partir de 100m². Afin de favoriser la biodiversité, la plantation\nd’essences différentes est à privilégier.\n13.2.2 Les aires de stationnement doivent être plantées à raison d'un arbre pour 4 places.\n13.2.3 Les dalles de parc de stationnement et des constructions à rez-de-chaussée devront faire l’objet\nd’un traitement végétalisé, et recevoir pour cela 50 cm au moins de terre végétale.\n13.3    Dans le cas des équipements collectifs ou d’intérêt général nécessitant par nature d’importants\nespaces non bâti, l’article 13.2.1 ne s’exerce pas.\n   SECTION III - Possibilités maximales d’occupation du sol\nARTICLE UPm 5.14 - Coefficient d’occupation du sol (C.O.S.)\nLes possibilités maximales d’occupation du sol résultent de l’application des règles précédentes et des\nindications du document graphique.\n    SECTION IV – Autres dispositions\nARTICLE UPm 5.15 - Performances énergétiques et environnementales\nLes opérations de plus de 1 000 m² de surface de plancher à destination de bureaux ou d’habitation\ndevront respecter les labels de performances énergétiques en vigueur.\nARTICLE UPm 5.16 – Infrastructures et réseaux de communications\nélectroniques.\nLes constructeurs sont invités à se raccorder au réseau numerique dès que cela est possible.\n    139","P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    140","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    ZONE UPM 6\nCARACTERE ET VOCATION DE LA ZONE\nLe secteur Rivière-Seine est constitué par un ensemble de terrains situé au cœur de l’îlot compris entre les rues de\nVerdun, du Commandant Rivière, Salomon de Rothschild et Benoît Malon.\n SECTION I - Nature de l’occupation et de l’utilisation du sol\nARTICLE UPm 6.1 - Occupations et utilisations du sol\nSont interdites les occupations et utilisations du sol suivantes :\n    -   Les installations classées autres que celles autorisées à l'article 2.\n    -   Les dépôts de ferrailles, de matériaux, de combustibles solides ou liquides (hors station service),\n    ainsi que les entreprises de casse de voiture, et de transformation de matériaux de récupération.\n    -   L’ouverture et l’exploitation de carrières.\n    -   Le stationnement des caravanes ou d'habitation légère de loisirs.\n    -   Les terrains de camping et de caravanage.\n    -   Les affouillements, exhaussements des sols autres que ceux autorisés à l'article 2.\nARTICLE UPm 6.2 - Occupations et utilisations du sol soumises à des\nconditions particulières\n2.1    Les constructions devront respecter les destinations générales définies sur le plan de masse.\n2.2    Sont autorisées toutes les occupations et utilisations du sol qui ne sont pas interdites à\nl’article 1, sous réserve des conditions de l’article 2.3.\n2.3    Les occupations et utilisations du sol suivantes sont autorisées si elles respectent les\n    conditions ci-après :\n    -   Les installations classées, à condition :\n        qu’elles soient liées aux besoins des habitations, bureaux, équipements de la zone,\n        que soient mises en œuvre toutes les dispositions utiles pour les rendre compatibles avec\n    les milieux environnants,\n        d’éviter toute pollution, nuisance ou dangers non maîtrisables.\n    -   Les affouillements et exhaussements, s’ils sont nécessaires aux travaux d’aménagement paysager\n    des espaces libres et de construction.\n    -   Dans les secteurs identifiés en rouge sur le plan de zonage, les surfaces affectées à la destination\n    « bureau » ne peuvent être transformées en une autre destination que l’une de celles énumérées\n    ci-dessous :\n        Dans la destination « habitation », les sous-destinations hébergement et logement dans\n    la mesure où celles-ci sont minoritaires dans la surface de plancher développée par le\n    141","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    projet et sont intrinsèquement liées à l’activité principale du bâtiment.\n       Dans la destination « commerces et activités de service », les sous-destinations\n    suivantes : artisanat et commerce de détail, restauration, activités de service où\n    s’effectue l’acceuil d’une clientèle.\n       Dans la destination « équipements d’intérêt collectif et services publics », les sous-\n    destinations suivantes : locaux et bureaux accueillant du public des administrations\n    publiques et assimilés, établissement d’enseignement, de santé et d’action sociale.\n       Dans la destination « autres activités des secteurs secondaire ou tertiaire », les sous-\n    destinations suivantes : industrie, bureau, centre de congrès et d’exposition.\nLes surfaces existantes inférieures à 100m² ne sont pas concernées par la présente disposition.\n    -   Les projets de construction situés en zones inondables doivent être conformes au règlement\n    du PPRI de la Seine dans les Hauts-de-Seine.\n    SECTION II - Conditions de l’occupation du sol\nARTICLE UPm 6.3 - Accès et voirie\n3.1    Toute nouvelle unité foncière doit disposer d’un accès pour les automobiles par une voie\npublique ou privée, d’une largeur de 3,50 m minimum. Cette disposition ne s’applique pas aux unités\nfoncières existantes à la date d’approbation du PLU\n3.2    Toute nouvelle voie se terminant en impasse doit être aménagée à son extrémité, de telle manière\nque tous les véhicules amenés à l’emprunter puissent aisément faire demi-tour.\n3.3    Ces accès ne doivent pas présenter un risque pour la sécurité des usagers des voies publiques ou\npour celle des personnes utilisant ces accès. Cette sécurité doit être appréciée compte tenu notamment, de\nla disposition des accès, de leur configuration ainsi que de la nature et de l'intensité du trafic.\nARTICLE UPm 6.4 - Desserte par les réseaux\n4.1    Alimentation en eau potable\nToute construction ou installation nouvelle qui nécessite une alimentation en eau doit être raccordée au\nréseau public de distribution d'eau potable.\n4.2    Assainissement\nToute construction devra respecter les documents suivants :\n     Le règlement du service départemental d’assainissement des Hauts-de-Seine ;\n     Le règlement du service d’assainissement de l’EPT Paris Ouest La Défense.\nCes deux documents sont disponibles en annexe du présent Plan Local d’urbanisme.\n    142","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n4.3    Autres réseaux\nA l’occasion de toute construction neuve, extension ou surélévation, soumise à permis de construire, les\nréseaux, raccordements (électricité, câble, téléphone…), les installations nouvelles et branchements seront\nobligatoirement réalisés en souterrain ou s'intégreront au bâti.\n4.4    Déchets\nPour les nouvelles constructions de plus de deux logements des locaux poubelles, correctement\ndimensionnés pour accueillir l’ensemble des bacs de la collecte sélective nécessaires aux habitants,\ndoivent être aménagés de préférence à rez-de-chaussée des constructions, avec accès direct sur le domaine\npublic. Dans le cas où les locaux ne permettent pas l’accès direct sur rue, il est vivement recommandé de\nprévoir un lieu de stockage sur le domaine privé, facilitant l’accès aux bacs les jours de collecte.\nConcernant les immeubles de bureaux, des locaux adaptés à la nature de l’activité exercée seront\naménagés. Leur localisation devra permettre leur évacuation dans de bonnes conditions. La présence de\ndispositifs visant à réduire les volumes de déchets produits (de type compacteur) est recommandée.\nUn cahier des charges est joint à l’annexe 6 de la pièce 4.2 « Annexes du règlement ».\nARTICLE UPm 6.5 - Caractéristiques des terrains\nNon réglementé\nARTICLE UPm 6.6 - Implantation des constructions par rapport aux\nvoies et emprises publiques ou privées\n6.1    Les constructions doivent s’implanter à l’intérieur des polygones d’implantation définis au\ndocument graphique :\n    -   Sur la rue de Verdun, les constructions en superstructure et infrastructure devront s’implanter en\n    retrait de 8 mètres minimum.\n    -   Sur la rue Benoît Malon les constructions en superstructure devront s’implanter en retrait de 4\n    mètres minimum.\n    -   Sur la rue Salomon de Rothschild, les constructions devront s’implanter à l’alignement sur au\n    minimum 50% de la façade sur rue.\n    -   Sur la promenade plantée, les constructions en superstructure et en infrastructure devront\n    s’implanter en retrait de 2 mètres minimum sur l’îlot sud.\n    143","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n6.2    Saillies\nLes saillies sur voie publique ou privée sont autorisées, sous réserve :\n    -    qu’elles soient placées à une hauteur de 4,30 m minimum,\n    -    que leur profondeur n’excède pas 0,80 m,\n    -    que l’ensemble du linéaire de saillies constitutives de surface de plancher par niveau, ne dépasse\n    pas 30% du linéaire de la façade.\nLes saillies sur recul imposé sont autorisées.\nLa mise en place d’une isolation thermique sur voie publique est autorisée sur les bâtiments existants à la\ndate d’approbation du PLU sous réserve de faire l’objet d’un traitement architectural d’ensemble de\nqualité, que la largeur du trottoir après travaux reste égale ou supérieur à 1,40 mètre, de la prise en\ncompte des réseaux existants et sous réserve de l’accord du gestionnaire de la voirie.\nNota : Les saillies localisées sur les voies départementales devront également respecter les dispositions du\nrèglement de la voirie départementale.\nARTICLE UPm 6.7 - Implantation des constructions par rapport aux\nlimites séparatives\nLes constructions devront s’implanter à l’intérieur des polygones de constructibilité définis sur le\ndocument graphique.\nSeuls des éléments ponctuels, tels les éléments décoratifs, amenées d’air frais, saillies diverses (balcons,\nauvents, etc…) peuvent être implantés en dehors des polygones définis au plan de masse.\nARTICLE UPm 6.8 - Implantation des constructions les unes par\nrapport aux autres sur la même unité foncière\nLes constructions devront s’implanter à l’intérieur des polygones de constructibilité définis sur le\ndocument graphique.\nSeuls des éléments ponctuels, tels les éléments décoratifs, amenées d’air frais, saillies diverses (balcons,\nauvents, etc…) peuvent être implantés en dehors des polygones définis au plan de masse.\nARTICLE UPm 6.9 - Emprise au sol\nL’emprise maximale des constructions en superstructure est celle définie au document graphique par les\npolygones de constructibilité en superstructure.\nSeuls les éléments décoratifs d’animation des façades, saillies sur le domaine public et marge de recul sur\nrue peuvent être implantés en dehors des polygones définis au plan de masse.\n    144","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UPm 6.10 - Hauteur maximale des constructions\nLes constructions devront respecter le nombre de niveaux ou les hauteurs définis sur le plan de masse. Le\nplafond de la zone est établi à 58,50 m NGF pour la partie « bureaux/logements/équipements » et 55 m\nNGF pour la partie « logements/équipements ». Seuls les acrotères et éléments techniques bénéficiant\nd’un traitement architectural soigné ainsi que les dispositifs contribuant à l’amélioration de la qualité\nenvironnementale du projet sont autorisés à dépasser les hauteurs définies.\nToutefois pour la partie « bureaux/logements », le nombre de niveaux maximum est de R+6 pour la\ndestination bureaux et R+7 pour la destination logements, dans une logique d’intégration architecturale à\nl’ensemble de l’ilot.\nUn dépassement des hauteurs précitées pourra être autorisé dans la limite d’1 mètre par niveau\nd’équipement public ou d’activité commerciale, artisanale ou de bureaux.\nARTICLE UPm 6.11 - Aspect extérieur - clôtures\nLe projet peut être refusé ou n’être accepté que sous réserve de l’observation de prescriptions spéciales si\nles constructions, par leur situation, leur architecture, leurs dimensions ou l’aspect extérieur des bâtiments\nou ouvrages à édifier ou à modifier, sont de nature à porter atteinte au caractère ou à l’intérêt des lieux\navoisinants, aux sites, aux paysages naturels ou urbains ainsi qu’à la conservation des perspectives\nmonumentales.\nToute construction, agrandissement, restauration ou aménagement d’immeuble devra prendre en compte\nle caractère du site de façon à s’harmoniser avec son environnement architectural et paysager (toitures,\nmatériaux…).\n11.1    Toitures\nLes toitures terrasses non accessibles, devront être végétalisées chaque fois que cela est possible. Les\ncouvertures d’aspect précaire sont interdites et en règle générale les couvertures doivent faire l’objet d’un\ntraitement soigné. Elles seront considérées comme une cinquième façade.\nAfin d’éviter les gaines en toitures, les dispositifs de type VMC inversée sont à privilégier. Les ouvrages\net locaux techniques tels que machineries d’ascenseurs, de réfrigération, sortie de secours, gaines de\nventilation,… doivent faire partie de la composition volumétrique d’ensemble et ne pas être laissés\napparents notamment dans le cas de toiture terrasse : usage de toiture partielle, de dalle, ou de coffrage\ns’intégrant dans l’ensemble du bâti par exemple.\n11.2    Façades - Pignons\n    -    Les différents murs d’un bâtiment ou d’un ensemble de bâtiments doivent être traités avec le\n    même soin et en harmonie entre eux.\n    Ceci n’exclut pas que les façades “ intérieures ” (sur cour ou jardins privatifs) aient un caractère\n    différent des façades “ extérieures ” (tournées sur les espaces publics).\n    -    Des percées visuelles vers les cœurs d’îlots seront aménagées en plusieurs points de manière à\n    offrir une large perception des jardins intérieurs depuis les espaces publics.\n    -    L’utilisation de matériaux de qualité pour les façades est recommandée. L’emploi à nu de\n    matériaux destinés à être recouverts, est interdit.\n    -    Les couleurs de matériaux de parement et des peintures extérieures devront s’harmoniser entre\n    elles.\n    -    Les conduits de fumée ou de ventilation à surélever le long d’une façade ou d’un pignon doivent\n    être traités en harmonie avec cette façade ou ce pignon.\n    145","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n11.3    Locaux techniques\nLes coffrets, compteurs, boîtes aux lettres devront être intégrés dans les murs de construction. Les locaux\ntechniques y compris ceux destinés au stockage des conteneurs adaptés aux ordures ménagères et au tri\nsélectif, devront être intégrés au bâti principal.\n11.4    Clôtures\n11.4.1 Clôtures sur les voies publiques ou privées et sur les limites séparatives\n    -    Les clôtures sur les voies publiques ou privées doivent être en harmonie avec la construction\n    principale.\n    -    Elles ne peuvent pas comporter de parties pleines d’une hauteur supérieure à 1,20 m. La hauteur\n    totale de la clôture ne peut être supérieure à 2 m, sauf ponctuellement, afin de permettre\n    l’installation d’un portail.\n    -    Pour les parcelles dont la largeur est inférieure ou égale à 6m et dans le cas où il est necessaire\n    d’installer un système enroulant : la hauteur globale prenant en compte les piliers de portails\n    d’accès véhicules et les linteaux, est portee à 2,60m maximum.\n11.4.2 Les installations nécessaires aux services publics ou d’intérêt collectif ne sont pas assujetties aux\nlimitations de hauteur et de composition des clôtures de l’article 11.3.1.\nARTICLE UPm 6.12 - Stationnement\nLe stationnement des véhicules, automobiles, motocycles et cycles correspondant aux besoins des\nconstructions et installations doit être assuré en dehors des voies publiques. A cet effet, il devra être\nréalisé sur le terrain propre à l’opération des aires de stationnement dont les normes minimales sont\ndéfinies ci-après.\n12.1    Caractéristiques applicable aux parcs de stationnement collectifs\nLes rampes d’accès aux aires de stationnement en sous-sol ne doivent pas entraîner de modification dans\nle niveau du trottoir. Leur pente dans les cinq premiers mètres à partir de l’alignement ne doit pas excéder\n5 %, sauf impossibilité technique.\nA titre indicatif, la surface moyenne par emplacement (dégagement compris) est de l’ordre de 25m² pour\nles automobiles, 4m² pour les motos et 1m² pour les cycles.\nLes places doubles sont autorisées uniquement pour les parcs de stationnement liés à un immeuble\nd’habitation pour lequel le ratio de place directement accessible est au moins d’une place par logement.\nLargeurs indicatives des rampes d’accès :\n    -   Sens unique : 3,50 m\n    -   Double sens desservant jusqu’à 70 voitures : 3,50 m\n    -   Double sens desservant plus de 70 voitures : 6,00 m\n12.2    Nombre d’emplacements\nPour le calcul des places de stationnement nécessaires à une opération, le nombre obtenu par\nl’application des normes minimales définies ci-dessous sera dans tous les cas arrondis au nombre entier\nimmédiatement supérieur.\n    146","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    12.2.1 Constructions à usage d’habitat\n Stationnement    Automo plus d’1 place\n    pour 60 m² de surface de plancher à\n    moins de 500 mètres d’un point de\n    desserte de transport en commun    2 % de la surface de\nBureaux    1,5 % de la surface de plancher\n    structurant.    plancher\n    Il ne pourra être construit plus d’1\n    place pour 50 m² de surface de\n    plancher à plus de 500 mètres d’un\n    point de desserte de transport en\n    commun structurant.\n    . 20 % de la surface de plancher avec\nAutres    1 % de la surface de plancher\n    1 place minimale par activité\n    147","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    12.2.3 Constructions à usage d’équipements\nStationnement    Automobiles    Motocycles    Cycles\nEnseignement primaire    . 1 place / classe    Non réglementé.\nEnseignement secondaire    . 1 place / classe    5 places / classe\nEnseignement supérieur    . 1 place / 7 élèves    7 places / 100 m² de surface de plancher\n    12.3    Cas des changements de destination et des extensions\n    12.3.1 Il est obligatoire de maintenir les places de stationnement automobile existantes, dans la limite\n    des nouveaux besoins, avec possibilité de les déplacer.\n    12.3.2 En cas d’extension, les normes énoncées aux articles 12.1 à 12.2 ne sont applicables que pour la\n    surface de plancher créée et lorsqu’elle induit la création de plus de 3 places de stationnement.\n    12.3.3 En cas de changement de destination, les normes énoncées aux articles 12.1 à 12.2 ne sont\n    applicables que lorsqu’il induit la création de plus de 2 places de stationnement.\n    12.4    Prise en compte des transports en commun\n    12.4.1 Lorsque l’accès des logements mentionnés au 1er et 3ème alinéa de l’article L151-34 du Code\n    de l’Urbanisme, est situé à moins de 500 m par les voies praticables d’une gare ou d’une station de\n    transport public guidé ou de transport collectif en site propre et que la qualité de la desserte le permet, le\n    nombre d’aires de stationnement exigible par logement ne peut dépasser 0.5, s’il s’agit de logements\n    locatifs financés avec un prêt aidé par l’Etat, d’établissements assurant l’hébergement de personnes âgées\n    ou de résidences universitaires, et 1 pour les autres catégories de logements.\n    12.5    Modalités d’application\n    12.5.1 80 % minimum des emplacements de stationnement automobile doivent être réalisées dans des\n    constructions en sous-sol ou, à défaut, en cas de réhabilitation de bâtiments existants, dans le volume bâti,\n    sauf dans le cas des équipements publics pour lesquels le stationnement peut être réalisé dans le volume\n    des bâtiments ou exceptionnellement en surface.\n    12.5.2 Les places de stationnement aménagées en surface, devront être stabilisées, et\n    perméables (pavage non joint, ever-green, etc.…) afin de limiter le ruissellement.\n    12.5.3 Les places destinées au stationnement des cycles doivent être aménagées dans un local clos et\n    couvert situé dans le volume à rez-de-chaussée, accessible en toute sécurité. Ce local peut en outre,\n    accueillir les voitures pour enfants.\n    12.5.4 Par ailleurs, il n’est pas fixé de normes pour les installations nécessaires aux services publics ou\n    d’intérêt collectif non cités préalablement, les places de stationnement seront en rapport avec le\n    fonctionnement et les besoins desdits équipements.\n    148","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n12.5.5 En cas d’impossibilité architecturale ou technique d’aménager sur le terrain de l’opération, le\nnombre d’emplacements nécessaires au stationnement, le constructeur est autorisé à aménager sur un\nautre terrain, dans un rayon de 300 m par les voies praticables, les surfaces de stationnement qui lui font\ndéfaut à condition qu’il apporte la preuve qu’il réalise ou fait réaliser lesdites places.\n12.6    Dispositions diverses\nPour les opérations comptant plus de 15 logements ainsi que les bureaux et les constructions de service\npublic ou d’intérêt collectif, des bornes électriques seront disposées afin d’inciter les utilisateurs à\ndéserter les énergies fossiles. Les dispositions du décret n°2011-873 du 25 juillet 2011 relatif à\nl'application des articles R. 111-14-2 à R. 111-14-5 du code de la construction et de l'habitation) et\nl’arrêté du 20 février 2012 devront être respectées.\nARTICLE UPm 6.13 - Espaces libres et plantations\n13.1    Espaces verts\n13.1 .1 Les superficies minimales suivantes d'espace vert doivent être aménagées comme suit :\n    -    Espace vert : 50 % mini des espaces libres\nLes toitures végétalisées compteront dans le calcul de la superficie des espaces verts à hauteur de 40 %\nmaximum de cette superficie.\n* espaces libres : espaces non construits, non occupés par de la voirie, des circulations piétonnes ou du\nstationnement obligatoire\n13.1.2 Les retraits imposés sur rue définis à l’article 6.1, doivent être traitées en espace vert excepté\npour l’emprise des rampes de parcs souterrains de stationnement et des porches. Des arbres d’alignement\ndevront y être plantés.\n13.2    Plantations\n13.2.1 S’ils existent, les espaces verts doivent être paysagers et plantés à raison d’un arbre par tranche\nde 100 m².\nCette disposition s’applique à partir de 100m². Afin de favoriser la biodiversité, la plantation\nd’essences différentes est à privilégier.\n13.2.2 Les dalles de parc de stationnement et des constructions à rez-de-chaussée devront faire l’objet\nd’un traitement végétalisé, et recevoir pour cela au minimum 70 cm de terre végétale à 1,50 m pour les\nparties destinées à accueillir des arbres.\n13.3    Dans le cas des installations nécessaires aux services publics ou d’intérêt collectif nécessitant par\nnature d’importants espaces non bâtis, les articles 13.1 et 13.2 ne s’appliquent pas.\n    149","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n   SECTION III - Possibilités maximales d’occupation du sol\nARTICLE UPm 6.14 - Coefficient d’occupation du sol (C.O.S.)\nLes possibilités maximales d’occupation du sol résultent de l’application des règles précédentes et des\nindications du document graphique.\n    SECTION IV – Autres dispositions\nARTICLE UPm 6.15 - Performances énergétiques et environnementales\nLes opérations de plus de 1 000 m² de surface de plancher à destination de bureaux ou d’habitation\ndevront respecter les labels de performances énergétiques en vigueur.\nARTICLE UPm 6.16 – Infrastructures et réseaux de communications\nélectroniques.\nLes constructeurs sont invités à se raccorder au réseau numérique dès que cela est possible.\n    150","P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    151"],"themes":[["def","Definiciones / léxico"],["dest","Usos y destinos"],["mix","Mixidad social / funcional"],["voies","Implantación respecto a la calle"],["lim","Implantación respecto a linderos"],["meme","Varios edificios en la misma parcela"],["emp","Ocupación del suelo (emprise au sol)"],["haut","Altura"],["asp","Aspecto exterior, fachadas, cubiertas, cercas"],["verde","Espacios libres, pleine terre, vegetación"],["ener","Energía y medio ambiente (bioclimático)"],["stat","Aparcamiento (coches y bicis)"],["res","Accesos, redes, agua, residuos"],["patr","Patrimonio protegido"],["risq","Riesgos y molestias"],["gen","Disposiciones generales y aplicación"],["er","Emplazamientos reservados y servidumbres"]]};
