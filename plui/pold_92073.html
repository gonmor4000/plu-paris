<!doctype html>

<head>

<title>Explorador PLU de Suresnes</title>
<style>

:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1d1f22; --muted:#666b73; --line:#e3e1db; --accent:#1f5f8b; --accent-ink:#ffffff;
  --hl:#fff1a8; --chip:#eef1f4; --sum:#eef6ee; --sum-line:#b9d9bb; --code:#1f5f8b; --warn:#fff6e5;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15171a; --panel:#1d2024; --ink:#e7e7e4; --muted:#9aa0a8; --line:#30343a; --accent:#6fb3e0; --accent-ink:#0d1114;
  --hl:#5b4f12; --chip:#262a30; --sum:#1c2a1e; --sum-line:#35573a; --code:#8cc6ee; --warn:#2c2516;
}}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1d2024; --ink:#e7e7e4; --muted:#9aa0a8; --line:#30343a; --accent:#6fb3e0; --accent-ink:#0d1114;
  --hl:#5b4f12; --chip:#262a30; --sum:#1c2a1e; --sum-line:#35573a; --code:#8cc6ee; --warn:#2c2516;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px}
nav.tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto}
nav.tabs a{padding:8px 12px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
nav.tabs a.on{color:var(--ink);border-color:var(--accent);font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:5px 10px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wrap{display:flex;min-height:calc(100vh - 100px)}
aside{width:330px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow:auto;height:calc(100vh - 100px);position:sticky;top:100px}
main{flex:1;min-width:0;padding:18px 28px 80px;max-width:980px}
.filters{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line);cursor:pointer;user-select:none}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tree{padding:6px 0 30px}
.tree .n{display:flex;gap:6px;align-items:baseline;padding:3px 12px;cursor:pointer;font-size:13.5px;line-height:1.35}
.tree .n:hover{background:var(--chip)}
.tree .n.cur{background:var(--chip);box-shadow:inset 3px 0 0 var(--accent)}
.tree .n .cd{color:var(--code);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
.tree .n .pg{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.tree .l0{font-weight:700;margin-top:8px;text-transform:uppercase;font-size:12px;letter-spacing:.03em}
.tree .l1{font-weight:600}
.tree .l2{padding-left:24px}
.tree .l3{padding-left:40px;color:var(--ink)}
.tree .tg{cursor:pointer;color:var(--muted);width:12px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;transform:translateY(-1px)}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.crumb a{text-decoration:none}
h1.st{font-size:22px;margin:0 0 4px;line-height:1.3}
h1.st .cd{color:var(--code)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 14px;font-size:13px;color:var(--muted)}
.sum{background:var(--sum);border:1px solid var(--sum-line);border-radius:10px;padding:10px 14px;margin:0 0 16px}
.sum b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:2px}
.txt p{margin:0 0 10px}
.txt h4{margin:18px 0 8px;font-size:15px}
.txt ul{margin:0 0 10px;padding-left:22px}
.txt li{margin:0 0 5px}
.txt ul.sub{margin:5px 0 5px;list-style:circle}
.txt li.nb{list-style:none}
pre.tbl{font:12px/1.35 ui-monospace,Consolas,monospace;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre}
.ref{font-style:italic;color:var(--muted)}
a.xr{text-decoration:none;border-bottom:1px dotted var(--accent);white-space:nowrap}
a.fg{font-size:12px;background:var(--chip);border-radius:5px;padding:0 5px;text-decoration:none;font-style:normal}
.df{border-bottom:1px dashed var(--muted);cursor:help}
sup{font-size:9px;color:var(--muted)}
mark{background:var(--hl);color:inherit;border-radius:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.box h3{margin:0 0 8px;font-size:15px}
.sub-list a{display:block;padding:4px 0;text-decoration:none}
.sub-list .cd{color:var(--code);margin-right:6px}
.eq a{margin-right:8px}
.notes textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px;font:inherit}
.results .r{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.results .r:hover{background:var(--chip)}
.results .r .cd{color:var(--code);font-weight:600;margin-right:6px}
.results .r .sn{color:var(--muted);font-size:13.5px;margin-top:3px}
.pop{position:absolute;z-index:50;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px 14px;font-size:13.5px;max-height:320px;overflow:auto}
.pop h5{margin:0 0 6px;font-size:14px}
table.cf{width:100%;border-collapse:collapse;font-size:14px}
table.cf td,table.cf th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.cf th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
table.cf td.v{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ob .reg{font-size:12.5px;color:var(--muted);margin:-4px 0 8px}
.ob a{display:block;text-decoration:none;padding:3px 0}
.ob a .cd{color:var(--code);font-weight:600;margin-right:6px;font-size:13px}
.ob a span.w{color:var(--ink)}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.figs .fc{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.figs .fc img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover;object-position:top;background:#fff}
.figs .fc div{padding:8px 10px;font-size:13px}
.figview img{width:100%;max-width:760px;display:block;margin:0 auto 12px;border:1px solid var(--line);border-radius:6px;background:#fff}
.gl .gi{padding:12px 0;border-bottom:1px solid var(--line)}
.gl .gi h3{margin:0 0 4px;font-size:16px}
.gl .refs{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.az{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.warn{background:var(--warn);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.star{font-size:18px;line-height:1;border:none;background:none;padding:0 4px;color:var(--muted)}
.star.on{color:#e0a400}
.menu{display:none}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
@media (max-width:820px){
  aside{position:fixed;left:0;top:0;height:100vh;z-index:40;transform:translateX(-100%);transition:transform .2s;width:86vw;max-width:360px;box-shadow:0 0 30px rgba(0,0,0,.25)}
  aside.open{transform:none}
  .menu{display:inline-block}
  main{padding:14px 16px 80px}
  .brand small{display:none}
}

.pj-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 18px}
.pj-tabs a{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pj-tabs a b{display:block;font-size:15.5px;margin-bottom:2px}
.pj-tabs a span{font-size:12.5px;color:var(--muted)}
.pj-tabs a.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.pj-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pj-cols ul{margin:0;padding-left:18px}.pj-cols li{margin:3px 0;font-size:14px}
.pj-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.pj-prog{flex:1;min-width:160px;height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.pj-prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.pj-bar button{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.pj-g h3{margin:0 0 6px;font-size:15px}
.pj-a{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.pj-a:first-of-type{border-top:0}
.pj-a input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}
.pj-a a{text-decoration:none;color:var(--ink)}
.pj-a .cd{color:var(--code);font-weight:600;margin-right:6px;font-size:13px}
.pj-a .tt{color:var(--muted);font-size:12.5px;display:block}
.pj-a.ok a{opacity:.55}
@media (max-width:760px){.pj-cols{grid-template-columns:1fr}}
@media print{.pj-tabs,.pj-bar button{display:none!important}.pj-a input{accent-color:#000}}
@media print{header,aside,.notes,.no-print{display:none!important} main{max-width:none;padding:0}}

.pg{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:0 0 14px;overflow:hidden}
.pg .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;background:var(--chip);font-size:12.5px;color:var(--muted)}
.pg pre{margin:0;padding:12px 14px;font:13px/1.5 ui-monospace,"Cascadia Mono",Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.pg pre .hh{background:var(--hl);font-weight:700}
.zsel{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.th-l{display:flex;flex-wrap:wrap;gap:6px}
.th-l .chip{font-size:12.5px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px}
.kv b{color:var(--muted);font-weight:600}
.pj-a .zn{font-size:11px;background:var(--chip);border-radius:5px;padding:0 5px;margin-left:6px;color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;font-style:italic}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btns a.b{display:inline-block;border:1px solid var(--line);border-radius:7px;padding:5px 10px;text-decoration:none;font-size:13.5px;background:var(--panel)}
.btns a.b.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
</style>

28\n    ZONE UC    48\n    ZONE UD    61\n    ZONE UE    76\n    ZONE UM    82\n    ZONE UPM 1    87\n    ZONE UPM 2    94\n    ZONE UPM 3    108\n    ZONE UPM 4    120\n    ZONE UPM 5    133\n    ZONE UPM 6    141\n    1","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    AVERTISSEMENT\nUn certain nombre de termes employés dans ce document sont explicités dans le lexique mis en\nannexe 1 de la pièce 4.2 Annexes du règlement.\nCes définitions font figure de référence, dans l’interprétation qui peut être faite du règlement\ndes différentes zones.\n    2","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    TITRE I\nDISPOSITIONS GENERALES\n    3","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE 1 - Champ d'application territorial du plan\nLe présent règlement dont les dispositions s’imposent aux particuliers comme aux personnes morales de\ndroit public ou privé, s’applique à l’ensemble du territoire de la commune de SURESNES.\nARTICLE 2 - Portée respective du règlement à l'égard des autres\nlégislations ou réglementations relatives à l'occupation des sols\n1.   Les règles du présent plan local d’urbanisme se substituent à celles des articles R.111.1 à R.111.26\n    du Code de l'Urbanisme, exception faite des articles d’ordre public qui demeurent applicables.\n2.   Lorsque l'établissement d'un projet de P.L.U. est prescrit, ou lorsque la révision d'un plan approuvé a\n    été ordonnée, l'autorité administrative peut décider de surseoir à statuer sur les demandes\n    d'autorisation concernant les constructions, installations ou opérations susceptibles de compromettre\n    ou de rendre plus onéreuse l'exécution du plan. En aucun cas, le sursis ne peut excéder 2 ans.\n3.   S’ajoutent ou se substituent aux règles propres du plan local d’urbanisme, les prescriptions prises au\n    titre de législations spécifiques et concernant notamment les servitudes d’utilité publique affectant\n    l’utilisation ou l’occupation du sol, et qui sont reportées à titre indicatif sur le plan des servitudes,\n    annexé au P.L.U.\n4.   S'ajoutent ou se substituent aux règles propres du P.L.U., les articles du Code de l’Urbanisme ou\n    d’autres législations concernant notamment :\n    - Les périmètres de Droit de Préemption Urbain,\n    - Les périmètres de Déclaration d’Utilité Publique (D.U.P.),\n5.   Protection contre les nuisances sonores terrestres dans les zones de protection acoustique : les\n    constructions devront bénéficier d’un isolement acoustique satisfaisant aux conditions de l’arrêté\n    interministériel du 06.10.1978 modifié ou de la loi du 31 décembre 1992, modifiée par le décret du 9\n    janvier 1995 et de l’arrêté prefectoral n°2000/133 du 11 mai 2000 relatif au classement des\n    infrastructures de transports terrestres. Ce classement est reporté dans la pièce 6 du dossier de P.L.U.\nARTICLE 3 - Division du territoire en zones et secteurs - Emplacements\nréservés – Servitudes de localisation\n1. Le territoire couvert par le plan local d’urbanisme (P.L.U.) est divisé en zones urbanisées (indicatif\n   U), dont les délimitations sont reportées sur les plans de découpages en zones. Il n’existe pas, sur la\n   commune de SURESNES, de zones naturelles au sens du Code de l’Urbanisme (indicatif N), mais les\n   espaces verts significatifs bénéficient des mesures de protection d’un classement en espace boisé\n   classé.\n   Chaque zone est désignée par un indice : lettre majuscule (ex : UA, UB, …). Lorsque des zones\n   comprennent des secteurs, ils sont désignés par l'indice de zone accompagné d'une lettre minuscule\n   (ex: UAa, UAb, …)\n   Les zones d'urbanisation auxquelles s'applique le présent règlement font l'objet du titre II.\n    4","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n2.    Les indications suivantes sont, en outre, reportées sur le plan de zonage :\n    - Les terrains classés comme espaces boisés au titre de l’article L.130.1 du Code de\n    l’Urbanisme.\n    - Les « éléments de paysage à protéger », espaces paysagers, bâtiments et arbres classés au\n    titre de l’article L.123-1-5 7° du Code de l’Urbanisme.\n    - Les emplacements réservés pour équipements et ouvrages publics.\n    - Le périmètre d’application de la servitude L123-2-c du Code de l’Urbanisme pour la\n    localisation des équipements publics\n    - Le périmètre de majoration de constructibilité pour le logement social au titre de l’art.\n    L.127-1.\n    - Le périmètre d’application de l’obligation de mixité des programmes de logement au titre de\n    l’article L.123-1-16° du Code de l’Urbanisme.\n    - Le secteur sur lequel peut être implanté un bâtiment de hauteur supérieure à celle prescrite\n    pour la zone UBc.\n    Sous réserve des dispositions de l'article L.433.1 du Code de l'Urbanisme, interdiction de construire\n    est faite au propriétaire d'un terrain bâti ou non, compris par le P.L.U., dans un emplacement réservé,\n    pour des voies ou ouvrages publics, des installations d'intérêt général ou des espaces verts.\n    Le propriétaire d'un terrain réservé peut demander l'application des dispositions prévues à l'article\n    L.123-17 du Code de l'Urbanisme. A compter du jour où le P.L.U. a été rendu public, il peut exiger\n    qu'il soit procédé à l'acquisition dudit terrain, sous certaines conditions, par la collectivité ou le service\n    public, au bénéfice duquel l'emplacement réservé a été institué\n    Les emplacements réservés au P.L.U. figurent en annexe du règlement des zones avec l'indication de\n    leurs destinations et des collectivités ou services publics bénéficiaires. Chaque réserve est affectée\n    d'un numéro qui se retrouve sur le plan. Les emprises de voirie sont assujetties au même régime que\n    les emplacements réservés.\n    Si la levée de la réserve sur un terrain intervient en cours de validité du P.L.U., les règles de\n    construction applicables au dit terrain, deviennent, sauf modification du P.L.U., celles qui s'appliquent\n    à la zone ou au secteur englobant le terrain.\n3.    Les zones urbaines auxquelles s’appliquent les dispositions au titre II du présent règlement sont :\n     Zone UA : zone de centralité,\n     Zone UB : zone mixte,\n     Zone UC : zone correspondant à des ensembles collectifs et d’équipements publics ou\n    d’intérêt collectif,\n     Zone UD : zone résidentielle d’habitat majoritairement individuel,\n     Zone UE : zone spécifique de la cité jardin,\n     Zone UM : zone recevant des activités notamment liées à l’exploitation du domaine\n    S.N.C.F.\n     Zone UPm : zone correspondant aux secteurs de plan masse de la commune.\nARTICLE 4 - Adaptations mineures et dérogations\nDes adaptations mineures rendues nécessaires par la nature du sol, la configuration des parcelles ou le\ncaractère des constructions avoisinantes peuvent être apportées aux articles 3 à 13 des règlements de zone\n(article L.123-1-5 du Code de l'Urbanisme).\nDes dérogations peuvent également être accordées dans les cas mentionnés à l’article L.123-1-9 du Code\nde l’Urbanisme et L 123-5 (alinéa 3 et 4).\n    5","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE 5 – Reconstructions\nSur l’ensemble du territoire communal s’appliquent les dispositions de l’article L.111-3 du Code de l’Urbanisme\nconcernant la reconstruction à l’identique d’un bâtiment démoli depuis moins de dix ans. Toutefois, cette\nreconstruction n’est pas autorisée pour les éléments de paysage à protéger en application de l’article L 123-1-5-\n7°, sauf en cas de sinistre ou de péril. Toutefois, lorsqu'il existe un emplacement réservé (cf. annexe du\nrèglement), l'implantation devra être conforme au présent règlement.\nARTICLE 6 – Travaux sur bâtiments existants et transformation de\nbureaux en logements\nLes travaux sur les bâtiments existants sont autorisés, sous réserve de ne pas aggraver les non-respects des\nrègles définies aux articles 1 à 16, dans chaque zone du P.L.U.\nDans le secteur UAc, dans le respect des autres règles du document d’urbanisme, une majoration des\nrègles relatives au gabarit, à la hauteur, à l’emprise au sol et au coefficient d’occupation des sols, est\nautorisé dans une limite de 20% pour la réalisation de programmes de logements ou la transformation de\nbureaux en logements (article L123-1-11 du Code de l’Urbanisme).\nARTICLE 7 – Protection des commerces\nSur les secteurs repérés au document graphique comme « linéaire commerciaux », lorsque des locaux\nd’artisanat ou de commerce sont implantés au rez-de-chaussée et/ou au premier étage de constructions\nexistantes, le changement de destination de ces commerces ou artisanat en bureaux ou service, est\ninterdite.\nLe rez-de-chaussée des nouvelles constructions, parties communes exclues, doit être affecté au commerce\net à l’artisanat sur ces linéaires commerciaux.\nARTICLE 8 – Typologie des logements\nEn application des dispositions prévues par l’article L.123-1-5-15° du Code de l’Urbanisme, pour tout\nnouveau programme de logements (hors constructions à usage d’habitat nécessitant la présence\nd’équipements communs s’apparentant à des CINASPIC dont la définition se trouve en annexe) ou\nlorsque les travaux sur un immeuble de logement existant conduisent à une division de ce ou ces\nlogements et à une augmentation de leur nombre dans cet immeuble, le nouveau programme de\nconstructions (comprenant au moins 10 logements) ou la nouvelle répartition de logements doit comporter\nune proportion minimale de 50 % de logements de trois pièces ou plus.\n    6","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE 9 – Dispositions applicables aux espaces boisés et éléments\npaysagers\nPour toutes les zones du PLU où figurent des espaces classés « espaces boisés classés » (EBC) ou\n« éléments paysagers à protéger » repérés sur le document graphique, les présentes dispositions sont\napplicables.\n     ESPACES BOISES CLASSES\nEn l'état de la réglementation en vigueur, il est rappelé que les espaces repérés par la mention « espace\nboisé classe » (EBC) doivent être conservés, protégés ou créés, en application des dispositions de l'Article\nL 130-1 du Code de l'Urbanisme.\nLe classement interdit tout changement d'affectation ou tout mode d'occupation du sol de nature à\ncompromettre la conservation, la protection ou la création des boisements. Nonobstant toutes dispositions\ncontraires, il entraîne le rejet de plein droit de la demande d'autorisation de défrichement prévue par\nl'Article 157 du Code Forestier.\nSauf application des dispositions de l'Article L 130-2 du Code de l'Urbanisme, ces espaces sont\ninconstructibles à l'exception des bâtiments strictement nécessaires à l'exploitation des bois soumis au\nrégime forestier.\n     ELEMENTS DE PAYSAGE A PROTEGER\nLe P.L.U. protège, en application de l’article L.123-1-5 7° du Code de l’Urbanisme, les éléments de\npatrimoine remarquables (parcelles, bâtiments ou parties de bâtiments, éléments particuliers) qui possèdent\nune qualité architecturale remarquable, ou constituent un témoignage de la formation de l’histoire de la\nVille ou d’un quartier, ou assurent par leur volumétrie un repère particulier dans le paysage urbain, ou\nappartiennent à une séquence architecturale remarquable par son homogénéité.\nCes éléments de paysage sont de trois natures :\n    - Les espaces paysagers remarquables ;\n    - Les arbres remarquables ;\n    - Les bâtiments remarquables.\nCes espaces, bâtiments et arbres sont repérés sur le document graphique du PLU comme « élément de\npaysage à protéger » (EPP) et une liste de ces éléments de patrimoine remarquables figure en annexe du\nrèglement.\nLa démolition des éléments remarquables du patrimoine urbain ou architectural devra être dûment motivée.\nLeur restructuration, leur restauration, ou leur modification, doit conserver les dispositions architecturales\nexistant à la date d’approbation du P.L.U., ou restituer les dispositions architecturales existant à leur\norigine. En cas d’extension, il ne devra pas être porté atteinte au caractère architectural de l’existant.\nARTICLE 10 – Taxes et participations\nIl est rappelé que les bénéficiaires d’autorisation d’urbanisme peuvent être soumis aux taxes et\nparticipations prescrites par le code de l’urbanisme permettant le financement des équipements.\n    7","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE 11 –Déclaration préalable pour les clôtures et permis de\ndémolir\nPar délibération du Conseil Municipal du 25 octobre 2007, la Commune a instauré la déclaration\npréalable pour les clôtures et le dépôt obligatoire du permis de démolir pour les bâtiments existants sur\nl’ensemble du territoire communal.\nARTICLE 12 – Canalisations de transport de matières dangereuses\nLa circulaire et l’arrêté du 4 août 2006 précisent que la présence de canalisations de matières dangereuses\n(gaz, hydrocarbure liquide) s’accompagne de trois zones de dangers pour la vie humaine. Un plan est\njoint en annexe du règlement et dans les servitudes d’utilité publique.\nARTICLE 13 – Retrait et gonflement des sols argileux\nLes constructeurs sont invités à respecter les dispositions du cahier de recommandation pour le cas de\nretrait gonflement des argiles joint en annexe du règlement PLU.\nARTICLE 14 – Démolition des surfaces de bureaux\nDans les secteurs identifiés en rouge sur le plan de zonage, les surfaces affectées à la destination\n« bureau » ne peuvent être transformées en une autre destination que l’une de celles énumérées ci-\ndessous :\n    -   Dans la destination « habitation », les sous-destinations hébergement et logement dans la\n    mesure où celles-ci sont minoritaires dans la surface de plancher développée par le projet et\n    sont intrinsèquement liées à l’activité principale du bâtiment.\n    -   Dans la destination « commerces et activités de service », les sous-destinations suivantes :\n    artisanat et commerce de détail, restauration, activités de service où s’effectue l’acceuil\n    d’une clientèle.\n    -   Dans la destination « équipements d’intérêt collectif et services publics », les sous-\n    destinations suivantes : locaux et bureaux accueillant du public des administrations\n    publiques et assimilés, établissement d’enseignement, de santé et d’action sociale.\n    -   Dans la destination « autres activités des secteurs secondaire ou tertiaire », les sous-\n    destinations suivantes : industrie, bureau, centre de congrès et d’exposition.\nLes surfaces existantes inférieures à 100m² ne sont pas concernées par la présente disposition.\nARTICLE 15 – Pollution du sol, du sous-sol et de l’eau\n    -   Dans le cadre d’un projet de construction ou d’aménagement sur un terrain répertorié en SIS\n    (article L.556-2 du code de l’environnement) ainsi que sur un terrain ayant acceuilli une\n    installation classée mise à l’arrêt définitif et régulièrement réhabilitée (article L. 556-1 du code\n    de l’environnement), le maître d’ouvrage fournit dans le dossier de demande de permis de\n    construire ou d’aménager une attestation garantissant la réalisation d’une étude des sols et de sa\n    8","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    prise en lotissement par un bureau d’études certifié dans le domaine des sites et sols pollués, ou\n    équivalent.\n-   Il est rappelé que, dans le cadre de tout projet de nouvelle construction ou de changement de\n    destination, il revient au maître d’ouvrage de vérifier l’absence de risques sanitaires sur les futurs\n    usagers. Les projets de constructions ou de changement de destination situés en zones\n    potentiellement polluées doivent assurer une gestion des risques sanitaires et environnementaux\n    suivant l’usage des milieux, selon la Méthodologie Nationale de gestion des sites et sols pollués.\n    9","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    TITRE II\nDISPOSITIONS APPLICABLES\n  AUX ZONES URBAINES\n    10","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    ZONE UA\nLa zone UA comprend trois sous secteurs (UAa, UAb, UAc) dont les règles diffèrent à l’article 9.\nLa zone est concernée par une servitude du code de l’urbanisme définie à l’article L123-2 c) relative à la\nlocalisation pour la réalisation d’un équipement.\n SECTION I - Nature de l’occupation et de l’utilisation du sol\nARTICLE UA 1 – Occupations et utilisations du sol interdites\nDans l’ensemble de la zone : sont interdites les occupations et utilisations du sol suivantes :\n    - Les installations classées autres que celles autorisées sous condition à l'article UA 2.\n    - Les constructions à usage d’activités à caractère industriel.\n    - Les constructions à usage d’activités commerciales ou artisanales autres que celles\n    autorisées sous condition à l’article UA 2.\n    - Les constructions à usage d'entrepôts autres que celles autorisées sous condition à\n    l'article UA 2.\n    - Les dépôts de ferrailles, de matériaux, de combustibles solides ou liquides (hors station\n    service), ainsi que les entreprises de casse de voiture, et de transformation de matériaux\n    de récupération.\n    - L’ouverture et l’exploitation de carrières.\n    - Le stationnement des caravanes ou d'habitation légère de loisirs.\n    - Les terrains de camping et de caravanage.\n    - Les affouillements, exhaussements des sols autres que ceux autorisés sous condition à\n    l'article UA 2.\nARTICLE UA 2 – Occupations et utilisations du sol soumises à des\nconditions particulières\nLes occupations et utilisations du sol suivantes sont autorisées si elles respectent les\nconditions ci-après :\n2.1    Dans l’ensemble de la zone :\n    -   Les installations classées, à condition :\n     Que soient mises en œuvre toutes les dispositions utiles pour les rendre compatibles\n    avec les milieux environnants,\n     D’éviter toute pollution, nuisance ou dangers non maîtrisables.\n    -   Les constructions à usage d'entrepôts s’ils ne sont pas en façade sur rue.\n    -   Les constructions à usage d’activités commerciales artisanales ou industrielles à condition\n    qu’elles n’entraînent, pour le voisinage, aucune nuisance.\n    -   Les affouillements et exhaussements, s’ils sont nécessaires aux travaux d’aménagement paysager\n    des espaces libres et/ou de construction.\n    -   Dans les secteurs identifiés en rouge sur le plan de zonage, les surfaces affectées à la destination\n    « bureau » ne peuvent être transformées en une autre destination que l’une de celles énumérées\n    ci-dessous :\n        Dans la destination « habitation », les sous-destinations hébergement et logement dans\n    11","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    la mesure où celles-ci sont minoritaires dans la surface de plancher développée par le\n    projet et sont intrinsèquement liées à l’activité principale du bâtiment.\n       Dans la destination « commerces et activités de service », les sous-destinations\n    suivantes : artisanat et commerce de détail, restauration, activités de service où\n    s’effectue l’acceuil d’une clientèle.\n       Dans la destination « équipements d’intérêt collectif et services publics », les sous-\n    destinations suivantes : locaux et bureaux accueillant du public des administrations\n    publiques et assimilés, établissement d’enseignement, de santé et d’action sociale.\n       Dans la destination « autres activités des secteurs secondaire ou tertiaire », les sous-\n    destinations suivantes : industrie, bureau, centre de congrès et d’exposition.\nLes surfaces existantes inférieures à 100m² ne sont pas concernées par la présente disposition.\n    -    Les projets de construction situés en zones inondables doivent être conformes au règlement\n    du PPRI de la Seine dans les Hauts-de-Seine.\n2.2    Dans le secteur UAa :\nA l’emplacement figurant sur le document graphique s’applique la servitude de localisation d’équipement\npublic au titre de l’article L.123-2-c. A l’intérieur de ce périmètre de servitude, les constructions réalisées\ndevront comporter au moins l’un des équipements d’intérêt collectif précisés dans la liste en annexe 7 de\nla pièce 4.2 « Annexes du reglement ».\n2.3    Dans le secteur UAb :\nA l’emplacement figurant sur le document graphique, les opérations comprenant plus de 20 logements\ndoivent comprendre 30 % du programme de logements affecté aux logements sociaux.\n    SECTION II – Conditions de l’occupation du sol\nARTICLE UA 3 – Accès et voirie\n3.1    Toute nouvelle unité foncière doit disposer d’un accès pour les automobiles par une voie\npublique ou privée, d’une largeur de 3,50 m minimum.\nCette disposition ne s’applique pas aux unités foncières existantes à la date d’approbation du PLU.\n3.2    Toute nouvelle voie se terminant en impasse doit être aménagée à son extrémité, de telle manière\nque tous les véhicules amenés à l’emprunter puissent aisément faire demi-tour.\n3.3    Ces accès ne doivent pas présenter un risque pour la sécurité des usagers des voies publiques ou\npour celle des personnes utilisant ces accès. Cette sécurité doit être appréciée compte tenu notamment, de\nla disposition des accès, de leur configuration ainsi que de la nature et de l'intensité du trafic.\nARTICLE UA 4 – Desserte par les réseaux\n4.1    Alimentation en eau potable\n    12","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nToute construction ou installation nouvelle qui nécessite une alimentation en eau doit être raccordée au\nréseau public de distribution d'eau potable.\n4.2    Assainissement\nToute construction devra respecter les documents suivants :\n     Le règlement du service départemental d’assainissement des Hauts-de-Seine ;\n     Le règlement du service d’assainissement de l’EPT Paris Ouest La Défense.\nCes deux documents sont disponibles en annexe du présent Plan Local d’urbanisme.\n4.3    Autres réseaux\nA l’occasion de toute construction neuve, extension ou surélévation, soumise à permis de construire, les\nréseaux, raccordements (électricité, câble, téléphone…), les installations nouvelles et branchements seront\nobligatoirement réalisés en souterrain ou s'intégreront au bâti.\n4.4    Déchets\nPour les nouvelles constructions de plus de deux logements, des locaux poubelles, correctement\ndimensionnés pour accueillir l’ensemble des bacs de la collecte sélective nécessaires aux usagers, doivent\nêtre aménagés de préférence à rez-de-chaussée des constructions, avec accès direct sur le domaine public.\nDans le cas où les locaux ne permettent pas l’accès direct sur rue, il est vivement recommandé de prévoir\nun lieu de stockage sur le domaine privé, facilitant l’accès aux bacs les jours de collecte.\nUn cahier des charges est joint à l’annexe 6 de la pièce 4.2 « Annexes du rêglement » du présent\ndocument.\nARTICLE UA 5 – Caractéristiques des terrains\nSans objet\nARTICLE UA 6 - Implantation des constructions par rapport aux voies\net emprises publiques ou privées.\n6.1    Règles générales\n    -   Largeur de terrain inférieure ou égale à 20 m :\n    Les constructions doivent s’implanter à l'alignement actuel ou futur, des voies publiques ou\n    privées, existantes ou à créer.\n    -   Largeur de terrain supérieure à 20 m :\n    Les constructions doivent s’implanter à l'alignement actuel ou futur, des voies publiques ou\n    privées, existantes ou à créer, sur au minimum 50 % du linéaire du bâtiment. La partie restante\n    de l’alignement sera matérialisée par une clôture composée d’un muret et d’une grille à claire-\n    voie.\n6.2    Règles particulières\n6.2.1    Des implantations en retrait de l’alignement sont, toutefois, autorisées dans les cas suivants :\n    -   Dans le cas d’une recherche esthétique pour créer des séquences de façade conduisant à un\n    retrait inférieur à 0,80 m, des éléments de la façade.\n    13","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    -   Lorsque le projet de construction assure la continuité de volume avec un bâtiment principal\n    voisin existant en retrait et en bon état, et sous réserve d’une bonne intégration au site urbain\n    environnant.\n    -   Pour les équipements publics et/ou d’intérêt collectif, qui peuvent être implantés à l’alignement\n    ou en retrait de 2 mètres minimum.\n6.2.2    Des implantations autres que celles définies à l’article 6.1 sont possibles, dans le cas d’une\nextension ou d’une surélévation d’une construction existante à la date d’approbation du PLU, ne\nrespectant pas les dispositions de l’article 6.1 et sous réserve d’une bonne intégration au site urbain\nenvironnant.\n6.2.3    A l’emplacement du document graphique le long de l’avenue Franklin Roosevelt, les\nconstructions doivent être implantées avec un retrait minimum de 4 mètres.\n6.2.4   Sur les terrains situés à l'angle de deux voies, les constructions devront s’inscrire à l’intérieur\nd’un pan coupé d'une largeur minimale de 5m, perpendiculaire à la bissectrice de l'angle des deux voies.\n6.2.5 Dans les secteurs identifiés en rouge sur le plan de zonage, les constructions à destination\nd’habitation, d’établissement d’enseignement, de santé et d’action sociale, devront être situées en retrait\nde 10m minimum par rapport aux limites du boulevard Henri Sellier (D985). Pour de l’habitation, il est\npossible de déroger à la règle ci-dessus sous condition de créer des unités ayant au moins une pièce de vie\ndonnant sur cour/ cœur d’îlot et/ou situées à la suite d’un bâtiment ayant un rôle d’écran contre le bruit.\n6.3    Saillies\nLes saillies sur voie publique et privée sont autorisées, sous réserve :\n    - que la largeur de voie soit supérieure ou égale à 10 mètres\n    - qu’elles soient placées à une hauteur de 4,30 m minimum, au-dessus de la chaussée,\n    - que leur profondeur n’excède pas 0,80 m,\n    - que l’ensemble du linéaire de saillies constitutives de surfaces de plancher par niveau ne dépasse\n    pas 30 % du linéaire de la façade.\nLa mise en place d’une isolation thermique sur voie publique est autorisée sur les bâtiments existants à la\ndate d’approbation du PLU sous réserve de faire l’objet d’un traitement architectural d’ensemble de\nqualité, que la largeur du trottoir après travaux reste égale ou supérieur à 1,40 mètre, de la prise en\ncompte des réseaux existants et sous réserve de l’accord du gestionnaire de la voirie.\nNota : Les saillies localisées sur les voies départementales devront également respecter les dispositions du\nrèglement de la voirie départementale.\nARTICLE UA 7 – Implantation des constructions par rapport aux\nlimites séparatives\n7.1    Retraits\n7.1.1    En cas de retrait, la distance, mesurée perpendiculairement et horizontalement, comptée en tout\npoint de la façade d’un bâtiment par rapport à la limite séparative la plus proche, doit être :\n    - Au moins égale à la hauteur en tout point de la façade du batiment moins 3 m, sans pouvoir être\n    inférieure à 8 m lorsque la façade comporte une ou des baies principales : L = (H - 3 m) \n    8m,\n    - Au moins égale à sa demi-hauteur en tout point de la façade du batiment, sans pouvoir être\n    inférieure à 4 m dans les autres cas : L = H/2  4 m.\n    14","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n7.1.2    Lorsque les façades ne sont pas parallèles à la limite séparative, les deux règles suivantes se\nsubstituent à la règle énoncée à l’article 7.1.1 :\nSi la façade comporte une ou des baies principales :\n    - La distance entre la limite séparative et le milieu de la façade du bâtiment, mesurée\n    perpendiculairement et horizontalement doit au moins être égale à la hauteur de cette façade\n    moins 3 m, avec un minimum de 8 m : L = (H - 3 m)  8 m.\n    Et\n    - La distance entre la limite séparative et tout point de la façade du bâtiment, mesurée\n    perpendiculairement et horizontalement doit être au moins égale aux 3/4 de la hauteur de cette\n    façade diminuée de 3 m, avec un minimum de 6 m : L = ( ¾ H) - 3 m  6 m.\nDans les autres cas :\nLa distance entre la limite séparative et tout point de la façade du bâtiment, mesurée perpendiculairement\net horizontalement, doit être au moins égale à la moitié de la hauteur de cette façade, sans pouvoir être\ninférieure à 4 m : L = H/2  4 m.\n7.2    Implantation par rapport aux limites latérales dans la bande de constructibilité sur\nrue :\n    -   Sur une profondeur de 20 m comptée à partir de l’alignement actuel ou futur, dans les secteurs\n    UAa et UAb.\n    -   Sur une profondeur de 40 m comptée à partir de l’alignement actuel ou futur, dans le secteur\n    UAc.\n7.2.1    Les constructions peuvent s’implanter soit :\n    -   En limite séparative, si la façade sur la limite est aveugle.\n    -   En retrait, dans ce cas, les constructions devront s’écarter de ces limites conformément aux\n    prescriptions de l’article 7.1.\n7.2.2    Les constructions en fond de parcelle sont autorisées.\n7.2.3    Règle particulière\nLorsque la construction est implantée sur une limite séparative, un retrait du dernier niveau de la\nconstruction est autorisé, sous réserve que la distance comptée horizontalement et perpendiculairement de\ntout point de la façade du dernier niveau, soit au moins égale à la hauteur de celle-ci, avec un minimum de\n3 m.\n7.3    Implantation par rapport aux limites au-delà de la bande de constructibilité sur rue\n7.3.1    Règle générale\nLes constructions doivent s’implanter en retrait, dans ce cas, les constructions devront s’écarter de ces\nlimites conformément aux prescriptions de l’article 7.1.\n7.3.2    Règles particulières\nSous réserve que les murs situés en limite séparative soient aveugles, une construction peut s’implanter en\nlimite séparative si :\n    - Elle s’adosse à une construction principale existante et en bon état située sur l’unité foncière\n    voisine. La construction nouvelle ne doit alors, pas dépasser les héberges existantes et doit\n    respecter, sur au moins une des limites séparatives (limite latérale ou fond de parcelle) un retrait\n    tel que défini à l’article 7.1.\n    - Ou il s’agit d’un rez-de-chaussée à usage d’artisanat ou de commerce n’excédant pas une hauteur\n    totale de 5m.\n7.4    Cours communes\n    15","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n7.4.1    Les constructions peuvent être implantées à une distance moindre que celle définie ci-dessus,\nlorsque les deux propriétaires voisins, s’obligent réciproquement à créer une servitude de cour commune\npropre à respecter les prescriptions de l’article 8.\nEn l’absence d’accord amiable, il peut être fait application des dispositions de l’article R.471-1 du Code\nde l’Urbanisme.\n7.4.2    La notion de cour commune s’applique au sol naturel (servitude non aedificandi) et/ou à un sol\nartificiel correspondant au niveau le plus élevé d’un bâtiment existant (servitude non altius tollendi).\n7.4.3    Dans le cas où une construction principale située sur une parcelle voisine comporte une courette\nou un puits de lumière en limite séparative sur lequel s’ouvrent des baies, un retrait au moins symétrique\nest autorisé afin d’assurer un éclairement convenable à la construction existante.\n7.5    Des retraits inférieurs aux prescriptions de l’article 7.1 peuvent être autorisés sous condition,\ndans le cas de constructions existant à la date d’approbation du P.L.U., et ne respectant pas les\ndispositions des articles 7.1 à 7.3 pour :\n    - La surélévation d’un niveau maximum, d’une construction, si la surélévation des murs concernés\n    ne comporte pas de baies et à condition qu’elle se fasse dans le prolongement des murs existants,\n    - Une extension de faible importance des constructions principales existantes à la date\n    d’approbation du P.L.U (5 % de l’emprise au sol existante) dont le but est l’amélioration du\n    confort (ascenseurs, sanitaires, mise aux normes, locaux déchets ménagers, locaux vélos, ...) ou\n    l’amélioration de la performance énergétique (isolation extérieure) ou l’amélioration de\n    l’accessibilité des bâtiments aux Personnes à Mobilité Réduite.\n7.6    Sous réserve que les murs situés en limite séparative soient aveugles, les annexes de moins de 15\nm² d’emprise au sol et dont la hauteur totale n’excède pas 2,60 m peuvent s’implanter en limite séparative\nou en retrait minimum de 1 m sur l’ensemble de l’unité foncière. En cas de baies les prescriptions des\narticles 7.1 à 7.4 s’appliquent.\n7.7    Les installations nécessaires aux services publics ou d’intérêt collectif ne sont pas assujetties aux\ndispositions de l’article 7.1 et peuvent s’implanter soit en limites séparatives, soit en retrait de 4 m\nminimum de ces limites.\nARTICLE UA 8 – Implantation des constructions non contigües les unes\npar rapport aux autres sur une même propriété\n8.1    Règles générales\nLa construction de plusieurs bâtiments non contigus sur une même unité foncière est autorisée, à\ncondition que :\n    - En tout point de chaque façade, la distance la séparant de la façade d’un autre bâtiment, mesurée\n    perpendiculairement et horizontalement, soit au moins égale à :\n     La hauteur de la façade en tout point moins 3 m, sans pouvoir être inférieure à 8 m\n    lorsque la façade la plus basse comporte des baies principales : L = (H - 3 m) ≥ 8 m,\n     Sa demi-hauteur en tout point, sans pouvoir être inférieure à 4 m dans les autres cas : L\n    = H/2 ≥ 4 m.\n8.2    Règles particulières\n    16","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n8.2.1    Les installations nécessaires aux services publics ou d’intérêt collectif peuvent s’implanter soit\nen contiguïté, soit à une distance de 4 m minimum.\n8.2.2    Les annexes de moins de 15 m² d’emprise au sol et dont la hauteur totale n’excède pas 2,60 m,\nne sont pas assujetties aux prescriptions de l’article 8.1 et peuvent :\n    - S’implanter à une distance de 3m minimum des autres constructions si ces dernières comportent\n    des baies\n    - S’implanter librement y compris s’accoler aux autres constructions, si ces dernières ne\n    comportent pas de baies\nARTICLE UA 9 – Emprise au sol\n9.1    Dans l’ensemble de la zone\n9.1.1    Cas général\nL’emprise au sol de l’ensemble des constructions ne doit pas excéder 50 % de la surface totale du\nterrain (soit un coefficient d’emprise au sol = 0,5).\n9.1.2    Cas particuliers\n    -   En rez-de-chaussée uniquement, l’emprise au sol de l’ensemble des constructions peut\n    atteindre 70 % de la surface totale de l’unité foncière dans le cas de constructions à usage\n    d’artisanat, de commerce, aux installations nécessaires aux services publics ou d’intérêt collectif,\n    ou de dalles de parc de stationnement (soit un coefficient d’emprise au sol = 0,7). En secteur\n    UAb, cette dérogation s’applique également aux constructions à usage de bureau et n’est pas\n    limitée à rez-de-chaussée, dans la limite de la hauteur applicable dans ce secteur.\n    -   Dans le cas de constructions existantes à la date d’approbation du P.L.U., un dépassement de 5\n    % de l’emprise au sol existante pourra être autorisé, pour la réalisation de travaux destinés à\n    l’amélioration du confort (tels ascenseur, escalier de secours, mise aux normes, locaux déchets\n    ménagers, locaux vélos...) ou l’amélioration de la performance énergétique du bâtiment\n    (isolation par l’extérieur) ou amélioration de l’accessibilité des bâtiments aux Personnes à\n    Mobilité Réduite.\n9.2    Dans les secteurs UAa et UAb\n9.2.1    Dans le cas des unités foncières traversantes de moins de 50 m de profondeur et dont la largeur\nde façade ne dépasse pas 15 m, afin de permettre la construction d’un front bâti continu sur rue, le\ncoefficient d’emprise au sol est fixé par la formule suivante :\nCoefficient d’emprise au sol = 0,17 + (16,6 / P) ≤ 1 avec P : profondeur de l’unité foncière.\n    17","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    emprise au sol\n    maximale autorisée\n    en %\n    Emprise au Sol = 0,17 + 16,6\n    100%\n    -----\n    P\n    90%\n    80%\n    70%\n    60%\n    50%\n    P = profondeur\n    des parcelles\n    0    10m    20m    30m    40m    50m    60m\nLes prescriptions de l’article 9.1.2 restent valables lorsque l’emprise au sol résultant de la formule\nprécédente est inférieure à 70 % (p ≥ 31,2 m).\n9.2.2   Dans le cas des unités foncières dont la profondeur n'excède pas 20 m ou situées à l'angle de\nplusieurs rues, et afin d'assurer un front bâti continu sur rue le coefficient d'emprise au sol peut être\nmajoré jusqu'à la valeur de 1 (soit une emprise au sol de 100 % de la surface de l'unité foncière).\nToutefois, cette possibilité ne peut être accordée que si elle se justifie par une meilleure insertion dans le\nsite.\nARTICLE UA 10 – Hauteur maximale des constructions\n10.1    Gabarit enveloppe\n10.1.1 Gabarit enveloppe sur rue\nLa construction devra s’inscrire à l’intérieur d’un gabarit enveloppe défini par :\n    - Un plan vertical, à l’alignement s’élevant jusqu’à la hauteur intermédiaire,\n    - Un quart de cercle de 6 m de rayon se développant à partir de la hauteur intermédiaire,\n    - Une hauteur totale maximale.\nCe gabarit est fonction de l’emprise des voies dans le secteur UAa.\n10.1.2 Parcelles d'angle\nPour les parcelles d'angle situées à l'intersection de deux voies d'inégales largeurs, la hauteur autorisée le\nlong de la voie la plus large, pourra s'appliquer le long de la voie la plus étroite, sur une profondeur de\n15 mètres.\n10.2    Hauteurs maximales (mesurée par rapport au terrain naturel avant travaux)\nLes constructions doivent respecter les caractéristiques suivantes :\n    18","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    Secteur UAa    Secteur UAb    Secteur UAc\nHauteur maximale intermédiaire    Hi = L + 3 avec Hi ≤ 16 m (*)    13 m    19 m\nHauteur totale maximale    H = L + 9 avec H ≤ 19 m    16 m    22 m\n(*)    L : distance entre deux alignements actuels ou futurs\n    Hi : hauteur maximale intermédiaire\n10.3    Dépassements de la hauteur totale maximale autorisée\nLe dépassement de la hauteur totale maximale fixée, peut être accordé, lorsque la construction s’implante\nen contiguïté d’un bâtiment existant à la date d’approbation du PLU, dépassant cette hauteur, afin de\nréaliser une meilleure intégration dans la limite de l’héberge voisine la plus haute du bâtiment existant\ncontigu. Cette dérogation ne peut être autorisée que dans la limite de 50% du linéaire de la façade sur rue\ndu bâtiment.\n    19","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nGabarit enveloppe sur rue et hauteur maximale des constructions\n    Cas 2 : 13m < ou = Hi < ou = 16m\n    Secteur UAa    Cas 1 : Hi < ou = 13m\n    Alignement    Alignement    m\n    H = Hauteur totale    =6    H = Hauteur totale\n    ou hauteur au faîtage    R    ou hauteur au faîtage\n    ou Hauteur plafond    ou Hauteur plafond\n    m\n    =6 10.5.2 Exception en UAb, rue de la Liberté à l’angle Liberté/Payret Dortail, indiquée au document\ngraphique comme devant faire l’objet de construction de logements sociaux, les constructions ne\ndevront pas dépasser 12m.\n10.5.3   Exception en UAb, le long de la rue du docteur Marc Bombiger et de l’avenue Jean Jaurès.\nSur un linéaire de 45 mètres compté à partir du Carrefour de la Croix du Roy : la hauteur maximale\npourra être majorée de 3 mètres.\nSur un linéaire de 20 mètres compté à partir du Carrefour de la Croix du Roy : la hauteur maximale\npourra être majorée de 6 mètres.\nLes 2 hauteurs précitées ne pourront être atteintes que par des retraits successifs d’un minimum d’1,50\nmètre par rapport à l’alignement pour les 2 derniers niveaux hormis le long du pan coupé du Carrefour de\nla Croix du Roy où les 2 derniers niveaux pourront être implantés à l’alignement. Par ailleurs, ces 2\nderniers niveaux devront être situés en retrait des limites séparatives d’un minimum de 4 mètres.\nARTICLE UA 11 – Aspect extérieur - clôtures\nLe projet peut être refusé ou n’être accepté que sous réserve de l’observation de prescriptions spéciales si\nles constructions, par leur situation, leur architecture, leurs dimensions ou l’aspect extérieur des bâtiments\nou ouvrages à édifier ou à modifier, sont de nature à porter atteinte au caractère ou à l’intérêt des lieux\navoisinants, aux sites, aux paysages naturels ou urbains ainsi qu’à la conservation des perspectives\nmonumentales.\nToute construction, agrandissement, restauration ou aménagement d’immeuble devra prendre en compte\nle caractère du site de façon à s’harmoniser avec son environnement architectural et paysager (toitures,\nmatériaux…).\n11.1    Aspect extérieur\n11.1.1 Aspect des toitures\nLes toitures terrasses non-accessibles devront être végétalisées chaque fois que cela est possible. Les\ncouvertures d’aspect précaires sont interdites et en règle générale, les couvertures doivent faire l’objet\nd’un traitement soigné.\n11.1.2 Volumes\n    -    Afin d’éviter les gaines en toitures, les dispositifs de type VMC inversée sont à privilégier. Les\n    ouvrages et locaux techniques tels que machineries d’ascenseurs, de réfrigération, sortie de\n    secours, gaines de ventilation … doivent faire partie de la composition volumétrique d’ensemble\n    et ne pas être laissés apparents notamment dans le cas de toiture terrasse : usage de toiture\n    partielle, de dalle, ou de coffrage s’intégrant dans l’ensemble du bâti par exemple.\n    -    Les châssis oscillo-basculants devront être encastrés dans le plan de la toiture.\n11.1.3 Façades - Pignons\n    -    Les différents murs d’un bâtiment ou d’un ensemble de bâtiments doivent être traités avec le\n    même soin et en harmonie entre eux.\n    -    L’utilisation de matériaux de qualité pour les façades est recommandée.\n    -    L’emploi à nu de matériaux destinés à être recouverts, est interdit.\n    -    Les couleurs de matériaux de parement et des peintures extérieures devront s’harmoniser entre\n    elles\n    21","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    -    Les antennes collectives et paraboliques sont interdites au même titre que les climatisations en\n    façade sur rue, et seront implantées sur les toitures ou sur les façades du bâtiment non visibles de\n    la rue.\nPour les constructions existantes : le caractère d’origine de la façade devra être préservé, notamment\nlorsqu’elle est composée de pierre de taille ou de briques soigneusement mises en œuvre.\nDans le secteur UAa, dans le cas de toiture à pente, le caractère d’origine de la toiture devra être\npréservé en cas de surélévation ou de redressement de toiture, dans le respect, toutefois, des articles du\nrèglement de zone.\nLes éléments d’ornementation existants (modénatures, corniches, volets, persiennes, ...) devront, dans la\nmesure du possible, être conservés et restaurés.\nPour les Façades commerciales : la création de façades commerciales est autorisée dans les limites\nsuivantes :\n    - Les percements destinés à recevoir des vitrines devront s’adapter à l’architecture du bâtiment,\n    - Lorsqu’un même commerce est établi sur plusieurs immeubles contigus, les percements de\n    vitrine devront respecter les limites séparatives.\n11.1.4 La pose de capteurs solaires doit être étudiée, notamment au regard de la trame des ouvertures\nde la façade, et afin de favoriser une intégration dans le plan de toiture ou en façade.\n11.2    Annexes, locaux techniques\n11.2.1 Extensions, garages, boxes\nLes bâtiments annexes doivent être conçus en harmonie de volumes et de matériaux avec les constructions\nexistantes. Les annexes réalisées avec des moyens de fortune tels que des matériaux de démolition,\nrécupération de matériaux destinés à être recouverts, utilisés à nu, sont interdits.\n11.2.2 Locaux techniques\n    -    Les coffrets, compteurs, boîtes aux lettres devront être intégrés dans les murs de construction.\n    -    Les locaux techniques y compris ceux destinés au stockage des conteneurs adaptés aux ordures\n    ménagères et au tri sélectif, devront être intégrés au bâti principal.\n    -    En cas d’impossibilité, ils seront réalisés dans une annexe qui prendra en compte le bâti annexe,\n    les constructions voisines, la structure végétale existante et les plantations à créer.\n11.3    Clôtures\n11.3.1 Clôtures sur les voies publiques ou privées\n    -    Les clôtures sur les voies publiques ou privée doivent être en harmonie avec la construction\n    principale\n    -    Elles ne peuvent pas comporter de parties pleines d’une hauteur supérieure à 1,20 m à partir du\n    trottoir. La hauteur totale de la clôture ne peut être supérieure à 2 m.\n    -    Les piliers des portails d’entrée et de clôture ne peuvent pas dépasser 2,20 m de hauteur.\n    -    Les différents portails d’une même propriété seront de même style architectural.\n    -    Pour les parcelles dont la largeur est inférieure ou égale à 6m et dans le cas où il est nécessaire\n    d’installer un système enroulant : la hauteur globale prenant en compte les pilliers de portails\n    d’accès véhicules et les linteaux, est portée à 2,60m maximum.\n    -    Dans le cas de rue en pente, les hauteurs sont prises au milieu de chaque élément de clôture.\n    -    Toutefois, pour des raisons de sécurité, la hauteur totale des clôtures pourra être portée à 2,60 m\n    pour les installations nécessaires aux services publics ou d’intérêt collectif\n    -    Les clôtures anciennes ayant un caractère architectural affirmé, devront être conservées et\n    restaurées avec les mêmes matériaux.\n11.3.2 Clôtures sur les limites séparatives\n    22","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    La hauteur totale de la clôture ne peut être supérieure à 2,60 m. Elles devront être aménagées de manière\n    à laisser passer la faune.\n    11.3.3 Dans le cas de terrain en pente, les hauteurs sont prises au milieu de chaque élément de clôture.\n    Lorsqu’il y a nécessité de créer un mur de soutènement, celui-ci peut constituer la partie pleine de la\n    clôture jusqu’à concurrence de 1,20 m. Le reste doit être traité en talus.\n    11.4    Les installations nécessaires aux services publics et d’intérêt collectif ne sont pas assujettis aux\n    limitations de hauteur des clôtures de l’article 11.3\n    ARTICLE UA 12 - Stationnement\n    Le stationnement des véhicules, automobiles, motocycles et cycles correspondant aux besoins des\n    constructions et installations doit être assuré en dehors des voies publiques. A cet effet, il devra être\n    réalisé sur le terrain propre à l’opération des aires de stationnement dont les normes minimales sont\n    définies ci-après.\n    12.1    Caractéristiques applicable aux parcs de stationnement collectifs\n    Les rampes d’accès aux aires de stationnement en sous-sol ne doivent pas entraîner de modification dans\n    le niveau du trottoir. Leur pente dans les cinq premiers mètres à partir de l’alignement ne doit pas excéder\n    5 %, sauf impossibilité technique.\n    A titre indicatif, la surface moyenne par emplacement (dégagement compris) est de l’ordre de 25m² pour\n    les automobiles, 4m² pour les motos et 1m² pour les cycles.\n    Les places doubles sont autorisées uniquement pour les parcs de stationnement liés à un immeuble\n    d’habitation pour lequel le ratio de places directement accessibles est au moins d’une place par logement.\n    Largeurs minimales des rampes d’accès :\n    - Sens unique : 3,50 m\n    - Double sens desservant jusqu’à 70 voitures : 3,50 m\n    - Double sens desservant plus de 70 voitures : 6,00 m\n    12.2    Nombre d’emplacements\n    Pour le calcul des places de stationnement nécessaires à une opération, le nombre obtenu par l’application\n    des normes définies ci-dessous sera dans tous les cas arrondis au nombre entier immédiatement supérieur.\n    12.2.1 Constructions à usage d’habitat\nStationnement    Automobiles    Motocycles    Cycles\nLogement    . 1 place par tranche de 60 m² de surface    1 place mini. pour 10    Local clos ou couvert dont la\nCas général    de plancher    logements    superficie correspondra au mini. à\n    . Avec 1 place mini. par logement    0,75 m²/logement jusqu’à 2 pièces\n    principales et 1,5 m²/logement de 3\n    pièces principales et plus.\n    Cette règle s’applique à partir de\n    trois logements collectifs.\nConstructions visées à l’article   . 1 place par logement (article 46 de la    1 place mini pour 10    Local clos ou couvert dont la\nL151-35 du Code de    loi du 29 juillet 1998).    logements.    superficie correspondra au mini. à\nl’Urbanisme    0,75 m²/logement jusqu’à 2 pièces\n    23","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    principales et 1,5 m²/logement de otocycles    Cycles\nHôpitaux - cliniques    .    30 % de la surface de plancher nouvelle    1 % de la surface de plancher\nSalles de spectacles    .    1 place / 10 personnes    1 place / 100 personnes\nEnseignement primaire    .    1 place / classe    Non réglementé.\nEnseignement secondaire    .    1 place / classe    Non réglementé\nEnseignement supérieur    .    1 place / 7 élèves    7 places / 100 m² de surface de plancher\nRésidence personnes âgées    . 1 place pour 10 unités d’habitation.    Non réglementé.\nFoyer de travailleurs    . 1 place pour 4 lits/ unités d’habitation    Non réglementé.\n    24","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n12.3    Cas des changements de destination et des extensions\n12.3.1 Il est obligatoire de maintenir les places de stationnement automobile existantes, dans la limite\ndes nouveaux besoins, avec possibilité de les déplacer.\n12.3.2 En cas d’extension sans création de logements, les normes énoncées aux articles 12.1 à 12.2 ne\nsont applicables que pour la surface de plancher créée et lorsqu’elle induit la création de plus de 2 places\nde stationnement.\n12.3.3 En cas de changement de destination, les normes énoncées aux articles 12.1 à 12.2 ne sont\napplicables que lorsqu’il induit la création de plus de 2 places de stationnement.\n12.4    Prise en compte des transports en commun\nLorsque l’accès des logements mentionnés au 1er et 3ème alinéa de l’article L151-34 du Code de\nl’Urbanisme, est situé à moins de 500 m par les voies praticables d’une gare ou d’une station de transport\npublic guidé ou de transport collectif en site propre et que la qualité de la desserte le permet, le nombre\nd’aires de stationnement exigible par logement ne peut dépasser 0.5, s’il s’agit de logements locatifs\nfinancés avec un prêt aidé par l’Etat, d’établissements assurant l’hébergement de personnes âgées ou de\nrésidences universitaires, et 1 pour les autres catégories de logements.\n12.5    Modalités d’application\n12.5.1 Part minimale d’emplacements de stationnement enterrés ou inclus dans un volume de bâtiment\n    Part minimale d’emplacements de stationnement enterrés ou\n    Secteur\n    couverts *\n    UAa    80%\n    UAb    50%\n    UAc    80%\n* Cette norme s’applique à partir de 3 places de stationnement groupées, et ne concerne pas les installations\nnécessaires aux services publics ou d’intérêt collectif.\n12.5.2 Les places de stationnement aménagées en surface, devront être stabilisées, et\nperméables (pavage non joint, ever-green, etc…) afin de limiter le ruissellement.\n12.5.3 Les places destinées au stationnement des cycles doivent être aménagées dans un local clos,\ncouvert et éclairé, accessible en toute sécurité. Ce local peut être scindé en plusieurs emplacements et\npeut en outre, accueillir les voitures pour enfants.\n12.5.4 Par ailleurs, il n’est pas fixé de normes pour les installations nécessaires aux services publics ou\nd’intérêt collectif non cités préalablement, les places de stationnement seront en rapport avec le\nfonctionnement et les besoins desdits équipements.\n12.5.5 En cas d’impossibilité architecturale ou technique d’aménager sur le terrain de l’opération, le\nnombre d’emplacements nécessaires au stationnement, le constructeur est autorisé à aménager sur un\nautre terrain, dans un rayon de 300 m par les voies praticables, les surfaces de stationnement qui lui font\ndéfaut à condition qu’il apporte la preuve qu’il réalise ou fait réaliser lesdites places.\n12.6    Dispositions diverses\nPour les opérations comptant plus de 15 logements ainsi que les bureaux et les constructions de service\npublic ou d’intérêt collectif, des bornes électriques seront disposées afin d’inciter les utilisateurs à\ndéserter les énergies fossiles. Les dispositions du décret n°2011-873 du 25 juillet 2011 relatif à\nl'application des articles R. 111-14-2 à R. 111-14-5 du code de la construction et de l'habitation) et\nl’arrêté du 20 février 2012 devront être respectées.\n    25","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UA 13 – Espaces libres et plantations, espaces boisés classés\n13.1    Espaces verts\n13.1.1 Les superficies minimales suivantes d'espace vert par rapport à la superficie du terrain devront\nêtre aménagées comme suit :\n    Zone    UA\n    Coefficient total espace vert par rapport à la surface de l’unité 20% dont la moitié en pleine terre\n    foncière\nLes toitures végétalisées compteront dans le calcul de la superficie des espaces verts à hauteur de 40 %\nmaximum de cette superficie.\n13.1.2 Exceptions faites : Des unités foncières bénéficiant des dispositions définies aux articles 9.1.2 et\n9.2\nDans ces cas, 50 % au moins des espaces libres*, s’ils existent, devront être traités en espace vert, dont la\nmoitié en pleine terre.\n* espaces libres : espaces non construits, non occupés par de la voirie, des circulations piétonnes ou du\nstationnement obligatoire\n13.2    Plantations\n13.2.1 S’ils existent, les espaces verts doivent être paysagers et plantés à raison d’un arbre par tranche\nde 100 m².\nCette disposition s’applique à partir de 100m². Afin de favoriser la biodiversité, la plantation\nd’essences différentes est à privilégier.\n13.2.2 Les aires de stationnement de surface doivent être plantées à raison d'un arbre pour 3 places.\n13.2.3 Les dalles de parc de stationnement et des constructions à rez-de-chaussée devront faire l’objet\nd’un traitement végétalisé sur 30 % de leur surface minimale, et recevoir pour cela 50 cm au moins de\nterre végétale.\n13.3    Dans le cas des installations nécessaires aux services publics ou d’intérêt collectif nécessitant par\nnature d’importants espaces non bâtis, les dispositions des articles 13.1 et 13.2 ne s’appliquent pas.\n SECTION III – Possibilités maximales d’occupation des sols\nARTICLE UA 14 – Coefficient d’occupation du sol (C.O.S.)\nLes possibilités maximales d’occupation du sol résultent de l’application des règles précédentes.\n    26","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    SECTION IV – Autres dispositions\nARTICLE UA 15 – Performances énergétiques et environnementales\nLes opérations de plus de 1 000 m² de surface de plancher à destination de bureaux ou d’habitation\ndevront respecter les labels de performances énergétiques en vigueur.\nARTICLE UA 16 –Infrastructures et réseaux de communications\nélectroniques.\nLes constructeurs sont invités à se raccorder au réseau numérique dès que cela est possible.\n    27","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    ZONE UB\nIl s’agit principalement des zones du Bas de Suresnes à vocation mixte.\nLa zone UB comprend cinq sous secteurs (UBa, UBb, UBc, UBd, UBe) dont les règles diffèrent aux\narticles 2, 6, 7, 9 et 10.\nLa zone UB est concernée par la servitude du code de l’urbanisme définie à l’article L 123-2 c) relative à\nla localisation pour la réalisation d’un équipement (deux servitudes sont présentes en UBc).\n SECTION I - Nature de l’occupation et de l’utilisation du sol\nARTICLE UB 1 - Occupations et utilisations du sol interdites\n1.1    Dans l’ensemble de la zone :\n    -   Sont interdites les occupations et utilisations du sol suivantes :\n    -   Les installations classées autres que celles autorisées sous condition à l'article UB 2.\n    -   Les constructions à usage d’activités commerciales artisanales ou industrielles, autres que celles\n    autorisées sous condition à l’article UB 2.\n    -   Les projets de constructions situées dans les zones inondables autres que ceux autorisés sous\n    condition à l’article UB 2.\n    -   Les dépôts de ferrailles, de matériaux, de combustibles solides ou liquides (hors station service),\n    ainsi que les entreprises de casse de voiture, et de transformation de matériaux de récupération.\n    -   Les affouillements, exhaussements des sols autres que ceux autorisés sous condition à l’article\n    UB 2.\n    -   L’ouverture et l’exploitation de carrières.\n    -   Le stationnement des caravanes ou d'habitation légère de loisirs.\n    -   Les terrains de camping et de caravanage.\n1.2    Dans les secteurs UBb, UBd et UBe :\n    -   Les constructions à usage d'entrepôts commerciaux autres que celles autorisées sous condition à\n    l’article UB 2.\n    -   Les constructions à caractère industriel.\nARTICLE UB 2 - Occupations et utilisations du sol soumises à des\nconditions particulières\n2.1    Sont autorisées toutes les occupations et utilisations du sol qui ne sont pas interdites à l’article\nUB 1, sous réserve des conditions de l’article UB 2.2.\n    28","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n2.2    Les occupations et utilisations du sol suivantes sont autorisées si elles respectent les\n    conditions ci-après :\n2.2.1    Dans l’ensemble de la zone :\n    -   Les installations classées, à condition :\n     Que soient mises en œuvre toutes les dispositions utiles pour les rendre compatibles\n    avec les milieux environnants,\n     D’éviter toute pollution, nuisance ou dangers non maîtrisables.\n    -   Les constructions à usage d’activités commerciales artisanales ou industrielles, à condition\n    qu’elles n’entraînent, pour le voisinage, aucune nuisance.\n    -   Les affouillements et exhaussements, s’ils sont nécessaires aux travaux d’aménagement paysager\n    des espaces libres et/ou de construction.\n    -   Dans les secteurs identifiés en rouge sur le plan de zonage, les surfaces affectées à la destination\n    « bureau » ne peuvent être transformées en une autre destination que l’une de celles énumérées\n    ci-dessous :\n        Dans la destination « habitation », les sous-destinations hébergement et logement dans\n    la mesure où celles-ci sont minoritaires dans la surface de plancher développée par le\n    projet et sont intrinsèquement liées à l’activité principale du bâtiment.\n     Dans la destination « commerces et activités de service », les sous-destinations\n    suivantes : artisanat et commerce de détail, restauration, activités de service où\n    s’effectue l’acceuil d’une clientèle.\n     Dans la destination « équipements d’intérêt collectif et services publics », les\n    sous-destinations suivantes : locaux et bureaux accueillant du public des\n    administrations publiques et assimilés, établissement d’enseignement, de santé\n    et d’action sociale.\n     Dans la destination « autres activités des secteurs secondaire ou tertiaire », les\n    sous-destinations suivantes : industrie, bureau, centre de congrès et\n    d’exposition.\nLes surfaces existantes inférieures à 100m² ne sont pas concernées par la présente disposition.\n    -   Les projets de construction situés en zones inondables doivent être conformes au règlement\n    du PPRI de la Seine dans les Hauts-de-Seine.\n2.2.2    Dans le secteur UBa\nLes dispositions de l’article L.127-1 en faveur du logement social sont mises en vigueur dans les secteurs\nde projet figurant sur le document graphique. Dans ces secteurs, une majoration de 35 % du volume\nconstructible est autorisée. Toutefois, cette majoration ne peut être supérieure au pourcentage de\nlogements sociaux de l’opération.\n2.2.3    Dans le secteur UBb\nLes constructions à usage d'entrepôts s’ils ne sont pas en façade sur rue.\n2.2.4    Dans le secteur UBc\nDeux servitudes (toutes deux issues de l’article L123-2 c du code de l’urbanisme) sont instaurées sur les\nparcelles localisées au document graphique. A l’intérieur de ce périmètre de servitude, les constructions\nréalisées devront comporter au moins l’un des équipements d’intérêt collectif précisés dans la liste en\nannexe 7 de la pièce 4.2 « Annexes du reglement ».\n2.2.5    Dans les secteurs UBd, UBe :\n    -   Les constructions de bureaux, à condition que :\n     Il s’agisse de la reconstruction de bureaux existant sur une unité foncière, avant\n    l’approbation de la présente révision.\n     Ou que la surface plancher de bureaux soit inférieure à 300 m² par unité foncière.\n    29","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    SECTION II - Conditions de l’occupation du sol\nARTICLE UB 3 - Accès et voirie\n3.1    Toute nouvelle unité foncière doit disposer d’un accès pour les automobiles par une voie\npublique ou privée d’une largeur de 3,50 m minimum.\n3.2    Les accès doivent présenter des caractéristiques permettant de satisfaire aux exigences de la\nsécurité, de la défense contre l’incendie et de la protection civile, conformément aux règlements en\nvigueur.\n3.3    Ces accès ne doivent pas présenter un risque pour la sécurité des usagers des voies publiques ou\npour celle des personnes utilisant ces accès. Cette sécurité doit être appréciée compte tenu notamment, de\nla disposition des accès, de leur configuration ainsi que de la nature et de l'intensité du trafic.\n3.4    Toute nouvelle voie se terminant en impasse doit être aménagée à son extrémité, de telle manière\nque tous les véhicules amenés à l’emprunter puissent aisément faire demi-tour.\nCette disposition ne s’applique pas aux unités foncières existantes à la date d’approbation du PLU.\nARTICLE UB 4 - Desserte par les réseaux\n4.1    Alimentation en eau potable\nToute construction ou installation nouvelle qui nécessite une alimentation en eau doit être raccordée au\nréseau public de distribution d'eau potable.\n4.2    Assainissement\nToute construction devra respecter les documents suivants :\n     Le règlement du service départemental d’assainissement des Hauts-de-Seine ;\n     Le règlement du service d’assainissement de l’EPT Paris Ouest La Défense.\nCes deux documents sont disponibles en annexe du présent Plan Local d’urbanisme.\n4.3    Autres réseaux\nA l’occasion de toute construction neuve, extension ou surélévation, soumise à permis de construire, les\nréseaux, raccordements (électricité, câble, téléphone…), les installations nouvelles et branchements seront\nobligatoirement réalisés en souterrain ou s'intégreront au bâti.\n4.4    Déchets\nPour les nouvelles constructions de plus de deux logements, des locaux poubelles, correctement\ndimensionnés pour accueillir l’ensemble des bacs de la collecte sélective nécessaires aux usagers, doivent\nêtre aménagés de préférence à rez-de-chaussée des constructions, avec accès direct sur le domaine public.\nDans le cas où les locaux ne permettent pas l’accès direct sur rue, il est vivement recommandé de prévoir\nun lieu de stockage sur le domaine privé, facilitant l’accès aux bacs les jours de collecte.\nUn cahier des charges est joint à l’annexe 6 de la pièce 4.2 « Annexes du règlement ».\n    30","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UB 5 - Caractéristiques des terrains\nSans objet.\nARTICLE UB 6 - Implantation des constructions par rapport aux voies\net emprises publiques ou privées.\n6.1.    Règles générales\nDans l’ensemble des secteurs de la zone UB, lorsqu’un retrait est obligatoire celui-ci devra être végétalisé\nen pleine terre à hauteur de 50% minimum.\n6.1.1    Dans les secteurs UBa, UBb et UBd\nLes constructions doivent s’implanter en retrait de 4 m minimum de l’alignement actuel ou futur, des\nvoies publiques ou privées, existantes ou à créer.\nExcepté dans les cas suivants :\n    - Rue de Verdun : recul de 8 m coté pair (à la place de l’emplacement réservé),\n    - Rue de la Procession et rue des Nouvelles, pour la partie comprise entre le boulevard du\n    maréchal de Lattre de Tassigny et la rue de la Procession : en retrait de 4 mètres minimum,\n    - Rue Salomon de Rothschild : recul de 10 mètres minimum côté pair.\nDans les secteurs identifiés en rouge sur le plan de zonage, les constructions à destination d’habitation,\nd’établissement d’enseignement, de santé et d’action sociale, devront être situées en retrait de 10m\nminimum par rapport aux limites du boulevard Henri Sellier (D985). Pour de l’habitation, il est possible\nde déroger à la règle ci-dessus sous condition de créer des unités ayant au moins une pièce de vie donnant\nsur cour/ cœur d’îlot et/ou situées à la suite d’un bâtiment ayant un rôle d’écran contre le bruit.\n6.1.2    Dans le secteur UBc\nLes constructions peuvent s’implanter soit à l’alignement actuel ou futur ou en retrait.\nRappel : les constructions doivent cependant respecter les retraits imposés figurant au plan de zonage\n(trait continu bleu). Exemple : rue Benoît Malon recul de 4 mètres côté pair.\n6.1.3    Dans le secteur UBe\nLes constructions doivent s'implanter avec un recul par rapport à l'alignement actuel ou futur de :\n    - 2 m pour le boulevard de Lattre de Tassigny\n    - 4 m pour les autres voies\n6.2.    Règles particulières\n6.2.1    Des implantations autres que celles définies à l’article 6.1 sont possibles, dans les cas suivants :\n    -   Dans le cas d’une recherche esthétique pour créer des séquences de façade conduisant à un\n    retrait inférieur à 0,80 m, des éléments de la façade.\n    -   Lorsque le projet de construction assure la continuité de volume avec les immeubles voisins\n    existants et sous réserve d’une bonne intégration au site urbain environnant.\n    -   Pour les équipements publics ou d’intérêt collectif, qui peuvent être implantés à l’alignement ou\n    en retrait de 2 mètres minimum.\n    31","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n6.2.2    Des implantations autres que celles définies à l’article 6.1 sont possibles, dans le cas d’une\nextension et/ou d’une surélévation d’une construction existante à la date d’approbation du PLU, ne\nrespectant pas les dis
