3 - Modifié en dernier lieu par DCT du 26 juin 2024\n    12.2.3 Constructions à usage d’équipements\nStationnement    Automobiles    Motocycles    Cycles\nHôpitaux - cliniques    . 40 % de la surface de plancher nouvelle    1 % de la surface de plancher\nSalles de spectacles    . 1 place / 10 personnes    1 place pour 100 personnes\nEnseignement primaire    . 1 place / classe    Non réglementé.\nEnseignement secondaire    . 1 place / classe    Non réglementé\nEnseignement supérieur    . 1 place / 7 élèves    7 places / 100 m² de surface de plancher\nRésidence personnes âgées    . 1 place pour 10 unités d’habitation.    Non réglementé.\nFoyer de travailleurs    . 1 place pour 4 lits/ unités d’habitation    Non réglementé.\n    12.3 Cas des changements de destination et des extensions\n    12.3.1 Il est obligatoire de maintenir les places de stationnement automobile existantes, dans la limite\n    des nouveaux besoins, avec possibilité de les déplacer.\n    12.3.2 En cas d’extension sans création de logements, les normes énoncées aux articles 12.1 à 12.2 ne\n    sont applicables que pour la surface de plancher créée et lorsqu’elle induit la création de plus de 2 places\n    de stationnement.\n    12.3.3 En cas de changement de destination, les normes énoncées aux articles 12.1 à 12.2 ne sont\n    applicables que lorsqu’il induit la création de plus de 2 places de stationnement.\n    12.4    Prise en compte des transports en commun\n    12.4.1 Lorsque l’accès des logements mentionnés au 1er et 3ème alinéa de l’article L151-34 du Code de\n    l’Urbanisme, est situé à moins de 500 m par les voies praticables d’une gare ou d’une station de transport\n    public guidé ou de transport collectif en site propre et que la qualité de la desserte le permet, le nombre\n    d’aires de stationnement exigible par logement ne peut dépasser 0.5, s’il s’agit de logements locatifs\n    financés avec un prêt aidé par l’Etat, d’établissements assurant l’hébergement de personnes âgées ou de\n    résidences universitaires, et 1 pour les autres catégories de logements.\n    12.5    Modalités d’application\n    12.5.1 Part minimale d’emplacements de stationnement enterrés ou inclus dans un volume de bâtiment\n    Part minimale d’emplacements de\n    Secteur    stationnement enterrés ou couverts *\n    UCa    50 %\n    UCb    Non réglementé\n    * Cette norme s’applique à partir de 3 places de stationnement groupées et ne concerne pas les installations nécessaires aux\n    services publics ou d’intérêt collectif.\n    58","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n12.5.2 Les places de stationnement aménagées en surface, devront être stabilisées, et\nperméables (pavage non joint, ever-green, etc...) afin de limiter le ruissellement.\n12.5.3 Les places destinées au stationnement des cycles deux roues doivent être aménagées dans un\nlocal clos, couvert et éclairé, accessible en toute sécurité. Ce local peut être scindé en plusieurs\nemplacements et peut en outre, accueillir les voitures pour enfants.\n12.5.4 Par ailleurs, il n’est pas fixé de normes pour les installations nécessaires aux services publics ou\nd’intérêt collectif non cités préalablement, les places de stationnement seront en rapport avec le\nfonctionnement et les besoins desdits équipements.\n12.5.5 En cas d’impossibilité architecturale ou technique d’aménager sur le terrain de l’opération, le\nnombre d’emplacements nécessaires au stationnement, le constructeur est autorisé à aménager sur un\nautre terrain, dans un rayon de 300 m par les voies praticables, les surfaces de stationnement qui lui font\ndéfaut à condition qu’il apporte la preuve qu’il réalise ou fait réaliser lesdites places.\n12.6    Dispositions diverses\nPour les opérations comptant plus de 15 logements ainsi que les bureaux et les constructions de service\npublic ou d’intérêt collectif, des bornes électriques seront disposées afin d’inciter les utilisateurs à\ndéserter les énergies fossiles. Les dispositions du décret n°2011-873 du 25 juillet 2011 relatif à\nl'application des articles R. 111-14-2 à R. 111-14-5 du code de la construction et de l'habitation) et\nl’arrêté du 20 février 2012 devront être respectées.\nARTICLE UC 13 – Espaces libres et plantations, espaces boisés classés\n13.1.    Espace vert\n13.1.1 Les superficies minimales suivantes d'espace vert par rapport à la superficie du terrain devront\nêtre aménagées comme suit :\n    Secteurs    UCa    UCb\n    Coefficient total espace vert par rapport à la surface 40% dont la moitié en    Non réglementé\n    de l’unité foncière    pleine terre\nLes toitures végétalisées compteront dans le calcul de la superficie des espaces verts à hauteur de 40 %\nmaximum de cette superficie.\n13.1.2 Exceptions faites des équipements d’intérêt collectif pour lesquels le coefficient total espace\nvert est de 15 %, dont la moitié en pleine terre.\n13.1.3 Les marges de recul sur rue définies à l’article 6.1, doivent être traitées en espace vert excepté en\ncas de commerce, artisanat, ou service en rez-de-chaussée.\n13.2    Plantations\n13.2.1 S’ils existent, les espaces verts doivent être paysagers et plantés à raison d’un arbre par tranche de\n100 m².\nCette disposition s’applique à partir de 100m². Afin de favoriser la biodiversité, la plantation\nd’essences différentes est à privilégier.\n    59","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n13.2.2 Les aires de stationnement de surface doivent être plantées à raison d'un arbre pour 3 places.\n13.2.3 Les dalles de parc de stationnement et des constructions à rez-de-chaussée devront faire l’objet\nd’un traitement végétalisé, et recevoir pour cela 50 cm au moins de terre végétale.\n13.3    Dans le cas des installations nécessaires aux services publics ou d’intérêt collectif nécessitant par\nnature d’importants espaces non bâtis, les articles 13.1 et 13.2 ne s’appliquent pas.\n  SECTION III – Possibilités maximales d’occupation des sols\nARTICLE UC 14 – Coefficient d’occupation du sol (C.O.S.)\nSans objet\n    SECTION IV – Autres dispositions\nARTICLE UC 15 – Performances énergétiques et environnementales\nLes opérations de plus de 1 000 m² de surface de plancher à destination de bureaux ou d’habitation\ndevront respecter les labels de performances énergétiques en vigueur.\nARTICLE UC 16 – Infrastructures et réseaux de communications\nélectroniques.\nLes constructeurs sont invités à se raccorder au réseau numérique dès que cela est possible.\n    60","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    ZONE UD\nCette zone couvre le tissu pavillonnaire de la commune.\nLa zone UD comprend trois sous secteurs (UDa, UDb, UDc) dont les règles diffèrent aux articles 5 et 10.\nSECTION I – Nature de l’occupation et de l’utilisation du sol\nARTICLE UD 1 – Occupations et utilisations du sol interdites\nDans l’ensemble de la zone, sont interdites les occupations suivantes :\n   - Les constructions à usage d’activités agricole, artisanales ou industrielles, autres que celles\n    autorisées sous condition à l’article 2.\n   - Les installations classées autres que celles autorisées sous condition à l’article 2.\n   - Le stationnement des caravanes isolées au sens du code de l'urbanisme.\n   - L’ouverture de terrains aménagés pour l’accueil des campeurs et des caravanes.\n   - Les dépôts de ferrailles, de matériaux, de combustibles solides ou liquides (hors station service),\n    ainsi que les entreprises de casse de voiture, et de transformation de matériaux de récupération.\n   - L’ouverture et l’exploitation des carrières.\n   - Les affouillements, exhaussements des sols autres que ceux autorisés sous condition à l’article 2.\n   - Les projets de constructions situées dans les zones inondables autres que ceux autorisés sous\n    condition à l’article 2.\nARTICLE UD 2 – Occupations et utilisations du sol soumises à des\nconditions particulières\nSont autorisées les occupations et utilisations du sol suivantes sous conditions :\n    -    Les constructions à usage de parc de stationnement et les aires de stationnement en surface\n    complémentaires d’une occupation du sol autorisée.\n    -    Les affouillements et exhaussement de sol, s’ils sont nécessaires aux travaux de construction\n    et/ou d’aménagement paysager des espaces libres.\n    -    Les projets de constructions dans les zones inondables doivent être conformes au règlement du\n    PPRI\n    -    Les constructions à usage commercial, artisanal ou industriel, les constructions à usage de\n    services à condition qu’elles n’entraînent, pour le voisinage, aucune nuisance.\n    -    Les installations classées à condition :\n     que soient mises en œuvre toutes les dispositions utiles pour les rendre compatibles avec\n    les milieux environnants,\n     d’éviter toute pollution, nuisance ou dangers non maîtrisables,\n     qu’elles soient nécessaires et complémentaires à la vie et à la commodité des habitants.\n    61","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    SECTION II – Conditions de l’occupation du sol\nARTICLE UD 3 – Accès et voirie\n3.1    Toute nouvelle unité foncière doit disposer d’un accès pour les automobiles par une voie\npublique ou privée, d’une largeur de 3,50 m minimum.\nCette disposition ne s’applique pas aux unités foncières existantes à la date d’approbation du PLU.\n3.2    Toute nouvelle voie se terminant en impasse doit être aménagée à son extrémité, de telle manière\nque tous les véhicules amenés à l’emprunter puissent aisément faire demi-tour.\n3.3    Ces accès ne doivent pas présenter un risque pour la sécurité des usagers des voies publiques ou\npour celle des personnes utilisant ces accès. Cette sécurité doit être appréciée compte tenu notamment, de\nla disposition des accès, de leur configuration ainsi que de la nature et de l'intensité du trafic.\nARTICLE UD 4 – Desserte par les réseaux\n4.1    Alimentation en eau potable\nToute construction ou installation nouvelle qui nécessite une alimentation en eau doit être raccordée au\nréseau public de distribution d'eau potable.\n4.2    Assainissement\nToute construction devra respecter les documents suivants :\n     Le règlement du service départemental d’assainissement des Hauts-de-Seine ;\n     Le règlement du service d’assainissement de l’EPT Paris Ouest La Défense.\nCes deux documents sont disponibles en annexe du présent Plan Local d’urbanisme.\n4.3    Autres réseaux\nA l’occasion de toute construction neuve, extension ou surélévation, soumise à permis de construire, les\nréseaux, raccordements (électricité, câble, téléphone…), les installations nouvelles et branchements seront\nobligatoirement réalisés en souterrain ou s'intégreront au bâti.\n4.4    Déchets\nPour les nouvelles constructions de plus de deux logements, des locaux poubelles, correctement\ndimensionnés pour accueillir l’ensemble des bacs de la collecte sélective nécessaires aux usagers, doivent\nêtre aménagés de préférence à rez-de-chaussée des constructions, avec accès direct sur le domaine public.\nDans le cas où les locaux ne permettent pas l’accès direct sur rue, il est vivement recommandé de prévoir\nun lieu de stockage sur le domaine privé, facilitant l’accès aux bacs les jours de collecte.\nUn cahier des charges est joint à l’annexe 6 de la pièce 4.2 « Annexes du rêglement ».\n    62","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UD 5 – Caractéristiques des terrains\nEn secteur UDc :\n    -   Ne sont pas réglementées : les unités foncières existantes à la date d’approbation du P.L.U.\n    -   Les nouvelles unités foncières issues de division ou de détachement sont constructibles si elles\n    présentent une surface minimale de 500 m².\n    -   Ces dispositions ne s’appliquent pas aux installations nécessaires aux services publics ou\n    d’intérêt collectif.\nARTICLE UD 6 – Implantation des constructions par rapport aux voies\net emprises publiques ou privées existantes\n6.1.    Règles générales\nLes constructions doivent s’implanter en retrait de 4 m minimum de l'alignement, des voies publiques\nou privées, existantes.\nExcepté, le long des rues suivantes où les constructions doivent s’implanter :\n    - Rue des Parigots : à l’alignement ou en retrait supérieur à 2 m.\n    - Rue des Bas Rogers : à l’alignement ou en retrait supérieur à 2 m.\n    - Rue Worth : à l’alignement sur un tronçon délimité par un trait continu dans le document\n    graphique (plan de zonage).\n    - Rue Carnot : à l’alignement ou en retrait à 2m minimum.\n    - Rue de la Cerisaie : à l’alignement ou en retrait de 4m minimum.\n    - Rue Gambetta : à l’alignement ou en retrait de 4m minimum.\n    - Rue des Velettes : en retrait à 1m minimum.\n    - Rue Lapostol : coté pair - à l'alignement\n    - Rues Diderot, des Conférences de Suresnes, de la Belle Gabrielle, du Bac, des Tourneroches et\n    allée des Beaux Sites : suivant l’implantation actuelle du site\n    - Rue du Chemin Vert : en retrait de 2m minimum.\n6.2.    Règles particulières :\n6.2.1    Des implantations autres que celles définies à l’article 6.1 sont autorisées sur une largeur de 4\nmètres, ou sur un maximum d'un tiers du linéaire de terrain sur rue, lorsque celui ci est supérieur à 12\nmètres :\n    - Lorsque le projet de construction assure la continuité de volume avec les immeubles voisins\n    existants dans la limite de l’héberge et sous réserve d’une bonne intégration au site urbain\n    environnant.\n   Ou\n    - Lorsqu’il s’agit de locaux déchets bien intégrés dans l’environnement\n6.2.2    Des implantations autres que celles définies à l’article 6.1 sont possibles, dans les cas suivants :\n    -   Dans le cas d’unité foncière de moins de 15 m de profondeur : retrait de 1 m minimum.\n    -   Pour les constructions existantes à la date d’approbation du PLU, dans le cas d’une extension ou\n    d’une surélévation d’un niveau maximum, ne respectant pas les dispositions de l’article 6.1 et\n    sous réserve d’une bonne intégration au site urbain environnant.\n    -   Dans le cas de construction ou d’extension d’un équipement collectif et d’intérêt général.\n    63","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n6.2.3   Sur les terrains situés à l'angle de deux voies, les constructions devront s’inscrire à l’intérieur\nd’un pan coupé d'une largeur minimale de 5m, perpendiculaire à la bissectrice de l'angle des deux voies.\n6.3    Saillies\nLes saillies sur voie publique ou privée sont interdites.\nExcepté rue de la République, où elles sont autorisées, sous réserve :\n    - qu’elles soient placées à une hauteur de 4,30 m minimum, au-dessus de la chaussée,\n    - que leur profondeur n’excède pas 0,80 m,\n    - que l’ensemble du linéaire de saillies par niveau, ne dépasse pas 30 % du linéaire de la façade.\nLa mise en place d’une isolation thermique sur voie publique est autorisée sur les bâtiments existants à la\ndate d’approbation du PLU sous réserve de faire l’objet d’un traitement architectural d’ensemble de\nqualité, que la largeur du trottoir après travaux reste égale ou supérieur à 1,40 mètre, de la prise en\ncompte des réseaux existants et sous réserve de l’accord du gestionnaire de la voirie.\nNota : Les saillies localisées sur les voies départementales devront également respecter les dispositions du\nrèglement de la voirie départementale.\nARTICLE UD 7 –Implantation des constructions par rapport aux limites\nséparatives\n7.1    Retraits\n7.1.1    En cas de retrait, la distance, mesurée perpendiculairement et horizontalement, comptée en tout\npoint de la façade d’un bâtiment par rapport à la limite séparative la plus proche, doit être :\n    - Au moins égale à la hauteur, sans pouvoir être inférieure à 6m lorsque la façade comporte une\n    ou des baies principales : L = H ≥ 6 m,\n    - Au moins égale à sa demi hauteur en tout point de la façade du batiment, sans pouvoir être\n    inférieure à 3 m dans les autres cas : L = H/2 ≥ 3 m.\n7.1.2    Lorsque les façades ne sont pas parallèles à la limite séparative, les deux règles suivantes se\nsubstituent à la règle énoncée à l’article 7.1.1 :\nSi la façade comporte une ou des baies principales :\n    - La distance entre le milieu de la façade du bâtiment et la limite séparative, mesurée\n    perpendiculairement et horizontalement doit au moins être égale à sa hauteur, avec un minimum\n    de 6 m : L = H ≥ 6 m.\n    Et\n    - La distance entre la façade du bâtiment et la limite séparative, mesurée perpendiculairement et\n    horizontalement doit être au moins égale aux 3/4 de sa hauteur avec un minimum de 5 m : L =\n    3/4 H ≥ 5 m.\nDans les autres cas :\n   - La distance entre la façade du bâtiment et la limite séparative, mesurée perpendiculairement et\n    horizontalement, doit être au moins égale à sa hauteur, sans pouvoir être inférieure à 3 m : L =\n    H/2 ≥ 3 m.\n7.2    Implantation par rapport aux limites séparatives sur une profondeur de 20 m\n    comptée à partir de l’alignement des voies existantes\n7.2.1    Pour les unités foncières dont le linéaire sur rue est inférieur ou égale à\n20 m, les constructions peuvent s’implanter :\n    - Soit sur les limites séparatives (limites latérales et fonds de parcelle) si la façade sur la limite\n    est aveugle.\n    64","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    -   Soit en retrait de ces limites et conformément aux prescriptions de l’article 7.1.\n7.2.2    Pour les unités foncières dont le linéaire sur rue est supérieur à 20 m : les constructions doivent\ns’implanter obligatoirement en retrait des limites latérales. Le retrait devra être conforme aux\nprescriptions de l’article 7.1.\n7.2.3    Les constructions en fond de parcelle sont autorisées si la façade sur la limite est aveugle.\n7.3    Implantation par rapport aux limites séparatives au-delà de 20 m des voies existantes\n7.3.1    Sont autorisés :\n    -   Les constructions d’annexe, à condition que leur hauteur totale maximale n’excède pas 2,60 m,\n    -   Les aménagements et extensions limitées à 25% de la surface de plancher, des constructions\n    principales à usage de logement, existantes à la date d’approbation du P.L.U.\n7.3.2    Les constructions autorisées doivent s’implanter en retrait. Le retrait devra être conforme aux\nprescriptions de l’article 7.1.\n7.4    Cas des unités foncières enclavées : unités foncières existantes à la date d’approbation du\nP.L.U dont plus des 3/4 de la superficie sont situés en dehors de la bande de 20 m constructible à partir de\nl’alignement.\nCette unité foncière enclavée est constructible si elle possède un accès carrossable, direct à la voirie ou\nétablit par une servitude de passage transcrit par un acte authentique.\nDans ce cas, une seule construction principale à usage de logement est autorisée, et elle doit s’implanter\nen retrait conformément aux prescriptions de l’article 7.1.\n7.5    Cours communes\n7.5.1    Les constructions peuvent être implantées à une distance moindre que celle définie ci-dessus,\nlorsque les deux propriétaires voisins, s’obligent réciproquement à créer une servitude de cour commune\npropre à respecter les prescriptions de l’article 8.\nEn l’absence d’accord amiable, il peut être fait application des dispositions de l’article R.471-1 du Code\nde l’Urbanisme.\n7. 5.2 La notion de cour commune s’applique au sol naturel (servitude non aedificandi) et/ou à un sol\nartificiel correspondant au niveau le plus élevé d’un bâtiment existant (servitude non altius tollendi).\n7. 5.3 Dans le cas où une construction principale située sur une parcelle voisine comporte une courette\nou un puits de lumière en limite séparative sur lequel s’ouvrent des baies, un retrait au moins symétrique\nest autorisé afin d’assurer un éclairement convenable à la construction existante.\n7.6    Des retraits inférieurs aux prescriptions de l’article 7.1 peuvent être autorisés dans le cas de\nconstructions existantes à la date d’approbation du PLU, et ne respectant pas les dispositions des articles\n7.1 à 7.3 pour :\n    - la surélévation d’un niveau maximum, d’une construction hors annexes, si la surélévation des\n    murs concernés ne comporte pas de baies, et à condition qu’elle se fasse dans le prolongement\n    des murs existants,\n    - une extension de faible importance (5% de l’emprise au sol existante) des constructions\n    principales existant à la date d’approbation de l’approbation du PLU dont le but est\n    l’amélioration du confort (ascenseurs, sanitaires, mise aux normes, locaux déchets ménagers,\n    locaux vélos, ...), ou l’amélioration de la performance énergétique du bâtiment (isolation par\n    l’extérieur) ou amélioration de l’accessibilité du bâtiment aux Personnes à Mobilité Réduite,\n    - une extension d’un niveau habitable maximum (au delà de la bande de 20 mètres) ou dans la\n    limite des hauteurs fixées à l’article 10 (dans la bande de 20 m), et dont l’implantation se réalise\n    dans le prolongement des murs existants, sous réserve que les façades donnant sur les limites\n    latérales ne comportent pas de baies.\n    65","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    -   La fermeture de loggia ou terrasse couverte et partiellement close existantes.\n7.7    Toutefois, sous réserve que les murs situés en limite séparative soient aveugles, les annexes de\nmoins de 15 m² d’emprise au sol et dont la hauteur totale n’excède pas 2,60 m peuvent s’implanter en\nlimite séparative ou en retrait minimum de 1m sur l’ensemble de l’unité foncière. En cas de baies les\nprescriptions des articles 7.1 à 7.3 s’appliquent.\n7.8    Les installations nécessaires aux services publics ou d’intérêt collectif ne sont pas assujettis aux\ndispositions des articles 7.1 à 7.7 et peuvent s’implanter soit en limites séparatives, soit en retrait de 3 m\nminimum de ces limites.\nARTICLE UD 8 – Implantation des constructions non contigües les\nunes par rapport aux autres sur une même propriété\n8.1    Règles générales\nLa construction de plusieurs bâtiments non contigus sur une même unité foncière, est autorisée, à\ncondition qu’en tout point de chaque façade, la distance mesurée perpendiculairement à celle-ci et la\nséparant d’une façade d’un autre bâtiment, soit au moins égale à sa demi hauteur en tout point, sans\npouvoir être inférieure à 3 m soit : L = H/2 ≥ 3 m.\n8.2    Règles particulières\n8.2.1    Les installations nécessaires aux services publics ou d’intérêt collectif peuvent s’implanter soit\nen contiguïté, soit à une distance de 4 m minimum.\n8.2.2    Les annexes de moins de 15 m² d’emprise au sol et dont la hauteur totale n’excède pas\n2,60 m, ne sont pas assujetties aux prescriptions de l’article 8.1 et peuvent :\n    - S’implanter librement y compris s’accoler aux autres constructions, si les façades concernées ne\n    comportent pas de baie\nARTICLE UD 9 – Emprise au sol\n9.1    Dans l’ensemble de la zone\n9.1.1    Unité foncière dont la superficie est inférieure à 300 m² :\nLe coefficient d’emprise au sol de la totalité des constructions est fixé par la formule suivante :\n    Coefficient d’emprise au sol = 0,1 + (90 / S) ≤ 0,7\n    (S : superficie de l’unité foncière)\n    66","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n9.1.2   Unité foncière dont la superficie est supérieure à 300 m² :\nL’emprise au sol de la totalité des constructions ne doit pas excéder 40 % de la surface totale de l’unité\nfoncière (soit un coefficient d’emprise au sol égal à 0,4).\n9.2    Cas particuliers\n9.2.1    Dans le cas de constructions existantes à la date d’approbation du P.L.U., un dépassement de 5\n% de l’emprise au sol existante pourra être autorisé sur toute la hauteur du bâtiment, pour la réalisation\nde travaux destinés à l’amélioration du confort (tels ascenseur, escalier de secours, , mise aux normes,\nlocaux déchets ménagers, locaux vélos…), l’amélioration de la performance énergétique du bâtiment\n(isolation par l’extérieur) ou amélioration de l’accessibilité du bâtiment aux Personnes à Mobilité\nRéduite.\n9.2.2    Dans le cas des unités foncières de plus 225 m² situées à l’angle de plusieurs rues le\ncoefficient d’emprise au sol peut être majoré jusqu’à la valeur de 0,5 (soit une emprise au sol de 50 % de\nla surface de l’unité foncière).\nToutefois, cette possibilité ne peut être accordée que si elle se justifie par une meilleure insertion dans le\nsite.\n9.3    Les dispositions de l’article 9.1 ne s’appliquent pas aux unités foncières de plus de 180 m²\naccueillant des installations nécessaires aux services publics ou d’intérêt collectif pour lesquelles\nl’emprise au sol est limitée à 80% au rez-de-chaussée et à 60% pour les niveaux supérieurs.\n9.4    Les dispositions de l’article 9.1 ne sont pas applicables aux constructions à usage d’activités, pour\nlesquelles l’emprise au sol est portée à 60 %.\n    67","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UD 10 – Hauteur maximale des constructions\n10.1    Hauteur maximale\nLes constructions doivent respecter les caractéristiques suivantes :\n    Zones UDa - UDc    Zone UDb\n    Hauteur maximale à l’égout du toit ou à l’acrotère (définie    7m    9m\n    par rapport au terrain naturel)\n    Hauteur totale maximale au faîtage (définie par rapport au    10 m    12 m\n    terrain naturel)\nRègles particulières :\nLe long de la rue Pasteur où la hauteur totale maximale au faîtage autorisée est 12 m et la hauteur\nmaximale à l’égout ou à l’acrotère est de 10 m.\n10.2    Dépassements de la hauteur totale maximale autorisée dans l’ensemble de la zone\n10.2.1 Le dépassement de la hauteur totale maximale fixée, peut être accordé, lorsque la construction\ns’implante en contiguïté d’un bâtiment existant à la date d’approbation du PLU, dépassant cette hauteur,\nafin de réaliser une meilleure intégration dans la limite de l’héberge voisine la plus haute du bâtiment\nexistant contigu. Cette dérogation ne peut être autorisée que dans la limite de 50% du linéaire de la façade\nsur rue du bâtiment.\n10.2.2 Les dispositions de l’article 10.1 ne s’appliquent pas aux installations nécessaires aux services\npublics et d’intérêt collectif pour lesquels une hauteur maximale de 12 m est autorisée.\n10.2.3 Afin de prendre en compte les impératifs techniques des locaux commerciaux ou artisanaux en\npied d’immeuble et des équipements de service public et d’intérêt collectif, une bonification de 1 m de\nhauteur est accordée pour les constructions neuves en comportant. Cette bonification de hauteur porte\nuniquement sur la hauteur des locaux commerciaux et doit figurer sur les plans.\n10.3    Dépassements de la hauteur totale maximale autorisée en UDa et UDc\nLe dépassement des hauteurs fixées à l’article 10.1, peut être accordé dans la limite de 50% de l’emprise\nau sol autorisée à l’article 9, en cas d’aménagement de combles ou de création de combles de\nconstructions principales à usage d’habitation existantes.\nLe dépassement de la hauteur totale maximale est autorisé dans la limite de 9 mètres à l’égout du toit et\n12 mètres au faitage et sous réserve d’une bonne intégration au site urbain environnant.\n10.4    Dépassements de la hauteur totale maximale autorisée en UDa\nLa hauteur maximum autorisée dans le secteur UDa, à l’emplacement rue Franklin Roosevelt indiqué sur\nle document graphique, peut-être dépassée pour effectuer la liaison avec les bâtiments existants dans la\nlimite de leurs hauteurs.\n10.5    Règle particulière\nPour le terrain rue Worth indiqué au document graphique, concerné par la protection de la perspective\nvisuelle, la hauteur est limitée à 3,5 m maximum par rapport au niveau de la rue.\n    68","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\nARTICLE UD 11 – Aspect extérieur - Clôtures\nLe projet peut être refusé ou n’être accepté que sous réserve de l’observation de prescriptions spéciales si\nles constructions, par leur situation, leur architecture, leurs dimensions ou l’aspect extérieur des bâtiments\nou ouvrages à édifier ou à modifier, sont de nature à porter atteinte au caractère ou à l’intérêt des lieux\navoisinants, aux sites, aux paysages naturels ou urbains ainsi qu’à la conservation des perspectives\nmonumentales.\nToute construction, agrandissement, restauration ou aménagement d’immeuble devra prendre en compte\nle caractère du site de façon à s’harmoniser avec son environnement architectural et paysager (toitures,\nmatériaux…).\n11.1    Aspect extérieur\n11.1.1 Aspect des toitures\nLes toitures terrasses non-accessibles devront être végétalisées chaque fois que cela est possible. Les\ncouvertures d’aspect précaire sont interdites. Elles devront faire l’objet d’un traitement soigné.\n11.1.2 Volumes\n    -    Afin d’éviter les gaines en toitures, les dispositifs de type VMC inversée sont à privilégier. Les\n    ouvrages et locaux techniques tels que machineries d’ascenseurs, de réfrigération, sortie de\n    secours, gaines de ventilation doivent faire partie de la composition volumétrique d’ensemble et\n    ne pas être laissés apparents notamment dans le cas de toiture terrasse : usage de toiture\n    partielle, de dalle, ou de coffrage s’intégrant dans l’ensemble du bâti par exemple.\n    -    Les châssis oscillo-basculants devront être encastrés dans le plan de la toiture.\n11.1.3 Façades - Pignons\n    -    Les différents murs d’un bâtiment ou d’un ensemble de bâtiments doivent être traités avec le\n    même soin et en harmonie entre eux.\n    -    L’utilisation de matériaux de qualité pour les façades est recommandée.\n    -    L’emploi à nu de matériaux destinés à être recouverts, est interdit.\n    -    Les couleurs de matériaux de parement et des peintures extérieures devront s’harmoniser entre\n    elles.\n    -    Les antennes collectives et paraboliques sont interdites au même titre que les climatisations en\n    façade sur rue, et seront implantées sur les toitures ou sur les façades du bâtiment non visibles de\n    la rue.\nPour les constructions existantes : le caractère d’origine de la façade devra être préservé, notamment\nlorsqu’elle est composée de pierre de taille ou de briques soigneusement mises en œuvre.\nDans le secteur UDc, dans le cas de toiture à pente, le caractère d’origine de la toiture devra être\npréservé en cas de surélévation ou de redressement de toiture, dans le respect, toutefois, des articles du\nrèglement de zone.\nLes éléments d’ornementation existants (modénatures, corniches, volets, persiennes, ...) devront, dans la\nmesure du possible, être conservés et restaurés.\nPour les façades commerciales : la création de façades commerciales est autorisée dans les limites\nsuivantes :\n    - Les percements destinés à recevoir des vitrines devront s’adapter à l’architecture du bâtiment,\n    - Lorsqu’un même commerce est établi sur plusieurs immeubles contigus, les percements de\n    vitrine devront respecter les limites séparatives.\n    - La pose de capteurs solaires doit être étudiée, notamment au regard de la trame des ouvertures de\n    la façade, et afin de favoriser une intégration dans le plan de toiture ou en façade.\nSur le terrain rue Worth, concerné par la protection de la perspective au document graphique, une\npercée visuelle de 10m minimum doit etre aménagée pour la conservation des vues. Elle ne pourra\npas etre située sur les limites latérales.\n    69","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n11.2    Annexes, locaux techniques\n11.2.1 Extensions, garages, boxes\nLes bâtiments annexes doivent être conçus en harmonie de volumes et de matériaux avec les constructions\nexistantes. Les annexes réalisées avec des moyens de fortune tels que des matériaux de démolition,\nrécupération de matériaux destinés à être recouverts, utilisés à nu, sont interdits.\n11.2.2 Locaux techniques\n    -    Les coffrets, compteurs, boîtes aux lettres devront être intégrés dans les murs de construction.\n    -    Les locaux techniques y compris ceux destinés au stockage des conteneurs adaptés aux ordures\n    ménagères et au tri sélectif, devront être intégrés au bâti principal.\n    -    En cas d’impossibilité, ils seront réalisés dans une annexe qui prendra en compte le bâti annexe,\n    les constructions voisines, la structure végétale existante et les plantations à créer.\n11.3    Clôtures\n11.3.1 Clôtures sur les voies publiques ou privées\n    -    Les clôtures sur les voies publiques ou privée doivent être en harmonie avec la construction\n    principale.\n    -    Elles ne peuvent pas comporter de parties pleines d’une hauteur supérieure à 1,20 m à partir du\n    trottoir. La hauteur totale de la clôture ne peut être supérieure à 2 m. Sont préconisés les\n    dispositifs de clôtures suivants : un muret surmonté d’une grille avec piliers maçonnés doublé\n    d’un écran végétal. La partie supérieure peut être partiellement occultée. Dans ce cas, cette\n    occultation doit être réalisée au moyen d’un festonnage (toile découpée de la même couleur que\n    la grille et fixée sur la face interne des barreaux).\n    -    Les piliers des portails d’entrée et de clôture ne peuvent pas dépasser 2,20 m de hauteur.\n    -    Les différents portails d’une même propriété seront de même style architectural.\n    -    Pour les parcelles dont la largeur est inférieure ou égale à 6m et dans le cas où il est nécessaire\n    d’installer un système enroulant : la hauteur globale prenant en compte les piliers de portails\n    d’accès véhicules et les linteaux, est portée à 2,60m maximum.\n    -    Dans le cas de rue en pente, les hauteurs sont prises au milieu de chaque élément de clôture.\n    -    Toutefois, pour des raisons de sécurité, la hauteur totale des clôtures pourra être portée à 2,60 m\n    pour les installations nécessaires aux services publics ou d’intérêt collectif.\n    -    Les clôtures anciennes ayant un caractère architectural affirmé, devront être conservées et\n    restaurées avec les mêmes matériaux.\n11.3.2 Clôtures sur les limites séparatives\nLa hauteur totale de la clôture ne peut être supérieure à 2,60 m. Elles devront être aménagées de manière\nà laisser passer la faune.\n11.3.3 Dans le cas de terrain en pente, les hauteurs sont prises au milieu de chaque élément de clôture.\nLorsqu’il y a nécessité de créer un mur de soutènement, celui-ci peut constituer la partie pleine de la\nclôture jusqu’à concurrence de 1,20 m. Le reste doit être traité en talus.\n11.4    Les installations nécessaires aux services publics ou d’intérêt collectif ne sont pas assujettis aux\nlimitations de hauteur des clôtures de l’article 11.3.\nARTICLE UD 12 - Stationnement\nLe stationnement des véhicules, automobiles, motocycles et cycles correspondant aux besoins des\nconstructions et installations doit être assuré en dehors des voies publiques. A cet effet, il devra être\n    70","    P.L.U. de SURESNES approuvé par DCM du 26 septembre 2013 - Modifié en dernier lieu par DCT du 26 juin 2024\n    réalisé sur le terrain propre à l’opération des aires de stationnement dont les normes minimales sont\n    définies ci-après.\n    12.1    Caractéristiques applicables aux parcs de stationnement collectifs\n    Les rampes d’accès aux aires de stationnement en sous-sol ne doivent pas entraîner de modification dans\n    le niveau du trottoir. Leur pente dans les cinq premiers mètres à partir de l’alignement ne doit pas excéder\n    5 %, sauf impossibilité technique.\n    A titre indicatif, la surface moyenne par emplacement (dégagement compris) est de l’ordre de 25m² pour\n    les automobiles, 4m² pour les motos et 1m² pour les cycles.\n    Les places doubles sont autorisées uniquement pour les parcs de stationnement liées à un immeuble\n    d’habitation pour lequel le ratio de places directement accessibles est au moins d’une place par logement.\n    Largeurs minimales des rampes d’accès :\n    - Sens unique : 3,50 m\n    - Double sens desservant jusqu’à 70 voitures : 3,50 m\n    - Double sens desservant plus de 70 voitures : 6,00 m\n    12.2    Nombre d’emplacements applicables au stationnement collectifs et individuels\n    Pour le calcul des places de stationnement nécessaires à une opération, le nombre obtenu par l’application\n    des normes définies ci-dessous sera dans tous les cas arrondis au nombre entier immédiatement supérieur.\n    12.2.1 Constructions à usage d’habitat\nStationnement    Automobiles    Motocycles\n    Cycles\n    Local clos ou couvert dont la\nConstruction nouvelle    . 1 place mini par tranche de 150 m² surface de 1 place mini. pour superficie correspondra au minimum\n    plancher    10 logements    à 0,75 m²/logement jusqu’à 2 pièces\n    principales et 1,5 m²/logement de 3\n    . Avec 1 place mini. par logement    pièces principales et plus ou au\n    minimum une superficie de 3 m².\n    Cette règle s’applique à partir de trois\n    logements collectifs.\n    Local clos ou couvert dont la\nConstructions visées à    . 1 place par logement (article 46 de la loi du 29 1 place mini pour superficie correspondra au minimum\nl’article L151-35 du Code    juillet 1998).    10 logements.    à 1 m² / logement.\nde l’Urbanisme\n    Cette règle s’applique à partir de trois\n    logements collectifs.\nLogements sociaux :    Il n’est pas fait obligation de réaliser des aires de Non réglementé.    Non réglementé.\ntravaux
