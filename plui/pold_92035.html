LOMBES", "La zone UA a pour vocation d’être une zone mixte, accueillant, en plus de l’habitat,\ndifférentes fonctions : services, commerce, bureaux, ou équipements publics et d’intérêt\ncollectif, hébergement et notamment des personnes âgées. La Ville entend porter une\nattention toute particulière au maintien des activités industrielles, commerciales,\nartisanales et de services préexistantes.\nLa zone UA comprend un secteur UA a, essentiellement à vocation d’habitat individuel, dont\nles règles diffèrent aux articles 9, 10 et 13, un secteur UA b, à vocation d’activités\néconomiques, dans lequel s’implantent des bâtiments à destination autre que l’habitation,\ndont les règles diffèrent aux articles 1, 7 et 10, et un secteur UA c, à vocation de\nconstruction sociale accueillant ou non des populations spécifiques (résidence universitaire\nsociale, etc.), dont les règles diffèrent aux articles 6 et 7. Un secteur UA d, à vocation de\nmoyenne surface commerciale, de logement social et de résidence service notamment\ndédiées aux personnes âgées, dont les règles diffèrent aux articles 10 et 12. Un secteur\nUA e, à vocation d’équipements publics, dont les règles diffèrent aux articles 6 et 11. Un\nsecteur UA f, essentiellement à vocation d’habitat collectif, dans lequel s’implante du\nlogement social, dont la règle diffère à l’article 12.\nSur le secteur « Europe-Est », une servitude de « périmètre d’attente de projet\nd’aménagement global » (P.A.P.A.G) a été instituée, conformément à l’article L.151-41 5° du\nCode de l’Urbanisme, et pour une durée maximale de 5 ans à la date d’approbation de la\nmodification n°14, dans l’attente de la définition d’un projet de réaménagement et\nrestructuration dudit secteur aboutissant à l’instauration d’une ou plusieurs O.A.P. Cette\nservitude délimitée au sein du document graphique 4.8 ne peut avoir pour effet d'interdire\nles travaux ayant pour objet l'adaptation, le changement de destination, la réfection ou\nl'extension limitée des constructions existantes.\nARTICLE UA.1 - OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\nSont interdits :\n1.1    L’implantation et l’extension des installations classées soumises à autorisation sauf\n    celles mentionnées à l’article 2.\n1.2    Le changement de destination des locaux commerciaux et artisanaux situés sur\n    l’ensemble de l’unité foncière concernée le long des voies définies comme «\n    servitudes commerciales et artisanales » sur le document graphique 4.1.\n    L’interdiction de changement de destination ne s’applique pas aux équipements\n    publics.\n1.3    Les dépôts non couverts de ferrailles, de matériaux, de combustibles solides, ainsi\n    que les entreprises de cassage de voitures et la transformation de matériaux de\n    récupération.\n1.4    Les affouillements et exhaussements des sols nécessitant une autorisation au titre\n    de l’article R 442.2 du Code de l’urbanisme et qui ne sont pas nécessaires à des\n    travaux de construction.\n    PLAN LOCAL D’URBANISME    4\n    LA GARENNE-COLOMBES", "1.5    Le stationnement des caravanes et installations de camping soumises à autorisation\n    préalable à l’exception, le cas échéant, de l’aire d’accueil des gens du voyage.\n1.6    En UA b, les constructions nouvelles à destination d’habitation.\nARTICLE UA.2 - OCCUPATION    ET    UTILISATION    DU    SOL    ADMISES    SOUS\n    CONDITIONS PARTICULIERES\n2.1    Les installations classées, soumises à autorisation, sont autorisées à condition\n    qu’elles n’entraînent pour le voisinage aucune incommodité et, en cas d’accident ou\n    de fonctionnement défectueux, aucune insalubrité, ni sinistre susceptible de causer\n    des dommages graves ou irréparables aux personnes et aux biens.\n2.2    L’extension ou la transformation des installations classées existantes est\n    autorisée, à condition qu’il n’en résulte pas pour le voisinage une aggravation des\n    dangers ou nuisances liés au classement, et que toutes dispositions utiles soient\n    mises en œuvre pour l’intégration dans le milieu environnant.\n2.3    Le long des voies concernées par les « servitudes commerciales et artisanales » sur\n    le document graphique 4.1, les constructions nouvelles devront comporter des\n    locaux commerciaux ou artisanaux à rez-de-chaussée. Cet article ne s’applique pas\n    aux équipements publics. Les locaux commerciaux et artisanaux supprimés doivent\n    être reconstitués au sein de l’unité foncière.\n2.4    Pour les constructions existantes excédant l’emprise et la hauteur au sol autorisée,\n    les changements de destinations sont autorisés dans la limite de l’emprise et de la\n    hauteur existante à la date d’entrée en vigueur du PLU.\nRappel : Les constructions neuves à destination d'habitation, implantées le long des voies\nbruyantes, doivent respecter les règles d'isolement acoustique définies par l'arrêté\npréfectoral n°2000-174 du 29 juin 2000.\n2.5    Servitude en vue de la mixité sociale dans l’habitat\nEn application de l’article L.151- 15 du Code de l’urbanisme, une servitude est instituée en\nvue d’assurer le respect des objectifs de mixité sociale au sein des programmes de\nlogements.\nElle impose pour les programmes de logements qu’un pourcentage des logements soit affecté\naux logements locatifs sociaux au sens de l'article L.302-5 du Code de la construction et de\nl'habitation.\n-    Sur l’ensemble de la zone UA (à l’exception des secteurs spécifiques définis au\ndocument graphique 4.6) : dans tous les nouveaux programmes destinés à l’habitat de plus de\n800 m2 de surface de plancher, 30% du nombre de logements réalisés doivent être affectés\nau logement locatif social, nonobstant toute disposition contraire.\n    PLAN LOCAL D’URBANISME    5\n    LA GARENNE-COLOMBES", "Le nombre de logements locatifs sociaux au sens de l'article L.302-5 du Code de la\nconstruction et de l'habitation, ainsi calculé, sera arrondi à l’entier immédiatement inférieur.\n-    Sur les secteurs spécifiques définis au document graphique 4.6 : pour tous les\nnouveaux programmes de logements de plus de 800 m² de surface de plancher, 30% du\nnombre de logements réalisés doivent être affectés au logement locatif social, nonobstant\ntoute disposition contraire.\nLe nombre de logements locatifs sociaux au sens de l'article L.302-5 du Code de la\nconstruction et de l'habitation, ainsi calculé, sera arrondi à l’entier immédiatement inférieur.\nFont partie d’un même programme de logements au sens des dispositions qui précèdent les\nconstructions qui :\n- Soit forment entres elles un ensemble immobilier unique,\n- Soit sont réalisées concomitamment par le même et unique maître d’ouvrage sur des\nparcelles non contiguës, à condition que la distance qui les sépare n’excède pas 150 mètres.\nCette distance est mesurée entre leurs limites les plus proches avec la ou les voies publiques\nqui les bordent, parallèlement à (ou/aux) l’axe (s) de cette (ces) voie (s).\n2.6    Sur le secteur « Europe- Est », en application de la servitude de périmètre d’attente\nde projet d’aménagement global à l’article L.151-41 5° du Code de l’urbanisme, sont\ninterdits les constructions ou installations nouvelles d’une superficie supérieure à 100m² de\nsurface de plancher, et ce pour une durée maximale de 5 ans dans l’attente de l’approbation\nd’une ou plusieurs O.A.P visant à la restructuration et à la réorganisation des secteurs\nconcernés.\nPour les constructions déjà existantes à la date d’approbation de la modification n°14 du\nPLU, sont admis les travaux d’adaptation, de changement de destination ou de réfection.\nPour ces mêmes constructions (constructions déjà existantes à la date d’approbation de la\nmodification n°14 du PLU), les travaux d’extension sont limités à un maximum de 100 m² de\nsurface de plancher supplémentaire (non renouvelable), et ce pour une durée maximale de\n5 ans dans l’attente de l’approbation d’une ou plusieurs O.A.P visant à la restructuration et\nà la réorganisation des secteurs concernés.\nARTICLE UA.3 - ACCES ET VOIRIE\n3.1    Pour être constructible, un terrain doit être desservi par une voie publique ou\n    privée ou un accès (éventuellement obtenu par application de l’article 682 du Code\n    Civil) ouvert à la circulation automobile, de caractéristiques proportionnées à\n    l’importance de l’occupation ou de l’utilisation du sol envisagée.\n3.2    Les voies nouvelles se terminant en impasse doivent être aménagées de telle sorte\n    que les véhicules puissent faire demi-tour.\n    PLAN LOCAL D’URBANISME    6\n    LA GARENNE-COLOMBES", "ARTICLE UA.4 - DESSERTE PAR LES RESEAUX ET STOCKAGE DES DECHETS\n4.1    Eau\n    Toute construction ou installation nouvelle nécessitant une alimentation en eau doit\n    être raccordée au réseau public d’eau potable.\n4.2    Assainissement\n    Eaux usées – eaux vannes\n    Toute construction ou installation nouvelle doit être raccordée au réseau public\n    d’assainissement.\n    Jusqu’aux limites de propriété, les rejets doivent être réalisés par un réseau\n    séparatif.\n    L’évacuation des eaux résiduaires provenant des installations industrielles ou\n    artisanales doit faire l’objet d’un pré- traitement avant le rejet dans le réseau\n    public d’assainissement.\nRecommandations sur les eaux pluviales\n    De manière à limiter ces apports, tant d’un point de vue qualitatif que quantitatif,\n    des techniques alternatives aux réseaux devront être privilégiées (noues,\n    chaussées réservoirs, fossés drainant, bassins…).\n    En cas d’extension ou d’aménagement d’une construction existante, des dispositifs\n    appropriés peuvent être recherchés afin d’assurer la maîtrise des débits et\n    l’écoulement des eaux pluviales et de ruissellement, en se rapprochant des normes\n    édictées ci-dessous.\n    Eaux pluviales\n    Le débit généré par une construction neuve ou une reconstruction ne doit pas\n    excéder pour une pluie de retour décennal 2l/s/ha pour un rejet dans un réseau\n    unitaire.\n    En cas d’extension :\n    - si la construction existante présente un débit de rejet conforme (<2l/s/ha), le\n    débit de rejet de la construction après travaux doit être conforme.\n    - si la construction existante n’est pas conforme, le débit de rejet de la\n    construction après travaux ne doit pas être supérieur à celui de la construction\n    existante.\nRecommandations sur le stockage des déchets\n    Pour toute construction ou groupe de constructions supérieur à trois logements ou\n    à 200 m² S.P., un local destiné au stockage des conteneurs recueillant les ordures\n    ménagères nécessaire au tri sélectif doit être aménagé.\n    PLAN LOCAL D’URBANISME    7\n    LA GARENNE-COLOMBES", "    Nota : Le local de stockage devra être conforme au règlement communal en vigueur\n    et aux prescriptions de l’article 77 du règlement sanitaire départemental des\n    Hauts-de-Seine. Cet article est annexé au présent règlement.\n4.3    Réseaux câbles et télécommunications\n    Toute construction nouvelle doit prévoir les infrastructures nécessaires à la\n    distribution de ces réseaux depuis le point de raccordement général jusqu’à la limite\n    de parcelle.\n    Les branchements privatifs nécessaire à la distribution de ces réseaux doivent être\n    réalisés en souterrain jusqu’en limite du domaine public, et ne doivent pas rester\n    apparents sur la construction.\nARTICLE UA.5 - CARACTERISTIQUES DES TERRAINS\n    Sans objet.\nARTICLE UA.6 - IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX VOIES\nPUBLIQUES, AUX VOIES PRIVEES OUVERTES A LA CIRCULATION AUTOMOBILE ET\nAUX EMPRISES PUBLIQUES (PLACES, VOIES FERROVIAIRES, SQUARES ET MAILS\nPIETONNIERS)\nPrincipe général\nL’implantation d’un bâtiment s’apprécie par rapport à la projection au sol du bâtiment, hors\nsaillies. Des retraits partiels ou ponctuels sont acceptés, pour autant qu’ils n’excédent pas\n20 % du linéaire de façade concerné.\nDans le secteur UA c, les constructions peuvent être implantées en retrait de l’alignement.\nCe retrait ne pourra excéder celui des constructions contiguës.\n6.1    Implantation\n    Constructions existantes\n    6.1.1    Les travaux de modification de façade ou de surélévation d’un niveau, dont\n    l’implantation ne respecte pas les articles 6.1.2 et 6.1.3, peuvent être\n    autorisés à condition que ces transformations n’entraînent pas une\n    augmentation de l’emprise au sol dans la marge de reculement quand elle\n    existe.\n    Constructions nouvelles\n    6.1.2    Sur les grands axes\n    A l’exception des saillies, et en l’absence d’obligation de reculement\n    signalé sur le document graphique, les constructions doivent être\n    PLAN LOCAL D’URBANISME    8\n    LA GARENNE-COLOMBES", "    implantées à l’alignement actuel ou futur sur le Rond- Point du Souvenir\n    Français, sur le Rond- Point de l’Europe, sur l’avenue de l’Europe ; sur la\n    Place de Liberté, sur l’avenue du Général de Gaulle, sur la rue Voltaire\n    (entre la place de la Liberté et le Rond- Point du Souvenir Français), sur\n    le boulevard de la République, sur la Place de Belgique, sur l’avenue de\n    Verdun 1916 et le boulevard National sur la rue de l’Arrivée et la place de\n    la Gare de La Garenne-Colombes, y compris en retour sur les voies\n    adjacentes sur une longueur de 15 m maximum.\n6.1.3   Sur les autres voies\n    A l’exception des saillies, et en l’absence d’indication sur le document\n    graphique, les constructions doivent être implantées :\n    • A l’alignement actuel ou futur si les constructions existantes de part\n    et d’autre sont à l’alignement.\n    • Si pour l’un des terrains contigus, la construction existante est\n    implantée à l’alignement actuel ou futur et que sur l’autre elle est\n    implantée en retrait, la construction projetée peut être implantée :\n    -   à l’alignement actuel ou futur.\n    -   ou en retrait, sans pouvoir excéder 5 mètres.\n    • Si de part et d’autre, les constructions existantes sur les terrains\n    contigus sont implantées en retrait, la construction projetée doit être\n    implantée en retrait. Ce retrait, d’un maximum de 5 mètres, ne pourra\n    excéder celui des constructions situées de part et d’autre.\n    PLAN LOCAL D’URBANISME    9\n    LA GARENNE-COLOMBES", "PLAN LOCAL D’URBANISME   10\n LA GARENNE-COLOMBES", "    6.1.4    Les équipements publics et d’intérêt collectif peuvent être implantés :\n    - à l’alignement actuel ou futur.\n    - ou en retrait, sans pouvoir excéder 5 mètres.\n    Dans le sous-secteur UA e, les équipements publics peuvent être\n    implantés à l’alignement actuel ou futur ou en en retrait.\n6.2    Pans coupés\n    6.2.1 Règle générale\n    En l’absence d’indications particulières figurant sur le document graphique, les\n    propriétés situées à l’angle de deux voies supportent un alignement nouveau\n    constitué par un segment de droite de 7 m de longueur formant des angles égaux\n    avec chacun des alignements des voies adjacentes.\n    Cet article ne s’applique pas à l’intersection d’une voie publique et d’une voie privée\n    inférieure à 5 m.\n6.3    Saillies\n    6.3.1    Les saillies sur alignement :\n    6.3.1.1 Les saillies le long des voies communales de plus de 8 mètres\n    d’emprise, sont autorisées à la double condition :\n    • être situées à une hauteur supérieure ou égale à 5.50m du sol\n    mesurée au niveau du trottoir.\n    • avoir une profondeur maximale de 0.80m.\n    6.3.1.2 Les saillies le long des autres voies :\n    Le long des autres voies, il sera fait application du règlement du\n    gestionnaire de la voie correspondante.\n    6.3.2    Les saillies sur marge de reculement sont autorisées.\nARTICLE UA.7 - IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT\nAUX LIMITES SEPARATIVES\nPrincipe général\nL’implantation d’un bâtiment s’apprécie par rapport à la projection au sol du bâtiment, hors\nsaillies. Des retraits partiels ou ponctuels sont acceptés, pour autant qu’ils n’excédent pas\n20 % du linéaire de façade concerné.\n7.1    Par rapport aux limites séparatives joignant l’alignement\n    (cf. définitions)\n    PLAN LOCAL D’URBANISME    11\n    LA GARENNE-COLOMBES", "Constructions existantes\n7.1.1   La surélévation et l’extension d’un bâtiment existant peuvent être\n    autorisées :\n    • suivant les règles des constructions nouvelles.\n    Si ces règles ne peuvent pas être respectées :\n    • La surélévation d’un niveau et l’extension d’un bâtiment peuvent être\n    autorisées dans le prolongement des murs existants, à condition que\n    les façades créées ne respectant pas les prospects imposés ne\n    comportent pas de baies autres que des jours de souffrance.\nConstructions nouvelles\n7.1.2   Dans une bande de 15 m comptée à partir de l’alignement ou de la marge\n    de reculement imposée par les documents graphiques ou de la marge de\n    reculement choisie en application de l’article UA.6.1.3, la façade sur\n    rue des constructions doit être implantée de limite à limite.\n    Au-delà de la bande de 15 m comptée à partir de l’alignement ou de la\n    marge de reculement imposée par les documents graphiques ou de la\n    marge de reculement choisie en application de l’article UA.6.1.3, les\n    constructions peuvent être implantées :\n    a)    Sur les limites :\n    • Si elles s’adossent à un bâtiment de dimensions égales ou\n    supérieures existant sur le terrain voisin.\n    • Ou si elles ne sont pas affectées à l’habitation ou à une activité\n    industrielle ou de bureau, et que la hauteur maximum de la façade\n    sur limite ne dépasse pas 3,20 m.\n    En retrait des limites :\n    PLAN LOCAL D’URBANISME    12\n    LA GARENNE-COLOMBES", "    Dans ce cas, elles doivent s’écarter de ces limites conformément\n    aux règles définies au paragraphe 7.1.3.\n7.1.3    En cas d’implantation en retrait des limites séparatives, les\n    constructions doivent respecter simultanément les règles définies ci-\n    dessous :\nFaçades principales\nFaçades comportant des baies principales (cf. définitions)\n    La    distance    horizontale   à    la   limite   séparative,   mesurée\n    perpendiculairement en tout point d’une façade comportant des baies\n    principales, devra être au moins égale à la hauteur de cette façade, sans\n    pouvoir être inférieure à 6 m.\nFaçades secondaires\nFaçades ne comportant pas de baies principales (cf. définitions)\n    La    distance    horizontale   à   la   limite   séparative,    mesurée\n    perpendiculairement en tout point d’une façade comportant des baies\n    secondaires ou ne comportant pas de baies, devra être au moins égale à la\n    moitié de la hauteur de cette façade, sans pouvoir être inférieure à 3 m.\n    PLAN LOCAL D’URBANISME    13\n    LA GARENNE-COLOMBES", "7.1.4   Dans le secteur UA a\n    Construction existante\n    La surélévation et l’extension d’une construction existante peuvent être\n    autorisées :\n    • Suivant les règles applicables à la construction nouvelle.\n    Si ces règles ne peuvent pas être respectées :\n    La surélévation d’un niveau et l’extension d’une construction peuvent être\n    autorisées dans le prolongement des murs existants, à condition que les\n    façades créées ne respectant pas les prospects imposés ne comportent\n    pas de baies autres que des jours de souffrance.\n    Construction nouvelle\n    Dans une bande de 15 m comptée à partir de l’alignement imposé à\n    l’article UA.6.1.2 ou de la marge de reculement imposée par les\n    documents graphiques ou de la marge de reculement choisie en\n    application de l’article UA.6.1.3, les façades latérales de la construction\n    peuvent :\n    a) être implantées sur les limites à condition que les façades créées ne\n    respectant pas les prospects imposés ne comportent pas de baies\n    autres que des jours de souffrance.\n    b) être implantées en retrait des limites, dans ce cas, elles doivent\n    s’écarter de ces limites conformément aux règles définies à l’article\n    UA.7.1.3.\n    Au-delà de la bande de 15 m comptée à partir de l’alignement imposé à\n    l’article UA.6.1.2 ou de la marge de reculement imposée par les\n    documents graphiques ou de la marge de reculement choisie en\n    application de l’article UA.6.1.3, les façades latérales de la construction\n    doivent s’écarter de ces limites conformément aux règles définies à\n    l’article UA.7.1.3.\n    Toutefois, les façades latérales de la construction peuvent être\n    implantées sur les limites séparatives joignant l’alignement aux conditions\n    cumulatives suivantes :\n    -Si elles s’adossent à une construction existante et implantée sur le\n    terrain voisin,\n    -Si la ou les façades latérales de la construction nouvelle sont de\n    dimensions inférieures ou égales à la construction existante implantée sur\n    le terrain voisin,\n    -La construction s’insère dans l’héberge de la construction existante et\n    implantée sur le terrain voisin.\n    PLAN LOCAL D’URBANISME    14\n    LA GARENNE-COLOMBES", "    Pour l’application de cet article, la construction existante et implanté en\n    limite sur le terrain voisin à laquelle il est fait référence doit être en bon\n    état.\n7.1.5   Dans le secteur UA b\n    Dans une bande de 20 m comptée à partir de l’alignement ou du\n    reculement imposé, les constructions doivent être implantées sur les\n    limites séparatives joignant l’alignement.\n    Au-delà de la bande de 20 m comptée à partir de l’alignement ou du\n    reculement imposé, les constructions peuvent être implantées :\n    a)    Sur les limites :\n    • Si elles s’adossent à un bâtiment de dimensions égales ou\n    supérieures existant sur le terrain voisin.\n    • Ou si elles ne sont pas affectées à l’habitation ou à une activité\n    industrielle ou de bureau, et que la hauteur maximum de la façade\n    sur limite ne dépasse pas 3,20 m.\n    b)    En retrait des limites :\n    Dans ce cas, elles doivent s’écarter de ces limites conformément\n    aux règles définies au paragraphe 7.1.3.\n7.1.6   Dans le secteur UA c\n    Pour les constructions existantes, l’article 7.1.1 s’applique.\n    Pour les constructions nouvelles :\n    Dans une bande de 15 m comptée à partir de l’alignement ou de la marge\n    de reculement imposée par les documents graphiques, la façade sur rue\n    des constructions doit être implantée de limite à limite.\n    Au-delà de la bande de 15 m comptée à partir de l’alignement ou de la\n    marge de reculement imposée par les documents graphiques, les\n    constructions peuvent être implantées sur les limites séparatives ou en\n    retrait.\n    En cas d’implantation sur les limites séparatives, la façade sur la limite ne\n    peut comporter que des jours de souffrance.\n    En cas d’implantation en retrait des limites séparatives, la distance\n    mesurée perpendiculairement en tout point d’une façade comportant des\n    baies principales et/ou secondaires ou ne comportant pas de baies devra\n    être au moins égale à la moitié de la hauteur de cette façade, sans pouvoir\n    être inférieure à 3 mètres.\n    PLAN LOCAL D’URBANISME    15\n    LA GARENNE-COLOMBES", "7.2   Par rapport aux autres limites, dont celles de fond de parcelle\n    Constructions existantes\n    7.2.1   La surélévation et l’extension d’un bâtiment existant peuvent être\n    autorisées :\n    • suivant les règles des constructions nouvelles.\n    Si ces règles ne peuvent pas être respectées :\n    • La surélévation d’un niveau et l’extension d’un bâtiment peuvent être\n    autorisées dans le prolongement des murs existants, à condition que\n    les façades créées ne respectant pas les prospects imposés ne\n    comportent pas de baies autres que des jours de souffrance.\n    Constructions nouvelles\n    7.2.2 Les constructions peuvent être implantées :\n    a)    Sur les limites :\n    • Si elles s’adossent à un bâtiment de dimensions égales ou\n    supérieures existant sur le terrain voisin.\n    • Ou si elles ne sont pas affectées à l’habitation ou à une activité\n    industrielle ou de bureau, et que la hauteur maximum de la façade\n    sur limite ne dépasse pas 3,20 m.\n    b)    En retrait des limites :\n    Dans ce cas, elles doivent s’écarter de ces limites conformément\n    aux règles définies au paragraphe 7.1.3.\n    PLAN LOCAL D’URBANISME    16\n    LA GARENNE-COLOMBES", "7.2.3   Les constructions peuvent être implantées à une distance moindre que celle\n    définie ci-dessus lorsque le pétitionnaire et son voisin font application des\n    dispositions de l’article L 471-1 du Code de l’Urbanisme, sous réserve de\n    respecter la distance minimale fixée à l’article UA 8 avec les constructions\n    situées sur le terrain voisin.\n7.2.4   Dans le secteur UA a :\n    Construction existante\n    La surélévation et l’extension d’une construction existante peuvent être\n    autorisées :\n    • suivant les règles applicables à la construction nouvelle prévues à\n    l’article 7.1.4.\n    Si ces règles ne peuvent être respectées :\n    La surélévation d’un niveau ou l’extension d’une construction peuvent être\n    autorisées dans le prolongement des murs existants, à condition que les\n    façades créées ne respectant pas les prospects imposés ne comportent pas\n    de baies autres que des jours de souffrance.\n    Construction nouvelle\n    Les façades arrières ou latérales de la construction doivent s’écarter de ces\n    limites conformément aux règles définies à l’article UA.7.1.3.\n    Toutefois, pour une construction non affectée à l’habitation ou à une activité\n    industrielle ou de bureau, les façades arrière d’une construction peuvent être\n    PLAN LOCAL D’URBANISME    17\n    LA GARENNE-COLOMBES", "    implantées sur les autres limites, dont celles de fond de parcelle à condition\n    que leur hauteur maximum ne dépasse pas 3,20m.\n    7.2.5    Dans le secteur UA c :\n    Pour les constructions existantes, l’article 7.2.1 s’applique.\n    Les constructions nouvelles peuvent être implantées sur les limites\n    séparatives ou en retrait.\n    En cas d’implantation sur les limites séparatives, la longueur de la façade ne\n    doit pas dépasser 50% de la longueur de la limite du tènement foncier\n    concerné par les travaux sur laquelle elle s’appose et ne peut comporter que\n    des jours de souffrance.\n    En cas d’implantation en retrait des limites séparatives, la distance mesurée\n    perpendiculairement en tout point d’une façade comportant des baies\n    principales et/ou secondaires ou ne comportant pas de baies devra être au\n    moins égale à la moitié de la hauteur de cette façade, sans pouvoir être\n    inférieure à 3 mètres.\n    7.3    Les équipements publics et d’intérêt collectif peuvent être implantés :\n    a) soit en limite séparative pour autant que chaque façade concernée ne\n    comporte pas de baies autres que des jours de souffrance.\n    b) soit en retrait des limites séparatives. Dans ce cas, chaque façade\n    concernée doit, au minimum, s’écarter de ces limites conformément\n    aux dispositions du Code civil.\nARTICLE UA.8 - IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT\n    AUX AUTRES SUR UNE MEME PROPRIETE\n8.1    Constructions existantes\n    8.1.1    La surélévation et l’extension d’un bâtiment existant peuvent être\n    autorisées :\n    • suivant les règles des constructions nouvelles.\n    Si ces règles ne peuvent pas être respectées :\n    • La surélévation d’un niveau et l’extension d’un bâtiment peuvent être\n    autorisées dans le prolongement des murs existants, à condition que\n    les façades créées ne respectant pas les prospects imposés ne\n    comportent pas de baies autres que des jours de souffrance.\n    PLAN LOCAL D’URBANISME    18\n    LA GARENNE-COLOMBES", "8.2   Constructions nouvelles\n    8.2.1   A l’exception de la distance entre une construction principale et une\n    construction annexe (garage, remise, etc.), la construction de plusieurs\n    bâtiments non contigus, sur une même propriété, doit respecter les\n    dispositions suivantes :\n    La distance mesurée perpendiculairement en tout point de la façade doit\n    être au moins égale :\n     A la hauteur de la façade la plus haute (L ≥ H), avec un minimum de 6 m\n    si l’une des façades comporte des baies principales.\n    ou\n     A la moitié de la façade la plus haute (L ≥ H/2), avec un minimum de 3\n    m si les deux façades ne comportent pas de baies principales.\n    8.2.2   Pour l’application de l’article 8.2.1, deux constructions réunies par un\n    élément architectural ponctuel tel qu’un auvent ou une pergola (etc.) ne\n    sont pas considérées contiguës.\n    8.2.3   La distance mesurée perpendiculairement en tout point de la façade d’une\n    construction annexe (garage, remise, etc.) non contiguë à la construction\n    principale doit être au minimum de 3 mètres.\n    PLAN LOCAL D’URBANISME    19\n    LA GARENNE-COLOMBES", "ARTICLE UA.9 -    EMPRISE AU SOL\n9.1    En UA, en UA b, en UA c et UA d\n    Il n’est pas fixé d’emprise au sol.\n9.2    En UA a\n    L’emprise au sol des constructions ne peut excéder 50% de la surface du terrain.\n9.3    En cas de changement de destination, il convient de se reporter à l’article 2.5.\n9.4    Il n’est pas fixé de règle pour les équipements publics et d’intérêt collectif.\nARTICLE UA.10 - HAUTEUR MAXIMUM DES CONSTRUCTIONS\nLa hauteur des bâtiments est mesurée au point le plus haut du trottoir au droit de l’unité\nfoncière et doit respecter les règles suivantes :\n10.1    Règle de hauteur pour les grands axes\n    10.1.1 Principe général\n    Pour les constructions situées sur le Rond-Point du Souvenir Français, sur le Rond\n    - Point de l’Europe et l’Avenue de l’Europe, la Rue Voltaire (de la Place de la Liberté\n    au Rond-Point du Souvenir Français), Boulevard National, Boulevard de la\n    République, Place de Belgique, Avenue du Général de Gaulle, Avenue de Verdun 1916.\n    La hauteur maximum est de :\n    PLAN LOCAL D’URBANISME    20\n    LA GARENNE-COLOMBES", "•   19 m à l’égout ou 20 m à l’acrotère pour les toitures- terrasses.\n•   22 m au faîtage pour les toitures à pentes, les toitures « Mansart »\n    et les toitures des étages en attique.\n•   22 m pour les édicules sur toitures- terrasses.\n    PLAN LOCAL D’URBANISME    21\n    LA GARENNE-COLOMBES", "    10.1.2 En sous-secteur UA a, la hauteur des constructions ne peut excéder :\n    •   7 m à l’égout du toit ou 8 m à l’acrotère pour les toitures- terrasses\n    •   11 m au faîtage pour les toitures à pentes, les toitures « Mansard» et les\n    toitures des étages en attique.\n    •   11 m pour les édicules sur toitures- terrasses.\n    10.1.3 En sous-secteur UA d, le long du grand axe boulevard de la République, la\n    hauteur maximale est de :\n    • 20 m à l’égout ou à l’acrotère pour les toitures- terrasses.\n    • 25 m au faîtage pour les toitures à pentes, les toitures « Mansart » et les\n    toitures des étages en attique.\n    • 0.5 m de dépassement ponctuel pour les édicules en toiture.\n10.2   Règle de hauteur pour les autres voies\n    10.2.1 En UA, la hauteur des constructions ne peut excéder :\n    •    16 m à l’égout du toit ou 17 m à l’acrotère pour les toitures- terrasses.\n    •    19 m au faîtage pour les toitures à pentes et les toitures des étages\n    en attique.\n    •    19 m pour les édicules sur toitures- terrasses.\n    10.2.2 En UA a, hauteur des constructions ne peut excéder :\n    •    7 m à l’égout du toit ou 8 m à l’acrotère pour les toitures- terrasses\n    •    11 m au faîtage pour les toitures à pentes, les toitures «Mansard» et\n    les toitures des étages en attique.\n    •    11 m pour les édicules sur toitures- terrasses.\n    10.2.3 En UA b, la hauteur des constructions ne pourra excéder :\n    •    19 m à l’égout ou 20 m à l’acrotère pour les toitures- terrasses.\n    •    22 m au faîtage pour les toitures à pentes et les toitures des étages\n    en attique.\n    •    22 m pour les édicules sur toitures- terrasses.\n    10.2.4 En secteur UA d, le long de l’avenue Joffre, la hauteur maximale est de :\n    •    16 m à l’égout du toit ou 17 m à l’acrotère pour les toitures\n    terrasses.\n    •    19 m au faîtage pour les toitures à pentes et les toitures des étages\n    en attique.\n    •    9 m pour les édicules sur toitures- terrasses. »\n    10.2.2.1 Application de la règle 10.2.2 l’ensemble de la zone pour les\n    constructions existantes.\n    PLAN LOCAL D’URBANISME    22\n    LA GARENNE-COLOMBES", "Pour toute restructuration, extension et surélévation d’une construction existante\nà la date d’approbation de la modification n°7 du PLU, les hauteurs maximales sont\npar dérogation comptées à partir du niveau du plancher bas du rez-de-chaussée.\n10.2.2.2 Dépassement de la hauteur totale maximale autorisée dans l’ensemble\nde la zone pour les constructions neuves.\nUn dépassement des hauteurs fixées à l’article 10.2.2 peut être accordé lorsqu’un\nbâtiment s’implante en contiguïté d’un bâtiment existant à la date d’approbation de\nla modification n°7 du PLU dépassant ces hauteurs, sous réserve de ne pas porter\natteinte à la bonne insertion urbaine du projet.\nCe dépassement ne pourra excéder les hauteurs suivantes :\n    •    10 m à l’égout du toit ou 11 m à l’acrotère pour les toitures-terrasses.\n    •    14 m au faîtage pour les toitures en pentes, les toitures « Mansard »\n    ou toiture des étages en attique.\n    •    14 m pour les édicules sur toitures-terrasses.\n    PLAN LOCAL D’URBANISME    23\n    LA GARENNE-COLOMBES", "PLAN LOCAL D’URBANISME   24\n LA GARENNE-COLOMBES", "10.3   A l’exception des lucarnes disposées sur les rampants de toiture, la distance\n    horizontale de tout point de la façade (cf. définitions) projeté au point le plus\n    proche de l’alignement opposé, actuel ou futur, doit être au moins égale à la\n    différence d’altitude entre ces deux points (H ≤ L).\n10.4   A l’angle d’îlots délimités par des voies d’inégales largeurs, la hauteur maximum des\n    constructions édifiées en bordure de la voie la moins large peut être identique à\n    celle autorisée en bordure de la voie la plus large sur une distance au plus égale à\n    15 m comptée à partir de l'extrémité du pan coupé lorsqu’il est rendu obligatoire,\n    ou à partir de l’intersection des deux alignements en l’absence de pan coupé (suivant\n    croquis).\n    Illustration\n    PLAN LOCAL D’URBANISME    25\n    LA GARENNE-COLOMBES", "10.5   A l’exception des dispositifs de réception de signaux radioélectriques, et des\n    souches de cheminées dans la limite d’une hauteur de 50 centimètres au-dessus de\n    la hauteur plafond, aucun édicule ou équipement technique ne doit dépasser le\n    plafond autorisé. Ces édicules devront être intégrés au volume de la toiture.\n10.6   En cas de changement de destination, il convient de se reporter à l’article 2.5.\n10.7   Cas particulier des OAP.\n    Dans le cas où la construction est concernée par l’application d’une OAP (orientation\n    d’aménagement et de programmation), des hauteurs différentes pourront être\n    appliquées de manière tout à fait ponctuelle si elles sont identifiées expressément\n    dans le schéma de l’OAP.\nArticle UA.11 -    ASPECT EXTERIEUR\n11.1   Dispositions générales\n    11.1.1   Les bâtiments ou ouvrages à édifier ou à modifier ne doivent pas porter\n    atteinte au caractère ou à l’intérêt des lieux avoisinants.\n    11.1.2   En zone UA a les bâtiments et/ou les ouvrages à édifier et/ou à modifier\n    (surélévation, extension, ravalement…) ne doivent pas porter atteinte à\n    l’ambiance urbaine traditionnelle et originale.\n    Cette ambiance urbaine se caractérise notamment par :\n    - l’harmonie et l’osmose entre le bâti, son jardin et ses clôtures ;\n    - le séquençage et le rythme sur la rue enrichissants et qualifiants;\n    - la variété des perspectives urbaines\n    PLAN LOCAL D’URBANISME    26\n    LA GARENNE-COLOMBES", "    - les angles de rues parfois dégagés et aérés\n    - les sous-secteurs pavillonnaires de caractère homogène et continu\n    - le rôle écologique des masses vertes privées\n    - les ensembles d’habitation à taille humaine et largement végétalisés\n    - la qualité architecturale intrinsèque\n    Pour l’application de cet article, il est ici fait expressément renvoi à\n    l’Orientation d’Aménagement et de Programmation relative au Quartier\n    de La Garenne Centre et ses abords.\n    11.1.3   Traitement des façades\n    Dans le cas où la façade sur voie publique présente une longueur supérieure\n    à 30 m, les restaurations, reconstructions éventuelles et constructions\n    neuves doivent respecter, dans le jeu des façades, le rythme parcellaire\n    d’origine. Celui-ci est en moyenne de 20 m.\n11.2   Constructions existantes\n    11.2.1   Traitement des façades\n    Le caractère d’origine de la façade doit être préservé, notamment\n    lorsqu’elle est composée de pierres de taille ou de briques soigneusement\n    mises en œuvre.\n    Les matériaux destinés à être enduits doivent être recouverts. L’enduit\n    au mortier de ciment non teinté ou non peint est proscrit.\n    Les éléments d’ornementation existants (modénature, corniches, volets ou\n    persiennes etc.) doivent être conservés. Ils peuvent être restaurés.\n    11.2.2   Eclairement des combles\n    L’éclairement éventuel des combles doit être assuré, soit par des lucarnes,\n    soit par des verrières ou des châssis de toit.\n    Les lucarnes doivent être à deux ou trois versants ou semi-cylindriques et\n    suivre, dans la mesure du possible, l’axe des percements des étages\n    inférieurs. La largeur hors tout de la lucarne ne peut excéder la dimension\n    horizontale de la fenêtre située à l’étage inférieur.\n    11.2.3   Surélévation\n    Les surélévations et redressements de toiture des constructions\n    existantes doivent être traités en harmonie avec l’architecture et les\n    matériaux du bâtiment concerné.\n    PLAN LOCAL D’URBANISME    27\n    LA GARENNE-COLOMBES", "11.3   Constructions neuves\n    11.3.1   Pour les façades des constructions donnant sur les voies publiques ou\n    privées, doit être privilégié un choix de matériaux de qualité et pérennes\n    (stables dans la durée et nécessitant un faible entretien) tels que la\n    pierre, la brique, le métal, le verre, le béton architectonique, le bois…\n    11.3.2   Pour l’habitation, les fenêtres dont la largeur est supérieure à la hauteur\n    sont interdites.\n    11.3.3   Les façades latérales et postérieures des constructions y compris les\n    pignons rendus visibles lors de démolitions ainsi que les constructions\n    annexes (garages, appentis…) doivent être traitées comme les façades\n    principales et en harmonie avec elles.\n    11.3.4   Les matériaux utilisés pour le traitement des murs pignons devront être\n    de même aspect et de même teinte que les façades principales ; les\n    pignons pourront être traités en trompe-l’œil.\n    11.3.5   Les verrières et dispositifs solaires intégrés peuvent être implantés en\n    façade et en toiture, sous réserve de ne pas porter atteinte à l’esprit\n    général de la construction.\n    11.3.6   Aucun matériau destiné à être enduit ou recouvert d’un parement (tels\n    que les carreaux de plâtre, les bardages, les briques creuses, les\n    parpaings…) ne doit être laissé apparent.\n    11.3.7   Les enduits d’aspect rustique ou grossier, tels que l’enduit au mortier de\n    ciment non teinté ou non peint, sont proscrits.\n11.4   Toitures\n    11.4.1   Principe général\n    Qu’il s’agisse de toitures constituées de matériaux traditionnels (tuiles,\n    zinc, ardoises…) ou plus récents (bacs acier, tôles d’aluminium anodisées\n    ou laquées…) ou de terrasses, les accessoires à caractères technique\n    (caissons de climatisation, extracteurs, édicules d’ascenseur, garde-\n    corps, antennes…) doivent être regroupés et intégrés à la toiture de façon\n    à en annuler l’impact visuel.\n    11.4.2 Antennes\n    Les antennes d’émission ou de réception (radio, télévision, antenne\n    parabolique, radio- téléphone…), de quelque dimension que ce soit, doivent\n    être implantées exclusivement en toiture des bâtiments à une distance de\n    la façade au moins égale à leur hauteur et être de teinte identique à celle\n    de la toiture. Elles ne doivent pas être visibles depuis l’espace public.\n    PLAN LOCAL D’URBANISME    28\n    LA GARENNE-COLOMBES", "11.4.3 Toitures- terrasses\n    Toitures- terrasses non accessibles\n    Les toitures- terrasses non accessibles sont autorisées :\n    -    Pour l’extension des bâtiments existants ne comportant pas de toitures\n    en pentes,\n    -    Pour les bâtiments annexes d’une hauteur inférieure à 3,20 m (garage,\n    etc.),\n    -    Pour les équipements publics et d’intérêt collectif,\n    -    Pour les constructions à usage de bureaux,\n    -    Pour des raisons architecturales (intégration d’édicules techniques en\n    toiture, liaisons des volumes bâtis...), les toitures- terrasses non\n    accessibles sont autorisées jusqu’à 10% maximum de la surface\n    d’emprise au sol de la construction projetée.\n    Toitures- terrasses accessibles\n    -    Les toitures- terrasses accessibles sont autorisées :\n    -    Pour les équipements publics et d’intérêt collectif,\n    -    Pour les constructions à usage de bureaux.\n    -    Les toitures- terrasses accessibles sont autorisées sur les\n    constructions à rez-de-chaussée n’excédant pas 5 m de hauteur\n    situées à l’arrière et en continuité des bâtiments implantés sur rue.\n    Ces toitures- terrasses sont impérativement à traiter en « dalles\n    jardin » aménagées en espaces verts.\n    -    A l’exception de la « dalle jardin » définie ci avant, les toitures-\n    terrasses, directement accessibles de plain-pied (terrasses formant\n    toiture des étages inférieurs) et intégrées à la construction projetée\n    sont acceptées dans la limite de 50% des surfaces d’emprise au sol de\n    la construction projetée. En cas d’extension, les 50% prennent en\n    compte la surface existante plus celle de l’extension.\n    Les édicules sur toitures- terrasses\n    Les édicules sur toitures- terrasses doivent être implantés en retrait de\n    la façade d’une distance au moins égale à leur hauteur.\n11.4.4   Toitures en pente\n    Pour les constructions à usage d’habitation, les toitures en pente doivent :\n    • Présenter une pente minimum de 30%.\n    Ou\n    PLAN LOCAL D’URBANISME    29\n    LA GARENNE-COLOMBES", "    • Etre de type « Mansart » : dans ce cas, elles doivent s’inscrire dans un\n    arc de cercle conforme au croquis suivant :\n    Le terrasson doit comporter une pente de 10% minimum.\n    Ou\n    •    S’il s’agit d’un étage en attique, s’inscrire dans l’épure suivante :\n    Les percements et ouvertures inclus dans le volume des toitures (lucarnes,\n    souches, etc.) doivent être traités avec soin.\n11.5   Clôtures\n    11.5.1   Clôtures sur voies et emprises publiques\n    Les piliers de portail d’entrée et de clôture ne peuvent dépasser 2,20 m\n    de hauteur.\n    PLAN LOCAL D’URBANISME    30\n    LA GARENNE-COLOMBES", "    La clôture doit avoir une hauteur de 2m et comporter une partie pleine\n    (mur bahut) d’une hauteur comprise entre 0,80 et 1 m (mesurée au niveau\n    du trottoir). La partie supérieure de la clôture doit être constituée d’un\n    ensemble en serrurerie.\n    11.5.2   Les clôtures sur les autres limites ne doivent pas excéder une hauteur\n    totale de 2,60 m mesurée au niveau du trottoir.\n    11.5.3   Les règles ci-avant (11.5.1 et 11.5.2) ne sont pas applicables aux clôtures\n    entourant les équipements publics.\n11.6    Equipements liés aux énergies renouvelables\n    Pour les équipements publics existants, les équipements liés aux énergies\n    renouvelables (capteurs solaires, photovoltaïques, vérandas, serres et autres\n    éléments d’architecture bioclimatique) doivent-être intégrés et adaptés à la logique\n    architecturale des constructions et à l’environnement patrimonial.\n    Pour les constructions nouvelles d’équipement public, ces équipements feront partie\n    du projet architectural global du bâtiment qui sera apprécié en tant que tel.\n    Dans tous les cas :\n    - Pour les toitures à pentes, ils seront intégrés dans le pan de la toiture ;\n    - Pour les toitures plates, ils seront non visibles depuis l’espace public.\nARTICLE UA.12 - STATIONNEMENT\n12 .1: Règles applicables à l’ensemble des constructions à l’exception des\n    constructions et installations nécessaires aux services publics ou\n    d’intérêt collectif, lesquelles sont régies par l’article 12.2, ci-après.\n    12.1.1 Principes généraux :\n    Le stationnement des véhicules doit être assuré en dehors des voies publiques.\n    Les aires de stationnement pour les véhicules motorisés doivent être réalisées\n    obligatoirement en sous-sol sur le terrain d’assiette ou dans son environnement\n    immédiat.\n    80% des aires de stationnement pour les véhicules motorisés doivent avoir un accès\n    direct. Les places doubles auront une profondeur minimum de 9 m.\n    Les aires de stationnement pour les véhicules motorisés doivent être accessibles\n    en manœuvre d’entrée et de sortie depuis les voies de circulation.\n    Les rampes ne doivent pas entraîner de modification dans le niveau du trottoir. Leur\n    pente dans les 5 premiers mètres à partir de l’alignement ne doit pas excéder 5%,\n    PLAN LOCAL D’URBANISME    31\n    LA GARENNE-COLOMBES", "    sauf dans le cas d’impossibilité technique, sous réserve que l’implantation de la\n    rampe permette les manœuvres d’entrée et de sortie en toute sécurité.\n    Lors de toute opération de constructions neuves, les aires de stationnement pour\n    les véhicules motorisés et leurs accès doivent être réalisés conformément aux\n    normes françaises dont les dispositions sont mentionnées à l’annexe 6 du présent\n    règlement « normes de stationnement communes à toutes les zones ».\n    12.1.2 Nombre d’aires de stationnements pour les véhicules motorisés :\n    DESTINATION DES    EMPLACEMENTS\n    CONSTRUCTIONS\nHabitation    1-    Les logements locatifs financés avec un prêt aidé de\n    l’Etat :\n    -    En application des dispositions de l’alinéa n° 1 de\n    l’article L.151-35 du Code de l’urbanisme, il est exigé, lors de\n    la construction de logements locatifs financés avec un prêt\n    aidé par l’Etat, la réalisation d’une aire de stationnement par\n    logement.\n    -    En application des dispositions de l’alinéa n°2 de\n    l’article L.151-35 du Code de l’urbanisme, il est exigé, lors de\n    la construction de logements locatifs financés avec un prêt\n    aidé par l’Etat, la réalisation de 0,5 aire de stationnement par\n    logement si ces derniers sont situés à moins de cinq cents\n    mètres d’une gare ou d’une station de transport public guidé\n    ou de transport collectif en site propre et que la qualité de la\n    desserte le permet.\n    -    En secteur UA f, il est exigé, lors de la construction\n    de logements locatifs financés avec un prêt aidé par l’Etat, la\n    réalisation de 0,5 aire de stationnement par logement\n    2-    Les établissements assurant l’hébergement des\n    personnes âgées mentionnées au 6° du I de l’article L.312-\n    1 du Code de l’action sociale et les résidences universitaires\n    mentionnées à l’article L.631-12 du Code de la construction\n    et de l’habitation :\n    -    Pour les établissements assurant l’hébergement des\n    personnes âgées, mentionnés au 6° du I de l’article L.312-1 du\n    Code de l’action sociale, le nombre de places de stationnement\n    éventuellement nécessaire au fonctionnement et à la\n    fréquentation de ces établissements assurant l’hébergement\n    des personnes âgées mentionnées au 6 ° du I de l’article L. 312-\n    1 du Code de l’action sociale doit être apprécié notamment au\n    regard de leur mode de fonctionnement, de leurs besoins\n    propres , de leur situation sur le territoire communal, des\n    possibilités de desserte par les transports en commun ainsi\n    que de l’offre publique de stationnement disponible, existante\n    PLAN LOCAL D’URBANISME    32\n    LA GARENNE-COLOMBES", "    ou projetée, dans le secteur du projet sans pouvoir excéder 1\n    place par logement conformément aux dispositions de l’article\n    L. 151- 35 du Code de l’Urbanisme.\n    -    Pour les résidences universitaires mentionnées à\n    l’article L.631-12 du Code de la construction et de l’habitation,\n    le nombre de places de stationnement éventuellement\n    nécessaire au fonctionnement et à la fréquentation de ces\n    résidences universitaires mentionnées à l’article L. 631-12 du\n    Code de la construction et de l’habitation doit être apprécié\n    notamment au regard de leur mode de fonctionnement, de\n    leurs besoin propres , de leur situation sur le territoire\n    communal, des possibilités de desserte par les transports en\n    commun ainsi que de l’offre publique de stationnement\n    disponible, existante ou projetée, dans le secteur du projet\n    sans pouvoir excéder 1 place par logement conformément aux\n    dispositions de l’article L. 151- 35 du Code de l’urbanisme.\n    3-    Les autres catégories de logements :\n    -    Pour les autres catégories de logements, quand ils sont\n    situés à plus de cinq cents mètres d’une gare ou d’une station\n    de transport public guidé ou de transport collectif en site\n    propre, il est exigé la réalisation d’une aire de stationnement\n    par tranche de 50 m² SP (avec un minimum de 1 place par\n    logement ou chambre indépendante et un maximum de 3 places\n    par logement).\n    -    Pour les autres catégories de logements, quand ils sont\n    situés à moins de cinq cents mètres d’une gare ou d’une station\n    de transport public guidé ou de transport collectif en site\n    propre et dès lors que la qualité de la desserte le permet, il\n    est exigé la réalisation d’une aire de stationnement par\n    logement.\nBureaux    1 place par tranche de 65 m² de S.P.\n    Les normes de stationnement pour les bureaux sont réduites à\n    1 place/100 m² de S.P. dans un rayon de 300 m autour des\n    gares et des stations de tramway actuelles ou projetées,\n    distance appréciée à partir de leur entrée principale.\nCommerces\n- Entre 0 et 150 m² S.P.    Aucune place n’est exigée.\n- Entre 150 et 300 m² S.P.    1 place par tranche de 50 m² de S.P.\n    (2 places minimum).\n•   Entre 300 et 2 000 m² S.P.    1 place par tranche de 30 m² de S.P.\n•   Supérieur à 2 000 m² S.P.    1 place par tranche de 25 m² de S.P.\n    PLAN LOCAL D’URBANISME    33\n    LA GARENNE-COLOMBES", "    Dans un rayon de 300 m autour des gares et des stations de\n    tramway actuelles ou projetées, (distance appréciée à partir\n    de leur entrée principale), ces normes de stationnement sont\n    réduites à :\n•    Entre 150 et 300 m² S.P.\n•    Entre 300 m² et 2 000 m² S.P. 1 place par tranche de 75 m² de S.P.\n•    Supérieur à 2 000 m² S.P.    1 place par tranche de 50 m² de S.P.\n    1 place par tranche de 40 m² de S.P.\nIl est précisé que la règle ci-dessus relative aux obligations de stationnement pour les commerces\ns’applique par unité commerciale et non pour la surface commerciale totale créée dans une même\nopération.\nArtisanat, industrie, entrepôts\n    1 place pour 100 m² de S.P.\n    + aire de livraison au-delà de 200 m² S.P.\nHôtels    1 place pour 3 chambres.\n    Les résultats en nombre de places découlant des normes énoncées ci-dessus doivent être arrondis\n    à l’unité supérieure dès que la première décimale est supérieure ou égale à 5.\n    12.1.3 En application des dispositions de l’article L.151-31 du Code de l’urbanisme\n    les normes de réalisation de stationnement édictées à l’article 12.1.2 sont réduites\n    de 15 % en contrepartie de la mise à disposition de véhicules électriques munis d’un\n    dispositif de recharge adapté ou de véhicules propres en auto-partage.\n    12.1.4 Lorsque le bénéficiaire du permis ou de la décision de non-opposition à une\n    déclaration préalable ne peut pas satisfaire aux obligations résultant de l’article\n    12.1.2, il peut en être tenu quitte en justifiant pour les places qu’il ne peut réaliser\n    lui-même sur le terrain d’assiette ou dans son environnement immédiat :\n    • soit de l’obtention d’une concession à long terme dans un parc public de\n    stationnement existant ou en cours de réalisation et situé à proximité de\n    l’opération.\n    • soit de l’acquisition ou de la concession de places dans un parc privé de\n    stationnement existant ou en cours de réalisation et situé à proximité de\n    l’opération.\n    Lorsqu’une aire de stationnement a été prise en compte dans le cadre d’une\n    concession à long terme ou d’un parc privé de stationnement, elle ne peut plus être\n    prise en compte, en tout ou partie, à l’occasion d’une nouvelle autorisation.\n    12.1.5    En cas d’extension et/ou de surélévation supérieure à 20 m² S.P., le\n    nombre d’aires de stationnement à réaliser pour les véhicules motorisés\n    correspond aux besoins générés calculés selon les règles définies à\n    l’article 12.1.2.\n    PLAN LOCAL D’URBANISME    34\n    LA GARENNE-COLOMBES", "    12.1.6   En cas de changement de destination de locaux, le nombre d’aires de\n    stationnement à réaliser pour les véhicules motorisés correspond aux\n    besoins générés calculés selon les règles définies à l’article 12.1.2.\n    12.1.7   Toute place supprimée doit être recréée dans l’unité foncière.\n    12.1.8   Une aire de stationnement, au moins, doit être prévue pour les vélos à\n    raison :\n    • d'un emplacement de 0,50 m² par logement.\n    • d'un emplacement de 0,25 m² pour 100 m² de S.P. de bureau, de\n    commerce ou d’artisanat.\n12 .2: Règles applicables aux constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif\n    12.2.1   Principes généraux :\n    Le stationnement des véhicules motorisés doit être assuré en dehors des voies\n    publiques, en sous-sol ou en surface, soit sur le terrain d’assiette du projet, soit\n    dans son environnement immédiat.\n    80% des aires stationnement pour les véhicules motorisés doivent avoir un accès\n    direct. Les places doubles auront une profondeur minimum de 9 m.\n    Les aires de stationnement pour les véhicules motorisés doivent être accessibles\n    en manœuvre d’entrée et de sortie depuis les voies de circulation.\n    Les rampes ne doivent pas entraîner de modification dans le niveau du trottoir. Leur\n    pente dans les 5 premiers mètres à partir de l’alignement ne doit pas excéder 5%,\n    sauf dans le cas d’impossibilité technique, sous réserve que l’implantation de la\n    rampe permette les manœuvres d’entrée et de sortie en toute sécurité.\n    Lors de toute opération de constructions neuves, les aires de stationnement pour\n    les véhicules motorisés et leurs accès doivent être réalisés conformément aux\n    normes françaises dont les dispositions sont mentionnées à l’annexe 6 du présent\n    règlement « normes de stationnement communes à toutes les zones ».\n    12.2.2    Nombre d’aires de stationnement pour les véhicules motorisés\n  DESTINATION DES CONSTRUCTIONS    EMPLACEMENTS\nConstructions et installations nécessaires aux    Le nombre de places de stationnement\nservices publics ou d’intérêt collectif    éventuellement nécessaire au fonctionnement et à\n(crèche,   groupe    scolaire   maternel    et   la fréquentation des constructions et installations\nélémentaire, enseignement secondaire et    nécessaires aux services publics ou d’intérêt\nsupérieur,    centre    aquatique,   patinoire,   collectif doit être apprécié notamment au regard\nbibliothèque, médiathèque, cinéma, salle de    de la nature de l’équipement, de son mode de\nspectacle, hôpital, clinique, foyer de vie pour    fonctionnement, de sa situation sur le territoire\npersonnes handicapées, maison-relais, EHPAD,\n    PLAN LOCAL D’URBANISME    35\n    LA GARENNE-COLOMBES", "foyer de jeunes    travailleurs,   résidences communal, des possibilités de desserte par les\nservices etc.)    transports en commun ainsi que de l’offre publique\n    de stationnement disponible, existante ou projetée\n    dans le secteur du projet.\n    Cette offre publique de stationnement doit être\n    existante à la date de mise en service de\n    l’équipement.\n    Par dérogation aux principes généraux énoncés à\n    l’article 12.2.1 il peut être recouru en tant que de\n    besoin au stationnement sur la voie publique pour\n    les seuls stationnements de très courte durée\n    (type dépose-minute, etc.).\n    12.2.3 Toute place supprimée doit être remplacée.\n12.3: Règles applicables en secteur UA d\n    12.3.1   Principes généraux :\n    Le stationnement des véhicules motorisés doit être assuré en dehors des\n    voies publiques, en sous-sol ou en surface, soit sur le terrain d’assiette du\n    projet, soit dans son environnement immédiat.\n    80% des aires stationnement pour les véhicules motorisés doivent avoir\n    un accès direct. Les places doubles auront une profondeur minimum de 9\n    m.\n    Les aires de stationnement pour les véhicules motorisés doivent être\n    accessibles en manœuvre d’entrée et de sortie depuis les voies de\n    circulation.\n    Les rampes ne doivent pas entraîner de modification dans le niveau du\n    trottoir. Leur pente dans les 5 premiers mètres à partir de l’alignement\n    ne doit pas excéder 5%, sauf dans le cas d’impossibilité technique, sous\n    réserve que l’implantation de la rampe permette les manœuvres d’entrée\n    et de sortie en toute sécurité.\n    12.3.2   Nombre d’aires de stationnements pour les véhicules motorisés :\n    DESTINATION DES    EMPLACEMENTS\n    CONSTRUCTIONS\nLogement locatif social    Les logements locatifs financés avec un prêt aidé de l’Etat :\n    -    En application des dispositions de l’alinéa n° 1 de\n    l’article L.151-35 du Code de l’urbanisme, il est exigé, lors de\n    la construction de logements locatifs financés avec un prêt\n    PLAN LOCAL D’URBANISME    36\n    LA GARENNE-COLOMBES", "    aidé par l’Etat, la réalisation d’une aire de stationnement par\n    logement.\n    -    En application des dispositions de l’alinéa n°2 de\n    l’article L.151-35 du Code de l’urbanisme, il est exigé, lors de\n    la construction de logements locatifs financés avec un prêt\n    aidé par l’Etat, la réalisation de 0,5 aire de stationnement par\n    logement si ces derniers sont situés à moins de cinq cents\n    mètres d’une gare ou d’une station de transport public guidé\n    ou de transport collectif en site propre et que la qualité de la\n    desserte le permet.\nCommerces\n- Entre 0 et 150 m² S.P.    Aucune place n’est exigée.\n- Entre 150 et 300 m² S.P.    1 place par tranche de 50 m² de S.P.\n    (2 places minimum)\n•   Entre 300 et 2 000 m² S.P.    1 place par tranche de 30 m² de S.P.\n•   Supérieur à 2 000 m² S.P.    1 place par tranche de 25 m² de S.P.\n    Dans un rayon de 300 m autour des gares et des stations de\n    tramway actuelles ou projetées, (distance appréciée à partir\n    de leur entrée principale), ces normes de stationnement sont\n    réduites à :\n•   Entre 150 et 300 m² S.P.    1 place par tranche de 75 m² de S.P.\n•   Entre 300 m² et 2 000 m² S.P. 1 place par tranche de 50 m² de S.P.\n•   Supérieur à 2 000 m² S.P.    1 place par tranche de 40 m² de S.P.\nIl est précisé que l’application de la règle ci-dessus relative aux obligations de stationnement pour\nles commerces s’applique par unité commerciale et non pour la surface commerciale totale créée\ndans une même opération.\nAutres destinations    Le nombre de places de stationnement doit être apprécié\n    notamment au regard de la nature de la construction, de son\n    mode de fonctionnement, de sa situation sur le territoire\n    communal, des possibilités de desserte par les transports en\n    commun ainsi que de l’offre publique de stationnement\n    disponible, existante ou projetée dans le secteur de la\n    construction.\n    Cette offre publique de stationnement doit être existante à\n    la date de livraison de la construction.\n    Les résultats en nombre de places découlant des normes énoncées ci-dessus doivent\n    être arrondis à l’unité supérieure dès que la première décimale est supérieure ou\n    égale à 5.\n    12.3.3 En application des dispositions de l’article L.151-31 du Code de l’urbanisme les\n    normes de réalisation de stationnement édictées à l’article 12.3.2 sont\n    réduites de 15 % en contrepartie de la mise à disposition de véhicules\n    électriques munis d’un dispositif de recharge adapté ou de véhicules propres\n    en auto-partage.\n    PLAN LOCAL D’URBANISME    37\n    LA GARENNE-COLOMBES", "    12.3.4 Lorsque le bénéficiaire du permis ou de la décision de non-opposition à une\n    déclaration préalable ne peut pas satisfaire aux obligations résultant de\n    l’article 12.3.2, il peut en être tenu quitte en justifiant pour les places qu’il ne\n    peut réaliser lui-même sur le terrain d’assiette ou dans son environnement\n    immédiat :\n    • soit de l’obtention d’une concession à long terme dans un parc public de\n    stationnement existant ou en cours de réalisation et situé à proximité de\n    l’opération.\n    • soit de l’acquisition ou de la concession de places dans un parc privé de\n    stationnement existant ou en cours de réalisation et situé à proximité de\n    l’opération.\n    Lorsqu’une aire de stationnement a été prise en compte dans le cadre d’une\n    concession à long terme ou d’un parc privé de stationnement, elle ne peut plus\n    être prise en compte, en tout ou partie, à l’occasion d’une nouvelle autorisation.\n    12.3.5    En cas d’extension et/ou de surélévation supérieure à 20 m² S.P., le\n    nombre d’aires de stationnement à réaliser pour les véhicules motorisés\n    correspond aux besoins générés calculés selon les règles définies à\n    l’article 12.3.2.\n    12.3.6    En cas de changement de destination de locaux, le nombre d’aires de\n    stationnement à réaliser pour les véhicules motorisés correspond aux\n    besoins générés calculés selon les règles définies à l’article 12.3.2.\n    12.3.7    Toute place supprimée doit être recréée dans l’unité foncière.\n    12.3.8    Une aire de stationnement, au moins, doit être prévue pour les vélos à\n    raison :\n    • d'un emplacement de 0,50 m² par logement.\n    • d'un emplacement de 0,25 m² pour 100 m² de S.P. de bureau, de\n    commerce ou d’artisanat. »\nARTICLE UA.13 - ESPACES LIBRES ET PLANTATIONS\n13.1    Déduction faite des circulations, cheminements et aires de stationnement rendues\n    obligatoires par l’article 12, 60% des étendues libres de toute construction en\n    élévation doivent être traitées en espaces paysagers plantés sur 60 cm de terre\n    végétale minimum.\n    Toutefois, les étendues libres des équipements publics et des équipements\n    d’intérêt collectif (cf. définitions) peuvent faire l’objet d’un aménagement minéral.\n13.2    En zone UA a, pour une construction existante sur une unité foncière d’une\n    superficie inférieure ou égale à 250 m², 15 % au moins de la superficie du terrain\n    seront traités en espace paysager de pleine terre.\n    PLAN LOCAL D’URBANISME    38\n    LA GARENNE-COLOMBES", "    En zone UA a, pour une construction existante sur une unité foncière d’une\n    superficie supérieure à 250 m2, 50% au moins de la superficie du terrain seront\n    traités en espace paysager de pleine terre.\n    En zone UA a, pour toute construction nouvelle, 50% au moins de la superficie du\n    terrain seront traités en espace vert de pleine terre.\n    Pour l’application de cet article, il sera pris en compte l’assiette foncière d’origine\n    à la date d’approbation de la modification n°14 du PLU.\n    Toutefois, les étendues libres des équipements publics et des équipements\n    d’intérêt collectif (cf. définitions) peuvent faire l’objet d’un aménagement minéral.\nIl est rappelé que conformément à l’article R 431-9 du Code de l’Urbanisme, les projets de\nconstructions doivent être accompagnés d’un plan comportant le relevé des plantations\nexistantes, à abattre et à créer. Dans ce cadre, les projets de construction doivent\nrespecter le principe de la conservation au maximum des espaces paysagers existants, en\nparticulier les arbres.\nTout arbre abattu doit être remplacé par un arbre répondant aux conditions cumulatives\nsuivantes :\n- de même essence ou d’une essence susceptible de redonner une valeur paysagère\néquivalente ;\n- de même port ;\n- de même développement futur.\nTout ou partie d’espace paysager supprimé doit être reconstitué sur le terrain d’assiette du\nprojet.\n13.3    En limite de terrain, le niveau fini des espaces verts à rez-de-chaussée ne peut\n    être supérieur au niveau du terrain voisin.\n13.4    Toute construction à édifier devra sauvegarder et mettre en valeur les arbres\n    inscrits au document graphique comme étant à protéger. Ces arbres remarquables\n    sont repérés par un point vert.\nARTICLE UA.14 - COEFFICIENT D’OCCUPATION DU SOL\nSans objet.\n    PLAN LOCAL D’URBANISME    39\n    LA GARENNE-COLOMBES", "    ZONE UE\nPLAN LOCAL D’URBANISME   40\n LA GARENNE-COLOMBES", "La zone UE a pour vocation la préservation et la mise en valeur du tissu pavillonnaire ainsi\nque l’ambiance urbaine traditionnelle et originale qui la caractérise sans obérer pour autant\nle nécessaire renouvellement urbain sur cette zone.\nElle permet aussi de recevoir, en complément de l’habitat, les activités telles que commerce,\nartisanat, services, équipements d’intérêt collectif. La Ville entend porter une attention\ntoute particulière au maintien des activités industrielles, commerciales, artisanales et de\nservices préexistantes.\nLa zone UE comprend un sous-secteur UEa à vocation d’équipements publics dont les règles\ndiffèrent aux articles 6, 7 et 11 pour la construction de ces équipements publics.\nLa zone UE comprend un sous-secteur UEb, à vocation d’activités économiques et selon les\ndispositions des OAP le cas échéant, dans lequel s’implantent des bâtiments à destination\nautre que l’habitation, dont les règles diffèrent à l’article 1.\nSur le secteur « Europe-Est », une servitude de « périmètre d’attente de projet\nd’aménagement global » (P.A.P.A.G) a été instituée, conformément à l’article L.151-41 5° du\nCode de l’Urbanisme, et pour une durée maximale de 5 ans à la date d’approbation de la\nmodification n°14, dans l’attente de la définition d’un projet de réaménagement et\nrestructuration dudit secteur aboutissant à l’instauration d’une ou plusieurs O.A.P. Cette\nservitude délimitée au sein du document graphique 4.8 ne peut avoir pour effet d'interdire\nles travaux ayant pour objet l'adaptation, le changement de destination, la réfection ou\nl'extension limitée des constructions existantes.\nARTICLE UE.1 - OCCUPATION ET UTILISATION DU SOL INTERDITES\nSont interdits :\n1.1    Les constructions à destination industrielle.\n1.2    L’implantation et l’extension des installations classées soumises à autorisation sauf\n    celles mentionnées à l’article 2.\n1.3    Le changement de destination des locaux commerciaux et artisanaux situés sur\n    l’ensemble de l’unité foncière concernée le long des voies définies comme «\n    servitudes commerciales et artisanales » sur le document graphique 4.1.\n    L’interdiction de changement de destination ne s’applique pas aux équipements\n    publics.\n1.4    Les dépôts non couverts de ferrailles, de matériaux, de combustibles solides, ainsi\n    que les entreprises de cassage de voitures et la transformation de matériaux de\n    récupération.\n1.5    Les affouillements et exhaussements des sols nécessitant une autorisation au titre\n    de l’article R 442.2 du Code de l’Urbanisme et qui ne sont pas nécessaires à des\n    travaux de construction.\n    PLAN LOCAL D’URBANISME    41\n    LA GARENNE-COLOMBES", "1.6    Le stationnement des caravanes et installations de camping soumises à autorisation\n    préalable.\n1.7    En sous-secteur UEb, les constructions nouvelles à destination d’habitation.\nARTICLE UE.2 - OCCUPATION    ET   UTILISATION    DU    SOL    ADMISES    SOUS\n    CONDITIONS PARTICULIERES\n2.1    Les installations classées, soumises à autorisation, sont autorisées à condition\n    qu’elles n’entraînent pour le voisinage aucune incommodité et, en cas d’accident ou\n    de fonctionnement défectueux, aucune insalubrité, ni sinistre susceptible de causer\n    des dommages graves ou irréparables aux personnes et aux biens.\n2.2    L’extension ou la transformation des installations classées existantes est\n    autorisée, à condition qu’il n’en résulte pas pour le voisinage une aggravation des\n    dangers ou nuisances liés au classement, et que toutes dispositions utiles soient\n    mises en œuvre pour l’intégration dans le milieu environnant.\n2.3    Pour les constructions existantes excédant l’emprise et la hauteur au sol autorisée,\n    les changements de destinations sont autorisés dans la limite de l’emprise et de la\n    hauteur existante à la date d’entrée en vigueur du PLU.\nRappel : Les constructions neuves à destination d'habitation, implantées le long des voies\nbruyantes, doivent respecter les règles d'isolement acoustique définies par l'arrêté\npréfectoral n°2000-174 du 29 juin 2000.\n2.5    Servitude en vue de la mixité dans l’habitat\n    En application de l’article L.151- 15 du Code de l’urbanisme, une servitude est\n    instituée en vue d’assurer le respect des objectifs de mixité sociale au sein des\n    programmes de logements.\n    Elle impose pour les programmes de logements qu’un pourcentage des logements soit\n    affecté aux logements locatifs sociaux au sens de l'article L.302-5 du Code de la\n    construction et de l'habitation.\n    Sur les secteurs définis sur le document graphique 4.6 : pour tous les nouveaux\n    programmes de logements de plus de 800 m² SP, 30% du nombre de logements\n    réalisés doivent être affectés aux logements locatifs sociaux.\n    Le nombre de logements locatifs sociaux au sens de l’article L.302-5 du Code de la\n    construction et de l’habitation, sera arrondi à l’entier immédiatement inférieur.\n2.6    Secteurs de majoration\n    Au titre de l’article L.127-1 du code de l’urbanisme, au sein des secteurs identifiés\n    sur le document graphique 4.6, les programmes de logements comportant des\n    logements locatifs sociaux au sens de l'article L.302-5 du code de la construction et\n    PLAN LOCAL D’URBANISME    42\n    LA GARENNE-COLOMBES", "    de l'habitation, bénéficient d'une majoration du volume constructible tel qu'il\n    résulte des règles relatives à la hauteur. Les éléments mentionnés à l’article 10.7\n    devront être respectés.\n2.7   Sur le secteur « Europe- Est », en application de la servitude de périmètre d’attente\n    de projet d’aménagement global à l’article L.151-41 5° du Code de l’urbanisme, sont\n    interdits les constructions et installations nouvelles d’une superficie supérieure à\n    100m² de surface de plancher, et ce pour une durée maximale de 5 ans dans l’attente\n    de l’approbation d’une ou plusieurs O.A.P visant à la restructuration et à la\n    réorganisation des secteurs concernés.\nARTICLE UE.3 - ACCES ET VOIRIE\n3.1    Pour être constructible, un terrain doit être desservi par une voie publique ou\n    privée ou un accès (éventuellement obtenu par application de l’article 682 du Code\n    Civil) ouvert à la circulation automobile, de caractéristiques proportionnées à\n    l’importance de l’occupation ou de l’utilisation du sol envisagée.\n3.2    Les voies nouvelles se terminant en impasse doivent être aménagées de telle sorte\n    que les véhicules puissent faire demi-tour.\nARTICLE UE.4 - DESSERTE PAR LES RESEAUX ET STOCKAGE DES DECHETS\n4.1    Eau\n    Toute construction ou installation nouvelle nécessitant une alimentation en eau doit\n    être raccordée au réseau public d’eau potable.\n4.2    Assainissement\n    Eaux usées – eaux vannes\n    Toute construction ou installation nouvelle doit être raccordée au réseau public\n    d’assainissement.\n    Jusqu’en limite de propriété, les rejets doivent être réalisés par un réseau\n    séparatif.\n    L’évacuation des eaux résiduaires provenant des installations industrielles ou\n    artisanales doit faire l’objet d’un pré traitement avant le rejet dans le réseau public\n    d’assainissement.\nRecommandations sur les eaux pluviales\n    De manière à limiter ces apports, tant d’un point de vue qualitatif que quantitatif,\n    des techniques alternatives aux réseaux devront être privilégiées (noues,\n    chaussées réservoirs, fossés drainant, bassins…).\n    PLAN LOCAL D’URBANISME    43\n    LA GARENNE-COLOMBES", "    En cas d’extension ou d’aménagement d’une construction existante, des dispositifs\n    appropriés peuvent être recherchés afin d’assurer la maîtrise des débits et\n    l’écoulement des eaux pluviales et de ruissellement, en se rapprochant des normes\n    édictées ci-dessous.\n    Eaux pluviales\n    Le débit généré par une construction neuve ou une reconstruction ne doit pas\n    excéder pour une pluie de retour décennal 2l/s/ha pour un rejet dans un réseau\n    unitaire.\n    En cas d’extension :\n    - si la construction existante présente un débit de rejet conforme (<2l/s/ha), le\n    débit de rejet de la construction après travaux doit être conforme.\n    - si la construction existante n’est pas conforme, le débit de rejet de la\n    construction après travaux ne doit pas être supérieur à celui de la construction\n    existante.\nRecommandations sur le stockage des déchets\n    Pour toute construction ou groupe de construction supérieur à trois logements ou\n    à 200 m² S.P., un local destiné au stockage des conteneurs recueillant les ordures\n    ménagères nécessaire au tri sélectif doit être aménagé.\n    Nota : Le local de stockage devra être conforme au règlement communal en vigueur\n    et aux prescriptions de l’article 77 du règlement sanitaire départemental des\n    Hauts-de-Seine. Cet article est annexé au présent règlement.\n4.3    Réseaux câbles et télécommunications\n    Toute construction nouvelle doit prévoir les infrastructures nécessaires à la\n    distribution de ces réseaux depuis le point de raccordement général jusqu’à la limite\n    de parcelle.\n    Les branchements privatifs nécessaire à la distribution de ces réseaux doivent être\n    réalisés en souterrain jusqu’en limite du domaine public, et ne doivent pas rester\n    apparents sur la construction.\nARTICLE UE.5 - CARACTERISTIQUES DES TERRAINS\n    Sans objet.\n    PLAN LOCAL D’URBANISME    44\n    LA GARENNE-COLOMBES", "ARTICLE UE.6 - IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX VOIES\n    PUBLIQUES, AUX VOIES PRIVEES OUVERTES A LA CIRCULATION\n    AUTOMOBILE ET AUX EMPRISES PUBLIQUES (PLACES, VOIES\n    FERROVIAIRES, SQUARES ET MAILS PIETONNIERS)\nPrincipe général\nL’implantation d’un bâtiment s’apprécie par rapport à la projection au sol du bâtiment, hors\nsaillies. Des retraits partiels ou ponctuels sont acceptés, pour autant qu’ils n’excédent pas\n20 % du linéaire de façade concerné.\n6.1    Implantation\n    Constructions existantes\n    6.1.1    Les travaux de modification de façade ou de surélévation d’un niveau, dont\n    l’implantation ne respecte pas l’article 6.1.2, peuvent être autorisés à\n    condition que ces transformations n’entraînent pas une augmentation de\n    l’emprise au sol dans le reculement quand elle existe.\n    Constructions nouvelles\n    6.1.2    Sur les axes suivants :\n    A l’exception des saillies, les constructions doivent être implantées à\n    l’alignement le long des rues suivantes :\n    •   Rue Hérold.\n    •   Rue Martin Bernard (entre Médéric et Châteaudun).\n    •   Rue de Châteaudun (uniquement dans sa partie bordant la Place de la\n    Liberté.\n    6.1.3    Sur les autres voies\n    •   A l’exception des annexes (ex : boxes, locaux poubelles, dispositifs de\n    récupération des eaux pluviales, etc.) et des clôtures, aucune\n    occupation du sol ni du sous-sol n’est autorisée à moins de 6 m de l’axe\n    des voies.\n    •   A l’exception des annexes (ex : boxes, locaux poubelles, dispositifs de\n    récupération des eaux pluviales, etc.) et des clôtures, aucune\n    occupation du sol ni du sous-sol n’est autorisée à moins de 5 m de\n    l’alignement.\n    PLAN LOCAL D’URBANISME    45\n    LA GARENNE-COLOMBES", "    6.1.4    Dans le sous-secteur UEa, les équipements publics peuvent être\n    implantés :\n    - à l’alignement actuel ou futur,\n    - ou en retrait, sans pouvoir excéder 5 mètres.\n    Des retraits partiels ou ponctuels au-delà de cinq mètres sont acceptés pour\n    autant qu’ils n’excèdent pas 20% du linéaire de façade concerné.\n6.2   Pans coupés\n    6.2.1 Règle générale\n    En l’absence d’indications particulières figurant sur le document graphique, les\n    propriétés situées à l’angle de deux voies supportent un alignement nouveau\n    constitué par un segment de droite de 7 m de longueur formant des angles égaux\n    avec chacun des alignements des voies adjacentes.\n    Cet article ne s’applique pas à l’intersection d’une voie publique et d’une voie privée\n    inférieure à 5 m.\n6.3   Saillies\n    6.3.1    Les saillies sur alignement :\n    6.3.1.1 Les saillies le long des voies communales de plus de 8 mètres\n    d’emprise, sont autorisées à la double condition :\n    • être situées à une hauteur supérieure ou égale à 5.50 m du sol\n    mesurée au niveau du trottoir.\n    • avoir une profondeur maximale de 0.80 m.\n    6.3.1.2 Les saillies le long des autres voies :\n    Le long des autres voies, il sera fait application du règlement du\n    gestionnaire de la voie correspondante.\n    PLAN LOCAL D’URBANISME    46\n    LA GARENNE-COLOMBES", "    6.3.2    Les saillies sur marge de reculement sont autorisées.\nARTICLE UE.7 - IMPLANTATION    DES    CONSTRUCTIONS    PAR   RAPPORT    AUX\n    LIMITES SEPARATIVES\nPrincipe général\nL’implantation d’un bâtiment s’apprécie par rapport à la projection au sol du bâtiment, hors\nsaillies. Des retraits partiels ou ponctuels sont acceptés, pour autant qu’ils n’excédent pas\n20 % du linéaire de façade concerné.\n7.1    Par rapport aux limites séparatives joignant l’alignement (cf. définitions)\n    7.1.1    Construction existante\n    La surélévation et l’extension d’un bâtiment existant peuvent être\n    autorisées :\n    La surélévation et l’extension d’une construction existante peuvent être\n    autorisées :\n    • suivant les règles applicables aux constructions nouvelles.\n    Si ces règles ne peuvent pas être respectées :\n    La surélévation d’un niveau et l’extension d’une construction peuvent être\n    autorisées dans le prolongement des murs existants, à condition que les\n    façades créées ne respectant pas les prospects imposés ne comportent\n    pas de baies autres que des jours de souffrance.\n    7.1.2    Construction nouvelle\n    Dans une bande de 15 m comptée à partir de l’alignement imposé à\n    l’article UE.6.1.2 ou de la marge de reculement imposée à l’article\n    UE.6.1.3, les façades latérales de la construction peuvent :\n    a)    être implantées sur les limites à condition que les façades créées ne\n    respectant pas les prospects imposés ne comportent pas de baies autres\n    que des jours de souffrance.\n    b) être implantées en retrait des limites, dans ce cas, elles doivent\n    s’écarter de ces limites conformément aux règles définies à l’article\n    UE.7.1.3.\n    Au-delà de la bande de 15 m comptée à partir de l’alignement imposé\n    à l’article UE.6.1.2 ou de la ma
