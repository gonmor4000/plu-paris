rge de reculement imposée à l’article\n    UE.6.1.3, les façades latérales de la construction doivent s’écarter des\n    limites conformément aux règles définies à l’article UE.7.1.3.\n    Toutefois, les façades latérales de la construction peuvent être\n    implantées sur les limites aux conditions cumulatives suivantes :\n    PLAN LOCAL D’URBANISME    47\n    LA GARENNE-COLOMBES", "    -    si elles s’adossent à une construction existante et implantée sur le\n    terrain voisin,\n    -    si la ou les façades latérales de la construction sont de dimensions\n    inférieures ou égales à la construction existante et implanté sur le\n    terrain voisin,\n    -    la construction s’insère dans l’héberge de la construction existante\n    et implantée sur le terrain voisin.\n    Pour l’application de cet article, la construction existante et implanté en\n    limite sur le terrain voisin à laquelle il est fait référence doit être en\n    bon état.\n7.1.3    En cas d’implantation en retrait des limites, les constructions, à\n    l’exception des saillies, doivent respecter simultanément les règles\n    définies ci-après :\nFaçades principales\nFaçades comportant des baies principales (cf. définitions)\n    La    distance    horizontale   à    la   limite   séparative,   mesurée\n    perpendiculairement en tout point d’une façade comportant des baies\n    principales, devra être au moins égale à la hauteur de cette façade, sans\n    pouvoir être inférieure à 6 m.\nFaçades secondaires\nFaçades ne comportant pas de baies principales (cf. définitions)\n    La    distance   horizontale   à   la   limite   séparative,    mesurée\n    perpendiculairement en tout point d’une façade comportant des baies\n    secondaires ou ne comportant pas de baies, devra être au moins égale à la\n    moitié de la hauteur de cette façade, sans pouvoir être inférieure à\n    3 m.\n    PLAN LOCAL D’URBANISME    48\n    LA GARENNE-COLOMBES", "7.2    Par rapport aux autres limites, dont celles de fond de parcelle\n    7.2.1    Construction existante\n    La surélévation et l’extension d’une construction existante peuvent être\n    autorisées :\n    •    suivant les règles applicables aux constructions nouvelles.\n    Si ces règles ne peuvent pas être respectées :\n    •    La surélévation d’un niveau et l’extension d’une construction peuvent\n    être autorisées dans le prolongement des murs existants, à condition que\n    les façades créées ne respectant pas les prospects imposés ne comportent\n    pas de baies autres que des jours de souffrance.\n    7.2.2    Construction nouvelle\n    Les façades arrières ou latérales de la construction doivent s’écarter de\n    ces limites conformément aux règles définies à l’article UE.7.1.3.\n    Toutefois, pour une construction non affectée à l’habitation ou à une\n    activité industrielle ou de bureau, les façades arrière d’une construction\n    peuvent être implantées sur les autres limites, dont celles de fond de\n    parcelle à condition que leur hauteur maximum ne dépasse pas 3,20m.\n7.3    Les équipements publics et d’intérêt collectif peuvent être implantés :\n    -    sur limites séparatives et limites de fond de parcelles si la façade\n    ne comporte pas de baies autres que des jours de souffrance.\n    -    ou en retrait des limites séparatives et limite de fond de parcelle.\n    Dans ce cas, elles ils doivent s’écarter de ces limites conformément\n    aux règles définies au paragraphe 7.1.3.\n    Dans le sous-secteur UEa, les équipements publics peuvent être implantés :\n    -    soit en limite séparative pour autant que chaque façade concernée\n    ne comporte pas de baies autres que des jours de souffrance.\n    -    soit en retrait des limites séparatives. Dans ce cas, chaque façade\n    concernée doit, au minimum, s’écarter de ces limites conformément\n    aux dispositions du Code civil.\n7.2   Les constructions peuvent être implantées à une distance moindre que celle définie\n    ci-dessus lorsque le pétitionnaire et son voisin font application des dispositions de\n    PLAN LOCAL D’URBANISME    49\n    LA GARENNE-COLOMBES", "    l’article L 471-1 du Code de l’Urbanisme, sous réserve de respecter la distance\n    minimale fixée à l’article UE 8 avec les constructions situées sur le terrain voisin.\n7.5    Pour les pignons supportant des toitures à une ou plusieurs pentes, la hauteur de la\n    construction est mesurée depuis le niveau du trottoir jusqu’au point médian situé\n    entre le niveau du faîtage et celui de l’égout du toit (cf. article 7.1.3).\nARTICLE UE.8 - IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT\n    AUX AUTRES SUR UNE MEME PROPRIETE\n8.1    Constructions existantes\n    La surélévation et l’extension d’un bâtiment existant peuvent être autorisées :\n    •   suivant les règles des constructions nouvelles.\n    Si ces règles ne peuvent pas être respectées :\n    •   La surélévation d’un niveau et l’extension d’un bâtiment peuvent être\n    autorisées dans le prolongement des murs existants, à condition que les\n    façades créées ne respectant pas les prospects imposés ne comportent\n    pas de baies autres que des jours de souffrance.\n8.2    Constructions nouvelles\n    8.2.1    A l’exception de la distance entre une construction principale et une\n    construction annexe (garage, remise, etc.), la construction de plusieurs\n    bâtiments non contigus, sur une même propriété, doit respecter les\n    dispositions suivantes :\n    La distance mesurée perpendiculairement en tout point de la façade doit\n    être au moins égale :\n        A la hauteur de la façade la plus haute (L ≥ H), avec un minimum de\n    6 m si l’une des façades comporte des baies principales.\n    ou\n        A la moitié de la façade la plus haute (L ≥ H/2), avec un minimum de\n    3 m si les deux façades ne comportent pas de baies principales.\n    PLAN LOCAL D’URBANISME    50\n    LA GARENNE-COLOMBES", "    8.2.2    La distance mesurée perpendiculairement en tout point de la façade d’une\n    construction annexe (garage, remise, etc.) non contiguë à la construction\n    principale doit être au minimum de 3 mètres.\nARTICLE UE.9 - EMPRISE AU SOL\n    9.1 L’emprise au sol des constructions ne doit pas excéder 50% de la surface du\n    terrain.\n    9.2 Il n’est pas fixé de règle pour les équipements publics et les équipements\n    d’intérêt collectif (cf. définitions).\n    9.3 En cas de changement de destination, il convient de se reporter à l’article 2.4.\nARTICLE UE.10 - HAUTEUR MAXIMUM DES CONSTRUCTIONS\nLa hauteur des bâtiments est mesurée au point le plus haut du trottoir au droit de l’unité\nfoncière et doit respecter les règles suivantes :\n10.1 La hauteur des bâtiments doit respecter les règles suivantes :\n    •    7 m à l’égout du toit ou 8 m à l’acrotère pour les toitures- terrasses.\n    •    11 m au faîtage pour les toitures en pentes, les toitures « Mansard » et les\n    toitures des étages en attique.\n    •    11 m pour les édicules sur toitures- terrasses.\n    PLAN LOCAL D’URBANISME    51\n    LA GARENNE-COLOMBES", "10.1.1 Application de la règle 10.1 l’ensemble de la zone pour les\nconstructions existantes.\nPour toute restructuration, extension et surélévation d’une construction existante\nà la date d’approbation de la modification n°7 du PLU, les hauteurs maximales sont\npar dérogation comptées à partir du niveau du plancher bas du rez-de-chaussée.\n10.1.2 Dépassement de la hauteur totale maximale autorisée dans\nl’ensemble de la zone pour les constructions neuves.\n    PLAN LOCAL D’URBANISME    52\n    LA GARENNE-COLOMBES", "    Un dépassement des hauteurs fixées à l’article 10.1 peut être accordé lorsqu’un\n    bâtiment s’implante en contiguïté d’un bâtiment existant à la date d’approbation de\n    la modification n°7 du PLU dépassant ces hauteurs, sous réserve de ne pas porter\n    atteinte aux bonnes insertions urbaines du projet.\n    Ce dépassement ne pourra excéder les hauteurs suivantes :\n    -10 m à l’égout du toit ou 11 m à l’acrotère pour les toitures-terrasses.\n    -14 m au faîtage pour les toitures en pentes, les toitures « Mansard » ou toiture\n    des étages en attique.\n    -14 m pour les édicules sur toitures-terrasses.\n10.2    Toutefois, pour les équipements publics et les équipements d’intérêt collectif, la\n    hauteur des bâtiments peut respecter les règles suivantes :\n    •    12 m à l’égout du toit ou 13 m à l’acrotère pour les toitures- terrasses.\n    PLAN LOCAL D’URBANISME    53\n    LA GARENNE-COLOMBES", "    •    15 m au faîtage pour les toitures en pentes, toitures « Mansard » et les\n    toitures des étages en attiques.\n    •    15 m pour les édicules sur toitures- terrasses.\n    Dans le sous-secteur UE a, la hauteur des bâtiments peut respecter les règles\n    suivantes :\n    •    15 m à l’égout du toit ou 15 m à l’acrotère pour les toitures-terrasses.\n    •    18 m au faitage pour les toitures en pentes, toitures ≪ Mansard ≫ et les\n    toitures des étages en attiques.\n    •    17 m pour les édicules sur toitures- terrasses.\n10.3   En cas de changement de destination, il convient de se reporter à l’article 2.4.\n10.4   A l’exception des lucarnes disposées sur les rampants de toiture, la distance\n    horizontale de tout point de la façade (cf. définitions) projeté au point le plus\n    proche de l’alignement opposé, actuel ou futur, doit être au moins égale à la\n    différence d’altitude entre ces deux points (H ≤ L).\n    Dans le sous-secteur UE a, la règle ci-avant n’est pas applicable aux constructions\n    d’équipements publics.\n10.5   A l’angle d’îlots délimités par des voies d’inégales largeurs, la hauteur maximum des\n    constructions édifiées en bordure de la voie la moins large peut être identique à\n    celle autorisée en bordure de la voie la plus large sur une distance au plus égale à\n    15 m comptée à partir de l'extrémité du pan coupé lorsqu’il est rendu obligatoire,\n    ou à partir de l’intersection des deux alignements en l’absence de pan coupé (suivant\n    croquis).\n    Illustration\n    PLAN LOCAL D’URBANISME    54\n    LA GARENNE-COLOMBES", "10.6 A l’exception des dispositifs de réception de signaux radioélectriques, et des\n    souches de cheminées dans la limite d’une hauteur de 50 centimètres au-dessus de\n    la hauteur plafond, aucun édicule ou équipement technique ne doit dépasser le\n    plafond autorisé. Ces édicules devront être intégrés au volume de la toiture.\n10.7 Secteurs de majoration définis sur le document graphique 4.6\n    Les programmes de logements comportant des logements locatifs sociaux au sens de\n    l'article L.302-5 du Code de la construction et de l'habitation bénéficient d'une\n    majoration des règles relatives à la hauteur.\n    Cette majoration est égale au pourcentage de logements sociaux sur la totalité du\n    programme dans la limite de 30% du programme total. L’ensemble des autres articles\n    devra être appliqué conformément au règlement du PLU en vigueur.\n10.8    Cas particulier des OAP.\nDans le cas où la construction est concernée par l’application d’une OAP (orientation\nd’aménagement et de programmation), des hauteurs différentes pourront être appliquées si\nelles sont identifiées expressément dans le schéma de l’OAP.\nARTICLE UE.11 - ASPECT EXTERIEUR\n11.1    Dispositions générales\n    Les bâtiments et/ou les ouvrages à édifier et/ou à modifier (surélévation,\n    extension, ravalement…) ne doivent pas porter atteinte à l’ambiance urbaine\n    traditionnelle et originale de la zone UE.\n    Cette ambiance urbaine se caractérise notamment par :\n    PLAN LOCAL D’URBANISME    55\n    LA GARENNE-COLOMBES", "    - l’harmonie et l’osmose entre le bâti, son jardin et ses clôtures\n    - le séquençage et le rythme sur la rue enrichissants et qualifiants\n    - la variété des perspectives urbaines\n    - les angles de rues parfois dégagés et aérés\n    - les sous-secteurs pavillonnaires de caractère homogène et continu\n    - le rôle écologique des masses vertes privées\n    - les ensembles d’habitation à taille humaine et largement végétalisés\n    - la qualité architecturale intrinsèque des constructions\n    Pour l’application de cet article, il est ici fait expressément renvoi à l’Orientation\n    d’Aménagement et de Programmation relative au Quartier de La Garenne Centre et\n    ses abords.\n11.2   Constructions existantes\n    11.2.1   Traitement des façades\n    Le caractère d’origine de la façade doit être préservé, notamment\n    lorsqu’elle est composée de pierres de taille ou de briques soigneusement\n    mises en œuvre.\n    Les matériaux destinés à être enduits doivent être recouverts.\n    L’enduit au mortier de ciment non teinté ou non peint est proscrit.\n    Les éléments d’ornementation existants (modénature, corniches, volets ou\n    persiennes, etc.) doivent être conservés. Ils peuvent être restaurés.\n    11.2.2   Eclairement des combles\n    L’éclairement éventuel des combles doit être assuré, soit par des lucarnes,\n    soit par des verrières ou des châssis de toit.\n    Les lucarnes doivent être à deux ou trois versants ou semi-cylindriques et\n    suivre, dans la mesure du possible, l’axe des percements des étages\n    inférieurs. La largeur hors tout de la lucarne ne peut excéder la dimension\n    horizontale de la fenêtre située à l’étage inférieur.\n    11.2.3   Surélévation\n    Les surélévations et redressements de toiture des constructions\n    existantes doivent être traités en harmonie avec l’architecture et les\n    matériaux du bâtiment concerné.\n11.3   Constructions neuves\n    11.3.1   Pour les façades des constructions donnant sur les voies publiques ou\n    privées, doit être privilégié un choix de matériaux de qualité et pérennes\n    (stables dans la durée et nécessitant un faible entretien) tels que la\n    pierre, la brique, le métal, le verre, le béton architectonique, le bois, etc.\n    PLAN LOCAL D’URBANISME    56\n    LA GARENNE-COLOMBES", "    11.3.2   Pour l’habitation, les fenêtres dont la largeur est supérieure à la hauteur\n    sont interdites.\n    11.3.3   Les façades latérales et postérieures des constructions y compris les\n    pignons rendus visibles lors de démolitions ainsi que les constructions\n    annexes (garages, appentis, etc.) doivent être traitées comme les façades\n    principales et en harmonie avec elles.\n    11.3.4   Les matériaux utilisés pour le traitement des murs pignons devront être\n    de même aspect et de même teinte que les façades principales ; les\n    pignons pourront être traités en trompe-l’œil.\n    11.3.5 Les verrières et dispositifs solaires intégrés peuvent être implantés en\n    façade et en toiture, sous réserve de ne pas porter atteinte à l’esprit\n    général de la construction.\n    11.3.6 Aucun matériau destiné à être enduit ou recouvert d’un parement (tels que\n    les carreaux de plâtre, les bardages, les briques creuses, les parpaings,\n    etc.) ne doit être laissé apparent.\n    11.3.7 Les enduits d’aspect rustique ou grossier, tels que l’enduit au mortier de\n    ciment non teinté ou non peint, sont proscrits.\n11.4   Toitures\n    11.4.1   Principe général\n    Qu’il s’agisse de toitures constituées de matériaux traditionnels (tuiles,\n    zinc, ardoises…) ou plus récents (bacs acier, tôles d’aluminium anodisées\n    ou laquées…) ou de terrasses, les accessoires à caractères technique\n    (caissons de climatisation, extracteurs, édicules d’ascenseur, garde-\n    corps, antennes…) doivent être regroupés et intégrés à la toiture de façon\n    à en annuler l’impact visuel.\n    11.4.2   Antennes\n    Les antennes d’émission ou de réception (radio, télévision, antenne\n    parabolique, radio- téléphone…), de quelque dimension que ce soit, doivent\n    être implantées exclusivement en toiture des bâtiments à une distance de\n    la façade au moins égale à leur hauteur et être de teinte identique à celle\n    de la toiture. Elles ne doivent pas être visibles depuis l’espace public.\n    PLAN LOCAL D’URBANISME    57\n    LA GARENNE-COLOMBES", "11.4.3   Toitures- terrasses\n    Toitures- terrasses non accessibles\n    Les toitures- terrasses non accessibles sont autorisées :\n    - Pour l’extension des bâtiments existants ne comportant pas de toitures\n    en pentes,\n    - Pour les bâtiments annexes d’une hauteur inférieure à 3,20 m (garage,\n    …),\n    - Pour les équipements publics et d’intérêt collectif,\n    - Pour des raisons architecturales (intégration d’édicules techniques en\n    toiture, liaisons des volumes bâtis...), les toitures -terrasses non\n    accessibles sont autorisées jusqu’à 10% maximum de la surface\n    d’emprise au sol de la construction projetée.\n    Toitures-terrasses accessibles\n    -    Les toitures- terrasses accessibles sont autorisées sur les\n    constructions à rez-de-chaussée n’excédant pas 5 m de hauteur\n    situées à l’arrière et en continuité des bâtiments implantés sur rue.\n    Ces toitures- terrasses sont impérativement à traiter en « dalles\n    jardin » aménagées en espaces verts.\n    -    A l’exception de la « dalle jardin » définie ci avant, les toitures-\n    terrasses, directement accessibles de plain-pied (terrasses formant\n    toiture des étages inférieurs) et intégrées à la construction projetée\n    sont acceptées dans la limite de 20% des surfaces d’emprise au sol de\n    la construction projetée. En cas d’extension, les 20% prennent en\n    compte la surface existante plus celle de l’extension.\n    Dans le sous-secteur UE a, les toitures-terrasses accessibles sont\n    autorisées sans restriction pour les équipements publics.\n    Les édicules sur toitures- terrasses\n    Les édicules sur toitures- terrasses doivent être implantés en retrait de\n    la façade d’une distance au moins égale à leur hauteur.\n    Dans le sous-secteur UE a, la règle ci-avant n’est pas applicable aux\n    constructions d’équipements publics.\n11.4.4   Toitures en pente\n    Pour les constructions à usage d’habitation, les toitures en pente doivent :\n    • Présenter une pente minimum de 30%.\n    ou\n    PLAN LOCAL D’URBANISME    58\n    LA GARENNE-COLOMBES", "    • Etre de type « Mansard » : dans ce cas elles doivent s’inscrire dans un\n    arc de cercle conforme au croquis suivant :\n    Le terrasson doit comporter une pente de 10% minimum.\n    Ou\n    S’il s’agit d’un étage en attique, s’inscrire dans l’épure suivante :\n    Les percements et ouvertures inclus dans le volume des toitures (lucarnes,\n    souches…) doivent être traités avec soin.\n11.5   Clôtures\n    11.5.1    Clôtures sur voies et emprises publiques\n    Les piliers de portail d’entrée et de clôture ne peuvent dépasser 2,20 m\n    de hauteur.\n    PLAN LOCAL D’URBANISME    59\n    LA GARENNE-COLOMBES", "    La clôture doit avoir une hauteur de 2 m et comporter une partie pleine\n    (mur bahut) d’une hauteur comprise entre 0,80 et 1 m (mesurée au niveau\n    du trottoir).\n    La partie supérieure de la clôture doit être constituée d’un ensemble en\n    serrurerie.\n    11.5.2   Les clôtures sur les autres limites ne doivent pas excéder une hauteur de\n    2,60 m mesurée au niveau du trottoir.\n    11.5.3   Les règles ci avant (11.5.1 et 11.5.2) ne sont pas applicables aux clôtures\n    entourant les équipements publics et d’intérêt collectif.\n11.6   Equipements liés aux énergies renouvelables\n    Pour les équipements publics existants, les équipements liés aux énergies\n    renouvelables (capteurs solaires, photovoltaïques, vérandas, serres et autres\n    éléments d’architecture bioclimatique) doivent-être intégrés et adaptés à la logique\n    architecturale des constructions et à l’environnement patrimonial.\n    Pour les constructions nouvelles d’équipement public, ces équipements feront partie\n    du projet architectural global du bâtiment qui sera apprécié en tant que tel.\n    Dans tous les cas :\n    - Pour les toitures à pentes, ils seront encastrés dans le pan de la toiture ;\n    - Pour les toitures plates, ils seront non visibles depuis l’espace public.\nARTICLE UE.12 - STATIONNEMENT\n12 .1: Règles applicables à l’ensemble des constructions à l’exception des\n    constructions et installations nécessaires aux services publics ou\n    d’intérêt collectif, lesquelles sont régies par l’article 12.2, ci-après\n    12.1.1 Principes généraux :\n    Le stationnement des véhicules doit être assuré en dehors des voies publiques.\n    Lors de toute opération de constructions neuves, les aires de stationnement\n    peuvent être réalisées soit sur le terrain d’assiette soit dans son environnement\n    immédiat.\n    Les aires de stationnement doivent être accessibles en manœuvre d’entrée et de\n    sortie depuis les voies de circulation.\n    Les rampes ne doivent pas entraîner de modification dans le niveau du trottoir. Leur\n    pente dans les 5 premiers mètres à partir de l’alignement ne doit pas excéder 5%,\n    sauf dans le cas d’impossibilité technique, sous réserve que l’implantation de la\n    rampe permette les manœuvres d’entrée et de sortie en toute sécurité.\n    PLAN LOCAL D’URBANISME    60\n    LA GARENNE-COLOMBES", "    Lors de toute opération de constructions neuves, les aires de stationnement et\n    accès doivent être réalisés conformément aux normes françaises dont les\n    dispositions sont mentionnées à l’annexe 6 du présent règlement « normes de\n    stationnement communes à toutes les zones ».\n    12.1.2   Nombre d’aires de stationnement pour les véhicules motorisés :\n    DESTINATION DES    EMPLACEMENTS\n    CONSTRUCTIONS\nHabitation    1-    Les logements locatifs financés avec un prêt aidé de\n    l’Etat :\n    -    En application des dispositions de l’alinéa n° 1 de\n    l’article L.151-35 du Code de l’urbanisme, il est exigé, lors de\n    la construction de logements locatifs financés avec un prêt\n    aidé par l’Etat, la réalisation d’une aire de stationnement par\n    logement.\n    -    En application des dispositions de l’alinéa n°2 de\n    l’article L.151-35 du Code de l’urbanisme, il est exigé, lors de\n    la construction de logements locatifs financés avec un prêt\n    aidé par l’Etat, la réalisation de 0,5 aire de stationnement par\n    logement si ces derniers sont situés à moins de cinq cents\n    mètres d’une gare ou d’une station de transport public guidé\n    ou de transport collectif en site propre et que la qualité de la\n    desserte le permet.\n    2-    Les établissements assurant l’hébergement des\n    personnes âgées mentionnées au 6° du I de l’article L.312-\n    1 du Code de l’action sociale et les résidences universitaires\n    mentionnées à l’article L.631-12 du code de la construction\n    et de l’habitation :\n    - Pour les établissements assurant l’hébergement des\n    personnes âgées mentionnées au 6° du I de l’article L. 312-1 du\n    Code de l’action sociale, le nombre de places de stationnement\n    éventuellement nécessaire au fonctionnement et à la\n    fréquentation de ces établissements assurant l’hébergement\n    des personnes âgées mentionnées au 6 ° du I de l’article L. 312-\n    1 du Code de l’action sociale doit être apprécié notamment au\n    regard de leur mode de fonctionnement, de leurs besoins\n    propres , de leur situation sur le territoire communal, des\n    possibilités de desserte par les transports en commun ainsi\n    que de l’offre publique de stationnement disponible, existante\n    ou projetée, dans le secteur du projet sans pouvoir excéder 1\n    place par logement conformément aux dispositions de l’article\n    L. 151- 35 du Code de l’Urbanisme.\n    - Pour les résidences universitaires mentionnées à l’article L.\n    631-12 du Code de la construction et de l’habitation, le\n    nombre de places de stationnement éventuellement nécessaire\n    PLAN LOCAL D’URBANISME    61\n    LA GARENNE-COLOMBES", "    au fonctionnement et à la fréquentation de ces résidences\n    universitaires mentionnées à l’article L. 631-12 du Code de la\n    construction et de l’habitation doit être apprécié notamment\n    au regard de leur mode de fonctionnement, de leurs besoin\n    propres , de leur situation sur le territoire communal, des\n    possibilités de desserte par les transports en commun ainsi\n    que de l’offre publique de stationnement disponible, existante\n    ou projetée, dans le secteur du projet sans pouvoir excéder 1\n    place par logement conformément aux dispositions de l’article\n    L. 151- 35 du Code de l’Urbanisme.\n    3-    Les autres catégories de logements :\n    -    Pour les autres catégories de logements, quand ils sont\n    situés à plus de cinq cents mètres d’une gare ou d’une station\n    de transport public guidé ou de transport collectif en site\n    propre, il est exigé la réalisation d’une aire de stationnement\n    par tranche de 60 m² SP (avec un minimum de 1 place par\n    logement ou chambre indépendante et un maximum de 3 places\n    par logement).\n    -    Pour les autres catégories de logements, quand ils sont\n    situés à moins de cinq cents mètres d’une gare ou d’une station\n    de transport public guidé ou de transport collectif en site\n    propre et dès lors que la qualité de la desserte le permet, il\n    est exigé la réalisation d’une aire de stationnement par\n    logement.\nBureaux    1 place par tranche de 65 m² de S.P.\n    Les normes de stationnement pour les bureaux sont réduites à\n    1 place/100 m² de S.P. dans un rayon de 300 m autour des\n    gares et des stations de tramway actuelles ou projetées,\n    distance appréciée à partir de leur entrée principale.\nCommerces\n- Entre 0 et 150 m² S.P.    Aucune place n’est exigée.\n- Entre 150 et 300 m² S.P.    1 place par tranche de 50 m² de S.P.\n    (2 places minimum).\n- Entre 300 et 2 000 m² S.P.    1 place par tranche de 30 m² de S.P.\n- Supérieur à 2 000 m² S.P.    1 place par tranche de 25 m² de S.P.\n    Dans un rayon de 300 m autour des gares et des stations de\n    tramway actuelles ou projetées, distance appréciée à partir de\n    leur entrée principale, les normes de stationnement sont\n    réduites à :\n•   Entre 150 et 300 m² S.P.    1 place par tranche de 75 m² de S.P.\n•   Entre 300 m² et 2 000 m² S.P. 1 place par tranche de 50 m² de S.P.\n•   Supérieur à 2 000 m² S.P.    1 place par tranche de 40 m² de S.P\n    PLAN LOCAL D’URBANISME    62\n    LA GARENNE-COLOMBES", "Il est précisé que la règle ci-dessus relative aux obligations de stationnement pour les commerces\ns’applique par unité commerciale et non pour la surface commerciale totale créée dans une même\nopération.\nArtisanat, industrie, entrepôts    1 place pour 100 m² de S.P.\n    + aire de livraison au-delà de 200 m² S.P.\nHôtels    1 place pour 3 chambres.\n Les résultats en nombre de places découlant des normes énoncées ci-dessus doivent être arrondis\n à l’unité supérieure dès que la première décimale est supérieure ou égale à 5.\n    12.1.3    En application des dispositions de l’article L.151-31 du Code de l’urbanisme\n    les normes de réalisation de stationnement édictées à l’article 12.1.2 sont\n    réduites de 15 % en contrepartie de la mise à disposition de véhicules\n    électriques munis d’un dispositif de recharge adapté ou de véhicules\n    propres en auto-partage.\n    12.1.4    Lorsque le bénéficiaire du permis ou de la décision de non-opposition à une\n    déclaration préalable ne peut pas satisfaire aux obligations résultant de\n    l’article 12.1.2 il peut en être tenu quitte en justifiant pour les places qu’il\n    ne peut réaliser lui-même sur le terrain d’assiette ou dans son\n    environnement immédiat :\n    • soit de l’obtention d’une concession à long terme dans un parc public de\n    stationnement existant ou en cours de réalisation et situé à proximité de\n    l’opération.\n    • soit de l’acquisition de places dans un parc privé de stationnement existant\n    ou en cours de réalisation et situé à proximité de l’opération.\n    Lorsqu’une aire de stationnement a été prise en compte dans le cadre d’une\n    concession à long terme ou d’un parc privé de stationnement, elle ne peut\n    plus être prise en compte, en tout ou partie, à l’occasion d’une nouvelle\n    autorisation.\n    12.1.5    En cas d’extension et/ou de surélévation supérieure à 20 m² S.P., le\n    nombre de places à réaliser pour les véhicules motorisés correspond aux\n    besoins générés calculés selon les règles définies à l’article 12.1.2.\n    12.1.6    En cas de changement de destination de locaux, le nombre de places à\n    réaliser pour les véhicules motorisés correspond aux besoins générés\n    calculés selon les règles définies à l’article 12.1.2.\n    12.1.7    Toute place supprimée doit être recréée dans l’unité foncière.\n    12.1.8    Une aire de stationnement doit être prévue pour les vélos à raison :\n    •    d'un emplacement de 0,50 m² par logement.\n    •    d'un emplacement de 0,25 m² pour 100 m² de S.P. de bureau, de\n    commerce ou d’artisanat.\n    PLAN LOCAL D’URBANISME    63\n    LA GARENNE-COLOMBES", "12 .2: Règles applicables aux constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif\n    12.2.1 Principes généraux :\n    Le stationnement des véhicules motorisés doit être assuré en dehors des voies\n    publiques soit en surface ou en sous-sol sur le terrain d’assiette ou dans son\n    environnement immédiat.\n    80% des aires de stationnement doivent avoir un accès direct. Les places doubles\n    auront une profondeur minimum de 9 m.\n    Les aires de stationnement doivent être accessibles en manœuvre d’entrée et de\n    sortie depuis les voies de circulation.\n    Les rampes ne doivent pas entraîner de modification dans le niveau du trottoir. Leur\n    pente dans les 5 premiers mètres à partir de l’alignement ne doit pas excéder 5%,\n    sauf dans le cas d’impossibilité technique, sous réserve que l’implantation de la\n    rampe permette les manœuvres d’entrée et de sortie en toute sécurité.\n    Lors de toute opération de constructions neuves, les aires de stationnement et\n    accès doivent être réalisés conformément aux normes françaises dont les\n    dispositions sont mentionnées à l’annexe 6 du présent règlement « normes de\n    stationnement communes à toutes les zones ».\n    12.2.2    Normes de stationnement\n  DESTINATION DES CONSTRUCTIONS    EMPLACEMENTS\nConstructions et installations nécessaires aux    Le nombre de places de stationnement\nservices publics ou d’intérêt collectif    éventuellement nécessaire au fonctionnement et à\n (crèche, groupe    scolaire maternel    et   la fréquentation des constructions et installations\nélémentaire, enseignement secondaire et    nécessaires aux services publics ou d’intérêt\nsupérieur,    centre    aquatique,   patinoire,   collectif doit être apprécié notamment au regard\nbibliothèque, médiathèque, cinéma, salle de    de la nature de l’équipement, de son mode de\nspectacle, hôpital, clinique, foyer de vie pour    fonctionnement, de sa situation sur le territoire\npersonnes handicapées, maison-relais, EHPAD,    communal, des possibilités de desserte par les\nfoyer de jeunes travailleurs, résidences    transports en commun ainsi que de l’offre publique\nservices…).    de stationnement disponible, existante ou projetée\n    dans le secteur du projet.\n    Cette offre publique de stationnement doit être\n    existante à la date de mise en service de\n    l’équipement.\n    Par dérogation aux principes généraux énoncés à\n    l’article 12.2.1 il peut être recouru en tant que de\n    besoin au stationnement sur la voie publique pour\n    PLAN LOCAL D’URBANISME    64\n    LA GARENNE-COLOMBES", "    les seuls stationnements de très courte durée\n    (type dépose-minute…).\n    12.2.3 Toute place supprimée doit être remplacée.\nARTICLE UE.13 - ESPACES LIBRES ET PLANTATIONS\nPour l’application de cet article, sera prise en compte l’unité foncière d’origine à la date\nd’approbation de la modification n°12 du PLU.\n13.1    Constructions existantes\n    Pour une construction existante sur une unité foncière d’une superficie inférieure\n    ou égale à 250 m², 15 % au moins de la superficie du terrain seront traités en\n    espace paysager de pleine terre.\n    Pour une construction existante sur une unité foncière d’une superficie supérieure\n    à 250 m2, 50% au moins de la superficie du terrain seront traités en espace\n    paysager de pleine terre.\n    Toutefois, les étendues libres des équipements publics et des équipements\n    d’intérêt collectif (cf. définitions) peuvent faire l’objet d’un aménagement minéral.\n13.2    Constructions neuves\n    Pour toute construction nouvelle, 50% au moins de la superficie du terrain seront\n    traités en espace paysager de pleine terre.\n    Toutefois, les étendues libres des équipements publics et des équipements\n    d’intérêt collectif (cf. définitions) peuvent faire l’objet d’un aménagement minéral.\n13.3    En limite de terrain, le niveau fini des espaces verts à rez-de-chaussée ne peut\n    être supérieur au niveau du terrain voisin.\n13.4    Toute construction à édifier devra sauvegarder et mettre en valeur les arbres\n    inscrits au document graphique comme étant à protéger. Ces arbres remarquables\n    sont repérés par un point vert.\nIl est rappelé que conformément à l’article R 431-9 du Code de l’Urbanisme, les projets de\nconstructions doivent être accompagnés d’un plan comportant le relevé des plantations\nexistantes, à abattre et à créer. Dans ce cadre, les projets de construction doivent\nrespecter le principe de la conservation au maximum des espaces paysagers existants, en\nparticulier les arbres.\nTout arbre abattu doit être remplacé par un arbre répondant aux conditions cumulatives\nsuivantes :\n- de même essence ou d’une essence susceptible de redonner une valeur paysagère\néquivalente ;\n- de même port ;\n    PLAN LOCAL D’URBANISME    65\n    LA GARENNE-COLOMBES", "- de même développement futur.\nTout ou partie d’espace paysager supprimé doit être reconstitué sur le terrain d’assiette du\nprojet.\nARTICLE UE.14 - COEFFICIENT D’OCCUPATION DU SOL (C.O.S.)\n    Sans objet.\n    PLAN LOCAL D’URBANISME    66\n    LA GARENNE-COLOMBES", "    ZONE UL\nPLAN LOCAL D’URBANISME   67\n LA GARENNE-COLOMBES", "La zone UL a pour vocation l’accueil d’installations sportives et d’espaces verts.\nARTICLE UL.1 -    OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\nSont interdits :\nTous modes d’occupation du sol et constructions de toutes natures autres que celles\nsoumises à condition à l’article 2.\nARTICLE UL.2 -    OCCUPATION    ET    UTILISATION    DU    SOL    ADMISES   SOUS\n    CONDITIONS PARTICULIERES\n2.1    Les aménagements, rénovations, remises aux normes des installations et bâtiments\n    achevés à la date d’entrée en vigueur du PLU, à condition qu’ils correspondent au\n    fonctionnement de la zone.\n2.2    Les ouvrages et constructions nouveaux, à condition qu’ils soient destinés au\n    fonctionnement et à l’entretien des espaces naturels, aménagements de plein air,\n    et locaux à usage d’activités sportives.\n2.3    Les logements de gardiennage à condition qu’ils soient liés au fonctionnement des\n    occupations et utilisations du sol autorisées.\nARTICLE UL.3 -    ACCES ET VOIRIE\n3.1    Pour être constructible, un terrain doit être desservi par une voie publique ou\n    privée ou un accès (éventuellement obtenu par application de l’article 682 du Code\n    Civil) ouvert à la circulation automobile, de caractéristiques proportionnées à\n    l’importance de l’occupation ou de l’utilisation du sol envisagée.\n3.2    Les voies nouvelles se terminant en impasse doivent être aménagées de telle sorte\n    que les véhicules puissent faire demi-tour.\nARTICLE UL.4 -    DESSERTE PAR LES RESEAUX ET STOCKAGE DES DECHETS\n4.1    Eau\n    Toute construction ou installation nouvelle nécessitant une alimentation en eau doit\n    être raccordée au réseau public d’eau potable.\n4.2    Assainissement\n    Eaux usées – eaux vannes\n    Toute construction ou installation nouvelle doit être raccordée au réseau public\n    d’assainissement.\n    PLAN LOCAL D’URBANISME    68\n    LA GARENNE-COLOMBES", "    Jusqu’aux limites de propriété, les rejets doivent être réalisés par un réseau\n    séparatif.\n    L’évacuation des eaux résiduaires provenant des installations industrielles ou\n    artisanales doit faire l’objet d’un pré-traitement avant le rejet dans le réseau\n    public d’assainissement.\n    Recommandations sur les eaux pluviales\n    De manière à limiter ces apports, tant d’un point de vue qualitatif que quantitatif,\n    des techniques alternatives aux réseaux devront être privilégiées (noues,\n    chaussées réservoirs, fossés drainant, bassins…).\n    En cas d’extension ou d’aménagement d’une construction existante, des dispositifs\n    appropriés peuvent être recherchés afin d’assurer la maîtrise des débits et\n    l’écoulement des eaux pluviales et de ruissellement, en se rapprochant des normes\n    édictées ci-dessous.\n    Eaux pluviales\n    Le débit généré par une construction neuve ou une reconstruction ne doit pas\n    excéder pour une pluie de retour décennal 2l/s/ha pour un rejet dans un réseau\n    unitaire.\n    En cas d’extension :\n    - si la construction existante présente un débit de rejet conforme (<2l/s/ha), le\n    débit de rejet de la construction après travaux doit être conforme.\n    - si la construction existante n’est pas conforme, le débit de rejet de la\n    construction après travaux ne doit pas être supérieur à celui de la construction\n    existante.\n    Recommandations sur le stockage des déchets\n    Pour toute construction ou groupe de construction supérieur à 200 m² S.P., un\n    local destiné au stockage des conteneurs recueillant les ordures ménagères\n    nécessaire au tri sélectif et déchets liés à l’activité doit être aménagé.\n    Nota : Le local de stockage devra être conforme au règlement communal en vigueur\n    et aux prescriptions de l’article 77 du règlement sanitaire départemental des\n    Hauts-de-Seine. Cet article est annexé au présent règlement.\nARTICLE UL.5 -    CARACTERISTIQUES DES TERRAINS\n    Sans objet.\n    PLAN LOCAL D’URBANISME    69\n    LA GARENNE-COLOMBES", "ARTICLE UL.6 - IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX VOIES\n    PUBLIQUES, AUX VOIES PRIVEES OUVERTES A LA CIRCULATION\n    AUTOMOBILE ET AUX EMPRISES PUBLIQUES (PLACES, VOIES\n    FERROVIAIRES, SQUARES ET MAILS PIETONNIERS)\nPrincipe général\nL’implantation d’un bâtiment s’apprécie par rapport à la projection au sol du bâtiment, hors\nsaillies. Des retraits partiels ou ponctuels sont acceptés, pour autant qu’ils n’excédent pas\n20 % du linéaire de façade concerné.\n6.1    Constructions existantes\n    Les travaux de modification de façade ou de surélévation d’un niveau, dont\n    l’implantation ne respecte pas l’article 6.2, peuvent être autorisés à condition que\n    ces transformations n’entraînent pas une augmentation de l’emprise au sol dans la\n    marge de reculement quand elle existe.\n6.2    Constructions nouvelles\n    A l’exception des clôtures, les constructions peuvent être implantées :\n    •   soit à l’alignement,\n    •   soit en retrait de 5 m minimum.\nARTICLE UL.7 - IMPLANTATION    DES    CONSTRUCTIONS    PAR    RAPPORT    AUX\n    LIMITES SEPARATIVES\nPrincipe général\nL’implantation d’un bâtiment s’apprécie par rapport à la projection au sol du bâtiment, hors\nsaillies. Des retraits partiels ou ponctuels sont acceptés, pour autant qu’ils n’excédent pas\n20 % du linéaire de façade concerné.\n7.1    Constructions existantes\n    7.1.1    La surélévation et l’extension d’un bâtiment achevé à la date d’entrée en\n    vigueur du PLU peuvent être autorisées :\n    PLAN LOCAL D’URBANISME    70\n    LA GARENNE-COLOMBES", "    • suivant les règles des constructions nouvelles.\n    Si ces règles ne peuvent pas être respectées :\n    • La surélévation d’un niveau et l’extension d’un bâtiment peuvent être\n    autorisées dans le prolongement des murs existants, à condition que\n    les façades créées ne respectant pas les prospects imposés ne\n    comportent pas de baies autres que des jours de souffrance.\n7.2   Constructions nouvelles\n    7.2.1   Les constructions peuvent s’implanter en retrait conformément aux règles\n    définies ci-dessous.\n    Façades principales\n    Façades comportant des baies principales (cf. définitions)\n    La distance horizontale à la limite séparative, mesurée perpendiculairement\n    en tout point d’une façade comportant des baies principales, devra être au\n    moins égale à la hauteur de cette façade, sans pouvoir être inférieure à 6\n    m.\n    Façades secondaires\n    Façades ne comportant pas de baies principales (cf. définitions)\n    La distance horizontale à la limite séparative, mesurée perpendiculairement\n    en tout point d’une façade comportant des baies secondaires ou ne\n    comportant pas de baies, devra être au moins égale à la moitié de la hauteur\n    de cette façade, sans pouvoir être inférieure à 3 m.\n    PLAN LOCAL D’URBANISME    71\n    LA GARENNE-COLOMBES", "ARTICLE UL.8 -    IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT\n    AUX AUTRES SUR UNE MEME PROPRIETE\n    Il n’est pas fixé de règle.\nARTICLE UL.9 -    EMPRISE AU SOL\n    Il n’est pas fixé de règle.\nARTICLE UL.10 - HAUTEUR MAXIMUM DES CONSTRUCTIONS\n    La hauteur des bâtiments est mesurée au point le plus haut du trottoir au droit de\n    l’unité foncière et doit respecter les règles suivantes :\n10.1   La hauteur des constructions ne peut excéder 12 m.\n10.2   A l’exception des lucarnes disposées sur les rampants de toiture, la distance\n    horizontale de tout point de la façade (cf. définitions) projeté au point le plus\n    proche de l’alignement opposé, actuel ou futur, doit être au moins égale à la\n    différence d’altitude entre ces deux points (H ≤ L).\nARTICLE UL.11 - ASPECT EXTERIEUR\n11.1   Dispositions générales\n    Les bâtiments ou ouvrages à édifier ou à modifier ne doivent pas porter atteinte\n    au caractère ou à l’intérêt des lieux avoisinants.\n    PLAN LOCAL D’URBANISME    72\n    LA GARENNE-COLOMBES", "11.2   Constructions existantes\n    11.2.1   Traitement des façades\n    Le caractère d’origine de la façade doit être préservé, notamment\n    lorsqu’elle est composée de pierres de taille ou de briques soigneusement\n    mises en œuvre.\n    Les matériaux destinés à être enduits doivent être recouverts. L’enduit\n    au mortier de ciment non teinté ou non peint est proscrit.\n    Les éléments d’ornementation existants (modénature, corniches, volets ou\n    persiennes, etc.) doivent être conservés. Ils peuvent être restaurés.\n    11.2.2   Eclairement des combles\n    L’éclairement éventuel des combles doit être assuré, soit par des lucarnes,\n    soit par des verrières ou des châssis de toit.\n    Les lucarnes doivent être à deux ou trois versants ou semi-cylindriques et\n    suivre, dans la mesure du possible, l’axe des percements des étages\n    inférieurs. La largeur hors tout de la lucarne ne peut excéder la dimension\n    horizontale de la fenêtre située à l’étage inférieur.\n    11.2.3   Surélévation\n    Les surélévations et redressements de toiture des constructions\n    achevées à la date d’entrée en vigueur du PLU doivent être traités en\n    harmonie avec l’architecture et les matériaux du bâtiment concerné.\n11.3   Constructions neuves\n    11.3.1   Pour les façades des constructions donnant sur les voies publiques ou\n    privées, doit être privilégié un choix de matériaux de qualité et pérennes\n    (stables dans la durée et nécessitant un faible entretien) tels que la\n    pierre, la brique, le métal, le verre, le béton architectonique, le bois, etc.\n    11.3.2   Pour l’habitation, les fenêtres dont la largeur est supérieure à la hauteur\n    sont interdites.\n    11.3.3   Les façades latérales et postérieures des constructions y compris les\n    pignons rendus visibles lors de démolitions ainsi que les constructions\n    annexes (garages, appentis…) doivent être traitées comme les façades\n    principales et en harmonie avec elles.\n    PLAN LOCAL D’URBANISME    73\n    LA GARENNE-COLOMBES", "    11.3.4   Les matériaux utilisés pour le traitement des murs pignons devront être\n    de même aspect et de même teinte que les façades principales ; les\n    pignons pourront être traités en trompe-l’œil.\n    11.3.5   Les verrières et dispositifs solaires intégrés peuvent être implantés en\n    façade et en toiture, sous réserve de ne pas porter atteinte à l’esprit\n    général de la construction.\n    11.3.6   Aucun matériau destiné à être enduit ou recouvert d’un parement (tels\n    que les carreaux de plâtre, les bardages, les briques creuses, les\n    parpaings…) ne doit être laissé apparent.\n    11.3.7   Les enduits d’aspect rustique ou grossier, tels que l’enduit au mortier de\n    ciment non teinté ou non peint, sont proscrits.\n11.4   Toitures\n    11.4.1   Principe général\n    Qu’il s’agisse de toitures constituées de matériaux traditionnels (tuiles,\n    zinc, ardoises…) ou plus récents (bacs acier, tôles d’aluminium anodisées\n    ou laquées…) ou de terrasses, les accessoires à caractères technique\n    (caissons de climatisation, extracteurs, édicules d’ascenseur, garde-\n    corps, antennes…) doivent être regroupés et intégrés à la toiture de façon\n    à en annuler l’impact visuel.\n    11.4.2   Antennes\n    Les antennes d’émission ou de réception (radio, télévision, antenne\n    parabolique, radio- téléphone…), de quelque dimension que ce soit, doivent\n    être implantées exclusivement en toiture des bâtiments à une distance de\n    la façade au moins égale à leur hauteur et être de teinte identique à celle\n    de la toiture. Elles ne doivent pas être visibles depuis l’espace public.\n    11.4.3   Toitures- terrasses\n    Sans objet.\n    PLAN LOCAL D’URBANISME    74\n    LA GARENNE-COLOMBES", "11.5   Clôtures\n    11.5.1   Clôtures sur voies et emprises publiques\n    Les piliers de portail d’entrée et de clôture ne peuvent dépasser 2,20 m\n    de hauteur.\n    La clôture doit avoir une hauteur de 2m et comporter une partie pleine\n    (mur bahut) d’une hauteur comprise entre 0,80 et 1 m (mesurée au niveau\n    du trottoir). La partie supérieure de la clôture doit être constituée d’un\n    ensemble en serrurerie.\n    11.5.2   Les clôtures sur les autres limites ne doivent pas excéder une hauteur\n    totale de 2,60 m mesurée au niveau du trottoir.\n    11.5.3   Les règles ci-avant (11.5.1 et 11.5.2) ne sont pas applicables aux clôtures\n    entourant les équipements publics.\nARTICLE UL.12 - STATIONNEMENT\n    Le nombre de places doit permettre d’assurer le stationnement hors des voies\n    publiques des véhicules correspondant aux besoins de l’immeuble à construire.\n    Lors de toute opération de constructions neuves, les aires de stationnement et\n    accès doivent être réalisés conformément aux normes françaises dont les\n    dispositions sont mentionnées à l’annexe 6 du présent règlement « normes de\n    stationnement communes à toutes les zones ».\nARTICLE UL.13 - ESPACES LIBRES ET PLANTATIONS\n    Il n’est pas fixé de règle.\nARTICLE UL.14 - COEFFICIENT D’OCCUPATION DU SOL\n    Sans objet.\n    PLAN LOCAL D’URBANISME    75\n    LA GARENNE-COLOMBES", " ZONE UPM1\nPLAN LOCAL D’URBANISME   76\n LA GARENNE-COLOMBES", "La vocation de la zone UPM1 est de structurer la tête d’îlot situé au droit de la place de la\nLiberté, à l’angle des rues Voltaire et Sartoris, afin de reconstituer un front bâti continu et\nhomogène.\nARTICLE UPM1.1 - OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\nSont interdits :\n1.1    L’implantation et l’extension des installations classées soumises à autorisation sauf\n    celles mentionnées à l’article 2.\n1.2    Le changement de destination des locaux commerciaux et artisanaux situés sur\n    l’ensemble de l’unité foncière concernée le long des voies définies comme «\n    servitudes commerciales et artisanales » sur le document graphique. L’interdiction\n    de changement de destination ne s’applique pas aux équipements publics.\n1.3    Les dépôts non couverts de ferrailles, de matériaux, de combustibles solides, ainsi\n    que les entreprises de cassage de voitures et la transformation de matériaux de\n    récupération.\n1.4    Les affouillements et exhaussements des sols nécessitant une autorisation au titre\n    de l’article R 442.2 du Code de l’Urbanisme et qui ne sont pas nécessaires à des\n    travaux de construction.\n1.5    Le stationnement des caravanes et installations de camping soumises à autorisation\n    préalable à l’exception, le cas échéant, de l’aire d’accueil des gens du voyage.\nARTICLE UPM1.2 - OCCUPATION ET UTILISATION DU SOL ADMISES SOUS\n    CONDITIONS PARTICULIERES\n2.1    Les installations classées, soumises à autorisation, sont autorisées à condition\n    qu’elles n’entraînent pour le voisinage aucune incommodité et, en cas d’accident ou\n    de fonctionnement défectueux, aucune insalubrité, ni sinistre susceptible de causer\n    des dommages graves ou irréparables aux personnes et aux biens.\n2.2    L’extension ou la transformation des installations classées existantes est\n    autorisée, à condition qu’il n’en résulte pas pour le voisinage une aggravation des\n    dangers ou nuisances liés au classement, et que toutes dispositions utiles soient\n    mises en œuvre pour l’intégration dans le milieu environnant.\nRappel : Les constructions neuves à destination d'habitation, implantées le long des voies\nbruyantes, doivent respecter les règles d'isolement acoustique définies par l'arrêté\npréfectoral n°2000-174 du 29 juin 2000.\n2.3    Le long des voies concernées par les « servitudes commerciales et artisanales » sur\n    le document graphique 4.1, les constructions nouvelles devront comporter des\n    PLAN LOCAL D’URBANISME    77\n    LA GARENNE-COLOMBES", "    locaux commerciaux ou artisanaux à rez-de-chaussée. Cet article ne s’applique pas\n    aux équipements publics. Les locaux commerciaux et artisanaux supprimés doivent\n    être reconstitués au sein de l’unité foncière.\nARTICLE UPM1.3 - ACCES ET VOIRIE\n3.1    Pour être constructible, un terrain doit être desservi par une voie publique ou\n    privée ou un accès (éventuellement obtenu par application de l’article 682 du Code\n    Civil) ouvert à la circulation automobile, de caractéristiques proportionnées à\n    l’importance de l’occupation ou de l’utilisation du sol envisagée.\n3.2    Les voies nouvelles se terminant en impasse doivent être aménagées de telle sorte\n    que les véhicules puissent faire demi-tour.\nARTICLE UPM1.4 -DESSERTE PAR LES RESEAUX ET STOCKAGE DES DECHETS\n4.1   Eau\n    Toute construction ou installation nouvelle nécessitant une alimentation en eau doit\n    être raccordée au réseau public d’eau potable.\n4.2    Assainissement\n    Eaux usées – eaux vannes\n    Toute construction ou installation nouvelle doit être raccordée au réseau public\n    d’assainissement.\n    Jusqu’aux limites de propriété, les rejets doivent être réalisés par un réseau\n    séparatif.\n    L’évacuation des eaux résiduaires provenant des installations industrielles ou\n    artisanales doit faire l’objet d’un pré-traitement avant le rejet dans le réseau\n    public d’assainissement.\n    Recommandations sur les eaux pluviales\n    De manière à limiter ces apports, tant d’un point de vue qualitatif que quantitatif,\n    des techniques alternatives aux réseaux devront être privilégiées (noues,\n    chaussées réservoirs, fossés drainant, bassins…).\n    En cas d’extension ou d’aménagement d’une construction existante, des dispositifs\n    appropriés peuvent être recherchés afin d’assurer la maîtrise des débits et\n    l’écoulement des eaux pluviales et de ruissellement, en se rapprochant des normes\n    édictées ci-dessous.\n    Eaux pluviales :\n    PLAN LOCAL D’URBANISME    78\n    LA GARENNE-COLOMBES", "    Le débit généré par une construction neuve ou une reconstruction ne doit pas\n    excéder pour une pluie de retour décennal 2l/s/ha pour un rejet dans un réseau\n    unitaire.\n    En cas d’extension :\n    - si la construction existante présente un débit de rejet conforme (<2l/s/ha), le\n    débit de rejet de la construction après travaux doit être conforme.\n    - si la construction existante n’est pas conforme, le débit de rejet de la\n    construction après travaux ne doit pas être supérieur à celui de la construction\n    existante.\n    Recommandations sur le stockage des déchets\n    Pour toute construction ou groupe de construction supérieur à trois logements ou\n    à 200 m² S.P., un local destiné au stockage des conteneurs recueillant les ordures\n    ménagères nécessaire au tri sélectif doit être aménagé.\n    Nota : Le local de stockage devra être conforme au règlement communal en vigueur\n    et aux prescriptions de l’article 77 du règlement sanitaire départemental des\n    Hauts-de-Seine. Cet article est annexé au présent règlement.\n4.3    Réseaux câbles et télécommunications\n    Toute construction nouvelle doit prévoir les infrastructures nécessaires à la\n    distribution de ces réseaux depuis le point de raccordement général jusqu’à la limite\n    de parcelle.\n    Les branchements privatifs nécessaire à la distribution de ces réseaux doivent être\n    réalisés en souterrain jusqu’en limite du domaine public, et ne doivent pas rester\n    apparents sur la construction.\nARTICLE UPM1.5 - CARACTERISTIQUES DES TERRAINS\n    Sans objet.\nARTICLE UPM1.6 - IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX\n    VOIES PUBLIQUES, AUX VOIES PRIVEES OUVERTES A LA\n    CIRCULATION AUTOMOBILE ET AUX EMPRISES PUBLIQUES\n    (PLACES,    VOIES    FERROVIAIRES,    SQUARES    ET   MAILS\n    PIETONNIERS)\nPrincipe général\nL’implantation d’un bâtiment s’apprécie par rapport à la projection au sol du bâtiment, hors\nsaillies. Des retraits partiels ou ponctuels sont acceptés, pour autant qu’ils n’excédent pas\n20 % du linéaire de façade concerné.\n    PLAN LOCAL D’URBANISME    79\n    LA GARENNE-COLOMBES", "6.1    Les constructions doivent être implantées conformément aux indications figurant\n    sur le document graphique.\n6.2    Dans le cas d’une opération de démolition / reconstruction hors emprise maximale\n    constructible en superstructure telle que définie sur le document graphique, il sera\n    fait application des règles définies pour la zone UA.\n6.3    Saillies\n    6.3.1    Les saillies sur alignement :\n    6.3.1.1 Les saillies le long des voies communales de plus de 8 mètres\n    d’emprise, sont autorisées à la double condition :\n    • être situées à une hauteur supérieure ou égale à 5.50m du sol\n    mesurée au niveau du trottoir.\n    • avoir une profondeur maximale de 0.80m.\n    6.3.1.2 Les saillies le long des autres voies :\n    Le long des autres voies, il sera fait application du règlement du\n    gestionnaire de la voie correspondante.\n    6.3.2    Les saillies sur marge de reculement sont autorisées.\nARTICLE UPM1.7 - IMPLANTATION DES    CONSTRUCTIONS PAR RAPPORT AUX\n    LIMITES SEPARATIVES\nPrincipe général :\nL’implantation d’un bâtiment s’apprécie par rapport à la projection au sol du bâtiment, hors\nsaillies. Des retraits partiels ou ponctuels sont acceptés, pour autant qu’ils n’excédent pas\n20 % du linéaire de façade concerné.\n7.1    Les constructions doivent être implantées dans l’emprise maximale figurant sur le\n    document graphique, soit sur limites, soit en retrait conformément aux dispositions\n    de l’article 7.2.\n    Dans le cas d’une opération de démolition / reconstruction hors emprise maximale\n    constructible en superstructure telle que définie sur le document graphique, il sera\n    fait application des règles définies pour la zone UA.\n7.2.    En cas d’implantation en retrait des limites séparatives, les constructions (hors\n    saillies) doivent respecter simultanément les règles définies ci-dessous :\n    7.2.1    Par rapport aux limites de la zone\n    PLAN LOCAL D’URBANISME    80\n    LA GARENNE-COLOMBES", "Façades principales\nFaçades comportant des baies principales (cf. définitions)\n    La distance horizontale à la limite séparative, mesurée perpendiculairement en tout\n    point d’une façade comportant des baies principales, devra être au moins égale à la\n    hauteur de cette façade, sans pouvoir être inférieure à 6 m.\nFaçades secondaires\nFaçades ne comportant pas de baies principales (cf. définitions)\n    La distance horizontale à la limite séparative, mesurée perpendiculairement en tout\n    point d’une façade comportant des baies secondaires ou ne comportant pas de baies,\n    devra être au moins égale à la moitié de la hauteur de cette façade, sans pouvoir\n    être inférieure à 3 m.\n    Les constructions peuvent être implantées à une distance moindre que celle définie\n    ci-dessus lorsque le pétitionnaire et son voisin font application des dispositions de\n    l’article L 471-1 du Code de l’Urbanisme, sous réserve de respecter la distance\n    minimale fixée à l’article UPM1.8 avec les constructions situées sur le terrain voisin.\n    Exception : les dispositions ci-dessus ne s’appliquent pas aux lucarnes disposées\n    sur les rampants de toitures.\n    7.2.3   Par rapport aux limites intérieures des parcelles cadastrales actuelles\n    incluses dans la zone :\n    Les constructions peuvent être implantées sur limites séparatives ou en\n    retrait.\n    En cas d’implantation en limite séparative, la façade sur la limite ne peut\n    comporter de baies autres que des jours de souffrance.\n    En cas d’ouverture de vue, un retrait de 1,90 m minimum par rapport à la\n    limite séparative devra être respecté.\nARTICLE UPM1.8 - IMPLANTATION    DES    CONSTRUCTIONS    LES   UNES    PAR\n    RAPPORT AUX AUTRES SUR UNE MEME PROPRIETE\n8.1    La construction de plusieurs bâtiments non contigus sur une même propriété doit\n    respecter les dispositions suivantes :\n    La distance, mesurée perpendiculairement en tout point de la façade, doit être au\n    moins égale :\n    •    A la hauteur de la façade la plus haute, avec un minimum de 6 m si\n    l’une des façades comporte des baies principales.\n    ou\n    •    A la moitié de la façade la plus haute, avec un minimum de 3 m si les\n    deux façades ne comportent pas de baies principales.\n    PLAN LOCAL D’URBANISME    81\n    LA GARENNE-COLOMBES", "    Façades avec baie principale\n    L ≥ H\n    H\n    L\n    min. 6 m\n    Façades sans baie principale\n    L ≥ H/2\n    H\n    L\n    min. 3 m\n8.2   Pour l’application de l’article 8.1, deux constructions réunies par un élément\n    architectural ponctuel tel qu’un auvent ou une pergola (etc.) ne sont pas considérées\n    contiguës.\n8.3   Dans le cas d’une opération de démolition / reconstruction hors emprise maximale\n    constructible en superstructure telle que définie sur le document graphique, il sera\n    fait application des règles définies pour la zone UA.\nARTICLE UPM1.9 - EMPRISE AU SOL\n    L’emprise au sol ne peut dépasser l’emprise figurant sur le document graphique.\n    PLAN LOCAL D’URBANISME    82\n    LA GARENNE-COLOMBES", "ARTICLE UPM1.10 - HAUTEUR MAXIMUM DES CONSTRUCTIONS\n    La hauteur des bâtiments est mesurée au point le plus haut du trottoir au droit de\n    l’unité foncière et doit respecter les prescriptions indiquées sur le document\n    graphique.\n    A l’exception des dispositifs de réception de signaux radioélectriques, et des\n    souches de cheminées dans la limite d’une hauteur de 50 centimètres au-dessus de\n    la hauteur plafond, aucun édicule ou équipement technique ne doit dépasser le\n    plafond autorisé. Ces édicules devront être intégrés au volume de la toiture.\n    Dans le cas d’une opération de démolition / reconstruction hors emprise maximale\n    constructible en superstructure telle que définie sur le document graphique, il sera\n    fait application des règles définies pour la zone UA.\nARTICLE UPM1.11 - ASPECT EXTERIEUR\n11.1   Dispositions générales\n    Les bâtiments ou ouvrages à édifier ou à modifier ne doivent pas porter atteinte\n    au caractère ou à l’intérêt des lieux avoisinants.\n11.2   Constructions existantes\n    Les opérations de réhabilitation-rénovation ne doivent pas dénaturer l’aspect\n    général de la construction existante.\n    11.2.1   Traitement des façades\n    Le caractère d’origine de la façade doit être préservé, notamment\n    lorsqu’elle est composée de pierres de taille ou de briques soigneusement\n    mises en œuvre.\n    Les matériaux destinés à être enduits doivent être recouverts. L’enduit\n    au mortier de ciment non teinté ou non peint est proscrit.\n    Les éléments d’ornementation existants (modénature, corniches, volets ou\n    persiennes etc.) doivent être conservés. Ils peuvent être restaurés.\n    11.2.2   Eclairement des combles\n    L’éclairement éventuel des combles doit être assuré, soit par des lucarnes,\n    soit par des verrières ou des châssis de toit intégrés.\n    Les lucarnes doivent être à deux ou trois versants ou semi-cylindriques et\n    suivre, dans la mesure du possible, l’axe des percements des étages\n    inférieurs. La largeur hors tout de la lucarne ne peut excéder la dimension\n    horizontale de la fenêtre située à l’étage inférieur.\n    PLAN LOCAL D’URBANISME    83\n    LA GARENNE-COLOMBES", "    11.2.3   Surélévation\n    Les surélévations et redressements de toiture des constructions\n    achevées à la date d’entrée en vigueur du PLU doivent être traités en\n    harmonie avec l’architecture et les matériaux du bâtiment concerné.\n11.3   Constructions neuves\n    11.3.1   Pour les façades des constructions donnant sur les voies publiques ou\n    privées, doit être privilégié un choix de matériaux de qualité et pérennes\n    (stables dans la durée et nécessitant un faible entretien) tels que la\n    pierre, la brique, le métal, le verre, le béton architectonique, le bois, etc.\n    11.3.2 Pour l’habitation, les fenêtres dont la largeur est supérieure à la hauteur\n    sont interdites.\n    11.3.3   Les façades latérales et postérieures des constructions y compris les\n    pignons rendus visibles lors de démolitions ainsi que les constructions\n    annexes (garages, appentis…) doivent être traitées comme les façades\n    principales et en harmonie avec elles.\n    11.3.4   Les matériaux utilisés pour le traitement des murs pignons devront être\n    de même aspect et de même teinte que les façades principales ; les\n    pignons pourront être traités en trompe-l’œil.\n    11.3.5   Les verrières et dispositifs solaires intégrés peuvent être implantés en\n    façade et en toiture, sous réserve de ne pas porter atteinte à l’esprit\n    général de la construction.\n    11.3.6   Aucun matériau destiné à être enduit ou recouvert d’un parement (tels\n    que les carreaux de plâtre, les bardages, les briques creuses, les\n    parpaings…) ne doit être laissé apparent.\n    11.3.7   Les enduits d’aspect rustique ou grossier, tels que l’enduit au mortier de\n    ciment non teinté ou non peint, sont proscrits.\n11.4   Toitures\n    11.4.1   Principe général\n    Qu’il s’agisse de toitures constituées de matériaux traditionnels (tuiles,\n    zinc, ardoises…) ou plus récents (bacs acier, tôles d’aluminium anodisées\n    ou laquées…) ou de terrasses, les accessoires à caractères technique\n    (caissons de climatisation, extracteurs, édicules d’ascenseur, garde-\n    corps, antennes…) doivent être regroupés et intégrés à la toiture de façon\n    à en annuler l’impact visuel.\n    PLAN LOCAL D’URBANISME    84\n    LA GARENNE-COLOMBES", "11.4.2 Antennes\n    Les antennes d’émission ou de réception (radio, télévision, antenne\n    parabolique, radio-téléphone…), de quelque dimension que ce soit, doivent\n    être implantées exclusivement en toiture des bâtiments à une distance de\n    la façade au moins égale à leur hauteur et être de teinte identique à celle\n    de la toiture. Elles ne doivent pas être visibles depuis l’espace public.\n11.4.3 Toitures- terrasses\n    Toitures- terrasses non accessibles\n    Les toitures- terrasses non accessibles sont autorisées :\n    - Pour l’extension des bâtiments existants ne comportant pas de toitures\n    en pentes,\n    - Pour les bâtiments annexes d’une hauteur inférieure à 3,20 m (garage,\n    …),\n    - Pour les équipements publics et d’intérêt collectif,\n    - Pour des raisons architecturales (intégration d’édicules techniques en\n    toiture, liaisons des volumes bâtis...), les toitures- terrasses non\n    accessibles sont autorisées jusqu’à 10% maximum de la surface\n    d’emprise au sol de la construction projetée.\n    Toitures- terrasses accessibles\n    -   Les toitures- terrasses accessibles sont autorisées sur les\n    constructions à rez-de-chaussée n’excédant pas 5 m de hauteur\n    situées à l’arrière et en continuité des bâtiments implantés sur rue.\n    Ces toitures- terrasses sont impérativement à traiter en « dalles\n    jardin » aménagées en espaces verts.\n    -   A l’exception de la « dalle jardin » définie ci avant, les toitures-\n    terrasses, directement accessibles de plain-pied (terrasses formant\n    toiture des étages inférieurs) et intégrées à la construction projetée\n    sont acceptées dans la limite de 50% des surfaces d’emprise au sol de\n    la construction projetée. En cas d’extension, les 50% prennent en\n    compte la surface existante plus celle de l’extension.\n    Les édicules sur terrasses\n    Les édicules sur terrasses doivent être implantés en retrait de la façade\n    d’une distance au moins égale à leur hauteur.\n    PLAN LOCAL D’URBANISME    85\n    LA GARENNE-COLOMBES", "11.4.4   Toitures en pente\n    Pour les constructions à usage d’habitation, les toitures en pente doivent :\n    • Présenter une pente minimum de 30%.\n    Ou\n    • Etre de type « Mansard » : dans ce cas, elles doivent s’inscrire dans un\n    arc de cercle conforme au croquis suivant :\n    Le terrasson doit comporter une pente de 10% minimum.\n    Ou\n    S’il s’agit d’un étage en attique, s’inscrire dans l’épure suivante :\n    Les percements et ouvertures inclus dans le volume des toitures (lucarnes,\n    souches…) doivent être traités avec soin.\n    PLAN LOCAL D’URBANISME    86\n    LA GARENNE-COLOMBES", "11.5   Clôtures\n    11.5.1   Clôtures sur voies et emprises publiques\n    Les piliers de portail d’entrée et de clôture ne peuvent dépasser 2,20 m\n    de hauteur.\n    La clôture doit avoir une hauteur de 2m et comporter une partie pleine\n    (mur bahut) d’une hauteur comprise entre 0,80 et 1 m (mesurée au niveau\n    du trottoir). La partie supérieure de la clôture doit être constituée d’un\n    ensemble en serrurerie.\n    11.5.2   Les clôtures sur les autres limites ne doivent pas excéder une hauteur\n    totale de 2,60 m mesurée au niveau du trottoir.\n    11.5.3   Les règles ci-avant (11.5.1 et 11.5.2) ne sont pas applicables aux clôtures\n    entourant les équipements publics.\nARTICLE UPM1.12 - STATIONNEMENT\n12 .1: Règles applicables à l’ensemble des constructions à l’exception des\n    constructions et installations nécessaires aux services publics ou\n    d’intérêt collectif, lesquelles sont régies par l’article 12.2, ci-après\n    12.1.1   Principes généraux :\n    Le stationnement des véhicules doit être assuré en dehors des voies\n    publiques.\n    Lors de toute opération de construction neuve, les aires de stationnement\n    doivent être réalisées obligatoirement en sous-sol soit sur le terrain\n    d’assiette de ladite opération soit dans son environnement immédiat.\n    80% des aires de stationnement doivent avoir un accès direct. Les places\n    doubles auront une profondeur minimum de 9 m.\n    Les aires de stationnement doivent être accessibles en manœuvre\n    d’entrée et de sortie depuis les voies de circulation.\n    Les rampes ne doivent pas entraîner de modification dans le niveau du\n    trottoir. Leur pente dans les 5 premiers mètres à partir de l’alignement\n    ne doit pas excéder 5%, sauf dans le cas d’impossibilité technique, sous\n    réserve que l’implantation de la rampe permette les manœuvres d’entrée\n    et de sortie en toute sécurité.\n    Lors de toute opération de constructions neuves, les aires de\n    stationnement et leurs accès doivent être réalisés conformément aux\n    normes françaises dont les dispositions sont mentionnées à l’annexe 6 du\n    PLAN LOCAL D’URBANISME    87\n    LA GARENNE-COLOMBES", "    présent règlement « normes de stationnement communes à toutes les\n    zones ».\n    12.1.2   Nombre de stationnements :\n    DESTINATION DES    EMPLACEMENTS\n    CONSTRUCTIONS\nHabitation    1-    Les logements locatifs financés avec un prêt aidé\n    de l’Etat :\n    -    En application des dispositions de l’alinéa n° 1 de\n    l’article L.151-35 du Code de l’urbanisme, il est exigé, lors de\n    la construction de logements locatifs financés avec un prêt\n    aidé par l’Etat, la réalisation d’une aire de stationnement par\n    logement.\n    -    En application des dispositions de l’alinéa n°2 de\n    l’article L.151-35 du Code de l’urbanisme, il est exigé, lors de\n    la construction de logements locatifs financés avec un prêt\n    aidé par l’Etat, la réalisation de 0,5 aire de stationnement\n    par logement si ces derniers sont situés à moins de cinq cents\n    mètres d’une gare ou d’une station de transport public guidé\n    ou de transport collectif en site propre et que la qualité de\n    la desserte le permet.\n    2-    Les établissements assurant l’hébergement des\n    personnes âgées mentionnées au 6° du I de l’article\n    L.312-1 du code de l’action sociale et les résidences\n    universitaires mentionnées à l’article L.631-12 du code de\n    la construction et de l’habitation :\n    - Pour les établissements assurant l’hébergement des\n    personnes âgées, mentionnés au 6° du I de l’article L.312-1\n    du Code de l’action sociale, le nombre de places de\n    stationnement éventuellement nécessaire au fonctionnement\n    et à la fréquentation de ces établissements assurant\n    l’hébergement des personnes âgées mentionnées au 6 ° du I\n    de l’article L. 312-1 du Code de l’action sociale doit être\n    apprécié notamment au regard de leur mode de\n    fonctionnement, de leurs besoins propres , de leur situation\n    sur le territoire communal, des possibilités de desserte par\n    les transports en commun ainsi que de l’offre publique de\n    stationnement disponible, existante ou projetée, dans le\n    secteur du projet sans pouvoir excéder 1 place par logement\n    conformément aux dispositions de l’article L. 151- 35 du\n    Code de l’Urbanisme.\n    -    Pour les résidences universitaires mentionnées à\n    l’article L.631-12 du Code de la construction et de\n    l’habitation, le nombre de places de stationnement\n    éventuellement nécessaire au fonctionnement et à la\n    PLAN LOCAL D’URBANISME    88\n    LA GARENNE-COLOMBES", "    fréquentation de ces résidences universitaires mentionnées\n    à l’article L. 631-12 du Code de la construction et\n    de l’habitation doit être apprécié notamment au regard de\n    leur mode de fonctionnement, de leurs besoin propres , de\n    leur situation sur le territoire communal, des possibilités de\n    desserte par les transports en commun ainsi que de l’offre\n    publique de stationnement disponible, existante ou projetée,\n    dans le secteur du projet sans pouvoir excéder 1 place par\n    logement conformément aux dispositions de l’article L. 151-\n    35 du Code de l’Urbanisme.\n    3-    Les autres catégories de logements :\n    - Pour les autres catégories de logements, quand ils sont\n    situés à plus de cinq cents mètres d’une gare ou d’une station\n    de transport public guidé ou de transport collectif en site\n    propre, il est exigé la réalisation d’une aire de stationnement\n    par tranche de 50 m² SP (avec un minimum de 1 place par\n    logement ou chambre indépendante et un maximum de 3\n    places par logement).\n    - Pour les autres catégories de logements, quand ils sont\n    situés à moins de cinq cents mètres d’une gare ou d’une\n    station de transport public guidé ou de transport collectif en\n    site propre et dès lors que la qualité de la desserte le\n    permet, il est exigé la réalisation d’une aire de stationnement\n    par logement.\nBureaux    1 place par tranche de 65 m² de S.P.\n    Les normes de stationnement pour les bureaux sont réduites\n    à 1 place/100 m² de S.P. dans un rayon de 300 m autour des\n    gares et des stations de tramway actuelles ou projetées,\n    distance appréciée à partir de leur entrée principale.\nCommerces\n   Entre 0 et 150 m² S.P.    Aucune place n’est exigée.\n- Entre 150 et 300 m² S.P.    1 place par tranche de 50 m² de S.P.\n    (2 places minimum).\n•   Entre 300 et 2 000 m² S.P.    1 place par tranche de 30 m² de S.P.\n•   Supérieur à 2 000 m² S.P.    1 place par tranche de 25 m² de S.P.\n    Dans un rayon de 300 m autour des gares et des stations de\n    tramway actuelles ou projetées, distance appréciée à partir\n    de leur entrée principale, les normes de stationnement sont\n    réduites à :\n•   Entre 150 et 300 m² S.P.    1 place par tranche de 75 m² de S.P.\n•   Entre 300 m² et 2 000 m² S.P.   1 place par tranche de 50 m² de S.P.\n•   Supérieur à 2 000 m² S.P.    1 place par tranche de 40 m² de S.P.\n    PLAN LOCAL D’URBANISME    89\n    LA GARENNE-COLOMBES", "Il est précisé que la règle ci-dessus relative aux obligations de stationnement pour les commerces\ns’applique par unité commerciale et non pour la surface commerciale totale créée dans une même\nopération.\nArtisanat, industrie, entrepôts    1 place pour 100 m² de S.P.\n    + aire de livraison au-delà de 200 m² S.P.\nHôtels    1 place pour 3 chambres.\n Les résultats en nombre de places découlant des normes énoncées ci-dessus doivent être arrondis\n à l’unité supérieure dès que la première décimale est supérieure ou égale à 5.\n    12.1.3    Lorsque le bénéficiaire du permis ou de la décision de non-opposition à une\n    déclaration préalable ne peut pas satisfaire aux obligations résultant de\n    l’article 12.1.2 il peut en être tenu quitte en justifiant pour les places qu’il\n    ne peut réaliser lui-même sur le terrain d’assiette ou dans son\n    environnement immédiat :\n    • soit de l’obtention d’une concession à long terme dans un parc public de\n    stationnement existant ou en cours de réalisation et situé à proximité\n    de l’opération,\n    • soit de l’acquisition ou de la concession de places dans un parc privé de\n    stationnement existant ou en cours de réalisation et situé à proximité\n    de l’opération,\n    Lorsqu’une aire de stationnement a été prise en compte dans le cadre d’une\n    concession à long terme ou d’un parc privé de stationnement, elle ne peut plus être\n    prise en compte, en tout ou partie, à l’occasion d’une nouvelle autorisation.\n    12.1.4    En cas d’extension et/ou de surélévation supérieure à 20 m² S.P., le\n    nombre d’aires de stationnement à réaliser pour les véhicules motorisés\n    correspond aux besoins générés calculés selon les règles définies à\n    l’article 12.1.2.\n    12.1.5    En cas de changement de destination de locaux, le nombre d’aires de\n    stationnement à réaliser pour les véhicules motorisés correspond aux\n    besoins générés calculés selon les règles définies à l’article 12.1.2.\n    12.1.6    Toute place supprimée doit être recréée dans l’unité foncière.\n    12.1.7    Une aire de stationnement doit être prévue pour les vélos à raison :\n    • d'un emplacement de 0,50 m² par logement.\n    • d'un emplacement de 0,25 m² pour 100 m² de S.P. de bureau, de\n    commerce ou d’artisanat.\n    PLAN LOCAL D’URBANISME    90\n    LA GARENNE-COLOMBES", "12.2 : Règles applicables aux constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif\n    12.2.1   Principes généraux :\n    Le stationnement des véhicules doit être assuré en dehors des voies\n    publiques, en surface ou en sous-sol, soit sur le terrain d’assiette du projet\n    soit dans son environnement immédiat.\n    80% des aires de stationnement doivent avoir un accès direct. Les places\n    doubles auront une profondeur minimum de 9 m.\n    Les aires de stationnement doivent être accessibles en manœuvre\n    d’entrée et de sortie depuis les voies de circulation.\n    Les rampes ne doivent pas entraîner de modification dans le niveau du\n    trottoir. Leur pente dans les 5 premiers mètres à partir de l’alignement\n    ne doit pas excéder 5%, sauf dans le cas d’impossibilité technique, sous\n    réserve que l’implantation de la rampe permette les manœuvres d’entrée\n    et de sortie en toute sécurité.\n    Lors de toute opération de constructions neuves, les aires de\n    stationnement et accès doivent être réalisés conformément aux normes\n    françaises dont les dispositions sont mentionnées à l’annexe 6 du présent\n    règlement « normes de stationnement communes à toutes les zones ».\n    12.2.2    Nombre d’aires de stationnement pour les véhicules motorisés :\n  DESTINATION DES CONSTRUCTIONS    EMPLACEMENTS\nConstructions et installations nécessaires aux    Le nombre de places de stationnement\nservices publics ou d’intérêt collectif    éventuellement nécessaire au fonctionnement et à\n (crèche, groupe    scolaire maternel    et   la fréquentation des constructions et installations\nélémentaire, enseignement secondaire et    nécessaires aux services publics ou d’intérêt\nsupérieur,    centre    aquatique,   patinoire,   collectif doit être apprécié notamment au regard\nbibliothèque, médiathèque, cinéma, salle de    de la nature de l’équipement, de son mode de\nspectacle, hôpital, clinique, foyer de vie pour    fonctionnement, de sa situation sur le territoire\npersonnes handicapées, maison-relais, EHPAD,    communal, des possibilités de desserte par les\nfoyer    jeunes    travailleurs,   résidences    transports en commun ainsi que de l’offre publique\nservices…).    de stationnement disponible, existante ou projetée\n    dans le secteur du projet.\n    PLAN LOCAL D’URBANISME    91\n    LA GARENNE-COLOMBES", "    Cette offre publique de stationnement doit être\n    existante à la date de mise en service de\n    l’équipement.\n    Par dérogation aux principes généraux énoncés à\n    l’article 12.2.1 il peut être recouru en tant que de\n    besoin au stationnement sur la voie publique pour\n    les seuls stationnements de très courte durée\n    (type dépose-minute…).\n    12.2.3 Toute place supprimée doit être remplacée.\nARTICLE UPM1.13 - ESPACES LIBRES ET PLANTATIONS\n13.1   Déduction faite des circulations, cheminements et aires de stationnement rendues\n    obligatoires par l’article 12, 60% des étendues libres de toute construction en\n    élévation doivent être traitées en espaces paysagers plantés sur 60 cm de terre\n    végétale minimum.\n    Toutefois, les étendues libres des équipements publics et des équipements\n    d’intérêt collectif (cf. définitions) peuvent faire l’objet d’un aménagement minéral.\n13.2   En limite de terrain, le niveau fini des espaces verts à rez-de-chaussée ne peut\n    être supérieur au niveau du terrain voisin.\nARTICLE UPM1.14 - COEFFICIENT D’OCCUPATION DU SOL\n    Sans objet.\n    PLAN LOCAL D’URBANISME    92\n    LA GARENNE-COLOMBES", " ZONE UPM2\nPLAN LOCAL D’URBANISME   93\n LA GARENNE-COLOMBES", "La zone UPM 2 a pour vocation de renforcer le statut d’axe majeur du boulevard de la\nRépublique. Cet objectif se traduit par la requalification des têtes d’îlots convergeant au\nniveau du carrefour qui permettra de constituer un front bâti continu haut, et par la\nrestructuration d
