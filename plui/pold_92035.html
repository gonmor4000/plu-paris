u du trottoir.\n    11.5.3   Les règles ci-avant (11.5.1 et 11.5.2) ne sont pas applicables aux clôtures\n    entourant les équipements publics.\nArticle USP1.12- Stationnement\n12 .1: Règles applicables à l’ensemble des constructions à l’exception des\n    constructions et installations nécessaires aux services publics ou\n    d’intérêt collectif, lesquelles sont régies par l’article 12.2, ci-après.\n    Le stationnement des véhicules doit être assuré en dehors des voies publiques.\n    Lors de toute opération de construction neuve, les aires de stationnement doivent\n    être réalisées, en sous-sol, sur le terrain d’assiette de ladite opération au dans son\n    environnement immédiat.\n    80% des aires de stationnement doivent avoir un accès direct. Les places doubles\n    auront une profondeur minimum de 9 m.\n    Les aires de stationnement doivent être accessibles en manœuvre d’entrée et de\n    sortie depuis les voies de circulation.\n    Les rampes ne doivent pas entraîner de modification dans le niveau du trottoir. Leur\n    pente dans les 5 premiers mètres à partir de l’alignement ne doit pas excéder 5%,\n    sauf dans le cas d’impossibilité technique, sous réserve que l’implantation de la\n    rampe permette les manœuvres d’entrée et de sortie en toute sécurité.\n    Lors de toute opération de constructions neuves, les aires de stationnement et\n    leurs accès doivent être réalisés conformément aux normes françaises dont les\n    dispositions sont mentionnées à l’annexe 6 du présent règlement « normes de\n    stationnement communes à toutes les zones ».\n    12.1.2    Nombre d’aires de stationnement pour les véhicules motorisés :\n    12.1.2.1 Cas général\n    PLAN LOCAL D’URBANISME    138\n    LA GARENNE-COLOMBES", "    DESTINATION DES    EMPLACEMENTS\n    CONSTRUCTIONS\nHabitation    1-    Les logements locatifs financés avec un prêt aidé de\n    l’Etat :\n    -    En application des dispositions de l’alinéa n° 1 de\n    l’article L.151-15 du Code de l’urbanisme, il est exigé, lors de la\n    construction de logements locatifs financés avec un prêt aidé\n    par l’Etat, la réalisation d’une aire de stationnement par\n    logement.\n    -    En application des dispositions de l’alinéa n°2 de\n    l’article L.151-15 du Code de l’urbanisme, il est exigé, lors de la\n    construction de logements locatifs financés avec un prêt aidé\n    par l’Etat, la réalisation de 0,5 aire de stationnement par\n    logement si ces derniers sont situés à moins de cinq cents\n    mètres d’une gare ou d’une station de transport public guidé\n    ou de transport collectif en site propre et que la qualité de la\n    desserte le permet.\n    2-    Les établissements assurant l’hébergement des\n    personnes âgées mentionnées au 6° du I de l’article L.312-\n    1 du code de l’action sociale et les résidences universitaires\n    mentionnées à l’article L.631-12 du code de la construction\n    et de l’habitation :\n    Pour les établissements assurant l’hébergement des personnes\n    âgées, mentionnés au 6° du I de l’article L.312-1 du Code de\n    l’action sociale le nombre de places de stationnement\n    éventuellement nécessaire au fonctionnement et à la\n    fréquentation de ces établissements assurant l’hébergement\n    des personnes âgées mentionnées au 6 ° du I de l’article L. 312-\n    1 du Code de l’action sociale doit être apprécié notamment au\n    regard de leur mode de fonctionnement, de leurs besoins\n    propres , de leur situation sur le territoire communal, des\n    possibilités de desserte par les transports en commun ainsi\n    que de l’offre publique de stationnement disponible, existante\n    ou projetée, dans le secteur du projet sans pouvoir excéder 1\n    place par logement conformément aux dispositions de l’article\n    L. 151- 35 du Code de l’urbanisme.\n    -    Pour les résidences universitaires mentionnées à\n    l’article L.631-12 du Code de la construction et de l’habitation,\n    le nombre de places de stationnement éventuellement\n    nécessaire au fonctionnement et à la fréquentation de ces\n    résidences universitaires mentionnées à l’article L. 631-12 du\n    Code de la construction et de l’habitation doit être apprécié\n    notamment au regard de leur mode de fonctionnement, de\n    leurs besoin propres , de leur situation sur le territoire\n    communal, des possibilités de desserte par les transports en\n    commun ainsi que de l’offre publique de stationnement\n    disponible, existante ou projetée, dans le secteur du projet\n    PLAN LOCAL D’URBANISME    139\n    LA GARENNE-COLOMBES", "    sans pouvoir excéder 1 place par logement conformément aux\n    dispositions de l’article L. 151- 35 du Code de l’urbanisme.\n    3-    Les autres catégories de logements :\n    -    Pour les autres catégories de logements, quand ils sont\n    situés à plus de cinq cents mètres d’une gare ou d’une station\n    de transport public guidé ou de transport collectif en site\n    propre, il est exigé la réalisation d’une aire de stationnement\n    par tranche de 50 m² SP (avec un minimum de 1 place par\n    logement ou chambre indépendante et un maximum de 3 places\n    par logement).\n    -    Pour les autres catégories de logements, quand ils sont\n    situés à moins de cinq cents mètres d’une gare ou d’une station\n    de transport public guidé ou de transport collectif en site\n    propre et dès lors que la qualité de la desserte le permet, il\n    est exigé la réalisation d’une aire de stationnement par\n    logement.\nBureaux    1 place par tranche de 65 m² de S.P.\n    Les normes de stationnement pour les bureaux sont réduites à\n    1 place/100 m² de S.P. dans un rayon de 300 m autour des\n    gares et des stations de tramway actuelles ou projetées,\n    distance appréciée à partir de leur entrée principale.\nCommerces\n• Inférieur à 300 m² S.P.    1 place par tranche de 50 m² de S.P.\n    (2 places minimum).\n•   Entre 300 m² et 2 000 m² S.P. 1 place par tranche de 30 m² de S.P.\n•   Supérieur à 2 000 m² S.P.\n    1 place par tranche de 25 m² de S.P.\n    Dans un rayon de 300 m autour des gares et des stations de\n    tramway actuelles ou projetées, distance appréciée à partir de\n    leur entrée principale, les normes de stationnement sont\n•   Inférieur à 300 m² S.P.    réduites à :\n•   Entre 300 m² et 2 000 m² S.P. 1 place par tranche de 75 m² de S.P.\n•   Supérieur à 2 000 m² S.P.    1 place par tranche de 50 m² de S.P.\n    1 place par tranche de 40 m² de S.P.\n« Il est précisé que la règle ci-dessus relative aux obligations de stationnement pour les commerces\ns’applique par unité commerciale et non pour la surface commerciale totale créée dans une même\nopération. »\nArtisanat, industrie, entrepôts    1 place pour 100 m² de S.P.\n    + aire de livraison au-delà de 200 m² S.P.\nHôtels    1 place pour 3 chambres.\n    12.1.2.2 Exceptions\n    PLAN LOCAL D’URBANISME    140\n    LA GARENNE-COLOMBES", "En zone USP1 a :\nLe pétitionnaire doit réaliser au minimum une place par logement.\nPour le logement accueillant des publics spécifiques, il convient de se reporter à\nl’article 12.2.2.\nEn zone USP1 b :\nEn application des dispositions de l’alinéa n °1 de l’article L.151-15 du Code de l’urbanisme, il\nne peut être exigé la réalisation de plus d’une aire de stationnement par logement lors de la\nconstruction de logements locatifs financés avec un prêt aidé par l’Etat.\nLes résultats en nombre de places découlant des normes énoncées ci-dessus doivent être arrondis à\nl’unité supérieure dès que la première décimale est supérieure ou égale à 5.\n    12.1.3   En application des dispositions de l’article L. 151-1 du Code de l’urbanisme les\n    normes de réalisation d’aires de stationnement édictées à l’article 12.1.2 sont\n    réduites à 15 % en contrepartie de la mise à disposition de véhicules électriques\n    munis d’un dispositif de recharge adapté ou de véhicules propres en auto-\n    partage.\n    12.1.4    Lorsque le bénéficiaire du permis ou de la décision de non-opposition à une\n    déclaration préalable ne peut pas satisfaire aux obligations résultant de\n    l’article 12.1.2, il peut en être tenu quitte en justifiant pour les places qu’il\n    ne peut réaliser lui-même sur le terrain d’assiette ou dans son\n    environnement immédiat :\n    •    soit de l’obtention d’une concession à long terme dans un parc public\n    de stationnement existant ou en cours de réalisation et situé à\n    proximité de l’opération,\n    •    soit de l’acquisition ou de la concession de places dans un parc privé\n    de stationnement existant ou en cours de réalisation et situé à\n    proximité de l’opération\n    Lorsqu’une aire de stationnement a été prise en compte dans le cadre d’une\n    concession à long terme ou d’un parc privé de stationnement, elle ne peut\n    plus être prise en compte, en tout ou partie, à l’occasion d’une nouvelle\n    autorisation.\n    12.1.5    En cas d’extension et/ou de surélévation supérieure à 20 m² S.P., le\n    nombre de d’aires de stationnement à réaliser pour les véhicules motorisés\n    correspond aux besoins générés calculés selon les règles définies à\n    l’article 12.1.2.\n    12.1.6    En cas de changement de destination de locaux, le nombre d’aires de\n    stationnement à réaliser correspond pour les véhicules motorisés aux\n    besoins générés calculés selon les règles définies à l’article 12.1.2.\n    PLAN LOCAL D’URBANISME    141\n    LA GARENNE-COLOMBES", "    12.1.7    Toute place supprimée doit être recréée dans l’unité foncière.\n    12.1.8    Une aire de stationnement doit être prévue pour les vélos à raison :\n    •   d'un emplacement de 0,50 m² par logement.\n    •   d'un emplacement de 0,25 m² pour 100 m² de S.P. de bureau, de\n    commerce ou d’artisanat.\n12 .2: Règles applicables aux constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif\n    12.2.1    Principes généraux :\n    Le stationnement des véhicules doit être assuré en dehors des voies\n    publiques, en surface ou en sous-sol, sur le terrain d’assiette du projet ou\n    dans son environnement immédiat.\n    80% des aires de stationnement doivent avoir un accès direct. Les places\n    doubles auront une profondeur minimum de 9 m.\n    Les aires de stationnement doivent être accessibles en manœuvre\n    d’entrée et de sortie depuis les voies de circulation.\n    Les rampes ne doivent pas entraîner de modification dans le niveau du\n    trottoir. Leur pente dans les 5 premiers mètres à partir de l’alignement\n    ne doit pas excéder 5%, sauf dans le cas d’impossibilité technique, sous\n    réserve que l’implantation de la rampe permette les manœuvres d’entrée\n    et de sortie en toute sécurité.\n    Lors de toute opération de constructions neuves, les aires de\n    stationnement et leurs accès doivent être réalisés conformément aux\n    normes françaises dont les dispositions sont mentionnées à l’annexe 6 du\n    présent règlement « normes de stationnement communes à toutes les\n    zones ».\n    12.2..2   Nombre d’aires stationnement pour les véhicules motorisés\n  DESTINATION DES CONSTRUCTIONS    EMPLACEMENTS\nConstructions et installations nécessaires aux    Le nombre de places de stationnement\nservices publics ou d’intérêt collectif    éventuellement nécessaire au fonctionnement et à\n (crèche, groupe    scolaire maternel    et   la fréquentation des constructions et installations\nélémentaire, enseignement secondaire et    nécessaires aux services publics ou d’intérêt\nsupérieur,    centre    aquatique,   patinoire,   collectif doit être apprécié notamment au regard\nbibliothèque, médiathèque, cinéma, salle de    de la nature de l’équipement, de son mode de\nspectacle, hôpital, clinique, foyer de vie pour    fonctionnement, de sa situation sur le territoire\npersonnes    handicapées,    maison-relais,   communal, des possibilités de desserte par les\n    transports en commun ainsi que de l’offre publique\n    PLAN LOCAL D’URBANISME    142\n    LA GARENNE-COLOMBES", "hébergement d’urgence, foyer de    jeunes de stationnement disponible, existante ou projetée\ntravailleurs, résidences services .…).    dans le secteur du projet.\n    Cette offre publique de stationnement doit être\n    existante à la date de mise en service de\n    l’équipement.\n    Par dérogation aux principes généraux énoncés à\n    l’article 12.2.1 il peut être recouru en tant que de\n    besoin au stationnement sur la voie publique pour\n    les seuls stationnements de très courte durée\n    (type dépose-minute…).\n    12.2.3 Toute place supprimée doit être remplacée.\nARTICLE USP1.13 -    ESPACES LIBRES ET PLANTATIONS\n    Déduction faite des circulations, cheminements et aires de stationnement 60% des\n    étendues libres de toute construction en élévation doivent être traitées en espaces\n    paysagers plantés sur 60 cm de terre végétale minimum.\n    Toutefois, les étendues libres des équipements publics et des équipements d’intérêt\n    collectif (cf. définitions) peuvent faire l’objet d’un aménagement minéral.\nARTICLE USP1.14 -    COEFFICIENT D’OCCUPATION DU SOL\n    Sans objet.\n    PLAN LOCAL D’URBANISME    143\n    LA GARENNE-COLOMBES", " ZONE USP 2\nPLAN LOCAL D’URBANISME   144\n LA GARENNE-COLOMBES", "La zone USP2 traduit les orientations d’aménagement du quartier Charlebourg induites\nnotamment par la reconversion du site industriel ex. PSA. Ce secteur est compris entre le\nboulevard National, l’avenue de Verdun 1916, la rue des Champs Philippe, la rue Jules Ferry\net la rue des Fauvelles.\nCette zone a pour vocation d’être une zone mixte, accueillant différentes fonctions :\nhabitations, services, commerces, bureaux, équipements publics et d’intérêt collectif (…).\nElle comprend un sous-secteur USP2a qui a pour objectif de qualifier l’entrée de Ville depuis\nle boulevard National. Sa vocation est également d’être une zone de forte mixité\nfonctionnelle avec un CINASPIC constitué notamment par un centre-bus en infrastructure\n100 % électrique dont les règles diffèrent aux articles 8, 10, 11 et 12.\nARTICLE USP2.1 - OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\nSont interdits :\n1.1    L’implantation et l’extension des installations classées soumises à autorisation sauf\n    celles mentionnées à l’article 2.\n1.2    Les dépôts non couverts de ferrailles, de matériaux, de combustibles solides, ainsi\n    que les entreprises de cassage de voitures et la transformation de matériaux de\n    récupération.\n1.3    Les affouillements et exhaussements des sols nécessitant une autorisation au titre\n    des dispositions du Code de l’Urbanisme et qui ne sont pas nécessaires à des travaux\n    de construction et d’aménagement.\n1.4    Le stationnement des caravanes et installations de camping soumises à autorisation\n    préalable à l’exception, le cas échéant, de l’aire d’accueil des gens du voyage.\n1.5    Le changement de destination des locaux commerciaux et artisanaux situés sur\n    l’ensemble de l’unité foncière concernée le long des voies définies comme «\n    servitudes commerciales et artisanales » sur le document graphique 4.7.\n    L’interdiction de changement de destination ne s’applique pas aux équipements\n    publics.\nARTICLE USP2.2 - OCCUPATIONS ET UTILISATIONS DU SOL ADMISES SOUS\n    CONDITIONS PARTICULIERES\n2.1    Les installations classées, soumises à autorisation, sont autorisées à condition\n    qu’elles n’entraînent pour le voisinage aucune incommodité et, en cas d’accident ou\n    de fonctionnement défectueux, aucune insalubrité, ni sinistre susceptible de causer\n    des dommages graves ou irréparables aux personnes et aux biens.\n2.2    L’extension ou la transformation des installations classées existantes est\n    autorisée, à condition qu’il n’en résulte pas pour le voisinage une aggravation des\n    PLAN LOCAL D’URBANISME    145\n    LA GARENNE-COLOMBES", "    dangers ou nuisances liés au classement, et que toutes dispositions utiles soient\n    mises en œuvre pour l’intégration dans le milieu environnant.\n2.3    Pour les constructions existantes excédant l’emprise et la hauteur au sol autorisée,\n    les changements de destinations sont autorisés dans la limite de l’emprise et de la\n    hauteur existante à la date d’entrée en vigueur du PLU.\n2.4    Le long des voies concernées par les « servitudes commerciales et artisanales » sur\n    le document graphique 4.2, les constructions nouvelles devront comporter des\n    locaux commerciaux ou artisanaux à rez-de-chaussée. Cet article ne s’applique pas\n    aux équipements publics. Les locaux commerciaux et artisanaux supprimés doivent\n    être reconstitués au sein de l’unité foncière.\nRappel : Les constructions neuves à destination d'habitation, implantées le long des voies\nbruyantes, doivent respecter les règles d'isolement acoustique définies par l'arrêté\npréfectoral n°2000-174 du 29 juin 2000.\nARTICLE USP2.3- ACCES ET VOIRIE\n3.1    Pour être constructible, un terrain doit être desservi par une voie, publique ou\n    privée, existante ou projetée au présent PLU, ou par un accès (éventuellement\n    obtenu par application de l’article 682 du Code Civil) ouvert à la circulation\n    automobile, de caractéristiques proportionnées à l’importance de l’occupation ou de\n    l’utilisation du sol envisagée.\n3.2    Les voies privées nouvelles se terminant en impasse doivent être aménagées de telle\n    sorte que les véhicules puissent faire demi-tour.\nARTICLE USP2.4 - DESSERTE PAR LES RESEAUX ET STOCKAGE DES DECHETS\n4.2    Eau\n    Toute construction ou installation nouvelle nécessitant une alimentation en eau doit\n    être raccordée au réseau public d’eau potable.\n4.2    Assainissement\n    Eaux usées – eaux vannes\n    Toute construction ou installation nouvelle doit être raccordée au réseau public\n    d’assainissement.\n    Jusqu’aux limites de propriété, les rejets doivent être réalisés par un réseau\n    séparatif.\n    PLAN LOCAL D’URBANISME    146\n    LA GARENNE-COLOMBES", "    L’évacuation des eaux résiduaires provenant des installations industrielles ou\n    artisanales doit faire l’objet d’un pré- traitement avant le rejet dans le réseau\n    public d’assainissement.\n    Recommandations sur les eaux pluviales\n    De manière à limiter ces apports, tant d’un point de vue qualitatif que quantitatif,\n    des techniques alternatives aux réseaux devront être privilégiées (noues,\n    chaussées réservoirs, fossés drainant, bassins…).\n    En cas d’extension ou d’aménagement d’une construction existante, des dispositifs\n    appropriés peuvent être recherchés afin d’assurer la maîtrise des débits et\n    l’écoulement des eaux pluviales et de ruissellement, en se rapprochant des normes\n    édictées ci-dessous.\n    Eaux pluviales\n    Le débit généré par une construction neuve ou une reconstruction ne doit pas\n    excéder pour une pluie de retour décennal 2l/s/ha pour un rejet dans un réseau\n    unitaire.\n    En cas d’extension :\n    - si la construction existante présente un débit de rejet conforme (<2l/s/ha), le\n    débit de rejet de la construction après travaux doit être conforme.\n    - si la construction existante n’est pas conforme, le débit de rejet de la\n    construction après travaux ne doit pas être supérieur à celui de la construction\n    existante.\n    Recommandations sur le stockage des déchets\n    Pour toute construction ou groupe de construction à usage de logements supérieur\n    à trois logements ou à 200 m² S.P. ou à usage de bureaux, un local destiné au\n    stockage des conteneurs recueillant les ordures ménagères doit être aménagé et\n    dimensionné au tri sélectif selon les besoins générés par la construction.\n    Nota : Le local de stockage doit être conforme au règlement communal en vigueur\n    et aux prescriptions de l’article 77 du règlement sanitaire départemental des\n    Hauts-de-Seine. Cet article est annexé au présent règlement.\n4.3   Réseaux câbles et télécommunications\n    Toute construction nouvelle doit prévoir les infrastructures nécessaires à la\n    distribution de ces réseaux depuis le point de raccordement général jusqu’à la limite\n    de parcelle.\n    Les branchements privatifs nécessaires à la distribution de ces réseaux doivent\n    être réalisés en souterrain jusqu’en limite du domaine public, et ne doivent pas\n    rester apparents sur la construction.\n    PLAN LOCAL D’URBANISME    147\n    LA GARENNE-COLOMBES", "ARTICLE USP2.5 - CARACTERISTIQUES DES TERRAINS\n    Sans objet.\nARTICLE USP2.6 - IMPLANTATION    DES    CONSTRUCTIONS    PAR   RAPPORT    AUX\n    VOIES   PUBLIQUES,    AUX    VOIES    PRIVEES    OUVERTES    A    LA\n    CIRCULATION    AUTOMOBILE    ET    AUX    EMPRISES    PUBLIQUES\n    (PLACES, VOIES FERROVIAIRES, SQUARES ET JARDINS, MAILS\n    PIETONNIERS, EQUIPEMENTS SCOLAIRES ET SPORTIFS…)\nPrincipe général\nL’implantation d’un bâtiment s’apprécie par rapport à la projection au sol du bâtiment, hors\nsaillies ou surplombs autorisés.\n6.1    Implantation\n    Constructions existantes\n    6.1.1    Les travaux de modification de façade ou de surélévation d’un niveau, dont\n    l’implantation ne respecte pas les articles 6.1.2 et 6.1.3, peuvent être\n    autorisés à condition que ces transformations n’entraînent pas une\n    augmentation de l’emprise au sol dans la marge de reculement quand elle\n    existe. Cet article ne s’applique pas aux équipements publics et d’intérêt\n    collectif.\n    Constructions nouvelles\n    6.1.2    Sur les voies suivantes : le boulevard National, l’avenue de Verdun 1916, la\n    rue Jules Ferry, la rue des Fauvelles :\n    A l’exception des saillies et des surplombs autorisés, et en l’absence de\n    marge de reculement portée sur le document graphique, les constructions\n    doivent être implantées à l’alignement actuel ou futur.\n    Des retraits sont acceptés, pour autant qu’au moins 50 % du linéaire de\n    façade concerné soit implanté à l’alignement actuel ou futur.\n    Cet article ne s’applique pas aux entrées de Ville telle qu’identifiées sur le\n    document graphique.\n    6.1.3   Sur les autres voies, existantes ou futures :\n    Pour l’application du présent article, il est précisé que pour l’implantation\n    des constructions futures, des retraits partiels ou ponctuels sont\n    acceptés pour autant qu’ils n’excèdent pas 35% du linéaire de façade\n    concerné.\n    PLAN LOCAL D’URBANISME    148\n    LA GARENNE-COLOMBES", "A l’exception des saillies et surplombs autorisés, et en l’absence\nd’indication sur le document graphique, les constructions doivent être\nimplantées :\n• A l’alignement actuel ou futur s’il n’existe pas de construction sur les\n  terrains contigus.\n• A l’alignement actuel ou futur si les constructions existantes de part\n  et d’autre sont à l’alignement.\n• Si pour l’un des terrains contigus, la construction existante est\n  implantée à l’alignement actuel ou futur et que sur l’autre elle est\n  implantée en retrait, la construction projetée peut être implantée :\n  - à l’alignement actuel ou futur.\n  - ou en retrait, sans pouvoir excéder 5 mètres.\n• Si de part et d’autre, les constructions existantes sur les terrains\n  contigus sont implantées en retrait, la construction projetée doit être\n  implantée en retrait. Ce retrait, d’un maximum de 5 mètres, ne pourra\n  excéder celui des constructions situées de part et d’autre.\n    PLAN LOCAL D’URBANISME    149\n    LA GARENNE-COLOMBES", "    6.1.4    Les équipements publics et d’intérêt collectif peuvent être implantés :\n    - à l’alignement actuel ou futur.\n    - ou en retrait, sans pouvoir excéder 5 mètres.\n    Des retraits partiels ou ponctuels sont acceptés pour autant qu’ils\n    n’excèdent pas 20% du linéaire de façade concerné.\n6.2   Pans coupés\n    En l’absence d’indications particulières figurant sur le document graphique, un pan\n    coupé est à prévoir à l’angle de deux voies créant un alignement nouveau. Ce pan\n    coupé est constitué par un segment de droite de 5 m de longueur formant des angles\n    égaux avec chacun des alignements des voies.\n6.3   Surplombs\n    Des surplombs ménageant une hauteur libre d’au moins 3.50 m, mesurée à partir du\n    niveau existant ou projeté du trottoir, sont autorisés comme indiqués sur le\n    document graphique.\n6.4   Saillies\n    6.4.1    Saillies sur alignement :\n    6.4.1.1 Les saillies le long des voies communales de largeur supérieure à 8\n    mètres sont autorisées à la double condition :\n    • Être situées à une hauteur supérieure ou égale à 5.50 m du sol\n    mesurée au niveau du trottoir existant ou projeté.\n    • Avoir une profondeur maximale de 0.80 m mesurée à partir du\n    nu de la façade.\n    Cette profondeur maximale est portée à 1,80 m, mesurée à partir\n    du nu de la façade, pour les locaux à usage de bureaux.\n    Lorsqu’il s’agit de saillies formant auvent pour des constructions à\n    usage de bureau :\n    -   la hauteur libre par rapport au niveau du trottoir existant ou\n    projeté est ramenée à 3,50 m.\n    PLAN LOCAL D’URBANISME    150\n    LA GARENNE-COLOMBES", "    -   La profondeur ne doit pas dépasser 5m mesurée à partir du\n    nu de la façade.\n    Ces dispositions ne sont pas applicables aux équipements publics et d’intérêt\n    collectif.\n    6.4.1.2 Les saillies le long des autres voies :\n    Le long des autres voies, il doit être fait application du règlement\n    du gestionnaire de la voie.\n    6.4.1.3 Les saillies sur façades en retrait :\n    Les saillies sur façades en retrait sont autorisées sans restriction.\n    6.4.2    Saillies sur marge de reculement :\n    Les saillies sur marge de reculement sont autorisées sans restriction.\nARTICLE USP2.7 - IMPLANTATION    DES   CONSTRUCTIONS    PAR    RAPPORT    AUX\n    LIMITES SEPARATIVES\nPrincipe général\nL’implantation d’un bâtiment s’apprécie par rapport à la projection au sol du bâtiment, hors\nsaillies.\n7.1    Constructions existantes\n    La surélévation et l’extension d’un bâtiment existant peuvent être autorisées :\n    • Suivant les règles des constructions nouvelles.\n    Si ces règles ne peuvent pas être respectées :\n    • La surélévation d’un niveau et l’extension d’un bâtiment peuvent être autorisées\n    dans le prolongement des murs existants, à condition que les façades créées\n    ne respectant pas les prospects imposés ne comportent pas de baies autres\n    que des jours de souffrance.\n7.2    Constructions nouvelles\n    Les constructions peuvent être implantées sur limites séparatives ou en retrait.\n    7.2.1    En cas d’implantation sur les limites séparatives, la façade sur limite ne\n    peut comporter de baies autres que des jours de souffrance.\n    7.2.2    En cas d’implantation en retrait des limites séparatives, les constructions\n    (hors saillies) doivent respecter simultanément les règles définies ci-\n    dessous :\n    PLAN LOCAL D’URBANISME    151\n    LA GARENNE-COLOMBES", "    Façades principales\n    Façades comportant des baies principales (cf. définitions)\n    La    distance    horizontale   à    la   limite   séparative,   mesurée\n    perpendiculairement en tout point d’une façade comportant des baies\n    principales, devra être au moins égale à la hauteur de cette façade, sans\n    pouvoir être inférieure à 6 m.\n    Façades secondaires\n    Façades ne comportant pas de baies principales (cf. définitions)\n    La    distance    horizontale   à   la   limite   séparative,    mesurée\n    perpendiculairement en tout point d’une façade comportant des baies\n    secondaires ou ne comportant pas de baies, devra être au moins égale à la\n    moitié de la hauteur de cette façade, sans pouvoir être inférieure à 3m.\n7.3    Les équipements publics et d’intérêt collectif peuvent être implantés :\n    a) soit en limite séparative pour autant que chaque façade concernée ne\n    comporte pas de baies autres que des jours de souffrance.\n    b) soit en retrait des limites séparatives. Dans ce cas, chaque façade\n    concernée doit, au minimum, s’écarter de ces limites conformément aux\n    dispositions du Code civil.\n7.4    Les constructions peuvent être implantées à une distance moindre que celle définie\n    ci-dessus lorsque le pétitionnaire et son voisin font application des dispositions de\n    l’article L 471-1 du Code de l’Urbanisme, sous réserve de respecter la distance\n    minimale fixée à l’article USP2.8 avec les constructions situées sur le terrain voisin.\nARTICLE USP2.8 - IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT\n    AUX AUTRES SUR UNE MEME PROPRIETE\n8.1    Constructions existantes\n    La surélévation et l’extension d’un bâtiment existant peuvent être autorisées :\n    • suivant les règles des constructions nouvelles.\n    Si ces règles ne peuvent pas être respectées :\n    • La surélévation d’un niveau et l’extension d’un bâtiment peuvent être\n    autorisées dans le prolongement des murs existants, à condition que\n    les façades créées ne respectant pas les prospects imposés ne\n    comportent pas de baies autres que des jours de souffrance.\n8.2    Constructions nouvelles\n    PLAN LOCAL D’URBANISME    152\n    LA GARENNE-COLOMBES", "    8.2.1    La construction de plusieurs bâtiments non contigus sur une même\n    propriété non affecté à un usage de bureaux doit respecter les\n    dispositions suivantes :\n    La distance, mesurée perpendiculairement en tout point de la façade, doit\n    être au moins égale :\n    •    A la hauteur de la façade la plus haute, avec un minimum de 6 m si\n    l’une des façades comporte des baies principales.\n    ou\n    •    A la moitié de la façade la plus haute, avec un minimum de 3 m si les\n    deux façades ne comportent pas de baies principales.\nFaçades avec baie principale\nL ≥ H\n    H\n    L\n    min. 6 m\nFaçades sans baie principale\nL ≥ H/2\n    H\n    L\n    min. 3 m\n    8.2.2    Pour l’application de l’article 8.1, deux constructions réunies par un\n    élément architectural ponctuel tel qu’un auvent ou une pergola (etc.) ne\n    sont pas considérées contiguës.\n    8.2.3    Pour un usage de bureaux la construction de plusieurs bâtiments non\n    contigus sur une même propriété doit respecter les dispositions\n    suivantes :\n    PLAN LOCAL D’URBANISME    153\n    LA GARENNE-COLOMBES", "    La distance mesurée perpendiculairement en tout point de la façade doit\n    être au moins égale à la moitié de la façade la plus haute, avec un minimum\n    de 12 m.\n8.3    En secteur USP2a\n    La distance, mesurée perpendiculairement en tout point de façade à façade, doit\n    être au moins égale à 16 m.\nARTICLE USP2.9 - EMPRISE AU SOL\n9.1   Constructions existantes\n    9.1.1    L’emprise au sol ne doit pas excéder 40% de la surface du terrain.\n    9.1.3    Il n’est pas fixé de règle pour les équipements publics et d’intérêt\n    collectif.\n9.2   Constructions nouvelles\n    Il n’est pas fixé d’emprise au sol\n    PLAN LOCAL D’URBANISME    154\n    LA GARENNE-COLOMBES", "ARTICLE USP2.10 -    HAUTEUR MAXIMUM DES CONSTRUCTIONS\n    La hauteur des bâtiments est mesurée au point le plus haut du trottoir situé au\n    droit de l’unité foncière concernée et doit respecter les règles suivantes :\n10.1   Principe général\n    La hauteur maximum des constructions ne doit pas dépasser la hauteur indiquée au\n    document graphique.\n    A l’exception des dispositifs de réception de signaux radioélectriques, et des\n    souches de cheminées dans la limite d’une hauteur de 50 centimètres au-dessus de\n    la hauteur plafond, aucun édicule ou équipement technique ne doit dépasser le\n    plafond autorisé.\n    Ces édicules doivent être parfaitement intégrés au volume de la toiture. En\n    particulier, les édicules sur terrasse ne doivent pas dépasser la hauteur imposée au\n    document graphique.\n    Pour les opérations à usage de bureaux, un dépassement ponctuel et limité de la\n    hauteur indiquée au document graphique est autorisé pour faciliter l’intégration\n    architecturale des édicules ou équipements techniques. Ce dépassement ne doit pas\n    excéder de 2 mètres la hauteur maximum autorisée, ni représenter plus de 20% de\n    la surface totale de la toiture.\n10.2   En l’absence d’indication portée sur le document graphique, la hauteur\n    maximum des constructions est de :\n    10.2.1   Pour les constructions situées Boulevard National, Place de Belgique,\n    Avenue de Verdun 1916, la hauteur maximale est de :\n    •   19 m à l’égout ou 20 m à l’acrotère pour les toitures- terrasses.\n    •   22 m au faîtage pour les toitures à pentes, les toitures « Mansart »\n    et les toitures des étages en attique.\n    •   22 m pour les édicules sur toitures- terrasses.\n    PLAN LOCAL D’URBANISME    155\n    LA GARENNE-COLOMBES", "    10.2.2   Pour les autres voies, la hauteur maximum est de :\n    •   16 m à l’égout du toit ou 17 m à l’acrotère pour les toitures- terrasses.\n    •   19 m au faîtage pour les toitures à pentes et les toitures des étages\n    en attique.\n    •   19 m pour les édicules sur toitures- terrasses.\n10.3   En secteur USP2a\n    La hauteur maximum des constructions ne doit pas dépasser la hauteur indiquée au\n    document graphique.\n    Au regard de la grande mixité des destinations autorisées et pour faciliter une\n    parfaite intégration technique, architecturale et urbaine, un dépassement ponctuel\n    de la hauteur indiquée au document graphique est autorisé.\n    Ce dépassement ne doit pas excéder de 4 mètres la hauteur maximum autorisée, ni\n    représenter plus de 15% de la surface de la toiture.\n    Ces émergences verticales doivent être positionnées à 4 mètres minimum des\n    façades donnant sur les voies ou emprises publiques actuelles ou futures.\n    PLAN LOCAL D’URBANISME    156\n    LA GARENNE-COLOMBES", "ARTICLE USP2.11 -    ASPECT EXTERIEUR\n11.1   Dispositions générales\n    Les bâtiments ou ouvrages à édifier ou à modifier ne doivent pas porter atteinte\n    au caractère ou à l’intérêt des lieux avoisinants.\n11.2   Constructions existantes\n    Les opérations de réhabilitation-rénovation ne doivent pas dénaturer l’aspect\n    général de la construction existante.\n    11.2.1   Traitement des façades\n    Le caractère d’origine de la façade doit être préservé, notamment\n    lorsqu’elle est composée de pierres de taille ou de briques soigneusement\n    mises en œuvre.\n    Les matériaux destinés à être enduits doivent être recouverts. L’enduit\n    au mortier de ciment non teinté ou non peint est proscrit.\n    Les éléments d’ornementation existants (modénature, corniches, volets ou\n    persiennes, etc.) doivent être conservés. Ils peuvent être restaurés.\n    11.2.2   Eclairement des combles\n    L’éclairement éventuel des combles doit être assuré, soit par des lucarnes,\n    soit par des verrières ou des châssis de toit intégrés.\n    Les lucarnes doivent être à deux ou trois versants ou semi-cylindriques et\n    suivre, dans la mesure du possible, l’axe des percements des étages\n    inférieurs. La largeur hors tout de la lucarne ne peut excéder la dimension\n    horizontale de la fenêtre située à l’étage inférieur.\n    11.2.3   Surélévation\n    Les surélévations et redressements de toiture des constructions\n    achevées à la date d’entrée en vigueur du PLU doivent être traités en\n    harmonie avec l’architecture et les matériaux du bâtiment concerné.\n11.3   Constructions neuves à destination de logements\n    11.3.1  Pour les façades des constructions donnant sur les voies publiques ou\n    privées, doit être privilégié un choix de matériaux de qualité et pérennes\n    (stables dans la durée et nécessitant un faible entretien) tels que la\n    pierre, la brique, le métal, le verre, le béton architectonique, le bois, etc.\n    11.3.2 Les façades latérales et postérieures des constructions y compris les\n    pignons rendus visibles lors de démolitions ainsi que les constructions\n    PLAN LOCAL D’URBANISME    157\n    LA GARENNE-COLOMBES", "    annexes (garages, appentis…) doivent être traitées comme les façades\n    principales et en harmonie avec elles.\n    11.3.3 Les matériaux utilisés pour le traitement des murs pignons devront être\n    de même aspect et de même teinte que les façades principales ; les pignons\n    pourront être traités en trompe-l’œil.\n    11.3.4 Les verrières et dispositifs solaires intégrés peuvent être implantés en\n    façade et en toiture, sous réserve de ne pas porter atteinte à l’esprit\n    général de la construction.\n    11.3.5 Aucun matériau destiné à être enduit ou recouvert d’un parement (tels que\n    les carreaux de plâtre, les bardages, les briques creuses, les parpaings…)\n    ne doit être laissé apparent.\n    11.3.6 Les enduits d’aspect rustique ou grossier, tels que l’enduit au mortier de\n    ciment non teinté ou non peint, sont proscrits.\n11.4   Constructions neuves à destination de bureaux\n    Les constructions devront s’intégrer dans le paysage urbain environnant. Une\n    attention particulière doit être portée sur le rapport avec le bâti environnant\n    (prospect, volumétrie, altitude …).\n    11.4.1   Toutes les façades des constructions donnant sur les voies publiques ou\n    privées, sur des parcs ou jardins publics ou privés devront être réalisées\n    avec des matériaux de qualité et pérennes (stables dans la durée et\n    nécessitant un faible entretien) tels que la pierre, la brique, le métal, le\n    verre, le béton architectonique, le bois, etc.\n    11.4.2   Sont proscrits les matériaux destinés à être enduit ou recouvert d’un\n    parement (tels que les carreaux de plâtre, les bardages, les briques\n    creuses, les parpaings…).\n    11.4.3   Le soubassement constitue le socle de la construction :\n    • Il devra être en grande partie vitré,\n    • Son traitement pourra être différent du corps d’étage,\n    • Il pourra s’étendre sur deux niveaux\n    • Des transparences sont à privilégier en pied d’immeuble,\n    • Le traitement qualitatif des pieds d’immeuble devra prendre en\n    compte le nivellement de l’espace public existant ou projeté.\n    • Le niveau des halls d’accueil implantés à l’alignement ne doit pas\n    être inférieur au niveau du trottoir existant ou projeté, au droit\n    de chaque hall concerné.\n    • Lorsque le soubassement accueille des commerces ou activités, la\n    mise en place d’enseignes et tous autres dispositifs d‘information\n    devra respecter les principes du cahier des recommandations\n    urbaines, architecturales et paysagères ainsi que le règlement\n    local de publicité intercommunal (RLPi).\n    PLAN LOCAL D’URBANISME    158\n    LA GARENNE-COLOMBES", "    11.4.4   Les dispositifs de protection solaires seront intégrés à la façade et ne\n    devront pas porter atteinte à l’esprit général de la construction.\n11.5   Toitures\n    11.5.1   Principe général\n    Qu’il s’agisse de toitures constituées de matériaux traditionnels (tuiles,\n    zinc, ardoises…) ou plus récents (bacs acier, tôles d’aluminium anodisées\n    ou laquées…) ou de terrasses, les accessoires à caractère technique\n    (caissons de climatisation, extracteurs, édicules d’ascenseur, garde-\n    corps, antennes…) doivent être regroupés et intégrés à la toiture de façon\n    à en annuler l’impact visuel.\n    11.5.2   Antennes :\n    Les antennes d’émission ou de réception (radio, télévision, antenne\n    parabolique, radio- téléphone…), de quelque dimension que ce soit, doivent\n    être implantées exclusivement en toiture des bâtiments à une distance de\n    la façade au moins égale à leur hauteur et être de teinte identique à celle\n    de la toiture. Elles ne doivent pas être visibles depuis l’espace public.\n    11.5.3 Toitures-terrasses :\n    Toitures-terrasses non accessibles\n    Les toitures- terrasses non accessibles sont autorisées uniquement :\n    -   Pour l’extension des bâtiments existants ne comportant pas de toitures\n    en pentes,\n    -   pour les bâtiments annexes d’une hauteur inférieure à 3,20 m (garage,\n    …),\n    -   pour les équipements publics et d’intérêt collectif,\n    -   pour les constructions à destination de bureaux,\n    -   Pour des raisons architecturales (intégration d’édicules techniques en\n    toiture, liaisons des volumes bâtis...), les toitures- terrasses non\n    accessibles sont autorisées jusqu’à 10% maximum de la surface\n    d’emprise au sol de la construction projetée.\n    En secteur USP2a\n    Au regard de la grande mixité des destinations autorisées et afin de\n    garantir une parfaite harmonie architecturale et urbaine, les toitures-\n    terrasses non accessibles sont autorisées sans restriction.\n    Toitures- terrasses accessibles\n    Les toitures- terrasses accessibles sont autorisées sans restriction :\n    - pour les équipements publics et d’intérêt collectif,\n    - pour les constructions à usage de bureaux.\n    PLAN LOCAL D’URBANISME    159\n    LA GARENNE-COLOMBES", "    Pour toutes les autres destinations :\n    Les toitures- terrasses accessibles sont autorisées sur les constructions\n    à rez-de-chaussée n’excédant pas 5 m de hauteur situées à l’arrière et en\n    continuité des bâtiments implantés sur rue. Ces toitures- terrasses sont\n    impérativement à traiter en « dalles jardin » aménagées en espaces verts.\n    A l’exception de la « dalle jardin » définie ci avant, les toitures- terrasses,\n    directement accessibles de plain-pied (terrasses formant toiture des\n    étages inférieurs) et intégrées à la construction projetée sont acceptées\n    dans la limite de 50% des surfaces d’emprise au sol de la construction\n    projetée. En cas d’extension, les 50% prennent en compte la surface\n    existante plus celle de l’extension.\n    En secteur USP2a\n    Les toitures terrasses accessibles sont autorisées sans restriction.\n    Les édicules techniques\n    Les édicules techniques sur toitures- terrasses doivent être implantés en\n    retrait de la façade sur voies et emprises publiques existantes ou futures\n    d’une distance au moins égale à leur hauteur et devront faire l’objet d’un\n    traitement soigné, intégré à l’architecture du bâtiment.\n11.5.4 Toitures en pente :\n    Pour les constructions à usage d’habitation, les toitures en pente doivent :\n    • Présenter une pente minimum de 30%.\n    Où\n    • Être de type « Mansard » : dans ce cas, elles doivent s’inscrire dans un\n    arc de cercle conforme au croquis suivant :\n    •\n    Le terrasson doit comporter une pente de 10% minimum.\n    Où\n    PLAN LOCAL D’URBANISME    160\n    LA GARENNE-COLOMBES", "    S’il s’agit d’un étage en attique, s’inscrire dans l’épure suivante :\n    Les percements et ouvertures inclus dans le volume des toitures\n    (lucarnes, souches…) doivent être traités avec soin.\n11.6    Clôtures :\n   11.6.1   Clôtures sur voies et emprises publiques existantes ou projetées.\n    Les piliers de portail d’entrée et de clôture ne peuvent dépasser 2,20 m\n    de hauteur.\n    Pour les logements, la clôture doit avoir une hauteur de 2m (mesuré au\n    niveau du trottoir existant ou projeté) et comporter une partie pleine\n    (mur bahut) d’une hauteur comprise entre 0,50 et 0,80m. La partie\n    supérieure de la clôture doit être constituée d’un ensemble en serrurerie.\n    Pour les bureaux, la clôture doit avoir une hauteur au moins égale à 2m\n    sans pouvoir dépasser 2.50 m (mesurée au niveau du trottoir existant ou\n    projeté), elle devra être composée d’un soubassement maçonné ne\n    dépassant pas 0,20 m (mesuré au niveau du trottoir existant ou projeté)\n    et d’un ensemble de serrurerie en partie supérieure.\n   11.6.2   Les clôtures sur les autres limites ne doivent pas excéder une hauteur\n    totale de 2,60 m (mesurée au niveau du trottoir existant ou projeté).\n   Les règles ci-avant (11.6.1 et 11.6.2) ne sont pas applicables aux clôtures entourant\n   les équipements publics et d’intérêts collectifs.\n    PLAN LOCAL D’URBANISME    161\n    LA GARENNE-COLOMBES", "Article USP2.12 - Stationnement\n12 .1: Règles applicables à l’ensemble des constructions à l’exception des\n    constructions et installations nécessaires aux services publics ou\n    d’intérêt collectif, lesquelles sont régies par l’article 12.2, ci-après.\n    12.1.1   Principes généraux :\n    Le stationnement des véhicules doit être assuré en dehors des voies publiques.\n    Lors de toute opération de construction neuve, les aires de stationnement doivent\n    être réalisées, en sous-sol, sur le terrain d’assiette de ladite opération au dans son\n    environnement immédiat.\n    80% des aires de stationnement doivent avoir un accès direct. Les places doubles\n    auront une profondeur minimum de 9 m.\n    Les aires de stationnement doivent être accessibles en manœuvre d’entrée et de\n    sortie depuis les voies de circulation.\n    Les rampes ne doivent pas entraîner de modification dans le niveau du trottoir. Leur\n    pente dans les 5 premiers mètres à partir de l’alignement ne doit pas excéder 5%,\n    sauf dans le cas d’impossibilité technique, sous réserve que l’implantation de la\n    rampe permette les manœuvres d’entrée et de sortie en toute sécurité.\n    Lors de toute opération de constructions neuves, les aires de stationnement et\n    leurs accès doivent être réalisés conformément aux normes françaises dont les\n    dispositions sont mentionnées à l’annexe 6 du présent règlement « normes de\n    stationnement communes à toutes les zones ».\n    Toutes dispositions doivent être prises pour réserver sur chaque propriété les\n    dégagements nécessaires au stationnement et aux manœuvres, de façon à ce que\n    les opérations de chargement des véhicules s’effectuent à l’intérieur de la\n    propriété.\n    PLAN LOCAL D’URBANISME    162\n    LA GARENNE-COLOMBES", "    12.1.2   Nombre d’aires de stationnement pour les véhicules motorisés :\n    DESTINATION DES    EMPLACEMENTS\n    CONSTRUCTIONS\nHabitation    1-    Les logements locatifs financés avec un prêt aidé de\n    l’Etat :\n    -    En application des dispositions de l’alinéa n° 1 de\n    l’article L.151-35 du Code de l’urbanisme, il est exigé, lors de\n    la construction de logements locatifs financés avec un prêt\n    aidé par l’Etat, la réalisation d’une aire de stationnement par\n    logement.\n    -    En application des dispositions de l’alinéa n°2 de\n    l’article L.151-35 du Code de l’urbanisme, il est exigé, lors de\n    la construction de logements locatifs financés avec un prêt\n    aidé par l’Etat, la réalisation de 0,5 aire de stationnement par\n    logement si ces derniers sont situés à moins de cinq cents\n    mètres d’une gare ou d’une station de transport public guidé\n    ou de transport collectif en site propre et que la qualité de la\n    desserte le permet.\n    2-    Les établissements assurant l’hébergement des\n    personnes âgées mentionnées au 6° du I de l’article L.312-\n    1 du code de l’action sociale et les résidences universitaires\n    mentionnées à l’article L.631-12 du code de la construction\n    et de l’habitation :\n    Pour les établissements assurant l’hébergement des personnes\n    âgées, mentionnés au 6° du I de l’article L.312-1 du Code de\n    l’action sociale le nombre de places de stationnement\n    éventuellement nécessaire au fonctionnement et à la\n    fréquentation de ces établissements assurant l’hébergement\n    des personnes âgées mentionnées au 6 ° du I de l’article L. 312-\n    1 du Code de l’action sociale doit être apprécié notamment au\n    regard de leur mode de fonctionnement, de leurs besoins\n    propres , de leur situation sur le territoire communal, des\n    possibilités de desserte par les transports en commun ainsi\n    que de l’offre publique de stationnement disponible, existante\n    ou projetée, dans le secteur du projet sans pouvoir excéder 1\n    place par logement conformément aux dispositions de l’article\n    L. 151- 35 du Code de l’urbanisme.\n    -    Pour les résidences universitaires mentionnées à\n    l’article L.631-12 du Code de la construction et de l’habitation,\n    le nombre de places de stationnement éventuellement\n    nécessaire au fonctionnement et à la fréquentation de ces\n    résidences universitaires mentionnées à l’article L. 631-12 du\n    Code de la construction et de l’habitation doit être apprécié\n    notamment au regard de leur mode de fonctionnement, de\n    leurs besoin propres , de leur situation sur le territoire\n    communal, des possibilités de desserte par les transports en\n    PLAN LOCAL D’URBANISME    163\n    LA GARENNE-COLOMBES", "    commun ainsi que de l’offre publique de stationnement\n    disponible, existante ou projetée, dans le secteur du projet\n    sans pouvoir excéder 1 place par logement conformément aux\n    dispositions de l’article L. 151- 35 du Code de l’urbanisme.\n    3-    Les autres catégories de logements :\n    -    Pour les autres catégories de logements, quand ils sont\n    situés à plus de cinq cents mètres d’une gare ou d’une station\n    de transport public guidé ou de transport collectif en site\n    propre, il est exigé la réalisation d’une aire de stationnement\n    par tranche de 50 m² de SP (avec un minimum de 1 place par\n    logement ou chambre indépendante et un maximum de 3 places\n    par logement).\n    -    Pour les autres catégories de logements, quand ils sont\n    situés à moins de cinq cents mètres d’une gare ou d’une station\n    de transport public guidé ou de transport collectif en site\n    propre et dès lors que la qualité de la desserte le permet, il\n    est exigé la réalisation d’une aire de stationnement par\n    logement.\nBureaux    1 place par tranche de 65 m² de S.P.\n    Les normes de stationnement pour les bureaux sont réduites à\n    1 place/100 m² de S.P. dans un rayon de 300 m autour des\n    gares et des stations de tramway actuelles ou projetées,\n    distance appréciée à partir de leur entrée principale.\n    En secteur USP2a\n    Les normes de stationnement pour les bureaux sont réduites à\n    1 place/130m² de SP.\nCommerces\n• Entre 0 et 150 m² S.P.    Aucune place n’est exigée\n• Entre 150 et 300 m² S.P.    1 place par tranche de 50 m² de S.P.\n    (2 places minimum).\n•   Entre 300 et 2 000 m² S.P.    1 place par tranche de 30 m² de S.P.\n•   Supérieur à 2 000 m² S.P.    1 place par tranche de 25 m² de S.P.\n    Dans un rayon de 300 m autour des gares et des stations de\n    tramway actuelles ou projetées, distance appréciée à partir de\n    leur entrée principale, les normes de stationnement sont\n    réduites à :\n•   Entre 150 et 300 m² S.P.    1 place par tranche de 75 m² de S.P.\n•   Entre 300 et 2 000 m² S.P.    1 place par tranche de 50 m² de S.P.\n•   Supérieur à 2 000 m² S.P.    1 place par tranche de 40 m² de S.P.\n    PLAN LOCAL D’URBANISME    164\n    LA GARENNE-COLOMBES", "Artisanat, industrie, entrepôts    1 place pour 100 m² de S.P.\n    + aire de livraison au-delà de 200 m² S.P.\nHôtels    1 place pour 3 chambres.\nLes résultats en nombre de places découlant des normes énoncées ci-dessus doivent être arrondis à\nl’unité supérieure dès que la première décimale est supérieure ou égale à 5.\n    12.1.3   En application des dispositions de l’article L. 151-31 du Code de l’urbanisme les\n    normes de réalisation d’aires de stationnement édictées à l’article 12.1.2 sont\n    réduites à 15 % en contrepartie de la mise à disposition de véhicules électriques\n    munis d’un dispositif de recharge adapté ou de véhicules propres en auto-\n    partage.\n    12.1.4    Lorsque le bénéficiaire du permis ou de la décision de non-opposition à une\n    déclaration préalable ne peut pas satisfaire aux obligations résultant de\n    l’article 12.1.2, il peut en être tenu quitte en justifiant pour les places qu’il\n    ne peut réaliser lui-même sur le terrain d’assiette ou dans son\n    environnement immédiat :\n    •    soit de l’obtention d’une concession à long terme dans un parc public\n    de stationnement existant ou en cours de réalisation et situé à\n    proximité de l’opération,\n    •    soit de l’acquisition ou de la concession de places dans un parc privé\n    de stationnement existant ou en cours de réalisation et situé à\n    proximité de l’opération\n    Lorsqu’une aire de stationnement a été prise en compte dans le cadre d’une\n    concession à long terme ou d’un parc privé de stationnement, elle ne peut\n    plus être prise en compte, en tout ou partie, à l’occasion d’une nouvelle\n    autorisation.\n    12.1.5    En cas d’extension et/ou de surélévation supérieure à 20 m² S.P., le\n    nombre d’aires de stationnement à réaliser pour les véhicules motorisés\n    correspond aux besoins générés calculés selon les règles définies à\n    l’article 12.1.2.\n    12.1.6    En cas de changement de destination de locaux, le nombre d’aires de\n    stationnement à réaliser correspond pour les véhicules motorisés aux\n    besoins générés calculés selon les règles définies à l’article 12.1.2.\n    12.1.7    Toute place supprimée doit être recréée dans l’unité foncière.\n    12.1.8    Une aire de stationnement doit être prévue pour les vélos à raison :\n    •    d'un emplacement de 0,50 m² par logement.\n    •    d'un emplacement de 0,25 m² pour 100 m² de S.P. de bureau, de\n    commerce ou d’artisanat.\n    PLAN LOCAL D’URBANISME    165\n    LA GARENNE-COLOMBES", "12.2    Règles applicables aux constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif\n    12.2.1   Principes généraux :\n    Le stationnement des véhicules doit être assuré en dehors des voies\n    publiques, en surface ou en sous-sol, sur le terrain d’assiette du projet ou\n    dans son environnement immédiat.\n    80% des aires de stationnement doivent avoir un accès direct. Les places\n    doubles auront une profondeur minimum de 9 m.\n    Les aires de stationnement doivent être accessibles en manœuvre\n    d’entrée et de sortie depuis les voies de circulation.\n    Les rampes ne doivent pas entraîner de modification dans le niveau du\n    trottoir. Leur pente dans les 5 premiers mètres à partir de l’alignement\n    ne doit pas excéder 5%, sauf dans le cas d’impossibilité technique, sous\n    réserve que l’implantation de la rampe permette les manœuvres d’entrée\n    et de sortie en toute sécurité.\n    Lors de toute opération de constructions neuves, les aires de\n    stationnement et leurs accès doivent être réalisés conformément aux\n    normes françaises dont les dispositions sont mentionnées à l’annexe 6 du\n    présent règlement « normes de stationnement communes à toutes les\n    zones ».\n    12.2.2   Nombre d’aires de stationnement pour les véhicules motorisés\n  DESTINATION DES CONSTRUCTIONS    EMPLACEMENTS\nConstructions et installations nécessaires aux    Le nombre de places de stationnement\nservices publics ou d’intérêt collectif    éventuellement nécessaire au fonctionnement et à\n(établissements d’action sociale, récréatifs,    la fréquentation des constructions et installations\nculturels, EHPAD, foyer de jeunes travailleurs,   nécessaires aux services publics ou d’intérêt\nrésidences services de tout type, crèche,    collectif doit être apprécié notamment au regard\ngroupe scolaire maternel et élémentaire,    de la nature de l’équipement, de son mode de\nenseignement secondaire et supérieur, centre    fonctionnement, de sa situation sur le territoire\naquatique, centre sportif, gymnase, patinoire,    communal, des possibilités de desserte par les\nbibliothèque, médiathèque, cinéma, salle de    transports en commun ainsi que de l’offre publique\nspectacle, hôpital, clinique, foyer de vie pour   de stationnement disponible, existante ou projetée\npersonnes handicapées, maison-relais,    dans le secteur du projet.\nhébergement d’urgence, résidences\nservices,.…) et grands services urbains et    Cette offre publique de stationnement doit être\ninfrastructures de transport public    existante à la date de mise en service de\n    l’équipement.\n    PLAN LOCAL D’URBANISME    166\n    LA GARENNE-COLOMBES", "    Par dérogation aux principes généraux énoncés à\n    l’article 12.2.1, il peut être recouru en tant que de\n    besoin au stationnement sur la voie publique pour\n    les seuls stationnements de très courte durée\n    (type dépose-minute…).\n    En application des dispositions de l’article L.151-31 du Code de l’urbanisme les\n    normes de réalisation de stationnement édictées à l’article 12.2 sont réduites de\n    15 % en contrepartie de la mise à disposition de véhicules électriques munis d’un\n    dispositif de recharge adapté ou de véhicules propres en autopartage.\nARTICLE USP2.13 -    ESPACES LIBRES ET PLANTATIONS\n    Déduction faite des circulations, cheminements et aires de stationnement, 60% des\n    étendues libres de toute construction en élévation doivent être traitées en espaces\n    paysagers plantés sur 0,60 m de terre végétale minimum.\n    Toutefois, les étendues libres des équipements publics et des équipements d’intérêt\n    collectif (cf. définitions) peuvent faire l’objet d’un aménagement minéral.\n    Pour toutes emprises publiques existantes ou projetées accueillant un ouvrage en\n    infrastructure, il sera maintenu un espace libre d’au moins 1,50m entre la protection\n    lourde de l’étanchéité et le sol fini dont 0,60m de terre végétale.\nARTICLE USP2.14 -    COEFFICIENT D’OCCUPATION DU SOL\n    Sans objet.\n    PLAN LOCAL D’URBANISME    167\n    LA GARENNE-COLOMBES", "ANNEXES AU\n REGLEMENT\nPLAN LOCAL D’URBANISME   168\n LA GARENNE-COLOMBES", "    ANNEXE 1 AU REGLEMENT\n    LISTE DE DEFINITIONS\nAlignement\n    L’alignement est la détermination par l’autorité administrative de la limite du\n    domaine public routier au droit des propriétés riveraines. L’alignement peut être\n    actuel ou futur.\nArtisanat\n    Cette destination comprend les locaux et leurs annexes où sont exercées des\n    activités de production, de transformation, de réparation ou de prestation de\n    service telles que définies à l’annexe du décret n°98-247 du 2 avril 1998,\n    modifié par décret n°2019-987 du 25 septembre 2019 - art. 6, relatif à la\n    qualification artisanale et au répertoire des métiers l'artisanat. Pour être\n    rattachés à cette destination, les locaux d’entreposage ne doivent pas\n    représenter plus de 1/3 de la surface de plancher totale.\nAttique\n    Seules les constructions à usage d’habitation sont concernées par la présente\n    définition.\n    Il s’agit de la partie d’un édifice située au dernier étage de la construction.\n    L’étage en attique s’inscrit dans l’épure ci-dessous :\nAutre façade (façade secondaire)\n    Façade ou élément de façade comportant des baies secondaires, des jours de\n    souffrance ou pignons aveugles.\n    PLAN LOCAL D’URBANISME    169\n    LA GARENNE-COLOMBES", "Baies principales\n    Ce sont des baies assurant l’aération et l’éclairement des pièces principales à\n    usage de séjour, chambre et bureau.\n    Lorsqu’une pièce principale possède des baies sur plusieurs façades, la superficie\n    de la ou des baies principales doit être nettement supérieure à celle de la ou des\n    baies secondaires.\nBaies secondaires\n    Ce sont des baies assurant l’aération et l’éclairement des pièces secondaires (ou\n    de service) liées à l’habitation inférieures à 9 m² telles que :\n    • Cuisines.\n    • Salles d’eau/salles de bains.\n    • Cabinets d’aisance.\n    • Buanderies, débarras.\n    • Escaliers, paliers.\n    • Dégagements.\n    • Dépendances.\n    • Lingeries.\n    Elles peuvent également assurer les mêmes fonctions pour des pièces principales\n    possédant par ailleurs des baies principales de dimensions nettement\n    supérieures.\nCombles\n    Ensemble du volume constitué par la charpente et la couverture. Ce volume ne\n    doit pas dépasser 1 niveau soit 3 m de hauteur.\nCommerce\n    Cette destination comprend les locaux affectés à la vente de produits ou de\n    services et accessibles à la clientèle, et leurs annexes (à l’exception des locaux\n    relevant de la destination artisanat définie ci-après). Pour être rattachés à\n    cette destination, les locaux d’entreposage ne doivent pas représenter plus de\n    1/3 de la surface totale. La partie affectée à la réception du public des agences\n    bancaires, d’intérim, agences immobilières, de voyage… sera rattachée à cette\n    destination. Les autres pièces sont rattachées à la destination bureaux.\nDalle jardin\n    Une dalle jardin est une dalle étanche sur laquelle une couche de terre est\n    déposée en vue d’y créer un espace vert.\nEquipements publics\n    PLAN LOCAL D’URBANISME    170\n    LA GARENNE-COLOMBES", "    Il s’agit d’équipements gérés par les collectivités locales tels que maternelles,\n    enseignement primaire, enseignement secondaire, enseignement supérieur,\n    piscine, patinoire, crèche, bibliothèque, hôpitaux, cliniques, médiathèques, salles\n    de spectacle, foyers de vie pour personnes handicapées, maisons relais…).\nEquipements d’intérêt collectif (CINASPIC)\nCette destination comprend les établissements privés qui ont des homologues publics\n(établissements d’action sociale, récréatifs, culturels, EHPAD, foyer de jeunes travailleurs,\nrésidences services de tout type, crèche, groupe scolaire maternel et élémentaire,\nenseignement secondaire et supérieur, centre aquatique, centre sportif, gymnase, patinoire,\nbibliothèque, médiathèque, cinéma, salle de spectacle, hôpital, clinique, foyer de vie pour\npersonnes handicapées, maison-relais, hébergement d’urgence, résidences services,.…).\nElément de façade\n    Toute partie d’une façade en décrochement vertical ou horizontal d’au moins\n    0,80 cm, par rapport à l’élément de façade principal.\n    La hauteur d’un élément de façade est comprise entre le sol naturel et son point\n    le plus haut.\nEmprise au sol\n    L’emprise au sol s’exprime par le rapport entre la surface occupée par la\n    projection verticale du volume hors œuvre brut du ou des bâtiments et la\n    surface de terrain du projet. Les saillies diverses telles que balcons, corniches…\n    sont considérées comme incluses dans le volume bâti.\nEspace de pleine terre\n    Il s’agit d’une surface de terrain libre de toute construction y compris en sous-sol.\n    Les locaux souterrains attenants aux constructions en élévation et en dépendant\n    directement, quelle que soit la profondeur desdits locaux ne permettent pas de le\n    qualifier de pleine terre.\n    Un espace libre/non construit ne peut être qualifié de « pleine terre » que s’il répond\n    aux conditions cumulatives suivantes :\n    -son revêtement est perméable ;\n    -il ne comporte que le passage éventuel de réseaux de services urbains (électricité, gaz,\n    télécom, eau potable, eaux usées ou pluviales) ;\n    -il peut recevoir des plantations.\n    Les aires de stationnement sont exclues des surfaces de pleine terre.\n    PLAN LOCAL D’URBANISME    171\n    LA GARENNE-COLOMBES", "Façade\n    Toute face extérieure d’allure verticale d’un bâtiment. Les règles relatives aux\n    distances des façades par rapport aux limites séparatives s’appliquent pour\n    chaque élément de façade.\n    Les éléments de modénatures tels que les acrotères, les bandeaux, les\n    corniches, les moulures décoratives ou fonctionnelles, les bordures, les\n    chambranles sont constitutifs de la façade.\nFaçade principale\n    Façade ou élément de façade comportant des baies principales.\nHauteur maximale\n    Pour l’application de l’article 10, la hauteur des constructions est mesurée par\n    rapport au point le plus haut du trottoir au droit de l’unité foncière telle que\n    définie au présent PLU à l’exception :\n    - de la zone USP1 pour laquelle la hauteur est mesurée au point le plus haut du\n    trottoir au droit de l’emprise opérationnelle. Hors emprise opérationnelle, la\n    définition générale qui s’applique.\n    - des projets de restructuration, d’élévation et de surélévation d’une\n    construction existante en zones UAa et UE pour lesquelles la hauteur maximale\n    est mesurée à partir du plancher bas du rez-de-chaussée.\n    Le niveau de référence du rez-de-chaussée ne doit pas être inférieur au niveau\n    du trottoir en tout point de l’unité foncière\nJour de souffrance\n    Baie équipée d’un châssis fixe conforme aux articles 676 et 677 du Code Civil.\nLucarnes\n    Toute baie verticale établie dans la hauteur d’un comble, à l’aplomb de la façade\n    ou sur le toit.\nPignons\n    Partie supérieure d’un mur de bâtiment, dont les côtés sont dirigés suivant les\n    pentes d’un comble à un ou deux égouts.\nRetrait\n    Il s’agit d’un espace ne pouvant recevoir aucune construction en élévation (hors\n    saillie).\n    PLAN LOCAL D’URBANISME    172\n    LA GARENNE-COLOMBES", "Saillies\n    Les saillies sont des reliefs apparents, des éléments ponctuels en avant du plan\n    de la façade. Sont considérés notamment comme saillies :\n    •    Les soubassements.\n    •    Colonnes, pilastres, ferrures de portes et fenêtres, jalousies, persiennes,\n    contrevents, appuis de croisées, barres de supports, panneaux\n    publicitaires fixés sur une façade à l’alignement.\n    •    Revêtements isolants sur façade de bâtiments existants, devanture de\n    boutiques.\n    •    Petits balcons de croisée au-dessus du rez-de-chaussée.\n    •    Grands balcons et saillies de toitures.\n    •    Oriels (bow-window), etc.\nSurface de Plancher (S.P).\n    La surface de plancher de la construction est égale à la somme des surfaces de\n    planchers de chaque niveau clos et couvert, calculée à partir du nu intérieur des\n    façades après déduction :\n    - Des surfaces correspondant à l'épaisseur des murs entourant les embrasures\n    des portes et fenêtres donnant sur l'extérieur ;\n    - Des vides et des trémies afférentes aux escaliers et ascenseurs ;\n    - Des surfaces de plancher d'une hauteur sous plafond inférieure ou égale à 1,80\n    mètre ;\n    - Des surfaces de plancher aménagées en vue du stationnement des véhicules\n    motorisés ou non, y compris les rampes d'accès et les aires de manœuvres ;\n    - Des surfaces de plancher des combles non aménageables pour l'habitation ou\n    pour des activités à caractère professionnel, artisanal, industriel ou commercial\n    ;\n    - Des surfaces de plancher des locaux techniques nécessaires au fonctionnement\n    d'un groupe de bâtiments ou d'un immeuble autre qu'une maison individuelle au\n    sens de l'article L. 231-1 du code de la construction et de l'habitation, y compris\n    les locaux de stockage des déchets ;\n    - Des surfaces de plancher des caves ou des celliers, annexes à des logements,\n    dès lors que ces locaux sont desservis uniquement par une partie commune ;\n    - D'une surface égale à 10 % des surfaces de plancher affectées à l'habitation\n    telles qu'elles résultent le cas échéant de l'application des alinéas précédents,\n    dès lors que les logements sont desservis par des parties communes intérieures.\n    (Article R112-2 du code de l’urbanisme)\nTerrain d’assiette d’un projet\n    Ensemble des parcelles contiguës appartenant à un même propriétaire.\nTerrain naturel\n    Il s’agit du sol tel qu’il existe au moment de la présentation du dossier de\n    demande d’autorisation de construire, préalablement à tous travaux\n    d’aménagement liés au projet présenté.\n    PLAN LOCAL D’URBANISME    173\n    LA GARENNE-COLOMBES", "Toitures- terrasses accessibles\n    Ce sont des terrasses d’agrément normalement accessibles à tous les usagers\n    et/ou habitants de la construction concernée, formant toiture de l’étage\n    inférieur et intégrée dans la construction projetée.\nToitures- terrasses non accessibles\n    Ce sont des toitures- terrasses dont l’accessibilité est exclusivement réservée\n    à un usage technique ou d’entretien et formant toiture de l’étage inférieur.\nUnité foncière\n    Parcelle ou ensemble de parcelles contiguës appartenant à un même propriétaire\n    ou à une même indivision ou pour lesquels le ou les pétitionnaires disposent ou\n    déclarent disposer d’un ou de plusieurs titres les habilitant à construire.\nVue directe\n    Vue au droit d’une baie éclairant une pièce d’habitation principale ou de travail.\n    Elle est représentée par un rectangle de la largeur de la baie, sur une longueur\n    égale à la hauteur de la façade avec un minimum de 6 m.\nVue secondaire\n    Vue au droit d’une baie éclairant une pièce secondaire d’habitation. Elle est\n    représentée par un rectangle de la largeur de la baie, sur une longueur égale à\n    une de mi-hauteur de la façade avec un minimum de 3 m.\n    PLAN LOCAL D’URBANISME    174\n    LA GARENNE-COLOMBES", "    ANNEXE 2 AU REGLEMENT\n    LISTE DES EMPLACEMENTS RESERVES\n1-    Emplacements réservés pour voirie\nCes emplacements sont repérés sur le document graphique par un hachuré rose et sont\nnumérotés comme suit :\nEmplacements réservés pour voirie au profit de la RATP\nEm placem ents réservés n° 1 : ancienne rue des Carrières (ex trém ité Ouest)\nObjet : Emplacement réservé pour aménagement d’un parc de maintenance du matériel ferré de\nla ligne A du RER\nSection A parcelle n° : 10\nSurface : 2943 m²\nEmplacements réservés pour voirie au profit du Département\nEm placem ent réservé n° 3 : RD 106 : avenue du Général de Gaulle (entre rue du\nChâteau et boulevard de la République)\nObjet : Emplacement réservé pour l’élargissement à 24 m\nSection U parcelles n° : 35, 37, 57, 79, 160 (parties)\nSection P parcelles n° : 55, 106, 107, 108 (parties)\nEmplacements réservés pour voirie au profit de la Commune\nEm placem ent réservé n° 4 : rue des Cham ps P hilippe (entre la rue de Verdun et la rue\nP asteur)\nObjet : Emplacement réservé pour l’élargissement à 15 m\nSection E parcel
