u carrefour République/Joffre/Sartoris/Gabriel Péri.\nARTICLE UPM2.1 - OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\nSont interdits :\n1.1    L’implantation et l’extension des installations classées soumises à autorisation sauf\n    celles mentionnées à l’article 2.\n1.2    Le changement de destination des locaux commerciaux et artisanaux situés sur\n    l’ensemble de l’unité foncière concernée le long des voies définies comme «\n    servitudes commerciales et artisanales » sur le document graphique. L’interdiction\n    de changement de destination ne s’applique pas aux équipements publics.\n1.3    Les dépôts non couverts de ferrailles, de matériaux, de combustibles solides, ainsi\n    que les entreprises de cassage de voitures et la transformation de matériaux de\n    récupération.\n1.4    Les affouillements et exhaussements des sols nécessitant une autorisation au titre\n    de l’article R 442.2 du Code de l’Urbanisme et qui ne sont pas nécessaires à des\n    travaux de construction.\n1.5    Le stationnement des caravanes et installations de camping soumises à autorisation\n    préalable à l’exception, le cas échéant, de l’aire d’accueil des gens du voyage.\nARTICLE UPM2.2 - OCCUPATION    ET UTILISATION DU SOL ADMISES SOUS\n    CONDITIONS PARTICULIERES\n2.1    Les installations classées, soumises à autorisation, sont autorisées à condition\n    qu’elles n’entraînent pour le voisinage aucune incommodité et, en cas d’accident ou\n    de fonctionnement défectueux, aucune insalubrité, ni sinistre susceptible de causer\n    des dommages graves ou irréparables aux personnes et aux biens.\n2.2    L’extension ou la transformation des installations classées existantes est\n    autorisée, à condition qu’il n’en résulte pas pour le voisinage une aggravation des\n    dangers ou nuisances liés au classement, et que toutes dispositions utiles soient\n    mises en œuvre pour l’intégration dans le milieu environnant.\nRappel : Les constructions neuves à destination d'habitation, implantées le long des voies\nbruyantes, doivent respecter les règles d'isolement acoustique définies par l'arrêté\npréfectoral n°2000-174 du 29 juin 2000.\n    PLAN LOCAL D’URBANISME    94\n    LA GARENNE-COLOMBES", "2.3    Le long des voies concernées par les « servitudes commerciales et artisanales » sur\n    le document graphique 4.1, les constructions nouvelles devront comporter des\n    locaux commerciaux ou artisanaux à rez-de-chaussée. Cet article ne s’applique pas\n    aux équipements publics. Les locaux commerciaux et artisanaux supprimés doivent\n    être reconstitués au sein de l’unité foncière.\nARTICLE UPM2.3 - ACCES ET VOIRIE\n3.1    Pour être constructible, un terrain doit être desservi par une voie publique ou\n    privée ou un accès (éventuellement obtenu par application de l’article 682 du Code\n    Civil) ouvert à la circulation automobile, de caractéristiques proportionnées à\n    l’importance de l’occupation ou de l’utilisation du sol envisagée.\n3.2    Les voies nouvelles se terminant en impasse doivent être aménagées de telle sorte\n    que les véhicules puissent faire demi-tour.\nARTICLE UPM2.4 -DESSERTE PAR LES RESEAUX ET STOCKAGE DES DECHETS\n4.1   Eau\n    Toute construction ou installation nouvelle nécessitant une alimentation en eau doit\n    être raccordée au réseau public d’eau potable.\n4.2    Assainissement\n    Eaux usées – eaux vannes\n    Toute construction ou installation nouvelle doit être raccordée au réseau public\n    d’assainissement.\n    Jusqu’aux limites de propriété, les rejets doivent être réalisés par un réseau\n    séparatif.\n    L’évacuation des eaux résiduaires provenant des installations industrielles ou\n    artisanales doit faire l’objet d’un pré-traitement avant le rejet dans le réseau\n    public d’assainissement.\n    Recommandations sur les eaux pluviales\n    De manière à limiter ces apports, tant d’un point de vue qualitatif que quantitatif,\n    des techniques alternatives aux réseaux devront être privilégiées (noues,\n    chaussées réservoirs, fossés drainant, bassins…).\n    En cas d’extension ou d’aménagement d’une construction existante, des dispositifs\n    appropriés peuvent être recherchés afin d’assurer la maîtrise des débits et\n    l’écoulement des eaux pluviales et de ruissellement, en se rapprochant des normes\n    édictées ci-dessous.\n    PLAN LOCAL D’URBANISME    95\n    LA GARENNE-COLOMBES", "    Eaux pluviales\n    Le débit généré par une construction neuve ou une reconstruction ne doit pas\n    excéder pour une pluie de retour décennal 2l/s/ha pour un rejet dans un réseau\n    unitaire.\n    En cas d’extension :\n    - si la construction existante présente un débit de rejet conforme (<2l/s/ha), le\n    débit de rejet de la construction après travaux doit être conforme.\n    - si la construction existante n’est pas conforme, le débit de rejet de la\n    construction après travaux ne doit pas être supérieur à celui de la\n    construction existante.\n    Recommandations sur le stockage des déchets\n    Pour toute construction ou groupe de construction supérieur à trois logements ou\n    à 200 m² S.P., un local destiné au stockage des conteneurs recueillant les ordures\n    ménagères nécessaire au tri sélectif doit être aménagé.\n    Nota : Le local de stockage devra être conforme au règlement communal en vigueur\n    et aux prescriptions de l’article 77 du règlement sanitaire départemental des\n    Hauts-de-Seine. Cet article est annexé au présent règlement.\n4.3    Réseaux câbles et télécommunications\n    Toute construction nouvelle doit prévoir les infrastructures nécessaires à la\n    distribution de ces réseaux depuis le point de raccordement général jusqu’à la limite\n    de parcelle.\n    Les branchements privatifs nécessaire à la distribution de ces réseaux doivent être\n    réalisés en souterrain jusqu’en limite du domaine public, et ne doivent pas rester\n    apparents sur la construction.\nARTICLE UPM2.5 - CARACTERISTIQUES DES TERRAINS\n    Sans objet.\nARTICLE UPM2.6 - IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX\nVOIES PUBLIQUES, AUX VOIES PRIVEES OUVERTES A LA CIRCULATION AUTOMOBILE\nET AUX EMPRISES PUBLIQUES (PLACES, VOIES FERROVIAIRES, SQUARES ET MAILS\nPIETONNIERS)\n    PLAN LOCAL D’URBANISME    96\n    LA GARENNE-COLOMBES", "Principe général\nL’implantation d’un bâtiment s’apprécie par rapport à la projection au sol du bâtiment, hors\nsaillies. Des retraits partiels ou ponctuels sont acceptés, pour autant qu’ils n’excédent pas\n20 % du linéaire de façade concerné.\n6.1    Implantation\n    Constructions existantes\n    6.1.1    Les travaux de modification de façade ou de surélévation d’un niveau, sur\n    des bâtiments, dont l’implantation ne respecte pas l’article 6.1.2, peuvent\n    être autorisés à condition que ces transformations n’entraînent pas une\n    augmentation de l’emprise au sol dans la marge de reculement quand elle\n    existe.\n    Constructions nouvelles\n    6.1.3    Les constructions doivent être implantées à l’alignement conformément\n    aux indications figurant sur le document graphique.\n6.2    Pans coupés\n    Sans objet.\n6.3    Saillies\n    6.3.1    Les saillies sur alignement :\n    6.3.1.1 Les saillies le long des voies communales de plus de 8 mètres\n    d’emprise, sont autorisées à la double condition :\n    • être situées à une hauteur supérieure ou égale à 5.50 m du sol\n    mesurée au niveau du trottoir.\n    • avoir une profondeur maximale de 0.80 m.\n    6.3.1.2 Les saillies le long des autres voies :\n    Le long des autres voies, il sera fait application du règlement du\n    gestionnaire de la voie correspondante.\n    6.3.2    Les saillies sur marge de reculement sont autorisées.\nARTICLE UPM2.7 - IMPLANTATION DES    CONSTRUCTIONS PAR RAPPORT AUX\n    LIMITES SEPARATIVES\nPrincipe général\nL’implantation d’un bâtiment s’apprécie par rapport à la projection au sol du bâtiment, hors\nsaillies. Des retraits partiels ou ponctuels sont acceptés, pour autant qu’ils n’excédent pas\n20 % du linéaire de façade concerné.\n    PLAN LOCAL D’URBANISME    97\n    LA GARENNE-COLOMBES", "7.1    Les constructions doivent être implantées dans l’emprise maximale figurant sur le\n    document graphique, soit sur limites soit en retrait conformément aux dispositions\n    de l’article 7.2.\n7.2    En cas d’implantation en retrait des limites séparatives, les constructions (hors\n    saillies) doivent respecter simultanément les règles définies ci-dessous :\n    7.2.1    Par rapport aux limites extérieures de la zone\nFaçades principales\nFaçades comportant des baies principales (cf. définitions)\n    La distance horizontale à la limite séparative, mesurée perpendiculairement en tout\n    point d’une façade comportant des baies principales, devra être au moins égale à la\n    hauteur de cette façade, sans pouvoir être inférieure à 6 m.\nFaçades secondaires\nFaçades ne comportant pas de baies principales (cf. définitions)\n    La distance horizontale à la limite séparative, mesurée perpendiculairement en tout\n    point d’une façade comportant des baies secondaires ou ne comportant pas de baies,\n    devra être au moins égale à la moitié de la hauteur de cette façade, sans pouvoir\n    être inférieure à 3 m.\n    Les constructions peuvent être implantées à une distance moindre que celle définie\n    ci-dessus lorsque le pétitionnaire et son voisin font application des dispositions de\n    l’article L 471-1 du Code de l’Urbanisme, sous réserve de respecter la distance\n    minimale fixée à l’article UPM2.8 avec les constructions situées sur le terrain voisin.\n    Exception : les dispositions ci-dessus ne s’appliquent pas aux lucarnes disposées\n    sur les rampants de toitures.\n    7.2.2.   Par rapport aux limites intérieures actuelles ou futures dans la zone\n    Les constructions peuvent être implantées sur limites séparatives ou en\n    retrait.\n    En cas d’implantation en limite séparative, la façade sur la limite ne peut\n    comporter de baies autres que des jours de souffrance.\n    En cas d’ouverture de vue, un retrait de 1,90 m minimum par rapport à la\n    limite séparative devra être respecté.\n    PLAN LOCAL D’URBANISME    98\n    LA GARENNE-COLOMBES", "ARTICLE UPM2.8 - IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT\n    AUX AUTRES SUR UNE MEME PROPRIETE\n8.1    Constructions existantes\n    La surélévation et l’extension d’un bâtiment achevé à la date d’entrée en vigueur du\n    PLU peuvent être autorisées :\n    • suivant les règles des constructions nouvelles.\n    Si ces règles ne peuvent pas être respectées :\n    • La surélévation d’un niveau et l’extension d’un bâtiment peuvent être\n    autorisées dans le prolongement des murs existants, à condition que\n    les façades créées ne respectant pas les prospects imposés ne\n    comportent pas de baies autres que des jours de souffrance.\n8.2    Constructions nouvelles\n    8.2.1    La construction de plusieurs bâtiments non contigus sur une même\n    propriété doit respecter les dispositions suivantes :\n    La distance, mesurée perpendiculairement en tout point de la façade, doit\n    être au moins égale :\n    •    A la hauteur de la façade la plus haute, avec un minimum de 6 m si\n    l’une des façades comporte des baies principales.\n    ou\n    •    A la moitié de la façade la plus haute, avec un minimum de 3 m si les\n    deux façades ne comportent pas de baies principales.\n    Façades avec baie principale\n    L ≥ H\n    H\n    L\n    min. 6 m\n    PLAN LOCAL D’URBANISME    99\n    LA GARENNE-COLOMBES", "    Façades sans baie principale\n    L ≥ H/2\n    H\n    L\n    min. 3 m\n    8.2.2    Pour l’application de l’article 8.2.1, deux constructions réunies par un\n    élément architectural ponctuel tel qu’un auvent ou une pergola (etc.) ne\n    sont pas considérées contiguës.\nARTICLE UPM2.9 - EMPRISE AU SOL\n    L’emprise au sol ne peut dépasser l’emprise figurant sur le document graphique.\nARTICLE UPM2.10 - HAUTEUR MAXIMUM DES CONSTRUCTIONS\n    La hauteur des bâtiments est mesurée au point le plus haut du trottoir au droit de\n    l’unité foncière et doit les prescriptions indiquées sur le document graphique.\n    A l’exception des dispositifs de réception de signaux radioélectriques, et des\n    souches de cheminées dans la limite d’une hauteur de 50 centimètres au-dessus de\n    la hauteur plafond, aucun édicule ou équipement technique ne doit dépasser le\n    plafond autorisé. Ces édicules devront être intégrés au volume de la toiture.\nARTICLE UPM2.11 - ASPECT EXTERIEUR\n11.1   Dispositions générales\n    Les bâtiments ou ouvrages à édifier ne doivent pas porter atteinte au caractère ou\n    à l’intérêt des lieux avoisinants.\n11.2   Constructions existantes\n    Sans objet.\n    PLAN LOCAL D’URBANISME    100\n    LA GARENNE-COLOMBES", "11.3   Constructions neuves\n    11.3.1   Pour les façades des constructions donnant sur les voies publiques ou\n    privées, doit être privilégié un choix de matériaux de qualité et pérennes\n    (stables dans la durée et nécessitant un faible entretien) tels que la\n    pierre, la brique, le métal, le verre, le béton architectonique, le bois, etc.\n    11.3.2   Pour l’habitation, les fenêtres dont la largeur est supérieure à la hauteur\n    sont interdites.\n    11.3.3   Les façades latérales et postérieures des constructions y compris les\n    pignons rendus visibles lors de démolitions ainsi que les constructions\n    annexes (garages, appentis…) doivent être traitées comme les façades\n    principales et en harmonie avec elles.\n    11.3.4   Les matériaux utilisés pour le traitement des murs pignons devront être\n    de même aspect et de même teinte que les façades principales ; les\n    pignons pourront être traités en trompe-l’œil.\n    11.3.5 Les verrières et dispositifs solaires intégrés peuvent être implantés en\n    façade et en toiture, sous réserve de ne pas porter atteinte à l’esprit\n    général de la construction.\n    11.3.6 Aucun matériau destiné à être enduit ou recouvert d’un parement (tels que\n    les carreaux de plâtre, les bardages, les briques creuses, les parpaings…)\n    ne doit être laissé apparent.\n    11.3.7 Les enduits d’aspect rustique ou grossier, tels que l’enduit au mortier de\n    ciment non teinté ou non peint, sont proscrits.\n11.4   Toitures\n    11.4.1   Principe général\n    Qu’il s’agisse de toitures constituées de matériaux traditionnels (tuiles,\n    zinc, ardoises…) ou plus récents (bacs acier, tôles d’aluminium anodisées\n    ou laquées…) ou de terrasses, les accessoires à caractères technique\n    (caissons de climatisation, extracteurs, édicules d’ascenseur, garde-\n    corps, antennes…) doivent être regroupés et intégrés à la toiture de façon\n    à en annuler l’impact visuel.\n    11.4.2   Antennes\n    Les antennes d’émission ou de réception (radio, télévision, antenne\n    parabolique, radio-téléphone…), de quelque dimension que ce soit, doivent\n    être implantées exclusivement en toiture des bâtiments à une distance de\n    la façade au moins égale à leur hauteur et être de teinte identique à celle\n    de la toiture. Elles ne doivent pas être visibles depuis l’espace public.\n    PLAN LOCAL D’URBANISME    101\n    LA GARENNE-COLOMBES", "11.4.3   Toitures- terrasses\n    Toitures-terrasses non accessibles\n    Les toitures- terrasses non accessibles sont autorisées :\n    - Pour l’extension des bâtiments existants ne comportant pas de toitures\n    en pentes,\n    - Pour les bâtiments annexes d’une hauteur inférieure à 3,20 m (garage,\n    …),\n    - Pour les équipements publics et d’intérêt collectif,\n    - Pour des raisons architecturales (intégration d’édicules techniques en\n    toiture, liaisons des volumes bâtis...), les toitures- terrasses non\n    accessibles sont autorisées jusqu’à 10% maximum de la surface\n    d’emprise au sol de la construction projetée.\n    Toitures-terrasses accessibles\n    -    Les toitures- terrasses accessibles sont autorisées sur les\n    constructions à rez-de-chaussée n’excédant pas 5 m de hauteur\n    situées à l’arrière et en continuité des bâtiments implantés sur rue.\n    Ces toitures- terrasses sont impérativement à traiter en « dalles\n    jardin » aménagées en espaces verts.\n    -    A l’exception de la « dalle jardin » définie ci avant, les toitures-\n    terrasses, directement accessibles de plain-pied (terrasses formant\n    toiture des étages inférieurs) et intégrées à la construction projetée\n    sont acceptées dans la limite de 50% des surfaces d’emprise au sol de\n    la construction projetée. En cas d’extension, les 50% prennent en\n    compte la surface existante plus celle de l’extension.\n    Les édicules sur toitures- terrasses\n    Les édicules sur toitures- terrasses doivent être implantés en retrait de\n    la façade d’une distance au moins égale à leur hauteur.\n11.4.4   Toitures en pente\n    Pour les constructions à usage d’habitation, les toitures en pente doivent :\n    • Présenter une pente minimum de 30%.\n    Ou\n    • Etre de type « Mansart » : dans ce cas, elles doivent s’inscrire dans un\n    arc de cercle conforme au croquis suivant :\n    PLAN LOCAL D’URBANISME    102\n    LA GARENNE-COLOMBES", "    Le terrasson doit comporter une pente de 10% minimum.\n    Ou\n    S’il s’agit d’un étage en attique, s’inscrire dans l’épure suivante :\n    Les percements et ouvertures inclus dans le volume des toitures (lucarnes,\n    souches…) doivent être traités avec soin.\n11.5   Clôtures\n    11.5.1   Clôtures sur voies et emprises publiques\n    Les piliers de portail d’entrée et de clôture ne peuvent dépasser 2,20 m\n    de hauteur.\n    La clôture doit avoir une hauteur de 2m et comporter une partie pleine\n    (mur bahut) d’une hauteur comprise entre 0,80 et 1 m (mesurée au niveau\n    du trottoir). La partie supérieure de la clôture doit être constituée d’un\n    ensemble en serrurerie.\n    11.5.2   Les clôtures sur les autres limites ne doivent pas excéder une hauteur\n    totale de 2,60 m mesurée au niveau du trottoir.\n    PLAN LOCAL D’URBANISME    103\n    LA GARENNE-COLOMBES", "    11.5.3   Les règles ci-avant (11.5.1 et 11.5.2) ne sont pas applicables aux clôtures\n    entourant les équipements publics.\nARTICLE UPM2.12 - STATIONNEMENT\n12 .1: Règles applicables à l’ensemble des constructions à l’exception des\n    constructions et installations nécessaires aux services publics ou\n    d’intérêt collectif, lesquelles sont régies par l’article 12.2, ci-après\n    12.1.1   Principes généraux :\n    Le stationnement des véhicules doit être assuré en dehors des voies\n    publiques.\n    Lors de toute opération de construction neuve, les aires de stationnement\n    doivent être réalisées en sous-sol sur le terrain d’assiette ou dans son\n    environnement immédiat.\n    80% des aires de stationnement doivent avoir un accès direct. Les places\n    doubles auront une profondeur minimum de 9 m.\n    Les aires de stationnement doivent être accessibles en manœuvre\n    d’entrée et de sortie depuis les voies de circulation.\n    Les rampes ne doivent pas entraîner de modification dans le niveau du\n    trottoir. Leur pente dans les 5 premiers mètres à partir de l’alignement\n    ne doit pas excéder 5%, sauf dans le cas d’impossibilité technique, sous\n    réserve que l’implantation de la rampe permette les manœuvres d’entrée\n    et de sortie en toute sécurité.\n    Lors de toute opération de constructions neuves, les aires de\n    stationnement et leurs accès doivent être réalisés conformément aux\n    normes françaises dont les dispositions sont mentionnées à l’annexe 6 du\n    présent règlement « normes de stationnement communes à toutes les\n    zones ».\n    12.1.2   Nombre d’aires de stationnement pour les véhicules motorisés :\n    DESTINATION DES    EMPLACEMENTS\n    CONSTRUCTIONS\nHabitation    1-    Les logements locatifs financés avec un prêt aidé de\n    l’Etat :\n    -    En application des dispositions de l’alinéa n° 1 de\n    l’article L.151-15 du Code de l’urbanisme, il est exigé, lors de la\n    construction de logements locatifs financés avec un prêt aidé\n    PLAN LOCAL D’URBANISME    104\n    LA GARENNE-COLOMBES", "    par l’Etat, la réalisation d’une aire de stationnement par\n    logement.\n    -    En application des dispositions de l’alinéa n°2 de\n    l’article L.151-15 du Code de l’urbanisme, il est exigé, lors de la\n    construction de logements locatifs financés avec un prêt aidé\n    par l’Etat, la réalisation de 0,5 aire de stationnement par\n    logement si ces derniers sont situés à moins de cinq cents\n    mètres d’une gare ou d’une station de transport public guidé\n    ou de transport collectif en site propre et que la qualité de la\n    desserte le permet.\n    2-    Les établissements assurant l’hébergement des\n    personnes âgées mentionnées au 6° du I de l’article L.312-\n    1 du code de l’action sociale et les résidences universitaires\n    mentionnées à l’article L.631-12 du code de la construction\n    et de l’habitation :\n    -    Pour les établissements assurant l’hébergement des\n    personnes âgées, mentionnés au 6° du I de l’article L.312-1 du\n    Code de l’action sociale le nombre de places de stationnement\n    éventuellement nécessaire au fonctionnement et à la\n    fréquentation de ces établissements assurant l’hébergement\n    des personnes âgées mentionnées au 6 ° du I de l’article L. 312-\n    1 du Code de l’action sociale doit être apprécié notamment au\n    regard de leur mode de fonctionnement, de leurs besoins\n    propres , de leur situation sur le territoire communal, des\n    possibilités de desserte par les transports en commun ainsi\n    que de l’offre publique de stationnement disponible, existante\n    ou projetée, dans le secteur du projet sans pouvoir excéder 1\n    place par logement conformément aux dispositions de l’article\n    L. 151- 35 du Code de l’urbanisme.\n    -    Pour les résidences universitaires mentionnées à\n    l’article L.631-12 du Code de la construction et de l’ habitation,\n    le nombre de places de stationnement éventuellement\n    nécessaire au fonctionnement et à la fréquentation de ces\n    résidences universitaires mentionnées à l’article L. 631-12 du\n    Code de la construction et\n    de l’habitation doit être apprécié notamment au regard de leur\n    mode de fonctionnement, de leurs besoin propres , de leur\n    situation sur le territoire communal, des possibilités de\n    desserte par les transports en commun ainsi que de l’offre\n    publique de stationnement disponible, existante ou projetée,\n    dans le secteur du projet sans pouvoir excéder 1 place par\n    logement conformément aux dispositions de l’article L. 151- 35\n    du Code de l’urbanisme.\n    3-    Les autres catégories de logements :\nPLAN LOCAL D’URBANISME    105\n LA GARENNE-COLOMBES", "    -    Pour les autres catégories de logements, quand ils sont\n    situés à plus de cinq cents mètres d’une gare ou d’une station\n    de transport public guidé ou de transport collectif en site\n    propre, il est exigé la réalisation d’une aire de stationnement\n    par tranche de 50 m² SP (avec un minimum de 1 place par\n    logement ou chambre indépendante et un maximum de 3 places\n    par logement).\n    -    Pour les autres catégories de logements, quand ils sont\n    situés à moins de cinq cents mètres d’une gare ou d’une station\n    de transport public guidé ou de transport collectif en site\n    propre et dès lors que la qualité de la desserte le permet, il\n    est exigé la réalisation d’une aire de stationnement par\n    logement.\nBureaux    1 place par tranche de 65 m² de S.P.\n    Les normes de stationnement pour les bureaux sont réduites à\n    1 place/100 m² de S.P. dans un rayon de 300 m autour des\n    gares et des stations de tramway actuelles ou projetées,\n    distance appréciée à partir de leur entrée principale.\nCommerces\n   Entre 0 et 150 m² S.P.    Aucune place n’est exigée.\n- Entre 150 et 300 m² S.P.    1 place par tranche de 50 m² de S.P.\n    (2 places minimum).\n•    Entre 300 et 2 000 m² S.P.    1 place par tranche de 30 m² de S.P.\n•    Supérieur à 2 000 m² S.P.    1 place par tranche de 25 m² de S.P.\n    Dans un rayon de 300 m autour des gares et des stations de\n    tramway actuelles ou projetées, distance appréciée à partir de\n    leur entrée principale, les normes de stationnement sont\n    réduites à :\n•    Entre 150 et 300 m² S.P.    1 place par tranche de 75 m² de S.P.\n•    Entre 300 m² et 2 000 m² S.P. 1 place par tranche de 50 m² de S.P.\n•    Supérieur à 2 000 m² S.P.\n    1 place par tranche de 40 m² de S.P.\nIl est précisé que la règle ci-dessus relative aux obligations de stationnement pour les commerces\ns’applique par unité commerciale et non pour la surface commerciale totale créée dans une même\nopération.\nArtisanat, industrie, entrepôts\n    1 place pour 100 m² de S.P.\n    + aire de livraison au-delà de 200 m² S.P.\nHôtels    1 place pour 3 chambres.\n    Les résultats en nombre de places découlant des normes énoncées ci-dessus doivent être arrondis\n    à l’unité supérieure dès que la première décimale est supérieure ou égale à 5.\n    PLAN LOCAL D’URBANISME    106\n    LA GARENNE-COLOMBES", "12.1.3   En application des dispositions de l’ article L. 151-31 du Code de l’urbanisme les\n    normes de réalisation d’aires de stationnement édictées à l’article 12.1.2 sont\n    réduites de 15 % en contrepartie de la mise à disposition de véhicules\n    électriques munis d’un dispositif de recharge adapté ou de véhicules propres en\n    auto-partage.\n12.1.4   Lorsque le bénéficiaire du permis ou de la décision de non –opposition à\n    une déclaration préalable ne peut satisfaire aux obligations résultant de\n    l’article 12.1.2, il peut en être tenu quitte en justifiant pour les places qu’il\n    ne peut réaliser lui-même sur le terrain d’assiette ou dans son\n    environnement immédiat :\n    • soit de l’obtention d’une concession à long terme dans un parc public de\n    stationnement existant ou en cours de réalisation et situé à proximité\n    de l’opération.\n    • soit de l’acquisition ou de la concession de places dans un parc privé de\n    stationnement existant ou en cours de réalisation et situé à proximité\n    de l’opération.\nLorsqu’une aire de stationnement a été prise en compte dans le cadre d’une\nconcession à long terme ou d’un parc privé de stationnement, elle ne peut plus être\nprise en compte, en tout ou partie, à l’occasion d’une nouvelle autorisation.\n12.1.4   En cas d’extension et/ou de surélévation supérieure à 20 m² S.P., le\n    nombre d’aires de stationnement à réaliser pour les véhicules motorisés\n    correspond aux besoins générés calculés selon les règles définies à\n    l’article 12.1.2.\n12.1.5   En cas de changement de destination de locaux, le nombre d’aires de\n    stationnement pour les véhicules motorisés à réaliser correspond aux\n    besoins générés calculés selon les règles définies à l’article 12.1.2.\n12.1.6   Toute place supprimée doit être recréée dans l’unité foncière.\n12.1.7   Une aire de stationnement doit être prévue pour les vélos à raison :\n    •    d'un emplacement de 0,50 m² par logement.\n    •    d'un emplacement de 0,25 m² pour 100 m² de S.P. de bureau, de\n    commerce ou d’artisanat.\n    PLAN LOCAL D’URBANISME    107\n    LA GARENNE-COLOMBES", "12.2.2: Règles applicables aux constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif\n    12.2.1   Principes généraux :\n    Le stationnement des véhicules doit être assuré en dehors des voies\n    publiques, en surface ou en sous-sol, sur le terrain d’assiette du projet ou\n    dans son environnement immédiat.\n    80% des aires de stationnement doivent avoir un accès direct. Les places\n    doubles auront une profondeur minimum de 9 m.\n    Les aires de stationnement doivent être accessibles en manœuvre\n    d’entrée et de sortie depuis les voies de circulation.\n    Les rampes ne doivent pas entraîner de modification dans le niveau du\n    trottoir. Leur pente dans les 5 premiers mètres à partir de l’alignement\n    ne doit pas excéder 5%, sauf dans le cas d’impossibilité technique, sous\n    réserve que l’implantation de la rampe permette les manœuvres d’entrée\n    et de sortie en toute sécurité.\n    Lors de toute opération de constructions neuves, les aires de\n    stationnement et leurs accès doivent être réalisés conformément aux\n    normes françaises dont les dispositions sont mentionnées à l’annexe 6 du\n    présent règlement « normes de stationnement communes à toutes les\n    zones ».\n    12.2.2   Nombres d’aires de stationnement pour les véhicules motorisés\n  DESTINATION DES CONSTRUCTIONS    EMPLACEMENTS\nConstructions et installations nécessaires aux    Le nombre de places de stationnement\nservices publics ou d’intérêt collectif    éventuellement nécessaire au fonctionnement et à\n (crèche, groupe    scolaire maternel    et   la fréquentation des constructions et installations\nélémentaire, enseignement secondaire et    nécessaires aux services publics ou d’intérêt\nsupérieur,    centre    aquatique,   patinoire,   collectif doit être apprécié notamment au regard\nbibliothèque, médiathèque, cinéma, salle de    de la nature de l’équipement, de son mode de\nspectacle, hôpital, clinique, foyer de vie pour    fonctionnement, de sa situation sur le territoire\npersonnes handicapées, maison-relais, EHPAD,    communal, des possibilités de desserte par les\nfoyers    jeunes    travailleurs,   résidences    transports en commun ainsi que de l’offre publique\nservices…).    de stationnement disponible, existante ou projetée\n    dans le secteur du projet.\n    Cette offre publique de stationnement doit être\n    existante à la date de mise en service de\n    l’équipement.\n    PLAN LOCAL D’URBANISME    108\n    LA GARENNE-COLOMBES", "    Par dérogation aux principes généraux énoncés à\n    l’article 12.2.1 il peut être recouru en tant que de\n    besoin au stationnement sur la voie publique pour\n    les seuls stationnements de très courte durée\n    (type dépose-minute…).\n    12.2.3   Toute place supprimée doit être remplacée.\nARTICLE UPM2.13 - ESPACES LIBRES ET PLANTATIONS\n13.1   Déduction faite des circulations, cheminements et aires de stationnement rendues\n    obligatoires par l’article 12, 60% des étendues libres de toute construction en\n    élévation doivent être traitées en espaces paysagers plantés sur 60 cm de terre\n    végétale minimum.\n    Toutefois, les étendues libres des équipements publics et des équipements\n    d’intérêt collectif (cf. définitions) peuvent faire l’objet d’un aménagement minéral.\n13.2   En limite de terrain, le niveau fini des espaces verts à rez-de-chaussée ne peut\n    être supérieur au niveau du terrain voisin.\nARTICLE UPM2.14 - COEFFICIENT D’OCCUPATION DU SOL\n    Sans objet.\n    PLAN LOCAL D’URBANISME    109\n    LA GARENNE-COLOMBES", " ZONE UPM3\nPLAN LOCAL D’URBANISME   110\n LA GARENNE-COLOMBES", "La zone UPM 3 est une zone à vocation mixte pouvant accueillir des équipements, des\nlogements et des commerces en rez-de-chaussée.\nARTICLE UPM3.1 - OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\nSont interdits :\n1.1    L’implantation et l’extension des installations classées soumises à autorisation sauf\n    celles mentionnées à l’article 2.\n1.2    Toute occupation et utilisation du sol non mentionnées à l’article 2.\nARTICLE UPM3.2 - OCCUPATION ET UTILISATION DU SOL ADMISES SOUS\n    CONDITIONS PARTICULIERES\n2.1    Seuls les équipements publics et d’intérêt collectif, les espaces publics, les\n    logements, les Etablissements d’Hébergement pour Personnes Agées Dépendantes,\n    tout type de résidence service et les activités commerciales sont autorisés.\nRappel : Les constructions neuves à destination d'habitation, implantées le long des voies\nbruyantes, doivent respecter les règles d'isolement acoustique définies par l'arrêté\npréfectoral n°2000-174 du 29 juin 2000.\nARTICLE UPM3.3 - ACCES ET VOIRIE\n3.1    Pour être constructible, un terrain doit être desservi par une voie publique ou\n    privée ou un accès (éventuellement obtenu par application de l’article 682 du Code\n    Civil) ouvert à la circulation automobile, de caractéristiques proportionnées à\n    l’importance de l’occupation ou de l’utilisation du sol envisagée.\n3.2    Les voies nouvelles se terminant en impasse doivent être aménagées de telle sorte\n    que les véhicules puissent faire demi-tour.\nARTICLE UPM3.4 -DESSERTE PAR LES RESEAUX ET STOCKAGE DES DECHETS\n4.1    Eau\n    Toute construction ou installation nouvelle nécessitant une alimentation en eau doit\n    être raccordée au réseau public d’eau potable.\n4.2    Assainissement\n    Eaux usées – eaux vannes\n    PLAN LOCAL D’URBANISME    111\n    LA GARENNE-COLOMBES", "    Toute construction ou installation nouvelle doit être raccordée au réseau public\n    d’assainissement.\n    Jusqu’aux limites de propriété, les rejets doivent être réalisés par un réseau\n    séparatif.\n    L’évacuation des eaux résiduaires provenant des installations industrielles ou\n    artisanales doit faire l’objet d’un pré-traitement avant le rejet dans le réseau\n    public d’assainissement.\n    Recommandations sur les eaux pluviales\n    De manière à limiter ces apports, tant d’un point de vue qualitatif que quantitatif,\n    des techniques alternatives aux réseaux devront être privilégiées (noues,\n    chaussées réservoirs, fossés drainant, bassins…).\n    En cas d’extension ou d’aménagement d’une construction existante, des dispositifs\n    appropriés peuvent être recherchés afin d’assurer la maîtrise des débits et\n    l’écoulement des eaux pluviales et de ruissellement, en se rapprochant des normes\n    édictées ci-dessous.\n    Eaux pluviales\n    Le débit généré par une construction neuve ou une reconstruction ne doit pas\n    excéder pour une pluie de retour décennal 2l/s/ha pour un rejet dans un réseau\n    unitaire.\n    En cas d’extension :\n    - si la construction existante présente un débit de rejet conforme (<2l/s/ha), le\n    débit de rejet de la construction après travaux doit être conforme.\n    - si la construction existante n’est pas conforme, le débit de rejet de la\n    construction après travaux ne doit pas être supérieur à celui de la\n    construction existante.\n    Recommandations sur le stockage des déchets\n    Pour toute construction ou groupe de construction supérieur à trois logements ou\n    à 200 m² S.P., un local destiné au stockage des conteneurs recueillant les ordures\n    ménagères nécessaire au tri sélectif doit être aménagé.\n    Nota : Le local de stockage devra être conforme au règlement communal en vigueur\n    et aux prescriptions de l’article 77 du règlement sanitaire départemental des\n    Hauts-de-Seine. Cet article est annexé au présent règlement.\n4.3   Réseaux câbles et télécommunications\n    Toute construction nouvelle doit prévoir les infrastructures nécessaires à la\n    distribution de ces réseaux depuis le point de raccordement général jusqu’à la limite\n    de parcelle.\n    PLAN LOCAL D’URBANISME    112\n    LA GARENNE-COLOMBES", "    Les branchements privatifs nécessaire à la distribution de ces réseaux doivent être\n    réalisés en souterrain jusqu’en limite du domaine public, et ne doivent pas rester\n    apparents sur la construction.\nARTICLE UPM3.5 - CARACTERISTIQUES DES TERRAINS\nSans objet.\nARTICLE UPM3.6 - IMPLANTATION DES CONSTRUCTIONS PAR RAPPORT AUX\n    VOIES PUBLIQUES, AUX VOIES PRIVEES OUVERTES A LA\n    CIRCULATION AUTOMOBILE ET AUX EMPRISES PUBLIQUES\nPrincipe général\nL’implantation d’un bâtiment s’apprécie par rapport à la projection au sol du bâtiment, hors\nsaillies. Des retraits partiels ou ponctuels sont acceptés, pour autant qu’ils n’excédent pas\n20 % du linéaire de façade concerné.\n6.1    Implantation\nLes constructions doivent s’implanter conformément aux indications figurant sur le\ndocument graphique.\n6.2    Pans coupés\nEn l’absence d’indications particulières figurant sur le document graphique, les propriétés\nsituées à l’angle de deux voies supportent un alignement nouveau constitué par un segment\nde droite de 7 m de longueur formant des angles égaux avec chacun des alignements des\nvoies adjacentes.\n6.3    Saillies\n    6.3.1    Les saillies sur alignement :\n    6.3.1.1 Les saillies le long des voies communales de plus de 8 mètres\n    d’emprise, sont autorisées à la double condition :\n    • être situées à une hauteur supérieure ou égale à 5.50 m du sol\n    mesurée au niveau du trottoir.\n    • avoir une profondeur maximale de 0.80 m.\n    6.3.1.2 Les saillies le long des autres voies :\n    Le long des autres voies, il sera fait application du règlement du\n    gestionnaire de la voie correspondante.\n    6.3.2    Les saillies sur marge de reculement sont autorisées.\n    PLAN LOCAL D’URBANISME    113\n    LA GARENNE-COLOMBES", "ARTICLE UPM3.7 - IMPLANTATION DES    CONSTRUCTIONS PAR RAPPORT AUX\n    LIMITES SEPARATIVES\nPrincipe général\nL’implantation d’un bâtiment s’apprécie par rapport à la projection au sol du bâtiment, hors\nsaillies. Des retraits partiels ou ponctuels sont acceptés, pour autant qu’ils n’excédent pas\n20 % du linéaire de façade concerné.\n7.1    Les constructions doivent être implantées dans l’emprise maximale figurant sur le\n    document graphique, soit sur limites soit en retrait conformément aux dispositions\n    de l’article 7.2.\n7.2    En cas d’implantation en retrait des limites séparatives, les constructions (hors\n    saillies) doivent respecter simultanément les règles définies ci-dessous :\nFaçades principales\nFaçades comportant des baies principales (cf. définitions)\n    La distance horizontale à la limite séparative, mesurée perpendiculairement en tout\n    point d’une façade comportant des baies principales, devra être au moins égale à la\n    hauteur de cette façade diminuée de 4 m, sans pouvoir être inférieure à 6 m.\nFaçades secondaires\nFaçades ne comportant pas de baies principales (cf. définitions)\n    La distance horizontale à la limite séparative, mesurée perpendiculairement en tout\n    point d’une façade comportant des baies secondaires ou ne comportant pas de baies,\n    devra être au moins égale à la moitié de la hauteur de cette façade, sans pouvoir\n    être inférieure à 3 m.\n    Les constructions peuvent être implantées à une distance moindre que celle définie\n    ci-dessus lorsque le pétitionnaire et son voisin font application des dispositions de\n    l’article L 471-1 du Code de l’Urbanisme, sous réserve de respecter la distance\n    minimale fixée à l’article UPM2.8 avec les constructions situées sur le terrain voisin.\n    Exception : les dispositions ci-dessus ne s’appliquent pas aux lucarnes disposées\n    sur les rampants de toitures.\nARTICLE UPM3.8 - IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT\n    AUX AUTRES SUR UNE MEME PROPRIETE\n8.1    A moins que les bâtiments ne soient contigus, la construction de plusieurs bâtiments\n    est autorisée à condition qu’en tout point d’une façade, la distance mesurée\n    perpendiculairement à celle-ci et la séparant d’une façade d’un autre bâtiment soit\n    au moins égale à 12 m.\n    PLAN LOCAL D’URBANISME    114\n    LA GARENNE-COLOMBES", "8.2    Pour l’application de l’article 8.2.1, deux constructions réunies par un élément\n    architectural ponctuel tel qu’un auvent ou une pergola (etc.) ne sont pas considérées\n    contiguës.\nARTICLE UPM3.9 - EMPRISE AU SOL\n9.1    L’emprise au sol ne peut dépasser l’emprise figurant sur le document graphique.\n9.2    Les constructions en sous-sol sont autorisées hors emprise figurant sur le\n    document graphique.\nARTICLE UPM3.10 - HAUTEUR MAXIMUM DES CONSTRUCTIONS\nLa hauteur des bâtiments est mesurée au point le plus haut du trottoir au droit de l’unité\nfoncière et ne doit pas dépasser la hauteur indiquée au document graphique.\nA l’exception des dispositifs de réception de signaux radioélectriques, et des souches de\ncheminées dans la limite d’une hauteur de 50 centimètres au-dessus de la hauteur plafond,\naucun édicule ou équipement technique ne doit dépasser le plafond autorisé. Ces édicules\ndoivent être intégrés au volume de la toiture.\nUn dépassement ponctuel et limité de la hauteur indiquée au document graphique est autorisé\npour affirmer l’élément architectural singulier tel qu’indiqué sur le document graphique. Ce\ndépassement ne doit pas excéder de 3 mètres la hauteur maximale autorisée, ni représenter\nplus de 10% de la surface totale de la toiture.\nARTICLE UPM3.11 - ASPECT EXTERIEUR\n11.1    Dispositions générales\n    Les bâtiments ou ouvrages à édifier ou à modifier ne doivent pas porter atteinte\n    au caractère ou à l’intérêt des lieux avoisinants.\n11.2    Constructions existantes\n    Les opérations de réhabilitation-rénovation ne doivent pas dénaturer l’aspect\n    général de la construction existante.\n    11.2.1   Traitement des façades\n    Le caractère d’origine de la façade doit être préservé, notamment\n    lorsqu’elle est composée de pierres de taille ou de briques soigneusement\n    mises en œuvre.\n    Les matériaux destinés à être enduits doivent être recouverts. L’enduit\n    au mortier de ciment non teinté ou non peint est proscrit.\n    PLAN LOCAL D’URBANISME    115\n    LA GARENNE-COLOMBES", "    Les éléments d’ornementation existants (modénature, corniches, volets ou\n    persiennes etc.) doivent être conservés. Ils peuvent être restaurés.\n    11.2.2   Eclairement des combles\n    L’éclairement éventuel des combles doit être assuré, soit par des lucarnes,\n    soit par des verrières ou des châssis de toit intégrés.\n    Les lucarnes doivent être à deux ou trois versants ou semi-cylindriques et\n    suivre, dans la mesure du possible, l’axe des percements des étages\n    inférieurs. La largeur hors tout de la lucarne ne peut excéder la dimension\n    horizontale de la fenêtre située à l’étage inférieur.\n    11.2.3   Surélévation\n    Les surélévations et redressements de toiture des constructions\n    achevées à la date d’entrée en vigueur du PLU doivent être traités en\n    harmonie avec l’architecture et les matériaux du bâtiment concerné.\n11.3   Constructions neuves\n    11.3.1   Pour les façades des constructions donnant sur les voies publiques ou\n    privées, doit être privilégié un choix de matériaux de qualité et pérennes\n    (stables dans la durée et nécessitant un faible entretien) tels que la\n    pierre, la brique, le métal, le verre, le béton architectonique, le bois, etc.\n    11.3.2   Pour l’habitation, les fenêtres dont la largeur est supérieure à la hauteur\n    sont interdites.\n    11.3.3   Les façades latérales et postérieures des constructions y compris les\n    pignons rendus visibles lors de démolitions ainsi que les constructions\n    annexes (garages, appentis…) doivent être traitées comme les façades\n    principales et en harmonie avec elles.\n    11.3.4   Les matériaux utilisés pour le traitement des murs pignons devront être\n    de même aspect et de même teinte que les façades principales ; les\n    pignons pourront être traités en trompe-l’œil.\n    11.3.5 Les verrières et dispositifs solaires intégrés peuvent être implantés en\n    façade et en toiture, sous réserve de ne pas porter atteinte à l’esprit\n    général de la construction.\n    11.3.6 Aucun matériau destiné à être enduit ou recouvert d’un parement (tels que\n    les carreaux de plâtre, les bardages, les briques creuses, les parpaings…)\n    ne doit être laissé apparent.\n    11.3.7 Les enduits d’aspect rustique ou grossier, tels que l’enduit au mortier de\n    ciment non teinté ou non peint, sont proscrits.\n    PLAN LOCAL D’URBANISME    116\n    LA GARENNE-COLOMBES", "11.4   Toitures\n    11.4.1 Principe général\n    Qu’il s’agisse de toitures constituées de matériaux traditionnels (tuiles,\n    zinc, ardoises…) ou plus récents (bacs acier, tôles d’aluminium anodisées\n    ou laquées…) ou de terrasses, les accessoires à caractères technique\n    (caissons de climatisation, extracteurs, édicules d’ascenseur, garde-\n    corps, antennes…) doivent être regroupés et intégrés à la toiture de façon\n    à en annuler l’impact visuel.\n    11.4.2 Antennes\n    Les antennes d’émission ou de réception (radio, télévision, antenne\n    parabolique, radio- téléphone…), de quelque dimension que ce soit, doivent\n    être implantées exclusivement en toiture des bâtiments à une distance de\n    la façade au moins égale à leur hauteur et être de teinte identique à celle\n    de la toiture. Elles ne doivent pas être visibles depuis l’espace public.\n    11.4.3 Toitures- terrasses\n    Toitures-terrasses non accessibles\n    Les toitures- terrasses non accessibles sont autorisées :\n    - Pour l’extension des bâtiments existants ne comportant pas de toitures\n    en pentes,\n    - Pour les bâtiments annexes d’une hauteur inférieure à 3,20 m (garage,\n    …),\n    - Pour les équipements publics et d’intérêt collectif,\n    - Pour des raisons architecturales (intégration d’édicules techniques en\n    toiture, liaisons des volumes bâtis...), les toitures- terrasses non\n    accessibles sont autorisées jusqu’à 10% maximum de la surface\n    d’emprise au sol de la construction projetée.\n    Toitures- terrasses accessibles\n    -   Les toitures- terrasses accessibles sont autorisées sur les\n    constructions à rez-de-chaussée n’excédant pas 5 m de hauteur\n    situées à l’arrière et en continuité des bâtiments implantés sur rue.\n    Ces toitures- terrasses sont impérativement à traiter en « dalles\n    jardin » aménagées en espaces verts.\n    -   A l’exception de la « dalle jardin » définie ci avant, les toitures-\n    terrasses, directement accessibles de plain-pied (terrasses formant\n    toiture des étages inférieurs) et intégrées à la construction projetée\n    sont acceptées dans la limite de 50% des surfaces d’emprise au sol de\n    la construction projetée. En cas d’extension, les 50% prennent en\n    compte la surface existante plus celle de l’extension.\n    -\n    Les édicules sur toitures-terrasses\n    PLAN LOCAL D’URBANISME    117\n    LA GARENNE-COLOMBES", "    Les édicules sur terrasses doivent être implantés en retrait de la façade\n    d’une distance au moins égale à leur hauteur.\n11.4.4   Toitures en pente\n    Pour les constructions à usage d’habitation, les toitures en pente doivent :\n    • Présenter une pente minimum de 30%.\n    Ou\n    • Etre de type « Mansart » : dans ce cas, elles doivent s’inscrire dans un\n    arc de cercle conforme au croquis suivant :\n    Le terrasson doit comporter une pente de 10% minimum.\n    Ou\n    S’il s’agit d’un étage en attique, s’inscrire dans l’épure suivante :\n    Les percements et ouvertures inclus dans le volume des toitures (lucarnes,\n    souches…) doivent être traités avec soin.\n    Les dispositions ci-avant ne s’appliquent pas à l’élément architectural\n    singulier mentionné à l’article 10 et figuré au document graphique UPM3.\n    PLAN LOCAL D’URBANISME    118\n    LA GARENNE-COLOMBES", "11.5    Clôtures\n    11.5.1   Clôtures sur voies et emprises publiques\n    Les piliers de portail d’entrée et de clôture ne peuvent dépasser 2,20 m\n    de hauteur.\n    La clôture doit avoir une hauteur de 2m et comporter une partie pleine\n    (mur bahut) d’une hauteur comprise entre 0,80 et 1 m (mesurée au niveau\n    du trottoir). La partie supérieure de la clôture doit être constituée d’un\n    ensemble en serrurerie.\n    11.5.2   Les clôtures sur les autres limites ne doivent pas excéder une hauteur\n    totale de 2,60 m mesurée au niveau du trottoir.\n    11.5.3   Les règles ci-avant (11.5.1 et 11.5.2) ne sont pas applicables aux clôtures\n    entourant les équipements publics.\nARTICLE UPM3.12 - STATIONNEMENT\n12 .1: Règles applicables à l’ensemble des constructions à l’exception des\n    constructions et installations nécessaires aux services publics ou\n    d’intérêt collectif, lesquelles sont régies par l’article 12.2, ci-après.\n    12.1.1   Principes généraux :\n    Le stationnement des véhicules motorisés doit être assuré en dehors des\n    voies publiques.\n    Lors de toute opération de construction neuve, les aires de stationnement\n    doivent être réalisées en sous-sol soit sur le terrain d’assiette de ladite\n    opération, soit dans son environnement immédiat.\n    80% des aires de stationnement doivent avoir un accès direct. Les places\n    doubles auront une profondeur minimum de 9 m.\n    Les aires de stationnement doivent être accessibles en manœuvre\n    d’entrée et de sortie depuis les voies de circulation.\n    Les rampes ne doivent pas entraîner de modification dans le niveau du\n    trottoir. Leur pente dans les 5 premiers mètres à partir de l’alignement\n    ne doit pas excéder 5%, sauf dans le cas d’impossibilité technique, sous\n    réserve que l’implantation de la rampe permette les manœuvres d’entrée\n    et de sortie en toute sécurité.\n    Lors de toute opération de constructions neuves, les aires de\n    stationnement et leurs accès doivent être réalisés conformément aux\n    normes françaises dont les dispositions sont mentionnées à l’annexe 6 du\n    PLAN LOCAL D’URBANISME    119\n    LA GARENNE-COLOMBES", "    présent règlement « normes de stationnement communes à toutes les\n    zones ».\n    12.1.2   Nombre de stationnements :\n    DESTINATION DES    EMPLACEMENTS\n    CONSTRUCTIONS\nHabitation    1-    Les logements locatifs financés avec un prêt aidé de\n    l’Etat :\n    -    En application des dispositions de l’alinéa n° 1 de\n    l’article L.151-35 du Code de l’urbanisme, il est exigé, lors de\n    la construction de logements locatifs financés avec un prêt\n    aidé par l’Etat, la réalisation d’une aire de stationnement p ure dès que la première décimale est supérieure ou égale à 5.\n    12.1.3    En application des dispositions de l’article L. 151-31 du Code de l’\n    urbanisme les normes de réalisation d’aires de stationnement édictées à\n    l’article 12.1.2 sont réduites à 15 % en contrepartie de la mise à disposition\n    de véhicules électriques munis d’un dispositif de recharge adapté ou de\n    véhicules propres en auto-partage.\n    12.1.4    Lorsque le bénéficiaire du permis ou de la décision de non-opposition à une\n    déclaration préalable ne peut pas satisfaire ne peut satisfaire aux\n    obligations résultant de l’article 12.1.2,, il peut en être tenu quitte en\n    PLAN LOCAL D’URBANISME    121\n    LA GARENNE-COLOMBES", "    justifiant pour les places qu’il ne peut réaliser lui-même sur le terrain\n    d’assiette ou dans son environnement immédiat :\n    • soit de l’obtention d’une concession à long terme dans un parc public de\n    stationnement existant ou en cours de réalisation et situé à proximité\n    de l’opération,\n    • soit de l’acquisition ou de la concession de places dans un parc privé de\n    stationnement existant ou en cours de réalisation et situé à proximité\n    de l’opération,\n    Lorsqu’une aire de stationnement a été prise en compte dans le cadre d’une\n    concession à long terme ou d’un parc privé de stationnement, elle ne peut\n    plus être prise en compte, en tout ou partie, à l’occasion d’une nouvelle\n    autorisation.\n    12.1.5   En cas d’extension et/ou de surélévation supérieure à 20 m² S.P., le\n    nombre d’aires de stationnement à réaliser pour les véhicules motorisés\n    correspond aux besoins générés calculés selon les règles définies à\n    l’article 12.1.2.\n    12.1.6   En cas de changement de destination de locaux, le nombre d’aires de\n    stationnement à réaliser pour les véhicules motorisés correspond aux\n    besoins générés calculés selon les règles définies à l’article 12.1.2.\n    12.1.7   Toute place supprimée doit être recréée dans l’unité foncière.\n    12.1.8   Une aire de stationnement doit être prévue pour les vélos à raison :\n    • d'un emplacement de 0,50 m² par logement.\n    • d'un emplacement de 0,25 m² pour 100 m² de S.P. de bureau, de\n    commerce ou d’artisanat.\n12.2:   Règles applicables aux constructions et installations nécessaires aux\n    services publics ou d’intérêt collectif\n    12.2.1   Principes généraux :\n    Le stationnement des véhicules motorisés doit être assuré en dehors des\n    voies publiques, en surface ou en sous-sol, sur le terrain d’assiette du\n    projet ou dans son environnement immédiat.\n    80% des aires de stationnement doivent avoir un accès direct. Les places\n    doubles auront une profondeur minimum de 9 m.\n    Les aires de stationnement doivent être accessibles en manœuvre\n    d’entrée et de sortie depuis les voies de circulation.\n    Les rampes ne doivent pas entraîner de modification dans le niveau du\n    trottoir. Leur pente dans les 5 premiers mètres à partir de l’alignement\n    PLAN LOCAL D’URBANISME    122\n    LA GARENNE-COLOMBES", "    ne doit pas excéder 5%, sauf dans le cas d’impossibilité technique, sous\n    réserve que l’implantation de la rampe permette les manœuvres d’entrée\n    et de sortie en toute sécurité.\n    Lors de toute opération de constructions neuves, les aires de\n    stationnement et accès doivent être réalisés conformément aux normes\n    françaises dont les dispositions sont mentionnées à l’annexe 6 du présent\n    règlement « normes de stationnement communes à toutes les zones ».\n    12.2..2 Nombre d’aires de stationnement pour les véhicules motorisés\n  DESTINATION DES CONSTRUCTIONS    EMPLACEMENTS\nConstructions et installations nécessaires aux Le nombre de places de stationnement\nservices publics ou d’intérêt collectif    éventuellement nécessaire au fonctionnement et à\n (crèche, groupe scolaire maternel et la fréquentation des constructions et installations\nélémentaire, enseignement secondaire et nécessaires aux services publics ou d’intérêt\nsupérieur,   centre    aquatique,   patinoire, collectif doit être apprécié notamment au regard\nbibliothèque, médiathèque, cinéma, salle de de la nature de l’équipement, de son mode de\nspectacle, hôpital, clinique, foyer de vie pour fonctionnement, de sa situation sur le territoire\npersonnes handicapées, maison-relais, EHPAD, communal, des possibilités de desserte par les\n, foyers jeunes travailleurs, résidences transports en commun ainsi que de l’offre publique\nservices…).    de stationnement disponible, existante ou projetée\n    dans le secteur du projet.\n    Cette offre publique de stationnement doit être\n    existante à la date de mise en service de\n    l’équipement.\n    Par dérogation aux principes généraux énoncés à\n    l’article 12.2.1il peut être recouru en tant que de\n    besoin au stationnement sur la voie publique pour les\n    seuls stationnements de très courte durée (type\n    dépose-minute…).\n    12.2.3   Toute place supprimée doit être remplacée.\nARTICLE UPM3.13 - ESPACES LIBRES ET PLANTATIONS\n13.1    Déduction faite des circulations, cheminements et aires de stationnement rendues\n    obligatoires par l’article 12, 60% des étendues libres de toute construction en\n    élévation doivent être traitées en espaces paysagers plantés sur 60 cm de terre\n    végétale minimum.\n    Toutefois, les étendues libres des équipements publics et des équipements\n    d’intérêt collectif (cf. définitions) peuvent faire l’objet d’un aménagement minéral.\n    PLAN LOCAL D’URBANISME    123\n    LA GARENNE-COLOMBES", "13.2   En limite de terrain, le niveau fini des espaces verts à rez-de-chaussée ne peut\n    être supérieur au niveau du terrain voisin.\nARTICLE UPM3.14 - COEFFICIENT D’OCCUPATION DU SOL\n    Sans objet.\n    PLAN LOCAL D’URBANISME    124\n    LA GARENNE-COLOMBES", " ZONE USP1\nPLAN LOCAL D’URBANISME   125\n LA GARENNE-COLOMBES", "La zone USP1 traduit les objectifs d’aménagement du quartier des Champs-Philippe, des\nabords du boulevard National et de la Place de Belgique.\nElle comprend quatre sous-secteurs :\n-   USP1 a : à vocation de construction sociale accueillant ou non des populations spécifiques\n    (maison relais, logements d’hébergement d’urgence…).\n- USP1 b : à vocation mixte de logement libre et de construction sociale accueillant ou non\ndes populations spécifiques (foyer jeunes travailleurs, logements familiaux…)\n- USP1 c : à vocation d’activités économiques et selon les dispositions des OAP le cas\néchéant\n-   USP1 d : à vocation de construction de logements et commerces à réaliser par tranche.\nARTICLE USP1.1 - OCCUPATIONS ET UTILISATIONS DU SOL INTERDITES\nSont interdits :\n1.1    L’implantation et l’extension des installations classées soumises à autorisation sauf\n    celles mentionnées à l’article 2.\n1.2    Les dépôts non couverts de ferrailles, de matériaux, de combustibles solides, ainsi\n    que les entreprises de cassage de voitures et la transformation de matériaux de\n    récupération.\n1.3    Les affouillements et exhaussements des sols nécessitant une autorisation au titre\n    de l’article R 442.2 du Code de l’Urbanisme et qui ne sont pas nécessaires à des\n    travaux de construction.\n1.4    Le stationnement des caravanes et installations de camping soumises à autorisation\n    préalable à l’exception, le cas échéant, de l’aire d’accueil des gens du voyage.\n1.5    Le changement de destination des locaux commerciaux et artisanaux situés sur\n    l’ensemble de l’unité foncière concernée le long des voies définies comme «\n    servitudes commerciales et artisanales » sur le document graphique 4.2.\n    L’interdiction de changement de destination ne s’applique pas aux équipements\n    publics.\n1.6    En sous-secteur USP1c, les constructions nouvelles à destination d’habitation.\nARTICLE USP1.2- OCCUPATION    ET UTILISATION DU SOL ADMISES SOUS\n    CONDITIONS PARTICULIERES\n2.1    Les installations classées, soumises à autorisation, sont autorisées à condition\n    qu’elles n’entraînent pour le voisinage aucune incommodité et, en cas d’accident ou\n    de fonctionnement défectueux, aucune insalubrité, ni sinistre susceptible de causer\n    des dommages graves ou irréparables aux personnes et aux biens.\n    PLAN LOCAL D’URBANISME    126\n    LA GARENNE-COLOMBES", "2.2    L’extension ou la transformation des installations classées existantes est\n    autorisée, à condition qu’il n’en résulte pas pour le voisinage une aggravation des\n    dangers ou nuisances liés au classement, et que toutes dispositions utiles soient\n    mises en œuvre pour l’intégration dans le milieu environnant.\n2.3    Pour les constructions existantes excédant l’emprise et la hauteur au sol autorisée,\n    les changements de destinations sont autorisés dans la limite de l’emprise et de la\n    hauteur existante à la date d’entrée en vigueur du PLU.\n2.4    Le long des voies concernées par les « servitudes commerciales et artisanales » sur\n    le document graphique 4.2, les constructions nouvelles devront comporter des\n    locaux commerciaux ou artisanaux à rez-de-chaussée. Cet article ne s’applique pas\n    aux équipements publics. Les locaux commerciaux et artisanaux supprimés doivent\n    être reconstitués au sein de l’unité foncière.\nRappel : Les constructions neuves à destination d'habitation, implantées le long des voies\nbruyantes, doivent respecter les règles d'isolement acoustique définies par l'arrêté\npréfectoral n°2000-174 du 29 juin 2000.\nARTICLE USP1.3- ACCES ET VOIRIE\n3.1    Pour être constructible, un terrain doit être desservi par une voie publique ou\n    privée ou un accès (éventuellement obtenu par application de l’article 682 du Code\n    Civil) ouvert à la circulation automobile, de caractéristiques proportionnées à\n    l’importance de l’occupation ou de l’utilisation du sol envisagée.\n3.2    Les voies nouvelles se terminant en impasse doivent être aménagées de telle sorte\n    que les véhicules puissent faire demi-tour.\nARTICLE USP1.4 - DESSERTE PAR LES RESEAUX ET STOCKAGE DES DECHETS\n4.1    Eau\n    Toute construction ou installation nouvelle nécessitant une alimentation en eau doit\n    être raccordée au réseau public d’eau potable.\n4.2    Assainissement\n    Eaux usées – eaux vannes\n    Toute construction ou installation nouvelle doit être raccordée au réseau public\n    d’assainissement.\n    Jusqu’aux limites de propriété, les rejets doivent être réalisés par un réseau\n    séparatif.\n    PLAN LOCAL D’URBANISME    127\n    LA GARENNE-COLOMBES", "    L’évacuation des eaux résiduaires provenant des installations industrielles ou\n    artisanales doit faire l’objet d’un pré- traitement avant le rejet dans le réseau\n    public d’assainissement.\n    Recommandations sur les eaux pluviales\n    De manière à limiter ces apports, tant d’un point de vue qualitatif que quantitatif,\n    des techniques alternatives aux réseaux devront être privilégiées (noues,\n    chaussées réservoirs, fossés drainant, bassins…).\n    En cas d’extension ou d’aménagement d’une construction existante, des dispositifs\n    appropriés peuvent être recherchés afin d’assurer la maîtrise des débits et\n    l’écoulement des eaux pluviales et de ruissellement, en se rapprochant des normes\n    édictées ci-dessous.\n    Eaux pluviales\n    Le débit généré par une construction neuve ou une reconstruction ne doit pas\n    excéder pour une pluie de retour décennal 2l/s/ha pour un rejet dans un réseau\n    unitaire.\n    En cas d’extension :\n    - si la construction existante présente un débit de rejet conforme (<2l/s/ha), le\n    débit de rejet de la construction après travaux doit être conforme.\n    - si la construction existante n’est pas conforme, le débit de rejet de la\n    construction après travaux ne doit pas être supérieur à celui de la construction\n    existante.\n    Recommandations sur le stockage des déchets\n    Pour toute construction ou groupe de construction supérieur à trois logements ou\n    à 200 m² S.P., un local destiné au stockage des conteneurs recueillant les ordures\n    ménagères nécessaire au tri sélectif doit être aménagé.\n    Nota : Le local de stockage devra être conforme au règlement communal en vigueur\n    et aux prescriptions de l’article 77 du règlement sanitaire départemental des\n    Hauts-de-Seine. Cet article est annexé au présent règlement.\n4.3   Réseaux câbles et télécommunications\n    Toute construction nouvelle doit prévoir les infrastructures nécessaires à la\n    distribution de ces réseaux depuis le point de raccordement général jusqu’à la limite\n    de parcelle.\n    Les branchements privatifs nécessaire à la distribution de ces réseaux doivent être\n    réalisés en souterrain jusqu’en limite du domaine public, et ne doivent pas rester\n    apparents sur la construction.\n    PLAN LOCAL D’URBANISME    128\n    LA GARENNE-COLOMBES", "ARTICLE USP1.5- CARACTERISTIQUES DES TERRAINS\n    Sans objet.\nARTICLE USP1.6 - IMPLANTATION    DES   CONSTRUCTIONS    PAR    RAPPORT    AUX\n    VOIES   PUBLIQUES,    AUX    VOIES    PRIVEES    OUVERTES    A    LA\n    CIRCULATION    AUTOMOBILE    ET   AUX    EMPRISES    PUBLIQUES\n    (PLACES,    VOIES    FERROVIAIRES,    SQUARES    ET    MAILS\n    PIETONNIERS, EQUIPEMENTS SCOLAIRES…)\nPrincipe général\nL’implantation d’un bâtiment s’apprécie par rapport à la projection au sol du bâtiment, hors\nsaillies.\n6.1    Implantation\n    6.1.1    Constructions existantes (hors emprises opérationnelles)\n    Les travaux de modification de façade ou de surélévation d’un niveau, dont\n    l’implantation ne respecte pas l’article 6.1.2, à la date d’entrée en vigueur\n    du PLU, peuvent être autorisés à condition que ces transformations\n    n’entraînent pas une augmentation de l’emprise au sol dans la marge de\n    reculement quand elle existe. Cet article ne s’applique pas aux équipements\n    publics et d’intérêt collectif.\n    6.1.2    Constructions nouvelles (dans les emprises opérationnelles)\n    Les constructions en superstructure doivent être implantées à l’intérieur\n    des emprises opérationnelles comme indiquées sur le document graphique.\n    Les constructions devront respecter les règles d’implantation à\n    l’alignement obligatoire telles que définies au document graphique.\n    Lorsqu’une marge de reculement est imposée au document graphique, les\n    constructions seront implantées à une distance de l’alignement au moins\n    égale à cette marge.\n    Dans le cas d’une opération de démolition / reconstruction, les\n    constructions futures respecteront l’alignement ou la marge de\n    reculement avant démolition.\n6.2    Pans coupés\n    Sans objet.\n    PLAN LOCAL D’URBANISME    129\n    LA GARENNE-COLOMBES", "6.3    Saillies\n    6.3.1    Les saillies sur alignement :\n    6.3.1.1 Les saillies le long des voies communales de plus de 8 mètres\n    d’emprise, sont autorisées à la double condition :\n    • être situées à une hauteur supérieure ou égale à 5.50 m du sol\n    mesurée au niveau du trottoir.\n    • avoir une profondeur maximale de 0.80 m.\nCette disposition n’est pas applicable aux équipements publics et d’intérêt collectif.\n    6.3.1.2 Les saillies le long des autres voies :\n    Le long des autres voies, il sera fait application du règlement du\n    gestionnaire de la voie correspondante.\n    6.3.2    Les saillies sur marge de reculement sont autorisées.\nARTICLE USP1.7- IMPLANTATION    DES    CONSTRUCTIONS    PAR    RAPPORT    AUX\n    LIMITES SEPARATIVES\nPrincipe général\nL’implantation d’un bâtiment s’apprécie par rapport à la projection au sol du bâtiment, hors\nsaillies.\n7.1    Constructions existantes (hors emprises opérationnelles)\n    La surélévation et l’extension d’un bâtiment existant peuvent être autorisées :\n    • suivant les règles des constructions nouvelles.\n    Si ces règles ne peuvent pas être respectées :\n    • La surélévation d’un niveau et l’extension d’un bâtiment peuvent être autorisées\n    dans le prolongement des murs existants, à condition que les façades créées\n    ne respectant pas les prospects imposés ne comportent pas de baies autres\n    que des jours de souffrance.\n7.2    Constructions nouvelles (dans les emprises opérationnelles)\n    Les constructions peuvent être implantées sur limites séparatives ou en retrait.\n    7.2.1    En cas d’implantation sur les limites séparatives, la façade sur limite ne\n    peut comporter de baies autres que des jours de souffrance.\n    7.2.2    En cas d’implantation en retrait des limites séparatives, les constructions\n    (hors saillies) doivent respecter simultanément les règles définies ci-\n    dessous :\n    PLAN LOCAL D’URBANISME    130\n    LA GARENNE-COLOMBES", "Façades principales\nFaçades comportant des baies principales (cf. définitions)\n    La distance horizontale à la limite séparative, mesurée perpendiculairement en tout\n    point d’une façade comportant des baies principales, devra être au moins égale à la\n    hauteur de cette façade, sans pouvoir être inférieure à 6 m.\nFaçades secondaires\nFaçades ne comportant pas de baies principales (cf. définitions)\n    La distance horizontale à la limite séparative, mesurée perpendiculairement en tout\n    point d’une façade comportant des baies secondaires ou ne comportant pas de\n    baies, devra être au moins égale à la moitié de la hauteur de cette façade, sans\n    pouvoir être inférieure à 3 m.\n7.3    Les constructions peuvent être implantées à une distance moindre que celle définie\n    ci-dessus lorsque le pétitionnaire et son voisin font application des dispositions de\n    l’article L 471-1 du Code de l’Urbanisme, sous réserve de respecter la distance\n    minimale fixée à l’article USP1-8 avec les constructions situées sur le terrain voisin.\n7.4    Pour le sous-secteur USP1b\n    En cas d’implantation en retrait des limites séparatives, la distance horizontale à\n    la limite séparative, mesurée perpendiculairement en tout point d’une façade\n    comportant des baies principales, devra être au moins égal à 15 mètres, avec une\n    possibilité de recul réduit à 2 mètres au minimum sur les parties de bâtiment en\n    retrait à partir du R+5 selon l’indication figurée au document graphique.\n7.5    Pour le sous-secteur USP1d\n    En cas d’implantation en retrait des limites séparatives joignant l’alignement, la\n    distance horizontale à la limite séparative, mesurée perpendiculairement en tout\n    point d’une façade comportant des baies principales, devra être au moins égal à 3\n    mètres.\nARTICLE USP1.8- IMPLANTATION DES CONSTRUCTIONS LES UNES PAR RAPPORT\n    AUX AUTRES SUR UNE MEME PROPRIETE\n    La construction de plusieurs bâtiments non contigus sur une même propriété doit\n    respecter les dispositions suivantes :\n8.1    La distance, mesurée perpendiculairement en tout point de la façade, doit être au\n    moins égale :\n    •    A la hauteur de la façade la plus haute, avec un minimum de 6 m si\n    l’une des façades comporte des baies principales.\n    ou\n    •    A la moitié de la façade la plus haute, avec un minimum de 3 m si les\n    deux façades ne comportent pas de baies principales.\n    PLAN LOCAL D’URBANISME    131\n    LA GARENNE-COLOMBES", "Façades avec baie principale\n    L ≥ H\n    H\n    L\n    min. 6 m\n Façades sans baie principale\n    L ≥ H/2\n    H\n    L\n    min. 3 m\n8.2    Pour l’application de l’article 8.1, deux constructions réunies par un élément\n    architectural ponctuel tel qu’un auvent ou une pergola (etc.) ne sont pas considérées\n    contiguës. Cette règle ne s’applique pas pour le secteur USP1 d.\nARTICLE USP1.9 - EMPRISE AU SOL\n9.1    Constructions existantes (hors emprise opérationnelles)\n    9.1.1    L’emprise au sol ne doit pas excéder 40% de la surface du terrain.\n    9.1.2    En cas de changement de destination, il convient de se reporter à l’article\n    2.3.\n    9.1.3    Il n’est pas fixé de règle pour les équipements publics et d’intérêt\n    collectif.\n9.2    Constructions nouvelles (dans les emprises opérationnelles)\n    9.2.1    L’emprise au sol ne peut dépasser la limite des emprises opérationnelles\n    figurant sur le document graphique.\n    PLAN LOCAL D’URBANISME    132\n    LA GARENNE-COLOMBES", "    9.2.2    Les constructions en sous-sol sont autorisées hors emprise figurant sur\n    le document graphique.\n    9.2.3    Dans le cas d’une opération de démolition / reconstruction, les\n    constructions futures respecteront l’alignement ou la marge de\n    reculement avant démolition.\nARTICLE USP1.10- HAUTEUR MAXIMUM DES CONSTRUCTIONS\n10.1   Hors emprises opérationnelles\n    La hauteur des constructions ne peut excéder :\n    •    12 m à l’égout du toit ou 12m à l’acrotère pour les toitures- terrasses.\n    •    15 m au faîtage pour les toitures en pentes et les toitures des étages en\n    attique.\n    •    15 m pour les édicules sur toitures- terrasses.\n10.2   Dans les emprises opérationnelles\n    La hauteur ne doit pas dépasser la hauteur indiquée au document graphique mesurée\n    au point le plus haut du trottoir au droit de l’emprise opérationnelle.\n    A l’exception des dispositifs de réception de signaux radioélectriques, et des\n    souches de cheminées dans la limite d’une hauteur de 50 centimètres au-dessus de\n    la hauteur plafond, aucun édicule ou équipement technique ne doit dépasser le\n    plafond autorisé.\n    Ces édicules doivent être parfaitement intégrés au volume de la toiture. En\n    particulier, les édicules sur terrasse ne doivent pas dépasser la hauteur imposée à\n    l’article 10.2.\n    Pour le sous-secteur USP1b, un dépassement ponctuel et limité de la hauteur\n    indiquée au document graphique est autorisé pour faciliter l’intégration\n    architecturale des édicules ou équipements techniques. Ce dépassement ne doit pas\n    excéder de 2 mètres la hauteur maximum autorisée et être inclus dans\n    l’emplacement figuré au document graphique.\n10.3   Cas particulier des OAP.\n    Dans le cas où la construction est concernée par l’application d’une OAP (orientation\n    d’aménagement et de programmation), des hauteurs différentes pourront être\n    appliquées si elles sont identifiées expressément dans le schéma de l’OAP.\n    PLAN LOCAL D’URBANISME    133\n    LA GARENNE-COLOMBES", "ARTICLE USP1.11 ASPECT EXTERIEUR\n11.1   Dispositions générales\n    Les bâtiments ou ouvrages à édifier ou à modifier ne doivent pas porter atteinte\n    au caractère ou à l’intérêt des lieux avoisinants.\n11.2   Constructions existantes (hors emprises opérationnelles)\n    Les opérations de réhabilitation-rénovation ne doivent pas dénaturer l’aspect\n    général de la construction existante.\n    11.2.1   Traitement des façades\n    Le caractère d’origine de la façade doit être préservé, notamment\n    lorsqu’elle est composée de pierres de taille ou de briques soigneusement\n    mises en œuvre.\n    Les matériaux destinés à être enduits doivent être recouverts. L’enduit\n    au mortier de ciment non teinté ou non peint est proscrit.\n    Les éléments d’ornementation existants (modénature, corniches, volets ou\n    persiennes, etc.) doivent être conservés. Ils peuvent être restaurés.\n    11.2.2   Eclairement des combles\n    L’éclairement éventuel des combles doit être assuré, soit par des lucarnes,\n    soit par des verrières ou des châssis de toit intégrés.\n    Les lucarnes doivent être à deux ou trois versants ou semi-cylindriques et\n    suivre, dans la mesure du possible, l’axe des percements des étages\n    inférieurs. La largeur hors tout de la lucarne ne peut excéder la dimension\n    horizontale de la fenêtre située à l’étage inférieur.\n    11.2.3   Surélévation\n    Les surélévations et redressements de toiture des constructions\n    achevées à la date d’entrée en vigueur du PLU doivent être traités en\n    harmonie avec l’architecture et les matériaux du bâtiment concerné.\n11.3   Constructions neuves (dans les emprises opérationnelles)\n    11.3.1   Pour les façades des constructions donnant sur les voies publiques ou\n    privées, doit être privilégié un choix de matériaux de qualité et pérennes\n    (stables dans la durée et nécessitant un faible entretien) tels que la\n    pierre, la brique, le métal, le verre, le béton architectonique, le bois, etc.\n    11.3.2 Les façades latérales et postérieures des constructions y compris les\n    pignons rendus visibles lors de démolitions ainsi que les constructions\n    PLAN LOCAL D’URBANISME    134\n    LA GARENNE-COLOMBES", "    annexes (garages, appentis…) doivent être traitées comme les façades\n    principales et en harmonie avec elles.\n    11.3.3 Les matériaux utilisés pour le traitement des murs pignons devront être\n    de même aspect et de même teinte que les façades principales ; les pignons\n    pourront être traités en trompe-l’œil.\n    11.3.4 Les verrières et dispositifs solaires intégrés peuvent être implantés en\n    façade et en toiture, sous réserve de ne pas porter atteinte à l’esprit\n    général de la construction.\n    11.3.5 Aucun matériau destiné à être enduit ou recouvert d’un parement (tels que\n    les carreaux de plâtre, les bardages, les briques creuses, les parpaings…)\n    ne doit être laissé apparent.\n    11.3.6 Les enduits d’aspect rustique ou grossier, tels que l’enduit au mortier de\n    ciment non teinté ou non peint, sont proscrits.\n11.4   Toitures\n    11.4.1   Principe général\n    Qu’il s’agisse de toitures constituées de matériaux traditionnels (tuiles,\n    zinc, ardoises…) ou plus récents (bacs acier, tôles d’aluminium anodisées\n    ou laquées…) ou de terrasses, les accessoires à caractères technique\n    (caissons de climatisation, extracteurs, édicules d’ascenseur, garde-\n    corps, antennes…) doivent être regroupés et intégrés à la toiture de façon\n    à en annuler l’impact visuel.\n    11.4.2   Antennes :\n    Les antennes d’émission ou de réception (radio, télévision, antenne\n    parabolique, radio- téléphone…), de quelque dimension que ce soit, doivent\n    être implantées exclusivement en toiture des bâtiments à une distance de\n    la façade au moins égale à leur hauteur et être de teinte identique à celle\n    de la toiture. Elles ne doivent pas être visibles depuis l’espace public.\n    11.4.3   Toitures- terrasses\n    Toitures-terrasses non accessibles\n    Les toitures- terrasses non accessibles sont autorisées uniquement :\n    -   pour l’extension des bâtiments existants ne comportant pas de toitures\n    en pentes,\n    -   pour les bâtiments annexes d’une hauteur inférieure à 3,20 m (garage,\n    …),\n    -   pour les équipements publics et d’intérêt collectif,\n    -   pour les constructions à destination de bureaux.\n    PLAN LOCAL D’URBANISME    135\n    LA GARENNE-COLOMBES", "    -    pour les constructions à destination de logements dans les sous-\n    secteurs USP1b et USP1d.\n    Toitures- terrasses accessibles\n    Les toitures- terrasses accessibles sont autorisées :\n    - pour les équipements publics et d’intérêt collectif,\n    - pour les constructions à usage de bureaux.\n    - pour les constructions à usage de logements dans les sous-secteurs\n    USP1b et USP1d.\n    Pour toutes les autres destinations :\n    Les toitures- terrasses accessibles sont autorisées sur les constructions\n    à rez-de-chaussée n’excédant pas 5 m de hauteur situées à l’arrière et en\n    continuité des bâtiments implantés sur rue. Ces toitures- terrasses sont\n    impérativement à traiter en « dalles jardin » aménagées en espaces verts.\n    A l’exception de la « dalle jardin » définie ci avant, les toitures- terrasses,\n    directement accessibles de plain-pied (terrasses formant toiture des\n    étages inférieurs) et intégrées à la construction projetée sont acceptées\n    dans la limite de 50% des surfaces d’emprise au sol de la construction\n    projetée. En cas d’extension, les 50% prennent en compte la surface\n    existante plus celle de l’extension.\n    Les édicules techniques\n    Les édicules techniques sur toitures- terrasses doivent être implantés en\n    retrait de la façade d’une distance au moins égale à leur hauteur et\n    devront faire l’objet d’un traitement soigné, intégré à l’architecture du\n    bâtiment.\n11.4.4   Toitures en pente\n    Pour les constructions à usage d’habitation, les toitures en pente doivent :\n    • Présenter une pente minimum de 30%.\n    Ou\n    • Etre de type « Mansard » : dans ce cas, elles doivent s’inscrire dans un\n    arc de cercle conforme au croquis suivant :\n    PLAN LOCAL D’URBANISME    136\n    LA GARENNE-COLOMBES", "    Le terrasson doit comporter une pente de 10% minimum.\n    Ou\n    S’il s’agit d’un étage en attique, s’inscrire dans l’épure suivante :\n    Les percements et ouvertures inclus dans le volume des toitures\n    (lucarnes, souches…) doivent être traités avec soin.\n11.5   Clôtures\n    11.5.1   Clôtures sur voies et emprises publiques existantes ou futures.\n    Les piliers de portail d’entrée et de clôture ne peuvent dépasser 2,20 m\n    de hauteur.\n    La clôture doit avoir une hauteur de 2m et comporter une partie pleine\n    (mur bahut) d’une hauteur comprise entre 0,50 et 0,80m (mesurée au\n    niveau du trottoir). La partie supérieure de la clôture doit être constituée\n    d’un ensemble en serrurerie.\n    PLAN LOCAL D’URBANISME    137\n    LA GARENNE-COLOMBES", "    Dans le sous-secteur USP1b, la clôture doit avoir une hauteur au moins\n    égale à 1,60 m sans pouvoir dépasser 2,50 m (mesurée au niveau du\n    trottoir existant ou projeté), elle devra être composée d’un\n    soubassement maçonné ne dépassant pas 0,20 m (mesuré au niveau du\n    trottoir existant ou projeté) et d’un ensemble de serrurerie en partie\n    supérieure.\n    11.5.2   Les clôtures sur les autres limites ne doivent pas excéder une hauteur\n    totale de 2,60 m mesurée au nivea
